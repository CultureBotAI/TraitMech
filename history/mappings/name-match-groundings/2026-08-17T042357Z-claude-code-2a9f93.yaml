  summary: Repair three more wrong CURIEs from the kg-microbe name-match pass
  details: '402 asked whether the pass that produced ENVO:01001495, dioxygen dissolved in
    marine water, for generic environmental oxygen had produced others. It had. Swept the
    136 rows in mappings/node_grounding.tsv whose notes read exact name match via kg-microbe
    index on two heuristics - the ontology term markedly more specific than the node label,
    and the term sharing no content word with it - and triaged the 34 hits by hand. Three
    were wrong and all three are the same shape: a right-sounding name match onto a term from
    the wrong organism or mechanism, in a bacterial trait knowledge base. flagellar_motility
    in soil_dwelling.yaml, described as flagellum-dependent cell motility, was grounded GO:0003341
    cilium movement - bacteria have flagella, not cilia. hydrogen_peroxide_detoxification
    in aerotolerant.yaml, enzymatic removal of hydrogen peroxide, was grounded GO:0033355
    ascorbate glutathione cycle, a plant antioxidant pathway, where bacteria use catalase
    and peroxidases. plant_tissue_colonization in plant_pathogen.yaml, establishment of microbial
    growth in plant tissues, was grounded GO:0140649 symbiont-mediated cell-to-cell migration
    by invasive hypha, and invasive hyphae are fungal. Each is skos:exactMatch at confidence
    high, so each asserts the node IS that term, and none would be caught by validate-products
    or label-correspondence because those check that a CURIE''s label matches the term and
    never that the term matches the node - the gap 391 named. TWO REPLACED, ONE RETRACTED,
    and the difference is whether a replacement could be verified rather than remembered:
    GO:0071973 bacterial-type flagellum-dependent cell motility and GO:0042744 hydrogen peroxide
    catabolic process were both resolved through this repo''s own OAK adapter before being
    written, and validate-products re-checks both label pairs in CI, which it now does cleanly
    at 314 OK_CANONICAL. For plant tissue colonization nothing verified fits - GO:0044409
    is symbiont ENTRY into host rather than establishment of growth, and GO:0051701 and GO:0044403
    are the generic interaction parents - so it is retracted, following 403''s precedent with
    the ENVO term, because guessing a plausible replacement is the very act that produced
    these. The mapping rows moved in the same pass as the records, per docs/GROUNDING_POLICY.md
    and the 352 retraction: the grounder keys on label and node_type, so a row left behind
    restores exactly what was removed. Confirmed none of the three CURIEs appears in the grounder''s
    plan afterwards. Worth recording that the heuristics are triage rather than a gate - they
    flagged 34 rows to find 3, the rest being legitimate canonical forms like oxaloacetate
    to oxaloacetate(2-) and periplasm to periplasmic space. 559 tests pass, qc green.'
