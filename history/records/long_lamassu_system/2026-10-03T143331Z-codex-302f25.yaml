  summary: Add the literature-defined long Lamassu family
  details: Minted traitmech:000571 from DOI:10.1073/pnas.2519643122 after ignored-and-hidden
    whole-repository searches and a fresh METPO seed comparison found no exact primary term.
    Reserved METPO:1052500 in v448. Two paper spans and the exact Dataset S1 A58:C60 cells
    support the structural family, B4077 source-organism example and a separate computational
    long-profile locus. Actual gene_name hits are distinguished from exchangeable hit_gene_ref
    model slots. The two cited artifacts belong to the same study, not independent experiments.
    NCBITaxon:1396 was independently resolved; no species-wide possession, genome assembly,
    numerical cutoff, universal effector mechanism or automatic sibling reparenting is asserted.
    The original Millman PDF could not be retrieved and is not newly quoted. A dry-run-first
    validated writer and controlled-fixture drift/idempotence tests cover this addition.
