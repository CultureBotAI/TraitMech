  summary: Add Rugutis system trait
  details: Added traitmech:000315 Rugutis system as a DOI-backed GENOMICS TraitRecord under
    phage defense system. DOI:10.1093/nar/gkae671 names Rugutis among newly described lactococcal
    antiphage systems, DOI:10.1073/pnas.2426508122 treats Rugutis as a plasmid-encoded lactococcal
