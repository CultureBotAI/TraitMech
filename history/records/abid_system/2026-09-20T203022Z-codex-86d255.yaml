  summary: Add AbiD system trait
  details: Added traitmech:000318 AbiD system as a DOI-backed GENOMICS TraitRecord under abortive
    infection system. PMID:7646042 identifies the pBF61 determinant from Lactococcus lactis
    subsp. lactis KR5, reports an abortive phage infection phenotype with reduced sk1 and
    c2 plating or plaque size and reduced c2 burst size, and verifies that abiD is required
    for the Abi+ phenotype. Pinned DefenseFinder article, rules, and HMM registries map AbiD
    to the AbiD__AbiD one-profile model namespace. Reserved METPO:1027200 in proposals/metpo_traitmech_v195
    for the upstream replacement ID.
