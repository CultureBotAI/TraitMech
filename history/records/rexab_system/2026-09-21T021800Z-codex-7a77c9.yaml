  summary: Add RexAB system trait
  details: Added traitmech:000324 RexAB system as a DOI-backed GENOMICS TraitRecord under
    abortive infection system after an ignored-and-hidden duplicate review found no exact
    same-scope live record, METPO class, history record, or prior proposal. Parma et al. support
