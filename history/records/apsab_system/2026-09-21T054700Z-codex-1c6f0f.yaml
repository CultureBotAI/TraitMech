  summary: Add ApsAB system trait
  details: Added traitmech:000328 ApsAB system as a DOI-backed GENOMICS TraitRecord under
    the quality root. DOI:10.1038/s41467-024-48219-y names ApsAB as an anti-plasmid system,
    shows that the F3141-F3140 locus was renamed apsAB, reports that ApsAB targets high- and
    low-copy-number plasmids, and supports a nuclease/helicase plus Argonaute-like two-component
    architecture. The pinned DefenseFinder article registry maps ApsAB to the Zongo et al.
    Escherichia coli anti-plasmid-system paper. Reserved METPO:1028200 in proposals/metpo_traitmech_v205
    for the upstream replacement ID.
