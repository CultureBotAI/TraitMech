  summary: Add DS-1 system trait
  details: Minted traitmech:000424 for the DOI-backed DS-1 system under phage defense system.
    DOI:10.1126/science.adv7924 and the final Science supplementary tables support DS-1 as
    the DefensePredictor-discovered system corresponding to the two-gene D390 transcriptional
    unit that reduces bacteriophage plaquing when cloned in E. coli MG1655; the pinned DefenseFinder
    article and HMM inventories map DS-1 to the DS-1A and DS-1B custom profiles while the
    pinned rules table has no DS-1 row, so the graph stays nonmechanistic at cloned-transcriptional-unit
    level and the record keeps profile-to-component mapping, native host breadth, phage range,
    and direct molecular output unresolved. Reserved METPO:1037800 in proposals/metpo_traitmech_v301.
