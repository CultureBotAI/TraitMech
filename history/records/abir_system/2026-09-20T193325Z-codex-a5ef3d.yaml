  summary: Add AbiR system trait
  details: Added traitmech:000317 AbiR system as a DOI-backed GENOMICS TraitRecord under abortive
    infection system. PMID:10831451 identifies pKR223 from Lactococcus lactis subsp. lactis
    KR2 as encoding AbiR, demonstrates that AbiR is encoded by two separated genetic loci,
    and reports heat-sensitive early abortive-infection activity that impedes phage DNA replication.
    Pinned DefenseFinder article, rules, and HMM registries map AbiR to the AbiR__AbiRa, AbiR__AbiRb,
    and AbiR__AbiRc three-profile model namespace. Reserved METPO:1027100 in proposals/metpo_traitmech_v194
    for the upstream replacement ID.
