  summary: Restore five canonical-example citations the tranche replaced under an upgrade
    label
  details: One-shot migration (dry-run default, --apply opt-in). The protein-taxon tranche
    rewrote 32 canonical-example citations from PMID to DOI and described the change as an
    identifier upgrade; five of them (xylan_degradation, homoacetogenesis, biopolymer_degradation,
    chitinolysis, oxidative_phosphorylation) point at a different paper than the PMID they
    replaced. The script restores the pre-tranche PMID on exactly one canonical example per
    record, guarded to a single match, and records the reversal in a RESTORE_CANONICAL_CITATION
    event. The protein_examples evidence the tranche added, which cites the new DOIs as exemplar
    evidence in its own right, is untouched. A deliberate replacement remains possible in
    a new event that says so.
