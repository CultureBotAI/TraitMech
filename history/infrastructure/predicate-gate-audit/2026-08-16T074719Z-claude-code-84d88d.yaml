  summary: Re-test grounded edges against the predicate gate at read time
  details: 'mappings/predicate_grounding.tsv declares subject_types and object_types per predicate,
    and ground_causal_predicates consults them only when it FIRST grounds an edge - it returns
    early on any edge that already carries a predicate_id. So the gate was a write-time check
    with no read-time counterpart, and every retyping migration since 351 could move a grounded
    edge out of range silently. Two did. 382 retyped proton_motive_force to STATE, putting
    ph_optimum_high.yaml''s terminal_oxidases-produces-proton_motive_force outside METPO:2007800,
    and it shipped to main undetected until I ran the check by hand while fixing 392. 392
    retyped phenazine_biosynthesis to PATHWAY, putting an encodes edge outside METPO:2007813,
    caught in review by hand. Added PREDICATE_GATE_VIOLATION to audit_predicate_domains.py,
    which is already the predicate-versus-node-type audit and carries the ratchet, baseline
    and severity machinery. ERROR rather than WARN, because unlike the other two classes the
    authority here is LOCAL: the table is a rule this repo sets itself, so a violation means
    the corpus disagrees with us rather than posing a judgement call that needs baselining.
    Both ends are checked, because a retype can move either, which the 392 review had to verify
    by hand across produces, encodes, reduces, powers and transports. The wildcard is handled
    in its own small function with its own test, because comparing the asterisk as a literal
    type name is the obvious mistake and it fails in the worst direction: my first hand-run
    reported 3385 violations against a corpus that had one, and a gate that cries wolf on
    every wildcard row is one nobody runs twice. Probed before trusting: temporarily retyping
    proton_motive_force to QUALITY produced exactly one blocking ERROR naming the edge, the
    offending type and the gate, and the tree was restored. Five new tests, each making the
    gate fire or proving it silent on an in-range edge. Corpus is clean at zero, as is ENABLES_RANGE_VIOLATION
    now that 341 and 355 burned it down. 553 tests pass, qc green.'
