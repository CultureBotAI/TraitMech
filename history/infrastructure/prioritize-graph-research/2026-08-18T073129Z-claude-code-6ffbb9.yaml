- type: CREATE
  outcome: changed
  summary: 'Add a free triage step before paid deep research: rank traits by causal-graph
    weakness, exclude records that cannot carry a mechanism graph, and report whether research
    already exists. The headline it produces is that no trait awaits a first research pass
    -- the 353 records that can carry a mechanism graph all already do, and are exactly the
    353 that already have an Edison artifact, so the backlog is research already paid for
    and not yet applied.'
  details: |-
    Adds scripts/prioritize_graph_research.py, `just prioritize-research`, the
    .claude/skills/prioritize-graph-research skill, and 20 tests. Nothing under
    data/ changes; this is a triage aid and deliberately NOT in `qc`, because it
    has no failing state.

    WHAT IT MEASURED, which is not what the request assumed. The ask was to
    prioritise a trait with a weak causal graph for deep research. Measuring
    first showed there is no trait awaiting a FIRST research pass: the 353
    records that can carry a mechanism graph all already do, and they are
    EXACTLY the 353 that already have an Edison/falcon artifact. The two sets
    are identical. So the honest output of this tool is usually "apply the
    research you already paid for" -- reports/graph_enrichment_backlog.md holds
    351 traits with named missing modules and DOI-backed candidate edges -- and
    the script says so on its last line rather than leaving the reader to infer
    a research need from a ranking.

    THE EXCLUSIONS ARE THE PART THAT IS EITHER RIGHT OR WRONG. 124 of 477
    records have no causal graph, so a naive "no graph = weakest graph" ranking
    puts all of them first, and not one is researchable: 94 are METPO
    OBJECT_PROPERTY records seeded into data/traits (`uses_for_growth`,
    `degrades`, `has_phenotype`, `exports` -- relations, not traits), 7 are
    DATATYPE_PROPERTY, 20 are DEPRECATED observation classes, 3 are
    upper-ontology classes. There is no mechanism to research in "does not
    assimilate".

    The first implementation decided this with a hand-written list of slug
    prefixes and matched 47 of the 94, silently ranking the other 47 as research
    candidates. `term_kind` was a declared field in every record the whole time.
    Rewritten to use it, plus mapping_status DEPRECATED and the `upper`
    category. This is the third time in two days that a hand-enumerated list of
    names missed cases a structural signal would have caught (see the
    oxygen-senses tranche and the #410 knowledge gaps), and the test that pins
    it runs against the real corpus deliberately -- a fixture would have passed
    for the broken version too.

    `upper` is excluded by CATEGORY rather than by emptiness because five of its
    eight records DO have graphs, and three are thin enough to rank near the top
    (`material_entity` and `quality` at 3 edges, `phenotype` at 4). A thin graph
    on `quality` is not a research question.

    Binned families (ph_delta_*, temperature_range_*, nacl_*, cell_length_*)
    collapse to one row carrying the family's worst score, since one research
    pass answers the whole family. 44 sibling bins collapse today.

    A HIGH SCORE IS NOT A GOOD RESEARCH TARGET, and finding that out changed the
    recommendation. metabolism/biopolymer_degradation scores 28 on six
    components -- but reading its EDGES shows it names endoglucanase,
    endochitinase and lignin_oxidative_enzymes without connecting any of them to
    the trait or to assimilable_units. Nothing in the literature is missing; the
    edges are. ecology/nitrogen_fixing_symbiosis scores 22 with ONE component,
    no orphans, and the highest missing-module count in the corpus (11): the
    graph is sound and the content is absent. So the lower-scoring trait is the
    better research target, and `--sort missing` exists for exactly that
    question while the default sort answers "which graph is worst", which
    usually resolves to curation. Both cases are pinned by a test so the skill's
    worked example cannot drift.

    VALIDATED BY. 20 tests including two corpus-wide ones (no OBJECT_PROPERTY
    leaks into the ranking; no ranked candidate is unresearched -- the second is
    designed so that its FAILURE is the useful signal, meaning a genuinely
    unresearched trait has appeared). `just lint`, `just test`, full `just qc`
    green, and `audit-qc-paths` still covers every directory the chain reads.

    NOT DONE. No deep research was run. Edison returned 402 Payment Required on
    2026-08-17 -- the key authenticates, the account has no credit -- so a
    canary would prove nothing about a batch, and the skill records that. The
    OpenScientist provider the maintainer raised is out of scope here and was
    explicitly deferred.
