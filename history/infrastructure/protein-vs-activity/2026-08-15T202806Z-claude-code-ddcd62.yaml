  summary: Split protein from activity where one node_id meant both
  details: 'Second 356 burn-down tranche: the six families carrying both GENE_OR_PROTEIN and
    MOLECULAR_FUNCTION. 352 already settled the rule, a protein is not its activity, which
    is why catalase and urease lost their GO ACTIVITY groundings. The descriptions decided
    each case and were unusually clean: in five of six the GENE_OR_PROTEIN occurrences describe
    the ENZYME (Enzyme that degrades hydrogen peroxide, Antiporter that expels sodium ions)
    and the lone MOLECULAR_FUNCTION occurrence describes the ACTIVITY (Enzyme activity that
    detoxifies hydrogen peroxide, Desaturase activity introducing double bonds). So five were
    NOT a typing mistake at all - the id meant two things, and the fix 366''s own docstring
    names is two ids rather than one type; retyping either way would have erased a distinction
    the curator drew correctly. Renamed the activity occurrence in each: catalase to catalase_activity
    and superoxide_dismutase to superoxide_dismutase_activity (both in obligately_aerobic.yaml),
    na_h_antiporter to na_h_antiport_activity, cation_proton_antiporter to cation_proton_antiporter_activity,
    fatty_acid_desaturase to fatty_acid_desaturase_activity. The sixth, plasmid_methylase,
    is the genuine retype: both occurrences describe the enzyme and neither names an activity,
    so MOLECULAR_FUNCTION to GENE_OR_PROTEIN. Naming followed the corpus rather than inventing
    - _activity is used by 25 existing ids against 8 for _function, and four of the five targets
    already existed corpus-wide as MOLECULAR_FUNCTION nodes so the renames join an established
    concept; none collided with a node already in its own graph, checked before applying.
    superoxide_dismutase_activity is the one new id, and its node already carried GO:0004784
    which IS superoxide dismutase activity, so the grounding had been describing a molecular
    function all along and only the id disagreed. INCONSISTENT_NODE_TYPE 223 to 199. Three
    findings appeared new and are not: catalase, superoxide_dismutase and na_h_antiporter
    were already baselined UNREACHABLE_FROM_TRAIT in those graphs and the rename changed the
    baseline key, since _key discriminates by node_id. Verified by grepping the old keys out
    of the previous baseline, and the total is unchanged at 1296 either side. 540 tests pass,
    qc green.'
