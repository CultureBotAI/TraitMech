  summary: Resolve the qc chain transitively, so a recipe with deps and a body is followed
  details: '289 was deferred from the fifth review pass of 285. The not invoked guard catches
    a PURE dependency-only recipe because its body is empty, but a recipe with dependencies
    AND a script body makes invoked non-empty, takes the normal path, and its dependencies
    were never followed - no silent entry, no BlindGate, just partial coverage that reads
    as full. That shape already exists in this justfile: gen-qc-dashboard and knowledge-gap-scan
    both carry a dependency and a body, neither in the qc chain today. Added recipe_deps,
    which reads the header tail because just puts parameters before the colon and dependencies
    after it, and takes the name from a parameterised dependency of the form (dep arg) while
    dropping the argument since an argument is a value rather than a recipe. qc_chain now
    walks transitively from qc with a cycle guard, because just permits a dependency graph
    rather than a tree and a cycle would hang the gate rather than fail it. NO-OP ON THE CURRENT
    TREE, exactly as the issue predicted - the chain still resolves to the same fifteen recipes
    and the inferred read-set is unchanged, because no chain member declares a dependency.
    That is precisely why it needed tests that make the new path fire rather than a green
    run: five of them, covering the deps-and-body shape the issue names, the cycle guard,
    the parameterised dependency form, that parameters before the colon are not mistaken for
    dependencies, and that an absent qc still yields an empty chain so audit raises BlindGate
    rather than silently inspecting nothing. 564 tests pass, qc green.'
