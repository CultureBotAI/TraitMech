- type: CREATE
  outcome: changed
  summary: 'Port DisMech''s MONDO priority dashboard to TraitMech: weighted YAML-tunable scoring
    resolving to a recommended action per record, plus a static dashboard. DisMech''s subtype-series
    lumping rule is deliberately inverted, because measured sibling node-label overlap across
    TraitMech''s binned families is 5 percent, so the bins carry distinct mechanism content
    and lumping them would discard real curation.'
  details: |-
    Analysis of monarch-initiative/dismech and its priority dashboard, then an
    implementation for TraitMech: conf/trait_priority.yaml,
    scripts/trait_priority.py, `just trait-priority`, `just
    gen-priority-dashboard` -> app/dashboard/priority.{html,json}. Nothing under
    data/ changes.

    WHAT WAS TAKEN FROM DISMECH. The design, from
    src/dismech/compare/mondo_priority.py, src/dismech/priority_dashboard.py and
    conf/mondo_prioritizer.yaml: weighted scoring whose every component is
    inspectable and retunable in YAML rather than a hard-coded ranking; an
    ACTION ladder where the first matching rule wins, so the output is a decision
    and not a number; a static dashboard generated from the same scoring code as
    the CLI so page and terminal cannot disagree; and their sidecar principle,
    which their own doc justifies bluntly -- "a dropped row has no trace in the
    file" -- so every exclusion here is counted in the payload and printed.

    THE LUMPING AND SPLITTING RULES, which is what the maintainer asked to focus
    on. DisMech has three specificity heuristics: _extract_family_stem (a named
    `stem` regex group turning "X, type II" into a series member),
    _grouping_term (labels matching susceptibility / predisposition / ^obsolete),
    and _likely_over_specific_leaf (no children AND >= 7 words AND >= 2
    conjunctions). They carry hard penalties -- subtype_series_penalty -18,
    grouping_term_penalty -28, over_specific_leaf_penalty -10 -- and resolve to
    LUMP_INTO_PARENT or DROP_GROUPING_TERM.

    ONE RULE IS DELIBERATELY INVERTED, and measuring before porting is what
    caught it. TraitMech's binned families -- temperature_range_{low,mid1..4,
    high,very_low}, ph_delta_*, nacl_*, cell_length_* -- have exactly the shape
    DisMech penalises, and a straight port would have told a curator to lump all
    ten families into their parents. Measured on the live corpus first: child
    edges byte-identical to a parent edge, 18 of 3256 (0%); mean node-label
    Jaccard between sibling bins, 5% with a maximum of 20%; child versus parent,
    about 8%. The bins are NOT redundant -- they are numerically distinct
    phenotype bins carrying distinct mechanism content, where MONDO
    over-splitting proliferates terms WITHOUT distinct content. So series
    membership is reported as information, and LUMP_INTO_PARENT fires only above
    a configured measured-overlap threshold of 0.60. Ten series, mean overlap
    0.066, nothing lumps -- the correct outcome, and a test asserts both halves
    so that "fixing" it back fails loudly.

    I reached that conclusion the hard way. My first inference was that the bins
    duplicate their parent's mechanism, from edge COUNTS being similar (parent
    "temperature range" 12 edges, its children 8-11). Checking edge identity gave
    0% and label overlap 5%, so the inference was wrong twice over. It is
    recorded here because the same wrong inference is what the collapsing
    behaviour in #427 rests on -- filed as #447, since that tool silently merges
    44 records on the stated rationale that "one research pass answers the whole
    family", which 5% contradicts.

    THREE RUNGS NEVER FIRE, verified rather than assumed: BUILD_CAUSAL_GRAPH (no
    mechanism record has zero edges), CURATE_ROOT_WITH_SUBTYPES (9 records have
    >= 4 children and a thin graph, and all 9 are predicates or upper-ontology
    classes, so an earlier DROP claims them), DROP_GROUPING_TERM (46 labels match
    and all 46 are already dropped). Kept, because each becomes reachable the
    moment the corpus changes, and the counts print so an unreachable rule cannot
    masquerade as a passing check.

    The dashboard writes to app/ and NOT pages/, because pages/ must byte-match
    render_trait_pages.py output and audit-derived-reports enforces that -- a
    second generator writing there reads as staleness. app/ is where TraitMech
    already keeps app/discussions/, and where DisMech keeps its dashboard.

    QUEUE TODAY over 477 records: DEEPEN_CAUSAL_GRAPH 145,
    ADD_CANONICAL_EXAMPLES 122, CURATE_ROOT 72, DROP_NON_MECHANISM 109,
    DROP_DEPRECATED 20, ALREADY_DEEP 9.

    VALIDATED BY. 647 tests (26 new), just lint, full just qc green, and
    audit-qc-paths still covering every directory the chain reads.

    NOT DONE. No record content changed; this builds the queue rather than working
    it. DisMech's _likely_over_specific_leaf was not ported -- TraitMech labels
    are short and conjunction-free, so the heuristic would never fire and an
    inert rule imported without a reason to exist is worse than its absence.
