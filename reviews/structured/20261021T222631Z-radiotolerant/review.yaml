limitations:
- Biolink edge 6 relates a material manganese ion to a process while its wording invokes
  antioxidant activity. This remains an explicit material-versus-activity interpretation
  qualification under the broad maintained relation, not an additional formal finding.
- Detailed pathogen radiation resistance, ROS-defense, fitness, methods and intervention
  efficacy remain UNASSESSED_SCOPE; incidental source content is not adopted.
- Generic active METPO radiation tolerance and current extreme-dose wording need exact-scope
  qualification; no automatic replacement is proposed.
- The current Most superlative is not independently established as a present global
  ranking; positive historical classification and >15 kGy magnitude are retained.
- PLOS and Spectrum primary bodies were not inspected; Sustainability publisher429
  and zero-hit metadata do not prove absence or falsehood. Crossref identity is positive.
- CSH and canonical HTML requests are current; Genes JATS and CSH/Genes metadata retain
  their original acquisition times separately from current copies.
- The protein snippet search covers complete retained HTML but is not a full biological
  article reading. No current sequence/function fields were requested from UniProt.
- Recorded UniProt entry version 161 dated 2026-08-25 and current version 162 are
  separate observations; sequence version 2 remains equal. No historical raw version-161
  response or annotation-update date is invented.
- Local provenance search cannot rule out private or off-repository acceptance.
- Actual prior QC, qualification and local initialization do not assert B11 remote
  publication.
notes:
- Final root and independent challenge are pinned; builder and helper were not imported
  or executed during preparation.
- 'Coverage: six works, eighteen external placements, eleven grounding fields, eleven
  nodes/eleven edges, three snippets, two canonicals, one protein instance and seven
  AI events.'
- No scientific record, native inventory, Git or sweep-state mutation by serializer
  preparation.
