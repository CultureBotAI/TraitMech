limitations:
- The scientific assessment covers identity, conceptual hierarchy, citation text,
  strain attribution and broad definition-source scope. It does not validate or reconstruct
  pathogen fitness mechanisms, genetic contributions, culture conditions or optimization.
- The primary study was inspected selectively at indexed-abstract level for exact
  quotations, strain identity and broad phenotype wording; no fulltext or experimental-method
  inference was used.
- Both quotations are exact. The source’s suggest qualification is preserved; documentary
  attribution is not a biological mechanism verdict.
- The optimum-growth wording is narrower than the ontology definition’s unqualified
  growth wording. This supports a bounded attribution finding, not categorical rejection
  of the phenotype or organism classification.
- The parent assertion is present upstream in the pinned METPO snapshot. No native
  schema or OWL reasoner failure is claimed, and no local import transcription error
  is alleged.
- The dedicated writer checks the existing parent rather than assigning it. A corrected
  parent would fail that precondition until coordinated; no writer dry run or mutation
  was performed.
- SEEDED does not claim human acceptance. Missing graph/protein fields and absence
  of a matching expression dataset are not scientific defects.
- Catalog and common validation reuse retain original times/hashes and declared scope;
  they are not newly executed external release checks.
- No provider research, paid call, scientific record edit, status promotion, history
  change or generated-page mutation was performed.
