findings:
- finding_id: co2-oxygen-parent
  issue_key: capnophilic-co2-oxygen-parent
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: The carbon-dioxide phenotype inherits an oxygen-preference parent
  description: The child definition concerns elevated carbon dioxide, while parent
    METPO1000601 explicitly denotes oxygen requirements/tolerance. The same subclass
    assertion exists in pinned upstream METPO, so the record faithfully imports an
    upstream conceptual problem. Co-occurrence of low-oxygen and high-carbon-dioxide
    preferences in one study strain does not establish class subsumption. The dedicated
    enrichment guard also requires this parent and misnames it environmental phenotype;
    it would reject a changed parent, not silently reassign it.
  target_ids:
  - METPO:1005021
