limitations:
- The Bäckhed and mucin reviews were assessed through indexed abstracts. Full-paper-wide
  verification is not claimed.
- 'The detailed mucus-layer statement remains unverified: XML failed and PMC HTML
  was a challenge. Publisher abstract access and search-surfaced passages do not substitute
  for inspected full text.'
- The nine citation identities were verified separately from the zero-snippet native
  verifier. Exit0 of that verifier is not evidence-note validation.
- The captured METPO release does not contain the class/predicate placeholders. Their
  local proposal status is documented; current upstream acceptance is not inferred.
- A broad species example does not establish every strain’s lifestyle or validate
  unrelated graph claims.
- Ontology assessment is semantic; no formal inconsistency result or local validator
  failure is claimed.
- Only conceptual scope, source fidelity, ontology and provenance are assessed. No
  host-colonization mechanism is reconstructed, expanded or operationalized.
- Common corpus checks retain their actual earlier timestamps at the unchanged scientific
  base, including baseline findings, superseded failures and product-adapter skips.
- This review does not provide human scientific sign-off or promote native status.
notes:
- Native capture preceded assessment. The expanded capture adds the historical trait-edge
  migration and provider provenance header while preserving all27 original input hashes.
- Independent source and ontology inspections informed this manual whole-record assessment;
  their summaries are not substituted for inspected source text.
- Only the immutable review bundle is written. No scientific record, writer, mapping,
  proposal, history or generated page is edited.
