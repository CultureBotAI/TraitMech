evidence:
- evidence_id: source-0
  kind: primary_source
  reference: DOI:10.1371/journal.pbio.0060287
  locator: Scientific abstract; PLOS PDF page 1, visually checked
  accessed_at: '2026-10-13T08:25:40.593247Z'
  support: supports
  snapshot_sha256: 679a0dec436923739acfd1749e64b9df141185e72f7afad408f6d4f011642d9a
  summary: 'Ostrowski et al. 2008, PMID:19067487; scientific abstract, publisher PDF
    page 1, contiguous span visually checked. Mixtures with AX4-GFP and natural-isolate
    dye controls support partial sorting during aggregation, not complete clonal exclusion.
    The measured endpoint is variation in fluorescent spore proportions among fruiting
    bodies; genetic distance uses 12 microsatellite loci, not genome-wide identity.
    Main text and all four figures were inspected; Figure 1 is hypothetical. Supplementary
    Tables S1 and S2 were read by text extraction. Main Methods names QS45, absent
    from the retrieved S1 strain table; no strain alias is inferred. Kin-selected
    benefit is an interpretation, not a measured fitness endpoint here. Natural provenance
    of every laboratory derivative and a molecular recognition mechanism remain unresolved.
    Native abstract verifier: VERIFIED.'
- evidence_id: source-1
  kind: primary_source
  reference: DOI:10.1073/pnas.1512671112
  locator: Scientific abstract; EXT_ID:26438858 AND SRC:MED
  accessed_at: '2026-10-13T08:35:55.400546Z'
  support: supports
  snapshot_sha256: d3240849093539c12b791b6acfd8fbf03b1f2d13f56aad46200cc714690b0832
  summary: 'Stefanic et al. 2015, PMID:26438858, PMC4653157; directly retrieved scientific
    abstract from Europe PMC with the namespace-qualified query EXT_ID:26438858 AND
    SRC:MED. Title, PMID and DOI were checked together. The authors define a conspecific
    scope and report relatedness-associated swarm merging versus boundary formation
    among sympatric Bacillus subtilis isolates. The separately reported root-colonization
    outcome is not a direct killing measurement. Full text, figures and supplements
    were inaccessible and are not claimed as inspected; indexed search passages were
    not used as excerpts or quantitative evidence. Native abstract verifier: VERIFIED.
    Linked PMID:26512099 is commentary, not a correction or experimental replication.'
- evidence_id: source-2
  kind: primary_source
  reference: DOI:10.1128/mBio.00723-17
  locator: Scientific abstract, not IMPORTANCE; PMC5573675.1 PDF page 1, visually
    checked
  accessed_at: '2026-10-13T08:25:43.849685Z'
  support: supports
  snapshot_sha256: 340c599e88bd2162637ebe5744c8b882d49ff1ba234fefa26255872517621ff1
  summary: 'Lyons and Kolter 2017, PMID:28679746, PMC5573675; scientific abstract,
    NLM version 1 PDF page 1 and JATS article-meta abstract without abstract-type.
    This is not the separate IMPORTANCE summary. Introduction distinguishes preferential
    kin association from nonkin exclusion and supports the definition''s two modes;
    the paper''s own experiments support the nearby-species extension. The comparison
    concerns interactions with B. subtilis NCIB3610: nearby species can be antagonized,
    while more distant lineages show varied outcomes. This is not a universal monotonic
    relation between distance and antagonism. Relatedness uses type-strain 16S, not
    whole-genome identity of every isolate. Swarm, biofilm and halo assays differ
    in medium and endpoint. Figure 2A and 2C assign WNC032 to different species; Data
    Set S1 identifies it as B. megaterium. No silent panel correction or taxon anchor
    is inferred. Actual Figures 2 and 4 and selected spreadsheet rows/totals were
    inspected, not all figures or raw assays. Native abstract verifier: VERIFIED.
    Shares an investigator with 2015; not an independent-laboratory replication.'
