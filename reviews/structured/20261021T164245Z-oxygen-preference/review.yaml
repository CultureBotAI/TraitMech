limitations:
- Detailed biological claims in edges 5–10 remain UNASSESSED_SCOPE, including pathogen-linked
  respiration, fitness, oxygen/hypoxia response and oxidative defense. No mechanism,
  intervention, growth condition or experimental optimization is reconstructed.
- GO molecular-function activity grounds are permitted enzyme facets under local policy;
  no automatic protein-type error or mandatory UniProt instance follows. Edge 10 subject
  wording is qualified, while its non-process trait object remains the firm external
  semantic issue.
- Edge 5 explicitly invokes obligate context within a broad aerobic class. No universal
  obligacy, class-identity error or separate major is inferred from this contextual
  NONMECHANISTIC edge.
- The nearest canonical primary source supports switching context and partially anaerobic
  metabolism; the separately assigned CMI abstract supports E. coli facultative classification.
  Every ancillary route, exact strain and assay endpoint has not been established.
- Five snippets match after ordinary whitespace normalization, one has O2/subscript
  and colon-spacing normalization, and one is a meaningful marked title abridgment.
  No unknown quotation or false biological meaning is asserted.
- Selected primary JATS windows and declared abstract/excerpt windows were read, not
  whole-paper mechanisms. The classification source is a genomic analysis with genome-completeness
  qualifications, not a direct growth assay. Returned publication-status fields are
  bounded metadata observations.
- The PubMed browser interstitial is not article-body evidence. Indexed chapter text
  supplies the separate positive excerpt. Initial native snippet DNS failure remains
  distinct from successful retry and manual source comparison.
- The oxygen-sense history addendum follows the frozen 27-artifact grounding ledger
  and is bound separately. It identifies a template word error while preserving the
  correct current node and all original evidence bytes.
- Catalog coverage comprises five E. coli species-level candidates from the retained
  complete 20-organism/28-dataset response, originally acquired 07:36:12 UTC. Exact
  strain applicability and downstream gene/module/condition queries were not assessed.
- Human-acceptance absence is bounded to the own repository with ignored files included
  and .git/.venv excluded. Historical AI ownership, ontology authorship and REVIEWED
  status do not themselves establish acceptance; remote/private decisions remain unknown.
- Qualified common checks, B4 protein/taxon diagnostic and B8 QC retain original bases,
  times, failures, retries, baselines and adapter skips. They are reused results under
  byte-equality proof, not new B9 corpus executions.
