findings:
- finding_id: external-regulation-roles
  issue_key: oxygen-preference-external-regulation-roles
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Processual positive regulation ends at a phenotype
  description: Edges 8 and 10 use RO:0002213 with oxygen_preference_trait as object.
    The relation inherits process domain and range from RO:0002211 and describes increasing
    the rate or magnitude of process execution; a phenotype class is not that process.
    Edge 8 has a valid expression-process subject. Edge 10 names an enzyme and mentions
    its activity, so the subject facet is qualified; its permitted GO activity grounding
    does not cure the firm non-process trait object. The native wildcard mapping and
    YAML passes do not establish imported semantics. This grouped finding does not
    assert a reasoner failure, false biological efficacy or a repaired defense mechanism.
  target_ids:
  - METPO:1000601
