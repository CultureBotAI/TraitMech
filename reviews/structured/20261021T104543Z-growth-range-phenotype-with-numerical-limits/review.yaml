  summary: General environmental homeostasis and osmotic relationships have contextual
    support. Edge 9 presents the lower turgor limit with greater certainty than its
    source. Edge 4 already names neutralophiles in its evidence note and remains a
    scope limitation only. Qualitative links on edges 6 and 11 do not become measured
