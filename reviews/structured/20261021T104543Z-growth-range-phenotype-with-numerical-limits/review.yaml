  details: 'causal_graphs[0].edges[0]: CONTEXTUAL_SUPPORT_QUOTATION_UNVERIFIED; Numerical
    salinity context supports a measured environmental axis. Exact quoted phrase and
    formal definition unverified in inspected windows; ontology authority separate.

    causal_graphs[0].edges[1]: CONTEXTUAL_SUPPORT_QUOTATION_UNVERIFIED; Salinity is
    a growth-relevant axis. Formal NaCl-range subclass placement is an ontology question;
    physiological paper is contextual. Exact quotation unverified.

    causal_graphs[0].edges[2]: CONTEXTUAL_SUPPORT_EXACT_SHORT_QUOTE; External-pH growth
    context and quotation supported. Class hierarchy authority remains pinned ontology.

    causal_graphs[0].edges[3]: CONTEXTUAL_SUPPORT_EXACT_QUOTE; Thermal adaptation/growth
    context and quotation supported. Does not by itself prove a formal ontology superclass
    assertion.

    causal_graphs[0].edges[4]: CONTEXTUAL_SUPPORT_SCOPE_QUALIFIER; Internal7.0–7.5
    is described for many cell types; external5–8 statement is for neutralophilic
    PMF. Record evidence note already says neutralophiles. Contextual graph permits
    this illustrative branch; retaining that context in edge/node wording would improve
    precision. No universal counterexample or automatic major finding inferred.

    causal_graphs[0].edges[5]: GENERIC_CONTEXTUAL_SUPPORT; Existing general antiporter/acidification
    relationship is stated in the source paragraph with elevated-internal-pH context.
    No organism engineering or pathogen-specific survival assessment performed.

    causal_graphs[0].edges[6]: QUALITATIVE_CONTEXTUAL_INFERENCE; Generic pH homeostasis
    supports the qualitative alkaline-growth-window connection; a numeric shift in
    the upper bound is not directly measured in the inspected passage. Do not read
    NONMECHANISTIC context as a universal quantitative assay claim.

    causal_graphs[0].edges[7]: GENERIC_CONTEXT_SUPPORTED_SPECIALIZED_BIOLOGY_UNASSESSED;
    Generic homeostasis sentence supports prevention of excessive acidification, with
    different bacterial physiological contexts. Pathogen-specific respiratory or acid-survival
    routes remain UNASSESSED_SCOPE; no detailed biological reconstruction or repair.

    causal_graphs[0].edges[8]: UNASSESSED_SCOPE; Detailed acid-survival/decarboxylation
    mechanism and exact per-reaction claim not validated in this audit. No false-support
    or false-absence conclusion. This limit is distinct from ontology-role assessment.

    causal_graphs[0].edges[9]: POSITIVE_MAIN_RELATION_WITH_CERTAINTY_CONCERN; Hypertonicity
    causing shrinkage and lower turgor is directly supported. Body p19 says the lower
    turgor limit before growth cessation is poorly known; the record note instead
    gives a settled ordering/limit. The implication of a settled upper salinity boundary
    overstates the inspected source. Recommend bounded minor certainty wording finding,
    not rejection of the main physical relationship.

    causal_graphs[0].edges[10]: CONTEXTUAL_SUPPORT_ORGANISM_LIMIT; Compatible-solute
    accumulation and counteraction of hypertonic stress are supported. The detailed
    OpuA example is explicitly L.lactis; contextual illustration is reasonable, not
    a universal requirement.

    causal_graphs[0].edges[11]: QUALITATIVE_CONTEXTUAL_INFERENCE; Compatible-solute
    response supports osmotic adaptation qualitatively. Exact broadening of a measured
    NaCl interval is not quantified in the inspected passage. No automatic missing-assay
    or universality defect assigned.'
