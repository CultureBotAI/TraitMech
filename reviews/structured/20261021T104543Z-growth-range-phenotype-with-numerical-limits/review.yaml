    automatic retype.

    causal_graphs[0].nodes[8]: Label and description denote proton-pumping activity;
    MOLECULAR_FUNCTION is a valid native facet. It does not supply a material subject
    for RO2327.

    causal_graphs[0].nodes[9]: Prevention process is explicitly described as BIOLOGICAL_PROCESS.

    causal_graphs[0].nodes[10]: Despite system in the label, the description explicitly
    denotes coupled activity. MOLECULAR_FUNCTION is coherent; do not force a protein
    or pathway based only on label.

    causal_graphs[0].nodes[11]: Rise in external salinity is an environmental change/exposure.
    No blanket rule excludes a changing environmental condition from this native type.

    causal_graphs[0].nodes[12]: Combined lowered cell volume/turgor can denote the
    resulting cellular condition; no separate forced type defect inferred from shrinkage
    wording alone.

    causal_graphs[0].nodes[13]: Transporter-mediated uptake is an activity facet,
    correctly MOLECULAR_FUNCTION; the named transporter does not turn the activity
    into the material protein itself.

    causal_graphs[0].nodes[14]: Accumulation is explicitly modeled as a biological
    process. Its relation to a trait must still obey the asserted predicate meaning.'
