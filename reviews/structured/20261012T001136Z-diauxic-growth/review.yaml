limitations:
- Author self-review, not independent review or human scientific signoff. Scope is
  one record, not all hashed inputs.
- Evidence accessed_at denotes reinspection, not necessarily a new download; source
  hashes and section locators are retained.
- George 1985 is abstract-only. Other sources have relevant sections/figures inspected,
  not complete raw-data reanalysis. Boulineau supplement equations were not visually
  verified or used.
- The Zampar Introduction snippet remains NOT_IN_ABSTRACT, not relabeled VERIFIED
  by manual full-text matching.
- Diauxie has narrower lag-emphasizing operational usages; the declared sequential-use
  interpretation is explicit, not a claim that all literature uses identical criteria.
- Canonical strain provenance, resolved taxon/protein branches and upstream acceptance
  remain open; gene or expression annotations alone are not observed phenotype.
- Bounded ignored/hidden searches omit symlink-directory contents, compressed archives
  and unregistered/private work. Discovery remains active.
- Configured embedding inputs absent; artifacts retained, not regenerated. Required
  ROBOT directive tabs are allowed only in the exact width-checked template.
