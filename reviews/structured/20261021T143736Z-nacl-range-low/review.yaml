  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Imported RO relations do not preserve the declared endpoint roles
  description: 'Edge 5 assigns process-to-process RO:0002212 to a material chemical
    and protein/complex. Edge 6 assigns executor RO:0002327 to an explicitly declared
    uptake process; its inherited material subject requirement is not satisfied by
    a prerequisite process. These two firm cases anchor the grouped finding. Edge
    3 adds a qualified subcase: the current node and guarded writer deliberately denote
    external hypertonicity, whereas RO:0002213 regulates process execution. An osmotic-upshift
    event could have another referent, so no blanket ENVIRONMENTAL_FACTOR exclusion
    is asserted. Supported generic sources and native shape passes do not cure these
    external semantic roles. Detailed pathogen-linked edge 6 biology remains UNASSESSED_SCOPE;
    no corrected pathway, actor or intervention is proposed.'
