limitations:
- Full just test was NOT_RUN under the selected review-only diagnostic scope; only
  the five focused Stage2 tests are recorded. Products retains 123 no-adapter skips.
  Common checks establish bounded software/data integrity, not scientific support.
- Detailed heat defense, survival/fitness, cultivation optimization, deletion/gene
  regulation, molecular enhancement and intervention efficacy remain UNASSESSED_SCOPE.
- Only selected generic physical/classification, source identity and existing literal
  material were adopted. Retained XML availability and complete machine taxon-token
  search do not imply whole-article scientific reading.
- Tolner/Vieille full bodies were not acquired successfully in this audit; generic
  abstract support does not establish the exact approximately >40 threshold or complete
  causal sufficiency.
- Original metadata notice fields are retained at their actual acquisition time, not
  relabeled as current status refresh. Baes/Grünberger Preprint in links are preprint
  linkage, not retraction notices.
- Canonical P. furiosus quantitative/deletion note remains unassessed; S. acidocaldarius
  title/classification positive; S. islandicus citation mismatch is source attribution
  only.
- Boundary inclusivity and exact Thermophile alias equivalence are separately qualified
  by the formal/ontology audit; no source finding inferred solely from absence in
  selected abstract.
- No definite imported-role major is established while node4 has mixed process/result
  wording; RO2212 constraints themselves are verified.
- GO0160097 is molecular_function, not BP, and functional protein shorthand is permitted
  locally.
- Raw numeric restriction uses generic has-value and does not establish endpoint-versus-breadth
  semantics or a universal growth curve.
- Three taxon identities do not establish canonical numerical, deletion, regulatory
  or cultivation claims. Source findings remain separate.
- Detailed thermal response, fitness, survival, proteostasis regulation and intervention
  efficacy are UNASSESSED_SCOPE.
- Whole-history coverage is3current+18qualified prior with original clocks; all21
  current projections alone are not whole-body reads.
- Catalog runner absence is bounded, retained catalog access historical, and covered
  species do not establish strain/module evidence.
- Uncaptured script leads are matching-line only; private and remote human acceptance
  unknown.
- Root read all21 current history projections and3whole histories;18 other whole-file
  readings remain exact qualified prior readings.
- Current taxonomy identity is positive for all3species; 43080 uses exact retained
  original official bytes acquired00:40:16, not a fresh request.
- Fresh bounded expression runner discovery is unavailable; retained catalog has20organisms28datasets
  with S.acidocaldarius/modulome species coverage. E.coli/P.putida are historical
  contrast context only; no module query, strain evidence or efficacy inferred.
- Ignored and hidden files were searched with .git/.venv exclusions. Three uncaptured
  script leads are matching-line context only, not demonstrated current owners.
