limitations:
- Author self-review, not independent review or human signoff; scientific scope is
  one record, not all hashed inputs.
- Snapshot accessed_at denotes reinspection, not a new download. Directly acquired
  source hashes and precise locators are retained.
- Native resolver remains NOT_IN_ABSTRACT for Background and UNRESOLVED for two abstract-less
  letters despite direct full-text matches.
- No raw movies/data reanalysis. Hydraulic force is an interpretation; source discrepancies
  are retained, not silently reconciled.
- Neither experimental strain is an unqualified natural canonical example. No universal
  protein mechanism, taxon anchor or external equivalence inferred.
- The new qualified term is a proposal, not a literature-wide naming consensus or
  accepted upstream replacement; three discussions remain OPEN.
- Bounded ignored/hidden searches do not cover all private/unregistered work, symlink-directory
  contents or compressed archives. Discovery remains active.
- Embedding inputs are unavailable, so artifacts were retained. Temporary command
  failures (ambiguous history option, wrong expected parent in an RDF helper) were
  corrected before successful native checks; neither changed curated content.
- ROBOT template trailing directive tabs trigger ordinary whitespace checking; exact
  template-only scoped check and header verification passed.
