limitations:
- The active identity and numerical restriction are positive, but no direct imported
  textual definition or generic physiology-to-exact-bin calibration is invented. Baker
  body availability and the assigned PMF phrase remain unknown within retained access/search
  bounds, not globally absent or false.
- Edge 2 admits a perturbation-event reading as well as a condition reading, and its
  object may mean active balancing or steady magnitudes. It is not a confirmed finding
  field. Edge 3 describes PMF while its object denotes generation; no hard material-only
  Biolink product range is asserted.
- Detailed pathogen acid-defense, fitness, intervention and optimization biology,
  especially edges 4 and 6, and surrounding AMR material remain UNASSESSED_SCOPE.
  Literal quotation and formal-role checks do not certify or improve these mechanisms.
- Canonical pH 5.5–9.0 and derived breadth 3.5 belong to FT89T; optimum 6.0–7.0 is
  distinct. Taxonomy agrees without transferring every contextual branch to the strain
  or species.
- The buffering article carries a returned Preprint-in relationship, not a retraction.
  Notice fields are bounded to the actual returned records. Only one generic passive-buffering
  sentence was adopted from its full downloaded JATS.
- Retained Krulwich acquisition at 07:57:33 UTC, current copy at 17:41:27, fresh metadata
  at 17:39:52–17:39:53, new buffering acquisition at 17:41:53–17:41:55 and subsequent
  readings remain separate. The ATPase abbreviation-split qualification preserves
  the actual non-respiratory-neutralophile scope without a new finding.
- Seven components, two reviewed label-only classes and zero instances are permitted.
  Corrective history already addresses the earlier component-count wording; no extra
  connector, accession, dataset or experiment is required.
- The frozen grounding ledger originally grouped an expressly qualified edge 2 concern
  with firm edge 5. Final adjudication deliberately limits confirmed fields to edge
  5; the mapping-row supplement separately corrects precise locators without overwriting
  the original manifest.
- Nineteen actor/target projections were checked, but only seven substantive histories
  were fully read by the grounding auditor. Root and challenger read the corrective
  target history and selected owner windows. The ignored-inclusive search excludes
  .git and .venv and cannot settle remote/private acceptance.
- Catalog and bounded runner searches preserve original times and roots. No canonical
  match is an applicability result, not negative biology or global data absence. No
  substitute organism or downstream stress query was used.
- All 79 inputs, thirty source artifacts, twenty-five grounding artifacts, the separate
  mapping supplement, thirty-nine root bindings and thirty-eight challenge bindings
  are checked before serialization. Historical checks retain original optional failures,
  retries and skips; source-access errors are separate from native validation.
