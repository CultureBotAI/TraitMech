limitations:
- Bäckhed and Wilde were inspected through indexed abstracts only. Detailed full-text
  wording and the stronger sufficient-condition reading of host-benefit-to-mutualism
  remain unverified, not disproved.
- The graph is assessed as a contextual ecological sketch. Arbitrary exchange and
  host benefit alone do not establish positive net fitness for both partners.
- Peng’s syntrophy terminology is directly attested in the cited synthetic-yeast paper.
  This review does not adjudicate every historical definition or propose engineering
  procedures.
- The Biolink observation concerns descriptive semantics; inherited formal named-thing
  typing is recorded separately. The METPO relations remain locally documented proposals.
- The earlier corpus checks retain actual timestamps, baselined findings, superseded
  failures and adapter skips at the unchanged scientific base.
- No scientific record, mapping, proposal, status or history is changed; no human
  scientific sign-off is conferred.
notes:
- Independent read-only source and ontology inspections informed this manually authored
  whole-record assessment. The primary source surfaces, not provider or agent summaries
  alone, are identified as evidence.
