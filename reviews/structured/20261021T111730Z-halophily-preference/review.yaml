  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Five regulation identifiers conflict with the represented endpoint kinds
  description: RO:0002211 and its positive-regulation child RO:0002213 describe regulation
    between processes. Edge 0 relates an environmental condition to a trait; edge
    7 a gradient to a material protein; edge 9 a condition to a quality; edge 10 two
    qualities; edge 11 has a material channel object. Preserve valid trait, protein
    and quality facets while reconciling the imported relations. Native acceptance
    is not external semantic validity, and no executed OWL failure is claimed.
