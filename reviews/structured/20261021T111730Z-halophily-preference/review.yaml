findings:
- finding_id: stress-response-grounding
  issue_key: halophily-preference-stress-response-grounding
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: One node mixes osmotic stress with the response to that stress
  description: Node 2 describes stress caused by osmotic mismatch but carries GO:0006970
    response-to-stress identity. Edge 3 describes a response while several other uses
    describe stress or imbalance, so the same node changes referent. The explicit
    closeMatch mapping does not reconcile those meanings. Group the shared ambiguity
    without declaring the declared process/process edge 2 or material-ion/response
    edge 3 independently invalid, or claiming potassium worsens stress.
  target_ids:
  - METPO:1000629
