limitations:
- FUY009 supplies high-salt context, while pinned METPO defines the broader preference
  axis. The inspected abstract does not formally establish every branch; no false
  umbrella definition is inferred.
- The assigned H. elongata narrative establishes a halophilic model; moderate wording
  is separately corroborated. That supplemental paper is not a ninth assigned citation,
  and no strain-uniform threshold is inferred.
- The E. coli comparator is documented only as the existing BW25113/LB illustration.
  Non-halophilic is a qualified branch interpretation rather than an exact inspected
  source phrase. Detailed virulence, regulatory, stress-response, growth-condition
  and engineering biology remains UNASSESSED_SCOPE.
- The 2002 and Vibrionaceae reviews were assessed only for abstracts, general framing
  and assigned quotation status. No detailed family-specific or pathogen mechanism
  is positively validated or reconstructed.
- Five quotation occurrences are exact; one 2002 body quote is unverified and one
  acquired-review phrase is a meaning-supported paraphrase. Abstract nonmatches and
  unavailable bodies are not source-wide disproof.
- The ASM Introduction was actually inspected at 11:11:24–26Z. Its browser receipt
  has no downloaded article-body hash. EPMC 500, BioC error/help HTML despite HTTP
  200, and PMC challenge pages are not article evidence.
- The potassium passage retains its B. subtilis context and compensatory initial-response
  meaning. Type compatibility of edge 3 does not by itself establish every capability
  or part-of semantic nuance; no separate certain endpoint finding is assigned.
- MDPI generic background supports the existing contextual claims with usually/typically
  and haloarchaeal/salt-in qualifiers. Narrow protein-expression induction and universal
  class-wide necessity are not established; they remain limitations, not automatic
  biological falsity.
- Node 6 legitimately denotes transport activity and local imports expressly admits
  that type. Its uptake-systems wording is a limitation only; no forced protein retype
  or separate edge defect is assigned.
- Current QUALITY facets are defensible. Two label-only protein classes and zero instances
  are compatible with NONMECHANISTIC scope; no mandatory protein accession, dataset
  or mechanism completion is required.
- E. coli has five catalog datasets, while H. elongata has no matching canonical/historical-name
  dataset. No BW25113/condition equivalence follows from species coverage. No downstream
  module query occurred, and noncoverage is not negative phenotype evidence.
- The captured target-specific AI histories are positive ownership evidence and mention
  independent review. Local searches include ignored and hidden files within exclusions;
  linked remote review content is unassessed, so no private/remote absence claim is
  made.
- Local v2/v9 terms remain provisional. RO analysis is semantic review, not executed
  OWL reasoning. All reused authorities retain original acquisition bounds and hashes.
- The initial snippet CLI failure and successful required retry are both retained.
  Historical B4 protein/taxon, B5 QC, B3 history and OLD common checks keep original
  dates, failures, retry and skips. No fresh B6 execution or structured-review failure
  is invented.
- No scientific record, mapping, history, generated product, environment or Git state
  was modified. No paid research, experiment, new molecular target or organism intervention
  was performed.
