- finding_id: gradient-entity-kind
  issue_key: halophily-preference-gradient-entity-kind
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: The proton-motive-force gradient is typed as a chemical entity
  description: Node 8 explicitly describes a transmembrane proton electrochemical
    gradient, but node_type is CHEMICAL. Native STATE expressly includes proton motive
    force and distinguishes a gradient from the process establishing it. This is a
