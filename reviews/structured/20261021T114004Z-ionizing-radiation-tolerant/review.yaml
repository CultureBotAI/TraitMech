limitations:
- Local traitmech:000008 remains authoritative pending the exact v5 proposal. Broader
  METPO1007072 overlaps the deliberately retained parent; no forced parent migration
  or exact-child equivalence is inferred. Gamma remains a narrow synonym.
- The Genes paper principally studies D. irradiatisoli and UV, while actually containing
  the D. radiodurans comparison and general repair/protection context. Background
  support is not a new isolated DSB-repair experiment or an all-taxon mechanism requirement.
- The supported gamma excerpt normalizes Greek notation and subscripts/superscripts;
  it is not raw literal text. Gamma and UV use different quantities, and D10 is not
  complete survival. No new threshold, dose conversion, condition or optimization
  is supplied.
- The canonical nearest title/abstract supports radiation-resistant D. radiodurans
  R1. Quantified extreme-dose context is separate corroboration from the already assigned
  Genes paper, not proof that every isolate has identical resistance.
- The actual CSH abstract positively supports causal proteome protection and repair/recovery.
  Exact Mn/Fe quotation, approximately threefold iron comparison and precise Mn-complex
  material role remain unverified because full text was unavailable. This is not a
  correlation-only or false-source finding.
- The chapter distinguishes lesion-specific repair and repair-resistant clusters.
  The finding bounds coverage of the mixed lesion state; it neither declares all clusters
  irreparable nor reconstructs additional repair routes.
- RO enables has material-executor semantics while the current ratio is valid QUALITY.
  Preserve both ratio and damage STATE facets. Local challenges/confers are maintained
  provisional proposals; free-text repairs/correlation do not inherit absent RO identifiers.
  No OWL reasoning run is claimed.
- Original Genes JATS acquisition at 09:37:42–43Z is separate from copying and fresh
  metadata. CSH/canonical XML failures, BioC help responses, publisher 403, root MDPI
  429 and browser challenges remain distinct from successful chapter HTML and actual
  abstracts. Browser observation receipts do not hash article bodies.
- Publication-status inspection covers the actual three indexed records and one chapter
  registry/publisher identity. No corrective relation in those fields is not a globally
  exhaustive absence claim. An empty indexed chapter DOI query does not invalidate
  the resolved chapter.
- The complete retained catalog has no canonical or historical-name/genus match. No
  organism substitution or downstream module search occurred; noncoverage is not negative
  biology. Runner discovery retains its original bounded scope and times.
- The parent was read as context only; its proteins are not target proteins. The historical
  provider header was inspected, not its entire report. NONMECHANISTIC scope and zero
  protein instances do not mandate invented graph completion.
- Six explicit AI events and ignored-inclusive bounded local searches establish maintenance
  but not attributed human acceptance. Remote/private sources remain unassessed. Current
  upstream ontology authorship is not current-target human sign-off.
- Historical B4/B5/B3/OLD checks retain actual dates, failures, retry, baselines and
  adapter skips. No new native corpus execution, scientific record edit, environment
  mutation, paid research, experiment or Git mutation is part of this review.
