limitations:
- Ag43 was inspected at publisher title/abstract level; its subscription full text
  was unavailable. No exhaustive absence claim about that full paper is made. Nature
  issue text was inspected directly.
- BMBL6 relevant printed pages and WHO fourth-edition official overview were inspected.
  The WHO manual PDF was inaccessible in that check. This is not a current legal or
  all-jurisdiction containment determination.
- The MDPI historical review was retrieved through its publisher PDF after HTML access
  failed. Most classification sources are authority/review documents, not newly inspected
  biological experiments.
- The canonical-example paper supports RG1 laboratory lineages; no new operational
  BSL assignment is supplied by this review.
- Historical scan PMIDs in discussion notes are explicitly disclaimed as support.
  Their content is not needed for the active scientific conclusions; any supplemental
  verification is provenance only.
- Local fifth-level history is a documentary lead rather than proof of official acceptance
  or generic equivalence. The child records are not adjudicated targets of this bundle.
- Human sign-off for historical REVIEWED status was not independently established.
  Optional missing datasets, protein instances or predicate IDs are not defects solely
  because absent.
- Corpus validations are reused from unchanged scientific inputs; adapter-skipped
  product pairs and earlier failed network attempts remain explicit.
notes:
- No record, source transform, ontology, history or generated page was modified. This
  review does not assign containment requirements or recommend handling procedures.
- All source-capture expansions preserved previous hashes and captured newly used
  local context before judgment.
- Maintained writer and upstream-provenance references identify future correction
  owners, not authorization to regenerate or publish anything.
