limitations:
- Ag43 full text was unavailable; the review does not assert exhaustive full-text
  absence.
- The MDPI HTML/XML endpoints were unavailable; the official publisher PDF was successfully
  retrieved and relevant passages inspected. Europe PMC historical lookup initially
  failed and succeeded on retry.
- The Canadian authority page was inspected through the browser; a separate download
  timed out. The review makes no clinical recommendation or legal compliance determination.
- No high-containment procedure, facility design, quantitative protection, pathogen
  mechanism or operational experiment is assessed or recommended. Discussion findings
  concern evidence and inference only.
- Current taxonomy nomenclature and rank are reported without assuming that a renamed
  species is an automatic replacement for the retained virus identifier.
- Human scientific sign-off remains unresolved; native corpus adapter skips and superseded
  diagnostic failures remain explicit.
notes:
- Only this immutable review bundle is added. No scientific record, source writer,
  curation history or generated page is changed.
- The initial inspection command had an argument-construction error before assessment;
  a successful corrected capture and a hash-preserving expansion preceded judgement.
  This was not a failed review validation.
- The supported example need not be replaced; its maintained backfill source is captured
  for future provenance consistency.
