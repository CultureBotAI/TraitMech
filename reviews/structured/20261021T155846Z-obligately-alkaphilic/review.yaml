limitations:
- The approximate definition boundary and the focal Natronomonas growth exclusion
  remain separate from taxonomic identity and alkaline optimum. Absence of a measured
  lower limit in selected text is not a false classification finding.
- The Natronomonas dissertation chapter is an author version, not the assigned PMC
  journal body. Habitat around pH 11 is not automatically a measured upper growth
  tolerance. Supplemental classification sources remain distinct from the assigned
  citation.
- Precise TrkAH and broad antiporter essentiality body clauses remain unverified after
  retained API-help and publisher403 outcomes. Positive indexed ion-homeostasis context
  remains; no body-access failure proves a claim false.
- Membrane composition is supported in named methanotroph context. PC label precision
  does not negate that response or imply every alkaliphile shares it.
- 'Seven snippet occurrences have supported meaning: two raw exact, four notation/spacing-normalized
  and one marked abridgment. Native abstract-check outcomes remain unchanged and separate.'
- Two components, four reviewed label-only protein classes and zero instances fit
  NONMECHANISTIC policy. No missing connector, token protein, new pathway or experimental
  requirement is inferred.
- Current material TrkAH contribution fits RO roles; proposed challenges/confers/exports/accumulates
  and broad Biolink causes retain their own meanings. No reasoner was executed and
  no formal restriction was invented for free predicates.
- The current record has 17 explicit AI events, one seed and one script event lacking
  an llm flag. The latter is not silently counted as explicit AI. Sixteen histories
  and 192 matching files are bounded local evidence; private/remote decisions remain
  unknown.
- Original source acquisition, later copies, current selected readings and browser
  observation receipts are distinct. Failed JSON/help/challenge responses are not
  article bodies; a browser receipt hash is not a body hash.
- The retained complete 20-organism, 28-dataset catalog and bounded runner discovery
  are reused at their original times. No canonical match, embedded-organism substitution
  or downstream expression query is inferred.
- Detailed incidental pathogen fitness, defense, resistance and intervention material
  remains UNASSESSED_SCOPE. No new routes, molecular targets, optimized recipes or
  experimental recommendations are supplied.
- All 104captured inputs remain unchanged. Focused checks passed directly with no
  current retry; common checks, B4 protein audit and B8 QC retain original dates,
  baselines, failures, retries and skips. Root owns serializer execution, final native
  review validation and save.
notes:
- Final adjudicated disposition is two majors and three minors, with 15 assessments
  and five actions. All 38 root and 30 independent-challenge bindings are verified.
- Coverage is 8 assigned works,16 external + 2 ontology placements,7 snippets,14 nodes,
  13 edges and 2 components, one structured canonical plus embedded C-125,19 events
  and 16 context histories. All 43 source and 34 grounding artifacts are verified
  separately.
- This serializer is authored and statically checked without import or execution.
