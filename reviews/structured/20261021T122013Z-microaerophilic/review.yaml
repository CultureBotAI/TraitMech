- finding_id: external-relation-roles
  issue_key: microaerophilic-external-relation-roles
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Imported relations assign incompatible roles to current endpoints
  description: 'Edge 2 assigns RO:0002326 to an explicit trait object although its
    inherited object role is a process. Edge 3 assigns RO:0000085 to a material protein-class
    object although its range is a dependent function. These two conflicts are confirmed
    independently of detailed biology. Edge 6 is a qualified subcase: the currently
    declared PATHWAY route does not supply the material executor required by RO:0002327,
    but the prose can also denote physical machinery. Clarify that represented sense
    rather than treating every PATHWAY as categorically invalid. The maintained route
    convention does not prove that its writer directly created this node. These are
    documentary semantic conflicts, not native validation failures or results of an
    OWL reasoner.'
