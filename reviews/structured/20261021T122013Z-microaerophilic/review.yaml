limitations:
- The official publisher chapter positively supports the definition and exact excerpt.
  Direct Bookshelf responses were challenges, so no direct current archival-body/version
  equivalence is claimed. Search results were leads only.
- Canonical species identity and high-level microaerophilic classification are supported.
  Numeric growth conditions and detailed pathogen-linked respiratory, defense, predominance
  and fitness assertions remain UNASSESSED_SCOPE.
- Edge 0 has positive general class context, not proof that any environmental presence
  creates the phenotype. Generic NONMECHANISTIC nodes do not automatically assert
  universal necessity across class members.
- The Nature BioC representation supports general introductory classification and
  one literal assigned excerpt. Two other assigned phrases remain unverified there;
