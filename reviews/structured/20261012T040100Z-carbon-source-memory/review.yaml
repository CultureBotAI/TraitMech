limitations:
- Author self-review; not independent review or human sign-off. Only one record scientifically
  reviewed, not every hashed input.
- Evidence access timestamps denote reinspection, not necessarily a new download.
  Primary hashes and section locators retained.
- Lambert/Cerulus selected primary sections and actual figures inspected, not every
  raw datum, equation or supplement. Cerulus publisher article challenged; NCBI XML
  used. Zacharioudakis abstract only.
- Lambert snippet remains NOT_IN_ABSTRACT; direct body matching does not change the
  native resolver verdict.
- Issue1884 was corrected before formal inspection; no prior saved finding is invented
  or retired by this clean assessment.
- Canonical example audit checks shape only; authority resolution not run because
  examples are unchanged. Mechanism and natural provenance remain explicit gaps.
- Existing product validation retains 123 SKIPPED_NO_ADAPTER rows and QC retains two
  ENIGMA licensing warnings.
- Initial local Python launches and first reservation refresh were interrupted before
  completion; successful reruns are the reported checks, not those failed attempts.
- Embedding inputs absent; retained artifacts not regenerated. Ordinary whitespace
  check flags required TSV trailing header cells; only exact width-checked TSV receives
  documented narrow exception.
- Bounded search excludes archives, symlink directories and unregistered/private work.
  Trait discovery remains active; no global exhaustion claim.
