evidence:
- evidence_id: bacterial
  kind: primary_source
  reference: DOI:10.1371/journal.pgen.1004556
  locator: Results / Phenotypic memory in response to sudden environmental changes;
    relevant Abstract, Introduction, Methods and Discussion; actual Figure 2 and Text
    S1 strain construction.
  accessed_at: '2026-10-12T04:01:00Z'
  support: supports
  summary: Repeated glucose/lactose exposure in E. coli supports non-genetic history
    dependence. Growth readout is chamber-level relative elongation. Protein-inheritance
    phenotypic memory differs from shorter response memory with continuing induction.
    Engineered F3/W3110 provenance is not a natural canonical exemplar; model predictions
    are not independent replication. Not all figures, equations or raw data were reanalyzed.
  snapshot_sha256: cfe90f48779f5e1b84d5e4aac1ea71c95737743565a899c9ca24468c6c53a027
- evidence_id: yeast-growth
  kind: primary_source
  reference: DOI:10.7554/eLife.39234
  locator: Scientific abstract; relevant Results, Discussion and culture/strain/lag
    Methods; actual Figures 1, 2, 6 and Figure 1 supplement 4.
  accessed_at: '2026-10-12T04:01:00Z'
  support: supports
  summary: Growth-history dependence in yeast includes cross-sugar effects. Respiratory
    perturbations challenge obligatory sugar-specific protein inheritance; they do
    not establish a universal mechanism. Population lag and single-cell resumption
    differ, and no resumption within 24 hours does not prove death. Main AN63 series
    is engineered; separately reported non-laboratory strains have unreviewed primary
    provenance here. NCBI XML and public publisher figure assets were read; publisher
    article access challenged.
  snapshot_sha256: 8c8ed3d22ee8b595337f3a703e1d447108d07b110db6539de678ba60aace7ca1
- evidence_id: yeast-induction
  kind: primary_source
  reference: DOI:10.1016/j.cub.2007.10.044
  locator: Source-qualified MED scientific abstract, PMID17997309; whole abstract
    including preceding initial-induction and reinduction comparison.
  accessed_at: '2026-10-12T04:01:00Z'
  support: supports
  summary: Previous galactose exposure changes subsequent GAL induction after intervening
    glucose growth. Supports induction memory, not measured growth-rate benefit. Gal1/cytoplasmic
    interpretation is assay-specific, not a universal absence of chromatin contributions.
    Full text, figures and strain provenance unavailable to this assessment.
  snapshot_sha256: 8db38664b657c47e508867f319a18c601a7bcc2ad9540951de419fd0660c1a36
- evidence_id: correction-notice
  kind: primary_source
  reference: DOI:10.1371/journal.pgen.1004793
  locator: Publisher correction body and linked citation metadata.
  accessed_at: '2026-10-12T04:01:00Z'
  support: supports
  summary: Read author-name typesetting correction. It changes Kussell attribution,
    not the biological result, and is not a fourth independent study.
  snapshot_sha256: 80b41be6d7952f6d4a02ae2c83992ba45892421098807c698aec10a76f0a2ed1
- evidence_id: notices
  kind: authority
  reference: https://pubmed.ncbi.nlm.nih.gov/17997309/
  locator: Exact-DOI Crossref and source-qualified MED metadata for the three studies;
    accessible primary publisher content.
  accessed_at: '2026-10-12T04:01:00Z'
  support: context_only
  summary: DOI/PMID identity confirmed. MED Comment in and Crossref has-review links
    are not silently relabeled corrections or experimental replication. No additional
    notice exposed in inspected metadata is a bounded result, not proof of absence.
- evidence_id: content
  kind: record_content
  reference: data/traits/physiology/carbon_source_memory.yaml
