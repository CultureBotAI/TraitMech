  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Regulation predicates conflict with the chemical subject referent
  description: 'Edges 8/9 assign RO:0002212 and RO:0002211 to cyclic di-AMP, explicitly
    a CHEMICAL, although the relations require process subjects and objects. These
    two confirmed role conflicts independently anchor this grouped major. Edge 7 is
    expressly qualified: ectoine is material and therefore passes RO:0002326 endpoint
    kinds, but the inherited capable-of-part-process and part-of-capable-structure
    meanings are not established by a description that identifies it as accumulated
    cargo. Do not categorically exclude chemicals or treat that qualified interpretation
    as an independent confirmed major. Source support for generic regulation and ectoine
    context remains positive. Wildcard mappings permit recurrence and the writer skips
    existing IDs; native validation passed without an OWL reasoner test.'
