limitations:
- Author self-review, not independent review or human signoff. Full scientific coverage
  applies only to the named new record, not all corpus inputs hashed for preservation.
- Sources read during curation and reassessed after input capture. accessed_at denotes
  local snapshot reinspection during assembly, not fabricated repeat downloads.
- 2010/1968 full text, Methods, actual figures and supplements unavailable; 2025 only
  named sections and actual Figures1/4 assessed, not all figures, supplements or movies.
- 2025 native snippet result is NOT_IN_ABSTRACT, with separate direct Introduction
  match. 2010 publisher notice check inaccessible; 1968 publisher notice status unverified;
  accessible metadata cannot prove global absence of notices.
- Fig1a is a lifecycle schematic. Fig4 heterologous lysis is not invasion/uptake proof.
  Gene presence and protein abundance are not functional causality. No universal division/occupancy/prey-range/obligacy
  or field-predation claim.
- 2023 cryo-ET source remains an existing-parent research lead; no new full-text claim
  imported from inaccessible text.
- Novelty/allocation searches include ignored/hidden files but are bounded snapshots,
  not global exhaustion or protection from future/unregistered/private allocations.
- Two optional discussions OPEN; no graph/protein example/exact external mapping.
  Exact embedding inputs absent, artifacts retained without regeneration.
- Working-tree hashes attest bytes at the checkpoint; ignored ROBOT OWL inputs are
  reproducible local outputs, not committed files.
