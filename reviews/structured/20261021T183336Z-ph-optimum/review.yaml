limitations:
- Detailed biological mechanisms at edges 5–9 remain UNASSESSED_SCOPE. Identity, literal
  wording and formal role review do not certify pathogen fitness, acid-defense, resistance,
  intervention efficacy or optimization.
- The confirmed source finding is confined to evidence[0].notes operational equivalence.
  The graph description minimal-load bridge is unestablished in inspected scope; the
  counterexample does not establish energetic load at growth optimum.
- Three Baker phrases remain unverified because the retained body attempt was unavailable.
  No new lead justified a repeated request; this is not evidence of false quotation
  or false biology.
- Edge 3 may encode the peak-growth criterion for recognizing the external optimum.
  The separate reassessment supersedes the original minor candidate. Edge 6 activity/material
  wording remains qualified without forced retyping.
- Biolink produces has broad named-thing formal endpoints. Edge 9 concerns textual
  material-producer meaning, not an invented hard material domain or material-only
  product range.
- Typical near-neutral context is not an all-organism numerical rule. Canonical optimum
  6.0–7.0 is distinct from growth range 5.5–9.0 and is retained on the parent.
- Original source/authority/catalog acquisition times remain separate from current
  copies and reading; no full-article reading or unavailable-body hash is invented.
- The bounded ignored-inclusive search cannot establish absence of remote/private
  acceptance. All sixteen history actor projections were reviewed; only three listed
  histories were fully read. Current research frontmatter does not prove exact earlier
  enrichment bytes.
- Two components and zero protein classes/instances are permissible. No artificial
  connection, token accession, substitute organism or downstream defense-expression
  query is required.
- Focused checks passed directly. Authority DNS failures/retries are separate acquisitions;
  historical common failures, retries, baselines and adapter skips remain explicit.
