limitations:
- All four cited article bodies are available and relevant passages were inspected.
  This does not mean every method, external supplement or unrelated claim was assessed.
  No search-result snippet supplies primary proof.
- The copper-resistance review focuses on Gram-negative bacteria. Its qualified typical
  mechanism context is not a universal class mechanism or formal quantitative growth
  threshold.
- The BS1 copper MIC of 5 mM is a strain/assay inhibitory endpoint and external challenge,
  not direct measurement of the cytoplasmic copper pool. The record already labels
  MIC; no separate growth-at-MIC defect is inferred.
- The combined chemical finding concerns specific endpoint identities and nearest
  evidence. It does not establish that Cu(II) is universally harmless, that all copper
  toxicity is oxidative, or that the broad relation types are formally invalid.
- The protein source positively supports a Cop-region/system branch in a CH34-derived
  background. An independently established isolated-Q1LBE6 assay in intact CH34 was
  not demonstrated by the inspected text; this is bounded evidence precision, not
  proof of no function.
- The anchor phrase is absent from normalized complete retrieved article XML. This
  result does not establish absence from every external supplement or other source,
  nor negate supported oxidase-class function.
- Current UniProt version 100 differs from stored 99, while archived 99/sequence 1
  fits the declared August retrieval. The actual failed live audit is retained without
  treating later drift as an original version error; the historical retrieval itself
  was not independently witnessed.
- The initial snippet command failed on an unsupported --file option. Its corrected
  --record invocation succeeded with three inconclusive abstract misses; the manual
  full-text determinations supersede those misses without erasing the failed attempt.
- All 1130 trait files were byte-compared before reusing the original corpus audits.
  Common-check reuse likewise preserves original execution dates, failures and skips;
  no fresh external-release certification is implied.
- No canonical Cupriavidus expression dataset matches the inspected catalog. No organism
  substitution, gene/module query or negative functional inference followed. Runner
  nonavailability is bounded to the retained discovery scope.
- Human acceptance remains unknown outside the declared ignored-inclusive local search.
  Completing this review does not confer human scientific acceptance.
- No scientific record, status, history, generated page or maintained mapping was
  changed. No paid provider call, experimental design or biological optimization was
  performed; unrelated pathogen mechanisms in broad sources were not assessed or expanded.
