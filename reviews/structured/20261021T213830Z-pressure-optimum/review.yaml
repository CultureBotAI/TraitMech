    growth, with exact local proposed 1007603 and active phenotype parent. Separately,
    node 6 declares broad high-pressure growth/survival capacity but grounds to a
    class requiring similar or faster atmospheric-pressure growth. Count one internal
    grounding concern, not duplicate incoming-edge findings.
