evidence:
- evidence_id: lien
  kind: primary_source
  reference: DOI:10.1126/science.adp0614
  locator: 'Author-hosted published PDF: scientific Abstract, Introduction, contact/capture
    and nutrient-uptake Results, Discussion, culture/killing/imaging and stable-isotope
    Raman Methods; actual Figures 1, 5 and 6. Source-qualified MED PMID39418385 scientific
    Abstract separately matched.'
  accessed_at: '2026-10-11T13:31:04Z'
  support: supports
  summary: Filamentous surface capture, contact-dependent killing and prey-component
    uptake support the definition. Introduction includes nonbacterial prey; solid-surface
    gliding can establish contact without flagellar trapping. Fig5B compares labeled-prey
    WT with IS-inactivated and unlabeled controls; the Raman C-D/C-H ratio supports
    uptake, not specific molecular transport. Fig5A and Fig6 are models, not independent
    flux experiments. Environmental covariation is not field predation proof.
  snapshot_sha256: 9fb46f2e8297bd73a7c8a8ef84d26e952d546c516b7fcb17f711f23335626788
- evidence_id: lewin
  kind: primary_source
  reference: DOI:10.1007/s002489900052
  locator: 'Direct publisher Abstract, HTML #Abs1-content; source-qualified MED PMID9337418
    title/DOI matched but no abstract returned.'
  accessed_at: '2026-10-11T13:31:04Z'
  support: supports
  summary: Saprospira grandis is described as filamentous and able to subsist on other
    microbes, capture motile bacteria and kill/digest them. Supports capture and nutrition
    without universal flagellum dependence. Full text, figures and strain provenance
    unavailable; no canonical Saprospira example inferred.
  snapshot_sha256: 529e892d35a35186f5265d414b7f4ae98aa22a498e9ded08598a735571da53f8
- evidence_id: furusawa
