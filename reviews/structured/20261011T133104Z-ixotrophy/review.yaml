limitations:
- Author self-review, not independent review or human signoff. Full coverage applies
  only to the one named record and associated artifact scope.
- Source evidence was read during curation and reassessed after local input capture.
  Evidence accessed_at denotes local snapshot reinspection during assembly, or same-session
  direct publisher access, not fabricated repeat downloads.
- 1997 and 2015 full text/figures/supplements unavailable; 2024 other figures, structural
  Methods, supplements and movies not comprehensively assessed. Only explicit locators
  reviewed.
- The 1997 automated snippet result remains UNRESOLVED; direct publisher text supplies
  the separate verification. Science publisher notice status was inaccessible; retrieved
  metadata and accessible pages cannot prove global absence of corrections.
- 2015/2024 authors and CCB-QB1 overlap. Raman uptake is not proof of specific transport
  chemistry or field predation; the environmental sequence analysis is correlation.
- 2026 terminology context comes from the publisher early accepted version, not final
  Version of Record; full text and supplements unread and not counted as phenotype
  evidence.
- Novelty/reservations are bounded snapshots including ignored/hidden files, not global
  exhaustion or a guarantee against future/unregistered/private allocations.
- Two optional discussions remain OPEN. No graph, protein examples or exact external
  mapping added. Exact embedding source paths absent; retained embedding artifacts
  not regenerated.
- Working-tree hashes attest inspected bytes at the recorded checkpoint. Ignored ROBOT
  OWL inputs are local generated outputs, reproducible via native command, not committed
  files.
