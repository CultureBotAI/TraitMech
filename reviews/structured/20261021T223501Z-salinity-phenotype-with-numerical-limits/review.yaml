limitations:
- Detailed pathogenic fitness, AMR and osmostress intervention mechanisms/efficacy
  remain UNASSESSED_SCOPE; incidental source details are not adopted.
- The graph declares a NaCl branch, while node0 broad-class wording, the full definition
  and canonical total-sodium example require explicit scope distinction. No concentration
  is silently converted.
- Five short body-only snippet occurrences remain unknown after failed publisher access;
  no absence or false-quote finding follows.
- Canonical study exposures and reported growth range are distinct and positive; no
  assay or optimized condition is recommended.
- The engineered proline study is a named cohort, not evidence of universal protection.
  Detailed intervention claims remain unassessed.
- Nature retained HTML supplies abstract/preview and references, not full inspected
  primary-body support for every detailed note. Preprint linkage is not a correction/retraction.
- Pinned PathwayMech context limits route/organism scope and does not assert equivalence
  or transfer. The original ground receipt used the wrong optional projection key
  and recorded null; a separately bound correction verifies the actual related_records
  link without altering the frozen manifest.
- Original metadata/body access, older failures and current copies are distinct from
  new definition/canonical requests. The tentative failed publisher path differs from
  the actual DOI redirect.
- Local provenance search does not exclude private or off-repository acceptance; actual
  QC/reuse/local initialization do not assert remote publication.
