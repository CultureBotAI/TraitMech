- finding_id: definition-source-exclusivity
  issue_key: opportunistic-pathogen-definition-source-exclusivity
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: The exclusive definition exceeds the cited source’s characterization
  description: The record and self-node state disease occurs only under the listed
    contexts. Brown gives a conditional typical medical characterization and then
    explicitly adopts a broader definition. The cited text does not justify the exclusive
    rule. Its non-parasitic-context framing also is not equivalent to outside-host
    context. This finding concerns source fidelity, not a request to expand pathogen
    capabilities or automatically adopt the paper’s broader taxonomy.
