  details: 'Zero-based ledger: node0 is the local trait; nodes2,6,7,9 describe processes.
    Nodes1/3 are host/context conditions; node4 describes treatment exposure rather
    than a chemical substance. Node5 describes community state beyond the native cell-state
    definition. Node8 mixes a restriction activity with an environmental condition
    and needs sense clarification. Edge0 has compatible Biolink endpoint types but
    source conditionality is not an invariant sufficient cause. Edge1 fits the provisional
    process-to-trait mapping and has conceptual continuum support. Edge2 uses a disruption/context
    as an executor. Edge3 has a STATE object against a process range; its subject
    may denote a treatment process despite the CHEMICAL label. Edge4 has a STATE subject
    against a process domain. Edge5 has a process subject against material-actor enables.
    Edge6 uses an ungrounded local phrase, which is permitted; its wound-quantifier
    claim remains unverified. Edge7’s mixed restriction-activity/condition sense is
    not counted as a definite type error. Edge8 has a process subject against material-actor
    contributes to. No replacement biological route, molecular target or experimental
    step is proposed.'
