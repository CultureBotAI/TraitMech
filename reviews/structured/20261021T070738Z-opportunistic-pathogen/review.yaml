limitations:
- This whole-record review assesses identity, conceptual representation, source scope
  and provenance. Detailed pathogen mechanisms are neither reconstructed nor independently
  certified.
- For Brown, Drew and the species example, only the identified conceptual/introduction
  passages were assessed from full XML. Full-text availability is not presented as
  a complete mechanistic literature review.
- Uberoi was assessed from its abstract; the nearly-all-wounds quantitative assertion
  remains unverified. Jacobsen and Sánchez-Jiménez detailed route support also remains
  unverified.
- The example’s resistance characterization is supported for strains; universality
  across the species is not established.
- Node8/edge7 mix an activity and a condition. This remains a bounded representation
  question rather than a definite added ontology error.
- Expression-module evidence is not used for this generic disease class. METPO:2007700
  remains a local proposal.
- Earlier non-history corpus diagnostics retain their actual f25 timestamps, failures
  and skips. Fresh history validation at8eee checked1277records; the Git delta contains
  seven workflow/skill/history additions and no scientific-record changes.
- No scientific record, mapping, schema, history or native status is changed; no human
  sign-off is conferred.
