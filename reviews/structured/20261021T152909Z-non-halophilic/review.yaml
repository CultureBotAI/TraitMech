limitations:
- Detailed pathogen-linked efflux, virulence, fitness, defense, resistance and intervention
  mechanisms remain UNASSESSED_SCOPE. Literal classification wording, citation identity
  and existing bounded observations are checked separately; no route repair, target,
  experiment, optimized condition or efficacy interpretation is supplied.
- Active METPO identity, exact qualitative definition, parent and supplied related
  synonym match pinned authority. Three obsolete predecessors explicitly point to
  the current term. Ontology agreement does not independently verify every clause
  against the nearest publication.
- RO regulates concerns the explicitly high-osmolarity condition. The separate upshift
  node can denote an event; there is no blanket ENVIRONMENTAL_FACTOR exclusion, forced
  QUALITY retype or executed reasoner failure.
- Local confers admits environmental subjects, although mere growth compatibility
  is weaker than an intrinsic causal basis. Local mitigates can address a disruptive
  physiological consequence; normal water flux in every direction is not universally
  harmful. These contextual qualifications are not additional findings.
- Biolink causes has broad named-thing endpoints. Four ungrounded predicates retain
  their literal contextual meanings; they are not silently equated to similarly named
  RO predicates, and no mandatory predicate_id is invented.
- The assigned proline DOI was unresolved across the finite documented surfaces. A
  separately resolved candidate is a verification lead only. Neither global DOI nonexistence
  nor false proline biology follows, and no citation was changed.
- Current E. coli wording already preserves its strain, source measurement and limits.
  It does not claim sodium-free growth, a complete optimum curve or universal species
  behavior. Exact B. subtilis non-halophilic classification remains bounded by inspected
  genome-paper coverage; no false classification follows from a limited search.
- The Vibrio excerpt is present in a publication title; it is classification/citation
  evidence only. Detailed efflux biology is unassessed. Native NOT_IN_ABSTRACT results
  are not rewritten as quote failures or as manual body verification.
- Successful HTTP responses containing access-challenge HTML are not article bodies;
  failed 500/404 and browser attempts remain separately documented. Root browser observations
  have bounded observation windows and no invented downloaded-body hash. Metadata
  readings, body acquisition and later selected readings have distinct actual times.
- Official chemical/quality identities are fresh at 15:15:09 UTC. Taxonomy responses
  retain their original 14:58:13–14:58:14 UTC retrieval; the complete expression catalog
  retains its original 07:36:12 UTC retrieval. Copy/hash verification is not new acquisition.
  Catalog candidates do not establish exact BW25113 coverage or phenotype support.
- One reviewed label-only transporter aggregate, zero protein instances and three
  graph components fit NONMECHANISTIC policy. Optional accessions, extra mechanistic
  steps and connectors are not required.
- Bounded provenance covers the owned repository with ignored files included and .git/.venv
  excluded. The 185 target-match files and 67 parsed review target arrays are distinct
  from 266 broader all-node capture-preparation filename hits. Four histories include
  one exact target AI repair and three contextual leads, not human acceptance.
- Current Falcon frontmatter records an August 4 run; it does not establish that these
  exact bytes generated the June 23 enrichment. Captured generic writer/report hits
  are not automatically current-record owners or primary biological evidence.
- Historical common checks and B8 QC retain actual bases, baseline findings, failures,
  retries and skips under the B9 byte proof. No fresh B9 corpus/QC execution is claimed
  by reuse. Parent owns serializer execution, native review validation and save; this
  preparation changes no scientific record, Git or persistent state.
- One exact AEM quotation uses the preserved actual publisher Introduction observation
  at 11:11:24–11:11:26 UTC. Its browser receipt hash is not an article-body hash;
  current failed requests and later copying do not alter that source time.
- 'Root metadata chronology is explicitly corrected: six assigned results read at
  15:15:23 UTC; the separate candidate was acquired at 15:15:58–59 and read at 15:17:45.901631
  UTC. The original late-glob receipt remains superseded provenance only.'
