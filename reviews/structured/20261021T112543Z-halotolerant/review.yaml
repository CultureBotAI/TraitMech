limitations:
- Nearest FUY009 abstract supports general high-salt physiology but does not establish
  the complete no-high-salt-requirement definition or two quoted body occurrences.
  The pinned ontology and separately inspected Nature Introduction provide distinct
  support; high salt has no new numeric threshold here.
- The canonical source supports a moderate halophile and chloride dependence. It does
  not establish the exact no-high-salt-requirement criterion, but a nonzero chloride
  requirement alone is not a contradiction of an unspecified high-salt boundary. The
  clinical exemplar aside remains unverified in the inspected passage.
- The top organism report has a confirmed linked expression of concern. Notice body
  and rationale were unavailable; EPMC 500, publisher access failure and BioC HTTP-200
  error/help are not article evidence. The second empty JATS link is unresolved. No
  retraction or false-classification inference is made.
- Five snippets are literal matches, one preserves title words after punctuation normalization,
  and two are unverified. These categories remain distinct; failed access and abstract
  nonmatches are not source-wide disproof.
- The Delaware source is a 2024 PhD thesis by Katherine Boas Lichty, verified from
  actual university metadata despite zero Europe PMC hits. No thesis chapters or detailed
  pathogen stress mechanisms were researched. Edges 8–11 biology is UNASSESSED_SCOPE;
  identity and formal role compatibility are not route validation.
- Vibrionaceae and other pathogen-associated source material receives only documentary
  identity, classification and generic quotation/framing assessment. No organism-specific
  stress, survival, virulence, fitness, intervention, growth-condition or engineering
  recommendation is supplied.
- Source may/can qualifiers, halophile contexts and generic introductory statements
  remain bounded. They do not establish universal class-wide necessity, every depicted
  component or a new causal assay.
- Current RO endpoints are compatible as declared; component/capability nuances are
  not proven merely by type fit. Has output inherits a continuant range. Stress/response
  sense is grouped at node 2 rather than duplicated as a relation major. No executed
  OWL reasoning result is claimed.
- Local v2/v8/v9 predicates are maintained provisional proposals absent from pinned
  METPO. Imports expressly permits activity, named ectoine PATHWAY is valid, and historical
  withdrawn chemical/microbe assignments are not current defects.
- Two label-only protein classes and zero instances are permitted in NONMECHANISTIC
  scope. No mandatory accession, dataset, replacement chemical or pathway completion
  is inferred.
- The retained catalog contains no canonical or inspected historical-name match for
  H. halophilus. No clinical-example substitution or downstream module query occurred.
  Noncoverage is not negative biology, and historical runner discovery is not a fresh
  global absence claim.
- Ignored-inclusive local provenance searches have explicit repository and exclusion
