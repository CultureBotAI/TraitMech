limitations:
- Martiny was inspected through its abstract; Piton through abstract and publisher
  preview. The apparent PDF response was HTML, not full article access. No absence
  of support is inferred from inaccessible sections.
- The directly linked critique had relevant body text available; the reply was preview-only.
  This bounded exchange was inspected without reanalysis or an exhaustive subsequent-literature
  audit. The contested genome-size/axis interpretation remains explicit.
- Eight cited sources had relevant full-text passages inspected, not every section
  or all underlying primary experiments. Exact snippets establish source fidelity,
  not independent replication.
- The historical F113 paper was inspected for source identity and habitat attribution
  only; host-interaction mechanisms were not investigated.
- Community gene abundance/prevalence, potential growth and statistical genomic axes
  are distinct measurements. Most current descriptions preserve these distinctions;
  the RO heat edge remains a material semantic mismatch.
- Official expression-source searches were bounded to three terms, three datasets
  and20 results per query; three selected module summaries were inspected. No specific
  record gene/protein join or causal interpretation was made.
- The structured-source runner was unavailable in a recent bounded local search, reused
  with its original timestamp; official API fallback completed. Search or dataset
  nonmatches are not negative biological evidence.
- External relation semantics and native enum descriptions are distinct from passing
  permissive schema checks. No failed formal reasoner result is claimed.
- Human acceptance was not located in inspected target-specific local fields; private/remote
  approval was not searched.
- No scientific record, mapping, schema, writer, history, status or generated page
  was modified by this review.
notes:
- Field paths use zero-based indices.
- The methodology dispute is retained as an assessment limitation, without adding
  a defect solely because the record cites a debated framework and already attributes
  the associations.
- The STATE finding proposes a vocabulary decision rather than an unverified replacement
  type.
