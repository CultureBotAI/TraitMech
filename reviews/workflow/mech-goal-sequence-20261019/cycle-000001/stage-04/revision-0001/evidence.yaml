    snippet, plus 22 SUPPORTING_FIELD_VOCABULARY non-mechanistic hierarchy/measurement/observation records).
  disposition: 'Deferred (source-limited): every one of the 401 records already documents its exact literature
    limitation in an open CURATION_TODO DiscussionItem; requires full-text PDF acquisition or paid deep-research
    approval outside Stage 4/5 scope.'
