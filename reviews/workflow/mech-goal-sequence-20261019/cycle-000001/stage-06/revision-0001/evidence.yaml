- id: traitmech-infra-0003
  created_at: '2026-10-22T01:35:00Z'
  source_goal: 3:protein_examples
  status: resolved
  category: validator
  summary: Automated check for declared-vs-actual GENE_OR_PROTEIN node counts in reports/uniprot_grounding_audit.tsv
  details: 'During Stage 3 protein_examples review, 4 TraitRecord files (genomics/chromosome_organization, metabolism/D_galacturonate_utilization, metabolism/acetate_utilization, morphology/bacterial_microcompartment) had stale declared_gene_or_protein_nodes counts in reports/uniprot_grounding_audit.tsv compared to live YAML files. Extending scripts/audit_uniprot_grounding.py or scripts/audit_derived_reports.py to assert that reports/uniprot_grounding_audit.tsv covers every live GENE_OR_PROTEIN node and matches live node counts would prevent report drift.'
  issue_url: https://github.com/CultureBotAI/TraitMech/issues/1988
  disposition: Resolved in Stage 6 (`scripts/audit_uniprot_grounding.py`, `tests/test_audit_uniprot_grounding.py`, `justfile`, issue #1988) by adding `check_inventory()`, `declared_inventory_row()`, and `--check-inventory` to `scripts/audit_uniprot_grounding.py` and wiring `--check-inventory` into `just audit-derived-reports` (1,073 rows verified, 0 inventory discrepancies across 1,130 records).
- id: traitmech-infra-0004
  created_at: '2026-10-22T05:20:00Z'
  source_goal: 5:resolve_review_findings
  status: resolved
  category: validator
  summary: Automated audit for definition_source citations lacking a matching verbatim evidence snippet
  details: 'Stage 4 record review and Stage 5 remediation resolved 4 TraitRecord files (morphology/cyanophycin_granule, environment/cadmium_tolerant, environment/cobalt_tolerant, environment/zinc_tolerant, issue #1981) where definition_source had no matching EvidenceItem.source entry with a verbatim quote. Extending scripts/audit_evidence_snippets.py with an optional warning/audit flag to report records whose definition_source lacks a matching verbatim quote in evidence[] would surface definition provenance gaps automatically during curation.'
  issue_url: https://github.com/CultureBotAI/TraitMech/issues/1981
  disposition: Resolved in Stage 6 (`scripts/audit_evidence_snippets.py`, `tests/test_audit_evidence_snippets.py`, issue #1981) by adding `UNQUOTED_DEFINITION_SOURCE` warning and `--check-definition-sources` flag to `scripts/audit_evidence_snippets.py` to detect records whose `definition_source` lacks a matching non-placeholder verbatim `EvidenceItem.snippet` in `evidence[]`.
