[project]
name = "traitmech"
version = "0.1.0"
description = "Knowledge base of microbial ecophysiological traits, seeded from METPO"
authors = [
    {name = "TraitMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
# Support is the set exercised by the CI matrix and advertised by classifiers.
# Raise this bound together with both; untested future versions are not implied (#570).
requires-python = ">=3.10,<3.14"
keywords = [
    "microbiology",
    "phenotype",
    "trait",
    "metpo",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # >=1.11.1 because 1.10.0 cannot coexist with oaklib>=0.7.2: linkml 1.10.0
    # requires click<8.2, while oaklib pulls llm -> sqlite-utils, which requires
    # click>=8.3.1. The old >=1.10.0 floor named a combination that no longer
    # resolves (#562).
    "linkml>=1.11.1",
    "linkml-runtime>=1.7.0",
    # A floor at 0.7.2 or above is REQUIRED, not preferred: at 0.7.1 and below,
    # `sqlite:obo:` selectors resolve against the raw semantic-sql S3 bucket,
    # whose public access INCATools is retiring (#562). 0.7.2 introduced
    # SEMSQL_SQLITE_URL_BASE (default https://semanticsql.berkeleybop.io), with
    # OAKLIB_SEMSQL_SQLITE_URL_BASE as the escape hatch for a mirror.
    #
    # The extra step to 0.7.3 is a deliberate policy/fleet floor, not a second
    # CDN fix: 0.7.2 already changed the default, while 0.7.3 widened oaklib's
    # own Python metadata and matches CultureMech#365 (#569/#572). This project
    # now bounds support below 3.14 (#570), so 0.7.2 would be installable here;
    # retaining 0.7.3 is explicit alignment, guarded by test_oaklib_floor.py.
    "oaklib>=0.7.3",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pacmap>=0.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",  # kg_microbe_qc dashboard chart (shared generator in claw)
    # oaklib imports eutils, whose current release still imports pkg_resources;
    # setuptools 82+ removed that module. Keep the runtime import working on
    # every supported Python lane until eutils drops the legacy dependency.
    "setuptools<82",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "deep-research-client[cyberian]>=0.2.10; python_version >= '3.12'",
    # Imported directly by scripts/research_trait_edison.py and
    # scripts/enrich_edison_response.py. Both previously resolved only as
    # transitive deps of deep-research-client, so the scripts worked by accident
    # of the dependency graph and would break on a repin.
    "edison-client>=0.11.1; python_version >= '3.12'",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traitmech"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Generated by `just gen-schema` and ignored as a regenerable local artifact.
# Keep the narrow ignore for direct lint invocations against a generated copy;
# hand-fixing generator-owned imports would be overwritten on regeneration.
"src/traitmech/schema/traitmech_dataclasses.py" = ["F401"]
# Vendored byte-identical from canonical CultureBotAI/culturebotai-claw and
# guarded by vendored-sync.yaml — any local edit fails that gate. The two E741
# `l` findings are upstream's to fix, not ours: linting them here only tempts a
# drift-inducing edit. Scoped to E741 so other rules still see the file. The fix
# belongs in claw's canonical copy (#312).
"scripts/validate_id_label_correspondence.py" = ["E741"]
