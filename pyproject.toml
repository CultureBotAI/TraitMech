[project]
name = "traitmech"
version = "0.1.0"
description = "Knowledge base of microbial ecophysiological traits, seeded from METPO"
authors = [
    {name = "TraitMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "microbiology",
    "phenotype",
    "trait",
    "metpo",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "linkml>=1.10.0",
    "linkml-runtime>=1.7.0",
    "oaklib>=0.5.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pacmap>=0.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",  # kg_microbe_qc dashboard chart (shared generator in claw)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "deep-research-client[cyberian]>=0.2.4; python_version >= '3.12'",
    # Imported directly by scripts/research_trait_edison.py and
    # scripts/enrich_edison_response.py. Both previously resolved only as
    # transitive deps of deep-research-client, so the scripts worked by accident
    # of the dependency graph and would break on a repin.
    "edison-client>=0.11.1; python_version >= '3.12'",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traitmech"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Generated by `just gen-datamodel` (gen-pydantic). Its unused imports are the
# generator's output, not a defect here — hand-fixing them would be undone by
# the next regeneration, and the file is committed so ruff sees it. Scoped to
# F401 rather than excluding the file, so a real problem in generated code
# still surfaces (#312).
"src/traitmech/schema/traitmech_dataclasses.py" = ["F401"]
