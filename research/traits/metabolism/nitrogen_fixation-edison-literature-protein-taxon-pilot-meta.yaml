query: "# TraitMech Protein and Taxon Exemplar Research\n\n## Target\n\n- Trait: nitrogen fixation (traitmech:000103)\n\
  - Definition: A metabolism in which an organism reduces atmospheric dinitrogen (N2) to ammonia using\
  \ the nitrogenase enzyme complex, making fixed nitrogen biologically available (diazotrophy).\n- Existing\
  \ canonical examples: Azotobacter vinelandii (NCBITaxon:354; DOI:10.1128/mbio.02593-21)\n- Existing\
  \ gene/protein nodes: nitrogen_fixation_nitrogenase:nitrogenase [GO:0016610] | nitrogen_fixation_nitrogenase:ferredoxin/flavodoxin\
  \ [label-only] | nitrogen_fixation_nitrogenase:NifH (Fe-protein) [label-only] | nitrogen_fixation_nitrogenase:P-cluster\
  \ [label-only] | nitrogen_fixation_nitrogenase:FeMo-cofactor (M-cluster) [label-only]\n- Existing graph\
  \ summary: nitrogen_fixation_nitrogenase: 11 nodes, 10 edges\n\n## Objective\n\nDetermine whether the\
  \ existing graph for **nitrogen fixation** is mechanistic and,\nif so, identify at least one exact protein\
  \ instance whose experimentally\nsupported role and organism match one existing canonical example. The\
  \ result is\nresearch input for `data/traits/metabolism/nitrogen_fixation.yaml`.\n\n## Required Analysis\n\
  \n1. Decide `MECHANISTIC`, `NONMECHANISTIC`, or `REVIEW_NEEDED`, with a concise\n   source-backed rationale.\
  \ Do not add a token protein to a measurement,\n   classification, numeric bin, hazard class, or upper-ontology\
  \ context.\n2. For each existing gene/protein node, decide whether it denotes a molecular\n   function,\
  \ protein family, named protein, or multisubunit complex. Recommend\n   an exact GO, InterPro, NCBIfam,\
  \ or Complex Portal grounding only when its\n   definition matches. Explicitly flag broad labels that\
  \ must remain label-only\n   or be split.\n3. Select one existing canonical taxon for which a primary\
  \ paper identifies a\n   concrete protein, gene, or complex component that causally supports the\n \
  \  graph. Prefer direct genetic, biochemical, structural, or physiological\n   evidence over genome\
  \ annotation or review inference.\n4. Report the current UniProtKB primary accession for that exact\
  \ protein in the\n   same taxon. Distinguish a complex from its components: a single subunit\n   accession\
  \ is an example component and must not be described as the entire\n   complex.\n5. For every proposed\
  \ protein example, provide:\n   - protein name and gene symbol;\n   - UniProtKB primary accession;\n\
  \   - NCBITaxon identifier and scientific name;\n   - reviewed/unreviewed status, and reference-proteome\
  \ accession if unreviewed;\n   - exact role or complex-component role;\n   - primary DOI (PMID only\
  \ if no DOI exists);\n   - a short contiguous verbatim snippet from the source; and\n   - notes explaining\
  \ how the snippet supports this protein in this taxon.\n\n## Evidence Rules\n\n- Prefer primary experimental\
  \ papers with DOI citations.\n- UniProt proves identity and taxonomy, not the causal role; cite the\
  \ paper for\n  the role and use UniProt only to verify the current accession and metadata.\n- Never\
  \ infer a taxon-protein pair from two unrelated sources.\n- Mark family-only, taxon-mismatched, annotation-only,\
  \ or review-only evidence\n  uncertain and do not recommend it for direct curation.\n\n## Output\n\n\
  Return a compact scope decision, a node-grounding review table, a protein/taxon\nexample table, DOI-first\
  \ bibliography, and a final list of claims safe to\ncurate versus findings that remain uncertain.\n"
