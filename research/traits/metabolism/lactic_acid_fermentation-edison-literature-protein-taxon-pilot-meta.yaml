query: "# TraitMech Protein and Taxon Exemplar Research\n\n## Target\n\n- Trait: lactic acid fermentation\
  \ (traitmech:000026)\n- Definition: A fermentation in which sugars are converted mainly to lactate,\
  \ with ATP generated by substrate-level phosphorylation. Homolactic fermentation yields ~2 lactate per\
  \ glucose via glycolysis; heterolactic fermentation also yields ethanol/acetate and CO2. Characteristic\
  \ of lactic acid bacteria (e.g. Lactobacillus, Lactococcus).\n- Existing canonical examples: Lactococcus\
  \ lactis (NCBITaxon:1358; PMID:17307855)\n- Existing gene/protein nodes: lactic_acid_fermentation_lactate:lactate\
  \ dehydrogenase [GO:0004457]\n- Existing graph summary: lactic_acid_fermentation_lactate: 12 nodes,\
  \ 11 edges\n\n## Objective\n\nDetermine whether the existing graph for **lactic acid fermentation**\
  \ is mechanistic and,\nif so, identify at least one exact protein instance whose experimentally\nsupported\
  \ role and organism match one existing canonical example. The result is\nresearch input for `data/traits/metabolism/lactic_acid_fermentation.yaml`.\n\
  \n## Required Analysis\n\n1. Decide `MECHANISTIC`, `NONMECHANISTIC`, or `REVIEW_NEEDED`, with a concise\n\
  \   source-backed rationale. Do not add a token protein to a measurement,\n   classification, numeric\
  \ bin, hazard class, or upper-ontology context.\n2. For each existing gene/protein node, decide whether\
  \ it denotes a molecular\n   function, protein family, named protein, or multisubunit complex. Recommend\n\
  \   an exact GO, InterPro, NCBIfam, or Complex Portal grounding only when its\n   definition matches.\
  \ Explicitly flag broad labels that must remain label-only\n   or be split.\n3. Select one existing\
  \ canonical taxon for which a primary paper identifies a\n   concrete protein, gene, or complex component\
  \ that causally supports the\n   graph. Prefer direct genetic, biochemical, structural, or physiological\n\
  \   evidence over genome annotation or review inference.\n4. Report the current UniProtKB primary accession\
  \ for that exact protein in the\n   same taxon. Distinguish a complex from its components: a single\
  \ subunit\n   accession is an example component and must not be described as the entire\n   complex.\n\
  5. For every proposed protein example, provide:\n   - protein name and gene symbol;\n   - UniProtKB\
  \ primary accession;\n   - NCBITaxon identifier and scientific name;\n   - reviewed/unreviewed status,\
  \ and reference-proteome accession if unreviewed;\n   - exact role or complex-component role;\n   -\
  \ primary DOI (PMID only if no DOI exists);\n   - a short contiguous verbatim snippet from the source;\
  \ and\n   - notes explaining how the snippet supports this protein in this taxon.\n\n## Evidence Rules\n\
  \n- Prefer primary experimental papers with DOI citations.\n- UniProt proves identity and taxonomy,\
  \ not the causal role; cite the paper for\n  the role and use UniProt only to verify the current accession\
  \ and metadata.\n- Never infer a taxon-protein pair from two unrelated sources.\n- Mark family-only,\
  \ taxon-mismatched, annotation-only, or review-only evidence\n  uncertain and do not recommend it for\
  \ direct curation.\n\n## Output\n\nReturn a compact scope decision, a node-grounding review table, a\
  \ protein/taxon\nexample table, DOI-first bibliography, and a final list of claims safe to\ncurate versus\
  \ findings that remain uncertain.\n"
