  \ bin, hazard class, or upper-ontology context.\n2. For each existing gene/protein node, decide whether\
  \ it denotes a molecular\n   function, protein family, named protein, or multisubunit complex. Recommend\n\
  \   an exact GO, InterPro, NCBIfam, or Complex Portal grounding only when its\n   definition matches.\
  \ Explicitly flag broad labels that must remain label-only\n   or be split.\n3. Select one existing\
  \ canonical taxon for which a primary paper identifies a\n   concrete protein, gene, or complex component\
  \ that causally supports the\n   graph. Prefer direct genetic, biochemical, structural, or physiological\n\
  \   evidence over genome annotation or review inference.\n4. Report the current UniProtKB primary accession\
