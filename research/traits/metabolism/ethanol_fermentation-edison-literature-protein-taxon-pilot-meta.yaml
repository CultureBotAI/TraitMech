  \ [GO:0004737] | ethanol_fermentation_pyruvate_to_ethanol:alcohol dehydrogenase [GO:0004022]\n- Existing\
  \ graph summary: ethanol_fermentation_pyruvate_to_ethanol: 10 nodes, 9 edges\n\n## Objective\n\nDetermine\
