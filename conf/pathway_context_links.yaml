  links:
  - graph_id: heterotrophic_organic_carbon_assimilation
    node_id: glyoxylate_cycle
    node_label: glyoxylate cycle
    pathway: MetaCyc:GLYOXYLATE-BYPASS
    basis: 'PathwayMech context: glyoxylate cycle in Mycobacterium tuberculosis (NCBITaxon:1773).
      The shared route bypasses the decarboxylating TCA steps through isocitrate lyase
      and malate synthase. No exact equivalence or transfer of organism scope is asserted.'
  - graph_id: heterotrophic_organic_carbon_assimilation
    node_id: tca_cycle
    node_label: TCA cycle
    pathway: WikiPathways:WP296
    basis: 'PathwayMech context: TCA cycle - detailed in Saccharomyces cerevisiae
      (NCBITaxon:4932). The shared route is the oxidative tricarboxylic acid cycle;
      the linked yeast model is an example, not a universal microbial enzyme assignment.
      No exact equivalence or transfer of organism scope is asserted.'
  - graph_id: heterotrophic_organic_carbon_assimilation
    node_id: glycolysis_ppp
    node_label: glycolysis and pentose phosphate pathway
    pathway: gomodel:YeastPathways_GLYCOLYSIS
    basis: 'PathwayMech context: glycolysis I (from glucose 6-phosphate) in Saccharomyces
      cerevisiae S288C (NCBITaxon:559292). This record covers only the glycolysis
      part of the composite node, beginning at glucose 6-phosphate. No exact equivalence
      or transfer of organism scope is asserted.'
  - graph_id: heterotrophic_organic_carbon_assimilation
    node_id: glycolysis_ppp
    node_label: glycolysis and pentose phosphate pathway
    pathway: MetaCyc:OXIDATIVEPENT-PWY
    basis: 'PathwayMech context: pentose phosphate pathway (oxidative branch) I in
      Escherichia coli (NCBITaxon:562). This record covers the oxidative pentose phosphate
      branch of the composite node. No exact equivalence or transfer of organism scope
      is asserted.'
  - graph_id: heterotrophic_organic_carbon_assimilation
    node_id: glycolysis_ppp
    node_label: glycolysis and pentose phosphate pathway
    pathway: MetaCyc:NONOXIPENT-PWY
    basis: 'PathwayMech context: pentose phosphate pathway (non-oxidative branch)
      I in Escherichia coli (NCBITaxon:562). This record covers the non-oxidative
      pentose phosphate branch of the composite node. No exact equivalence or transfer
      of organism scope is asserted.'
