- path: data/traits/physiology/catalase_activity.yaml
  identifier: traitmech:000075
  links:
  - graph_id: catalase_activity_h2o2_detoxification
    node_id: heme_biosynthesis
    node_label: heme biosynthesis
    pathway: gomodel:YeastPathways_HEME-BIOSYNTHESIS-II
    basis: 'PathwayMech context: heme b biosynthesis I (aerobic) in Saccharomyces
      cerevisiae S288C (NCBITaxon:559292). This is one aerobic heme b synthesis route
      supplying catalase cofactor context; alternative bacterial heme routes and PerR/OxyR
      regulation are outside the linked record. No exact equivalence or transfer of
      organism scope is asserted.'
  - graph_id: catalase_activity_h2o2_detoxification
    node_id: catalase
    node_label: monofunctional heme catalase
    pathway: gomodel:YeastPathways_DETOX1-PWY
    basis: 'PathwayMech context: superoxide radicals degradation in Saccharomyces
      cerevisiae S288C (NCBITaxon:559292). The linked model explicitly includes CTT1
      (SGD:S000003320) catalase activity consuming hydrogen peroxide and producing
      water and dioxygen, downstream of superoxide dismutation. This link concerns
      that peroxide-removal component; it does not equate catalase with superoxide
      dismutase or extend the bacterial PerR/OxyR regulatory branches to yeast.'
  changes: Added pinned pathway context for the Ctt1 peroxide-removal component of
    the yeast detoxification model, retaining the upstream heme context and primary-source-backed
    Ctt1 example. The link explicitly distinguishes catalase chemistry from superoxide
    dismutase and bacterial regulatory branches.
  protein_example:
    graph_id: catalase_activity_h2o2_detoxification
    node_id: catalase
    expected_grounding: InterPro:IPR018028
    value:
      uniprot_id: UniProtKB:P06115
      protein_label: Catalase T
      gene_symbol: CTT1
      taxon_id: NCBITaxon:559292
      taxon_label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
      entry_status: REVIEWED
      proteome_id: UP000002311
      retrieved_on: '2026-10-05'
      entry_version: 215
      sequence_version: 3
      role: Cytosolic monofunctional heme catalase that removes hydrogen peroxide.
        Its protective activity was tested in S. cerevisiae YPH250 and BY4741 laboratory
        backgrounds in nutrient-rich YPD; this example supports the catalytic node
        only, not the bacterial PerR/OxyR branches.
      evidence:
      - reference: PMID:24563848
        snippet: Ctt1 but not Cta1 activity is strongly induced by H2O2 when cells
          are challenged in YPD
        notes: Martins and English tested CTT1 deletion and catalase activity in YPH250
          and BY4741 (Table 1). Protection depends on nutrient-rich medium and was
          lost during challenge in buffer. UniProtKB P06115 supplies the reviewed
          S288c reference protein, taxon and InterPro:IPR018028 family match; the
          experiment was not performed in the unmodified S288c reference isolate.
