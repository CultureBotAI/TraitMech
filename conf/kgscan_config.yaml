# TraitMech knowledge-gap scan config — drives kg_microbe_kgscan (in culturebotai-claw).
# Europe PMC (free) per-record gap-signal search. `just knowledge-gap-scan` (dry-run)
# emits reports/knowledge_gap_scan.{json,md}; add --apply to seed Discussions.
repo_name: TraitMech
record_glob: ../data/traits/**/*.yaml
name_fields: [label, preferred_term, name]
synonym_field: synonyms
id_field: identifier
discussions_field: discussions
topic_context_terms: ["microbial", "bacteria", "microbiome", "microorganism", "prokaryote", "archaea"]
min_score: 8
