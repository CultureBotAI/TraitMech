# Curation-priority scoring for TraitMech trait records.
#
# Shape is deliberately borrowed from DisMech's conf/mondo_prioritizer.yaml
# (monarch-initiative/dismech) so the two Mechs stay legible to the same reader:
# `weights` / `caps` / `thresholds` / `heuristics`, every component inspectable
# and retunable without touching code.
#
# The VALUES are not borrowed, and one rule is deliberately inverted. See
# `series_*` below.

# What a record is missing, weighted by how much its absence costs a consumer.
weights:
  # The trait -> organism link. Weighted highest because it is the slot that
  # makes a trait usable from KG-Microbe, and 131 CLASS records have none (#444).
  missing_canonical_examples: 30
  # A graph with no edges cannot answer anything.
  missing_causal_graph: 25
  # Present but thin. `thresholds.thin_graph_max_edges` sets the line.
  thin_causal_graph: 12
  # Fragmentation: a graph in pieces cannot answer a question that crosses them.
  per_extra_component: 3
  # Nodes asserted and then never used in an edge.
  per_orphan_node: 1
  missing_definition: 8
  missing_definition_source: 6
  missing_synonyms: 3
  missing_evidence: 10
  # A record whose edges carry no evidence at all is worse than a thin one.
  edges_without_evidence: 8

  # Bonuses (negative = deprioritise).
  already_deep: -20          # nothing obvious left to add
  deprecated: -100           # retired; never a target
  non_mechanism: -100        # predicates, datatype properties, upper ontology

caps:
  per_extra_component: 5     # 6+ components is not 3x worse than 3
  per_orphan_node: 6

thresholds:
  thin_graph_max_edges: 6
  deep_graph_min_edges: 12
  deep_graph_min_examples: 2
  # A parent with at least this many children is a candidate "curate the root
  # and let the bins inherit" case (DisMech: broad_parent_min_children: 4).
  broad_parent_min_children: 4
  # DisMech lumps a subtype series into its parent. TraitMech does NOT, unless
  # the siblings actually duplicate each other. Live sibling/parent overlap is
  # emitted by `just trait-priority` and the generated dashboard (#481), so this
  # comment cannot go stale as the corpus changes. This is the threshold above
  # which a series is redundant enough to propose lumping.
  series_lump_min_sibling_overlap: 0.60
  # Report series membership as information from this size up.
  series_min_family_size: 3

heuristics:
  # Records that cannot carry a mechanism graph. Decided by declared schema
  # fields, never by slug shape: a hand-written prefix list caught 47 of 94
  # (#427).
  non_mechanism_term_kinds:
    - OBJECT_PROPERTY
    - DATATYPE_PROPERTY
  non_mechanism_categories:
    - upper

  # Binned / graded subtype series. The named group `stem` is required, matching
  # DisMech's `subtype_series_patterns` contract.
  series_patterns:
    - "^(?P<stem>.+?)\\s+(?:very\\s+low|very\\s+high|low|high|mid\\d*)$"
    - "^(?P<stem>.+?)\\s+(?:optimum|range|delta)\\s+(?:very\\s+low|very\\s+high|low|high|mid\\d*)$"
    - "^(?P<stem>.+?),\\s*type\\s+[IVX0-9A-Za-z-]+$"

  # Bucket / scaffolding labels that are not themselves mechanisms. DisMech
  # drops these outright (`grouping_term_penalty: -28`); here they are already
  # covered by `non_mechanism_categories` for `upper`, so this list exists for
  # grouping labels that sit OUTSIDE that category.
  grouping_term_patterns:
    - "^(?:phenotype|quality|material entity|biological process)$"
    - "\\bobservation$"
