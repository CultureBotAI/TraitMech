discussions:
- discussion_id: dgtpase-activation-profile-gap
  prompt: Resolve dGTPase activation, locus boundaries, and representative enzyme
    accessions before asserting narrower component or subtype traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Tal et al. support dGTPase as a phage-responsive dGTP-depletion defense
    and DefenseFinder models the system with a custom Sp_dGTPase HMM profile, but
    this first system-level record does not resolve the universal phage sensor, activation
    route, strain-level accessions, or whether additional unmodeled components define
    some natural loci.
