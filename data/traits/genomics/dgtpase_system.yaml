identifier: traitmech:000276
label: dGTPase system
definition: A phage defense system in which an organism possesses a dGTPase locus
  that degrades dGTP into phosphate-free deoxy-guanosine during phage infection, depletes
  dGTP from the nucleotide pool, and halts phage replication by starving the phage
  of an essential DNA building block.
definition_source: DOI:10.1101/2021.04.26.441389
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: dGTPase
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1101/2021.04.26.441389
  snippet: bacteria employ a similar strategy to defend against phage infection
  notes: Tal et al. support nucleotide depletion as a bacterial anti-phage strategy.
- reference: DOI:10.1101/2021.04.26.441389
  snippet: A second family of phage resistance genes encode dGTPase enzymes, which
    degrade dGTP into phosphate-free deoxy-guanosine (dG)
  notes: Tal et al. support dGTPase genes as phage-resistance genes encoding enzymes
    that degrade dGTP.
- reference: DOI:10.1101/2021.04.26.441389
  snippet: completely eliminate the specific deoxynucleotide (either dCTP or dGTP)
    from the nucleotide pool during phage infection
  notes: Tal et al. connect dGTPase defense to dGTP nucleotide-pool elimination during
    phage infection.
- reference: DOI:10.1101/2021.04.26.441389
  snippet: starving the phage of an essential DNA building block and halting its replication
  notes: Tal et al. connect defensive deoxynucleotide depletion to phage DNA-building-block
    starvation and replication arrest.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: dGTPase | 10\.1101/2021\.04\.26\.441389 | Antiviral defense via nucleotide
    depletion in bacteria
  notes: The DefenseFinder article registry maps the named dGTPase system to the Tal
    et al. nucleotide-depletion preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "dGTPase\tdGTPase\t1\t1\tdGTPase__Sp_dGTPase"
  notes: The DefenseFinder rules table models dGTPase as a single-profile system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: dGTPase__Sp_dGTPase                              | dGTPase__Sp_dGTPase                              |
    dGTPase
  notes: The DefenseFinder HMM inventory records the custom Sp_dGTPase profile.
