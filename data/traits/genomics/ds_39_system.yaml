- graph_id: ds_39_locus_reduces_phage_plaquing
  title: DS-39 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-39 locus
    to reduced bacteriophage plaquing without resolving DS-39 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-39 as the validated AAA5 transcriptional unit
    with one product accession, high-probability AAA+ ATPase and HTH HHpred rows for
    WP_042346724.1, a moderate-probability zinc-finger HHpred row for WP_042346724.1,
    and one DefenseFinder DS-39 profile row. It does not assert exact profile-to-protein
    correspondence, AAA+ ATPase activity, HTH DNA-binding activity, zinc-finger metal-binding
    activity, native host breadth, DS-39 molecular output, complete phage breadth,
    or DefenseFinder rule-level detection criteria.
