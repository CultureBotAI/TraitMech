- graph_id: ds_20_locus_reduces_phage_plaquing
  title: DS-20 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-20 locus
    to reduced bacteriophage plaquing without resolving DS-20 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-20 as the validated PDX1 transcriptional unit
    with one product accession, a PDDEXK HHpred-domain row, and one DefenseFinder
    DS-20 profile row. It does not assert native host breadth, exact profile-to-protein
    correspondence, DS-20 molecular activity, trigger, substrate, complete phage breadth,
    or DefenseFinder rule-level detection criteria.
