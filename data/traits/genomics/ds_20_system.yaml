    and final Science Tables S6/S7/S8 map it to product accession WP_032291790.1,
    a Bas3 phage readout, display name DS-20, and a PDDEXK HHpred row. The pinned
    DefenseFinder HMM inventory records one DS-20 custom profile row. The pinned rules
    table has no DS-20 row, and the first-pass record does not resolve native host
    breadth, complete phage breadth, direct profile-to-protein correspondence, PDDEXK
    nuclease activity, molecular output, or endogenous DS-20 activity.
