identifier: traitmech:000502
label: Metis system
definition: A phage defense system in which an organism possesses a Metis locus that
  senses phage-mediated host-genome degradation through N6-methyl-deoxyadenosine monophosphate
  and activates a type-specific toxic effector.
definition_source: DOI:10.1126/science.aed6782
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Metis
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1126/science.aed6782
  snippet: In this work, we describe Metis, a bacterial defense system that directly
    senses phage-mediated host genome degradation.
  notes: Osterman et al. directly name Metis as a bacterial system sensing host-genome
    degradation during phage infection.
- reference: DOI:10.1126/science.aed6782
  snippet: Metis aborts phage infection once it detects the modified mononucleotide
    N6-methyl-deoxyadenosine monophosphate (m6dAMP).
  notes: Osterman et al. identify m6dAMP as the modified mononucleotide cue detected
    by Metis.
- reference: DOI:10.1126/science.aed6782
  snippet: As methylation of deoxyadenosines usually occurs on the DNA polymer, accumulation
    of m6dAMP signals that the host genome has been degraded.
  notes: Osterman et al. explain why free m6dAMP reports host-genome degradation.
- reference: DOI:10.1126/science.aed6782
  snippet: In type I Metis, sensing of m6dAMP activates a nicotinamide adenine dinucleotide
    (NAD+) diphosphatase, leading to NAD+ depletion and cessation of the infection
    process, whereas the effector in type II Metis is a membrane-spanning protein
    whose toxicity is triggered in response to the modified mononucleotide.
  notes: Osterman et al. distinguish type I and type II Metis effectors without resolving
    a DefenseFinder rule-level model in the pinned registry.
- reference: DOI:10.1126/science.aed6782
  snippet: We further show that Metis defense depends on endogenous DNA methylases
    and that phages can escape Metis through mutations that inactivate host genome
    degradation.
  notes: Osterman et al. link Metis immunity to endogenous DNA methylases and to phage
    genome-degradation activity.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Metis | 10\.1101/2025\.11\.05\.686725 | Bacteria sense virus-induced
    genome degradation via methylated mononucleotides | '
  notes: The pinned DefenseFinder article registry maps the named Metis system to
    the Osterman et al. preprint.
