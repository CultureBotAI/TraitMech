  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Osterman et al. support Metis as a bacterial defense system that senses
    m6dAMP from phage-mediated host-genome degradation and activates type-specific
    toxic effectors. The pinned DefenseFinder article registry maps the Metis source
