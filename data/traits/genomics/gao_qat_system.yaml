discussions:
- discussion_id: gao-qat-mechanism-gap
  prompt: Resolve Gao_Qat natural hosts, Qat component functions, phage triggers,
    and effector activity before minting narrower Gao_Qat mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes that mediate protection
    against specific bacteriophages, and DefenseFinder models Gao_Qat as a four-profile
    system. The exact natural host breadth, QatA/QatB/QatC/QatD component identities,
    phage trigger, and profile-to-activity mapping remain unresolved.
