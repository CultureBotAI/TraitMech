identifier: traitmech:000426
label: DS-3 system
definition: A phage defense system in which an organism possesses the one-gene DefensePredictor-discovered
  system 3 locus cataloged as working transcriptional unit PIN8 and whose plasmid
  expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
