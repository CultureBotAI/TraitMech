evidence:
- reference: DOI:10.1126/science.adv7924
  snippet: To test for anti-phage defense, we placed each TU with its predicted native
    promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
    these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
    total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
    the efficiency of plating (EOP) at least ten-fold relative to an empty vector
    control strain
  notes: DeWeirdt et al. experimentally validated 42 predicted transcriptional units
    as phage-defense systems in E. coli.
- reference: DOI:10.1126/science.adv7924
  snippet: We refer to these validated TUs as DefensePredictor discovered systems
    (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g., DS-8A
    is the first gene of DS-8.
  notes: DeWeirdt et al. name validated transcriptional units as DefensePredictor
    discovered systems.
- reference: DOI:10.1126/science.adv7924
  snippet: DS-3 is a one-protein system with a PIN ribonuclease domain split between
    its N and C-terminus
  notes: DeWeirdt et al. describe DS-3 as a one-protein PIN ribonuclease-domain system.
- reference: DOI:10.1126/science.adv7924
  snippet: When we mutated catalytic residues in DS-3, the system no longer defended
    against phage, suggesting this domain is essential for protection.
  notes: DeWeirdt et al. report that mutating predicted catalytic residues removed
    DS-3-mediated phage defense.
- reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
  snippet: "PIN8\tNZ_RRWT01000005.1\tGCF_003892645.1\t+\tTrue\tFalse\tFalse\tTrue\t\
    DefensePredictor hits\t244326\t245348\thypothetical protein\tWP_022645725.1\t\
    8.909458355458062\t-2.350827761940385\tTrue\tFalse\tPredicted novel defense gene\t\
    DS-3"
  notes: The final Science supplementary Table S6 maps working_id PIN8 to DS_name
    DS-3, marks the cloned transcriptional unit as defensive, and records NZ_RRWT01000005.1
    positions 244326-245348 with product accession WP_022645725.1.
