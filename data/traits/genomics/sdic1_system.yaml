identifier: traitmech:000420
label: SDIC1 system
definition: A phage defense system in which an organism possesses an SDIC1 locus encoding
  a TIR-domain SDIC1A component and a ubiquitin-ligase-like SDIC1B component that
  can provide population-wide immunity against bacteriophages.
