discussions:
- discussion_id: sdic1-defensefinder-model-gap
  prompt: Resolve SDIC1 natural host breadth, SDIC1A/SDIC1B component functions, phage
    triggers, ubiquitination substrates, population-immunity mechanism, and rule-level
    detection criteria before minting narrower SDIC1 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Cummins et al. support SDIC1 as a TIR-domain-containing anti-phage system
    with a ubiquitin-ligase-like component, and the pinned DefenseFinder HMM inventory
    records SDIC1A and SDIC1B profile rows. The pinned rules table has no SDIC1 row,
    and the first-pass record does not resolve natural host breadth, sensitive-phage
    breadth, the exact profile-to-component mapping, phage triggers, the direct TIR-dependent
    output, or the ubiquitination substrate.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.115055
    snippet: previously unreported Toll/interleukin (IL)-1 receptor (TIR)-domain-containing
      system with population-wide immunity
    notes: Cummins et al. support SDIC1 as a TIR-domain anti-phage system with a population-level
      output.
  - reference: DOI:10.1016/j.celrep.2024.115055
    snippet: SDIC1 combines TIR and ubiquitin ligase
    notes: Cummins et al. connect SDIC1 with a TIR domain and a ubiquitin-ligase-like
      component.
