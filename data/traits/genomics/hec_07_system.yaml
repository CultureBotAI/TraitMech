identifier: traitmech:000478
label: HEC-07 system
definition: A phage defense system in which an organism possesses the single-gene
  HEC-07 Hma-embedded candidate locus, encoding a RelE domain-containing protein,
  that can reduce bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
