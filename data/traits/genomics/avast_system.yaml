  scope_status: NONMECHANISTIC
  scope_notes: The graph stays at the AVAST-family level and does not assert that
    all Avs subtypes detect the same phage protein, carry the same nuclease or Sir2-like
    effector domain, act on the same molecular substrate, or inhibit the same class
    of phages.
