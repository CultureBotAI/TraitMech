discussions:
- discussion_id: avast-subtype-effector-gap
  prompt: Resolve AVAST subtype sensors, phage triggers, and effector outputs before
    minting narrower Avs1-Avs5 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support phage-protein pattern recognition by Avs1 through
    Avs4, while Muralidharan et al. support Avs5 immunity against nucleus-forming
    jumbo phages through phage-triggered Sir2-like effector activation. The first
    TraitRecord therefore stays at the AVAST-system level until separate review resolves
    which phage cues, effector domains, and antiviral substrates generalize across
    AVAST loci.
