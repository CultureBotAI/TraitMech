identifier: traitmech:000239
label: AVAST system
definition: A phage defense system in which an organism possesses a locus encoding
  a STAND-superfamily antiviral ATPase/NTPase that functions as a modular Avs receptor-effector,
  recognizes conserved bacteriophage proteins, and activates subtype-specific antiphage
  outputs to inhibit bacteriophage replication.
definition_source: DOI:10.1126/science.aba0372
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: antiviral ATPase/NTPase of the STAND superfamily system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.aba0372
- synonym_text: antiviral STAND system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.aba0372
evidence:
- reference: DOI:10.1126/science.aba0372
  snippet: AVAST, antiviral ATPase/NTPase of the STAND superfamily
  notes: Gao et al. coined AVAST as a recurring antiviral STAND ATPase/NTPase defense-system
    family in their pangenome-scale antiphage-system discovery screen.
- reference: DOI:10.1126/science.abm4096
  snippet: Avs1 to Avs3 recognize the large terminase subunit, and Avs4 recognizes
    the portal
  notes: Gao et al. characterized Avs1 through Avs4 as prokaryotic STAND-family innate
    immune receptors that detect conserved phage proteins and trigger subtype-specific
    antiviral effector outputs.
- reference: DOI:10.1016/j.molcel.2026.01.004
  snippet: AVAST type 5 (Avs5) systems, part of the signal transduction ATPases of
    numerous domains (STAND) superfamily, confer conserved immunity against jumbo
    phages
  notes: Muralidharan et al. extend the named AVAST family with Avs5 systems that
    defend against nucleus-forming jumbo phages.
- reference: DOI:10.1016/j.molcel.2026.01.004
  snippet: Recognition of phage infection triggers the Sir2-like effector domain of
    Avs5 across three Avs5 clades
  notes: Muralidharan et al. support a subtype-specific Avs5 effector activation mechanism
    downstream of phage infection sensing.
canonical_examples:
- taxon_id: NCBITaxon:287
  taxon_label: Pseudomonas aeruginosa
  note: Muralidharan et al. characterized the Pseudomonas aeruginosa Avs5-1 system
    and showed that its Sir2-like effector domain is activated during jumbo-phage
    infection.
  reference: DOI:10.1016/j.molcel.2026.01.004
causal_graphs:
