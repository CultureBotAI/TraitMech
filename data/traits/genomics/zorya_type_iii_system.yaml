label: Zorya type III system
definition: A Zorya system in which an organism possesses a locus encoding ZorA and
  ZorB together with ZorF and ZorG.
definition_source: DOI:10.1093/nar/gkab883
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
