synonyms:
- synonym_text: Zorya type III
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkab883
evidence:
- reference: DOI:10.1093/nar/gkab883
  snippet: our data demonstrate activity of the Zorya type III system comprised of
    ZorA, ZorB, ZorF and ZorG
  notes: 'Payne et al., Discussion and Figure 2C: the four-component architecture
    is ZorF/ZorA/ZorB/ZorG. The Results paragraph instead says zorBC; that wording
    conflicts with the figure and Discussion and is not used as the component definition.
    Methods identify the natural source as Stenotrophomonas nitritireducens DSM 12575,
    NZ_LDJG01000021.1. Figure 3 assays tested the cloned system in E. coli BL21-AI,
    not native defense in DSM 12575. The proposed regulatory roles of ZorF/ZorG are
    hypotheses, not demonstrated chemistry.'
- reference: DOI:10.1038/s41467-025-57397-2
  snippet: Zorya III instead encodes a DUF3348 domain protein (ZorF) and a DUF2894
    domain protein (ZorG)
  notes: Mariano et al., Introduction and Figure 1a/b, independently retain ZorA/ZorB
    as the shared core and ZorF/ZorG as the type-III distinguishing components, citing
    Payne for the classification. Their mechanistic experiments concern types I and
    II; these do not demonstrate a type-III ion substrate, nuclease activity, phage
    trigger or death pathway.
- reference: https://raw.githubusercontent.com/padlocbio/padloc-db/9e380165633a8d6aef93b5a164cea0f3359bd33f/sys/zorya_type_III.yaml
  snippet: "core_genes:\n  - ZorA3\n  - ZorB3\n  - ZorF3\n  - ZorG3"
  notes: 'Pinned executable PADLOC rule, retrieved 2026-10-03: minimum_core and minimum_total
    are both 4, maximum_separation is 0, and force_strand is FALSE. There are no additional
    secondary, neutral or prohibited profiles. These are detection constraints, not
    evidence for biological essentiality or activity of every predicted locus.'
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/definitions/DefenseFinder/Zorya/Zorya_TypeIII.xml
  snippet: <model inter_gene_max_space="5" min_mandatory_genes_required="3" min_genes_required="3"
    vers="2.0">
  notes: 'Pinned executable DefenseFinder model, retrieved 2026-10-03: four mandatory
    slots are Zorya__ZorA2 (exchangeable with Zorya__ZorA), Zorya__ZorB, Zorya_III__ZorG3
    and Zorya_III__ZorF3, but the minimum counts are only 3. A detector call therefore
    does not by itself establish all four biological components; inspect the complete
    locus. The raw detector key is not an exact trait synonym.'
canonical_examples:
- taxon_id: NCBITaxon:83617
  taxon_label: Stenotrophomonas nitritireducens
  reference: DOI:10.1093/nar/gkab883
  note: Payne et al. amplified the type-III system from DSM 12575 genomic DNA, accession
    NZ_LDJG01000021.1. NCBI independently resolves that accession to this species,
    taxon 83617, and strain DSM 12575. This example is limited to natural possession
    by the named strain, not species-wide possession or a native-host protection assay.
    The paper tested a plasmid-borne construct in E. coli BL21-AI, which naturally
    lacked the system.
discussions:
- discussion_id: zorya-type-iii-component-and-mechanism-scope
  prompt: Resolve type-III component roles without transferring type-I/II mechanisms.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The accepted architecture follows Payne Figure 2C and Discussion plus
    Mariano Figure 1 and Introduction, not Payne's conflicting Results wording or
    a detector key alone. ZorF/ZorG regulation of ZorAB is a proposal; no direct component-resolved
    mechanism is asserted here. Neither type-I phage-DNA degradation nor type-II ZorE
    nickase activity is assigned to type III. The ion substrate, activation trigger,
    native-host activity, individual component dependence and antiviral breadth remain
    open. The four-component definition is not weakened to match DefenseFinder's three-match
    threshold, and a missing hit or incomplete assembly is not proof of biological
    component absence. Multiple subtype loci may coexist in a genome; no organism-level
    disjointness is asserted. No mechanistic graph or protein examples are added without
    accession-resolved functional evidence.
  posed_by: codex
  posed_date: '2026-10-03'
