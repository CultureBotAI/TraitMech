    to reduced bacteriophage plaquing without resolving DS-40 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-40 as the validated D295 transcriptional unit
    with one product accession, one moderate-probability DUF6680 HHpred row for WP_097419291.1,
