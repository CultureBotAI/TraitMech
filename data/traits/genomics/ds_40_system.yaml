    and final Science Tables S6/S7/S8 map it to one product accession, a Bas26 phage
    readout, display name DS-40, and a moderate-probability DUF6680 HHpred row. The
    pinned DefenseFinder HMM inventory records one DS-40 custom profile row. The pinned
    rules table has no DS-40 row, and the first-pass record does not resolve native
    host breadth, complete phage breadth, direct profile-to-protein correspondence,
    DUF6680 activity, molecular output, or endogenous DS-40 activity.
