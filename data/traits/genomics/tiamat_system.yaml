discussions:
- discussion_id: tiamat-mechanism-gap
  prompt: Resolve Tiamat phage triggers and effector outputs before minting narrower
    Tiamat mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Tiamat as a named anti-phage
    system with a TmtA profile, but the trigger, molecular substrate, antiviral effector
    output, and subtype-specific mechanism are not resolved enough here to assert
    a narrower mechanistic child trait.
