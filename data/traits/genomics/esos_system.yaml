identifier: traitmech:000282
label: Esos system
definition: A phage defense system in which an organism possesses an Esos locus represented
  by a VCA0450 profile that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1126/science.ads0768
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
