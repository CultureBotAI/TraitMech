discussions:
- discussion_id: esos-mechanism-gap
  prompt: Resolve Esos phage triggers and effector outputs before minting narrower
    Esos mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Esos as a named anti-phage system
    with a VCA0450 profile, but the trigger, molecular substrate, antiviral effector
    output, and subtype-specific mechanism are not resolved enough here to assert
    a narrower mechanistic child trait.
