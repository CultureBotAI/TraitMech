  snippet: nearly 10% of the integron cassettes in the pandemic Vibrio cholerae strain
    encode novel antiphage functions
  notes: Darracq et al. support treating the newly discovered Vibrio cholerae SCI
    antiphage cassettes as bacterial anti-phage systems.
- reference: DOI:10.1126/science.ads0768
  snippet: Most of these novel systems have little or no similarity to previously
    known ones, with several providing defense through cell lysis or growth arrest
  notes: Darracq et al. support a conservative system record that does not assert
    a resolved Esos trigger, effector output, or universal pathway.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
