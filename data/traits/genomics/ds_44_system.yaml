identifier: traitmech:000475
label: DS-44 system
definition: A phage defense system in which an organism possesses a genome-encoded
  DefensePredictor-discovered system 44 locus represented in the pinned DefenseFinder
  model inventory by the DS-44 custom HMM profile.
definition_source: DOI:10.1101/2025.01.08.631726
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: DS-44
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: DS-44__DS-44
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1101/2025.01.08.631726
  snippet: To test for anti-phage defense, we placed each TU with its native promoter
    region on a low-copy number plasmid in E. coli MG1655 and then challenged these
    strains with a panel of 24 diverse E. coli phages (fig. S2). In total, 45 (42%
    of 106) of the cloned TUs produced smaller plaque sizes or reduced the efficiency
    of plating (EOP) at least ten-fold relative to an empty vector control strain
  notes: DeWeirdt et al. experimentally validated 45 predicted transcriptional units
    as phage-defense systems in E. coli; the first-pass DS-44 record uses this source
    only for the DefensePredictor DS naming context, not for an exact DS-44 phage
    readout.
- reference: DOI:10.1101/2025.01.08.631726
  snippet: We refer to these validated TUs as DefensePredictor discovered Systems
    (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g., DS-8A
    is the first gene of DS-8.
  notes: DeWeirdt et al. name validated transcriptional units as DefensePredictor
    discovered Systems.
- reference: DOI:10.1101/2025.01.08.631726
  snippet: To begin elucidating the function of the 45 validated TUs, we further annotated
    their protein domains (see Methods; table S6).
  notes: DeWeirdt et al. describe Table S6 as a protein-domain annotation table for
    the validated DS transcriptional units; the exact preprint DS-44 row was not recovered
    in this curation pass.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| DS-44 | 10\.1101/2025\.01\.08\.631726 | DefensePredictor: A machine
    learning model to discover novel prokaryotic immune systems | '
  notes: The pinned DefenseFinder article registry maps the DS-44 source key to the
    DeWeirdt et al. DefensePredictor preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| DS-44__DS-44                                     |                                                  |
    DS-44                  | Custom                  | 200    |'
  notes: The pinned DefenseFinder HMM inventory records DS-44__DS-44 as a custom DS-44
    profile.
