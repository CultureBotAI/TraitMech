    checked during this curation pass, the exact preprint per-TU row was not recovered,
    the pinned DefenseFinder rules table has no DS-44 row, and the first-pass record
    does not resolve the working identifier, assayed phages, phage readout, native
    host, profile-to-component mapping, component activities, or complete detection
    criteria.
