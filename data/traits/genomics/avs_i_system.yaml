discussions:
- discussion_id: avs-i-component-and-effector-gap
  prompt: Resolve Avs1A, Avs1B, and Avs1C component roles, direct effector chemistry,
    exact phage-trigger mapping, native host breadth, and sensitive-phage breadth
    before minting Avs I mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support Avs1 phage-protein recognition and Avs activation
    during antiviral defense, and the pinned DefenseFinder HMM inventory and rules
    table support Avs_I as a subtype I model with Avs1A, Avs1B, and Avs1C profiles.
    This first-pass record leaves the exact component functions, downstream effector
    chemistry, native host breadth, sensitive-phage breadth, and profile-to-activity
    requirements unresolved.
