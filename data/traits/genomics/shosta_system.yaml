discussions:
- discussion_id: shosta-mechanism-gap
  prompt: Resolve ShosTA phage triggers and effector outputs before minting narrower
    ShosTA mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support ShosTA as a named anti-phage
    system with required ShosA and ShosT profiles, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
