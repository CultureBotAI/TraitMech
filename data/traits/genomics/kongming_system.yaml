discussions:
- discussion_id: kongming-profile-host-and-component-gap
  prompt: Resolve Kongming natural host breadth, exact locus composition, phage nucleotide-kinase
    inputs, KomA/KomB/KomC profile boundaries, and DefenseFinder HMM/rule coverage
    before minting narrower Kongming mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Zeng et al. support a bacterial antiphage system that uses system-encoded
    adenosine deaminase and phage nucleotide kinases to produce dITP messengers, and
    Li et al. connect the named Kongming system to dITP-driven activation of the KomBC
    NADase effector. The pinned DefenseFinder article registry maps the Kongming source
    key to the Zeng et al. Science paper, but the pinned HMM inventory and rules table
    have no exact Kongming rows. This first-pass record therefore does not resolve
    the complete locus model, direct HMM/profile mapping, or native host breadth.
  evidence:
  - reference: DOI:10.1126/science.ads6055
    snippet: Immunity is triggered by phage nucleotide kinases, which, combined with
      the system-encoded adenosine deaminase, produce deoxyinosine triphosphates (dITPs)
