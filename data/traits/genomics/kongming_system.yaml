identifier: traitmech:000501
label: Kongming system
definition: A phage defense system in which an organism possesses a Kongming locus
  that uses phage-triggered deoxyinosine triphosphate signaling to activate a KomBC
  effector complex and mediate NAD depletion-linked death of infected cells.
definition_source: DOI:10.1126/science.ads6055
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Kongming
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: Kongming system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-026-74710-9
- synonym_text: Kongming immune system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-026-74710-9
evidence:
- reference: DOI:10.1126/science.ads6055
  snippet: In this study, we reveal a bacterial antiphage system that mediates immune
    signaling through nucleobase modification.
  notes: Zeng et al. describe the Science Kongming paper's antiphage system as a nucleobase-modification
    immune-signaling pathway.
- reference: DOI:10.1126/science.ads6055
  snippet: Immunity is triggered by phage nucleotide kinases, which, combined with
    the system-encoded adenosine deaminase, produce deoxyinosine triphosphates (dITPs)
    as immune messengers.
  notes: Zeng et al. connect phage-triggered Kongming immunity to system-dependent
    production of dITP immune messengers.
- reference: DOI:10.1126/science.ads6055
  snippet: The dITP signal activates a downstream effector to mediate depletion of
    cellular nicotinamide adenine dinucleotide (oxidized form), resulting in population-level
    defense through the death of infected cells.
  notes: Zeng et al. place dITP upstream of an effector that depletes NAD and drives
    infected-cell death.
- reference: DOI:10.1038/s41467-026-74710-9
  snippet: One of them is the Kongming system, which includes an effector complex
    (KomBC), composed of a non-canonical purine NTP pyrophosphatase (KomB) and a SIR2
    domain-containing protein (KomC).
  notes: Li et al. name the Kongming effector complex and its KomB and KomC components.
- reference: DOI:10.1038/s41467-026-74710-9
  snippet: The Kongming system is activated by an atypical signaling nucleotide, dITP,
    generated upon phage infection.
  notes: Li et al. describe dITP as a phage-infection-generated Kongming activation
    signal.
- reference: DOI:10.1038/s41467-026-74710-9
  snippet: Binding of dITP to KomB initiates progressive conformational rearrangements
    within the filament, ultimately remodeling the filament into a distinct architecture
    in which KomC adopts an active conformation with NADase activity.
  notes: Li et al. connect dITP-bound KomB to activation of KomC NADase activity within
    the Kongming KomBC effector complex.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Kongming | 10\.1126/science\.ads6055 | Base-modified nucleotides mediate
    immune signaling in bacteria | '
  notes: The pinned DefenseFinder article registry maps the named Kongming system
    to the Zeng et al. Science paper.
