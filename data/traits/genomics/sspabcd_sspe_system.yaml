  title: SspABCD-SspE systems couple Ssp PT marks to DNA nicking
  description: Evidence-backed process sketch linking an SspABCD-SspE locus to single-stranded
    host DNA phosphorothioation, SspE PT-site recognition, SspE GTPase-linked nuclease
    activation, and reduced phage DNA replication.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures SspABCD-SspE restriction at the system level without
    asserting one universal host taxon, PT frequency, DNA motif outside 5'-CPSCA-3'-characterized
    systems, full SspE conformational cycle, or relationship to SspFGH and archaeal
    PT antiviral systems.
