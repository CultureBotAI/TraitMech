identifier: traitmech:000222
label: SspABCD-SspE system
definition: A phosphorothioate defense system in which an organism possesses an SspABCD-SspE
  locus that pairs an SspABCD single-stranded DNA phosphorothioation module with the
  SspE restriction enzyme to sense host phosphorothioate marks and nick invading DNA.
definition_source: DOI:10.1038/s41564-020-0700-6
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000213
synonyms:
- synonym_text: SspABCD-SspE PT system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41564-020-0700-6
evidence:
- reference: DOI:10.1038/s41564-020-0700-6
  snippet: Here, we describe an unusual SspABCD-SspE PT system in Vibrio cyclitrophicus,
    Escherichia coli and Streptomyces yokosukanensis
  notes: Xiong et al. name SspABCD-SspE as a bacterial phosphorothioation system distinct
    from Dnd.
- reference: DOI:10.1038/s41564-020-0700-6
  snippet: SspABCD confers single-stranded and high-frequency PTs with SspB acting
    as a nickase
  notes: Xiong et al. support the SspABCD modification module and its single-stranded
    high-frequency PT output.
- reference: DOI:10.1038/s41564-020-0700-6
  snippet: SspABCD coupled with SspE provides protection against phages
  notes: Xiong et al. support the modification-plus-restriction architecture and the
    antiphage output of SspABCD-SspE.
- reference: DOI:10.1038/s41467-022-34505-0
  snippet: In the PT-based defense system Ssp, SspABCD confers a single-stranded PT
    modification of host DNA
  notes: Gao et al. support Ssp as a PT-based defense system with host-DNA phosphorothioation
    by SspABCD.
- reference: DOI:10.1038/s41467-022-34505-0
  snippet: SspE relies on PT modification in host DNA to exert antiphage activity
  notes: Gao et al. connect host PT modification to SspE-mediated antiphage activity.
- reference: DOI:10.1128/mbio.00933-23
  snippet: a novel PT-related R-M system, composed of the modification module SspABCD
    paired with a single restriction enzyme, SspE
  notes: Jiang et al. support defining this child by the SspABCD modification module
    paired with single-enzyme SspE restriction, separate from DndFGH and SspFGH systems.
