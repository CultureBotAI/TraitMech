  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "Avs\tAvs_II\t1\t1\tAvs_II__Avs2A\t\t\t"
    notes: The pinned DefenseFinder rules table models Avs_II as an Avs subsystem
      with an Avs2A profile.
