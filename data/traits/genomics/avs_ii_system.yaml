discussions:
- discussion_id: avs-ii-component-and-effector-gap
  prompt: Resolve the Avs2A component role, direct effector chemistry, exact phage-trigger
    mapping, native host breadth, and sensitive-phage breadth before minting Avs II
    mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support Avs2 phage-protein recognition and Avs activation
    during antiviral defense, and the pinned DefenseFinder HMM inventory and rules
    table support Avs_II as a subtype II model with an Avs2A profile. This first-pass
    record leaves the exact component role, downstream effector chemistry, native
    host breadth, sensitive-phage breadth, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1126/science.abm4096
    snippet: Avs1 to Avs3 recognize the large terminase subunit, and Avs4 recognizes
      the portal
    notes: Gao et al. support Avs2 as a phage-protein-sensing member of the AVAST
      receptor family.
  - reference: DOI:10.1126/science.abm4096
    snippet: In all four cases, target recognition led to Avs protein activation and
      antiviral activity
    notes: Gao et al. connect Avs1 through Avs4 target recognition to Avs activation
      and antiviral activity.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| Avs_II__Avs2A                                    | Avs_II__Avs2A                                    |
      Avs_II                 | Custom                  | 100    |'
    notes: The pinned DefenseFinder HMM inventory records Avs_II__Avs2A under the
