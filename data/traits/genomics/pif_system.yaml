  description: Conservative system-level sketch linking an F-plasmid pif-family locus
    to T7 abortive infection and Pif-system possession without asserting the direct
    phage trigger, host-cell output, or PifA/PifC molecular targets.
  scope_status: NONMECHANISTIC
