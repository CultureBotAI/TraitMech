discussions:
- discussion_id: pif-output-gap
  prompt: Resolve the direct T7 trigger, PifA and PifC molecular functions, host-cell
    output, and phage escape routes before minting narrower Pif mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Cram et al. support an F-plasmid pif-region abortive-infection system
    that maps to a two-profile DefenseFinder model, but the direct T7 trigger, the
    molecular functions of PifA and PifC, the host-cell growth-arrest or cell-death
    output, and phage escape routes remain unresolved.
  attaches_to:
  - causal_graphs#pif_locus_specifies_t7_abortive_infection
  posed_by: codex
  posed_date: '2026-09-21'
