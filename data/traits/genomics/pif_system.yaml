identifier: traitmech:000323
label: Pif system
definition: An abortive infection system in which an organism possesses an F-plasmid
  pif-family locus represented by the DefenseFinder Pif__PifA and Pif__PifC profiles
  and exemplified by the pif region that specifies abortive infection of T7 phage.
definition_source: DOI:10.1007/BF00327934
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: Pif
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:6096670
  snippet: Molecular analysis of F plasmid pif region specifying abortive infection
    of T7 phage.
  notes: Cram et al. title the paper around F-plasmid pif-region specification of
    the T7 abortive-infection phenotype.
- reference: DOI:10.1007/BF00327934
  snippet: We report the molecular cloning of the pif region of the F plasmid and
    its physical dissection by subcloning and deletion analysis.
  notes: Cram et al. cloned and deletion-mapped the F-plasmid pif region.
- reference: DOI:10.1007/BF00327934
  snippet: Examination of the polypeptide products synthesized in maxicells by plasmids
    carrying defined pif sequences has shown that the region specifies at least two
    proteins of molecular weights 80,000 and 40,000, the genes for which appear to
    lie in the same transcriptional unit.
  notes: Cram et al. support a multigene pif region without resolving a direct PifA
    or PifC molecular function.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Pif | 10\.1007/BF00327934 | Molecular analysis of F plasmid pif region
    specifying abortive infection of T7 phage
  notes: The DefenseFinder article registry maps the named Pif model namespace to
    the F-plasmid pif-region molecular analysis paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Pif\tPif\t2\t2\tPif__PifA, Pif__PifC"
  notes: The DefenseFinder rules table models Pif as a two-component system requiring
    both the Pif__PifA and Pif__PifC profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Pif__PifA                                        | Pif__PifA                                        |
    Pif                    | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records Pif__PifA under Pif.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Pif__PifC                                        | Pif__PifC                                        |
    Pif                    | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records Pif__PifC under Pif.
