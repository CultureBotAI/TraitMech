identifier: traitmech:000388
label: PD-T4-3 system
definition: A phage defense system in which an organism possesses a PD-T4-3 locus
  represented by DefenseFinder as a single-profile model, PD-T4-3__PD-T4-3, and experimentally
  linked to T2, T4, and T6 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-3.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T4-3
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-3.md
- synonym_text: PD-T4-3__PD-T4-3
