discussions:
- discussion_id: pd-t4-3-mechanism-gap
  prompt: Resolve PD-T4-3 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-T4-3 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T4-3 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T2, T4, and T6, and DefenseFinder represents
    the system with one mandatory profile. Natural host breadth, the direct phage
    trigger, and effector logic remain unresolved.
