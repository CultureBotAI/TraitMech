  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T4-3 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-3.md
  snippet: PD-T4-3 is a single gene system isolated during an experimental screen
    of fosmids derived from 71 strains of diverse *E.coli*, and cloned back in a derivative
    of K12.
  notes: The DefenseFinder wiki describes PD-T4-3 as a single-gene system isolated
    from the Vassallo et al. fosmid screen.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-3.md
  snippet: 'The PD-T4-3 is composed of 1 protein: PD-T4-3.'
  notes: The DefenseFinder wiki names PD-T4-3 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-3.md
  snippet: 'The PD-T4-3 system in *Morganella morganii* (GCF_018802485.1, NZ_CP064826)
    is composed of 1 protein: PD-T4-3 (WP_214179544.1)'
  notes: The DefenseFinder wiki illustrates a predicted PD-T4-3 locus in RefSeq assembly
    GCF_018802485.1 on NZ_CP064826.
