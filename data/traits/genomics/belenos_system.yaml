discussions:
- discussion_id: belenos-mechanism-gap
  prompt: Resolve Belenos phage triggers and effector outputs before minting narrower
    Belenos mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Belenos as a named anti-phage
    system with a VCA0457 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
