    and final Science Tables S6/S7/S8 map it to one product accession, Bas25 and Bas19
    phage readouts, display name DS-38, and high-probability HEPN and zinc-finger
    HHpred rows. The pinned DefenseFinder HMM inventory records one DS-38 custom profile
    row. The pinned rules table has no DS-38 row, and the first-pass record does not
    resolve native host breadth, complete phage breadth, direct profile-to-protein
    correspondence, HEPN ribonuclease activity, zinc-finger DNA-binding activity,
    molecular output, or endogenous DS-38 activity.
