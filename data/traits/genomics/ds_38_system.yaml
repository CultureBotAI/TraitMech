  title: DS-38 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-38 locus
    to reduced bacteriophage plaquing without resolving DS-38 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-38 as the validated HEP2 transcriptional unit
    with one product accession, high-probability zinc-finger and HEPN HHpred rows
    for WP_001313577.1, and one DefenseFinder DS-38 profile row. It does not assert
    exact profile-to-protein correspondence, HEPN ribonuclease activity, zinc-finger
    DNA-binding activity, native host breadth, DS-38 molecular output, complete phage
    breadth, or DefenseFinder rule-level detection criteria.
