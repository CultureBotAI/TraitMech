discussions:
- discussion_id: menshen-mechanism-gap
  prompt: Resolve Menshen phage triggers and effector outputs before minting narrower
    Menshen mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Menshen as a named anti-phage
    system with NsnA, NsnB, and NsnC profile choices, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
