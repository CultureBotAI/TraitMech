evidence:
- reference: DOI:10.1038/nrmicro3331
  notes: Batut et al. review reductive genome evolution, linking genome size to population
    size and lifestyle across prokaryotes.
- reference: DOI:10.1038/ismej.2014.60
  notes: Giovannoni et al. discuss streamlining theory and the small genomes of abundant
    free-living microbes.
