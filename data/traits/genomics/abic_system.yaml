discussions:
- discussion_id: abic-trigger-and-death-route-gap
  prompt: Resolve the AbiC phage trigger, AbiC molecular function, and infected-cell
    death route before minting narrower AbiC mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Durmaz et al. support AbiC as a named lactococcal abortive-infection
    determinant that reduces p2 plating, plaque size, and burst size while killing
    most Prf-positive infected cells. DefenseFinder represents AbiC with a one-profile
    rule, but this first system-level record leaves the phage trigger, AbiC molecular
    function, cell-death route, natural locus breadth, and phage escape routes unresolved.
  attaches_to:
  - causal_graphs#abic_locus_aborts_lactococcal_phage_p2_infection
