identifier: traitmech:000320
label: AbiC system
definition: An abortive infection system in which an organism possesses an abiC-family
  locus represented by the DefenseFinder AbiC__AbiC profile and exemplified by the
  Lactococcus lactis subsp. lactis ME2 pTN20 determinant whose abiC structural gene
  confers Prf abortive resistance to small isometric-headed phage p2, reducing plaquing,
  plaque size, and burst size while killing most infected Prf-positive cells.
definition_source: DOI:10.1128/jb.174.22.7463-7469.1992
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiC
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:1429469
  snippet: The genetic determinant for Prf (phage resistance five) was subcloned from
    the conjugative plasmid pTN20
  notes: Durmaz et al. subcloned the Prf determinant from the Lactococcus lactis ME2
    conjugative plasmid pTN20.
- reference: PMID:1429469
  snippet: Prf reduces the efficiency of plaquing to 10(-2) to 10(-3) and decreases
    the plaque size and burst size of the small isometric-headed phage p2
  notes: Durmaz et al. measured Prf-dependent reductions in p2 phage plating efficiency,
    plaque size, and burst size.
- reference: PMID:1429469
  snippet: Prf does not prevent phage adsorption or promote restriction and modification
    activities
  notes: Durmaz et al. distinguished Prf activity from adsorption blocking and restriction-modification
    activities.
- reference: PMID:1429469
  snippet: 90% of Prf+ cells infected with phage p2 die. Thus, phage infections in
    Prf+ cells are aborted.
  notes: Durmaz et al. showed that most Prf-positive cells infected with phage p2
    die and interpreted those p2 infections as aborted.
- reference: PMID:1429469
  snippet: DNA sequencing identified a 1,056-nucleotide structural gene designated
    abiC
  notes: Durmaz et al. identified the abiC structural gene in the Prf determinant.
- reference: PMID:1429469
  snippet: Prf+ expression was obtained when abiC was subcloned into the lactococcal
    expression vector pMG36e
  notes: Durmaz et al. showed that abiC expression is sufficient for Prf-positive
    activity in the pMG36e expression vector.
- reference: PMID:1429469
  snippet: Unlike abiA, the action of abiC does not appear to affect DNA replication
  notes: Durmaz et al. left AbiC downstream mechanism unresolved but distinguished
    it from AbiA-associated DNA-replication effects.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiC | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiC model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiC\tAbiC\t1\t1\tAbiC__AbiC"
  notes: The DefenseFinder rules table models AbiC as a one-component system requiring
    the AbiC__AbiC profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiC__AbiC                                       | AbiC__AbiC                                       |
    AbiC                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records AbiC__AbiC under the AbiC model namespace.
