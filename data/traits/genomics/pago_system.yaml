discussions:
- discussion_id: pago-subfamily-boundary-gap
  prompt: Resolve pAgo subfamily boundaries, accessory-protein requirements, and substrate
    breadth before minting narrower long-pAgo or APAZ-associated defense children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: SPARTA and DdmDE support prokaryotic Argonaute defense systems as a reusable
    genomics family, and DefenseFinder models a pAgo namespace with long pAgo, SPARTA,
    and optional APAZ-associated profiles. This parent does not yet resolve whether
    every DefenseFinder pAgo submodel has the same plasmid or phage substrate range,
    whether standalone APAZ-associated profiles are exact children, or which native-host
    examples support each subfamily.
  evidence:
  - reference: DOI:10.1016/j.cell.2022.03.012
    snippet: short prokaryotic Argonaute and the associated TIR-APAZ (SPARTA) proteins
      form heterodimeric complexes
    notes: Koopal et al. support one short-pAgo branch as a paired SPARTA system.
  - reference: DOI:10.1038/s41586-024-07515-9
    snippet: DdmE is a catalytically inactive, DNA-guided, DNA-targeting pAgo
    notes: Bravo et al. support one DdmDE branch with DdmE as a DNA-guided pAgo.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "pAgo\tpAgo\t1\t3\tpAgo__pAgo_LongA, pAgo__pAgo_LongB, pAgo__pAgo_S1A,\
      \ pAgo__pAgo_S2B, pAgo__pAgo_SPARTA\tpAgo__EabAgaM, pAgo__EcAgaN, pAgo__GbbAgaS,\
      \ pAgo__SIR2APAZ, pAgo__TIRAPAZ, pAgo__XAPAZ\t\t"
    notes: The pinned DefenseFinder rules table models pAgo as a system namespace
      with long pAgo, SPARTA, and optional APAZ-associated profile groups.
