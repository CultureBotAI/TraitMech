identifier: traitmech:000419
label: prokaryotic Argonaute defense system
definition: A genomics trait describing possession of a prokaryotic Argonaute-centered
  defense locus that uses a pAgo protein, alone or with cognate accessory proteins,
  to defend against plasmids, bacteriophages, or other mobile genetic elements.
definition_source: DOI:10.1186/1745-6150-4-29
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: pAgo
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1186/1745-6150-4-29
  snippet: The hypothesis that pAgos are key components of a novel prokaryotic immune
    system that employs guide RNA or DNA molecules to degrade nucleic acids of invading
    mobile elements
  notes: Makarova et al. link prokaryotic Argonaute homologs to a predicted defense
    system against mobile genetic elements; later SPARTA and DdmDE experiments support
    two branches of this family.
- reference: DOI:10.1016/j.cell.2022.03.012
  snippet: short prokaryotic Argonaute and the associated TIR-APAZ (SPARTA) proteins
    form heterodimeric complexes
  notes: Koopal et al. support SPARTA as one experimentally resolved short pAgo and
    TIR-APAZ defense system.
- reference: DOI:10.1038/s41586-022-04546-y
  snippet: These systems, termed DdmABC and DdmDE
  notes: Jaskolska et al. support DdmDE as another prokaryotic Argonaute defense system
    in Vibrio cholerae.
- reference: DOI:10.1038/s41586-024-07515-9
  snippet: DdmE is a catalytically inactive, DNA-guided, DNA-targeting pAgo
  notes: Bravo et al. directly identify DdmE as the DNA-targeting prokaryotic Argonaute
    component of DdmDE.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| pAgo | 10\.1186/1745-6150-4-29 | Prokaryotic homologs of Argonaute proteins
    are predicted to function as key components of a novel system of defense against
    mobile genetic elements |'
  notes: The pinned DefenseFinder article registry maps the pAgo model namespace to
    the Makarova et al. prokaryotic Argonaute mobile genetic element defense paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "pAgo\tpAgo\t1\t3\tpAgo__pAgo_LongA, pAgo__pAgo_LongB, pAgo__pAgo_S1A,\
    \ pAgo__pAgo_S2B, pAgo__pAgo_SPARTA\tpAgo__EabAgaM, pAgo__EcAgaN, pAgo__GbbAgaS,\
    \ pAgo__SIR2APAZ, pAgo__TIRAPAZ, pAgo__XAPAZ\t\t"
  notes: The pinned DefenseFinder rules table models pAgo as a system namespace with
    long pAgo, SPARTA, and optional APAZ-associated profile groups.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| pAgo__pAgo_SPARTA                                | pAgo__pAgo_SPARTA                                |
    pAgo                   | Custom                  | 20     |'
  notes: The pinned DefenseFinder HMM inventory records pAgo__pAgo_SPARTA under the
    pAgo model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| pAgo__TIRAPAZ                                    | pAgo__TIRAPAZ                                    |
    pAgo                   | Custom                  | 20     |'
  notes: The pinned DefenseFinder HMM inventory records pAgo__TIRAPAZ under the pAgo
    model namespace.
canonical_examples:
