discussions:
- discussion_id: thoeris-family-signal-and-trigger-gap
  prompt: Resolve Thoeris family architecture, signal chemistry, and phage triggering
    before minting narrower Thoeris mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Ka et al. support the B. cereus ThsA/ThsB two-gene system and Ofir et
    al. support the TIR-produced cADPR-like signal that activates ThsA NAD depletion,
    but Thoeris variants need separate review before TraitMech asserts one exact number
    of TIR-domain proteins, cADPR-isomer chemistry, TIR target, ThsA activation state,
    cell-death pathway, or phage-triggering mechanism.
