identifier: traitmech:000216
label: Thoeris system
definition: A genomics trait describing possession of a Thoeris antiphage defense
  locus in which phage-triggered TIR-domain proteins generate a cyclic-ADP-ribose-like
  signal that activates a ThsA NADase effector to deplete NAD and inhibit bacteriophage
  replication.
definition_source: DOI:10.1038/s41586-021-04098-7
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Thoeris defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-020-16703-w
- synonym_text: Thoeris defence system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-021-04098-7
evidence:
- reference: DOI:10.1038/s41467-020-16703-w
  snippet: One such system is the Thoeris defense system, which consists of two genes,
    thsA and thsB
  notes: Ka et al. support the two-component B. cereus Thoeris system architecture
    and its standard US-English name.
- reference: DOI:10.1038/s41467-020-16703-w
  snippet: Mutation analysis suggests that NAD+ cleavage is linked to the antiphage
    function of Thoeris
  notes: Ka et al. support the relationship between ThsA NADase activity and Thoeris
    antiphage function.
- reference: DOI:10.1038/s41586-021-04098-7
  snippet: phage infection triggers Thoeris TIR-domain proteins to produce an isomer
    of cyclic ADP-ribose
  notes: Ofir et al. support the phage-triggered TIR-domain signal production that
    activates the ThsA effector.
- reference: DOI:10.1038/s41586-021-04098-7
  snippet: This molecular signal activates a second protein, ThsA, which then depletes
    the cell of the essential molecule nicotinamide adenine dinucleotide (NAD)
  notes: Ofir et al. connect the Thoeris TIR-domain signal to ThsA NAD depletion.
- reference: DOI:10.1038/s41467-020-16703-w
  snippet: One is from Bacillus cereus MSX-D12. The thsA gene and its downstream thsB
    gene conferred resistance against myophage infection when engineered into the
    model bacterium Bacillus subtilis BEST7003
  notes: Ka et al. summarize experimental validation of the native Bacillus cereus
    MSX-D12 Thoeris thsA-thsB locus.
canonical_examples:
- taxon_id: NCBITaxon:1396
  taxon_label: Bacillus cereus
  note: Ka et al. describe the Bacillus cereus MSX-D12 thsA-thsB Thoeris system that
    conferred resistance to myophage infection when engineered into a Thoeris-lacking
    Bacillus subtilis host.
  reference: DOI:10.1038/s41467-020-16703-w
