identifier: traitmech:000432
label: DS-8 system
definition: A phage defense system in which an organism possesses the single-gene
  DefensePredictor-discovered system 8 locus cataloged with working_id MNAC and whose
  plasmid expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
