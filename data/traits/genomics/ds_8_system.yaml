evidence:
- reference: DOI:10.1126/science.adv7924
  snippet: To test for anti-phage defense, we placed each TU with its predicted native
    promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
    these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
    total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
    the efficiency of plating (EOP) at least ten-fold relative to an empty vector
    control strain
  notes: DeWeirdt et al. experimentally validated 42 predicted transcriptional units
    as phage-defense systems in E. coli.
- reference: DOI:10.1126/science.adv7924
  snippet: First, we investigated DS-8, a single protein system containing a metallophosphatase
    domain (Fig. 5A) which is homologous to the human protein SMPDL3A, a phosphodiesterase
    that cleaves cGAMP to modulate cGAS-STING immunity signaling
  notes: DeWeirdt et al. identify DS-8 as a single-protein metallophosphatase-domain
    system.
- reference: DOI:10.1126/science.adv7924
  snippet: Mutating either of two predicted catalytic residues in the metallophosphatase
    domain or a residue likely critical to NACHT ATPase activity completely ablated
    defense by DS-8, indicating that both domains and metallophosphatase activity
    are essential for protection
  notes: DeWeirdt et al. report that predicted metallophosphatase catalytic-residue
    and NACHT ATPase-residue mutations ablated DS-8 defense.
