discussions:
- discussion_id: ds-8-defensefinder-model-gap
  prompt: Resolve DS-8 native host breadth, DS-8 profile-to-protein mapping, sensitive-phage
    breadth, direct cyclic-nucleotide substrate, NACHT-mediated activation route,
    relationship to NLR-like bNACHT systems, and rule-level detection criteria before
    minting narrower DS-8 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-8 as the defensive MNAC transcriptional unit
    that reduced Bas1 plaquing when cloned in E. coli MG1655, identify DS-8 as a single-protein
    system with metallophosphatase and NACHT domains, and report that D52A, N84A,
    and K375A mutations ablated Bas1 protection. The pinned DefenseFinder HMM inventory
    records one DS-8 profile row. The pinned rules table has no DS-8 row, and the
    first-pass record does not resolve native host breadth, exact profile-to-protein
    correspondence, direct cyclic-nucleotide substrate, exact NACHT-mediated activation
    route, phage target breadth, endogenous DS-8 activity, or whether DS-8 should
    be related to the broader NLR-like bNACHT system family.
  evidence:
  - reference: DOI:10.1126/science.adv7924
    snippet: To test for anti-phage defense, we placed each TU with its predicted
      native promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
      these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
      total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
      the efficiency of plating (EOP) at least ten-fold relative to an empty vector
      control strain
    notes: DeWeirdt et al. validate predicted transcriptional units by measuring plaquing
      relative to an empty vector control strain.
  - reference: DOI:10.1126/science.adv7924
    snippet: First, we investigated DS-8, a single protein system containing a metallophosphatase
      domain (Fig. 5A) which is homologous to the human protein SMPDL3A, a phosphodiesterase
      that cleaves cGAMP to modulate cGAS-STING immunity signaling
    notes: DeWeirdt et al. identify DS-8 as single-protein.
  - reference: DOI:10.1126/science.adv7924
    snippet: Mutating either of two predicted catalytic residues in the metallophosphatase
      domain or a residue likely critical to NACHT ATPase activity completely ablated
      defense by DS-8, indicating that both domains and metallophosphatase activity
      are essential for protection
    notes: DeWeirdt et al. state that DS-8 metallophosphatase and NACHT catalytic
      mutants ablate defense.
