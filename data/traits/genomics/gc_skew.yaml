  - node_id: dna_replication
    label: DNA replication
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006260
    description: Semiconservative duplication of the chromosome.
  - node_id: replication_boundary
    label: replication origin / terminus
    node_type: QUALITY
    description: Genomic position where leading/lagging strand identity switches.
  edges:
  - subject: dna_replication
    predicate: causes
    object: gc_skew_trait
    description: Asymmetric mutation between leading and lagging strands during
      replication produces strand-specific G/C bias.
    evidence:
    - reference: DOI:10.1093/oxfordjournals.molbev.a025626
      notes: Lobry first described replication-linked asymmetric substitution
        patterns between the two DNA strands.
    predicate_id: biolink:causes
  - subject: gc_skew_trait
    predicate: associated with
    object: replication_boundary
    description: GC skew inversions mark the replication origin and terminus.
    evidence:
