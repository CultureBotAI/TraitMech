identifier: traitmech:000097
label: GC skew
definition: A genome-sequence property describing strand asymmetry in guanine versus
  cytosine content between the leading and lagging replication strands, commonly used
  to locate the replication origin and terminus.
definition_source: DOI:10.1093/oxfordjournals.molbev.a025626
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
