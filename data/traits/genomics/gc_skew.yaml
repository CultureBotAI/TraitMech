  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/S0378-1119(99)00297-8
evidence:
- reference: DOI:10.1093/oxfordjournals.molbev.a025626
  notes: Lobry first described asymmetric substitution patterns between the two DNA
    strands of bacteria, the basis of GC skew that marks replication boundaries.
- reference: DOI:10.1016/S0378-1119(99)00297-8
  notes: Frank & Lobry review the mutational and selective mechanisms underlying
    strand compositional asymmetry.
