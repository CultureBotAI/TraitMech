discussions:
- discussion_id: gao-rl-mechanism-gap
  prompt: Resolve Gao_RL natural hosts, RL_A/RL_B/RL_C/RL_D component functions, phage
    triggers, and effector activity before minting narrower Gao_RL mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes with diverse enzymatic
    activities, and DefenseFinder models Gao_RL as a four-profile system. The exact
    natural host breadth, RL component identities, phage trigger, and profile-to-activity
    mapping remain unresolved.
