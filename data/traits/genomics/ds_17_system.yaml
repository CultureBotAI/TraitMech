    and final Science Tables S6/S7/S8 map it to product accession WP_001240354.1,
    a T4 phage readout, display name DS-17, and a PDDEXK HHpred row. The pinned DefenseFinder
    HMM inventory records one DS-17 custom profile row. The pinned rules table has
