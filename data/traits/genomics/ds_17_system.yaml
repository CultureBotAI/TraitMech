  title: DS-17 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-17 locus
    to reduced bacteriophage plaquing without resolving DS-17 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-17 as the validated NUCS transcriptional unit
    with one product accession, one PDDEXK HHpred-domain row, and one DefenseFinder
    DS-17 profile row. It does not assert native host breadth, exact profile-to-protein
    correspondence, DS-17 molecular activity, trigger, substrate, phage breadth, or
    DefenseFinder rule-level detection criteria.
