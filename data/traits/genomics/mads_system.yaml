discussions:
- discussion_id: mads-profile-activity-gap
  prompt: Resolve MADS subtype boundaries, MADS3-4 relationships, and Mad1-Mad8 profile-to-activity
    mappings before minting narrower MADS mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Maestri et al. support MADS as a methylation-associated defense system
    active against DNA phages, and DefenseFinder models MADS as an eight-profile rule.
    The pinned model does not resolve which combinations of MADS__mad profiles correspond
    to methylation, specificity, nuclease, ATPase, or kinase activities, so this first
    record stays at system level.
  evidence:
  - reference: DOI:10.1016/j.chom.2024.07.005
    snippet: MADS encodes a defense system that is active against at least 4 different
      DNA phages
    notes: Maestri et al. support MADS activity against DMS3vir and three additional
      DNA phages.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "MADS\tMADS\t3\t3\tMADS__mad1, MADS__mad2, MADS__mad3, MADS__mad4, MADS__mad5,\
      \ MADS__mad6, MADS__mad7, MADS__mad8\t\t\t"
    notes: The DefenseFinder rules table models MADS with MADS__mad1 through MADS__mad8
      profiles and a minimum of three mandatory matches.
