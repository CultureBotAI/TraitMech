canonical_examples:
- taxon_id: NCBITaxon:287
  taxon_label: Pseudomonas aeruginosa
  note: Maestri et al. discovered MADS in the native Pseudomonas aeruginosa SMC4386
    locus and showed that deleting the locus reduced resistance to phage DMS3vir.
  reference: DOI:10.1016/j.chom.2024.07.005
causal_graphs:
- graph_id: mads_methylation_restricts_phage
  title: MADS loci confer methylation-associated phage defense
  description: Conservative system-level sketch linking possession of a MADS locus
    to methylation-based self/non-self discrimination, restriction of DNA phages,
    and the MADS system trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures MADS as a named eight-gene DefenseFinder profile
    set whose activity is associated with methylation and DNA restriction while leaving
    the exact mapping from the MADS__mad profiles to nuclease, ATPase, kinase, specificity,
    and methyltransferase activities unresolved.
