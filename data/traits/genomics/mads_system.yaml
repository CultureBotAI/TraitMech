identifier: traitmech:000370
label: MADS system
definition: A phage defense system in which an organism possesses a methylation-associated
  defense system locus whose canonical architecture has mad1 through mad8 genes and
  whose methylation-coupled self/non-self discrimination can restrict bacteriophage
  infection.
definition_source: DOI:10.1016/j.chom.2024.07.005
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
