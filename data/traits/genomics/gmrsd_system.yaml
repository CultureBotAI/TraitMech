discussions:
- discussion_id: gmrsd-defensefinder-model-gap
  prompt: Resolve exact GmrS/GmrD domain activities, complete sugar-modified HMC substrate
    breadth, split-versus-fused host breadth, phage IPI inhibition, and DefenseFinder
    RM_Type_IV HMM/rules mapping before minting narrower GmrSD mechanism or component
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Bair and Black support split GmrS/GmrD as a Type IV modification-dependent
    restriction nuclease that targets glucosylated hydroxymethylcytosine DNA, Machnicka
    et al. support GmrSD homologs as either split or fused double-domain systems,
    and the pinned DefenseFinder article registry maps GmrSD_RM_Type_IV to Bair and
    Black. The pinned HMM inventory and rules table have no exact GmrSD or GmrSD_RM_Type_IV
    rows. This first-pass record therefore does not resolve a reusable DefenseFinder
    profile model, exact split-versus-fused prevalence across natural hosts, the complete
    set of sugar-modified HMC targets, the exact domain contributions of GmrS and
    GmrD, or the relationship between phage IPI inhibition and the organism-level
    GmrSD system trait.
