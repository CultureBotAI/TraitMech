identifier: traitmech:000506
label: GmrSD system
definition: A type IV modification-dependent restriction system in which an organism
  possesses a GmrSD locus encoding either separate GmrS and GmrD proteins or a fused
  double-domain GmrSD-family protein, that targets glucosylated hydroxymethylcytosine-containing
  DNA.
definition_source: DOI:10.1016/j.jmb.2006.11.051
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: GmrSD
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.jmb.2006.11.051
- synonym_text: GmrSD_RM_Type_IV
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.jmb.2006.11.051
  snippet: The Escherichia coli CT596 prophage exclusion genes gmrS and gmrD were
    found to encode a novel type IV modification-dependent restriction nuclease that
    targets and digests glucosylated (glc)-hydroxymethylcytosine (HMC) DNAs.
  notes: Bair and Black experimentally support split gmrS and gmrD genes as a GmrSD
    Type IV modification-dependent restriction nuclease targeting glucosylated hydroxymethylcytosine
    DNA.
- reference: DOI:10.1016/j.jmb.2006.11.051
  snippet: Nuclease activity is dependent upon the presence of both the GmrS and the
    GmrD proteins.
  notes: Bair and Black support both split GmrS and GmrD proteins as required for
    the characterized CT596 GmrSD restriction activity.
- reference: DOI:10.1186/s12859-015-0773-z
  snippet: GmrSD is a modification-dependent restriction endonuclease that specifically
    targets and cleaves glucosylated hydroxymethylcytosine (glc-HMC) modified DNA.
  notes: Machnicka et al. support GmrSD as a glucosylated-hydroxymethylcytosine-targeting
    modification-dependent restriction endonuclease.
- reference: DOI:10.1186/s12859-015-0773-z
  snippet: It is encoded either as two separate single-domain GmrS and GmrD proteins
    or as a single protein carrying both domains.
  notes: Machnicka et al. support treating split GmrS/GmrD loci and fused double-domain
    GmrSD homologs within the same first-pass system family.
- reference: DOI:10.1186/s12859-015-0773-z
  snippet: Moreover, we found that GmrSD systems exist predominantly as a fused, double-domain
    form rather than as a heterodimer and that their homologs are often encoded in
    regions enriched in defense and gene mobility-related elements.
  notes: Machnicka et al. report that fused double-domain GmrSD systems are common
    and are often found near defense- and mobility-linked features.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| GmrSD_RM_Type_IV | 10\.1016/j\.jmb\.2006\.11\.051 | A type IV modification
    dependent restriction nuclease that targets glucosylated hydroxymethyl cytosine
    modified DNAs | '
  notes: The pinned DefenseFinder article registry maps the GmrSD_RM_Type_IV source
    key to Bair and Black.
