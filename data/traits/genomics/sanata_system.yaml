identifier: traitmech:000373
label: SanaTA system
definition: A phage defense system in which an organism possesses a sanaTA toxin-antitoxin
  locus represented by DefenseFinder as a SanaA/SanaT two-profile model and experimentally
  linked to resistance against T7 phage mutants lacking gene 4.5 anti-defense activity.
definition_source: DOI:10.1016/j.molcel.2013.02.002
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
