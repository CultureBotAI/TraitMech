evidence:
- reference: PMID:23478446
  snippet: In all six tested pairs, induction of toxin expression inhibited bacterial
    growth, while co-induction of the toxin and antitoxin resulted in bacterial survival
  notes: Sberro et al. experimentally validated the sanaTA family as one of six new
    toxin-antitoxin systems.
- reference: PMID:23478446
  snippet: One of the tested systems, sanaTA, was found to provide E. coli with resistance
    against T7Δ4.5 and T7Δ4.3Δ4.5Δ4.7, reducing sensitivity to these phage strains
    by about 3 orders of magnitude
  notes: Sberro et al. connect the sanaTA system to lower sensitivity to T7 phages
    lacking gene 4.5.
- reference: PMID:23478446
  snippet: Since the sanaTA system provides resistance to the T7Δ4.5 mutant phage
    but not to the WT T7 phage, we hypothesized that the 4.5 gene codes for an anti-defense
    mechanism that overcomes the abortive infection imposed by the TA system.
  notes: Sberro et al. show that SanaTA resists a T7 gene 4.5 mutant and leave the
    phage-encoded anti-Abi interaction as part of the system context.
- reference: DOI:10.1016/j.molcel.2013.02.002
  snippet: Infection experiments with T7 phage showed that two of the new modules
    can provide resistance against phage.
  notes: Sberro et al. summarize that infection experiments found phage resistance
    in two of the newly identified modules.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: SanaTA | 10\.1016/j\.molcel\.2013\.02\.002 | Discovery of functional toxin/antitoxin
    systems in bacteria by shotgun cloning
  notes: The DefenseFinder article registry maps the named SanaTA system to the Sberro
    et al. toxin/antitoxin shotgun-cloning paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "SanaTA\tSanaTA\t2\t2\tSanaTA__SanaA, SanaTA__SanaT\t\t\t"
  notes: The DefenseFinder rules table models SanaTA as a two-profile system requiring
