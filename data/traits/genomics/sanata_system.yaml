discussions:
- discussion_id: sanata-host-trigger-profile-gap
  prompt: Resolve SanaTA native host breadth, SanaA/SanaT molecular activities, T7
    Gp4.5/Lon anti-defense logic, and the SanaTA__SanaT_1 profile before minting narrower
    SanaTA mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Sberro et al. support sanaTA as a Shewanella sp. ANA-3 two-gene toxin-antitoxin
    family that confers resistance to T7 phage mutants lacking gene 4.5 when expressed
    in Escherichia coli, and DefenseFinder models SanaTA with SanaTA__SanaA and SanaTA__SanaT.
    This first system-level record leaves the natural host range, SanaA/SanaT activities,
    T7 Gp4.5/Lon counter-defense sequence, and the extra non-rule SanaTA__SanaT_1
    HMM unresolved.
  evidence:
  - reference: PMID:23478446
    snippet: Since the sanaTA system provides resistance to the T7Δ4.5 mutant phage
      but not to the WT T7 phage, we hypothesized that the 4.5 gene codes for an anti-defense
      mechanism that overcomes the abortive infection imposed by the TA system.
    notes: Sberro et al. connect T7 gene 4.5 to SanaTA anti-Abi escape but leave the
      locus-level SanaTA mechanism only partly resolved.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "SanaTA\tSanaTA\t2\t2\tSanaTA__SanaA, SanaTA__SanaT\t\t\t"
    notes: The DefenseFinder rules table models SanaTA as a two-profile system requiring
