identifier: traitmech:000572
label: Lamassu type II system
definition: A Lamassu system in which an organism possesses a locus with an additional
  LmuC component alongside the LmuA effector module and SMC-like LmuB sensor.
definition_source: DOI:10.1093/nar/gkab883
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000232
synonyms:
