identifier: traitmech:000296
label: Phrann gp29-gp30 system
definition: A phage defense system in which an organism possesses a Phrann gp29-gp30
  locus that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1038/nmicrobiol.2016.251
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Phrann_gp29_gp30
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: at least five distinct prophage-expressed viral defense systems that interfere
    with infection
  notes: Dedrick et al. place the Cluster N Phrann gp29-gp30 system in a cohort of
    prophage-expressed defenses against lytic and temperate mycobacteriophages.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: Phrann genes 29 and/or 30 are involved in defense against Tweety and Gaia,
    as a mutant lysogen lacking Phrann 29 loses defense against these phages
  notes: Dedrick et al. localize part of the Phrann prophage-mediated heterotypic
    defense phenotype to genes 29 and 30.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: expressing Phrann genes 29 and 30 reproduce the Phrann defense against
    Tweety and Gaia
  notes: Dedrick et al. show that recombinant Phrann genes 29 and 30 are sufficient
    to reproduce Phrann defense against Tweety and Gaia.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: Phrann prophage-mediated defense is strictly heterotypic, and Phrann gp29/gp30
    does not defend against Phrann or other Cluster N phages
  notes: Dedrick et al. delimit the Phrann gp29-gp30 defense profile as heterotypic
    rather than Cluster N superinfection exclusion.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: Prophage-mediated defense by (p)ppGpp synthetases is a new and intriguing
    system for defense against viral attack
  notes: Dedrick et al. interpret Phrann gp29 as a putative (p)ppGpp synthetase in
    a prophage-mediated viral-defense system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Phrann_gp29_gp30 | 10\.1038/nmicrobiol\.2016\.251 | Prophage-mediated defence
    against viral attack and viral counter-defence
  notes: The DefenseFinder model registry maps the named Phrann_gp29_gp30 system to
    the Dedrick et al. prophage-mediated viral-defense paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
