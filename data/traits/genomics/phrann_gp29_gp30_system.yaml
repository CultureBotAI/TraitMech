discussions:
- discussion_id: phrann_gp29_gp30-mechanism-gap
  prompt: Resolve the Phrann gp30 regulator role, lytic trigger, (p)ppGpp synthetase
    activity, and breadth beyond Tweety and Gaia before minting narrower Phrann gp29-gp30
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Dedrick et al. and DefenseFinder support Phrann gp29-gp30 as a named
    anti-phage system with gp29 and gp30 profiles, but the Phrann gp30 regulatory
    role, lytic-phage trigger, direct (p)ppGpp activation mechanism, and target breadth
    are not resolved enough here to assert a narrower mechanistic child trait.
  attaches_to:
