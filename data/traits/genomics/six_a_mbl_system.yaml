discussions:
- discussion_id: six-a-mbl-mechanism-gap
  prompt: Resolve 6A-MBL phage triggers and effector outputs before minting narrower
    6A-MBL mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: van den Berg et al. and DefenseFinder support 6A-MBL as a named anti-phage
    system with 6A_MBL__cap2_3 and 6A_MBL__MblB HMM profile entries, but the trigger,
    molecular substrate, antiviral effector output, and subtype-specific mechanism
    are not resolved enough here to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#six_a_mbl_locus_restricts_phage
