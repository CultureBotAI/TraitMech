identifier: traitmech:000314
label: 6A-MBL system
definition: A phage defense system in which an organism possesses a 6A-MBL locus that
  can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2024.07.007
trait_category: GENOMICS
term_kind: CLASS
