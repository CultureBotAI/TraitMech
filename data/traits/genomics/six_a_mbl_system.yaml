evidence:
- reference: DOI:10.1016/j.chom.2024.07.007
  snippet: We validated six of these phage defense systems, including factors preventing
    viral attachment, R-loop-acting enzymes, the inflammasome, ubiquitin pathway,
    and pathogen recognition signaling.
  notes: van den Berg et al. validated six phage defense systems related to eukaryotic
    innate antiviral responses.
- reference: DOI:10.1016/j.chom.2024.07.007
  snippet: Searching for phage defense systems related to innate antiviral genes from
    vertebrates and plants, we uncovered over 450 candidates.
  notes: van den Berg et al. motivate a conservative system-level record that does
    not assert a resolved 6A-MBL trigger, effector output, or universal pathway.
- reference: https://zenodo.org/records/11209165
  snippet: In addition, a fused ubiquitin-like E1-E2-JAB protein combined with a putative
    MBL nuclease (6A-MBL) was found
  notes: The Zenodo manuscript/supplementary-data record from van den Berg et al.
    names 6A-MBL as a putative MBL-nuclease system candidate.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 6A_MBL | 10\.1016/j\.chom\.2024\.07\.007 | Bacterial homologs of innate
    eukaryotic antiviral defenses with anti-phage activity highlight shared evolutionary
    roots of viral defenses
  notes: The DefenseFinder article registry maps the named 6A-MBL system to the van
    den Berg et al. antiphage-system discovery paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: 6A_MBL__cap2_3                                   |                                                  |
    6A_MBL
  notes: The DefenseFinder HMM inventory records 6A_MBL__cap2_3 as a cap2_3 profile
