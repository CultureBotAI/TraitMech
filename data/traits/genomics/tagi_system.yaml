identifier: traitmech:000513
label: TagI system
definition: A type IV modification-dependent restriction system in which an organism
  possesses a TagI-family locus encoding an SRA-HNH restriction endonuclease that
  recognizes 5-methylcytosine- or 5-hydroxymethylcytosine-modified DNA.
definition_source: DOI:10.1093/nar/gky781
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: TagI
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:30202937
  snippet: TagI belongs to the recently characterized SRA-HNH family of modification-dependent
    restriction endonucleases (REases) that also includes ScoA3IV (Sco5333) and TbiR51I
    (Tbis1).
  notes: Kisiala et al. support TagI as a member of an SRA-HNH modification-dependent
    restriction endonuclease family.
- reference: PMID:30202937
  snippet: Here, we present a crystal structure of dimeric TagI, which exhibits a
    DNA binding site formed jointly by the nuclease domains, and separate binding
    sites for modified DNA bases in the two protomers.
  notes: Kisiala et al. support dimeric TagI structure with nuclease and modified-base-binding
    sites.
- reference: PMID:30202937
  snippet: Their pockets for the flipped bases are spacious enough to accommodate
    5-methylcytosine (5mC) or 5-hydroxymethylcytosine (5hmC), but not glucosyl-5-hydroxymethylcytosine
    (g5hmC).
  notes: Kisiala et al. support TagI recognition of flipped 5mC and 5hmC bases.
- reference: PMID:30202937
  snippet: Such preference is in agreement with the biochemical determination of the
    TagI modification dependence and the results of phage restriction assays.
  notes: Kisiala et al. support TagI modification dependence and phage restriction
    activity.
- reference: PMID:30202937
  snippet: The ability of TagI to digest plasmids methylated by Dcm (C5mCWGG), M.Fnu4HI
    (G5mCNGC) or M.HpyCH4IV (A5mCGT) suggests that the SRA domains of the enzyme are
    tolerant to different sequence contexts of the modified base.
  notes: Kisiala et al. support TagI digestion of multiple 5mC-modified plasmid sequence
    contexts.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| TagI | 10\.1093/nar/gky781 | Crystal structure of the modification-dependent
    SRA-HNH endonuclease TagI | '
  notes: The pinned DefenseFinder article registry maps the TagI source key to the
    Kisiala et al. structural paper.
