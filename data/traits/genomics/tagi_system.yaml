discussions:
- discussion_id: tagi-defensefinder-model-gap
  prompt: Resolve TagI-family breadth, modified-cytosine sequence-context specificity
    across natural hosts, accession-level protein examples, and DefenseFinder RM_Type_IV
    HMM/rules mapping before minting narrower TagI mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Kisiala et al. support TagI as an SRA-HNH modification-dependent restriction
    endonuclease that recognizes 5mC/5hmC bases and restricts phage in assays. The
    pinned DefenseFinder article registry maps TagI to that paper, but the pinned
    HMM inventory and rules table have no exact TagI rows. This first-pass record
    therefore does not resolve a reusable DefenseFinder profile model, exact accession-level
    protein examples, the breadth of TagI-like systems across natural hosts, or the
    complete set of natural modified-cytosine sequence contexts.
