causal_graphs:
- graph_id: ds_1_locus_reduces_phage_plaquing
  title: DS-1 loci reduce bacteriophage plaquing
  description: Conservative system-level sketch linking the two-gene DS-1 locus to
    reduced bacteriophage plaquing without resolving DS-1 component functions or effector
    activity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-1 as the validated D390 transcriptional unit
    with two product accessions and with DefenseFinder DS-1A and DS-1B profile rows.
    It does not assert native host breadth, exact profile-to-protein correspondence,
    the direct viral trigger or substrate, exact molecular output, phage target breadth,
    or DefenseFinder rule-level detection criteria.
