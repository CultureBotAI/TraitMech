    that reduced plaquing when cloned in E. coli MG1655, and the pinned DefenseFinder
    HMM inventory records DS-1A and DS-1B profile rows. The pinned rules table has
    no DS-1 row, and the first-pass record does not resolve native host breadth, exact
    component activities, profile-to-component mapping, phage target breadth, the
    direct molecular output, or endogenous DS-1 activity.
