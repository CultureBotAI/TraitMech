identifier: traitmech:000240
label: SPARTA system
definition: A genomics trait describing possession of a short prokaryotic Argonaute
  TIR-APAZ (SPARTA) locus whose short pAgo and TIR-APAZ proteins form heterodimeric
  complexes that oligomerize after guide RNA-mediated target DNA binding and unleash
  TIR domain-mediated NAD(P)ase activity that depletes NAD(P)+ to remove plasmid-invaded
  cells.
definition_source: DOI:10.1016/j.cell.2022.03.012
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: short prokaryotic Argonaute TIR-APAZ system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2022.03.012
evidence:
- reference: DOI:10.1016/j.cell.2022.03.012
  snippet: short prokaryotic Argonaute and the associated TIR-APAZ (SPARTA) proteins
    form heterodimeric complexes
  notes: Koopal et al. define SPARTA as a short pAgo plus TIR-APAZ system rather than
    an individual gene or single protein.
- reference: DOI:10.1016/j.cell.2022.03.012
  snippet: Upon guide RNA-mediated target DNA binding, four SPARTA heterodimers form
    oligomers in which TIR domain-mediated NAD(P)ase activity is unleashed
  notes: Koopal et al. support the guide RNA and target DNA-triggered oligomerization
    mechanism that activates SPARTA NAD(P)ase activity.
- reference: DOI:10.1016/j.cell.2022.03.012
  snippet: SPARTA is activated in the presence of highly transcribed multicopy plasmid
    DNA, which causes cell death through NAD(P)+ depletion
  notes: Koopal et al. support plasmid-challenge activation and NAD(P)+ depletion
    as experimentally demonstrated SPARTA outcomes.
- reference: DOI:10.1038/s41467-024-49271-4
  snippet: cryo-EM structure of the SPARTA oligomer (tetramer of heterodimers) bound
    to guide-RNA/target-ssDNA
  notes: Kottur et al. independently support the RNA/target-DNA activated oligomeric
    state of a SPARTA complex.
causal_graphs:
- graph_id: sparta_pago_tir_apaz_nadase_cell_death
  title: SPARTA complexes couple guide RNA target binding to NAD(P)ase-triggered cell
    death
  description: Evidence-backed process sketch linking a SPARTA locus to short-pAgo/TIR-APAZ
    heterodimer assembly, guide RNA-target DNA activation, oligomerization, TIR-domain
    NAD(P)ase activity, NAD(P)+ depletion, and removal of plasmid-invaded cells.
  scope_status: NONMECHANISTIC
  scope_notes: The graph stays at the SPARTA-family level and models the high-copy
    plasmid activation route from Koopal et al. without asserting that phage defense,
    SIR2-APAZ systems, nuclease-APAZ systems, or every other short-pAgo family uses
    the same enzymatic output.
