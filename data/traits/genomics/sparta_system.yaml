discussions:
- discussion_id: sparta-native-host-and-substrate-gap
  prompt: Resolve SPARTA natural-host substrates before adding canonical examples
    or narrower short-pAgo defense children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Koopal et al. support strong high-copy plasmid activation and only limited,
    NADase-independent phage effects; Kottur et al. support C. thermophila SPARTA
    structural activation. This first record therefore stays broad until natural-host
    activity, phage scope, and whether SIR2-APAZ or nuclease-APAZ relatives should
    be separate children are resolved.
