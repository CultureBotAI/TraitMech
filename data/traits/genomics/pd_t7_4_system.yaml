identifier: traitmech:000406
label: PD-T7-4 system
definition: A phage defense system in which an organism possesses a PD-T7-4 locus
  represented by DefenseFinder as a single-profile model, PD-T7-4__PD-T7-4, and experimentally
  linked to protection against SECphi18, SECphi27, T3, and T7 when expressed in E.
  coli.
