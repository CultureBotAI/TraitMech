discussions:
- discussion_id: drt2-profile-activity-gap
  prompt: Resolve the DRT2 reverse-transcriptase product, direct phage trigger, host
    breadth, partner-feature requirements, and DRT_2 profile-to-activity criteria
    before minting DRT2 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated reverse transcriptases as a broad
    antiphage-system family, and the pinned DefenseFinder HMM inventory and rules
    table support DRT_2 as a single-profile DRT subsystem. This first-pass record
    leaves the exact DRT2 RT product, phage trigger, host breadth, partner-feature
    requirements, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1126/science.aba0372
    snippet: We discovered that a family of uncharacterized reverse transcriptases
      (RTs) are active defense systems
    notes: Gao et al. experimentally support defense-associated reverse transcriptases
      as active antiphage systems.
  - reference: DOI:10.1126/science.aba0372
    snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA,
      where x is any amino acid] abolished activity
    notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
      active-site residues.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| DRT_2__drt2                                      | DRT_2__drt2                                      |
      DRT_2                  | Custom                  | 100    |'
    notes: The pinned DefenseFinder HMM inventory records DRT_2__drt2 under the DRT_2
      model namespace.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "DRT\tDRT_2\t1\t1\tDRT_2__drt2\t\t\t"
    notes: The pinned DefenseFinder rules table models DRT_2 as a DRT subsystem with
      a DRT_2__drt2 profile.
