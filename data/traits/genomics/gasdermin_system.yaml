identifier: traitmech:000336
label: GasderMIN system
definition: A phage defense system in which an organism possesses a bacterial gasdermin
  locus represented by the DefenseFinder GasderMIN__bGSDM profile, whose bGSDM effectors
  are associated with bacteriophage defense and can be proteolytically activated in
  characterized bGSDM-protease systems to assemble membrane pores, disrupt membrane
  integrity, and execute cell death.
definition_source: DOI:10.1126/science.abj8432
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: GasderMIN
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: GasderMIN__bGSDM
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1126/science.abj8432
  snippet: We discovered gasdermin homologs encoded in bacteria that defended against
    phages and executed cell death.
  notes: Johnson et al. support bacterial gasdermin homologs as phage-defense proteins
    that execute cell death.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC9134750/
  snippet: bGSDM-protease systems are found in diverse bacteria and archaea, as well
    as in metagenomic samples of prokaryotic origin
  notes: Johnson et al. report bGSDM-protease systems across bacteria, archaea, and
    prokaryotic metagenomic samples, supporting curation above one engineered locus.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC9134750/
  snippet: a four gene operon from Lysobacter enzymogenes exhibited robust defense
    against coliphages T4, T5, and T6
  notes: Johnson et al. experimentally tested a Lysobacter enzymogenes bGSDM-containing
    operon that defended against coliphages T4, T5, and T6.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC9134750/
  snippet: Deletion of the bGSDM gene from the Lysobacter operon abolished protection
  notes: Deletion of the bGSDM gene from the Lysobacter operon abolished the observed
    phage protection.
- reference: DOI:10.1126/science.abj8432
  snippet: Bacterial gasdermins were activated by dedicated caspase-like proteases
    that catalyzed site-specific cleavage and the removal of an inhibitory C-terminal
    peptide.
  notes: Johnson et al. connect bacterial gasdermin activation to dedicated caspase-like
    proteases that remove an inhibitory C-terminal peptide.
- reference: DOI:10.1126/science.abj8432
  snippet: Release of autoinhibition induced the assembly of large and heterogeneous
    pores that disrupted membrane integrity.
  notes: Johnson et al. support pore assembly and membrane disruption as outputs of
    bacterial gasdermin autoinhibition release.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: GasderMIN | 10\.1101/2021\.06\.07\.447441 | Bacterial gasdermins reveal
    an ancient mechanism of cell death
  notes: The DefenseFinder article registry maps the GasderMIN model namespace to
    the Johnson et al. bacterial gasdermin preprint, later published under DOI:10.1126/science.abj8432.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| GasderMIN__bGSDM                                 | GasderMIN__bGSDM___bGSDM                         |
    GasderMIN              | Custom                  | 50     |'
  notes: The DefenseFinder HMM inventory records the bGSDM profile under the GasderMIN
    model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "GasderMIN\tGasderMIN\t1\t1\tGasderMIN__bGSDM\t\t\t"
  notes: The DefenseFinder rules table models GasderMIN as a one-mandatory-profile
    system requiring GasderMIN__bGSDM.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "CARD_NLR\tCARD_NLR_GasderMIN\t1\t3\tGasderMIN__bGSDM\tCARD_NLR__CARD_Protease,\
    \ CARD_NLR__NLR_new, CARD_NLR__Trypsin\tCARD_NLR__Endonuclease, CARD_NLR__Endonuclease_new,\
