canonical_examples:
- taxon_id: NCBITaxon:69
  taxon_label: Lysobacter enzymogenes
  note: Johnson et al. showed that a Lysobacter enzymogenes bGSDM-containing operon
    provided robust defense against coliphages T4, T5, and T6 in an Escherichia coli
    heterologous assay, and that deleting the bGSDM gene abolished protection.
  reference: DOI:10.1126/science.abj8432
