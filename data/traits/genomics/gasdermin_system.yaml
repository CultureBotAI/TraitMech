discussions:
- discussion_id: gasdermin-family-breadth-and-card-nlr-scope-gap
  prompt: Resolve natural GasderMIN family breadth and CARD-NLR gasdermin context
    before minting narrower gasdermin subfamily traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Johnson et al. experimentally tested a Lysobacter bGSDM-containing operon
    and mechanistically dissected Runella bGSDM protease-triggered toxicity, while
    some bacterial gasdermins showed no discernible phage restriction in Escherichia
    coli and the GasderMIN__bGSDM profile is also used in CARD-NLR detector contexts
    in the pinned DefenseFinder rules table. This record captures the standalone GasderMIN
    detector namespace and leaves CARD-NLR-associated gasdermins, natural phage triggers,
    and broader family boundaries unresolved.
  attaches_to:
  - causal_graphs#gasdermin_proteolysis_triggers_pore_cell_death
