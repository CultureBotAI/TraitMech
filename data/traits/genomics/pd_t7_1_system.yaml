evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T7-1 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-1.md
  snippet: PD-T7-1 is a single gene defense system that was discovered in :ref{doi=10.1038/s41564-022-01219-4}.
    Its antiphage activity was assessed in *E. coli* and it was shown to be active
    against T7.
  notes: The DefenseFinder wiki describes PD-T7-1 as a single-gene system and names
    T7 as its experimentally assessed activity.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-1.md
  snippet: 'The PD-T7-1 is composed of 1 protein: PD-T7-1.'
  notes: The DefenseFinder wiki names PD-T7-1 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-1.md
  snippet: 'The PD-T7-1 system in *Klebsiella sp. P1927* (GCF_018204675.1, NZ_CP073377)
    is composed of 1 protein: PD-T7-1 (WP_004150873.1)'
  notes: The DefenseFinder wiki illustrates a predicted one-protein PD-T7-1 locus
    in RefSeq assembly GCF_018204675.1 on NZ_CP073377.
