identifier: traitmech:000395
label: PD-T7-1 system
definition: A phage defense system in which an organism possesses a PD-T7-1 locus
  represented by DefenseFinder as a single-profile model, PD-T7-1__PD-T7-1, and experimentally
  linked to T7 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-1.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
