identifier: traitmech:000371
label: GAPS1 system
definition: A phage defense system in which an organism possesses a Gamma-Mobile-Trio
  island-associated GAPS1 locus that can be triggered by a phage capsid protein to
  induce cell dormancy.
definition_source: DOI:10.1038/s41564-024-01840-5
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
