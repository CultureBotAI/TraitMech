  snippet: GMT islands' cargoes contain various anti-phage defence systems
  notes: Mahata et al. identify GMT islands as carriers of anti-phage defense-system
    cargo.
- reference: DOI:10.1038/s41564-024-01840-5
  snippet: We reveal four anti-phage defence systems encoded within GMT islands and
    further characterize one system, GAPS1, showing it is triggered by a phage capsid
    protein to induce cell dormancy
  notes: Mahata et al. identify GAPS1 as one of four GMT-island anti-phage defense
    systems and connect GAPS1 activation to phage-capsid-protein-triggered cell dormancy.
- reference: DOI:10.1101/2023.03.28.534373
