discussions:
- discussion_id: gaps1-trigger-sibling-gap
  prompt: Resolve GAPS1 component activity, natural-host exemplars, and GAPS6 boundaries
    before minting narrower GAPS traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mahata et al. support GAPS1 as one GMT-island anti-phage defense system
    triggered by a phage capsid protein to induce cell dormancy, and DefenseFinder
    represents GAPS1 as one GAPS1__GAPS1 profile. This first system-level record does
    not assert the GAPS1 component's molecular activity, the capsid trigger identity,
    a universal GAPS1 host range, or sibling GAPS6 system boundaries.
  evidence:
  - reference: DOI:10.1038/s41564-024-01840-5
    snippet: We reveal four anti-phage defence systems encoded within GMT islands
      and further characterize one system, GAPS1, showing it is triggered by a phage
      capsid protein to induce cell dormancy
    notes: Mahata et al. identify GAPS1 as one of four GMT-island anti-phage defense
      systems and connect GAPS1 activation to phage-capsid-protein-triggered cell
      dormancy.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "GAPS1\tGAPS1\t1\t1\tGAPS1__GAPS1\t\t\t"
    notes: The DefenseFinder rules table models GAPS1 as a single-profile system requiring
      GAPS1__GAPS1.
