discussions:
- discussion_id: drt-subtype-mechanism-gap
  prompt: Resolve DRT subtype products, partner RNAs or proteins, phage triggers,
    and antiphage substrates before minting narrower DRT subtype mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support several active reverse-transcriptase-containing antiphage
    systems, and DefenseFinder models DRT subtypes such as DRT_1. This first record
    stays at DRT-family level because the direct products of DRT RT activity, the
    exact phage triggers, the non-coding RNA role in DRT type 3, and the mechanisms
    for additional DRT subtypes are not resolved.
  attaches_to:
  - causal_graphs#drt_reverse_transcriptase_antiphage_defense
  posed_by: codex
  posed_date: '2026-09-19'
