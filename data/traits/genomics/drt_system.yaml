identifier: traitmech:000279
label: DRT system
definition: A phage defense system in which an organism possesses a defense-associated
  reverse transcriptase locus whose RT-domain component or components can confer bacteriophage
  defense and are modeled by DefenseFinder as DRT subtypes.
definition_source: DOI:10.1126/science.aba0372
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: DRT
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: defense-associated RT
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.aba0372
- synonym_text: defense-associated reverse transcriptase
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.aba0372
evidence:
- reference: DOI:10.1126/science.aba0372
  snippet: We discovered that a family of uncharacterized reverse transcriptases (RTs)
    are active defense systems
  notes: Gao et al. experimentally support previously uncharacterized reverse transcriptases
    as active antiphage defense systems rather than mobile-element RT features alone.
- reference: DOI:10.1126/science.aba0372
  snippet: six of these candidates (UG1, UG2, UG3, UG8, UG15, and UG16) provided robust
    protection against dsDNA phages
  notes: Gao et al. support DRT defense activity across several reverse-transcriptase
    candidate groups.
- reference: DOI:10.1126/science.aba0372
  snippet: We named these genes defense-associated RTs (DRTs)
  notes: Gao et al. coined the defense-associated RT naming that underlies the DRT
    system label.
- reference: DOI:10.1126/science.aba0372
  snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA, where
    x is any amino acid] abolished activity
  notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
    active-site residues.
- reference: DOI:10.1126/science.aba0372
  snippet: the UG3 (drt3a) and UG8 (drt3b) RTs are components of the same defense
    system (DRT type 3), with both RTs required for defense activity
  notes: Gao et al. support the multi-component DRT type 3 system while separating
    it from single-gene DRT subtypes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: DRT | 10\.1126/science\.aba0372 | Diverse enzymatic activities mediate
    antiviral immunity in prokaryotes
  notes: The DefenseFinder article registry maps the named DRT system to the Gao et
    al. antiphage-system discovery paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "DRT\tDRT_1\t2\t2\tDRT_1__drt1a, DRT_1__drt1b"
  notes: The DefenseFinder rules table models DRT_1 as a two-profile DRT subtype.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: DRT_1__drt1a                                     | DRT_1__drt1a                                     |
    DRT_1
  notes: The DefenseFinder HMM inventory records the drt1a profile in the DRT_1 model
    namespace.
