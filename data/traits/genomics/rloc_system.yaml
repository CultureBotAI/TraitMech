evidence:
- reference: PMID:18681940
  snippet: The conserved bacterial protein RloC, a distant homologue of the tRNA(Lys)
    anticodon nuclease (ACNase) PrrC, is shown here to act as a wobble nucleotide-excising
    and Zn(++)-responsive tRNase.
  notes: Davidov and Kaufmann identify RloC as a conserved bacterial wobble nucleotide-excising,
    zinc-responsive tRNase related to PrrC.
- reference: PMID:18681940
  snippet: Geobacillus kaustophilus RloC expressed in Escherichia coli exhibited ACNase
    activity that differed from PrrC's in substrate preference and ability to excise
    the wobble nucleotide.
  notes: Davidov and Kaufmann support wobble nucleotide excision by Geobacillus kaustophilus
    RloC expressed in Escherichia coli.
- reference: PMID:26031711
  snippet: In contrast, RloC is rarely linked to an RM protein, and its ACNase is
    regulated by an internal switch responsive to double-stranded DNA breaks.
  notes: Bitton et al. describe RloC ACNase regulation by an internal switch that
    responds to double-stranded DNA breaks.
- reference: PMID:26031711
  snippet: Consistent with these predictions we show that Acinetobacter baylyi RloC
    expressed in Escherichia coli is activated by wild-type phage T4 but not by a
    mutant impaired in host DNA degradation.
  notes: Bitton et al. show that Acinetobacter baylyi RloC expressed in Escherichia
    coli is activated by wild-type phage T4, but not by a host-DNA-degradation mutant.
- reference: PMID:26031711
  snippet: Nonetheless, T4's plating efficiency was inefficiently impaired by AbaRloC,
    presumably due to a decoy function of the phage encoded tRNA target, the absence
    of which exacerbated the restriction.
  notes: Bitton et al. report that Acinetobacter baylyi RloC inefficiently impairs
    wild-type T4 plating and more strongly restricts a phage mutant lacking the decoy
    tRNA target.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RloC | 10\.1111/j\.1365-2958\.2008\.06387\.x | RloC: a wobble nucleotide-excising
    and zinc-responsive bacterial tRNase'
  notes: The DefenseFinder article registry maps the named RloC system to Davidov
    and Kaufmann's wobble nucleotide-excising tRNase paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "RloC\tRloC\t1\t1\tRloC__RloC\t\t\t"
