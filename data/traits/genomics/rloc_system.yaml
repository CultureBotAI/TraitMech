discussions:
- discussion_id: rloc-mechanism-gap
  prompt: Resolve natural RloC host breadth, endogenous RloC activation triggers,
    phage restriction strength, and RloC profile-to-activity mapping before minting
    narrower RloC mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Davidov and Kaufmann support RloC as a bacterial wobble nucleotide-excising
    tRNase, Bitton et al. show that Acinetobacter baylyi RloC responds to phage T4
    host DNA degradation in an Escherichia coli expression context, and DefenseFinder
    models RloC as a one-profile system with an RloC__RloC marker. Natural host breadth,
    native phage triggers, restriction strength, and profile-to-activity mapping remain
    unresolved.
  evidence:
  - reference: PMID:26031711
    snippet: The natural role of the conserved bacterial anticodon nuclease (ACNase)
      RloC is not known, but traits that set it apart from the homologous phage T4-excluding
      ACNase PrrC could provide relevant clues.
    notes: Bitton et al. leave the natural role of conserved bacterial RloC unknown
      while comparing it to the phage T4-excluding PrrC ACNase.
  attaches_to:
  - causal_graphs#rloc_locus_triggers_dna_break_responsive_acnase
