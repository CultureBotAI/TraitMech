identifier: traitmech:000483
label: TIR-VII system
definition: A phage defense system in which an organism possesses a TIR-VII locus,
  represented in the pinned DefenseFinder HMM inventory by TIR-VII__TIR-VII_A and
  TIR-VII__TIR-VII_B custom profiles, that can inhibit bacteriophage plaquing.
definition_source: DOI:10.1038/s41467-024-51738-3
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
