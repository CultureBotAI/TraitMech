discussions:
- discussion_id: tir-vii-detection-trigger-gap
  prompt: Resolve TIR-VII native host breadth, the TIR-VII__TIR-VII_A and TIR-VII__TIR-VII_B
    profile-to-component mapping, phage-trigger specificity, TIR-domain output chemistry,
    and rule-level DefenseFinder detection criteria before minting narrower TIR-VII
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wang et al. support TIR-VII as one of nine newly named TIR-domain anti-phage
    defense systems and note that TIR-VII was recovered in a single form with TIR-VIII.
    The pinned DefenseFinder HMM inventory records TIR-VII__TIR-VII_A and TIR-VII__TIR-VII_B
    custom profile rows, but the pinned DefenseFinder rules table has no TIR-VII row.
    This first record therefore does not assert profile requirement logic, accession-level
    components, a direct phage trigger, or TIR-domain output chemistry.
  evidence:
  - reference: DOI:10.1038/s41467-024-51738-3
    snippet: Twelve systems have defense activities against a variable number of phages,
      and 9 of them are new defense systems and named TIR-I to IX
    notes: Wang et al. report that TIR-VII belongs to nine newly named TIR-domain
      anti-phage defense systems with activity against variable phage subsets.
  - reference: DOI:10.1038/s41467-024-51738-3
    snippet: TIR-I, TIR-III, and TIR-IV systems appear in diverse domains contexts,
      whereas the TIR-VII and TIR-VIII systems were found in a single form
    notes: Wang et al. report that TIR-VII and TIR-VIII were found in a single form.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| TIR-VII__TIR-VII_A                               |                                                  |
      TIR-VII                | Custom                  | 50     |

      | TIR-VII__TIR-VII_B                               |                                                  |
      TIR-VII                | Custom                  | 500    |'
    notes: The pinned DefenseFinder HMM inventory records TIR-VII__TIR-VII_A and TIR-VII__TIR-VII_B
      custom profiles under the TIR-VII system namespace.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    notes: The pinned DefenseFinder rules table does not list TIR-VII, leaving rule-level
      detection criteria unresolved.
