    and effector activity before minting narrower Gao_Hhe mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes that mediate protection
    against specific bacteriophages, and DefenseFinder models Gao_Hhe as a single-profile
