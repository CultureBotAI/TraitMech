discussions:
- discussion_id: gao-her-family-mechanism-gap
  prompt: Resolve Gao_Her natural host breadth, subtype boundaries, phage triggers,
    and the effector outputs of Gao_Her_DUF and Gao_Her_SIR before minting narrower
    Gao-Her mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support bacteriophage protection by widespread antiviral gene
    cassettes, and DefenseFinder models Gao_Her_DUF and Gao_Her_SIR as two-profile
