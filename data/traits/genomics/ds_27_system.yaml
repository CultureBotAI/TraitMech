    mapping, HHpred-domain interpretation, complete phage breadth, molecular output,
    and rule-level DefenseFinder criteria before minting narrower DS-27 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-27 as the defensive SMEK transcriptional unit
    and final Science Tables S6/S7/S8 map it to product accession WP_087896215.1,
    an RB69 phage readout, and display name DS-27. The pinned DefenseFinder HMM inventory
    records one DS-27 custom profile row. The pinned rules table has no DS-27 row,
    and the first-pass record does not resolve native host breadth, complete phage
    breadth, direct profile-to-protein correspondence, HHpred-domain interpretation,
    molecular output, or endogenous DS-27 activity.
