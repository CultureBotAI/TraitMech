identifier: traitmech:000226
label: ToxIN system
definition: An abortive infection system in which an organism possesses a toxIN type
  III protein-RNA toxin-antitoxin locus whose ToxN toxin and tandem ToxI RNA antitoxins
  constitute a two-component Abi module that inhibits bacterial growth and restricts
  phage propagation.
definition_source: DOI:10.1073/pnas.0808832106
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1073/pnas.0808832106
  snippet: A highly effective 2-gene Abi system from the phytopathogen Erwinia carotovora
    subspecies atroseptica, designated ToxIN, is described
  notes: Fineran et al. define ToxIN as a two-gene abortive infection system from
    the native pECA1039 plasmid.
- reference: DOI:10.1073/pnas.0808832106
  snippet: ToxN inhibiting bacterial growth and the tandemly repeated ToxI RNA antitoxin
    counteracting the toxicity
  notes: Fineran et al. connect the ToxN protein toxin and tandem ToxI RNA repeats
    to the toxin-antitoxin behavior of ToxIN.
- reference: DOI:10.1073/pnas.0808832106
  snippet: ToxIN defines an entirely new TA class that functions via a novel protein-RNA
    mechanism
  notes: Fineran et al. support ToxIN as the defining member of the type III protein-RNA
    toxin-antitoxin class.
- reference: DOI:10.1073/pnas.0808832106
  snippet: All of our data are consistent with ToxIN functioning as a phage Abi system
  notes: Fineran et al. ruled out adsorption blockade and a restriction-modification
    explanation before classifying ToxIN as abortive infection.
- reference: DOI:10.1073/pnas.0808832106
  snippet: ToxN functions through a reversible growth-inhibiting (bacteriostatic)
    mechanism
  notes: Fineran et al. support host growth inhibition as the ToxN toxin output.
- reference: DOI:10.1128/JB.00720-09
  snippet: Designated ToxIN, this two-component abortive infection system acts as
    a toxin-antitoxin module
  notes: Blower et al. place the two-component ToxIN module in the abortive infection
    class.
- reference: DOI:10.1128/JB.00720-09
  snippet: We determined the minimal ToxI RNA sequence in the native operon that is
    both necessary and sufficient for abortive infection and to counteract the toxicity
    of ToxN
  notes: Blower et al. connect ToxI RNA repeat dosage to both ToxN neutralization
    and the native abortive-infection phenotype.
- reference: DOI:10.1128/JB.00720-09
  snippet: this two-component Abi system operates as a novel protein-RNA toxin-antitoxin
    (TA) system to abort phage infection in multiple gram-negative bacteria
  notes: Blower et al. support the ToxIN system as an Abi trait that can operate beyond
    the source Erwinia strain.
canonical_examples:
- taxon_id: NCBITaxon:29471
  taxon_label: Pectobacterium atrosepticum
  note: Fineran et al. isolated pECA1039 from Erwinia carotovora subsp. atroseptica
    1039, designated its two-gene Abi system ToxIN, and showed that the native toxIN
    locus conferred phage resistance in strain SCRI 1043.
  reference: DOI:10.1073/pnas.0808832106
