identifier: traitmech:000325
label: SpbK system
definition: An abortive infection system in which an organism possesses a SpbK-family
  locus represented by the DefenseFinder SpbK__SpbK profile and exemplified by the
  ICEBs1 spbK gene whose SPß-YonE-dependent activity inhibits SPß production and kills
  infected cells.
definition_source: DOI:10.1371/journal.pgen.1010065
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: SpbK
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1371/journal.pgen.1010065
  snippet: The ICEBs1 gene spbK, although dispensable for conjugation, was necessary
    and sufficient for the inhibition of SPß.
  notes: Johnson et al. support spbK as the ICEBs1 locus sufficient for SPß inhibition.
- reference: DOI:10.1371/journal.pgen.1010065
  snippet: The anti-SPß phenotype (abortive infection) caused by spbK was dependent
    on the SPß gene yonE.
  notes: Johnson et al. support yonE-dependent abortive infection as the phage-specific
    SpbK output.
- reference: DOI:10.1371/journal.pgen.1010065
  snippet: Co-expression of spbK and yonE inhibited host cell growth and caused a
    drop in cell viability, even in the absence of any other ICEBs1 or SPß genes.
  notes: Johnson et al. support SpbK/YonE-associated host growth inhibition and cell
    death.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'SpbK | 10\.1371/journal\.pgen\.1010065 | Interactions between mobile genetic
    elements: An anti-phage gene in an integrative and conjugative element protects
    host cells from predation by a temperate bacteriophage'
  notes: The DefenseFinder article registry maps the named SpbK model namespace to
    the ICEBs1 SpbK anti-phage paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "SpbK\tSpbK\t1\t1\tSpbK__SpbK"
  notes: The DefenseFinder rules table models SpbK as a single-profile system requiring
    the SpbK__SpbK profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| SpbK__SpbK                                       | SpbK__SpbK                                       |
    SpbK                   | Custom                  | 80     |'
  notes: The DefenseFinder HMM inventory records SpbK__SpbK under SpbK.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Johnson et al. showed that ICEBs1 encodes an SpbK-dependent abortive infection
    system that protects B. subtilis host populations from SPß.
  reference: DOI:10.1371/journal.pgen.1010065
