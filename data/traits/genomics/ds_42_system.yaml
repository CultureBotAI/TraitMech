identifier: traitmech:000464
label: DS-42 system
definition: A phage defense system in which an organism possesses the three-gene DefensePredictor-discovered
  system 42 locus cataloged as working transcriptional unit PRO1 and whose plasmid
  expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
