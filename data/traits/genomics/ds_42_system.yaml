causal_graphs:
- graph_id: ds_42_locus_reduces_phage_plaquing
  title: DS-42 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the three-gene DS-42 locus
    to reduced bacteriophage plaquing without resolving DS-42 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-42 as the validated PRO1 transcriptional unit
    with three product accessions, a high-probability MBL hydrolase HHpred row for
    WP_001198055.1, a moderate-probability CHS5_N/Dimerization HHpred row for WP_001024069.1,
    and three DefenseFinder DS-42 profile rows. It does not assert native host breadth,
    exact profile-to-protein correspondence, MBL hydrolase or CHS5_N interpretation,
    WP_249925928.1 function, DS-42 molecular activity, complete phage breadth, or
    DefenseFinder rule-level detection criteria.
