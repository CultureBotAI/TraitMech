identifier: traitmech:000287
label: Geb system
definition: A phage defense system in which an organism possesses a Geb locus represented
  by GebA1 or GebA2 profiles that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1101/2025.01.08.631966
