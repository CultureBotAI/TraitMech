evidence:
- reference: DOI:10.1101/2025.01.08.631966
  snippet: Among the remaining eight systems, six demonstrated increased resistance
    to at least one phage with more than 100 fold reduction in plaque forming units
    (PFU) (Figure 3a, Supplementary Figure 5). As Streptomyces are mostly soil dwelling
    bacteria, we named these systems after deities of the soil and earth (Ceres, Geb,
    Veles, Prithvi, Ukko and Oshun).
  notes: Mordret et al. directly name Geb among six Streptomyces systems that increased
    resistance to at least one phage.
- reference: DOI:10.1101/2025.01.08.631966
  snippet: The bacterial pangenome encodes an immense array of antiphage systems,
    yet much of their diversity remains uncharted
  notes: Mordret et al. motivate a conservative system-level record that does not
    assert a resolved Geb trigger, effector output, or universal pathway.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Geb | 10\.1101/2025\.01\.08\.631966 | Protein and genomic language models
    chart a vast landscape of antiphage defenses
  notes: The DefenseFinder model registry maps the named Geb system to the Mordret
    et al. antiphage-system discovery preprint.
