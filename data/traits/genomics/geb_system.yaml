discussions:
- discussion_id: geb-mechanism-gap
  prompt: Resolve Geb phage triggers and effector outputs before minting narrower
    Geb mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Geb as a named anti-phage system
    with GebA1 and GebA2 profile choices, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
  attaches_to:
