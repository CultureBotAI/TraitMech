identifier: traitmech:000490
label: VP1848 system
definition: A phage defense system in which an organism possesses a VP1848-family
  locus represented by the DefenseFinder VP1848__VP1848 custom HMM profile and experimentally
  linked to reduced bacteriophage plaquing when the cloned Vibrio parahaemolyticus
  RIMD 2210633 vp1848 cassette is expressed from a VSV105 plasmid.
