discussions:
- discussion_id: ogmios-mechanism-gap
  prompt: Resolve Ogmios phage triggers and effector outputs before minting narrower
    Ogmios mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Ogmios as a named anti-phage
    system with a VCA0308 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
