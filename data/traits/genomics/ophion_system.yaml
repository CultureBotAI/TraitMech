discussions:
- discussion_id: ophion-jumbo-phage-mechanism-gap
  prompt: Resolve Ophion phage triggers, nucleotide-modification products, and model
    coverage before minting narrower Ophion mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Keesman et al. support Ophion as a three-gene anti-jumbo-phage system
    that blocks progression from the early phage infection vesicle to the phage nucleus,
    but the direct phage trigger, exact OpnA/OpnB/OpnC interaction sequence, modified
    nucleotide product, natural locus breadth, and profile-to-component model are
    not resolved enough here to assert a narrower mechanistic child trait.
