identifier: traitmech:000331
label: Ophion system
definition: A phage defense system in which an organism possesses a three-gene Ophion
  locus encoding OpnA, OpnB, and OpnC components that can block jumbo-phage infection
  before phage-nucleus formation.
definition_source: DOI:10.1101/2025.09.30.679545
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Ophion
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1101/2025.09.30.679545
evidence:
- reference: DOI:10.1101/2025.09.30.679545
  snippet: 'From over 500 candidate defense systems, we selected nine for experimental
    testing and validated three: Dionysus, a TerB-encoding system that disrupts early
    phage infection vesicle formation by Jumbo phages; Ophion, a Radical SAM-containing
    system that prevents the formation of the Jumbo phage nucleus; and Ambrosia, a
    tightly regulated RM-like system.'
  notes: Keesman et al. named Ophion among three modular phage-defense candidates
    validated experimentally from an initial pool of more than 500 candidates.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Ophion, named after a primordial serpent from Greek mythology, is a three
    gene system encoding a radical S-adenosyl-L-methionine (rSAM) enzyme (OpnA), a
    polymerase-and histidinol-phosphatase (PHP, OpnB), and a phosphoribosyl transferase
    (PRTase, OpnC)
  notes: Keesman et al. support Ophion as a three-gene system encoding OpnA, OpnB,
    and OpnC components with Radical SAM, PHP, and phosphoribosyl-transferase domains.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Ophion shows strong protection against jumbo phages
  notes: Keesman et al. support Ophion as a system that strongly protects against
    jumbo phages.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Mutating conserved residues of the rSAM and PRTase domains revealed these
    to be essential for protection, with partial dependence on the PHP domain
  notes: Keesman et al. support the OpnA Radical SAM and OpnC phosphoribosyl-transferase
    domains as essential in the tested Ophion system, with partial dependence on OpnB
    PHP.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Ophion provides potent and specific defense against jumbo phages by blocking
    progression from the EPI vesicle to the nucleus stage, possibly by halting the
    transcription of the nucleus forming genes
  notes: Keesman et al. connect Ophion-mediated defense to arrest of jumbo phages
    as they progress from the early phage infection vesicle stage to nucleus formation.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Ophion | 10\.1101/2025\.09\.30\.679545 | Discovery of phage defense systems
    through component modularity networks
  notes: The DefenseFinder article registry maps the named Ophion system to the Keesman
    et al. modular phage-defense discovery preprint; the pinned DefenseFinder HMM
    inventory and rules table do not list Ophion, so this row is name-to-paper evidence
    rather than model-component evidence.
