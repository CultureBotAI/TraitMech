identifier: traitmech:000390
label: PD-T4-5 system
definition: A phage defense system in which an organism possesses a PD-T4-5 locus
  represented by DefenseFinder as a single-profile model, PD-T4-5__PD-T4-5, and experimentally
  linked to T4, T6, LambdaVir, and T5 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T4-5
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
- synonym_text: PD-T4-5__PD-T4-5
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T4-5 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
  snippet: 'The PD-T4-5 is composed of 1 protein: PD-T4-5.'
  notes: The DefenseFinder wiki names PD-T4-5 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
  snippet: 'The PD-T4-5 system in *Grimontia hollisae* (GCF_009665295.1, NZ_CP035690)
    is composed of 1 protein: PD-T4-5 (WP_154124046.1)'
  notes: The DefenseFinder wiki illustrates a predicted PD-T4-5 locus in RefSeq assembly
    GCF_009665295.1 on NZ_CP035690.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
    \ et al., 2022</a>] --> Origin_0\n    Origin_0[Escherichia coli \n<a href='https://ncbi.nlm.nih.gov/protein/RCQ99930.1'>RCQ99930.1</a>]\
    \ --> Expressed_0[Escherichia coli]\n    Expressed_0[Escherichia coli] ----> T4\
    \ & T6 & LambdaVir & T5"
  notes: The DefenseFinder experimental-validation diagram links Vassallo et al. to
    an E. coli PD-T4-5 source locus expressed in E. coli against T4, T6, LambdaVir,
    and T5.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-5.md
  snippet: "subgraph Title4[Protects against]\n        T4\n        T6\n        LambdaVir\n\
