discussions:
- discussion_id: pd-t4-5-mechanism-gap
  prompt: Resolve PD-T4-5 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-T4-5 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T4-5 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T4, T6, LambdaVir, and T5, and DefenseFinder
    represents the system with one mandatory profile. Natural host breadth, the direct
    phage trigger, and effector logic remain unresolved.
  evidence:
  - reference: DOI:10.1038/s41564-022-01219-4
    snippet: Here we developed an experimental selection scheme agnostic to genomic
      context to identify defence systems in 71 diverse E. coli strains. Our results
      unveil 21 conserved defence systems, none of which were previously detected
      as enriched in defence islands.
    notes: Vassallo et al. developed the agnostic E. coli pangenome selection that
      uncovered PD-T4-5 and related conserved phage-defense systems.
