discussions:
- discussion_id: razr-trigger-model-gap
  prompt: Resolve RAZR natural hosts, phage ring triggers, RNA-substrate breadth,
    and model coverage before minting narrower RAZR mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Zhang et al. support RAZR as a ring-activated zinc-finger HEPN RNase
    that can oligomerize around unrelated phage ring scaffolds, but natural locus
    breadth, the full phage-trigger set, exact RNA-substrate preference, and absence
    from the pinned DefenseFinder HMM/rules rows need further review.
  attaches_to:
  - causal_graphs#razr_ring_trigger_restricts_phage
