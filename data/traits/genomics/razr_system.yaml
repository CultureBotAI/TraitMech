  - node_id: restricted_phage_propagation
    label: restricted phage propagation
    node_type: BIOLOGICAL_PROCESS
    description: Restriction of productive phage propagation in bacteria carrying
      activated RAZR defense.
  - node_id: razr_system_trait
    label: RAZR system
    node_type: TRAIT
    grounding: traitmech:000411
    description: Possession of a genome-encoded RAZR phage-defense system.
  - node_id: phage_defense_system
    label: phage defense system
    node_type: TRAIT
    grounding: traitmech:000209
    description: Possession of one or more genome-encoded immune systems that inhibit
