identifier: traitmech:000411
label: RAZR system
definition: A phage defense system in which an organism possesses a locus encoding
  a RAZR zinc-finger HEPN RNase that can form a phage-triggered higher-order ring
  complex, cleave RNA broadly, inhibit translation, and restrict phage propagation.
definition_source: DOI:10.1038/s41586-025-10060-8
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: RAZR
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-025-10060-8
evidence:
- reference: DOI:10.1038/s41586-025-10060-8
  snippet: assembles into an active, 24-meric ring
  notes: Zhang et al. define RAZR as a ring-activated zinc-finger RNase whose phage-triggered
    higher-order assembly generates an active 24-subunit ring.
- reference: DOI:10.1038/s41586-025-10060-8
  snippet: cleave RNA nonspecifically to inhibit translation and restrict phage propagation
  notes: Zhang et al. connect activated RAZR complexes to broad RNA cleavage, translational
    shutdown, and restriction of phage growth.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| RAZR | 10\.1038/s41586-025-10060-8 | Bacterial immune activation via
    supramolecular assembly with phage triggers |'
  notes: The pinned DefenseFinder article registry maps the named RAZR system to the
    Zhang et al. Nature article; the pinned DefenseFinder HMM inventory (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md)
    and rules table (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv)
    do not list RAZR, so this row is name-to-paper evidence rather than model-component
    evidence.
causal_graphs:
- graph_id: razr_ring_trigger_restricts_phage
  title: RAZR ring assembly activates RNase defense
  description: Conservative system-level sketch linking a RAZR locus and a phage ring
    trigger to RAZR oligomerization, nonspecific RNA cleavage, translation inhibition,
    phage-propagation restriction, and RAZR system possession.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures RAZR as a named phage-defense RNase activated by
    phage protein ring scaffolds while leaving natural hosts, the complete phage-trigger
    set, exact RNA-substrate preference, and profile-to-component DefenseFinder modeling
    unresolved.
  nodes:
  - node_id: razr_locus
    label: RAZR locus
    node_type: GENETIC_ELEMENT
    description: A bacterial locus encoding a ring-activated zinc-finger HEPN RNase.
  - node_id: phage_ring_trigger
    label: phage ring trigger
    node_type: BIOLOGICAL_PROCESS
    description: Formation of a phage-encoded protein ring scaffold whose geometry
      can promote RAZR assembly.
  - node_id: razr_oligomerization
    label: RAZR oligomerization
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of RAZR into a higher-order active RNase ring around a phage
