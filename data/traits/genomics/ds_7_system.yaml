  title: DS-7 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-7 locus
    to reduced bacteriophage plaquing without resolving DS-7 component function or
    effector activity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-7 as the validated SVIR transcriptional unit
    with one product accession and with a DefenseFinder DS-7 profile row. It does
    not assert native host breadth, exact profile-to-protein correspondence, the direct
    viral trigger or substrate, the exact HNH endonuclease activity, phage-baseplate-like
    domain relevance, phage target breadth, or DefenseFinder rule-level detection
    criteria.
