evidence:
- reference: DOI:10.1126/science.adv7924
  snippet: To test for anti-phage defense, we placed each TU with its predicted native
    promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
    these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
    total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
    the efficiency of plating (EOP) at least ten-fold relative to an empty vector
    control strain
  notes: DeWeirdt et al. experimentally validated 42 predicted transcriptional units
    as phage-defense systems in E. coli.
- reference: DOI:10.1126/science.adv7924
  snippet: We refer to these validated TUs as DefensePredictor discovered systems
    (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g., DS-8A
    is the first gene of DS-8.
  notes: DeWeirdt et al. name validated transcriptional units as DefensePredictor
    discovered systems.
- reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
  snippet: "SVIR\tNZ_QOYF01000007.1\tGCF_003334585.1\t+\tTrue\tFalse\tFalse\tTrue\t\
