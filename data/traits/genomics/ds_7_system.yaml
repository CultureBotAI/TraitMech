discussions:
- discussion_id: ds-7-defensefinder-model-gap
  prompt: Resolve DS-7 native host breadth, exact single-component activity, DS-7
    profile-to-protein mapping, sensitive-phage breadth, HNH endonuclease activity,
    the role of the H52 residue, the phage-baseplate-like hit, and rule-level detection
    criteria before minting narrower DS-7 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-7 as the defensive SVIR transcriptional unit
    that reduced Bas60 plaquing when cloned in E. coli MG1655, and the pinned DefenseFinder
    HMM inventory records one DS-7 profile row. The pinned rules table has no DS-7
    row, and the first-pass record does not resolve native host breadth, exact profile-to-protein
    correspondence, HNH endonuclease activity, the function of the H52 residue, phage
    target breadth, or endogenous DS-7 activity.
