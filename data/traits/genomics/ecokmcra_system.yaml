discussions:
- discussion_id: ecokmcra-defensefinder-model-gap
  prompt: Resolve EcoKMcrA-family breadth, methylcytosine and hydroxymethylcytosine
    sequence-context specificity across natural hosts, accession-level protein examples,
    and DefenseFinder RM_Type_IV HMM/rules mapping before minting narrower EcoKMcrA
    mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Czapinska et al. support E. coli EcoKMcrA as a methylcytosine- and hydroxymethylcytosine-dependent
    restriction endonuclease with cellular modified-DNA restriction activity tied
    to the nuclease active site, and the pinned DefenseFinder article registry maps
    EcoKMcrA to that paper. The pinned HMM inventory and rules table have no exact
    EcoKMcrA rows. This first-pass record therefore does not resolve a reusable DefenseFinder
    profile model, exact accession-level protein examples, the breadth of EcoKMcrA-like
    systems beyond E. coli K strains, or the complete set of natural methylcytosine
    and hydroxymethylcytosine sequence contexts.
  evidence:
  - reference: DOI:10.1093/nar/gky731
    snippet: Escherichia coli McrA (EcoKMcrA) acts as a methylcytosine and hydroxymethylcytosine
      dependent restriction endonuclease.
    notes: Czapinska et al. support EcoKMcrA as an E. coli McrA modification-dependent
      restriction endonuclease that targets methylcytosine- and hydroxymethylcytosine-containing
      DNA.
  - reference: DOI:10.1093/nar/gky731
    snippet: In cells, EcoKMcrA specifically restricts DNA that is modified in the
      correct sequence context. This activity is impaired by mutations of the nuclease
      active site, unless the enzyme is highly overexpressed.
    notes: Czapinska et al. support cellular modified-DNA restriction by EcoKMcrA
      and tie efficient restriction to the nuclease active site.
