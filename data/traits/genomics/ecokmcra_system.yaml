identifier: traitmech:000509
label: EcoKMcrA system
definition: A type IV modification-dependent restriction system in which an organism
  possesses an EcoKMcrA mcrA locus encoding a methylcytosine- and hydroxymethylcytosine-dependent
  restriction endonuclease whose nuclease active site is required for efficient restriction
  of DNA modified in the correct sequence context.
definition_source: DOI:10.1093/nar/gky731
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: EcoKMcrA
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1093/nar/gky731
evidence:
- reference: DOI:10.1093/nar/gky731
  snippet: Escherichia coli McrA (EcoKMcrA) acts as a methylcytosine and hydroxymethylcytosine
    dependent restriction endonuclease.
  notes: Czapinska et al. support EcoKMcrA as an E. coli McrA modification-dependent
    restriction endonuclease that targets methylcytosine- and hydroxymethylcytosine-containing
    DNA.
- reference: DOI:10.1093/nar/gky731
  snippet: We present a biochemical characterization of EcoKMcrA that includes the
    first demonstration of its endonuclease activity
  notes: Czapinska et al. experimentally demonstrated EcoKMcrA endonuclease activity
    in vitro.
- reference: DOI:10.1093/nar/gky731
  snippet: In cells, EcoKMcrA specifically restricts DNA that is modified in the correct
    sequence context. This activity is impaired by mutations of the nuclease active
    site, unless the enzyme is highly overexpressed.
  notes: Czapinska et al. support cellular modified-DNA restriction by EcoKMcrA and
    tie efficient restriction to the nuclease active site.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| EcoKMcrA | 10\.1093/nar/gky731 | Activity and structure of EcoKMcrA
    | '
  notes: The pinned DefenseFinder article registry maps the EcoKMcrA source key to
    the Czapinska et al. Activity and structure of EcoKMcrA paper.
