discussions:
- discussion_id: ds-9-defensefinder-model-gap
  prompt: Resolve DS-9 native host breadth, DS-9A/DS-9B profile-to-protein mapping,
    sensitive-phage breadth, direct metallophosphoesterase substrate, HAD phosphatase
    target, and rule-level detection criteria before minting narrower DS-9 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-9 as the defensive MHAD transcriptional unit
    that reduced Bas1 plaquing when cloned in E. coli MG1655, identify DS-9 as a two-gene
    system with metallophosphatase and HAD phosphatase domains, and report that DS-9A
    predicted catalytic-residue mutations caused a loss of defense. Final Science
    Table S7 mutant rows show D207A and N292A Bas1 protection loss relative to wild-type
    MHAD in a matched panel. The pinned DefenseFinder HMM inventory records two DS-9
    profile rows. The pinned rules table has no DS-9 row, and the first-pass record
    does not resolve native host breadth, exact DS-9A/DS-9B profile-to-protein correspondence,
    direct metallophosphoesterase substrate, HAD phosphatase target, phage target
    breadth, endogenous DS-9 activity, or DefenseFinder rule-level detection criteria.
  evidence:
  - reference: DOI:10.1126/science.adv7924
    snippet: To test for anti-phage defense, we placed each TU with its predicted
      native promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
      these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
      total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
      the efficiency of plating (EOP) at least ten-fold relative to an empty vector
      control strain
    notes: DeWeirdt et al. validate predicted transcriptional units by measuring plaquing
      relative to an empty vector control strain.
  - reference: DOI:10.1126/science.adv7924
    snippet: The system DS-9 has two genes, the first harboring a metallophosphatase
      domain homologous to that of DS-8, and the second a predicted haloacid dehalogenase-like
      (HAD) phosphatase
    notes: DeWeirdt et al. identify DS-9 as a two-gene system.
  - reference: DOI:10.1126/science.adv7924
    snippet: When we mutated the predicted catalytic residues in the metallophosphatase
      domain of DS-9A, we saw a loss of defense, suggesting it is essential for protection
    notes: DeWeirdt et al. state that DS-9A metallophosphatase catalytic mutants lose
      defense.
