  snippet: '| GAPS2__GAPS2                                     | GAPS2__GAPS2                                     |
    GAPS2                  | Custom                  | 100    |'
  notes: The DefenseFinder HMM inventory records GAPS2__GAPS2 under the GAPS2 system
    namespace.
