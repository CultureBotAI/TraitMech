discussions:
- discussion_id: gaps2-mechanism-gap
  prompt: Resolve GAPS2 natural host breadth, BRCT-domain activity, phage trigger
    specificity, and exact GAPS2__GAPS2 profile-to-protein correspondence before minting
    narrower GAPS2 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mahata et al. support GAPS2 as a GMT-encoded anti-phage defense system
    that protects E. coli against P1-vir and lambda-vir when expressed from a Vibrio
    parahaemolyticus locus, and DefenseFinder represents GAPS2 as a single-profile
    system. Natural host breadth, BRCT-domain activity, the phage trigger, and exact
    profile-to-protein correspondence remain unresolved.
  evidence:
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps2.md
    snippet: The GAPS2 system is composed of a single protein. It was found in Gamma-Mobile-Trio
