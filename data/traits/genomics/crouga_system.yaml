identifier: traitmech:000500
label: Crouga system
definition: A phage defense system in which an organism possesses a Crouga antiviral
  locus that is encoded by P4-like phage satellites and can protect bacteria from
  bacteriophage infection.
definition_source: DOI:10.1093/nar/gkag898
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Crouga
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkag898
evidence:
- reference: DOI:10.1093/nar/gkag898
  snippet: The Crouga system has some evidence of being an RM-like system, with one
    of its proteins containing PFAM domains (ResIII, DEAD, and Helicase C) associated
    with other RM systems
  notes: de Sousa et al. identify Crouga as a named novel P4-associated system with
    restriction-modification-like domain evidence.
- reference: DOI:10.1093/nar/gkag898
  snippet: We named the novel functional systems according to deities from Lusitanian
    mythology
  notes: de Sousa et al. introduce Crouga among the named novel functional P4 antiviral
    systems.
- reference: DOI:10.1093/nar/gkag898
  snippet: Our experimental validation of anti-phage activity for 13 novel systems
    encoded by P4 confirms that the contribution of defence functions to the pangenomes
    of P4 and P2, as well as to the antiviral repertoire of their bacterial hosts,
    will keep surprising us
  notes: de Sousa et al. summarize the validated P4-encoded novel-system cohort in
    their discussion.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Crouga | 10\.64898/2026\.02\.27\.708500 | Shuttling, swapping and mixing:
    the rapid modular evolution of antiviral repertoires in temperate phages and their
    satellites | '
  notes: The pinned DefenseFinder article registry maps the Crouga source key to the
    de Sousa et al. P4/P2 antiviral-repertoire paper preprint.
