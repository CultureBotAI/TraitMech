discussions:
- discussion_id: psyrta-mechanism-gap
  prompt: Resolve PsyrTA phage triggers and effector outputs before minting narrower
    PsyrTA mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support PsyrTA as a named anti-phage
    system with required PsyrA and PsyrT profiles, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#psyrta_locus_restricts_phage
  posed_by: codex
  posed_date: '2026-09-19'
