evidence:
- reference: DOI:10.1038/s41564-026-02441-0
  snippet: using structure-guided discovery, we identified two widespread families
    of anti-phage DNA glycosylases, Dag1 and Dag2
  notes: Getz et al. identify Dag1 and Dag2 as widespread anti-phage DNA-glycosylase
    families.
- reference: DOI:10.1038/s41564-026-02441-0
  snippet: Dag1 and Dag2 act as antiviral effectors that selectively target phages
    carrying modified guanine bases.
  notes: Getz et al. support the modified-guanine phage targeting scope of the Dag1
    and Dag2 antiviral effectors.
- reference: DOI:10.1038/s41564-026-02441-0
  snippet: Together, these findings establish DNA glycosylases as a versatile class
    of bacterial immune proteins
  notes: Getz et al. frame defense-associated DNA glycosylases as bacterial immune
    proteins.
