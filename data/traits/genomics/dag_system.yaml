discussions:
- discussion_id: dag-defensefinder-profile-gap
  prompt: Resolve exact Dag1 and Dag2 family boundaries, natural host exemplars, modified-guanine
    phage target breadth, and DefenseFinder HMM/rules coverage before minting narrower
    Dag mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Getz et al. support Dag1 and Dag2 as widespread families of anti-phage
    DNA glycosylases that selectively target phages carrying modified guanine bases,
    and the pinned DefenseFinder article registry maps the Dag key to the Getz et
    al. preprint DOI. The pinned HMM inventory and rules table have no exact Dag rows.
    This first-pass record therefore does not resolve exact Dag1 versus Dag2 family
    boundaries, natural host exemplars, accession-level Dag proteins, full modified-guanine
    phage target breadth, or a reusable DefenseFinder profile model.
