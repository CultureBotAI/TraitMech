identifier: traitmech:000507
label: Dag system
definition: A phage defense system in which an organism possesses a Dag-family DNA-glycosylase
  system whose Dag1 or Dag2 effectors selectively target phages carrying modified
  guanine bases.
definition_source: DOI:10.1038/s41564-026-02441-0
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
