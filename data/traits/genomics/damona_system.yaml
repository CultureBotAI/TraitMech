discussions:
- discussion_id: damona-mechanism-gap
  prompt: Resolve Damona phage triggers and effector outputs before minting narrower
    Damona mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Damona as a named anti-phage
    system with a VCA0399 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
