discussions:
- discussion_id: type-iig-rm-profile-interpretation-gap
  prompt: Resolve the accession-level relationships between DefenseFinder RM_Type_IIG
    custom profiles, characterized BpuSI- or Tth111II-like enzymes, and companion
    methyltransferases before minting narrower Type IIG protein or subfamily traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Shen et al. and Zhu et al. support Type IIG R-M system architecture and
    experimentally characterized BpuSI and Tth111II examples, while the pinned DefenseFinder
    registry supports an RM_Type_IIG system-level namespace with eight custom HMM
    rows. The evidence does not yet map each custom profile row to exact characterized
    enzyme families or resolve companion methyltransferase requirements.
  evidence:
  - reference: DOI:10.1093/nar/gkr543
    snippet: Type IIG R–M systems also follow this general strategy for target recognition,
      but instead of encoding separate REase, MTase and specificity subunits, they
      have evolved to combine them within a single uninterrupted protein chain.
    notes: Shen et al. define Type IIG restriction-modification systems as systems
      that combine restriction, methyltransferase, and specificity subunits in one
      uninterrupted protein chain.
  - reference: DOI:10.1038/srep03838
    snippet: Tth111II contains both endonuclease (R) and methylase (M) domains and
      a shared specificity domain (S).
    notes: The cloned Tth111II Type IIGS enzyme has endonuclease, methylase, and specificity
      domains in one polypeptide.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "RM\tRM_Type_IIG\t1\t1\tRM_Type_IIG__Type_IIG\t\tBREX__pglZB, DISARM__drmB\t"
    notes: The DefenseFinder rules table models RM_Type_IIG as an RM subsystem that
      requires the RM_Type_IIG__Type_IIG profile group and excludes two non-RM profiles.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| RM_Type_IIG__Type_IIG_1                          |                                                  |
