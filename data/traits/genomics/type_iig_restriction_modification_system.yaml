  title: Type IIG R-M loci mark self and restrict foreign DNA
  description: Conservative system-level sketch linking Type IIG restriction-methyltransferase-specificity
    fusion loci to restriction-modification-mediated foreign DNA cleavage.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the reusable Type IIG locus architecture and the
    DefenseFinder RM_Type_IIG custom-profile namespace without asserting an accession-level
