identifier: traitmech:000375
label: type IIG restriction-modification system
definition: A restriction-modification system in which an organism possesses a Type
  IIG locus centered on a restriction-methyltransferase-specificity fusion gene represented
  by DefenseFinder as the RM_Type_IIG subsystem.
definition_source: DOI:10.1093/nar/gkr543
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000493
synonyms:
- synonym_text: RM_Type_IIG
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: RM_Type_IIG__Type_IIG
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
evidence:
- reference: DOI:10.1093/nar/gkr543
  snippet: Type IIG R–M systems also follow this general strategy for target recognition,
    but instead of encoding separate REase, MTase and specificity subunits, they have
    evolved to combine them within a single uninterrupted protein chain.
  notes: Shen et al. define Type IIG restriction-modification systems as systems that
    combine restriction, methyltransferase, and specificity subunits in one uninterrupted
    protein chain.
- reference: DOI:10.1093/nar/gkr543
  snippet: The entire BpuSI R–M system consists of two MTase genes (M1 and M2) and
    the R–M fusion gene.
  notes: The characterized BpuSI Type IIG example carries two companion methyltransferase
    genes and an R-M fusion gene, supporting a locus-level system trait rather than
    a single protein trait.
- reference: DOI:10.1038/srep03838
  snippet: Type IIG (symmetric or asymmetric target sites; endonuclease activity affected
    by AdoMet (SAM))
  notes: Zhu et al. place Type IIG in the Type II restriction enzyme classification
    and describe variable target symmetry plus AdoMet/SAM-sensitive endonuclease activity.
- reference: DOI:10.1038/srep03838
  snippet: Tth111II contains both endonuclease (R) and methylase (M) domains and a
    shared specificity domain (S).
  notes: The cloned Tth111II Type IIGS enzyme has endonuclease, methylase, and specificity
    domains in one polypeptide.
- reference: DOI:10.1038/srep03838
  snippet: The biological function of restriction-modification systems is to restrict/cleave
    foreign invading DNA
  notes: Zhu et al. frame the Type IIGS decision between cleaving and modifying unmodified
    DNA in the broader restriction-modification role of cleaving foreign invading
    DNA.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RM_Type_IIG | 10\.1093/nar/gkac975 | REBASE: a database for DNA restriction
    and modification: enzymes, genes and genomes'
  notes: The pinned DefenseFinder article registry maps the named RM_Type_IIG model
