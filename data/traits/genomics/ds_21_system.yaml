    \ hypothetical protein\tWP_001532221.1, WP_001557682.1, WP_021552536.1\t10.9763556055726\t\
    2.883007179633958\tTrue\tTrue\tPredicted novel defense gene\tDS-21"
  notes: The final Science supplementary Table S6 maps working_id TOXO to DS_name
