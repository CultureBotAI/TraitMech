    and final Science Tables S6/S7/S8 map it to three product accessions, a Bas1 phage
    readout, display name DS-21, and a PDDEXK HHpred row. The pinned DefenseFinder
    HMM inventory records three DS-21 custom profile rows. The pinned rules table
    has no DS-21 row, and the first-pass record does not resolve native host breadth,
    complete phage breadth, direct profile-to-protein correspondence, PDDEXK nuclease
    activity, molecular output, or endogenous DS-21 activity.
