identifier: traitmech:000479
label: HEC-08 system
definition: A phage defense system in which an organism possesses the single-gene
  HEC-08 Hma-embedded candidate locus, encoding a higher eukaryotes and prokaryotes
  nucleotide-binding domain-containing protein, that can reduce bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
