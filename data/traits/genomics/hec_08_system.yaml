  snippet: RelE (HEC-07), higher eukaryotes and prokaryotes nucleotide-binding (HEPN)
    (HEC-08) and Nedd4-BP1/YacP nuclease (NYN) (HEC-09) domain-containing proteins
  notes: Payne et al. identify HEC-08 as a HEPN-domain Hma-embedded candidate system.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: these were able to reduce the EOP of at least two phages
