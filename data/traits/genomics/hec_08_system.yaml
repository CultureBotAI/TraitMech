    molecular output, and rule-level detection criteria before minting narrower HEC-08
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Payne et al. support HEC-08 as a single-gene Hma-embedded candidate anti-phage
    system encoding a HEPN-domain protein, and the pinned DefenseFinder HMM inventory
    records one HEC-08 profile row. The pinned rules table has no HEC-08 row, and
    the first-pass record does not yet resolve natural host breadth, phage target
    breadth, or the direct molecular output.
