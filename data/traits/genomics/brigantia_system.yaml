discussions:
- discussion_id: brigantia-mechanism-gap
  prompt: Resolve Brigantia phage triggers and effector outputs before minting narrower
    Brigantia mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Brigantia as a named anti-phage
    system with a VCA0419 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
