identifier: traitmech:000270
label: Brigantia system
definition: A phage defense system in which an organism possesses a Brigantia locus
  represented by a VCA0419 profile that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1126/science.ads0768
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
