discussions:
- discussion_id: type-iii-rm-profile-interpretation-gap
  prompt: Resolve the accession-level relationships between DefenseFinder RM_Type_III
    custom methyltransferase and restriction-endonuclease profiles and characterized
    Mod and Res families before minting narrower Type III protein or custom-profile
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Butterer et al. support Type III R-M Res/Mod architecture, while the
    pinned DefenseFinder registry supports an RM_Type_III namespace with broad Type_III_MTases
    and Type_III_REases custom profile groups. The evidence does not yet map individual
    custom profile rows to exact characterized Res or Mod families or resolve whether
    each source-model boundary corresponds to a reusable organism-level trait below
    this class.
  evidence:
  - reference: DOI:10.1093/nar/gku122
