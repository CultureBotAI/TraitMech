identifier: traitmech:000495
label: type III restriction-modification system
definition: A restriction-modification system in which an organism possesses a Type
  III R-M locus encoding Mod-like DNA methyltransferase and Res-like ATP-dependent
  restriction subunits, including RM_Type_III loci represented by DefenseFinder.
definition_source: DOI:10.1093/nar/gku122
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000095
synonyms:
- synonym_text: RM_Type_III
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: RM_Type_III__Type_III_MTases
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
- synonym_text: RM_Type_III__Type_III_REases
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
evidence:
- reference: DOI:10.1093/nar/gku122
  snippet: The Type III REs are hetero-oligomeric assemblies, comprising polypeptides
    encoded by the res (restriction) and mod (modification) genes (4).
  notes: Butterer et al. describe Type III restriction endonucleases as hetero-oligomeric
    assemblies encoded by res restriction and mod modification genes.
- reference: DOI:10.1093/nar/gku122
  snippet: In this study, we present a series of results obtained by native mass spectrometry
    and size exclusion chromatography with multi-angle light scattering consistent
    with a 1:2 ratio of Res to Mod subunits in the EcoP15I, EcoPI and PstII complexes
    as the main holoenzyme species and a 1:1 stoichiometry of specific DNA (sDNA)
    binding by EcoP15I and EcoPI.
  notes: Butterer et al. support a Type III R-M holoenzyme model with one Res subunit
    and two Mod subunits for characterized EcoP15I, EcoPI, and PstII complexes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RM_Type_III | 10\.1093/nar/gkac975 | REBASE: a database for DNA restriction
    and modification: enzymes, genes and genomes'
  notes: The pinned DefenseFinder article registry maps the RM_Type_III model namespace
    to the REBASE update.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "RM\tRM_Type_III\t2\t2\tRM_Type_III__Type_III_MTases, RM_Type_III__Type_III_REases\t\
    \t\t"
  notes: The DefenseFinder rules table models RM_Type_III as an RM subsystem requiring
    Type_III_MTases and Type_III_REases profile groups.
