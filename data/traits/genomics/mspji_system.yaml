discussions:
- discussion_id: mspji-defensefinder-model-gap
  prompt: Resolve MspJI-family breadth, methylcytosine and hydroxymethylcytosine sequence-context
    specificity across natural hosts, accession-level protein examples, and DefenseFinder
    RM_Type_IV HMM/rules mapping before minting narrower MspJI mechanism or component
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Zheng et al. support MspJI as a methylcytosine- and hydroxymethylcytosine-dependent
    restriction endonuclease, Cohen-Karni et al. support MspJI homologs as a family
    of C5-modified-cytosine-dependent restriction endonucleases, and the pinned DefenseFinder
    article registry maps MspJI to the Cohen-Karni et al. paper. The pinned HMM inventory
    and rules table have no exact MspJI rows. This first-pass record therefore does
    not resolve a reusable DefenseFinder profile model, exact accession-level protein
    examples, the breadth of MspJI-like systems across natural hosts, or the complete
    set of natural methylcytosine and hydroxymethylcytosine sequence contexts.
  evidence:
  - reference: DOI:10.1073/pnas.1018448108
