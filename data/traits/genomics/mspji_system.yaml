identifier: traitmech:000510
label: MspJI system
definition: A type IV modification-dependent restriction system in which an organism
  possesses an MspJI-family Mrr-like locus encoding a restriction endonuclease that
  recognizes methylcytosine- or hydroxymethylcytosine-modified DNA and cleaves both
  strands at a fixed distance from the modified cytosine.
definition_source: DOI:10.1073/pnas.1018448108
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: MspJI
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1073/pnas.1018448108
  snippet: MspJI is a novel modification-dependent restriction endonuclease that cleaves
    at a fixed distance away from the modification site.
  notes: Cohen-Karni et al. support MspJI as a modification-dependent restriction
    endonuclease with distance-defined cleavage relative to its modified target.
- reference: DOI:10.1073/pnas.1018448108
  snippet: All of the enzymes specifically recognize cytosine C5 modification (methylation
    or hydroxymethylation) in DNA and cleave at a constant distance (N(12)/N(16))
    away from the modified cytosine.
  notes: Cohen-Karni et al. biochemically characterized MspJI homologs and support
    the MspJI family as C5-modified-cytosine-dependent restriction endonucleases.
- reference: DOI:10.1093/nar/gkq327
  snippet: Besides 5-methylcytosine, MspJI also recognizes 5-hydroxymethylcytosine
    but is blocked by 5-glucosylhydroxymethylcytosine.
  notes: Zheng et al. support MspJI restriction of both methylcytosine- and hydroxymethylcytosine-containing
    DNA while leaving glucosylated hydroxymethylcytosine DNA uncleaved.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| MspJI | 10\.1073/pnas\.1018448108 | The MspJI family of modification-dependent
    restriction endonucleases for epigenetic studies | '
  notes: The pinned DefenseFinder article registry maps the MspJI source key to the
    Cohen-Karni et al. MspJI-family paper.
