discussions:
- discussion_id: gao-upx-mechanism-gap
  prompt: Resolve Gao_Upx natural hosts, UpxA component function, phage triggers,
    and effector activity before minting narrower Gao_Upx mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes that mediate protection
    against specific bacteriophages, and DefenseFinder models Gao_Upx as a single-profile
