discussions:
- discussion_id: disarm2-profile-activity-gap
  prompt: Resolve DISARM2 effector chemistry, exact native hosts, sensitive-phage
    breadth, shared-core component roles, and DISARM_2 profile-to-activity criteria
    before minting DISARM2 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Ofir et al. support DISARM as a broad antiphage-system family, and the
    pinned DefenseFinder HMM inventory and rules table support DISARM_2 as a subtype
    with drmE, drmMII, drmA, drmB, and drmC profiles. This first-pass record leaves
    exact DISARM2 effector chemistry, native host breadth, sensitive-phage breadth,
    shared-core component roles, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1038/s41564-017-0051-0
    snippet: Our results establish DISARM as a new defence system, providing protection
      against diverse phages
    notes: Ofir et al. experimentally established DISARM as a broad-spectrum phage
      defense system.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| DISARM__drmA                                     | DISARM__drmA                                     |
