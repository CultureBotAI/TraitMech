discussions:
- discussion_id: ceres-mechanism-gap
  prompt: Resolve Ceres phage triggers and effector outputs before minting narrower
    Ceres mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Ceres as a named anti-phage
    system with CrsA1 and CrsA2 HMM profile entries, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
  attaches_to:
