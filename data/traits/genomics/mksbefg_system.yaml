identifier: traitmech:000526
label: MksBEFG system
definition: A Wadjet system in which an organism possesses an MksBEFG derivative SMC
  locus encoding an MksBEF ATPase core and an MksG nuclease that degrades plasmid
  DNA.
definition_source: DOI:10.1093/nar/gkad130
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000218
synonyms:
- synonym_text: MksBEFG
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1093/nar/gkad130
evidence:
- reference: DOI:10.1093/nar/gkad130
  snippet: The MksG nuclease is the executing part of the bacterial plasmid defense
    system MksBEFG
  notes: Weiss et al. describe MksBEFG as a bacterial plasmid-defense system and identify
    MksG as its executing nuclease component.
- reference: DOI:10.1093/nar/gkad130
  snippet: MksG is a nuclease that degrades plasmid DNA
  notes: Weiss et al. support plasmid-DNA degradation by the MksG nuclease of the
    MksBEFG system.
- reference: DOI:10.1093/nar/gkad130
  snippet: Introduction of plasmids results in an increase in DNA bound MksG, indicating
    an activation of the system in vivo
  notes: Weiss et al. support plasmid-responsive activation of the Corynebacterium
    glutamicum MksBEFG system in vivo.
- reference: DOI:10.1093/nar/gkad130
  snippet: The MksBEF subunits exhibit an ATPase cycle in vitro
  notes: Weiss et al. support ATPase cycling by the C. glutamicum MksBEF core.
- reference: DOI:10.1016/j.molcel.2022.11.015
  snippet: Wadjet systems (JetABCD/MksBEFG/EptABCD) are derivative SMC complexes with
    roles in bacterial immunity against selfish DNA
  notes: Liu et al. support MksBEFG as a Wadjet-family derivative SMC complex related
    to JetABCD and EptABCD.
canonical_examples:
- taxon_id: NCBITaxon:1718
  taxon_label: Corynebacterium glutamicum
  note: Weiss et al. investigated the Corynebacterium glutamicum MksBEFG complex and
    showed that plasmid introduction increased DNA-bound MksG in vivo.
  reference: DOI:10.1093/nar/gkad130
