  prompt: Resolve MksBEFG plasmid substrate breadth, MksBEF ATPase-to-MksG coupling,
    MksG activation state, and accession-level protein examples before minting narrower
    MksBEFG mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Weiss et al. support MksBEFG as a bacterial plasmid-defense system with
    an MksBEF ATPase core and MksG plasmid-DNA-degradation nuclease, and Liu et al.
    place MksBEFG in the broader Wadjet derivative-SMC family. This first-pass record
    leaves exact plasmid substrate breadth, MksBEF-to-MksG coupling, cellular MksG
    loading, and accession-level component examples unresolved.
