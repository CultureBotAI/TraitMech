evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-Lambda-1 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-1.md
  snippet: The PD-Lambda-1 system is composed of one protein, PD-Lambda-1, and confers
    resistance to LambdaVir :ref{doi=10.1038/s41564-022-01219-4}.
  notes: The DefenseFinder wiki describes PD-Lambda-1 as a one-protein system that
    can confer LambdaVir resistance.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-1.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The DefenseFinder wiki records the PD-Lambda-1 molecular mechanism as unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-1.md
  snippet: 'The PD-Lambda-1 is composed of 1 protein: PD-Lambda-1.'
