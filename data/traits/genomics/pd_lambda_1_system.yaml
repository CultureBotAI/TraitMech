discussions:
- discussion_id: pd-lambda-1-mechanism-gap
  prompt: Resolve PD-Lambda-1 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-Lambda-1 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-Lambda-1 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to LambdaVir protection, and DefenseFinder represents the system
    with one profile. Natural host breadth, the direct phage trigger, and effector
    logic remain unresolved.
