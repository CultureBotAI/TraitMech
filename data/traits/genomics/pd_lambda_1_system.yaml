identifier: traitmech:000404
label: PD-Lambda-1 system
definition: A phage defense system in which an organism possesses a PD-Lambda-1 locus
  represented by DefenseFinder as a single-profile model, PD-Lambda-1__PD-Lambda-1,
  and experimentally linked to LambdaVir protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-1.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
