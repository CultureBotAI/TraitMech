  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/ismej.2017.16
evidence:
- reference: DOI:10.1128/MMBR.67.2.238-276.2003
  notes: Canchaya et al. review prophage genomics, showing most sequenced bacterial
    genomes carry prophage sequences.
- reference: DOI:10.1038/ismej.2017.16
  notes: Howard-Varona et al. review lysogeny in nature, the maintenance of temperate
    phage genomes within hosts.
causal_graphs:
