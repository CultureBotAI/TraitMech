identifier: traitmech:000091
label: prophage
definition: A genomics trait describing possession of an integrated (or
  extrachromosomal) temperate bacteriophage genome (a prophage) maintained in the
  host during lysogeny, often contributing genes that alter host phenotype.
definition_source: DOI:10.1128/MMBR.67.2.238-276.2003
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000089
