discussions:
- discussion_id: hec-02-defensefinder-model-gap
  prompt: Resolve HEC-02 native host breadth, exact HEC-02A/HEC-02B component functions,
    sensitive-phage breadth, molecular output, and rule-level detection criteria before
    minting narrower HEC-02 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Payne et al. support HEC-02 as an Hma-embedded candidate anti-phage system
    whose two genes are both required for defense, and the pinned DefenseFinder HMM
    inventory records HEC-02A and HEC-02B profile rows. The pinned rules table has
    no HEC-02 row, and the first-pass record does not yet resolve natural host breadth,
    HEC-02 profile-to-component mapping, phage target breadth, or the direct molecular
    output.
  evidence:
  - reference: DOI:10.1101/2024.01.29.577857
    snippet: The candidate systems encoded diverse protein families, including three
      ATPases associated with either a topoisomerase-primase (TOPRIM) (HEC-01), nuclease-related
      (NERD) (HEC-02), or PilT N-terminal (PIN) (HEC-03) domain-containing protein
    notes: Payne et al. identify HEC-02 as one of the ATPase-associated Hma-embedded
      candidate systems.
  - reference: DOI:10.1101/2024.01.29.577857
    snippet: For the two-gene systems HEC-02 and HEC-03, both genes were required
      for defence
    notes: Payne et al. support two-gene requirement for HEC-02-mediated defense.
