    - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
      snippet: AbiV | 10\.1128/AEM\.00780-08 | AbiV, a novel antiphage abortive infection
        mechanism on the chromosome of Lactococcus lactis subsp\. cremoris MG1363
      notes: DefenseFinder records AbiV as a named antiphage abortive-infection system
