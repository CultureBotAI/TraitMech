discussions:
- discussion_id: abiv-mechanism-gap
  prompt: Resolve the AbiV phage trigger, host target, c2-specific output, and phage-escape
    routes before minting narrower AbiV mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Haaber et al. support AbiV as a single-gene Abi system that acts after
    phage DNA replication and prevents cleavage of replicated 936-like phage DNA,
    but the direct AbiV target, the trigger that connects infection to activity, the
    mechanism restricting c2-like phages, and AbiV-insensitive escape routes are unresolved.
  attaches_to:
  - causal_graphs#abiv_late_phage_dna_maturation_block
  posed_by: codex
  posed_date: '2026-09-20'
