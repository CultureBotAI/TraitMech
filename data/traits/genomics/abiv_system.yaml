discussions:
- discussion_id: abiv-mechanism-gap
  prompt: Resolve the host translational target of the AbiV-SaV complex before minting
    narrower AbiV mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Haaber et al. identify phage sav as the determinant of AbiV sensitivity
    and support direct AbiV-SaV complex formation followed by inhibition of phage
    protein translation, but the precise host translational target and complete route
    from the AbiV-SaV complex to abortive infection remain unresolved.
  attaches_to:
  - causal_graphs#abiv_sav_translation_block
  posed_by: codex
  posed_date: '2026-09-20'
