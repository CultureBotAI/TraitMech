    description: An abortive-infection locus encoding the AbiV phage resistance determinant.
  - node_id: abiv_antiphage_activity
    label: AbiV antiphage activity
    node_type: BIOLOGICAL_PROCESS
    description: Abortive-infection antiphage activity mediated by the AbiV protein.
  - node_id: stalled_phage_dna_maturation
    label: stalled phage DNA maturation
    node_type: BIOLOGICAL_PROCESS
    description: Late phage DNA maturation block in which replicated concatemeric
      936-like phage DNA is not cleaved into mature resolved DNA.
  - node_id: restricted_phage_propagation
    label: restricted phage propagation
    node_type: BIOLOGICAL_PROCESS
    description: Reduced completion of 936-like or c2-like phage propagation in an
      AbiV-containing infected host cell.
  - node_id: abiv_system_trait
