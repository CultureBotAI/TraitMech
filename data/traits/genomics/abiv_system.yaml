identifier: traitmech:000300
label: AbiV system
definition: An abortive infection system in which an organism possesses an abiV locus
  whose encoded AbiV protein can restrict 936-like or c2-like lactococcal phages by
  interfering with late phage DNA maturation.
definition_source: DOI:10.1128/AEM.00780-08
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1128/AEM.00780-08
  snippet: We report here a novel lactococcal Abi system, designated AbiV, which is
    chromosomally encoded and effective against virulent phages belonging to the 936
    and c2 species
  notes: Haaber et al. name AbiV as a chromosomal lactococcal abortive-infection system
    that can defend against 936- and c2-group virulent phages.
- reference: DOI:10.1128/AEM.00780-08
  snippet: This gene was also found to confer phage resistance to L. lactis MG1363
    when it was cloned into an expression vector
  notes: Haaber et al. show that expressing the AbiV open reading frame is sufficient
    to confer phage resistance in Lactococcus lactis MG1363.
- reference: DOI:10.1128/AEM.00780-08
  snippet: A subsequent frameshift mutation in the ORF completely eliminated the phage
    resistance phenotype, confirming that the ORF was necessary for phage resistance
  notes: Haaber et al. show that the AbiV open reading frame is necessary for the
    cloned resistance phenotype.
- reference: DOI:10.1128/AEM.00780-08
  snippet: the data show that the phage resistance mechanism encoded by orf1 is an
    abortive infection mechanism
  notes: Haaber et al. classify the orf1/abiV resistance determinant as an abortive-infection
    mechanism.
- reference: DOI:10.1128/AEM.00780-08
  snippet: AbiV prevented cleavage of the replicated phage DNA and thus that it acts
    at a later stage of the phage infection process
  notes: Haaber et al. localize AbiV activity after phage DNA replication and connect
    it to failed DNA cleavage.
- reference: DOI:10.1128/AEM.00780-08
  snippet: AbiV inhibits proliferation of small isometric phages belonging to the
    936 species and of prolate phages belonging to the c2 species
  notes: Haaber et al. support the observed 936- and c2-species phage sensitivity
    of the AbiV system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: AbiV | 10\.1128/AEM\.00780-08 | AbiV, a novel antiphage abortive infection
    mechanism on the chromosome of Lactococcus lactis subsp\. cremoris MG1363
  notes: The DefenseFinder article registry maps the named AbiV system to the Haaber
    et al. AbiV paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiV__AbiV                                       | AbiV__AbiV                                       |
    AbiV                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records the custom AbiV profile in the AbiV
    model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiV\tAbiV\t1\t1\tAbiV__AbiV"
  notes: The DefenseFinder rules table models AbiV as a single-profile system.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Haaber et al. discovered abiV on the Lactococcus lactis subsp. cremoris MG1363
    chromosome, expressed it in Lactococcus lactis MG1363, and showed that its expression
    conferred abortive-infection phage resistance.
  reference: DOI:10.1128/AEM.00780-08
causal_graphs:
- graph_id: abiv_late_phage_dna_maturation_block
  title: AbiV activity blocks late phage DNA maturation
  description: Evidence-backed process sketch linking an abiV locus to AbiV antiphage
    activity, failed late DNA maturation of replicated phage DNA, restricted phage
    propagation, and abortive-infection system possession.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiV at the system level without asserting a direct
    phage trigger, the host substrate, the exact route to phage-DNA maturation arrest,
    a c2-specific mechanism, or why one tested 936 phage and the P335 phages were
    insensitive.
  nodes:
  - node_id: abiv_locus
    label: abiV locus
