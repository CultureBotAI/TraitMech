  description: Conservative system-level sketch linking the two-gene DS-33 locus to
    reduced bacteriophage plaquing without resolving DS-33 component function or molecular
    output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-33 as the validated GNAT transcriptional unit
    with two product accessions, a lower-probability Csa3 HHpred row for WP_000354965.1,
    a high-probability HEPN HHpred row for WP_014639476.1, and one DefenseFinder DS-33
    profile row. It does not assert native host breadth, exact profile-to-protein
    correspondence, DS-33 molecular activity, trigger, substrate, complete phage breadth,
    Csa3 or HEPN HHpred-domain interpretation, or DefenseFinder rule-level detection
    criteria.
