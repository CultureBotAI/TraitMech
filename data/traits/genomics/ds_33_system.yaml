discussions:
- discussion_id: ds-33-defensefinder-model-gap
  prompt: Resolve DS-33 native host breadth, exact component activities, profile-to-protein
    mapping, Csa3 and HEPN HHpred-domain interpretation, complete phage breadth, molecular
    output, and rule-level DefenseFinder criteria before minting narrower DS-33 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-33 as the defensive GNAT transcriptional unit
    and final Science Tables S6/S7/S8 map it to two product accessions, a Bas26 phage
    readout, display name DS-33, and two HHpred rows. The pinned DefenseFinder HMM
    inventory records one DS-33 custom profile row. The pinned rules table has no
    DS-33 row, and the first-pass record does not resolve native host breadth, complete
    phage breadth, direct profile-to-protein correspondence, component activities,
    molecular output, or endogenous DS-33 activity.
