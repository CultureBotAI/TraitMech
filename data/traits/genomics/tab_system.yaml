identifier: traitmech:000413
label: Tab system
definition: A phage defense system in which an organism or resident prophage possesses
  a Tab virion-assembly-inhibition locus that expresses the Tab tail-assembly-blocking
  protein, blocks assembly of invading phage tails, prevents infectious virion formation,
  and protects the bacterial community from phage spread.
definition_source: DOI:10.1038/s41467-024-45892-x
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Tab
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41467-024-45892-x
evidence:
- reference: DOI:10.1038/s41467-024-45892-x
  snippet: a type of anti-phage defence that interferes with the virion assembly pathway
    of invading phages
  notes: Patel et al. define the Tab-associated anti-phage defence as interference
    with the virion assembly pathway of invading phages.
- reference: DOI:10.1038/s41467-024-45892-x
  snippet: The protein that mediates this defence, which we call Tab
  notes: Patel et al. name the protein mediating this prophage defence Tab.
- reference: DOI:10.1038/s41467-024-45892-x
  snippet: blocks assembly of the phage tail, thus preventing formation of infectious
    virions
  notes: Patel et al. show that Tab blocks phage-tail assembly and thereby prevents
    production of infectious virions.
- reference: DOI:10.1038/s41467-024-45892-x
  snippet: there is no release of infectious phage progeny, and the bacterial community
    is thereby protected from a phage epidemic
  notes: Patel et al. connect Tab-mediated inhibition of infectious phage release
    to protection of the bacterial community from a phage epidemic.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Tab | 10\.1038/s41467-024-45892-x | Anti-phage defence through inhibition
    of virion assembly |'
  notes: The pinned DefenseFinder article registry maps the named Tab system to the
    Patel et al. virion-assembly-inhibition paper. The pinned HMM inventory (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md)
    and pinned rules table (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv)
    do not list Tab, so this row is name-to-paper evidence rather than model-component
    evidence.
