discussions:
- discussion_id: tab-defensefinder-model-gap
  prompt: Resolve Tab host breadth, sensitive-phage breadth, counter-defence specificity,
    and DefenseFinder HMM/rules coverage before minting narrower Tab mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Patel et al. support Tab as a prophage-encoded anti-phage defence protein
    that blocks invading phage-tail assembly and prevents release of infectious phage
    progeny, while the pinned DefenseFinder article registry names a Tab system. The
    pinned DefenseFinder HMM inventory and rules table have no Tab rows, and the evidence
    does not yet resolve host breadth, target-phage breadth, counter-defence specificity,
    or profile-to-activity modeling.
  evidence:
  - reference: DOI:10.1038/s41467-024-45892-x
    snippet: blocks assembly of the phage tail, thus preventing formation of infectious
      virions
    notes: Patel et al. support Tab blockade of phage-tail assembly.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
    snippet: '| Tab | 10\.1038/s41467-024-45892-x | Anti-phage defence through inhibition
      of virion assembly |'
    notes: The pinned DefenseFinder article registry maps the named Tab system to
      the Patel et al. virion-assembly-inhibition paper. The pinned HMM inventory
      (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md)
      and pinned rules table (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv)
      do not list Tab, so this row is name-to-paper evidence rather than model-component
