discussions:
- discussion_id: ds-19-defensefinder-model-gap
  prompt: Resolve DS-19 native host breadth, exact profile-to-protein mapping, low-confidence
    HHpred-domain interpretation, component chemistry, complete phage breadth, molecular
    output, and rule-level DefenseFinder criteria before minting narrower DS-19 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-19 as the defensive PDP4 transcriptional unit
    and final Science Tables S6/S7/S8 map it to product accession WP_000020904.1,
    a Bas19 phage readout, display name DS-19, and a lower-probability PDDEXK HHpred
    row. The pinned DefenseFinder HMM inventory records one DS-19 custom profile row.
    The pinned rules table has no DS-19 row, and the first-pass record does not resolve
    native host breadth, complete phage breadth, direct profile-to-protein correspondence,
    PDDEXK nuclease activity, molecular output, or endogenous DS-19 activity.
