- graph_id: ds_19_locus_reduces_phage_plaquing
  title: DS-19 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-19 locus
    to reduced bacteriophage plaquing without resolving DS-19 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-19 as the validated PDP4 transcriptional unit
    with one product accession, a lower-probability PDDEXK HHpred-domain row, and
    one DefenseFinder DS-19 profile row. It does not assert native host breadth, exact
    profile-to-protein correspondence, DS-19 molecular activity, trigger, substrate,
    complete phage breadth, or DefenseFinder rule-level detection criteria.
