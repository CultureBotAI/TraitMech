      snippet: Abi prevents the phage epidemic from spreading to nearby cells, thus
        protecting the bacterial colony
      notes: Lopatina et al. support the population-level benefit of abortive infection.
  - subject: host_growth_arrest_or_cell_death
    predicate: confers
    predicate_id: METPO:2007700
    object: abortive_infection_system_trait
    description: Phage-triggered infected-host arrest or death realizes the abortive-infection
