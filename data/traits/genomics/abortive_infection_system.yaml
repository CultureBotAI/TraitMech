identifier: traitmech:000214
label: abortive infection system
definition: A genomics trait describing possession of a bacteriophage abortive-infection
  defense system in which phage infection activates a host-encoded growth-arrest or
  cell-death program that prevents completion of phage replication and protects nearby
  bacterial cells.
definition_source: DOI:10.1146/annurev-virology-011620-040628
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Abi system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkt1419
evidence:
- reference: DOI:10.1146/annurev-virology-011620-040628
  snippet: A commonly used phage resistance strategy is abortive infection (Abi),
    in which the infected cell commits suicide before the phage can complete its replication
    cycle
  notes: Lopatina et al. support abortive infection as a phage resistance strategy
    that blocks completion of the phage replication cycle.
- reference: DOI:10.1146/annurev-virology-011620-040628
  snippet: The Abi strategy is manifested by a plethora of mechanistically diverse
    defense systems that are abundant in bacterial genomes
  notes: Lopatina et al. support defining the trait at the broad Abi system level
    rather than as one toxin-antitoxin family.
- reference: DOI:10.1073/pnas.0808832106
  snippet: Resistance strategies include the abortive infection (Abi) systems, which
    promote cell death and limit phage replication within a bacterial population
  notes: Fineran et al. summarize the cell-death and phage-limitation outputs of abortive
    infection systems.
- reference: DOI:10.1093/nar/gkt1419
  snippet: AbiE systems are encoded by bicistronic operons and function via a non-interacting
    (Type IV) bacteriostatic TA mechanism
  notes: Dy et al. support AbiE as a bacteriostatic toxin-antitoxin Abi family, one
    reason the parent record should cover growth arrest as well as cell death.
canonical_examples:
- taxon_id: NCBITaxon:29471
  taxon_label: Pectobacterium atrosepticum
  note: Fineran et al. identified the native toxIN locus from Erwinia carotovora subspecies
    atroseptica 1039 and demonstrated ToxIN-mediated phage resistance.
  reference: DOI:10.1073/pnas.0808832106
causal_graphs:
- graph_id: abortive_infection_population_level_defense
  title: Abortive infection halts infected cells to limit phage spread
  description: Evidence-backed process sketch linking phage-triggered Abi activation
    to infected-host growth arrest or death, restricted phage replication, and protection
    of nearby bacterial cells.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the shared Abi strategy without claiming that other
    abortive-infection families use one exact sensor, effector, toxin-antitoxin architecture,
    or cell-death mechanism.
  nodes:
  - node_id: phage_infection
    label: phage infection
    node_type: BIOLOGICAL_PROCESS
    description: Entry and intracellular replication attempt by a bacteriophage infecting
      a host bacterium.
  - node_id: abortive_infection_system_activation
    label: abortive infection system activation
    node_type: BIOLOGICAL_PROCESS
    description: Phage-infection-triggered activation of a host Abi system.
  - node_id: host_growth_arrest_or_cell_death
    label: host growth arrest or cell death
    node_type: BIOLOGICAL_PROCESS
    description: Abi-system output in which an infected host cell undergoes growth
      arrest or dies before productive phage replication is completed.
  - node_id: phage_replication
    label: phage replication
    node_type: BIOLOGICAL_PROCESS
    description: Replication and completion of a bacteriophage infection cycle inside
      a host cell.
  - node_id: bacterial_population_protection
    label: bacterial population protection
    node_type: BIOLOGICAL_PROCESS
    description: Reduced phage spread that protects nearby bacterial cells in the
      same population.
  - node_id: abortive_infection_system_trait
    label: abortive infection system
    node_type: TRAIT
    grounding: traitmech:000214
    description: Possession of a genome-encoded abortive-infection phage defense system.
  - node_id: phage_defense_system
    label: phage defense system
    node_type: TRAIT
    grounding: traitmech:000209
    description: Possession of one or more genome-encoded immune systems that inhibit
      bacteriophage infection.
