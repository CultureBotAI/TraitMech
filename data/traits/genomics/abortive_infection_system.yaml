      snippet: A commonly used phage resistance strategy is abortive infection (Abi),
        in which the infected cell commits suicide before the phage can complete its
        replication cycle
      notes: Lopatina et al. connect infected-cell death to premature phage-cycle
        termination.
  - subject: host_growth_arrest_or_cell_death
    predicate: contributes to
