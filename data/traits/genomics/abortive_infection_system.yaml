    object: abortive_infection_system_activation
    description: Phage infection triggers Abi defense-system activation.
    evidence:
    - reference: DOI:10.1093/nar/gkt1419
      snippet: Bacterial abortive infection (Abi) systems are ‘altruistic’ cell death
        systems that are activated by phage infection and limit viral replication,
        thereby providing protection to the bacterial population
      notes: Dy et al. support phage-triggered activation as a defining Abi-system
        behavior.
  - subject: abortive_infection_system_activation
    predicate: activates
    predicate_id: RO:0002213
    object: host_growth_arrest_or_cell_death
    description: Abi activation produces growth-arrest or cell-death outputs through
      family-specific effectors.
    evidence:
    - reference: DOI:10.1073/pnas.0808832106
      snippet: Resistance strategies include the abortive infection (Abi) systems,
        which promote cell death and limit phage replication within a bacterial population
      notes: Fineran et al. support cell death as an abortive-infection output.
    - reference: DOI:10.1093/nar/gkt1419
      snippet: AbiE systems are encoded by bicistronic operons and function via a
        non-interacting (Type IV) bacteriostatic TA mechanism
      notes: Dy et al. support bacteriostasis as an AbiE output, distinct from obligate
        cell death.
  - subject: host_growth_arrest_or_cell_death
    predicate: mitigates
