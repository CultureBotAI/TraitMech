discussions:
- discussion_id: abortive-infection-subfamily-split-gap
  prompt: Resolve other abortive-infection families before minting narrower children
    under the broad abortive infection system parent.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: ToxIN, AbiQ, AbiE, AbiZ, AbiK, AbiT, AbiV, BstA, Stk2, AbiH, AbiG, AbiI,
    AbiR, and AbiD are split out as traitmech:000226, traitmech:000225, traitmech:000227,
    traitmech:000228, traitmech:000229, traitmech:000230, traitmech:000300, traitmech:000301,
    traitmech:000303, traitmech:000304, traitmech:000306, traitmech:000316, traitmech:000317,
    and traitmech:000318, respectively. Lopatina et al., Fineran et al., Dy et al.,
    Durmaz and Klaenhammer, Wang et al., Bouchard et al., Haaber et al., Owen et al.,
    Depardieu et al., Prevots et al., O'Connor et al., Su et al., Twomey et al., and
    McLandsborough et al. still support Abi as a genomically encoded phage defense
    strategy that spans mechanistically diverse toxin-antitoxin, premature-lysis,
    RT-related polymerase, two-component, translation-inhibition, prophage-encoded
    DNA-replication-inhibition, staphylococcal-kinase-triggered cell death, lactococcal
    AbiH phage resistance, two-gene lactococcal AbiG RNA-synthesis interference, single-ORF
    lactococcal AbiI burst-size reduction, two-separated-locus lactococcal AbiR DNA-replication
    impediment, pBF61-derived lactococcal AbiD burst-size reduction, and other Abi
    families. Additional narrower TraitRecords need separate review to ground each
    subfamily's trigger, effector, growth-arrest or cell-death mechanism, and phage
    escape routes.
  posed_by: codex
  posed_date: '2026-09-15'
