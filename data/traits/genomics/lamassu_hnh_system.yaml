discussions:
- discussion_id: lamassu-hnh-function-and-model-scope
  prompt: Validate HNH-system function and reconcile detector scope.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The paper identifies HNH as a short-Lamassu effector type, and all 281
    HNH calls in Dataset S1 contain short LmuB. The pinned executable XML nevertheless
    permits long LmuB, so the detector name is not an exact biological equivalence.
    At the same commit, the legacy DefenseFinder_rules.tsv and Liste_hmm_system.md
    lack an HNH-system entry even though the executable XML and HNH profile exist.
    Summary-table absence is not model absence. HNH-specific experimental antiviral
    validation, exact substrates, activation order, and accession-level protein anchors
    remain unresolved. Cap4 and Lipase experiments do not establish HNH chemistry
    or its phage spectrum. No protein-resolved causal graph or functional equivalence
    to standalone HNH proteins is asserted. The direct parent is now traitmech:000570
    short Lamassu system, matching the short-form LmuB restriction already present
    in this record's definition. This hierarchy refinement does not narrow the executable
    detector, resolve the functional gaps, or reinterpret computational calls as measured
    antiviral phenotypes. A second direct parent, traitmech:000572 Lamassu type II
    system, now captures the LmuC component already required by this definition. The
    short-family parent is retained because component presence and LmuB-length family
    are separate axes. Neither hierarchy relation experimentally validates HNH antiviral
    activity or narrows the detector's broader scope.
  posed_by: codex
  posed_date: '2026-10-03'
