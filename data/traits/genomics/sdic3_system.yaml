evidence:
- reference: DOI:10.1016/j.celrep.2024.115055
  snippet: Using this approach, we identified three candidate anti-phage systems/subtypes,
    which were renamed SDIC1–3
  notes: Cummins et al. identify SDIC3 as one of three Serratia defense-island candidate
    anti-phage systems or subtypes.
- reference: DOI:10.1016/j.celrep.2024.115055
  snippet: In E. coli, SDIC1, SDIC2, and SDIC3 confer strong protection against several
    phages (R1,000-fold), including those from the Durham collection
  notes: Cummins et al. show that plasmid-expressed SDIC3 can strongly protect E.
    coli against several bacteriophages.
- reference: DOI:10.1016/j.celrep.2024.115055
  snippet: The four candidates were cloned into a low-copy plasmid under the control
    of a constitutive promoter compatible with expression in E. coli and S. marcescens
  notes: Cummins et al. assayed the four SDIC candidates from low-copy plasmids under
    a constitutive promoter.
