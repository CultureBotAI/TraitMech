causal_graphs:
- graph_id: sdic3_locus_restricts_phage
  title: SDIC3 loci confer bacterial phage defense
  description: Conservative system-level sketch linking an SDIC3 locus to reduced
    bacteriophage propagation without resolving exact SDIC3 components or effector
    activity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures SDIC3 as a named anti-phage system with DefenseFinder
    SDIC3B, SDIC3C, SDIC3D, SDIC3E, and SDIC3F profile rows. It does not assert native
    host breadth, SDIC3A status, exact profile-to-protein correspondence, whether
    SDIC3 is a distinct ECOR61-system subtype, sensitive-phage breadth, the direct
    trigger, the molecular output, or DefenseFinder rule-level detection criteria.
