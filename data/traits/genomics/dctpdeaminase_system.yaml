identifier: traitmech:000274
label: dCTPdeaminase system
definition: A phage defense system in which an organism possesses a dCTPdeaminase
  locus that converts dCTP into deoxy-uracil nucleotides during phage infection, depletes
  dCTP from the nucleotide pool, and halts phage replication by starving the phage
  of an essential DNA building block.
definition_source: DOI:10.1101/2021.04.26.441389
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
