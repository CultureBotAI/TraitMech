  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1101/2021.04.26.441389
  snippet: bacteria employ a similar strategy to defend against phage infection
  notes: Tal et al. support nucleotide depletion as a bacterial anti-phage strategy.
- reference: DOI:10.1101/2021.04.26.441389
  snippet: a family of defensive dCTP deaminase proteins that, in response to phage
    infection, convert dCTP into deoxy-uracil nucleotides
  notes: Tal et al. support the dCTPdeaminase family as a phage-responsive dCTP-conversion
    defense.
- reference: DOI:10.1101/2021.04.26.441389
  snippet: starving the phage of an essential DNA building block and halting its replication
  notes: Tal et al. connect dCTP depletion to phage DNA-building-block starvation
    and replication arrest.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: dCTPdeaminase | 10\.1101/2021\.04\.26\.441389 | Antiviral defense via nucleotide
    depletion in bacteria
  notes: The DefenseFinder article registry maps the named dCTPdeaminase system to
    the Tal et al. nucleotide-depletion preprint.
