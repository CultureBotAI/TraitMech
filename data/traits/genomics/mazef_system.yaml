discussions:
- discussion_id: mazef-activation-breadth-gap
  prompt: Resolve MazEF activation, direct MazF RNA targets, and RNA- versus DNA-phage
    breadth before minting narrower MazEF mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Nikolic et al. support native MazEF protection against RNA phages and
    argue that direct interference predominates in those assays, but the phage-induced
    route to active MazF, the relative contributions of phage-RNA cleavage and host-RNA
    degradation, the breadth of MazEF DNA-phage defense, and the DefenseFinder MazEF
    model boundaries remain unresolved.
  attaches_to:
  - causal_graphs#mazef_rna_phage_defense
