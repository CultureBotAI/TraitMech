canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Nikolic et al. compared Escherichia coli K-12 MG1655 derivatives carrying
    or lacking the native mazEF locus and found moderate but measurable native mazEF
    protection against the MS2 and Qbeta RNA phages.
  reference: DOI:10.1098/rsbl.2025.0080
