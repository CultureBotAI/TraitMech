identifier: traitmech:000345
label: MazEF system
definition: A phage defense system in which an organism possesses a two-component
  MazEF toxin-antitoxin locus whose MazE antitoxin and MazF endoribonuclease can protect
  Escherichia coli against RNA phages and that DefenseFinder represents with mandatory
  MazEF__MazE and MazEF__MazF profiles.
definition_source: DOI:10.1098/rsbl.2025.0080
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: MazEF
  synonym_type: EXACT_SYNONYM
  source: PMID:40494395
- synonym_text: mazEF
  synonym_type: RELATED_SYNONYM
  source: PMID:40494395
- synonym_text: MazEF__MazE
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: MazEF__MazF
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: PMID:40494395
  snippet: we investigated the role of a model toxin-antitoxin system, MazEF, in protecting
    Escherichia coli against two RNA phage species
  notes: Nikolic et al. directly tested MazEF as an Escherichia coli toxin-antitoxin
    module protecting against RNA phages.
- reference: PMID:40494395
  snippet: the native presence of mazEF moderately reduced population susceptibility
    and increased the survival of individual E. coli cells
  notes: Nikolic et al. support native mazEF as a moderate RNA phage defense determinant
    in Escherichia coli.
- reference: PMID:40494395
  snippet: Genomic analysis further revealed an underrepresentation of the MazF cleavage
    site in genomes of RNA phages infecting E. coli
  notes: Nikolic et al. support selection against MazF ACA cleavage sites in RNA phages
    that infect E. coli.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12151602/
  snippet: MazEF interferes with RNA phage replication within already infected cells
  notes: Nikolic et al. interpret the mazEF deletion phenotype as intracellular interference
    with RNA phage replication, not an adsorption defect.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12151602/
  snippet: direct interference, rather than abortive infection, plays the predominant
    role in the case of MazEF
  notes: Nikolic et al. caution that the main MazEF effect in their RNA phage assays
    appears to be direct interference rather than abortive infection.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: MazEF | 10\.1098/rsbl\.2025\.0080 | A bacterial toxin-antitoxin system
    as a native defence element against RNA phages
  notes: The DefenseFinder article registry maps the named MazEF system to the Nikolic
    et al. RNA-phage defense paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "MazEF\tMazEF\t2\t2\tMazEF__MazE, MazEF__MazF"
  notes: The DefenseFinder rules table models MazEF as a two-profile system requiring
    MazE and MazF profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| MazEF__MazE                                      | MazEF__MazE                                      |
    MazEF                  | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records the MazE profile in the MazEF model
    namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| MazEF__MazF                                      | MazEF__MazF                                      |
    MazEF                  | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records the MazF profile in the MazEF model
