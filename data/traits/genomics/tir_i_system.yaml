discussions:
- discussion_id: tir-i-detection-trigger-gap
  prompt: Resolve TIR-I native host breadth, the TIR-I__TIR-I_A and TIR-I__TIR-I_B
    profile-to-component mapping, phage-trigger specificity, TIR-domain output chemistry,
    and rule-level DefenseFinder detection criteria before minting narrower TIR-I
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wang et al. support TIR-I as one of nine newly named TIR-domain anti-phage
    defense systems and note that TIR-I occurs in diverse domain contexts. The pinned
    DefenseFinder HMM inventory records TIR-I__TIR-I_A and TIR-I__TIR-I_B custom profile
    rows, but the pinned DefenseFinder rules table has no TIR-I row. This first record
    therefore does not assert profile requirement logic, accession-level components,
    a universal domain architecture, or a direct phage trigger.
  evidence:
  - reference: DOI:10.1038/s41467-024-51738-3
    snippet: Twelve systems have defense activities against a variable number of phages,
      and 9 of them are new defense systems and named TIR-I to IX
    notes: Wang et al. report that TIR-I belongs to nine newly named TIR-domain anti-phage
      defense systems with activity against variable phage subsets.
  - reference: DOI:10.1038/s41467-024-51738-3
    snippet: TIR-I, TIR-III, and TIR-IV systems appear in diverse domains contexts,
      whereas the TIR-VII and TIR-VIII systems were found in a single form
    notes: Wang et al. support unresolved TIR-I domain architecture breadth.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| TIR-I__TIR-I_A                                   |                                                  |
      TIR-I                  | Custom                  | 300    |

      | TIR-I__TIR-I_B                                   |                                                  |
      TIR-I                  | Custom                  | 500    |'
    notes: The pinned DefenseFinder HMM inventory records TIR-I__TIR-I_A and TIR-I__TIR-I_B
      custom profiles under the TIR-I system namespace.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    notes: The pinned DefenseFinder rules table does not list TIR-I, leaving rule-level
      detection criteria unresolved.
