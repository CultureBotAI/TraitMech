identifier: traitmech:000480
label: TIR-I system
definition: A phage defense system in which an organism possesses a TIR-I locus, represented
  in the pinned DefenseFinder HMM inventory by TIR-I__TIR-I_A and TIR-I__TIR-I_B custom
  profiles, that can inhibit bacteriophage plaquing.
definition_source: DOI:10.1038/s41467-024-51738-3
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: TIR-I
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-024-51738-3
- synonym_text: TIR-I__TIR-I_A
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: TIR-I__TIR-I_B
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41467-024-51738-3
  snippet: Twelve systems have defense activities against a variable number of phages,
    and 9 of them are new defense systems and named TIR-I to IX
  notes: Wang et al. report that TIR-I belongs to nine newly named TIR-domain anti-phage
    defense systems with activity against variable phage subsets.
- reference: DOI:10.1038/s41467-024-51738-3
  snippet: The defense activity of the TIR systems against each phage was determined
    based on their ability to inhibit plaque formation compared to the pSEC1 empty
    vector control
  notes: Wang et al. assayed cloned Escherichia coli TIR systems by efficiency-of-plating
    reduction against a phage panel.
- reference: DOI:10.1038/s41467-024-51738-3
  snippet: TIR-I, TIR-III, and TIR-IV systems appear in diverse domains contexts,
    whereas the TIR-VII and TIR-VIII systems were found in a single form
  notes: Wang et al. found that TIR-I, TIR-III, and TIR-IV systems occur in diverse
    domain contexts, while TIR-VII and TIR-VIII systems were recovered in a single
    form.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| TIR-I | 10\.1038/s41467-024-51738-3 | The role of TIR domain-containing
    proteins in bacterial defense against phages |'
  notes: The pinned DefenseFinder article registry maps the named TIR-I system to
    the Wang et al. TIR-domain anti-phage system paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| TIR-I__TIR-I_A                                   |                                                  |
    TIR-I                  | Custom                  | 300    |

    | TIR-I__TIR-I_B                                   |                                                  |
    TIR-I                  | Custom                  | 500    |'
  notes: The pinned DefenseFinder HMM inventory records TIR-I__TIR-I_A and TIR-I__TIR-I_B
    custom profiles under the TIR-I system namespace.
