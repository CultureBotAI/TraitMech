  title: AbiE type IV toxin-antitoxin activity supports phage resistance
  description: Evidence-backed process sketch linking an abiE locus to type IV toxin-antitoxin
    activity, AbiEii GTP-dependent toxicity, restricted phage propagation, and abortive-infection
    system possession.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiE at the system level without asserting a universal
    phage activator, the exact cellular target of AbiEii, or that every COG5340-DUF1814
    pair functions in abortive infection.
