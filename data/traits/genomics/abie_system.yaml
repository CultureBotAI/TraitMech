identifier: traitmech:000227
label: AbiE system
definition: An abortive infection system in which an organism possesses an abiE bicistronic
  locus whose AbiEii DUF1814-family bacteriostatic toxin and AbiEi COG5340-family
  antitoxin constitute a non-interacting type IV toxin-antitoxin module that supports
  phage resistance.
definition_source: DOI:10.1093/nar/gkt1419
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: Subcloning and deletion analysis of the recombinant plasmid pPG01 defined
    a 2.5-kb ScaIHpaI fragment as conferring phage insensitivity
  notes: Garvey et al. localized the pNP40 AbiE determinant to the pPG01 subclone.
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: The mechanisms encoded by pPG01 and pCG1 in L. lactis subsp. lactis MG1614
    conformed to the criteria defining abortive infection and were designated AbiE
    and AbiF, respectively
  notes: Garvey et al. designated the pPG01-encoded pNP40 phage-insensitivity determinant
    as AbiE.
- reference: DOI:10.1093/nar/gkt1419
  snippet: AbiE systems are encoded by bicistronic operons and function via a non-interacting
    (Type IV) bacteriostatic TA mechanism
  notes: Dy et al. support defining AbiE as a type IV toxin-antitoxin Abi family.
- reference: DOI:10.1093/nar/gkt1419
  snippet: We demonstrate that the AbiE phage resistance systems function as novel
    Type IV TAs and are widespread in bacteria and archaea
  notes: Dy et al. support a reusable AbiE-system trait beyond the original Lactococcus
    pNP40 determinant.
- reference: DOI:10.1093/nar/gkt1419
  snippet: AbiEii was toxic by acting as a GTP-binding NTase and was neutralized by
    expression of AbiEi
  notes: Dy et al. connect the AbiEii nucleotidyltransferase toxin and AbiEi antitoxin
    to the AbiE type IV toxin-antitoxin module.
- reference: DOI:10.1093/nar/gkt1419
  snippet: AbiEii was shown to specifically bind GTP, the first step in a NTase activity
  notes: Dy et al. support the GTP-binding nucleotidyltransferase activity of AbiEii
    while leaving the exact toxic target unresolved.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Garvey et al. cloned the pNP40 AbiE determinant and showed that the pPG01-encoded
    region conferred abortive-infection phage insensitivity in Lactococcus lactis
    subsp. lactis MG1614.
  reference: DOI:10.1128/AEM.61.12.4321-4328.1995
