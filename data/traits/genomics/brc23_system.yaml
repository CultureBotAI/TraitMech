identifier: traitmech:000524
label: Brc23 system
definition: A phage defense system in which an organism possesses a gcu23/Brc23 bacteriophage-resistance
  integron cassette that supports growth during bacteriophage challenge.
definition_source: DOI:10.1126/science.ads0915
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: gcu23
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.ads0915
- synonym_text: brc23
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.ads0915
evidence:
- reference: DOI:10.1126/science.ads0915
  snippet: gcu23 had a broader defense profile, including high resistance levels against
    G4, MS2, F1, and T4
  notes: Kieffer et al. report that the former gcu23 cassette conferred a broader
    phage-defense profile with high G4, MS2, F1, and T4 resistance levels.
- reference: DOI:10.1126/science.ads0915
  snippet: We therefore redefined both cassettes as BRiCs (brc22 and brc23)
  notes: Kieffer et al. renamed gcu22 and gcu23 as Brc cassettes after phage-resistance
    testing.
- reference: DOI:10.1126/science.ads0915
  snippet: Predicted secondary structures of attC sites in identified BRiCs
  notes: Kieffer et al. identify BRiC bacteriophage-resistance integron cassettes
    and show their predicted attC secondary structures.
- reference: DOI:10.1126/science.ads0915
  snippet: 'brc113

    brc217

    brc76

    brcWGS21

    brc22

    brc23'
  notes: Kieffer et al. include brc23 among identified BRiCs with predicted attC secondary
    structures.
- reference: https://www.science.org/doi/suppl/10.1126/science.ads0915/suppl_file/science.ads0915_sm.pdf
  snippet: 'D279

    pMBA PcW brc23

    E. coli IJ1862'
  notes: Kieffer et al.'s supplementary construct table lists pMBA PcW brc23 in E.
    coli IJ1862 under naturally occurring defense island constructs.
- reference: https://www.science.org/doi/suppl/10.1126/science.ads0915/suppl_file/science.ads0915_sm.pdf
  snippet: 'D284

    pMBA PcW brc23

    K. pneumoniae

    KP5'
  notes: Kieffer et al.'s supplementary construct table lists pMBA PcW brc23 in Klebsiella
    pneumoniae KP5 under naturally occurring defense island constructs.
