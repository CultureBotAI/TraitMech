  title: DS-15 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the three-gene DS-15 locus
    to reduced bacteriophage plaquing without resolving DS-15 component function or
    effector activity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-15 as the validated AAA1 transcriptional unit
    with three product accessions, final Table S8 MinD ATPase and DUF6988 HHpred-domain
    rows, and three DefenseFinder DS-15 profile rows. It does not assert native host
    breadth, exact profile-to-protein correspondence, the direct viral trigger or
    substrate, exact AAA family ATPase or DUF6988 chemistry, phage target breadth,
    or DefenseFinder rule-level detection criteria.
