- discussion_id: ds-15-defensefinder-model-gap
  prompt: Resolve DS-15 native host breadth, exact profile-to-protein mapping, DS-15A/DS-15B/DS-15C
    component activities, sensitive-phage breadth, exact AAA family ATPase and DUF6988
    chemistry, and rule-level DefenseFinder criteria before minting narrower DS-15
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-15 as the defensive AAA1 transcriptional unit
    that reduced Bas1 plaquing when cloned in E. coli MG1655, the final Table S8 HHpred
    sheet reports MinD ATPase and DUF6988 hits across two AAA1 products, and the pinned
    DefenseFinder HMM inventory records DS-15A, DS-15B, and DS-15C custom profile
    rows. The pinned rules table has no DS-15 row, and the first-pass record does
    not resolve native host breadth, exact profile-to-protein correspondence, direct
    ATPase or DUF6988 activity, phage target breadth, or endogenous DS-15 activity.
