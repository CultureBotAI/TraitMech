    cassettes whose cloned expression reduced phage plaquing, Supplementary Tables
    8, 9, and 12 map VP1796 to VP_RS08620/Vp1796, WP_005477844.1, VSV105-vp1796, and
    phage-plating fold changes, and Supplementary Data 1 reports PSI-BLAST homologs.
    The pinned DefenseFinder HMM inventory records one VP1796 custom profile row.
    The pinned rules table has no VP1796 row, and the first-pass record does not resolve
    native host breadth, complete phage breadth, direct profile-to-protein correspondence,
    molecular output, or endogenous activity.
