identifier: traitmech:000486
label: VP1796 system
definition: A phage defense system in which an organism possesses a VP1796-family
  locus represented by the DefenseFinder VP1796__VP1796 custom HMM profile and experimentally
  linked to reduced bacteriophage plaquing when the cloned Vibrio parahaemolyticus
  RIMD 2210633 vp1796 cassette is expressed from a VSV105 plasmid.
