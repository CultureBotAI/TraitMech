evidence:
- reference: PMID:20980243
  snippet: RNase LS was originally identified as a potential antagonist of bacteriophage
    T4 infection. When T4 dmd is defective, RNase LS activity rapidly increases after
    T4 infection and cleaves T4 mRNAs to antagonize T4 reproduction.
  notes: Koga et al. frame RnlA-dependent RNase LS activity as a potential antagonist
    of bacteriophage T4 dmd mutants.
- reference: PMID:20980243
  snippet: Here we show that rnlA, a structural gene of RNase LS, encodes a novel
    toxin, and that rnlB (formally yfjO), located immediately downstream of rnlA,
    encodes an antitoxin against RnlA.
  notes: Koga et al. identify rnlA as the RNase LS toxin gene and rnlB as the neighboring
    cognate antitoxin gene.
- reference: PMID:20980243
  snippet: Pull-down analysis showed a specific interaction between RnlA and RnlB.
  notes: Koga et al. support direct RnlA/RnlB interaction by pull-down analysis.
- reference: PMID:20980243
  snippet: All of these results suggested that rnlA-rnlB define a new toxin-antitoxin
    (TA) system.
  notes: Koga et al. define rnlA-rnlB as a new toxin-antitoxin system.
- reference: PMID:22403819
  snippet: Predicted proteins encoded by these two ORFs were found to share a weak
    homology with RnlA and RnlB, respectively, a toxin–antitoxin system encoded on
    the E. coli K-12 chromosome.
  notes: Otsuka and Yonesaki describe RnlA/RnlB as a toxin-antitoxin system encoded
    on the Escherichia coli K-12 chromosome.
- reference: PMID:22403819
  snippet: T4 phage Dmd suppressed the toxicities of both RnlA and LsoA by direct
    interaction, the first example of a phage with an antitoxin against multiple toxins.
  notes: Otsuka and Yonesaki support T4 Dmd as a phage antitoxin that suppresses RnlA
    toxicity by direct interaction.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: RnlAB | 10\.1534/genetics\.110\.121798 | Escherichia coli rnlA and rnlB
    compose a novel toxin-antitoxin system
  notes: The DefenseFinder article registry maps the named RnlAB system to Koga et
    al.'s rnlA-rnlB toxin-antitoxin paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "RnlAB\tRnlAB\t2\t2\tRnlAB__RnlA, RnlAB__RnlB\t\t\t"
  notes: The DefenseFinder rules table models RnlAB as a two-profile system requiring
    the RnlAB__RnlA and RnlAB__RnlB profiles.
