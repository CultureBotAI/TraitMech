identifier: traitmech:000367
label: RnlAB system
definition: A phage defense system in which an organism possesses a genome-encoded
  RnlAB toxin-antitoxin locus represented by DefenseFinder as a two-profile model
  requiring RnlAB__RnlA and RnlAB__RnlB.
definition_source: DOI:10.1534/genetics.110.121798
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
