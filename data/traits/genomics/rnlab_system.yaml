discussions:
- discussion_id: rnlab-phage-breadth-evasion-gap
  prompt: Resolve natural RnlAB phage breadth, wild-type T4 evasion through Dmd, induction
    or activation routes in non-T4 contexts, and RnlAB profile-to-activity mapping
    before minting narrower RnlAB mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Koga et al. support RnlA/RnlB as an Escherichia coli K-12 toxin-antitoxin
    system whose RNase LS activity can antagonize T4 dmd mutants, Otsuka and Yonesaki
    show that T4 phage Dmd suppresses RnlA toxicity, and DefenseFinder models RnlAB
    as a two-profile system with RnlAB__RnlA and RnlAB__RnlB markers. Natural phage
    breadth, wild-type T4 evasion, non-T4 activation contexts, and profile-to-activity
    mapping remain unresolved.
  evidence:
  - reference: PMID:22403819
    snippet: T4 phage Dmd suppressed the toxicities of both RnlA and LsoA by direct
      interaction, the first example of a phage with an antitoxin against multiple
      toxins.
    notes: Otsuka and Yonesaki show that T4 Dmd suppresses RnlA toxicity, marking
      phage evasion as a real boundary around RnlAB mechanism curation.
  attaches_to:
  - causal_graphs#rnlab_locus_antagonizes_t4_dmd_mutants
