discussions:
- discussion_id: nhi-trigger-and-substrate-gap
  prompt: Resolve the Nhi phage trigger, exact replication-intermediate substrate,
    accession-level natural host protein, and homolog breadth before minting narrower
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Bari et al. support Nhi as a compact single-enzyme nuclease-helicase
    immunity system that prevents phage DNA accumulation and is inferred to target
    and degrade phage-specific replication intermediates. DefenseFinder models Nhi
    with a one-profile rule, but this first system-level record leaves the direct
    phage trigger, exact substrate, natural-host accession, and full taxonomic breadth
    of functional homologs unresolved.
