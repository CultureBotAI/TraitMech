identifier: traitmech:000332
label: Nhi system
definition: A phage defense system in which an organism possesses an Nhi-family locus
  represented by the DefenseFinder Nhi__Nhi profile and exemplified by a single enzyme
  with nuclease and helicase activities that protects against diverse staphylococcal
  phages, prevents phage DNA accumulation, and is inferred to target and degrade phage-specific
  replication intermediates.
definition_source: DOI:10.1016/j.chom.2022.03.001
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Nhi
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.chom.2022.03.001
  snippet: Here, we describe a unique mode of nucleic acid immunity mediated by a
    single enzyme with nuclease and helicase activities, herein referred to as Nhi
    (nuclease-helicase immunity)
  notes: Bari et al. define Nhi as nuclease-helicase immunity mediated by one enzyme
    with nuclease and helicase activities.
- reference: DOI:10.1016/j.chom.2022.03.001
  snippet: This enzyme provides robust protection against diverse staphylococcal phages
    and prevents phage DNA accumulation in cells stripped of all other known defenses
  notes: Bari et al. support Nhi as a system that protects against diverse staphylococcal
    phages and prevents phage DNA accumulation even without other known defenses.
- reference: DOI:10.1016/j.chom.2022.03.001
  snippet: Our observations support a model in which Nhi targets and degrades phage-specific
    replication intermediates
  notes: Bari et al. infer that Nhi targets and degrades phage-specific replication
    intermediates.
- reference: DOI:10.1016/j.chom.2022.03.001
  snippet: Nhi homologs are distributed in diverse bacteria and exhibit functional
    conservation
  notes: Bari et al. support functional conservation of Nhi homologs across diverse
    bacteria.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Nhi | 10\.1101/776245 | A unique mode of nucleic acid immunity performed
    by a single multifunctional enzyme
  notes: The DefenseFinder article registry maps the named Nhi model namespace to
    the Bari et al. nuclease-helicase immunity preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Nhi\tNhi\t1\t1\tNhi__Nhi"
  notes: The DefenseFinder rules table models Nhi as a one-component system requiring
    the Nhi__Nhi profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Nhi__Nhi                                         | Nhi__Nhi                                         |
    Nhi                    | Custom                  | 100    |'
  notes: The DefenseFinder HMM inventory records Nhi__Nhi under the Nhi model namespace.
canonical_examples:
- taxon_id: NCBITaxon:1282
  taxon_label: Staphylococcus epidermidis
  note: Bari et al. characterized Nhi from the Staphylococcus epidermidis RP62a locus
    and showed that this single nuclease-helicase enzyme protects against diverse
    staphylococcal phages.
  reference: DOI:10.1016/j.chom.2022.03.001
