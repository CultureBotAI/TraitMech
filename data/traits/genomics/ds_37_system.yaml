    and final Science Tables S6/S7/S8 map it to one product accession, Bas1 and Bas9
    phage readouts, display name DS-37, and one low-probability PDDEXK HHpred row.
    The pinned DefenseFinder HMM inventory records one DS-37 custom profile row. The
    pinned rules table has no DS-37 row, and the first-pass record does not resolve
    native host breadth, complete phage breadth, direct profile-to-protein correspondence,
    PDDEXK domain interpretation, nuclease chemistry, molecular output, or endogenous
    DS-37 activity.
