  description: Evidence-backed process sketch linking a Wadjet locus to SMC ATPase
    cycling, Wadjet nuclease-mediated circular plasmid cleavage, and restriction of
    plasmid transformation.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures JetABCD and MksBEFG family-level anti-plasmid outputs
    without asserting one universal subfamily architecture, plasmid size threshold,
