identifier: traitmech:000218
label: Wadjet system
definition: A genomics trait describing possession of a Wadjet anti-plasmid defense
  locus encoding a derivative SMC complex such as JetABCD, MksBEFG, or EptABCD that
  restricts circular plasmids by ATPase-dependent DNA cleavage.
definition_source: DOI:10.1016/j.molcel.2022.11.015
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: Wadjet defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.molcel.2022.09.008
evidence:
- reference: DOI:10.1016/j.molcel.2022.11.015
  snippet: Wadjet systems (JetABCD/MksBEFG/EptABCD) are derivative SMC complexes with
    roles in bacterial immunity against selfish DNA
  notes: Liu et al. support defining Wadjet as a recurring SMC-derived bacterial immune
    system spanning JetABCD, MksBEFG, and EptABCD subfamilies.
- reference: DOI:10.1016/j.molcel.2022.09.008
  snippet: the Wadjet defense system recognizes DNA topology to protect its host against
    plasmid transformation
  notes: Deep et al. support the standard Wadjet defense system name and connect the
    system to anti-plasmid immunity.
- reference: DOI:10.1016/j.molcel.2022.09.008
  snippet: Wadjet forms a complex similar to the bacterial condensin complex MukBEF,
    with a novel nuclease subunit similar to a type II DNA topoisomerase
  notes: Deep et al. support the SMC-family complex architecture and JetD-like nuclease
    component.
- reference: DOI:10.1016/j.molcel.2022.11.015
  snippet: Purified JetABCD complexes cleave circular DNA molecules, regardless of
    the DNA helical topology; cleavage is DNA sequence nonspecific and depends on
    the SMC ATPase
  notes: Liu et al. connect JetABCD SMC ATPase activity to sequence-independent cleavage
    of circular plasmid DNA.
- reference: DOI:10.1093/nar/gkad130
  snippet: MksG is a nuclease that degrades plasmid DNA
  notes: Weiss et al. support the MksG nuclease as the executing plasmid-DNA-degradation
    component of MksBEFG.
- reference: DOI:10.1093/nar/gkad130
  snippet: Introduction of plasmids results in an increase in DNA bound MksG, indicating
    an activation of the system in vivo
  notes: Weiss et al. support plasmid-responsive activation of the Corynebacterium
    glutamicum MksBEFG system in vivo.
canonical_examples:
- taxon_id: NCBITaxon:1718
  taxon_label: Corynebacterium glutamicum
  note: Weiss et al. investigated the Corynebacterium glutamicum MksBEFG complex and
    showed that plasmid introduction increased DNA-bound MksG in vivo.
  reference: DOI:10.1093/nar/gkad130
causal_graphs:
