identifier: traitmech:000412
label: TgvAB system
definition: A restriction-modification system in which an organism possesses a two-gene
  TgvAB locus embedded in the Vibrio cholerae VPI-2 type I R-M cluster, encoding TgvA
  and TgvB modification-dependent restriction proteins related to GmrSD type IV restriction
  enzymes that restrict glucosylated hmC-containing T-even-like phage DNA.
definition_source: DOI:10.1128/jb.00145-24
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000095
synonyms:
- synonym_text: TgvAB
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/jb.00145-24
- synonym_text: TgvAB__TgvA
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: TgvAB__TgvB
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1128/jb.00145-24
  snippet: the two genes embedded within the T1RM system encode a novel two-protein
    modification-dependent restriction system related to the GmrSD family of type
    IV restriction enzymes
  notes: Vizzarro et al. define TgvAB as a modification-dependent restriction system
    related to GmrSD-family type IV restriction enzymes.
- reference: DOI:10.1128/jb.00145-24
  snippet: potent anti-phage activity against diverse members of the Tevenvirinae
  notes: Vizzarro et al. support TgvAB anti-phage activity against phages with hypermodified
    genomes.
- reference: DOI:10.1128/jb.00143-24
  snippet: both TgvA and TgvB are required for defense against T2, T4, and T6
  notes: Gomez and Waters independently report that both TgvA and TgvB are required
    for TgvAB-mediated anti-phage activity.
- reference: DOI:10.1128/jb.00143-24
  snippet: TgvAB targets phage DNA with glucosylated 5-hydroxymethylcytosine (5hmC)
    bases
  notes: Gomez and Waters support TgvAB as a type IV restriction system targeting
    glucosylated 5-hydroxymethylcytosine in T-even phage genomes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| TgvAB | 10\.1128/jb\.00145-24 | Vibrio cholerae pathogenicity island
    2 encodes two distinct types of restriction systems |'
  notes: The pinned DefenseFinder article registry maps the named TgvAB system to
    the Vizzarro et al. VPI-2 restriction-systems paper. The pinned rules table (https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv)
    does not list TgvAB, so the registry and HMM rows support a named system-possession
    trait rather than complete DefenseFinder detection criteria.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| TgvAB__TgvA                                      |                                                   |
    TgvAB                  | Custom                  | 200    |'
  notes: The pinned DefenseFinder HMM inventory records TgvAB__TgvA as a custom TgvAB
