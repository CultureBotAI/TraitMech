discussions:
- discussion_id: tgvab-defensefinder-rule-gap
  prompt: Resolve TgvAB native host breadth, TgvA/TgvB biochemical roles, phage substrate
    breadth, and DefenseFinder rule or model coverage before minting narrower TgvAB
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vizzarro et al. and Gomez and Waters support TgvAB as a two-component
    VPI-2 type IV restriction system that restricts glucosylated hmC-containing T-even
    phage DNA, and the pinned DefenseFinder HMM inventory carries TgvA and TgvB custom
    profiles. The pinned DefenseFinder rules table has no TgvAB row, and the evidence
    does not yet resolve native host breadth, the individual TgvA versus TgvB biochemical
    roles, full phage substrate breadth, or a rule-level profile combination.
  evidence:
  - reference: DOI:10.1128/jb.00145-24
    snippet: the two genes embedded within the T1RM system encode a novel two-protein
      modification-dependent restriction system related to the GmrSD family of type
      IV restriction enzymes
    notes: Vizzarro et al. name TgvAB as the GmrSD-related modification-dependent
      restriction system.
  - reference: DOI:10.1128/jb.00143-24
    snippet: TgvAB targets phage DNA with glucosylated 5-hydroxymethylcytosine (5hmC)
      bases
    notes: Gomez and Waters support the glucosylated hmC substrate class while leaving
      broader phage substrate limits open.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| TgvAB__TgvA                                      |                                                   |
      TgvAB                  | Custom                  | 200    |'
    notes: The pinned DefenseFinder HMM inventory records TgvAB__TgvA as a custom
      TgvAB profile.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| TgvAB__TgvB                                      |                                                   |
      TgvAB                  | Custom                  | 400    |'
    notes: The pinned DefenseFinder HMM inventory records TgvAB__TgvB as a custom
      TgvAB profile.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    notes: The pinned DefenseFinder rules table does not list a TgvAB row, leaving
      rule-level detection criteria unresolved.
