discussions:
- discussion_id: sofic-mechanism-gap
  prompt: Resolve SoFIC phage triggers and effector outputs before minting narrower
    SoFIC mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support SoFIC as a named anti-phage
    system with a SoFic profile, but the trigger, molecular substrate, antiviral effector
    output, and subtype-specific mechanism are not resolved enough here to assert
    a narrower mechanistic child trait.
