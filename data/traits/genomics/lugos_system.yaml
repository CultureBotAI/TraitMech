discussions:
- discussion_id: lugos-mechanism-gap
  prompt: Resolve Lugos phage triggers and effector outputs before minting narrower
    Lugos mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Lugos as a named anti-phage
    system with a VCA0409 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
