identifier: traitmech:000427
label: DS-4 system
definition: A phage defense system in which an organism possesses the five-gene DefensePredictor-discovered
  system 4 locus cataloged as working transcriptional unit NTTI and whose plasmid
  expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
