- discussion_id: ds-4-defensefinder-model-gap
  prompt: Resolve DS-4 native host breadth, exact five-component activities, DS-4
    profile-to-protein mapping, sensitive-phage breadth, molecular output, and rule-level
    detection criteria before minting narrower DS-4 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-4 as the defensive NTTI transcriptional unit
    that reduced plaquing when cloned in E. coli MG1655, and the pinned DefenseFinder
    HMM inventory records five DS-4 profile rows. The pinned rules table has no DS-4
    row, and the first-pass record does not resolve native host breadth, exact component
    activities, profile-to-protein mapping, phage target breadth, or endogenous DS-4
    activity.
