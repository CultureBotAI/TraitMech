discussions:
- discussion_id: abi2-family-boundary-gap
  prompt: Resolve the natural Abi2 locus breadth, phage trigger, and AbiD/F-group
    mapping before minting narrower Abi2 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The DefenseFinder Abi2 model namespace requires the Abi2__Abi_2 PF07751
    profile, and InterPro treats PF07751 as an Abi-like family connected to AbiD1
    primary literature. This first record leaves unresolved whether DefenseFinder
    Abi2 exactly corresponds to AbiD1, the broader AbiD/F group, or a different subset
    of Abi-like loci; it therefore avoids protein-level chemistry and records only
    the genome-level model namespace.
  attaches_to:
  - causal_graphs#abi2_locus_restricts_phage
