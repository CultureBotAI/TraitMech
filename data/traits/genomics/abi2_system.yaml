evidence:
- reference: DOI:10.1016/j.mib.2005.06.006
  snippet: Abortive infection (Abi) systems, also called phage exclusion, block phage
    multiplication and cause premature bacterial cell death upon phage infection.
  notes: Chopin et al. define the abortive-infection class of phage exclusion systems
    used by the DefenseFinder Abi2 registry row.
- reference: DOI:10.1128/jb.177.13.3818-3823.1995
  snippet: Lactococcal phage abortive infection (AbiD1) determined by plasmid pIL105
    is active on both prolate- and small-isometric-head phages
  notes: Anba et al. characterize AbiD1 as a plasmid-encoded lactococcal abortive-infection
    determinant active on multiple phage morphotypes.
- reference: DOI:10.1128/jb.177.13.3818-3823.1995
  snippet: The Abi phenotype was found to be encoded by a single gene, designated
    abiD1.
  notes: Anba et al. support a single-gene AbiD1 locus in the Abi-like family that
    includes PF07751.
- reference: DOI:10.1128/jb.177.13.3824-3829.1995
  snippet: Phage bIL66 is unable to grow on Lactococcus lactis cells harboring the
    abortive infection gene abiD1.
  notes: Bidnenko et al. connect abiD1 carriage to restriction of bIL66 phage growth
    in Lactococcus lactis.
- reference: https://www.ebi.ac.uk/interpro/entry/pfam/PF07751/
  snippet: This family, found in various bacterial species, contains sequences that
    are similar to the Abi group of proteins
  notes: EBI InterPro resolves PF07751 as the reviewed Pfam Abi-like protein family
    with short name Abi_2 and cites AbiD1 primary literature.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'Abi2 | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named Abi2 model namespace to
    the Chopin et al. lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Abi2\tAbi2\t1\t1\tAbi2__Abi_2\t\t\t"
  notes: The DefenseFinder rules table models Abi2 as a one-component system requiring
    the Abi2__Abi_2 profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Abi2__Abi_2                                      | Abi2__Abi_2                                      |
    Abi2                   | PF07751.12              | 60     |'
  notes: The DefenseFinder HMM inventory records Abi2__Abi_2 under the Abi2 model
    namespace, backed by the Pfam PF07751.12 Abi_2 profile.
