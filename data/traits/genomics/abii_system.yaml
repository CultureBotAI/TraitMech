  title: AbiI activity restricts lactococcal phage burst size
  description: Conservative system-level sketch linking an abiI-family locus to AbiI
    antiphage activity, reduced lactococcal phage burst size, restricted phage propagation,
    and abortive-infection system possession without asserting the unresolved molecular
    target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiI as a named DefenseFinder single-profile abortive-infection
