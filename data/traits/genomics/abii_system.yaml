discussions:
- discussion_id: abii-trigger-and-effector-gap
  prompt: Resolve the AbiI phage trigger, molecular activity, and direct arrest target
    before minting narrower AbiI mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Su et al. support AbiI as a named lactococcal abortive-infection locus
    whose cloned pND852 fragment reduces phi 712 burst size and whose abiI frameshift
    abolishes phage resistance. DefenseFinder represents AbiI with a one-profile rule,
    but this first system-level record leaves the phage trigger, AbiI molecular function,
    direct host or phage target, growth-arrest or cell-death route, and phage escape
    routes unresolved.
  evidence:
  - reference: PMID:9195753
    snippet: Neither abiI nor the predicted product showed significant homology to
      any existing sequence in the GenBank database
    notes: Su et al. report no informative sequence homology for AbiI in the original
      characterization.
