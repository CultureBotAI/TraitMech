identifier: traitmech:000316
label: AbiI system
definition: An abortive infection system in which an organism possesses an abiI-family
  locus represented by the DefenseFinder AbiI__AbiI profile and exemplified by the
  Lactococcus lactis M138 pND852 locus whose single abiI open reading frame restricts
  lactococcal phage propagation by an abortive-infection mechanism.
definition_source: DOI:10.1016/S0168-1656(97)01692-1
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiI
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:9195753
  snippet: Plasmid pND852 (56 kb) encodes nisin resistance and was isolated from Lactococcus
    lactis ssp lactis (L. lactis) M138 by conjugation to L. lactis LM0230
  notes: Su et al. identified plasmid pND852 from Lactococcus lactis M138 as the source
    of the abiI-associated phage resistance locus.
- reference: PMID:9195753
  snippet: It conferred strong resistance to the isometric-headed phage phi 712 and
    partial resistance to the prolate-headed phage phi c2
  notes: Su et al. show that pND852 confers resistance to tested lactococcal phages.
- reference: PMID:9195753
  snippet: A 2.6 kb HpaII fragment encoding phage resistance was cloned into the streptococcal/Bacillus
    hybrid vector pGB301 to generate pND817
  notes: Su et al. localized phage resistance from pND852 to the 2.6 kb fragment in
    pND817.
- reference: PMID:9195753
  snippet: The mechanism of phage resistance encoded by pND817 involved abortive infection
  notes: Su et al. classified the pND817 phage-resistance mechanism as abortive infection.
- reference: PMID:9195753
  snippet: reduction in burst size from 166 to 6 at 30 degrees C and from 160 to 90
    at 37 degrees C
  notes: Su et al. measured reduced phage burst size from the cloned pND817 abortive-infection
    locus.
- reference: PMID:9195753
  snippet: DNA sequencing revealed that the abortive infection was encoded by a single
    open reading frame (ORF), designated abiI, encoding a 332 amino acid protein
  notes: Su et al. support a single abiI open reading frame as the coding sequence
    for the pND817 abortive-infection locus.
- reference: PMID:9195753
  snippet: Frame shift mutation at the unique EcoRI site within the ORF resulted in
    loss of the Abi+ phenotype
  notes: Su et al. verified that the abiI open reading frame is required for the phage-resistance
    phenotype.
- reference: PMID:9195753
  snippet: Neither abiI nor the predicted product showed significant homology to any
    existing sequence in the GenBank database
  notes: Su et al. did not resolve AbiI molecular activity or homology during the
    original characterization.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiI | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiI model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiI\tAbiI\t1\t1\tAbiI__AbiI"
  notes: The DefenseFinder rules table models AbiI as a one-component system requiring
    the AbiI__AbiI profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiI__AbiI                                       | AbiI__AbiI                                       |
    AbiI                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records AbiI__AbiI under the AbiI model namespace.
