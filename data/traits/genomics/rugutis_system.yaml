identifier: traitmech:000315
label: Rugutis system
definition: A phage defense system in which an organism possesses a Rugutis locus
  that can restrict bacteriophage infection.
definition_source: DOI:10.1093/nar/gkae671
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Rugutis
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkae671
evidence:
- reference: DOI:10.1093/nar/gkae671
  snippet: These systems were named after cheese, cattle or fermentation related deities
    (Rhea, Aristaios, Kamadhenu, Fliodhais, Audmula, Rugutis and Hesat)
  notes: Grafakou et al. named Rugutis among seven not previously described lactococcal
    antiphage systems.
- reference: DOI:10.1073/pnas.2426508122
  snippet: we isolated 66 phage escape mutants which had become insensitive to 13
    distinct, plasmid-encoded lactococcal phage resistance systems (i.e. Rhea, Kamadhenu,
    Rugutis, Audmula, PARIS, type II CBASS, Septu, AbiA, AbiB, AbiD/F, AbiG, AbiJ,
    AbiP)
  notes: Mosterd et al. later included Rugutis among the distinct plasmid-encoded
    lactococcal phage-resistance systems investigated by phage escape-mutant isolation.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Rugutis | 10\.1093/nar/gkae671 | Discovery of antiphage systems in the
    lactococcal plasmidome
  notes: The DefenseFinder article registry maps the named Rugutis system to the Grafakou
    et al. lactococcal antiphage-system discovery paper.
