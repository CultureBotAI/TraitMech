identifier: traitmech:000570
label: short Lamassu system
definition: A Lamassu system in which an organism possesses a locus from the short-LmuB
  family, characterized by shorter coiled-coil regions in its SMC-like LmuB sensor
  than in long Lamassu systems.
definition_source: DOI:10.1073/pnas.2519643122
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
