  taxon_label: Vibrio cholerae
  reference: DOI:10.1073/pnas.2519643122
  note: The source organism of the Vc-Cap4 system explicitly selected as a short-Lamassu
    exemplar. PDB 9NY5 entity 3 independently records a 653-residue LmuB from taxon
    666, expressed in E. coli. The cited antiphage assays use a heterologous E. coli
