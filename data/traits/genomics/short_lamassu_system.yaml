    or native V. cholerae phage resistance.
discussions:
- discussion_id: short-lamassu-classification-and-mechanism-scope
  prompt: Resolve family-wide mechanisms and classify borderline loci.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Short denotes the phylogenetic and structural LmuB family, not an arbitrary
    amino-acid cutoff or an isolated short protein. LmuC-loss clade S and effector-domain-loss
    clade O preclude requiring one universal three-component effector architecture.
    Type I/II component classifications and effector names are not exact synonyms
    for this family. HNH's explicitly short-form definition supports its new parent;
    SMEK's unresolved long-profile call prevents the same inference. Other table-defined
    subtypes require their own scope review before reparenting. The Vc-Cap4 mechanism
    already described on the Lamassu parent is not assumed universal across short-family
    effectors, so no duplicate or universal mechanism graph is asserted here. A registry
    Hypothetical label must not be equated with clade O's effector-domain loss without
    explicit evidence.
  posed_by: codex
  posed_date: '2026-10-03'
