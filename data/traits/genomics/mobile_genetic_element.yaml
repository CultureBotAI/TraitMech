  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro1235
evidence:
- reference: DOI:10.1038/nrmicro1235
  notes: Frost et al. review mobile genetic elements as the agents of horizontal gene
    transfer and genome plasticity; parent of the plasmid, prophage, transposable-
    element, and genomic-island sub-variants.
- reference: DOI:10.1111/1574-6976.12067
  notes: Siguier, Gourbeyre & Chandler review insertion sequences as a major class of
    mobile genetic elements shaping bacterial genomes.
