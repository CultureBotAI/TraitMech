identifier: traitmech:000533
label: Hma system
definition: A phage defense system in which an organism possesses a genome-encoded
  Hma locus with predicted HmaA helicase, HmaB m5c methyltransferase, and HmaC ATPase
  components.
definition_source: DOI:10.1093/nar/gkab883
