evidence:
- reference: DOI:10.1093/nar/gkab883
  snippet: We designated this as a new candidate defence system named Hma, as it encodes
    three proteins with predicted helicase (HmaA), m5c methyltransferase (HmaB) and
    ATPase (HmaC) domains.
  notes: Payne et al. define Hma as a predicted three-gene antiviral defense system
    with HmaA, HmaB, and HmaC components.
- reference: DOI:10.1093/nar/gkab883
  snippet: The putative Hma system was very widespread, present in 26 phyla, surpassed
    only by CBASS type I, Gabija and Septu type I.
  notes: Payne et al. report that the predicted Hma system occurs across many bacterial
    and archaeal phyla.
- reference: DOI:10.1111/1751-7915.14524
  snippet: we characterized a new defence system, Hma
  notes: Liu et al. experimentally studied Hma in coral-associated Halomonas meridiana.
- reference: DOI:10.1111/1751-7915.14524
  snippet: Mutation analysis revealed the nickase activity of the nuclease domain
    (belonging to PDD/EXK superfamily) of HmaA is essential in phage defence.
  notes: Liu et al. connect HmaA nuclease activity to anti-phage defense against Escherichia
    phage T4.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Hma | 10\.1093/nar/gkac400 | PADLOC: a web server for the identification
    of antiviral defence systems in microbial genomes | '
  notes: The pinned DefenseFinder article registry maps the Hma source key to the
