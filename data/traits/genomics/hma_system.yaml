discussions:
- discussion_id: hma-defensefinder-rule-and-component-gap
  prompt: Resolve HmaB/HmaC contributions, complete HmaABC system requirements, hma-region
    accessory systems, sensitive-phage breadth, native host breadth, and DefenseFinder
    rule-level criteria before minting Hma mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Payne et al. predicted Hma as a three-gene candidate defense system,
    Liu et al. showed that the HmaA nuclease domain is essential for T4 phage defense,
    and the pinned DefenseFinder HMM inventory records HmaA, HmaB, and HmaC profiles.
    However, Liu et al. state that HmaB/HmaC regulation of HmaA was not known, and
    the pinned DefenseFinder rules table lacks an Hma row. This first-pass record
    therefore does not resolve exact HmaB or HmaC activities, complete-system genetic
    requirements, accessory defense systems inserted near hma, full sensitive-phage
    breadth, endogenous native-host activity, or reusable rule-level detection criteria.
  evidence:
  - reference: DOI:10.1093/nar/gkab883
    snippet: We designated this as a new candidate defence system named Hma, as it
      encodes three proteins with predicted helicase (HmaA), m5c methyltransferase
      (HmaB) and ATPase (HmaC) domains.
    notes: Payne et al. define Hma as a predicted three-gene antiviral defense system
      with HmaA, HmaB, and HmaC components.
