identifier: traitmech:000384
label: PD-Lambda-4 system
definition: A phage defense system in which an organism possesses a PD-Lambda-4 locus
  represented by DefenseFinder as a two-profile model, PD-Lambda-4__PD-Lambda-4_A
  and PD-Lambda-4__PD-Lambda-4_B, and experimentally linked to T4, LambdaVir, SECphi27,
  and T7 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-4.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
