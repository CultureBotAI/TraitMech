evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-Lambda-4 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-4.md
  snippet: 'The PD-Lambda-4 is composed of 2 proteins: PD-Lambda-4_A and PD-Lambda-4_B.'
  notes: The DefenseFinder wiki names PD-Lambda-4 as a two-protein system with PD-Lambda-4_A
    and PD-Lambda-4_B.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-4.md
  snippet: The PD-Lambda-4 system in *Serratia sp. LS-1* (GCF_003719595.1, NZ_CP033504)
    is composed of 2 proteins PD-Lambda-4_B (WP_123061920.1) PD-Lambda-4_A (WP_123061921.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-Lambda-4 locus
    in RefSeq assembly GCF_003719595.1 on NZ_CP033504.
