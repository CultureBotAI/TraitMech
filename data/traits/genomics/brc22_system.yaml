identifier: traitmech:000523
label: Brc22 system
definition: A phage defense system in which an organism possesses a gcu22/Brc22 bacteriophage-resistance
  integron cassette that supports growth during bacteriophage challenge.
definition_source: DOI:10.1126/science.ads0915
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: gcu22
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.ads0915
- synonym_text: brc22
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1126/science.ads0915
evidence:
- reference: DOI:10.1126/science.ads0915
  snippet: Gcu22 conferred low levels of resistance exclusively against phage F13
    in K. pneumoniae
  notes: Kieffer et al. report that the former gcu22 cassette conferred low-level
    F13 resistance in Klebsiella pneumoniae.
- reference: DOI:10.1126/science.ads0915
  snippet: We therefore redefined both cassettes as BRiCs (brc22 and brc23)
  notes: Kieffer et al. renamed gcu22 and gcu23 as Brc cassettes after phage-resistance
    testing.
- reference: DOI:10.1126/science.ads0915
  snippet: Predicted secondary structures of attC sites in identified BRiCs
  notes: Kieffer et al. identify BRiC bacteriophage-resistance integron cassettes
    and show their predicted attC secondary structures.
- reference: DOI:10.1126/science.ads0915
  snippet: 'brc113

    brc217

    brc76

    brcWGS21

    brc22

    brc23'
  notes: Kieffer et al. include brc22 among identified BRiCs with predicted attC secondary
    structures.
- reference: https://www.science.org/doi/suppl/10.1126/science.ads0915/suppl_file/science.ads0915_sm.pdf
  snippet: attC of brc22, with a perfect GTT/AAC binding between both arms of the
    stem
  notes: Kieffer et al. discuss the brc22 attC site in a comparison of Tragantia homolog-associated
    predicted secondary structures.
- reference: https://www.science.org/doi/suppl/10.1126/science.ads0915/suppl_file/science.ads0915_sm.pdf
  snippet: 'D278

    pMBA PcW brc22

    E. coli IJ1862'
  notes: Kieffer et al.'s supplementary construct table lists pMBA PcW brc22 in E.
    coli IJ1862 under naturally occurring defense island constructs.
- reference: https://www.science.org/doi/suppl/10.1126/science.ads0915/suppl_file/science.ads0915_sm.pdf
  snippet: 'D283

    pMBA PcW brc22

    K. pneumoniae

    KP5'
  notes: Kieffer et al.'s supplementary construct table lists pMBA PcW brc22 in Klebsiella
    pneumoniae KP5 under naturally occurring defense island constructs.
