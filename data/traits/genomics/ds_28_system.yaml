- discussion_id: ds-28-defensefinder-model-gap
  prompt: Resolve DS-28 native host breadth, exact component activities, profile-to-protein
    mappings, HEPN and transcription-factor HHpred-domain interpretations, complete
    phage breadth, molecular output, and rule-level DefenseFinder criteria before
    minting narrower DS-28 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-28 as the defensive ANEX transcriptional unit
    and final Science Tables S6/S7/S8 map it to product accessions WP_000494510.1
    and WP_000528930.1, a Bas60 phage readout, display name DS-28, a high-probability
    HEPN HHpred row, and a lower-probability TF HHpred row. The pinned DefenseFinder
    HMM inventory records two DS-28 custom profile rows. The pinned rules table has
    no DS-28 row, and the first-pass record does not resolve native host breadth,
    complete phage breadth, direct profile-to-protein correspondence, HEPN or transcription-factor
    activity, molecular output, or endogenous DS-28 activity.
