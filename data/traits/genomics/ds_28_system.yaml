    with two product accessions, one high-probability HEPN HHpred-domain row, one
    lower-probability TF HHpred-domain row, and two DefenseFinder DS-28 profile rows.
    It does not assert native host breadth, exact profile-to-protein correspondence,
    DS-28 molecular activity, trigger, substrate, complete phage breadth, HEPN or
    transcription-factor HHpred-domain interpretation, or DefenseFinder rule-level
    detection criteria.
