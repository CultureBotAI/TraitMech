identifier: traitmech:000505
label: McrBC system
definition: A type IV modification-dependent restriction system in which an organism
  possesses an mcrBC locus encoding McrB DNA-binding and McrC cleavage-associated
  subunits that assemble into an McrBC restriction endonuclease complex targeting
  methylated cytosine-containing DNA.
definition_source: DOI:10.1093/emboj/20.12.3210
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: McrBC
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: McrBC restriction endonuclease
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1093/emboj/20.12.3210
evidence:
- reference: DOI:10.1093/emboj/20.12.3210
  snippet: McrBC from Escherichia coli K-12 is a restriction enzyme that belongs to
    the family of AAA(+) proteins and cuts DNA containing modified cytosines.
  notes: Panne et al. identify McrBC from Escherichia coli K-12 as a restriction enzyme
    that attacks modified-cytosine DNA.
- reference: DOI:10.1093/emboj/20.12.3210
  snippet: McrB(L) binds specifically to the methylated recognition site and is, therefore,
    the DNA-binding moiety of the McrBC endonuclease.
  notes: Panne et al. support methylated-site DNA binding by McrB(L), one of the products
    of the E. coli K-12 mcrB gene.
- reference: DOI:10.1093/emboj/20.12.3210
  snippet: In the presence of McrC, a subunit that is essential for DNA cleavage,
    the tetradecameric species was the major form of the endonuclease.
  notes: Panne et al. support McrC as the cleavage-associated subunit of the McrBC
    endonuclease complex.
- reference: DOI:10.1093/nar/gkt747
  snippet: The rgl genes were renamed mcrA and mcrBC (modified cytosine restriction).
  notes: Loenen and Raleigh place mcrBC in the modified-cytosine restriction branch
    that helped define Type IV restriction.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| McrBC | 10\.1093/emboj/20\.12\.3210 | The McrBC restriction endonuclease
    assembles into a ring structure in the presence of G nucleotides | '
  notes: The pinned DefenseFinder article registry maps the McrBC source key to Panne
    et al.
