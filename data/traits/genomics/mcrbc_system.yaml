    before minting narrower McrBC mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Panne et al. support McrBC from Escherichia coli K-12 as a restriction
    endonuclease complex that cuts DNA containing modified cytosines, and Loenen and
    Raleigh place mcrBC in the modified-cytosine restriction branch of Type IV modification-dependent
    restriction systems. The pinned DefenseFinder article registry maps the McrBC
    source key to Panne et al., but the pinned HMM inventory and rules table have
    no exact McrBC rows. This first-pass record therefore does not resolve a reusable
    DefenseFinder profile model, the exact relationship between individual McrB and
    McrC molecular functions and organism-level McrBC possession, the complete set
    of modified-cytosine targets, or the natural host breadth of McrBC systems.
