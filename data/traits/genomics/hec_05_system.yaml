identifier: traitmech:000466
label: HEC-05 system
definition: A phage defense system in which an organism possesses the single-gene
  HEC-05 Hma-embedded candidate locus, encoding a GmrSD-like protein closely matching
  BrxU, that can reduce bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: HEC-05
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1101/2024.01.29.577857
- synonym_text: HEC-05__HEC-05
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1101/2024.01.29.577857
  snippet: two GmrSD-like proteins (HEC-05 and HEC-06)
  notes: Payne et al. identify HEC-05 as one of the Hma-embedded GmrSD-like candidate
    systems.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: chosen HEC-05 homolog shares 99.2% amino acid identity
  notes: Payne et al. report that the selected HEC-05 homolog closely matches the
    independently characterized BrxU phage-defense protein.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: these were able to reduce the EOP of at least two phages
  notes: Payne et al. support reduced plaquing for the active Hma-embedded candidate
    systems after excluding inactive HEC-01 and HEC-09 candidates.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| HEC-05 | 10\.1101/2024\.01\.29\.577857 | New antiviral defences are
    genetically embedded within prokaryotic immune systems |'
  notes: The pinned DefenseFinder article registry maps the HEC-05 source key to the
    Payne et al. Hma-embedded-candidate preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| HEC-05__HEC-05                                   |                                                  |
    HEC-05                 | Custom                  | 150    |'
  notes: The pinned DefenseFinder HMM inventory records HEC-05__HEC-05 as a custom
    HEC-05 profile.
