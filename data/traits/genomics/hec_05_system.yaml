discussions:
- discussion_id: hec-05-defensefinder-model-gap
  prompt: Resolve HEC-05 native host breadth, sensitive-phage breadth, BrxU synonymy,
    GmrSD-like molecular output, and rule-level detection criteria before minting
    narrower HEC-05 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Payne et al. support HEC-05 as a single-gene Hma-embedded candidate anti-phage
    system closely matching BrxU, and the pinned DefenseFinder HMM inventory records
    one HEC-05 profile row. The pinned rules table has no HEC-05 row, and the first-pass
    record does not yet resolve natural host breadth, phage target breadth, or the
    direct molecular output.
  evidence:
  - reference: DOI:10.1101/2024.01.29.577857
    snippet: two GmrSD-like proteins (HEC-05 and HEC-06)
    notes: Payne et al. identify HEC-05 as one of the GmrSD-like Hma-embedded candidate
      systems.
  - reference: DOI:10.1101/2024.01.29.577857
    snippet: chosen HEC-05 homolog shares 99.2% amino acid identity
    notes: Payne et al. report that the selected HEC-05 homolog closely matches BrxU.
