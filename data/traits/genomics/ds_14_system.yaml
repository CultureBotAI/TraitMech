- graph_id: ds_14_locus_reduces_phage_plaquing
  title: DS-14 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-14 locus
    to reduced bacteriophage plaquing without resolving DS-14 component function or
    effector activity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-14 as the validated RMOR transcriptional unit
    with one product accession and with a DefenseFinder DS-14 profile row. It does
    not assert native host breadth, exact profile-to-protein correspondence, the direct
    viral trigger or substrate, exact AAA+ ATPase or PDDEXK nuclease chemistry, phage
    target breadth, or DefenseFinder rule-level detection criteria.
