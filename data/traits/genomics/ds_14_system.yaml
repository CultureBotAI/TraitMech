identifier: traitmech:000429
label: DS-14 system
definition: A phage defense system in which an organism possesses the single-gene
  DefensePredictor-discovered system 14 locus cataloged as working transcriptional
  unit RMOR and whose plasmid expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
