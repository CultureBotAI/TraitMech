discussions:
- discussion_id: abin-trigger-and-effector-gap
  prompt: Resolve the AbiN phage trigger, molecular activity, predicted ligand-binding
    sensor interpretation, and growth-arrest or cell-death route before minting narrower
    AbiN mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Prevots et al. support AbiN as a chromosomal lactococcal abortive infection
    gene, the FEMS review retains AbiN among confirmed lactococcal Abi-like systems,
    and DefenseFinder represents AbiN with a mandatory AbiN__AbiN profile. The FEMS
    table leaves the affected phage lytic-cycle step, phage escape mutants, and mechanism
    of cell arrest or death unknown, and the FEMS structural discussion predicts a
    putative ligand-binding sensor fold while explicitly calling for further research
    on the AbiN mechanism. This first system-level record therefore leaves the direct
    phage trigger, sensor ligand, exact molecular activity, growth-arrest or cell-death
    route, and phage escape routes unresolved.
  evidence:
  - reference: DOI:10.1093/femsre/fuag009
    snippet: The structure of AbiN is predicted with high confidence by AlphaFold
      and resembles a putative periplasmic ligand-binding sensor domain protein
    notes: The FEMS review summarizes a predicted AbiN sensor-like fold but does not
      establish a molecular trigger or effector activity.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: further research is needed to clarify the mechanism of AbiN and if it
      functions via abortive infection
    notes: The FEMS review explicitly leaves the AbiN mechanism unresolved, so this
      record does not mint a more specific sensor or effector trait.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "AbiN\tAbiN\t1\t1\tAbiN__AbiN\t\t\t"
    notes: The DefenseFinder rules table models AbiN as a one-component system requiring
      the AbiN__AbiN profile.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| AbiN__AbiN                                       | AbiN__AbiN                                       |
      AbiN                   | Custom                  | 20     |'
    notes: The DefenseFinder HMM inventory records AbiN__AbiN under the AbiN model
      namespace.
