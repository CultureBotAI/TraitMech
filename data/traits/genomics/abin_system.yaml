evidence:
- reference: DOI:10.1111/j.1574-6968.1998.tb12879.x
  snippet: Nucleotide sequence and analysis of the new chromosomal abortive infection
    gene abiN of Lactococcus lactis subsp. cremoris S114
  notes: Crossref metadata verifies the Prevots et al. 1998 AbiN primary paper title
    and DOI.
- reference: DOI:10.1093/femsre/fuag009
  snippet: the majority (18 systems) are each represented by single protein-coding
    genes
  notes: The FEMS review lists AbiN among the 34 confirmed lactococcal Abi-like systems
    in Table 1 and omits AbiN from the named two- and three-component exception lists.
- reference: DOI:10.1093/femsre/fuag009
  snippet: The structure of AbiN is predicted with high confidence by AlphaFold and
    resembles a putative periplasmic ligand-binding sensor domain protein
  notes: The FEMS review summarizes a predicted AbiN sensor-like fold but does not
    establish a molecular trigger or effector activity.
- reference: DOI:10.1093/femsre/fuag009
  snippet: further research is needed to clarify the mechanism of AbiN and if it functions
    via abortive infection
  notes: The FEMS review explicitly leaves the AbiN mechanism unresolved, so this
    record does not mint a more specific sensor or effector trait.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiN | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
