    and final Science Tables S6/S7/S8 map it to one product accession, Bas19 and SECphi18
    phage readouts, and display name DS-43. The pinned DefenseFinder HMM inventory
    records one DS-43 custom profile row. The pinned rules table has no DS-43 row,
    and the first-pass record does not resolve native host breadth, complete phage
    breadth, direct profile-to-protein correspondence, molecular output, or endogenous
    DS-43 activity.
