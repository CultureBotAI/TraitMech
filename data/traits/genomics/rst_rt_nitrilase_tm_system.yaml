evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: with a C-terminal nitrilase domain (Table S3) that is associated with a
    transmembrane effector
  notes: Rousset et al. described a validated P4-hotspot system containing a group-5
    reverse transcriptase with a C-terminal nitrilase domain associated with a transmembrane
    effector.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Phage resistance heatmap of the validated defense systems shows the mean
    fold resistance of three independent replicates against a panel of eight phages
  notes: The Figure 2 legend frames the cloned P4-hotspot hits, including the RT-nitrilase
    plus one-TM system, as validated defense systems in a replicated phage-resistance
    heatmap.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
  snippet: RT-nitrilase-Tm (also named UG5-large) is a two-gene defense system. It
    was discovered from P4-like satellites in *E. coli* genomes :ref{doi=10.1016/j.chom.2022.02.018}
    :ref{doi=10.1093/nar/gkac467}. Its antiphage activity was shown in *E. coli* against
    phage AL505_P2 (Myoviridae).
  notes: The pinned DefenseFinder wiki page names RT-nitrilase-Tm, also called UG5-large,
    as a two-gene system and records AL505_P2 antiphage activity in Escherichia coli.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
  snippet: The first protein is a reverse transcriptase (RT) fussed with C-N hydrolase
    domain (nitrilase); the second protein is transmembrane protein :ref{doi=10.1093/nar/gkac467}.
  notes: The pinned DefenseFinder wiki page describes the reverse-transcriptase/nitrilase
    plus transmembrane-protein architecture.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
  snippet: 'The Rst_RT-nitrilase-Tm is composed of 2 proteins: RT and RT-Tm.'
  notes: The pinned DefenseFinder wiki page maps the Rst-prefixed name to a two-component
    RT/RT-Tm structure.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
  snippet: The Rst_RT-Tm system in *Morganella morganii* (GCF_900478755.1, NZ_LS483498)
    is composed of 2 proteins RT (WP_061057569.1) RT-Tm (WP_004234654.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein Rst_RT-Tm locus
    in RefSeq assembly GCF_900478755.1 on NZ_LS483498.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
  snippet: Expressed_0[Escherichia coli] ----> Al505_P2
  notes: The DefenseFinder experimental-validation diagram links Escherichia coli
    expression of the Rst_RT-nitrilase-Tm system to protection against AL505_P2.
