identifier: traitmech:000403
label: Rst_RT-nitrilase-Tm system
definition: A phage defense system in which an organism possesses a two-protein Rst_RT-nitrilase-Tm
  locus represented by DefenseFinder as a two-profile Rst_RT-Tm model requiring Rst_RT-Tm__RT
  and Rst_RT-Tm__RT-Tm and experimentally linked to AL505_P2 protection when expressed
  in Escherichia coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
