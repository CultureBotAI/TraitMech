discussions:
- discussion_id: rst-rt-nitrilase-tm-host-mechanism-gap
  prompt: Resolve Rst_RT-nitrilase-Tm native host breadth, the Rst_RT-nitrilase-Tm
    and Rst_RT-Tm namespace relationship, accession-level RT/RT-Tm roles, the relationship
    to UG5-large source naming, and the mechanism of AL505_P2 restriction before minting
    narrower Rst_RT-nitrilase-Tm mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support a two-gene P4-hotspot system that combines a group-5
    reverse transcriptase with a C-terminal nitrilase domain and a transmembrane effector,
    and DefenseFinder maps Rst_RT-nitrilase-Tm to a required two-profile Rst_RT-Tm
    model. This first system-level record leaves native host breadth, exact profile-to-gene
    mapping, the model-namespace mismatch, the relationship to UG5-large source naming,
    the molecular activities of the RT and RT-Tm components, and the AL505_P2 restriction
    mechanism unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2022.02.018
    snippet: with a C-terminal nitrilase domain (Table S3) that is associated with
      a transmembrane effector
    notes: Rousset et al. described a validated P4-hotspot system containing a group-5
      reverse transcriptase with a C-terminal nitrilase domain associated with a transmembrane
      effector.
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_rt-nitrilase-tm.md
    snippet: RT-nitrilase-Tm (also named UG5-large) is a two-gene defense system.
      It was discovered from P4-like satellites in *E. coli* genomes :ref{doi=10.1016/j.chom.2022.02.018}
      :ref{doi=10.1093/nar/gkac467}. Its antiphage activity was shown in *E. coli*
      against phage AL505_P2 (Myoviridae).
    notes: The pinned DefenseFinder wiki page names RT-nitrilase-Tm, also called UG5-large,
      as a two-gene system and records AL505_P2 antiphage activity in Escherichia
      coli.
