identifier: traitmech:000234
label: Druantia system
definition: A phage defense system in which an organism possesses a Druantia locus
  encoding a conserved DruE-family core and subtype-specific partner proteins.
definition_source: DOI:10.64898/2026.05.12.724681
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Druantia
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.aar4120
evidence:
- reference: DOI:10.1126/science.aar4120
  snippet: Druantia DruABCDE (type I) DruMFGE (type II) DruHE (III) pfam14236, pfam00270,
    pfam00271, pfam09369, COG1205, pfam00145, COG0270 Helicase, methylase 1,342 1,321
    (2.6%)
  notes: Doron et al. reported Druantia as a helicase- and methylase-associated system
    with Type I, Type II, and Type III locus architectures in their pangenome-scale
    antiphage system discovery screen.
- reference: DOI:10.1126/science.aar4120
  snippet: A Type I system cloned from E. coli UMEA 4076-1 into E. coli MG1655 rendered
    the engineered strain resistant against 4 of the 6 phages tested
  notes: Doron et al. support Druantia as an experimentally validated phage-defense
    system rather than a source-only locus label.
- reference: DOI:10.64898/2026.05.12.724681
  snippet: There are several subtypes of Druantia that all share the DruE protein
    but differ in their associated genes
  notes: Preprint v1, not peer-reviewed. Wu et al. support defining a broad Druantia
    family record around a common DruE component while keeping subtype partners separate.
- reference: DOI:10.64898/2026.05.12.724681
  snippet: Druantia III is a late-acting defence where DruH is the likely infection
    sensor and DruE is a helicase-nuclease effector that engages ssDNA-containing
    replication intermediates
  notes: Preprint v1, not peer-reviewed. Wu et al. support the characterized Type
    III arrangement in which DruH likely senses infection and DruE acts as the helicase-nuclease
    effector.
- reference: DOI:10.64898/2026.05.12.724681
  snippet: we identified 6,885 bacterial genomes encoding complete Druantia III systems,
    defined by the presence of both DruE and DruH
  notes: Preprint v1, not peer-reviewed. Wu et al. support Druantia III as a recurring
    bacterial DruE/DruH module rather than a single engineered construct.
- reference: DOI:10.64898/2026.05.12.724681
  snippet: DruE is the only component shared across Druantia subtypes, suggesting
    that DNA processing by a DruE-like helicase-nuclease is the conserved core function
    of Druantia
  notes: Preprint v1, not peer-reviewed. Wu et al. infer a possible conserved DruE-family
    function from their type-III results and shared DruE. This is a hypothesis, not
    a demonstrated mechanism for every Druantia subtype.
- reference: DOI:10.1093/nar/gkab883
  snippet: the Druantia-like system lacks the type II requisite DruM and DruG proteins,
    instead encoding a hypothetical protein
  notes: 'Payne et al., Results and Figure 2C: the recurring type-IV architecture
    contains DruE and DruF together with the newly named DruL, instead of the type-II
    DruM/G components. This is a literature-defined system-possession class, not an
    individual profile. The study tests Zorya III, Hachiman II and Lamassu II, not
    Druantia IV. Its computational classification does not demonstrate type-IV phage
    resistance or DruL chemistry.'
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Doron et al. cloned a Druantia Type I system from E. coli UMEA 4076-1 into
    E. coli MG1655 and showed that the engineered strain resisted four of six tested
    phages.
  reference: DOI:10.1126/science.aar4120
discussions:
- discussion_id: druantia-subtype-mechanism-gap
  prompt: Resolve Druantia subtype mechanisms separately from architecture-based possession
    classes.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'Doron et al. separated Type I DruABCDE, Type II DruMFGE, and Type III
    DruHE architectures and validated one Type I locus, while Wu et al. define a Type
    III mechanism in which DruH likely senses infection and DruE engages ssDNA-containing
    intermediates. Druantia III system now captures the DruE/DruH Type III branch
    from the pinned Druantia_III DefenseFinder row, but the parent record remains
    at the DruE-core family level until separate review resolves Type I and Type II
    partner functions, Type IV partner functions represented by the pinned Druantia_IV
    HMM rows, exact phage triggers, native host breadth, and Zorya-coupled versus
    standalone outputs across Druantia loci. Druantia type IV system (traitmech:000577)
    now captures the DruE/F/L architecture described by Payne et al. (DOI:10.1093/nar/gkab883),
    without the type-II DruM/G components. This resolves the architectural child,
    not type-IV experimental defense or partner chemistry. The family definition no
    longer requires universal helicase-nuclease DNA processing. Wu et al.''s family-wide
    conservation claim is a hypothesis in a type-III preprint. The overgeneralized
    parent graph is removed; the characterized III branch remains at traitmech:000560.
    New proposal v454 replaces the unminted v111 family row without changing the local
    family identifier or historical TSV. Type I architecture is now represented by
    traitmech:000578 Druantia type I system: DruB/C/D/E with optional DruA. Doron''s
    optional DUF4338 component and the Ralstonia study''s mapping of that domain to
    DruA qualify the earlier five-gene shorthand. The five-profile PADLOC rule and
    three-match DefenseFinder threshold are detection criteria, not identical biological
    definitions. This resolves the type-I architecture lead, not its partner functions
    or native-host mechanism. Type II remains an architecture-class discovery lead.'
  posed_by: codex
  posed_date: '2026-09-15'
  evidence:
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| Druantia_IV__DruE4                               |                                                  |
      Druantia_IV            | Custom                  | 750    |

      | Druantia_IV__DruF4                               |                                                  |
      Druantia_IV            | Custom                  | 20     |

      | Druantia_IV__DruL                                |                                                  |
      Druantia_IV            | Custom                  | 100    |'
    notes: The pinned DefenseFinder HMM inventory records Druantia_IV__DruE4, Druantia_IV__DruF4,
      and Druantia_IV__DruL under the Druantia_IV model namespace.
