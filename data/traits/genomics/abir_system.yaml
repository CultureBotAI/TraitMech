    loci to AbiR antiphage activity, impeded phage DNA replication, restricted lactococcal
    phage propagation, and abortive-infection system possession without resolving
    the phage trigger or individual component activities.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiR as a named DefenseFinder three-profile abortive-infection
