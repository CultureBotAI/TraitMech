identifier: traitmech:000317
label: AbiR system
definition: An abortive infection system in which an organism possesses a multicomponent
  AbiR determinant represented by the DefenseFinder AbiR__AbiRa, AbiR__AbiRb, and
  AbiR__AbiRc profiles and capable of restricting lactococcal phage propagation by
  an early abortive-infection mechanism that impedes phage DNA replication, as exemplified
  by the two pKR223 loci from Lactococcus lactis subsp. lactis KR2 separated by the
  LlaKR2I restriction-modification genes.
definition_source: DOI:10.1128/AEM.66.6.2647-2651.2000
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiR
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.66.6.2647-2651.2000
evidence:
- reference: PMID:10831451
  snippet: The native lactococcal plasmid pKR223 encodes two distinct phage resistance
    mechanisms, a restriction and modification (R/M) system designated LlaKR2I and
    an abortive infection mechanism (Abi) which affects prolate-headed-phage proliferation
  notes: Twomey et al. identify native Lactococcus lactis plasmid pKR223 as the source
    of a restriction-modification system and a separate abortive-infection determinant.
- reference: PMID:10831451
  snippet: sequence analysis has validated the novelty of the Abi system, which has
    now been designated AbiR
  notes: Twomey et al. name AbiR as the novel abortive-infection system from pKR223.
- reference: PMID:10831451
  snippet: Analysis of deletion and insertion clones demonstrated that AbiR was encoded
    by two genetic loci, separated by the LlaKR2I R/M genes
  notes: Twomey et al. show that the AbiR phenotype requires two pKR223 loci separated
    by the LlaKR2I restriction-modification genes.
- reference: PMID:10831451
  snippet: Mechanistic studies on the AbiR phenotype indicated that it was heat sensitive
    and that it impeded phage DNA replication
  notes: Twomey et al. connect AbiR activity to a heat-sensitive abortive-infection
    phenotype that impedes phage DNA replication.
- reference: PMID:10831451
  snippet: These data indicated that AbiR is a novel multicomponent, heat-sensitive,
    "early"-functioning Abi system
  notes: Twomey et al. classify AbiR as a multicomponent early abortive-infection
    system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiR | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiR model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiR\tAbiR\t3\t3\tAbiR__AbiRa, AbiR__AbiRb, AbiR__AbiRc"
  notes: The DefenseFinder rules table models AbiR as a three-component system requiring
