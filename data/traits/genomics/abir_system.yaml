discussions:
- discussion_id: abir-component-activity-gap
  prompt: Resolve the AbiR phage trigger, profile-to-locus mapping, and AbiRa, AbiRb,
    and AbiRc molecular functions before minting narrower AbiR mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Twomey et al. support AbiR as a multicomponent abortive-infection system
    encoded by two separated pKR223 loci, and DefenseFinder represents AbiR with a
    three-profile rule. This first system-level record leaves the phage trigger, the
    mapping from the two original genetic loci to AbiRa, AbiRb, and AbiRc profiles,
    the component molecular activities, and the direct reason that AbiR impedes phage
    DNA replication unresolved.
  evidence:
  - reference: PMID:10831451
    snippet: Analysis of deletion and insertion clones demonstrated that AbiR was
      encoded by two genetic loci, separated by the LlaKR2I R/M genes
    notes: Twomey et al. localize AbiR to two separated pKR223 loci rather than to
      the three-component DefenseFinder profile scheme.
  attaches_to:
  - causal_graphs#abir_loci_impede_phage_dna_replication
