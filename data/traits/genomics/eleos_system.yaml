discussions:
- discussion_id: eleos-mechanism-gap
  prompt: Resolve Eleos phage triggers and effector outputs before minting narrower
    Eleos mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Eleos as a named anti-phage
    system with LeoA, LeoB, LeoBC, and LeoC profiles, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
  attaches_to:
