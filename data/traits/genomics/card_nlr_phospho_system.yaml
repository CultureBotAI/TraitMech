discussions:
- discussion_id: card-nlr-phospho-activity-gap
  prompt: Resolve the CARD_NLR_Phospho phage triggers, native hosts, phosphorylated
    substrate, CARD-to-effector activation sequence, and profile-to-activity criteria
    before minting enzyme, trigger, or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wein et al. support CARD-like anti-phage defense systems, and the pinned
    DefenseFinder HMM inventory and rules table support CARD_NLR_Phospho as a subtype
    with a CARD_NLR__Trypsin_Phospho mandatory profile. This first-pass record leaves
    exact phage triggers, native hosts, accessory-profile requirements, phosphorylated
    substrate, and CARD-to-phospho-effector activation unresolved.
  evidence:
  - reference: https://europepmc.org/article/PPR/PPR668921
    snippet: Here we show that CARD-like domains are present in defense systems that
      protect bacteria against phage.
    notes: Wein et al. support bacterial CARD-like domains as parts of anti-phage
