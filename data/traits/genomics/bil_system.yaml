  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Hor et al. support Bil as a bacterial ubiquitin-like conjugation antiphage
    system that modifies the phage central tail fibre, and the pinned DefenseFinder
    article registry maps Bil to the Millman et al. discovery preprint. The same pinned
    HMM inventory and rules table do not include exact Bil rows, so the exact DefenseFinder
    profile set, component rule, and model coverage remain unresolved.
