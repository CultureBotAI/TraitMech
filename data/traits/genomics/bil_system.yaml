identifier: traitmech:000369
label: Bil system
definition: A phage defense system in which an organism possesses a Bil bacterial
  ubiquitin-like conjugation locus that can covalently attach a ubiquitin-like protein
  to the bacteriophage central tail fibre and impair phage infectivity.
definition_source: DOI:10.1038/s41586-024-07616-5
trait_category: GENOMICS
term_kind: CLASS
