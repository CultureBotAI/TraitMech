identifier: traitmech:000303
label: Stk2 system
definition: An abortive infection system in which an organism possesses a phage-defense
  locus encoding the Stk2 serine/threonine kinase, which can be activated by a phage
  protein to phosphorylate host proteins and induce host-cell death that prevents
  bacteriophage propagation.
definition_source: DOI:10.1016/j.chom.2016.08.010
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: Stk2
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.chom.2016.08.010
  snippet: Here we identify Stk2, a staphylococcal serine/threonine kinase that provides
    efficient immunity against bacteriophages by inducing abortive infection
  notes: Depardieu et al. identify Stk2 as a staphylococcal serine/threonine kinase
    that provides bacteriophage immunity through abortive infection.
- reference: DOI:10.1016/j.chom.2016.08.010
  snippet: A phage protein of unknown function activates the Stk2 kinase
  notes: Depardieu et al. connect an unidentified phage protein to Stk2 kinase activation.
- reference: DOI:10.1016/j.chom.2016.08.010
  snippet: This leads to the Stk2-dependent phosphorylation of several proteins involved
    in translation, global transcription control, cell-cycle control, stress response,
    DNA topology, DNA repair, and central metabolism
  notes: Depardieu et al. describe Stk2-dependent phosphorylation of multiple host-protein
    targets after Stk2 activation.
- reference: DOI:10.1016/j.chom.2016.08.010
  snippet: Bacterial host cells die as a consequence of Stk2 activation, thereby preventing
    propagation of the phage to the rest of the bacterial population
  notes: Depardieu et al. connect Stk2 activation to host-cell death and the resulting
    block of phage propagation.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Stk2 | 10\.1016/j\.chom\.2016\.08\.010 | A eukaryotic-like Serine/threonine
    kinase protects staphylococci against phages
  notes: The DefenseFinder article registry maps the named Stk2 system to the Depardieu
    et al. final article.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Stk2\tStk2\t1\t1\tStk2__Stk2"
  notes: The DefenseFinder rules table models Stk2 as a one-component system requiring
    the Stk2__Stk2 profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Stk2__Stk2                                       | Stk2__Stk2                                       |
    Stk2                   | Custom                  | 150    |'
