discussions:
- discussion_id: stk2-activator-and-death-target-gap
  prompt: Resolve the Stk2-activating phage protein and lethal host-phosphorylation
    target before minting narrower Stk2 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Depardieu et al. support Stk2 as a named phage-activated serine/threonine
    kinase system whose activation causes host-protein phosphorylation, bacterial
    host-cell death, and abortive infection, and DefenseFinder represents Stk2 with
    a one-profile model. This system-level record leaves the direct phage activator,
    the lethal Stk2 phosphorylation target, target conservation across Stk2 loci,
    and phage escape routes unresolved.
  attaches_to:
  - causal_graphs#stk2_activation_aborts_phage_infection
