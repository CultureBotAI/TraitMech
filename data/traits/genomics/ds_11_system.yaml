discussions:
- discussion_id: ds-11-defensefinder-model-gap
  prompt: Resolve DS-11 native host breadth, profile-to-protein mapping, sensitive-phage
    breadth, direct viral trigger, direct HEPN-family nuclease substrate, CBS-ligand
    or ATP-dependent activation model, and rule-level detection criteria before minting
    narrower DS-11 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-11 as the defensive IMPD transcriptional unit
    that reduced T3 and Bas67 plaquing when cloned in E. coli MG1655, and the final
    Table S8 HHpred sheet reports HEPN and CBS hits for the single IMPD product. The
    pinned DefenseFinder HMM inventory records one DS-11 profile row, the pinned rules
    table has no DS-11 row, and the first-pass record does not resolve native host
    breadth, exact profile-to-protein correspondence, the direct HEPN substrate, the
    activation ligand, phage target breadth, or endogenous DS-11 activity.
