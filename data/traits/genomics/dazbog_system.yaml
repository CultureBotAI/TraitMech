discussions:
- discussion_id: dazbog-mechanism-gap
  prompt: Resolve Dazbog phage triggers and effector outputs before minting narrower
    Dazbog mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Dazbog as a named DzbA/DzbB
    anti-phage locus, but the trigger, molecular substrate, antiviral effector output,
    and death-or-survival phenotype are not resolved enough here to assert a narrower
    mechanistic child trait.
