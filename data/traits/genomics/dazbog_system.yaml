identifier: traitmech:000245
label: Dazbog system
definition: A phage defense system in which an organism possesses a two-component
  Dazbog locus encoding DzbA and DzbB components that can protect bacteria from bacteriophage
  infection.
definition_source: DOI:10.1016/j.chom.2022.09.017
