identifier: traitmech:000255
label: Shango system
definition: A phage defense system in which an organism possesses a Shango locus represented
  by a mandatory SngA profile and an SngB or SngC profile that can protect bacteria
  from bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2022.09.017
