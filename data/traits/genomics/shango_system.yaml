discussions:
- discussion_id: shango-mechanism-gap
  prompt: Resolve Shango phage triggers and effector outputs before minting narrower
    Shango mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Shango as a named anti-phage
    system with SngA, SngB, and SngC profile choices, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
