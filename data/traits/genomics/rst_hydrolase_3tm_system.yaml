  snippet: 'two systems that specifically inhibit the growth of phage T7: an ATP-dependent
    helicase associated with a DUF2290 protein and a HAD-like hydrolase associated
    with a transmembrane protein'
  notes: Rousset et al. experimentally linked a HAD-like hydrolase plus transmembrane-protein
    pair to specific inhibition of phage T7 growth.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Phage resistance heatmap of the validated defense systems shows the mean
    fold resistance of three independent replicates against a panel of eight phages
  notes: The Figure 5 legend frames the cloned P4-hotspot hits, including the hydrolase
    plus transmembrane-protein system, as validated defense systems in a replicated
    phage-resistance heatmap.
