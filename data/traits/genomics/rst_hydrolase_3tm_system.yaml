discussions:
- discussion_id: rst-hydrolase-3tm-host-mechanism-gap
  prompt: Resolve Rst_Hydrolase-3Tm native host breadth, the Rst_Hydrolase-3Tm and
    Rst_Hydrolase-Tm namespace relationship, accession-level Hydrolase/Hydrolase-Tm
    roles, and the mechanism of T7 restriction before minting narrower Rst_Hydrolase-3Tm
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support a two-gene HAD-like hydrolase plus transmembrane-protein
    P4-hotspot system that inhibits T7 growth, and DefenseFinder maps Rst_Hydrolase-3Tm
    to a required two-profile Rst_Hydrolase-Tm model. This first system-level record
    leaves native host breadth, profile-to-gene mapping, the model-namespace mismatch,
    the molecular activities of the Hydrolase and Hydrolase-Tm components, and the
    T7 restriction mechanism unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2022.02.018
    snippet: 'two systems that specifically inhibit the growth of phage T7: an ATP-dependent
      helicase associated with a DUF2290 protein and a HAD-like hydrolase associated
      with a transmembrane protein'
    notes: Rousset et al. experimentally linked a HAD-like hydrolase plus transmembrane-protein
      pair to specific inhibition of phage T7 growth.
