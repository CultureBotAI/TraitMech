identifier: traitmech:000402
label: Rst_Hydrolase-3Tm system
definition: A phage defense system in which an organism possesses a two-protein Rst_Hydrolase-3Tm
  locus represented by DefenseFinder as a two-profile Rst_Hydrolase-Tm model requiring
  Rst_Hydrolase-Tm__Hydrolase and Rst_Hydrolase-Tm__Hydrolase-Tm and experimentally
  linked to T7 protection when expressed in Escherichia coli.
