identifier: traitmech:000377
label: Rst TIR-NLR system
definition: A phage defense system in which an organism possesses a P4-like TIR-NLR
  locus represented by DefenseFinder as the Rst_TIR-NLR single-profile model and experimentally
  linked to broad virulent-phage and P2-like phage restriction.
definition_source: DOI:10.1016/j.chom.2022.02.018
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: TIR-NLR system
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.chom.2022.02.018
- synonym_text: Rst_TIR-NLR
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: Rst_TIR-NLR__TIR
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Here, we show that hotspots of genetic diversity within the P2-like phage
    and P4-like satellite families constitute large reservoirs of anti-phage systems.
  notes: Rousset et al. establish that P2-like phage and P4-like satellite hotspots
    are large reservoirs of anti-phage systems.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Validated systems also include a single-gene system with a TIR (toll/interleukin-1-receptor-like)
    domain protein.
  notes: Rousset et al. describe one validated P4 hotspot system as a single-gene
    TIR-domain system.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Out of the 18 tested systems, only the TIR-NLR system provided protection
  notes: Rousset et al. report that TIR-NLR was the only P4 system in their tested
    cohort that protected against P2-like phages.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: This shows that while the TIR-NLR system protects against a broad range
    of virulent phages, this comes at the cost of limiting the transduction of P4
    by P2.
  notes: Rousset et al. summarize broad virulent-phage protection by the TIR-NLR system
    in the context of P4 transduction costs.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Rst_TIR-NLR | 10\.1101/2021\.01\.21\.427644 | Prophage-encoded hotspots
    of bacterial immune systems
  notes: The DefenseFinder article registry maps the named Rst_TIR-NLR system to the
    Rousset et al. preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Rst_TIR-NLR\tRst_TIR-NLR\t1\t1\tRst_TIR-NLR__TIR\t\t\t"
  notes: The DefenseFinder rules table models Rst_TIR-NLR as a single-profile system
    requiring the Rst_TIR-NLR__TIR profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Rst_TIR-NLR__TIR                                 | Rst_TIR-NLR__TIR                                 |
    Rst_TIR-NLR            | Custom                  | 70     |'
  notes: The DefenseFinder HMM inventory records Rst_TIR-NLR__TIR under the Rst_TIR-NLR
    system namespace.
