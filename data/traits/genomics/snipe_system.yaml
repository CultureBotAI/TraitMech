identifier: traitmech:000414
label: SNIPE system
definition: A phage defense system in which an organism possesses a SNIPE anti-bacteriophage
  system that localizes to the bacterial membrane, exploits the spatial organization
  of phage genome injection, and directly cleaves incoming phage DNA to block siphovirus
  infection.
definition_source: DOI:10.1038/s41586-026-10207-1
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: SNIPE
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-026-10207-1
evidence:
- reference: DOI:10.1038/s41586-026-10207-1
  snippet: Here, we characterize SNIPE, an anti-bacteriophage defence system that
    constitutively localizes to the bacterial cell membrane in Escherichia coli
  notes: Saxton et al. define SNIPE as an anti-bacteriophage defence system and localize
    it to the bacterial cell membrane in Escherichia coli.
- reference: DOI:10.1038/s41586-026-10207-1
  snippet: Using radiolabelled phage DNA and time-lapse microscopy to track phage
    genomes, we demonstrate that SNIPE directly cleaves phage DNA during genome injection.
  notes: Saxton et al. show that SNIPE directly cleaves phage DNA while the phage
    genome is being injected.
- reference: DOI:10.1038/s41586-026-10207-1
  snippet: SNIPE also defends against diverse siphoviruses
  notes: Saxton et al. support SNIPE defence against diverse siphoviruses.
- reference: DOI:10.1038/s41586-026-10207-1
  snippet: Our findings establish SNIPE as a widespread bacterial defence system that
    exploits the spatial organization of phage genome injection to specifically target
    viral DNA
  notes: Saxton et al. frame SNIPE as a widespread defence system that exploits phage
    genome-injection geometry to target viral DNA.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| SNIPE | 10\.1038/s41586-026-10207-1 | A membrane-bound nuclease directly
    cleaves phage DNA during genome injection |'
  notes: The pinned DefenseFinder article registry maps the named SNIPE system to
    the Saxton et al. phage-genome-injection cleavage paper. The pinned HMM inventory
    and rules table do not list SNIPE, so this row is name-to-paper evidence rather
    than model-component evidence.
