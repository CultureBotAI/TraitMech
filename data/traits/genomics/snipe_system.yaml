discussions:
- discussion_id: snipe-defensefinder-model-gap
  prompt: Resolve SNIPE host breadth, sensitive-phage breadth, direct tape-measure
    interaction specificity, and DefenseFinder HMM/rules coverage before minting narrower
    SNIPE mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Saxton et al. support SNIPE as a membrane-localized anti-bacteriophage
    system that directly cleaves phage DNA during genome injection, while the pinned
    DefenseFinder article registry names a SNIPE system. The pinned DefenseFinder
    HMM inventory and rules table have no SNIPE rows, and the evidence does not yet
    resolve full host breadth, full target-phage breadth, direct tape-measure protein
    specificity, or profile-to-activity modeling.
  evidence:
  - reference: DOI:10.1038/s41586-026-10207-1
    snippet: Our findings establish SNIPE as a widespread bacterial defence system
      that exploits the spatial organization of phage genome injection to specifically
      target viral DNA
    notes: Saxton et al. support SNIPE as a widespread phage-defense system targeting
      viral DNA during phage genome injection.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
    snippet: '| SNIPE | 10\.1038/s41586-026-10207-1 | A membrane-bound nuclease directly
      cleaves phage DNA during genome injection |'
    notes: The pinned DefenseFinder article registry maps the named SNIPE system to
      the Saxton et al. phage-genome-injection cleavage paper. The pinned HMM inventory
      and rules table do not list SNIPE, so this row is name-to-paper evidence rather
      than model-component evidence.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    notes: The pinned DefenseFinder HMM inventory does not list SNIPE, leaving profile-level
      components unresolved.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    notes: The pinned DefenseFinder rules table does not list SNIPE, leaving rule-level
      detection criteria unresolved.
