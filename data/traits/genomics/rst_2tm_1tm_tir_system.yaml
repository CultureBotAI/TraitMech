identifier: traitmech:000400
label: Rst_2TM_1TM_TIR system
definition: A phage defense system in which an organism possesses a three-protein
  Rst_2TM_1TM_TIR locus represented by DefenseFinder as a three-profile model requiring
  Rst_2TM_1TM_TIR__Rst_1TM_TIR, Rst_2TM_1TM_TIR__Rst_2TM_TIR, and Rst_2TM_1TM_TIR__Rst_TIR_tm
  and experimentally linked to multi-phage protection when expressed in Escherichia
  coli C.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
