evidence:
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
  snippet: The Rst_2TM_1TM_TIR system is carried by the P2-like phage AC1 and protects
    *Escherichia coli* C against lambda, LF82_P8 and P2 phages. This system is composed
    of three proteins, Rst_TIR_tm, which contains a TIR (Toll/interleukin-1 receptor)
    domain, Rst_1TM_TIR, which contains a transmembrane helix (TM) and Rst_2TM_TIR,
    that contains two TMs :ref{doi=10.1016/j.chom.2022.02.018}.
  notes: The pinned DefenseFinder wiki page names Rst_2TM_1TM_TIR as a three-protein
    system and links the AC1 locus to lambda, LF82_P8, and P2 protection in Escherichia
    coli C.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
  snippet: Rousset et al. suggested that the TIR-containing protein could generate
    a nucleotide messenger that in turn could activate the associated transmembrane
    proteins.
  notes: The pinned DefenseFinder wiki page records the unresolved Rousset et al.
    hypothesis that the TIR-containing protein could produce a nucleotide messenger
    that activates the transmembrane proteins.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The pinned DefenseFinder wiki page leaves the Rst_2TM_1TM_TIR molecular mechanism
    unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
  snippet: 'The Rst_2TM_1TM_TIR is composed of 3 proteins: Rst_2TM_TIR, Rst_TIR_tm
    and Rst_1TM_TIR.'
  notes: The pinned DefenseFinder wiki page describes Rst_2TM_1TM_TIR as a three-component
    Rst_2TM_TIR/Rst_TIR_tm/Rst_1TM_TIR system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
  snippet: The Rst_2TM_1TM_TIR system in *Escherichia coli* (GCF_004006575.1, NZ_CP034787)
    is composed of 3 proteins Rst_TIR_tm (WP_023140578.1) Rst_1TM_TIR (WP_001534953.1)
    Rst_2TM_TIR (WP_023140577.1)
  notes: The DefenseFinder wiki illustrates a predicted three-protein Rst_2TM_1TM_TIR
    locus in RefSeq assembly GCF_004006575.1 on NZ_CP034787.
