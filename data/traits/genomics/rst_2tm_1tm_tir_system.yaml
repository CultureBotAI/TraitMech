discussions:
- discussion_id: rst-2tm-1tm-tir-mechanism-gap
  prompt: Resolve Rst_2TM_1TM_TIR native host breadth, accession-level components,
    the proposed TIR-derived nucleotide messenger, and the downstream transmembrane
    activation mechanism before minting narrower Rst_2TM_1TM_TIR mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The pinned DefenseFinder wiki supports a three-component AC1 Rst_2TM_1TM_TIR
    system that protects Escherichia coli C against multiple phages, and DefenseFinder
    represents Rst_2TM_1TM_TIR as a required three-profile model. Rousset et al. proposed
    that the TIR-containing protein could generate a nucleotide messenger to activate
    associated transmembrane proteins, but the wiki still records the molecular mechanism
    as unknown.
  evidence:
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_2tm_1tm_tir.md
    snippet: Rousset et al. suggested that the TIR-containing protein could generate
      a nucleotide messenger that in turn could activate the associated transmembrane
      proteins.
    notes: The pinned DefenseFinder wiki page records the unresolved Rousset et al.
      hypothesis that the TIR-containing protein could produce a nucleotide messenger
      that activates the transmembrane proteins.
