discussions:
- discussion_id: lit-mechanism-gap
  prompt: Resolve natural Lit loci, host breadth beyond Escherichia coli K-12 e14,
    Gol-activation contexts, and Lit__Lit profile-to-activity mapping before minting
    narrower Lit mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Copeland et al. support the T4-triggered e14 Lit peptidase as a bacteriophage-exclusion
    determinant, Uzan et al. summarize Gol-Lit as a T4 phage-exclusion system, and
    DefenseFinder models Lit as a single-profile system. The natural host breadth
    and profile-to-activity mapping remain unresolved.
  attaches_to:
  - causal_graphs#lit_locus_restricts_t4_phage
