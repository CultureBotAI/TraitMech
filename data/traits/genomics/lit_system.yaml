evidence:
- reference: PMID:15196039
  snippet: Bacteriophage exclusion is a suicide response to viral infection. In strains
    of Escherichia coli K-12 infected with T4 phage this process is mediated by the
    host-encoded Lit peptidase. Lit is activated by a unique sequence in the major
    head protein of the T4 phage (the Gol sequence) which then cleaves site-specifically
    the host translation factor EF-Tu, ultimately leading to cell death.
  notes: Copeland et al. support host Lit as a T4-activated bacteriophage-exclusion
    peptidase that cleaves EF-Tu and leads to cell death.
- reference: PMID:21129205
  snippet: phage exclusion systems that involve T4-mediated activation of a latent
    endoribonuclease (PrrC) and cofactor-assisted activation of EF-Tu proteolysis
    (Gol-Lit)
  notes: Uzan et al. name Gol-Lit as a T4 phage-exclusion system whose output is cofactor-assisted
    activation of EF-Tu proteolysis.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'Lit | 10\.1186/1743-422X-7-360 | Post-transcriptional control by bacteriophage
    T4: mRNA decay and inhibition of translation initiation'
  notes: The DefenseFinder article registry maps the named Lit system to the Uzan
    et al. T4 post-transcriptional-control review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Lit\tLit\t1\t1\tLit__Lit"
  notes: The DefenseFinder rules table models Lit as a single-mandatory-profile system
    with the Lit__Lit profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
