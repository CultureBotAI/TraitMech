identifier: traitmech:000092
label: transposable element
definition: A genomics trait describing possession of transposable elements — such as
  insertion sequences and transposons — that move within the genome and drive genome
  rearrangement, gene inactivation, and plasticity.
definition_source: DOI:10.1111/1574-6976.12067
