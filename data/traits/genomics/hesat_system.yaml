discussions:
- discussion_id: hesat-mechanism-gap
  prompt: Resolve Hesat phage triggers and effector outputs before minting narrower
    Hesat mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Grafakou et al. and DefenseFinder support Hesat as a named single-gene
    anti-phage system, but the direct trigger, experimentally validated molecular
    substrate, antiviral effector output, natural locus breadth, and profile-to-component
    model are not resolved enough here to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#hesat_locus_restricts_phage
