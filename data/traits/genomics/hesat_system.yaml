identifier: traitmech:000327
label: Hesat system
definition: A phage defense system in which an organism possesses a Hesat locus that
  can restrict bacteriophage infection.
definition_source: DOI:10.1093/nar/gkae671
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Hesat
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkae671
evidence:
- reference: DOI:10.1093/nar/gkae671
  snippet: Based on comparative sequence analysis (BLASTN and BLASTP) and on functional
    and structural analysis (HHpred and InterPro) the remaining seven antiphage systems
    (out of the twenty identified) did not display significant homology to any previously
    described antiphage system, thus rendering them novel antiphage systems (Table
    1). These systems were named after cheese, cattle or fermentation related deities
    (Rhea, Aristaios, Kamadhenu, Fliodhais, Audmula, Rugutis and Hesat)
  notes: Grafakou et al. named Hesat among seven not previously described lactococcal
    antiphage systems.
- reference: DOI:10.1093/nar/gkae671
  snippet: Except for Hesat, which was cloned in pPTPi with the addition of its native
    signals, all novel systems were cloned in the high-copy number vector pNZ44 (Supplementary
    Table S2). All discovered systems, except Fliodhais, are single gene antiphage
    systems.
  notes: Grafakou et al. identify Hesat as a single-gene novel antiphage system cloned
    with native signals in pPTPi.
- reference: DOI:10.1093/nar/gkae671
  snippet: For Hesat, no domain was predicted by HHpred and InterPro. Dali analysis
    reports significant hits with the colicin-D toxic domain (PDB ID 1V74; Figure
    4N, O), which specifically cleaves the anticodon loop of all four tRNA(Arg) iso-acceptors,
    thereby resulting in cell death (68). Therefore, it is proposed that Hesat upon
    phage infection is activated to block translation, which is in accordance with
    its abortive infection phenotype.
  notes: Grafakou et al. report that Hesat had no HHpred or InterPro domain prediction,
    and they propose a colicin-D-like translation-blocking activity upon phage infection.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Hesat | 10\.1093/nar/gkae671 | Discovery of antiphage systems in the lactococcal
    plasmidome
  notes: The DefenseFinder article registry maps the named Hesat system to the Grafakou
    et al. lactococcal antiphage-system discovery paper.
