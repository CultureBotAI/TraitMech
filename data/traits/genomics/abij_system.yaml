evidence:
- reference: DOI:10.1111/j.1574-6968.1997.tb10185.x
  snippet: A novel plasmid-encoded phage abortive infection system from Lactococcus
    lactis biovar. diacetylactis
  notes: Europe PMC metadata verifies the Deng et al. 1997 AbiJ primary paper title
    and PMID:8997719; the DOI landing page was Cloudflare-blocked and Europe PMC exposed
    no abstract or full text, so this record cites Deng et al. for the primary AbiJ
    identity and uses later accessible sources for snippet-backed system details.
- reference: DOI:10.1093/femsre/fuag009
  snippet: Experimentally confirmed lactococcal Abi-like systems, as well as information
    on their antiphage activity range
  notes: The FEMS review frames Table 1 as a curated set of experimentally confirmed
    lactococcal Abi-like systems.
- reference: DOI:10.1093/femsre/fuag009
  snippet: AbiJ (Also abi-859)
  notes: The 2026 FEMS review lists AbiJ, also named abi-859, among the experimentally
    confirmed lactococcal Abi-like systems.
- reference: DOI:10.1073/pnas.2426508122
  snippet: we isolated 66 phage escape mutants which had become insensitive to 13
    distinct, plasmid-encoded lactococcal phage resistance systems (i.e. Rhea, Kamadhenu,
    Rugutis, Audmula, PARIS, type II CBASS, Septu, AbiA, AbiB, AbiD/F, AbiG, AbiJ,
    AbiP)
  notes: Mosterd et al. include AbiJ in a set of distinct plasmid-encoded lactococcal
    phage-resistance systems used for escape-mutant isolation.
- reference: DOI:10.1093/femsre/fuag009
  snippet: AbiA escape mutants also circumvent AbiJ, which was not observed for other
    combinations
  notes: The FEMS review summarizes Mosterd et al.'s escape-mutant evidence linking
    AbiA escape mutations to AbiJ bypass while not yet identifying AbiJ's direct molecular
    trigger.
- reference: DOI:10.1093/femsre/fuag009
  snippet: Although no particular mechanistic information is currently available for
    AbiJ
  notes: The FEMS review explicitly keeps AbiJ mechanism unresolved; this record therefore
    avoids protein-level chemistry and TA-system mechanism claims.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
