discussions:
- discussion_id: abij-trigger-and-effector-gap
  prompt: Resolve the AbiJ phage trigger, molecular activity, and exact AbiA escape-mutant
    overlap before minting narrower AbiJ mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Deng et al. support AbiJ as a lactococcal plasmid-encoded abortive-infection
    system, and DefenseFinder represents AbiJ with a one-profile rule. Mosterd et
    al. show that AbiJ escape behavior overlaps with AbiA escape mutants, but the
    FEMS review notes that AbiJ still lacks a resolved mechanism. This first system-level
    record therefore leaves AbiJ's direct phage trigger, molecular effector activity,
    natural locus breadth, exact HEPN-domain interpretation, growth-arrest or cell-death
    route, and phage escape routes unresolved.
  evidence:
  - reference: DOI:10.1093/femsre/fuag009
    snippet: While AbiB and AbiJ show only weak predictions (HHpred hits for HEPN
      domain containing-proteins with E-values > 0.1) or lack identifiable functional
      domains based on InterPro and HHpred
    notes: The FEMS review notes that AbiJ HEPN-domain evidence remains weak in sequence/domain-prediction
      analyses.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: Although no particular mechanistic information is currently available
      for AbiJ
    notes: The FEMS review leaves AbiJ's mechanism unresolved.
