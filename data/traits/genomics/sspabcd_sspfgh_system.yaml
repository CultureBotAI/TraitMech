identifier: traitmech:000223
label: SspABCD-SspFGH system
definition: A phosphorothioate defense system in which an organism possesses an SspABCD-SspFGH
  locus that pairs an SspABCD-family single-stranded DNA phosphorothioation module
  with an SspFGH restriction module to damage non-phosphorothioated phage DNA and
  suppress phage DNA replication.
definition_source: DOI:10.1128/mbio.00613-21
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000213
synonyms:
- synonym_text: SspABCD-SspFGH defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/mbio.00613-21
evidence:
- reference: DOI:10.1128/mbio.00613-21
  snippet: new type of ssDNA PT-based SspABCD-SspFGH defense system capable of providing
    protection against phages
  notes: Wang et al. name SspABCD-SspFGH as a single-stranded DNA phosphorothioation-based
    bacterial phage-defense system.
- reference: DOI:10.1128/mbio.00613-21
  snippet: PT-modifying genes sspBCD and iscS in Vibrio anguillarum strain FF-93 can
    provide protection against a range of phages in combination with sspFGH
  notes: Wang et al. support a native Vibrio anguillarum FF-93 Ssp system whose IscS-SspBCD
    phosphorothioation module works with the sspFGH cassette.
- reference: DOI:10.1128/mbio.00613-21
  snippet: SspFGH coupled with IscS-SspBCD behaves as a new type of ssDNA PT modification-based
    defense barrier to fend off phage invasion
  notes: Wang et al. support the modification-plus-restriction architecture and antiphage
    output.
- reference: DOI:10.1128/mbio.00613-21
  snippet: SspFGH damages non-PT-modified DNA and exerts antiphage activity by suppressing
    phage DNA replication
  notes: Wang et al. connect SspFGH-dependent DNA damage to the observed block in
    phage DNA replication.
- reference: DOI:10.1038/s41564-020-0700-6
  snippet: SspABCD confers single-stranded and high-frequency PTs with SspB acting
    as a nickase
  notes: Xiong et al. independently support SspABCD-family single-stranded host-DNA
    phosphorothioation.
- reference: DOI:10.3390/ijms252413316
  snippet: could also be coupled to SspFGH for anti-phage activity
  notes: Xu and Gu summarize SspFGH as an SspABCD-coupled phosphorothioate antiphage
    restriction module.
canonical_examples:
- taxon_id: NCBITaxon:55601
  taxon_label: Vibrio anguillarum
  note: Wang et al. identified an sspFGH cassette adjacent to the sspBCD cluster in
    Vibrio anguillarum FF-93 and showed that its SspFGH module couples to IscS-SspBCD
    phosphorothioation for phage defense.
  reference: DOI:10.1128/mbio.00613-21
causal_graphs:
- graph_id: sspabcd_sspfgh_non_pt_dna_damage
  title: SspABCD-SspFGH systems couple Ssp PT marks to foreign-DNA damage
  description: Evidence-backed process sketch linking an SspABCD-SspFGH locus to single-stranded
    host DNA phosphorothioation, SspFGH-dependent damage of non-phosphorothioated
    phage DNA, and reduced phage DNA replication.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures SspABCD-SspFGH restriction at the system level without
    asserting one universal host taxon, PT frequency, a DNA-damage chemistry, a complete
    SspFGH subunit cycle, or relationship to SspE and archaeal PT antiviral systems.
