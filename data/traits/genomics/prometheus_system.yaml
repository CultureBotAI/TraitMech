identifier: traitmech:000291
label: Prometheus system
definition: A phage defense system in which an organism possesses a Prometheus locus
  that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2024.07.007
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
