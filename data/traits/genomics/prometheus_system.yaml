discussions:
- discussion_id: prometheus-mechanism-gap
  prompt: Resolve Prometheus phage triggers and effector outputs before minting narrower
    Prometheus mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: van den Berg et al. and DefenseFinder support Prometheus as a named anti-phage
    system with a Prometheus__ProA HMM profile entry, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
