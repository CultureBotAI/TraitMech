identifier: traitmech:000448
label: DS-23 system
definition: A phage defense system in which an organism possesses the single-gene
  DefensePredictor-discovered system 23 locus cataloged as working transcriptional
  unit E2DP and whose plasmid expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
