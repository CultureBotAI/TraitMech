discussions:
- discussion_id: card-nlr-subtype-mechanism-gap
  prompt: Resolve CARD-NLR subtype effectors, phage triggers, natural-host examples,
    and GasderMIN subtype boundaries before minting narrower CARD-NLR mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wein et al. support CARD-like domains in multiple anti-phage defense
    systems that activate cell-death effectors, and DefenseFinder models CARD_NLR
    subtypes with gasdermin, endonuclease, CARD_NLR_Phospho, and Subtilase effector
    profiles. This first system-level record leaves the exact phage triggers, CARD-to-effector
    activation sequence, accession-level natural-host components, and boundaries between
    standalone GasderMIN and CARD_NLR_GasderMIN contexts unresolved.
  attaches_to:
  - causal_graphs#card_nlr_loci_activate_cell_death_effectors
  posed_by: codex
  posed_date: '2026-09-21'
