identifier: traitmech:000337
label: CARD-NLR system
definition: A phage defense system in which an organism possesses a CARD-NLR locus
  represented by the DefenseFinder CARD_NLR model namespace, coupling bacterial CARD-like
  detector components and NLR-like profiles to subtype-specific GasderMIN, endonuclease,
  Trypsin_Phospho, or Subtilase effector profiles that can promote cell death after
  phage recognition.
definition_source: DOI:10.1101/2023.05.28.542683
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: CARD_NLR
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: CARD_NLR__CARD_Protease
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: CARD_NLR__NLR_new
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: https://europepmc.org/article/PPR/PPR668921
  snippet: Here we show that CARD-like domains are present in defense systems that
    protect bacteria against phage.
  notes: The Wein et al. abstract supports CARD-like-domain systems as bacterial phage-defense
    systems.
- reference: https://europepmc.org/article/PPR/PPR668921
  snippet: The bacterial CARD is essential for protease-mediated activation of certain
    bacterial gasdermins, which promote cell death once phage infection is recognized.
  notes: The Wein et al. abstract supports bacterial CARD-mediated protease activation
    of some bacterial gasdermins after phage recognition.
- reference: https://europepmc.org/article/PPR/PPR668921
  snippet: We further show that multiple anti-phage defense systems utilize CARD-like
    domains to activate a variety of cell death effectors.
  notes: The Wein et al. abstract states that multiple anti-phage systems use CARD-like
    domains to activate varied cell-death effectors.
- reference: https://europepmc.org/article/PPR/PPR668921
  snippet: We find that these systems are triggered by a conserved immune evasion
    protein that phages use to overcome the bacterial defense system RexAB, demonstrating
    that phage proteins inhibiting one defense system can activate another.
  notes: The Wein et al. abstract reports that these systems can be triggered by a
    phage immune-evasion protein.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: CARD_NLR | 10\.1101/2023\.05\.28\.542683 | CARD-like domains mediate anti-phage
    defense in bacterial gasdermin systems
  notes: The DefenseFinder article registry maps the CARD_NLR model namespace to the
    Wein et al. bacterial CARD-like domain anti-phage defense preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| CARD_NLR__CARD_Protease                          | CARD_NLR__CARD_Protease                          |
    CARD_NLR               | Custom                  | 300    |'
