discussions:
- discussion_id: gao-iet-mechanism-gap
  prompt: Resolve Gao_Iet natural hosts, IetA/IetS component functions, phage triggers,
    and effector activity before minting narrower Gao_Iet mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes that mediate protection
    against specific bacteriophages, and DefenseFinder models Gao_Iet as a two-profile
    system. The exact natural host breadth, Iet component identities, phage trigger,
    and profile-to-activity mapping remain unresolved.
  attaches_to:
