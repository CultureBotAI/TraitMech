    and final Science Tables S6/S7/S8 map it to product accession WP_001703029.1,
    a Bas19 phage readout, display name DS-31, and a PDDEXK HHpred row. The pinned
    DefenseFinder HMM inventory records one DS-31 custom profile row. The pinned rules
    table has no DS-31 row, and the first-pass record does not resolve native host
    breadth, complete phage breadth, direct profile-to-protein correspondence, PDDEXK
    activity, molecular output, or endogenous DS-31 activity.
