  description: Conservative system-level sketch linking the single-gene DS-31 locus
    to reduced bacteriophage plaquing without resolving DS-31 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-31 as the validated RED7 transcriptional unit
    with one product accession, one high-probability PDDEXK HHpred-domain row, and
