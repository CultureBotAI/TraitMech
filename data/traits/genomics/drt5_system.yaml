  snippet: We discovered that a family of uncharacterized reverse transcriptases (RTs)
    are active defense systems
  notes: Gao et al. experimentally support defense-associated reverse transcriptases
    as active antiphage systems.
- reference: DOI:10.1126/science.aba0372
  snippet: We named these genes defense-associated RTs (DRTs)
  notes: Gao et al. coined the defense-associated RT naming that underlies the DRT
    system family.
- reference: DOI:10.1126/science.aba0372
  snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA, where
    x is any amino acid] abolished activity
  notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
    active-site residues.
