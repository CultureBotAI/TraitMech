discussions:
- discussion_id: sucellos-mechanism-gap
  prompt: Resolve Sucellos phage triggers and effector outputs before minting narrower
    Sucellos mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Sucellos as a named anti-phage
    system with SclA_VCA0367 and SclB_VCA0368 profiles, but the trigger, molecular
    substrate, antiviral effector output, and subtype-specific mechanism are not resolved
    enough here to assert a narrower mechanistic child trait.
  attaches_to:
