identifier: traitmech:000405
label: PD-T7-3 system
definition: A phage defense system in which an organism possesses a PD-T7-3 locus
  represented by DefenseFinder as a single-profile model, PD-T7-3__PD-T7-3, and experimentally
  linked to protection against T2, T4, T6, T5, SECphi17, T3, and T7 when expressed
  in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T7-3
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
- synonym_text: PD-T7-3__PD-T7-3
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T7-3 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
  snippet: PD-T7-3 systems were discovered to be anti-phage systems during an experimental
    screen performed on *E. coli* strains :ref{doi=10.1038/s41564-022-01219-4}
  notes: The DefenseFinder wiki describes PD-T7-3 as a phage-defense system discovered
    in an E. coli experimental screen.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
  snippet: As far as we are aware, the molecular mechanism of PD-T7-3 is unknown.
  notes: The DefenseFinder wiki records the PD-T7-3 molecular mechanism as unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
  snippet: 'The PD-T7-3 is composed of 1 protein: PD-T7-3.'
  notes: The DefenseFinder wiki names PD-T7-3 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-3.md
  snippet: 'The PD-T7-3 system in *Paraglaciecola psychrophila* (GCF_000347635.1,
    NC_020514) is composed of 1 protein: PD-T7-3 (WP_007636449.1)'
  notes: The DefenseFinder wiki illustrates a predicted one-protein PD-T7-3 locus
    in RefSeq assembly GCF_000347635.1 on NC_020514.
