identifier: traitmech:000487
label: VP1817 system
definition: A phage defense system in which an organism possesses a VP1817-family
  locus represented by the DefenseFinder VP1817__VP1817 custom HMM profile and experimentally
  linked to reduced bacteriophage plaquing when the cloned Vibrio parahaemolyticus
  RIMD 2210633 vp1817 cassette is expressed from a VSV105 plasmid.
