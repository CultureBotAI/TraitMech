identifier: traitmech:000476
label: PD-T2-1 system
definition: A phage defense system in which an organism possesses a two-gene PD-T2-1
  operon whose expression was experimentally linked to protection against T2, T6,
  Bas18, T4, and T5 phages.
definition_source: DOI:10.1038/s41564-025-02239-6
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T2-1
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: PD-T2–1
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41564-025-02239-6
