discussions:
- discussion_id: pd-t2-1-mechanism-and-model-coverage-gap
  prompt: Resolve the PD-T2-1 direct sensor, effector output, native host breadth,
    and DefenseFinder HMM/rules model coverage before minting narrower PD-T2-1 mechanism
    or protein-component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The final Goedecke et al. article supports PD-T2-1 as a two-gene operon
    activated by multiple phage tail-fiber proteins, links heterologous expression
    to protection against T2, T6, Bas18, T4, and T5, and argues that the system is
    not a canonical toxin-antitoxin system. The pinned DefenseFinder article registry
    names PD-T2-1 and maps it to the Goedecke et al. preprint, but the pinned HMM
    inventory and rules table do not contain PD-T2-1 rows, leaving profile coverage
    and detection criteria unresolved.
  evidence:
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
    snippet: Transformation efficiency assays revealed that PD-T2–1 also selectively
      inhibited bacterial growth when T2 gp37, T2 gp34, and T2 gp12 were co-expressed
    notes: PD-T2-1 responded to multiple T2 tail-fiber proteins in transformation-efficiency
      assays.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
    snippet: These results indicate PD-T2–1 does not function as a canonical toxin-antitoxin
      system.
    notes: The PD-T2-1A/PD-T2-1B single-gene assays argue against a canonical toxin-antitoxin
      mechanism.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
    snippet: PD-T2-1 | 10\.1101/2025\.07\.02\.662641 | Identifying phage proteins
      that activate the bacterial innate immune system
    notes: The pinned DefenseFinder article registry maps the named PD-T2-1 system
      to the Goedecke et al. preprint.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    notes: No PD-T2-1 or PD-T2-1-prefixed HMM inventory row was present in the pinned
      DefenseFinder model file.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    notes: No PD-T2-1 rule row was present in the pinned DefenseFinder rules table.
