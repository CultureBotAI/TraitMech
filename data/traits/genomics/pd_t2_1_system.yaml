  synonym_type: RELATED_SYNONYM
  source: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
evidence:
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: Two phage proteins were further investigated, revealing T7 gp17 and additional
    tail fiber proteins activated the undescribed antiphage system PD-T2–1 and identifying
    λ gpE major capsid protein activated the antiphage system Avs8.
  notes: Goedecke et al. report that T7 gp17 and additional tail fiber proteins activated
    the previously undescribed PD-T2-1 antiphage system.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: Sequencing the transposon insertion site of mutants that did grow revealed
    28 out of 48 mutants contained transposons that disrupted a two-gene operon of
    unknown function
  notes: ECOR03 transposon mutants that escaped T7 gp17-mediated growth inhibition
    were enriched for insertions disrupting the same unknown two-gene operon.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: Operon structure of phage defense against T2 system 1 (PD-T2–1). Transposon
    insertions identified in mutant ECOR03 expressing T7 gp17 are indicated with triangles.
    A predicted transmembrane domain (TM) for PD-T2–1A, accession numbers, and the
    length of each protein in amino acids (aa) are shown.
  notes: The PD-T2-1 operon figure identifies transposon insertions, the predicted
    transmembrane domain in PD-T2-1A, and the protein accessions used in the study.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: GeneAB conferred >100-fold protection against phages T2, T6, and Bas18,
    and approximately 10-fold protection against phages T4 and T5
  notes: Expression of the operon in MG1655 protected against T2, T6, Bas18, T4, and
    T5 in phage-challenge assays.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: These findings led us to rename the geneAB operon phage defense against
    T2 system 1 (PD-T2–1)
  notes: Goedecke et al. renamed the placeholder geneAB operon phage defense against
    T2 system 1.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: Transformation efficiency assays revealed that PD-T2–1 also selectively
    inhibited bacterial growth when T2 gp37, T2 gp34, and T2 gp12 were co-expressed
  notes: PD-T2-1 also selectively inhibited growth when the T2 tail-fiber genes gp37,
    gp34, and gp12 were expressed.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: These results indicate PD-T2–1 does not function as a canonical toxin-antitoxin
    system.
  notes: Single-gene expression experiments argue against PD-T2-1 as a canonical toxin-antitoxin
    system.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: 'ECOR03 PD-T2–1A: RCR47252.1; WP_075861856.1'
  notes: The Methods section reports the ECOR03 PD-T2-1A RefSeq and nonredundant protein
    accessions used in the article.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12875140/
  snippet: 'Nucleotide coordinates for PD-T2–1 in ECOR03 (accession QOWO01000016):
    10,064–11,256'
  notes: The extended-data figure caption places the ECOR03 PD-T2-1 locus on nucleotide
    record QOWO01000016.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: PD-T2-1 | 10\.1101/2025\.07\.02\.662641 | Identifying phage proteins that
    activate the bacterial innate immune system
  notes: The pinned DefenseFinder article registry maps the named PD-T2-1 system to
    the Goedecke et al. preprint.
