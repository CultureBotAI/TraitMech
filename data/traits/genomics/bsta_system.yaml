identifier: traitmech:000301
label: BstA system
definition: An abortive infection system in which an organism possesses a BstA-family
  phage-defense locus whose encoded BstA protein can suppress lytic phage DNA replication
  and whose cognate anti-BstA aba element can self-immunize the encoding prophage
  from BstA activity.
definition_source: DOI:10.1016/j.chom.2021.09.002
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: BstA
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: we identify BstA, a family of prophage-encoded phage-defense proteins in
    diverse Gram-negative bacteria
  notes: Owen et al. name BstA as a family of prophage-encoded phage-defense proteins.
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: the BstA protein confers effective population-level defense against exogenous
    phage infection via abortive infection
  notes: Owen et al. support BstA as an abortive-infection phage-defense system.
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: demonstrating that the BstA protein mediates defense against phage P22
  notes: Owen et al. show that phage resistance against P22 is BstA-protein dependent.
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: BstA provides phage defense at the population level and prevents the spread
    of phage epidemics
  notes: Owen et al. connect BstA activity to suppression of phage epidemics at population
    level.
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: phage DNA replication is strongly suppressed by BstA, but replication can
    be rescued by the aba element
  notes: Owen et al. support the direct phage-DNA-replication output of BstA and suppression
    by the cognate aba self-immunity element.
- reference: DOI:10.1016/j.chom.2021.09.002
  snippet: each bstA locus contains a cognate aba element that is inactive against
    variant BstA proteins
  notes: Owen et al. show that aba self-immunity is cognate to its co-encoded BstA
    variant.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: BstA | 10\.1101/2020\.07\.13\.199331 | Prophage-encoded phage defense proteins
    with cognate self-immunity
  notes: The DefenseFinder article registry maps the named BstA system to the Owen
    et al. BstA preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: BstA__BstA                                       | BstA__BstA                                       |
    BstA
  notes: The DefenseFinder HMM inventory records a BstA profile for BstA__BstA in
    the BstA model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "BstA\tBstA\t1\t1\tBstA__BstA"
  notes: The DefenseFinder rules table models BstA as a one-component system requiring
    the BstA__BstA profile.
canonical_examples:
- taxon_id: NCBITaxon:568708
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium str. D23580
  note: Owen et al. studied BstA in the BTP1 prophage of Salmonella enterica serovar
    Typhimurium ST313 strain D23580 and showed that BstA mediates defense against
    Salmonella phage P22.
  reference: DOI:10.1016/j.chom.2021.09.002
causal_graphs:
- graph_id: bsta_locus_suppresses_phage_dna_replication
  title: BstA loci suppress lytic phage DNA replication through abortive infection
  description: Conservative system-level sketch linking possession of a BstA phage-defense
    locus to suppressed lytic phage DNA replication and the BstA system trait without
    asserting the unresolved direct phage trigger, BstA molecular target, or mechanism
    of aba-mediated self-immunity.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures BstA as a named abortive-infection system with a
    DefenseFinder BstA profile while leaving the direct trigger of BstA localization,
    the direct DNA replication target, the physical form of the BstA-aba interaction,
    and the molecular basis for cognate aba specificity unresolved.
