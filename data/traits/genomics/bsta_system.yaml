discussions:
- discussion_id: bsta-mechanism-gap
  prompt: Resolve the direct phage trigger of BstA localization, the direct DNA-replication
    target, the physical BstA-aba interaction, and the basis of cognate aba specificity
    before minting narrower BstA-aba mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Owen et al. and DefenseFinder support BstA as a named abortive-infection
    system with a BstA HMM profile and a cognate aba self-immunity element, but the
    direct phage trigger that recruits BstA to phage DNA, the precise target by which
    BstA suppresses lytic phage DNA replication, the physical interaction between
    aba DNA and BstA, and the molecular basis of BstA-aba specificity remain unresolved.
  attaches_to:
  - causal_graphs#bsta_locus_suppresses_phage_dna_replication
