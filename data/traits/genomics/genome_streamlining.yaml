identifier: traitmech:000099
label: genome streamlining
definition: A genomics trait describing selective reduction of genome size and gene
  content in free-living microbes with very large effective population sizes, minimizing
  the cellular cost of replication and biosynthesis.
definition_source: DOI:10.1038/ismej.2014.60
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: streamlined genome
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/ismej.2014.60
evidence:
- reference: DOI:10.1038/ismej.2014.60
  notes: Giovannoni et al. set out streamlining theory, explaining small streamlined
    genomes of abundant oligotrophic microbes.
- reference: DOI:10.1038/nrmicro3331
  notes: Batut et al. compare reductive genome evolution at both ends of the bacterial
    population-size spectrum.
canonical_examples:
- taxon_id: NCBITaxon:1219
  taxon_label: Prochlorococcus marinus
  note: 'Paradigm of genome streamlining: the most abundant photoautotroph, with one
    of the smallest genomes of any free-living phototroph.'
  reference: PMID:12917486
causal_graphs:
- graph_id: streamlining_oligotrophic_selection
  title: Oligotrophic environments select for streamlined genomes
  scope_status: NONMECHANISTIC
  scope_notes: This genomics record is a measurement, genomic-element classification,
    or population-level descriptor rather than one taxon-specific protein mechanism;
    contextual protein nodes include source-backed UniProtKB exemplars.
  description: Evidence-backed causal sketch linking oligotrophic, high-Ne lifestyles
    to selective reduction of genome content.
  nodes:
  - node_id: streamlining_trait
    label: genome streamlining
    node_type: TRAIT
    grounding: traitmech:000099
    description: Selective reduction of genome size and gene content.
  - node_id: oligotrophic_environment
    label: oligotrophic environment
    node_type: ENVIRONMENTAL_FACTOR
    description: Low-nutrient habitat supporting large free-living populations.
  - node_id: reductive_genome_evolution
    label: reductive genome evolution
    node_type: BIOLOGICAL_PROCESS
    description: Selective and drift-driven loss of genomic content.
    grounding: METPO:1007721
  - node_id: smaller_microbial_genome
    label: smaller microbial genome size
    node_type: QUALITY
    description: Reduced genome size in free-living microbes.
  - node_id: depletion_metabolic_genes
    label: depletion of metabolic genes
    node_type: QUALITY
    description: 'Generalizable signature: loss of metabolic gene content in streamlined
      genomes.'
  - node_id: metabolic_cross_feeding
    label: metabolic cross-feeding
    node_type: BIOLOGICAL_PROCESS
    description: Community-level exchange of metabolites among auxotrophic members.
  - node_id: reduced_cofactor_biosynthesis
    label: reduced cofactor/vitamin biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Loss of cofactor and vitamin biosynthetic capacity.
  - node_id: exogenous_bvitamin_dependence
    label: dependence on exogenous B-vitamin precursors
    node_type: BIOLOGICAL_PROCESS
    description: Reliance on externally supplied B1/B12 precursors and products.
  - node_id: genome_streamlining_protein_component
    label: Endonuclease GajA
    node_type: GENE_OR_PROTEIN
    description: Protein component (Endonuclease GajA) associated with genome streamlining.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Organism-specific protein component exemplified via protein_examples;
      no single non-duplicate family CURIE assigned.
    gene_symbols:
    - gajA
    protein_examples:
    - uniprot_id: UniProtKB:P0DW47
      protein_label: Endonuclease GajA
      gene_symbol: gajA
      taxon_id: NCBITaxon:1053212
      taxon_label: Bacillus cereus (strain HuB5-5)
      entry_status: REVIEWED
      retrieved_on: '2026-10-17'
      entry_version: 12
      sequence_version: 1
      role: Characteristic protein component (gajA, Endonuclease GajA) associated
        with genome streamlining in Bacillus cereus (strain HuB5-5).
      evidence:
      - reference: DOI:10.1038/s41467-024-46374-w
        snippet: genome streamlining and metabolic auxotrophies may act as joint mechanisms
        notes: Supports Endonuclease GajA in genome streamlining; UniProtKB:P0DW47
          (gajA, Endonuclease GajA) in Bacillus cereus (strain HuB5-5) provides a
          verified protein exemplar.
  edges:
  - subject: oligotrophic_environment
    predicate: selects for
    object: streamlining_trait
    description: Resource limitation and large Ne favor minimizing cellular cost via
      genome reduction.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      notes: Giovannoni et al. articulate streamlining theory for abundant oligotrophic
        microbes.
    predicate_id: METPO:2007401
  - subject: reductive_genome_evolution
    predicate: causes
    object: streamlining_trait
    description: Reductive evolution is the population-genetic process realizing the
      streamlined-genome phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro3331
      notes: Batut et al. compare reductive genome evolution across the bacterial
        population-size spectrum.
    predicate_id: biolink:causes
  - subject: oligotrophic_environment
    predicate: selects for
    object: smaller_microbial_genome
    description: Resource-poor oligotrophic waters select for smaller microbial genomes
      across free-living marine microbes.
    evidence:
    - reference: DOI:10.1038/s41467-023-36988-x
      notes: 'Ngugi 2023: "small microbial genomes in the resource-poor photic ocean";
        broad comparative support across 364 marine metagenomes.'
    predicate_id: METPO:2007401
  - subject: streamlining_trait
    predicate: associated with
    object: depletion_metabolic_genes
    description: Streamlined genomes show a generalizable depletion of metabolic genes.
    evidence:
    - reference: DOI:10.1038/s41467-024-50368-z
      notes: 'Dong 2024: "reduced genome sizes associated with a depletion of metabolic
        genes"; generalizable signature of streamlined genomes under stress.'
    predicate_id: biolink:associated_with
  - subject: streamlining_trait
    predicate: promotes
    object: metabolic_cross_feeding
    description: Streamlining and resulting auxotrophies promote metabolic cross-feeding
      in bacterioplankton communities.
    evidence:
    - reference: DOI:10.1038/s41467-024-46374-w
      notes: 'Giordano 2024: "genome streamlining and metabolic auxotrophies as central
        joint mechanisms shaping bacterioplankton community assembly".'
    predicate_id: RO:0002213
  - subject: reduced_cofactor_biosynthesis
    predicate: increases dependence on
    object: exogenous_bvitamin_dependence
    description: Loss of cofactor/vitamin biosynthesis increases reliance on exogenous
      B-vitamin precursors and products.
    evidence:
    - reference: DOI:10.1038/s41467-024-46374-w
      notes: 'Giordano 2024: "reliance ... on exogenous B1 and B12 precursors/products";
        Black Queen-like public-goods dependency.'
  - subject: streamlining_trait
    predicate: associated with
    object: exogenous_bvitamin_dependence
    description: Community metabolic modelling associates genome streamlining and
      auxotrophy with predicted exchange of B vitamins; this is a model-supported
      association, not a universal causal consequence of streamlining.
    evidence:
    - reference: DOI:10.1038/s41467-024-46374-w
      snippet: genome streamlining and metabolic auxotrophies may act as joint mechanisms
      notes: The authors explicitly frame the streamlining-auxotrophy relationship
        as a model-supported possibility.
    - reference: DOI:10.1038/s41467-024-46374-w
      snippet: conserved metabolic cross-feedings, in particular of specific amino
        acids and group B vitamins
      notes: The same community models predict B-vitamin exchange among co-active
        bacterioplankton communities.
    predicate_id: biolink:associated_with
  - subject: genome_streamlining_protein_component
    predicate: contributes to
    predicate_id: RO:0002326
    object: streamlining_trait
    description: Endonuclease GajA (gajA, UniProtKB:P0DW47) contributes to genome
      streamlining.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: minimizes resources required for replication
      notes: Supports the functional association between Endonuclease GajA (UniProtKB:P0DW47
        in Bacillus cereus (strain HuB5-5)) and genome streamlining.
