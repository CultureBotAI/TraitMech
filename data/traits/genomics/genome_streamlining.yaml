  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/ismej.2014.60
evidence:
- reference: DOI:10.1038/ismej.2014.60
  notes: Giovannoni et al. set out streamlining theory, explaining small streamlined
    genomes of abundant oligotrophic microbes.
- reference: DOI:10.1038/nrmicro3331
  notes: Batut et al. compare reductive genome evolution at both ends of the bacterial
    population-size spectrum.
