discussions:
- discussion_id: borvo-mechanism-gap
  prompt: Resolve Borvo phage triggers and effector outputs before minting narrower
    Borvo mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Borvo as a named anti-phage
    system with BovA profiles, but the trigger, molecular substrate, antiviral effector
    output, and subtype-specific mechanism are not resolved enough here to assert
    a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#borvo_locus_restricts_phage
  posed_by: codex
  posed_date: '2026-09-18'
