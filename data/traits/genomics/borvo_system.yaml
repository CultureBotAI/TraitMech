evidence:
- reference: DOI:10.1016/j.chom.2022.09.017
  snippet: discovery of 21 defense systems that protect bacteria from phages, based
    on computational genomic analyses and phage-infection experiments
  notes: Millman et al. report the computational and experimental cohort that DefenseFinder
    cites for Borvo as a bacterial anti-phage system.
- reference: DOI:10.1101/2022.05.11.491447
