identifier: traitmech:000249
label: Borvo system
definition: A phage defense system in which an organism possesses a Borvo locus represented
  by BovA profiles that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2022.09.017
trait_category: GENOMICS
term_kind: CLASS
