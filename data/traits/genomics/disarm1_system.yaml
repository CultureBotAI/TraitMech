discussions:
- discussion_id: disarm1-profile-activity-gap
  prompt: Resolve DISARM1 effector chemistry, exact native hosts, sensitive-phage
    breadth, shared-core component roles, and DISARM_1 profile-to-activity criteria
    before minting DISARM1 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Ofir et al. support DISARM as a broad antiphage-system family, and the
    pinned DefenseFinder HMM inventory and rules table support DISARM_1 as a subtype
    with drmD, drmMI, drmA, drmB, and drmC profiles. This first-pass record leaves
    exact DISARM1 effector chemistry, native host breadth, sensitive-phage breadth,
    shared-core component roles, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1038/s41564-017-0051-0
    snippet: Our results establish DISARM as a new defence system, providing protection
      against diverse phages
    notes: Ofir et al. experimentally established DISARM as a broad-spectrum phage
      defense system.
