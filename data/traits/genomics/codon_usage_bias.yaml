identifier: traitmech:000096
label: codon usage bias
definition: A genome-sequence property describing non-uniform usage of synonymous
  codons across a genome, shaped by mutational bias and translational selection and
  correlated with gene expression level.
definition_source: DOI:10.1038/nrg2899
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: codon bias
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrg2899
evidence:
- reference: DOI:10.1038/nrg2899
  notes: Plotkin & Kudla review the causes and consequences of synonymous codon bias.
- reference: DOI:10.1146/annurev.genet.42.110807.091442
  notes: Hershberg & Petrov review selection on codon bias across genomes.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Reference organism for codon usage bias (translational selection on synonymous
    codons in highly expressed genes).
  reference: PMID:6175758
causal_graphs:
- graph_id: codon_bias_translation_efficiency
  title: Codon usage bias shapes translation efficiency and gene expression
  scope_status: NONMECHANISTIC
  scope_notes: This genomics record is a measurement, genomic-element classification,
    or population-level descriptor rather than one taxon-specific protein mechanism;
    contextual protein nodes do not receive token UniProt examples.
  description: Evidence-backed causal sketch linking biased synonymous-codon usage
    to translation rates and gene expression level.
  nodes:
  - node_id: codon_bias_trait
    label: codon usage bias
    node_type: TRAIT
    grounding: traitmech:000096
    description: Non-uniform use of synonymous codons across a genome.
  - node_id: translation
    label: translation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006412
    description: Ribosome-mediated decoding of mRNA into protein.
  - node_id: gene_expression_level
    label: gene expression level
    node_type: QUALITY
    description: Steady-state protein output per gene.
  - node_id: trna_abundance
    label: tRNA abundance
    node_type: QUALITY
    description: Cellular pool / gene copy number of tRNAs available for decoding
      codons.
  - node_id: mrna_5prime_secondary_structure
    label: 5' mRNA secondary structure
    node_type: QUALITY
    description: Strength of RNA folding near the translation start site.
  - node_id: translation_initiation
    label: translation initiation
    node_type: BIOLOGICAL_PROCESS
    description: Ribosome assembly and start-codon recognition that begins protein
      synthesis.
    grounding: GO:0006413
  edges:
  - subject: codon_bias_trait
    predicate: regulates
    object: translation
    description: Biased codon usage tunes elongation rate via tRNA availability.
    evidence:
    - reference: DOI:10.1038/nrg2899
      notes: Plotkin & Kudla review how synonymous codon bias modulates translation.
    predicate_id: RO:0002211
  - subject: codon_bias_trait
    predicate: associated with
    object: gene_expression_level
    description: Codon bias is strongest in highly expressed genes.
    evidence:
    - reference: DOI:10.1146/annurev.genet.42.110807.091442
      notes: Hershberg & Petrov review translational selection on codon bias correlating
        with expression level.
    predicate_id: biolink:associated_with
  - subject: gene_expression_level
    predicate: strengthens selection for
    object: codon_bias_trait
    description: Selection on synonymous codons scales with protein production; highly
      expressed genes show stronger codon preferences.
    evidence:
    - reference: DOI:10.1146/annurev.genet.42.110807.091442
      notes: 'Hershberg & Petrov: codon bias correlates most strongly with gene expression
        level.'
    - reference: DOI:10.32942/x2802v
      notes: 'Cope et al.: codon-specific selection scales with per-gene protein production
        rate (ROC-SEMPPR).'
  - subject: trna_abundance
    predicate: influences
    object: codon_bias_trait
    description: Synonymous codons decoded by more abundant tRNAs tend to be more
      adapted and often preferred.
    evidence:
    - reference: DOI:10.1038/nrg2899
      notes: Plotkin & Kudla define tAI from relative tRNA gene copy numbers; the
        more abundant the decoding tRNA, the more adapted the codon.
  - subject: mrna_5prime_secondary_structure
    predicate: inhibits
    object: translation_initiation
    description: Start-region RNA folding can limit ribosome access and dominate expression
      effects of synonymous codons.
    evidence:
    - reference: DOI:10.1038/nrg2899
      notes: 'Plotkin & Kudla: 5'' structure generally disadvantageous; GFP expression
        in E. coli strongly inhibited when 5'' folding energy below ~-10 kcal/mol
        (RBS/SD/start-codon occlusion).'
    predicate_id: RO:0002212
  - subject: translation_initiation
    predicate: part of
    object: translation
    description: Initiation is the first stage of translation.
    evidence:
    - reference: DOI:10.1038/nrg2899
      notes: Plotkin & Kudla discuss translation initiation as a major mechanism linking
        5' sequence features to expression.
    predicate_id: biolink:part_of
