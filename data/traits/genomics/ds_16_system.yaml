discussions:
- discussion_id: ds-16-defensefinder-model-gap
  prompt: Resolve DS-16 native host breadth, exact profile-to-protein mapping, DS-16A/DS-16B
    component activities, RelE and ABC ATPase chemistry, sensitive-phage breadth,
    molecular output, and rule-level DefenseFinder criteria before minting narrower
    DS-16 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-16 as the defensive PLIK transcriptional unit
    and final Science Tables S6/S7/S8 map it to product accessions WP_001676492.1
    and WP_001676491.1, Bas26 and T4 phage readouts, display name DS-16, and RelE/ABC
    ATPase HHpred rows. The pinned DefenseFinder HMM inventory records DS-16A and
    DS-16B custom profile rows. The pinned rules table has no DS-16 row, and the first-pass
    record does not resolve native host breadth, phage breadth, direct profile-to-protein
    correspondence, RelE nuclease or ABC ATPase activity, molecular output, or endogenous
    DS-16 activity.
