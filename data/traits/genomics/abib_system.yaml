identifier: traitmech:000319
label: AbiB system
definition: An abortive infection system in which an organism possesses an abiB-family
  locus represented by the DefenseFinder AbiB__AbiB profile and exemplified by the
  Lactococcus lactis IL1403 determinant whose AbiB activity blocks sensitive bIL170
  phage growth and promotes rapid degradation of sensitive phage transcripts after
  infection.
definition_source: DOI:10.1046/j.1365-2958.1996.371896.x
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiB
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1046/j.1365-2958.1996.371896.x
evidence:
- reference: PMID:8825768
  snippet: The abortive infection determinant AbiB prevents growth of the sensitive
    phage bIL170, but not of the resistant phage bIL41, on Lactococcus lactis strain
    IL1403
  notes: Parreira et al. place AbiB in the abortive-infection class and show that
    it blocks the sensitive lactococcal phage bIL170 on Lactococcus lactis IL1403.
- reference: PMID:8825768
  snippet: AbiB promotes a dramatic degradation of sensitive phage transcripts, starting
    10-15 min after infection
  notes: Parreira et al. connect AbiB activity to rapid decay of transcripts from
    sensitive phages after infection.
- reference: PMID:8825768
  snippet: The decay of the transcripts is the probable cause of the arrest of the
    sensitive phage development
  notes: Parreira et al. infer that phage transcript decay causes arrest of AbiB-sensitive
    phage development.
- reference: PMID:8825768
  snippet: Mapping of the 5' end of degradation products established that they result
    from endonucleolytic cleavage preferentially at U/U, A/U and U/A sites
  notes: Parreira et al. map AbiB-associated phage transcript decay products to preferential
    endonucleolytic cleavage sites.
- reference: PMID:8825768
  snippet: an early product of the sensitive phage either induces the synthesis or
    stimulates the activity of an RNase in an AbiB+ cell
  notes: Parreira et al. leave the AbiB trigger and nuclease identity unresolved,
    favoring an open knowledge gap for narrower mechanism children.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiB | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiB model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiB\tAbiB\t1\t1\tAbiB__AbiB"
  notes: The DefenseFinder rules table models AbiB as a one-component system requiring
    the AbiB__AbiB profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiB__AbiB                                       | AbiB__AbiB                                       |
    AbiB                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records AbiB__AbiB under the AbiB model namespace.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Parreira et al. studied AbiB in Lactococcus lactis IL1403 and showed that
    it prevented sensitive bIL170 phage growth while promoting sensitive phage transcript
