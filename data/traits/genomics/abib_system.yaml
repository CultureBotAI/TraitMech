discussions:
- discussion_id: abib-trigger-and-rnase-gap
  prompt: Resolve the AbiB phage trigger, AbiB molecular function, and RNase effector
    before minting narrower AbiB mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Parreira et al. support AbiB as a named lactococcal abortive-infection
    determinant that prevents bIL170 growth and promotes sensitive phage transcript
    degradation. DefenseFinder represents AbiB with a one-profile rule, but this first
    system-level record leaves the phage trigger, AbiB molecular function, RNase effector
    identity, natural locus breadth, and phage escape routes unresolved.
