- graph_id: abib_locus_degrades_sensitive_phage_transcripts
  title: AbiB activity degrades sensitive lactococcal phage transcripts
  description: Conservative system-level sketch linking an abiB-family locus to AbiB
    antiphage activity, sensitive-phage transcript degradation, sensitive-phage arrest,
    and abortive-infection system possession without asserting the unresolved phage
    trigger or nuclease effector.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiB as a named DefenseFinder single-profile abortive-infection
    system whose IL1403 prototype restricts bIL170 phage by promoting rapid sensitive-phage
    transcript degradation. It leaves the direct phage trigger, AbiB molecular function,
    RNase effector identity, natural locus breadth, and phage escape routes unresolved.
