identifier: traitmech:000504
label: AbiF system
definition: An abortive infection system in which an organism possesses a plasmid
  pCG1-derived abiF locus whose single complete open reading frame encodes a phage-insensitivity
  determinant that inhibits bacteriophage phi 712 DNA replication.
definition_source: DOI:10.1128/AEM.61.12.4321-4328.1995
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: Subcloning and deletion analysis of the recombinant plasmid pCG1 defined
    a 3.7-kb EcoRV-XbaI fragment as encoding phage insensitivity
  notes: Garvey et al. localized the pNP40 AbiF determinant to the pCG1-derived EcoRV-XbaI
    fragment.
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: The introduction of a frameshift mutation at the unique BglII site within
    this ORF disrupted the phage resistance phenotype, confirming that this ORF is
    responsible for the observed phage insensitivity
  notes: Garvey et al. showed that the single complete ORF in the pCG1-derived fragment
    is required for AbiF-associated phage resistance.
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: The mechanisms encoded by pPG01 and pCG1 in L. lactis subsp. lactis MG1614
    conformed to the criteria defining abortive infection and were designated AbiE
    and AbiF, respectively
  notes: Garvey et al. designated the pCG1-encoded pNP40 phage-insensitivity determinant
    as AbiF.
- reference: DOI:10.1128/AEM.61.12.4321-4328.1995
  snippet: Analysis of the phage DNA content of phi 712-infected hosts containing
    AbiF demonstrated that it inhibited the rate of phage DNA replication
  notes: Garvey et al. measured reduced phage phi 712 DNA-replication rate in infected
    hosts carrying AbiF.
- reference: DOI:10.1093/femsre/fuag009
  snippet: 13 are two-component systems (AbiD, AbiD1, AbiD-like, AbiE, AbiF, AbiG,
    AbiL, AbiQ, AbiT, AbiV, PARIS, type I CBASS, Septu
  notes: The FEMS review counts AbiF among the confirmed two-component lactococcal
    Abi-like systems.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Garvey et al. cloned the pNP40 pCG1 AbiF determinant and showed that the pCG1-encoded
    region conferred abortive-infection phage insensitivity in Lactococcus lactis
    subsp. lactis MG1614.
  reference: DOI:10.1128/AEM.61.12.4321-4328.1995
