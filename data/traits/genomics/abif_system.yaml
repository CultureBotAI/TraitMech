discussions:
- discussion_id: abif-function-and-host-breadth-gap
  prompt: Resolve the exact AbiF protein function, phage trigger, host target, AbiD/AbiD1
    homology-derived family boundary, and natural locus breadth before minting narrower
    AbiF mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Garvey et al. support AbiF as a pCG1-encoded pNP40 determinant that conforms
    to abortive-infection criteria, depends on a single complete open reading frame,
    and inhibits the rate of phage phi 712 DNA replication; the FEMS review retains
    AbiF among confirmed two-component lactococcal Abi-like systems. This first system-level
    record therefore leaves the direct phage trigger, exact AbiF molecular activity,
    relevant host target, AbiD/AbiD1-related family boundary, natural locus breadth,
    cell-death or growth-arrest route, and phage escape routes unresolved.
  evidence:
  - reference: DOI:10.1128/AEM.61.12.4321-4328.1995
    snippet: The introduction of a frameshift mutation at the unique BglII site within
      this ORF disrupted the phage resistance phenotype, confirming that this ORF
      is responsible for the observed phage insensitivity
    notes: Garvey et al. showed that the single complete ORF in the pCG1-derived fragment
      is required for AbiF-associated phage resistance.
  - reference: DOI:10.1128/AEM.61.12.4321-4328.1995
    snippet: Analysis of the phage DNA content of phi 712-infected hosts containing
      AbiF demonstrated that it inhibited the rate of phage DNA replication
    notes: Garvey et al. measured reduced phage phi 712 DNA-replication rate in infected
      hosts carrying AbiF.
