discussions:
- discussion_id: zorya-type-i-activity-gap
  prompt: Resolve Zorya_TypeI phage triggers, native host breadth, ZorC/ZorD nuclease
    targets, ZorAB-to-ZorC/ZorD activation, and profile-to-activity criteria before
    minting enzyme, trigger, or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Hu et al. support ZorAB activation and phage-DNA degradation by type
    I Zorya ZorC/ZorD effectors, Mariano et al. support Zorya I phage protection from
    a Serratia marcescens locus, and the pinned DefenseFinder HMM inventory and rules
    table support Zorya_TypeI as a subtype whose rule row lists Zorya_TypeI__ZorC,
    Zorya_TypeI__ZorD, Zorya__ZorA, and Zorya__ZorB with 3 mandatory matches and 3
    genes required. This first-pass record leaves exact phage triggers, native hosts,
    profile-to-component correspondence, ion usage, anti-defense escape, and ZorC/ZorD
    nuclease outputs unresolved.
  evidence:
  - reference: DOI:10.1038/s41586-024-08493-8
    snippet: ZorAB transfers the phage invasion signal through the ZorA cytoplasmic
      tail to recruit and activate the soluble ZorC and ZorD effectors
    notes: Hu et al. support ZorAB-mediated recruitment and activation of the soluble
      ZorC and ZorD Type I effectors.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| Zorya_TypeI__ZorC                                | Zorya_TypeI__ZorC                                |
      Zorya_TypeI            | Custom                  | 20     |

      | Zorya_TypeI__ZorD                                | Zorya_TypeI__ZorD                                |
