  notes: Hu et al. support ZorAB-mediated recruitment and activation of the soluble
    ZorC and ZorD Type I effectors.
- reference: DOI:10.1038/s41586-024-08493-8
  snippet: soluble ZorC and ZorD effectors, which facilitate the degradation of the
