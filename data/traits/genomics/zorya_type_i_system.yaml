identifier: traitmech:000554
label: Zorya type I system
definition: A Zorya system in which an organism possesses a genome-encoded DefenseFinder
  Zorya_TypeI subtype locus whose rule row lists Zorya_TypeI__ZorC, Zorya_TypeI__ZorD,
  Zorya__ZorA, and Zorya__ZorB in its mandatory profile set with 3 mandatory matches
  and 3 genes required.
