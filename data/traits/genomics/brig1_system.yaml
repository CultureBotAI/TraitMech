  title: Brig1 excises modified T-even phage DNA
  description: Conservative system-level sketch linking a brig1-family locus to alpha-glucosyl-hmC
    base excision, abasic-site generation, inhibited T4-like phage DNA replication,
    restricted T-even phage propagation, and the Brig1 phage-defense trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Brig1 as a named DefenseFinder DNA-glycosylase phage-defense
    system whose prototype targets alpha-glucosyl-hmC nucleobases in T4 DNA and inhibits
    phage DNA replication while leaving the natural host, the source of the metagenomic
    prototype, whether all Brig1 homologues target exactly the same glucosylated nucleobase,
    and the relationship of the DefenseFinder Brig1__ADP_ribosyl profile to characterized
    Brig1 activity unresolved.
