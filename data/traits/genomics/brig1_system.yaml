causal_graphs:
- graph_id: brig1_locus_restricts_t_even_phages
  title: Brig1 loci restrict T-even phage propagation
  description: Conservative locus-level sketch linking a brig1-family DefenseFinder
    locus to halted T4-like phage replication, restricted T-even phage propagation,
    and the Brig1 phage-defense-system trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Brig1 as a named DefenseFinder DNA-glycosylase phage-defense
    system at locus level and deliberately defers a protein-resolved glycosylase mechanism.
    Hallinan et al. characterized the prototype Brig1 DNA glycosylase, alpha-glucosyl-hmC
    base excision, and abasic-site generation, but the natural host, accession-level
    Brig1-family proteins, broader substrate specificity, and the relationship of
    the DefenseFinder Brig1__ADP_ribosyl profile to characterized Brig1 activity remain
    unresolved.
