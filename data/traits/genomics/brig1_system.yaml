identifier: traitmech:000307
label: Brig1 system
definition: A phage defense system in which an organism possesses a brig1-family locus
  whose encoded DNA glycosylase can excise alpha-glucosyl-hydroxymethylcytosine nucleobases
  from T-even bacteriophage DNA, generate abasic sites, and inhibit viral DNA replication.
definition_source: DOI:10.1038/s41586-024-07329-9
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Brig1
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-024-07329-9
- synonym_text: bacteriophage replication inhibition DNA glycosylase 1
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-024-07329-9
evidence:
- reference: DOI:10.1038/s41586-024-07329-9
  snippet: Following this approach, we identified Brig1, a DNA glycosylase that excises
    α-glucosyl-hydroxymethylcytosine nucleobases from the bacteriophage T4 genome
    to generate abasic sites and inhibit viral replication
  notes: Hallinan et al. identify Brig1 as a phage DNA-targeting DNA glycosylase.
- reference: DOI:10.1038/s41586-024-07329-9
  snippet: Brig1 homologues that provide immunity against T-even phages are present
    in multiple phage defence loci across distinct clades of bacteria
  notes: Hallinan et al. support modelling Brig1 as a bacterial phage-defence locus
    family rather than as one cloned environmental DNA insert.
- reference: DOI:10.1038/s41586-024-07329-9
  snippet: This result demonstrates that gene c not only inhibits T4 DNA replication
    but also causes a slight and gradual depletion of the phage DNA within the infected
    population
  notes: Hallinan et al. connect the gene later named brig1 to inhibited T4 DNA replication
    in infected cells.
- reference: DOI:10.1038/s41586-024-07329-9
  snippet: Together, these data demonstrate that Brig1 targets α-glucosylated hmC
    nucleobases in the viral DNA to provide defence against T4
  notes: Hallinan et al. show that Brig1 defense is specific to alpha-glucosylated
    hydroxymethylcytosine in phage DNA.
- reference: DOI:10.1038/s41586-024-07329-9
  snippet: Together, these results demonstrate that Brig1 is a DNA glycosylase that
    excises α-glucosyl-hmC nucleobases from ssDNA to generate abasic sites
  notes: Hallinan et al. directly verify that Brig1 DNA glycosylase activity creates
    abasic sites on alpha-glucosyl-hmC-containing substrates.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Brig1 | 10\.1038/s41586-024-07329-9 | DNA glycosylases provide antiviral
    defence in prokaryotes
  notes: The DefenseFinder article registry maps the named Brig1 model namespace to
    the Hallinan et al. Brig1 DNA-glycosylase paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Brig1__Brig1                                     |                                                  |
