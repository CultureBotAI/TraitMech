discussions:
- discussion_id: brig1-natural-host-and-profile-gap
  prompt: Resolve natural Brig1 host taxa, broader Brig1-family specificity, and the
    Brig1__ADP_ribosyl DefenseFinder profile before minting narrower Brig1 children
    or adding canonical examples.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Hallinan et al. functionally isolated the first brig1 gene from a soil
    metagenomic fragment rather than a sequenced natural isolate, and they showed
    that experimentally tested Brig1 homologues can protect against T-even phages.
    The first TraitRecord therefore covers Brig1-family antiphage DNA-glycosylase-system
    possession while leaving natural host exemplars, the full sequence-level system
    architecture, and the relationship between the DefenseFinder Brig1__Brig1 and
    Brig1__ADP_ribosyl profiles to separate subtype review.
  evidence:
  - reference: DOI:10.1038/s41586-024-07329-9
    snippet: To uncover novel anti-phage defence systems present in unsequenced bacterial
      genomes, we screened an eDNA library generated in an earlier study
    notes: Hallinan et al. functionally isolated the first Brig1 source fragment from
      an environmental DNA library rather than a named natural organism.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| Brig1__ADP_ribosyl                               |                                                  |
      Brig1                  | Custom                  | 20     |'
    notes: The DefenseFinder HMM inventory records Brig1__ADP_ribosyl under the Brig1
      model namespace.
  attaches_to:
  - causal_graphs#brig1_excises_modified_t_even_phage_dna
