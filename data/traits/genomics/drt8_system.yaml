discussions:
- discussion_id: drt8-profile-activity-gap
  prompt: Resolve the DRT8 reverse-transcriptase product, direct phage trigger, host
    breadth, DRT8__DRT8b accessory role, and DRT8__DRT8a HMM-row status before minting
    DRT8 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated reverse transcriptases as a broad
    antiphage-system family, and the pinned DefenseFinder HMM inventory and rules
    table support DRT8 as a DRT subsystem with a mandatory DRT8__DRT8 profile and
    an accessory DRT8__DRT8b profile. This first-pass record leaves the exact DRT8
    RT product, phage trigger, host breadth, DRT8__DRT8b accessory role, and DRT8__DRT8a
    inventory-row status unresolved.
  evidence:
  - reference: DOI:10.1126/science.aba0372
    snippet: We discovered that a family of uncharacterized reverse transcriptases
      (RTs) are active defense systems
    notes: Gao et al. experimentally support defense-associated reverse transcriptases
      as active antiphage systems.
