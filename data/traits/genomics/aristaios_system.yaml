identifier: traitmech:000313
label: Aristaios system
definition: A phage defense system in which an organism possesses an Aristaios locus
  that can restrict bacteriophage infection.
definition_source: DOI:10.1093/nar/gkae671
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Aristaios
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkae671
evidence:
- reference: DOI:10.1093/nar/gkae671
  snippet: These systems were named after cheese, cattle or fermentation related deities
    (Rhea, Aristaios, Kamadhenu, Fliodhais, Audmula, Rugutis and Hesat)
  notes: Grafakou et al. named Aristaios among seven not previously described lactococcal
    antiphage systems.
- reference: DOI:10.1128/aem.01120-24
  snippet: Recently, three plasmid-encoded lactococcal antiphage systems, named Rhea,
    Aristaios, and Kamadhenu, were discovered. These systems were found to confer
    high levels of resistance against various Skunavirus members.
  notes: Grafakou et al. later characterized Aristaios as one of three plasmid-encoded
    lactococcal antiphage systems conferring strong resistance against Skunavirus
    members.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Aristaios | 10\.1093/nar/gkae671 | Discovery of antiphage systems in the
    lactococcal plasmidome
  notes: The DefenseFinder article registry maps the named Aristaios system to the
    Grafakou et al. lactococcal antiphage-system discovery paper.
