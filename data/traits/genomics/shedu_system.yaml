discussions:
- discussion_id: shedu-sensor-and-substrate-gap
  prompt: Resolve Shedu sensor classes and DNA substrate preferences before minting
    narrower Shedu subtype or mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Loeff et al. support free-DNA-end recognition and end-directed DNA nicking
    by SduA, and Gu et al. support a common Shedu nuclease core regulated by diverse
    N-terminal domains, but Shedu homologs need separate review before TraitMech asserts
    one universal N-terminal sensor class, activating DNA substrate, overhang preference,
    phage target, or escape strategy.
  posed_by: codex
  posed_date: '2026-09-15'
