identifier: traitmech:000220
label: Shedu system
definition: A genomics trait describing possession of a Shedu antiphage defense system
  encoding a single-protein immune nuclease with a conserved nuclease core and regulated
  sensor domain architecture.
definition_source: DOI:10.1016/j.cell.2024.11.030
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Shedu anti-phage defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2024.11.030
evidence:
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: Shedu is a single-component defense system comprising a putative nuclease
    SduA
  notes: Loeff et al. support Shedu as a named, single-component antiphage defense
    system centered on SduA.
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: End binding positions the DNA over the PD-(D/E)XK nuclease domain, resulting
    in dsDNA nicking at a fixed distance from the 5' end
  notes: Loeff et al. connect Shedu DNA-end recognition to positioned double-stranded
    DNA nicking.
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: The end-directed DNA nicking activity of Shedu prevents propagation of
    linear DNA
  notes: Loeff et al. support DNA-end-directed nicking as an antiviral Shedu output
    that blocks linear DNA propagation.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: Prokaryotes possess diverse anti-bacteriophage immune systems, including
    the single-protein Shedu nuclease
  notes: Gu et al. also place Shedu among prokaryotic antiphage immune systems and
    support its single-protein nuclease architecture.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: we reveal the structural basis for activation of Bacillus cereus Shedu
  notes: Gu et al. support Bacillus cereus Shedu as a structurally characterized representative.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: these data reveal Shedu as a broad family of immune nucleases with a common
    nuclease core regulated by diverse NTDs
  notes: Gu et al. support defining Shedu at the immune-nuclease family level while
    leaving N-terminal domain diversity for narrower subtype review.
canonical_examples:
- taxon_id: NCBITaxon:1396
  taxon_label: Bacillus cereus
  note: Gu et al. structurally characterized Bacillus cereus Shedu and reported that
    this nuclease cleaves near DNA ends with a 3' single-stranded overhang.
  reference: DOI:10.1016/j.molcel.2024.12.004
causal_graphs:
- graph_id: shedu_dna_end_nicking
  title: Shedu immune nucleases nick DNA ends during antiphage defense
  description: Evidence-backed process sketch linking a Shedu locus to SduA-like sensor-dependent
    nuclease activation, DNA-end nicking, and inhibition of bacteriophage DNA propagation.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures SduA/Shedu immune-nuclease outputs without asserting
    one universal N-terminal sensor class, DNA-end substrate, overhang preference,
    phage target, activation signal, escape strategy, or Bacillus-specific mechanism
    across all Shedu homologs.
  nodes:
  - node_id: shedu_locus
    label: Shedu locus
    node_type: GENETIC_ELEMENT
    description: A Shedu antiphage defense locus encoding a single-protein SduA-like
      immune nuclease.
  - node_id: sdua_immune_nuclease
    label: SduA immune nuclease
    node_type: GENE_OR_PROTEIN
    description: The single-protein Shedu immune nuclease, comprising a conserved
      nuclease core and an N-terminal regulatory/sensor domain.
    gene_symbols:
    - sduA
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: 'No family-level term covers SduA. A bounded search of all InterPro
      member databases and of GO via OLS4 for ''Shedu'' on 2026-10-08 returned only
      two domain entries plus their InterPro integrations: IPR025359 (Shedu protein
      SduA, C-terminal; Pfam PF14082, whose InterPro name history is DUF4263 then
      SduA_C) and IPR048396 (Shedu protein SduA, N-terminal; Pfam PF21407). Neither
      denotes the whole protein: InterPro reports PF14082 in 1304 UniProt proteins
      across 2464 taxa with 18 domain architectures, so grounding this whole-protein
      node to the C-terminal domain would sweep in carriers whose partner domains
      differ from SduA''s. UniProt lists no NCBIfam cross-reference for B7HFR2, and
      OLS4 returns no GO term for Shedu. The node therefore stays reviewed label-only
      rather than taking a domain term as a family grounding.'
    protein_examples:
    - uniprot_id: UniProtKB:B7HFR2
      protein_label: Shedu protein SduA
      gene_symbol: sduA
      taxon_id: NCBITaxon:405532
      taxon_label: Bacillus cereus (strain B4264)
      entry_status: REVIEWED
      retrieved_on: '2026-10-08'
      entry_version: 58
      sequence_version: 1
      role: Bacillus cereus B4264 SduA switches between inactive and active states
        through conformational changes affecting active-site architecture, which Gu
        et al. report are controlled by its N-terminal domain. UniProt annotates this
        entry as the only component of its Shedu system; the attached snippets do
        not establish that single-component architecture.
      evidence:
      - reference: DOI:10.1016/j.molcel.2024.12.004
        snippet: we reveal the structural basis for activation of Bacillus cereus
          Shedu
        notes: Gu et al. determined cryo-EM structures of Bacillus cereus Shedu; PDBe
          maps their entries 8TI8, 8TI9 and 8TIA to UniProtKB:B7HFR2 (Bacillus cereus
          B4264), so the structurally characterized protein is this accession. Snippet
          verified verbatim in the Europe PMC abstract of PMID:39742666.
      - reference: DOI:10.1016/j.molcel.2024.12.004
        snippet: Two cryoelectron microscopy structures of Shedu show that it switches
          between inactive and active states through conformational changes affecting
          active-site architecture, which are controlled by the protein's N-terminal
          domain (NTD)
        notes: Gu et al. establish the N-terminal domain as the regulator of the nuclease
          active site in this B. cereus protein. The role statement is scoped to the
          tested protein; the paper's survey of 79 N-terminal domain types is explicitly
          about homologs, not about this accession. Snippet verified verbatim in the
          Europe PMC abstract of PMID:39742666.
