identifier: traitmech:000220
label: Shedu system
definition: A genomics trait describing possession of a Shedu antiphage defense system
  encoding a single-protein immune nuclease with a conserved nuclease core and regulated
  sensor domain architecture.
definition_source: DOI:10.1016/j.cell.2024.11.030
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Shedu anti-phage defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2024.11.030
evidence:
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: Shedu is a single-component defense system comprising a putative nuclease
    SduA
  notes: Loeff et al. support Shedu as a named, single-component antiphage defense
    system centered on SduA.
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: End binding positions the DNA over the PD-(D/E)XK nuclease domain, resulting
    in dsDNA nicking at a fixed distance from the 5' end
  notes: Loeff et al. connect Shedu DNA-end recognition to positioned double-stranded
    DNA nicking.
- reference: DOI:10.1016/j.cell.2024.11.030
  snippet: The end-directed DNA nicking activity of Shedu prevents propagation of
    linear DNA
  notes: Loeff et al. support DNA-end-directed nicking as an antiviral Shedu output
    that blocks linear DNA propagation.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: Prokaryotes possess diverse anti-bacteriophage immune systems, including
    the single-protein Shedu nuclease
  notes: Gu et al. also place Shedu among prokaryotic antiphage immune systems and
    support its single-protein nuclease architecture.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: we reveal the structural basis for activation of Bacillus cereus Shedu
  notes: Gu et al. support Bacillus cereus Shedu as a structurally characterized representative.
- reference: DOI:10.1016/j.molcel.2024.12.004
  snippet: these data reveal Shedu as a broad family of immune nucleases with a common
    nuclease core regulated by diverse NTDs
  notes: Gu et al. support defining Shedu at the immune-nuclease family level while
    leaving N-terminal domain diversity for narrower subtype review.
canonical_examples:
- taxon_id: NCBITaxon:1396
  taxon_label: Bacillus cereus
  note: Gu et al. structurally characterized Bacillus cereus Shedu and reported that
    this nuclease cleaves near DNA ends with a 3' single-stranded overhang.
  reference: DOI:10.1016/j.molcel.2024.12.004
causal_graphs:
- graph_id: shedu_dna_end_nicking
  title: Shedu immune nucleases nick DNA ends during antiphage defense
  description: Evidence-backed process sketch linking a Shedu locus to SduA-like sensor-dependent
    nuclease activation, DNA-end nicking, and inhibition of bacteriophage DNA propagation.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures SduA/Shedu immune-nuclease outputs without asserting
    one universal N-terminal sensor class, DNA-end substrate, overhang preference,
    phage target, activation signal, escape strategy, or Bacillus-specific mechanism
    across all Shedu homologs.
