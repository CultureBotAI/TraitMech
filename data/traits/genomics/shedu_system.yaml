    description: Possession of a genome-encoded Shedu antiphage defense system.
  - node_id: phage_defense_system
    label: phage defense system
    node_type: TRAIT
    grounding: traitmech:000209
    description: Possession of one or more genome-encoded immune systems that inhibit
      bacteriophage infection.
  edges:
  - subject: sdua_immune_nuclease
    predicate: contributes to
    predicate_id: RO:0002326
    object: shedu_nuclease_activation
    description: 'In Bacillus cereus SduA, the N-terminal domain controls switching
      of the nuclease core between inactive and active states. Scoped to that protein:
      the graph''s scope_notes leave the sensor class open across Shedu homologs,
      and the Loeff edge gives the N-terminal domain a DNA-end clamp role in a different
      homolog.'
    evidence:
    - reference: DOI:10.1016/j.molcel.2024.12.004
      snippet: Two cryoelectron microscopy structures of Shedu show that it switches
        between inactive and active states through conformational changes affecting
        active-site architecture, which are controlled by the protein's N-terminal
        domain (NTD)
      notes: Gu et al. support N-terminal-domain-controlled activation of the B. cereus
        Shedu nuclease active site.
  - subject: shedu_locus
    predicate: contributes to
    predicate_id: RO:0002326
    object: shedu_nuclease_activation
    description: Shedu loci encode SduA-like single-protein immune nucleases whose
