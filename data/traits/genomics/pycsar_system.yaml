discussions:
- discussion_id: pycsar-signal-and-effector-gap
  prompt: Resolve Pycsar cyclase clades, cyclic pyrimidine specificity, receptor-effector
    folds, activating phage triggers, and effector outputs before minting narrower
    Pycsar subtype children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Tal et al. support Pycsar systems as widespread PycC-containing antiphage
    systems whose phage-induced cyclic CMP or cyclic UMP second messengers activate
    immune effectors, and Hou et al. resolve a uridylate-cyclase/PycTIR branch with
    zinc-finger and cUMP-recognition determinants. The first TraitRecord therefore
    stays at the broad Pycsar-system level until separate subtype review resolves
    which cyclase clades, second messengers, receptor folds, phage triggers, and outputs
    apply across each family.
  posed_by: codex
  posed_date: '2026-09-18'
