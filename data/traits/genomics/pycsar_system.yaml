identifier: traitmech:000236
label: Pycsar system
definition: A phage defense system in which an organism possesses a Pycsar locus encoding
  a PycC pyrimidine cyclase and a cognate cyclic-pyrimidine receptor effector whose
  phage-induced cyclic CMP or cyclic UMP signaling activates antiviral effector outputs
  that inhibit bacteriophage propagation.
definition_source: DOI:10.1016/j.cell.2021.09.031
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Pyrimidine Cyclase System for Antiphage Resistance
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2021.09.031
- synonym_text: pyrimidine cyclase system for anti-phage resistance
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-024-49861-2
evidence:
- reference: DOI:10.1016/j.cell.2021.09.031
  snippet: We discovered a family of bacterial pyrimidine cyclase enzymes that specifically
    synthesize cCMP and cUMP following phage infection
  notes: Tal et al. support Pycsar-associated pyrimidine cyclases as phage-induced
    producers of cyclic CMP and cyclic UMP.
- reference: DOI:10.1016/j.cell.2021.09.031
  snippet: The cCMP and cUMP molecules then activate effector proteins
  notes: Tal et al. connect cyclic pyrimidine second messengers to activation of Pycsar
    effector proteins.
- reference: DOI:10.1016/j.cell.2021.09.031
  snippet: both operons provided substantial defense against multiple phages
  notes: Tal et al. support a canonical Escherichia coli example by showing that two
    E. coli Pycsar loci conferred antiphage defense after cloning into E. coli MG1655.
- reference: DOI:10.1016/j.cell.2021.09.031
  snippet: Mutation in the predicted active site of the cyclase domain abolished defense
  notes: Tal et al. support the functional importance of the PycC cyclase domain for
    the antiphage phenotype.
- reference: DOI:10.1038/s41467-024-49861-2
  snippet: This system consists of a pyrimidine cyclase and a cyclic pyrimidine receptor
    protein
  notes: Hou et al. support defining Pycsar systems around a pyrimidine cyclase plus
    a cognate cyclic-pyrimidine receptor rather than a bare pycC gene.
- reference: DOI:10.1038/s41467-024-49861-2
  snippet: a distinct zinc-finger motif of the uridylate cyclase is identified to
    confer substantial resistance against phage infections
  notes: Hou et al. support the uridylate-cyclase branch while the broad TraitRecord
    leaves cCMP-producing and cUMP-producing Pycsar clades unresolved as children.
- reference: DOI:10.1038/s41467-024-49861-2
  snippet: specific cUMP recognition
  notes: Hou et al. support cyclic UMP recognition by the PycTIR cyclic-pyrimidine
    receptor as one resolved Pycsar effector-activation mechanism.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Tal et al. cloned native Pycsar two-gene operons from E. coli 303145 and E.
    coli E831 into E. coli MG1655 and showed that both operons provided substantial
    defense against multiple phages.
  reference: DOI:10.1016/j.cell.2021.09.031
causal_graphs:
- graph_id: pycsar_cyclic_pyrimidine_phage_defense
  title: Pycsar loci couple cyclic-pyrimidine signaling to phage defense
  description: Evidence-backed process sketch linking a complete Pycsar locus to phage-induced
    PycC pyrimidine cyclase activity, cyclic CMP or cyclic UMP signaling, cyclic-pyrimidine
    receptor activation, antiviral effector output, and inhibition of phage propagation.
  scope_status: NONMECHANISTIC
  scope_notes: The graph stays at the Pycsar-family level and uses characterized cytidylate-cyclase
    and uridylate-cyclase examples without asserting one universal cyclase clade,
    cCMP-versus-cUMP product, PycTIR-versus-PycTM effector fold, AGS-C role, zinc-finger
    role, activating phage trigger, membrane impairment, or NAD-depletion output across
    all Pycsar antiphage loci.
