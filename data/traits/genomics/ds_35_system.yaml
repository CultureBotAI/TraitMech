discussions:
- discussion_id: ds-35-defensefinder-model-gap
  prompt: Resolve DS-35 native host breadth, exact component activity, profile-to-protein
    mapping, PDDEXK HHpred-domain interpretation, nuclease chemistry, complete phage
    breadth, molecular output, and rule-level DefenseFinder criteria before minting
    narrower DS-35 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-35 as the defensive RED5 transcriptional unit
    and final Science Tables S6/S7/S8 map it to one product accession, RB69 and T4
    phage readouts, display name DS-35, and one PDDEXK HHpred row. The pinned DefenseFinder
    HMM inventory records one DS-35 custom profile row. The pinned rules table has
    no DS-35 row, and the first-pass record does not resolve native host breadth,
    complete phage breadth, direct profile-to-protein correspondence, PDDEXK domain
    interpretation, nuclease chemistry, molecular output, or endogenous DS-35 activity.
