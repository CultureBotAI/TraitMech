    to reduced bacteriophage plaquing without resolving DS-35 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-35 as the validated RED5 transcriptional unit
    with one product accession, one high-probability PDDEXK HHpred row for WP_087906371.1
