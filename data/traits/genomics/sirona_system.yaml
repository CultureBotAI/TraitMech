discussions:
- discussion_id: sirona-mechanism-gap
  prompt: Resolve Sirona phage triggers and effector outputs before minting narrower
    Sirona mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Sirona as a named anti-phage
    system with a VCA0356 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
