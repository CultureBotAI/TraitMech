discussions:
- discussion_id: mmb_gp29_gp30-mechanism-gap
  prompt: Resolve the MMB gp29 biochemical activity, MMB gp30 regulatory role, lytic
    trigger, gp29-gp30 interaction, counter-defense specificity, and homolog breadth
    before minting narrower MMB gp29-gp30 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Dedrick et al. and DefenseFinder support MMB gp29-gp30 as a named anti-phage
    system with gp29 and gp30 profiles, but the MMB gp29 biochemical activity, direct
    gp29-gp30 interaction, triggering Tweety early lytic gene or genes, MMB-specific
    counter-defense tuning, and relationship to Squirty homologs are not resolved
    enough here to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#mmb_gp29_gp30_locus_restricts_phage
