  title: MMB gp29-gp30 loci confer heterotypic phage defense
  description: Conservative system-level sketch linking possession of an MMB gp29-gp30
    locus to restricted bacteriophage propagation without asserting the unresolved
    lytic trigger, gp29-gp30 interaction, or downstream arrest mechanism.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures MMB gp29-gp30 as a named anti-phage system with
    DefenseFinder gp29 and gp30 profiles while leaving the direct lytic trigger, MMB
    gp30 regulatory role, MMB gp29 biochemical activity, and exact downstream arrest
    mechanism unresolved.
