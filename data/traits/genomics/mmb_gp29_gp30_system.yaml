identifier: traitmech:000297
label: MMB gp29-gp30 system
definition: A phage defense system in which an organism possesses an MMB gp29-gp30
  locus that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1038/nmicrobiol.2016.251
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: MMB_gp29_gp30
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: at least five distinct prophage-expressed viral defense systems that interfere
    with infection
  notes: The PMC author manuscript for Dedrick et al. places the Cluster N MMB gp29-gp30
    system in a cohort of prophage-expressed defenses against lytic and temperate
    mycobacteriophages.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: Tweety (F1) is targeted by Xerxes, MMB, Phrann and Panchino
  notes: The PMC author manuscript for Dedrick et al. identifies Tweety as one phage
    targeted by the MichelleMyBell prophage defense profile.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: Phages MMB, Xerxes, and Pipsqueaks are closely-related in the lysis-immunity
    region (Fig. 4a) and MMB and Xerxes have almost identical patterns of defense
    against eleven individual phages
  notes: The PMC author manuscript for Dedrick et al. connects the MichelleMyBell
    and Xerxes defense spectra to their shared lysis-immunity-region context.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: we constructed a MMB mutant in which genes 29 and 30 are removed (deletions
    of individual genes appear to generate non-viable mutants; Supplementary Table
    3) and showed that prophage-mediated defense is lost
  notes: The PMC author manuscript for Dedrick et al. deletes the MMB 29-30 interval
    when testing whether gp29 and gp30 contribute to MMB defense.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: expressing MMB 29 and 30 confers the same pattern of defense as the MMB
    lysogen
  notes: The PMC author manuscript for Dedrick et al. shows that recombinant MMB genes
    29 and 30 reproduce the MMB prophage-mediated defense pattern.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: MMB 29-30 and Phrann 29-30 also confer survival to infection by a lytic
    Tweety derivative
  notes: The PMC author manuscript for Dedrick et al. shows that the MMB gp29-gp30
    system can protect bacteria from a lytic Tweety derivative in addition to wild-type
    Tweety.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: MMB_gp29_gp30 | 10\.1038/nmicrobiol\.2016\.251 | Prophage-mediated defence
    against viral attack and viral counter-defence
  notes: The DefenseFinder model registry maps the named MMB_gp29_gp30 system to the
    Dedrick et al. prophage-mediated viral-defense paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: MMB_gp29_gp30__gp29                              | MMB_gp29_gp30__gp29                              |
    MMB_gp29_gp30
  notes: The DefenseFinder HMM inventory records an MMB gp29-gp30 profile for MMB_gp29_gp30__gp29
    in the MMB_gp29_gp30 model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: MMB_gp29_gp30__gp30                              | MMB_gp29_gp30__gp30                              |
    MMB_gp29_gp30
  notes: The DefenseFinder HMM inventory records an MMB gp29-gp30 profile for MMB_gp29_gp30__gp30
    in the MMB_gp29_gp30 model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "MMB_gp29_gp30\tMMB_gp29_gp30\t2\t2\tMMB_gp29_gp30__gp29, MMB_gp29_gp30__gp30"
  notes: The DefenseFinder rules table models MMB_gp29_gp30 as a two-component system
    requiring gp29 and gp30 profiles.
