identifier: traitmech:000493
label: type II restriction-modification system
definition: A restriction-modification system in which an organism possesses a Type
  II restriction endonuclease activity paired with cognate methyltransferase self-protection,
  including conventional RM_Type_II loci represented by DefenseFinder.
definition_source: DOI:10.1093/nar/gkac1124
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
