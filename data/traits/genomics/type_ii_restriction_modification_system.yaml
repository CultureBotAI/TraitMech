evidence:
- reference: DOI:10.1093/nar/gkac1124
  snippet: The action of Type II restriction-modification (RM) systems depends on
    restriction endonuclease (REase), which cleaves foreign DNA at specific sites,
    and methyltransferase (MTase), which protects host genome from restriction by
    methylating the same sites.
  notes: Kirillov et al. describe Type II restriction-modification systems as requiring
    a restriction endonuclease that cleaves foreign DNA and a methyltransferase that
    protects host DNA by methylating the same sites.
- reference: DOI:10.1093/nar/gku447
  snippet: Type II REases are produced by prokaryotes to combat bacteriophages. With
    extreme accuracy, each recognizes a particular sequence in double-stranded DNA
    and cleaves at a fixed position within or nearby.
  notes: Pingoud et al. review Type II restriction endonucleases as prokaryotic phage-defense
    enzymes that recognize specific double-stranded DNA sequences and cleave at fixed
    positions within or near those sequences.
- reference: DOI:10.1093/nar/gku447
  snippet: REBASE (rebase.neb.com/rebase/rebase.html), the definitive source for information
    on REases and their companion proteins
  notes: Pingoud et al. point to REBASE as the source for restriction endonucleases
    and companion proteins; DefenseFinder links its RM_Type_II model namespace to
    the 2023 REBASE update.
- reference: DOI:10.1038/srep03838
  snippet: Type IIG (symmetric or asymmetric target sites; endonuclease activity affected
    by AdoMet (SAM))
  notes: Zhu et al. place Type IIG enzymes in the Type II restriction enzyme classification,
    supporting the Type IIG child record's reparenting beneath this Type II R-M parent.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RM_Type_II | 10\.1093/nar/gkac975 | REBASE: a database for DNA restriction
    and modification: enzymes, genes and genomes'
  notes: The pinned DefenseFinder article registry maps the RM_Type_II model namespace
    to the REBASE update.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "RM\tRM_Type_II\t2\t2\tRM_Type_II__Type_II_MTases, RM_Type_II__Type_II_REases\t\
    \t\t"
  notes: The DefenseFinder rules table models RM_Type_II as an RM subsystem requiring
    Type_II_MTases and Type_II_REases profile groups.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| RM_Type_II__Type_II_MTases_FAM_0                 |                                                  |
    RM_Type_II             | Custom                  | 20     |'
  notes: The pinned DefenseFinder HMM inventory lists custom methyltransferase profiles
    under the RM_Type_II system namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| RM_Type_II__Type_II_REase01                      |                                                  |
    RM_Type_II             | Custom                  | 20     |'
  notes: The pinned DefenseFinder HMM inventory lists custom restriction endonuclease
