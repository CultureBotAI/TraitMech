identifier: traitmech:000333
label: NixI system
definition: A phage defense system in which an organism possesses a NixI-family phage-satellite
  locus represented by the DefenseFinder NixI__NixI profile and exemplified by a PLE-encoded
  nicking endonuclease that cleaves ICP1 bacteriophage DNA, inhibits ICP1 genome replication,
  and reduces progeny production in Vibrio cholerae.
definition_source: DOI:10.1093/nar/gkac002
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: NixI
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1093/nar/gkac002
  snippet: Here, we characterize a PLE-encoded nuclease, NixI, that blocks phage development
    likely by nicking ICP1’s genome as it transitions to RCR
  notes: LeGault et al. characterize NixI as a PLE-encoded nuclease that likely blocks
    ICP1 development by nicking the ICP1 genome as it transitions to rolling-circle
    replication.
- reference: DOI:10.1093/nar/gkac002
  snippet: Together, these data show that PLE encodes a nicking endonuclease, NixI,
    that is necessary for cleavage of ICP1’s genome in vivo and that shows in vitro
    specificity for sequences found in ICP1’s genome
  notes: LeGault et al. show that NixI is a PLE-encoded nicking endonuclease necessary
    for in vivo ICP1 cleavage and specific for ICP1-derived sequences in vitro.
- reference: DOI:10.1093/nar/gkac002
  snippet: NixI, however, is sufficient to limit ICP1 progeny production in a single
    round of infection
  notes: LeGault et al. support NixI as a PLE-encoded product sufficient to limit
    ICP1 progeny production in a single infection round.
- reference: DOI:10.1093/nar/gkac002
  snippet: Together, these data demonstrate that nixI is a potent inhibitor of ICP1
    replication, resulting in decreased virion production.
  notes: LeGault et al. support NixI as a potent inhibitor of ICP1 genome replication,
    resulting in decreased virion production.
- reference: DOI:10.1093/nar/gkac002
  snippet: Phage parasites can be considered host defense systems, as the parasite
    inhibits production of its viral host, benefiting the bacterial population
  notes: LeGault et al. explicitly frame PLE-like phage parasites as host defense
    systems because they inhibit production of their viral hosts.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: NixI | 10\.1101/2021\.07\.12\.452122 | A phage parasite deploys a nicking
    nuclease effector to inhibit replication of its viral host
  notes: The DefenseFinder article registry maps the named NixI model namespace to
    the LeGault et al. PLE-encoded nicking-nuclease preprint, later published under
    DOI:10.1093/nar/gkac002.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "NixI\tNixI\t1\t1\tNixI__NixI\tNixI__Stix\t\t"
  notes: The DefenseFinder rules table models NixI with the NixI__NixI profile as
    its mandatory component and an optional NixI__Stix profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| NixI__NixI                                       | NixI__NixI                                       |
    NixI                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records NixI__NixI under the NixI model namespace.
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: LeGault et al. used PLE-positive Vibrio cholerae to show that NixI-dependent
    cleavage sites appear in ICP1 during infection and that nixI inhibits ICP1 replication
    and progeny production.
  reference: DOI:10.1093/nar/gkac002
