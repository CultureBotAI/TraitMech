discussions:
- discussion_id: nixi-stix-and-satellite-scope-gap
  prompt: Resolve NixI satellite self-protection, optional Stix profile scope, natural-host
    protein accessions, and divergent-homolog activity before minting narrower NixI
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: LeGault et al. support NixI as a PLE-encoded nicking endonuclease that
    cleaves ICP1 DNA and inhibits ICP1 genome replication, and DefenseFinder models
    NixI with a required NixI__NixI profile plus optional NixI__Stix. This first system-level
    record leaves the exact PLE self-protection mechanism, the optional Stix profile's
    experimental scope, the accession-level PLE1 NixI protein, the breadth of divergent
    homolog activity, and additional PLE anti-ICP1 mechanisms unresolved.
  attaches_to:
  - causal_graphs#nixi_locus_inhibits_icp1_replication
  posed_by: codex
  posed_date: '2026-09-21'
