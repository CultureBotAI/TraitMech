discussions:
- discussion_id: dodola-mechanism-gap
  prompt: Resolve Dodola phage triggers and effector outputs before minting narrower
    Dodola mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Dodola as a named anti-phage
    system with DolA and DolB profiles, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
