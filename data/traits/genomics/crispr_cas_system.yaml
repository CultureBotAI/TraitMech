evidence:
- reference: DOI:10.1038/s41579-019-0299-x
  notes: Makarova et al. present an evolutionary classification of CRISPR-Cas systems
    into two classes, six types, and many subtypes.
- reference: DOI:10.1016/j.molcel.2014.03.011
  notes: Barrangou & Marraffini review CRISPR-Cas as prokaryotic adaptive immunity
    against invading genetic elements.
