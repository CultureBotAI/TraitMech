causal_graphs:
- graph_id: ds_26_locus_reduces_phage_plaquing
  title: DS-26 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-26 locus
    to reduced bacteriophage plaquing without resolving DS-26 nuclease chemistry,
    native activity, DefenseFinder model coverage, or molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-26 as the validated NERD transcriptional unit
    with one product accession, two Table S7 phage-specific readouts, and one Table
    S8 PDDEXK/FokI cleavage-domain HHpred lead for WP_054626965.1. It does not assert
    exact domain interpretation, nuclease chemistry, native host breadth, complete
    phage breadth, DefenseFinder article/HMM/rules coverage, molecular output, or
    endogenous DS-26 activity.
