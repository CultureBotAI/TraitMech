    mapping, PDDEXK HHpred-domain interpretation, complete phage breadth, molecular
    output, and rule-level DefenseFinder criteria before minting narrower DS-24 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-24 as the defensive RED2 transcriptional unit
    and final Science Tables S6/S7/S8 map it to product accession WP_000183405.1,
    a Bas1 phage readout, display name DS-24, and a PDDEXK HHpred row. The pinned
    DefenseFinder HMM inventory records one DS-24 custom profile row. The pinned rules
    table has no DS-24 row, and the first-pass record does not resolve native host
    breadth, complete phage breadth, direct profile-to-protein correspondence, PDDEXK
    activity, molecular output, or endogenous DS-24 activity.
