discussions:
- discussion_id: mok-hok-sok-natural-context-gap
  prompt: Resolve the natural host range, Sok antisense-RNA representation, Hok toxin
    activation, and Hok/Mok profile-to-activity mapping before minting narrower Mok-Hok-Sok
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Pecota and Wood support T4 exclusion by the plasmid R1 hok/sok locus
    carried on a pBR322-based plasmid, and DefenseFinder models Mok_Hok_Sok with Hok
    and Mok protein profiles. This first record leaves the native biological breadth,
    RNA antitoxin representation, Hok triggering, and profile-to-activity mapping
    unresolved.
