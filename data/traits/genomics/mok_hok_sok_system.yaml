identifier: traitmech:000372
label: Mok-Hok-Sok system
definition: A phage defense system in which an organism possesses a hok/sok toxin-antitoxin
  locus represented by DefenseFinder as the two-profile Mok_Hok_Sok model and experimentally
  linked to bacteriophage T4 exclusion by the plasmid R1 hok/sok locus.
definition_source: DOI:10.1128/jb.178.7.2044-2050.1996
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
