evidence:
- reference: PMID:8606182
  snippet: To investigate whether the hok/sok locus evolved as a phage-exclusion mechanism,
    Escherichia coli cells that contain hok/sok on a pBR322-based plasmid were challenged
    with T1, T4, T5, T7, and lambda phage.
  notes: Pecota and Wood tested whether a plasmid-carried hok/sok locus can act as
    a phage-exclusion mechanism.
- reference: PMID:8606182
  snippet: The presence of hok/sok reduced the efficiency of plating of T4 by 42%
    and decreased the plaque size by approximately 85%.
  notes: Pecota and Wood show that hok/sok reduced bacteriophage T4 plating efficiency
    and plaque size.
- reference: PMID:8606182
  snippet: Single-step growth experiments demonstrated that hok/sok decreased the
    T4 burst size by 40%, increased the time to form mature phage (eclipse time) from
    22 to 30 min, and increased the time to cell lysis (latent period) from 30 to
    60 min.
  notes: Pecota and Wood support delayed T4 development and a lower T4 burst size
    in the presence of hok/sok.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Mok_Hok_Sok | 10\.1128/jb\.178\.7\.2044-2050\.1996 | Exclusion of T4 phage
    by the hok/sok killer locus from plasmid R1
  notes: The DefenseFinder article registry maps the named Mok_Hok_Sok system to the
    Pecota and Wood plasmid R1 hok/sok phage-exclusion paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Mok_Hok_Sok\tMok_Hok_Sok\t1\t1\tMok_Hok_Sok__Hok, Mok_Hok_Sok__Mok\t\t\
    \t"
  notes: The DefenseFinder rules table models Mok_Hok_Sok as a single system listing
    Hok and Mok profiles with 1/1 thresholds.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Mok_Hok_Sok__Hok                                 | Mok_Hok_Sok__Hok                                 |
    Mok_Hok_Sok            | Custom                  | 90     |'
  notes: The DefenseFinder HMM inventory records Mok_Hok_Sok__Hok under Mok_Hok_Sok.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
