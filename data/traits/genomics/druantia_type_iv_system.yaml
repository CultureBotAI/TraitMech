identifier: traitmech:000577
label: Druantia type IV system
definition: A Druantia system in which an organism possesses a locus encoding DruE
  and DruF together with DruL, without the type-II DruM and DruG components.
definition_source: DOI:10.1093/nar/gkab883
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000234
synonyms:
- synonym_text: Druantia type IV
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkab883
evidence:
- reference: DOI:10.1093/nar/gkab883
  snippet: the Druantia-like system lacks the type II requisite DruM and DruG proteins,
    instead encoding a hypothetical protein
  notes: 'Payne et al., Results and Figure 2C: the recurring type-IV architecture
    contains DruE and DruF together with the newly named DruL, instead of the type-II
    DruM/G components. This is a literature-defined system-possession class, not an
    individual profile. The study tests Zorya III, Hachiman II and Lamassu II, not
    Druantia IV. Its computational classification does not demonstrate type-IV phage
    resistance or DruL chemistry.'
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/definitions/DefenseFinder/Druantia/Druantia_IV.xml
  snippet: <gene name="Druantia_IV__DruL" presence="mandatory"/>
  notes: 'Pinned DefenseFinder XML, retrieved 2026-10-03: three mandatory slots, both
    minimum counts 3, inter_gene_max_space 1. DruL is mandatory; DruE_1 accepts DruE_2,
    DruE_3 or DruE4 exchangeables, and the Druantia-II DruF slot accepts DruF4. There
    are no forbidden genes: a call does not establish absence of DruM/G. Check full
    locus context before assigning the literature-defined architecture. Detection
    does not establish functional defense.'
- reference: https://raw.githubusercontent.com/padlocbio/padloc-db/9e380165633a8d6aef93b5a164cea0f3359bd33f/sys/druantia_type_IV.yaml
  snippet: "minimum_core: 3\nminimum_total: 3\ncore_genes:\n  - DruE4\n  - DruF4\n\
    \  - DruL4"
  notes: 'Pinned PADLOC rule, retrieved 2026-10-03: three required core genes, maximum_separation
    3, force_strand FALSE. DruK is secondary, not a required defining component. The
    prohibited list is NA, so the detector does not test the biological absence of
    DruM/G. A missing hit or incomplete assembly cannot establish that absence. These
    are computational constraints, not experimental component essentiality or type-IV
    mechanism evidence.'
discussions:
- discussion_id: druantia-type-iv-functional-and-architecture-gap
  prompt: Resolve type-IV defense activity, DruL function and complete locus boundaries.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The sources support a recurring organism-level DruE/F/L locus architecture
    distinct from type-II DruM/F/G/E, not a measured resistance phenotype. A complete
    accession-resolved natural locus, independently resolved taxon and type-IV-specific
    functional assays remain to be curated before adding a canonical example or causal
    mechanism graph. DruE helicase/nuclease activity established for type III is not
    generalized to type IV. DruL and optional DruK roles remain unresolved by this
    evidence bundle. Neither executable detector forbids DruM/G; mixed or incomplete
    calls require biological locus review, not automatic conversion to this absence-qualified
    class. No individual protein, HMM hit, source key, unverified xref or mutually
    disjoint organism-level possession is asserted.
  posed_by: codex
  posed_date: '2026-10-03'
