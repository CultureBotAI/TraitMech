identifier: traitmech:000248
label: Bunzi system
definition: A phage defense system in which an organism possesses a two-component
  Bunzi locus represented by BnzA and BnzB profiles that can protect bacteria from
  bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2022.09.017
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
