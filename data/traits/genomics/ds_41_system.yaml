discussions:
- discussion_id: ds-41-defensefinder-model-gap
  prompt: Resolve DS-41 native host breadth, exact component activity, profile-to-protein
    mapping, AAA+ ATPase interpretation, complete phage breadth, molecular output,
    and rule-level DefenseFinder criteria before minting narrower DS-41 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-41 as the defensive AAA2 transcriptional unit
    and final Science Tables S6/S7/S8 map it to one product accession, Bas1 and T4
    phage readouts, display name DS-41, and a high-probability AAA+ ATPase HHpred
    row. The pinned DefenseFinder HMM inventory records one DS-41 custom profile row.
    The pinned rules table has no DS-41 row, and the first-pass record does not resolve
    native host breadth, complete phage breadth, direct profile-to-protein correspondence,
    AAA+ ATPase activity, molecular output, or endogenous DS-41 activity.
