discussions:
- discussion_id: radar-trigger-and-substrate-gap
  prompt: Resolve RADAR phage triggers, RdrA activation, ATP-versus-RNA deamination,
    and inosine nucleotide toxicity before minting narrower RADAR mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support an RNA translocation and deamination model for RdrA/RdrB
    RADAR assemblies, whereas Duncan-Lowey et al. found that ATP and dATP mononucleotide
    deamination rather than robust RNA editing mediates RADAR immunity. The first
    TraitRecord therefore stays at the RADAR-system level until separate review resolves
    which activating phage cues, RdrA sensor states, deaminase substrates, and inosine
    toxicity routes generalize across RADAR loci.
  posed_by: codex
  posed_date: '2026-09-18'
