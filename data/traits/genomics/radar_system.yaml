identifier: traitmech:000238
label: RADAR system
definition: A phage defense system in which an organism possesses a restriction by
  an adenosine deaminase acting on RNA locus encoding an RdrA AAA+ ATPase and an RdrB
  adenosine deaminase that assemble into a supramolecular defense complex to modify
  adenosine-containing substrates and inhibit bacteriophage replication.
definition_source: DOI:10.1016/j.cell.2023.01.012
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: restriction by an adenosine deaminase acting on RNA
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2023.01.012
evidence:
- reference: DOI:10.1016/j.cell.2023.01.012
  snippet: RADAR is a two-protein bacterial defense system that was reported to defend
    against phage
  notes: Duncan-Lowey et al. support RADAR as a named bacterial phage-defense system.
- reference: DOI:10.1016/j.cell.2023.01.012
  snippet: revealing RdrA as a heptameric, two-layered AAA+ ATPase and RdrB as a dodecameric,
    hollow complex with twelve surface-exposed deaminase active sites
  notes: Duncan-Lowey et al. support the RdrA AAA+ ATPase and RdrB adenosine-deaminase
    complex components.
- reference: DOI:10.1016/j.cell.2023.01.012
  snippet: RdrB catalyzes ATP-to-ITP conversion in vitro and induces the massive accumulation
    of inosine mononucleotides during phage infection in vivo, limiting phage replication
  notes: Duncan-Lowey et al. support ATP-to-ITP deamination and inosine-mononucleotide
    accumulation as RADAR antiphage outputs.
- reference: DOI:10.1016/j.cell.2023.01.012
  snippet: When heterologously expressed in E. coli MG1655, all RADAR systems conferred
    defense against the closely related T-even phages T2, T4, and T6
  notes: Duncan-Lowey et al. support the E. coli P0304799.3 RADAR locus as experimentally
    investigated and antiphage-active when cloned into E. coli MG1655.
- reference: DOI:10.1016/j.cell.2023.01.026
  snippet: RADAR contains an adenosine triphosphatase (RdrA) and an adenosine deaminase
    (RdrB)
  notes: Gao et al. independently support defining RADAR around the RdrA ATPase and
    RdrB deaminase components.
- reference: DOI:10.1016/j.cell.2023.01.026
  snippet: up to twelve RdrA rings can dock one RdrB cage with precise alignments
    between deaminase catalytic pockets and RNA-translocation channels
  notes: Gao et al. independently resolve RADAR RdrA/RdrB supramolecular assemblies
    while supporting an RNA-translocation interpretation of the deaminase substrate.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Duncan-Lowey et al. selected the RADAR system from E. coli P0304799.3 for
    experimental investigation and reported that it conferred defense against T-even
    phages when heterologously expressed in E. coli MG1655.
  reference: DOI:10.1016/j.cell.2023.01.012
