identifier: traitmech:000471
label: DS-46 system
definition: A phage defense system in which an organism possesses the two-gene DS-46
  locus cataloged as working transcriptional unit RMRT and whose plasmid expression
  in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: DS-46
  synonym_type: EXACT_SYNONYM
  source: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
- synonym_text: RMRT
  synonym_type: RELATED_SYNONYM
  source: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
evidence:
- reference: DOI:10.1126/science.adv7924
  snippet: To test for anti-phage defense, we placed each TU with its predicted native
    promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
    these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
    total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
    the efficiency of plating (EOP) at least ten-fold relative to an empty vector
    control strain
  notes: DeWeirdt et al. experimentally validated 42 predicted transcriptional units
    as phage-defense systems in E. coli.
- reference: DOI:10.1126/science.adv7924
  snippet: We refer to these validated TUs as DefensePredictor discovered systems
    (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g., DS-8A
    is the first gene of DS-8.
  notes: DeWeirdt et al. name validated transcriptional units as DefensePredictor
    discovered systems.
- reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
  snippet: "RMRT\tNZ_RRVG01000021.1\tGCF_003886135.1\t+\tFalse\tFalse\tTrue\tTrue\t\
    HHblits hits\t62985\t63495\tDUF3606 domain-containing protein, hypothetical protein\t\
    WP_001406733.1, WP_000002748.1\t-4.513359272522268\t5.517452896464706\tFalse\t\
    True\t\tDS-46"
  notes: The final Science supplementary Table S6 maps working_id RMRT to DS_name
    DS-46, marks the cloned transcriptional unit as defensive, records an HHblits-hit
    screen, and places two product accessions in NZ_RRVG01000021.1 positions 62985-63495.
