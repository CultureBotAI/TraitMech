discussions:
- discussion_id: ds-46-model-coverage-gap
  prompt: Resolve DS-46 phage-specific readouts, display-name and domain rows, DefenseFinder
    model coverage, native host breadth, exact component activities, molecular output,
    complete phage breadth, and endogenous activity before minting narrower DS-46
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-46 as the defensive RMRT transcriptional unit
    and final Science Table S6 maps RMRT to two product accessions. A first-pass final
    Science Table S7/S8 review found no exact RMRT/DS-46 phage-specific readout, display-name
    row, or HHpred-domain row. The pinned DefenseFinder article, HMM, and rules registries
    also do not list DS-46 or RMRT, and the first-pass record therefore does not resolve
    native host breadth, complete phage breadth, exact component activities, molecular
    output, or endogenous DS-46 activity.
  evidence:
  - reference: DOI:10.1126/science.adv7924
    snippet: We refer to these validated TUs as DefensePredictor discovered systems
      (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g.,
      DS-8A is the first gene of DS-8.
    notes: DeWeirdt et al. name validated TUs as DSs.
