identifier: traitmech:000231
label: Kiwa system
definition: A phage defense system in which an organism possesses a two-component
  Kiwa locus encoding the transmembrane sensor KwaA and DNA-binding effector KwaB
  that assemble into a membrane-associated supercomplex and coordinate phage-attachment
  sensing with inhibition of phage DNA replication and late transcription.
definition_source: DOI:10.1016/j.cell.2025.07.002
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Kiwa
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2025.07.002
evidence:
- reference: DOI:10.1126/science.aar4120
  snippet: Kiwa KwaAB pfam16162 No annotated domain 934 924 (1.8%) Membrane associated
  notes: Doron et al. reported Kiwa/KwaAB as a membrane-associated defense system
    in their pangenome-scale antiphage-system discovery screen.
- reference: DOI:10.1016/j.cell.2025.07.002
  snippet: Kiwa, a widespread two-component system composed of the transmembrane sensor
    KwaA and the DNA-binding effector KwaB
  notes: Zhang et al. support defining Kiwa as a recurring two-component KwaA/KwaB
    antiviral system.
- reference: DOI:10.1016/j.cell.2025.07.002
  snippet: KwaA and KwaB assemble into a large, membrane-associated supercomplex
  notes: Zhang et al. connect the KwaA and KwaB components to membrane-associated
    supercomplex assembly.
- reference: DOI:10.1016/j.cell.2025.07.002
  snippet: Upon phage binding, KwaA senses infection at the membrane, leading to KwaB
    binding of ejected phage DNA and inhibition of replication and late transcription,
    without inducing host cell death
  notes: Zhang et al. connect phage binding to KwaA-dependent membrane sensing, KwaB
    binding of phage DNA, and inhibition of phage replication and late transcription.
- reference: DOI:10.1016/j.cell.2025.07.002
  snippet: its antiviral activity requires association with KwaA, suggesting spatial
    or conformational regulation
  notes: Zhang et al. support KwaA-KwaB association as required for Kiwa antiviral
    activity.
- reference: DOI:10.1016/j.cell.2025.07.002
  snippet: Kiwa coordinates membrane-associated detection of phage infection with
    downstream DNA binding by its effector, forming a spatially coordinated antiviral
    mechanism
  notes: Zhang et al. summarize the Kiwa system-level mechanism as membrane-associated
    phage-infection detection coordinated with effector DNA binding.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Zhang et al. characterized the Escherichia coli O55:H7 Kiwa system and showed
    that its KwaA/KwaB pair assembles into a membrane-associated supercomplex that
    inhibits phage DNA replication and late transcription.
  reference: DOI:10.1016/j.cell.2025.07.002
causal_graphs:
- graph_id: kiwa_membrane_sensing_dna_binding
  title: Kiwa coordinates membrane sensing with phage DNA binding
  description: Evidence-backed process sketch linking a Kiwa kwaAB locus to KwaA-KwaB
    supercomplex assembly, membrane-associated phage-infection sensing, binding of
    ejected phage DNA, and inhibition of phage DNA replication and late transcription.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the characterized two-component Kiwa mechanism without
    asserting one exact phage receptor, the precise KwaA conformational change, the
    structural basis of KwaB DNA binding, Gam-mediated counter-defense, or RecBCD
    rescue as universal across all Kiwa loci.
