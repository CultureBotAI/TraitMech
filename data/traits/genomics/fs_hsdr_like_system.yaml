discussions:
- discussion_id: fs-hsdr-like-mechanism-gap
  prompt: Resolve FS_HsdR_like natural hosts, helper-phage triggers, DUF6731 activity,
    HP component identity, HdrR activity, and the profile-to-activity mapping before
    minting narrower FS_HsdR_like mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Fillol-Salom et al. support phage-inducible chromosomal islands as carriers
    of defense systems that provide broad immunity, and DefenseFinder models FS_HsdR_like
    as a two-gene system drawing from three custom profile keys. Its exact natural
    host breadth, helper-phage trigger, component activities, and profile-to-activity
    mapping remain unresolved.
