- graph_id: ds_29_locus_reduces_phage_plaquing
  title: DS-29 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-29 locus
    to reduced bacteriophage plaquing without resolving DS-29 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-29 as the validated HEP3 transcriptional unit
    with one product accession, one lower-probability HEPN-like HHpred-domain row,
    and one DefenseFinder DS-29 profile row. It does not assert native host breadth,
    exact profile-to-protein correspondence, DS-29 molecular activity, trigger, substrate,
    complete phage breadth, HEPN-like HHpred-domain interpretation, or DefenseFinder
    rule-level detection criteria.
