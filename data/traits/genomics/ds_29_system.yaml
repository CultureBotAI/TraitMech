    and final Science Tables S6/S7/S8 map it to product accession WP_061089765.1,
    a Bas60 phage readout, display name DS-29, and a HEPN-like HHpred row. The pinned
    DefenseFinder HMM inventory records one DS-29 custom profile row. The pinned rules
    table has no DS-29 row, and the first-pass record does not resolve native host
    breadth, complete phage breadth, direct profile-to-protein correspondence, HEPN-like
    activity, molecular output, or endogenous DS-29 activity.
