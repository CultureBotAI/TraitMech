discussions:
- discussion_id: veles-mechanism-gap
  prompt: Resolve Veles phage triggers and effector outputs before minting narrower
    Veles mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Veles as a named anti-phage
    system with VlsA1, VlsA2, VlsB1, VlsB2, VlsC1, and VlsC2 HMM profile entries,
    but the trigger, molecular substrate, antiviral effector output, and subtype-specific
    mechanism are not resolved enough here to assert a narrower mechanistic child
    trait.
  attaches_to:
  - causal_graphs#veles_locus_restricts_phage
  posed_by: codex
  posed_date: '2026-09-19'
