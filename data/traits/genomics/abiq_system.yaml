identifier: traitmech:000225
label: AbiQ system
definition: An abortive infection system in which an organism possesses an AbiQ type
  III toxin-antitoxin locus whose protein endoribonuclease and cognate RNA antitoxin
  module alter early phage mRNA profiles and restrict phage propagation after adsorption.
definition_source: DOI:10.1128/JB.00296-13
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1128/AEM.64.12.4748-4756.1998
  snippet: the system encoded by pSRQ900 was classified as an abortive infection mechanism
    and was named AbiQ
  notes: Emond et al. named AbiQ as a Lactococcus plasmid-encoded abortive infection
    system rather than an adsorption-blocking or restriction-modification defense.
- reference: DOI:10.1128/AEM.64.12.4748-4756.1998
  snippet: The frameshift mutation completely abolished host resistance to phages
    p2 and c21
  notes: Emond et al. localized the phage-resistance phenotype to the abiQ open reading
    frame on the pSRQ900 fragment.
- reference: DOI:10.1128/JB.00296-13
  snippet: Lactococcus lactis AbiQ system, a type III toxin-antitoxin with antiviral
    activities
  notes: Samson et al. support the type III protein-RNA toxin-antitoxin architecture
    of AbiQ.
- reference: DOI:10.1128/JB.00296-13
  snippet: AbiQ modified the early-expressed phage mRNA profiles
  notes: Samson et al. connect AbiQ to altered early phage mRNA profiles during infection.
- reference: DOI:10.1128/JB.00296-13
  snippet: active against various phage families infecting Gram-positive and Gram-negative
    bacteria
  notes: Samson et al. support AbiQ as an antiphage system whose activity is not restricted
    to its native lactococcal host.
- reference: DOI:10.1128/JB.00296-13
  snippet: In the presence of AbiQ, additional small transcripts were observed
  notes: Samson et al. observed altered P008 transcript profiles in phage-infected
    AbiQ-containing cells.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Emond et al. isolated the pSRQ900 plasmid from Lactococcus lactis W-37, named
    its encoded abortive-infection mechanism AbiQ, and showed AbiQ-dependent resistance
    to c2- and 936-like lactococcal phages.
  reference: DOI:10.1128/AEM.64.12.4748-4756.1998
causal_graphs:
- graph_id: abiq_type_iii_ta_antiphage_activity
  title: AbiQ type III toxin-antitoxin activity disrupts phage mRNA profiles
  description: Evidence-backed process sketch linking an AbiQ locus to type III toxin-antitoxin
    activity, altered early phage mRNA profiles, restricted phage propagation, and
    abortive-infection system possession.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiQ at the system level without asserting a universal
    phage activator, exact AbiQ RNA target, or phage-escape path; Samson et al. show
    that multiple unrelated phage genes can be involved in the AbiQ phenotype.
