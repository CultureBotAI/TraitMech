discussions:
- discussion_id: charlie_gp32-mechanism-gap
  prompt: Resolve the Charlie gp32 membrane target, Che9c specificity, and homolog
    breadth before minting narrower Charlie gp32 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Dedrick et al. and DefenseFinder support Charlie gp32 as a named anti-phage
    system with a gp32 profile, but the direct membrane target, determinants of its
    Che9c specificity, and breadth of homologous loci are not resolved enough here
    to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#charlie_gp32_locus_blocks_phage_entry
