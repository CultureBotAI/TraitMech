identifier: traitmech:000295
label: Charlie gp32 system
definition: A phage defense system in which an organism possesses a Charlie gp32 locus
  that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1038/nmicrobiol.2016.251
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Charlie gp32 defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nmicrobiol.2016.251
- synonym_text: Charlie_gp32
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: at least five distinct prophage-expressed viral defense systems that interfere
    with infection
  notes: Dedrick et al. place the Cluster N Charlie gp32 system in a cohort of prophage-expressed
    defenses against lytic and temperate mycobacteriophages.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: The gene responsible is Charlie 32 (and presumably the analogous genes
    in Xeno and SkinnyPete), and a Charlie lysogen in which 32 is deleted loses defense
    against Che9c
  notes: Dedrick et al. localize a Cluster N prophage-mediated heterotypic defense
    to Charlie gene 32.
- reference: DOI:10.1038/nmicrobiol.2016.251
  snippet: The Charlie gp32 defense system is notable in that although it has the
    characteristics of superinfection exclusion systems – being membrane located and
    preventing DNA injection – it has remarkable specificity for a single phage among
    those tested
  notes: Dedrick et al. explicitly name the Charlie gp32 defense system as an exclusion-like
    viral-defense system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Charlie_gp32 | 10\.1038/nmicrobiol\.2016\.251 | Prophage-mediated defence
    against viral attack and viral counter-defence
  notes: The DefenseFinder model registry maps the named Charlie_gp32 system to the
    Dedrick et al. prophage-mediated viral-defense paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: Charlie_gp32__gp32                               | Charlie_gp32__gp32                               |
    Charlie_gp32
  notes: The DefenseFinder HMM inventory records gp32 in the Charlie_gp32 model namespace.
