identifier: traitmech:000567
label: Lamassu Hydrolase-Protease system
definition: A Lamassu system in which an organism possesses a defense locus encoding
  a protease-domain LmuA effector together with a hydrolase-like protein, an SMC-like
  LmuB sensor, and LmuC.
definition_source: DOI:10.1073/pnas.2519643122
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
