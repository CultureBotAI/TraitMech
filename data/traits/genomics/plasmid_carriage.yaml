      notes: plasmid-encoded methylases that protect plasmids from restriction.
  - subject: anti_restriction_proteins
    predicate: protects against
    object: restriction_of_plasmid_dna
    description: Plasmid-encoded anti-restriction proteins counter multiple RM system
