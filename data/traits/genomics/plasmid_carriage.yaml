    evidence:
    - reference: DOI:10.1093/nar/gkae896
      notes: plasmid-encoded anti-restriction proteins that protect against multiple
        RM types.
  - subject: antibiotic_selective_pressure
    predicate: promotes retention of
    object: plasmid_carriage_trait
    description: Without selection plasmids tend to be lost; antibiotic pressure promotes
      retention.
    evidence:
    - reference: DOI:10.1080/22221751.2024.2352432
      notes: without selection plasmids tend to be lost, whereas antibiotic (or metal)
        selective pressure promotes retention.
  - subject: plasmid_carriage_trait
    predicate: imposes
    object: fitness_cost
    description: Plasmid carriage imposes a fitness cost from additional material
      and energy consumption.
    evidence:
    - reference: DOI:10.1080/22221751.2024.2352432
      notes: Plasmid carriage imposes fitness costs (additional material and energy
        consumption).
  - subject: compensatory_mutation
    predicate: decreases
    object: fitness_cost
    description: Compensatory evolution of chromosomes and plasmids counteracts plasmid
