- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 1 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (1 to reduces), issue 301 part 2. The previous predicates
    are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain is METPO:1000525
    (microbe), so a causal-graph subject entailed that the subject IS a microbe; CausalNodeTypeEnum
    has no organism member, so no such edge could ever satisfy the domain. Each replacement
    is a 1:1 mirror of its source predicate that changes only the domain, so the claim
    each edge makes is unchanged and directions are unchanged. The replacements are
    proposed in proposals/metpo_traitmech_v9 and are placeholder ids until METPO mints
    them.
  llm_assisted: true
- timestamp: '2026-08-06T06:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Relabelled 1 causal edge from `reduces` to `decreases` and re-grounded
    it from METPO:2007802 to RO:0002212 (negatively regulates), issue 330. The corpus
    wrote two senses under the single label `reduces` - genuine electron donation,
    and a lessens/decreases sense - and METPO:2007802 is defined as donating electrons
    to the object and lowering its oxidation state, which this edge does not assert.
    The two senses could not be separated mechanically because the label was identical,
    so they migrated together in issue 329 and were split here by reading each edge.
    RO:0002212 declares no rdfs:domain or rdfs:range, so this introduces no entailment
    of the kind issue 301 removed.
  llm_assisted: true
- timestamp: '2026-08-15T06:00:00Z'
  curator: claude
  action: SPLIT_PROTEIN_FROM_ACTIVITY
  changes: 'Separated the protein sense from the activity sense so one node_id means
    one thing (issue 356): retyped plasmid_methylase: MOLECULAR_FUNCTION -> GENE_OR_PROTEIN.
    The exception in this tranche. Both occurrences describe the ENZYME -- ''Methyltransferase
    encoded by a mobile element that pre-methylates its DNA'' (GENE_OR_PROTEIN) and
    ''Plasmid-borne methyltransferase shielding plasmid DNA from restriction'' (MOLECULAR_FUNCTION).
    Neither names an activity, so there is one concept here and it is a protein. A
    rename would have invented a distinction the corpus does not draw.'
  llm_assisted: true
- timestamp: '2026-08-26T03:23:00Z'
