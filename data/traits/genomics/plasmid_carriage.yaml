identifier: traitmech:000090
label: plasmid carriage
definition: A genomics trait describing possession of one or more plasmids —
  extrachromosomal, typically circular DNA replicons that carry accessory genes such
  as resistance, virulence, or metabolic functions and can transfer by conjugation.
definition_source: DOI:10.1128/MMBR.00020-10
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
