identifier: traitmech:000090
label: plasmid carriage
definition: A genomics trait describing possession of one or more plasmids — extrachromosomal,
  typically circular DNA replicons that carry accessory genes such as resistance,
  virulence, or metabolic functions and can transfer by conjugation.
definition_source: DOI:10.1128/MMBR.00020-10
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000089
synonyms:
- synonym_text: plasmid-bearing
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.00020-10
evidence:
- reference: DOI:10.1128/MMBR.00020-10
  notes: Smillie et al. review plasmid mobility, classifying conjugative and mobilizable
    plasmids as key vectors of horizontal gene transfer.
- reference: DOI:10.1038/nrmicro1235
  notes: Frost et al. include plasmids among the principal mobile genetic elements.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: F/R plasmid carriage
  reference: PMID:36409140
- taxon_id: NCBITaxon:139
  taxon_label: Borreliella burgdorferi
  note: numerous linear/circular plasmids
  reference: PMID:9403685
causal_graphs:
- graph_id: plasmid_conjugation_hgt
  title: Plasmid carriage drives conjugative horizontal gene transfer
  scope_status: NONMECHANISTIC
  scope_notes: This genomics record is a measurement, genomic-element classification,
    or population-level descriptor rather than one taxon-specific protein mechanism;
    contextual protein nodes do not receive token UniProt examples.
  description: Evidence-backed causal sketch linking plasmid possession to conjugation
    and accessory-function delivery.
  nodes:
  - node_id: plasmid_carriage_trait
    label: plasmid carriage
    node_type: TRAIT
    grounding: traitmech:000090
    description: Possession of extrachromosomal plasmid replicons.
  - node_id: conjugation
    label: conjugation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0000746
    description: Cell-to-cell transfer of genetic material via direct contact.
  - node_id: accessory_function
    label: accessory function
    node_type: QUALITY
    description: Plasmid-encoded resistance, virulence, or metabolic capability.
  - node_id: ta_system
    label: toxin-antitoxin system
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a nonmechanistic genomics classification; no exact semantic family term was
      established for this aggregate use.
    description: Selfish genetic module mediating plasmid addiction / post-segregational
      killing.
  - node_id: plasmid_vertical_inheritance
    label: plasmid vertical inheritance
    node_type: BIOLOGICAL_PROCESS
    description: Stable transmission of a plasmid to daughter cells across generations.
  - node_id: plasmid_methylase
    label: plasmid-encoded methylase
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a nonmechanistic genomics classification; no exact semantic family term was
      established for this aggregate use.
    description: Plasmid-borne methyltransferase shielding plasmid DNA from restriction.
  - node_id: restriction_of_plasmid_dna
    label: restriction of incoming plasmid DNA
    node_type: BIOLOGICAL_PROCESS
    description: Cleavage of unmethylated incoming plasmid DNA by restriction-modification
      systems.
  - node_id: anti_restriction_proteins
    label: plasmid-encoded anti-restriction proteins
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a nonmechanistic genomics classification; no exact semantic family term was
      established for this aggregate use.
    description: Plasmid-encoded proteins that inhibit host restriction-modification
      defence; their encoding genes remain record-level metadata rather than nodes.
  - node_id: antibiotic_selective_pressure
    label: antibiotic selective pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Antibiotic exposure selecting for retention of resistance plasmids.
  - node_id: fitness_cost
    label: plasmid fitness cost
    node_type: QUALITY
    description: Reduced host fitness from additional material and energy consumption
      of plasmid carriage.
  - node_id: compensatory_mutation
    label: compensatory mutation
    node_type: BIOLOGICAL_PROCESS
    description: Chromosomal or plasmid mutation that ameliorates plasmid-imposed
      fitness cost.
  edges:
