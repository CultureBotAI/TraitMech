discussions:
- discussion_id: abiu-orf-and-transcription-gap
  prompt: Resolve the AbiU phage trigger, direct AbiU1 and AbiU2 functions, and phage-transcription-delay
    route before minting narrower AbiU mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Dai et al. support AbiU as a named lactococcal abortive-infection system
    that reduces plaquing of c2, 936, and P335 phages and delays 712 and c2 phage
    transcription. DefenseFinder represents AbiU with a one-profile rule, but this
    first system-level record leaves the phage trigger, AbiU1 molecular function,
    AbiU2 downregulation route, natural locus breadth, and phage escape routes unresolved.
  attaches_to:
  - causal_graphs#abiu_locus_delays_lactococcal_phage_transcription
  posed_by: codex
  posed_date: '2026-09-20'
