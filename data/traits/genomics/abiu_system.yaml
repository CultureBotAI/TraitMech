    antiphage activity, reduced c2/936/P335 phage plaquing, delayed phage 712 and
    c2 transcription, and AbiU-system possession without asserting the unresolved
    phage trigger or AbiU1 molecular target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiU as a named DefenseFinder single-profile abortive-infection
    system whose LL51-1 prototype restricts c2, 936, and P335 lactococcal phages.
