identifier: traitmech:000321
label: AbiU system
definition: An abortive infection system in which an organism possesses an abiU-family
  locus represented by the DefenseFinder AbiU__AbiU profile and exemplified by the
  Lactococcus lactis LL51-1 AbiU determinant, whose abiU1 open reading frame is responsible
  for phage resistance, whose abiU2 region may downregulate 936/P335 resistance, and
  whose activity reduces c2, 936, and P335 lactococcal phage plaquing while delaying
  transcription of phages 712 and c2.
definition_source: DOI:10.1128/AEM.67.11.5225-5232.2001
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiU
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.67.11.5225-5232.2001
evidence:
- reference: PMID:11679349
  snippet: This study reports on the identification and characterization of a novel
    abortive infection system, AbiU, from Lactococcus lactis.
  notes: Dai et al. identify AbiU as a novel Lactococcus lactis abortive-infection
    system.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC93294/
  snippet: This study describes the isolation and molecular characterization of a
    novel abortive infection phage resistance system, AbiU, from a native plasmid
    that was isolated from a phage-resistant industrial strain, L. lactis LL51-1.
  notes: Dai et al. connect the AbiU system to the native plasmid in the industrial
    Lactococcus lactis strain LL51-1.
- reference: PMID:11679349
  snippet: 'AbiU confers resistance to phages from the three main industrially relevant
    lactococcal phage species: c2, 936, and P335.'
  notes: Dai et al. measured the AbiU activity spectrum across representative c2,
    936, and P335 lactococcal phages.
- reference: PMID:11679349
  snippet: 'The presence of AbiU reduced the efficiency of plaquing against specific
    phage from each species as follows: 3.7 x 10(-1), 1.0 x 10(-2), and 1.0 x 10(-1),
    respectively.'
  notes: Dai et al. quantified phage-specific AbiU reductions in efficiency of plaquing
    against c2, 936, and P335 representatives.
- reference: PMID:11679349
  snippet: abiU involves two open reading frames, abiU1 (1,772 bp) and abiU2 (1,019
    bp).
  notes: Dai et al. reported a two-ORF abiU locus rather than resolving AbiU as a
    single isolated protein trait.
- reference: PMID:11679349
  snippet: Evidence indicates that AbiU1 is responsible for phage resistance and that
    AbiU2 may downregulate phage resistance against 936 and P335 type phages but not
    c2 type phage.
  notes: Dai et al. connected AbiU1 to the phage-resistance phenotype and left AbiU2
    as a likely regulator of a phage-species-specific resistance output.
- reference: PMID:11679349
  snippet: AbiU appeared to delay transcription of both phage 712 and c2, with the
    effect being more marked on phage c2.
  notes: Dai et al. linked AbiU to delayed phage transcription without resolving the
    direct phage trigger or AbiU1 target.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiU | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiU model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiU\tAbiU\t1\t1\tAbiU__AbiU"
  notes: The DefenseFinder rules table models AbiU as a one-component system requiring
    the AbiU__AbiU profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiU__AbiU                                       | AbiU__AbiU                                       |
    AbiU                   | Custom                  | 60     |'
  notes: The DefenseFinder HMM inventory records AbiU__AbiU under the AbiU model namespace.
