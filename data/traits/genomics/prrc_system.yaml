evidence:
- reference: PMID:21129205
  snippet: phage exclusion systems that involve T4-mediated activation of a latent
    endoribonuclease (PrrC) and cofactor-assisted activation of EF-Tu proteolysis
    (Gol-Lit)
  notes: Uzan et al. name PrrC as a T4-mediated phage-exclusion system that activates
    a latent endoribonuclease.
- reference: PMID:16790566
  snippet: The tRNA(Lys) anticodon nuclease PrrC is associated in latent form with
    the type Ic DNA restriction endonuclease EcoprrI and activated by a phage T4-encoded
    inhibitor of EcoprrI.
  notes: Blanga-Kanfi et al. support latent PrrC association with the EcoprrI restriction
    endonuclease and activation by a T4-encoded EcoprrI inhibitor.
- reference: PMID:16790566
  snippet: This triad exists in all the known PrrC homologs but only some of them
    feature residues needed for tRNA(Lys) recognition by the Escherichia coli prototype.
  notes: Blanga-Kanfi et al. support a family of PrrC homologs whose substrate-recognition
    residues can differ from the Escherichia coli prototype.
- reference: PMID:16790566
  snippet: The differential conservation and consistent genetic linkage of the PrrC
    proteins with EcoprrI homologs portray them as a family of restriction RNases
    of diverse substrate specificities that are mobilized when an associated DNA restriction
    nuclease is compromised.
  notes: Blanga-Kanfi et al. support genetic linkage between PrrC proteins and EcoprrI
    homologs as a restriction-RNase family mobilized when an associated restriction
    nuclease is compromised.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'PrrC | 10\.1186/1743-422X-7-360 | Post-transcriptional control by bacteriophage
    T4: mRNA decay and inhibition of translation initiation'
  notes: The DefenseFinder article registry maps the named PrrC system to the Uzan
    et al. T4 post-transcriptional-control review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "PrrC\tPrrC\t2\t2\tPrrC__EcoprrI, PrrC__PrrC\tRM__Type_I_REases, RM__Type_I_S"
  notes: The DefenseFinder rules table models PrrC as a two-profile system requiring
