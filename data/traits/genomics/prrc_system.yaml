discussions:
- discussion_id: prrc-mechanism-gap
  prompt: Resolve natural PrrC homolog substrate specificity, exact EcoprrI accessory
    composition and profile matching, and phage trigger logic before minting narrower
    PrrC mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Uzan et al. summarize PrrC as a T4 phage-exclusion system, Blanga-Kanfi
    et al. support PrrC and EcoprrI homologs as genetically linked restriction RNases,
    and DefenseFinder models PrrC as a two-profile system with EcoprrI and PrrC markers
    plus type I restriction-modification accessories. The natural substrates, accessory
    composition, and phage trigger logic remain unresolved.
  attaches_to:
  - causal_graphs#prrc_locus_restricts_t4_phage
