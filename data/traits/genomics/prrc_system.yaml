identifier: traitmech:000364
label: PrrC system
definition: A phage defense system in which an organism possesses a PrrC locus represented
  by DefenseFinder as a two-profile model requiring PrrC__EcoprrI and PrrC__PrrC,
  with type I restriction-modification components accepted as accessory markers.
definition_source: DOI:10.1186/1743-422X-7-360
