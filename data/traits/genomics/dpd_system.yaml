identifier: traitmech:000278
label: Dpd system
definition: A phage defense system in which an organism possesses a Dpd genomic island
  whose dpdA-K genes install 7-deazaguanine derivatives into DNA and are modeled by
  DefenseFinder as a multi-profile Dpd system.
definition_source: DOI:10.1073/pnas.1518570113
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Dpd
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: dpdA-K
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1073/pnas.1518570113
evidence:
- reference: DOI:10.1073/pnas.1518570113
  snippet: 2'-deoxy-preQ0 and 2'-deoxy-7-amido-7-deazaguanosine in enzymatic hydrolysates
    of DNA extracted from the pathogenic, Gram-negative bacteria Salmonella enterica
    serovar Montevideo
  notes: Thiaville et al. experimentally detected 7-deazaguanine-derived DNA modifications
    in a bacterium carrying the Dpd island.
- reference: DOI:10.1073/pnas.1518570113
  snippet: rename the genes of the S. Montevideo cluster as dpdA-K for 7-deazapurine
    in DNA
  notes: Thiaville et al. name the S. Montevideo 7-deazapurine DNA-modification cluster
    as dpdA-K.
- reference: DOI:10.1073/pnas.1518570113
  snippet: the modifications were detected in DNA from other organisms containing
    these clusters, including Kineococcus radiotolerans, Comamonas testosteroni, and
    Sphingopyxis alaskensis
  notes: Thiaville et al. support treating Dpd as a recurrent bacterial system rather
    than a one-off S. Montevideo sequence feature.
- reference: DOI:10.1073/pnas.1518570113
  snippet: strongly suggests a restriction-modification role for the cluster in Enterobacteriaceae
  notes: Thiaville et al. connect the Dpd cluster to a likely restriction-modification
    role based on transformation efficiencies of modified and unmodified plasmids.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Dpd | 10\.1073/pnas\.1518570113 | Novel genomic island modifies DNA with
    7-deazaguanine derivatives
  notes: The DefenseFinder article registry maps the named Dpd system to the Thiaville
    et al. DNA-modification paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Dpd\tDpd\t4\t4\tDpd__DpdA, Dpd__DpdB, Dpd__DpdC, Dpd__DpdD, Dpd__DpdE,\
    \ Dpd__DpdF, Dpd__DpdG, Dpd__DpdH, Dpd__DpdI, Dpd__DpdJ, Dpd__DpdK"
  notes: The DefenseFinder rules table models Dpd as a multi-profile defense system
    requiring a subset of DpdA-K profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: Dpd__DpdA                                        | Dpd__DpdA                                        |
    Dpd
  notes: The DefenseFinder HMM inventory records DpdA in the Dpd model namespace.
