discussions:
- discussion_id: dpd-restriction-mechanism-gap
  prompt: Resolve Dpd restriction targets, phage specificity, and DpdA-K component
    functions before minting narrower Dpd mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Thiaville et al. support dpdA-K-dependent installation of 7-deazaguanine
    derivatives into DNA and a likely restriction-modification role, and DefenseFinder
    supports Dpd as a named multi-profile defense model. This first record does not
    yet resolve the universal restriction target, modified motif, antiphage substrate
    breadth, or the necessity of each profiled component across natural Dpd loci.
  attaches_to:
  - causal_graphs#dpd_dna_modification_defense
  posed_by: codex
  posed_date: '2026-09-19'
