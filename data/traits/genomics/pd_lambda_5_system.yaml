identifier: traitmech:000385
label: PD-Lambda-5 system
definition: A phage defense system in which an organism possesses a PD-Lambda-5 locus
  represented by DefenseFinder as a two-profile model, PD-Lambda-5__PD-Lambda-5_A
  and PD-Lambda-5__PD-Lambda-5_B, and experimentally linked to T2, T4, T6, LambdaVir,
  SECphi17, SECphi18, SECphi27, T3, and T7 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-Lambda-5
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
- synonym_text: PD-Lambda-5__PD-Lambda-5_A
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: PD-Lambda-5__PD-Lambda-5_B
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-Lambda-5 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
  snippet: PD-lambda-5 is a two-gene system identified in a P2-like prophage. It encodes
    a protein with a nuclease and a HEPN domain, and a predicted methyltransferase.
    It confers broad anti-phage defense and does not seem to mediate abortive infection.
  notes: The DefenseFinder wiki describes PD-Lambda-5 as a two-gene system from a
    P2-like prophage that can confer broad anti-phage defense.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
  snippet: PD-lambda-5 molecular mechanism has not been described to date.
  notes: The DefenseFinder wiki records the PD-Lambda-5 molecular mechanism as not
    yet described.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
  snippet: 'The PD-Lambda-5 is composed of 2 proteins: PD-Lambda-5_A and PD-Lambda-5_B.'
  notes: The DefenseFinder wiki names PD-Lambda-5 as a two-protein system with PD-Lambda-5_A
    and PD-Lambda-5_B.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
  snippet: The PD-Lambda-5 system in *Plantactinospora sp. BB1* (GCF_003030385.1,
    NZ_CP028159) is composed of 2 proteins PD-Lambda-5_A (WP_159104731.1) PD-Lambda-5_B
    (WP_199853739.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-Lambda-5 locus
    in RefSeq assembly GCF_003030385.1 on NZ_CP028159.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-5.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
