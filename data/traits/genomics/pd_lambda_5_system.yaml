discussions:
- discussion_id: pd-lambda-5-mechanism-gap
  prompt: Resolve PD-Lambda-5 natural host breadth, direct phage trigger, effector
    mechanism, and profile-to-protein correspondence before minting narrower PD-Lambda-5
    mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-Lambda-5 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T2, T4, T6, LambdaVir, SECphi17, SECphi18,
    SECphi27, T3, and T7, and DefenseFinder represents the system with two mandatory
    profiles. Natural host breadth, the direct phage trigger, effector logic, and
    exact profile-to-protein correspondence remain unresolved.
