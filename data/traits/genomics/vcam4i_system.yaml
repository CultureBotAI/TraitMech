identifier: traitmech:000514
label: VcaM4I system
definition: A type IV modification-dependent restriction system in which an organism
  possesses a VcaM4I-family locus encoding an EVE-HNH restriction endonuclease that
  recognizes 5-methylcytosine- or 5-hydroxymethylcytosine-modified DNA.
definition_source: DOI:10.1093/nar/gkaa1218
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: VcaM4I
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1093/nar/gkaa1218
  snippet: EVE domains belong to the PUA superfamily, and are present in MDREs in
    combination with HNH nuclease domains.
  notes: Mierzejewska et al. support the EVE-HNH architecture of VcaM4I-family modification-dependent
    restriction endonucleases.
- reference: DOI:10.1093/nar/gkaa1218
  snippet: Here, we present a biochemical characterization of the EVE-HNH endonuclease
    VcaM4I and crystal structures of the protein alone, with EVE domain bound to either
    5mC modified dsDNA or to 5mC/5hmC containing ssDNA.
  notes: Mierzejewska et al. biochemically characterized VcaM4I and solved structures
    of apo and modified-DNA-bound enzyme.
- reference: DOI:10.1093/nar/gkaa1218
  snippet: The EVE domain is moderately specific for 5mC/5hmC containing DNA according
    to EMSA experiments.
  notes: Mierzejewska et al. support VcaM4I EVE-domain recognition of 5mC/5hmC-containing
    DNA.
- reference: DOI:10.1093/nar/gkaa1218
  snippet: Removal of the EVE domain and inter-domain linker, but not of the EVE domain
    alone converts VcaM4I into a non-specific toxic nuclease.
  notes: Mierzejewska et al. support VcaM4I as a nuclease whose domain organization
    modulates toxic DNA cleavage.
- reference: DOI:10.1093/nar/gkaa1218
  snippet: The role of the key residues in the EVE and HNH domains of VcaM4I is confirmed
    by digestion and restriction assays with the enzyme variants that differ from
    the wild-type by changes to the base binding pocket or to the catalytic residues.
  notes: Mierzejewska et al. support the VcaM4I EVE base-binding pocket and HNH catalytic
    residues by digestion and restriction assays.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| VcaM4I | 10\.1093/nar/gkaa1218 | Crystal structures of the EVE-HNH endonuclease
    VcaM4I in the presence and absence of DNA | '
  notes: The pinned DefenseFinder article registry maps the VcaM4I source key to the
    Mierzejewska et al. structural paper.
