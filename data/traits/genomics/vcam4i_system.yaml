discussions:
- discussion_id: vcam4i-defensefinder-model-gap
  prompt: Resolve VcaM4I-family breadth, modified-cytosine sequence-context specificity
    across natural hosts, accession-level protein examples, and DefenseFinder RM_Type_IV
    HMM/rules mapping before minting narrower VcaM4I mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mierzejewska et al. support VcaM4I as an EVE-HNH modification-dependent
    restriction endonuclease that recognizes 5mC/5hmC DNA and validate EVE-domain
    modified-base binding plus HNH catalytic residues by digestion and restriction
    assays. The pinned DefenseFinder article registry maps VcaM4I to that paper, but
    the pinned HMM inventory and rules table have no exact VcaM4I rows. This first-pass
    record therefore does not resolve a reusable DefenseFinder profile model, exact
    accession-level protein examples, the breadth of VcaM4I-like systems across natural
    hosts, or the complete set of natural modified-cytosine sequence contexts.
