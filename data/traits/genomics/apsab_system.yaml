identifier: traitmech:000328
label: ApsAB system
definition: A genomics trait describing possession of an ApsAB anti-plasmid defense
  locus encoding the nuclease/helicase ApsA and Argonaute-like ApsB proteins that
  can destabilize high- and low-copy-number plasmids.
definition_source: DOI:10.1038/s41467-024-48219-y
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: ApsAB
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-024-48219-y
- synonym_text: apsAB
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-024-48219-y
evidence:
- reference: DOI:10.1038/s41467-024-48219-y
  snippet: a novel antiplasmid system ApsAB actively involved in pOXA-48 destabilization
  notes: Zongo et al. support ApsAB as a named anti-plasmid system involved in pOXA-48
    destabilization.
- reference: DOI:10.1038/s41467-024-48219-y
  snippet: We show that ApsAB targets high and low-copy number plasmids.
  notes: Zongo et al. support anti-plasmid activity against both high- and low-copy-number
    plasmids.
- reference: DOI:10.1038/s41467-024-48219-y
  snippet: ApsAB combines a nuclease/helicase protein and a novel type of Argonaute-like
    protein.
  notes: Zongo et al. support a two-component ApsAB system combining ApsA nuclease/helicase
    and Argonaute-like ApsB proteins.
- reference: DOI:10.1038/s41467-024-48219-y
  snippet: This confirmed that F3141-F3140 corresponds to a novel antiplasmid defense
    system that we renamed apsAB for antiplasmid system AB.
  notes: Zongo et al. support apsAB as the expanded name for the F3141-F3140 anti-plasmid
    defense locus.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: ApsAB | 10\.1038/s41467-024-48219-y | An antiplasmid system drives antibiotic
    resistance gene integration in carbapenemase-producing Escherichia coli lineages
  notes: The DefenseFinder article registry maps the named ApsAB system to the Zongo
    et al. Escherichia coli anti-plasmid-system paper; the pinned DefenseFinder HMM
    inventory and rules table do not list ApsAB, so this row is name-to-paper evidence
    rather than model-component evidence.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Zongo et al. identified ApsAB in ST38 Escherichia coli and found that homologous
    E. coli ApsAB-like systems also destabilized a ColE1 multicopy plasmid.
  reference: DOI:10.1038/s41467-024-48219-y
