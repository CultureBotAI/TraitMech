  source: DOI:10.1128/aem.60.4.1129-1136.1994
evidence:
- reference: PMID:16349225
  snippet: The abiA gene (formerly hsp) encodes an abortive phage infection mechanism
    which inhibits phage DNA replication.
  notes: Dinsmore and Klaenhammer describe abiA as the former hsp abortive-infection
    determinant and connect AbiA activity to inhibition of phage DNA replication.
- reference: PMID:16349225
  snippet: Three abiA-containing plasmids of various copy numbers were introduced
    into both strains, and the recombinants were evaluated for resistance to phages
    c2, p2, sk1, and phi31.
  notes: Dinsmore and Klaenhammer tested AbiA across two Lactococcus lactis strains
    and four lactococcal phages.
- reference: PMID:16349225
  snippet: Altering the gene dosage or expression level of abiA significantly affects
    the phage resistance levels.
  notes: Dinsmore and Klaenhammer show that AbiA dosage or expression modulates the
    strength of lactococcal phage resistance.
- reference: PMID:9661658
  snippet: The abiA gene encodes an abortive bacteriophage infection mechanism that
    can protect Lactococcus species from infection by a variety of bacteriophages
    including three unrelated phage species.
  notes: Dinsmore and Klaenhammer support AbiA as a broad lactococcal abortive-infection
    mechanism.
- reference: PMID:9661658
  snippet: the leucine repeat structure is essential for conferring phage resistance
    against three species of lactococcal bacteriophages.
  notes: Dinsmore and Klaenhammer connect residues in AbiA's leucine-repeat region
    to resistance against c2, sk1, and phi31.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiA | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiA model namespace to
    a lactococcal abortive-infection review.
