identifier: traitmech:000344
label: AbiA system
definition: An abortive infection system in which an organism possesses an AbiA-family
  locus whose copy number or expression modulates Lactococcus lactis resistance to
  multiple phages and that DefenseFinder represents with AbiA_large or AbiA_small
  model subrules.
definition_source: DOI:10.1128/aem.60.4.1129-1136.1994
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
