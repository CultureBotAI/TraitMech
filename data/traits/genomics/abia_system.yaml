discussions:
- discussion_id: abia-defensefinder-subrule-gap
  prompt: Resolve the AbiA_large and AbiA_small system boundaries, phage trigger,
    direct DNA-replication target, and molecular effector output before minting narrower
    AbiA mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Dinsmore and Klaenhammer support AbiA as a lactococcal abortive-infection
    determinant whose copy number or expression changes phage resistance and whose
    leucine-repeat region is required for activity against multiple phage species.
    DefenseFinder models AbiA through AbiA_large and AbiA_small subrules, but this
    first system-level record leaves those subrules' natural locus boundaries, the
    direct phage trigger, the molecular effector output, the exact phage-DNA-replication
    target, and phage escape routes unresolved.
  evidence:
  - reference: PMID:16349225
    snippet: The abiA gene (formerly hsp) encodes an abortive phage infection mechanism
      which inhibits phage DNA replication.
    notes: Dinsmore and Klaenhammer describe abiA as the former hsp abortive-infection
      determinant and connect AbiA activity to inhibition of phage DNA replication.
  - reference: PMID:9661658
    snippet: the leucine repeat structure is essential for conferring phage resistance
      against three species of lactococcal bacteriophages.
    notes: Dinsmore and Klaenhammer identify an AbiA leucine-repeat region needed
      for phage resistance.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "AbiA\tAbiA_large\t1\t1\tAbiA_large__AbiA_large"
    notes: The DefenseFinder rules table models one AbiA subrule as the single-profile
