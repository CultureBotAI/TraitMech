discussions:
- discussion_id: scomcra-defensefinder-model-gap
  prompt: Resolve ScoMcrA-family breadth, phosphorothioated-DNA sequence-context specificity
    across natural hosts, methylated-DNA target breadth, accession-level protein examples,
    and DefenseFinder RM_Type_IV HMM/rules mapping before minting narrower ScoMcrA
    mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Liu et al. support ScoA3McrA as a Type IV McrA homolog that cleaves S-modified
    DNA in vitro and support ScoMcrA as a PT-dependent endonuclease with a sulfur-binding
    domain. The pinned DefenseFinder article registry maps ScoMcrA to the sulfur-recognition
    paper, but the pinned HMM inventory and rules table have no exact ScoMcrA rows.
    This first-pass record therefore does not resolve a reusable DefenseFinder profile
    model, exact accession-level protein examples, the breadth of ScoMcrA-like systems
    across natural hosts, the complete set of natural phosphorothioated-DNA contexts,
    or the breadth of methylated-DNA target contexts.
  evidence:
