identifier: traitmech:000512
label: ScoMcrA system
definition: A type IV modification-dependent restriction system in which an organism
  possesses a ScoMcrA-family locus encoding a sulfur-binding-domain phosphorothioated-DNA
  restriction endonuclease.
definition_source: DOI:10.1038/s41467-018-07093-1
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: ScoMcrA
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1371/journal.pgen.1001253
  snippet: A His-tagged derivative of ScoA3McrA cleaved S-modified DNA and also Dcm-methylated
    DNA in vitro near the respective modification sites.
  notes: Liu et al. support ScoA3McrA cleavage of phosphorothioated DNA and Dcm-methylated
    DNA.
- reference: DOI:10.1371/journal.pgen.1001253
  snippet: Double-strand cleavage occurred 16-28 nucleotides away from the phosphorothioate
    links.
  notes: Liu et al. support double-strand ScoA3McrA cleavage near DNA phosphorothioate
    linkages.
- reference: DOI:10.1371/journal.pgen.1001253
  snippet: This is the first report of in vitro endonuclease activity of a McrA homologue
    and also the first demonstration of an enzyme that specifically cleaves S-modified
    DNA.
  notes: Liu et al. frame ScoA3McrA as a McrA homolog with phosphorothioated-DNA-specific
    cleavage activity.
- reference: DOI:10.1038/s41467-018-07093-1
  snippet: Here we present the crystal structure of the sulfur-binding domain (SBD)
    from the DNA phosphorothioation (PT)-dependent restriction endonuclease ScoMcrA.
  notes: Liu et al. support ScoMcrA as a phosphorothioated-DNA-dependent restriction
    endonuclease with a sulfur-binding domain.
- reference: DOI:10.1038/s41467-018-07093-1
  snippet: We show that three of these homologs bind PT-DNA in vitro and restrict
    PT-DNA gene transfer in vivo.
  notes: Liu et al. support SBD homologs as phosphorothioated-DNA readers with in
    vivo PT-DNA restriction activity.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| ScoMcrA | 10\.1038/s41467-018-07093-1 | Structural basis for the recognition
    of sulfur in phosphorothioated DNA | '
  notes: The pinned DefenseFinder article registry maps the ScoMcrA source key to
    the Liu et al. sulfur-recognition paper.
