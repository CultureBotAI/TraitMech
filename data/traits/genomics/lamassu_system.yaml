discussions:
- discussion_id: lamassu-subtype-and-effector-gap
  prompt: Resolve Lamassu subtype architecture, effector diversity, and viral-DNA
    trigger specificity before minting narrower Lamassu mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Haudiquet et al. support a structurally characterized Vibrio cholerae
    Lamassu Vc-Cap4 system with LmuABC DNA-end sensing and LmuA Cap4 nuclease activation,
    but the first TraitRecord stays at the system level until separate review resolves
    long-versus-short LmuB clades, LmuC-independent subfamilies, effector-domain diversity,
    viral DNA triggers, and cell-death outputs across Lamassu loci.
