identifier: traitmech:000232
label: Lamassu system
definition: A phage defense system in which an organism possesses a Lamassu locus
  built around a conserved SMC-like LmuB sensor paired with a modular LmuA effector
  and subfamily-specific partner architecture, enabling viral-DNA sensing and effector-mediated
  antiviral activity.
definition_source: DOI:10.1073/pnas.2519643122
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Lamassu
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1073/pnas.2519643122
evidence:
- reference: DOI:10.1126/science.aar4120
  snippet: Lamassu LmuAB pfam14130, pfam02463 SMC ATPase N-terminal domain 697 682
    (1.3%)
  notes: Doron et al. reported Lamassu/LmuAB as an SMC-ATPase-linked system in their
    pangenome-scale antiphage-system discovery screen.
- reference: DOI:10.1073/pnas.2519643122
  snippet: Lamassu is a widespread antiviral system in bacteria that uses structural
    maintenance of chromosomes-like proteins
  notes: Haudiquet et al. support defining Lamassu as a recurring bacterial antiviral
    system with an SMC-like component.
- reference: DOI:10.1073/pnas.2519643122
  snippet: a bacterial immune system family featuring diverse effectors but a core
    conserved SMC-like sensor
  notes: Haudiquet et al. support placing Lamassu at the family level rather than
    defining a single effector subtype.
- reference: DOI:10.1073/pnas.2519643122
  snippet: It comprises LmuB, an SMC-like protein, LmuC, a small protein with a domain
    of unknown function, and LmuA
  notes: Haudiquet et al. support the LmuA/LmuB/LmuC composition of the structurally
    characterized Lamassu Vc-Cap4 branch.
- reference: DOI:10.1073/pnas.2519643122
  snippet: Lamassu specifically senses dsDNA ends in vitro and phage replication origins
    in vivo
  notes: Haudiquet et al. connect Lamassu to direct DNA-end and phage replication
    origin sensing.
- reference: DOI:10.1073/pnas.2519643122
  snippet: triggering the formation of LmuA tetramers that activate its Cap4 nuclease
    domain
  notes: Haudiquet et al. connect viral-DNA sensing to LmuA tetramer formation and
    Cap4 nuclease-domain activation in Lamassu Vc-Cap4.
