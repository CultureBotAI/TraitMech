discussions:
- discussion_id: fs-hepn-tm-mechanism-gap
  prompt: Resolve FS_HEPN_TM natural hosts, helper-phage triggers, HEPN-family substrates,
    and transmembrane partner activity before minting narrower FS_HEPN_TM mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Fillol-Salom et al. support phage-inducible chromosomal islands as carriers
    of defense systems that provide broad immunity, and DefenseFinder models FS_HEPN_TM
    as a two-profile HEPN/transmembrane system. Its exact natural host breadth, helper-phage
    trigger, substrate, and profile-to-activity mapping remain unresolved.
