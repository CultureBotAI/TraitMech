    and final Science Tables S6/S7/S8 map it to one product accession, a Bas50 phage
    readout, one DUF2971 HHpred-domain row, and display name DS-45. The pinned DefenseFinder
    HMM inventory records one DS-45 custom profile row. The pinned rules table has
    no DS-45 row, and the first-pass record does not resolve native host breadth,
    complete phage breadth, direct profile-to-protein correspondence, molecular output,
    or endogenous DS-45 activity.
