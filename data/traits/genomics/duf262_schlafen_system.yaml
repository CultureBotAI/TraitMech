identifier: traitmech:000530
label: DUF262 Schlafen system
definition: A phage defense system in which an organism possesses a genome-encoded,
  DUF262-associated prokaryotic Schlafen nuclease locus.
definition_source: DOI:10.1038/s41564-026-02277-8
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
