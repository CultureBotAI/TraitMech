evidence:
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: prokaryotic Schlafen nucleases are widespread antiviral effectors that
    protect bacteria from bacteriophages and are fused to a diverse array of phage-sensing
    domains.
  notes: Perez Taboada et al. support bacterial prokaryotic Schlafen nucleases as
    antiviral effectors fused to phage-sensing domains.
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: We expressed seven Enterobacterales Schlafen systems in Escherichia coli,
    identifying two that confer defence against coliphages.
  notes: Perez Taboada et al. cloned candidate Enterobacterales Schlafen systems into
    E. coli and observed coliphage defense for two of them.
