evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-Lambda-6 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-6.md
  snippet: 'The PD-Lambda-6 is composed of 1 protein: PD-Lambda-6.'
  notes: The DefenseFinder wiki names PD-Lambda-6 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-6.md
  snippet: 'The PD-Lambda-6 system in *Enterobacter asburiae* (GCF_013782005.1, NZ_CP056126)
    is composed of 1 protein: PD-Lambda-6 (WP_181599444.1)'
  notes: The DefenseFinder wiki illustrates a predicted one-protein PD-Lambda-6 locus
    in RefSeq assembly GCF_013782005.1 on NZ_CP056126.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-6.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
    \ et al., 2022</a>] --> Origin_0\n    Origin_0[Escherichia coli \n<a href='https://ncbi.nlm.nih.gov/protein/RRK48647.1'>RRK48647.1</a>]\
    \ --> Expressed_0[Escherichia coli]\n    Expressed_0[Escherichia coli] ----> LambdaVir\
    \ & T5"
  notes: The DefenseFinder experimental-validation diagram links Vassallo et al. to
