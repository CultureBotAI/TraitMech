identifier: traitmech:000383
label: PD-Lambda-6 system
definition: A phage defense system in which an organism possesses a PD-Lambda-6 locus
  represented by DefenseFinder as a single-profile model, PD-Lambda-6__PD-Lambda-6,
  and experimentally linked to LambdaVir and T5 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-6.md
trait_category: GENOMICS
term_kind: CLASS
