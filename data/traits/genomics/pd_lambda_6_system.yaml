discussions:
- discussion_id: pd-lambda-6-mechanism-gap
  prompt: Resolve PD-Lambda-6 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-Lambda-6 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-Lambda-6 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against LambdaVir and T5, and DefenseFinder represents
    the system with one profile. Natural host breadth, the direct phage trigger, and
    effector logic remain unresolved.
  evidence:
  - reference: DOI:10.1038/s41564-022-01219-4
