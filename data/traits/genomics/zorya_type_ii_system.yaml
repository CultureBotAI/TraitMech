discussions:
- discussion_id: zorya-type-ii-activity-gap
  prompt: Resolve Zorya_TypeII phage triggers, native host breadth, ZorE nuclease
    targets, ZorAB-to-ZorE activation, and profile-to-activity criteria before minting
    enzyme, trigger, or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mariano et al. support ZorE dependence for type II Zorya anti-phage activity,
    and the pinned DefenseFinder HMM inventory and rules table support Zorya_TypeII
    as a subtype with Zorya_TypeII__ZorE, Zorya__ZorA2, and Zorya__ZorB profiles.
    This first-pass record leaves exact phage triggers, native hosts, profile-to-component
    correspondence, ion usage, anti-defense escape, and ZorE nuclease outputs unresolved.
  evidence:
  - reference: DOI:10.1038/s41467-025-57397-2
    snippet: For Zorya II, anti-phage activity requires the presence of the ZorE effector,
      which we show is recruited by ZorAB
