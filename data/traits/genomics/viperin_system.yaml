identifier: traitmech:000263
label: Viperin system
definition: A phage defense system in which an organism possesses a prokaryotic viperin
  locus represented by a pVip profile that can produce antiviral modified ribonucleotides
  and protect against phage infection.
definition_source: DOI:10.1038/s41586-020-2762-2
