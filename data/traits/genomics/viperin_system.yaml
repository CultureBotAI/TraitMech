discussions:
- discussion_id: viperin-product-and-subtype-gap
  prompt: Resolve Viperin nucleotide products, accessory genes, and phage-target breadth
    before minting narrower Viperin mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Bernheim et al. support prokaryotic viperins as phage-protective producers
    of modified ribonucleotides, and DefenseFinder models Viperin through the pVip
    profile, but Viperin-family loci need separate review before TraitMech asserts
    one universal antiviral nucleotide, polymerase target, or accessory-gene architecture.
  attaches_to:
