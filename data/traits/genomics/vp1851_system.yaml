identifier: traitmech:000491
label: VP1851 system
definition: A phage defense system in which an organism possesses a VP1851-family
  locus represented by the DefenseFinder VP1851__VP1851 custom HMM profile and experimentally
  linked to reduced bacteriophage plaquing when the cloned Vibrio parahaemolyticus
  RIMD 2210633 vp1851 cassette is expressed from a VSV105 plasmid.
