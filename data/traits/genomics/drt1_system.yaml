discussions:
- discussion_id: drt1-profile-activity-gap
  prompt: Resolve the DRT1 reverse-transcriptase products, direct phage trigger, host
    breadth, partner-feature requirements, and DRT_1__drt1a/DRT_1__drt1b profile-to-activity
    criteria before minting DRT1 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated reverse transcriptases as a broad
    antiphage-system family, and the pinned DefenseFinder HMM inventory and rules
    table support DRT_1 as a DRT subsystem with two mandatory profiles. This first-pass
    record leaves the exact DRT1 RT products, phage trigger, host breadth, partner-feature
    requirements, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1126/science.aba0372
    snippet: We discovered that a family of uncharacterized reverse transcriptases
      (RTs) are active defense systems
    notes: Gao et al. experimentally support defense-associated reverse transcriptases
      as active antiphage systems.
  - reference: DOI:10.1126/science.aba0372
    snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA,
      where x is any amino acid] abolished activity
    notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
      active-site residues.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| DRT_1__drt1a                                     | DRT_1__drt1a                                     |
