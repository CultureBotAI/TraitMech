identifier: traitmech:000235
label: Retron system
definition: A phage defense system in which an organism possesses a retron locus encoding
  a reverse transcriptase, an msr/msd non-coding RNA that yields multicopy single-stranded
  DNA, and an associated effector whose activation can inhibit bacteriophage propagation
  through abortive infection.
definition_source: DOI:10.1016/j.cell.2020.09.065
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
evidence:
- reference: DOI:10.1016/j.cell.2020.09.065
  snippet: We report that retrons function as anti-phage defense systems
  notes: Millman et al. support retrons as experimentally observed antiphage defense
    systems rather than only retroelement sequence features.
- reference: DOI:10.1016/j.cell.2020.09.065
  snippet: 'The defensive unit is composed of three components: the RT, the ncRNA,
    and an effector protein'
  notes: Millman et al. support defining the broad record around a reverse transcriptase,
    non-coding RNA, and associated effector rather than a bare reverse-transcriptase
    gene.
- reference: DOI:10.1016/j.cell.2020.09.065
  snippet: We examined multiple retron systems and show that they confer defense against
    a broad range of phages via abortive infection
  notes: Millman et al. support treating Retron system as a family of organism-level
    antiphage traits, with abortive infection as a shared defense output.
- reference: DOI:10.1016/j.cell.2020.09.065
  snippet: retrons, functioning together with their associated effector genes, form
    anti-phage defense systems
  notes: Millman et al. connect associated effector genes to Retron antiphage function.
- reference: DOI:10.1038/s41586-022-05091-4
  snippet: RcaT is neutralized by the reverse transcriptase–msDNA antitoxin complex,
    and becomes active upon perturbation of msDNA biosynthesis
  notes: Bobonis et al. support an RcaT-containing Retron-Sen2 example in which the
    reverse-transcriptase-msDNA complex controls effector activity.
- reference: DOI:10.1038/s41586-022-05091-4
  snippet: we identified multiple trigger and blocker proteins of phage origin
  notes: Bobonis et al. support phage-encoded trigger and blocker logic for the characterized
    Retron-Sen2 RcaT system.
- reference: DOI:10.1038/s41586-022-05091-4
  snippet: phage-related triggers directly modify the msDNA, thereby activating RcaT
    and inhibiting bacterial growth
  notes: Bobonis et al. connect phage-triggered msDNA modification to RcaT activation
    in Retron-Sen2 without making that trigger universal across all retrons.
- reference: DOI:10.1038/s41586-022-05091-4
  snippet: retron toxin–antitoxin systems act as abortive infection anti-phage defence
    systems
  notes: Bobonis et al. support retron toxin-antitoxin systems as abortive-infection
    antiphage systems.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Millman et al. cloned E. coli Ec48 and Ec73 retrons with their predicted effector
    genes into E. coli MG1655 and showed that both engineered E. coli systems had
    broad antiphage activity that depended on reverse-transcriptase catalytic-site
    residues.
  reference: DOI:10.1016/j.cell.2020.09.065
causal_graphs:
- graph_id: retron_msdna_effector_abortive_defense
  title: Retrons couple msDNA complexes to effector activation
  description: Evidence-backed process sketch linking a complete retron locus to RT/ncRNA-dependent
    msDNA biosynthesis, control of associated effectors, abortive-infection outputs,
    and inhibition of phage growth.
  scope_status: NONMECHANISTIC
  scope_notes: The graph stays at the retron family level and uses the Ec48 RecBCD-guarding
    and Retron-Sen2 RcaT mechanisms as characterized examples without asserting one
    universal effector fold, phage trigger, direct msDNA-modification event, guarded
    host target, or Retron-Septu release architecture across all retron antiphage
    loci.
