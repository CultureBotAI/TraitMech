discussions:
- discussion_id: retron-effector-trigger-gap
  prompt: Resolve retron effector, phage-trigger, and hybrid-system diversity before
    minting narrower Retron-Sen2, Ec48, or Retron-Septu mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. support multiple RT/ncRNA/effector retron systems as abortive-infection
    antiphage systems, and Bobonis et al. resolve the Retron-Sen2 RcaT example in
    which a reverse-transcriptase-msDNA antitoxin complex responds to phage-triggered
    msDNA modification. The first TraitRecord therefore stays at the broad retron-system
    level until separate subtype review resolves which effectors, guarded host targets,
    phage triggers, direct-msDNA modification steps, and Septu-coupled architectures
    apply across each retron family.
