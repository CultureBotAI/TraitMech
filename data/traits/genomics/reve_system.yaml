identifier: traitmech:000499
label: Reve system
definition: A phage defense system in which an organism possesses a single-gene Reve
  antiviral locus that is encoded by P4-like phage satellites and can protect bacteria
  from bacteriophage infection.
definition_source: DOI:10.1093/nar/gkag898
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
