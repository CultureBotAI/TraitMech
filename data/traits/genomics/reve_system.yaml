  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkag898
evidence:
- reference: DOI:10.1093/nar/gkag898
  snippet: The Reve system is another single-gene system, with ATPase and KAP family
    P-loop domains
  notes: de Sousa et al. identify Reve as a single-gene P4 defense system with ATPase
    and KAP-family P-loop domain annotations.
- reference: DOI:10.1093/nar/gkag898
  snippet: with most (e.g. Bandua, Aernus, Toga, and Reve) providing strong protection
    against phages of different families
  notes: de Sousa et al. identify Reve among the novel P4-associated systems that
    provided strong protection against phage challenge.
- reference: DOI:10.1093/nar/gkag898
  snippet: Our experimental validation of anti-phage activity for 13 novel systems
    encoded by P4 confirms
  notes: de Sousa et al. summarize the validated P4-encoded novel-system cohort in
    their discussion.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Reve | 10\.64898/2026\.02\.27\.708500 | Shuttling, swapping and mixing:
    the rapid modular evolution of antiviral repertoires in temperate phages and their
    satellites | '
  notes: The pinned DefenseFinder article registry maps the Reve source key to the
    de Sousa et al. P4/P2 antiviral-repertoire paper preprint.
