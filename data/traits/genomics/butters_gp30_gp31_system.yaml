evidence:
- reference: DOI:10.1128/mSystems.00534-20
  snippet: we unveil a novel defense mechanism in cluster N prophage Butters
  notes: Mageeney et al. identify the Butters prophage as encoding a new heterotypic
    phage-defense mechanism.
- reference: DOI:10.1128/mSystems.00534-20
  snippet: we show that Butters genes located in the central region of the genome
    play a key role in the defense against heterotypic viral attack
  notes: Mageeney et al. support central Butters genes as contributors to prophage-mediated
    antiviral defense.
- reference: DOI:10.1128/mSystems.00534-20
  snippet: Our study suggests that a two-component system, articulated by interactions
    between protein products of genes 30 and 31, confers defense against heterotypic
    phage infection by PurpleHaze (cluster A/subcluster A3) or Alma (cluster A/subcluster
    A9)
  notes: Mageeney et al. connect Butters genes 30 and 31 to a two-component system
    that defends against PurpleHaze and Alma phage infection.
