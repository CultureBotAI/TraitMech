identifier: traitmech:000298
label: Butters gp30-gp31 system
definition: A phage defense system in which an organism possesses a Butters gp30-gp31
  locus that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1128/mSystems.00534-20
trait_category: GENOMICS
term_kind: CLASS
