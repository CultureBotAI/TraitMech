discussions:
- discussion_id: butters_gp30_gp31-mechanism-gap
  prompt: Resolve the Butters gp30 biochemical output, the gp31 modulatory role, the
    gp30-gp31 stoichiometry, the direct PurpleHaze or Alma trigger, the Island3 gp30-independent
    defense, and homolog breadth before minting narrower Butters gp30-gp31 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mageeney et al. and DefenseFinder support Butters gp30-gp31 as a named
    anti-phage system with Butters gp30 and gp31 profiles, but the direct phage trigger,
    gp30 biochemical output, gp31 modulatory activity, stoichiometry of the possible
    gp30-gp31 complex, gp30-independent Island3-targeting defense, and relationship
    to CarolAnn and Sbash homologous systems are not resolved enough here to assert
    a narrower mechanistic child trait.
  attaches_to:
