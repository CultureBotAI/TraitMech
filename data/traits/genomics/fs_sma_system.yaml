discussions:
- discussion_id: fs-sma-mechanism-gap
  prompt: Resolve FS_Sma natural hosts, helper-phage triggers, Sma component identity,
    and effector activity before minting narrower FS_Sma mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Fillol-Salom et al. support phage-inducible chromosomal islands as carriers
    of defense systems that provide broad immunity, and DefenseFinder models FS_Sma
    as a single-profile system. Its exact natural host breadth, helper-phage trigger,
    component identity, and profile-to-activity mapping remain unresolved.
  attaches_to:
