identifier: traitmech:000418
label: HEC-03 system
definition: A phage defense system in which an organism possesses the two-gene HEC-03
  Hma-embedded candidate locus, encoding an ABC ATPase and an associated PilT N-terminal
  domain protein, that can reduce bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: HEC-03
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1101/2024.01.29.577857
evidence:
- reference: DOI:10.1101/2024.01.29.577857
  snippet: The candidate systems encoded diverse protein families, including three
    ATPases associated with either a topoisomerase-primase (TOPRIM) (HEC-01), nuclease-related
    (NERD) (HEC-02), or PilT N-terminal (PIN) (HEC-03) domain-containing protein
  notes: Payne et al. identify HEC-03 as a candidate two-gene Hma-embedded antiviral
    system pairing an ATPase with a PilT N-terminal-domain protein.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: A quantitative assessment of the remaining systems showed that these were
    able to reduce the EOP of at least two phages by several orders of magnitude compared
    to the control
  notes: Payne et al. support reduced plaquing for the active Hma-embedded candidate
    systems after excluding inactive HEC-01 and HEC-09 candidates.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: For the two-gene systems HEC-02 and HEC-03, both genes were required for
    defence
  notes: Payne et al. show that both genes in the two-gene HEC-03 candidate system
    were required for defense.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| HEC-03 | 10\.1101/2024\.01\.29\.577857 | New antiviral defences are
    genetically embedded within prokaryotic immune systems |'
  notes: The pinned DefenseFinder article registry maps the HEC-03 source key to the
    Payne et al. Hma-embedded-candidate preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| HEC-03__HEC-03A                                  |                                                  |
    HEC-03                 | Custom                  | 50     |'
  notes: The pinned DefenseFinder HMM inventory records HEC-03__HEC-03A as a custom
