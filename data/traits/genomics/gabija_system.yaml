identifier: traitmech:000215
label: Gabija system
definition: A genomics trait describing possession of a Gabija antiphage defense locus
  whose GajA and GajB proteins assemble into a complex that inhibits bacteriophage
  replication.
definition_source: DOI:10.1093/nar/gkad951
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Gabija anti-phage defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkad951
- synonym_text: Gabija anti-phage defence system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-023-06855-2
evidence:
- reference: DOI:10.1093/nar/gkad951
  snippet: Gabija is one of the most abundant prokaryotic antiviral systems and consists
    of two proteins, GajA and GajB
  notes: Oh et al. support defining Gabija at the two-component antiviral-system level.
- reference: DOI:10.1093/nar/gkad951
  snippet: The Gabija anti-phage defense system was first identified in Bacillus cereus
    and is present in >4000 prokaryotic genomes
  notes: Oh et al. support B. cereus as the source organism for the Gabija system
    and support broad prokaryotic distribution.
- reference: DOI:10.1016/j.chom.2023.06.014
  snippet: synergy between GajA-mediated DNA cleavage and nucleotide hydrolysis by
    GajB initiates efficient abortive infection defense against virulent bacteriophages
  notes: Cheng et al. support the combined DNA-cleavage and nucleotide-depletion output
    of the Gabija complex.
- reference: DOI:10.1038/s41586-023-06855-2
  snippet: Two sets of Gabija protein B (GajB) dimers dock at opposite sides of the
    complex and create a 4:4 GajA-GajB assembly (hereafter, GajAB) that is essential
    for phage resistance in vivo
  notes: Antine et al. support the GajAB complex as essential for Gabija-mediated
    phage resistance.
canonical_examples:
- taxon_id: NCBITaxon:1396
  taxon_label: Bacillus cereus
  note: Oh et al. report that the Gabija anti-phage defense system was first identified
    in Bacillus cereus and characterize GajB from the B. cereus VD045 Gabija system.
  reference: DOI:10.1093/nar/gkad951
