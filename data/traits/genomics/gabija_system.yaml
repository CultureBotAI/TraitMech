discussions:
- discussion_id: gabija-activation-and-antidefense-gap
  prompt: Resolve Gabija activation, stoichiometry, cell-outcome, and phage anti-defense
    breadth before minting narrower Gabija mechanistic children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Cheng et al. support nucleotide depletion and DNA cleavage as Gabija
    outputs, and Antine et al. support GajAB complex assembly plus Gad1-mediated inhibition,
    but Gabija family members need separate review before TraitMech asserts one universal
    trigger, exact GajA:GajB stoichiometry, host death program, DNA substrate, or
    anti-Gabija phage inhibitor.
