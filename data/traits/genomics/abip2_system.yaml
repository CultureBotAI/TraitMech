discussions:
- discussion_id: abip2-ug-abi-mechanism-gap
  prompt: Resolve the AbiP2 natural locus breadth, phage trigger, protein-primed polymerase
    output, and growth-arrest or cell-death route before minting narrower AbiP2 mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Odegrip et al. support a P2-like-coliphage reverse transcriptase gene
    that blocks phage T5 infection, Mestre et al. describe the UG/Abi reverse-transcriptase
    family, the FEMS review places AbiP2 in that family rather than the unrelated
    lactococcal AbiP family, Figiel et al. structurally characterize Abi-P2 as a template-independent
    Abi polymerase, and DefenseFinder represents AbiP2 with a mandatory AbiP2__AbiP2
    profile. This first system-level record therefore leaves the direct phage trigger,
    in vivo DNA product, exact relationship to broader UG/Abi systems, prophage host
    breadth, and growth-arrest or cell-death route unresolved.
  evidence:
  - reference: DOI:10.1128/JB.188.4.1643-1647.2006
    snippet: The product of one of them exhibits reverse transcriptase activity and
      blocks infection of phage T5
    notes: The Odegrip et al. abstract supports a reverse-transcriptase gene in the
      P2-like-coliphage TO region that blocks phage T5.
  - reference: DOI:10.1093/nar/gkac467
    snippet: 'UG/Abi: a highly diverse family of prokaryotic reverse transcriptases
      associated with defense functions'
    notes: Mestre et al. describe the broad UG/Abi reverse-transcriptase family that
      the FEMS review places AbiP2 within.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: UG)/Abi RT group, which also includes AbiP2 from E. coli and other predicted
      RTs
    notes: The FEMS review explicitly places AbiP2 among UG/Abi reverse transcriptases
      rather than the unrelated lactococcal AbiP membrane-protein system.
  - reference: DOI:10.1093/nar/gkac772
    snippet: 'two Abi polymerases: AbiK and Abi-P2'
    notes: Figiel et al. structurally characterize Abi-P2 as a template-independent
      Abi polymerase but do not resolve the in vivo phage trigger or infected-cell
      output.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "AbiP2\tAbiP2\t1\t1\tAbiP2__AbiP2\t\t\t"
    notes: The DefenseFinder rules table models AbiP2 as a one-component system requiring
      the AbiP2__AbiP2 profile.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| AbiP2__AbiP2                                     | AbiP2__AbiP2                                     |
      AbiP2                  | Custom                  | 400    |'
    notes: The DefenseFinder HMM inventory records AbiP2__AbiP2 under the AbiP2 model
      namespace.
