identifier: traitmech:000343
label: AbiP2 system
definition: An abortive infection system in which an organism possesses a single-component
  AbiP2-family reverse-transcriptase-like locus represented by DefenseFinder as a
  mandatory AbiP2__AbiP2 profile.
definition_source: DOI:10.1128/JB.188.4.1643-1647.2006
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
