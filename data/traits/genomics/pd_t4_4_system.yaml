identifier: traitmech:000389
label: PD-T4-4 system
definition: A phage defense system in which an organism possesses a PD-T4-4 locus
  represented by DefenseFinder as a two-profile model requiring PD-T4-4__PD-T4-4_A
  and PD-T4-4__PD-T4-4_B, and experimentally linked to T2, T4, T6, and SECphi17 protection
  when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T4-4
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
- synonym_text: PD-T4-4__PD-T4-4_A
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: PD-T4-4__PD-T4-4_B
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T4-4 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
  snippet: PD-T4-4 is a defense system composed of two proteins, a P-loop NTPase and
    a nuclease, that is most likely protecting the bacterial population through abortive
    infection. It was identified from an ICE in an *E. coli* genome.
  notes: The DefenseFinder wiki describes PD-T4-4 as a two-protein system from an
    E. coli integrative and conjugative element.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
  snippet: 'The PD-T4-4 is composed of 2 proteins: PD-T4-4_A and PD-T4-4_B.'
  notes: The DefenseFinder wiki names PD-T4-4 as a two-protein system with PD-T4-4_A
    and PD-T4-4_B components.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
  snippet: The PD-T4-4 system in *Thiothrix subterranea* (GCF_016772315.1, NZ_CP053482)
    is composed of 2 proteins PD-T4-4_A (WP_202716711.1) PD-T4-4_B (WP_202716712.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-T4-4 locus
    in RefSeq assembly GCF_016772315.1 on NZ_CP053482.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
    \ et al., 2022</a>] --> Origin_0\n    Origin_0[Escherichia coli \n<a href='https://ncbi.nlm.nih.gov/protein/RCO57999.1'>RCO57999.1</a>,\
    \ <a href='https://ncbi.nlm.nih.gov/protein/RCO57988.1'>RCO57988.1</a>] --> Expressed_0[Escherichia\
    \ coli]\n    Expressed_0[Escherichia coli] ----> T2 & T4 & T6 & SECphi17"
  notes: The DefenseFinder experimental-validation diagram links Vassallo et al. to
    an E. coli PD-T4-4 source locus expressed in E. coli against T2, T4, T6, and SECphi17.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-4.md
  snippet: "subgraph Title4[Protects against]\n        T2\n        T4\n        T6\n\
    \        SECphi17"
  notes: The DefenseFinder experimental-validation diagram lists T2, T4, T6, and SECphi17
