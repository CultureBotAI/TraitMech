discussions:
- discussion_id: pd-t4-4-mechanism-gap
  prompt: Resolve PD-T4-4 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-T4-4 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T4-4 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T2, T4, T6, and SECphi17, and DefenseFinder
    represents the system with two mandatory profiles. Natural host breadth, the direct
    phage trigger, and direct effector logic remain unresolved, so the likely abortive-infection
    hypothesis is left unmodeled.
  evidence:
  - reference: DOI:10.1038/s41564-022-01219-4
    snippet: Here we developed an experimental selection scheme agnostic to genomic
      context to identify defence systems in 71 diverse E. coli strains. Our results
      unveil 21 conserved defence systems, none of which were previously detected
      as enriched in defence islands.
    notes: Vassallo et al. developed the agnostic E. coli pangenome selection that
      uncovered PD-T4-4 and related conserved phage-defense systems.
