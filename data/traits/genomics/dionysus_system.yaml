identifier: traitmech:000330
label: Dionysus system
definition: A phage defense system in which an organism possesses a three-gene Dionysus
  locus encoding DinA, DinB, and DinC components that can block jumbo-phage infection.
definition_source: DOI:10.1101/2025.09.30.679545
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Dionysus
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1101/2025.09.30.679545
evidence:
- reference: DOI:10.1101/2025.09.30.679545
  snippet: 'From over 500 candidate defense systems, we selected nine for experimental
    testing and validated three: Dionysus, a TerB-encoding system that disrupts early
    phage infection vesicle formation by Jumbo phages; Ophion, a Radical SAM-containing
    system that prevents the formation of the Jumbo phage nucleus; and Ambrosia, a
    tightly regulated RM-like system.'
  notes: Keesman et al. named Dionysus among three modular phage-defense candidates
    validated experimentally from an initial pool of more than 500 candidates.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: 'Dionysus is named after the god associated with winemaking and the celebration
    of life. This defense system consists of three genes encoding: DinA, featuring
    a merozoite adhesive erythrocyte binding protein (MAEBL) and a transmembrane (TM)
    domain; DinB, a TerB-like protein; and DinC, a pore-forming toxin (PFT) with four
    TM domains'
  notes: Keesman et al. support Dionysus as a three-gene defense system encoding DinA,
    DinB, and DinC components.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Both Dionysus and Ophion specifically block infection by jumbo phages,
    which have evolved specialized compartments to protect their DNA from DNA-targeting
    host defenses
  notes: Keesman et al. support Dionysus as a system that blocks infection by jumbo
    phages with early phage infection vesicles.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Specifically, we show that Dionysus forms pores in the EPI vesicle of the
    jumbo phage to disrupt the infection cycle of the phage at an early stage, similar
    to the mechanism described for the Juk phage defense system
  notes: Keesman et al. connect Dionysus to disruption of the jumbo phage early phage
    infection vesicle and therefore to interruption of the phage infection cycle.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: All three proteins of Dionysus are essential for its protective capacity,
    as mutating a conserved amino acid within the MAEBL-like domain of DinA (H326A),
    and deletion of DinB or DinC, resulted in the partial (DinA H326A) or complete
    loss of anti-phage activity
  notes: Keesman et al. support all three Dionysus proteins as required for full anti-phage
    protection in the tested system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Dionysus | 10\.1101/2025\.09\.30\.679545 | Discovery of phage defense systems
    through component modularity networks
  notes: The DefenseFinder article registry maps the named Dionysus system to the
    Keesman et al. modular phage-defense discovery preprint; the pinned DefenseFinder
    HMM inventory and rules table do not list Dionysus, so this row is name-to-paper
    evidence rather than model-component evidence.
