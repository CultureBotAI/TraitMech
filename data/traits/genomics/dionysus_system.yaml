discussions:
- discussion_id: dionysus-jumbo-phage-mechanism-gap
  prompt: Resolve Dionysus phage triggers, EPI-vesicle pore formation, and model coverage
    before minting narrower Dionysus mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Keesman et al. support Dionysus as a three-gene anti-jumbo-phage system
    that disrupts the jumbo-phage EPI vesicle stage, but the direct phage trigger,
    exact DinA/DinB/DinC interaction sequence, natural locus breadth, and profile-to-component
    model are not resolved enough here to assert a narrower mechanistic child trait.
