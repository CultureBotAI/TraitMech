identifier: traitmech:000267
label: Toutatis system
definition: A phage defense system in which an organism possesses a Toutatis locus
  represented by TutA_VCA0446 and TutB_VCA0447 profiles that can protect bacteria
  from bacteriophage infection.
definition_source: DOI:10.1126/science.ads0768
