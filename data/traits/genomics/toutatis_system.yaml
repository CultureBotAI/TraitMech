discussions:
- discussion_id: toutatis-mechanism-gap
  prompt: Resolve Toutatis phage triggers and effector outputs before minting narrower
    Toutatis mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Toutatis as a named anti-phage
    system with TutA_VCA0446 and TutB_VCA0447 profiles, but the trigger, molecular
    substrate, antiviral effector output, and subtype-specific mechanism are not resolved
    enough here to assert a narrower mechanistic child trait.
