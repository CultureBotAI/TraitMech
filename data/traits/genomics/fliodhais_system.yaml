discussions:
- discussion_id: fliodhais-mechanism-gap
  prompt: Resolve Fliodhais phage triggers and effector outputs before minting narrower
    Fliodhais mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Grafakou et al. and DefenseFinder support Fliodhais as a named two-component
    anti-phage system, but the direct trigger, molecular substrate, antiviral effector
    output, natural locus breadth, and profile-to-component model are not resolved
    enough here to assert a narrower mechanistic child trait.
