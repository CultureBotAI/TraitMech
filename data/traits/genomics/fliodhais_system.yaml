identifier: traitmech:000326
label: Fliodhais system
definition: A phage defense system in which an organism possesses a two-component
  Fliodhais locus that can reduce Lactococcus bacteriophage c2 plaque development.
definition_source: DOI:10.1093/nar/gkae671
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Fliodhais
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1093/nar/gkae671
evidence:
- reference: DOI:10.1093/nar/gkae671
  snippet: Based on comparative sequence analysis (BLASTN and BLASTP) and on functional
    and structural analysis (HHpred and InterPro) the remaining seven antiphage systems
    (out of the twenty identified) did not display significant homology to any previously
    described antiphage system, thus rendering them novel antiphage systems (Table
    1). These systems were named after cheese, cattle or fermentation related deities
    (Rhea, Aristaios, Kamadhenu, Fliodhais, Audmula, Rugutis and Hesat)
  notes: Grafakou et al. named Fliodhais among seven not previously described lactococcal
    antiphage systems.
- reference: DOI:10.1093/nar/gkae671
  snippet: All discovered systems, except Fliodhais, are single gene antiphage systems.
    Both genetic components are necessary for Fliodhais activity; the described antiphage
    activity (see below) was not observed when the two components were cloned and
    tested separately.
  notes: Grafakou et al. report that the tested Fliodhais system requires both of
    its genetic components for activity.
- reference: DOI:10.1093/nar/gkae671
  snippet: Fliodhais was associated with smaller c2 plaques surrounded by a halo (<1
    mm clear-centred plaques with a faint ring), a phenotype that was not observed
    when phage c2 was plated on the wild type strain (up to 4 mm clear-centred plaques
    without a halo).
  notes: Grafakou et al. report a Fliodhais-associated c2 plaque morphology distinct
    from the wild-type Lactococcus host.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Fliodhais | 10\.1093/nar/gkae671 | Discovery of antiphage systems in the
    lactococcal plasmidome
  notes: The DefenseFinder article registry maps the named Fliodhais system to the
    Grafakou et al. lactococcal antiphage-system discovery paper.
