discussions:
- discussion_id: abig-primary-target-gap
  prompt: Resolve the AbiG phage trigger, AbiGi and AbiGii molecular functions, and
    primary arrest target before minting narrower AbiG mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: O'Connor et al. support AbiG as a named lactococcal abortive-infection
    system encoded by two adjacent pCI750 open reading frames, and DefenseFinder represents
    AbiG with a two-profile rule. The 1999 transcription study connects AbiG to inhibited
    phage sk1 and late c2 RNA synthesis, but it explicitly leaves unresolved whether
    transcription is the system's primary target or a secondary effect.
  evidence:
  - reference: DOI:10.1128/aem.65.1.330-335.1999
    snippet: AbiG inhibits phage sk1 and late c2 RNA synthesis; however, whether this
      process of transcription is the primary target of the system or a secondary
      effect remains to be determined
    notes: O'Connor et al. identify phage RNA-synthesis inhibition as a downstream
      AbiG effect while leaving the direct target unresolved.
  attaches_to:
  - causal_graphs#abig_inhibits_lactococcal_phage_rna_synthesis
