causal_graphs:
- graph_id: abig_inhibits_lactococcal_phage_rna_synthesis
  title: AbiG inhibits lactococcal phage RNA synthesis
  description: Conservative system-level sketch linking an abiGi/abiGii locus to AbiG
    antiphage activity, inhibited phage RNA synthesis, restricted lactococcal phage
    propagation, and abortive-infection system possession without asserting AbiG's
    unresolved primary target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiG as a named DefenseFinder two-profile abortive-infection
    system whose pCI750 prototype restricts phi 712, partially restricts phi c2, and
    inhibits phage sk1 and late c2 RNA synthesis while leaving the phage trigger,
    AbiGi and AbiGii molecular functions, cellular target, growth-arrest or cell-death
    route, and phage escape routes unresolved.
