identifier: traitmech:000306
label: AbiG system
definition: An abortive infection system in which an organism possesses a two-gene
  abiG locus with abiGi and abiGii open reading frames, exemplified by the Lactococcus
  lactis subsp. cremoris UC653 plasmid pCI750 locus that restricts lactococcal phages
  without blocking phage DNA replication and is represented by the DefenseFinder AbiG__AbiGi
  and AbiG__AbiGii profiles.
definition_source: DOI:10.1128/aem.62.9.3075-3082.1996
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiG
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/aem.62.9.3075-3082.1996
evidence:
- reference: DOI:10.1128/aem.62.9.3075-3082.1996
  snippet: AbiG is an abortive infection (Abi) mechanism encoded by the conjugative
    plasmid pCI750 originally isolated from Lactococcus lactis subsp. cremoris UC653
  notes: O'Connor et al. identify AbiG as an abortive-infection mechanism encoded
    by the UC653 pCI750 plasmid.
- reference: DOI:10.1128/aem.62.9.3075-3082.1996
  snippet: Insensitivity conferred by this Abi manifested itself as complete resistance
    to phi 712 (936 phage species) with only partial resistance to phi c2 (c2 species)
  notes: O'Connor et al. show that AbiG restricts tested lactococcal phages with species-dependent
    strength.
- reference: DOI:10.1128/aem.62.9.3075-3082.1996
  snippet: The smallest subclone of pCI750 which expressed the Abi phenotype contained
    a 3.5-kb insert which encoded two potential open reading frames
  notes: O'Connor et al. localize AbiG activity to a pCI750 subclone carrying two
    predicted coding sequences.
- reference: DOI:10.1128/aem.62.9.3075-3082.1996
  snippet: abiGi (750 bp) and abiGii (1,194 bp) were separated by 2 bp and appeared
    to share a single promoter upstream of abiGi
  notes: O'Connor et al. support abiGi and abiGii as the paired open reading frames
    of the AbiG locus.
- reference: DOI:10.1128/aem.62.9.3075-3082.1996
  snippet: The mechanism did not inhibit phage DNA replication
  notes: O'Connor et al. rule out phage DNA replication as the blocked step in the
    original AbiG characterization.
- reference: DOI:10.1128/aem.65.1.330-335.1999
  snippet: The abortive infection system AbiG is encoded by the lactococcal plasmid
    pCI750
  notes: The follow-up O'Connor et al. study reiterates AbiG as a pCI750-encoded lactococcal
    abortive-infection system.
- reference: DOI:10.1128/aem.65.1.330-335.1999
  snippet: The abiG locus (consisting of two genes, abiGi and abiGii) was examined
    by Northern blot analysis, revealing two transcripts of approximately 2.8 and
    1.5 kb which were homologous to the two gene-specific probes
  notes: O'Connor et al. confirm the abiGi/abiGii two-gene locus at the transcript
    level.
- reference: DOI:10.1128/aem.65.1.330-335.1999
  snippet: Examination of phage sk1 RNA synthesis demonstrated that both the subcloned
    AbiG and, to a greater extent, pCI750 inhibited this process
  notes: O'Connor et al. connect the AbiG subclone to inhibited sk1 phage RNA synthesis.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiG | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiG model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiG\tAbiG\t2\t2\tAbiG__AbiGi, AbiG__AbiGii"
  notes: The DefenseFinder rules table models AbiG as a two-component system requiring
    the AbiG__AbiGi and AbiG__AbiGii profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiG__AbiGi                                      | AbiG__AbiGi                                      |
    AbiG                   | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records AbiG__AbiGi under the AbiG model
