identifier: traitmech:000467
label: HEC-06 system
definition: A phage defense system in which an organism possesses the single-gene
  HEC-06 Hma-embedded candidate locus, encoding a GmrSD-like protein, that can reduce
  bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
