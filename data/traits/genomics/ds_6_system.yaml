identifier: traitmech:000430
label: DS-6 system
definition: A phage defense system in which an organism possesses the two-gene DefensePredictor-discovered
  system 6 locus cataloged with working_id HIPA and whose plasmid expression in E.
  coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
