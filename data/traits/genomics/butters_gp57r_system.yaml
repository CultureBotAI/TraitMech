identifier: traitmech:000299
label: Butters gp57r system
definition: A phage defense system in which an organism possesses a Butters gp57r
  locus that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1101/2023.01.03.522681
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
