discussions:
- discussion_id: butters_gp57r-mechanism-gap
  prompt: Resolve the Butters gp57r direct phage trigger, primary molecular target,
    HEPN-associated RX4-6H motif requirement, DNA-amplification defect, PurpleHaze
    minor-tail escape route, and homolog breadth before minting narrower Butters gp57r
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mohammed et al. and DefenseFinder support Butters gp57r as a named anti-phage
    system with a gp57r profile, but the direct phage trigger, the biochemical role
    of its predicted HEPN domain and RX4-6H motif, the primary event leading to failed
    Island3 DNA amplification, and the defense scope of gp57r homologs in other mycobacteriophages
    or clinical Mycobacterium abscessus isolates are not resolved enough here to assert
    a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#butters_gp57r_locus_restricts_phage
