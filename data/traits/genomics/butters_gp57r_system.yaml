evidence:
- reference: DOI:10.1101/2023.01.03.522681
  snippet: Butters gp57r is both necessary and sufficient to inhibit infection by
    Island3 and other phages
  notes: Mohammed et al. report Butters gp57r as the Butters component that can block
    Island3 and additional heterotypic phages.
- reference: DOI:10.1101/2023.01.03.522681
  snippet: mc2155(gp57r) recapitulated defense against Island3 comparable to that
    mounted by mc2155(Butters)
  notes: Mohammed et al. show that expressing Butters gene 57r is sufficient to reproduce
    Butters-like defense against Island3.
- reference: DOI:10.1101/2023.01.03.522681
  snippet: Results show that Butters gp57r defends against several other phages (Fig.
    3A)
  notes: Mohammed et al. test the breadth of the cloned gp57r defense and find protection
    against additional heterotypic phages.
- reference: DOI:10.1101/2023.01.03.522681
  snippet: the proposal that gp57r acts downstream of DNA injection
  notes: Mohammed et al. narrow the antiviral effect to a post-DNA-injection step
    without resolving gp57r's direct molecular substrate.
