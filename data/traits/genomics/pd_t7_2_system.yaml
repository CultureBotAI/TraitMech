evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T7-2 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-2.md
  snippet: 'The PD-T7-2 is composed of 2 proteins: PD-T7-2_A and PD-T7-2_B.'
  notes: The DefenseFinder wiki names PD-T7-2 as a two-protein system with PD-T7-2_A
    and PD-T7-2_B.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-2.md
  snippet: The PD-T7-2 system in *Lederbergia lenta* (GCF_900478165.1, NZ_LS483476)
    is composed of 2 proteins PD-T7-2_A (WP_066145327.1) PD-T7-2_B (WP_066145329.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-T7-2 locus
    in RefSeq assembly GCF_900478165.1 on NZ_LS483476.
