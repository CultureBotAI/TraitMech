identifier: traitmech:000396
label: PD-T7-2 system
definition: A phage defense system in which an organism possesses a PD-T7-2 locus
  represented by DefenseFinder as a two-profile model, PD-T7-2__PD-T7-2_A and PD-T7-2__PD-T7-2_B,
  and experimentally linked to T2, T4, T6, LambdaVir, T5, SECphi18, SECphi27, T3,
  and T7 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-2.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
