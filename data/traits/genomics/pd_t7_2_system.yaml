discussions:
- discussion_id: pd-t7-2-mechanism-gap
  prompt: Resolve PD-T7-2 natural host breadth, direct phage trigger, effector mechanism,
    and profile-to-protein correspondence before minting narrower PD-T7-2 mechanism
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T7-2 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to broad phage protection, and DefenseFinder represents the system
    with two profiles. Natural host breadth, the direct phage trigger, exact effector
    logic, and the exact correspondence between the two profiles and proteins remain
    unresolved.
