identifier: METPO:1000429
label: GC low
definition: A GC-content phenotype with genome-wide GC composition between approximately
  42.65% and 57.0% (the METPO `GC_42.65_57.0` bin; note that the upstream label 'low'
  does not match this mid-range numeric threshold, but the synonym is preserved as
  the authoritative bin definition).
definition_source: DOI:10.1038/nrg2358
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000127
synonyms:
- synonym_text: GC_42.65_57.0
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1371/journal.pgen.1001107
  snippet: The genomic GC-content of bacteria varies dramatically, from less than
    20% to more than 70%
  notes: Verified against the open Hildebrand et al. abstract; bacterial genome-wide
    GC content spans the METPO 42.65-57.0% bin, whose cutpoints come from this record's
    METPO synonym.
canonical_examples:
- taxon_id: NCBITaxon:1793963
  taxon_label: Bacillus nakamurai
  reference: DOI:10.1099/ijsem.0.001135
  note: Bacillus nakamurai NRRL B-41091T has 43.8 mol% genomic GC in its primary species
    description, wholly inside this record's authoritative 42.65-57.0% interval.
causal_graphs:
- graph_id: gc_low_mid_low_gc_bin
  title: GC-low METPO 42.65-57.0% genome-composition context
  scope_status: NONMECHANISTIC
  scope_notes: This genomics record is a measurement, genomic-element classification,
    or population-level descriptor rather than one taxon-specific protein mechanism;
    contextual protein nodes do not receive token UniProt examples.
  description: DOI-backed nonmechanistic graph connecting DNA-repair defects, mutational
    spectra, cytosine-deamination context, AT-enriching spectrum context, replication/repair
    enzyme bias, and moderate mutation bias to continuous genome-wide GC content and
    the METPO GC_42.65_57.0 bin.
  nodes:
  - node_id: gc_low_trait
    label: GC low
    node_type: TRAIT
    grounding: METPO:1000429
    description: GC content ~42.65–57.0% (per METPO synonym GC_42.65_57.0).
  - node_id: gc_content
    label: GC content
    node_type: TRAIT
    grounding: METPO:1000127
    description: Percentage of guanine and cytosine nucleotides in genomic DNA.
  - node_id: moderate_mutation_bias
    label: moderate mutation bias
    node_type: BIOLOGICAL_PROCESS
    description: Modest mutation-bias balance between AT- and GC-favoring pressures
      yielding mid-range GC composition.
  - node_id: dna_repair_defect
    label: DNA repair defect
    node_type: BIOLOGICAL_PROCESS
    description: Loss/impairment of DNA repair pathways (MMR, BER, HR) altering mutation
      accumulation.
  - node_id: mutational_spectrum
    label: mutational spectrum
    node_type: BIOLOGICAL_PROCESS
    description: Distribution of mutation types (substitution classes) characterizing
      a genome.
  - node_id: cytosine_deamination
    label: cytosine deamination / C>T bias
    node_type: BIOLOGICAL_PROCESS
    description: Spontaneous cytosine deamination driving C>T transitions, the most
      common mutation type.
  - node_id: at_enriching_spectrum
    label: AT-enriching mutation spectrum
    node_type: BIOLOGICAL_PROCESS
    description: Mutation spectrum biased toward AT-increasing substitutions (C>A/T
      enriched, C>G depleted).
  - node_id: repair_enzyme_bias
    label: DNA replication/repair enzyme bias
    node_type: BIOLOGICAL_PROCESS
    description: Nucleotide biases of DNA replication and repair enzymes contributing
      to genome base composition.
  edges:
  - subject: moderate_mutation_bias
    predicate: contributes to
    object: gc_content
    description: Moderate mutation-bias balance contributes to continuous genome-wide
      GC composition.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1412318
      snippet: The GC% of genomes depends in part on the mutation rates between each
        nucleotide
      notes: Verified against the open Delgado et al. introduction; mutation rates
        are described as one component of genome GC percent, with selection pressures
        and codon-usage effects also contributing.
    predicate_id: RO:0002326
  - subject: gc_low_trait
    predicate: is a
    object: gc_content
    description: GC low is a quantitative bin of the GC-content phenotype.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1001107
      snippet: The genomic GC-content of bacteria varies dramatically, from less than
        20% to more than 70%
      notes: Verified against the open Hildebrand et al. abstract; the public source
        supports genome-wide GC content as a continuous bacterial genome-composition
        measurement, while the METPO synonym supplies this bin's cutpoints.
    predicate_id: rdfs:subClassOf
  - subject: dna_repair_defect
    predicate: causes
    object: mutational_spectrum
    description: Defects in DNA repair genes (MMR, BER, HR) create distinctive bacterial
      mutational signatures.
    evidence:
    - reference: DOI:10.1038/s41467-023-42916-w
      snippet: defects in DNA repair create distinctive mutational signatures
      notes: Verified against the open Ruis et al. abstract and results; hypermutator
        lineages with mutations in MMR, BER, or HR DNA-repair genes were used to extract
        pathway-specific bacterial signatures.
    predicate_id: biolink:causes
  - subject: cytosine_deamination
    predicate: contributes to
    object: at_enriching_spectrum
    description: Cytosine deamination and the resulting C>T transitions contribute
      to an AT-enriching bacterial mutation spectrum.
    evidence:
    - reference: DOI:10.1038/s41467-023-42916-w
      snippet: cytosine to thymine (C > T) was typically the most common mutation
        type identified
      notes: Verified against the open Ruis et al. results; C>T was the most common
        mutation type in 69 of 84 bacterial single-base-substitution spectra and is
        discussed as potentially arising from cytosine deamination.
    predicate_id: RO:0002326
  - subject: at_enriching_spectrum
    predicate: associated with
    object: gc_content
    description: AT-enriching C>A/T and depleted C>G mutation spectra are associated
      with continuous genome-wide G+C content.
    evidence:
    - reference: DOI:10.1038/s41467-023-42916-w
      snippet: Genomic G + C content exhibited a negative correlation with proportion
        of C > A/T mutations
      notes: Verified against the open Ruis et al. results; the spectrum-to-composition
        association is left on the continuous GC-content node rather than asserted
        as specific causation of this METPO numeric bin.
    predicate_id: biolink:associated_with
  - subject: repair_enzyme_bias
    predicate: contributes to
    object: gc_content
    description: Biases of DNA replication/repair enzymes and inter-nucleotide mutation
      rates contribute to genomic GC percent.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1412318
      snippet: enzymes involved in DNA replication and/or repair are known to present
        biases
      notes: Verified against the open Delgado et al. introduction; DNA replication
        and repair enzyme biases are framed as mutation-rate effects that help determine
        genome GC percent.
    predicate_id: RO:0002326
  - subject: at_enriching_spectrum
    predicate: is a
    object: mutational_spectrum
    description: The AT-enriching C>A/T spectrum is a mutational-spectrum context
      connecting cytosine-deamination bias to bacterial DNA-repair mutational signatures.
    evidence:
    - reference: DOI:10.1038/s41467-023-42916-w
      snippet: context-dependent patterns of base substitutions termed mutational
        signatures, which combine to form a mutational spectrum
      notes: Verified against the open Ruis et al. results; this connector identifies
        the AT-enriching C>A/T pattern as a specific bacterial mutational-spectrum
        context rather than a direct cause of the METPO GC_42.65_57.0 bin.
    predicate_id: rdfs:subClassOf
