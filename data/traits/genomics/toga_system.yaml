evidence:
- reference: DOI:10.1093/nar/gkag898
  snippet: The single protein in the Toga system has several hits with protein domains
    associated (through FoldSeek) with the Gao_Ppl
  notes: de Sousa et al. identify Toga as a single-protein defense system with detectable
    defense-domain similarity.
- reference: DOI:10.1093/nar/gkag898
  snippet: with most (e.g. Bandua, Aernus, Toga, and Reve) providing strong protection
    against phages of different families
  notes: de Sousa et al. identify Toga among the novel P4-associated systems that
    provided strong protection against phage challenge.
- reference: DOI:10.1093/nar/gkag898
  snippet: Our experimental validation of anti-phage activity for 13 novel systems
