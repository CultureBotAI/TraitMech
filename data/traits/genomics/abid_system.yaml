identifier: traitmech:000318
label: AbiD system
definition: An abortive infection system in which an organism possesses an abiD-family
  locus represented by the DefenseFinder AbiD__AbiD profile and exemplified by the
  Lactococcus lactis subsp. lactis KR5 pBF61 determinant whose abiD open reading frame
  confers an abortive phage infection phenotype with reduced plating efficiency, plaque
  size, and c2 phage burst size.
definition_source: DOI:10.1128/aem.61.5.2023-2026.1995
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiD
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:7646042
  snippet: A 6.3-kb fragment from pBF61 in Lactococcus lactis subsp. lactis KR5 was
    cloned and found to confer an abortive phage infection (Abi+) phenotype
  notes: McLandsborough et al. cloned the pBF61-derived fragment from Lactococcus
    lactis subsp. lactis KR5 and showed that it conferred an Abi phenotype.
- reference: PMID:7646042
  snippet: exhibiting a reduction in efficiency of plating and plaque size for small
    isometric- and prolate-headed bacteriophages sk1 and c2, respectively, and to
    produce a 10-fold decrease in c2 phage burst size
  notes: McLandsborough et al. measured reduced plating efficiency, plaque size, and
    c2 phage burst size from the pBF61 AbiD determinant.
- reference: PMID:7646042
  snippet: Phage adsorption was not significantly reduced
  notes: McLandsborough et al. distinguished AbiD activity from a phage-adsorption
    block.
- reference: PMID:7646042
  snippet: An open reading frame of 1,098 bp was sequenced and designated abiD
  notes: McLandsborough et al. named the abiD open reading frame within the pBF61
    determinant.
- reference: PMID:7646042
  snippet: Tn5 mutagenesis confirmed that abiD was required for the Abi+ phenotype
  notes: McLandsborough et al. verified that the abiD open reading frame is required
    for the abortive-infection phenotype.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiD | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiD model namespace to
    a lactococcal abortive-infection review.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiD\tAbiD\t1\t1\tAbiD__AbiD"
  notes: The DefenseFinder rules table models AbiD as a one-component system requiring
    the AbiD__AbiD profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiD__AbiD                                       | AbiD__AbiD                                       |
    AbiD                   | Custom                  | 90     |'
  notes: The DefenseFinder HMM inventory records AbiD__AbiD under the AbiD model namespace.
