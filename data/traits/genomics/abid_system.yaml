  title: AbiD activity restricts lactococcal phages
  description: Conservative system-level sketch linking an abiD-family locus to AbiD
    antiphage activity, reduced lactococcal phage propagation, and abortive-infection
    system possession without asserting the unresolved molecular target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiD as a named DefenseFinder single-profile abortive-infection
    system whose pBF61 prototype restricts sk1 and c2 phages. It leaves the direct
    phage trigger, AbiD molecular function, cell-death or growth-arrest route, natural
    locus breadth, and phage escape routes unresolved.
