discussions:
- discussion_id: abid-trigger-and-effector-gap
  prompt: Resolve the AbiD phage trigger, molecular activity, and direct arrest target
    before minting narrower AbiD mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: McLandsborough et al. support AbiD as a named lactococcal abortive-infection
    determinant whose cloned pBF61 fragment reduces sk1 plating efficiency and c2
    burst size, whose abiD open reading frame is required for the Abi phenotype, and
    whose activity does not primarily block phage adsorption. DefenseFinder represents
    AbiD with a one-profile rule, but this first system-level record leaves the phage
    trigger, AbiD molecular function, direct host or phage target, growth-arrest or
    cell-death route, and phage escape routes unresolved.
  attaches_to:
  - causal_graphs#abid_locus_reduces_lactococcal_phage_burst
