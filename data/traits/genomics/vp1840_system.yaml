identifier: traitmech:000450
label: VP1840 system
definition: A phage defense system in which an organism possesses a VP1840-family
  locus represented by the DefenseFinder VP1840__VP1840 custom HMM profile and experimentally
  linked to reduced vibriophage plaquing when the cloned Vibrio parahaemolyticus RIMD
  2210633 vp1840 cassette is expressed from a VSV105 plasmid.
