discussions:
- discussion_id: avs-iii-component-and-effector-gap
  prompt: Resolve the Avs3A and Avs3B component roles, direct effector chemistry,
    exact phage-trigger mapping, native host breadth, and sensitive-phage breadth
    before minting Avs III mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support Avs3 phage-protein recognition and Avs activation
    during antiviral defense, and the pinned DefenseFinder HMM inventory and rules
    table support Avs_III as a subtype III model with Avs3A and Avs3B profiles. This
    first-pass record leaves the exact component roles, downstream effector chemistry,
    native host breadth, sensitive-phage breadth, and profile-to-activity requirements
    unresolved.
  evidence:
  - reference: DOI:10.1126/science.abm4096
    snippet: Avs1 to Avs3 recognize the large terminase subunit, and Avs4 recognizes
      the portal
    notes: Gao et al. support Avs3 as a phage-protein-sensing member of the AVAST
      receptor family.
