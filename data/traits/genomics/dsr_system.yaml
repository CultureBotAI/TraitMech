discussions:
- discussion_id: dsr-sirtuin-mechanism-gap
  prompt: Map DefenseFinder Dsr_I and Dsr_II profiles onto experimentally resolved
    DSR1 and DSR2 NADase triggers, host ranges, anti-defense proteins, and Dsr naming
    collisions before minting narrower Dsr mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated sirtuin proteins as antiphage system
    components, Garb et al. resolved NAD+ depletion for multiple SIR2-dependent defense
    systems and tail tube-triggered NADase activation for B. subtilis DSR2, and DefenseFinder
    models Dsr_I and Dsr_II. This first record stays at Dsr-family level until the
    DefenseFinder subtype profiles can be aligned to specific experimental DSR1/DSR2
    systems, trigger proteins, host ranges, and phage-encoded anti-DSR proteins. The
    DefenseFinder Dsr system is also lexically distinct from metabolic DsrAB dissimilatory
    sulfite reductase systems.
  attaches_to:
  - causal_graphs#dsr_sirtuin_antiphage_defense
  posed_by: codex
  posed_date: '2026-09-19'
