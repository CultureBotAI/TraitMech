identifier: traitmech:000280
label: Dsr system
definition: A phage defense system in which an organism possesses a defense-associated
  sirtuin locus whose SIR2-domain effector can deplete NAD+ during bacteriophage defense
  and is modeled by DefenseFinder as Dsr subtypes.
definition_source: DOI:10.1038/s41564-022-01207-8
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
