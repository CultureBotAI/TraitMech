evidence:
- reference: DOI:10.1126/science.aba0372
  snippet: we selected 48 candidate systems to test experimentally for defense activity
  notes: Gao et al. used heterologous reconstitution and phage challenge as their
    experimental screen for computationally predicted antiphage systems.
- reference: DOI:10.1126/science.aba0372
  snippet: dsr, defense-associated sirtuin
  notes: Gao et al. introduced dsr as a defense-associated sirtuin name in the candidate-system
    activity figure.
- reference: DOI:10.1126/science.aba0372
  snippet: Additional systems include proteins containing a SIR2 (sirtuin) deacetylase
    domain
  notes: Gao et al. place SIR2-domain proteins among additional antiphage defense-system
    candidates in their domain-architecture analysis.
- reference: DOI:10.1038/s41564-022-01207-8
  snippet: DSR proteins degrade nicotinamide adenine dinucleotide (NAD+) during infection,
    depleting the cell of this essential molecule and aborting phage propagation
  notes: Garb et al. showed that DSR SIR2-domain proteins can defend through infection-coupled
    NAD+ depletion.
- reference: DOI:10.1038/s41564-022-01207-8
  snippet: DSR2, directly identifies phage tail tube proteins and then becomes an
    active NADase in Bacillus subtilis
  notes: Garb et al. experimentally resolved the phage-derived activation cue for
    one Bacillus subtilis DSR2 system.
