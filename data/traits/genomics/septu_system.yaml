identifier: traitmech:000233
label: Septu system
definition: A phage defense system in which an organism possesses a Septu locus encoding
  PtuA and the HNH endonuclease PtuB, whose PtuAB oligomer confers antiphage immunity
  through nuclease-mediated phage genome cleavage in standalone systems and can be
  regulated by retron RT-msDNA complexes in Retron-Septu loci.
definition_source: DOI:10.1038/s41594-023-01172-8
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Septu
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.aar4120
evidence:
- reference: DOI:10.1126/science.aar4120
  snippet: Septu PtuAB pfam13304, COG3950, pfam13395, pfam01844 ATPase, HNH nuclease
    2,506 2,117 (4.1%)
  notes: Doron et al. reported Septu/PtuAB as an ATPase- and HNH-nuclease-linked system
    in their pangenome-scale antiphage-system discovery screen.
- reference: DOI:10.1038/s41594-023-01172-8
  snippet: 'E. coli Septu system, an anti-phage defense system, comprises two components:
    PtuA and PtuB'
  notes: Yang et al. support defining Septu as a two-component PtuA/PtuB antiphage
    system.
- reference: DOI:10.1038/s41594-023-01172-8
  snippet: PtuA contains an ATPase domain while PtuB is a nuclease that belongs to
    the His-Asn-His (HNH) family
  notes: Yang et al. support the ATPase and HNH endonuclease component classes that
    distinguish the PtuAB system.
- reference: DOI:10.1038/s41594-023-01172-8
  snippet: PtuAB restricts phage growth by cleaving phage genomic DNA
  notes: Yang et al. connect the PtuAB complex to nuclease-mediated restriction of
    phage growth in cells.
- reference: DOI:10.1126/science.adv3344
  snippet: The Retron-Septu system uniquely integrates retron and Septu antiphage
    defenses
  notes: Wang et al. support recognizing Retron-Septu as a Septu architecture with
    coupled retron regulation, not as a separate exact replacement for the broader
    Septu class.
- reference: DOI:10.1126/science.adv3344
  snippet: Activation occurs upon disassembly, releasing PtuAB, which degrades single-stranded
    DNA to restrict phage replication
  notes: Wang et al. connect Retron-Septu activation to release of PtuAB and DNA degradation
    that restricts phage replication.
canonical_examples:
