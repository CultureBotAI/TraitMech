discussions:
- discussion_id: tha-variant-profile-rule-gap
  prompt: Resolve Tha variant boundaries, exact minor-tail-protein triggers, Ith inhibitor
    relationships, native host breadth, and DefenseFinder rule/profile coverage before
    minting narrower Tha mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rostol et al. support Tha-1 and Tha-2 as S. aureus prophage-encoded Tha
    systems activated by distinct incoming-phage minor tail proteins. The pinned DefenseFinder
    registries map the Tha source key to the same primary paper and list one Tha__Tha
    custom HMM row, but no exact Tha system rule row was present in the pinned rules
    table. The first TraitRecord therefore stays at Tha-system scope until separate
    review resolves variant boundaries, exact activators, Ith inhibitor relationships,
    native host breadth, and model coverage.
  evidence:
  - reference: DOI:10.1038/s41564-024-01661-6
    snippet: Tha systems can also block reproduction of the induced tha-positive prophages
    notes: Rostol et al. report Tha autoimmunity and inhibition by cognate overlapping
      antisense Ith proteins.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
    snippet: '| Tha | 10\.1038/s41564-024-01661-6 | Bacteriophages avoid autoimmunity
      from cognate immune systems as an intrinsic part of their life cycles | '
    notes: The pinned DefenseFinder article registry maps the Tha source key to the
      primary Nat Microbiol Tha paper.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| Tha__Tha                                         |                                                  |
