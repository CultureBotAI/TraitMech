evidence:
- reference: DOI:10.1038/s41564-024-01661-6
  snippet: multiple Staphylococcus aureus prophages encode Tha (tail-activated, HEPN
    (higher eukaryotes and prokaryotes nucleotide-binding) domain-containing anti-phage
    system)
  notes: Rostol et al. define Tha as a tail-activated HEPN anti-phage system encoded
    by multiple S. aureus prophages.
- reference: DOI:10.1038/s41564-024-01661-6
  snippet: We demonstrate the function of two Tha systems, Tha-1 and Tha-2, activated
    by distinct tail proteins
  notes: Rostol et al. support multiple experimentally tested Tha variants that are
    activated by different phage tail proteins.
- reference: DOI:10.1038/s41564-024-01661-6
  snippet: Tha is a non-specific RNase that is activated by conserved minor tail proteins
    from temperate phages
  notes: Rostol et al. connect the Tha anti-phage system to minor-tail-protein activation
    and nonspecific RNase activity.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Tha | 10\.1038/s41564-024-01661-6 | Bacteriophages avoid autoimmunity
    from cognate immune systems as an intrinsic part of their life cycles | '
  notes: The pinned DefenseFinder article registry maps the Tha source key to the
    primary Nat Microbiol Tha paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Tha__Tha                                         |                                                  |
