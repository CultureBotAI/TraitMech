  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41564-024-01661-6
- synonym_text: tail-activated, HEPN domain-containing anti-phage system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41564-024-01661-6
- synonym_text: Tha__Tha
  synonym_type: RELATED_SYNONYM
