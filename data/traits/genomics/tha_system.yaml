identifier: traitmech:000497
label: Tha system
definition: A phage defense system in which an organism possesses a Tha tail-activated
  HEPN anti-phage locus that can be activated by incoming-phage minor tail proteins
  to mediate nonspecific RNase-linked defense.
definition_source: DOI:10.1038/s41564-024-01661-6
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
