discussions:
- discussion_id: abialpha-lysis-route-gap
  prompt: Resolve the AbiAlpha direct molecular target, Idefix trigger, lysis route,
    natural host range, and phage escape routes before minting narrower AbiAlpha mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Lossouarn et al. support AbiAlpha as a prophage-encoded Enterococcus
    faecalis abortive-infection system that maps to DUF4393/PF14337 and perturbs Idefix
    lysis timing. DefenseFinder represents AbiAlpha with a one-profile HMM inventory
    row but does not resolve the direct phage trigger, DUF4393-family molecular function,
    Idefix lysis target, natural host range, or escape routes.
  attaches_to:
  - causal_graphs#abialpha_locus_causes_enterococcal_premature_lysis
