  taxon_label: Enterococcus faecalis
  note: Lossouarn et al. characterized AbiAlpha from Enterococcus faecalis V583 prophage
    6 and showed that it causes premature lysis during Idefix infection.
  reference: DOI:10.3390/v11010048
