  title: AbiAlpha perturbs Idefix lysis in Enterococcus faecalis
  description: Conservative system-level sketch linking an abi-alpha-family locus
    to AbiAlpha antiphage activity, Idefix lytic-cycle perturbation, premature lysis
    of infected Enterococcus faecalis, and AbiAlpha-system possession without asserting
    the direct DUF4393-family molecular target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiAlpha as a named DefenseFinder single-profile
    abortive-infection system whose V583 prophage 6 prototype restricts Idefix by
    perturbing lysis timing. It leaves the direct phage trigger, DUF4393-family molecular
    function, direct Idefix target, natural host range, and phage escape routes unresolved.
