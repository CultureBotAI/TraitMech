identifier: traitmech:000322
label: AbiAlpha system
definition: An abortive infection system in which an organism possesses an abi-alpha-family
  locus represented by the DefenseFinder AbiAlpha__AbiAlpha profile and exemplified
  by the Enterococcus faecalis V583 prophage 6 abi-alpha determinant, whose encoded
  DUF4393/PF14337-family activity perturbs the Idefix lytic cycle and causes premature
  lysis of infected Enterococcus faecalis.
definition_source: DOI:10.3390/v11010048
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiAlpha
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: PMID:30634666
  snippet: We found that E. faecalis V583 prophage 6 was particularly efficient in
    resisting Idefix infection thanks to a new abortive infection (Abi) mechanism,
    which we designated Abiα.
  notes: Lossouarn et al. named a new Abi mechanism from Enterococcus faecalis V583
    prophage 6.
- reference: PMID:30634666
  snippet: It corresponded to the Pfam domain family with unknown function DUF4393
    and conferred a typical Abi phenotype by causing a premature lysis
  notes: Lossouarn et al. connected AbiAlpha to DUF4393 and an infected-cell premature-lysis
    phenotype.
- reference: PMID:30634666
  snippet: The abiα gene is widespread among prophages of enterococci and other Gram-positive
    bacteria.
  notes: Lossouarn et al. describe AbiAlpha homologs as prophage features rather than
    a single V583-only gene.
- reference: DOI:10.3390/v11010048
  snippet: These results confirmed that ef2833 is responsible for the abortive mechanism.
  notes: Lossouarn et al. experimentally connected ef2833 to the V583 prophage 6 Abi
    phenotype.
- reference: DOI:10.3390/v11010048
  snippet: We concluded that Abiα provokes a lysis asynchrony.
  notes: Lossouarn et al. linked the AbiAlpha mechanism to altered Idefix lysis timing.
- reference: DOI:10.3390/v11010048
  snippet: Upon Idefix infection, cells are dying while the Idefix lytic cycle is
    perturbed
  notes: Lossouarn et al. summarized the system as infected-cell death with perturbed
    Idefix lytic-cycle progression.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: AbiAlpha | 10\.3390/v11010048 | Enterococcus faecalis countermeasures defeat
    a virulent Picovirinae bacteriophage
  notes: The DefenseFinder article registry maps the named AbiAlpha model namespace
    to the enterococcal AbiAlpha discovery paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiAlpha__AbiAlpha                               |                                                  |
    AbiAlpha               | PF14337.11              | 27.1   |'
  notes: The DefenseFinder HMM inventory records AbiAlpha__AbiAlpha under the AbiAlpha
    model namespace with Pfam PF14337.11.
canonical_examples:
