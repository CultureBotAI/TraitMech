discussions:
- discussion_id: rhea-mechanism-gap
  prompt: Resolve Rhea phage triggers and effector outputs before minting narrower
    Rhea mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Grafakou et al., Mosterd et al., and DefenseFinder support Rhea as a
    named anti-phage system, but the direct trigger, molecular substrate, antiviral
    effector output, natural locus breadth, and profile-to-component model are not
    resolved enough here to assert a narrower mechanistic child trait.
