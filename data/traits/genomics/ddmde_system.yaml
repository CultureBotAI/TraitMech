causal_graphs:
- graph_id: ddmde_pago_helicase_plasmid_destruction
  title: DdmDE couples DdmE target binding to DdmD plasmid destruction
  description: Process sketch linking a DdmDE locus to DdmE guide DNA target binding,
    DdmD loading onto target DNA, guide-target handoff, processive plasmid destruction,
    plasmid clearance, and the DdmDE system trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the DdmDE activation pathway resolved by Bravo et
    al. without asserting every guide-maturation route, native plasmid substrate,
    DdmABC cooperation mode, or Vibrio-specific locus boundary as universal for all
    DdmDE systems.
  nodes:
  - node_id: ddmde_locus
    label: DdmDE locus
    node_type: GENETIC_ELEMENT
    description: An anti-plasmid defense locus encoding DdmD and DdmE components.
  - node_id: ddme_guide_target_binding
    label: DdmE guide-target DNA binding
    node_type: BIOLOGICAL_PROCESS
    description: Target DNA binding by the catalytically inactive, DNA-guided, DNA-targeting
      prokaryotic Argonaute DdmE.
  - node_id: ddmd_target_loading
    label: DdmD target-DNA loading
    node_type: BIOLOGICAL_PROCESS
    description: Transition of helicase-nuclease DdmD from an autoinhibited dimeric
      complex to a monomeric target-loaded state.
  - node_id: ddmde_guide_target_handover
    label: DdmDE guide-target handover
    node_type: BIOLOGICAL_PROCESS
    description: Handoff of guide and target DNA in the DdmDE guide-target handover
      complex.
  - node_id: processive_plasmid_destruction
    label: processive plasmid destruction
    node_type: BIOLOGICAL_PROCESS
    description: Processive destruction of plasmid DNA after DdmDE target recognition.
  - node_id: plasmid_clearance
    label: plasmid clearance
    node_type: BIOLOGICAL_PROCESS
    description: Elimination of invasive small multicopy plasmids.
  - node_id: ddmde_system_trait
    label: DdmDE system
    node_type: TRAIT
    grounding: traitmech:000275
    description: Possession of a genome-encoded DdmDE anti-plasmid defense system.
