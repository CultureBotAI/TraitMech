identifier: traitmech:000275
label: DdmDE system
definition: A genomics trait describing possession of a DdmDE anti-plasmid defense
  locus encoding the DNA-guided prokaryotic Argonaute DdmE and the helicase-nuclease
  DdmD, whose DNA recognition and handoff trigger processive plasmid destruction.
definition_source: DOI:10.1038/s41586-024-07515-9
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: DdmDE
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1038/s41586-022-04546-y
  snippet: two plasmid defence systems conserved in the Vibrio cholerae El Tor strains
  notes: Jaskolska et al. support discovery of plasmid-defense systems in V. cholerae
    El Tor strains.
- reference: DOI:10.1038/s41586-022-04546-y
  snippet: These systems, termed DdmABC and DdmDE
  notes: Jaskolska et al. identify DdmDE as one of those plasmid-defense systems.
- reference: DOI:10.1038/s41586-024-07515-9
  snippet: DNA defence module DdmDE system, which rapidly eliminates small, multicopy
    plasmids
  notes: Bravo et al. support DdmDE as a plasmid-elimination DNA defense module.
- reference: DOI:10.1038/s41586-024-07515-9
  snippet: DNA recognition triggers processive plasmid destruction
  notes: Bravo et al. connect target DNA recognition in DdmDE to processive plasmid
    destruction.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: DdmDE | 10\.1038/s41586-022-04546-y | Two defence systems eliminate plasmids
    from seventh pandemic Vibrio cholerae
  notes: The DefenseFinder article registry maps the named DdmDE system to the Jaskolska
    et al. Nature paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: DdmDE__DdmD                                      | DdmDE__DdmD                                      |
    DdmDE                  | Custom                  | 20
  notes: The DefenseFinder HMM inventory records the custom DdmD profile for DdmDE.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: DdmDE__DdmE                                      | DdmDE__DdmE                                      |
    DdmDE                  | Custom                  | 20
  notes: The DefenseFinder HMM inventory records the custom DdmE profile for DdmDE.
