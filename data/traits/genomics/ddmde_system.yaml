discussions:
- discussion_id: ddmde-substrate-and-guide-source-gap
  prompt: Resolve DdmDE natural guide sources, plasmid-substrate breadth, and DdmABC
    cooperation before minting narrower DdmDE mechanism or subtype traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Jaskolska et al. support DdmDE as a V. cholerae plasmid-defense system
    and Bravo et al. resolve how DdmE and DdmD cooperate for plasmid destruction,
    but this first system-level record does not assert a universal guide-maturation
    route, full natural plasmid substrate range, or whether cooperation with DdmABC
    is required in some hosts.
