discussions:
- discussion_id: fs-giy-yig-mechanism-gap
  prompt: Resolve FS_GIY_YIG natural hosts, helper-phage triggers, GIY-YIG substrates,
    and effector activity before minting narrower FS_GIY_YIG mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Fillol-Salom et al. support phage-inducible chromosomal islands as carriers
    of defense systems that provide broad immunity, and DefenseFinder models FS_GIY_YIG
    as a single-profile system. Its exact natural host breadth, helper-phage trigger,
    nuclease substrate, and profile-to-activity mapping remain unresolved.
  attaches_to:
  - causal_graphs#fs_giy_yig_locus_restricts_phage
  posed_by: codex
  posed_date: '2026-09-21'
