identifier: traitmech:000290
label: Prithvi system
definition: A phage defense system in which an organism possesses a Prithvi locus
  that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1101/2025.01.08.631966
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
