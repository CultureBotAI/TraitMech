discussions:
- discussion_id: prithvi-mechanism-gap
  prompt: Resolve Prithvi phage triggers and effector outputs before minting narrower
    Prithvi mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Prithvi as a named anti-phage
    system with a PtvA HMM profile entry, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
