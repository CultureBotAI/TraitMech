identifier: traitmech:000410
label: integrative conjugative element
definition: A genomic island trait in which an organism possesses an integrative and
  conjugative element, a self-transmissible mobile genetic element that integrates
  into host DNA, excises under induced expression, and encodes type IV secretion machinery
  for conjugative transfer to recipient cells.
definition_source: DOI:10.1146/annurev-genet-112414-055018
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000093
synonyms:
- synonym_text: ICE
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev-genet-112414-055018
evidence:
- reference: DOI:10.1146/annurev-genet-112414-055018
  snippet: 'There are two defining features of ICEs: (a) They are found integrated
    in a host genome; and (b) they encode a functional conjugation system, a type
    IV secretion system'
  notes: Johnson and Grossman define integrative and conjugative elements as host-integrated
    mobile genetic elements that encode a functional type IV secretion conjugation
    system.
- reference: DOI:10.1093/nar/gkad644
  snippet: The term ‘genomic island’ encompasses diverse types of mobile genetic elements
    that exhibit various structures and gene contents, including prophages, transposons,
    integrated plasmids, integrative and mobilizable elements (IMEs), and integrative
    and conjugative elements (ICEs)
  notes: Bioteau et al. place integrative and conjugative elements among the mobile-genetic-element
    subclasses encompassed by genomic islands.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: ICEBs1
  reference: DOI:10.1146/annurev-genet-112414-055018
- taxon_id: NCBITaxon:1351
  taxon_label: Enterococcus faecalis
  note: Tn916
  reference: DOI:10.1146/annurev-genet-112414-055018
causal_graphs:
- graph_id: ice_excision_conjugation_integration
  title: ICEs excise, transfer by conjugation, and reintegrate
  description: Conservative ICE life-cycle sketch linking an integrated ICE locus
    to circularization, oriT processing, T4SS-mediated conjugative transfer, recipient
    integration, and the genomic-island possession trait.
  scope_status: NONMECHANISTIC
  scope_notes: This genomics graph summarizes the shared ICE life cycle at the mobile-element
    level. It does not assert exact protein-family groundings for heterogeneous ICE
    integrases, relaxases, type IV coupling proteins, or T4SS subunits.
  nodes:
  - node_id: integrated_ice_locus
    label: integrated ICE locus
    node_type: GENETIC_ELEMENT
    description: An integrative and conjugative element integrated into a host replicon.
  - node_id: ice_excision_circularization
    label: ICE excision and circularization
    node_type: BIOLOGICAL_PROCESS
    description: Induction-associated excision of an integrated ICE to a circular
      double-stranded DNA intermediate.
  - node_id: orit_processing
    label: oriT processing
    node_type: BIOLOGICAL_PROCESS
    description: Processing at the ICE origin of transfer to generate the linear transfer-DNA
      complex.
  - node_id: conjugation
    label: conjugation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0009291
    description: Contact-dependent transfer of ICE DNA into a recipient cell through
      the conjugation machinery.
  - node_id: ice_integration
    label: ICE integration
    node_type: BIOLOGICAL_PROCESS
    description: Recombination of circular ICE DNA into the recipient host chromosome.
  - node_id: integrative_conjugative_element
    label: integrative conjugative element
    node_type: TRAIT
    grounding: traitmech:000410
    description: Possession of a genome-encoded integrative and conjugative element.
  - node_id: genomic_island
    label: genomic island
    node_type: TRAIT
    grounding: traitmech:000093
    description: Possession of a horizontally acquired chromosomal island.
  edges:
