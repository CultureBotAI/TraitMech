    evidence:
    - reference: DOI:10.1146/annurev-genet-112414-055018
      snippet: In both the donor and recipient, the circular dsDNA ICE integrates
        into the host chromosome.
      notes: Johnson and Grossman's ICE life-cycle figure caption states that the
        circular double-stranded ICE reintegrates in donor and recipient cells.
