    evidence:
    - reference: DOI:10.1146/annurev-genet-112414-055018
      snippet: The mating machinery pumps the T-DNA into the recipient
      notes: The Johnson and Grossman life-cycle summary places mating-machinery transport
        after transfer-DNA generation.
  - subject: conjugation
    predicate: enables
    predicate_id: RO:0002327
    object: ice_integration
    description: Transferred ICE DNA recircularizes and becomes a double-stranded
