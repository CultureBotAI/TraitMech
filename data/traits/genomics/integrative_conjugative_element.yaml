discussions:
- discussion_id: ice-family-resolution-gap
  prompt: Resolve bacterial ICE subfamilies, Actinomycete ICE boundaries, integrase/relaxase/T4SS
    signatures, and cargo-phenotype scope before minting narrower ICE mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Johnson and Grossman define ICEs by host-genome integration and a functional
    type IV secretion conjugation system, while Bioteau et al. classify ICEs as self-transmissible
    genomic islands. This first record captures the genome-level possession trait
    without claiming exact molecular groundings for heterogeneous integrases, relaxases,
    T4SS variants, Actinomycete ICE machinery, or adaptive cargo phenotypes.
  attaches_to:
  - causal_graphs#ice_excision_conjugation_integration
