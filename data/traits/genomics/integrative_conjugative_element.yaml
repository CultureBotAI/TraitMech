    evidence:
    - reference: DOI:10.1146/annurev-genet-112414-055018
      snippet: When ICE gene expression is induced, by specific cellular conditions
        or perhaps stochastically, the ICE excises from the chromosome and forms a
        circular dsDNA molecule
      notes: Johnson and Grossman summarize induction-linked ICE excision and circular
        double-stranded DNA intermediate formation.
  - subject: ice_excision_circularization
    predicate: enables
    predicate_id: RO:0002327
    object: orit_processing
    description: The circular ICE is processed at oriT to generate the linear ssDNA-protein
      transfer complex.
    evidence:
    - reference: DOI:10.1146/annurev-genet-112414-055018
      snippet: Other host and ICE-encoded proteins recognize the origin of transfer
        (oriT) and process the ICE DNA to generate a linear ssDNA-protein complex
      notes: Johnson and Grossman describe oriT recognition and ICE DNA processing
        that produces the linear transfer-DNA complex.
  - subject: orit_processing
    predicate: enables
    predicate_id: RO:0002327
    object: conjugation
    description: The mating machinery transports the processed transfer DNA into a
