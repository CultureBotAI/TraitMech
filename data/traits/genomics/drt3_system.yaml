  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
- synonym_text: DRT_3__drt3a
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: DRT_3__drt3b
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1126/science.aba0372
  snippet: We discovered that a family of uncharacterized reverse transcriptases (RTs)
    are active defense systems
  notes: Gao et al. experimentally support defense-associated reverse transcriptases
    as active antiphage systems.
- reference: DOI:10.1126/science.aba0372
  snippet: We named these genes defense-associated RTs (DRTs)
  notes: Gao et al. coined the defense-associated RT naming that underlies the DRT
    system family.
- reference: DOI:10.1126/science.aba0372
  snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA, where
    x is any amino acid] abolished activity
  notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
    active-site residues.
- reference: DOI:10.1126/science.aba0372
  snippet: the UG3 (drt3a) and UG8 (drt3b) RTs are components of the same defense
    system (DRT type 3), with both RTs required for defense activity
  notes: Gao et al. support the two reverse-transcriptase components of the DRT type
    3 defense system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| DRT | 10\.1126/science\.aba0372 | Diverse enzymatic activities mediate
    antiviral immunity in prokaryotes | '
  notes: The pinned DefenseFinder article registry maps the DRT source key to the
    Gao et al. prokaryotic antiviral-immunity paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| DRT_3__drt3a                                     | DRT_3__drt3a                                     |
    DRT_3                  | Custom                  | 150    |

    | DRT_3__drt3b                                     | DRT_3__drt3b                                     |
    DRT_3                  | Custom                  | 250    |

    | DRT_3__SLATT                                     |                                                  |
    DRT_3                  | Custom                  | 20     |'
  notes: The pinned DefenseFinder HMM inventory records DRT_3__drt3a, DRT_3__drt3b,
    and DRT_3__SLATT under the DRT_3 model namespace, with DRT_3__SLATT lacking an
    emitted HMM name.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "DRT\tDRT_3\t2\t2\tDRT_3__drt3a, DRT_3__drt3b\t\t\t"
  notes: The pinned DefenseFinder rules table models DRT_3 as a DRT subsystem requiring
    DRT_3__drt3a and DRT_3__drt3b.
