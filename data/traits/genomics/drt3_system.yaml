identifier: traitmech:000545
label: DRT3 system
definition: A DRT system in which an organism possesses a genome-encoded DefenseFinder
  DRT_3 subtype locus represented by the mandatory DRT_3__drt3a and DRT_3__drt3b profiles.
definition_source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
trait_category: GENOMICS
term_kind: CLASS
