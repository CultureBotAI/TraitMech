discussions:
- discussion_id: drt3-profile-activity-gap
  prompt: Resolve the DRT3 reverse-transcriptase products, direct phage trigger, host
    breadth, non-coding RNA or DRT_3__SLATT partner-feature role, and DRT_3 profile-to-activity
    criteria before minting DRT3 mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated reverse transcriptases as a broad
    antiphage-system family and the two RT components of DRT type 3, while the pinned
    DefenseFinder HMM inventory and rules table support DRT_3 as a two-required-profile
    DRT subsystem. This first-pass record leaves the exact DRT3 RT products, phage
    trigger, host breadth, DRT_3__SLATT role, and profile-to-activity requirements
    unresolved.
  evidence:
  - reference: DOI:10.1126/science.aba0372
    snippet: We discovered that a family of uncharacterized reverse transcriptases
      (RTs) are active defense systems
    notes: Gao et al. experimentally support defense-associated reverse transcriptases
      as active antiphage systems.
  - reference: DOI:10.1126/science.aba0372
    snippet: In all cases, mutations in the RT active site [(Y/F)xDD to (Y/F)xAA,
      where x is any amino acid] abolished activity
    notes: Gao et al. connect DRT antiphage activity to conserved reverse-transcriptase
      active-site residues.
  - reference: DOI:10.1126/science.aba0372
    snippet: the UG3 (drt3a) and UG8 (drt3b) RTs are components of the same defense
      system (DRT type 3), with both RTs required for defense activity
    notes: Gao et al. support the two reverse-transcriptase components of the DRT
      type 3 defense system.
