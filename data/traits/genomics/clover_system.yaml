identifier: traitmech:000415
label: Clover system
definition: A phage defense system in which an organism possesses a Clover anti-phage
  system whose CloA deoxynucleoside triphosphohydrolase dynamically responds to an
  activating phage cue and to a CloB-produced inhibitory p3diT nucleotide signal to
  coordinate nucleotide-pool disruption during antiviral immunity.
definition_source: DOI:10.1038/s41586-026-10135-0
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Clover
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-026-10135-0
evidence:
- reference: DOI:10.1038/s41586-026-10135-0
  snippet: Here we identify Clover, a bacterial anti-phage defence system that overcomes
    this trade-off by encoding a deoxynucleoside triphosphohydrolase enzyme (CloA)
    that dynamically responds to both an activating phage cue and an inhibitory nucleotide
    immune signal produced by a partnering regulatory enzyme (CloB).
  notes: Yu and Kranzusch define Clover as a bacterial anti-phage defence system encoding
    CloA and CloB.
- reference: DOI:10.1038/s41586-026-10135-0
  snippet: Analysis of phage restriction by Clover in cells and reconstitution of
    enzymatic function in vitro demonstrate that CloA is a dGTPase that responds to
    viral enzymes that increase cellular levels of dTTP.
  notes: Yu and Kranzusch support CloA as a Clover dGTPase that responds to viral
    enzymes that increase cellular dTTP.
- reference: DOI:10.1038/s41586-026-10135-0
  snippet: To restrain CloA activation in the absence of infection, we show that CloB
    synthesizes a dTTP-related inhibitory nucleotide signal, p3diT
  notes: Yu and Kranzusch support CloB synthesis of the inhibitory p3diT nucleotide
    signal.
- reference: DOI:10.1038/s41586-026-10135-0
  snippet: Cryo-electron microscopy structures of CloA in activated and suppressed
    states reveal how dTTP and p3diT control distinct allosteric sites and regulate
    effector function.
  notes: Yu and Kranzusch resolve activated and suppressed CloA states controlled
    by dTTP and p3diT.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Clover | 10\.1038/s41586-026-10135-0 | Nucleotide signals coordinate
    activation and inhibition of bacterial immunity |'
  notes: The pinned DefenseFinder article registry maps the named Clover system to
    the Yu and Kranzusch nucleotide-signal anti-phage-defense paper. The pinned HMM
    inventory and rules table do not list Clover, so this row is name-to-paper evidence
    rather than model-component evidence.
