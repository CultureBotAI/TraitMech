discussions:
- discussion_id: pfiat-mechanism-gap
  prompt: Resolve natural PfiAT host breadth, the PfiT cellular target in Pseudomonas,
    Pf prophage production and immunity coupling, and PfiAT profile-to-activity mapping
    before minting narrower PfiAT mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Li et al. support PA0729/PfiT and Rorf0727/PfiA in the Pf4 prophage as
    a type II toxin-antitoxin pair that regulates Pf4 production and phage immunity,
    and DefenseFinder models PfiAT as a two-profile system with PfiAT__PfiA and PfiAT__PfiT
    markers. Natural host breadth, the cellular target of PfiT, Pf4 immunity coupling,
    and profile-to-activity mapping remain unresolved.
  evidence:
  - reference: PMID:32246813
    snippet: Homologs of PfiT are also found in other Pseudomonas strains, and the
      cellular target of PfiT in Pseudomonas will be investigated in future studies.
    notes: Li et al. explicitly leave the PfiT cellular target unresolved.
  attaches_to:
  - causal_graphs#pfiat_locus_regulates_pf4_phage
