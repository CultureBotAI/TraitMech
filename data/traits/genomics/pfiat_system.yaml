identifier: traitmech:000365
label: PfiAT system
definition: A phage defense system in which an organism possesses a Pf4 prophage-encoded
  PfiAT toxin-antitoxin locus represented by DefenseFinder as a two-profile model
  requiring PfiAT__PfiA and PfiAT__PfiT.
definition_source: DOI:10.1111/1751-7915.13570
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PfiAT
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: PfiAT__PfiA
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: PfiAT__PfiT
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: PMID:32246813
  snippet: we provided experimental evidence to demonstrate that PA0729 and the upstream
    ORF Rorf0727 near the right attachment site of Pf4 form a type II toxin/antitoxin
    (TA) pair.
  notes: Li et al. experimentally identify PA0729 and Rorf0727 in the Pf4 prophage
    as a PfiT/PfiA type II toxin-antitoxin pair.
- reference: PMID:32246813
  snippet: Importantly, we found that the deletion of the toxin gene PA0729 greatly
    increased Pf4 phage production.
  notes: Li et al. show that deleting pfiT increases Pf4 phage production.
- reference: PMID:32246813
  snippet: We thus suggest the toxin PA0729 be named PfiT for Pf4 inhibition toxin
    and Rorf0727 be named PfiA for PfiT antitoxin.
  notes: Li et al. name PA0729 as PfiT and Rorf0727 as PfiA.
- reference: PMID:32246813
  snippet: Therefore, this study reveals that the TA systems in Pf prophages can regulate
    phage production and phage immunity, providing new insights into the function
    of TAs in mobile genetic elements.
  notes: Li et al. frame Pf prophage toxin-antitoxin systems as regulators of phage
    production and phage immunity.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: PfiAT | 10\.1111/1751-7915\.13570 | Prophage encoding toxin/antitoxin system
    PfiT/PfiA inhibits Pf4 production in Pseudomonas aeruginosa
  notes: The DefenseFinder article registry maps the named PfiAT system to Li et al.'s
    Pf4 prophage PfiT/PfiA paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "PfiAT\tPfiAT\t2\t2\tPfiAT__PfiA, PfiAT__PfiT\t\t\t"
  notes: The DefenseFinder rules table models PfiAT as a two-profile system requiring
    the PfiAT__PfiA and PfiAT__PfiT profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| PfiAT__PfiA                                      | PfiAT__PfiA                                      |
    PfiAT                  | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records PfiAT__PfiA under PfiAT.
