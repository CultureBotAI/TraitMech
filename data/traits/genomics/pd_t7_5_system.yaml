identifier: traitmech:000397
label: PD-T7-5 system
definition: A phage defense system in which an organism possesses a PD-T7-5 locus
  represented by DefenseFinder as a single-profile model, PD-T7-5__PD-T7-5, and experimentally
  linked to SECphi17, T3, and T7 protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: PD-T7-5
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
- synonym_text: PD-T7-5__PD-T7-5
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T7-5 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: PD-T7-5 is a defense system composed of a single protein which was discovered
    in :ref{doi=10.1038/s41564-022-01219-4}. Its antiphage activity was assessed by
    heterologous expression in *E. coli* against T7 and to reduce the size of lysis
    plaques of T3 :ref{doi=10.1038/s41564-022-01219-4}. PD-T7-5 contains a PD(D/E)XK
    nuclease domain like [PD-T7-1](/defense-systems/pd-t7-1).
  notes: The DefenseFinder wiki describes PD-T7-5 as a single-protein defense system
    with heterologous E. coli antiphage activity against T7 and T3 plaque-size reduction.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: As far as we are aware, the molecular mechanism is unknown. However, the
    presence of a PD(D/E)XK domain in PD-T7-5 suggests a mechanism of action via DNA
    degradation :ref{doi=10.1038/s41564-022-01219-4}.
  notes: The DefenseFinder wiki states that PD-T7-5 molecular mechanism is unresolved
    and leaves the PD(D/E)XK-mediated DNA degradation interpretation as a hypothesis.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: 'The PD-T7-5 system is composed of one protein: PD-T7-5.'
  notes: The DefenseFinder wiki names PD-T7-5 as a single-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: 'The PD-T7-5 system in *Shewanella putrefaciens* (GCF_019599085.1, NZ_CP080633)
    is composed of 1 protein: PD-T7-5 (WP_220590848.1)'
  notes: The DefenseFinder wiki illustrates a predicted one-protein PD-T7-5 locus
    in RefSeq assembly GCF_019599085.1 on NZ_CP080633.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
    \ et al., 2022</a>] --> Origin_0\n    Origin_0[Escherichia coli \n<a href='https://ncbi.nlm.nih.gov/protein/RRM82777.1'>RRM82777.1</a>]\
    \ --> Expressed_0[Escherichia coli]\n    Expressed_0[Escherichia coli] ----> SECphi17\
    \ & T3 & T7"
  notes: The DefenseFinder experimental-validation diagram links Vassallo et al. to
    an E. coli PD-T7-5 source locus expressed in E. coli against SECphi17, T3, and
    T7.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t7-5.md
  snippet: "subgraph Title4[Protects against]\n        SECphi17\n        T3\n    \
    \    T7"
  notes: The DefenseFinder experimental-validation diagram lists SECphi17, T3, and
    T7 in the PD-T7-5 protects-against subgraph.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: PD-T7-5 | 10\.1101/2022\.05\.12\.491691 | Mapping the landscape of anti-phage
    defense mechanisms in the E\. coli pangenome
  notes: The DefenseFinder article registry maps the named PD-T7-5 system to the Vassallo
    et al. E. coli pangenome phage-defense preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "PD-T7-5\tPD-T7-5\t1\t1\tPD-T7-5__PD-T7-5\t\t\t"
  notes: The DefenseFinder rules table models PD-T7-5 as a single-profile system requiring
    PD-T7-5__PD-T7-5.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| PD-T7-5__PD-T7-5                                 | PD-T7-5__PD-T7-5                                 |
    PD-T7-5                | Custom                  | 90     |'
  notes: The DefenseFinder HMM inventory records PD-T7-5__PD-T7-5 under the PD-T7-5
    system namespace.
