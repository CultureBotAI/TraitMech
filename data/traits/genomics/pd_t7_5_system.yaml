- discussion_id: pd-t7-5-mechanism-gap
  prompt: Resolve PD-T7-5 natural host breadth, direct phage trigger, and PD(D/E)XK
    effector mechanism before minting narrower PD-T7-5 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T7-5 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against SECphi17, T3, and T7, and DefenseFinder represents
    the system with one profile. Natural host breadth, the direct phage trigger, and
    the PD(D/E)XK effector mechanism remain unresolved.
