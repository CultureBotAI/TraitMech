discussions:
- discussion_id: divona-mechanism-gap
  prompt: Resolve Divona phage triggers and effector outputs before minting narrower
    Divona mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Divona as a named anti-phage
    system with a VCA0374 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
