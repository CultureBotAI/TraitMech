    node_type: TRAIT
    grounding: METPO:1000429
    description: METPO GC-low bin (synonym GC_42.65_57.0; see record).
  - node_id: gc_mid1_bin
    label: GC mid1
    node_type: TRAIT
    grounding: METPO:1000430
    description: METPO GC-mid1 bin (synonym GC_>66.3; see record).
  - node_id: gc_mid2_bin
    label: GC mid2
    node_type: TRAIT
    grounding: METPO:1000431
    description: METPO GC-mid2 bin (synonym GC_57.0_66.3; see record).
  - node_id: cytosine_deamination
    label: cytosine deamination
    node_type: BIOLOGICAL_PROCESS
    description: Hydrolytic deamination of cytosine to uracil/thymine, a GC-to-AT
      mutational lesion.
  - node_id: guanine_oxidation
    label: guanine oxidation (8-oxoG)
    node_type: BIOLOGICAL_PROCESS
    description: Oxidative damage forming 8-oxoguanine that mispairs and biases the
      mutational spectrum toward AT.
  - node_id: dna_repair_replication_system
    label: DNA replication and repair (DRR) system change
    node_type: BIOLOGICAL_PROCESS
    description: Evolutionary change in DNA replication/repair machinery producing
      mutational biases that shape GC composition.
  - node_id: translesion_synthesis
    label: error-prone translesion synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Error-prone DNA synthesis past lesions by specialized polymerases,
      causally linked to increased genomic GC.
    grounding: GO:0042276
