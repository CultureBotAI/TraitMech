identifier: METPO:1000127
label: GC content
definition: A quality that is describing the percentage of guanine and cytosine nucleotides
  in genomic DNA, calculated as the ratio of GC base pairs to total base pairs.
definition_source: DOI:10.1038/nrg2358
trait_category: GENOMICS
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000188
created_by: Luke Wang
evidence:
- reference: DOI:10.1038/nrg2358
  snippet: GC content
  notes: Bacterial-genome review supports GC content as a fundamental genome-composition
    descriptor varying widely across prokaryotic lineages.
- reference: DOI:10.1186/1471-2148-10-374
  snippet: GC-biased gene conversion
  notes: Bacterial-GC-content evolution review supports GC-biased gene conversion
    and mutation bias as the mechanistic drivers of genomic GC composition.
causal_graphs:
- graph_id: gc_content_composition_drivers
  title: GC content composition drivers
  scope_status: NONMECHANISTIC
  scope_notes: This genomics record is a measurement, genomic-element classification,
    or population-level descriptor rather than one taxon-specific protein mechanism;
    contextual protein nodes do not receive token UniProt examples.
  description: DOI-backed graph linking mutation bias, GC-biased gene conversion,
    and selection on codon usage to the genome-wide GC content phenotype, with `is
    a` edges to the four METPO GC-content bins.
  nodes:
  - node_id: gc_content_trait
    label: GC content
    node_type: TRAIT
    grounding: METPO:1000127
    description: Percentage of guanine and cytosine nucleotides in genomic DNA.
  - node_id: genomic_dna
    label: genomic DNA
    node_type: CELLULAR_LOCALIZATION
    description: Bacterial or archaeal chromosomal DNA on which GC composition is
      measured.
  - node_id: mutation_bias
    label: GC/AT mutation bias
    node_type: BIOLOGICAL_PROCESS
    description: Asymmetric substitution rates between GC and AT base pairs across
      the genome.
  - node_id: gc_biased_gene_conversion
    label: GC-biased gene conversion
    node_type: BIOLOGICAL_PROCESS
    description: Recombination-associated process favoring fixation of GC alleles
      at heterozygous sites.
  - node_id: codon_usage_selection
    label: selection on codon usage
    node_type: BIOLOGICAL_PROCESS
    description: Translational and gene-expression selection shaping synonymous-codon
      GC content.
  - node_id: gc_high_bin
