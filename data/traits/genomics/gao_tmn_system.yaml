discussions:
- discussion_id: gao-tmn-mechanism-gap
  prompt: Resolve Gao_Tmn natural hosts, TmnA component function, phage triggers,
    and effector activity before minting narrower Gao_Tmn mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support widespread antiviral gene cassettes that mediate protection
    against specific bacteriophages, and DefenseFinder models Gao_Tmn as a single-profile
