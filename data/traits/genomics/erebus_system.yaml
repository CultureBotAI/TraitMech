identifier: traitmech:000308
label: Erebus system
definition: A phage defense system in which an organism possesses an Erebus locus
  that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1016/j.chom.2024.07.007
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
