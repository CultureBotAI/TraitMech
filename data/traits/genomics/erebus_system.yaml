discussions:
- discussion_id: erebus-mechanism-gap
  prompt: Resolve Erebus phage triggers and effector outputs before minting narrower
    Erebus mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: van den Berg et al. and DefenseFinder support Erebus as a named anti-phage
    system with an Erebus__EruA HMM profile entry, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
  attaches_to:
  - causal_graphs#erebus_locus_restricts_phage
