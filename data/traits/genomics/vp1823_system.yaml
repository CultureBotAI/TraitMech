identifier: traitmech:000485
label: VP1823 system
definition: A phage defense system in which an organism possesses a VP1823-family
  locus represented by the DefenseFinder VP1823__VP1823 custom HMM profile and experimentally
  linked to reduced bacteriophage plaquing when the cloned Vibrio parahaemolyticus
  RIMD 2210633 vp1823 cassette is expressed from a VSV105 plasmid.
