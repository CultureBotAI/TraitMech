identifier: traitmech:000387
label: PD-T4-2 system
definition: A phage defense system in which an organism possesses a PD-T4-2 locus
  represented by DefenseFinder as a two-profile model requiring PD-T4-2__PD-T4-2_A
  and PD-T4-2__PD-T4-2_B, and experimentally linked to T2, T4, T6, T5, and SECphi27
  protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-2.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
