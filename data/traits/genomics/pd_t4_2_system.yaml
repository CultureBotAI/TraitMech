evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T4-2 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-2.md
  snippet: 'The PD-T4-2 is composed of 2 proteins: PD-T4-2_A and PD-T4-2_B.'
  notes: The DefenseFinder wiki names PD-T4-2 as a two-protein system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-2.md
  snippet: The PD-T4-2 system in *Jeotgalibaca sp. PTS2502* (GCF_001975685.1, NZ_CP019433)
    is composed of 2 proteins PD-T4-2_A (WP_083686895.1) PD-T4-2_B (WP_076765701.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-T4-2 locus
    in RefSeq assembly GCF_001975685.1 on NZ_CP019433.
