discussions:
- discussion_id: pd-t4-2-mechanism-gap
  prompt: Resolve PD-T4-2 natural host breadth, direct phage trigger, and effector
    mechanism before minting narrower PD-T4-2 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T4-2 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T2, T4, T6, T5, and SECphi27, and DefenseFinder
    represents the system with two mandatory profiles. Natural host breadth, the direct
    phage trigger, and effector logic remain unresolved.
