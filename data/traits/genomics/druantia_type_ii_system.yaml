identifier: traitmech:000579
label: Druantia type II system
definition: A Druantia system in which an organism possesses a locus encoding DruE
  together with DruM, DruF and DruG.
definition_source: DOI:10.1093/nar/gkab883
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000234
synonyms:
- synonym_text: Type II Druantia system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.65215/LTSpreprints.2026.06.18.000273
evidence:
- reference: DOI:10.1093/nar/gkab883
  snippet: the Druantia-like system lacks the type II requisite DruM and DruG proteins
  notes: 'Payne et al., Results: Identification of new defence system variants, and
    Figure 2C: type II contains DruE/F/M/G; the proposed type IV shares DruE/F but
    replaces the type-II M/G architecture with DruL. This supports locus composition,
    not experimental dependence of each component in every host. The type-II distribution
    observed in RefSeq v201 is not a universal taxonomic limit.'
- reference: DOI:10.65215/LTSpreprints.2026.06.18.000273
  snippet: DruE alone confers limited protection against a subset of coliphages in
    heterologous expression
  notes: Hou et al., version 2 posted 2026-07-08, not peer reviewed; PDF https://langtaosha.org.cn/lts/en/preprint/download/273/1236,
    pages 5-6 and 18, Figure 1 and supplementary Figure S2. The Pf-5 druMFGE locus
    is the source. Purified DruE is an ATP-dependent 3-prime-to-5-prime helicase preferring
    3-prime overhangs and forks, with an asymmetric homodimer. Standalone DruE in
    E. coli BL21 gave limited T7/T1 protection; R1241A reduced protection. Insoluble
    DruF/G prevented full-system reconstitution. Native-host phage defense and the
    link from unwinding to restriction remain untested or unresolved. Pf-5 deletion
    assays under mitomycin C suggest accessory control of toxicity, not a demonstrated
    defense trigger.
- reference: https://raw.githubusercontent.com/padlocbio/padloc-db/9e380165633a8d6aef93b5a164cea0f3359bd33f/sys/druantia_type_II.yaml
  snippet: "core_genes:\n  - DruE2\n  - DruF2\n  - DruG2\n  - DruM2"
  notes: 'Pinned executable PADLOC rule, retrieved 2026-10-03: minimum_core and minimum_total
    are both 4, maximum_separation is 3, and force_strand is FALSE. DruK is secondary,
    not a required fifth component; neutral and prohibited lists contain only NA.
    These are detection constraints, not evidence of active defense.'
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/definitions/DefenseFinder/Druantia/Druantia_II.xml
  snippet: <model inter_gene_max_space="5" min_mandatory_genes_required="1" min_genes_required="3"
    vers="2.0">
  notes: 'Pinned executable DefenseFinder model, retrieved 2026-10-03: Druantia_II__DruM/F/G
    are accessory slots. DruF permits Druantia_IV__DruF4. Mandatory Druantia__DruE_1
    permits Druantia__DruE_2, Druantia__DruE_3 or Druantia_IV__DruE4. One mandatory
    and three total matches are required; no forbidden slots are declared. A call
    alone need not establish the complete DruM/F/G/E architecture. Exchangeable matches
    and missing profiles do not establish biological equivalence or component absence.'
canonical_examples:
- taxon_id: NCBITaxon:220664
  taxon_label: Pseudomonas protegens Pf-5
  reference: DOI:10.65215/LTSpreprints.2026.06.18.000273
  note: 'Natural locus possession in Pf-5, assembly GCF_000012265.1 identified by
    Hou et al. version 2, Figure 1a and Methods. Not a native-host phage-resistance
    example: infection assays used standalone DruE in engineered E. coli. NCBI resolves
    taxon 220664 to Pseudomonas protegens Pf-5.'
discussions:
- discussion_id: druantia-type-ii-full-system-defense-gap
  prompt: Resolve full-system defense and accessory functions beyond isolated DruE
    assays.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DruM/F/G/E possession is an architecture class, not an assay result or
    a universal helicase mechanism. Hou et al. version 2 provides real DruE biochemistry;
    the remaining gap is not absence of protein evidence. RCSB entry 9WAE entity 1
    maps Pf-5 PFL_3016 to UniProtKB:Q4KCB1, a live unreviewed entry checked 2026-10-03.
    No full-system causal graph is asserted because native-host phage restriction,
    accessory regulation and the unwinding-to-restriction transition are unresolved.
    The measured isolated-protein results remain in the evidence notes. Do not transfer
    type-III nuclease chemistry to type II or turn mitomycin-C growth effects into
    an infection trigger. A missing profile or incomplete assembly cannot establish
    component absence; inspect complete locus context. Organism-level subtype possession
    classes are not disjoint because a genome may encode several loci.
  posed_by: codex
  posed_date: '2026-10-03'
