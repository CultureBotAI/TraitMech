identifier: traitmech:000304
label: AbiH system
definition: An abortive infection system in which an organism possesses an abiH-family
  locus represented by the DefenseFinder AbiH__AbiH profile and exemplified by the
  Lactococcus lactis S94 abiH gene that encodes lactococcal phage abortive-infection
  resistance.
definition_source: DOI:10.1111/j.1574-6968.1996.tb08446.x
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: AbiH
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1111/j.1574-6968.1996.tb08446.x
  snippet: A gene which encodes resistance by abortive infection (Abi+) to bacteriophage
    was cloned from Lactococcus lactis ssp. lactis biovar. diacetylactis S94
  notes: Prevots et al. cloned abiH from Lactococcus lactis S94 and connected the
    locus to bacteriophage resistance by abortive infection.
- reference: DOI:10.1111/j.1574-6968.1996.tb08446.x
  snippet: This gene was found to confer a reduction in efficiency of plating and
    plaque size for prolate-headed bacteriophage phi 53 (group I of homology) and
    total resistance to the small isometric-headed bacteriophage phi 59 (group III
    of homology)
  notes: Prevots et al. show that the cloned abiH gene restricts multiple lactococcal
    phages with distinct plating phenotypes.
- reference: DOI:10.1111/j.1574-6968.1996.tb08446.x
  snippet: The cloned gene is predicted to encode a polypeptide of 346 amino acid
    residues with a deduced molecular mass of 41 455 Da
  notes: Prevots et al. support abiH as an encoded phage-resistance protein rather
    than a noncoding marker.
- reference: DOI:10.1111/j.1574-6968.1996.tb08446.x
  snippet: No homology with any previously described genes was found
  notes: Prevots et al. leave the molecular class and effector mechanism of AbiH unresolved.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: AbiH | 10\.1111/j\.1574-6968\.1996\.tb08446\.x | Cloning and sequencing
    of the novel abortive infection gene abiH of Lactococcus lactis ssp\. lactis biovar\.
    diacetylactis S94
  notes: The DefenseFinder article registry maps the named AbiH system to the Prevots
    et al. abiH cloning paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "AbiH\tAbiH\t1\t1\tAbiH__AbiH"
  notes: The DefenseFinder rules table models AbiH as a one-component system requiring
    the AbiH__AbiH profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| AbiH__AbiH                                       | AbiH__AbiH                                       |
    AbiH                   | PF14253.7               | 30.9   |'
  notes: The DefenseFinder HMM inventory records the PF14253.7-backed AbiH__AbiH profile
    under the AbiH model namespace.
canonical_examples:
