causal_graphs:
- graph_id: abih_locus_restricts_lactococcal_phages
  title: AbiH activity restricts lactococcal phages
  description: Conservative system-level sketch linking an abiH-family locus to AbiH
    antiphage activity, reduced lactococcal phage plaque formation, restricted phage
    propagation, and abortive-infection system possession without asserting the unresolved
    phage trigger or molecular target.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures AbiH as a named DefenseFinder single-profile abortive-infection
    system whose prototype abiH gene reduces or abolishes plating by tested lactococcal
    phages while leaving the direct phage trigger, AbiH molecular function, host or
    phage target, arrest route, and phage escape routes unresolved.
