discussions:
- discussion_id: abih-trigger-and-effector-gap
  prompt: Resolve the AbiH phage trigger, molecular activity, and direct arrest target
    before minting narrower AbiH mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Prevots et al. support AbiH as a named lactococcal abortive-infection
    gene whose cloned S94 locus reduces or blocks plating by tested lactococcal phages,
    and DefenseFinder represents AbiH with a one-profile rule. This system-level record
    leaves the phage trigger, AbiH molecular function, direct cellular target, growth-arrest
    or cell-death route, and phage escape routes unresolved.
  attaches_to:
