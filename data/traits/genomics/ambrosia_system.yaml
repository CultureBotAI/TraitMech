identifier: traitmech:000329
label: Ambrosia system
definition: A phage defense system in which an organism possesses a five-gene Ambrosia
  locus encoding AbrR, AbrA, AbrB, AbrC, and AbrD components that can limit siphophage
  and myophage propagation.
definition_source: DOI:10.1101/2025.09.30.679545
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Ambrosia
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1101/2025.09.30.679545
evidence:
- reference: DOI:10.1101/2025.09.30.679545
  snippet: 'From over 500 candidate defense systems, we selected nine for experimental
    testing and validated three: Dionysus, a TerB-encoding system that disrupts early
    phage infection vesicle formation by Jumbo phages; Ophion, a Radical SAM-containing
    system that prevents the formation of the Jumbo phage nucleus; and Ambrosia, a
    tightly regulated RM-like system.'
  notes: Keesman et al. named Ambrosia among three modular phage-defense candidates
    validated experimentally from an initial pool of more than 500 candidates.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Ambrosia, named after the food and drinks that provide immortality to the
    Greek gods, consists of five genes and provides protection against siphophages
    from the Mesyanzhinovviridae family and myophages from the Pbunavirus genus, limiting
    phage propagation in both solid and liquid cultures
  notes: Keesman et al. support Ambrosia as a five-gene system that limits propagation
    of Mesyanzhinovviridae siphophages and Pbunavirus myophages.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: The five genes of Ambrosia encode a HipB-like XRE transcriptional regulator
    (AbrR), a RM type II-associated N6 adenine-specific DNA methylase (MTase, AbrA),
    a sensor histidine kinase/heat-shock-protein(HSP)90-like ATPase (HATPase, AbrB),
    a response regulator (REC, AbrC), and an RM type IV HNH endonuclease (AbrD)
  notes: Keesman et al. describe the Ambrosia locus as encoding AbrR, AbrA, AbrB,
    AbrC, and AbrD components with RM-like and two-component regulatory-system features.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Each protein is required for anti-phage activity, since mutating conserved
    residues in any of the predicted functional domains completely abolishes Ambrosia
    defense activity
  notes: Keesman et al. support each predicted functional domain as required for the
    tested Ambrosia anti-phage activity.
- reference: DOI:10.1101/2025.09.30.679545
  snippet: Overall, our results indicate that the RM-like components of Ambrosia do
    not operate as a conventional type II RM system. Instead, Ambrosia appears to
    represent a distinct, tightly regulated phage defense system in which a HipB-like
    XRE protein and a two-component regulatory module control the expression of RM-like
    enzymes in response to infection
  notes: Keesman et al. argue that Ambrosia is distinct from a conventional type II
    restriction-modification system and is regulated in response to phage infection.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Ambrosia | 10\.1101/2025\.09\.30\.679545 | Discovery of phage defense systems
    through component modularity networks
  notes: The DefenseFinder article registry maps the named Ambrosia system to the
    Keesman et al. modular phage-defense discovery preprint; the pinned DefenseFinder
    HMM inventory and rules table do not list Ambrosia, so this row is name-to-paper
    evidence rather than model-component evidence.
