discussions:
- discussion_id: ambrosia-regulatory-mechanism-gap
  prompt: Resolve Ambrosia phage triggers, DNA targets, and model coverage before
    minting narrower Ambrosia mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Keesman et al. support Ambrosia as a five-gene anti-phage system with
    tightly regulated RM-like components, but the direct phage trigger, the AbrB/AbrC
    regulatory chain, the exact AbrA/AbrD substrate and DNA modification, natural
    locus breadth, and profile-to-component model are not resolved enough here to
    assert a narrower mechanistic child trait.
