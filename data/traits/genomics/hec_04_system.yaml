evidence:
- reference: DOI:10.1101/2024.01.29.577857
  snippet: an ATPase fused to a TOPRIM domain (HEC-04)
  notes: Payne et al. identify HEC-04 as a Hma-embedded antiviral candidate encoding
    an ATPase fused to a TOPRIM domain.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: A quantitative assessment of the remaining systems showed that these were
    able to reduce the EOP of at least two phages by several orders of magnitude compared
    to the control
  notes: Payne et al. support reduced plaquing for the active Hma-embedded candidate
    systems after excluding inactive HEC-01 and HEC-09 candidates.
- reference: DOI:10.1101/2024.01.29.577857
  snippet: For HEC-04, mutation of key active site residues in either the ABC ATPase
    or nuclease domains demonstrated their essential roles in defence
  notes: Payne et al. show that HEC-04 defense requires intact ABC ATPase and nuclease
    active-site residues.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| HEC-04 | 10\.1101/2024\.01\.29\.577857 | New antiviral defences are
    genetically embedded within prokaryotic immune systems |'
  notes: The pinned DefenseFinder article registry maps the HEC-04 source key to the
    Payne et al. Hma-embedded-candidate preprint.
