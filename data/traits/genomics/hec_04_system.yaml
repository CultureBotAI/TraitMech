    molecular output, and rule-level detection criteria before minting narrower HEC-04
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Payne et al. support HEC-04 as a single-gene Hma-embedded candidate anti-phage
    system whose ABC ATPase and nuclease domains are both required for defense, and
    the pinned DefenseFinder HMM inventory records one HEC-04 profile row. The pinned
    rules table has no HEC-04 row, and the first-pass record does not yet resolve
    natural host breadth, phage target breadth, or the direct molecular output.
  evidence:
  - reference: DOI:10.1101/2024.01.29.577857
