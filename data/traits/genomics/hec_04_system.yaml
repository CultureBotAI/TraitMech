identifier: traitmech:000465
label: HEC-04 system
definition: A phage defense system in which an organism possesses the single-gene
  HEC-04 Hma-embedded candidate locus, encoding an ABC ATPase fused to a TOPRIM-family
  nuclease domain, that can reduce bacteriophage plaquing.
definition_source: DOI:10.1101/2024.01.29.577857
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
