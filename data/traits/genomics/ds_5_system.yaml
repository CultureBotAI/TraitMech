evidence:
- reference: DOI:10.1126/science.adv7924
  snippet: To test for anti-phage defense, we placed each TU with its predicted native
    promoter region on a low-copy number plasmid in E. coli MG1655 and challenged
    these strains with a panel of 24 diverse E. coli phages (Fig. 3; fig. S2). In
    total, 42 (45% of 94) of the cloned TUs produced smaller plaque sizes or reduced
    the efficiency of plating (EOP) at least ten-fold relative to an empty vector
    control strain
  notes: DeWeirdt et al. experimentally validated 42 predicted transcriptional units
    as phage-defense systems in E. coli.
- reference: DOI:10.1126/science.adv7924
  snippet: We refer to these validated TUs as DefensePredictor discovered systems
    (DSs), with genes in multi-gene TUs denoted by an alphabetical suffix, e.g., DS-8A
    is the first gene of DS-8.
  notes: DeWeirdt et al. name validated transcriptional units as DefensePredictor
    discovered systems.
- reference: DOI:10.1126/science.adv7924
  snippet: DS-5 is a two protein system that also features a PIN ribonuclease, though
    not closely related to that of DS-3, along with a second protein containing a
    DUF5830 and a domain homologous to the anti-CRISPR protein AcrIF4
  notes: DeWeirdt et al. describe DS-5 as a two-protein system containing PIN, DUF5830,
    and AcrIF4-like domains.
- reference: DOI:10.1126/science.adv7924
  snippet: Mutating the catalytic residues in the PIN domain eliminated defense. Deleting
    the AcrIF4 domain-containing gene also ablated defense by DS-5 but did not lead
    to unrestrained toxicity of the ribonuclease indicating that DS-5 is likely not
    a TA system and that both components are essential to defense
  notes: DeWeirdt et al. report that DS-5 phage defense requires the predicted PIN
    catalytic residues and the AcrIF4-domain-containing gene.
- reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC13092281.1/NIHMS2163519-supplement-Table_S6.xlsx
  snippet: "PN12\tNZ_QOYG01000008.1\tGCF_003333715.1\t+\tTrue\tFalse\tFalse\tTrue\t\
    DefensePredictor hits\t68231\t69878\thypothetical protein, PIN domain-containing\
    \ protein\tWP_021513008.1, WP_021513009.1\t10.04757221593433\t-2.824774475410352\t\
    True\tFalse\tPredicted novel defense gene\tDS-5"
  notes: The final Science supplementary Table S6 maps working_id PN12 to DS_name
