identifier: traitmech:000399
label: Old exonuclease system
definition: A phage defense system in which an organism possesses an Old exonuclease
  locus represented by DefenseFinder as a single-profile model, Old_exonuclease__Old_exonuclease,
  and experimentally linked to interference with phage lambda by the bacteriophage
  P2 Old protein.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/old_exonuclease.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Old_exonuclease
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: Old_exonuclease__Old_exonuclease
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1128/jb.177.3.497-501.1995
  snippet: The Old protein of bacteriophage P2 is responsible for interference with
    the growth of phage lambda and for killing of recBC mutant Escherichia coli.
  notes: The 1995 Old nuclease study identifies the P2 Old protein as responsible
    for phage-lambda interference.
- reference: DOI:10.1128/jb.177.3.497-501.1995
  snippet: The Old protein fused to maltose-binding protein has exonuclease activity
    on double-stranded DNA as well as nuclease activity on single-stranded DNA and
    RNA.
  notes: The 1995 biochemical study shows Old has nuclease activity on double-stranded
    DNA, single-stranded DNA, and RNA.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/old_exonuclease.md
  snippet: It's been shown to protect against phage lambda :ref{doi=10.1128/jb.177.3.497-501.1995},
    and when cloned with the P2 Tin accessory gene, it was shown to protect against
    other *E. coli* phages :ref{doi=10.1016/j.chom.2022.02.018}.
  notes: The pinned DefenseFinder wiki page links Old_exonuclease to lambda protection
    and to broader P2 Old plus Tin protection.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/old_exonuclease.md
  snippet: The old_exonuclease is dsDNA exonuclease that digests in the 5' to 3' direction
    :ref{doi=10.1128/jb.177.3.497-501.1995}. To our knowledge, other aspects of the
    molecular mechanisms remain unknown.
  notes: The pinned DefenseFinder wiki page supports Old dsDNA exonuclease activity
    while leaving the remaining molecular mechanism unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/old_exonuclease.md
  snippet: 'The Old_exonuclease is composed of 1 protein: Old_exonuclease.'
  notes: The pinned DefenseFinder wiki page describes Old_exonuclease as a one-protein
    system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/old_exonuclease.md
  snippet: 'The Old_exonuclease system in *Shewanella xiamenensis* (GCF_022453805.1,
    NZ_CP092630) is composed of 1 protein: Old_exonuclease (WP_240293412.1)'
  notes: The pinned DefenseFinder wiki page illustrates a predicted Old_exonuclease
    locus in RefSeq assembly GCF_022453805.1 on NZ_CP092630.
