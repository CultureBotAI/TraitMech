    snippet: The Old protein fused to maltose-binding protein has exonuclease activity
      on double-stranded DNA as well as nuclease activity on single-stranded DNA and
      RNA.
    notes: The 1995 biochemical study shows Old has nuclease activity on double-stranded
      DNA, single-stranded DNA, and RNA.
