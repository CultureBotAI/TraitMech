discussions:
- discussion_id: old-exonuclease-tin-trigger-mechanism-gap
  prompt: Resolve Old_exonuclease natural host breadth, Tin accessory dependence,
    RecBCD-triggered activation, profile-to-protein mapping, and lambda interference
    mechanism before minting narrower Old nuclease mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The 1995 P2 Old paper supports Old nuclease activity and phage-lambda
    interference, and DefenseFinder represents Old_exonuclease as a required single-profile
    model. This first system-level record leaves Tin dependence in the Rousset et
    al. assay, natural host breadth, RecBCD-linked activation, profile-to-protein
    mapping, and the exact phage-interference mechanism unresolved.
  evidence:
  - reference: DOI:10.1128/jb.177.3.497-501.1995
    snippet: The Old protein of bacteriophage P2 is responsible for interference with
      the growth of phage lambda and for killing of recBC mutant Escherichia coli.
    notes: The 1995 Old nuclease study identifies the P2 Old protein as responsible
      for phage-lambda interference.
