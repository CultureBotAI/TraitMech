- graph_id: ds_30_locus_reduces_phage_plaquing
  title: DS-30 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the four-gene DS-30 locus
    to reduced bacteriophage plaquing without resolving DS-30 component functions
    or molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-30 as the validated ABC3 transcriptional unit
    with four product accessions, ABC-3C, SMC-family, and FtsL HHpred-domain rows,
    and four Lamassu-Fam custom HMM-profile rows. It does not assert native host breadth,
    exact profile-to-protein correspondence, DS-30/Lamassu-Fam component activity,
    Lamassu subtype chemistry, LmuC requirement, complete phage breadth, or DS-30-specific
    DefenseFinder rule-level detection criteria.
