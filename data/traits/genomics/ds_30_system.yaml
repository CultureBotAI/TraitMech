identifier: traitmech:000470
label: DS-30 system
definition: A phage defense system in which an organism possesses the four-gene DefensePredictor-discovered
  system 30 locus cataloged as working transcriptional unit ABC3 and whose plasmid
  expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
