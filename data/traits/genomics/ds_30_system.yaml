discussions:
- discussion_id: ds-30-lamassu-family-model-gap
  prompt: Resolve DS-30 native host breadth, exact profile-to-protein correspondence,
    DS-30/Lamassu-Fam component activities, Lamassu subtype and effector chemistry,
    LmuC requirement, complete phage breadth, and DS-30-specific DefenseFinder rule-level
    criteria before minting narrower DS-30 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-30 as the defensive ABC3 transcriptional unit
    and final Science Tables S6/S7/S8 map it to four product accessions, a SECphi27
    phage readout, four HHpred-domain rows, and display name DS-30. The pinned DefenseFinder
    HMM inventory records four Lamassu-Fam DS-30 custom profile rows. The pinned DefenseFinder
    rules table only lists generic Lamassu-Fam effector-subtype rows, and the first-pass
    record does not resolve native host breadth, complete phage breadth, direct profile-to-protein
    correspondence, LmuC requirement, molecular output, subtype-specific Lamassu chemistry,
    or endogenous DS-30 activity.
