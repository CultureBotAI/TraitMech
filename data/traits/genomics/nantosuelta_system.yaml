discussions:
- discussion_id: nantosuelta-mechanism-gap
  prompt: Resolve Nantosuelta phage triggers and effector outputs before minting narrower
    Nantosuelta mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Nantosuelta as a named anti-phage
    system with a VCA0322 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
