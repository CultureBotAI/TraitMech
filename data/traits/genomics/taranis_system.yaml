identifier: traitmech:000265
label: Taranis system
definition: A phage defense system in which an organism possesses a Taranis locus
  represented by a VCA0396 profile that can protect bacteria from bacteriophage infection.
definition_source: DOI:10.1126/science.ads0768
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
