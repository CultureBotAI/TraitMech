discussions:
- discussion_id: taranis-mechanism-gap
  prompt: Resolve Taranis phage triggers and effector outputs before minting narrower
    Taranis mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Taranis as a named anti-phage
    system with a VCA0396 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
