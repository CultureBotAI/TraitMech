discussions:
- discussion_id: rst-helicaseduf2290-host-mechanism-gap
  prompt: Resolve Rst_HelicaseDUF2290 native host breadth, accession-level DUF2290/helicase
    roles, the DUF2290_Pers profile relationship, and the mechanism of T7 restriction
    before minting narrower Rst_HelicaseDUF2290 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support a two-gene ATP-dependent helicase plus DUF2290
    P4-hotspot system that inhibits T7 growth, and DefenseFinder represents Rst_HelicaseDUF2290
    as a required two-profile model. This first system-level record leaves native
    host breadth, profile-to-gene mapping, the role of the extra DUF2290_Pers HMM
    profile, the molecular activities of the DUF2290 and helicase components, and
    the T7 restriction mechanism unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2022.02.018
    snippet: 'two systems that specifically inhibit the growth of phage T7: an ATP-dependent
      helicase associated with a DUF2290 protein and a HAD-like hydrolase associated
