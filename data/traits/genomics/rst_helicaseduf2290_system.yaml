evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: 'two systems that specifically inhibit the growth of phage T7: an ATP-dependent
    helicase associated with a DUF2290 protein and a HAD-like hydrolase associated
    with a transmembrane protein'
  notes: Rousset et al. experimentally linked an ATP-dependent helicase plus DUF2290
    protein pair to specific inhibition of phage T7 growth.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Phage resistance heatmaps of the validated defense systems show the median
    fold resistance of three independent replicates against a panel of eight phages
  notes: The Figure 5 legend frames the cloned P4-hotspot hits, including the ATP-dependent
    helicase plus DUF2290 system, as validated defense systems in a replicated phage-resistance
    heatmap.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/223cf269/content/3.defense-systems/rst_helicaseduf2290.md
  snippet: The Rst_HelicaseDUF2290 system was discovered during a screen for defense
    systems targeted at hotspots of antiphage activity in phages and phage-satellites.
    It is composed of 2 proteins, a helicase and a protein with the domain DUF2290.
  notes: The pinned DefenseFinder wiki page names Rst_HelicaseDUF2290 as a two-protein
    helicase/DUF2290 system found in antiviral hotspots of phages and phage satellites.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/223cf269/content/3.defense-systems/rst_helicaseduf2290.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The pinned DefenseFinder wiki page leaves the Rst_HelicaseDUF2290 molecular
    mechanism unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/223cf269/content/3.defense-systems/rst_helicaseduf2290.md
  snippet: 'The Rst_HelicaseDUF2290 is composed of 2 proteins: Helicase and DUF2290.'
  notes: The pinned DefenseFinder wiki page describes Rst_HelicaseDUF2290 as a two-component
