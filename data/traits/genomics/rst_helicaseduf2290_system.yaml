identifier: traitmech:000401
label: Rst_HelicaseDUF2290 system
definition: A phage defense system in which an organism possesses a two-protein Rst_HelicaseDUF2290
  locus represented by DefenseFinder as a two-profile model requiring Rst_HelicaseDUF2290__DUF2290
  and Rst_HelicaseDUF2290__Helicase and experimentally linked to T7 protection when
  expressed in Escherichia coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/223cf269/content/3.defense-systems/rst_helicaseduf2290.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
