identifier: traitmech:000334
label: ApeA system
definition: A phage defense system in which an organism possesses a single-component
  ApeA locus represented by the DefenseFinder Gao_Ape__ApeA profile, encoding an oligomeric
  HEPN-domain antiviral ribonuclease whose activation can cleave RNA substrates to
  restrict bacteriophage infection.
definition_source: DOI:10.64898/2026.01.26.701840
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: ApeA
  synonym_type: RELATED_SYNONYM
  source: DOI:10.64898/2026.01.26.701840
- synonym_text: Gao_Ape
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.64898/2026.01.26.701840
  snippet: Here, we focus on ApeA, a HEPN-domain antiviral protein that confers immunity
    through cleavage of host tRNAs within their anticodon loops.
  notes: Juozapaitis et al. describe ApeA as a HEPN-domain antiviral protein that
    cleaves host tRNAs within their anticodon loops.
- reference: DOI:10.64898/2026.01.26.701840
  snippet: Both ApeA homologs confer protection at low MOI but not at high MOI, when
    most cells are infected
  notes: Juozapaitis et al. show that Ec1ApeA and Ec2ApeA protect at low multiplicity
    of infection but not high multiplicity, supporting abortive-infection behavior.
- reference: DOI:10.64898/2026.01.26.701840
  snippet: activity of Ec1ApeA and Ec2ApeA proteins was abrogated by HEPN active site
    R521A and R502A mutations respectively
  notes: HEPN active-site mutations abrogated antiviral activity in the tested Ec1ApeA
    and Ec2ApeA proteins.
- reference: DOI:10.64898/2026.01.26.701840
  snippet: Together, these results demonstrate that Ec1ApeA exhibits endoribonuclease
    activity targeting the tRNA anticodon loop, which is specifically activated during
    bacteriophage infection.
  notes: Ec1ApeA exhibits infection-activated endoribonuclease activity targeting
    the tRNA anticodon loop.
- reference: DOI:10.64898/2026.01.26.701840
  snippet: In vitro ribonuclease assays showed that under our experimental conditions
    tRNA cleavage by wild-type Ec2ApeA was activated by dpCG
  notes: Ec2ApeA tRNA cleavage can be activated by deoxydinucleotides in vitro, supporting
    ligand-stimulated ApeA RNase activity for one ApeA variant.
- reference: DOI:10.64898/2026.03.20.713152
  snippet: We show that two ApeA homologs, Ec1ApeA and Ps2ApeA, protect against a
    variety of single-stranded RNA phages.
  notes: Drobysheva et al. show that Ec1ApeA and Ps2ApeA protect against single-stranded
    RNA phages.
- reference: DOI:10.64898/2026.03.20.713152
  snippet: results show that ApeA stops RNA phage replication by directly cleaving
    the phage genome.
  notes: Drobysheva et al. support direct phage-genome cleavage as an ApeA RNA-phage
    defense output.
- reference: DOI:10.64898/2026.03.20.713152
  snippet: In the case of infection with RNA phages, we did not see evidence for induced
    cell death by Ec1ApeA
  notes: Drobysheva et al. distinguish Ec1ApeA RNA-phage defense from cell-death abortive
    infection.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Gao_Ape | 10\.1126/science\.aba0372 | Diverse enzymatic activities mediate
    antiviral immunity in prokaryotes
  notes: The DefenseFinder article registry maps the named Gao_Ape system to the Gao
    et al. prokaryotic antiviral-immunity paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Gao_Ape\tGao_Ape\t1\t1\tGao_Ape__ApeA\t\t\t"
  notes: The DefenseFinder rules table models Gao_Ape as a single-mandatory-profile
    system with the Gao_Ape__ApeA profile.
