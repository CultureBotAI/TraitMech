discussions:
- discussion_id: apea-trigger-and-homolog-scope-gap
  prompt: Resolve ApeA natural-host loci, homolog-specific small-molecule triggers,
    phage nuclease inputs, and subtype activity before minting narrower ApeA mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Juozapaitis et al. support ApeA as an abortive infection system whose
    HEPN RNase can cleave host tRNAs within their anticodon loops, and DefenseFinder
    models Gao_Ape with the Gao_Ape__ApeA profile. This first record stays at system
    level because the curated evidence resolves deoxydinucleotide activation for Ec2ApeA,
    leaves the Ec1ApeA activator unidentified, assays several homologs heterologously,
    and does not yet define accession-level natural-host breadth.
  attaches_to:
  - causal_graphs#gao_ape_hepn_rnase_aborts_phage
  posed_by: codex
  posed_date: '2026-09-21'
