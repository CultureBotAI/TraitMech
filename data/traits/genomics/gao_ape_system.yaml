discussions:
- discussion_id: apea-trigger-and-homolog-scope-gap
  prompt: Resolve ApeA natural-host loci, homolog-specific DNA-phage versus RNA-phage
    triggers, phage nuclease inputs, phage genomic RNA targets, abortive versus non-abortive
    outputs, and subtype activity before minting narrower ApeA mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Juozapaitis et al. support DNA-phage ApeA abortive infection through
    host tRNA anticodon-loop cleavage, Drobysheva et al. support non-abortive RNA-phage
    defense through phage-genomic-RNA cleavage, and DefenseFinder models Gao_Ape with
    the Gao_Ape__ApeA profile. This first record stays at system level because the
    curated evidence leaves homolog- and phage-class-specific trigger logic, the full
    DNA-versus-RNA substrate split, activity of additional homologs, and accession-level
    natural-host breadth unresolved.
  attaches_to:
  - causal_graphs#gao_ape_hepn_rnase_restricts_phage
  posed_by: codex
  posed_date: '2026-09-21'
