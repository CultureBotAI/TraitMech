  snippet: '| Gao_Ape__ApeA                                    | Gao_Ape__ApeA                                    |
    Gao_Ape                | Custom                  | 18     |'
  notes: The DefenseFinder HMM inventory records ApeA under the Gao_Ape model namespace.
causal_graphs:
- graph_id: gao_ape_hepn_rnase_restricts_phage
  title: ApeA loci activate HEPN RNase antiphage outputs
  description: Conservative system-level sketch linking a Gao_Ape/ApeA locus to HEPN
    RNase activation, host tRNA anticodon-loop cleavage during DNA-phage abortive
    infection, phage genomic RNA cleavage during non-abortive RNA-phage defense, and
    the ApeA system trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures ApeA as a named DefenseFinder single-component system
    with alternate HEPN RNase outputs while leaving natural-host accession breadth,
    homolog- and phage-class-specific trigger differences, direct RNA-loop sensing
    by Ec1ApeA, the exact DNA-phage nuclease inputs to Ec2ApeA deoxydinucleotide signaling,
    and activity of additional homologs unresolved.
