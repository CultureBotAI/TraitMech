identifier: traitmech:000224
label: DndCDEA-PbeABCD system
definition: A phosphorothioate defense system in which an organism possesses a DndCDEA-PbeABCD
  locus that pairs DndCDEA-mediated host-DNA phosphorothioation with PbeABCD-dependent
  targeting of non-phosphorothioated viral DNA to inhibit viral DNA replication.
definition_source: DOI:10.1038/s41467-019-09390-9
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000213
synonyms:
- synonym_text: PbeABCD-mediated PT defence system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-019-09390-9
evidence:
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: a new archaeal defence system that involves DndCDEA-specific DNA phosphorothioate
    (PT) modification and the PbeABCD-mediated halt of virus propagation via inhibition
    of DNA replication
  notes: Xiong et al. name the DndCDEA-PbeABCD architecture as an archaeal PT-based
    antiviral system.
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: can defend against viral attack together with pbeABCD, a conserved 4-gene
    cassette sharing no sequence homology with DndFGH
  notes: Xiong et al. support separating PbeABCD systems from canonical Dnd systems
    whose restriction module is DndFGH.
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: DndCDEA-PbeABCD confers protection against the haloarchaeal virus SNJ1
  notes: Xiong et al. experimentally support the antiviral output of the Haloterrigena
    jeotgali A29 DndCDEA-PbeABCD locus after heterologous expression in CJ7-F cells.
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: PbeABCD exerted antiviral activity depending on the presence of PT modifications
  notes: Xiong et al. connect PbeABCD antiviral restriction to phosphorothioation-dependent
    self/non-self discrimination.
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: the subsequent viral genome replication process is significantly inhibited
    by the DndCDEA-PbeABCD system
  notes: Xiong et al. directly connect DndCDEA-PbeABCD to inhibition of SNJ1 viral
    DNA replication after viral DNA injection.
- reference: DOI:10.1038/s41467-019-09390-9
  snippet: does not involve viral DNA degradation or cleavage, ruling out the involvement
    of currently known defence mechanisms
  notes: Xiong et al. bound the PbeABCD mechanism away from the DNA-cleavage mechanisms
    of canonical restriction systems.
- reference: DOI:10.1134/S0006297921030081
  snippet: instead of the dndFGH, the restriction function is performed by the pbeABCD
    gene cluster
  notes: Isaev et al. summarize pbeABCD as the restriction branch paired with archaeal
    DndCDEA phosphorothioation.
- reference: DOI:10.1134/S0006297921030081
  snippet: The dndCDEA-pbeABCD from Haloterrigena jeotgali was shown to provide antiviral
    defense
  notes: Isaev et al. independently summarize the Haloterrigena jeotgali DndCDEA-PbeABCD
    locus as an antiviral defense system.
canonical_examples:
- taxon_id: NCBITaxon:1455609
  taxon_label: Natrinema thermotolerans A29
  note: Xiong et al. identified the dndCDEA-pbeABCD locus in Haloterrigena jeotgali
    A29 and showed that the cloned locus confers DndCDEA- and PbeABCD-dependent resistance
    to the haloarchaeal virus SNJ1.
  reference: DOI:10.1038/s41467-019-09390-9
causal_graphs:
- graph_id: dndcdea_pbeabcd_pt_viral_replication_inhibition
  title: DndCDEA-PbeABCD systems halt archaeal viral DNA replication
  description: Evidence-backed process sketch linking a DndCDEA-PbeABCD locus to host
    DNA phosphorothioation, PT-dependent PbeABCD antiviral activity, and inhibited
    replication of non-phosphorothioated viral DNA.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DndCDEA-PbeABCD restriction at the system level
    without asserting one universal host taxon, PT motif outside characterized haloarchaeal
    systems, PbeABCD subunit cycle, direct viral DNA cleavage, or relationship to
    bacterial DndFGH and Ssp-family systems.
