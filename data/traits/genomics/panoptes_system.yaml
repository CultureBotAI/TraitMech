- discussion_id: panoptes-natural-host-gap
  prompt: Find a native endogenous microbial isolate with direct chromosomal Panoptes
    antiphage validation before adding canonical_examples.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Sullivan et al. investigated a candidate Vibrio navarrensis optSE operon
    and showed that VnOptSE defended against Straboviridae phages when expressed in
    E. coli MG1655 from its endogenous promoter, but that heterologous challenge assay
    does not establish an endogenous V. navarrensis or E. coli chromosomal Panoptes
    canonical exemplar.
  evidence:
