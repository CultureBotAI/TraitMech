identifier: traitmech:000407
label: Panoptes system
definition: A phage defense system in which an organism possesses a two-gene optSE
  locus encoding an OptS minimal CRISPR polymerase synthase that constitutively produces
  cyclic dinucleotides and an OptE S-2TMβ transmembrane effector that is released
  from cyclic-dinucleotide repression when phage Acb2-like proteins sequester those
  signals, leading to inner-membrane disruption.
definition_source: DOI:10.1038/s41586-025-09557-z
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Panoptes antiphage system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-025-09557-z
- synonym_text: optSE
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-025-09557-z
- synonym_text: OptSE
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-025-09557-z
evidence:
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: Panoptes is a two-gene operon, optSE, wherein OptS is predicted to synthesize
    a nucleotide-derived second messenger and OptE is predicted to bind that signal
    and drive effector-mediated defence.
  notes: Sullivan et al. define Panoptes as the two-gene optSE system encoding OptS
    and OptE.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: We named OptSE the Panoptes antiphage system for Argus Panoptes, the all-seeing,
    many-eyed giant in Greek mythology who was a faithful watchman to Hera.
  notes: Sullivan et al. name OptSE as the Panoptes antiphage system.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: OptS orthologues from two distinct Panoptes systems generated cyclic dinucleotide
    products, including 2′,3′-cyclic diadenosine monophosphate (2′,3′-c-di-AMP), which
    we showed were able to bind the soluble domain of the OptE transmembrane effector.
  notes: OptS orthologues produce cyclic dinucleotides, including 2′,3′-c-di-AMP,
    that can bind the soluble domain of the OptE transmembrane effector.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: Panoptes potently restricted phage replication, but phages that had loss-of-function
    mutations in anti-cyclic oligonucleotide-based antiphage signalling system (CBASS)
    protein 2 (Acb2) escaped defence.
  notes: Phage replication was restricted by Panoptes, while Acb2 loss-of-function
    mutations escaped defense.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: Our data support the idea that cyclic nucleotide sequestration by Acb2
    releases OptE toxicity, thereby initiating inner membrane disruption, leading
    to phage defence.
  notes: Acb2 cyclic-nucleotide sequestration releases OptE toxicity and leads to
    inner-membrane disruption.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: We investigated a candidate two-gene Panoptes operon from Vibrio navarrensis.
  notes: Sullivan et al. used a Vibrio navarrensis optSE locus for direct Panoptes
    defense assays.
- reference: DOI:10.1038/s41586-025-09557-z
  snippet: We expressed the operon from its endogenous promoter in Escherichia coli
    MG1655 and challenged these bacteria with a panel of diverse phages. The VnOptSE
    operon specifically defended against phages from the Straboviridae family
  notes: The V. navarrensis operon was expressed from its endogenous promoter in E.
    coli MG1655 and protected the heterologous host against Straboviridae phages.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Panoptes | 10\.1038/s41586-025-09557-z | The Panoptes system uses decoy
    cyclic nucleotides to defend against phage |'
  notes: The pinned DefenseFinder article registry maps the Panoptes key to Sullivan
    et al.; the same pinned rules and HMM inventory omit a Panoptes model.
