  title: Panoptes loci couple cyclic-nucleotide sequestration to OptE membrane disruption
  description: Evidence-backed process sketch linking an optSE locus to OptS cyclic-dinucleotide
    synthesis, OptE repression, Acb2-like sequestration of the OptS-derived signal,
    inner-membrane disruption, and phage restriction.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Sullivan et al. Panoptes evidence without asserting
    one universal cyclic-dinucleotide product, anti-defense trigger, phage breadth,
    or OptE oligomerization mechanism across all optSE homologs.
  nodes:
