discussions:
- discussion_id: type-i-rm-profile-interpretation-gap
  prompt: Resolve the accession-level relationships between DefenseFinder RM Type
    I custom methyltransferase, restriction-endonuclease, and specificity-subunit
    profiles and characterized HsdR, HsdM, and HsdS families before minting narrower
    Type I protein or custom-profile traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Loenen et al. support Type I R-M system architecture and restriction/modification
    activity, while the pinned DefenseFinder registry supports an RM_Type_I namespace
    with broad Type_I_MTases, Type_I_REases, and Type_I_S custom profile groups. The
    evidence does not yet map individual custom profile rows to exact characterized
    Hsd families or resolve whether each source-model boundary corresponds to a reusable
    organism-level trait below this class.
