identifier: traitmech:000494
label: type I restriction-modification system
definition: A restriction-modification system in which an organism possesses a Type
  I R-M locus encoding a pentameric enzyme with HsdR-like restriction, HsdM-like methylation,
  and HsdS-like DNA sequence-recognition subunits, including RM_Type_I loci represented
  by DefenseFinder.
definition_source: DOI:10.1093/nar/gkt847
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
