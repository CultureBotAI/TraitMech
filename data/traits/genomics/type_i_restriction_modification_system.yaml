evidence:
- reference: DOI:10.1093/nar/gkt847
  snippet: Type I restriction enzymes (REases) are large pentameric proteins with
    separate restriction (R), methylation (M) and DNA sequence-recognition (S) subunits.
  notes: Loenen et al. define Type I restriction enzymes as pentameric systems with
    distinct restriction, methylation, and sequence-recognition subunits.
- reference: DOI:10.1093/nar/gkt847
  snippet: Type I R–M enzymes are pentameric proteins of composition 2R+2M+S.
  notes: Loenen et al. describe the Type I R-M enzyme complex as a 2R+2M+S pentamer
    with both restriction-endonuclease and methyltransferase activities.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RM_Type_I | 10\.1093/nar/gkac975 | REBASE: a database for DNA restriction
    and modification: enzymes, genes and genomes'
