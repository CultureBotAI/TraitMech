identifier: traitmech:000578
label: Druantia type I system
definition: A Druantia system in which an organism possesses a locus encoding DruE
  together with DruB, DruC and DruD, with or without DruA.
definition_source: DOI:10.1126/science.aar4120
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000234
synonyms:
- synonym_text: Type I Druantia system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3389/fmicb.2020.00961
evidence:
- reference: DOI:10.1126/science.aar4120
  snippet: In some cases Type I systems are preceded by a gene annotated as DUF4338
  notes: 'Doron et al., The Druantia system and Table 1: type I has three partner
    genes beside DruE, sometimes with an additional DUF4338 gene. The table names
    DruA/B/C/D/E; the prose does not make DruA universal. The UMEA 4076-1 locus protected
    engineered E. coli MG1655 against four of six tested phages. Deletion of four
    tested genes abolished protection; this does not establish universal DruA dependence.
    Snippet verified in the accepted manuscript, page 7 (PDF page 9), available from
    the Weizmann institutional repository.'
- reference: DOI:10.3389/fmicb.2020.00961
  snippet: druA, encodes a large protein with a domain with unknown function (DUF4338)
  notes: The Druantia System section maps DUF4338 to DruA and describes a five-gene
    DruA/B/C/D/E form as type I in the Ralstonia solanacearum species complex. This
    independently corroborates component names, not a universal five-gene requirement.
    UW163 is a genomic prediction here; the authors' suggested functionality is not
    an infection assay.
- reference: https://raw.githubusercontent.com/padlocbio/padloc-db/9e380165633a8d6aef93b5a164cea0f3359bd33f/sys/druantia_type_I.yaml
  snippet: "core_genes:\n  - DruA1\n  - DruB1\n  - DruC1\n  - DruD1\n  - DruE1"
  notes: 'Pinned executable PADLOC rule, retrieved 2026-10-03: minimum_core and minimum_total
    are both 5, maximum_separation is 3, and force_strand is FALSE. Secondary, neutral
    and prohibited lists contain only NA. This detector requires the five named profiles,
    including DruA; that is narrower than the literature''s optional-DruA architecture,
    not evidence for universal DruA essentiality.'
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/definitions/DefenseFinder/Druantia/Druantia_I.xml
  snippet: <model inter_gene_max_space="5" min_mandatory_genes_required="1" min_genes_required="3"
    vers="2.0">
  notes: 'Pinned executable DefenseFinder model, retrieved 2026-10-03: Druantia_I__DruA/B/C/D
    are accessory slots. The mandatory Druantia__DruE_1 slot permits Druantia__DruE_2,
    Druantia__DruE_3 or Druantia_IV__DruE4 as exchangeables. The model requires only
    one mandatory and three total matches and has no forbidden slots. A call alone
    does not establish the complete DruB/C/D/E architecture or active defense. The
    raw model key is not an exact synonym.'
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  reference: DOI:10.1126/science.aar4120
  note: Natural possession is limited to the named source strain UMEA 4076-1, not
    species-wide possession or demonstrated native-host resistance. Doron et al. transferred
    its type-I locus into E. coli MG1655; protection against four of six tested phages
    was measured in that engineered recipient. NCBI independently resolves taxon 562
    to Escherichia coli.
discussions:
- discussion_id: druantia-type-i-components-and-mechanism
  prompt: Resolve type-I partner functions and reconcile incomplete detector calls.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DruB/C/D/E with optional DruA is a literature-based architecture class.
    The five-gene Ralstonia description and PADLOC rule do not override Doron's optional
    DUF4338 component. Conversely, DefenseFinder's three-match threshold does not
    establish a complete locus. Missing profiles, incomplete assemblies and engineered
    deletions do not by themselves establish natural component absence or a new subtype.
    Full locus context is required, and a genome may encode several Druantia subtypes.
    The specific functions of type-I partners, the phage trigger, native-host activity
    and defense breadth remain open. Do not transfer the DruH/type-III helicase-nuclease
    mechanism to type I, or infer biochemical activity from a DruE profile. No protein
    examples or causal graph are added without component-resolved functional evidence
    and accession anchors.
  posed_by: codex
  posed_date: '2026-10-03'
curation_history:
- timestamp: '2026-10-03T20:24:00Z'
  curator: codex
  action: MINTED_TRAITMECH_ID
