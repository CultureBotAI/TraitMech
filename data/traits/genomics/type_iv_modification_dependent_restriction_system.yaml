identifier: traitmech:000496
label: type IV modification-dependent restriction system
definition: A phage defense system in which an organism possesses a Type IV modification-dependent
  restriction locus, including DefenseFinder RM_Type_IV loci, whose restriction-enzyme
  activity cleaves foreign DNA carrying recognized base or backbone modifications
  rather than the unmodified targets of canonical Type I-III restriction-modification
  systems.
definition_source: DOI:10.1093/nar/gkt747
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: RM_Type_IV
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
- synonym_text: RM_Type_IV__Type_IV_REases
