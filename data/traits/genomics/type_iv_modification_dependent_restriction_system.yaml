discussions:
- discussion_id: type-iv-rm-profile-interpretation-gap
  prompt: Resolve the accession-level relationships between DefenseFinder RM_Type_IV
    custom Type_IV_REases profiles and characterized McrA, GmrSD, MspJI, PvuRts1I,
    EcoKMcrA, ScoMcrA, TagI, or VcaM4I families before minting narrower Type IV custom-profile
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Loenen and Raleigh support the broad Type IV modification-dependent restriction
    class, Bair and Black support GmrSD as one glucosylated-HMC-targeting Type IV
    enzyme, and the pinned DefenseFinder registries support an RM_Type_IV namespace
    with a broad Type_IV_REases custom profile group. The evidence does not yet map
    any of the eight pinned RM_Type_IV HMM rows to exact characterized families or
    resolve whether the Other_Type_IV, GmrSD_RM_Type_IV, MspJI, PvuRts1I, EcoKMcrA,
    ScoMcrA, TagI, and VcaM4I article-registry rows correspond to reusable organism-level
    traits below this class.
