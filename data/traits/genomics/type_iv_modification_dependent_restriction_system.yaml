- synonym_text: Other_Type_IV
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I–III.
  notes: Loenen and Raleigh define Type IV as modification-dependent restriction,
    distinct from modification-blocked Types I-III.
- reference: DOI:10.1093/nar/gkt747
  snippet: Type IV enzymes recognize modified DNA with low sequence selectivity and
    have emerged many times independently during evolution.
  notes: Loenen and Raleigh support the broad Type IV class as enzymes that recognize
    modified DNA with limited sequence specificity.
- reference: DOI:10.1093/nar/gkt747
  snippet: there are enzymes that attack DNA only when the modification is present
  notes: Loenen and Raleigh contrast modification-dependent restriction with protective
    modification by describing enzymes that attack DNA only when a modification is
    present.
- reference: DOI:10.1016/j.jmb.2006.11.051
  snippet: The Escherichia coli CT596 prophage exclusion genes gmrS and gmrD were
    found to encode a novel type IV modification-dependent restriction nuclease that
    targets and digests glucosylated (glc)-hydroxymethylcytosine (HMC) DNAs.
  notes: Bair and Black experimentally support GmrSD as a Type IV modification-dependent
    restriction nuclease targeting glucosylated hydroxymethylcytosine DNA.
- reference: DOI:10.1016/j.jmb.2006.11.051
  snippet: Overall activities of the purified GmrSD enzyme are in good agreement with
    the properties of the cloned gmr genes in vivo and suggest a restriction enzyme
    specific for sugar modified HMC DNAs.
  notes: Bair and Black verify purified GmrSD restriction activity against sugar-modified
    hydroxymethylcytosine DNA, one concrete activity within the Type IV branch.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Other_Type_IV | 10\.1093/nar/gkac975 | REBASE: a database for DNA restriction
    and modification: enzymes, genes and genomes | '
  notes: The pinned DefenseFinder article registry maps the Other_Type_IV source key
