    semantics, CARD_NLR__Subtilase_long_new HMM inventory gap, and profile-to-activity
    criteria before minting effector or trigger children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wein et al. support CARD-like anti-phage defense, and the pinned DefenseFinder
    HMM inventory and rules table support CARD_NLR_like as a CARD_NLR subsystem requiring
    two matches from a four-profile Endonuclease, Phospho_Trypsin, Subtilase_long_new,
    and Trypsin_Phospho candidate effector set. This first-pass record follows the
    rule row but leaves exact phage triggers, native hosts, how the two-of-four effector
    profile combinations map to activity, how CARD_NLR__Subtilase_long_new maps to
    the pinned HMM inventory, and whether every DefenseFinder CARD_NLR_like prediction
    is a complete experimentally active locus.
