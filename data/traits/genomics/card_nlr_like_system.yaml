identifier: traitmech:000559
label: CARD-NLR-like system
definition: A CARD-NLR system in which an organism possesses a genome-encoded DefenseFinder
  CARD_NLR_like subtype locus represented by the CARD_NLR_like rule row requiring
  two matches from the CARD_NLR__Endonuclease, CARD_NLR__Phospho_Trypsin, CARD_NLR__Subtilase_long_new,
  and CARD_NLR__Trypsin_Phospho effector-profile set and four genes overall after
  considering CARD_NLR__CARD_Protease, CARD_NLR__NLR_new, and CARD_NLR__Trypsin accessory
  profiles.
