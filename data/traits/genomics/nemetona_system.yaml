discussions:
- discussion_id: nemetona-mechanism-gap
  prompt: Resolve Nemetona phage triggers and effector outputs before minting narrower
    Nemetona mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Darracq et al. and DefenseFinder support Nemetona as a named anti-phage
    system with a VCA0441 profile, but the trigger, molecular substrate, antiviral
    effector output, and subtype-specific mechanism are not resolved enough here to
    assert a narrower mechanistic child trait.
