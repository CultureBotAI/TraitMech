- discussion_id: ds-34-defensefinder-model-gap
  prompt: Resolve DS-34 native host breadth, exact component activities, profile-to-protein
    mapping, phage-repressor and HTH HHpred-domain interpretation, complete phage
    breadth, molecular output, and rule-level DefenseFinder criteria before minting
    narrower DS-34 mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DeWeirdt et al. support DS-34 as the defensive CITO transcriptional unit
    and final Science Tables S6/S7/S8 map it to two product accessions, a Bas19 phage
    readout, display name DS-34, and two HHpred rows. The pinned DefenseFinder HMM
    inventory records two DS-34 custom profile rows. The pinned rules table has no
    DS-34 row, and the first-pass record does not resolve native host breadth, complete
    phage breadth, direct profile-to-protein correspondence, component activities,
    molecular output, or endogenous DS-34 activity.
