    breadth, direct iEndoIII sensing-to-cleavage coupling, phage inhibitor specificity,
    and DefenseFinder HMM/rules coverage before minting narrower END nuclease mechanism
    or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Yee et al. support ENDPaCF1 as a Type IIS restriction endonuclease-like
    Pseudomonas phage-defense system that can recognize diverse hypermodified phage
    genomes, and the pinned DefenseFinder article registry maps the ENDPaCF1 source
