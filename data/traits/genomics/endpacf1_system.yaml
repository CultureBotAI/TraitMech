identifier: traitmech:000503
label: ENDPaCF1 system
definition: A phage defense system in which an organism possesses an ENDPaCF1 Type
  IIS restriction endonuclease-like locus with an inactive Endonuclease III sensing
  domain that can recognize diverse DNA hypermodifications and protect bacteria from
  hypermodified phages.
definition_source: DOI:10.1101/2025.03.31.646159
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: ENDPaCF1
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1101/2025.03.31.646159
  snippet: The causal defense system is a Type IIS restriction endonuclease-like protein
    (ENDPaCF1), common in Pseudomonads, however it lacks an associated methyltransferase
    typical Type IIS R-M systems.
  notes: Yee et al. identify ENDPaCF1 as the causal Pseudomonas antiphage system and
    distinguish it from canonical Type IIS restriction-modification systems.
- reference: DOI:10.1101/2025.03.31.646159
  snippet: ENDPaCF1 protects bacteria against phages with hypermodified DNA and is
    surprisingly agnostic to the specific structure of the modification, which is
    unlike typical type IV restriction endonucleases.
  notes: Yee et al. connect ENDPaCF1 to protection against phages with multiple hypermodified-DNA
    chemistries.
- reference: DOI:10.1101/2025.03.31.646159
  snippet: In ENDPaCF1, the endonuclease domain is fused to a catalytically inactive
    Endonuclease III (iEndoIII), a domain that recognizes non-canonical bases to repair
    DNA in prokaryotes and eukaryotes.
  notes: Yee et al. describe the ENDPaCF1 endonuclease plus inactive Endonuclease
    III domain architecture.
- reference: DOI:10.1101/2025.03.31.646159
  snippet: We therefore propose that nucleases containing an iEndoIII domain (END
    nucleases) can sense diverse DNA hypermodifications.
  notes: Yee et al. propose the END nuclease family around the iEndoIII domain's ability
    to sense diverse DNA modifications.
- reference: DOI:10.1101/2025.03.31.646159
  snippet: We further show that some hypermodified phages, including Pbunavirus family
    members and Wrowclawvirus family (Pa5oct-like) of jumbo phages, encode END nuclease
    inhibitors that directly bind to the nuclease, likely via the iEndoIII domain.
  notes: Yee et al. support direct phage inhibitor binding to END nucleases while
    leaving ENDPaCF1 inhibitor breadth unresolved.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| ENDPaCF1 | 10\.1101/2025\.03\.31\.646159 | END nucleases: Antiphage
    defense systems targeting multiple hypermodified phage genomes | '
  notes: The pinned DefenseFinder article registry maps the ENDPaCF1 source key to
    the Yee et al. bioRxiv preprint.
