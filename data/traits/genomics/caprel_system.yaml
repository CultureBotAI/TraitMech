identifier: traitmech:000244
label: CapRel system
definition: A phage defense system in which an organism possesses a fused CapRel toxin-antitoxin
  locus whose C-terminal antitoxin sensor can directly bind phage trigger proteins,
  relieve autoinhibition of the toxSAS toxin domain, promote tRNA pyrophosphorylation,
  and restrict phage propagation by blocking translation.
definition_source: DOI:10.1038/s41586-022-05444-z
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: CapRel toxin-antitoxin system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-022-05444-z
- synonym_text: fused CapRel system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-022-05444-z
evidence:
- reference: DOI:10.1038/s41586-022-05444-z
  snippet: protects Escherichia coli against diverse phages
  notes: Zhang et al. support CapRelSJ46 as a fused CapRel toxin-antitoxin antiphage
    system that protects E. coli against several phages.
- reference: DOI:10.1038/s41586-022-05444-z
  snippet: newly synthesized major capsid protein binds directly to the C-terminal
    domain
  notes: Zhang et al. support direct sensing of a phage major capsid protein by the
    CapRelSJ46 C-terminal antitoxin domain.
- reference: DOI:10.1038/s41586-022-05444-z
  snippet: enabling the toxin domain to pyrophosphorylate tRNAs, which blocks translation
    to restrict viral infection
  notes: Zhang et al. connect phage-triggered CapRel activation to tRNA pyrophosphorylation,
    translation blockade, and restriction of viral infection.
- reference: DOI:10.1038/s41586-022-05444-z
  snippet: fused CapRels can provide anti-phage defence, with variable phage specificity
  notes: Zhang et al. support treating fused CapRel loci as a family-level phage-defense
    system rather than only one CapRelSJ46 instance.
- reference: DOI:10.1038/s41586-024-08039-y
  snippet: can directly bind and sense two completely unrelated and structurally different
    proteins using the same sensory domain
  notes: Zhang et al. independently support CapRelSJ46 as a direct phage-trigger-sensing
    immune protein and show that a single sensory domain can recognize more than one
    phage trigger.
- reference: DOI:10.1038/s41586-024-08039-y
  snippet: can fully evade CapRelSJ46 defence only when both triggers are mutated
  notes: Zhang et al. connect multifactorial trigger sensing to CapRel-mediated defense
    during Bas11 phage infection.
causal_graphs:
- graph_id: caprel_phage_triggered_translation_blockade
  title: CapRel sensors couple phage trigger binding to translation blockade
  description: Evidence-backed process sketch linking a fused CapRel toxin-antitoxin
    locus to direct phage-protein sensing, toxSAS activation, tRNA pyrophosphorylation,
    translation inhibition, and restricted phage propagation.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures CapRelSJ46 major-capsid-protein and Gp54 trigger
    evidence without claiming one universal CapRel phage trigger, allosteric route,
    escape route, or phage specificity across all fused CapRel homologs.
  nodes:
  - node_id: caprel_locus
    label: CapRel locus
    node_type: GENETIC_ELEMENT
    description: A fused CapRel toxin-antitoxin locus encoding an N-terminal toxSAS
      toxin domain and a C-terminal antitoxin sensor domain.
  - node_id: phage_trigger_binding
    label: phage trigger binding
    node_type: BIOLOGICAL_PROCESS
    description: Direct binding of a phage-encoded trigger protein to the CapRel antitoxin
      sensor domain.
  - node_id: caprel_toxin_activation
    label: CapRel toxSAS activation
    node_type: BIOLOGICAL_PROCESS
    description: Relief of autoinhibition that activates the N-terminal CapRel toxSAS
      toxin domain.
  - node_id: trna_pyrophosphorylation
    label: tRNA pyrophosphorylation
    node_type: BIOLOGICAL_PROCESS
    description: Pyrophosphorylation of transfer RNAs by activated CapRel toxSAS toxin
      activity.
  - node_id: translation_blockade
    label: translation blockade
    node_type: BIOLOGICAL_PROCESS
    description: Inhibition of cellular translation downstream of CapRel-mediated
      tRNA pyrophosphorylation.
  - node_id: restricted_phage_propagation
    label: restricted phage propagation
    node_type: BIOLOGICAL_PROCESS
    description: Reduced bacteriophage propagation in cells whose CapRel system has
      blocked translation.
  - node_id: caprel_system_trait
    label: CapRel system
    node_type: TRAIT
    grounding: traitmech:000244
    description: Possession of a genome-encoded fused CapRel toxin-antitoxin phage-defense
      system.
  - node_id: phage_defense_system
    label: phage defense system
    node_type: TRAIT
    grounding: traitmech:000209
    description: Possession of one or more genome-encoded immune systems that inhibit
      bacteriophage infection.
