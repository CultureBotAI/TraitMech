discussions:
- discussion_id: hna-trigger-and-family-breadth-gap
  prompt: Resolve Hna trigger breadth, phage escape routes, and family architecture
    before minting narrower Hna mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Sather et al. support Sinorhizobium Hna abortive infection after phage
    infection or phage SSB expression, and Hooper et al. support 5A SSB stimulation
    of nuclease activation, but Hna homologs need separate review before TraitMech
    asserts one universal phage trigger, ATP-dependent activation gate, DNA substrate,
    escape route, or host death timing across the full Hna family.
