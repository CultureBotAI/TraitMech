identifier: traitmech:000408
label: NLR-like bNACHT system
definition: A phage defense system in which an organism possesses an NLR-related bacterial
  NACHT locus represented by DefenseFinder as an NLR_like_bNACHT01 or NLR_like_bNACHT09
  single-profile model, encoding a NACHT-module STAND-family protein that can restrict
  bacteriophage production.
definition_source: DOI:10.1016/j.cell.2023.04.015
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: NLR
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: bNACHT
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.cell.2023.04.015
- synonym_text: NLR_like_bNACHT01
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
- synonym_text: NLR_like_bNACHT09
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
evidence:
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: Here we show that proteins containing a NACHT module, the central feature
    of the animal nucleotide-binding domain and leucine-rich repeat-containing gene
    family (NLRs), are found in bacteria and defend against phages.
  notes: Ofir et al. support NACHT-module proteins as bacterial NLR-related proteins
    that defend against phages.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: We named this gene bacterial NACHT module-containing protein 1 (bNACHT01),
    and it did not appear to be in an operon with any other genes.
  notes: Ofir et al. named the tested Klebsiella pneumoniae MGH 35 NACHT-module protein
    bNACHT01.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: bNACHT01 conferred over a 100-fold increase in protection against phage
    T4 and over a 1000-fold increase in protection against phages T5 and T6
  notes: bNACHT01 protected against phages T4, T5, and T6 in the E. coli heterologous
    assay.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: bacteria expressing bNACHT01 restricted phage virion production and continued
    growing
  notes: Ofir et al. observed restricted phage virion production in bacteria expressing
    bNACHT01.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: Mutation of R214 to alanine maintained expression of the protein but abrogated
    phage defense
  notes: An R214A NACHT-module mutation preserved bNACHT01 expression but abrogated
    defense, supporting a NACHT-dependent output.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC10294775/
  snippet: Diverse bacterial NACHT proteins from different clades exhibited robust
    antiphage activity across a wide range of phages
  notes: Ofir et al. observed antiphage activity across diverse bacterial NACHT proteins.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: NLR | 10\.1101/2022\.07\.19\.500537 | Bacterial NLR-related proteins protect
