discussions:
- discussion_id: nlr-like-bnacht-mechanism-gap
  prompt: Resolve the exact mapping between DefenseFinder NLR_like_bNACHT01 and NLR_like_bNACHT09
    profiles and the experimentally tested bNACHT proteins, natural host breadth,
    phage triggers, and bNACHT effector mechanisms before minting narrower bNACHT
    subtype traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Ofir et al. support bacterial NACHT proteins as NLR-related phage-defense
    proteins and DefenseFinder models NLR_like_bNACHT01 and NLR_like_bNACHT09 as single-profile
    NLR-family subsystems. This first system-level record leaves profile-to-assayed-protein
    correspondence and subtype-specific trigger and effector mechanisms unresolved.
  evidence:
