canonical_examples:
- taxon_id: NCBITaxon:573
  taxon_label: Klebsiella pneumoniae
  note: Ofir et al. identified the bNACHT01 locus in Klebsiella pneumoniae MGH 35
    and found that bNACHT01 expressed from its endogenous promoter in Escherichia
    coli protected against phages T4, T5, and T6.
  reference: DOI:10.1016/j.cell.2023.04.015
