evidence:
- reference: DOI:10.1016/j.chom.2026.06.017
  snippet: We demonstrate anti-phage activity both in a native Streptomyces context
    and through heterologous expression of six distinct lanthivirin systems.
  notes: Serra et al. support native Streptomyces anti-phage activity and activity
    from multiple heterologously expressed lanthivirin systems.
- reference: DOI:10.1016/j.chom.2026.06.017
  snippet: lanthivirin maturation is required for anti-phage activity
  notes: Serra et al. support the requirement for lanthivirin maturation in anti-phage
    activity.
- reference: DOI:10.1016/j.chom.2026.06.017
  snippet: phage-protein-dependent inhibition of phage DNA replication
  notes: Serra et al. link lanthivirins to inhibition of phage DNA replication.
