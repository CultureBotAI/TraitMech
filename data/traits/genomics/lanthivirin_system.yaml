identifier: traitmech:000416
label: lanthivirin system
definition: A phage defense system in which an organism possesses a lanthivirin lanthipeptide
  biosynthetic gene cluster that can confer anti-phage activity in a native Streptomyces
  context and after heterologous expression of complete lanthivirin systems.
definition_source: DOI:10.1016/j.chom.2026.06.017
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
