identifier: traitmech:000246
label: Mokosh system
definition: A phage defense system in which an organism possesses a Mokosh locus represented
  by MkoA/MkoB type I or MkoC type II components that can protect bacteria from bacteriophage
  infection.
definition_source: DOI:10.1016/j.chom.2022.09.017
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
