discussions:
- discussion_id: mokosh-mechanism-gap
  prompt: Resolve Mokosh phage triggers and effector outputs before minting narrower
    Mokosh mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Millman et al. and DefenseFinder support Mokosh as a named anti-phage
    system with type I and type II profiles, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
