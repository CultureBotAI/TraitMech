discussions:
- discussion_id: drt9-profile-activity-gap
  prompt: Resolve the DRT9 reverse-transcriptase product, direct phage trigger, host
    breadth, and DRT9__SLATT HMM-row status before minting DRT9 mechanism or component
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support defense-associated reverse transcriptases as a broad
    antiphage-system family, and the pinned DefenseFinder HMM inventory and rules
    table support DRT9 as a DRT subsystem with a mandatory DRT9__DRT9 profile. This
    first-pass record leaves the exact DRT9 RT product, phage trigger, host breadth,
    and DRT9__SLATT inventory-row status unresolved.
  evidence:
  - reference: DOI:10.1126/science.aba0372
    snippet: We discovered that a family of uncharacterized reverse transcriptases
      (RTs) are active defense systems
    notes: Gao et al. experimentally support defense-associated reverse transcriptases
