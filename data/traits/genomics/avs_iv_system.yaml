discussions:
- discussion_id: avs-iv-component-and-effector-gap
  prompt: Resolve the Avs4A component role, direct effector chemistry, exact phage-trigger
    mapping, native host breadth, and sensitive-phage breadth before minting Avs IV
    mechanism or component children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Gao et al. support Avs4 phage-portal recognition and Avs activation during
    antiviral defense, and the pinned DefenseFinder HMM inventory and rules table
    support Avs_IV as a subtype IV model with an Avs4A profile. This first-pass record
    leaves the exact component role, downstream effector chemistry, native host breadth,
    sensitive-phage breadth, and profile-to-activity requirements unresolved.
  evidence:
  - reference: DOI:10.1126/science.abm4096
    snippet: Avs1 to Avs3 recognize the large terminase subunit, and Avs4 recognizes
      the portal
    notes: Gao et al. support Avs4 as a phage-portal-sensing member of the AVAST receptor
      family.
  - reference: DOI:10.1126/science.abm4096
    snippet: In all four cases, target recognition led to Avs protein activation and
      antiviral activity
    notes: Gao et al. connect Avs1 through Avs4 target recognition to Avs activation
      and antiviral activity.
