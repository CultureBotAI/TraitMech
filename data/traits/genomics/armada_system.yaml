  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.chom.2026.05.015
- synonym_text: Armada
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: disARM-related antiviral defense array
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.chom.2026.05.015
evidence:
- reference: DOI:10.1016/j.chom.2026.05.015
  snippet: Through comprehensive phylogenetic and structural analyses of YprA-like
    helicases, we identify several major clades, which define distinct defense systems
    including a broad class we call ARMADA (disARM-related antiviral defense array).
  notes: Bell et al. define ARMADA as a broad YprA-like helicase defense-system class.
- reference: DOI:10.1016/j.chom.2026.05.015
  snippet: We show experimentally that ARMADA protects bacteria against a broad range
    of phages via a direct, non-abortive mechanism.
  notes: Bell et al. summarize experimental support that ARMADA protects bacteria
    against a broad range of phages.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12458937/
  snippet: The two largest uncharacterized YprA-like clades encompass a distinct set
    of related operons that, in addition to the YprA homologs, share two other genes
    with DISARM Class I systems
  notes: The preprint full text describes ARMADA operons as carrying YprA homologs
    plus BrxHII-like and PglX-like components shared with DISARM Class I systems.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12458937/
  snippet: The ARMADA clade splits into two well-separated, strongly supported subclades
    which we denote Type I and Type II.
  notes: The preprint full text separates the broad ARMADA clade into Type I and Type
    II subclades.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12458937/
  snippet: Log-protection (reduction in phage titer) conferred by ARMADA, expressed
    from plasmid pBeloBAC11 in BL21-AI, against a panel of 80 phages
  notes: A cloned E. coli NCTC 12900 ARMADA Type II cluster was tested for protection
    against a broad phage panel in a heterologous BL21-AI assay.
- reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC12458937/
  snippet: Screening 66 phages that could form plaques on the double-deletion strain
    showed that the strain carrying only Druantia III exhibited at least modest protection
    (<0.01 EOP or <0.5 SFC) against 3 phages, whereas the strain carrying ARMADA Type
    II exhibited a much broader range of immunity, with at least modest protection
    observed against 30 phages.
  notes: Precise system deletions in E. coli ATCC 8739 supported native ARMADA Type
    II protection across a broader tested phage set than the co-located Druantia Type
    III system.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Armada | 10\.1101/2025\.09\.15\.676423 | YprA family helicases provide
    the missing link between diverse prokaryotic immune systems
  notes: The pinned DefenseFinder article registry maps the named Armada system to
    the Bell et al. YprA-family helicase preprint. The pinned HMM inventory and rules
    table do not list Armada, so this row is name-to-paper evidence rather than model-component
    evidence.
