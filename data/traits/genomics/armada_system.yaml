    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Bell et al. support ARMADA as a broad YprA-like-helicase system family
    that shares BrxHII-like and PglX-like components with DISARM Class I systems and
    splits into Type I and Type II subclades, and the article experimentally validates
    Type II protection from E. coli NCTC 12900 and ATCC 8739 loci. The pinned DefenseFinder
    article registry names Armada and maps it to the Bell et al. preprint, but the
    pinned HMM inventory and rules table do not contain Armada rows, leaving profile
    coverage and detection criteria unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2026.05.015
