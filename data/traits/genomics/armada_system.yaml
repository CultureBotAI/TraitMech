identifier: traitmech:000477
label: ARMADA system
definition: A phage defense system in which an organism possesses an ARMADA YprA-like-helicase
  locus whose Type I and Type II operons share BrxHII-like and PglX-like components
  with DISARM Class I systems and whose experimentally tested Type II forms protect
  against a broad range of phages.
definition_source: DOI:10.1016/j.chom.2026.05.015
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
