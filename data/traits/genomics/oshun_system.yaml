discussions:
- discussion_id: oshun-mechanism-gap
  prompt: Resolve Oshun phage triggers and effector outputs before minting narrower
    Oshun mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Oshun as a named anti-phage
    system with an OsnA2 HMM profile entry, but the trigger, molecular substrate,
    antiviral effector output, and subtype-specific mechanism are not resolved enough
    here to assert a narrower mechanistic child trait.
  attaches_to:
