discussions:
- discussion_id: ukko-mechanism-gap
  prompt: Resolve Ukko phage triggers and effector outputs before minting narrower
    Ukko mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mordret et al. and DefenseFinder support Ukko as a named anti-phage system
    with UkkA1, UkkA2, UkkB1, UkkB2, UkkC1, UkkC2, UkkD1, and UkkD2 HMM profile entries,
    but the trigger, molecular substrate, antiviral effector output, and subtype-specific
    mechanism are not resolved enough here to assert a narrower mechanistic child
    trait.
  attaches_to:
  - causal_graphs#ukko_locus_restricts_phage
