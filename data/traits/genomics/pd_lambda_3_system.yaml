identifier: traitmech:000382
label: PD-Lambda-3 system
definition: A phage defense system in which an organism possesses a PD-Lambda-3 locus
  represented by DefenseFinder as a two-profile model, PD-Lambda-3__PD-Lambda-3_A
  and PD-Lambda-3__PD-Lambda-3_B, and experimentally linked to LambdaVir protection
  when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-3.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
