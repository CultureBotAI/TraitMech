discussions:
- discussion_id: pd-lambda-3-mechanism-gap
  prompt: Resolve PD-Lambda-3 natural host breadth, direct phage trigger, effector
    mechanism, the third protein in the experimental source locus, and exact profile-to-protein
    correspondence before minting narrower PD-Lambda-3 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-Lambda-3 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against LambdaVir, and DefenseFinder represents the
    system with A and B profiles. Natural host breadth, the direct phage trigger,
    effector logic, the third protein in the experimental source locus, and exact
    profile-to-protein correspondence remain unresolved.
