evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-Lambda-3 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-3.md
  snippet: 'The PD-Lambda-3 is composed of 2 proteins: PD-Lambda-3_A and PD-Lambda-3_B.'
  notes: The DefenseFinder wiki names PD-Lambda-3 as a two-protein system with PD-Lambda-3_A
    and PD-Lambda-3_B.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-3.md
  snippet: The PD-Lambda-3 system in *Enterobacter sp. CRENT-193* (GCF_002787395.1,
    NZ_CP024812) is composed of 2 proteins PD-Lambda-3_A (WP_001542736.1) PD-Lambda-3_B
    (WP_039268887.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein PD-Lambda-3 locus
    in RefSeq assembly GCF_002787395.1 on NZ_CP024812.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-3.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The DefenseFinder wiki records the PD-Lambda-3 mechanism as unknown.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-lambda-3.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
