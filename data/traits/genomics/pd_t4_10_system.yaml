  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-022-01219-4
  snippet: Here we developed an experimental selection scheme agnostic to genomic
    context to identify defence systems in 71 diverse E. coli strains. Our results
    unveil 21 conserved defence systems, none of which were previously detected as
    enriched in defence islands.
  notes: Vassallo et al. developed the agnostic E. coli pangenome selection that uncovered
    PD-T4-10 and related conserved phage-defense systems.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
  snippet: 'The PD-T4-10 system is composed of 2 proteins: PD-T4-10_B and, PD-T4-10_A.
    These ORFs are overlapping and PD-T4-10_B is toxic while PD-T4-10_A neutralizes
    its toxicity, hinting at a toxin-antitoxin (TA) mechanism. It confers resitance
    to T2, T4, T6 and SECphi27 through an Abi defense mechanism :ref{doi=10.1038/s41564-022-01219-4}.'
  notes: The DefenseFinder wiki describes PD-T4-10 as a two-protein Abi system whose
    overlapping ORFs include a toxic PD-T4-10_B and neutralizing PD-T4-10_A.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
  snippet: 'The PD-T4-10 is composed of 2 proteins: PD-T4-10_A and PD-T4-10_B.'
  notes: The DefenseFinder wiki names PD-T4-10_A and PD-T4-10_B as the two components
    of the PD-T4-10 system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
  snippet: The PD-T4-10 system in *Escherichia fergusonii* (GCF_019047545.1, NZ_CP077242)
    is composed of 2 proteins PD-T4-10_A (WP_032236482.1) PD-T4-10_B (WP_032236481.1)
  notes: The DefenseFinder wiki illustrates a predicted PD-T4-10 locus in RefSeq assembly
    GCF_019047545.1 on NZ_CP077242.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
  snippet: "Vassallo_2022[<a href='https://doi.org/10.1038/s41564-022-01219-4'>Vassallo\
    \ et al., 2022</a>] --> Origin_0\n    Origin_0[Escherichia coli \n<a href='https://ncbi.nlm.nih.gov/protein/RCO36089.1'>RCO36089.1</a>,\
    \ <a href='https://ncbi.nlm.nih.gov/protein/RCO36088.1'>RCO36088.1</a>] --> Expressed_0[Escherichia\
    \ coli]\n    Expressed_0[Escherichia coli] ----> T2 & T4 & T6 & T5 & SECphi27"
  notes: The DefenseFinder experimental-validation diagram links Vassallo et al. to
    an E. coli PD-T4-10 source locus expressed in E. coli against T2, T4, T6, T5,
    and SECphi27.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
  snippet: "subgraph Title4[Protects against]\n        T2\n        T4\n        T6\n\
