identifier: traitmech:000394
label: PD-T4-10 system
definition: An abortive infection system in which an organism possesses a PD-T4-10
  locus represented by DefenseFinder as a two-profile model, PD-T4-10__PD-T4-10_A
  and PD-T4-10__PD-T4-10_B, and experimentally linked to T2, T4, T6, T5, and SECphi27
  protection when expressed in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: PD-T4-10
  synonym_type: RELATED_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/pd-t4-10.md
- synonym_text: PD-T4-10__PD-T4-10_A
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: PD-T4-10__PD-T4-10_B
