discussions:
- discussion_id: pd-t4-10-mechanism-gap
  prompt: Resolve PD-T4-10 natural host breadth, direct phage trigger, the toxic PD-T4-10_B
    target, and PD-T4-10_A neutralization logic before minting narrower PD-T4-10 mechanism
    traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Vassallo et al. support PD-T4-10 as one of the conserved systems from
    an E. coli pangenome phage-defense selection, the DefenseFinder wiki maps the
    source locus to protection against T2, T4, T6, T5, and SECphi27, and DefenseFinder
    represents the system with two mandatory profiles and an abortive-infection mechanism
    assignment. Natural host breadth, the direct phage trigger, the toxic PD-T4-10_B
    target, and the PD-T4-10_A neutralization logic remain unresolved.
  evidence:
