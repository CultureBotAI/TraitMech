identifier: traitmech:000102
label: pangenome openness
definition: A genomics trait describing the structure of a species' pangenome — the
  balance of core versus accessory genes and whether the pangenome is open
  (continually acquiring new genes across genomes) or closed.
definition_source: DOI:10.1073/pnas.0506758102
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
