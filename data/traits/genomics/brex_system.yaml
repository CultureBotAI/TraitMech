identifier: traitmech:000210
label: BREX system
definition: A genomics trait describing possession of a bacteriophage exclusion defense
  system that uses host DNA methylation to discriminate self from non-self and inhibit
  phage DNA replication.
definition_source: DOI:10.15252/embj.201489455
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: bacteriophage exclusion
  synonym_type: EXACT_SYNONYM
  source: DOI:10.15252/embj.201489455
- synonym_text: bacteriophage exclusion system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/AEM.01001-19
evidence:
- reference: DOI:10.15252/embj.201489455
  snippet: We denote this novel defense system BREX (Bacteriophage Exclusion) and
    show that it allows phage adsorption but blocks phage DNA replication
  notes: Goldfarb et al. define BREX as a bacteriophage-exclusion defense system and
    distinguish its post-adsorption block from receptor-loss and phage-adsorption
    phenotypes.
- reference: DOI:10.15252/embj.201489455
  snippet: methylation on non-palindromic TAGGAG motifs in the bacterial genome guides
    self/non-self discrimination and is essential for the defensive function of the
    BREX system
  notes: Goldfarb et al. support the methylation-based self/non-self discrimination
    clause in the local definition.
- reference: DOI:10.15252/embj.201489455
  snippet: confers resistance to a broad range of phages, including both virulent
    and temperate ones
  notes: A Bacillus cereus six-gene BREX cassette conferred broad phage resistance
    when integrated into Bacillus subtilis, supporting BREX as a locus-encoded system
    trait.
- reference: DOI:10.1128/AEM.01001-19
  snippet: The bacteriophage exclusion (BREX) system is a novel prokaryotic defense
    system against bacteriophages
  notes: Hui et al. independently define bacteriophage exclusion as a prokaryotic
    defense system against bacteriophages.
- reference: DOI:10.1128/AEM.01001-19
  snippet: identified a complete cassette of a classic type I BREX system
  notes: Hui et al. identified a complete type I BREX cassette in the Lactobacillus
    casei Zhang genome.
canonical_examples:
- taxon_id: NCBITaxon:498216
  taxon_label: Lacticaseibacillus casei str. Zhang
  note: The strain historically named Lactobacillus casei Zhang carries a complete
    type I BREX cassette whose pglX component is required for BREX-linked methylation
    and plasmid restriction phenotypes.
  reference: DOI:10.1128/AEM.01001-19
