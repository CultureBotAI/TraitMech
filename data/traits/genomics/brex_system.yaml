discussions:
- discussion_id: brex-molecular-coupling-gap
  prompt: Resolve the molecular coupling between BREX-guided host methylation and
    phage-DNA replication arrest before adding more specific BREX mechanism edges.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Goldfarb et al. showed that methylation is essential and that BREX blocks
    phage DNA replication after adsorption, but the exact biochemical coupling between
    the methylation mark and blocked phage replication remains insufficient for a
    more specific causal edge.
