identifier: traitmech:000324
label: RexAB system
definition: An abortive infection system in which an organism possesses a bacteriophage-lambda
  Rex-family locus represented by the DefenseFinder RexAB__RexA and RexAB__RexB profiles
  and exemplified by the rexA and rexB two-component system that aborts lytic growth
  of bacterial viruses.
definition_source: DOI:10.1101/gad.6.3.497
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
synonyms:
- synonym_text: RexAB
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1101/gad.6.3.497
  snippet: The rexA and rexB genes of bacteriophage lambda encode a two-component
    system that aborts lytic growth of bacterial viruses.
  notes: Parma et al. support RexA and RexB as a two-component Rex exclusion system.
- reference: DOI:10.1101/gad.6.3.497
  snippet: Rex exclusion is characterized by termination of macromolecular synthesis,
    loss of active transport, the hydrolysis of ATP, and cell death.
  notes: Parma et al. support Rex exclusion as an abortive-infection-like output with
    host-cell death.
- reference: DOI:10.1101/gad.6.3.497
  snippet: The Rex system requires a mechanism to prevent lambda itself from being
    excluded during lytic growth.
  notes: This self-exclusion sentence keeps bacteriophage-lambda self-protection
    inside the open RexAB mechanism gap instead of making it a separate organismal
    trait.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'RexAB | 10\.1101/gad\.6\.3\.497 | The Rex system of bacteriophage lambda:
    tolerance and altruistic cell death'
  notes: The DefenseFinder article registry maps the named RexAB model namespace to
    the bacteriophage-lambda Rex system paper.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "RexAB\tRexAB\t2\t2\tRexAB__RexA, RexAB__RexB"
  notes: The DefenseFinder rules table models RexAB as a two-component system requiring
    the RexA and RexB profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| RexAB__RexA                                      | RexAB__RexA                                      |
    RexAB                  | PF15969.7               | 25     |'
  notes: The DefenseFinder HMM inventory records RexAB__RexA under RexAB.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| RexAB__RexB                                      | RexAB__RexB                                      |
    RexAB                  | PF15968.7               | 27     |'
  notes: The DefenseFinder HMM inventory records RexAB__RexB under RexAB.
causal_graphs:
- graph_id: rexab_locus_mediates_rex_exclusion
  title: RexAB loci mediate abortive Rex exclusion
  description: Conservative system-level sketch linking RexA/RexB locus possession
    to Rex exclusion and RexAB-system possession without asserting the direct phage
    trigger, RexA/RexB stoichiometry, membrane target, or bacteriophage-lambda self-protection
    route.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures RexAB as a named DefenseFinder two-profile abortive-infection
    system whose lambda prototype aborts lytic growth. It leaves the direct phage
    trigger, RexA/RexB molecular coupling, ion-channel activity, self-exclusion control,
    and phage escape routes unresolved.
