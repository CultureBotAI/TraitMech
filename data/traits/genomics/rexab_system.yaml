discussions:
- discussion_id: rexab-mechanism-gap
  prompt: Resolve the direct RexAB phage trigger, RexA and RexB molecular coupling,
    ion-channel activity, lambda self-exclusion control, and sensitive-phage escape
    routes before minting narrower RexAB mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Parma et al. support bacteriophage-lambda rexA and rexB as a two-component
    system that aborts lytic growth of bacterial viruses, and DefenseFinder maps RexAB
    to RexAB__RexA and RexAB__RexB profiles. The direct phage trigger, RexA/RexB molecular
    coupling, ion-channel output, lambda self-exclusion control, and sensitive-phage
    escape routes remain unresolved.
  attaches_to:
