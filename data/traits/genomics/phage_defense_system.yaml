identifier: traitmech:000209
label: phage defense system
definition: A genomics trait describing possession of one or more bacterial or archaeal
  immune systems that inhibit bacteriophage infection.
definition_source: DOI:10.1038/s41579-019-0278-2
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: antiphage defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.aar4120
- synonym_text: anti-phage system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41586-019-1894-8
- synonym_text: pan-immune system
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41579-019-0278-2
evidence:
- reference: DOI:10.1038/s41579-019-0278-2
  snippet: Viruses and their hosts are engaged in a constant arms race leading to
    the evolution of antiviral defence mechanisms
  notes: Bernheim and Sorek define the bacterial bacteriophage-defense context and
    review the pan-genomic diversity and cost of antiviral defense systems.
- reference: DOI:10.1038/s41579-019-0278-2
  snippet: individual microorganisms often encode multiple distinct defence systems
  notes: The pan-immune-system model supports treating possession of one or more defense
    systems as a strain-level genomics trait rather than a single protein, locus,
    or pathway.
- reference: DOI:10.1038/s41586-019-1894-8
  snippet: Bacteria have evolved numerous immune mechanisms, both innate and adaptive
  notes: Hampton et al. review innate and adaptive anti-phage systems and the phage
    counter-defense mechanisms that evade them.
- reference: DOI:10.1038/s41586-019-1894-8
  snippet: Here we review the spectrum of anti-phage systems and highlight their evasion
    by bacteriophages
  notes: This supports the umbrella scope spanning diverse CRISPR-Cas, restriction-modification,
    BREX, DISARM, abortive-infection, and related anti-phage defenses.
- reference: DOI:10.1126/science.aar4120
  snippet: Candidate immune systems were then experimentally validated for their activities
  notes: The Science article summary for Doron et al. supports genomic discovery and
    experimental validation of antiphage defense systems from microbial pangenomes.
canonical_examples:
- taxon_id: NCBITaxon:1308
  taxon_label: Streptococcus thermophilus
  note: S. thermophilus is the organism in which CRISPR-Cas adaptive immunity was
    experimentally shown to provide phage resistance.
  reference: DOI:10.1126/science.1138140
causal_graphs:
