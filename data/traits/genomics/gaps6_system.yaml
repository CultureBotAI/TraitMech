identifier: traitmech:000381
label: GAPS6 system
definition: A phage defense system in which an organism possesses a GMT-encoded GAPS6
  locus represented by DefenseFinder as a two-profile model, GAPS6__GAPS6a and GAPS6__GAPS6b,
  and experimentally linked to T7, T4, P1-vir, and lambda-vir protection when expressed
  in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: GAPS6
  synonym_type: EXACT_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
- synonym_text: GAPS6__GAPS6a
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: GAPS6__GAPS6b
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-024-01840-5
  snippet: We reveal four anti-phage defence systems encoded within GMT islands and
    further characterize one system, GAPS1, showing it is triggered by a phage capsid
    protein to induce cell dormancy
  notes: Mahata et al. identify four anti-phage defense systems in Gamma-Mobile-Trio
    islands.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
  snippet: GAPS6 is composed of two proteins, [GAPS6a](https://www.ncbi.nlm.nih.gov/protein/WP_248387294.1/)
    and [GAPS6b](https://www.ncbi.nlm.nih.gov/protein/WP_248387295.1/). These two
    proteins are encoded together in diverse Gram-negative bacteria.
  notes: The DefenseFinder wiki describes GAPS6 as a two-protein system with GAPS6a
    and GAPS6b encoded together.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
  snippet: GAPS6b is essential for the defense phenotype, however it is not known
    whether GAPS6b could be sufficient.
  notes: The DefenseFinder wiki reports that GAPS6b is essential for GAPS6 defense
    but leaves GAPS6b sufficiency unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
  snippet: GAPS6b is composed of TPR repeats at the N-terminus, possibly allowing
    ligand binding and a predicted RNAse domain (PINc, PF08745.14) at the C-terminus.
    PINc domains have been implicated as toxins in bacterial toxin-antitoxin modules
    :ref{doi=10.1093/protein/gzq081}. The PINc domain is required for the anti-phage
    defense activity of GAPS6.
  notes: The DefenseFinder wiki reports that GAPS6b carries TPR repeats and a PINc
    domain required for GAPS6 anti-phage activity.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
  snippet: The GAPS6 system in *Escherichia coli* (GCF_013372365.1, NZ_CP054227) is
    composed of 2 proteins GAPS6b (WP_096985931.1) GAPS6a (WP_000346990.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein GAPS6 locus in
    RefSeq assembly GCF_013372365.1 on NZ_CP054227.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
  snippet: "Mahata_2023[<a href='https://doi.org/10.1101/2023.03.28.534373'>Mahata\
    \ et al., 2023</a>] --> Origin_0\n    Origin_0[Vibrio parahaemolyticus \n<a href='https://ncbi.nlm.nih.gov/protein/WP_248387294.1'>WP_248387294.1</a>,\
    \ <a href='https://ncbi.nlm.nih.gov/protein/WP_248387295.1'>WP_248387295.1</a>]\
    \ --> Expressed_0[Escherichia coli]\n    Expressed_0[Escherichia coli] ----> T7\
    \ & T4 & P1-vir & Lambda-vir"
  notes: The DefenseFinder experimental-validation diagram links Mahata et al. to
    a Vibrio parahaemolyticus GAPS6 source locus expressed in E. coli against T7,
    T4, P1-vir, and Lambda-vir.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: GAPS6 | 10\.1101/2023\.03\.28\.534373 | Gamma-Mobile-Trio systems define
    a new class of mobile elements rich in bacterial defensive and offensive tools
  notes: The DefenseFinder article registry maps the named GAPS6 system to the Mahata
    et al. preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "GAPS6\tGAPS6\t2\t2\tGAPS6__GAPS6a, GAPS6__GAPS6b\t\t\t"
  notes: The DefenseFinder rules table models GAPS6 as a two-profile system requiring
    GAPS6__GAPS6a and GAPS6__GAPS6b.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| GAPS6__GAPS6a                                    | GAPS6__GAPS6a                                    |
    GAPS6                  | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records GAPS6__GAPS6a under the GAPS6 system
    namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| GAPS6__GAPS6b                                    | GAPS6__GAPS6b                                    |
    GAPS6                  | Custom                  | 20     |'
  notes: The DefenseFinder HMM inventory records GAPS6__GAPS6b under the GAPS6 system
