discussions:
- discussion_id: gaps6-mechanism-gap
  prompt: Resolve GAPS6 natural host breadth, GAPS6a activity, GAPS6b sufficiency
    and trigger specificity, and exact GAPS6a/GAPS6b profile-to-protein correspondence
    before minting narrower GAPS6 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mahata et al. support GAPS6 as a GMT-encoded anti-phage defense system
    that protects E. coli against T7, T4, P1-vir, and lambda-vir when expressed from
    a Vibrio parahaemolyticus locus, and DefenseFinder represents GAPS6 as a two-profile
    system. Natural host breadth, GAPS6a activity, GAPS6b sufficiency, the phage trigger,
    and exact profile-to-protein correspondence remain unresolved.
  evidence:
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps6.md
