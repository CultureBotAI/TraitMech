identifier: traitmech:000422
label: CoCoNuT system
definition: A phage defense system in which an organism possesses a CoCoNuT locus
  from a coiled-coil nuclease tandem branch of McrBC Type IV restriction systems whose
  domain and genomic-context architecture predict RNA targeting and, in many CoCoNuTs,
  DNA targeting via McrC nuclease homologs.
definition_source: DOI:10.7554/eLife.94800.3
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
