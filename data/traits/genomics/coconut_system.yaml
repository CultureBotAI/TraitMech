evidence:
- reference: DOI:10.7554/eLife.94800.3
  snippet: 'We focus on a previously uncharacterized branch, which we denote coiled-coil
    nuclease tandems (CoCoNuTs) for their salient features: the presence of extensive
    coiled-coil structures and tandem nucleases'
  notes: Bell et al. name CoCoNuTs as coiled-coil nuclease tandem systems in an uncharacterized
    McrBC Type IV restriction branch.
- reference: DOI:10.7554/eLife.94800.3
  snippet: We classified the CoCoNuTs into three types and seven subtypes based on
    the GTPase domain phylogeny and conserved genomic context
  notes: Bell et al. classify CoCoNuTs into multiple types and subtypes using GTPase
    phylogeny and conserved genomic context.
- reference: DOI:10.7554/eLife.94800.3
  snippet: all suggesting that the CoCoNuTs target RNA
  notes: Bell et al. interpret CoCoNuT domain architecture as predictive of RNA targeting.
- reference: DOI:10.7554/eLife.94800.3
  snippet: Many CoCoNuTs might additionally target DNA, via McrC nuclease homologs
  notes: Bell et al. predict that many CoCoNuTs might also target DNA via McrC nuclease
    homologs.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| CoCoNut | 10\.7554/eLife\.94800\.3 | CoCoNuTs are a diverse subclass
    of Type IV restriction systems predicted to target RNA | '
  notes: The pinned DefenseFinder article registry maps the CoCoNut source key to
    the Bell et al. versioned eLife article.
