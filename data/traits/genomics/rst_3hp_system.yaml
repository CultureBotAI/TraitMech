discussions:
- discussion_id: rst-3hp-host-mechanism-gap
  prompt: Resolve Rst_3HP native host breadth, Hp1/Hp2/Hp3 molecular activities, profile-to-gene
    mapping, and the mechanism of P1 restriction before minting narrower Rst_3HP mechanism
    children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support a three-gene P2-hotspot system with no clear predicted
    domains that protects against P1, and DefenseFinder represents Rst_3HP as a required
    Hp1/Hp2/Hp3 three-profile model. This first system-level record leaves native
    host breadth, profile-to-gene mapping, the molecular activities of Hp1, Hp2, and
    Hp3, and the P1 restriction mechanism unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2022.02.018
    snippet: The second system comprises three genes that have no clear predicted
      domain and protect against P1.
    notes: Rousset et al. experimentally describe the unnamed three-gene P2-hotspot
      system that DefenseFinder tracks as Rst_3HP.
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_3hp.md
    snippet: As far as we are aware, the molecular mechanism is unknown.
    notes: The pinned DefenseFinder wiki page leaves the Rst_3HP molecular mechanism
      unresolved.
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_3hp.md
    snippet: 'The Rst_3HP is composed of 3 proteins: Hp1, Hp2 and Hp3.'
    notes: The pinned DefenseFinder wiki page describes Rst_3HP as a three-component
      Hp1/Hp2/Hp3 system.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "Rst_3HP\tRst_3HP\t3\t3\tRst_3HP__Hp1, Rst_3HP__Hp2, Rst_3HP__Hp3\t\t\
      \t"
    notes: The DefenseFinder rules table models Rst_3HP as a three-profile system
      requiring Rst_3HP__Hp1, Rst_3HP__Hp2, and Rst_3HP__Hp3.
