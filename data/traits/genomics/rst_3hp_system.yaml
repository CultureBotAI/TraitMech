identifier: traitmech:000398
label: Rst_3HP system
definition: A phage defense system in which an organism possesses a three-protein
  Rst_3HP locus represented by DefenseFinder as a three-profile model requiring Rst_3HP__Hp1,
  Rst_3HP__Hp2, and Rst_3HP__Hp3 and experimentally linked to P1 protection when expressed
  in Escherichia coli.
definition_source: DOI:10.1016/j.chom.2022.02.018
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
