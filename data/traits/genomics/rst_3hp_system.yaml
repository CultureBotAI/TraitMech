evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: The second system comprises three genes that have no clear predicted domain
    and protect against P1.
  notes: Rousset et al. experimentally describe the unnamed three-gene P2-hotspot
    system that DefenseFinder tracks as Rst_3HP.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Phage resistance heatmaps of the validated defense systems show the median
    fold resistance of three independent replicates against a panel of eight phages
  notes: The Figure 5 legend frames the cloned P2-hotspot hits, including the three-gene
    P1-restricting system, as validated defense systems in a replicated phage-resistance
    heatmap.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_3hp.md
  snippet: 'The Rst_3HP system is composed of 3 proteins: Hp1, Hp2 and, Hp3. These
    proteins do not have clear predicted domains but they confer resistance against
    the phage P1 in *Escherichia coli* E1114 :ref{doi=10.1016/j.chom.2022.02.018}.'
  notes: The pinned DefenseFinder wiki page names Rst_3HP as a three-protein system
    and links Hp1, Hp2, and Hp3 to P1 resistance in Escherichia coli E1114.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_3hp.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The pinned DefenseFinder wiki page leaves the Rst_3HP molecular mechanism
    unresolved.
