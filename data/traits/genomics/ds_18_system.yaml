    and final Science Tables S6/S7/S8 map it to product accession WP_021529611.1,
    a Candy phage readout, display name DS-18, and a PDDEXK HHpred row. The pinned
    DefenseFinder HMM inventory records one DS-18 custom profile row. The pinned rules
    table has no DS-18 row, and the first-pass record does not resolve native host
    breadth, phage breadth, direct profile-to-protein correspondence, PDDEXK nuclease
    activity, molecular output, or endogenous DS-18 activity.
