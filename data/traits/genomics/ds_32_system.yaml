- graph_id: ds_32_locus_reduces_phage_plaquing
  title: DS-32 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the two-gene DS-32 locus to
    reduced bacteriophage plaquing without resolving DS-32 component function or molecular
    output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-32 as the validated NADR transcriptional unit
    with two product accessions, lower-probability RecR and high-probability PRTase
    HHpred rows for WP_000097610.1, a high-probability NADAR HHpred row for WP_032260665.1,
    and two DefenseFinder DS-32 profile rows. It does not assert native host breadth,
    exact profile-to-protein correspondence, DS-32 molecular activity, trigger, substrate,
    complete phage breadth, RecR, PRTase, or NADAR HHpred-domain interpretation, or
    DefenseFinder rule-level detection criteria.
