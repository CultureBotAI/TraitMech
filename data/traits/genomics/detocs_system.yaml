discussions:
- discussion_id: detocs-component-mechanism-gap
  prompt: Resolve Detocs phage triggers, component-specific phosphotransfer events,
    and DtcC-family effector outputs before minting narrower Detocs mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support Detocs as a named family of two-component phosphotransfer-signaling
    bacterial defense systems, and DefenseFinder represents Detocs with required dtcA
    and dtcB profiles plus optional dtcC-family profiles. This system-level record
    leaves the direct phage trigger, component-specific activation route, exact ATP
    nucleosidase effector architecture, and DtcC-variant outputs unresolved.
  attaches_to:
  - causal_graphs#detocs_locus_depletes_atp
  posed_by: codex
  posed_date: '2026-09-20'
