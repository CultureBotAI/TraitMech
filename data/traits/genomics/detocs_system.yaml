identifier: traitmech:000302
label: Detocs system
definition: A phage defense system in which an organism possesses a Detocs locus represented
  in DefenseFinder by DtcA and DtcB profiles plus optional DtcC-family profiles, with
  an ATP nucleosidase output that can degrade ATP and dATP upon phage infection and
  halt phage propagation.
definition_source: DOI:10.1016/j.cell.2023.07.020
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Detocs
  synonym_type: EXACT_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.cell.2023.07.020
  snippet: By analyzing homologs of the immune ATP nucleosidase domain, we discover
    and characterize Detocs, a family of bacterial defense systems with a two-component
    phosphotransfer-signaling architecture
  notes: Rousset et al. discover Detocs from immune ATP nucleosidase domain homologs
    and name it as a bacterial defense-system family with two-component phosphotransfer-signaling
    architecture.
- reference: DOI:10.1016/j.cell.2023.07.020
  snippet: upon phage infection, degrade cellular adenosine triphosphate (ATP) and
    deoxyadenosine triphosphate (dATP)
  notes: Rousset et al. support ATP and dATP degradation as a phage-triggered bacterial
    immune output.
- reference: DOI:10.1016/j.cell.2023.07.020
  snippet: ATP and dATP degradation during infection halts phage propagation
  notes: Rousset et al. connect ATP and dATP degradation to inhibition of phage propagation.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Detocs | 10\.1101/2023\.01\.24\.525353 | A conserved family of immune effectors
    cleaves cellular ATP upon viral infection
  notes: The DefenseFinder article registry maps the named Detocs system to the Rousset
    et al. ATP-cleavage preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Detocs\tDetocs\t2\t2\tDetocs__dtcA, Detocs__dtcB\tDetocs__dtcC"
  notes: The DefenseFinder rules table models the core Detocs system with required
    dtcA and dtcB profiles and an optional dtcC profile.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Detocs__dtcA                                     | Detocs__dtcA                                     |
    Detocs                 | Custom                  | 30     |'
  notes: The DefenseFinder HMM inventory records dtcA under the Detocs model namespace.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Detocs__dtcB                                     | Detocs__dtcB                                     |
