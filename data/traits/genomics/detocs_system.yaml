causal_graphs:
- graph_id: detocs_locus_depletes_atp
  title: Detocs loci connect phage infection to ATP depletion
  description: Conservative system-level sketch linking possession of a Detocs locus
    to phage-associated ATP and dATP degradation, halted phage propagation, and the
    Detocs system trait without asserting the direct phage trigger or component-specific
    activation mechanism.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Detocs as a named ATP-depletion anti-phage system
    with DtcA, DtcB, and DtcC-family DefenseFinder profiles while leaving the direct
    phage trigger, component-specific phosphotransfer sequence, DtcC-variant effects,
    and universal system boundary unresolved.
