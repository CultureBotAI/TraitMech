identifier: traitmech:000229
label: AbiK system
definition: An abortive infection system in which an organism possesses an abiK locus
  encoding a reverse-transcriptase-related polymerase that uses conserved RT motifs
  for phage resistance and restricts 936/P335 lactococcal phage propagation.
definition_source: DOI:10.1128/aem.63.4.1274-1283.1997
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000214
evidence:
- reference: DOI:10.1128/aem.63.4.1274-1283.1997
  snippet: The phage resistance mechanism encoded on pSRQ800 is a temperature-sensitive
    abortive infection system (Abi)
  notes: Emond et al. localized a lactococcal plasmid-encoded abortive-infection mechanism
    that strongly resists 936 and P335 phages.
- reference: DOI:10.1128/aem.63.4.1274-1283.1997
  snippet: orf1 (renamed abiK) coded for a predicted protein of 599 amino acids (AbiK)
  notes: Emond et al. identified abiK as the open reading frame needed for the pSRQ800
    Abi phenotype.
- reference: DOI:10.1128/aem.63.4.1274-1283.1997
  snippet: No phage DNA replication nor phage structural protein production was detected
    in infected AbiK+ L. lactis cells
  notes: Emond et al. support an AbiK-associated block at or before DNA replication
    for the ul36 lactococcal phage.
- reference: DOI:10.1099/00221287-146-2-445
  snippet: Only immature forms (concatemeric and circular DNA) of phage p2 DNA were
    found, indicating that the presence of AbiK prevented phage DNA maturation
  notes: Boucher et al. show that AbiK can block later DNA maturation rather than
    DNA replication itself, depending on the lactococcal phage tested.
- reference: DOI:10.1128/JB.187.11.3721-3730.2005
  snippet: the antiphage activity depends on the level of expression of the abiK gene
    and on the presence of a reverse transcriptase (RT) motif in AbiK
  notes: Fortier et al. connect AbiK phage resistance to conserved reverse-transcriptase
    motifs in the AbiK protein.
- reference: DOI:10.1128/JB.187.11.3721-3730.2005
  snippet: Conservative mutations in key positions resulted in the complete loss of
    the resistance phenotype
  notes: Fortier et al. mutated AbiK RT motifs and showed that key positions are necessary
    for AbiK-mediated resistance.
- reference: DOI:10.1093/nar/gkr397
  snippet: AbiK does not exhibit the properties expected for an RT, but polymerizes
    long DNAs of ‘random’ sequence, analogous to a terminal transferase
  notes: Wang et al. biochemically characterized AbiK as an RT-related polymerase
    with template-independent DNA polymerization activity.
- reference: DOI:10.1093/nar/gkr397
  snippet: Mutagenesis experiments indicate that the polymerase activity resides in
    the RT motifs and is essential for phage resistance in vivo
  notes: Wang et al. support AbiK RT-motif polymerase activity as an essential contributor
    to phage resistance.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Emond et al. isolated the pSRQ800 abiK determinant from Lactococcus lactis
    subsp. lactis W1 and showed that it confers abortive infection against 936 and
    P335 lactococcal phages when introduced into phage-sensitive Lactococcus lactis
    strains.
  reference: DOI:10.1128/aem.63.4.1274-1283.1997
