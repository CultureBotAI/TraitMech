discussions:
- discussion_id: gaps4-mechanism-gap
  prompt: Resolve GAPS4 natural host breadth, lambda-vir host-DNA-degradation triggers,
    abortive-infection mechanism, and exact GAPS4a/GAPS4b profile-to-protein correspondence
    before minting narrower GAPS4 mechanism traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Mahata et al. support GAPS4 as a GMT-encoded anti-phage defense system
    that protects E. coli against T7, T4, P1-vir, and lambda-vir when expressed from
    a Vibrio parahaemolyticus locus, and DefenseFinder represents GAPS4 as a two-profile
    system. Natural host breadth, the lambda-vir-specific trigger of host DNA degradation,
    the abortive-infection mechanism, and exact profile-to-protein correspondence
    remain unresolved.
  evidence:
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
    snippet: GAPS4 is present in both Gram-positive and Gram-negative GAPS4 activity
      was assessed in *E. coli* and was shown to be active against T4, P1-vir and
      lambda-vir and to reduce lysis plaque size of T7 :ref{doi=10.1101/2023.03.28.534373}.
    notes: The DefenseFinder wiki summarizes GAPS4 activity against T4, P1-vir, lambda-vir,
      and T7 plaque lysis in an E. coli assay.
