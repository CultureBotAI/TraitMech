identifier: traitmech:000379
label: GAPS4 system
definition: A phage defense system in which an organism possesses a GMT-encoded GAPS4
  locus represented by DefenseFinder as a two-profile model, GAPS4__GAPS4a and GAPS4__GAPS4b,
  and experimentally linked to T7, T4, P1-vir, and lambda-vir protection when expressed
  in E. coli.
definition_source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: GAPS4
  synonym_type: EXACT_SYNONYM
  source: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
- synonym_text: GAPS4__GAPS4a
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
- synonym_text: GAPS4__GAPS4b
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
evidence:
- reference: DOI:10.1038/s41564-024-01840-5
  snippet: We reveal four anti-phage defence systems encoded within GMT islands and
    further characterize one system, GAPS1, showing it is triggered by a phage capsid
    protein to induce cell dormancy
  notes: Mahata et al. identify four anti-phage defense systems in Gamma-Mobile-Trio
    islands.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: GAPS4 is a two genes system (GAPS4a and GAPS4b). GAPS stands for GMT-encoded
    Anti-Phage System.
  notes: The DefenseFinder wiki describes GAPS4 as a two-gene GMT-encoded anti-phage
    system.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: GAPS4 is present in both Gram-positive and Gram-negative GAPS4 activity
    was assessed in *E. coli* and was shown to be active against T4, P1-vir and lambda-vir
    and to reduce lysis plaque size of T7 :ref{doi=10.1101/2023.03.28.534373}.
  notes: The DefenseFinder wiki summarizes GAPS4 activity against T4, P1-vir, lambda-vir,
    and T7 plaque lysis in an E. coli assay.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: GAPS4a is a nuclease containing a domain from the PDDEXK clan (CL0236)
    suggesting that the GAPS4 defense system is acting via DNA degradation. Both genes
    are required for phage defense and were predicted to form a heterodimer. It was
    shown that the system causes host DNA degradation upon infection by lambda-vir
    only, which would suggest that GAPS4 is an abortive infection system :ref{doi=10.1101/2023.03.28.534373}.
  notes: The DefenseFinder wiki summarizes evidence for PDDEXK-domain GAPS4a, dual-gene
    requirement, and lambda-vir-associated host DNA degradation.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: The GAPS4 system in *Hafnia alvei* (GCF_902387815.1, NZ_LR699008) is composed
    of 2 proteins GAPS4a (WP_111329122.1) GAPS4b (WP_111329123.1)
  notes: The DefenseFinder wiki illustrates a predicted two-protein GAPS4 locus in
    RefSeq assembly GCF_902387815.1 on NZ_LR699008.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: "Mahata_2023[<a href='https://doi.org/10.1101/2023.03.28.534373'>Mahata\
    \ et al., 2023</a>] --> Origin_0\n    Origin_0[Vibrio parahaemolyticus \n<a href='https://ncbi.nlm.nih.gov/protein/WP_055466293.1'>WP_055466293.1</a>,\
    \ <a href='https://ncbi.nlm.nih.gov/protein/WP_055466294.1'>WP_055466294.1</a>]\
    \ --> Expressed_0[Escherichia coli]\n    Expressed_0[Escherichia coli] ----> T7\
    \ & T4 & P1-vir & Lambda-vir"
  notes: The DefenseFinder experimental-validation diagram links Mahata et al. to
    a Vibrio parahaemolyticus GAPS4 source locus expressed in E. coli against T7,
    T4, P1-vir, and Lambda-vir.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/gaps4.md
  snippet: "subgraph Title4[Protects against]\n        T7\n        T4\n        P1-vir\n\
    \        Lambda-vir"
  notes: The DefenseFinder experimental-validation diagram lists T7, T4, P1-vir, and
    Lambda-vir in the GAPS4 protects-against subgraph.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: GAPS4 | 10\.1101/2023\.03\.28\.534373 | Gamma-Mobile-Trio systems define
    a new class of mobile elements rich in bacterial defensive and offensive tools
  notes: The DefenseFinder article registry maps the named GAPS4 system to the Mahata
    et al. preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "GAPS4\tGAPS4\t2\t2\tGAPS4__GAPS4a, GAPS4__GAPS4b\t\t\t"
  notes: The DefenseFinder rules table models GAPS4 as a two-profile system requiring
    GAPS4__GAPS4a and GAPS4__GAPS4b.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| GAPS4__GAPS4a                                    | GAPS4__GAPS4a                                    |
