identifier: traitmech:000374
label: Rst_DUF4238 system
definition: A phage defense system in which an organism possesses a single-gene Rst_DUF4238
  locus represented by DefenseFinder as an Rst_DUF4238__DUF4238_Pers single-profile
  model and experimentally linked to strong resistance against phage T7.
definition_source: DOI:10.1016/j.chom.2022.02.018
