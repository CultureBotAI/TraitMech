discussions:
- discussion_id: rst-duf4238-host-mechanism-gap
  prompt: Resolve Rst_DUF4238 native host breadth, accession-level DUF4238 proteins,
    and the molecular mechanism of T7 restriction before minting narrower Rst_DUF4238
    mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Rousset et al. support a one-protein DUF4238 P2-hotspot system that provides
    strong T7 resistance when expressed in Escherichia coli, and DefenseFinder represents
    Rst_DUF4238 as a single-profile Rst_DUF4238__DUF4238_Pers model. This first system-level
    record leaves native host breadth, accession-level component grounding, the profile-to-activity
    mapping, and the T7 restriction mechanism unresolved.
  evidence:
  - reference: DOI:10.1016/j.chom.2022.02.018
    snippet: The first system consists of a single protein with a DUF4238 domain (whose
      molecular function is currently unknown) that provides strong resistance against
      T7.
    notes: Rousset et al. describe the one-protein DUF4238 candidate from the P2-encoded
      hotspot and connect it to strong T7 resistance.
  - reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_duf4238.md
    snippet: As far as we are aware, the molecular mechanism is unknown.
    notes: The pinned DefenseFinder wiki page leaves the Rst_DUF4238 molecular mechanism
      unresolved.
