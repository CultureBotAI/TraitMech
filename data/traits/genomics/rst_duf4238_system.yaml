evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: The first system consists of a single protein with a DUF4238 domain (whose
    molecular function is currently unknown) that provides strong resistance against
    T7.
  notes: Rousset et al. describe the one-protein DUF4238 candidate from the P2-encoded
    hotspot and connect it to strong T7 resistance.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: Phage resistance heatmaps of the validated defense systems show the median
    fold resistance of three independent replicates against a panel of eight phages
  notes: The Figure 5 legend frames the cloned P2-hotspot hits, including the DUF4238
    system, as validated defense systems in a replicated phage-resistance heatmap.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_duf4238.md
  snippet: Rst_DUF4238 is a single gene system found in a screen of phage and phage-satellites
    antiviral hotspots :ref{doi=10.1016/j.chom.2022.02.018}. It was shown to provide
    *E.coli* with a strong resistance against phage T7.
  notes: The pinned DefenseFinder wiki page names Rst_DUF4238 as a single-gene system
    and links it to strong T7 resistance.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_duf4238.md
  snippet: As far as we are aware, the molecular mechanism is unknown.
  notes: The pinned DefenseFinder wiki page leaves the Rst_DUF4238 molecular mechanism
    unresolved.
- reference: https://gitlab.pasteur.fr/mdm-lab/wiki/-/raw/ee7647d8/content/3.defense-systems/rst_duf4238.md
  snippet: 'The Rst_DUF4238 is composed of 1 protein: DUF4238.'
