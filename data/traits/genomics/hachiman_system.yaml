discussions:
- discussion_id: hachiman-subtype-and-trigger-gap
  prompt: Resolve Hachiman subtype effectors, DNA substrates, and activation triggers
    before minting narrower Hachiman mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Tuck et al. support DNA-damage-triggered type I-A HamAB activation and
    Cui et al. support type I-B HamAB ATPase and DNA-cleavage activity, but Hachiman
    variants need separate review before TraitMech asserts one universal triggering
    DNA substrate, HamA catalytic domain, HamC accessory role, Cap4 fusion architecture,
    phage range, or abortive-infection output.
