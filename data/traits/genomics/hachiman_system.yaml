identifier: traitmech:000219
label: Hachiman system
definition: A genomics trait describing possession of a Hachiman antiphage defense
  locus encoding a HamA/HamB nuclease-helicase core that restricts bacteriophage propagation
  through DNA cleavage.
definition_source: DOI:10.1016/j.cell.2024.09.020
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Hachiman antiphage defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.cell.2024.09.020
- synonym_text: Hachiman defense system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/s41467-025-57851-1
evidence:
- reference: DOI:10.1016/j.cell.2024.09.020
  snippet: Hachiman is a broad-spectrum antiphage defense system of unknown function
  notes: Tuck et al. support Hachiman as a named broad-spectrum antiphage system.
- reference: DOI:10.1016/j.cell.2024.09.020
  snippet: Hachiman is a heterodimeric nuclease-helicase complex, HamAB
  notes: Tuck et al. support the HamA/HamB nuclease-helicase core of characterized
    Hachiman systems.
- reference: DOI:10.1016/j.cell.2024.09.020
  snippet: When the HamAB complex detects DNA damage, HamB helicase activity activates
    HamA, unleashing nuclease activity
  notes: Tuck et al. connect HamB helicase activity with HamA nuclease activation
    after DNA-damage detection.
- reference: DOI:10.1016/j.cell.2024.09.020
  snippet: Hachiman activation degrades all DNA in the cell, creating "phantom" cells
    devoid of both phage and host DNA
  notes: Tuck et al. support nonspecific DNA degradation as the type I-A Hachiman
    antiviral output.
- reference: DOI:10.1038/s41467-025-57851-1
  snippet: The Hachiman system is a novel prokaryotic antiphage defense system comprising
    HamA and HamB proteins
  notes: Cui et al. support the recurring Hachiman system name and its HamA/HamB composition.
- reference: DOI:10.1038/s41467-025-57851-1
  snippet: HamA interacts with HamB to form a heterodimer HamAB to mediate ATP hydrolysis
    and execute DNA cleavage, thus implementing antiphage defense
  notes: Cui et al. support a type I-B HamAB heterodimer that couples ATP hydrolysis
    to antiphage DNA cleavage.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Tuck et al. identified Hachiman loci in E. coli ECOR04, ECOR28, and ECOR31,
    and showed that ECOR31 HamAB reduced plaquing by diverse double-stranded DNA phages.
  reference: DOI:10.1016/j.cell.2024.09.020
causal_graphs:
- graph_id: hachiman_hamab_dna_cleavage
  title: Hachiman HamAB complexes cleave DNA during antiphage defense
  description: Evidence-backed process sketch linking a Hachiman locus to HamAB nuclease-helicase
    activity, cellular DNA degradation, and inhibition of bacteriophage progeny production.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures characterized type I-A and type I-B Hachiman nuclease-helicase
    outputs without asserting one universal DNA-damage trigger, DNA substrate, active
    nuclease domain, HamC accessory role, Cap4 architecture, phage breadth, or abortive-infection
    pathway across all Hachiman loci.
  nodes:
  - node_id: hachiman_locus
    label: Hachiman locus
    node_type: GENETIC_ELEMENT
    description: A Hachiman antiphage defense locus encoding a HamA/HamB nuclease-helicase
      core and, in some type II systems, an accessory HamC component.
  - node_id: hamab_complex_assembly
    label: HamAB complex assembly
    node_type: BIOLOGICAL_PROCESS
    description: Formation of a Hachiman HamA/HamB nuclease-helicase complex capable
      of ATP-dependent DNA processing.
  - node_id: hachiman_dna_cleavage
    label: Hachiman DNA cleavage
    node_type: BIOLOGICAL_PROCESS
    description: HamAB-mediated cleavage or degradation of DNA during Hachiman activation.
  - node_id: phage_particle_production
    label: phage particle production
    node_type: BIOLOGICAL_PROCESS
    description: Production of new infectious bacteriophage particles inside an infected
      bacterial host.
  - node_id: hachiman_system_trait
    label: Hachiman system
    node_type: TRAIT
    grounding: traitmech:000219
    description: Possession of a genome-encoded Hachiman antiphage defense locus.
  - node_id: phage_defense_system
    label: phage defense system
    node_type: TRAIT
    grounding: traitmech:000209
    description: Possession of one or more genome-encoded immune systems that inhibit
      bacteriophage infection.
