discussions:
- discussion_id: ig-like-schlafen-defensefinder-profile-gap
  prompt: Resolve exact pSlfn5 family boundaries, natural host exemplars, T5-like
    tail chaperone trigger breadth, and DefenseFinder HMM/rules coverage before minting
    narrower Ig-like Schlafen mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Perez Taboada et al. support prokaryotic Schlafen nucleases as widespread
    antiviral effectors and experimentally characterize the Ig-like RorSlfn5 nuclease
    as a T5-like tail chaperone-triggered tRNase, and the pinned DefenseFinder article
    registry maps the Shlafen_Ig-like key to the same article. The pinned HMM inventory
    and rules table have no exact Schlafen rows. This first-pass record therefore
    does not resolve exact pSlfn5 family boundaries, natural host exemplars, accession-level
    Schlafen proteins, full phage trigger breadth, or a reusable DefenseFinder profile
    model.
  evidence:
  - reference: DOI:10.1038/s41564-026-02277-8
