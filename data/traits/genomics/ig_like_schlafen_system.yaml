  description: Conservative system-level sketch linking an Ig-like prokaryotic Schlafen
    locus to T5-like tail assembly chaperone sensing, Schlafen nuclease-dependent
    tRNA cleavage, and the Ig-like Schlafen phage-defense trait.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the Ig-like prokaryotic Schlafen DefenseFinder article
    namespace at system level and deliberately defers a protein-resolved RorSlfn5
