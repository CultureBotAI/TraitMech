identifier: traitmech:000508
label: Ig-like Schlafen system
definition: A phage defense system in which an organism possesses a genome-encoded
  prokaryotic Schlafen nuclease fused to an immunoglobulin-like sensor domain that
  recognizes T5-like phage tail assembly chaperones and activates Schlafen tRNase
  defense.
definition_source: DOI:10.1038/s41564-026-02277-8
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: Shlafen_Ig-like
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
- synonym_text: pSlfn5
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41564-026-02277-8
evidence:
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: prokaryotic Schlafen nucleases are widespread antiviral effectors that
    protect bacteria from bacteriophages and are fused to a diverse array of phage-sensing
    domains.
  notes: Perez Taboada et al. support bacterial prokaryotic Schlafen nucleases as
    antiviral effectors fused to phage-sensing domains.
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: Schlafen nuclease is fused to a previously unknown immunoglobulin-like
    sensor domain and demonstrated that it recognizes tail assembly chaperones of
    T5-like phages.
  notes: Perez Taboada et al. support Ig-like domain fusion and T5-like tail assembly
    chaperone recognition by an Ig-like prokaryotic Schlafen system.
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: We expressed seven Enterobacterales Schlafen systems in Escherichia coli,
    identifying two that confer defence against coliphages.
  notes: Perez Taboada et al. cloned candidate Enterobacterales Schlafen systems into
    E. coli and observed coliphage defense for two of them.
- reference: DOI:10.1038/s41564-026-02277-8
  snippet: Upon activation, the Schlafen nuclease cleaves both E. coli and phage-encoded
    tRNAs and restricts T5 phage by reducing its burst size.
  notes: Perez Taboada et al. connect activation of an Ig-like RorSlfn5 nuclease to
    bacterial and phage tRNA cleavage and T5 burst-size reduction.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| Shlafen_Ig-like | 10\.1038/s41564-026-02277-8 | Bacterial Schlafen proteins
    mediate phage defence | '
  notes: The pinned DefenseFinder article registry maps the Shlafen_Ig-like source
    key to the Perez Taboada et al. Schlafen phage-defense paper.
