evidence:
- reference: DOI:10.3168/jds.S0022-0302(98)75713-3
  snippet: Complete Sequence of the New Lactococcal Abortive Phage Resistance Gene
    abiO
  notes: Crossref metadata verifies the Prevots and Ritzenthaler 1998 AbiO primary
    paper title and DOI.
- reference: DOI:10.1093/femsre/fuag009
  snippet: the majority (18 systems) are each represented by single protein-coding
    genes
  notes: The FEMS review lists AbiO among the confirmed lactococcal Abi-like systems
    in Table 1 and omits AbiO from the named two- and three-component exception lists.
- reference: DOI:10.1093/femsre/fuag009
  snippet: the AbiO N-terminal domain resembles a restriction endonuclease type II-like
    domain-containing protein
  notes: The FEMS review summarizes a predicted nuclease-like AbiO N-terminal domain
    but does not establish the exact AbiO trigger or effector activity.
- reference: DOI:10.1093/femsre/fuag009
  snippet: Its C-terminal domain is predicted to encompass a superfamily 1B (SF1B)
    helicase
  notes: The FEMS review summarizes a predicted SF1B helicase-like AbiO C-terminal
    domain without resolving how AbiO arrests infected cells.
- reference: DOI:10.1093/femsre/fuag009
  snippet: AbiO was previously shown to be toxic in Lactococcus when its encoding
    gene was cloned in a high-copy number vector
  notes: The FEMS review treats AbiO overexpression toxicity as support for its abortive-infection
    phenotype.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: 'AbiO | 10\.1016/j\.mib\.2005\.06\.006 | Phage abortive infection in lactococci:
    variations on a theme'
  notes: The DefenseFinder article registry maps the named AbiO model namespace to
    the Chopin et al. lactococcal abortive-infection review.
