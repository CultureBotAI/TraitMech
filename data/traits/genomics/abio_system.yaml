discussions:
- discussion_id: abio-trigger-and-effector-gap
  prompt: Resolve the AbiO phage trigger, restriction-endonuclease and helicase activity,
    and growth-arrest or cell-death route before minting narrower AbiO mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Prevots and Ritzenthaler support AbiO as a lactococcal abortive phage
    resistance gene, the FEMS review retains AbiO among confirmed lactococcal Abi-like
    systems, and DefenseFinder represents AbiO with a mandatory AbiO__AbiO profile.
    The FEMS table leaves the AbiO effect on the cell and phage escape proteins unknown
    for the tested phages, and the FEMS structural discussion predicts restriction-endonuclease-like
    and SF1B-helicase-like domains while not resolving the molecular trigger or effector
    activity. This first system-level record therefore leaves the direct phage trigger,
    exact molecular activity, growth-arrest or cell-death route, and phage escape
    routes unresolved.
  evidence:
  - reference: DOI:10.1093/femsre/fuag009
    snippet: the AbiO N-terminal domain resembles a restriction endonuclease type
      II-like domain-containing protein
    notes: The FEMS review summarizes a predicted nuclease-like AbiO N-terminal domain
      but does not establish the exact AbiO trigger or effector activity.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: Its C-terminal domain is predicted to encompass a superfamily 1B (SF1B)
      helicase
    notes: The FEMS review summarizes a predicted SF1B helicase-like AbiO C-terminal
      domain without resolving how AbiO arrests infected cells.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: AbiO was previously shown to be toxic in Lactococcus when its encoding
      gene was cloned in a high-copy number vector
    notes: The FEMS review treats AbiO overexpression toxicity as support for its
      abortive-infection phenotype.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
    snippet: "AbiO\tAbiO\t1\t1\tAbiO__AbiO\t\t\t"
    notes: The DefenseFinder rules table models AbiO as a one-component system requiring
      the AbiO__AbiO profile.
