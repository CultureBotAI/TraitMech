identifier: traitmech:000447
label: DS-22 system
definition: A phage defense system in which an organism possesses the single-gene
  DefensePredictor-discovered system 22 locus cataloged as working transcriptional
  unit MVB1 and whose plasmid expression in E. coli MG1655 reduced bacteriophage plaquing.
definition_source: DOI:10.1126/science.adv7924
trait_category: GENOMICS
