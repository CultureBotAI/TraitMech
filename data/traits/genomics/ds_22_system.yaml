  title: DS-22 locus reduces bacteriophage plaquing
  description: Conservative system-level sketch linking the single-gene DS-22 locus
    to reduced bacteriophage plaquing without resolving DS-22 component function or
    molecular output.
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures DS-22 as the validated MVB1 transcriptional unit
    with one product accession and one DefenseFinder DS-22 profile row. It does not
    assert native host breadth, exact profile-to-protein correspondence, DS-22 molecular
    activity, trigger, substrate, low-confidence HHpred-domain interpretations, complete
    phage breadth, or DefenseFinder rule-level detection criteria.
