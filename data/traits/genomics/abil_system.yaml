discussions:
- discussion_id: abil-trigger-and-effector-gap
  prompt: Resolve the AbiL phage trigger, AbiLi and AbiLii activities, AbiLi2 and
    AbiLii2 HMM row relationships, and ATPase-plus-TOPRIM mechanism before minting
    narrower AbiL mechanism children.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Deng et al. support AbiL as a lactococcal phage abortive infection system,
    the FEMS review lists AbiL among confirmed two-component lactococcal Abi-like
    systems, and DefenseFinder represents AbiL with mandatory AbiL__AbiLi and AbiL__AbiLii
    profiles. The same pinned HMM inventory also contains AbiL__AbiLi2 and AbiL__AbiLii2
    rows that are not in the pinned two-profile rule, and the FEMS review summarizes
    unresolved ATPase and TOPRIM predictions. This first system-level record therefore
    leaves the direct phage trigger, exact AbiLi and AbiLii molecular activities,
    accessory-model interpretation, AbiL-to-PARIS similarity, growth-arrest or cell-death
    route, and phage escape routes unresolved.
  evidence:
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| AbiL__AbiLi2                                     | AbiL__AbiLi2                                     |
      AbiL                   | Custom                  | 20     |'
    notes: The DefenseFinder HMM inventory also records AbiL__AbiLi2 under the AbiL
      model namespace, but this profile is not listed in the two mandatory profiles
      in the pinned AbiL rule.
  - reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
    snippet: '| AbiL__AbiLii2                                    | AbiL__AbiLii2                                    |
      AbiL                   | Custom                  | 20     |'
    notes: The DefenseFinder HMM inventory also records AbiL__AbiLii2 under the AbiL
      model namespace, but this profile is not listed in the two mandatory profiles
      in the pinned AbiL rule.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: AbiL has been included among systems such as PARIS, which feature an
      ABC ATPase and a TOPRIM nuclease
    notes: The FEMS review places AbiL among predicted ATPase-plus-TOPRIM systems
      but does not resolve the AbiLi and AbiLii molecular activities.
  - reference: DOI:10.1093/femsre/fuag009
    snippet: No significant sequence similarity was found between the second components
      of AbiL and PARIS
    notes: The AbiL-to-PARIS comparison remains indirect for the second component,
      so this record does not copy the PARIS mechanism onto AbiL.
