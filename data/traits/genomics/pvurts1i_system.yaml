identifier: traitmech:000511
label: PvuRts1I system
definition: A type IV modification-dependent restriction system in which an organism
  possesses a PvuRts1I-family locus encoding a restriction endonuclease that recognizes
  5-hydroxymethylcytosine or 5-glucosylhydroxymethylcytosine in double-stranded DNA
  and cleaves both strands on the 3'-side away from the recognized modified cytosine.
definition_source: DOI:10.1093/nar/gkr607
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000496
synonyms:
- synonym_text: PvuRts1I
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1093/nar/gkr607
  snippet: Using PvuRts1I as the founding member, we define a family of homologous
    proteins with similar DNA modification-dependent recognition properties.
  notes: Wang et al. support PvuRts1I as the founding member of a family of modification-dependent
    restriction enzymes.
- reference: DOI:10.1093/nar/gkr607
  snippet: PvuRts1I is a modification-dependent restriction endonuclease that recognizes
    5-hydroxymethylcytosine (5hmC) as well as 5-glucosylhydroxymethylcytosine (5ghmC)
    in double-stranded DNA.
  notes: Wang et al. support PvuRts1I recognition of 5hmC- and 5ghmC-containing double-stranded
    DNA.
- reference: DOI:10.1093/nar/gkr607
  snippet: We show that these enzymes introduce a double-stranded cleavage at the
    3'-side away from the recognized modified cytosine.
  notes: Wang et al. support PvuRts1I-family enzymes as modification-dependent restriction
    endonucleases that cleave both DNA strands at a defined offset from the modified
    cytosine.
- reference: DOI:10.1093/nar/gkt747
  snippet: The new class of modification-dependent restriction enzymes was named Type
    IV, as distinct from the familiar modification-blocked Types I-III.
  notes: Loenen and Raleigh define the Type IV class as modification-dependent restriction
    enzymes.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: '| PvuRts1I | 10\.1093/nar/gkr607 | Comparative characterization of the
    PvuRts1I family of restriction enzymes and their application in mapping genomic
    5-hydroxymethylcytosine | '
  notes: The pinned DefenseFinder article registry maps the PvuRts1I source key to
    the Wang et al. PvuRts1I-family paper.
