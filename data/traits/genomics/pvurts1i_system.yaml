discussions:
- discussion_id: pvurts1i-defensefinder-model-gap
  prompt: Resolve PvuRts1I-family breadth, 5hmC and 5ghmC target selectivity across
    natural hosts, accession-level protein examples, and DefenseFinder RM_Type_IV
    HMM/rules mapping before minting narrower PvuRts1I mechanism or component traits.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Wang et al. support PvuRts1I as the founding member of a family of 5hmC-
    and 5ghmC-recognizing modification-dependent restriction endonucleases, and the
    pinned DefenseFinder article registry maps PvuRts1I to the Wang et al. paper.
    The pinned HMM inventory and rules table have no exact PvuRts1I rows. This first-pass
    record therefore does not resolve a reusable DefenseFinder profile model, exact
    accession-level protein examples, the breadth of PvuRts1I-like systems across
    natural hosts, or the complete set of natural 5hmC and 5ghmC target contexts.
