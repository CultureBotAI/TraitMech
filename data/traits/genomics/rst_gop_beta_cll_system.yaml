identifier: traitmech:000376
label: Rst gop-beta-cII system
definition: A phage defense system in which an organism possesses a P4-like gop-beta-cII
  locus represented by DefenseFinder as the Rst_gop_beta_cll model and experimentally
  linked to lambda and P1 phage restriction.
definition_source: DOI:10.1016/j.chom.2022.02.018
trait_category: GENOMICS
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000209
synonyms:
- synonym_text: gop-β-cII
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.chom.2022.02.018
- synonym_text: Rst_gop_beta_cll
  synonym_type: RELATED_SYNONYM
  source: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
evidence:
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: The well-characterized P4 satellite (NC_001609) carries at this position
    the non-essential genes gop, β, and cII, with gop and β likely acting as a toxin-antitoxin
    pair
  notes: Rousset et al. describe the canonical P4 satellite gop, beta, and cII locus
    before testing it for anti-phage activity.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: We report that gop-β-cII forms an anti-phage system that protects against
    λ and P1.
  notes: Rousset et al. directly identify gop-beta-cII as an anti-phage system that
    protects against lambda and P1.
- reference: DOI:10.1016/j.chom.2022.02.018
  snippet: When compared with a control vector encoding a green fluorescent protein
    (GFP), seven systems provided robust and reproducible resistance to at least one
    phage
  notes: Rousset et al. cloned P4/P2 hotspot systems under native promoters and measured
    reproducible phage resistance against their coliphage panel.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/List_system_article.md
  snippet: Rst_gop_beta_cll | 10\.1101/2021\.01\.21\.427644 | Prophage-encoded hotspots
    of bacterial immune systems
  notes: The DefenseFinder article registry maps the named Rst_gop_beta_cll system
    to the Rousset et al. preprint.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/DefenseFinder_rules.tsv
  snippet: "Rst_gop_beta_cll\tRst_gop_beta_cll\t3\t3\tRst_gop_beta_cll__beta, Rst_gop_beta_cll__cll,\
    \ Rst_gop_beta_cll__gop\t\t\t"
  notes: The DefenseFinder rules table models Rst_gop_beta_cll as a three-profile
    system requiring beta, cll, and gop profiles.
- reference: https://raw.githubusercontent.com/mdmparis/defense-finder-models/afb0e5a8b466be53586b13266f5d38d98c3ac268/Liste_hmm_system.md
  snippet: '| Rst_gop_beta_cll__beta                           | Rst_gop_beta_cll__beta                           |
