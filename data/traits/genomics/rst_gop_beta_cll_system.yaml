      | Rst_gop_beta_cll__gop                            | Rst_gop_beta_cll__gop                            |
      Rst_gop_beta_cll       | Custom                  | 20     |'
    notes: The DefenseFinder HMM inventory records custom beta, cll, and gop profiles
