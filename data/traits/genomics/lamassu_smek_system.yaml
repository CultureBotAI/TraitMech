discussions:
- discussion_id: lamassu-smek-function-and-annotation-scope
  prompt: Resolve the long-profile exception and validate SMEK-system function.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The paper describes SMEK as short-Lamassu-specific, while Dataset S1
    has 124 short-profile calls and one long-profile call with two distinct LmuB hits.
    The pinned model accepts both lengths. Reconcile that exceptional call with phylogeny
    and locus context before claiming a biological long-LmuB subtype or short-only
    distribution. The definition therefore captures architecture without a length
    restriction. The pinned legacy summary TSV and HMM inventory lack SMEK entries
    although the executable model and SMEK profile exist. This whole-system trait
    is not equivalent to DS-27 (traitmech:000451), whose existing definition denotes
    a single-gene transcriptional unit with the working label SMEK. No DS-27 assay
    phenotype or exact synonym is transferred. SMEK-specific Lamassu antiviral validation,
    substrates, activation order, domain-name expansion and accession-level protein
    mechanisms remain unresolved. Cap4 and Lipase experiments do not establish SMEK
    chemistry. No causal graph is asserted from these computational architecture calls
    alone.
  posed_by: codex
  posed_date: '2026-10-03'
