  title: MqsRAC loci support T2 phage inhibition
  description: Conservative system-level sketch linking possession of an MqsRAC locus
    to persister-cell formation and T2 inhibition without asserting a universal phage
    trigger, lethal abortive-infection route, or exact MqsRAC profile-to-activity
    mapping.
  scope_status: NONMECHANISTIC
