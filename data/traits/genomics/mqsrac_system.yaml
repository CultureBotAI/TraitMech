identifier: traitmech:000368
label: MqsRAC system
definition: A phage defense system in which an organism possesses a tripartite MqsRAC
  toxin-antitoxin-chaperone locus represented by DefenseFinder as a two-profile model
  requiring MqsRAC__mqsC and MqsRAC__mqsR.
