evidence:
- reference: PMID:38054715
  snippet: Therefore, our results are important since we show for the first time that
    a phage-defense system, the MqsRAC toxin/antitoxin system, allows the host to
    survive infection by forming persister cells, rather than inducing cell suicide.
  notes: Fernandez-Garcia et al. support MqsRAC as a phage-defense system whose outcome
    is host survival through persister-cell formation rather than cell suicide.
- reference: PMID:38054715
  snippet: Moreover, we demonstrate that the MqsRAC system works in concert with restriction/modification
    systems.
  notes: Fernandez-Garcia et al. connect the MqsRAC system to restriction/modification
    systems during phage inhibition.
- reference: DOI:10.1128/spectrum.03388-23
  snippet: the tripartite system MqsR (RNase toxin)/MqsA (antitoxin)/MqsC (SecB-type
    chaperone)
  notes: Fernandez-Garcia et al. describe MqsR/MqsA/MqsC as a tripartite toxin-antitoxin-chaperone
    phage-exclusion system from Escherichia coli C496_10.
- reference: DOI:10.1128/spectrum.03388-23
  snippet: We found there was a 2,100 to a 5,000-fold reduction in the EOP with phage
    T2 when the cells produced MqsR/MqsA/MqsC
  notes: Fernandez-Garcia et al. support MqsRAC-mediated reduction of T2 efficiency
    of plating.
