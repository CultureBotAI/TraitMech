identifier: traitmech:000114
label: lignin degradation
definition: A biopolymer-degradation metabolism in which an organism breaks down lignin,
  the recalcitrant aromatic heteropolymer of plant cell walls, using oxidative enzymes
  such as peroxidases and laccases.
definition_source: DOI:10.1039/c1np00042j
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000110
synonyms:
- synonym_text: ligninolytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1039/c1np00042j
- synonym_text: lignin breakdown
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
- synonym_text: lignin catabolism
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
xrefs:
- GO:0046274
evidence:
- reference: DOI:10.1039/c1np00042j
  notes: Bugg et al. review pathways for degradation of lignin in bacteria and fungi.
- reference: DOI:10.1016/j.cbpa.2015.10.018
  notes: Cragg et al. cover lignin breakdown as part of lignocellulose degradation
    across the tree of life.
canonical_examples:
- taxon_id: NCBITaxon:132919
  taxon_label: Rhodococcus jostii
  note: bacterial lignin degrader (DypB peroxidase)
  reference: PMID:21534568
- taxon_id: NCBITaxon:165695
  taxon_label: Sphingobium
  note: lignin-aromatic catabolism
  reference: PMID:22207743
- taxon_id: NCBITaxon:100226
  taxon_label: Streptomyces coelicolor A3(2)
  note: Strain-level laccase-loss model paired to the small laccase protein example.
  reference: DOI:10.1021/bi500285t
causal_graphs:
- graph_id: lignin_degradation_peroxidase_laccase
  title: Lignin degradation breaks down aromatic plant biopolymers via oxidative enzymes
  description: Evidence-backed causal sketch linking peroxidases and laccases to oxidative
    cleavage of recalcitrant lignin aromatic heteropolymer.
  scope_status: MECHANISTIC
  scope_notes: The graph combines fungal and bacterial oxidative-enzyme mechanisms.
    The S. coelicolor small-laccase example supports the laccase branch only; the
    peroxidase branches remain taxon-independent literature summaries.
  nodes:
  - node_id: lignin_degradation_trait
    label: lignin degradation
    node_type: TRAIT
    grounding: traitmech:000114
    description: Oxidative breakdown of lignin in plant cell walls.
  - node_id: oxidative_enzymes
    label: peroxidases and laccases
    node_type: GENE_OR_PROTEIN
    description: Secreted oxidative enzymes acting on the lignin aromatic framework.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This umbrella node combines phylogenetically and catalytically
      distinct laccase, DyP, manganese-peroxidase, and lignin-peroxidase families.
  - node_id: aromatic_monomers
    label: aromatic monomers / oligomers
    node_type: CHEMICAL
    description: Aromatic compounds released from depolymerized lignin.
  - node_id: laccase
    label: laccase
    node_type: GENE_OR_PROTEIN
    description: Multi-copper oxidase (EC 1.10.3.2) acting on lignin and using mediators.
    grounding: GO:0052716
    protein_examples:
    - uniprot_id: UniProtKB:Q9XAL8
      protein_label: Copper oxidase
      taxon_id: NCBITaxon:100226
      taxon_label: Streptomyces coelicolor A3(2)
      entry_status: UNREVIEWED
      proteome_id: UP000001973
      retrieved_on: '2026-08-24'
      entry_version: 131
      sequence_version: 1
      role: SCO6712 small laccase (ScLAC) tested by a laccase-loss comparison; this
        accession denotes the laccase component, not all oxidative enzymes in the
        graph.
      evidence:
      - reference: DOI:10.1021/bi500285t
        snippet: strain SCdeltaLAC was inefficient in degrading lignin compared to
          strain SCWT
        notes: The primary mutant and biochemical study supports a causal role for
          the S. coelicolor small laccase. UniProtKB Q9XAL8 is the exact unreviewed
          SCO6712 entry in reference proteome UP000001973.
  - node_id: dyp_peroxidase
    label: DyP-type peroxidase
    node_type: GENE_OR_PROTEIN
    description: Dye-decolorizing peroxidase (EC 1.11.1.19) contributing to lignin
      depolymerization.
    grounding: InterPro:IPR006314
  - node_id: manganese_peroxidase
    label: manganese peroxidase
    node_type: GENE_OR_PROTEIN
    description: Manganese peroxidase (EC 1.11.1.13) oxidizing Mn2+ to Mn3+.
    grounding: GO:0016689
  - node_id: lignin_peroxidase
    label: lignin peroxidase
    node_type: GENE_OR_PROTEIN
    description: Lignin peroxidase (EC 1.11.1.14) cleaving lignin interunit bonds.
    grounding: GO:0016690
  - node_id: lignin_depolymerization
    label: lignin depolymerization
    node_type: BIOLOGICAL_PROCESS
    description: Extracellular oxidative depolymerization of the lignin polymer.
  - node_id: mn2_ion
    label: Mn2+
    node_type: CHEMICAL
    description: Manganous ion, substrate of manganese peroxidase.
    grounding: CHEBI:29035
  - node_id: mn3_oxidant
    label: Mn3+ diffusible oxidant
    node_type: CHEMICAL
    description: Mn3+ generated by MnP that diffuses into lignin acting as oxidant/mediator.
  - node_id: small_molecule_mediators
    label: small-molecule mediators
    node_type: CHEMICAL
    description: Low-molecular-weight redox mediators extending laccase oxidative
      reach.
  - node_id: beta_o4_bond
    label: beta-O-4 aryl ether bond
    node_type: CHEMICAL
    description: Predominant beta-O-4 aryl-ether interunit linkage of lignin.
  - node_id: ca_cb_bond
    label: Calpha-Cbeta bond
    node_type: CHEMICAL
    description: Calpha-Cbeta carbon-carbon bond in lignin beta-O-4 units.
  edges:
  - subject: oxidative_enzymes
    predicate: confers
    object: lignin_degradation_trait
    description: Peroxidases and laccases drive oxidative lignin breakdown.
    evidence:
    - reference: DOI:10.1039/c1np00042j
      notes: Bugg et al. review pathways for degradation of lignin in bacteria and
        fungi.
    predicate_id: METPO:2007700
  - subject: lignin_degradation_trait
    predicate: produces
    object: aromatic_monomers
    description: Lignin oxidation releases aromatic monomers/oligomers.
    evidence:
    - reference: DOI:10.1016/j.cbpa.2015.10.018
      notes: Cragg et al. cover lignin breakdown as part of lignocellulose degradation.
    predicate_id: METPO:2007800
  - subject: laccase
    predicate: participates in
    object: lignin_depolymerization
    description: Laccase participates in extracellular lignin depolymerization.
    evidence:
    - reference: DOI:10.1186/s13068-024-02470-z
      notes: LME including laccase (EC 1.10.3.2) participated in depolymerization
        of large lignin polymers; broad across taxa.
    predicate_id: biolink:participates_in
  - subject: dyp_peroxidase
    predicate: participates in
    object: lignin_depolymerization
    description: DyP-type peroxidase participates in lignin depolymerization.
    evidence:
    - reference: DOI:10.1186/s13068-024-02470-z
      notes: DyP-decolorizing peroxidase (EC 1.11.1.19) participated in depolymerization
        of large lignin polymers.
    predicate_id: biolink:participates_in
  - subject: manganese_peroxidase
    predicate: oxidizes
    object: mn2_ion
    description: Manganese peroxidase oxidizes Mn2+ to Mn3+ (canonical MnP mechanism).
    evidence:
    - reference: DOI:10.3390/polym16172388
      notes: Manganese peroxidase oxidizes Mn2+ to Mn3+ (Pei et al. 2024).
    predicate_id: METPO:2007803
  - subject: mn3_oxidant
    predicate: acts as oxidant for
    object: lignin_depolymerization
    description: Mn3+ diffuses into lignin acting as a diffusible oxidant/mediator
      driving depolymerization.
    evidence:
    - reference: DOI:10.1039/d3cc05298b
      notes: Mn3+ oxidation product diffuses into lignin structure, acting as a diffusible
        oxidant or mediator (Bugg 2024).
  - subject: laccase
    predicate: uses
    object: small_molecule_mediators
    description: Laccases can utilise small-molecule mediators to extend oxidative
      reach.
    evidence:
    - reference: DOI:10.1039/d3cc05298b
      notes: Laccases or multi-copper oxidases can also utilise small molecule mediators
        (Bugg 2024).
  - subject: manganese_peroxidase
    predicate: cleaves
    object: beta_o4_bond
    description: MnP cleaves the beta-O-4 bond in phenolic and non-phenolic lignin
      model dimers.
    evidence:
    - reference: DOI:10.1186/s13068-024-02583-5
      notes: MnPs could cleave the beta-O-4 bond in phenolic and non-phenolic lignin
        model dimers (Zhou 2024).
  - subject: lignin_peroxidase
    predicate: cleaves
    object: ca_cb_bond
    description: Lignin peroxidase cleaves the Calpha-Cbeta bond of beta-O-4 model
      compounds.
    evidence:
    - reference: DOI:10.1186/s13068-023-02447-4
      notes: ALiP-P3 breaks the Calpha-Cbeta bond of the beta-O-4 model compound (Gu
        2024).
  - subject: oxidative_enzymes
    predicate: participates in
    object: lignin_depolymerization
    description: Oxidative lignin-modifying enzymes carry out lignin depolymerization.
    evidence:
    - reference: DOI:10.1186/s13068-024-02470-z
      snippet: LME including laccase (EC 1.10.3.2) participated in depolymerization
        of large lignin polymers
      notes: Verified against the free public article text.
    predicate_id: biolink:participates_in
  - subject: manganese_peroxidase
    predicate: example of
    object: oxidative_enzymes
    description: Manganese peroxidase is a lignin-modifying oxidative enzyme.
    evidence:
    - reference: DOI:10.3390/polym16172388
      snippet: Manganese peroxidase oxidizes Mn2+ to Mn3+
      notes: Verified against the free public article text.
    predicate_id: rdfs:subClassOf
  - subject: lignin_peroxidase
    predicate: example of
    object: oxidative_enzymes
    description: Lignin peroxidase is a lignin-modifying oxidative enzyme.
    evidence:
    - reference: DOI:10.1186/s13068-023-02447-4
      snippet: ALiP-P3 breaks the Calpha-Cbeta bond of the beta-O-4 model compound
      notes: Verified against the free public article text.
    predicate_id: rdfs:subClassOf
