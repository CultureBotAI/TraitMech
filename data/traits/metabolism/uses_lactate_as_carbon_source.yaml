  synonym_type: RELATED_SYNONYM
  source: traitmech
evidence:
- reference: DOI:10.1099/00207713-49-2-541
  snippet: lactate
  notes: Taxonomic descriptions of marine bacteria support lactate as a defining
    carbon source for lactate-utilising lineages.
- reference: PMID:14563071
  snippet: Desulfovibrio
  notes: 'Organism example: Desulfovibrio spp. grow on lactate as carbon source,
    oxidising it to acetate (Heidelberg et al. 2004, Nat Biotechnol, genome of
    D. vulgaris Hildenborough).'
