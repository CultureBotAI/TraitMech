identifier: traitmech:UCS_LACTATE
label: uses lactate as carbon source
definition: A metabolic trait in which an organism uses lactate as a sole or primary
  carbon source for growth, oxidising lactate to pyruvate via lactate dehydrogenase
  and feeding central catabolism for biosynthesis.
definition_source: DOI:10.1099/00207713-49-2-541
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
