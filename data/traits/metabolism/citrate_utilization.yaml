identifier: traitmech:000182
label: citrate utilization
definition: A metabolism in which a microorganism uses citrate as a sole carbon and
  energy source.
definition_source: DOI:10.1128/JB.183.18.5248-5256.2001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000060
evidence:
- reference: DOI:10.1128/JB.183.18.5248-5256.2001
  snippet: Klebsiella pneumoniae is able to grow anaerobically with citrate as a sole
    carbon and energy source by a fermentative pathway
  notes: Meyer et al. provide direct Klebsiella pneumoniae evidence for growth with
    citrate as sole carbon and energy source.
- reference: DOI:10.1186/1471-2180-9-168
  snippet: Not all, but nearly half of the K. pneumoniae clinical isolates carry the
    genes responsible for anaerobic growth on citrate.
  notes: Chen et al. found citrate-growth gene clusters in clinical K. pneumoniae
    isolates, supporting K. pneumoniae as a canonical citrate utilizer with strain-level
    variation.
- reference: https://asm.org/ASM/media/Protocol-Images/Citrate-Test-Protocol.pdf?ext=.pdf
  snippet: The citrate test screens a bacterial isolate for the ability to utilize
    citrate as its carbon and energy source
  notes: The ASM citrate-test protocol standardizes citrate utilization as the ability
    to use citrate for carbon and energy in a defined assay medium.
canonical_examples:
- taxon_id: NCBITaxon:573
  taxon_label: Klebsiella pneumoniae
  note: Chen et al. and Meyer et al. both studied citrate-positive K. pneumoniae strains.
  reference: DOI:10.1186/1471-2180-9-168
discussions:
- discussion_id: citrate-utilization-xref-gap
  prompt: Resolve an exact external ontology class for citrate utilization before
    adding a TraitRecord xref.
  kind: CURATION_TODO
  status: OPEN
  rationale: No exact GO or external metabolism class was resolved for the organism-level
    citrate-utilization phenotype; citrate metabolic process terms, citrate lyase
    or transporter molecular functions, carbon-source or energy-source predicates,
    and citrate assay terms are shifted relative to this precomposed microbial citrate-use
    class.
  posed_by: codex
