- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 1 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (1 to produces), issue 301 part 2. The previous predicates
    are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain is METPO:1000525
    (microbe), so a causal-graph subject entailed that the subject IS a microbe; CausalNodeTypeEnum
    has no organism member, so no such edge could ever satisfy the domain. Each replacement
    is a 1:1 mirror of its source predicate that changes only the domain, so the claim
    each edge makes is unchanged and directions are unchanged. The replacements are
    proposed in proposals/metpo_traitmech_v9 and are placeholder ids until METPO mints
    them.
  llm_assisted: true
- timestamp: '2026-08-06T08:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: 'Re-grounded causal edge(s) off enables/RO:0002327 onto encodes (biolink:encodes),
    issue 334. biolink declares enables range ''biological process or activity'',
    which only BIOLOGICAL_PROCESS, PATHWAY and MOLECULAR_FUNCTION satisfy, so an edge
    pointing at a GENE_OR_PROTEIN entailed a false type. The replacements are chosen
    per idiom rather than swept: a gene cluster ENCODES its product, a subunit is
    PART OF the complex it belongs to, and an energy source or acquired repertoire
    CONTRIBUTES TO the machine it powers or composes. All three declare no rdfs:domain
    or rdfs:range, so none can reintroduce the class of defect being removed.'
  llm_assisted: true
- timestamp: '2026-08-06T09:30:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: 'Correction to the REGROUND_CAUSAL_EDGE event above, issue 334 review.
    That event claimed "All three declare no rdfs:domain or rdfs:range, so none can
    reintroduce the class of defect being removed". For biolink:encodes that justification
    was vacuous: the term is ABSENT from the pinned biolink 4.4.0 model, so it trivially
    declares nothing, and the check used could not distinguish absent from unconstrained.
    reports/biolink_coverage.tsv already recorded it as the only applied biolink:
    CURIE with no backing slot. The grounding is retained because a gene CLUSTER to
    protein COMPLEX edge does not fit `has gene product`''s range of gene product
    mixin, so repointing would trade a missing term for a wrong range; mappings/predicate_grounding.tsv
    now states plainly that it is a local coinage. Tracked in issue 342. The edge
    itself is unchanged and is still an improvement on enables, whose declared range
    it genuinely violated.'
  llm_assisted: true
- timestamp: '2026-08-07T04:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Re-grounded the `encodes` edge(s) from biolink:encodes to METPO:2007813,
    issue 342. biolink:encodes is NOT a slot in the pinned biolink 4.4.0 model, so
    the CURIE resolved to nothing upstream while looking like an upstream term to
    anyone reading this record -- the disclaimer saying otherwise lived in mappings/predicate_grounding.tsv,
    which is not read at the point of use. RO:0002205 (has gene product) is the nearest
    real term but relates a GENE to a gene product, whereas these edges relate a gene
    cluster or operon to a protein complex or a biosynthetic process, which its range
    does not admit; that mismatch is why the coinage existed. METPO:2007813 is proposed
    in proposals/metpo_traitmech_v9 and is a placeholder id until METPO mints it,
    which puts it in the same state as the rest of that cohort rather than in a category
    of its own.
  llm_assisted: true
