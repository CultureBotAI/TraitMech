identifier: METPO:1000844
label: Methanogenesis
definition: A metabolism in which methane is produced as the primary end product through
  the reduction of carbon-containing compounds, formate, methanol, or acetate, exclusively
  performed by methanogenic archaea under strictly anaerobic conditions.
definition_source: DOI:10.1146/annurev-micro-011720-122807
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: Biological methanation
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: Biomethanation
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: Carbonate respiration
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1146/annurev-micro-011720-122807
  snippet: from CO2 and H2 to methane
  notes: Supports hydrogenotrophic methanogenesis as a methane-producing archaeal
    pathway.
- reference: DOI:10.1021/acs.biochem.9b00164
  snippet: catalyzes the reversible reduction of methyl-coenzyme M
  notes: Supports methyl-coenzyme M reductase as the terminal methane-forming enzyme.
canonical_examples:
- taxon_id: NCBITaxon:2190
