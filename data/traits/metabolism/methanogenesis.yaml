identifier: METPO:1000844
label: Methanogenesis
definition: A metabolism in which methane is produced as the primary end product through
  the reduction of carbon-containing compounds, formate, methanol, or acetate, exclusively
  performed by methanogenic archaea under strictly anaerobic conditions.
definition_source: DOI:10.1146/annurev-micro-011720-122807
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
