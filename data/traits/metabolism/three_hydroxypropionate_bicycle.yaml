identifier: traitmech:000023
label: 3-hydroxypropionate bicycle
definition: An autotrophic carbon-fixation pathway in which two molecules of
  bicarbonate are fixed via 3-hydroxypropionate and converted to glyoxylate and
  pyruvate. It is characteristic of the filamentous anoxygenic phototroph
  Chloroflexus aurantiacus.
definition_source: DOI:10.1128/AEM.02473-10
trait_category: METABOLISM
