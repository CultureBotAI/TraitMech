    description: Reducing equivalent generated by the light reactions.
    grounding: CHEBI:16474
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Transthylakoid proton motive force generated by linear electron transport.
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    description: Energy currency synthesized by ATP synthase driven by the pmf.
  edges:
  - subject: water
    predicate: oxidized to
    object: molecular_oxygen
    description: Water is the electron donor; its oxidation releases O2.
    evidence:
    - reference: DOI:10.1016/j.tim.2006.09.001
      notes: Bryant & Frigaard contrast oxygenic photosynthesis (water-splitting,
        O2-evolving) with anoxygenic phototrophy.
    predicate_id: METPO:2007405
  - subject: photosynthetic_etc
    predicate: confers
    object: oxygenic_photosynthesis_trait
    description: Two linked photosystems power electron flow from water to NADP+.
    evidence:
    - reference: DOI:10.1146/annurev-earth-060313-054810
      notes: Fischer et al. support water-oxidizing, O2-evolving photosynthesis as
        a cyanobacterial innovation.
    predicate_id: METPO:2007700
  - subject: photosystem_ii
    predicate: oxidizes
    object: water
    description: PSII is the primary catalyst of water oxidation in oxygenic photosynthesis.
    evidence:
    - reference: DOI:10.1007/s11120-022-00991-y
      notes: 'Shevela et al. 2023: PSII is the primary catalyst of water oxidation
        in oxygenic photosynthesis.'
    predicate_id: METPO:2007803
  - subject: photosystem_ii
    predicate: reduces
    object: plastoquinone_pool
    description: Electrons extracted from water reduce plastoquinone (PQ -> PQH2).
    evidence:
    - reference: DOI:10.1007/s11120-022-00991-y
      notes: 'Shevela et al. 2023: water oxidation extracts electrons that reduce
        plastoquinone (PQ -> PQH2).'
    predicate_id: METPO:2007802
  - subject: plastoquinone_pool
    predicate: donates electrons to
    object: cytochrome_b6f
    description: Plastoquinol diffuses to reduce the cytochrome b6f complex.
    evidence:
    - reference: DOI:10.3390/plants13152103
      notes: 'Milrad et al. 2024: PQH2 diffuses to reduce the cytochrome b6f complex.'
    predicate_id: METPO:2007403
  - subject: cytochrome_b6f
    predicate: transfers electrons to
    object: photosystem_i
    description: Cyt b6f transfers electrons to PSI via soluble carriers (plastocyanin
      or cytochrome c6).
    evidence:
    - reference: DOI:10.3390/plants13152103
      notes: 'Milrad et al. 2024: electrons transferred from Cytb6f to PSI via plastocyanin
        or cytochrome c6.'
    predicate_id: METPO:2007403
  - subject: photosystem_i
    predicate: reduces
    object: ferredoxin
    description: PSI oxidizes plastocyanin and reduces ferredoxin.
    evidence:
    - reference: DOI:10.1111/1751-7915.14519
      notes: 'Grettenberger et al. 2024: PSI oxidizes plastocyanin and reduces ferredoxin.'
    predicate_id: METPO:2007802
  - subject: fnr
    predicate: reduces
    object: nadph
    description: Ferredoxin-NADP+ reductase reduces NADP+ to NADPH using ferredoxin
      electrons.
    evidence:
    - reference: DOI:10.1111/1751-7915.14519
      notes: 'Grettenberger et al. 2024: electrons via ferredoxin and FNR reduce NADP+
        to NADPH.'
    predicate_id: METPO:2007802
  - subject: photosynthetic_etc
    predicate: generates
    object: proton_motive_force
    description: Linear electron transport generates the transthylakoid proton motive
