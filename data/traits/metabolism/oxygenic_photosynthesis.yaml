    evidence:
    - reference: DOI:10.3390/plants13152103
      notes: 'Milrad et al. 2024: membrane proton motive force produced by these transfers
        comprises dpH and dPsi.'
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: drives
    object: atp
    description: The proton motive force drives ATP synthesis by ATP synthase.
    evidence:
    - reference: DOI:10.1007/s11120-022-00991-y
      notes: 'Shevela et al. 2023: raised proton motive force drives ATP synthesis
        by ATP synthase.'
