    description: Mobile quinone electron carrier reduced by PSII (PQ -> PQH2).
  - node_id: cytochrome_b6f
    label: cytochrome b6f complex
    node_type: GENE_OR_PROTEIN
    description: Electron transfer complex linking PSII/plastoquinol to PSI.
    grounding: GO:0009512
  - node_id: photosystem_i
    label: photosystem I
    node_type: GENE_OR_PROTEIN
    description: Pigment-protein complex that oxidizes plastocyanin/cyt c6 and reduces
