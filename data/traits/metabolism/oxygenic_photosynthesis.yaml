- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 4 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (1 to oxidizes, 3 to reduces), issue 301 part 2. The
    previous predicates are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain
    is METPO:1000525 (microbe), so a causal-graph subject entailed that the subject
    IS a microbe; CausalNodeTypeEnum has no organism member, so no such edge could
    ever satisfy the domain. Each replacement is a 1:1 mirror of its source predicate
    that changes only the domain, so the claim each edge makes is unchanged and directions
    are unchanged. The replacements are proposed in proposals/metpo_traitmech_v9 and
    are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-15T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Normalised causal-node type(s) so one node_id means one thing corpus-wide
    (issue 356): proton_motive_force: CHEMICAL -> STATE. The schema''s OWN example
    of STATE: ''a bioenergetic or molecular state of the cell (e.g. proton motive
    force ...) ... the state is the gradient / steady-value, not its establishment''.
    All 35 occurrences describe the gradient -- every description across all four
    types reads ''electrochemical proton gradient'', including the 13 typed BIOLOGICAL_PROCESS
    (''Transmembrane electrochemical gradient generated by respiration''), which name
    the gradient and its provenance rather than the generating process. Nothing here
    means the establishment, so this is a retype and not a rename; records that DO
    mean the process already use a separate id (proton_motive_force_generation in
    ph_delta.yaml). Also settles the one edge #356 was filed for: phototrophic.yaml''s
    CAPACITY typing was blocking `powers` (METPO:2007900), which is gated to BIOLOGICAL_PROCESS|STATE.'
  llm_assisted: true
- timestamp: '2026-08-19T00:00:00+00:00'
  curator: add_faprotax_synonyms
  action: ADDED_SYNONYM
  changes: Added 'oxygenic_photoautotrophy' (5221 occurrences in microbedecoder's
    unmapped labels) as a RELATED_SYNONYM (#453). FAPROTAX's oxygenic_photoautotrophy
