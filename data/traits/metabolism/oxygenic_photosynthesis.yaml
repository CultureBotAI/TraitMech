identifier: traitmech:000034
label: oxygenic photosynthesis
definition: A phototrophic metabolism that uses light energy to fix CO2, oxidizing
  water as the electron donor and releasing molecular oxygen. It uses two linked photosystems
  and chlorophyll, and is characteristic of cyanobacteria (and plant chloroplasts).
definition_source: DOI:10.1016/j.tim.2006.09.001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000038
synonyms:
- synonym_text: oxygenic_photoautotrophy
  synonym_type: RELATED_SYNONYM
  source: FAPROTAX (via microbedecoder unmapped labels)
evidence:
- reference: DOI:10.1016/j.tim.2006.09.001
  notes: Bryant & Frigaard, "Prokaryotic photosynthesis and phototrophy illuminated",
    contrasts oxygenic photosynthesis (water-splitting, O2-evolving) in cyanobacteria
    with anoxygenic phototrophy.
- reference: DOI:10.1146/annurev-earth-060313-054810
  notes: Fischer et al., "Evolution of Oxygenic Photosynthesis", supports water-oxidizing,
    oxygen-evolving photosynthesis as a distinct, cyanobacterial innovation.
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: Default model unicellular cyanobacterium for oxygenic photosynthesis; first
    phototroph genome-sequenced.
  reference: PMID:16228363
causal_graphs:
- graph_id: oxygenic_photosynthesis_water_splitting
  title: Oxygenic photosynthesis splits water and releases O2
  description: Evidence-backed causal sketch linking two linked photosystems and water
    oxidation to CO2 fixation and oxygen evolution.
  nodes:
  - node_id: oxygenic_photosynthesis_trait
    label: oxygenic photosynthesis
    node_type: TRAIT
    grounding: traitmech:000034
    description: Light-driven CO2 fixation that oxidizes water and evolves O2.
  - node_id: water
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
    description: Electron donor for oxygenic photosynthesis.
  - node_id: molecular_oxygen
    label: molecular oxygen
    node_type: CHEMICAL
