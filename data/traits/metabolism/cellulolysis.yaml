- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 6 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (2 to degrades, 1 to hydrolyzes, 3 to produces), issue
    301 part 2. The previous predicates are transitively rdfs:subPropertyOf METPO:2000001,
    whose rdfs:domain is METPO:1000525 (microbe), so a causal-graph subject entailed
    that the subject IS a microbe; CausalNodeTypeEnum has no organism member, so no
    such edge could ever satisfy the domain. Each replacement is a 1:1 mirror of its
    source predicate that changes only the domain, so the claim each edge makes is
    unchanged and directions are unchanged. The replacements are proposed in proposals/metpo_traitmech_v9
    and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-06T05:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Re-grounded the cellulose is-hydrolyzed-to cellobiose edge from METPO:2000013
    to RO:0001001 (derives into), issue 327. METPO:2000013 reads agent-to-substrate,
    so grounding a substrate-to-product edge to it asserted that cellulose hydrolyses
    cellobiose; it also inherits rdfs:domain METPO:1000525 (microbe) via METPO:2000001,
    which no causal node type can satisfy (issue 301). RO:0001001 holds between an
    old and a new material entity where the new inherits the significant portion of
    the old's matter, which is exactly what depolymerisation does, and it declares
    no domain. The label is kept because it names the mechanism, which the general
    relation does not. This was the last of the 366 edges in issue 301.
  llm_assisted: true
