identifier: traitmech:000111
label: cellulolysis
definition: A biopolymer-degradation metabolism in which an organism hydrolyzes cellulose
  to cellodextrins and glucose using cellulase systems, sometimes organized into cellulosomes.
definition_source: DOI:10.1128/MMBR.66.3.506-577.2002
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000110
synonyms:
- synonym_text: cellulolytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.66.3.506-577.2002
- synonym_text: cellulose degradation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.66.3.506-577.2002
evidence:
- reference: DOI:10.1128/MMBR.66.3.506-577.2002
  notes: Lynd et al. review microbial cellulose utilization, its enzymology, and cellulosome
    systems.
- reference: DOI:10.1016/j.cbpa.2015.10.018
  notes: Cragg et al. place cellulose deconstruction within lignocellulose degradation
    across diverse organisms.
canonical_examples:
- taxon_id: NCBITaxon:1515
  taxon_label: Acetivibrio thermocellus
  note: Thermophilic anaerobe secreting the paradigm cellulosome (formerly Clostridium
    thermocellum). Ruminococcus is the mesophilic rumen model.
  reference: DOI:10.1016/S0022-2836(02)00497-7
causal_graphs:
- graph_id: cellulolysis_cellulase_systems
  title: Cellulolysis hydrolyzes cellulose to glucose
  description: Evidence-backed causal sketch linking cellulase systems (cellulosomes
    / free enzymes) to cellulose hydrolysis into cellodextrins and glucose.
  scope_status: MECHANISTIC
  scope_notes: The graph combines free cellulases and cellulosome organization. The
    A. thermocellus CelS example supports the cellobiohydrolase and cellulosome branch,
    not every cellulase or regulatory component in the graph.
  nodes:
  - node_id: cellulolysis_trait
    label: cellulolysis
    node_type: TRAIT
    grounding: traitmech:000111
    description: Hydrolysis of cellulose to assimilable sugars.
  - node_id: cellulase
    label: cellulase systems
    node_type: GENE_OR_PROTEIN
    description: Endoglucanases, exoglucanases, and beta-glucosidases (sometimes cellulosomal).
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This system-level node combines multiple catalytic families and
      free-enzyme versus cellulosomal architectures, so no single protein-family term
      denotes it.
  - node_id: glucose
    label: glucose
    node_type: CHEMICAL
    description: Monomeric assimilable sugar released from cellulose.
    grounding: CHEBI:17234
  - node_id: cellulose
    label: cellulose
    node_type: CHEMICAL
    description: Beta-1,4-linked glucose polymer substrate.
    grounding: CHEBI:18246
  - node_id: endoglucanase
    label: endoglucanase
    node_type: GENE_OR_PROTEIN
    description: Cellulase that cleaves internal bonds of cellulose chains.
    grounding: GO:0008810
  - node_id: cellobiohydrolase
    label: cellobiohydrolase / exoglucanase
    node_type: GENE_OR_PROTEIN
    description: Cellulase that processively releases cellobiose from chain ends.
    grounding: GO:0102252
    protein_examples:
    - uniprot_id: UniProtKB:P0C2S5
      protein_label: Cellulose 1,4-beta-cellobiosidase (reducing end) CelS
      gene_symbol: celS
      taxon_id: NCBITaxon:1515
      taxon_label: Acetivibrio thermocellus
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 80
      sequence_version: 1
      role: Catalytic CelS component of the A. thermocellus cellulosome; this accession
        denotes the cellobiohydrolase component, not the complete cellulosome.
      evidence:
      - reference: DOI:10.1016/S0022-2836(02)00497-7
        snippet: Cellobiohydrolase CelS plays an important role in the cellulosome
        notes: The primary structural and catalytic study identifies CelS as the major
          enzymatic component of the A. thermocellus cellulosome. UniProtKB P0C2S5
          is the reviewed CelS entry from that species.
  - node_id: beta_glucosidase
    label: beta-glucosidase
    node_type: GENE_OR_PROTEIN
    description: Enzyme hydrolyzing cellobiose to glucose.
    grounding: GO:0008422
  - node_id: cellobiose
    label: cellobiose
    node_type: CHEMICAL
    description: Glucose disaccharide intermediate of cellulose hydrolysis.
    grounding: CHEBI:17057
  - node_id: cellulosome
    label: cellulosome
    node_type: GENE_OR_PROTEIN
    description: Multienzyme complex built on scaffoldins for cellulose degradation.
    grounding: GO:0043263
  - node_id: scaffoldin
    label: scaffoldin
    node_type: GENE_OR_PROTEIN
    description: Non-catalytic backbone protein of the cellulosome.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Scaffoldins are modular proteins with varying cohesin, carbohydrate-binding,
      dockerin, and anchoring architectures; verified terms describe their modules
      rather than the complete scaffoldin class.
  - node_id: cohesin_domain
    label: cohesin domain
    node_type: GENE_OR_PROTEIN
    description: Scaffoldin module that binds dockerin domains.
    grounding: InterPro:IPR002102
  - node_id: dockerin_domain
    label: dockerin domain
    node_type: GENE_OR_PROTEIN
    description: Enzyme-borne module that binds scaffoldin cohesin domains.
    grounding: InterPro:IPR002105
  - node_id: ccr
    label: carbon catabolite repression
    node_type: BIOLOGICAL_PROCESS
    description: Glucose-signal-driven repression of catabolic gene transcription.
  edges:
  - subject: cellulase
    predicate: confers
    object: cellulolysis_trait
    description: Cellulase systems hydrolyze cellulose extracellularly.
    evidence:
    - reference: DOI:10.1128/MMBR.66.3.506-577.2002
      notes: Lynd et al. review microbial cellulose utilization and the cellulase
        systems involved.
    predicate_id: METPO:2007700
  - subject: cellulolysis_trait
    predicate: produces
    object: glucose
    description: Cellulose hydrolysis yields cellodextrins and glucose.
    evidence:
    - reference: DOI:10.1016/j.cbpa.2015.10.018
      notes: Cragg et al. place cellulose deconstruction within lignocellulose degradation.
    predicate_id: METPO:2007800
  - subject: endoglucanase
    predicate: degrades
    object: cellulose
    description: Endoglucanase participates in concerted hydrolysis of cellulose.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      notes: Complete degradation of cellulose to glucose requires concerted action
        of cellobiohydrolases, endoglucanases and beta-glucosidases.
    predicate_id: METPO:2007809
  - subject: cellobiohydrolase
    predicate: degrades
    object: cellulose
    description: Cellobiohydrolase/exoglucanase participates in concerted hydrolysis
      of cellulose.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      notes: Complete degradation of cellulose to glucose requires concerted action
        of cellobiohydrolases, endoglucanases and beta-glucosidases.
    predicate_id: METPO:2007809
  - subject: beta_glucosidase
    predicate: hydrolyzes
    object: cellobiose
    description: Beta-glucosidase hydrolyzes cellobiose in the downstream saccharification
      step.
    evidence:
    - reference: DOI:10.1186/s13568-023-01658-0
      notes: Beta-glucosidase activity converting cellobiose into glucose.
    predicate_id: METPO:2007808
  - subject: beta_glucosidase
    predicate: produces
    object: glucose
    description: Beta-glucosidase releases glucose from cellobiose.
    evidence:
    - reference: DOI:10.1186/s13568-023-01658-0
      notes: Beta-glucosidase activity converting cellobiose into glucose; product
        edge directly stated.
    predicate_id: METPO:2007800
  - subject: cellulosome
    predicate: has backbone component
    object: scaffoldin
    description: Cellulosomes are multienzyme complexes built on scaffoldins.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      notes: They are multienzyme complexes built on scaffoldins.
  - subject: scaffoldin
    predicate: contains
    object: cohesin_domain
    description: Scaffoldins bear cohesin modules.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1288286
      notes: Scaffoldins are the non-catalytic backbone and bear modules called cohesin.
  - subject: dockerin_domain
    predicate: binds to
    object: cohesin_domain
    description: Dockerin-cohesin interaction assembles enzymes onto the scaffoldin.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      notes: Dockerin modules interacting with scaffoldin cohesin modules; canonical
        assembly interaction.
  - subject: ccr
    predicate: represses production of
    object: cellulase
    description: Carbon catabolite repression lowers production of the cellulase machinery
      when glucose signals are high.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: transcription of lignocellulose-catabolic genes
      notes: CcpA recognition of CRE sites represses transcription of the genes encoding
        lignocellulose-catabolic proteins; the genes are metadata rather than graph
        nodes.
  - subject: cellulose
    predicate: is hydrolyzed to
    object: cellobiose
    description: Cellulose depolymerization yields cellobiose as the principal soluble
      disaccharide product, completing the substrate-to-product cascade.
    evidence:
    - reference: DOI:10.1111/j.1742-4658.2010.07585.x
      snippet: cleave off cellobiose
      notes: Substrate-product step of the catalytic cascade; cellobiose is the dominant
        but not the only soluble product (cellodextrins of higher DP also occur).
    predicate_id: RO:0001001
  - subject: cellobiohydrolase
    predicate: produces
    object: cellobiose
    description: Cellobiohydrolase processively releases cellobiose from cellulose
      chain ends.
    evidence:
    - reference: DOI:10.1128/aem.01742-24
      snippet: GH48, GH6 with CBM2 domains … release glucose and cellobiose from chain
        ends
      notes: Enzyme-product edge that links the chain-end-acting cellulases to the
        downstream beta-glucosidase step. Exact product ratio is enzyme-dependent.
    predicate_id: METPO:2007800
  - subject: endoglucanase
    predicate: part of
    object: cellulase
    description: Endoglucanase is a component activity of the concerted cellulase
      system.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: Complete degradation of cellulose to glucose requires concerted action
        of cellobiohydrolases, endoglucanases and beta-glucosidases.
      notes: Establishes the three component activities as members of one cellulase
        system rather than independent actors.
    predicate_id: biolink:part_of
  - subject: cellobiohydrolase
    predicate: part of
    object: cellulase
    description: Cellobiohydrolase/exoglucanase is a component activity of the concerted
      cellulase system.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: Complete degradation of cellulose to glucose requires concerted action
        of cellobiohydrolases, endoglucanases and beta-glucosidases.
      notes: Establishes the three component activities as members of one cellulase
        system rather than independent actors.
    predicate_id: biolink:part_of
  - subject: beta_glucosidase
    predicate: part of
    object: cellulase
    description: Beta-glucosidase is a component activity of the concerted cellulase
      system.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: Complete degradation of cellulose to glucose requires concerted action
        of cellobiohydrolases, endoglucanases and beta-glucosidases.
      notes: Establishes the three component activities as members of one cellulase
        system rather than independent actors.
    predicate_id: biolink:part_of
  - subject: cellulosome
    predicate: confers
    object: cellulolysis_trait
    description: Cellulosomes are one of the alternative cellulase-system architectures
      that confer cellulolysis; they are taxonomically restricted, not universal.
    evidence:
    - reference: DOI:10.1128/MMBR.66.3.506-577.2002
      snippet: complexed cellulase systems
      notes: Lynd et al. distinguish noncomplexed (free-enzyme) from complexed (cellulosomal)
        systems as alternative implementations of cellulose utilization. Cellulosomes
        occur only in restricted lineages; this edge must not be read as a requirement.
    predicate_id: METPO:2007700
