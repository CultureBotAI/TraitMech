identifier: traitmech:000022
label: Wood-Ljungdahl pathway
definition: An autotrophic carbon-fixation pathway (the reductive acetyl-CoA
  pathway) in which two molecules of CO2 are reduced and combined into acetyl-CoA.
  It is energetically efficient and used by acetogenic bacteria, methanogenic
  archaea, and some sulfate-reducing bacteria.
definition_source: DOI:10.1016/j.bbapap.2008.08.012
