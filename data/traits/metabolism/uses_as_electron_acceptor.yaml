  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.61.080706.093130
  snippet: terminal electron acceptor
  notes: Microbial-physiology review supports the "electron acceptor" relation
    as the standard descriptor for the terminal-acceptor pole of respiration;
    composed at assertion time with the specific acceptor chemical (O2,
    nitrate, sulfate, Fe(III), CO2, etc.).
