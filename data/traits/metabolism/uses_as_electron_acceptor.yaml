identifier: METPO:2000008
label: uses as electron acceptor
definition: An OBJECT_PROPERTY relating an organism to a chemical entity (e.g. a
  CHEBI class) that the organism uses as the terminal electron acceptor in
  respiration. The intended use is predicate + class composition at assertion
  time, e.g. `<organism> METPO:2000008 CHEBI:17632` ("organism uses nitrate as
  electron acceptor").
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
trait_category: METABOLISM
term_kind: OBJECT_PROPERTY
mapping_status: REVIEWED
