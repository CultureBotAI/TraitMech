identifier: traitmech:UCS_ACETATE
label: uses acetate as carbon source
definition: A metabolic trait in which an organism uses acetate as a sole or primary
  carbon source for growth, activating extracellular acetate via acetyl-CoA synthetase
  or acetate kinase/phosphotransacetylase, feeding the glyoxylate cycle or
  gluconeogenesis to supply central biosynthetic precursors.
definition_source: DOI:10.1146/annurev-micro-091014-104420
