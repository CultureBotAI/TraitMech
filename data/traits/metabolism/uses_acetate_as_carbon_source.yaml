- reference: PMID:9278503
  snippet: Escherichia coli K-12
  notes: 'Organism example: Escherichia coli K-12 (MG1655) grows on acetate as
    sole carbon source using AceA/AceB glyoxylate-bypass enzymes (Blattner et
    al. 1997, Science, complete genome).'
