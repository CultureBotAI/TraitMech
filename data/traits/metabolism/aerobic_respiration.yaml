evidence:
- reference: DOI:10.1146/annurev.biophys.27.1.329
  snippet: terminal enzyme of respiratory chains
  notes: Review supports cytochrome c oxidase reducing molecular oxygen to water in
    aerobic respiratory chains.
- reference: DOI:10.1016/j.bbabio.2008.09.008
  snippet: membrane-bound electron transport chain
  notes: Review supports proton-gradient energy conservation by prokaryotic respiratory
    chains.
