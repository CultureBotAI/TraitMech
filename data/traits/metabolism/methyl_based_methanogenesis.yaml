identifier: traitmech:000192
label: methyl-based methanogenesis
definition: A methanogenesis in which methylated compounds donate methyl groups that
  are transferred to coenzyme M and reduced to methane.
definition_source: DOI:10.1128/mmbr.00024-22
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000844
synonyms:
- synonym_text: methylotrophic methanogenesis
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2017.01198
- synonym_text: methanogenesis using methylated compounds
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2017.01198
evidence:
- reference: DOI:10.1128/mmbr.00024-22
  snippet: Methyl-based methanogenesis is one of three broad categories of archaeal
    anaerobic methanogenesis, including both the methyl dismutation (methylotrophic)
    pathway and the methyl-reducing (also known as hydrogen-dependent methylotrophic)
    pathway
  notes: Bueno de Mesquita et al. define methyl-based methanogenesis as the methanogenesis
    branch covering methyl dismutation and hydrogen-dependent methyl-reducing pathways.
- reference: DOI:10.3389/fmicb.2017.01198
  snippet: acetoclastic methanogenesis using acetate, and methylotrophic methanogenesis
    using methylated compounds, such as methanol, methylamines
  notes: Evans et al. describe methylotrophic methanogenesis as the methylated-compound-using
    branch among major methanogenic carbon-source pathways.
discussions:
