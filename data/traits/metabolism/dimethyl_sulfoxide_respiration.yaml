identifier: traitmech:000201
label: dimethyl sulfoxide respiration
definition: An anaerobic respiration in which an organism uses dimethyl sulfoxide
  as the terminal electron acceptor for energy conservation.
definition_source: DOI:10.1073/pnas.0505959103
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: DMSO respiration
  synonym_type: EXACT_SYNONYM
evidence:
- reference: DOI:10.1073/pnas.0505959103
  snippet: one (SO1427-SO1432) is required for anaerobic respiration of DMSO
  notes: Gralnick et al. identify the SO1427-SO1432 gene cluster required for Shewanella
    oneidensis MR-1 anaerobic respiration of dimethyl sulfoxide.
- reference: DOI:10.1073/pnas.0505959103
  snippet: DMSO respiration is an extracellular respiratory process
  notes: Gralnick et al. support DMSO respiration as a bona fide respiratory process
    rather than an isolated reductase assay.
- reference: DOI:10.1111/1462-2920.15971
  snippet: M. thermoacetica can also use dimethyl sulfoxide as terminal electron acceptor
  notes: Rosenbaum et al. support organism-level use of dimethyl sulfoxide as an anaerobic
    terminal electron acceptor.
- reference: DOI:10.1111/1462-2920.15971
  snippet: Membranes showed a DMSO reductase activity
  notes: Rosenbaum et al. biochemically support an induced DMSO reductase activity
    in Moorella thermoacetica membranes.
canonical_examples:
- taxon_id: NCBITaxon:211586
  taxon_label: Shewanella oneidensis MR-1
  note: Gralnick et al. showed that the SO1427-SO1432 gene cluster is required for
    anaerobic DMSO respiration in Shewanella oneidensis MR-1.
  reference: DOI:10.1073/pnas.0505959103
