identifier: METPO:1000804
label: Substrate-level phosphorylation
definition: A metabolism in which ATP is formed directly by transfer of a phosphoryl
  group from a substrate to ADP.
definition_source: DOI:10.1111/1751-7915.13746
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
evidence:
- reference: DOI:10.1111/1751-7915.13746
  snippet: Substrate-level phosphorylation is one of the main sources
  notes: Review supports SLP as microbial energy conservation in fermentative metabolism.
- reference: DOI:10.1128/MMBR.69.1.12-50.2005
  snippet: phosphotransacetylase [PTA], acetate kinase [ACK]
  notes: Review supports acetate kinase and phosphotransacetylase as central acetate-switch
    enzymes.
canonical_examples:
- taxon_id: NCBITaxon:1314
  taxon_label: Streptococcus pyogenes
  note: ATP via glycolytic substrate-level phosphorylation
  reference: PMID:27442496
- taxon_id: NCBITaxon:1488
  taxon_label: Clostridium acetobutylicum
  note: fermentative substrate-level phosphorylation
  reference: PMID:11466286
