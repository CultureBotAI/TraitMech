identifier: traitmech:UCS_GLUCOSE
label: uses glucose as carbon source
definition: A metabolic trait in which an organism uses glucose as a sole or primary
  carbon source for growth, taking up glucose via dedicated transporters and feeding
  it through glycolysis into central catabolism.
definition_source: DOI:10.1128/JB.183.16.4641-4654.2001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
