evidence:
- reference: DOI:10.1128/JB.183.16.4641-4654.2001
  snippet: glucose as the sole carbon source
  notes: Salmonella enterica grown on glucose as sole carbon source supports
    glucose as a defining heterotrophic substrate.
- reference: PMID:9278503
  snippet: Escherichia coli K-12
  notes: 'Organism example: Escherichia coli K-12 (MG1655) grows on glucose as
    sole carbon source via the PTS-glycolysis pathway (Blattner et al. 1997,
    Science, complete genome).'
