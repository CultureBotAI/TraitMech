identifier: traitmech:000106
label: sulfur oxidation
definition: A metabolism in which an organism oxidizes reduced inorganic sulfur compounds
  (sulfide, elemental sulfur, thiosulfate) to sulfate, conserving energy and often
  supporting chemolithotrophic growth.
definition_source: DOI:10.1111/j.1574-6976.2009.00187.x
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: sulfide oxidation
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1111/j.1574-6976.2009.00187.x
evidence:
- reference: DOI:10.1111/j.1574-6976.2009.00187.x
  notes: Ghosh & Dam review the biochemistry and molecular biology of lithotrophic
    sulfur oxidation across bacteria and archaea.
- reference: DOI:10.1128/AEM.67.7.2873-2882.2001
  notes: Friedrich et al. describe a common mechanism for bacterial oxidation of reduced
    inorganic sulfur compounds (the Sox system).
canonical_examples:
- taxon_id: NCBITaxon:36861
  taxon_label: Thiobacillus denitrificans
  note: Obligately chemolithoautotrophic sulfur-compound oxidizer with a sequenced
    genome anchoring sulfur-oxidation pathways. Beggiatoa is a historic morphological
    exemplar.
  reference: DOI:10.1128/JB.00568-06
- taxon_id: NCBITaxon:292415
  taxon_label: Thiobacillus denitrificans ATCC 25259
  note: Reference strain used for whole-genome transcriptional analysis of sulfur
    oxidation under aerobic and denitrifying conditions.
  reference: DOI:10.1128/JB.00568-06
causal_graphs:
- graph_id: sulfur_oxidation_sox
  title: Lithotrophic sulfur oxidation to sulfate
  description: Evidence-backed causal sketch linking sulfur-oxidizing enzyme systems
    to oxidation of reduced sulfur compounds to sulfate.
  scope_status: MECHANISTIC
  scope_notes: This is a cross-taxon composite of Sox, SQR/PDO, and S4-intermediate
    sulfur-oxidation routes. The T. denitrificans SQR example supports its denitrifying
    branch; PDO, TsdA, and TetH branches are not asserted as universal or co-required.
  nodes:
  - node_id: sulfur_oxidation_trait
    label: sulfur oxidation
    node_type: TRAIT
    grounding: traitmech:000106
    description: Capacity to oxidize reduced inorganic sulfur to sulfate.
  - node_id: sox_system
    label: Sox enzyme system
    node_type: GENE_OR_PROTEIN
    description: Sulfur-oxidizing multienzyme system.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The Sox system comprises multiple non-equivalent protein components;
      no single GO or InterPro term denotes the complete generic system represented
      here.
  - node_id: hydrogen_sulfide
    label: hydrogen sulfide
    node_type: CHEMICAL
    grounding: CHEBI:16136
    description: Reduced inorganic sulfur substrate.
  - node_id: sulfate
    label: sulfate
    node_type: CHEMICAL
    grounding: CHEBI:16189
    description: Oxidized sulfur end product.
  - node_id: sqr_enzyme
    label: sulfide:quinone oxidoreductase (SQR)
    node_type: GENE_OR_PROTEIN
    description: Membrane flavoprotein oxidizing sulfide to sulfane sulfur/polysulfide.
    grounding: GO:0070224
    protein_examples:
    - uniprot_id: UniProtKB:Q3SJ10
      protein_label: Sulfide:quinone oxidoreductase
      gene_symbol: Tbd_1407
      taxon_id: NCBITaxon:292415
      taxon_label: Thiobacillus denitrificans ATCC 25259
      entry_status: UNREVIEWED
      proteome_id: UP000008291
      retrieved_on: '2026-08-24'
      entry_version: 92
      sequence_version: 1
      role: SQR encoded by Tbd_1407 and strongly induced during denitrifying sulfur
        metabolism in T. denitrificans ATCC 25259.
      evidence:
      - reference: DOI:10.1128/JB.00568-06
        snippet: two copies of sulfide:quinone oxidoreductase
        notes: Whole-genome transcriptional analysis found Tbd_1407 strongly upregulated
          under denitrifying conditions and associated it with sulfur-compound oxidation;
          UniProtKB Q3SJ10 is the exact reference-proteome locus.
  - node_id: sulfane_sulfur
    label: sulfane sulfur
    node_type: CHEMICAL
    description: Sulfane sulfur / S0 / polysulfide intermediate.
  - node_id: pdo_enzyme
    label: persulfide dioxygenase (PDO)
    node_type: GENE_OR_PROTEIN
    description: Oxidizes glutathione persulfide to sulfite using O2.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The graph does not resolve a taxon-specific PDO family, fusion
      architecture, or glutathione dependence needed for an exact semantic grounding.
  - node_id: glutathione_persulfide
    label: glutathione persulfide (GSSH)
    node_type: CHEMICAL
    description: Persulfide substrate of persulfide dioxygenase.
  - node_id: sulfite
    label: sulfite
    node_type: CHEMICAL
    grounding: CHEBI:16526
    description: Sulfite intermediate in sulfur oxidation.
  - node_id: thiosulfate
    label: thiosulfate
    node_type: CHEMICAL
    grounding: CHEBI:30087
    description: Thiosulfate intermediate substrate of the Sox system.
  - node_id: tsda_enzyme
    label: thiosulfate dehydrogenase (TsdA)
    node_type: GENE_OR_PROTEIN
    description: Oxidizes thiosulfate to tetrathionate.
    grounding: GO:0050338
  - node_id: tetrathionate
    label: tetrathionate
    node_type: CHEMICAL
    grounding: CHEBI:30926
    description: Tetrathionate intermediate in the S4 intermediate pathway.
  - node_id: teth_enzyme
    label: tetrathionate hydrolase (TetH)
    node_type: GENE_OR_PROTEIN
    description: Hydrolyzes/disproportionates tetrathionate to S0, thiosulfate and
      sulfate.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: TetH proteins are taxon- and acidophile-specific members of broader
      hydrolase families; no exact verified GO or InterPro term was assigned to this
      generic pathway label.
  edges:
  - subject: sox_system
    predicate: confers
    object: sulfur_oxidation_trait
    description: The Sox system enables lithotrophic sulfur oxidation.
    evidence:
    - reference: DOI:10.1128/AEM.67.7.2873-2882.2001
      notes: Friedrich et al. describe the Sox system as a common sulfur-oxidation
        mechanism.
    predicate_id: METPO:2007700
  - subject: sulfur_oxidation_trait
    predicate: oxidizes
    object: hydrogen_sulfide
    description: Sulfur oxidizers oxidize reduced sulfur compounds such as sulfide.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2009.00187.x
      notes: Ghosh & Dam review lithotrophic oxidation of reduced inorganic sulfur.
    predicate_id: METPO:2007803
  - subject: sulfur_oxidation_trait
    predicate: produces
    object: sulfate
    description: Complete sulfur oxidation produces sulfate.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2009.00187.x
      notes: Supports sulfate as the oxidized end product.
    predicate_id: METPO:2007800
  - subject: sqr_enzyme
    predicate: oxidizes
    object: hydrogen_sulfide
    description: SQR oxidizes sulfide to sulfane sulfur (S0/polysulfide).
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: SQR oxidizing sulfide to sulfane sulfur (S0/polysulfide).
    predicate_id: METPO:2007803
  - subject: sqr_enzyme
    predicate: produces
    object: sulfane_sulfur
    description: SQR produces sulfane sulfur/polysulfide from sulfide.
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: SQR oxidizing sulfide to sulfane sulfur (S0/polysulfide).
    predicate_id: METPO:2007800
  - subject: pdo_enzyme
    predicate: oxidizes
    object: glutathione_persulfide
    description: PDO oxidizes glutathione persulfide (GSSH).
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: PDO oxidizes glutathione persulfide (GSSH); O2-dependent.
    predicate_id: METPO:2007803
  - subject: pdo_enzyme
    predicate: produces
    object: sulfite
    description: Persulfide dioxygenase produces sulfite (GSSH + O2 + H2O -> GSH +
      SO3(2-)).
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: GSSH + O2 + H2O -> GSH + SO3(2-) + 2H+; oxygen-dependent.
    predicate_id: METPO:2007800
  - subject: sulfite
    predicate: reacts to form
    object: thiosulfate
    description: Sulfite reacts with sulfane sulfur to form thiosulfate (non-enzymatic).
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: The generated sulfite can react with sulfane sulfur to form thiosulfate.
  - subject: sox_system
    predicate: oxidizes
    object: thiosulfate
    description: Thiosulfate is oxidized to sulfate via the Sox system.
    evidence:
    - reference: DOI:10.3390/ijms252010962
      notes: Thiosulfate is then oxidized to sulfate via the Sox-system.
    predicate_id: METPO:2007803
  - subject: tsda_enzyme
    predicate: oxidizes
    object: thiosulfate
    description: TsdA oxidizes thiosulfate to tetrathionate (S2O32- to S4O62-).
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1426584
      notes: tsdA (S2O32- to S4O62-).
    predicate_id: METPO:2007803
  - subject: tsda_enzyme
    predicate: produces
    object: tetrathionate
    description: TsdA produces tetrathionate from thiosulfate.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1426584
      notes: tsdA (S2O32- to S4O62-).
    predicate_id: METPO:2007800
  - subject: teth_enzyme
    predicate: oxidizes
    object: tetrathionate
    description: TetH disproportionates/hydrolyzes tetrathionate to S0, thiosulfate
      and sulfate.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1426584
      notes: Tetrathionate generated by tsdA can be disproportionated by tetH to yield
        S0, thiosulfate and sulfate.
    predicate_id: METPO:2007803
