evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  snippet: substrate of a fermentation has to serve as electron donor as well as acceptor
  notes: Supports donor/acceptor definition of anaerobic bacterial fermentation.
- reference: DOI:10.1111/1751-7915.13746
  snippet: Substrate-level phosphorylation is one of the main sources of energy
  notes: Supports substrate-level phosphorylation as a major fermentative energy-conservation mechanism.
