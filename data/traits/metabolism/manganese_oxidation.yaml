  - node_id: mn_iv_o_mn_iv_intermediate
    label: Mn(IV)(O)Mn(IV) intermediate
    node_type: CHEMICAL
    description: Binuclear Mn(IV) species formed by disproportionation of Mn(III)(OH)Mn(III),
      en route to MnO2.
  - node_id: mno2_nanoparticles
    label: MnO2 nanoparticles
    node_type: CHEMICAL
    description: Insoluble MnO2 nanoparticles released as the final biomineral product.
