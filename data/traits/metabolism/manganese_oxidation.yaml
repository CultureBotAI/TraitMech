- timestamp: '2026-08-06T00:00:00Z'
  curator: claude
  action: MIGRATE_ENABLES_TRAIT_EDGES
  changes: Migrated 2 causal edge(s) off enables/RO:0002327 with a TRAIT object (1
    to has electron acceptor, 1 to confers), issue 302. RO:0002327 has range 'biological
    process or activity', which a trait (a disposition) cannot satisfy, so the previous
    form entailed trait is-a BiologicalProcessOrActivity. The replacements are proposed
    in proposals/metpo_traitmech_v8 and are placeholder ids until METPO mints them.
    1 electron edge(s) were also reversed back to trait -> chemical, restoring the
    donor/acceptor role that PR 300 collapsed onto enables (issue 303); the organism-subject
    problem that forced that collapse does not arise here because these predicates
    take a causal-node domain rather than METPO:2000001's microbe domain (issue 301).
    The O2 edge is in that group because the node describes O2 as the terminal oxidant,
    which names the terminal-electron-acceptor role; the first cut of the migration
    rule matched only the literal phrase "electron acceptor" and would have grounded
    it to the generic confers relation, dropping exactly the role issue 303 exists
    to preserve.
  llm_assisted: true
- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 2 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (2 to produces), issue 301 part 2. The previous predicates
    are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain is METPO:1000525
    (microbe), so a causal-graph subject entailed that the subject IS a microbe; CausalNodeTypeEnum
    has no organism member, so no such edge could ever satisfy the domain. Each replacement
    is a 1:1 mirror of its source predicate that changes only the domain, so the claim
    each edge makes is unchanged and directions are unchanged. The replacements are
    proposed in proposals/metpo_traitmech_v9 and are placeholder ids until METPO mints
    them.
  llm_assisted: true
