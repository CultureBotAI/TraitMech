identifier: traitmech:000032
label: manganese oxidation
definition: A metabolism in which bacteria oxidize soluble Mn(II) to insoluble Mn(III/IV)
  oxides, typically catalyzed by multicopper oxidases. Characteristic of organisms
  such as Bacillus sp. SG-1, Leptothrix, and Pseudomonas putida.
definition_source: DOI:10.1016/j.tim.2005.07.009
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: Mn(II) oxidation
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.tim.2005.07.009
evidence:
- reference: DOI:10.1016/j.tim.2005.07.009
  notes: Tebo et al., "Geomicrobiology of manganese(II) oxidation", supports bacterial
    Mn(II) oxidation to Mn oxides via a multicopper-oxidase mechanism.
- reference: DOI:10.1146/annurev.earth.32.101802.120213
  notes: Tebo et al., "Biogenic manganese oxides", supports the formation and properties
    of bacterially produced Mn(III/IV) oxides.
canonical_examples:
- taxon_id: NCBITaxon:89
  taxon_label: Leptothrix discophora
  note: Classic Mn(II)-oxidising sheathed bacterium.
  reference: PMID:25149187
causal_graphs:
- graph_id: manganese_oxidation_multicopper_oxidase
  title: Manganese oxidation produces insoluble Mn(III/IV) oxides
  description: Evidence-backed causal sketch linking multicopper-oxidase activity
    to oxidation of soluble Mn(II) to insoluble Mn(III/IV) oxides.
  nodes:
  - node_id: manganese_oxidation_trait
    label: manganese oxidation
    node_type: TRAIT
    grounding: traitmech:000032
    description: Bacterial oxidation of Mn(II) to Mn(III/IV) oxides.
  - node_id: multicopper_oxidase
    label: multicopper oxidase
    node_type: GENE_OR_PROTEIN
    description: Enzyme family catalyzing Mn(II) oxidation in bacteria.
    grounding: UniProtKB:A0A059ZYC2
  - node_id: mn_oxides
    label: Mn(III/IV) oxides
    node_type: CHEMICAL
    description: Insoluble bacterially-produced manganese oxides.
  - node_id: molecular_oxygen
    label: molecular oxygen (O2)
    node_type: CHEMICAL
    description: O2 used directly as the terminal oxidant by multicopper-oxidase Mn(II)-oxidizing
      systems.
  - node_id: mn_iii_oh_mn_iii_intermediate
    label: Mn(III)(OH)Mn(III) intermediate
    node_type: CHEMICAL
    description: Binuclear Mn(III) intermediate formed during cooperative two-electron
      Mn(II) oxidation.
  - node_id: mn_iv_o_mn_iv_intermediate
    label: Mn(IV)(O)Mn(IV) intermediate
    node_type: CHEMICAL
    description: Binuclear Mn(IV) species formed by disproportionation of Mn(III)(OH)Mn(III),
      en route to MnO2.
  - node_id: mno2_nanoparticles
    label: MnO2 nanoparticles
    node_type: CHEMICAL
    description: Insoluble MnO2 nanoparticles released as the final biomineral product.
  edges:
  - subject: multicopper_oxidase
    predicate: confers
    object: manganese_oxidation_trait
    description: Multicopper oxidases catalyze the Mn(II) → Mn(III/IV) oxidation step.
    evidence:
    - reference: DOI:10.1016/j.tim.2005.07.009
      notes: Tebo et al. support bacterial Mn(II) oxidation via a multicopper- oxidase
        mechanism.
    predicate_id: METPO:2007700
  - subject: manganese_oxidation_trait
    predicate: produces
    object: mn_oxides
    description: The metabolism deposits biogenic Mn(III/IV) oxides.
    evidence:
    - reference: DOI:10.1146/annurev.earth.32.101802.120213
      notes: Tebo et al. characterize the formation and properties of bacterially
        produced Mn(III/IV) oxides.
    predicate_id: METPO:2007800
  - subject: manganese_oxidation_trait
    predicate: has electron acceptor
    object: molecular_oxygen
    description: O2 serves as the direct oxidant enabling multicopper-oxidase-mediated
      Mn(II) oxidation.
    evidence:
    - reference: DOI:10.1021/jacs.3c06537
      notes: Some microbes can use O2 directly via multicopper oxidase (MCO) enzymes
        for Mn(II) oxidation.
    predicate_id: METPO:2007702
  - subject: manganese_oxidation_trait
    predicate: produces
    object: mn_iii_oh_mn_iii_intermediate
    description: A cooperative two-electron oxidation step produces a Mn(III)(OH)Mn(III)
      intermediate.
    evidence:
    - reference: DOI:10.1021/jacs.3c06537
      notes: 'Cryo-EM mechanistic model: a cooperative two-electron step producing
        a Mn(III)(OH)Mn(III) intermediate.'
    predicate_id: METPO:2007800
  - subject: mn_iii_oh_mn_iii_intermediate
    predicate: disproportionates to form
    object: mn_iv_o_mn_iv_intermediate
    description: Two Mn(III)(OH)Mn(III) species disproportionate to form Mn(IV)(O)Mn(IV).
    evidence:
    - reference: DOI:10.1021/jacs.3c06537
      notes: Disproportionation of two Mn(III)(OH)Mn(III) species to form Mn(IV)(O)Mn(IV).
  - subject: mn_iv_o_mn_iv_intermediate
    predicate: condenses into
    object: mno2_nanoparticles
    description: Mn(IV)(O)Mn(IV) condenses en route to MnO2 nanoparticle release.
    evidence:
    - reference: DOI:10.1021/jacs.3c06537
      notes: Mn(IV)(O)Mn(IV) is en route to MnO2, with release of MnO2 nanoparticles.
  - subject: mno2_nanoparticles
    predicate: is a
    object: mn_oxides
    description: MnO2 nanoparticles are a form of the insoluble biogenic Mn(III/IV)
      oxide product.
    evidence:
    - reference: DOI:10.1021/jacs.3c06537
      notes: MnO2 nanoparticles are the final insoluble Mn(IV) oxide biomineral product
        of the oxidation cascade.
    predicate_id: rdfs:subClassOf
