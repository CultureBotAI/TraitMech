identifier: traitmech:000132
label: dark oxidation of sulfur compounds
definition: A sulfur oxidation in which an organism oxidizes a reduced inorganic sulfur
  compound as an electron donor for energy conservation independently of light.
definition_source: DOI:10.1126/science.aaf4507
