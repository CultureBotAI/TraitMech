  snippet: acetate
  notes: Microbial-physiology review supports acetate oxidation as an
    electron-donor route for anaerobic respiration and syntrophic metabolism.
- reference: PMID:16357845
  snippet: Desulfobacter
  notes: 'Organism example: Desulfobacter postgatei is a model anaerobic
    bacterium oxidising acetate while reducing sulfate.'
