identifier: traitmech:UED_ACETATE
label: uses acetate as electron donor
definition: A metabolic trait in which an organism oxidises acetate as an electron
  donor for energy conservation, typically coupled to anaerobic respiration with
  external electron acceptors (sulfate, nitrate, iron, etc.) or to syntrophic
  acetate oxidation.
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
