    snippets across three taxa (DOI:10.1128/AEM.00241-07, DOI:10.1038/s41396-021-01034-5,
    DOI:10.3389/fmicb.2021.804181) without enzyme-complex or electron-transfer quotes.
  posed_by: claude
  posed_date: '2026-10-23'
  evidence:
  - reference: DOI:10.1128/AEM.00241-07
    supports: PARTIAL
