  rationale: Candidate Idr, DmsAB, EC, Rhea, and protein-family terms describe narrower
    iodate reductase activities, reactions, or enzymes rather than the whole-organism
    anaerobic respiration phenotype.
  posed_by: codex
  posed_date: '2026-09-15'
- discussion_id: iodate-respiration-causal-graph-source-gap
  prompt: Add primary literature evidence for the periplasmic iodate reductase complex
    (IdrABP1P2) and electron-transport coupling plus strain-matched UniProtKB protein
    accessions before constructing causal_graphs.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
