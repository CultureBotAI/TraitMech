identifier: traitmech:000203
label: iodate respiration
definition: An anaerobic respiration in which an organism uses iodate as the terminal
  electron acceptor for energy conservation.
definition_source: DOI:10.1128/AEM.00241-07
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: dissimilatory iodate reduction
  synonym_type: EXACT_SYNONYM
evidence:
- reference: DOI:10.1128/AEM.00241-07
  snippet: SCT was capable of anaerobic growth with 3 mM iodate as the sole electron
    acceptor
  notes: Amachi et al. isolated Pseudomonas sp. strain SCT from marine sediment slurry
    and showed anaerobic growth with iodate as sole electron acceptor.
- reference: DOI:10.1128/AEM.00241-07
  snippet: SCT is a dissimilatory iodate-reducing bacterium
  notes: Amachi et al. support the dissimilatory iodate reduction synonym and organism-level
    phenotype scope.
- reference: DOI:10.1038/s41396-021-01034-5
  snippet: dissimilatory IO3− reduction to iodide (I−) by a novel estuarine bacterium,
    Denitromonas sp. IR-12
  notes: Reyes-Umana et al. show that iodate respiration recurs in an estuarine Denitromonas
    isolate.
- reference: DOI:10.3389/fmicb.2021.804181
  snippet: A. toluclasticum sp. TC-10 couples acetate oxidation to iodate reduction
    with a concomitant increase in the OD600.
  notes: Reyes-Umana et al. extend the dissimilatory iodate-reducing phenotype to
    the freshwater isolate Aromatoleum toluclasticum sp. TC-10.
- reference: DOI:10.1111/1462-2920.14988
  snippet: IdrA and IdrB were homologues of catalytic and electron transfer subunits
    of respiratory arsenite oxidase (Aio); however, IdrA defined a novel clade within
    the dimethylsulfoxide (DMSO) reductase family.
  notes: Yamazaki et al. identify and characterize the periplasmic respiratory iodate
    reductase catalytic subunit IdrA (encoded within the idrABP1P2 operon; UniProtKB:A0A391NTR7)
    required for anaerobic iodate respiration in Pseudomonas sp. strain SCT.
canonical_examples:
- taxon_id: NCBITaxon:412955
  taxon_label: Pseudomonas sp. SCT
  note: Amachi et al. isolated Pseudomonas sp. strain SCT from marine sediment slurry
    and showed anaerobic growth with iodate as the sole electron acceptor.
  reference: DOI:10.1128/AEM.00241-07
