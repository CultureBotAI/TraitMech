        (energy-conservation edge).
    predicate_id: biolink:produces
  - subject: proton_gradient
    predicate: drives
    object: atp_synthesis
    description: The proton motive force is used to drive chemiosmotic ATP synthesis.
    evidence:
    - reference: DOI:10.3390/biom14030311
      notes: The electrochemical proton gradient drives ATP synthesis; canonical bioenergetic
        edge.
  - subject: photosynthesis_process
    predicate: has output
    object: reducing_power
    description: Light-dependent reactions generate ATP and NAD(P)H reducing power.
    evidence:
    - reference: DOI:10.5287/ora-8jgz2nrvd
      notes: Light-dependent reactions generate ATP and NAD(P)H; broad linkage across
        chlorophyll-based photosynthetic systems.
    predicate_id: RO:0002234
  - subject: reducing_power
    predicate: used in
    object: carbon_fixation
    description: NADPH reducing power supplies electrons for autotrophic CO2 fixation.
    evidence:
    - reference: DOI:10.1111/1751-7915.14519
      notes: NADPH from the light reactions is used in biosynthesis, including carbon
        fixation.
  - subject: photosystem_ii
    predicate: initiates
    object: charge_separation
    description: Photosystem II initiates oxygenic electron transfer through light-induced
      reaction-center charge separation.
    evidence:
    - reference: DOI:10.1073/pnas.1520211113
      snippet: PSII reactions are initiated by light-induced charge separation between
        a chlorophyll dimer and a pheophytin electron acceptor.
      notes: The primary spectroelectrochemical study supports the generic PSII charge-separation
        edge; the PsbA2 accession separately grounds a Synechocystis complex component.
