identifier: traitmech:000038
label: photosynthesis
definition: A phototrophic metabolism that uses light energy and chlorophyll- or bacteriochlorophyll-based
  photochemical reaction centers to drive electron flow, fixing CO2 and/or generating
  reducing power. Subdivided into oxygenic and anoxygenic photosynthesis.
definition_source: DOI:10.1016/j.tim.2006.09.001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000037
xrefs:
- GO:0015979
evidence:
- reference: DOI:10.1016/j.tim.2006.09.001
  notes: Bryant & Frigaard treat prokaryotic photosynthesis (reaction-center based)
    as encompassing both oxygenic and anoxygenic forms across five phyla.
- reference: DOI:10.1146/annurev-earth-060313-054810
  notes: Fischer et al., "Evolution of Oxygenic Photosynthesis", supports reaction-center
    photosynthesis as the chlorophyll-based, CO2-fixing branch of phototrophy distinct
    from rhodopsin-based light capture.
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: oxygenic photosynthesis
  reference: PMID:16228363
- taxon_id: NCBITaxon:1063
  taxon_label: Cereibacter sphaeroides
  note: anoxygenic photosynthesis
  reference: PMID:21777427
- taxon_id: NCBITaxon:1111708
  taxon_label: Synechocystis sp. PCC 6803
  note: Strain-level oxygenic photosynthesis model paired to the reviewed PsbA2/D1
    component of photosystem II.
  reference: DOI:10.1074/jbc.M806116200
causal_graphs:
- graph_id: photosynthesis_chlorophyll_reaction_center
  title: Chlorophyll-based photosynthesis drives electron flow and CO2 fixation
  description: Evidence-backed causal sketch linking chlorophyll-based reaction centers
    to electron flow that powers CO2 fixation.
  scope_status: MECHANISTIC
  scope_notes: The graph spans oxygenic and anoxygenic chlorophyll-based photosynthesis.
    The Synechocystis PsbA2 example supports the oxygenic photosystem II branch only;
    anoxygenic reaction centers use different protein families.
  nodes:
  - node_id: photosynthesis_trait
    label: photosynthesis
    node_type: TRAIT
    grounding: traitmech:000038
    description: Chlorophyll/bacteriochlorophyll-based reaction-center metabolism.
  - node_id: photosynthesis_process
    label: photosynthesis
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0015979
    description: Conversion of light energy to chemical energy via reaction centers.
  - node_id: carbon_fixation
    label: carbon fixation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0015977
    description: Assimilation of inorganic CO2 into organic carbon.
  - node_id: light_energy
    label: light energy
    node_type: ENVIRONMENTAL_FACTOR
    description: Photon energy absorbed and channeled by photosynthetic pigments.
  - node_id: light_harvesting
    label: light harvesting / excitation transfer
    node_type: BIOLOGICAL_PROCESS
    description: Absorption and transfer of excitation energy by antenna pigments
      to reaction centers.
  - node_id: charge_separation
    label: reaction-center charge separation
    node_type: BIOLOGICAL_PROCESS
    description: Light-driven primary charge separation in chlorophyll/bacteriochlorophyll
      reaction centers.
  - node_id: electron_transport
    label: photosynthetic electron transport
    node_type: BIOLOGICAL_PROCESS
    description: Light-driven electron flow through the photosynthetic electron transport
      chain (linear or cyclic).
  - node_id: proton_gradient
    label: transmembrane electrochemical proton gradient
    node_type: STATE
    description: Proton motive force generated across the membrane by photosynthetic
      electron transport.
  - node_id: atp_synthesis
    label: ATP synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Chemiosmotic ATP generation coupled to the proton motive force.
    grounding: GO:0006754
  - node_id: reducing_power
    label: reducing power (NAD(P)H)
    node_type: CAPACITY
    description: NADPH/NAD(P)H reducing equivalents produced by the light reactions.
  - node_id: photosystem_ii
    label: photosystem II
    node_type: GENE_OR_PROTEIN
    description: Multisubunit pigment-protein reaction-center complex initiating oxygenic
      photosynthetic charge separation and water oxidation.
    grounding: GO:0009523
    protein_examples:
    - uniprot_id: UniProtKB:P16033
      protein_label: Photosystem II protein D1 2
      gene_symbol: psbA2
      taxon_id: NCBITaxon:1111708
      taxon_label: Synechocystis sp. PCC 6803
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 186
      sequence_version: 1
      role: D1 reaction-center component of photosystem II; this accession is not
        presented as the complete water-oxidizing complex.
      evidence:
      - reference: DOI:10.1074/jbc.M806116200
        snippet: the PsbA (D1) subunit of photosystem II (PSII)
        notes: A primary Synechocystis PCC 6803 study identifies PsbA/D1 as a PSII
          subunit and studies its biogenesis; UniProtKB P16033 verifies the reviewed
          PsbA2 protein and strain taxon.
  edges:
  - subject: photosynthesis_process
    predicate: confers
    object: photosynthesis_trait
    description: Reaction-center photochemistry underlies the photosynthetic trait.
    evidence:
    - reference: DOI:10.1016/j.tim.2006.09.001
      notes: Bryant & Frigaard treat reaction-center photosynthesis as encompassing
