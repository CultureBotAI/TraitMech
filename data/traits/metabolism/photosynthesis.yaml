    predicate_id: METPO:2007700
  - subject: photosynthesis_trait
    predicate: contributes to
    object: carbon_fixation
    description: Photosynthetic electron flow powers autotrophic CO2 fixation.
    evidence:
    - reference: DOI:10.1146/annurev-earth-060313-054810
      notes: Fischer et al. frame reaction-center photosynthesis as the chlorophyll-based,
        CO2-fixing branch of phototrophy.
    predicate_id: RO:0002326
  - subject: light_energy
    predicate: enables
    object: light_harvesting
    description: Light energy drives pigment absorption and excitation transfer to
      reaction-center antennae.
    evidence:
    - reference: DOI:10.1111/1751-7915.14519
      notes: Chlorophyll/antenna pigments absorb and transfer light energy to the
        photosystems (light harvesting).
    predicate_id: RO:0002327
  - subject: light_harvesting
    predicate: initiates
    object: charge_separation
    description: Transferred excitation energy drives primary charge separation at
      the reaction-center special pair.
    evidence:
    - reference: DOI:10.3390/biom14030311
      notes: Light-driven charge separation in reaction-center photosystems initiates
        downstream electron flow (generic to Type I/II RCs).
  - subject: charge_separation
    predicate: powers
    object: electron_transport
    description: Reaction-center charge separation drives photosynthetic electron
      transport (linear or cyclic).
    evidence:
    - reference: DOI:10.3390/biom14030311
      notes: Light-driven charge separation powers electron transfer pathways; generalization
        for reaction-center photosystems.
  - subject: electron_transport
    predicate: generates
    object: proton_gradient
