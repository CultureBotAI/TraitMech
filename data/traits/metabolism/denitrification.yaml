identifier: traitmech:000104
label: denitrification
definition: An anaerobic respiratory metabolism in which nitrate is reduced stepwise
  to gaseous dinitrogen via nitrite, nitric oxide, and nitrous oxide, removing fixed
  nitrogen from the system as gas.
definition_source: DOI:10.1128/mmbr.61.4.533-616.1997
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: denitrifying
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mmbr.61.4.533-616.1997
evidence:
- reference: DOI:10.1128/mmbr.61.4.533-616.1997
  notes: Zumft reviews the cell biology and molecular basis of denitrification, the
    stepwise respiratory reduction of nitrate to dinitrogen.
- reference: DOI:10.1038/nrmicro.2018.9
  notes: Kuypers et al. place denitrification as a nitrogen-loss branch of the microbial
    nitrogen-cycling network.
canonical_examples:
- taxon_id: NCBITaxon:266
  taxon_label: Paracoccus denitrificans
  note: Classic complete denitrifier (NO3->NO2->NO->N2O->N2 via nar/nir/nor/nos);
    free-living model of the respiratory chain.
  reference: DOI:10.1128/mmbr.61.4.533-616.1997
causal_graphs:
- graph_id: denitrification_stepwise_nitrate_to_n2
  title: Denitrification reduces nitrate stepwise to N2
  description: Evidence-backed causal sketch linking nitrate reduction via nitrite,
    NO, and N2O to gaseous N2 in anaerobic respiration.
  scope_status: MECHANISTIC
  scope_notes: Represents complete canonical denitrification and uses Paracoccus denitrificans
    NosZ as the taxon-paired protein example. Individual denitrifiers may lack one
    or more modules, as captured by the graph's modularity branch.
  nodes:
  - node_id: denitrification_trait
    label: denitrification
    node_type: TRAIT
    grounding: traitmech:000104
    description: Anaerobic respiratory reduction of nitrate to N2.
  - node_id: nitrate
    label: nitrate
    node_type: CHEMICAL
    grounding: CHEBI:17632
    description: Terminal electron acceptor reduced in denitrification.
  - node_id: dinitrogen
    label: dinitrogen
    node_type: CHEMICAL
    grounding: CHEBI:17997
    description: Final gaseous product released to the atmosphere.
  - node_id: anaerobic_respiration
    label: anaerobic respiration
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0009061
    description: Energy-conserving respiration with a non-O2 terminal acceptor.
  - node_id: narghi
    label: respiratory nitrate reductase NarGHI
    node_type: GENE_OR_PROTEIN
    description: Membrane-bound respiratory nitrate reductase catalyzing NO3- to NO2-.
    grounding: GO:0009325
  - node_id: nitrate_reduction_to_nitrite
    label: nitrate reduction to nitrite
    node_type: BIOLOGICAL_PROCESS
    description: 'First step of denitrification: reduction of nitrate to nitrite.'
  - node_id: nirs
    label: cytochrome cd1 nitrite reductase NirS
    node_type: GENE_OR_PROTEIN
    description: Cytochrome cd1 nitrite reductase reducing nitrite to nitric oxide.
    grounding: GO:0050421
  - node_id: nitrite_reduction_to_no
    label: nitrite reduction to nitric oxide
    node_type: BIOLOGICAL_PROCESS
    description: Reduction of nitrite to nitric oxide, the committed denitrification
      step.
  - node_id: nor
    label: nitric oxide reductase Nor
    node_type: GENE_OR_PROTEIN
    description: Nitric oxide reductase (norB) reducing NO to N2O.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The cited graph evidence supports a NorB-containing nitric-oxide
      reductase but does not distinguish cNor, qNor, or another exact complex family.
  - node_id: no_reduction_to_n2o
    label: nitric oxide reduction to nitrous oxide
    node_type: BIOLOGICAL_PROCESS
    description: Reduction of nitric oxide to nitrous oxide.
  - node_id: nosz
    label: nitrous oxide reductase NosZ
    node_type: GENE_OR_PROTEIN
    description: Nitrous oxide reductase (nosZ) reducing N2O to N2, terminal step.
    grounding: GO:0050304
    protein_examples:
    - uniprot_id: UniProtKB:Q51705
      protein_label: Nitrous-oxide reductase
      gene_symbol: nosZ
      taxon_id: NCBITaxon:266
      taxon_label: Paracoccus denitrificans
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 135
      sequence_version: 1
      role: NosZ enzyme catalyzing the terminal N2O-to-dinitrogen step in P. denitrificans.
      evidence:
      - reference: DOI:10.1042/BJ20020782
        snippet: N2OR is a multicopper protein which converts N2O into dinitrogen
          and water.
        notes: The primary structural study purified and characterized N2O reductase
          from P. denitrificans; UniProtKB Q51705 verifies the reviewed NosZ protein
          and matching taxon.
  - node_id: n2o_reduction_to_n2
    label: nitrous oxide reduction to dinitrogen
    node_type: BIOLOGICAL_PROCESS
    description: 'Terminal step: reduction of N2O to N2.'
  - node_id: molecular_oxygen
    label: oxygen (O2)
    node_type: CHEMICAL
    description: Molecular oxygen, superordinate repressor of denitrification.
  - node_id: denitrification_modularity
    label: denitrification pathway modularity
    node_type: QUALITY
    description: Modular organization of denitrification enzyme steps across organisms.
  - node_id: transient_intermediate_accumulation
    label: transient accumulation of intermediates
    node_type: STATE
    description: Transient build-up of denitrification intermediates (NO2-, NO, N2O).
  edges:
  - subject: nitrate
    predicate: oxidized to
    object: dinitrogen
    description: Nitrate is reduced stepwise via NO2-, NO, N2O to N2.
    evidence:
    - reference: DOI:10.1128/mmbr.61.4.533-616.1997
      notes: Zumft reviews the stepwise respiratory reduction of nitrate to N2.
    predicate_id: METPO:2007405
  - subject: denitrification_trait
    predicate: participates in
    object: anaerobic_respiration
    description: Denitrification is a nitrate-respiring form of anaerobic respiration.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.9
      notes: Kuypers et al. place denitrification within the microbial nitrogen-cycling
        network.
    predicate_id: biolink:participates_in
  - subject: narghi
    predicate: enables
    object: nitrate_reduction_to_nitrite
    description: Respiratory nitrate reductase NarGHI catalyzes the first denitrification
      step.
    evidence:
    - reference: DOI:10.1186/s40793-024-00643-9
      notes: narG (NO3- reductase) supports the canonical first step of denitrification.
    predicate_id: RO:0002327
  - subject: nirs
    predicate: enables
    object: nitrite_reduction_to_no
    description: Cytochrome cd1 nitrite reductase NirS reduces nitrite to nitric oxide.
    evidence:
    - reference: DOI:10.1093/ismeco/ycae020
      notes: Nitrite is reduced to gaseous NO by nitrite reductases including cytochrome
        cd1 NirS; strong general mechanistic support.
    predicate_id: RO:0002327
  - subject: nor
    predicate: enables
    object: no_reduction_to_n2o
    description: Nitric oxide reductase Nor reduces NO to N2O.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1218207
      notes: NO reductase (NOR), encoded by norB, reduces NO to N2O; canonical N2O-producing
        step.
    predicate_id: RO:0002327
  - subject: nosz
    predicate: enables
    object: n2o_reduction_to_n2
    description: Nitrous oxide reductase NosZ reduces N2O to N2, the terminal step.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1218207
      notes: N2O reductase (NOS) catalyzes reduction of N2O to N2; canonical terminal
        step.
    predicate_id: RO:0002327
  - subject: nosz
    predicate: part_of
    object: denitrification_trait
    description: NosZ is the final-step component of complete denitrification.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1407573
      notes: Reduction of N2O to N2 requires nitrous oxide reductase encoded by nosZ.
  - subject: molecular_oxygen
    predicate: negatively regulates
    object: denitrification_trait
    description: Oxygen acts as a superordinate repressor of denitrification.
    evidence:
    - reference: DOI:10.1038/s41467-024-51688-w
      notes: O2 acts as a superordinate repressor of denitrification.
    predicate_id: RO:0002212
  - subject: denitrification_modularity
    predicate: causes
    object: transient_intermediate_accumulation
    description: Modularity of the denitrification pathway drives transient accumulation
      of intermediates.
    evidence:
    - reference: DOI:10.1038/s41467-024-51688-w
      notes: The modular nature of the denitrification pathway affects phenotypes
        and transient accumulation of intermediates.
    predicate_id: biolink:causes
