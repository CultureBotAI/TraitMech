  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mmbr.61.4.533-616.1997
evidence:
- reference: DOI:10.1128/mmbr.61.4.533-616.1997
  notes: Zumft reviews the cell biology and molecular basis of denitrification, the
    stepwise respiratory reduction of nitrate to dinitrogen.
- reference: DOI:10.1038/nrmicro.2018.9
  notes: Kuypers et al. place denitrification as a nitrogen-loss branch of the
    microbial nitrogen-cycling network.
