identifier: traitmech:000035
label: anoxygenic photosynthesis
definition: A phototrophic metabolism that uses light energy with a single
  photosystem and bacteriochlorophyll, using electron donors other than water
  (e.g. H2S, H2, Fe(II), organics) and therefore not evolving oxygen. Characteristic
  of purple and green sulfur bacteria, Chloroflexi, and heliobacteria.
definition_source: DOI:10.1016/j.tim.2006.09.001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
