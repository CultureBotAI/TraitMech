synonyms:
- synonym_text: bacterial photosynthesis
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.tim.2006.09.001
evidence:
- reference: DOI:10.1016/j.tim.2006.09.001
  notes: Bryant & Frigaard describe anoxygenic photosynthesis across five prokaryotic
    phyla using bacteriochlorophyll and a single photosystem without O2 evolution.
- reference: DOI:10.3389/fmicb.2024.1417714
  notes: Review of anoxygenic photosynthesis in green sulfur bacteria supports
    sulfide as electron donor and the absence of oxygen production.
