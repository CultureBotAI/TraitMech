- synonym_text: rTCA cycle
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.02473-10
- synonym_text: Arnon-Buchanan cycle
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev-marine-120709-142712
- synonym_text: reductive carboxylate cycle
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
- synonym_text: reductive carboxylic acid cycle
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
