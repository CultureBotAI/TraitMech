identifier: traitmech:000021
label: reductive tricarboxylic acid cycle
definition: An autotrophic carbon-fixation pathway (reductive citric acid /
  Arnon-Buchanan cycle) that runs the tricarboxylic acid cycle in reverse to fix
  CO2. It operates in anaerobic and microaerophilic bacteria such as green sulfur
  bacteria (Chlorobium) and Aquificales.
