identifier: traitmech:000112
label: chitinolysis
definition: A biopolymer-degradation metabolism in which an organism hydrolyzes chitin
  to N-acetylglucosamine oligomers and monomers using secreted chitinases.
definition_source: DOI:10.3389/fmicb.2013.00149
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000110
synonyms:
- synonym_text: chitinolytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2013.00149
- synonym_text: chitin degradation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2013.00149
evidence:
- reference: DOI:10.3389/fmicb.2013.00149
  notes: Beier & Bertilsson review bacterial chitin degradation mechanisms and ecophysiological
    strategies.
- reference: DOI:10.1080/07388550601168223
  notes: Bhattacharya et al. review the properties and potential of bacterial chitinases.
canonical_examples:
- taxon_id: NCBITaxon:615
  taxon_label: Serratia marcescens
  note: Textbook chitinolytic system (ChiA/ChiB/ChiC1 plus the CBP21 LPMO that founded
    the lytic polysaccharide monooxygenase field).
  reference: PMID:23398882
causal_graphs:
- graph_id: chitinolysis_chitinase
  title: Chitinolysis hydrolyzes chitin to N-acetylglucosamine
  description: Evidence-backed causal sketch linking secreted chitinases to chitin
    hydrolysis into N-acetylglucosamine oligomers and monomers.
  nodes:
  - node_id: chitinolysis_trait
    label: chitinolysis
    node_type: TRAIT
    grounding: traitmech:000112
    description: Hydrolysis of chitin to assimilable sugars/oligomers.
  - node_id: chitinase
    label: chitinases
    node_type: GENE_OR_PROTEIN
    description: Secreted bacterial chitinases acting on chitin polymer.
  - node_id: n_acetylglucosamine
    label: N-acetylglucosamine
    node_type: CHEMICAL
    description: Monomer released from chitin hydrolysis.
  - node_id: chitin
    label: chitin
    node_type: CHEMICAL
    description: Insoluble beta-1,4-linked N-acetyl-D-glucosamine polymer; primary
      substrate.
    grounding: CHEBI:17029
  - node_id: chitooligosaccharides
    label: chitooligosaccharides ((GlcNAc)n)
    node_type: CHEMICAL
    description: Soluble oligomeric hydrolysis products of chitin.
  - node_id: diacetylchitobiose
    label: diacetylchitobiose ((GlcNAc)2)
    node_type: CHEMICAL
    description: Disaccharide released by exo-chitinases/chitobiosidases from chitin
      chain ends.
  - node_id: exochitinase
    label: exochitinase / chitobiosidase
    node_type: GENE_OR_PROTEIN
    description: Processive chain-end hydrolase releasing mainly (GlcNAc)2.
  - node_id: n_acetylglucosaminidase
    label: beta-N-acetylglucosaminidase
    node_type: GENE_OR_PROTEIN
    description: Hydrolyzes chitooligosaccharides/chitobiose to GlcNAc monomers.
    grounding: GO:0016231
  - node_id: lpmo
    label: lytic polysaccharide monooxygenase (LPMO; AA10)
    node_type: GENE_OR_PROTEIN
    description: Oxidatively cleaves crystalline chitin, accelerating hydrolytic depolymerization.
  edges:
  - subject: chitinase
    predicate: confers
    object: chitinolysis_trait
    description: Secreted chitinases drive chitin depolymerization.
    evidence:
    - reference: DOI:10.1080/07388550601168223
      notes: Bhattacharya et al. review the properties and applications of bacterial
        chitinases.
    predicate_id: METPO:2007700
  - subject: chitinolysis_trait
    predicate: produces
    object: n_acetylglucosamine
    description: Chitin hydrolysis yields N-acetylglucosamine.
    evidence:
    - reference: DOI:10.3389/fmicb.2013.00149
      notes: Beier & Bertilsson review bacterial chitin degradation strategies.
    predicate_id: METPO:2007800
  - subject: chitinase
    predicate: hydrolyzes to
    object: chitooligosaccharides
    description: Chitinases cleave beta-1,4 bonds of insoluble chitin to soluble chitooligosaccharides.
    evidence:
    - reference: DOI:10.3389/fmicb.2013.00149
      notes: Extracellular cleavage of insoluble chitin into soluble oligomers; broad
        taxonomic support.
    - reference: DOI:10.1007/s11356-024-33728-6
      notes: Chitinases cleave the beta-1,4-glycosidic bonds of chitin to produce
        chitooligosaccharides.
  - subject: exochitinase
    predicate: hydrolyzes to
    object: diacetylchitobiose
    description: Processive exo-chitinases/chitobiosidases release diacetylchitobiose
      from chitin chain ends.
    evidence:
    - reference: DOI:10.3389/fmicb.2013.00149
      notes: Processive exoenzymes release disaccharides from chain ends.
    - reference: DOI:10.3390/toxins16010026
      notes: Chitobiosidases release di-acetylchitobiose from chain ends.
  - subject: n_acetylglucosaminidase
    predicate: hydrolyzes to
    object: n_acetylglucosamine
    description: beta-N-acetylglucosaminidases hydrolyze chitooligomers/chitobiose
      to GlcNAc monomers.
    evidence:
    - reference: DOI:10.3390/toxins16010026
      notes: beta-N-acetylglucosaminidases hydrolyze oligomers ((GlcNAc)2-(GlcNAc)4)
        to GlcNAc monomers.
  - subject: lpmo
    predicate: oxidatively cleaves
    object: chitin
    description: LPMOs (AA10) oxidatively cleave the chitin polymer and accelerate
      hydrolytic depolymerization.
    evidence:
    - reference: DOI:10.15407/microbiolj86.04.053
      notes: Polysaccharide monooxygenases (LPMOs) oxidatively cleave the polymer
        and accelerate hydrolysis.
