identifier: traitmech:000109
label: fermentative hydrogen production
definition: A fermentation in which an organism disposes of excess reducing equivalents
  by producing molecular hydrogen (H2), typically via hydrogenases acting on reduced
  ferredoxin or formate.
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: biohydrogen production
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/S0360-3199(02)00131-3
evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports H2 production as a redox-balancing
    fermentation output via hydrogenases.
- reference: DOI:10.1016/S0360-3199(02)00131-3
  notes: Hallenbeck & Benemann review biological hydrogen production, including dark
    fermentative H2 generation.
canonical_examples:
- taxon_id: NCBITaxon:2336
  taxon_label: Thermotoga maritima
  note: Model dark-fermentative hydrogen producer (near-theoretical 4 H2 per glucose);
    hyperthermophilic anaerobe.
  reference: PMID:19411328
causal_graphs:
- graph_id: fermentative_h2_production
  title: Fermentative H2 production disposes of excess reducing equivalents
  description: Evidence-backed causal sketch linking hydrogenase activity on reduced
    ferredoxin or formate to molecular hydrogen production as a redox-balancing fermentation
    output.
  nodes:
  - node_id: fermentative_h2_trait
    label: fermentative hydrogen production
