    grounding: GO:0006113
    description: ATP-yielding catabolism with organic terminal acceptors.
  - node_id: molecular_hydrogen
    label: molecular hydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
    description: H2 produced by hydrogenases.
  - node_id: fefe_hydrogenase
    label: '[FeFe] hydrogenase'
    node_type: GENE_OR_PROTEIN
    description: Hydrogenase enzyme that catalyzes reduction of protons to molecular
      hydrogen in dark fermentation.
  - node_id: low_h2_partial_pressure
    label: low H2 partial pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Low ambient hydrogen partial pressure in the environment.
  - node_id: high_h2_partial_pressure
    label: high H2 partial pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: High ambient hydrogen partial pressure in the environment.
  - node_id: environmental_ph
    label: pH
    node_type: ENVIRONMENTAL_FACTOR
    description: Environmental pH affecting hydrogenase activity and fermentative
      H2 yield.
    grounding: PATO:0001842
  edges:
  - subject: fermentative_h2_trait
    predicate: participates in
    object: fermentation_process
    description: Fermentative H2 production is a class of fermentation metabolism.
    evidence:
    - reference: DOI:10.3389/fmicb.2021.703525
      notes: Energy-conservation review supports H2 production as a redox-balancing
        fermentation output via hydrogenases.
    predicate_id: biolink:participates_in
  - subject: fermentative_h2_trait
    predicate: produces
    object: molecular_hydrogen
    description: Hydrogenases produce H2 to regenerate oxidized cofactors.
    evidence:
    - reference: DOI:10.1016/S0360-3199(02)00131-3
      notes: Hallenbeck & Benemann review biological hydrogen production, including
        dark fermentative H2 generation.
    predicate_id: METPO:2007800
  - subject: fefe_hydrogenase
    predicate: produces
    object: molecular_hydrogen
    description: '[FeFe]-hydrogenases are producers of H2 in dark fermentation.'
    evidence:
    - reference: DOI:10.3390/en16083321
      notes: '[FeFe]-hydrogenases explicitly noted as producers of H2 in dark fermentation.'
    predicate_id: METPO:2007800
  - subject: low_h2_partial_pressure
    predicate: stimulates
    object: fermentative_h2_trait
    description: Low ambient H2 partial pressure stimulates H2 formation.
    evidence:
    - reference: DOI:10.1128/aem.00634-23
      notes: Low ambient H2 stimulated hydrogen (H2) formation; likely broadly relevant
        across fermenters.
  - subject: high_h2_partial_pressure
    predicate: inhibits
    object: fermentative_h2_trait
    description: High ambient H2 partial pressure inhibits H2 formation (product feedback).
    evidence:
    - reference: DOI:10.1128/aem.00634-23
      notes: High H2 inhibited H2 formation.
    predicate_id: RO:0002212
  - subject: environmental_ph
    predicate: affects
    object: fermentative_h2_trait
    description: pH affects the activity of hydrogenase enzymes and thus dark fermentative
