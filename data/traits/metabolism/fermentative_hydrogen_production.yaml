identifier: traitmech:000109
label: fermentative hydrogen production
definition: A fermentation in which an organism disposes of excess reducing equivalents
  by producing molecular hydrogen (H2), typically via hydrogenases acting on reduced
  ferredoxin or formate.
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: biohydrogen production
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/S0360-3199(02)00131-3
evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports H2 production as a redox-balancing
    fermentation output via hydrogenases.
- reference: DOI:10.1016/S0360-3199(02)00131-3
  notes: Hallenbeck & Benemann review biological hydrogen production, including dark
    fermentative H2 generation.
canonical_examples:
- taxon_id: NCBITaxon:2336
  taxon_label: Thermotoga maritima
  note: Model dark-fermentative hydrogen producer (near-theoretical 4 H2 per glucose);
    hyperthermophilic anaerobe.
  reference: DOI:10.1128/JB.01582-08
- taxon_id: NCBITaxon:243274
  taxon_label: Thermotoga maritima MSB8
  note: Strain-level source of the characterized bifurcating HydABC hydrogenase and
    its reviewed HydA protein example.
  reference: DOI:10.1128/JB.01582-08
causal_graphs:
- graph_id: fermentative_h2_production
  title: Fermentative H2 production disposes of excess reducing equivalents
  description: Evidence-backed causal sketch linking hydrogenase activity on reduced
    ferredoxin or formate to molecular hydrogen production as a redox-balancing fermentation
    output.
  scope_status: MECHANISTIC
  scope_notes: The protein example and protein-to-H2 edge are restricted to the bifurcating
    HydABC branch characterized in T. maritima, which requires both NADH and reduced
    ferredoxin. Other fermenters can use distinct hydrogenase or formate-hydrogenlyase
    routes.
  nodes:
  - node_id: fermentative_h2_trait
    label: fermentative hydrogen production
    node_type: TRAIT
    grounding: traitmech:000109
    description: Fermentation that yields H2 to dispose of excess electrons.
  - node_id: fermentation_process
    label: fermentation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006113
    description: ATP-yielding catabolism with organic terminal acceptors.
  - node_id: molecular_hydrogen
    label: molecular hydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
    description: H2 produced by hydrogenases.
  - node_id: fefe_hydrogenase
    label: bifurcating [FeFe] hydrogenase HydABC
    node_type: GENE_OR_PROTEIN
    description: Trimeric electron-bifurcating hydrogenase that couples oxidation
      of NADH and reduced ferredoxin to H2 production.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: HydABC is a multisubunit electron-bifurcating complex; the verified
      HydA family terms describe one component rather than the complete complex represented
      by this node.
    protein_examples:
    - uniprot_id: UniProtKB:O52683
      protein_label: Bifurcating [FeFe] hydrogenase alpha subunit
      gene_symbol: hydA
      taxon_id: NCBITaxon:243274
      taxon_label: Thermotoga maritima MSB8
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 157
      sequence_version: 1
      role: HydA alpha component of the trimeric bifurcating hydrogenase; this accession
        is not presented as the complete HydABC complex.
      evidence:
      - reference: DOI:10.1128/JB.01582-08
        snippet: The enzyme oxidizes NADH and ferredoxin simultaneously in an approximately
          1:1 ratio and in a synergistic fashion to produce H2.
        notes: The primary biochemical study characterizes the trimeric T. maritima
          hydrogenase; UniProtKB O52683 verifies its reviewed HydA alpha component
          and strain taxon.
  - node_id: low_h2_partial_pressure
    label: low H2 partial pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Low ambient hydrogen partial pressure in the environment.
  - node_id: high_h2_partial_pressure
    label: high H2 partial pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: High ambient hydrogen partial pressure in the environment.
  - node_id: environmental_ph
    label: pH
    node_type: ENVIRONMENTAL_FACTOR
    description: Environmental pH affecting hydrogenase activity and fermentative
      H2 yield.
    grounding: PATO:0001842
  edges:
  - subject: fermentative_h2_trait
    predicate: participates in
    object: fermentation_process
    description: Fermentative H2 production is a class of fermentation metabolism.
    evidence:
    - reference: DOI:10.3389/fmicb.2021.703525
      notes: Energy-conservation review supports H2 production as a redox-balancing
        fermentation output via hydrogenases.
    predicate_id: biolink:participates_in
  - subject: fermentative_h2_trait
    predicate: produces
    object: molecular_hydrogen
    description: Hydrogenases produce H2 to regenerate oxidized cofactors.
    evidence:
    - reference: DOI:10.1016/S0360-3199(02)00131-3
      notes: Hallenbeck & Benemann review biological hydrogen production, including
        dark fermentative H2 generation.
    predicate_id: METPO:2007800
  - subject: fefe_hydrogenase
    predicate: produces
    object: molecular_hydrogen
    description: The T. maritima bifurcating HydABC hydrogenase oxidizes NADH and
      ferredoxin synergistically to produce H2.
    evidence:
    - reference: DOI:10.1128/JB.01582-08
      snippet: The enzyme oxidizes NADH and ferredoxin simultaneously in an approximately
        1:1 ratio and in a synergistic fashion to produce H2.
      notes: Direct biochemical evidence for H2 production by the bifurcating hydrogenase
        purified from T. maritima; the edge is not generalized to all [FeFe] hydrogenases.
    predicate_id: METPO:2007800
  - subject: low_h2_partial_pressure
    predicate: stimulates
    object: fermentative_h2_trait
    description: Low ambient H2 partial pressure stimulates H2 formation.
    evidence:
    - reference: DOI:10.1128/aem.00634-23
      notes: Low ambient H2 stimulated hydrogen (H2) formation; likely broadly relevant
        across fermenters.
  - subject: high_h2_partial_pressure
    predicate: inhibits
    object: fermentative_h2_trait
    description: High ambient H2 partial pressure inhibits H2 formation (product feedback).
    evidence:
    - reference: DOI:10.1128/aem.00634-23
      notes: High H2 inhibited H2 formation.
    predicate_id: RO:0002212
  - subject: environmental_ph
    predicate: affects
    object: fermentative_h2_trait
    description: pH affects the activity of hydrogenase enzymes and thus dark fermentative
      H2 yield.
    evidence:
    - reference: DOI:10.3390/en16083321
      notes: pH affects the activity of hydrogenase enzymes and dark fermentative
        H2 yield.
