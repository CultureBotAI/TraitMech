identifier: traitmech:000020
label: Calvin-Benson-Bassham cycle
definition: An autotrophic carbon-fixation pathway (the reductive pentose phosphate
  cycle) that fixes CO2 using ribulose-1,5-bisphosphate carboxylase/oxygenase
  (RuBisCO). It is the most widespread CO2-fixation pathway, used by plants, algae,
  cyanobacteria, and many proteobacteria.
definition_source: DOI:10.1128/AEM.02473-10
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
