identifier: traitmech:000202
label: selenate respiration
definition: An anaerobic respiration in which an organism uses selenate as the terminal
  electron acceptor for energy conservation.
definition_source: DOI:10.1128/aem.60.8.3011-3019.1994
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: dissimilatory selenate reduction
  synonym_type: EXACT_SYNONYM
evidence:
- reference: DOI:10.1128/aem.60.8.3011-3019.1994
  snippet: A gram-negative, strictly anaerobic, motile vibrio was isolated from a
    selenate-respiring enrichment culture
  notes: Oremland et al. isolated strain SES-3 from a selenate-respiring enrichment
    culture and showed anaerobic growth coupled to selenate reduction.
- reference: DOI:10.1128/AEM.02737-06
  snippet: use selenate as a terminal electron acceptor
  notes: Narasingarao and Haggblom define the phenotype as use of selenate as a terminal
    electron acceptor in dissimilatory selenate reduction.
- reference: DOI:10.1128/AEM.02737-06
  snippet: four novel anaerobic dissimilatory selenate-respiring bacteria
  notes: Narasingarao and Haggblom support selenate respiration as a repeatedly observed
    microbial trait across aquatic-sediment isolates rather than a single strain-specific
    anomaly.
- reference: DOI:10.1016/j.syapm.2005.12.011
  snippet: Here we characterize a novel selenate-respiring bacterium, strain AK4OH1,
    isolated from an estuarine sediment enrichment culture
  notes: Narasingarao and Haggblom described Sedimenticola selenatireducens AK4OH1
    as an anaerobic selenate-respiring bacterium isolated from estuarine sediment.
canonical_examples:
- taxon_id: NCBITaxon:1111735
  taxon_label: Sedimenticola selenatireducens DSM 17993
  note: Narasingarao and Haggblom isolated and described Sedimenticola selenatireducens
    strain AK4OH1 as an anaerobic selenate-respiring bacterium.
  reference: DOI:10.1016/j.syapm.2005.12.011
