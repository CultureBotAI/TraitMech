evidence:
- reference: DOI:10.1128/mr.55.2.259-287.1991
  snippet: The oxidation of organic matter coupled to the reduction of Fe(III) or
    Mn(IV) is one of the most important biogeochemical reactions in aquatic
    sediments, soils, and groundwater
  notes: Lovley review establishes dissimilatory Fe(III)/Mn(IV) reduction as
    energy-conserving anaerobic respiration coupling organic-matter oxidation to
    metal reduction.
- reference: PMID:7826009
  notes: Nealson & Saffarini, "Iron and manganese in anaerobic respiration", supports
    Fe(III) and Mn(IV) as terminal electron acceptors competitive with nitrate.
