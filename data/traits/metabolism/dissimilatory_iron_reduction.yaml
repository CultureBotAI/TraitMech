    description: Terminal electron acceptor reduced in DIR.
  - node_id: ferrous_iron
    label: iron(2+)
    node_type: CHEMICAL
    grounding: CHEBI:29033
    description: Soluble product released after Fe(III) reduction.
  - node_id: anaerobic_respiration
    label: energy-conserving anaerobic respiration
