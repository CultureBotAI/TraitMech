  - node_id: organic_matter_oxidation
    label: oxidation of organic matter
    node_type: BIOLOGICAL_PROCESS
    description: Oxidation of organic carbon serving as the electron donor in DIR.
  - node_id: hydrogen_oxidation
    label: H2 oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Oxidation of molecular hydrogen as an electron donor coupled to Fe(III)
