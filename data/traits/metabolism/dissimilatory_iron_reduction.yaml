  edges:
  - subject: ferric_iron
    predicate: oxidized to
    object: ferrous_iron
    description: Fe(III) is reduced to Fe(II) as DIR terminal-acceptor chemistry.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: Lovley establishes Fe(III) reduction coupled to organic-matter oxidation
        as energy-conserving anaerobic respiration.
    predicate_id: METPO:2007405
  - subject: dir_trait
    predicate: has electron acceptor
    object: ferric_iron
    description: Fe(III) acts as terminal electron acceptor enabling DIR.
    evidence:
    - reference: PMID:7826009
      notes: Nealson & Saffarini support Fe(III) as a terminal electron acceptor competitive
        with nitrate.
    predicate_id: METPO:2007702
  - subject: dir_trait
    predicate: is a
    object: anaerobic_respiration
    description: DIR is a form of energy-conserving anaerobic respiration.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: Organisms can obtain energy by completely oxidizing organic compounds
        to CO2 with Fe(III) or Mn(IV) as the sole acceptor.
    predicate_id: rdfs:subClassOf
  - subject: organic_matter_oxidation
    predicate: coupled to
    object: ferric_iron
    description: Oxidation of organic matter is coupled to Fe(III) reduction in DIR.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: The oxidation of organic matter coupled to the reduction of Fe(III) or
        Mn(IV) is the direct result of enzymatic activity of specialized microorganisms.
  - subject: hydrogen_oxidation
    predicate: coupled to
    object: ferric_iron
    description: H2 oxidation can serve as the electron donor coupled to Fe(III) reduction.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: Abundant evidence that H2 oxidation can be coupled to Fe(III)/Mn(IV)
        reduction in sediments.
  - subject: dissolved_fe3_om_complex
    predicate: reduced faster than
    object: solid_fe3_mineral
    description: Dissolved Fe(III)-OM complexes are reduced at significantly higher
      rates than solid Fe(III) minerals.
    evidence:
    - reference: DOI:10.1007/s10533-024-01186-4
      notes: The reduction rates of dissolved Fe(III)-OM complexes are significantly
        higher than those observed for solid Fe(III) minerals.
  - subject: dir_trait
    predicate: has electron acceptor
    object: solid_fe3_mineral
    description: Insoluble Fe(III) oxides are the environmentally dominant terminal
      electron acceptor for DIR, which is why the trait requires extracellular electron
      transfer.
    evidence:
    - reference: PMID:15518832
      snippet: Unlike other commonly considered electron acceptors, Fe(III) and Mn(IV)
        oxides, the most prevalent form of Fe(III) and Mn(IV) in most environments,
        are insoluble.
      notes: Lovley et al. identify insoluble Fe(III)/Mn(IV) oxides as the prevalent
        environmental form of the acceptor, which is what ties the solid-mineral pool
        to the trait rather than leaving it a free-standing geochemical observation.
    predicate_id: METPO:2007702
  - subject: dir_trait
    predicate: has electron acceptor
    object: dissolved_fe3_om_complex
    description: Solubilised Fe(III) is a second terminal electron acceptor pool,
      reachable without direct contact with the mineral surface.
    evidence:
    - reference: PMID:15518832
      snippet: In contrast, Shewanella and Geothrix species produce chelators that
        solubilize Fe(III) and release electron-shuttling compounds that transfer
        electrons from the cell surface to the surface of Fe(III) oxides not in direct
        contact with the cells.
      notes: Establishes that a solubilised, non-contact Fe(III) pool is respired,
        which is what attaches the dissolved-vs-solid rate comparison to the trait.
        Scope caveat kept explicit (issue 297) - the quote is about chelators the
        organism itself secretes, whereas this node is ambient Fe(III)-organic-matter
        complex, so it supports the existence of the pool rather than its origin.
    predicate_id: METPO:2007702
  - subject: mtrc
    predicate: enables reduction of
    object: solid_fe3_mineral
    description: Cell-surface MtrC supports efficient extracellular reduction of insoluble
      Fe(III) acceptors in S. oneidensis MR-1.
    evidence:
    - reference: DOI:10.1073/pnas.0604517103
      snippet: The decaheme c-type cytochrome MtrC (SO1778) had been implicated in
        efficient reduction of Fe(III) and Mn(IV) by MR-1.
      notes: This primary-source edge is restricted to the Shewanella MR-1 branch;
        Geobacter and other iron reducers can use different extracellular electron-transfer
        machinery.
