identifier: traitmech:000031
label: dissimilatory iron reduction
definition: An anaerobic respiratory metabolism in which an organism conserves
  energy for growth by coupling the oxidation of organic matter or hydrogen to the
  reduction of Fe(III) as a terminal electron acceptor. Characteristic of Geobacter
  and Shewanella, often via extracellular electron transfer.
definition_source: DOI:10.1128/mr.55.2.259-287.1991
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
