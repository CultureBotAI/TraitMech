identifier: traitmech:000108
label: dissimilatory manganese reduction
definition: An anaerobic respiratory metabolism in which an organism conserves energy
  by reducing Mn(IV) oxides to soluble Mn(II) as a terminal electron acceptor while
  oxidizing organic matter or hydrogen.
definition_source: DOI:10.1128/mr.55.2.259-287.1991
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000039
synonyms:
- synonym_text: Mn(IV) reduction
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mr.55.2.259-287.1991
evidence:
- reference: DOI:10.1128/mr.55.2.259-287.1991
  notes: Lovley establishes dissimilatory Fe(III)/Mn(IV) reduction as energy-conserving
    anaerobic respiration on metal-oxide acceptors.
- reference: PMID:7826009
  notes: Nealson & Saffarini review iron and manganese in anaerobic respiration as
    terminal electron acceptors.
canonical_examples:
- taxon_id: NCBITaxon:70863
  taxon_label: Shewanella oneidensis
  note: Model dissimilatory metal reducer (strain MR-1 = Manganese Reducer 1); respires
    Mn(IV)/Fe(III) via extracellular electron transfer.
  reference: DOI:10.1038/nbt749
- taxon_id: NCBITaxon:211586
  taxon_label: Shewanella oneidensis MR-1
  note: Strain-level metal reducer paired to the MtrC surface decaheme cytochrome
    example supporting efficient Mn(IV) reduction.
  reference: DOI:10.1073/pnas.0604517103
causal_graphs:
- graph_id: dmr_mn_oxide_respiration
  title: Dissimilatory manganese reduction respires Mn(IV) to Mn(II)
  description: Evidence-backed causal sketch linking Mn(IV) oxide as terminal electron
    acceptor to soluble Mn(II) and anaerobic respiration.
  scope_status: MECHANISTIC
  scope_notes: The MtrC protein example and protein-to-Mn(IV) edge are specific to
    the extracellular metal-reduction route characterized in S. oneidensis MR-1; they
    are not asserted as universal across manganese reducers.
  nodes:
  - node_id: dmr_trait
    label: dissimilatory manganese reduction
    node_type: TRAIT
    grounding: traitmech:000108
    description: Anaerobic respiration on Mn(IV) oxide as terminal acceptor.
  - node_id: mn_iv_oxide
    label: Mn(IV) oxide
    node_type: CHEMICAL
    description: Insoluble Mn(IV) oxide used as terminal electron acceptor.
  - node_id: mn_ii
    label: manganese(2+)
    node_type: CHEMICAL
    description: Soluble Mn(II) released after reduction.
    grounding: CHEBI:29035
  - node_id: organic_matter
    label: organic matter
    node_type: CHEMICAL
    description: Organic carbon electron donor oxidized during Mn(IV) respiration.
  - node_id: hydrogen
    label: dihydrogen
    node_type: CHEMICAL
    description: H2 used as electron donor for dissimilatory manganese reduction.
    grounding: CHEBI:18276
  - node_id: anoxia
    label: anoxic conditions
    node_type: ENVIRONMENTAL_FACTOR
    description: Absence of oxygen permitting anaerobic Mn(IV) respiration.
  - node_id: methane_oxidation
    label: anaerobic methane oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Anaerobic oxidation of methane (AOM) coupled to metal-oxide reduction.
  - node_id: mtrc
    label: MtrC-family surface decaheme c-type cytochrome
    node_type: GENE_OR_PROTEIN
    description: Cell-surface decaheme cytochrome supporting extracellular reduction
      of manganese oxide in Shewanella.
    grounding: InterPro:IPR020014
    protein_examples:
    - uniprot_id: UniProtKB:Q8EG34
      protein_label: Extracellular iron oxide respiratory system surface decaheme
        cytochrome c component MtrC
      gene_symbol: mtrC
      taxon_id: NCBITaxon:211586
      taxon_label: Shewanella oneidensis MR-1
      entry_status: UNREVIEWED
      proteome_id: UP000008186
      retrieved_on: '2026-08-24'
      entry_version: 125
      sequence_version: 1
      role: MtrC cell-surface component implicated in efficient Mn(IV) reduction;
        this accession is not presented as the complete MtrCAB conduit.
      evidence:
      - reference: DOI:10.1073/pnas.0604517103
        snippet: The decaheme c-type cytochrome MtrC (SO1778) had been implicated
          in efficient reduction of Fe(III) and Mn(IV) by MR-1.
        notes: The primary S. oneidensis MR-1 study supports the MtrC role in metal
          reduction. UniProtKB Q8EG34 is the exact unreviewed MtrC entry from reference
          proteome UP000008186 and verifies the strain taxon.
  edges:
  - subject: mn_iv_oxide
    predicate: oxidized to
    object: mn_ii
    description: Mn(IV) oxide is reduced to soluble Mn(II).
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: Lovley establishes Mn(IV) reduction coupled to organic-matter oxidation
        as energy-conserving anaerobic respiration.
    predicate_id: METPO:2007405
  - subject: dmr_trait
    predicate: has electron acceptor
    object: mn_iv_oxide
    description: Mn(IV) acts as terminal electron acceptor enabling DMR.
    evidence:
    - reference: PMID:7826009
      notes: Nealson & Saffarini place Mn(IV) as a terminal electron acceptor in anaerobic
        respiration.
    predicate_id: METPO:2007702
  - subject: organic_matter
    predicate: is oxidized coupled to
    object: dmr_trait
    description: Oxidation of organic matter is coupled to Mn(IV) reduction.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: 'Lovley: oxidation of organic matter coupled to reduction of Fe(III)
        or Mn(IV); fatty acids and aromatics fully oxidized with Mn(IV) as sole acceptor.'
  - subject: hydrogen
    predicate: donates electrons to
    object: dmr_trait
    description: H2 serves as electron donor for dissimilatory manganese reduction.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: 'Lovley: organisms with Mn(IV) as sole electron acceptor can completely
        oxidize hydrogen.'
    predicate_id: METPO:2007403
  - subject: anoxia
    predicate: confers
    object: dmr_trait
    description: Anoxic conditions enable anaerobic Mn(IV) respiration.
    evidence:
    - reference: DOI:10.1128/mr.55.2.259-287.1991
      notes: Lovley frames Mn(IV) reduction as anaerobic respiration in aquatic sediments,
        soils, and groundwater under anaerobic conditions.
    predicate_id: METPO:2007700
  - subject: methane_oxidation
    predicate: is coupled to
    object: dmr_trait
    description: Anaerobic methane oxidation can be coupled to Mn reduction (Fe-Mn-AOM).
    evidence:
    - reference: DOI:10.5194/egusphere-2024-1829
      notes: 'Sivan: AOM coupled with Fe-Mn reduction (Fe-Mn-AOM) is a globally important
        biogeochemical process with MnO2-coupled AOM reactions.'
  - subject: mtrc
    predicate: enables reduction of
    object: mn_iv_oxide
    description: Cell-surface MtrC supports efficient extracellular reduction of Mn(IV)
      acceptors in S. oneidensis MR-1.
    evidence:
    - reference: DOI:10.1073/pnas.0604517103
      snippet: The decaheme c-type cytochrome MtrC (SO1778) had been implicated in
        efficient reduction of Fe(III) and Mn(IV) by MR-1.
      notes: This primary-source edge is restricted to the S. oneidensis MR-1 route;
        methane-coupled and other manganese-reduction mechanisms may use different
        proteins.
