identifier: traitmech:000110
label: biopolymer degradation
definition: A metabolism in which an organism secretes enzymes to depolymerize recalcitrant
  biopolymers (such as cellulose, hemicellulose, chitin, and lignin) into assimilable
  units for growth.
definition_source: DOI:10.1016/j.cbpa.2015.10.018
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: biomass degradation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.cbpa.2015.10.018
evidence:
- reference: DOI:10.1016/j.cbpa.2015.10.018
  notes: Cragg et al. review lignocellulose degradation mechanisms across the tree
    of life, using complementary enzymes to deconstruct plant biopolymers; parent
    of the polymer-specific sub-variants.
- reference: DOI:10.1128/MMBR.66.3.506-577.2002
  notes: Lynd et al. review microbial utilization of cellulose, the archetypal biopolymer-degradation
    process.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: secreted polymer hydrolases
  reference: PMID:35893563
- taxon_id: NCBITaxon:1708
  taxon_label: Cellulomonas fimi
  note: cellulose/biopolymer degrader
  reference: DOI:10.1016/0378-1119(86)90196-4
causal_graphs:
- graph_id: biopolymer_degradation_extracellular_hydrolysis
  title: Biopolymer degradation depolymerizes recalcitrant biomass extracellularly
  description: Evidence-backed causal sketch linking secreted depolymerizing enzymes
    to liberation of assimilable units from recalcitrant biopolymers.
  scope_status: MECHANISTIC
  scope_notes: This is a composite umbrella graph spanning cellulose, chitin, polysaccharide-import,
    and lignin branches. The C. fimi CenA example supports the cellulose branch only;
    it is not presented as a protein that realizes every branch.
  nodes:
  - node_id: biopolymer_degradation_trait
    label: biopolymer degradation
    node_type: TRAIT
    grounding: traitmech:000110
    description: Secreted enzymatic depolymerization of biopolymers (cellulose, chitin,
      lignin, etc.).
  - node_id: extracellular_enzymes
    label: secreted depolymerizing enzymes
    node_type: GENE_OR_PROTEIN
    description: Extracellular hydrolases / oxidoreductases acting on biopolymers.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This umbrella node combines unrelated hydrolase and oxidoreductase
      families, so no single GO or InterPro term denotes the represented set.
  - node_id: assimilable_units
    label: assimilable mono- and oligosaccharides
    node_type: CHEMICAL
    description: Sugars, peptides, and oligomers released for uptake.
  - node_id: endoglucanase
    label: endoglucanase
    node_type: GENE_OR_PROTEIN
    description: Glycoside hydrolase cleaving internal beta-1,4 linkages in cellulose.
    grounding: GO:0008810
    protein_examples:
    - uniprot_id: UniProtKB:P07984
      protein_label: Endoglucanase A
      gene_symbol: cenA
      taxon_id: NCBITaxon:1708
      taxon_label: Cellulomonas fimi
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 122
      sequence_version: 1
      role: Secreted CenA endoglucanase representing the cellulose-hydrolysis branch
        of this composite biopolymer-degradation graph.
      evidence:
      - reference: DOI:10.1016/0378-1119(86)90196-4
        snippet: they expressed carboxymethylcellulase activity in Escherichia coli
        notes: The primary cloning and deletion study identifies active C. fimi CenA.
          UniProtKB P07984 is the reviewed CenA entry from the same species.
  - node_id: cello_oligosaccharides
    label: cello-oligosaccharides
    node_type: CHEMICAL
    description: Soluble cellulose-derived oligomers produced by endoglucanase action.
  - node_id: beta_glucosidase
    label: beta-glucosidase
    node_type: GENE_OR_PROTEIN
    description: Hydrolase converting cellobiose/oligosaccharides to glucose.
    grounding: GO:0008422
  - node_id: glucose
    label: glucose
    node_type: CHEMICAL
    description: Assimilable monosaccharide released by terminal saccharification.
    grounding: CHEBI:17234
  - node_id: susc_transporter
    label: SusC-like TonB-dependent transporter
    node_type: GENE_OR_PROTEIN
    description: Outer-membrane TonB-dependent transporter importing oligosaccharides
      into the periplasm.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: SusC-like transporters are substrate-diverse; the cited starch-utilization
      example does not establish one exact family term for every oligosaccharide transporter
      represented by this broad node.
  - node_id: oligosaccharides
    label: oligosaccharides
    node_type: CHEMICAL
    description: Oligomeric breakdown products captured at the cell surface and imported.
    grounding: CHEBI:50699
  - node_id: periplasmic_gh3
    label: periplasmic GH3 hydrolase
    node_type: GENE_OR_PROTEIN
    description: Periplasmic glycosyl hydrolase converting imported oligomers to monosaccharides.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: GH3 is a functionally diverse glycoside-hydrolase family, while
      this node additionally asserts localization and substrate context not captured
      by a single reviewed semantic term.
  - node_id: endochitinase
    label: endo-chitinase
    node_type: GENE_OR_PROTEIN
    description: Enzyme cleaving internally within the beta-1,4-GlcNAc chitin polymer.
    grounding: GO:0008843
  - node_id: chitooligosaccharides
    label: chitooligosaccharides
    node_type: CHEMICAL
    description: Chitin-derived oligomers produced by endo-chitinase action.
  - node_id: lignin_oxidative_enzymes
    label: lignin-oxidizing redox enzymes (LiP/MnP/VP/laccase/DyP)
    node_type: GENE_OR_PROTEIN
    description: Secreted oxidoreductases that oxidatively attack lignin.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This combined label spans LiP, MnP, versatile peroxidase, laccase,
      and DyP families; no one protein-family term is valid for the full set.
  - node_id: lignin
    label: lignin
    node_type: CHEMICAL
    description: Recalcitrant aromatic plant biopolymer.
    grounding: CHEBI:6457
  edges:
  - subject: extracellular_enzymes
    predicate: confers
    object: biopolymer_degradation_trait
    description: Secreted enzymes drive extracellular biopolymer breakdown.
    evidence:
    - reference: DOI:10.1016/j.cbpa.2015.10.018
      notes: Cragg et al. review the complementary enzymes used to deconstruct plant
        biopolymers across the tree of life.
    predicate_id: METPO:2007700
  - subject: biopolymer_degradation_trait
    predicate: produces
    object: assimilable_units
    description: Depolymerization releases assimilable units for cellular uptake.
    evidence:
    - reference: DOI:10.1128/MMBR.66.3.506-577.2002
      notes: Lynd et al. review microbial cellulose utilization as the archetypal
        biopolymer-degradation process.
    predicate_id: METPO:2007800
  - subject: endoglucanase
    predicate: cleaves
    object: cello_oligosaccharides
    description: Endoglucanases hydrolyze internal beta-1,4 bonds in cellulose to
      release cello-oligosaccharides.
    evidence:
    - reference: DOI:10.1101/2024.11.06.622210
      notes: 'Hsin 2024: "Endoglucanases ... cleave internal beta-1,4 linkages" (strong,
        general).'
  - subject: beta_glucosidase
    predicate: converts
    object: glucose
    description: Beta-glucosidases convert cellobiose/oligosaccharides to glucose
      (terminal saccharification).
    evidence:
    - reference: DOI:10.1101/2024.11.06.622210
      notes: 'Hsin 2024: "beta-glucosidases ... convert cellobiose/oligosaccharides
        to glucose" (strong, general).'
  - subject: susc_transporter
    predicate: imports
    object: oligosaccharides
    description: SusC-like TonB-dependent transporter imports oligosaccharides across
      the outer membrane into the periplasm.
    evidence:
    - reference: DOI:10.1128/mbio.02599-23
      notes: 'Wong 2024: "SusC is a TonB-dependent transporter that imports maltooligosaccharides
        into the periplasm" (strong).'
    predicate_id: METPO:2007805
  - subject: periplasmic_gh3
    predicate: converts
    object: glucose
    description: Periplasmic GH3 hydrolases depolymerize imported oligomers to glucose
      after uptake.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1393588
      notes: 'Kalenborn 2024: "conversion of oligomeric laminarin to glucose in the
        periplasm can be catalyzed by ... glycosyl hydrolases" (strong).'
  - subject: endochitinase
    predicate: depolymerizes
    object: chitooligosaccharides
    description: Endo-chitinases cleave internally within chitin to produce chitooligosaccharides.
    evidence:
    - reference: DOI:10.1128/spectrum.00886-24
      notes: 'Meunier 2024: "endo-chitinases EC 3.2.1.14 cleaving internally to produce
        multimers" (strong).'
  - subject: lignin_oxidative_enzymes
    predicate: depolymerizes
    object: lignin
    description: Secreted oxidative redox enzymes (LiP/MnP/VP/laccase/DyP) depolymerize
      lignin.
    evidence:
    - reference: DOI:10.1101/2024.11.06.622210
      notes: 'Hsin 2024: "white-rot species deploy multiple oxidative enzymes (DyPs,
        LCMOs, LiP, MnP, LaC, VP)".'
