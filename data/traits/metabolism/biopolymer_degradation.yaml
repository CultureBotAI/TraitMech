  notes: Cragg et al. review lignocellulose degradation mechanisms across the tree of
    life, using complementary enzymes to deconstruct plant biopolymers; parent of the
    polymer-specific sub-variants.
- reference: DOI:10.1128/MMBR.66.3.506-577.2002
  notes: Lynd et al. review microbial utilization of cellulose, the archetypal
    biopolymer-degradation process.
