identifier: traitmech:000110
label: biopolymer degradation
definition: A metabolism in which an organism secretes enzymes to depolymerize
  recalcitrant biopolymers (such as cellulose, hemicellulose, chitin, and lignin)
  into assimilable units for growth.
definition_source: DOI:10.1016/j.cbpa.2015.10.018
