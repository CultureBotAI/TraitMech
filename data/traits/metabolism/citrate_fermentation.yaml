identifier: traitmech:000182
label: citrate fermentation
definition: A fermentation in which citrate is the primary fermentable substrate.
definition_source: DOI:10.1128/JB.183.18.5248-5256.2001
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1002005
evidence:
- reference: DOI:10.1128/JB.183.18.5248-5256.2001
  snippet: Klebsiella pneumoniae is able to grow anaerobically with citrate as a sole
    carbon and energy source by a fermentative pathway
  notes: Meyer et al. provide direct Klebsiella pneumoniae evidence for anaerobic
    growth on citrate through a fermentative pathway.
- reference: DOI:10.1186/1471-2180-9-168
  snippet: Not all, but nearly half of the K. pneumoniae clinical isolates carry the
    genes responsible for anaerobic growth on citrate.
  notes: Chen et al. found citrate-growth gene clusters in clinical K. pneumoniae
    isolates, supporting K. pneumoniae as a canonical citrate fermenter with strain-level
    variation.
- reference: DOI:10.1111/j.1365-2958.1994.tb01295.x
  snippet: In the course of studies on anaerobic citrate metabolism in Klebsiella
    pneumoniae, the DNA region upstream of the gene for the sodium-dependent citrate
    carrier (citS) was investigated. Nucleotide sequence analysis revealed a cluster
    of five new genes that were oriented inversely to citS and probably form an operon.
    The genes were named citCDEFG. Based on known protein sequence data, the gene
    products derived from citD, citE and citF could be identified as the gamma-, beta-,
    and alpha-subunits of citrate lyase, respectively. This enzyme catalyses the cleavage
    of citrate to oxaloacetate and acetate.
  notes: Bott and Dimroth sequenced and expressed the Klebsiella pneumoniae citCDEFG
    gene cluster encoding citrate lyase subunits CitD, CitE (UniProtKB:P17725), and
    CitF (UniProtKB:P45413) for anaerobic citrate cleavage.
canonical_examples:
