identifier: traitmech:000204
label: organohalide respiration
definition: An anaerobic respiration in which an organism uses an organohalide as
  the terminal electron acceptor for energy conservation.
definition_source: DOI:10.1098/rstb.2012.0322
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
evidence:
- reference: DOI:10.1098/rstb.2012.0322
  snippet: Organohalide respiration is an anaerobic bacterial respiratory process
    that uses halogenated hydrocarbons as terminal electron acceptors during electron
    transport-based energy conservation.
  notes: Hug et al. define organohalide respiration as anaerobic electron-transport-based
    energy conservation with halogenated hydrocarbons as terminal electron acceptors.
- reference: DOI:10.1098/rstb.2012.0322
  snippet: Organohalide-respiring bacteria have been identified from multiple bacterial
    phyla
  notes: Hug et al. support the record as a reusable bacterial respiration phenotype
    rather than a single-strain label.
- reference: DOI:10.1126/science.276.5318.1568
  snippet: Growth of strain 195 with H2 and tetrachloroethene as the electron donor
    and acceptor pair required extracts from mixed microbial cultures.
  notes: Maymo-Gatell et al. support tetrachloroethene as a growth-coupled organohalide
    electron acceptor in Dehalococcoides mccartyi strain 195.
- reference: DOI:10.1126/science.1102226
  snippet: Dehalococcoides ethenogenes is the only bacterium known to reductively
    dechlorinate the groundwater pollutants, tetrachloroethene (PCE) and trichloroethene,
    to ethene. Its 1,469,720-base pair chromosome contains large dynamic duplicated
    regions and integrated elements. Genes encoding 17 putative reductive dehalogenases,
    nearly all of which were adjacent to genes for transcription regulators, and five
    hydrogenase complexes were identified.
  notes: Seshadri et al. sequenced the Dehalococcoides mccartyi (D. ethenogenes) strain
    195 genome and identified the reductive dehalogenase gene repertoire including
    tetrachloroethene reductive dehalogenase locus DET0318 (UniProtKB:Q3Z9N3).
- reference: DOI:10.1128/aem.66.12.5141-5147.2000
  snippet: The anaerobic bacterium Dehalococcoides ethenogenes is the only known organism
    that can completely dechlorinate tetrachloroethene or trichloroethene (TCE) to
    ethene via dehalorespiration. One of two corrinoid-containing enzymes responsible
    for this pathway, TCE reductive dehalogenase (TCE-RDase) catalyzes the dechlorination
    of TCE to ethene.
  notes: Magnuson et al. cloned and sequenced tceA and characterized the membrane-associated
    corrinoid/iron-sulfur trichloroethene reductive dehalogenase TceA (UniProtKB:Q3ZAB8)
    acting alongside PCE reductive dehalogenase in Dehalococcoides mccartyi strain
    195.
canonical_examples:
- taxon_id: NCBITaxon:243164
  taxon_label: Dehalococcoides mccartyi 195
  note: Strain 195 grows by coupling H2 oxidation to tetrachloroethene reduction,
    establishing growth-coupled organohalide respiration.
  reference: DOI:10.1126/science.276.5318.1568
