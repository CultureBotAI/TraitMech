identifier: traitmech:000113
label: xylan degradation
definition: A biopolymer-degradation metabolism in which an organism hydrolyzes xylan,
  the most abundant hemicellulose, into xylose and xylo-oligosaccharides using xylanases
  and accessory enzymes.
definition_source: DOI:10.1111/j.1757-1707.2009.01004.x
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000110
synonyms:
- synonym_text: xylanolytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1111/j.1757-1707.2009.01004.x
- synonym_text: hemicellulose degradation
  synonym_type: BROAD_SYNONYM
  source: DOI:10.1016/j.cbpa.2015.10.018
evidence:
- reference: DOI:10.1111/j.1757-1707.2009.01004.x
  notes: Dodd & Cann review the enzymatic deconstruction of xylan, the major hemicellulosic
    polysaccharide.
- reference: DOI:10.1016/j.cbpa.2015.10.018
  notes: Cragg et al. include hemicellulose (xylan) degradation within lignocellulose
    breakdown across organisms.
canonical_examples:
- taxon_id: NCBITaxon:44001
  taxon_label: Caldicellulosiruptor saccharolyticus
  note: "thermophilic hemicellulose degrader"
- taxon_id: NCBITaxon:28116
  taxon_label: Bacteroides ovatus
  note: "gut xylan utiliser"
causal_graphs:
- graph_id: xylan_degradation_xylanase
  title: Xylan degradation hydrolyzes hemicellulose to xylose
  description: Evidence-backed causal sketch linking xylanases and accessory enzymes
    to xylan hydrolysis into xylose and xylo-oligosaccharides.
  nodes:
  - node_id: xylan_degradation_trait
    label: xylan degradation
    node_type: TRAIT
    grounding: traitmech:000113
    description: Hydrolysis of xylan to assimilable pentose sugars.
  - node_id: xylanase
    label: xylanase systems
    node_type: GENE_OR_PROTEIN
    description: Endo-/exo-xylanases and accessory enzymes acting on xylan.
  - node_id: xylose
    label: xylose
    node_type: CHEMICAL
    description: Pentose monosaccharide released from xylan.
    grounding: CHEBI:18222
  - node_id: hemicellulase_genes
    label: hemicellulase gene expression
    node_type: BIOLOGICAL_PROCESS
    description: Expression of xylanase/hemicellulase-encoding genes underlying xylan
      degradation.
  - node_id: carbon_catabolite_repression
    label: carbon catabolite repression
    node_type: BIOLOGICAL_PROCESS
    description: Glucose-dependent repression (HPr/CcpA-mediated) of catabolic gene
      expression.
  - node_id: glucuronoyl_esterase
    label: CE15 glucuronoyl esterases
    node_type: GENE_OR_PROTEIN
    description: Accessory esterases cleaving lignin-carbohydrate ester linkages on
      glucuronoxylan.
  - node_id: xylan_saccharification
    label: xylan saccharification
    node_type: BIOLOGICAL_PROCESS
    description: Enzymatic release of soluble sugars from xylan/hemicellulose.
  - node_id: aldouronic_acids
    label: aldouronic acids
    node_type: CHEMICAL
    description: Glucuronoxylan-derived acidic xylo-oligosaccharides released during
      degradation.
  edges:
  - subject: xylanase
    predicate: enables
    object: xylan_degradation_trait
    description: Xylanase systems drive xylan depolymerization extracellularly.
    evidence:
    - reference: DOI:10.1111/j.1757-1707.2009.01004.x
      notes: Dodd & Cann review enzymatic deconstruction of xylan.
    predicate_id: RO:0002327
  - subject: xylan_degradation_trait
    predicate: produces
    object: xylose
    description: Xylan hydrolysis yields xylose and xylo-oligosaccharides.
    evidence:
    - reference: DOI:10.1016/j.cbpa.2015.10.018
      notes: Cragg et al. include hemicellulose (xylan) degradation within lignocellulose
        breakdown across organisms.
    predicate_id: METPO:2000202
  - subject: carbon_catabolite_repression
    predicate: represses
    object: hemicellulase_genes
    description: CCR (HPr/CcpA) represses hemicellulase gene expression when glucose
      is available.
    evidence:
    - reference: DOI:10.1007/s00253-023-12977-4
      notes: 'Novak & Gardner 2024: carbon catabolite repression (HPr/CcpA) mediates
        glucose-dependent repression of hemicellulase expression; broad regulatory
        edge directly relevant to trait expression conditions.'
  - subject: glucuronoyl_esterase
    predicate: positively regulates
    object: xylan_saccharification
    description: CE15 glucuronoyl esterases synergistically increase xylanase saccharification
      of pretreated biomass.
    evidence:
    - reference: DOI:10.1186/s13068-025-02639-0
      notes: 'Pentari et al. 2025: CE15 glucuronoyl esterases increased saccharification
        by xylanases (57-61 uM xylose equivalents) on pretreated lignocellulose; accessory-enzyme
        synergy edge.'
  - subject: glucuronoyl_esterase
    predicate: produces
    object: aldouronic_acids
    description: CE15 glucuronoyl esterases promote GH30 glucuronoxylanase release
      of aldouronic acids.
    evidence:
    - reference: DOI:10.1186/s13068-025-02639-0
      notes: 'Pentari et al. 2025: CE15 esterases led to up to three-times higher
        release of aldouronic acids by GH30 glucuronoxylanase.'
    predicate_id: METPO:2000202
