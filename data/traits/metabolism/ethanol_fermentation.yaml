identifier: traitmech:000028
label: ethanol fermentation
definition: A fermentation in which pyruvate is decarboxylated to acetaldehyde
  (releasing CO2) and then reduced by NADH to ethanol, regenerating NAD+ for
  glycolysis. Characteristic of yeasts and the bacterium Zymomonas mobilis.
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
