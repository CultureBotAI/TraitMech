  synonym_type: RELATED_SYNONYM
  source: DOI:10.3390/molecules31020333
evidence:
- reference: DOI:10.3390/molecules31020333
  notes: Review of classical fermentations describes the alcoholic (ethanol) pathway
    in which pyruvate is decarboxylated and reduced to ethanol.
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports ethanol as an
    NADH-reoxidizing fermentation end product.
