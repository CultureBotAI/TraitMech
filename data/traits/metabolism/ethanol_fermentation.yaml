identifier: traitmech:000028
label: ethanol fermentation
definition: A fermentation in which pyruvate is decarboxylated to acetaldehyde (releasing
  CO2) and then reduced by NADH to ethanol, regenerating NAD+ for glycolysis. Characteristic
  of yeasts and the bacterium Zymomonas mobilis.
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: alcoholic fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3390/molecules31020333
evidence:
- reference: DOI:10.3390/molecules31020333
  notes: Review of classical fermentations describes the alcoholic (ethanol) pathway
    in which pyruvate is decarboxylated and reduced to ethanol.
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports ethanol as an NADH-reoxidizing
    fermentation end product.
canonical_examples:
- taxon_id: NCBITaxon:542
  taxon_label: Zymomonas mobilis
  note: "Canonical bacterial ethanologen (Entner-Doudoroff route to ethanol)."
  reference: PMID:27629544
