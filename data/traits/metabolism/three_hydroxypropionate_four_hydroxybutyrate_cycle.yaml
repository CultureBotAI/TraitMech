identifier: traitmech:000024
label: 3-hydroxypropionate/4-hydroxybutyrate cycle
definition: An autotrophic carbon-fixation pathway that fixes two molecules of
  bicarbonate per turn via 3-hydroxypropionate and 4-hydroxybutyrate intermediates.
  It operates in aerobic and microaerophilic Crenarchaeota such as Sulfolobus and
  Metallosphaera.
definition_source: DOI:10.1126/science.1149976
trait_category: METABOLISM
