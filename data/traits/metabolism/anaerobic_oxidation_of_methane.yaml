identifier: traitmech:000033
label: anaerobic oxidation of methane
definition: A metabolism in which methane is oxidized under anoxic conditions,
  classically coupled to sulfate reduction and mediated by consortia of anaerobic
  methanotrophic archaea (ANME) and sulfate-reducing bacteria. It is a major sink
  for methane in marine sediments.
definition_source: DOI:10.1038/35036572
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
