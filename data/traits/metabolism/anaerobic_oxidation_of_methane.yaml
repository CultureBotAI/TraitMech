  source: DOI:10.3389/fmars.2025.1609892
evidence:
- reference: DOI:10.1038/35036572
  notes: Boetius et al. described the marine microbial consortium of ANME archaea
    and sulfate-reducing bacteria mediating anaerobic oxidation of methane.
- reference: DOI:10.3389/fmars.2025.1609892
  notes: Review of AOM in marine sediments supports sulfate- and metal-coupled
    anaerobic methane oxidation as a major methane sink.
