identifier: traitmech:000033
label: anaerobic oxidation of methane
definition: A metabolism in which methane is oxidized under anoxic conditions, classically
  coupled to sulfate reduction and mediated by consortia of anaerobic methanotrophic
  archaea (ANME) and sulfate-reducing bacteria. It is a major sink for methane in
  marine sediments.
definition_source: DOI:10.1038/35036572
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: AOM
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/35036572
- synonym_text: anaerobic methanotrophy
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmars.2025.1609892
evidence:
- reference: DOI:10.1038/35036572
  notes: Boetius et al. described the marine microbial consortium of ANME archaea
    and sulfate-reducing bacteria mediating anaerobic oxidation of methane.
- reference: DOI:10.3389/fmars.2025.1609892
  notes: Review of AOM in marine sediments supports sulfate- and metal-coupled anaerobic
    methane oxidation as a major methane sink.
canonical_examples:
- taxon_id: NCBITaxon:1392998
  taxon_label: Candidatus Methanoperedens nitratireducens
  note: Canonical nitrate-dependent ANME archaeon performing anaerobic oxidation of
    methane (ANME-2d). Candidatus taxon (no validly published name).
  reference: https://pubmed.ncbi.nlm.nih.gov/36635574/
