      notes: Supports CO2 as substrate.
    predicate_id: biolink:participates_in
  - subject: molecular_hydrogen
    predicate: provides electrons for
    object: wood_ljungdahl_pathway
    description: Hydrogen can provide reducing equivalents for CO2 reduction.
    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: acetyl-CoA from CO or CO2 + H2
      notes: Supports H2 as an electron donor with CO2.
    predicate_id: METPO:2007402
  - subject: carbon_monoxide
    predicate: participates in
    object: wood_ljungdahl_pathway
