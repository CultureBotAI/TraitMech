    description: C1 substrate or intermediate in acetyl-CoA synthesis.
  - node_id: acetyl_coa
    label: acetyl-CoA
    node_type: CHEMICAL
    grounding: CHEBI:15351
    description: Central product of Wood-Ljungdahl carbon fixation.
  - node_id: acetate
    label: acetate
    node_type: CHEMICAL
    grounding: CHEBI:30089
    description: Sole reduced end product in homoacetogenesis.
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier conserved during acetate formation.
  - node_id: formate
    label: formate
    node_type: CHEMICAL
    description: C1 intermediate in the methyl branch of the Wood-Ljungdahl pathway.
  - node_id: formate_dehydrogenase
    label: formate dehydrogenase
    node_type: GENE_OR_PROTEIN
    description: Enzyme reducing CO2 to formate in the methyl branch.
    grounding: GO:0009326
  - node_id: formyl_thf
    label: formyl-tetrahydrofolate
    node_type: CHEMICAL
    description: Formyl-THF, the C1-loaded folate intermediate of the methyl branch.
  - node_id: formyl_thf_synthetase
    label: formyl-THF synthetase (Fhs)
    node_type: GENE_OR_PROTEIN
    description: Formate--tetrahydrofolate ligase converting formate to formyl-THF.
  - node_id: methyl_branch
    label: methyl branch of WLP
    node_type: PATHWAY
    description: Eastern/methyl branch generating the methyl group of acetyl-CoA.
  - node_id: carbonyl_branch
    label: carbonyl branch of WLP
    node_type: PATHWAY
    description: Western/carbonyl branch generating the carbonyl group via CO.
  - node_id: acs_codh_complex
    label: ACS/CODH complex
    node_type: GENE_OR_PROTEIN
    description: Acetyl-CoA synthase / CO dehydrogenase complex where the two WLP
