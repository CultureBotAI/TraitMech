    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: acetyl-CoA from CO or CO2 + H2
      notes: Supports CO as substrate or intermediate.
    predicate_id: biolink:participates_in
  - subject: wood_ljungdahl_pathway
    predicate: has output
    object: acetyl_coa
    description: Wood-Ljungdahl carbon fixation produces acetyl-CoA.
