  - node_id: acetate_kinase
    label: acetate kinase
    node_type: GENE_OR_PROTEIN
    description: Enzyme generating ATP by substrate-level phosphorylation during acetate
      formation.
    grounding: GO:0008776
  - node_id: substrate_level_phosphorylation
    label: substrate-level phosphorylation
    node_type: BIOLOGICAL_PROCESS
    description: ATP-generating phosphoryl transfer at acetate kinase in the WLP.
  - node_id: energy_conservation_module
    label: membrane energy-conservation module (Rnf/Ech)
    node_type: GENE_OR_PROTEIN
    description: Membrane-associated Rnf or Ech complex translocating ions to build
      the transmembrane gradient.
  - node_id: transmembrane_ion_gradient
    label: transmembrane ion gradient
    node_type: BIOLOGICAL_PROCESS
    description: Na+/H+ electrochemical gradient driving ATP synthase during acetogenesis.
  - node_id: atp_synthase
    label: ATP synthase
    node_type: GENE_OR_PROTEIN
    description: Membrane enzyme using the ion gradient to synthesize ATP.
