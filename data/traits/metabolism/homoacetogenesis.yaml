identifier: METPO:1000846
label: Homoacetogenesis
definition: A metabolism in which acetate is produced as the sole reduced end product
  from reduction of CO2 via the acetyl-CoA pathway.
definition_source: DOI:10.1016/j.tibtech.2019.05.008
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: Reductive acetyl-CoA pathway
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: Wood-Ljungdahl pathway
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/j.tibtech.2019.05.008
  snippet: two mol of carbon dioxide are reduced to one mol of acetyl-CoA
  notes: Review supports Wood-Ljungdahl reduction of CO2 to acetyl-CoA and acetate.
- reference: DOI:10.1016/j.bbapap.2008.08.012
  snippet: Wood-Ljungdahl Pathway of CO2 Fixation
  notes: Review supports acetogens using the Wood-Ljungdahl pathway for CO2 fixation.
canonical_examples:
- taxon_id: NCBITaxon:33952
  taxon_label: Acetobacterium woodii
  note: Model homoacetogen; reduces CO2 to acetate via the Wood-Ljungdahl pathway
    (Rnf bioenergetics model).
  reference: PMID:22479398
causal_graphs:
- graph_id: homoacetogenesis_wood_ljungdahl_acetate
  title: Homoacetogenesis Wood-Ljungdahl acetate mechanism
  description: DOI-backed graph linking anaerobic CO2 reduction, hydrogen/CO inputs,
    acetyl-CoA synthesis, and acetate as the sole reduced product.
  nodes:
  - node_id: homoacetogenesis_trait
