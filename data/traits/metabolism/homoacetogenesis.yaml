    - reference: DOI:10.1016/j.tibtech.2019.05.008
      snippet: reduced to one mol of acetyl-CoA
      notes: Supports acetyl-CoA synthesis from CO2.
    predicate_id: RO:0002234
  - subject: acetyl_coa
    predicate: converted to
    object: acetate
    description: Acetyl-CoA is converted to acetate as the reduced product.
    evidence:
    - reference: DOI:10.1016/j.tibtech.2019.05.008
      snippet: further to acetate
      notes: Supports acetate formation downstream of acetyl-CoA.
  - subject: homoacetogenesis_trait
    predicate: produces
    object: acetate
    description: Homoacetogenesis produces acetate as the sole reduced end product.
    evidence:
    - reference: DOI:10.1023/A:1020514617738
      snippet: reduce CO2 to acetate
      notes: Supports acetate as the defining acetogenic product.
    predicate_id: METPO:2007800
  - subject: acetyl_coa
    predicate: supports formation of
    object: atp
    description: Conversion to acetate can conserve energy as ATP.
    evidence:
    - reference: DOI:10.1016/j.tibtech.2019.05.008
      snippet: further to acetate
      notes: Review discusses acetate formation as the energy-conserving product branch.
  - subject: carbon_dioxide
    predicate: reduced by enzyme to
    object: formate
    description: CO2 is reduced to formate by formate dehydrogenase in the methyl
      branch.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: CO2 to formate catalyzed by formate dehydrogenase (Fdh); core WLP methyl-branch
        step.
  - subject: formate_dehydrogenase
    predicate: catalyzes
    object: formate
    description: Formate dehydrogenase produces formate from CO2.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: CO2 -> formate catalyzed by formate dehydrogenase (Fdh).
    predicate_id: biolink:catalyzes
  - subject: formate
    predicate: converted by enzyme to
    object: formyl_thf
    description: Formate is converted to formyl-THF by formyl-THF synthetase.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: formate -> formyl-THF by formyl-THF synthetase (Fhs); methyl-branch step.
  - subject: formyl_thf_synthetase
    predicate: catalyzes
    object: formyl_thf
    description: Formyl-THF synthetase (Fhs) forms formyl-THF from formate.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: formate -> formyl-THF by formyl-THF synthetase (Fhs).
    predicate_id: biolink:catalyzes
  - subject: methyl_branch
    predicate: converges with
    object: carbonyl_branch
    description: The methyl and carbonyl branches of the WLP converge at the ACS/CODH
      complex.
    evidence:
    - reference: DOI:10.1186/s13068-024-02554-w
      notes: eastern/methyl branch and carbonyl/western branch meet at the acetyl-CoA
        synthase/carbon monoxide dehydrogenase complex (ACS/CODH); canonical WLP architecture.
  - subject: acs_codh_complex
    predicate: produces
    object: acetyl_coa
    description: The ACS/CODH complex condenses the methyl and carbonyl groups into
      acetyl-CoA.
    evidence:
    - reference: DOI:10.1186/s13068-024-02554-w
      notes: the two WLP branches meet at the ACS/CODH complex to form acetyl-CoA.
    predicate_id: METPO:2007800
  - subject: acetate_kinase
    predicate: generates
    object: atp
    description: Acetate kinase generates ATP by substrate-level phosphorylation during
      acetate formation, the only WLP ATP-yielding step.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: acetyl-CoA -> acetate via acetyl-phosphate with ATP from substrate-level
        phosphorylation (acetate kinase); WLP is otherwise net-zero ATP.
    predicate_id: biolink:produces
  - subject: acetate_kinase
    predicate: participates in
    object: substrate_level_phosphorylation
    description: Acetate kinase mediates substrate-level phosphorylation in the acetate
      branch.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: ATP from substrate-level phosphorylation at acetate kinase.
    predicate_id: biolink:participates_in
  - subject: energy_conservation_module
    predicate: generates
    object: transmembrane_ion_gradient
    description: The membrane Rnf or Ech module translocates Na+/H+ to generate the
      transmembrane ion gradient.
    evidence:
    - reference: DOI:10.1039/d4cb00099d
      notes: Rnf transfers electrons from Fdred to NAD+ while translocating Na+/H+;
        Ech acts as Fd:H+ oxidoreductase.
    - reference: DOI:10.3389/fmicb.2023.1185739
      notes: membrane-associated energy-conservation module involving Rnf or Ech plus
        ATP synthase.
    predicate_id: biolink:produces
  - subject: transmembrane_ion_gradient
    predicate: drives
    object: atp_synthase
    description: The transmembrane ion gradient drives ATP synthase to conserve energy
      during acetogenesis.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1185739
      notes: membrane-associated energy-conservation module ... plus ATP synthase.
  - subject: atp_synthase
    predicate: produces
    object: atp
    description: ATP synthase produces ATP from the ion gradient, conserving energy
      in the near-thermodynamic-limit acetogenic metabolism.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1185739
      notes: ATP synthase couples the ion gradient to ATP synthesis in acetogens.
    predicate_id: METPO:2007800
