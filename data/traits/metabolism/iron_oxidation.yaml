identifier: traitmech:000107
label: iron oxidation
definition: A metabolism in which an organism oxidizes ferrous iron (Fe2+) to ferric
  iron (Fe3+) to conserve energy, at acidic or circumneutral pH and under aerobic
  or anaerobic conditions.
definition_source: DOI:10.1146/annurev.micro.112408.134208
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: ferrous iron oxidation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev.micro.112408.134208
evidence:
- reference: DOI:10.1146/annurev.micro.112408.134208
  notes: Emerson, Fleming & McBeth review iron-oxidizing bacteria from an environmental
    and genomic perspective.
- reference: DOI:10.1099/mic.0.045344-0
  notes: Hedrich, Schlomann & Johnson review the iron-oxidizing proteobacteria and
    their energy metabolism.
canonical_examples:
- taxon_id: NCBITaxon:180
  taxon_label: Leptospirillum ferrooxidans
  note: Acidophilic Fe(II) oxidiser (bioleaching/AMD). Gallionella ferruginea is the
    neutrophilic stalk-forming Fe oxidiser.
  reference: PMID:22815442
- taxon_id: NCBITaxon:243159
  taxon_label: Acidithiobacillus ferrooxidans ATCC 23270
  note: Reference acidophilic iron oxidizer in which the Cyc2-containing trans-envelope
    supercomplex was purified and shown to carry iron-oxidase activity.
  reference: DOI:10.1074/jbc.M802496200
causal_graphs:
- graph_id: iron_oxidation_ferrous_to_ferric
  title: Ferrous iron oxidation for energy
  description: Evidence-backed causal sketch linking the iron-oxidation trait to oxidation
    of ferrous iron to ferric iron for energy conservation.
  scope_status: MECHANISTIC
  scope_notes: This is a cross-taxon iron-oxidation graph. The A. ferrooxidans Cyc2
    example supports the acidophilic Cyc2 branch; cbb3, bd, and multiheme proteins
    represent lineage- and condition-specific alternatives and are not universal markers.
  nodes:
  - node_id: iron_oxidation_trait
    label: iron oxidation
    node_type: TRAIT
    grounding: traitmech:000107
    description: Capacity to oxidize Fe(II) to Fe(III) for energy.
  - node_id: ferrous_iron
    label: ferrous iron
    node_type: CHEMICAL
    grounding: CHEBI:29033
    description: Fe(2+) electron-donor substrate.
  - node_id: ferric_iron
    label: ferric iron
    node_type: CHEMICAL
    grounding: CHEBI:29034
    description: Fe(3+) oxidized product.
  - node_id: cyc2
    label: Cyc2
    node_type: GENE_OR_PROTEIN
    description: Outer-membrane cytochrome c that extracts electrons from extracellular
      Fe(II); the central iron oxidase across many FeOB.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Cyc2 homologs fall into functionally heterogeneous phylogenetic
      clusters, and no exact checked GO or InterPro term distinguishes the experimentally
      supported iron-oxidase class represented here.
    protein_examples:
    - uniprot_id: UniProtKB:B7JAQ7
      protein_label: Cytochrome c
      gene_symbol: cyc2
      taxon_id: NCBITaxon:243159
      taxon_label: Acidithiobacillus ferrooxidans ATCC 23270
      entry_status: UNREVIEWED
      proteome_id: UP000001362
      retrieved_on: '2026-08-24'
      entry_version: 60
      sequence_version: 1
      role: Outer-membrane Cyc2 component of the iron-oxidizing/O2-reducing supercomplex
        in A. ferrooxidans ATCC 23270.
      evidence:
      - reference: DOI:10.1074/jbc.M802496200
        snippet: outer membrane-bound cytochrome c Cyc2 was purified
        notes: The primary biochemical study reports iron-oxidase activity and electron
          transfer through Cyc2 in the isolated trans-envelope supercomplex; UniProtKB
          B7JAQ7 is the strain's cyc2 reference-proteome entry.
  - node_id: cbb3_oxidase
    label: cbb3-type terminal oxidase
    node_type: GENE_OR_PROTEIN
    description: High-oxygen-affinity terminal oxidase used by FeOB.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This label denotes a multisubunit cbb3 terminal-oxidase complex
      across FeOB lineages; exact subunit composition and taxon are not fixed here.
  - node_id: bd_oxidase
    label: cytochrome bd-type terminal oxidase
    node_type: GENE_OR_PROTEIN
    description: High-oxygen-affinity terminal oxidase used by FeOB.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This label denotes a multisubunit cytochrome-bd terminal oxidase
      across lineages; the graph does not identify a specific complex composition.
  - node_id: microaerobic_conditions
    label: microaerobic conditions
    node_type: ENVIRONMENTAL_FACTOR
    description: Low-oxygen environmental niche favored by FeOB.
  - node_id: low_oxygen_organic_rich
    label: low-oxygen organic-rich niche
    node_type: ENVIRONMENTAL_FACTOR
    description: Low-O2, organic-rich environmental niche.
  - node_id: nitrite_no
    label: nitrite and nitric oxide
    node_type: CHEMICAL
    description: Reactive nitrogen species that bind hemes and abiotically oxidize
      Fe(II).
  - node_id: enzymatic_iron_oxidation
    label: enzymatic iron oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Biological Fe(II) oxidation catalyzed by cytochromes.
  - node_id: multiheme_cytochromes
    label: multiheme c-type cytochromes
    node_type: GENE_OR_PROTEIN
    description: FeOB-enriched multiheme cytochromes conducting electrons across long
      distances and wide redox-potential ranges.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Multiheme c-type cytochromes comprise many non-equivalent families
      and heme architectures; the cited graph claim does not resolve one exact family.
  - node_id: extracellular_electron_transfer
    label: extracellular electron transfer
    node_type: BIOLOGICAL_PROCESS
    description: Electron transfer across minerals and long distances, expanding usable
      iron substrates.
  edges:
  - subject: iron_oxidation_trait
    predicate: oxidizes
    object: ferrous_iron
    description: Iron oxidizers oxidize ferrous iron as an electron donor.
    evidence:
    - reference: DOI:10.1146/annurev.micro.112408.134208
      notes: Emerson et al. review iron-oxidizing bacteria that use Fe(II) for energy.
    predicate_id: METPO:2007803
  - subject: iron_oxidation_trait
    predicate: produces
    object: ferric_iron
    description: Ferrous-iron oxidation yields ferric iron.
    evidence:
    - reference: DOI:10.1099/mic.0.045344-0
      notes: Hedrich et al. describe Fe(II) to Fe(III) oxidation by iron-oxidizing
        proteobacteria.
    predicate_id: METPO:2007800
  - subject: cyc2
    predicate: oxidizes
    object: ferrous_iron
    description: The outer-membrane cytochrome Cyc2 extracts electrons from extracellular
      Fe(II).
    evidence:
    - reference: DOI:10.1128/mSystems.00720-23
      notes: '"electrons are initially extracted from extracellular Fe(II) by the
        outer membrane cytochrome c Cyc2"; Cyc2 also validated in neutrophiles.'
    predicate_id: METPO:2007803
  - subject: cbb3_oxidase
    predicate: supports growth in
    object: microaerobic_conditions
    description: High-O2-affinity cbb3 oxidase enables FeOB growth under microaerobic
      conditions.
    evidence:
    - reference: DOI:10.1128/AEM.00599-24
      notes: '"These terminal oxidases have high affinity for oxygen and therefore
        are widely understood to be used under microaerobic conditions"; consistent
        with FeOB ecology.'
  - subject: bd_oxidase
    predicate: supports growth in
    object: low_oxygen_organic_rich
    description: High-O2-affinity cytochrome bd oxidase supports FeOB growth in low-oxygen,
      organic-rich niches.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      notes: '"cytochrome bd-type oxidases have a high affinity for oxygen ... can
        be more highly expressed ... under low-oxygen, organic-rich conditions".'
  - subject: nitrite_no
    predicate: negatively regulates
    object: enzymatic_iron_oxidation
    description: Nitrite and NO bind hemes inhibiting cytochromes and abiotically
      oxidize Fe(II), competing with enzymatic iron oxidation.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      notes: '"they bind to hemes, inhibiting the activity of cytochromes, and also
        directly oxidize Fe(II), thus competing with enzymatic iron oxidation".'
    predicate_id: RO:0002212
  - subject: multiheme_cytochromes
    predicate: enables
    object: extracellular_electron_transfer
    description: FeOB multiheme cytochromes conduct electrons across long distances
      and broad redox potentials, enabling extracellular electron transfer.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      notes: '"MHCs efficiently conduct electrons across longer distances and function
        across a wide range of redox potentials ... which can expand the range of
        usable iron substrates".'
    predicate_id: RO:0002327
  - subject: cbb3_oxidase
    predicate: contributes to
    object: iron_oxidation_trait
    description: High-affinity terminal oxidation supports iron-oxidizer respiration
      in microaerobic niches.
    evidence:
    - reference: DOI:10.1128/AEM.00599-24
      snippet: These terminal oxidases have high affinity for oxygen and therefore
        are widely understood to be used under microaerobic conditions
      notes: Verified against the free public article text.
    predicate_id: RO:0002326
  - subject: low_oxygen_organic_rich
    predicate: example of
    object: microaerobic_conditions
    description: A low-oxygen, organic-rich setting is a specific microaerobic condition.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      snippet: bd-type oxidases have a high affinity for oxygen, and recent studies
        show they can be more highly expressed than cbb3-type oxidases under low-oxygen,
        organic-rich conditions
      notes: Verified against the free public article text.
    predicate_id: rdfs:subClassOf
  - subject: enzymatic_iron_oxidation
    predicate: contributes to
    object: iron_oxidation_trait
    description: Enzymatic Fe(II) oxidation realizes the biological iron-oxidation
      capacity.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      snippet: they bind to hemes, inhibiting the activity of cytochromes, and also
        directly oxidize Fe(II), thus competing with enzymatic iron oxidation
      notes: Verified against the free public article text.
    predicate_id: RO:0002326
  - subject: extracellular_electron_transfer
    predicate: contributes to
    object: iron_oxidation_trait
    description: Extracellular electron uptake extends iron oxidation across mineral
      substrates.
    evidence:
    - reference: DOI:10.1128/mSystems.00038-23
      snippet: multiheme cytochromes (MHCs) in Gallionellaceae FeOB, which may facilitate
        extracellular electron uptake and the oxidation of different iron substrates
      notes: Verified against the free public article text.
    predicate_id: RO:0002326
