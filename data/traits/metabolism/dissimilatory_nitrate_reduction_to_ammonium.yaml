identifier: traitmech:000030
label: dissimilatory nitrate reduction to ammonium
definition: An anaerobic respiratory metabolism in which nitrate is reduced via
  nitrite to ammonium (rather than to N2), conserving fixed nitrogen within the
  ecosystem. It is favored over denitrification under nitrate-limited,
  high-electron-donor conditions.
definition_source: DOI:10.1126/science.1254070
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
