identifier: traitmech:000030
label: dissimilatory nitrate reduction to ammonium
definition: An anaerobic respiratory metabolism in which nitrate is reduced via nitrite
  to ammonium (rather than to N2), conserving fixed nitrogen within the ecosystem.
  It is favored over denitrification under nitrate-limited, high-electron-donor conditions.
definition_source: DOI:10.1126/science.1254070
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: DNRA
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.1254070
- synonym_text: nitrate ammonification
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1007/s11157-025-09719-5
evidence:
- reference: DOI:10.1126/science.1254070
  notes: Kraft et al. show the donor-to-acceptor ratio governs whether nitrate respiration
    ends in ammonium (DNRA) or N2 (denitrification).
- reference: DOI:10.1007/s11157-025-09719-5
  notes: Review of DNRA vs denitrification supports DNRA's competitive advantage and
    nitrogen-retaining role under nitrate-limited conditions.
canonical_examples:
- taxon_id: NCBITaxon:844
  taxon_label: Wolinella succinogenes
  note: Model organism for respiratory dissimilatory nitrate/nitrite reduction to
    ammonium (DNRA).
  reference: DOI:10.1073/pnas.1932838100
- taxon_id: NCBITaxon:273121
  taxon_label: Wolinella succinogenes ATCC 29543
  note: Strain-level source of the structurally characterized NrfA cytochrome c nitrite
    reductase and the matching reviewed UniProt example.
  reference: DOI:10.1074/jbc.M006188200
causal_graphs:
- graph_id: dnra_nitrate_to_ammonium
  title: DNRA reduces nitrate to ammonium, conserving fixed nitrogen
  description: Evidence-backed causal sketch linking nitrate respiration ending in
    ammonium to nitrogen retention under high donor-to-acceptor ratios.
  scope_status: MECHANISTIC
  scope_notes: Represents the canonical Nar/Nrf DNRA route and illustrates its nitrite-to-ammonium
    step with W. succinogenes NrfA. Regulatory details are broader bacterial modules
    and are not asserted to be identical in every DNRA organism.
  nodes:
