  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/science.1254070
- synonym_text: nitrate ammonification
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1007/s11157-025-09719-5
evidence:
- reference: DOI:10.1126/science.1254070
  notes: Kraft et al. show the donor-to-acceptor ratio governs whether nitrate
    respiration ends in ammonium (DNRA) or N2 (denitrification).
- reference: DOI:10.1007/s11157-025-09719-5
  notes: Review of DNRA vs denitrification supports DNRA's competitive advantage and
    nitrogen-retaining role under nitrate-limited conditions.
