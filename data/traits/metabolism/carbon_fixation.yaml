  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.02473-10
- synonym_text: autotrophic carbon assimilation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev-marine-120709-142712
evidence:
- reference: DOI:10.1128/AEM.02473-10
  notes: Berg review of the distribution of autotrophic CO2-fixation pathways
    establishes that, besides the Calvin-Benson-Bassham cycle, five further
    autotrophic carbon-fixation pathways are known, parent of the six pathway
    sub-variants proposed here.
- reference: DOI:10.1146/annurev-marine-120709-142712
  notes: Hügler & Sievert, "Beyond the Calvin cycle", supports multiple autotrophic
    carbon-fixation pathways operating among ocean microorganisms.
