identifier: traitmech:000029
label: propionic acid fermentation
definition: A fermentation that produces propionate (with acetate and CO2) from sugars
  or lactate, typically via the Wood-Werkman (methylmalonyl-CoA) pathway. Characteristic
  of propionibacteria (e.g. Propionibacterium freudenreichii).
definition_source: DOI:10.3390/molecules31020333
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: propionate fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3390/molecules31020333
evidence:
- reference: DOI:10.3390/molecules31020333
  notes: Review of classical fermentations describes propionic acid fermentation (acetic
    acid, propionic acid, CO2) and propionibacteria as its agents, including the Wood-Werkman
    route.
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports propionate formation
    as a redox-balancing, energy-conserving fermentation route.
canonical_examples:
- taxon_id: NCBITaxon:1744
  taxon_label: Propionibacterium freudenreichii
  note: "Canonical propionic-acid fermenter (Swiss-cheese eyes and flavour)."
  reference: PMID:21620505
