evidence:
- reference: DOI:10.3390/molecules31020333
  notes: Review of classical fermentations describes propionic acid fermentation (acetic
    acid, propionic acid, CO2) and propionibacteria as its agents, including the Wood-Werkman
    route.
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of fermentative energy conservation supports propionate formation
    as a redox-balancing, energy-conserving fermentation route.
