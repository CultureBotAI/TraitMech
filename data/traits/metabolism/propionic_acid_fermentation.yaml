identifier: traitmech:000029
label: propionic acid fermentation
definition: A fermentation that produces propionate (with acetate and CO2) from sugars
  or lactate, typically via the Wood-Werkman (methylmalonyl-CoA) pathway. Characteristic
  of propionibacteria (e.g. Propionibacterium freudenreichii).
definition_source: DOI:10.3390/molecules31020333
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
