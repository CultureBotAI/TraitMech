identifier: traitmech:000187
label: complete ammonia oxidation
definition: A nitrification metabolism in which a single organism oxidizes ammonia
  via nitrite to nitrate.
definition_source: DOI:10.1038/nature16459
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1005001
synonyms:
- synonym_text: comammox
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nature16459
evidence:
- reference: DOI:10.1038/nature16459
  snippet: Complete oxidation of ammonia to nitrate in one organism (complete ammonia
    oxidation; comammox) is energetically feasible
  notes: van Kessel et al. define complete ammonia oxidation, or comammox, as oxidation
    of ammonia to nitrate in a single organism.
- reference: DOI:10.1038/nature16461
  snippet: Here we report on the discovery and cultivation of a completely nitrifying
    bacterium from the genus Nitrospira, a globally distributed group of nitrite oxidizers.
  notes: Daims et al. independently demonstrated complete nitrification in a single
    Nitrospira organism.
- reference: DOI:10.1128/aem.01698-23
  snippet: The dominance of Nitrospira sp. BO4 could be explained by the ability of
    comammox to generate more energy through the complete oxidation of ammonia to
    nitrate
  notes: Ghimire-Kafle et al. support the same ammonia-to-nitrate scope in a freshwater
    complete-ammonia-oxidizing Nitrospira enrichment.
- reference: DOI:10.1038/nature16461
  snippet: The genome of this chemolithoautotrophic organism encodes the pathways
    both for ammonia and nitrite oxidation, which are concomitantly activated during
    growth by ammonia oxidation to nitrate. Genes affiliated with the phylogenetically
    distinct ammonia monooxygenase and hydroxylamine dehydrogenase genes of Nitrospira
    are present in many environments and were retrieved on Nitrospira-contigs in new
    metagenomes from engineered systems.
  notes: Daims et al. show that Candidatus Nitrospira inopinata encodes and concomitantly
    activates the phylogenetically distinct ammonia monooxygenase (AmoCAB; AmoA UniProtKB:A0A0S4KUL9)
    and hydroxylamine/nitrite oxidation pathways during complete ammonia oxidation
    to nitrate.
canonical_examples:
- taxon_id: NCBITaxon:1715989
  taxon_label: Candidatus Nitrospira inopinata
  note: Daims et al. cultivated and physiologically characterized Candidatus Nitrospira
    inopinata as a complete nitrifier.
  reference: DOI:10.1038/nature16461
