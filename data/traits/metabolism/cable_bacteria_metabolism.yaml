identifier: METPO:1002003
label: Cable bacteria metabolism
definition: A metabolism in which electrons are transferred over centimeter-scale
  distances through multicellular filaments.
definition_source: DOI:10.1073/pnas.1800367115
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
evidence:
- reference: DOI:10.1073/pnas.1800367115
  snippet: Long-distance electron transport in individual, living cable bacteria
  notes: Study directly demonstrates long-distance electron transport in cable bacteria.
- reference: DOI:10.3389/fmars.2017.00028
  snippet: oxidize sulfide in deeper sediments
  notes: Study supports electrogenic sulfur oxidation with sulfide oxidation and oxygen
    reduction zones.
canonical_examples:
- taxon_id: NCBITaxon:1859128
  taxon_label: Candidatus Electrothrix
  note: Marine cable bacteria conducting electrons over centimetre distances along
    filaments (long-distance electron transport).
  reference: DOI:10.1016/j.syapm.2016.05.006
- taxon_id: NCBITaxon:2005002
  taxon_label: Candidatus Electronema aureum
  note: Freshwater cable bacterium strain GS with a closed genome, electrogenic sulfur
    oxidation physiology, and expressed dissimilatory sulfur-metabolism machinery.
  reference: DOI:10.1016/j.syapm.2021.126236
causal_graphs:
- graph_id: cable_bacteria_long_distance_electron_transport
  title: Cable bacteria long-distance electron transport
  description: DOI-backed graph linking sulfide oxidation, conductive multicellular
    filaments, centimeter-scale electron transport, and oxygen reduction.
  scope_status: MECHANISTIC
  scope_notes: The long-distance electron-transport mechanism is experimentally established.
    DsrAB is included as an expressed E. aureum sulfur-metabolism complex, but its
    precise reaction direction and causal position in electrogenic sulfur oxidation
    remain genomic/transcriptomic inferences. No protein identity is assigned to the
    conductive fibers.
