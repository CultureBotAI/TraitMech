  - subject: nickel_cofactor
    predicate: mediates
    object: long_distance_electron_transport
    description: The nickel cofactor supports/mediates long-range electron transport.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1208033
      notes: Authors link a "Ni-based, long-range electron transport pathway" to the
        cofactor; orientation-dependent Raman aligns cofactor with electron path.
  - subject: long_distance_electron_transport
    predicate: maintains
    object: cytochrome_redox_gradient
    description: An intact electrical connection along the filament maintains the
      cytochrome redox gradient.
    evidence:
    - reference: DOI:10.1073/pnas.1800367115
      notes: A redox gradient along filaments immediately broke down upon removal
        of oxygen or laser cutting, showing dependence on intact long-distance transport.
  - subject: dsrab_complex
    predicate: part of
    object: sulfur_oxidation_pathway
    description: DsrAB is an expressed component of the predicted sulfur-metabolism
      repertoire associated with electrogenic sulfur oxidation in cable bacteria.
    evidence:
    - reference: DOI:10.1186/s12864-026-12675-1
      snippet: Transcriptomic and proteomic reanalyses confirm expression of this
        full repertoire
      notes: This edge records complex membership and expression, not a proven reaction
        direction; the source explicitly leaves central aspects of cable-bacterium
        sulfur metabolism unresolved.
    predicate_id: biolink:part_of
  - subject: sulfur_oxidation_pathway
    predicate: supports
    object: electrogenic_sulfur_oxidation
    description: The Dsr-Apr-Qmo-Sqr-Psr/Phs pathway supports sulfide oxidation metabolism.
    evidence:
    - reference: DOI:10.1186/s12864-024-10594-7
      notes: Comparative genomics predicts sulfur oxidation through a Dsr-Apr-Qmo-Sqr-Psr/Phs
        pathway with DsrMKJOPG across closed genomes.
