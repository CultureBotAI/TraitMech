evidence:
- reference: DOI:10.1073/pnas.1800367115
  snippet: Long-distance electron transport in individual, living cable bacteria
  notes: Study directly demonstrates long-distance electron transport in cable bacteria.
- reference: DOI:10.3389/fmars.2017.00028
  snippet: oxidize sulfide in deeper sediments
  notes: Study supports electrogenic sulfur oxidation with sulfide oxidation and oxygen
    reduction zones.
