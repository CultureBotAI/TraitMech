identifier: METPO:1000845
label: Acetogenesis
definition: A metabolism that produces acetate as the primary end product through
  the reduction of carbon dioxide or other carbon compounds using the Wood-Ljungdahl
  pathway, typically performed by acetogenic bacteria under anaerobic conditions.
definition_source: DOI:10.1016/j.bbapap.2008.08.012
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: Acetate fermentation
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1016/j.bbapap.2008.08.012
  snippet: Acetogenesis and the Wood-Ljungdahl Pathway of CO2 Fixation
  notes: Review supports acetogenesis via the Wood-Ljungdahl CO2-fixation pathway.
- reference: DOI:10.1196/annals.1419.015
  snippet: convert carbon dioxide and CO into acetyl-CoA
  notes: Supports acetyl-CoA formation from CO2 and CO in acetogens.
canonical_examples:
- taxon_id: NCBITaxon:1525
  taxon_label: Neomoorella thermoacetica
  note: "THE model acetogen used to elucidate the Wood-Ljungdahl pathway (formerly Moorella/Clostridium thermoaceticum). Acetobacterium woodii is the modern bioenergetics model."
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC4599090/
causal_graphs:
