  edges:
  - subject: acetogenesis_trait
    predicate: occurs in
    object: anaerobic_condition
    description: Acetogenesis is typically an anaerobic metabolism.
    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: grow organisms and work with enzymes under strictly oxygen-free conditions
      notes: Review emphasizes oxygen-free handling for acetogenic enzymes and organisms.
    predicate_id: biolink:occurs_in
  - subject: acetogenesis_trait
    predicate: has mechanistic pathway
    object: wood_ljungdahl_pathway
    description: The Wood-Ljungdahl pathway is the central acetogenic carbon-fixation
      route.
    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: Wood-Ljungdahl Pathway of CO2 Fixation
      notes: Review title and scope support pathway assignment.
  - subject: carbon_dioxide
    predicate: participates in
    object: wood_ljungdahl_pathway
    description: Carbon dioxide is fixed through the Wood-Ljungdahl pathway.
    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: CO2 Fixation
      notes: Supports CO2 as a pathway substrate.
    predicate_id: biolink:participates_in
  - subject: carbon_monoxide
    predicate: participates in
    object: wood_ljungdahl_pathway
    description: Carbon monoxide can be converted through the acetogenic pathway.
    evidence:
    - reference: DOI:10.1196/annals.1419.015
      snippet: convert carbon dioxide and CO into acetyl-CoA
      notes: Supports CO as a substrate for acetogenic acetyl-CoA synthesis.
    predicate_id: biolink:participates_in
  - subject: wood_ljungdahl_pathway
    predicate: has output
    object: acetyl_coa
    description: The Wood-Ljungdahl pathway synthesizes acetyl-CoA.
    evidence:
    - reference: DOI:10.1196/annals.1419.015
      snippet: convert carbon dioxide and CO into acetyl-CoA
      notes: Supports acetyl-CoA as pathway product.
    predicate_id: RO:0002234
  - subject: acetyl_coa
    predicate: precursor of
    object: acetate
    description: Acetyl-CoA is converted onward to acetate in acetogenesis.
    evidence:
    - reference: DOI:10.1016/j.bbapap.2008.08.012
      snippet: Energy metabolism associated with acetogenesis
      notes: Review discusses acetogenic energy metabolism downstream of acetyl-CoA
        synthesis.
  - subject: carbon_dioxide
    predicate: is converted to
    object: formate
    description: CO2 is reduced to formate by formate dehydrogenase / HDCR, the first
      methyl-branch step.
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: FDH reduces CO2 to formate; HDCR catalyzes hydrogen-dependent CO2 reduction
        to formate (methyl-branch core step).
  - subject: formate
    predicate: is converted to
    object: formyl_thf
    description: Formate is condensed onto tetrahydrofolate by formyl-THF synthetase
      (Fhs).
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: FTS (formyl-THF synthetase) converts formate to formyl-THF consuming
        1 ATP; canonical WLP methyl-branch step.
  - subject: formyl_thf
    predicate: is converted to
    object: methylene_thf
    description: Formyl-THF is processed by cyclohydrolase and methylene-THF dehydrogenase
      (FolD) to methylene-THF.
    evidence:
    - reference: DOI:10.34726/hss.2024.114566
      notes: 5,10-methenyl-THF cyclohydrolase and NAD-dependent 5,10-methylene-THF
        dehydrogenase convert formyl-THF to methylene-THF.
  - subject: methylene_thf
    predicate: is converted to
    object: methyl_thf
    description: Methylene-THF is reduced to methyl-THF by methylene-THF reductase
      (MTHFR).
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: MTHFR reduces methenyl-THF to methylene-THF to methyl-THF; common acetogen
        methyl-branch step.
  - subject: carbon_dioxide
    predicate: is converted to
    object: carbon_monoxide
    description: CO2 is reduced to CO by carbon monoxide dehydrogenase (CODH) in the
      carbonyl branch.
    evidence:
    - reference: DOI:10.34726/hss.2024.114566
      notes: In the carbonyl branch CODH reduces CO2 to CO; central carbonyl-branch
        step.
  - subject: acetyl_coa
    predicate: is converted to
    object: acetyl_phosphate
    description: Acetyl-CoA is converted to acetyl phosphate by phosphotransacetylase
      (PTA).
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: PTA and ACK convert acetyl-CoA to acetate; PTA yields acetyl phosphate.
  - subject: acetyl_phosphate
    predicate: is converted to
    object: acetate
    description: Acetyl phosphate is converted to acetate by acetate kinase (ACK),
      yielding ATP by substrate-level phosphorylation.
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: ACK (acetate kinase) converts acetyl-phosphate to acetate, yielding ATP
        via SLP; trait-defining end-product step.
  - subject: acetyl_phosphate
    predicate: produces
    object: atp
    description: The acetate kinase step generates ATP via substrate-level phosphorylation.
    evidence:
    - reference: DOI:10.3389/fbioe.2024.1395540
      notes: ACK convert acetyl-phosphate to acetate, yielding ATP via SLP.
    predicate_id: METPO:2000202
