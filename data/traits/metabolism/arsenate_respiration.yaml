  rationale: The record's primary literature (DOI:10.1073/pnas.1834303100, DOI:10.1128/AEM.69.5.2800-2809.2003,
    DOI:10.1128/JB.01110-07) supports respiratory arsenate reduction to arsenite via
    arsenate respiratory reductase (ARR) in Shewanella sp. ANA-3 (NCBITaxon:94122),
    but verified UniProtKB accessions and proteome metadata must be added to a GENE_OR_PROTEIN
    node before marking the graph MECHANISTIC.
  posed_by: claude
  posed_date: '2026-10-23'
  evidence:
