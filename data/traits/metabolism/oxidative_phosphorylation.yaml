  snippet: phosphorylation to electron and hydrogen transfer
  notes: Mitchell's chemiosmotic proposal supports coupling electron transfer to phosphorylation.
- reference: DOI:10.1038/s41598-019-38564-0
  snippet: energized by the proton motive force
  notes: Supports proton motive force-driven ATP synthesis by F1Fo ATP synthase.
