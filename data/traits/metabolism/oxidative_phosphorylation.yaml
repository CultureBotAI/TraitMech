      notes: Supports respiratory chain generation of pmf.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: regulates
    object: atp_synthase
    description: Proton motive force energizes F1Fo ATP synthase.
    evidence:
    - reference: DOI:10.1038/s41598-019-38564-0
      snippet: energized by the proton motive force
      notes: Supports pmf-driven ATP synthase.
    predicate_id: RO:0002211
  - subject: atp_synthase
    predicate: produces
    object: atp
    description: ATP synthase synthesizes ATP from ADP and phosphate.
    evidence:
    - reference: DOI:10.1007/BF01923429
      snippet: synthesis of ATP is also driven by a proton motive force
      notes: ATP synthase review supports pmf-driven ATP synthesis.
    predicate_id: METPO:2007800
  - subject: nadh
    predicate: is oxidized by
    object: complex_i
    description: Complex I oxidizes NADH at the respiratory chain entry point.
    evidence:
    - reference: DOI:10.3390/ijms252413421
      snippet: Proton-translocating NADH–ubiquinone oxidoreductase (complex I) catalyzes
        the oxidation of NADH by ubiquinone accompanied by the transmembrane transfer
        of four protons
      notes: complex I catalyzes the oxidation of NADH by ubiquinone (general prokaryotic
        claim).
  - subject: complex_i
    predicate: reduces
    object: quinone_pool
    description: Complex I transfers electrons from NADH to the quinone pool.
    evidence:
    - reference: DOI:10.3390/ijms252413421
      snippet: oxidation of NADH by ubiquinone
      notes: oxidation of NADH by ubiquinone; reduces the membrane quinone pool.
    predicate_id: METPO:2007802
  - subject: complex_i
    predicate: translocates
    object: proton
    description: Complex I couples redox chemistry to transmembrane proton translocation.
    evidence:
    - reference: DOI:10.3390/ijms252413421
      snippet: accompanied by the transmembrane transfer of four protons
      notes: coupled with the vectorial transmembrane transfer of four H+ ions.
  - subject: complex_i
    predicate: generates
    object: proton_motive_force
    description: Complex I proton translocation contributes directly to formation
      of the proton motive force.
    evidence:
    - reference: DOI:10.3390/ijms252413421
      snippet: contributing to the formation of a proton motive force (pmf)
      notes: The review directly links proton-translocating NADH-ubiquinone oxidoreductase
        to PMF formation across bacterial and mitochondrial coupling membranes.
    predicate_id: biolink:produces
  - subject: succinate
    predicate: is oxidized by
    object: succinate_dehydrogenase
    description: Succinate dehydrogenase oxidizes succinate, reducing quinone.
    evidence:
    - reference: DOI:10.1007/s10863-024-10041-y
      snippet: catalyzes the two-electron reduction of quinone by succinate
      notes: succinate dehydrogenase catalyzes the two-electron reduction of quinone
        by succinate.
  - subject: succinate_dehydrogenase
    predicate: reduces
    object: quinone_pool
    description: Complex II transfers electrons from succinate to the membrane quinone
      pool.
    evidence:
    - reference: DOI:10.1007/s10863-024-10041-y
      snippet: catalyzes the two-electron reduction of quinone by succinate
      notes: The B. licheniformis respiratory-chain study identifies succinate dehydrogenase
        as succinate:quinone oxidoreductase, directly joining Complex II to the quinone
        pool.
    predicate_id: METPO:2007802
  - subject: proton_translocation
    predicate: generates
    object: proton_motive_force
    description: Vectorial proton translocation establishes the proton motive force.
    evidence:
    - reference: DOI:10.3390/ijms252413421
      snippet: contributing to the formation of a proton motive force (pmf)
      notes: energy conservation in the form of an electrochemical gradient (proton
        motive force, pmf).
    predicate_id: biolink:produces
  - subject: heme_copper_oxidase
    predicate: reduces
    object: molecular_oxygen
    description: Heme-copper terminal oxidases catalyze four-electron reduction of
      O2 to water in the concrete branch represented here.
    evidence:
    - reference: DOI:10.3390/ijms25021277
      snippet: catalyze the four-electron reduction of O2 to 2H2O
      notes: The review identifies heme-copper oxidases as a bacterial terminal-oxidase
        class carrying out the oxygen-reduction reaction.
    predicate_id: METPO:2007802
  - subject: heme_copper_oxidase
    predicate: translocates
    object: proton
    description: Heme-copper oxidases act as proton pumps contributing to PMF.
    evidence:
    - reference: DOI:10.3390/ijms25021277
      snippet: Heme-copper oxidases are true proton pumps
      notes: Heme-copper oxidases are true proton pumps (general claim).
