identifier: METPO:2000009
label: uses as electron donor
definition: An OBJECT_PROPERTY relating an organism to a chemical entity (e.g. a CHEBI
  class) that the organism oxidises as an electron donor for energy conservation or
  biosynthetic reductant. The intended use is predicate + class composition at assertion
  time, e.g. `<organism> METPO:2000009 CHEBI:18276` ("organism uses molecular hydrogen
  as electron donor").
definition_source: DOI:10.1146/annurev.micro.55.1.485
trait_category: METABOLISM
term_kind: OBJECT_PROPERTY
mapping_status: REVIEWED
