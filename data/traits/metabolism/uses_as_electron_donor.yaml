evidence:
- reference: DOI:10.1146/annurev.micro.55.1.485
  snippet: electron donor
  notes: Chemolithotrophy review supports the "electron donor" relation as the central
    descriptor for chemolithotrophic and chemo-organotrophic energy conservation;
    the relation is composed at assertion time with the specific donor chemical (H2,
    NH3, Fe2+, S, organic acids, etc.).
