identifier: METPO:2000103
label: capable of
definition: A general OBJECT_PROPERTY relating an organism to a biological process
  or metabolic capability the organism is capable of. Intended use is predicate +
  class composition at assertion time, with a METPO biological-process (or GO biological-process)
  class as the object.
