identifier: traitmech:UED_HYDROGEN
label: uses hydrogen as electron donor
definition: A metabolic trait in which an organism oxidises molecular hydrogen (H2)
  as an electron donor for energy conservation, typically using hydrogenase enzymes
  to feed electrons into respiratory chains or anaerobic energy-conservation
  pathways (chemolithotrophic hydrogenotrophy).
definition_source: DOI:10.1146/annurev.micro.55.1.485
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
