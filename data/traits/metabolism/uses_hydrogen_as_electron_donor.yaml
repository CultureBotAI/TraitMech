- synonym_text: H2-oxidising
  synonym_type: RELATED_SYNONYM
  source: traitmech
evidence:
- reference: DOI:10.1146/annurev.micro.55.1.485
  snippet: hydrogen
  notes: Chemolithotrophy review supports H2 as a canonical electron donor for
    energy conservation in many anaerobic and aerobic bacteria and archaea.
- reference: PMID:9560156
  snippet: Methanocaldococcus jannaschii
  notes: 'Organism example: Methanocaldococcus jannaschii is a hyperthermophilic
    hydrogenotrophic methanogen using H2 as electron donor (Bult et al. 1996,
    Science, complete genome).'
