    protein-family terms for perchlorate reductase and chlorite dismutase are narrower
    than the whole-organism anaerobic respiration phenotype and should be checked
    separately before grounding PcrABCD- or Cld-level causal nodes.
  posed_by: codex
  posed_date: '2026-09-15'
