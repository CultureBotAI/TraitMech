identifier: traitmech:000197
label: perchlorate respiration
definition: An anaerobic respiration in which an organism uses perchlorate as the
  terminal electron acceptor and reduces it to chloride for energy conservation.
definition_source: DOI:10.1038/nrmicro926
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: dissimilatory perchlorate reduction
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1186/s12864-015-2011-5
evidence:
- reference: DOI:10.1186/s12864-015-2011-5
  snippet: reduction to chlorite (ClO2-) in the bacterial periplasm by perchlorate
    reductase, and the dismutation of chlorite to chloride and molecular oxygen
  notes: Melnyk et al. describe the canonical perchlorate-to-chloride respiratory
    pathway through perchlorate reductase and chlorite dismutase.
- reference: DOI:10.1128/AEM.05758-11
  snippet: perchlorate reductase and chlorite dismutase, which are encoded by the
    pcrABCD and cld genes
  notes: Melnyk et al. support the PcrABCD and Cld gene modules as the two pathway-specific
    enzyme systems for perchlorate reduction to chloride.
discussions:
- discussion_id: perchlorate-respiration-xref-gap
  prompt: Resolve an exact external ontology class for organism-level perchlorate
    respiration before adding a TraitRecord xref.
  kind: CURATION_TODO
  status: OPEN
  rationale: The pinned METPO snapshot contains only obsolete (Per)chlorate respiration,
    Perchlorate respiration, and Perchlorate-reducing classes. Candidate GO, EC, and
    protein-family terms for perchlorate reductase and chlorite dismutase are narrower
    than the whole-organism anaerobic respiration phenotype and should be checked
    separately before grounding PcrABCD- or Cld-level causal nodes.
  posed_by: codex
  posed_date: '2026-09-15'
- discussion_id: perchlorate-respiration-protein-example-gap
  prompt: Add a strain-matched canonical_examples entry and UniProtKB protein_examples
    for perchlorate reductase (PcrABCD) and chlorite dismutase (Cld) (e.g., in candidate
    exemplar Dechloromonas aromatica RCB) so perchlorate_respiration_reduction_sketch
    can be promoted from NONMECHANISTIC to MECHANISTIC.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#perchlorate_respiration_reduction_sketch
  rationale: The record's primary literature by Melnyk et al. (DOI:10.1186/s12864-015-2011-5,
    DOI:10.1128/AEM.05758-11) supports periplasmic reduction of perchlorate to chlorite
    by perchlorate reductase (PcrABCD) and chlorite dismutation to chloride and O2
    by chlorite dismutase (Cld), but canonical_examples and verified strain-matched
    UniProtKB accessions must be curated before marking the graph MECHANISTIC.
  posed_by: claude
  posed_date: '2026-10-23'
  evidence:
  - reference: DOI:10.1186/s12864-015-2011-5
    supports: PARTIAL
    snippet: reduction to chlorite (ClO2-) in the bacterial periplasm by perchlorate
      reductase, and the dismutation of chlorite to chloride and molecular oxygen
    explanation: Existing record-level evidence supports the connected NONMECHANISTIC
      pathway/function graph but does not provide strain-matched UniProtKB protein
      accessions for protein_examples.
