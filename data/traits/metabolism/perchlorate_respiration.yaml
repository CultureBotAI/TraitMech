identifier: traitmech:000197
label: perchlorate respiration
definition: An anaerobic respiration in which an organism uses perchlorate as the
  terminal electron acceptor and reduces it to chloride for energy conservation.
definition_source: DOI:10.1038/nrmicro926
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: dissimilatory perchlorate reduction
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1186/s12864-015-2011-5
evidence:
- reference: DOI:10.1186/s12864-015-2011-5
  snippet: reduction to chlorite (ClO2-) in the bacterial periplasm by perchlorate
    reductase, and the dismutation of chlorite to chloride and molecular oxygen
  notes: Melnyk et al. describe the canonical perchlorate-to-chloride respiratory
    pathway through perchlorate reductase and chlorite dismutase.
- reference: DOI:10.1128/AEM.05758-11
  snippet: perchlorate reductase and chlorite dismutase, which are encoded by the
    pcrABCD and cld genes
  notes: Melnyk et al. support the PcrABCD and Cld gene modules as the two pathway-specific
    enzyme systems for perchlorate reduction to chloride.
discussions:
