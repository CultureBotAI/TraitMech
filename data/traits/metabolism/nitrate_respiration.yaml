identifier: traitmech:000122
label: nitrate respiration
definition: A nitrogen respiration in which nitrate is the terminal electron acceptor,
  reduced to nitrite or further reduced products.
definition_source: DOI:10.1126/science.aaf4507
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
