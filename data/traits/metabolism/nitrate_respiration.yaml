evidence:
- reference: DOI:10.1126/science.1254070
  snippet: Denitrification converts nitrate into nitrogenous gas and thus removes
    fixed nitrogen from the biosphere, whereas ammonification converts nitrate into
    ammonium
  notes: Kraft et al. support nitrate respiration as a bacterial nitrogen-oxide respiration
    branch with denitrification or DNRA endpoints.
