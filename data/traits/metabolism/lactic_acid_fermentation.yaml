    evidence:
    - reference: DOI:10.3390/molecules31020333
      snippet: lowering pH and inhibiting pathogenic and spoilage microorganisms
      notes: higher lactic acid / lower pH increases inhibition of spoilage and pathogenic
        microbes.
    predicate_id: RO:0002212
