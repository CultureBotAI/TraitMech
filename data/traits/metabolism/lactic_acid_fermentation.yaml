identifier: traitmech:000026
label: lactic acid fermentation
definition: A fermentation in which sugars are converted mainly to lactate, with
  ATP generated by substrate-level phosphorylation. Homolactic fermentation yields
  ~2 lactate per glucose via glycolysis; heterolactic fermentation also yields
  ethanol/acetate and CO2. Characteristic of lactic acid bacteria (e.g.
  Lactobacillus, Lactococcus).
definition_source: DOI:10.3389/fmicb.2021.703525
