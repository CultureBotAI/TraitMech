identifier: traitmech:000026
label: lactic acid fermentation
definition: A fermentation in which sugars are converted mainly to lactate, with ATP
  generated by substrate-level phosphorylation. Homolactic fermentation yields ~2
  lactate per glucose via glycolysis; heterolactic fermentation also yields ethanol/acetate
  and CO2. Characteristic of lactic acid bacteria (e.g. Lactobacillus, Lactococcus).
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: lactate fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2021.703525
evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  notes: Review of energy conservation in anaerobic fermentations supports lactate
    as a fermentation end product generated with substrate-level phosphorylation.
- reference: DOI:10.3390/molecules31020333
  notes: Review of classical food fermentations describes the lactic-acid pathway
    and lactic acid bacteria as its agents.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Canonical homolactic fermenter and dairy model organism.
  reference: PMID:17307855
causal_graphs:
