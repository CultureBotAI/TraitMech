  - subject: phosphoketolase_pathway
    predicate: yields
    object: ethanol
    description: Heterolactic phosphoketolase route co-produces ethanol (or acetate).
    evidence:
    - reference: DOI:10.3390/molecules31020333
      snippet: glucose is processed through the 6-phosphogluconate/phosphoketolase
        pathway, leading to the formation of lactate, ethanol or acetate
      notes: heterolactic products include ethanol or acetate.
    predicate_id: biolink:produces
  - subject: lactate
    predicate: causes
    object: decreased_ph
    description: Accumulation of lactic acid acidifies the medium.
    evidence:
    - reference: DOI:10.3390/molecules31020333
      snippet: lactic fermentation channels carbohydrate metabolism toward lactate
        formation and rapid acidification of the environment
      notes: acidification from lactic acid exerts antagonistic effects on microbes.
    predicate_id: biolink:causes
  - subject: decreased_ph
