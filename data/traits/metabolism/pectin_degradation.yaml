  synonym_type: EXACT_SYNONYM
  source: DOI:10.1146/annurev.micro.50.1.213
- synonym_text: pectin breakdown
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
- synonym_text: pectin catabolism
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/go/releases/2026-07-26/go-basic.obo
- synonym_text: pectinolytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.00038-07
xrefs:
- GO:0045490
evidence:
- reference: DOI:10.1128/MMBR.00038-07
  snippet: Catabolism of pectin and its breakdown products by pectinolytic bacteria
    occurs within distinct cellular environments
  notes: Abbott and Boraston review pectin breakdown by pectinolytic Enterobacteriaceae
    as a multicomponent microbial catabolic pathway.
- reference: DOI:10.1146/annurev.micro.50.1.213
  snippet: The extracellular degradation of the pectin leads to the formation of oligogalacturonides
    that are catabolized through an intracellular pathway
  notes: Hugouvieux-Cotte-Pattat et al. review the pectinase system and pectin-catabolite
    pathway of Erwinia chrysanthemi strain 3937.
