identifier: traitmech:000135
label: pectin degradation
definition: A biopolymer-degradation metabolism in which an organism depolymerizes
  pectin into oligogalacturonides and catabolizes the released pectin breakdown products
  using pectinolytic enzymes.
definition_source: DOI:10.1128/MMBR.00038-07
