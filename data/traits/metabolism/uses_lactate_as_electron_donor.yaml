- reference: PMID:14563071
  snippet: Desulfovibrio
  notes: 'Organism example: Desulfovibrio vulgaris Hildenborough oxidises
    lactate as electron donor coupled to sulfate reduction (Heidelberg et al.
    2004, Nat Biotechnol, genome).'
