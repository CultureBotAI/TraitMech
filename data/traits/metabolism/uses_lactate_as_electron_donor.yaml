identifier: traitmech:UED_LACTATE
label: uses lactate as electron donor
definition: A metabolic trait in which an organism oxidises lactate as an electron
  donor for energy conservation, typically coupled to anaerobic respiration with
  sulfate or other external acceptors (e.g. in sulfate-reducing bacteria).
definition_source: DOI:10.1146/annurev.micro.55.1.485
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
