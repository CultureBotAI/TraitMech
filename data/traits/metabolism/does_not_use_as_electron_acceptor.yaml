identifier: METPO:2000034
label: does not use as electron acceptor
definition: An OBJECT_PROPERTY asserting that an organism does *not* use a given chemical
  entity as a terminal electron acceptor in respiration. The intended use is predicate
  + class composition at assertion time, e.g. `<organism> METPO:X CHEBI:17632` ("organism
  does not use nitrate as electron acceptor"). Negation companion to METPO:2000008.
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
