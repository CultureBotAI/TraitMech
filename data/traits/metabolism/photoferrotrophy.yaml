identifier: traitmech:000193
label: photoferrotrophy
definition: A metabolism in which anoxygenic phototrophs use light energy to oxidize
  Fe(II) as an electron donor for carbon fixation and biomass formation.
definition_source: DOI:10.3389/fmicb.2014.00713
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000035
- traitmech:000107
synonyms:
- synonym_text: phototrophic Fe(II) oxidation
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3389/fmicb.2014.00713
- synonym_text: anoxygenic phototrophic Fe(II) oxidation
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3389/fmicb.2017.00323
evidence:
- reference: DOI:10.3389/fmicb.2014.00713
  snippet: photoferrotrophic bacteria use light as energy and Fe(II) as an electron
    source for carbon fixation and biomass formation
  notes: Walter et al. directly describe the defining light-powered Fe(II)-donor physiology
    of photoferrotrophic bacteria.
- reference: DOI:10.3389/fmicb.2017.00323
  snippet: reduced iron [Fe(II)] as an electron donor
  notes: Camacho et al. review Fe(II) as the inorganic electron donor used by photoferrotrophs
    during anoxygenic photosynthesis.
- reference: DOI:10.1128/JB.00776-06
  snippet: that is necessary for phototrophic Fe(II) oxidation
  notes: Jiao & Newman discovered the R. palustris TIE-1 pio operon and showed that
    it is necessary for phototrophic Fe(II) oxidation.
canonical_examples:
- taxon_id: NCBITaxon:395960
  taxon_label: Rhodopseudomonas palustris TIE-1
  note: PioABC-model purple nonsulfur photoferrotroph.
  reference: DOI:10.1128/JB.00776-06
