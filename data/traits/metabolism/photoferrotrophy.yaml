discussions:
- discussion_id: photoferrotrophy-xref-gap
  prompt: Resolve an exact external ontology class for photoferrotrophy before adding
    a TraitRecord xref.
  kind: CURATION_TODO
  status: OPEN
  rationale: The pinned METPO snapshot has no active photoferrotrophy or anoxygenic
    phototrophic Fe(II) oxidation class. Candidate GO classes for photosynthesis,
    photosynthetic electron transport, and carbon fixation are broader than this Fe(II)-donor
    organismal metabolism, so no exact external class has yet been resolved.
  posed_by: codex
  posed_date: '2026-09-14'
- discussion_id: photoferrotrophy-protein-example-gap
  prompt: Resolve a live, audit-clean UniProt protein example for a taxon-specific
    photoferrotrophy branch.
  kind: CURATION_TODO
  status: OPEN
  rationale: R. palustris TIE-1 PioA and R. ferrooxidans SW2 FoxE have DOI-backed
    primary evidence, but their current exact UniProtKB accessions are unreviewed
    entries without live Proteomes cross-references. The first graph therefore stays
    process-level until a reviewed or audit-verifiable exact entry is available.
  posed_by: codex
  posed_date: '2026-09-14'
