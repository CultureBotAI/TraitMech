identifier: traitmech:000036
label: proteorhodopsin phototrophy
definition: A light-harvesting metabolism in which a retinal-containing membrane protein
  (proteorhodopsin) acts as a light-driven proton pump, generating proton motive force
  without chlorophyll-based reaction centers. Widespread among marine bacterioplankton.
definition_source: DOI:10.1126/science.289.5486.1902
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000037
synonyms:
- synonym_text: rhodopsin-based phototrophy
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/35081051
evidence:
- reference: DOI:10.1126/science.289.5486.1902
  notes: Béjà et al. identified proteorhodopsin, a retinal-binding light-driven proton
    pump in an uncultivated marine bacterium, as evidence for a new type of phototrophy
    in the sea.
- reference: DOI:10.1038/35081051
  notes: Béjà et al., "Proteorhodopsin phototrophy in the ocean", supports proteorhodopsin
    as a widespread, spectrally tuned light-energy capture system in marine bacteria.
canonical_examples:
- taxon_id: NCBITaxon:313590
  taxon_label: Dokdonia sp. MED134
  note: 'Canonical proteorhodopsin phototroph: light stimulates growth under oligotrophic
    conditions (retinal-inhibition causally proven). Ca. Pelagibacter ubique uses
    PR for starvation maintenance.'
  reference: PMID:17215843
- taxon_id: NCBITaxon:133804
  taxon_label: gamma proteobacterium EBAC31A08
  note: Source organism for the first functionally characterized green-light-absorbing
    proteorhodopsin sequence.
  reference: DOI:10.1126/science.289.5486.1902
