    description: Retinal-binding light-driven proton pump.
    grounding: UniProtKB:A0A1D7QWW9
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    grounding: METPO:1007500
    description: Transmembrane proton gradient generated by light-driven pumping.
  - node_id: proton_pumping
    label: light-driven proton pumping
    node_type: BIOLOGICAL_PROCESS
    description: Proteorhodopsin-mediated transmembrane proton transport driven by
