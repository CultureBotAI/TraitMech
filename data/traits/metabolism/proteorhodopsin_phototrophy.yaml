  source: DOI:10.1038/35081051
evidence:
- reference: DOI:10.1126/science.289.5486.1902
  notes: Béjà et al. identified proteorhodopsin, a retinal-binding light-driven
    proton pump in an uncultivated marine bacterium, as evidence for a new type of
    phototrophy in the sea.
- reference: DOI:10.1038/35081051
  notes: Béjà et al., "Proteorhodopsin phototrophy in the ocean", supports
    proteorhodopsin as a widespread, spectrally tuned light-energy capture system in
    marine bacteria.
