  edges:
  - subject: proteorhodopsin
    predicate: confers
    object: proteorhodopsin_trait
    description: The retinal-binding pump realizes proteorhodopsin phototrophy.
    evidence:
    - reference: DOI:10.1126/science.289.5486.1902
      snippet: bound retinal to form an active, light-driven proton pump
      notes: Béjà et al. identified proteorhodopsin as a retinal-binding light-driven
        proton pump.
    predicate_id: METPO:2007700
  - subject: proteorhodopsin_trait
    predicate: contributes to
    object: proton_motive_force
    description: Light-driven proton pumping by proteorhodopsin generates PMF.
    evidence:
    - reference: DOI:10.1073/pnas.0611035104
      snippet: Illumination of these cells with light coinciding with PR's absorption
        spectrum creates a proton motive force (pmf)
      notes: A primary physiological study directly measured light-dependent PMF generation
        in proteorhodopsin-expressing cells.
    predicate_id: RO:0002326
  - subject: proton_pumping
    predicate: generates
    object: proton_motive_force
    description: Light-driven proton pumping by proteorhodopsin drives PMF generation.
    evidence:
    - reference: DOI:10.1073/pnas.0611035104
      snippet: Illumination of these cells with light coinciding with PR's absorption
        spectrum creates a proton motive force (pmf)
      notes: The measured light-dependent PMF is the direct output of the represented
        proton-pumping process.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: enables
    object: atp_production
    description: PR-mediated proton transport generates a membrane potential sufficient
      for ATP production.
    evidence:
    - reference: DOI:10.1073/pnas.0611035104
      snippet: Sinks include rotation of the flagellar motor and ATP synthesis.
      notes: The primary study's PMF model identifies ATP synthesis as a sink for
        the proteorhodopsin-generated motive force.
    predicate_id: RO:0002327
  - subject: proteorhodopsin_trait
    predicate: does not produce
    object: nadph
    description: Proteorhodopsin phototrophy cannot generate NAD(P)H for anabolic
      metabolism; ATP-only energy module.
    evidence:
    - reference: DOI:10.4014/jmb.2410.10034
      snippet: the PR function of strain IMCC1322, which supplies only ATP.
      notes: 'Oh 2024: "PR can never be harnessed to generate NAD(P)H for anabolic
        metabolism".'
    predicate_id: METPO:2007801
  - subject: all_trans_retinal
    predicate: required for
    object: proteorhodopsin
    description: Functional proteorhodopsin requires all-trans retinal bound via a
      Schiff base to a central lysine.
    evidence:
    - reference: DOI:10.1038/s41467-024-50960-3
      snippet: all-trans retinal needs to be incorporated by forming a Schiff base
        with a central lysine in the chromophore binding pocket.
      notes: 'Hirschi 2024: "Functional proteorhodopsin requires insertion of all-trans
        retinal by formation of a Schiff base with a central lysine".'
  - subject: beta_carotene
    predicate: cleaved to produce
    object: all_trans_retinal
    description: Beta-carotene is cleaved by dioxygenase into retinal, an essential
      element of functional PR.
    evidence:
    - reference: DOI:10.1128/MMBR.69.1.51-78.2005
      snippet: converts β,β-carotene into retinal
      notes: 'Jing 2022: "beta-carotene can be cleaved by dioxygenase into retinal,
        which is an important element in functional PR".'
