identifier: METPO:1002006
label: Syntrophy
definition: A metabolism in which the metabolism of one species is thermodynamically
  dependent on the removal of its products by another species.
definition_source: DOI:10.1038/nrmicro2166
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1038/nrmicro2166
  snippet: Interspecies electron transfer is a key process
  notes: Review supports hydrogen/formate-mediated electron transfer in syntrophic
    communities.
canonical_examples:
- taxon_id: NCBITaxon:863
  taxon_label: Syntrophomonas wolfei
  note: Type species of Syntrophomonas; original syntrophic fatty-acid oxidiser (coculture
    with Methanospirillum hungatei).
  reference: DOI:10.1128/AEM.41.4.1029-1039.1981
- taxon_id: NCBITaxon:335541
  taxon_label: Syntrophomonas wolfei subsp. wolfei (strain DSM 2245B / Goettingen)
  note: Reference-proteome strain in which Swol_1933 was identified as one of two
    butyryl-CoA dehydrogenases expressed during syntrophic growth on butyrate.
  reference: DOI:10.1128/JB.01605-08
causal_graphs:
- graph_id: syntrophy_interspecies_electron_transfer
  title: Syntrophy interspecies electron transfer mechanism
  description: DOI-backed graph for product removal and electron transfer between
    fermenting syntrophs and methanogenic partners.
  scope_status: MECHANISTIC
  scope_notes: This broad graph covers hydrogen-, formate-, and direct-electron-transfer
    branches that are not universal to every syntrophic partnership. The S. wolfei
    Swol_1933 example specifically supports syntrophic butyrate oxidation and does
    not establish the taxon-general DIET branch.
  nodes:
  - node_id: syntrophy_trait
    label: Syntrophy
    node_type: TRAIT
    grounding: METPO:1002006
    description: Thermodynamically coupled metabolism between partner organisms.
  - node_id: syntrophic_product_formation
    label: syntrophic product formation
    node_type: BIOLOGICAL_PROCESS
    description: Product-forming metabolism that depends on product removal by a partner.
  - node_id: methanogenic_product_consumption
    label: methanogenic product consumption
    node_type: BIOLOGICAL_PROCESS
    description: Hydrogen- or formate-consuming methanogenic partner metabolism.
  - node_id: molecular_hydrogen
    label: molecular hydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
    description: Diffusible interspecies electron carrier.
  - node_id: formate
    label: formate
    node_type: CHEMICAL
    grounding: CHEBI:15740
    description: Diffusible interspecies electron carrier.
  - node_id: low_hydrogen_condition
    label: low hydrogen condition
    node_type: ENVIRONMENTAL_FACTOR
    description: Product concentration state that permits otherwise unfavorable syntrophic
      metabolism.
  - node_id: methanogenesis
    label: methanogenesis
    node_type: PATHWAY
    grounding: METPO:1000844
    description: Hydrogen- or formate-consuming methane-producing pathway.
  - node_id: interspecies_hydrogen_transfer
    label: interspecies hydrogen transfer
    node_type: BIOLOGICAL_PROCESS
    description: H2-mediated interspecies electron transfer (MIET) between syntrophic
      partners.
  - node_id: interspecies_formate_transfer
    label: interspecies formate transfer
    node_type: BIOLOGICAL_PROCESS
    description: Formate-mediated interspecies electron transfer between syntrophic
      partners.
  - node_id: low_hydrogen_partial_pressure
    label: low hydrogen partial pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Extremely low H2 partial pressure required for thermodynamic feasibility
      of MIET.
  - node_id: butyryl_coa_dehydrogenase
    label: butyryl-CoA dehydrogenase Swol_1933
    node_type: GENE_OR_PROTEIN
    grounding: GO:0004085
    description: Flavoprotein that oxidizes butanoyl-CoA to crotonyl-CoA during the
      beta-oxidation branch of syntrophic butyrate metabolism.
    protein_examples:
    - uniprot_id: UniProtKB:Q0AVM4
      protein_label: Butyryl-CoA dehydrogenase Swol_1933
      gene_symbol: Swol_1933
      taxon_id: NCBITaxon:335541
      taxon_label: Syntrophomonas wolfei subsp. wolfei (strain DSM 2245B / Goettingen)
      entry_status: REVIEWED
      proteome_id: UP000001968
      retrieved_on: '2026-08-24'
      entry_version: 94
      sequence_version: 1
      role: One of the experimentally identified butyryl-CoA dehydrogenases active
        during syntrophic butyrate oxidation; this example is not a hydrogenase or
        a marker for every syntrophic metabolism.
      evidence:
      - reference: DOI:10.1128/JB.01605-08
        snippet: peptide mass fingerprinting revealed two Bcd proteins
        notes: The primary study maps one purified approximately 65-kDa protein to
          Swol_1933 during syntrophic growth on butyrate; UniProtKB Q0AVM4 is the
          reviewed protein entry for that locus and strain.
  - node_id: formate_dehydrogenase_complex
    label: formate dehydrogenase complex
    node_type: GENE_OR_PROTEIN
    description: Enzyme complex producing/consuming formate in syntrophic formate
      transfer.
    grounding: GO:0009326
  - node_id: hydrogenase_complex
    label: hydrogenase complex
    node_type: GENE_OR_PROTEIN
    description: Enzyme complex producing/consuming H2 in syntrophic hydrogen transfer.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Hydrogenases used in syntrophy span multiple unrelated enzyme
      families and multisubunit architectures; this cross-taxon node does not identify
      one exact complex or family.
  - node_id: direct_interspecies_electron_transfer
    label: direct interspecies electron transfer
    node_type: BIOLOGICAL_PROCESS
    description: 'DIET: electron transfer via conductive structures without soluble
      H2/formate intermediates.'
  - node_id: hydrogen_pressure_inhibition
    label: hydrogen pressure inhibition
    node_type: STATE
    description: Thermodynamic inhibition of syntrophic oxidation by elevated H2 partial
      pressure.
  - node_id: conductive_pili
    label: conductive pili (e-pili)
    node_type: CELLULAR_LOCALIZATION
    description: Electrically conductive pili that serve as a DIET conduit.
  - node_id: multiheme_cytochromes
    label: multiheme c-type cytochromes
    node_type: GENE_OR_PROTEIN
    description: Outer-surface multiheme c-type cytochromes mediating DIET.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Multiheme c-type cytochromes comprise many non-equivalent families,
      and this broad DIET claim does not resolve a taxon-specific protein family.
  edges:
  - subject: syntrophy_trait
    predicate: requires partner interaction
    object: methanogenic_product_consumption
    description: Syntrophic metabolism depends on a partner that consumes products.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: metabolic abilities of their syntrophic partner
      notes: Supports partner dependence in syntrophic communities.
  - subject: syntrophic_product_formation
    predicate: transfers electrons via
    object: molecular_hydrogen
    description: Hydrogen can carry reducing equivalents between syntrophic partners.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: Hydrogen and formate are key components
      notes: Supports hydrogen as a key interspecies electron-transfer carrier.
    predicate_id: METPO:2007600
  - subject: syntrophic_product_formation
    predicate: transfers electrons via
    object: formate
    description: Formate can carry reducing equivalents between syntrophic partners.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: transfer of hydrogen and formate
      notes: Supports formate-mediated interspecies electron transfer.
    predicate_id: METPO:2007600
  - subject: methanogenic_product_consumption
    predicate: consumes
    object: molecular_hydrogen
    description: Methanogens keep hydrogen concentrations low enough for syntrophic
      metabolism.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: low hydrogen concentrations, which are created by the methanogen
      notes: Supports product removal by methanogens as a thermodynamic driver.
    predicate_id: biolink:consumes
  - subject: methanogenic_product_consumption
    predicate: creates
    object: low_hydrogen_condition
    description: Hydrogen consumption creates the product-removal condition needed
      by the syntroph.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: live at the limits of what is thermodynamically possible
      notes: Supports the thermodynamic constraint that product removal relieves.
    predicate_id: biolink:produces
  - subject: molecular_hydrogen
    predicate: participates in
    object: methanogenesis
    description: Hydrogen can feed methanogenesis in syntrophic communities.
    evidence:
    - reference: DOI:10.1038/nrmicro2166
      snippet: syntrophic methanogenic communities
      notes: Supports hydrogen-linked electron flow into methanogenic partners.
    predicate_id: biolink:participates_in
  - subject: butyryl_coa_dehydrogenase
    predicate: participates in
    object: syntrophic_product_formation
    description: Swol_1933 catalyzes the butyryl-CoA oxidation step of syntrophic
      butyrate degradation in S. wolfei.
    evidence:
    - reference: DOI:10.1128/JB.01605-08
      snippet: syntrophic oxidation of butyrate in S. wolfei involves butyryl-CoA
        dehydrogenases
      notes: Purified Bcd activity and peptide mass fingerprinting identified Swol_1933
        in butyrate-grown cells, directly supporting this strain-specific mechanistic
        edge.
    predicate_id: biolink:participates_in
  - subject: low_hydrogen_partial_pressure
    predicate: enables
    object: interspecies_hydrogen_transfer
    description: H2-mediated transfer is thermodynamically feasible only at extremely
      low H2 partial pressure.
    evidence:
    - reference: DOI:10.3390/fermentation9050467
      notes: H2-mediated transfer thermodynamically feasible only when H2 < 10^-4
        atm.
    predicate_id: RO:0002327
  - subject: interspecies_hydrogen_transfer
    predicate: mediates
    object: syntrophy_trait
    description: Interspecies hydrogen transfer is a core mechanistic sub-process
      of syntrophy.
    evidence:
    - reference: DOI:10.3390/fermentation9050467
      notes: H2-mediated MIET (IHT) is a main interspecies electron transfer mode
        relevant to syntrophy.
  - subject: interspecies_formate_transfer
    predicate: mediates
    object: syntrophy_trait
    description: Interspecies formate transfer is a core mechanistic sub-process of
      syntrophy.
    evidence:
    - reference: DOI:10.1093/femsre/fuab057
      notes: Interspecies formate transfer is one of three IET mechanisms in syntrophic
        propionate oxidation.
  - subject: formate_dehydrogenase_complex
    predicate: mediates
    object: interspecies_formate_transfer
    description: Formate dehydrogenases provide the enzymatic basis for formate production/consumption
      in syntrophy.
    evidence:
    - reference: DOI:10.1186/s40168-020-00885-y
      notes: Formate dehydrogenases and formate transporters expressed by FA-degrading
        syntrophic species.
  - subject: hydrogenase_complex
    predicate: mediates
    object: interspecies_hydrogen_transfer
    description: Hydrogenases provide the enzymatic basis for H2 production/consumption
      in syntrophy.
    evidence:
    - reference: DOI:10.1038/s41396-023-01504-y
      notes: Hydrogen-mediated transfer supported by expression of hydrogenases in
        syntrophic communities.
  - subject: direct_interspecies_electron_transfer
    predicate: bypasses
    object: hydrogen_pressure_inhibition
    description: DIET can overcome inhibition by hydrogen pressure, enabling syntrophy
      without soluble carriers.
    evidence:
    - reference: DOI:10.3390/fermentation9100884
      notes: DIET can overcome the inhibition of hydrogen pressure and formate concentration.
  - subject: conductive_pili
    predicate: mediates
    object: direct_interspecies_electron_transfer
    description: Conductive pili (e-pili) are a canonical DIET conduit.
    evidence:
    - reference: DOI:10.1134/S0026261720020101
      notes: DIET occurs via conductive pili (e-pili).
  - subject: multiheme_cytochromes
    predicate: mediates
    object: direct_interspecies_electron_transfer
    description: Outer-surface multiheme c-type cytochromes are a core DIET redox
      conduit.
    evidence:
    - reference: DOI:10.3390/life14050591
      notes: DIET operates via outer-surface c-type cytochromes.
  - subject: direct_interspecies_electron_transfer
    predicate: mediates
    object: syntrophy_trait
    description: Direct interspecies electron transfer is one mechanism that can mediate
      syntrophic growth without diffusible hydrogen or formate.
    evidence:
    - reference: DOI:10.3389/fmicb.2016.00236
      snippet: Direct interspecies electron transfer (DIET) has been recognized as
        an alternative to interspecies H2 transfer as a mechanism for syntrophic growth
      notes: Verified against the freely available primary-study abstract; the edge
        does not assert that DIET occurs in every syntrophic pair.
