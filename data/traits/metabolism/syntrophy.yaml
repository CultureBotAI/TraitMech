created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1038/nrmicro2166
  snippet: Interspecies electron transfer is a key process
  notes: Review supports hydrogen/formate-mediated electron transfer in syntrophic
    communities.
