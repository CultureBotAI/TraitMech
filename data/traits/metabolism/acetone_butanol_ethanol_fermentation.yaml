identifier: traitmech:000180
label: acetone-butanol-ethanol fermentation
definition: A fermentation in which solventogenic bacteria convert organic carbon
  sources to organic acids and then reassimilate those acids to produce acetone, butanol,
  and ethanol solvents.
definition_source: DOI:10.1073/pnas.1423143112
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: ABE fermentation
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1073/pnas.1423143112
- synonym_text: acetone-butanol fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mr.50.4.484-524.1986
evidence:
- reference: DOI:10.1073/pnas.1423143112
  snippet: One canonical example of such processes is acetone-butanol-ethanol (ABE)
    fermentation by Clostridium acetobutylicum, during which cells convert carbon
    sources to organic acids that are later reassimilated to produce solvents as a
    strategy for cellular survival.
  notes: Liao et al. use the exact acetone-butanol-ethanol (ABE) fermentation name
    and describe the acidogenic-to-solventogenic conversion of carbon sources into
    solvent end products.
- reference: DOI:10.1002/bit.22003
  snippet: Biological production of butanol (with acetone and ethanol) was one of
    the largest industrial fermentation processes early in the 20th century.
  notes: Lee et al. independently review fermentative butanol production with acetone
    and ethanol by Clostridia.
canonical_examples:
- taxon_id: NCBITaxon:272562
  taxon_label: Clostridium acetobutylicum ATCC 824
  note: Wild-type ATCC 824 strain whose ABE fermentations were experimentally reproduced
    by Liao et al.'s integrated model.
  reference: DOI:10.1073/pnas.1423143112
