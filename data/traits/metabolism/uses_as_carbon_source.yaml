identifier: METPO:2000006
label: uses as carbon source
definition: An OBJECT_PROPERTY relating an organism to a chemical entity (e.g. a CHEBI
  class) that the organism uses as a source of carbon for biosynthesis. The intended
  use is predicate + class composition at assertion time, e.g. `<organism> METPO:2000006
  CHEBI:17234` ("organism uses glucose as carbon source").
definition_source: PMID:21413255
