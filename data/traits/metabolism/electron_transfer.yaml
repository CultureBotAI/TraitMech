      notes: Supports protein-mediated microbial electron exchange.
  - subject: cytochrome
    predicate: example of
    object: redox_protein
    description: c-type cytochromes are electron-transfer proteins.
    evidence:
    - reference: DOI:10.1038/nrmicro.2016.93
