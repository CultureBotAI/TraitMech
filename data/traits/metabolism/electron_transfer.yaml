    evidence:
    - reference: DOI:10.1038/nrmicro.2016.93
      snippet: microbial nanowires
      notes: Supports nanowires as an extracellular electron-transfer mechanism.
  - subject: extracellular_electron_transfer
    predicate: uses protein
    object: cytochrome
    description: Extracellular electron transfer can use c-type cytochromes.
    evidence:
    - reference: DOI:10.1038/nrmicro.2016.93
