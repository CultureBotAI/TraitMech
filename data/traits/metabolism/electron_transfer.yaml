identifier: METPO:1000805
label: Electron transfer
definition: A metabolism in which electrons are transferred from an electron donor
  to an electron acceptor.
definition_source: DOI:10.1016/j.bbabio.2008.09.008
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1016/j.bbabio.2008.09.008
  snippet: electron transfer process
  notes: Review supports electron donor-to-acceptor flow in membrane respiratory chains.
- reference: DOI:10.1038/nrmicro.2016.93
  snippet: c-type cytochromes and microbial nanowires
  notes: Review supports extracellular electron-transfer mechanisms.
canonical_examples:
- taxon_id: NCBITaxon:35554
  taxon_label: Geobacter sulfurreducens
  note: extracellular electron transfer via pili/cytochromes
  reference: DOI:10.1126/science.1088727
- taxon_id: NCBITaxon:70863
  taxon_label: Shewanella oneidensis
  note: extracellular electron transfer to metals
  reference: DOI:10.1038/nbt749
- taxon_id: NCBITaxon:211586
  taxon_label: Shewanella oneidensis MR-1
  note: Strain-level extracellular electron-transfer model paired to its MtrC surface
    decaheme cytochrome.
  reference: DOI:10.1073/pnas.0604517103
causal_graphs:
- graph_id: electron_transfer_redox_carriers
  title: Electron transfer redox carrier mechanism
  description: DOI-backed graph for electron donor/acceptor chemistry, redox proteins,
    membrane electron transport, and extracellular electron-transfer structures.
  scope_status: MECHANISTIC
  scope_notes: This is a composite graph spanning respiratory-chain and extracellular
    electron-transfer modules. The MtrC example supports the S. oneidensis MR-1 extracellular
    branch only; it does not ground the generic respiratory complexes or imply that
    MtrC participates in all electron-transfer traits.
  nodes:
  - node_id: electron_transfer_trait
    label: Electron transfer
    node_type: TRAIT
    grounding: METPO:1000805
    description: Metabolic electron movement from donor to acceptor.
  - node_id: electron_donor
    label: electron donor
    node_type: CHEMICAL
    description: Reduced substrate or carrier supplying electrons.
    grounding: CHEBI:15022
  - node_id: electron_acceptor
    label: electron acceptor
    node_type: CHEMICAL
    description: Oxidized substrate or carrier receiving electrons.
  - node_id: redox_protein
    label: redox protein
    node_type: GENE_OR_PROTEIN
    description: Protein carrier mediating electron transfer.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Redox protein is an umbrella label spanning unrelated carrier
      families and activities, so no single exact GO or InterPro term represents this
      generic node.
  - node_id: cytochrome
    label: c-type cytochrome
    node_type: GENE_OR_PROTEIN
    description: Heme-containing electron-transfer protein.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The broad c-type cytochrome label spans many monoheme and multiheme
      families; the MtrC example illustrates one source-backed extracellular branch
      without narrowing the generic node to that family.
    protein_examples:
    - uniprot_id: UniProtKB:Q8EG34
      protein_label: Extracellular iron oxide respiratory system surface decaheme
        cytochrome c component MtrC
      gene_symbol: mtrC
      taxon_id: NCBITaxon:211586
      taxon_label: Shewanella oneidensis MR-1
      entry_status: UNREVIEWED
      proteome_id: UP000008186
      retrieved_on: '2026-08-24'
      entry_version: 125
      sequence_version: 1
      role: MtrC-family c-type cytochrome mediating extracellular electron transfer
        to Fe(III) and Mn(IV) acceptors in S. oneidensis MR-1.
      evidence:
      - reference: DOI:10.1073/pnas.0604517103
        snippet: The decaheme c-type cytochrome MtrC (SO1778) had been implicated
          in efficient reduction of Fe(III) and Mn(IV) by MR-1.
        notes: The primary study supports the extracellular electron-transfer role.
          UniProtKB Q8EG34 is the exact unreviewed MtrC entry from reference proteome
          UP000008186 and verifies the strain taxon.
  - node_id: membrane_electron_transport_chain
    label: membrane electron transport chain
    node_type: PATHWAY
    description: Ordered redox chain in a biological membrane.
    grounding: GO:0022900
  - node_id: extracellular_electron_transfer
    label: extracellular electron transfer
    node_type: BIOLOGICAL_PROCESS
    description: Electron exchange between cells and extracellular minerals, electrodes,
      or cells.
  - node_id: microbial_nanowire
    label: microbial nanowire
    node_type: CELLULAR_LOCALIZATION
    description: Conductive extracellular structure implicated in long-range electron
      transfer.
  - node_id: terminal_acceptor_reduction
    label: terminal acceptor reduction
    node_type: MOLECULAR_FUNCTION
    description: Reduction of the final electron acceptor.
  - node_id: complex_i
    label: NADH dehydrogenase (Complex I)
    node_type: GENE_OR_PROTEIN
    description: Proton-translocating NADH:ubiquinone oxidoreductase entry point of
      the respiratory chain.
    grounding: GO:0030964
  - node_id: ubiquinone
    label: ubiquinone
    node_type: CHEMICAL
    description: Membrane quinone electron carrier reduced to ubiquinol in the respiratory
      chain.
  - node_id: ubiquinol
    label: ubiquinol
    node_type: CHEMICAL
    description: Reduced form of ubiquinone that donates electrons to the cytochrome
      bc1 complex.
    grounding: CHEBI:17976
  - node_id: cytochrome_bc1
    label: cytochrome bc1 complex
    node_type: GENE_OR_PROTEIN
    description: Ubiquinol:cytochrome c oxidoreductase (Complex III) of the respiratory
      chain.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The graph uses a bacterial respiratory bc1-complex label, while
      the reviewed candidate terms were either molecular-function activities or compartment-specific
      complexes rather than an exact taxon-agnostic complex.
  - node_id: cytochrome_c
    label: cytochrome c
    node_type: GENE_OR_PROTEIN
    description: Mobile electron carrier shuttling electrons from bc1 to the terminal
      oxidase.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Cytochrome c is a broad protein class containing multiple families;
      this graph does not identify one exact family or chain architecture.
  - node_id: terminal_oxidase
    label: terminal oxidase
    node_type: GENE_OR_PROTEIN
    description: Terminal respiratory oxidase (Complex IV) that reduces the final
      acceptor.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Terminal oxidase is deliberately broad across heme-copper and
      quinol oxidase families; the cited graph does not identify one exact family
      or multisubunit complex term.
  - node_id: molecular_oxygen
    label: oxygen
    node_type: CHEMICAL
    description: Molecular oxygen, terminal electron acceptor in aerobic respiration.
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Transmembrane electrochemical proton gradient generated by respiratory
      electron transfer.
    grounding: METPO:1007500
  edges:
  - subject: electron_transfer_trait
    predicate: transfers electrons from
