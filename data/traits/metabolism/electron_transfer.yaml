    predicate_id: rdfs:subClassOf
  - subject: membrane_electron_transport_chain
    predicate: performs
    object: terminal_acceptor_reduction
    description: Electron transport chains deliver electrons to terminal acceptors.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
