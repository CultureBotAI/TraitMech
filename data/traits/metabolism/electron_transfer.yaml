      notes: Supports donor-side redox chemistry.
  - subject: electron_donor
    predicate: transfers electrons to
    object: electron_acceptor
    description: Electron transfer moves reducing equivalents from donor to acceptor.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: electron transfer process
      notes: Supports donor-to-acceptor electron flow.
    predicate_id: METPO:2007403
  - subject: redox_protein
    predicate: mediates transfer between
    object: electron_donor
    description: Redox proteins mediate biological electron-transfer steps.
    evidence:
    - reference: DOI:10.1038/nrmicro.2016.93
