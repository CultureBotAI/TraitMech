identifier: traitmech:000025
label: dicarboxylate/4-hydroxybutyrate cycle
definition: An autotrophic carbon-fixation pathway that fixes one molecule of CO2
  and one of bicarbonate per turn via a dicarboxylate stage and a
  4-hydroxybutyrate stage. It operates in anaerobic and microaerophilic
  Crenarchaeota such as Ignicoccus and Thermoproteales.
definition_source: DOI:10.1126/science.1149976
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
