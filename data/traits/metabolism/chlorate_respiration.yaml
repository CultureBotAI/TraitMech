identifier: traitmech:000198
label: chlorate respiration
definition: An anaerobic respiration in which an organism uses chlorate as the terminal
  electron acceptor and reduces it to chloride for energy conservation.
definition_source: DOI:10.1128/AEM.69.9.5585-5592.2003
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000802
synonyms:
- synonym_text: dissimilatory chlorate reduction
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.07303-11
evidence:
- reference: DOI:10.1128/AEM.69.9.5585-5592.2003
  snippet: chlorate ion as the sole electron acceptor for oxidation of organic matter
    in a previously unknown mode of respiration
  notes: Danielsson Thorell et al. support the organism-level respiratory use of chlorate
    as the electron acceptor.
- reference: DOI:10.1128/AEM.69.9.5585-5592.2003
  snippet: 'reduction of chlorate occurs in a two-step reaction: chlorate reduction
    followed by chlorite decomposition'
  notes: The Ideonella dechloratans chlorate pathway reduces chlorate and then decomposes
    the chlorite intermediate.
- reference: DOI:10.1128/AEM.07303-11
  snippet: Perchlorate-respiring bacteria (PRB) can use both perchlorate and chlorate
    as terminal electron acceptors, whereas chlorate-respiring bacteria (CRB) use
    only chlorate
  notes: Hellberg Lindqvist et al. separate chlorate-respiring bacteria from broader
    perchlorate reducers.
- reference: DOI:10.1128/AEM.69.9.5585-5592.2003
  snippet: The genes (clr) encoding chlorate reductase are arranged as clrABDC, where
    clrA, clrB, and clrC encode the subunits and clrD encodes a specific chaperone.
  notes: Danielsson Thorell et al. characterize the Ideonella dechloratans clrABDC
    operon encoding the ClrA, ClrB, and ClrC subunits of chlorate reductase.
canonical_examples:
- taxon_id: NCBITaxon:36863
  taxon_label: Ideonella dechloratans
  note: Chlorate-respiring bacterium assayed anaerobically with acetate as electron
    donor and sodium chlorate as electron acceptor.
  reference: DOI:10.1128/AEM.07303-11
