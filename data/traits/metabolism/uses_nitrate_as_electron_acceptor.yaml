identifier: traitmech:UEA_NITRATE
label: uses nitrate as electron acceptor
definition: A metabolic trait in which an organism uses nitrate as a terminal
  electron acceptor in anaerobic respiration, reducing nitrate via the
  denitrification pathway (NO3- → NO2- → NO → N2O → N2) or dissimilatory nitrate
  reduction to ammonium (DNRA).
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
