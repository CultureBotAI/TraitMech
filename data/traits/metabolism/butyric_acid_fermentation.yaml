identifier: traitmech:000179
label: butyric acid fermentation
definition: A fermentation in which anaerobic bacteria convert organic substrates
  to butyrate as a major reduced end product, conserving energy through substrate-level
  phosphorylation and reduced-ferredoxin-dependent ion-gradient generation.
definition_source: DOI:10.3389/fmicb.2021.703525
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: butyrate fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2021.703525
evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  snippet: glutamate to ammonia, CO2, acetate, butyrate and H2 via 3-methylaspartate
    or via 2-hydroxyglutarate by members of the Firmicutes
  notes: Buckel reviews Firmicutes fermentations that form acetate, butyrate, and
    H2 while demonstrating redox and ion-gradient-linked energy conservation in butyrate-forming
    anaerobic bacteria.
- reference: DOI:10.1111/j.1574-6968.2009.01514.x
  snippet: 'butyryl-CoA : acetate CoA-transferase, rather than butyrate kinase, appears
    to perform the final step in butyrate synthesis'
  notes: Louis and Flint review butyrate-producing gut bacteria and identify butyryl-CoA:acetate
    CoA-transferase as the common terminal butyrate-synthesis route.
- reference: DOI:10.1111/1751-7915.12304
  snippet: Butyric acid fermentation from pretreated and hydrolysed wheat straw by
    an adapted Clostridium tyrobutyricum strain
  notes: Baroi et al. directly studied butyric acid fermentation from pretreated and
    hydrolysed wheat straw by an adapted Clostridium tyrobutyricum strain.
canonical_examples:
