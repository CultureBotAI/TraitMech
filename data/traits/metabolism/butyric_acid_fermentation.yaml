identifier: traitmech:000179
label: butyric acid fermentation
definition: A fermentation in which anaerobic bacteria convert organic substrates
  to butyrate as a major reduced end product while conserving energy by substrate-level
  phosphorylation or ion-gradient generation.
definition_source: DOI:10.1111/j.1574-6968.2009.01514.x
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1002005
synonyms:
- synonym_text: butyrate fermentation
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1111/j.1574-6968.2009.01514.x
evidence:
- reference: DOI:10.3389/fmicb.2021.703525
  snippet: Until about 10 years ago, anaerobes were thought to exclusively use substrate
    level phosphorylation (SLP), by which only part of the available energy could
    be conserved. Therefore, anaerobes were regarded as unproductive and inefficient
    energy conservers. The discovery of electrochemical Na+ gradients generated by
    biotin-dependent decarboxylations or by reduction of NAD+ with ferredoxin changed
    this view.
  notes: Buckel supplies anaerobic-fermentation energy-conservation context, including
    substrate-level phosphorylation and ferredoxin-linked ion-gradient generation.
- reference: DOI:10.1111/j.1574-6968.2009.01514.x
  snippet: 'Five different arrangements have been identified for the genes of the
    central pathway involved in butyrate synthesis, while in most cases butyryl-CoA
    : acetate CoA-transferase, rather than butyrate kinase, appears to perform the
    final step in butyrate synthesis. Mechanisms have been proposed recently in non-gut
    Clostridium spp. whereby butyrate synthesis can result in energy generation via
    both substrate-level phosphorylation and proton gradients.'
  notes: 'Louis and Flint connect butyrate synthesis to energy generation through
    substrate-level phosphorylation and proton gradients while reviewing the butyryl-CoA
    : acetate CoA-transferase terminal route.'
- reference: DOI:10.1111/1751-7915.12304
  snippet: the adapted C. tyrobutyricum strain was characterized by a high yield and
    selectivity to butyric acid
  notes: Baroi et al. directly studied butyric acid fermentation from pretreated and
    hydrolysed wheat straw by an adapted Clostridium tyrobutyricum strain.
- reference: DOI:10.1099/mic.0.28412-0
  snippet: A novel CoA-transferase gene is described from the colonic bacterium Roseburia
    sp. A2-183, with similarity to acetyl-CoA hydrolase as well as 4-hydroxybutyrate
    CoA-transferase sequences. The gene product, overexpressed in an Escherichia coli
    lysate, showed activity with butyryl-CoA and to a lesser degree propionyl-CoA
    in the presence of acetate.
  notes: Charrier et al. identify and biochemically characterize the Roseburia sp.
    (Roseburia hominis) A2-183 butyryl-CoA:acetate CoA-transferase (UniProtKB:G2SYC0)
    catalyzing the terminal step of butyrate synthesis.
canonical_examples:
- taxon_id: NCBITaxon:1519
  taxon_label: Clostridium tyrobutyricum
  note: Butyric-acid fermenter used by Baroi et al. for fermentative conversion of
    wheat-straw hydrolysate to butyric acid.
  reference: DOI:10.1111/1751-7915.12304
- taxon_id: NCBITaxon:585394
  taxon_label: Roseburia hominis (strain DSM 16839 / JCM 17582 / NCIMB 14029 / A2-183)
  note: Charrier et al. cloned and biochemically characterized the butyryl-CoA:acetate
    CoA-transferase (RHOM_13820; UniProtKB:G2SYC0) catalyzing the terminal step of
    butyrate formation from butyryl-CoA and acetate in the human colonic anaerobe
    Roseburia sp. (Roseburia hominis) A2-183.
  reference: DOI:10.1099/mic.0.28412-0
