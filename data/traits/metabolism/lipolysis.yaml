  snippet: Microbial lipases (EC 3.1.1.3) catalyze the hydrolysis of long chain triglycerides
  notes: Chandra et al. review microbial lipases and their use in long-chain triglyceride
    hydrolysis.
- reference: DOI:10.1007/s00253-004-1568-8
  snippet: Lipases, triacylglycerol hydrolases, are an important group of biotechnologically
    relevant enzymes
  notes: Gupta et al. review bacterial lipases as microbial enzymes for triacylglycerol
    hydrolysis.
