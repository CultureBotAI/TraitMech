identifier: traitmech:000190
label: lipolysis
definition: A metabolism in which a microorganism hydrolyzes triacylglycerols into
  fatty acids and glycerol through lipase-catalyzed ester cleavage.
definition_source: DOI:10.1186/s12934-020-01428-8
trait_category: METABOLISM
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000060
evidence:
- reference: DOI:10.1186/s12934-020-01428-8
  snippet: Microbial lipases (EC 3.1.1.3) catalyze the hydrolysis of long chain triglycerides
  notes: Chandra et al. review microbial lipases and their use in long-chain triglyceride
    hydrolysis.
- reference: DOI:10.1007/s00253-004-1568-8
  snippet: Lipases, triacylglycerol hydrolases, are an important group of biotechnologically
    relevant enzymes
  notes: Gupta et al. review bacterial lipases as microbial enzymes for triacylglycerol
    hydrolysis.
