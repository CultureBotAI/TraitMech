identifier: traitmech:000103
label: nitrogen fixation
definition: A metabolism in which an organism reduces atmospheric dinitrogen (N2) to
  ammonia using the nitrogenase enzyme complex, making fixed nitrogen biologically
  available (diazotrophy).
