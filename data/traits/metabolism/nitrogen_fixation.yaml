identifier: traitmech:000103
label: nitrogen fixation
definition: A metabolism in which an organism reduces atmospheric dinitrogen (N2)
  to ammonia using the nitrogenase enzyme complex, making fixed nitrogen biologically
  available (diazotrophy).
definition_source: DOI:10.1038/nrmicro.2018.9
trait_category: METABOLISM
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000060
synonyms:
- synonym_text: diazotrophy
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro954
evidence:
- reference: DOI:10.1038/nrmicro.2018.9
  notes: Kuypers, Marchant & Kartal place nitrogen fixation as the reductive entry
    point of the microbial nitrogen-cycling network.
- reference: DOI:10.1038/nrmicro954
  notes: Dixon & Kahn review the genetic regulation of biological nitrogen fixation
    and nitrogenase.
canonical_examples:
- taxon_id: NCBITaxon:354
  taxon_label: Azotobacter vinelandii
  note: Preferred model free-living aerobic diazotroph; fixes N2 at high O2 via respiratory
    protection.
  reference: DOI:10.1128/mbio.02593-21
causal_graphs:
- graph_id: nitrogen_fixation_nitrogenase
  title: Nitrogenase-catalyzed dinitrogen reduction
  description: Evidence-backed causal sketch linking the nitrogenase complex to reduction
    of atmospheric dinitrogen to ammonia.
  scope_status: MECHANISTIC
  scope_notes: Represents the canonical molybdenum-nitrogenase electron-transfer and
    catalytic sequence plus oxygen inhibition; alternative nitrogenases and lineage-specific
    protection systems are outside this graph.
  nodes:
  - node_id: nitrogen_fixation_trait
    label: nitrogen fixation
    node_type: TRAIT
    grounding: traitmech:000103
    description: Capacity to reduce N2 to ammonia.
  - node_id: nitrogenase
    label: nitrogenase
    node_type: GENE_OR_PROTEIN
    description: Oxygen-sensitive enzyme complex that reduces dinitrogen.
    grounding: GO:0016610
  - node_id: nitrogen_fixation_process
    label: nitrogen fixation
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0009399
    description: Reduction of dinitrogen to ammonia.
  - node_id: dinitrogen
    label: dinitrogen
    node_type: CHEMICAL
    grounding: CHEBI:17997
    description: Atmospheric N2 substrate.
  - node_id: ammonia
    label: ammonia
    node_type: CHEMICAL
    grounding: CHEBI:16134
    description: Fixed-nitrogen product.
  - node_id: ferredoxin_flavodoxin
    label: ferredoxin/flavodoxin
    node_type: GENE_OR_PROTEIN
    description: Low-potential electron carriers that donate electrons to the nitrogenase
      Fe-protein (NifH).
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The combined label intentionally denotes alternative ferredoxin
      and flavodoxin donors; no single exact family term covers both without overstating
      a taxon-specific carrier.
  - node_id: nifh_fe_protein
    label: NifH (Fe-protein)
    node_type: GENE_OR_PROTEIN
    description: Nitrogenase iron protein; ATP-dependent electron donor to the MoFe
      protein.
    grounding: InterPro:IPR005977
    protein_examples:
    - uniprot_id: UniProtKB:P00459
      protein_label: Nitrogenase iron protein 1
      gene_symbol: nifH1
      taxon_id: NCBITaxon:354
      taxon_label: Azotobacter vinelandii
      entry_status: REVIEWED
      retrieved_on: '2026-08-23'
      entry_version: 167
      sequence_version: 2
      role: ATP-coupled Fe-protein component that transfers electrons to the catalytic
        MoFe protein in the A. vinelandii nitrogenase system.
      evidence:
      - reference: DOI:10.1074/jbc.271.4.1884
        snippet: exclusively due to the substitution of the Fe protein residue serine
          44
        notes: The A. vinelandii nifH Fe-protein mutant causally links this exact
          component to altered nitrogenase electron transfer; UniProtKB P00459 verifies
          the reviewed protein and taxon.
  - node_id: p_cluster
    label: P-cluster
    node_type: CHEMICAL
    description: '[8Fe-7S] metallocluster in NifDK that relays electrons to the FeMo-cofactor.'
  - node_id: femo_cofactor
    label: FeMo-cofactor (M-cluster)
    node_type: CHEMICAL
    description: '[7Fe-9S-Mo-C-homocitrate] active-site cofactor that binds and reduces
      N2.'
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Mg-ATP hydrolyzed by NifH to drive electron transfer to the MoFe
      protein.
  - node_id: molecular_oxygen
    label: molecular oxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
    description: O2, which irreversibly inactivates oxygen-sensitive nitrogenase.
  edges:
  - subject: nitrogenase
    predicate: enables
    object: nitrogen_fixation_process
    description: The nitrogenase complex carries out biological nitrogen fixation.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: In the biological nitrogen fixation reaction, N2 is reduced to form
        NH3 under ambient conditions by the nitrogenase enzyme
      notes: The DOI-backed nitrogenase review identifies the enzyme as the catalyst
        of biological nitrogen fixation.
    predicate_id: RO:0002327
  - subject: nitrogen_fixation_process
    predicate: consumes
    object: dinitrogen
    description: Nitrogen fixation consumes atmospheric dinitrogen.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: In the biological nitrogen fixation reaction, N2 is reduced to form
        NH3 under ambient conditions by the nitrogenase enzyme
      notes: The same review explicitly identifies N2 as the substrate reduced by
        nitrogenase.
    predicate_id: biolink:consumes
  - subject: nitrogen_fixation_process
    predicate: has output
    object: ammonia
    description: Nitrogen fixation produces ammonia.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: N2 is reduced to form NH3 under ambient conditions by the nitrogenase
        enzyme
      notes: Supports ammonia as the product of nitrogenase-catalyzed N2 reduction.
    predicate_id: RO:0002234
  - subject: nitrogen_fixation_trait
    predicate: depends on
    object: nitrogenase
    description: The nitrogen-fixation trait depends on the nitrogenase complex.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: enzymes capable of converting atmospheric nitrogen N2 to NH3 in ambient
        conditions
      notes: Supports nitrogenase as required for the trait.
    predicate_id: RO:0002502
  - subject: ferredoxin_flavodoxin
    predicate: transfers electron to
    object: nifh_fe_protein
    description: Reduced ferredoxin/flavodoxin donate electrons to the [4Fe-4S] cluster
      of the NifH homodimer.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: Reduced electron carriers donate electrons to the [4Fe-4S] cluster
        at the interface of the NifH homodimer.
      notes: Reduced electron carriers donate electrons to the [4Fe-4S] cluster at
        the interface of the NifH homodimer; core Mo-nitrogenase mechanism.
  - subject: nifh_fe_protein
    predicate: transfers electron to
    object: p_cluster
    description: The Fe-protein accepts electrons from Fd/Fld and reduces the P-cluster
      in the MoFe protein in an ATP-dependent step.
    evidence:
    - reference: DOI:10.1128/aem.00378-23
      snippet: The Fe-protein contains 1 FeS cluster that accepts electrons from Fd
        or Fld and reduces the P-cluster in the MoFe protein in an ATP-dependent electron
        transfer.
      notes: The Fe-protein FeS cluster accepts electrons from Fd or Fld and reduces
        the P-cluster in the MoFe protein in an ATP-dependent electron transfer.
  - subject: p_cluster
    predicate: transfers electron to
    object: femo_cofactor
    description: The P-cluster relays electrons to the FeMo-cofactor for N2 reduction.
    evidence:
    - reference: DOI:10.1128/aem.00378-23
      snippet: The P-cluster delivers electrons to the MoFe cofactor allowing electrons
        to be loaded for the reduction of N2.
      notes: The P-cluster delivers electrons to the MoFe cofactor allowing electrons
        to be loaded for the reduction of N2; core electron relay.
  - subject: femo_cofactor
    predicate: enables
    object: nitrogen_fixation_process
    description: The FeMo-cofactor binds and reduces N2 to ammonia.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: Electrons are sequentially donated to the [8Fe-7S] cluster in the NifDK
        protein, then finally to FeMo-co, which binds and reduces N2 to form NH3 and
        H2
      notes: FeMo-co binds and reduces N2 to form NH3 and H2 in the canonical Mo-dependent
        nitrogenase.
    predicate_id: RO:0002327
  - subject: nifh_fe_protein
    predicate: requires
    object: atp
    description: NifH hydrolyzes Mg-ATP during each electron transfer to the MoFe
      protein.
    evidence:
    - reference: DOI:10.34133/bdr.0005
      snippet: NifH transiently binds and then dissociates from the NifDK complex,
        hydrolyzing 2 molecules of Mg-ATP per electron transfer.
      notes: NifH transiently binds and dissociates from NifDK, hydrolyzing 2 Mg-ATP
        per electron transfer; supports per-electron ATP cost.
  - subject: molecular_oxygen
    predicate: inhibits
    object: nitrogenase
    description: Molecular oxygen inactivates the oxygen-sensitive nitrogenase complex.
    evidence:
    - reference: DOI:10.1128/aem.00378-23
      snippet: Each metal cofactor is very sensitive to oxygen damage.
      notes: Nitrogenase is an O2-sensitive enzyme; broad, well-supported claim across
        diazotrophs.
    predicate_id: RO:0002212
