identifier: traitmech:000105
label: dissimilatory sulfate reduction
definition: An anaerobic respiratory metabolism in which an organism uses sulfate as
  the terminal electron acceptor, reducing it to hydrogen sulfide while oxidizing
  organic matter or hydrogen for energy.
