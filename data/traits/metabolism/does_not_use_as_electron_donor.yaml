identifier: METPO:2000035
label: does not use as electron donor
definition: An OBJECT_PROPERTY asserting that an organism does *not* use a given chemical
  entity as an electron donor. The intended use is predicate + class composition at
  assertion time, e.g. `<organism> METPO:X CHEBI:18276` ("organism does not use H2
  as electron donor"). Negation companion to METPO:2000009.
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
