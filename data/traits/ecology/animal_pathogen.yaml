  snippet: virulence factors
  notes: Virulence-factor review supports adaptation of bacterial virulence programs
    to animal hosts.
- reference: DOI:10.1038/nrmicro1592
  snippet: secretion systems
  notes: Secretion-systems review supports T3SS/T6SS effector delivery as a major
    mechanism by which bacteria infect animal hosts.
