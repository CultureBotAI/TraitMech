discussions:
- discussion_id: kgscan-30bcdf4a32b0
  prompt: This record routes two independent paths to immune evasion -- complement-regulator
    binding by surface proteins, and effector delivery through the T3SS. In a given
    host, is either route sufficient on its own, or does established infection require
    both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The graph draws both arrows into the same node without saying whether
    they are alternatives or partners. If either is sufficient, single-target antivirulence
    strategies are viable; if evasion needs both, only combination approaches will
    work, and the two edges should carry that dependency rather than reading as parallel
    routes.
  attaches_to:
  - causal_graphs#immune_evasion
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Knowledge gap for animal pathogen: Prokaryotes in such plastispheres
    are unknown to date.'', whose sentence came from PMID:40891913. That sentence
    is about prokaryotes of marine plastispheres, not about this trait: the scan matched
    the hedging vocabulary of a gap statement without checking that the gap was about
    the trait it was filed under. The prompt above was authored instead from this
    record''s own causal graph, and none of these references are carried as its evidence,
    because they support the scraped sentence rather than the question. The scan attached
    3 further references whose snippets concern neither that sentence nor this trait;
    all 4 are reproduced here so nothing it produced is lost: PMID:40891913 ''Prokaryotes
    in such plastispheres are unknown to date.''; PMID:42279816 ''However, in South
    America, their use is still limited because of complicated regulations and inconsistent
    evidence requirements.''; PMID:41639266 ''However, the interacting effects of
    climate factors and seasonal variations in nutritional components on PMCs remain
    poorly understood.''; PMID:42197358 ''While plant growth-promoting bacteria (PGPB)
    are known to alleviate heavy metal toxicity, their role under MP-HM co-contamination
    and the differential responses of rhizosphere microbial communities remain unclear.''.'
  proposed_experiments:
  - experiment_id: x-animal-pathogen-evasion-epistasis
    name: Isogenic single- and double-mutant serum and phagocyte survival
    approach: isogenic mutant panel with ex vivo killing assays
    model_systems:
    - isolate of a T3SS-bearing animal pathogen
    - naive host serum
    - primary phagocytes from the same host species
    perturbations:
    - deletion of the complement-regulator binding protein
    - deletion of the T3SS structural apparatus
    - the double deletion
    readouts:
    - survival in non-heat-inactivated serum
    - intracellular survival after phagocyte challenge
    - surface-bound complement regulator by flow cytometry
    decision_criterion: whether either single mutant is attenuated to the same degree
      as the double mutant
    would_support: single mutants retain near-wild-type survival and only the double
      is attenuated -- the routes are independently sufficient
    would_refute: either single mutant is attenuated as severely as the double --
      the routes are not redundant and evasion requires both
  posed_date: '2026-08-17'
