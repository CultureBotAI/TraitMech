identifier: traitmech:000054
label: predatory bacterium
definition: A trophic-ecology lifestyle in which a bacterium actively kills and consumes
  other bacteria for nutrients, e.g. the periplasmic predator Bdellovibrio bacteriovorus.
definition_source: DOI:10.1146/annurev.micro.091208.073346
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: bacterial predator
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev.micro.091208.073346
evidence:
- reference: DOI:10.1146/annurev.micro.091208.073346
  notes: Sockett, "Predatory lifestyle of Bdellovibrio bacteriovorus", describes invasion,
    killing, and digestion of prey bacteria as a predatory lifestyle.
- reference: DOI:10.1111/1462-2920.13171
  notes: Pérez et al. survey predatory bacteria, their hunting strategies, prey ranges,
    and genome characteristics.
canonical_examples:
- taxon_id: NCBITaxon:959
  taxon_label: Bdellovibrio bacteriovorus
  note: Model predatory bacterium; invades the periplasm of Gram-negative prey (strain
    HD100).
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1913455/
causal_graphs:
- graph_id: predatory_bacterium_prey_killing
  title: Predatory bacteria kill and consume other bacteria
  scope_status: NONMECHANISTIC
  scope_notes: This broad ecological, host-relationship, habitat, or hazard classification
    spans multiple taxa and mechanisms; contextual protein nodes do not receive token
    UniProt examples.
  description: Evidence-backed causal sketch linking prey invasion to bacteriolytic
    killing and predator nutrient acquisition.
  nodes:
  - node_id: predatory_trait
    label: predatory bacterium
    node_type: TRAIT
    grounding: traitmech:000054
    description: Bacterial lifestyle of killing and consuming other bacteria.
  - node_id: prey_bacterium
    label: prey bacterium
    node_type: ENVIRONMENTAL_FACTOR
    description: Target bacterial cell of the predatory attack.
  - node_id: prey_killing
    label: bacteriolytic killing
    node_type: BIOLOGICAL_PROCESS
    description: Lysis or digestion of prey bacterial cells.
  - node_id: b_bacteriovorus_type_iv_pilus
    label: B. bacteriovorus type IV pilus
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0044096
    description: Type IV pilus at the invasive pole that mediates B. bacteriovorus
      attachment to prey.
  - node_id: prey_attachment
    label: B. bacteriovorus prey attachment
    node_type: BIOLOGICAL_PROCESS
    description: Attachment of B. bacteriovorus to the surface of a Gram-negative
      prey bacterium before invasion.
  - node_id: prey_invasion
    label: B. bacteriovorus prey invasion
    node_type: BIOLOGICAL_PROCESS
    description: Entry of B. bacteriovorus through the prey envelope into the prey
      periplasm.
  - node_id: invasion_portal
    label: prey attachment/invasion complex (portal)
    node_type: CELLULAR_LOCALIZATION
    description: Flexible portal complex lining the prey peptidoglycan entry hole
      during predator invasion.
  - node_id: prey_entry_pore
    label: prey peptidoglycan entry pore / bdelloplast pore
    node_type: CELLULAR_LOCALIZATION
    description: Hole in the prey peptidoglycan through which the predator enters;
      sealed to form the bdelloplast.
  - node_id: prey_cell_wall_modification
    label: prey cell-wall modification enzymes
    node_type: MOLECULAR_FUNCTION
    description: Predator enzymes that modify the prey cell wall during invasion.
  - node_id: bdelloplast
    label: bdelloplast
    node_type: CELLULAR_LOCALIZATION
    description: Rounded, sealed killed-prey cell within which the predator grows
      and replicates.
  - node_id: intraperiplasmic_growth
    label: intraperiplasmic growth / predator replication
    node_type: BIOLOGICAL_PROCESS
    description: Growth and replication of the predator inside the prey periplasm
      (bdelloplast).
  - node_id: exit_lytic_activity
    label: exit-associated lytic activity
    node_type: MOLECULAR_FUNCTION
    description: Lytic activity that breaks down the prey cell wall to release predator
      progeny.
  - node_id: progeny_release
    label: prey cell-wall lysis and progeny release
    node_type: BIOLOGICAL_PROCESS
    description: Lysis of the spent prey cell wall and exit of newly formed predator
      progeny.
  edges:
  - subject: predatory_trait
    predicate: enables
    object: prey_killing
    description: Predatory bacteria invade and lyse prey cells for nutrients.
    evidence:
    - reference: DOI:10.1146/annurev.micro.091208.073346
      notes: Sockett describes Bdellovibrio invasion and digestion of prey bacteria.
    predicate_id: RO:0002327
  - subject: prey_killing
    predicate: consumes
    object: prey_bacterium
    description: Killed prey cells provide nutrients to the predator.
    evidence:
    - reference: DOI:10.1111/1462-2920.13171
      notes: Pérez et al. survey predatory bacteria and their prey-killing strategies.
    predicate_id: biolink:consumes
  - subject: b_bacteriovorus_type_iv_pilus
    predicate: contributes to
    object: prey_attachment
    description: Type IV pili mediate B. bacteriovorus attachment to prey before invasion.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      snippet: attachment is mediated by type IV pili (T4P)
      notes: Kaplan et al. directly imaged T4aP extending from B. bacteriovorus to
        the prey outer membrane; this branch is taxon-specific.
    predicate_id: RO:0002326
  - subject: prey_bacterium
    predicate: participates in
    object: prey_attachment
    description: The living Gram-negative prey cell is the target participant in B.
      bacteriovorus attachment.
    evidence:
    - reference: DOI:10.1038/s41467-024-47412-3
      snippet: swim rapidly to another Gram-negative bacterial prey surface and then
        attach to it
      notes: Tyson et al. describe attachment to the prey surface as the first physical
        predator-prey interaction before invasion.
    predicate_id: biolink:participates_in
  - subject: prey_attachment
    predicate: precedes
    object: prey_invasion
    description: B. bacteriovorus first attaches to prey and begins invasion only
      after prey assessment.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      snippet: After assessment of prey quality, the process of invasion begins
      notes: Kaplan et al. place attachment and prey assessment before invasion in
        the endoperiplasmic predation cycle.
    predicate_id: biolink:precedes
  - subject: invasion_portal
    predicate: participates in
    object: prey_invasion
    description: The flexible portal lines the prey entry hole and seals the outer
      membrane around B. bacteriovorus during invasion.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      snippet: flexible portal structure lining a hole in the prey peptidoglycan
      notes: Cryo-electron tomography directly localized the portal at the entry hole
        during predator invasion.
    predicate_id: biolink:participates_in
  - subject: prey_cell_wall_modification
    predicate: participates in
    object: prey_invasion
    description: Enzymatic modification of the prey cell wall permits entry into the
      periplasm and formation of the bdelloplast.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      snippet: Prey invasion involves enzymatic modification of the prey cell wall
      notes: Kaplan et al. describe localized prey-wall modification at the predator-prey
        contact point as part of invasion.
    predicate_id: biolink:participates_in
  - subject: invasion_portal
    predicate: seals
    object: prey_entry_pore
    description: A flexible portal lines the prey peptidoglycan hole and seals the
      entry pore to form a bdelloplast.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      notes: 'Cryo-ET: a flexible portal lines the hole during entry and the entry
        pore is sealed to form a bdelloplast.'
  - subject: prey_cell_wall_modification
    predicate: causes
    object: bdelloplast
    description: Predator modification of the prey cell wall rounds the killed prey
      into a bdelloplast.
    evidence:
    - reference: DOI:10.1038/s41467-024-47412-3
      notes: During invasion the predator modifies the prey cell wall, rounding the
        killed prey into a bdelloplast.
    predicate_id: biolink:causes
  - subject: bdelloplast
    predicate: provides environment for
    object: intraperiplasmic_growth
    description: The sealed bdelloplast houses a live predator that grows and replicates
      inside the prey periplasm.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      notes: The sealed bdelloplast contains a live predator that grows and replicates
        inside the prey periplasm.
  - subject: exit_lytic_activity
    predicate: causes
    object: progeny_release
    description: After septation, lytic activity breaks the prey cell wall so progeny
      lyse and exit.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      notes: After synchronous septation, progeny lyse the prey cell wall and exit.
    predicate_id: biolink:causes
  - subject: intraperiplasmic_growth
    predicate: precedes
    object: progeny_release
    description: Growth and synchronous division inside the bdelloplast occur before
      progeny lyse the prey wall and exit.
    evidence:
    - reference: DOI:10.1038/s41564-023-01401-2
      snippet: progeny cells reset to the attack phase, lyse the prey cell wall
      notes: Kaplan et al. place progeny exit after consumption, intraperiplasmic
        growth, and synchronous septation.
    predicate_id: biolink:precedes
