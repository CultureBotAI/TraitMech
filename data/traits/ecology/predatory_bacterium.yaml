evidence:
- reference: DOI:10.1146/annurev.micro.091208.073346
  notes: Sockett, "Predatory lifestyle of Bdellovibrio bacteriovorus", describes
    invasion, killing, and digestion of prey bacteria as a predatory lifestyle.
- reference: DOI:10.1111/1462-2920.13171
  notes: Pérez et al. survey predatory bacteria, their hunting strategies, prey
    ranges, and genome characteristics.
