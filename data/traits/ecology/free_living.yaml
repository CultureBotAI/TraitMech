      notes: Trehalose synthesis/transport widely encoded; compatible-solute systems
        discussed as persistence traits, lost in some host-associated lineages.
    predicate_id: RO:0002327
  - subject: osmotic_stress_tolerance
    predicate: promotes
    object: free_living_trait
    description: Osmoadaptation supports persistence in unstable/saline environments
      characteristic of the free-living lifestyle.
    evidence:
    - reference: DOI:10.48550/arxiv.2302.00582
      notes: Ectoine-related osmoadaptation is highlighted as part of adaptation to
        unstable or saline environmental conditions in free-living lineages.
    predicate_id: RO:0002213
  - subject: trehalose_biosynthesis
    predicate: enables
    object: osmotic_stress_tolerance
    description: 'Trehalose accumulation through the OtsAB pathway is required for
      free-living osmotic stress tolerance: losing the pathway reduces viability under
      both nonionic and ionic hyperosmotic challenge, and supplying trehalose restores
      it.'
    evidence:
    - reference: DOI:10.1128/mBio.00390-21
      snippet: the Δ(otsCB-otsA) mutant showed reduced viability under these stress
        conditions similar to the ΔecfG mutant
      notes: 'Free-living hyperosmotic challenge in Bradyrhizobium diazoefficiens
        USDA 110: 400 mM sorbitol, 27 mM NaCl, 50 mM MgCl2, 75 mM MgSO4. The nonionic
        sorbitol condition is what separates osmotic pressure from salt-specific ion
        toxicity. Causality is pinned by two further controls: expressing a cytoplasmic
        trehalase (strain TreF-1) phenocopies the deletion, and exogenous trehalose
        rescues the otsA deletion but not the transporter-deficient otsCB-otsA or
        otsCB deletions, so the phenotype tracks intracellular trehalose rather than
        the locus.'
    - reference: DOI:10.1128/AEM.02483-09
      snippet: the single, double, and triple mutant strains lacking the OtsAB pathway
        (the ΔotsA, ΔotsA ΔtreS or ΔotsA ΔtreY, and ΔotsA ΔtreS ΔtreY mutants) were
        inhibited for growth on 60 mM NaCl
      notes: Independently constructed mutants in the same strain background (published
        as B. japonicum), so the phenotype does not depend on one construct. Mutants
        lacking both the OtsAB and TreYZ routes failed to grow on salt-containing
        medium. The same study found the low-trehalose otsA and otsA treY mutants
        were NOT worse than wild type under desiccation at 50% relative humidity,
        which is why this edge is scoped to osmotic tolerance rather than to environmental
        stress generally.
    predicate_id: RO:0002327
