  prompt: 'Knowledge gap for free-living: Interactions between parasites and the gut
    microbiota play a key role in immune responses and susceptibility to zoonotic
    diseases; however, many aspects of how protozoan infections alter microbial diversity
    and how these changes influence parasite pathogenicity and host defense remain
    poorly understood.'
