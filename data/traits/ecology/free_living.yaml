discussions:
- discussion_id: kgscan-d5aefedf82bb
  prompt: Ectoine and glycine betaine both enable osmotic stress tolerance here, but
    trehalose is wired instead to environmental stress tolerance -- a node with no
    outgoing edge. Is that split a real distinction, or does trehalose belong on the
    osmotic route too?
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  rationale: 'Because environmental_stress_tolerance has no outgoing edge, nothing
    downstream depends on trehalose at all: this record currently predicts the trait''s
    osmotolerance from two systems and leaves the third dangling. Either reading has
    a consequence. If trehalose does serve osmotic tolerance, a genome carrying only
    trehalose scores as non-osmotolerant when it is not, which is exactly the inference
    anything reading habitat range off gene content would make. If the split is real
    -- trehalose for desiccation and thermal stress rather than osmolarity -- then
    the dangling node needs its own edge onward to the trait. The second question,
    whether the two routes that do converge are redundant or condition-partitioned,
    rides along on the same experiment: their costs differ sharply, since de novo
    ectoine synthesis is carbon-expensive where betaine uptake is cheap given a precursor.'
  attaches_to:
  - causal_graphs#osmotic_stress_tolerance
  - causal_graphs#environmental_stress_tolerance
  - causal_graphs#ectoine_biosynthesis
  - causal_graphs#glycine_betaine_system
  - causal_graphs#trehalose_biosynthesis
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Knowledge gap for free-living: Interactions between parasites
    and the gut microbiota play a key role in immune responses and susceptibility
    to zoonotic diseases; however, many aspects of how protozoan infections alter
    microbial diversity and how these changes influence parasite pathogenicity and
    host defense remain poorly understood.'', whose sentence came from PMID:41989588.
    That sentence is about protozoan infection and gut microbial diversity, not about
    this trait: the scan matched the hedging vocabulary of a gap statement without
    checking that the gap was about the trait it was filed under. The prompt above
    was authored instead from this record''s own causal graph, and none of these references
    are carried as its evidence, because they support the scraped sentence rather
    than the question. The scan attached 3 further references whose snippets concern
    neither that sentence nor this trait; all 4 are reproduced here so nothing it
    produced is lost: PMID:41989588 ''Interactions between parasites and the gut microbiota
    play a key role in immune responses and susceptibility to zoonotic diseases; however,
    many aspects of how protozoan infections alter microbial diversity and how these
    changes influence parasite pathogenicity and host defense remain poorly understood.'';
    PMID:42039802 ''Engineered microbial assemblies tailored to specific host plants
    and environmental conditions have shown potential in stabilizing crop performance
    during drought, salinity, and nutrient limitations.''; PMID:41943163 ''OBJECTIVES:
    Oxo-polyethylene (oxo-PE) is marketed as a biodegradable plastic, yet its environmental
    degradation remains poorly understood, particularly in marine contexts.''; PMID:42125129
    "However, contradictions persist regarding pH''s effect on microbial diversity,
    with unresolved questions about how specific environmental conditions regulate
    microbial taxa.".'
  proposed_experiments:
  - experiment_id: x-compatible-solute-partitioning
    name: Combinatorial solute-pathway knockouts across an environmental matrix
    approach: combinatorial knockout panel with matrix growth phenotyping
    model_systems:
    - a free-living halotolerant isolate carrying all three systems
    - single, double, and triple pathway knockouts
    perturbations:
    - an osmolarity gradient spanning the growth range
    - low and high temperature at each osmolarity
    - carbon-replete versus carbon-limited medium
    - betaine precursor present or absent
    readouts:
    - growth rate and final yield across the matrix
    - intracellular solute pools by NMR or LC-MS
    - the osmolarity limit for each genotype
    decision_criterion: whether the trehalose knockout loses growth at high osmolarity
      specifically, with temperature and water activity held constant
    would_support: trehalose loss costs nothing osmotically and only shows under desiccation
      or heat -- the split in the graph is real and environmental_stress_tolerance
      needs its own edge onward
    would_refute: the trehalose knockout is osmotically impaired -- it belongs on
      the osmotic route with the other two
  posed_date: '2026-08-17'
  resolved_date: '2026-08-31'
  resolution_note: 'Refuted. The record''s own would_refute criterion was ''the trehalose
    knockout is osmotically impaired'', and it is: in Bradyrhizobium diazoefficiens
    USDA 110 the otsCB-otsA deletion loses viability at 400 mM sorbitol, a nonionic
    challenge that separates osmotic pressure from ion toxicity, as well as at 27
    mM NaCl, 50 mM MgCl2 and 75 mM MgSO4 (DOI:10.1128/mBio.00390-21). A cytoplasmic
    trehalase phenocopies the deletion and exogenous trehalose rescues the otsA deletion
    but not the transporter-deficient strains, so the phenotype tracks intracellular
    trehalose. Independently constructed mutants in the same background are inhibited
    on 60 mM NaCl (DOI:10.1128/AEM.02483-09). The split was therefore not real, and
    trehalose_biosynthesis now enables osmotic_stress_tolerance alongside ectoine
    and glycine betaine. Two things were deliberately NOT decided here and are tracked
    in issue 614: the weaker pre-existing trehalose_biosynthesis to environmental_stress_tolerance
    edge was retained rather than deleted, and the observation that the same AEM study
    found no desiccation defect for low-trehalose otsA mutants argues trehalose''s
    role is specifically osmotic.'
