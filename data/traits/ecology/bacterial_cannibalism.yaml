identifier: traitmech:000626
label: bacterial cannibalism
definition: A predatory bacterial phenotype in which cells kill susceptible conspecific
  cells and obtain nutrients from the killed cells.
definition_source: DOI:10.1126/science.1086462
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000054
evidence:
- reference: DOI:10.1126/science.1086462
  snippet: The sporulating cells feed on the nutrients thereby released, which allows
    them to keep growing rather than to complete morphogenesis.
  notes: Gonzalez-Pastor et al. (2003), PMID:12817086, scientific abstract directly
    retrieved from Europe PMC. The author-posted main text at https://www.researchgate.net/publication/10699307_Cannibalism_by_Sporulating_Bacteria
    was also read. It reports sibling killing in the PY79 laboratory background, while
    the nutritional explanation is proposed from killing and sporulation phenotypes,
    not traced nutrient uptake. The snippet preserves the abstract's stronger wording
    without upgrading that inference. Actual figures and supplements were not inspected;
    no numerical or protein-resolved claim is imported.
- reference: DOI:10.1111/j.1365-2958.2009.06882.x
  snippet: Cannibal cells express the skf and sdp toxin systems to lyse a fraction
    of their sensitive siblings.
  notes: Lopez et al. (2009), PMID:19775247, PMC2983100, scientific Summary, directly
    checked in NCBI BioC full text at https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC2983100/unicode.
    Results, Discussion and Experimental Procedures were read. NCIB3610 is the wild-type
    background; prominent hypercannibal phenotypes concern engineered derivatives.
    Nutrient-mediated sporulation delay remains an interpretation, not a nutrient-flux
    measurement. Actual figures and supplements were not inspected.
- reference: DOI:10.1128/mbio.00525-26
  snippet: our data challenge the established role of cannibalism-dependent killing
    as the mechanism behind this sporulation delay.
  notes: Friebel et al. (2026), PMID:42294941, PMC13343845.1, published 2026-06-15,
    IMPORTANCE section, not the scientific Abstract. Directly checked against Europe
    PMC full-text XML and https://pmc.ncbi.nlm.nih.gov/articles/PMC13343845.1/. Results,
    Discussion and Methods were read; actual figures and supplements were not inspected.
    DK1042 is an NCIB3610-derived laboratory background. Biofilm differentiation and
    membrane-integrity readouts do not directly establish nutrient transfer. This
    is counterevidence to a universal killing-based explanation, not a new positive
    demonstration of the nutritional phenotype.
discussions:
- discussion_id: bacterial-cannibalism-operational-scope
  prompt: Distinguish nutritional cannibalism from broader developmental usage.
  kind: CURATION_TODO
  status: OPEN
  rationale: This class retains the classical killing-and-feeding sense. Friebel et
    al. 2026 also calls the wider toxin-dependent biofilm differentiation program
    cannibalism; that usage need not satisfy this narrower nutritional definition.
    The predatory bacterium parent traitmech:000054 fits this operational scope, not
    every phenotype assigned that name in the literature. Bacteriocin production traitmech:000183
    requires neither conspecific killing nor feeding. Saprotrophy traitmech:000055
    does not require killing the food source; natural competence traitmech:000087
    concerns DNA uptake. Fratricide, programmed cell death, biofilm formation and
    sporulation delay are not exact synonyms. Resolve broader terminology and external
    mappings before adding xrefs; do not assume species-level disjointness.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: bacterial-cannibalism-feeding-evidence
  prompt: Resolve direct feeding evidence and strain provenance before exemplar curation.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The cited studies support the term and sibling-killing biology but do
    not justify treating every toxin-positive population as a demonstrated nutritional
    cannibal. Obtain direct conspecific nutrient-use evidence, inspect the supplements
    and verify natural strain provenance before adding canonical examples. Gene presence,
    expression, inhibition zones, membrane damage and delayed sporulation alone are
    insufficient. Do not infer a protein-resolved causal graph from toxin names or
    sequence profiles. Mechanistic edges, protein accessions and canonical taxa are
    deliberately deferred.
  posed_by: codex
  posed_date: '2026-10-05'
