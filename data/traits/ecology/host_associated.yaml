evidence:
- reference: DOI:10.1073/pnas.1218525110
  notes: McFall-Ngai et al. document the ubiquity of host-associated microbial
    communities across the animal kingdom.
- reference: DOI:10.1126/science.1104816
  notes: Bäckhed et al. characterize the host-associated gut microbiota as a dense,
    coevolved community.
