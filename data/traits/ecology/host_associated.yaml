identifier: traitmech:000049
label: host-associated
definition: A habitat association in which an organism lives persistently on or in a
  plant or animal host (e.g. as a member of a host microbiome), spanning commensal,
  mutualistic, and pathogenic relationships.
definition_source: DOI:10.1073/pnas.1218525110
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
