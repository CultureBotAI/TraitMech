identifier: traitmech:000051
label: rhizosphere association
definition: A habitat association in which an organism lives in the rhizosphere — the
  soil zone influenced by plant roots and root exudates — a hotspot of microbial
  activity and plant-microbe interaction.
definition_source: DOI:10.1038/nrmicro3109
