identifier: traitmech:000044
label: nitrogen-fixing symbiosis
definition: A mutualistic symbiosis in which a diazotrophic bacterium fixes
  atmospheric N2 for a host plant — classically rhizobia in legume root nodules —
  in exchange for photosynthate.
definition_source: DOI:10.1038/nrmicro.2017.171
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
