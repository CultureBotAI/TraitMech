  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro.2017.171
- synonym_text: root-nodule symbiosis
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro2990
evidence:
- reference: DOI:10.1038/nrmicro.2017.171
  notes: Poole et al. describe the free-living-to-endosymbiont transition of rhizobia
    that forms N2-fixing legume root nodules.
- reference: DOI:10.1038/nrmicro2990
  notes: Oldroyd, "Speak, friend, and enter", supports the symbiotic signalling that
    establishes beneficial nitrogen-fixing plant-microbe associations.
