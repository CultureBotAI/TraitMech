identifier: traitmech:000701
label: collective bacterial predation
definition: A predatory bacterial phenotype in which cells act in coordinated multicellular
  groups to kill bacterial prey and obtain nutrients from the killed cells.
definition_source: DOI:10.1038/s41467-023-41193-x
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
