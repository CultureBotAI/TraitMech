  - node_id: mucosal_adhesion
    label: adhesion to intestinal mucus/epithelium
    node_type: BIOLOGICAL_PROCESS
    description: Binding of bacterial adhesins to intestinal mucus or epithelial receptors.
  - node_id: bile_acids
    label: bile acids/bile salts
    node_type: CHEMICAL
    description: Host bile acids and conjugated bile salts in the gut.
  - node_id: antimicrobial_peptides
