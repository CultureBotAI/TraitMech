  source: DOI:10.1126/science.1104816
evidence:
- reference: DOI:10.1126/science.1104816
  notes: Bäckhed et al. characterize the distal intestine as a dense microbial
    habitat whose residents provide metabolic capabilities to the host.
- reference: DOI:10.1073/pnas.1218525110
  notes: McFall-Ngai et al. support the gut as a major site of host-associated
    microbial communities across animals.
