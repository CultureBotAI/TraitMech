  - node_id: luminal_oxygen_limitation
    label: limitation of colonic luminal oxygen diffusion
    node_type: BIOLOGICAL_PROCESS
    description: Host functions that limit oxygen diffusion into the colonic lumen
      during homeostasis.
  - node_id: primary_fermenter_community
    label: primary-fermenter-dominated community
    node_type: STATE
    description: A gut microbial community dominated by anaerobic primary fermenters.
  edges:
  - subject: gastrointestinal_habitat
    predicate: confers
    object: gut_associated_trait
    description: The intestinal environment supports persistent residency.
    evidence:
    - reference: DOI:10.1126/science.1104816
      notes: Bäckhed et al. characterize the distal intestine as a dense microbial
        habitat.
    predicate_id: METPO:2007700
  - subject: gut_associated_trait
    predicate: contributes to
    object: host_metabolic_contribution
    description: Gut microbiota provide metabolic capabilities to the host.
    evidence:
    - reference: DOI:10.1073/pnas.1218525110
      notes: McFall-Ngai et al. support the gut microbiota as a metabolically consequential
        host-associated community.
    predicate_id: RO:0002326
  - subject: adhesins
    predicate: enables
    object: mucosal_adhesion
    description: Bacterial adhesins bind host receptors to enable adhesion.
    evidence:
    - reference: DOI:10.3390/microorganisms12051026
      notes: Adhesion primarily relies on adhesins; binding of bacterial adhesins
        to host receptors is a prerequisite for long-term colonization (Lin et al.,
        2024).
    predicate_id: RO:0002327
  - subject: mucosal_adhesion
    predicate: prerequisite for
    object: gut_associated_trait
    description: Adhesion to mucus/epithelium is a prerequisite for long-term gut
      colonization.
    evidence:
    - reference: DOI:10.3390/microorganisms12051026
      notes: Adhesion emphasized as the prerequisite for persistence (adhesion ->
        growth -> reproduction) (Lin et al., 2024).
  - subject: bile_acids
    predicate: exerts antimicrobial pressure on
    object: gastrointestinal_habitat
    description: Bile acids shape gut community via antimicrobial and detergent-like
      properties.
    evidence:
    - reference: DOI:10.1128/spectrum.03576-23
      notes: Bile acids shape the gut microbiome composition due to antimicrobial
        and detergent-like properties, creating a harsh gut environment (McMillan
        et al., 2024).
  - subject: bile_acids
    predicate: inhibits
    object: small_intestinal_bacterial_growth
    description: Small-intestinal bile salts inhibit growth of many bacteria.
    evidence:
    - reference: DOI:10.1016/j.chom.2024.05.011
      notes: Bile salts and Paneth-cell antimicrobial peptides inhibit growth of many
        bacteria in the small intestine (Muramatsu & Winter, 2024).
    predicate_id: RO:0002212
  - subject: antimicrobial_peptides
    predicate: inhibits
    object: small_intestinal_bacterial_growth
    description: Paneth-cell antimicrobial peptides inhibit growth of many small-intestinal
      bacteria.
    evidence:
    - reference: DOI:10.1016/j.chom.2024.05.011
      notes: Antimicrobial peptides released by Paneth cells inhibit growth of many
        bacteria in the small intestine (Muramatsu & Winter, 2024).
    predicate_id: RO:0002212
  - subject: peristalsis
    predicate: decreases
    object: duodenal_retention
    description: Strong peristalsis (plus bile/antimicrobials) makes the duodenum
      hostile to retention.
    evidence:
    - reference: DOI:10.3390/microorganisms12051026
      notes: The duodenum is hostile to retention due to bile, antimicrobials, and
        strong peristalsis (Lin et al., 2024).
    predicate_id: RO:0002212
  - subject: luminal_oxygen_limitation
    predicate: contributes to
    object: primary_fermenter_community
    description: Host limitation of luminal oxygen shelters a primary-fermenter-dominated
      community.
    evidence:
    - reference: DOI:10.1128/iai.00302-24
      notes: During homeostasis, host functions that limit oxygen diffusion into the
        colonic lumen shelter a community dominated by primary fermenters (Lee et
        al., 2024).
    predicate_id: RO:0002326
