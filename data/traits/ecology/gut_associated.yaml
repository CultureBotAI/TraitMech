  title: Gut-associated lifestyle in the gastrointestinal microbiota
  description: Evidence-backed causal sketch linking gastrointestinal habitat to persistent
    gut-microbiota membership and host nutritional contributions.
  nodes:
  - node_id: gut_associated_trait
    label: gut-associated
    node_type: TRAIT
    grounding: traitmech:000052
    description: Persistent member of an animal gastrointestinal microbiota.
  - node_id: gastrointestinal_habitat
    label: gastrointestinal tract habitat
    node_type: ENVIRONMENTAL_FACTOR
    description: Animal distal intestine and other GI compartments.
  - node_id: host_metabolic_contribution
