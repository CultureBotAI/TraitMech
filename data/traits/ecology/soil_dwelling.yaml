identifier: traitmech:000050
label: soil-dwelling
definition: A habitat association in which an organism's primary environment is soil,
  a complex and highly diverse microbial habitat central to terrestrial biogeochemical
  cycling.
definition_source: DOI:10.1038/nrmicro.2017.87
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000047
synonyms:
- synonym_text: soil-associated
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro.2017.87
evidence:
- reference: DOI:10.1038/nrmicro.2017.87
  notes: Fierer, "Embracing the unknown", characterizes the soil microbiome as a distinct,
    complex microbial habitat.
- reference: DOI:10.1038/nrmicro1341
  notes: Martiny et al. support soil communities as biogeographically structured microbial
    habitats.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: soil bacterium
  reference: DOI:10.1111/j.1574-6941.1999.tb00555.x
- taxon_id: NCBITaxon:1902
  taxon_label: Streptomyces coelicolor
  note: soil actinomycete
  reference: PMID:12000953
- taxon_id: NCBITaxon:294
  taxon_label: Pseudomonas fluorescens
  note: rhizosphere soil bacterium
  reference: PMID:23350846
causal_graphs:
- graph_id: soil_dwelling_biogeochemistry
  title: Soil-dwelling microbes drive terrestrial biogeochemical cycling
  description: Evidence-backed causal sketch linking soil habitat to participation
    in biogeochemical cycling.
  nodes:
  - node_id: soil_dwelling_trait
    label: soil-dwelling
    node_type: TRAIT
    grounding: traitmech:000050
    description: Persistent residence in soil habitat.
  - node_id: soil_habitat
    label: soil habitat
    node_type: ENVIRONMENTAL_FACTOR
    description: Complex terrestrial soil environment.
  - node_id: biogeochemical_cycling
    label: biogeochemical cycling
    node_type: BIOLOGICAL_PROCESS
    description: Microbially mediated cycling of C, N, S, and other elements in soils.
  - node_id: low_organic_carbon
    label: low available organic carbon
    node_type: ENVIRONMENTAL_FACTOR
    description: Carbon-limited (oligotrophic) soil conditions.
  - node_id: oligotrophic_lifestyle
    label: oligotrophic lifestyle
    node_type: STATE
    description: Slow-growing, streamlined small-genome strategy with reduced motility/chemotaxis.
  - node_id: soil_resource_availability
    label: soil resource availability and moisture
    node_type: ENVIRONMENTAL_FACTOR
    description: Resource-rich, humid, acid-neutral soil conditions favoring growth.
  - node_id: aridity
    label: soil aridity
    node_type: ENVIRONMENTAL_FACTOR
    description: Dry soil moisture conditions / water limitation.
  - node_id: potential_growth_rate
    label: soil microbiome potential growth rate
    node_type: QUALITY
    description: Community-level potential growth rate of soil microbes.
  - node_id: soil_carbon_availability
    label: high soil carbon availability
    node_type: ENVIRONMENTAL_FACTOR
    description: Carbon-rich soil microsites such as rhizosphere/surface soil.
  - node_id: flagellar_motility
    label: flagellar motility
    node_type: BIOLOGICAL_PROCESS
    description: Flagellum-dependent cell motility.
    grounding: GO:0071973
  - node_id: climate_extreme_event
    label: extreme climatic event
    node_type: ENVIRONMENTAL_FACTOR
    description: Heat, flood, or freeze disturbance events in soil.
  - node_id: dormancy_sporulation
    label: dormancy and sporulation gene program
    node_type: BIOLOGICAL_PROCESS
    description: Genetic programs for dormancy and spore formation.
  - node_id: soil_pH_precip_cn
    label: soil pH, precipitation and C:N
    node_type: ENVIRONMENTAL_FACTOR
    description: Edaphic and climatic drivers (pH, annual precipitation, soil C:N
      ratio).
  - node_id: life_history_axes
    label: soil bacterial life-history strategy axes
    node_type: STATE
    description: Genomic life-history strategy axes (MCOA1/MCOA2) of soil bacterial
      communities.
  edges:
  - subject: soil_habitat
    predicate: confers
    object: soil_dwelling_trait
    description: Soil substrate and pore-water chemistry sustain soil-resident microbes.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.87
      notes: Fierer characterizes the soil microbiome as a distinct microbial habitat.
    predicate_id: METPO:2007700
  - subject: soil_dwelling_trait
    predicate: contributes to
    object: biogeochemical_cycling
    description: Soil microbes drive terrestrial biogeochemical cycling.
    evidence:
    - reference: DOI:10.1038/nrmicro1341
      notes: Martiny et al. show soil communities are biogeographically structured
        habitats central to ecosystem function.
    predicate_id: RO:0002326
  - subject: low_organic_carbon
    predicate: enriches for
    object: oligotrophic_lifestyle
    description: Carbon-limited soils enrich oligotrophic taxa with small genomes
      and reduced motility/chemotaxis.
    evidence:
    - reference: DOI:10.1093/ismeco/ycae081
      notes: 'Dragone et al.: oligotroph-enriched taxa in carbon-limited soils had
        smaller genomes, slower growth, carbon-storage pathways, and under-represented
        chemotaxis/motility genes.'
  - subject: soil_resource_availability
    predicate: increases
    object: potential_growth_rate
    description: Resource-rich, humid, acid-neutral soils support higher microbiome
      potential growth.
    evidence:
    - reference: DOI:10.1038/s41467-024-53753-w
      notes: 'Zhou et al.: high potential growth in resource-rich, acid-neutral soils
        of cold, humid regions (18O-H2O DNA incorporation).'
    predicate_id: RO:0002213
  - subject: aridity
    predicate: decreases
    object: potential_growth_rate
    description: Aridity lowers soil microbiome potential growth rate.
    evidence:
    - reference: DOI:10.1038/s41467-024-53753-w
      notes: 'Zhou et al.: aridity was a stronger predictor of community growth than
        temperature; dry soils had lower potential growth.'
    predicate_id: RO:0002212
  - subject: soil_carbon_availability
    predicate: increases prevalence of
    object: flagellar_motility
    description: High soil carbon availability raises prevalence of flagellar motility.
    evidence:
    - reference: DOI:10.1093/ismejo/wrae067
      notes: 'Ramoneda et al.: rhizosphere ~11.5% higher flagellar prevalence (P=0.012);
        glucose amendment increased prevalence (P=0.017).'
  - subject: climate_extreme_event
    predicate: increases
    object: dormancy_sporulation
    description: Heat, flood and freeze extremes increase dormancy and sporulation
      gene abundance.
    evidence:
    - reference: DOI:10.1038/s41586-024-08185-3
      notes: 'Knight et al.: dormancy and sporulation genes increased across flood,
        freeze and heat; 46% of annotated genes shifted at disturbance end.'
    predicate_id: RO:0002213
  - subject: soil_pH_precip_cn
    predicate: predicts
    object: life_history_axes
    description: Soil pH, precipitation and C:N predict soil bacterial life-history
      genomic axes.
    evidence:
    - reference: DOI:10.1038/s41564-023-01465-0
      notes: 'Piton et al.: random-forest models using pH, precipitation and C:N predicted
        MCOA1/MCOA2 (R2=0.80, 0.58); pH and precipitation top predictors.'
