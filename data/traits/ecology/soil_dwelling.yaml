identifier: traitmech:000050
label: soil-dwelling
definition: A habitat association in which an organism's primary environment is soil,
  a complex and highly diverse microbial habitat central to terrestrial biogeochemical
  cycling.
definition_source: DOI:10.1038/nrmicro.2017.87
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000047
synonyms:
- synonym_text: soil-associated
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro.2017.87
evidence:
- reference: DOI:10.1038/nrmicro.2017.87
  snippet: a gram of soil can contain thousands of individual microbial taxa
  notes: Verified against the Fierer review; it frames soil as a diverse, complex
    microbial habitat rather than a single uniform niche.
- reference: DOI:10.1038/nrmicro1341
  snippet: free-living microbial taxa exhibit biogeographic patterns
  notes: Verified against the Martiny et al. abstract; environmental selection and
    spatial structure support treating soil association as habitat ecology, not simple
    taxonomic membership.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: soil bacterium
  reference: DOI:10.1111/j.1574-6941.1999.tb00555.x
- taxon_id: NCBITaxon:1902
  taxon_label: Streptomyces coelicolor
  note: soil actinomycete
  reference: PMID:12000953
- taxon_id: NCBITaxon:294
  taxon_label: Pseudomonas fluorescens
  note: rhizosphere soil bacterium
  reference: PMID:23350846
causal_graphs:
- graph_id: soil_dwelling_biogeochemistry
  title: Soil-dwelling microbes in soil life-history contexts
  scope_status: NONMECHANISTIC
  scope_notes: This broad ecological, host-relationship, habitat, or hazard classification
    spans multiple taxa and mechanisms; contextual protein nodes do not receive token
    UniProt examples.
  description: Evidence-backed nonmechanistic sketch connecting soil habitat, biogeochemical
    cycling, and community-level oligotrophy, growth, motility, dormancy, and genomic
    life-history axes.
  nodes:
  - node_id: soil_dwelling_trait
    label: soil-dwelling
    node_type: TRAIT
    grounding: traitmech:000050
    description: Persistent residence in soil habitat.
  - node_id: soil_habitat
    label: soil habitat
    node_type: ENVIRONMENTAL_FACTOR
    description: Complex terrestrial soil environment.
  - node_id: biogeochemical_cycling
    label: biogeochemical cycling
    node_type: BIOLOGICAL_PROCESS
    description: Microbially mediated cycling of C, N, S, and other elements in soils.
  - node_id: low_organic_carbon
    label: low available organic carbon
    node_type: ENVIRONMENTAL_FACTOR
    description: Carbon-limited (oligotrophic) soil conditions.
  - node_id: oligotrophic_lifestyle
    label: oligotrophic lifestyle
    node_type: STATE
    description: Slow-growing, streamlined small-genome strategy with reduced motility/chemotaxis.
  - node_id: soil_resource_availability
    label: soil resource availability and moisture
    node_type: ENVIRONMENTAL_FACTOR
    description: Resource-rich, humid, acid-neutral soil conditions favoring growth.
  - node_id: aridity
    label: soil aridity
    node_type: ENVIRONMENTAL_FACTOR
    description: Dry soil moisture conditions / water limitation.
  - node_id: potential_growth_rate
    label: soil microbiome potential growth rate
    node_type: QUALITY
    description: Community-level potential growth rate of soil microbes.
  - node_id: soil_carbon_availability
    label: high soil carbon availability
    node_type: ENVIRONMENTAL_FACTOR
    description: Carbon-rich soil microsites such as rhizosphere/surface soil.
  - node_id: flagellar_motility
    label: flagellar motility
    node_type: BIOLOGICAL_PROCESS
    description: Flagellum-dependent cell motility.
    grounding: GO:0071973
  - node_id: climate_extreme_event
    label: extreme heat event
    node_type: ENVIRONMENTAL_FACTOR
    description: Experimental heat disturbance in soil.
  - node_id: dormancy_sporulation
    label: dormancy and sporulation gene program
    node_type: BIOLOGICAL_PROCESS
    description: Genetic programs for dormancy and spore formation.
  - node_id: soil_pH_precip_cn
    label: soil pH, precipitation and C:N
    node_type: ENVIRONMENTAL_FACTOR
    description: Edaphic and climatic drivers (pH, annual precipitation, soil C:N
      ratio).
  - node_id: life_history_axes
    label: soil bacterial life-history strategy axes
    node_type: STATE
    description: Genomic life-history strategy axes (MCOA1/MCOA2) of soil bacterial
      communities.
  - node_id: soil_life_history_activity_context
    label: soil life-history and activity context
    node_type: STATE
    description: Community-level soil microbial context spanning oligotrophy, growth
      potential, motility, dormancy/sporulation, and genomic life-history axes.
  edges:
  - subject: soil_habitat
    predicate: confers
    object: soil_dwelling_trait
    description: The terrestrial soil environment hosts soil-resident microbes.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.87
      snippet: a broad diversity of microbial taxa
      notes: Verified against the Fierer review; the claim is habitat-level and does
        not assert a universal molecular mechanism for all soil microbes.
    predicate_id: METPO:2007700
  - subject: soil_dwelling_trait
    predicate: contributes to
    object: biogeochemical_cycling
    description: Soil microbes contribute to terrestrial biogeochemical cycling.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.87
      snippet: specific microbial controls on soil processes
      notes: Verified against the Fierer review; soil microbial processes include
        nutrient transformations and organic carbon-pool dynamics.
    predicate_id: RO:0002326
  - subject: low_organic_carbon
    predicate: associated with
    object: oligotrophic_lifestyle
    description: Low-carbon soil gradients are associated with oligotrophic taxa carrying
      small genomes, lower potential growth rates, and fewer chemotaxis/motility genes.
    evidence:
    - reference: DOI:10.1093/ismeco/ycae081
      snippet: chemotaxis and motility were under-represented
      notes: Verified against the open ISME Communications full text; the edge is
        retained as an ecological association rather than a deterministic carbon-to-genome
        mechanism.
    predicate_id: biolink:associated_with
  - subject: soil_resource_availability
    predicate: associated with
    object: potential_growth_rate
    description: Resource-rich, humid, acid-neutral soils are associated with higher
      microbiome potential growth.
    evidence:
    - reference: DOI:10.1038/s41467-024-53753-w
      snippet: exhibit high potential growth rates
      notes: Verified against the open Nature Communications abstract; the global
        pattern is observational, so the edge no longer uses a direct positive-regulation
        predicate.
    predicate_id: biolink:associated_with
  - subject: aridity
    predicate: associated with
    object: potential_growth_rate
    description: Dry and resource-poor soils are associated with lower soil microbiome
      potential growth rates.
    evidence:
    - reference: DOI:10.1038/s41467-024-53753-w
      snippet: display lower potential growth rates
      notes: Verified against the open Nature Communications abstract; the study reports
        a macroscale association across soil microbiomes.
    predicate_id: biolink:associated_with
  - subject: soil_carbon_availability
    predicate: associated with
    object: flagellar_motility
    description: High soil carbon availability is associated with greater community-level
      prevalence of flagellar motility genes.
    evidence:
    - reference: DOI:10.1093/ismejo/wrae067
      snippet: prevalence of flagellar motility is positively associated with soil
        C availability
      notes: Verified against the open ISME Journal full text; glucose amendment and
        four field gradients support the association.
    predicate_id: biolink:associated_with
  - subject: climate_extreme_event
    predicate: increases
    object: dormancy_sporulation
    description: Experimental heat treatment increased soil dormancy and sporulation
      gene abundance.
    evidence:
    - reference: DOI:10.1038/s41586-024-08185-3
      snippet: enhancing dormancy and sporulation genes
      notes: Verified against the open Nature abstract; the curated edge is narrowed
        to heat because the abstract identifies heat, not all imposed extremes, as
        the treatment enhancing dormancy and sporulation genes.
    predicate_id: RO:0002213
  - subject: soil_pH_precip_cn
    predicate: associated with
    object: life_history_axes
    description: Soil pH, precipitation and C:N are associated with soil bacterial
      life-history genomic axes in random-forest models.
    evidence:
    - reference: DOI:10.1038/s41564-023-01465-0
      snippet: Random forest analyses show that soil pH
      notes: Verified against the PubMed abstract for the Nature Microbiology article;
        the edge is scoped as community-level statistical association.
    predicate_id: biolink:associated_with
  - subject: soil_habitat
    predicate: associated with
    object: soil_life_history_activity_context
    description: Soil habitat provides the heterogeneous ecological context in which
      resident microbes partition across multiple activity and life-history strategies.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.87
      snippet: categorize soil microorganisms on the basis of their ecological strategies
      notes: Verified against the Fierer review; the connector groups soil-associated
        community branches without asserting a single universal soil-dwelling mechanism.
    predicate_id: biolink:associated_with
  - subject: oligotrophic_lifestyle
    predicate: associated with
    object: soil_life_history_activity_context
    description: Oligotrophic taxa in low-carbon soils are one branch of the community-level
      soil life-history context.
    evidence:
    - reference: DOI:10.1093/ismeco/ycae081
      snippet: diverse array of ecological strategies used by soil bacteria
      notes: Verified against the open ISME Communications full text; oligotroph-enriched
        taxa are treated as a carbon-gradient association within soils.
    predicate_id: biolink:associated_with
  - subject: potential_growth_rate
    predicate: associated with
    object: soil_life_history_activity_context
    description: Potential community growth rate is an activity axis associated with
      moisture and resource gradients across soils.
    evidence:
    - reference: DOI:10.1038/s41467-024-53753-w
      snippet: spatial variation of microbial potential growth rates
      notes: Verified against the open Nature Communications abstract; the Zhou et
        al. global survey models soil microbiome potential growth as a community-level
        ecological axis.
    predicate_id: biolink:associated_with
  - subject: flagellar_motility
    predicate: associated with
    object: soil_life_history_activity_context
    description: Flagellar-motility gene prevalence is a carbon-associated mobility
      branch in soil communities.
    evidence:
    - reference: DOI:10.1093/ismejo/wrae067
      snippet: prevalence of flagellar motility in bacterial communities and soil
        C availability
      notes: Verified against the open ISME Journal full text; Ramoneda et al. connect
        flagellar prevalence with soil carbon availability across community datasets.
    predicate_id: biolink:associated_with
  - subject: dormancy_sporulation
    predicate: associated with
    object: soil_life_history_activity_context
    description: Dormancy and sporulation gene programs are stress-response branches
      in disturbed soil communities.
    evidence:
    - reference: DOI:10.1038/s41586-024-08185-3
      snippet: soil microbiomes from different climates share unified responses to
        extreme climatic events
      notes: Verified against the open Nature abstract; heat-enhanced dormancy/sporulation
        abundance is retained as a soil disturbance context.
    predicate_id: biolink:associated_with
  - subject: life_history_axes
    predicate: associated with
    object: soil_life_history_activity_context
    description: The soil bacterial MCOA axes summarize genomic life-history strategies
      associated with pH, C:N, and precipitation gradients.
    evidence:
    - reference: DOI:10.1038/s41564-023-01465-0
      snippet: drive the dominant life history strategy of soil bacterial communities
      notes: Verified against the Nature Microbiology abstract; Piton et al. place
        soil pH, C:N ratio, and precipitation as predictors of community-level genomic
        strategy axes.
    predicate_id: biolink:associated_with
