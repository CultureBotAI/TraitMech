  source: DOI:10.1038/s41579-021-00550-7
evidence:
- reference: DOI:10.1038/s41579-021-00550-7
  notes: Drew et al. define parasitism as the harmful pole of the parasite-mutualist
    continuum and describe evolutionary transitions along it.
- reference: DOI:10.1073/pnas.1218525110
  notes: McFall-Ngai et al. support host-exploitative associations as one outcome of
    the shared host-colonization toolkit.
