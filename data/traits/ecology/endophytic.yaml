  synonym_type: EXACT_SYNONYM
  source: DOI:10.3390/microorganisms5040077
- synonym_text: endophytism
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.00050-14
evidence:
- reference: DOI:10.1128/MMBR.00050-14
  snippet: All plants are inhabited internally by diverse microbial communities comprising
    bacterial, archaeal, fungal, and protistic taxa.
  notes: Hardoim et al. frame endophytic lifestyles as internal microbial residence
    in plants.
- reference: DOI:10.3390/microorganisms5040077
  snippet: Endophytes are microbial symbionts residing within the plant for the majority
    of their life cycle without any detrimental impact to the host plant.
  notes: Kandel et al. support the no-apparent-disease clause in the endophytic definition.
