identifier: traitmech:000442
label: endophytic
definition: A host-associated trait in which a microbe resides within living internal
  plant tissues without causing apparent disease in the host.
definition_source: DOI:10.3390/microorganisms5040077
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
