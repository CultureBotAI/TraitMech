identifier: traitmech:000696
label: bacterial mycophagy
definition: A trophic-ecology phenotype in which a bacterium actively obtains nutrients
  from living fungi or oomycetes and uses them for its own growth.
definition_source: DOI:10.1111/j.1469-8137.2007.02325.x
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1111/j.1469-8137.2007.02325.x
  snippet: phenotypic behaviours that make available nutrients from living fungi and
    allow the conversion of living fungal biomass into bacterial biomass.
  notes: 'Leveau and Preston 2008, PMID:18086226, section I, p. 860 (author PDF page
    2), visually checked contiguous quotation. Definition authority, not experimental
    replication. Summary, section I, strategy overview and selected diagnostic passages
    in section III read; remaining review and referenced experiments not comprehensively
    assessed. Section I explicitly includes oomycetes while acknowledging they are
    not true fungi. Section III requires growth controls and distinguishes inferred
    nutrient acquisition from direct flux measurement. Author full text: https://leveau.faculty.ucdavis.edu/wp-content/uploads/sites/220/2015/05/Leveau2008.pdf.
    DOI AND SRC:MED metadata matched PMID, title and DOI on 2026-10-11.'
- reference: DOI:10.1099/ijs.0.02920-0
  snippet: All Ter isolates proliferated in sand when hyphae of the fungi C. globosum,
    F. culmorum or M. hiemalis invaded.
  notes: 'de Boer et al. 2004, PMID:15143036, Results, p. 860 (PDF page 4), visually
    checked quotation. Methods tested all isolates against intact living hyphae, using
    plate counts at three weeks corrected for uninoculated controls. Growth is indirect
    nutritional evidence, not isotope-traced transfer. Heat-fixed-hypha adhesion is
    a separate observation. Abstract, Introduction, Methods, relevant Results and
    taxonomic descriptions read; pages 4/7 visually inspected; supplement unread.
    Author full text: https://leveau.faculty.ucdavis.edu/wp-content/uploads/sites/220/2015/05/deBoer2004.pdf.
    EXT_ID:15143036 AND SRC:MED matched source, ID, title and DOI on 2026-10-11.'
- reference: DOI:10.1038/ismej.2008.97
  snippet: The growth of collimonads did not cause a significant reduction in the
    Absidia biomass.
  notes: 'Hoppener-Ogawa et al. 2009, PMID:18923455, scientific Abstract, directly
    matched. Abstract, Introduction, Methods, Results, Discussion, Table 1 and actual
    Figures 1/2 read; Figure 3 and supplement unread. Indigenous soil populations
    and a four-strain sand mixture grew with invading fungus; this is not individual
    strain proof or direct nutrient tracing. Nonsignificant biomass loss does not
    establish no fitness cost. Methods samples at three weeks, whereas Figure 2 caption
    names two and three; no time-specific quantitative claim adopted. Overlapping
    authors with 2004, not independent-group replication. Author full text: https://leveau.ucdavis.edu/wp-content/uploads/sites/220/2015/05/HoppenerOgawa2009.pdf.
    EXT_ID:18923455 AND SRC:MED matched source, ID, title and DOI on 2026-10-11.'
