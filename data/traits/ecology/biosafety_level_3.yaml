discussions:
- discussion_id: kgscan-2ee31ba13f9c
  prompt: BSL-3 boundary integrity is verified by pressure-decay testing of the room
    envelope. Does passing a pressure-decay test predict containment of an airborne
    agent under real operating conditions, with doors cycling and equipment running?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'The graph routes verification the other way round from the claim it
    supports: bsl3_trait is `verified by` boundary_integrity_testing, which `utilizes`
    pressure_decay_testing. So the decay test stands in for containment without any
    node asserting that containment holds. The test is also performed on a sealed,
    static room, and the room only matters when it is occupied and in use. If the
    two diverge, facilities are certified against a condition they never operate in.'
  attaches_to:
  - causal_graphs#boundary_integrity_testing
  - causal_graphs#pressure_decay_testing
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Knowledge gap for biosafety level 3: Additionally, it identifies
    ongoing challenges and critical knowledge gaps for future research.'', retrieved
    from PMID:41494000, PMID:40514544, PMID:41552424, PMID:41917383. That sentence
    is about a review''s boilerplate statement that gaps exist, not about this trait:
    the scan matched the hedging vocabulary of a gap statement without checking that
    the gap was about the trait it was filed under. The prompt above was authored
    instead from this record''s own causal graph, and those PMIDs are not carried
    as its evidence because they support the scraped sentence rather than the question.
    Both are kept here so nothing the scan produced is lost.'
  proposed_experiments:
  - experiment_id: x-bsl3-decay-vs-tracer
    name: Tracer-gas containment under operation versus decay-test result
    approach: paired tracer-gas release and envelope pressure-decay testing
    model_systems:
    - commissioned BSL-3 suites spanning a range of decay results
    - SF6 or equivalent inert tracer with anteroom sampling
    perturbations:
    - static sealed room, as in the certification test
    - normal operation with personnel entry and exit
    - a single HEPA-filtered exhaust fan taken offline
    readouts:
    - tracer concentration outside the containment boundary
    - directional airflow at the door plane
    - measured envelope leakage rate
    decision_criterion: whether tracer escape under operation correlates with the
      static decay-test result across suites
    would_support: suites with better decay results leak less tracer in operation
      -- the test predicts what it is used to certify
    would_refute: escape under operation is uncorrelated with decay result -- passing
      certifies the sealed room and not the working one
  posed_date: '2026-08-17'
