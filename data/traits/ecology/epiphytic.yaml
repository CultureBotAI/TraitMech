identifier: traitmech:000443
label: epiphytic
definition: A host-associated trait in which a microbe resides on living aerial plant
  surfaces.
definition_source: DOI:10.1186/s12915-024-01967-1
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000049
synonyms:
- synonym_text: epiphyte
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1186/s12915-024-01967-1
- synonym_text: phyllosphere association
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/AEM.69.4.1875-1883.2003
evidence:
- reference: DOI:10.1128/AEM.69.4.1875-1883.2003
  snippet: The aerial habitat colonized by these microbes is termed the phyllosphere,
    and the inhabitants are called epiphytes.
  notes: Lindow and Brandl define epiphytes as microbes inhabiting the aerial plant-surface
    phyllosphere.
- reference: DOI:10.1186/s12915-024-01967-1
  snippet: Epiphytic microbes are those that live for some or all of their life cycle
    on the surface of plant leaves.
  notes: Fones et al. support the plant leaf surface-residence scope of the epiphytic
    trait.
