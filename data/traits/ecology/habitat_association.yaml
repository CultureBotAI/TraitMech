identifier: traitmech:000047
label: habitat association
definition: An ecological classification of the primary environment or niche an
  organism inhabits (e.g. free-living vs host-associated; soil, rhizosphere, gut).
  Microbial taxa show biogeographic structure across such habitats.
definition_source: DOI:10.1038/nrmicro1341
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: niche association
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro1341
evidence:
- reference: DOI:10.1038/nrmicro1341
  notes: Martiny et al., "Microbial biogeography", support habitat/niche as a
    structuring axis of microbial distribution; parent of the habitat sub-variants.
- reference: DOI:10.1038/nrmicro.2017.87
  notes: Fierer, "Embracing the unknown", supports environment-specific microbial
    community membership (e.g. the soil microbiome) underpinning habitat association.
