discussions:
- discussion_id: kgscan-aa46cc9b34ab
  prompt: This record draws nitric oxide straight to biofilm dispersal with nothing
    in between, while c-di-GMP sits in the same graph wired only to the sessile state.
    Is the NO effect on dispersal mediated by lowering c-di-GMP, and should that intermediate
    be on the edge?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'A bare `induces` edge from a diffusible signal to a community-scale
    outcome is a placeholder where a mechanism should be. The graph already carries
    c_di_gmp, but only as a promoter of sessile_state, so it cannot currently express
    the route most often proposed for this effect. The distinction is not academic:
    if dispersal runs through the c-di-GMP pool, then strains holding that pool high
    are intrinsically refractory to the NO-releasing antibiofilm agents now in development
    -- a resistance mechanism this graph has no way to represent while the edge stays
    bare.'
  attaches_to:
  - causal_graphs#biofilm_dispersal
  - causal_graphs#nitric_oxide
  - causal_graphs#c_di_gmp
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Nitric oxide triggers biofilm dispersal in this record by way
    of falling c-di-GMP. Is lowered c-di-GMP the only route from NO to dispersal,
    or can NO disperse a biofilm whose c-di-GMP pool is held high?'', retrieved from
    . That sentence is about immune homeostasis at the gut mucosa, not about this
    trait: the scan matched the hedging vocabulary of a gap statement without checking
    that the gap was about the trait it was filed under. The prompt above was authored
    instead from this record''s own causal graph, and those PMIDs are not carried
    as its evidence because they support the scraped sentence rather than the question.
    Both are kept here so nothing the scan produced is lost.'
  proposed_experiments:
  - experiment_id: x-biofilm-no-dispersal-bypass
    name: NO challenge against a c-di-GMP-clamped biofilm
    approach: flow-cell biofilm with an inducible c-di-GMP clamp
    model_systems:
    - flow-cell biofilm of a c-di-GMP-signalling model organism
    - isogenic strain carrying an inducible diguanylate cyclase
    perturbations:
    - NO donor at an established dispersal-competent dose
    - induction of the constitutive diguanylate cyclase
    - phosphodiesterase deletion background
    readouts:
    - biomass loss by confocal image analysis
    - cell counts released into the effluent
    - intracellular c-di-GMP by LC-MS/MS
    - a c-di-GMP-responsive transcriptional reporter
    decision_criterion: whether NO still releases cells when the measured c-di-GMP
      pool is held high
    would_support: the clamped biofilm does not disperse -- c-di-GMP is the necessary
      intermediate and the bare edge should be replaced by the two-step route
    would_refute: the clamped biofilm disperses anyway -- the effect is c-di-GMP-independent
      and the direct edge as drawn is right
  posed_date: '2026-08-17'
