identifier: traitmech:000053
label: biofilm formation
definition: An ecological lifestyle in which cells form surface-attached,
  matrix-enclosed multicellular communities (biofilms) held together by extracellular
  polymeric substances — a widespread mode of microbial life.
definition_source: DOI:10.1038/nrmicro.2016.94
trait_category: ECOLOGY
