identifier: traitmech:000055
label: saprotrophy
definition: A trophic-ecology lifestyle in which an organism feeds on dead or
  decaying organic matter, mineralizing it and driving carbon and nutrient cycling
  (decomposition).
definition_source: DOI:10.3389/fmicb.2012.00348
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
