identifier: traitmech:000055
label: saprotrophy
definition: A trophic-ecology lifestyle in which an organism feeds on dead or decaying
  organic matter, mineralizing it and driving carbon and nutrient cycling (decomposition).
definition_source: DOI:10.3389/fmicb.2012.00348
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: decomposer
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2012.00348
- synonym_text: saprophytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2012.00348
evidence:
- reference: DOI:10.3389/fmicb.2012.00348
  snippet: soil microbial community structure influences C cycling
  notes: Verified against the open Schimel and Schaeffer abstract; the review frames
    microbial organic-matter breakdown and extracellular enzymes as controls on soil
    carbon cycling.
- reference: DOI:10.1038/nrmicro.2017.87
  snippet: crucial roles in nutrient cycling, the maintenance of soil fertility and
    soil carbon sequestration
  notes: Verified against a public copy of Fierer; the review supports the broad ecosystem
    role of soil microbial communities in nutrient cycling, fertility, and carbon
    storage.
canonical_examples:
- taxon_id: NCBITaxon:1902
  taxon_label: Streptomyces coelicolor
  note: Model saprotrophic soil decomposer; secretes hydrolases degrading dead organic
    matter.
  reference: PMID:12000953
causal_graphs:
- graph_id: saprotrophy_decomposition_cycling
  title: Saprotrophy decomposes dead organic matter and drives nutrient cycling
  scope_status: NONMECHANISTIC
  scope_notes: This broad ecological, host-relationship, habitat, or hazard classification
    spans multiple taxa and mechanisms; contextual protein nodes do not receive token
    UniProt examples.
  description: Evidence-backed causal sketch linking decomposer activity on dead organic
    matter to carbon and nutrient cycling.
  nodes:
  - node_id: saprotrophy_trait
    label: saprotrophy
    node_type: TRAIT
    grounding: traitmech:000055
    description: Feeding on dead or decaying organic matter.
  - node_id: dead_organic_matter
    label: dead organic matter
    node_type: CHEMICAL
    description: Plant litter, detritus, and other non-living organic substrates.
  - node_id: decomposition
    label: organic matter decomposition
    node_type: BIOLOGICAL_PROCESS
    description: Microbial mineralization of organic matter releasing CO2 and inorganic
      nutrients.
  - node_id: extracellular_exoenzymes
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Contextual protein family or multiprotein aggregate reviewed
      for this nonmechanistic classification; no single semantic family captures it.
    label: extracellular exoenzymes
    node_type: GENE_OR_PROTEIN
    description: Secreted hydrolytic/oxidative enzymes acting outside the cell on
      organic matter.
  - node_id: soluble_organic_compounds
    label: soluble organic compounds
    node_type: CHEMICAL
    description: Low-molecular-weight soluble products available for microbial uptake.
  - node_id: cellulolytic_enzymes
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Contextual protein family or multiprotein aggregate reviewed
      for this nonmechanistic classification; no single semantic family captures it.
    label: cellulolytic enzyme system
    node_type: GENE_OR_PROTEIN
    description: Cellobiohydrolases, endoglucanases, and beta-glucosidases acting
      in concert.
  - node_id: cellulose
    label: cellulose
    node_type: CHEMICAL
    description: Beta-1,4-linked glucose polymer, major plant cell-wall polysaccharide.
    grounding: CHEBI:18246
  - node_id: glucose
    label: glucose
    node_type: CHEMICAL
    description: Monosaccharide product of cellulose depolymerization.
    grounding: CHEBI:17234
  - node_id: cazymes
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Contextual protein family or multiprotein aggregate reviewed
      for this nonmechanistic classification; no single semantic family captures it.
    label: carbohydrate-active enzymes (CAZymes)
    node_type: GENE_OR_PROTEIN
    description: Enzymes acting on glycosidic bonds of plant cell-wall polysaccharides.
  - node_id: hemicellulose
    label: hemicellulose
    node_type: CHEMICAL
    description: Heterogeneous matrix polysaccharides of plant cell walls.
    grounding: CHEBI:61266
  - node_id: laccase
    label: laccase
    node_type: GENE_OR_PROTEIN
    description: Multicopper oxidase that oxidizes lignin and phenolic substrates.
    grounding: InterPro:IPR017761
  - node_id: lignin
    label: lignin
    node_type: CHEMICAL
    description: Complex aromatic polymer in plant cell walls.
    grounding: CHEBI:6457
  - node_id: manganese_peroxidase
    label: manganese peroxidase (MnP)
    node_type: GENE_OR_PROTEIN
    description: H2O2-dependent fungal ligninolytic peroxidase.
    grounding: GO:0016689
  - node_id: lignocellulolytic_gene_expression
    label: lignocellulolytic gene expression
    node_type: BIOLOGICAL_PROCESS
    description: Transcription of genes encoding lignocellulose-degrading enzymes.
  edges:
  - subject: saprotrophy_trait
    predicate: enables
    object: decomposition
    description: Saprotrophic activity breaks down dead organic matter.
    evidence:
    - reference: DOI:10.3389/fmicb.2012.00348
      snippet: rate of OM breakdown in the rhizosphere and in detritus
      notes: Verified against the open Schimel and Schaeffer abstract; the edge links
        decomposer activity to organic matter turnover without asserting a single
        mechanism.
    predicate_id: RO:0002327
  - subject: decomposition
    predicate: consumes
    object: dead_organic_matter
    description: Decomposition uses dead organic matter as substrate.
    evidence:
    - reference: DOI:10.3389/fmicb.2012.00348
      snippet: exoenzyme breakdown is necessary for microbes to metabolize them
      notes: Verified against the open Schimel and Schaeffer text; dead detrital organic
        structures are retained as substrates that require extracellular breakdown.
    predicate_id: biolink:consumes
  - subject: extracellular_exoenzymes
    predicate: contributes to
    object: soluble_organic_compounds
    description: Extracellular exoenzymes contribute soluble decomposition products
      by acting on complex organic compounds.
    evidence:
    - reference: DOI:10.1093/ismejo/wrae073
      snippet: products released by extracellular reactions of exoenzymes produced
        by another group
      notes: Verified against the open Wang et al. text; the edge keeps a broad substrate-cross-feeding
        claim about diffusible exoenzyme products in soil.
    predicate_id: RO:0002326
  - subject: cellulolytic_enzymes
    predicate: hydrolyzes
    object: cellulose
    description: Cellobiohydrolases, endoglucanases, and beta-glucosidases act in
      concert to break down cellulose.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: degradation of cellulose into glucose involves a concerted action of
        several enzymes
      notes: Verified against the open Gurovic et al. text; cellobiohydrolases, endoglucanases,
        and beta-glucosidases are retained as a cellulolytic enzyme-system node.
    predicate_id: METPO:2007808
  - subject: cellulose
    predicate: is hydrolyzed to
    object: glucose
    description: Cellulose hydrolysis yields glucose.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: The complete degradation of cellulose into glucose
      notes: Verified against the open Gurovic et al. text; cellulose is retained
        as a substrate that derives into glucose after enzymatic hydrolysis.
    predicate_id: RO:0001001
  - subject: cazymes
    predicate: hydrolyzes
    object: hemicellulose
    description: Extracellular CAZymes hydrolyze hemicellulose polysaccharides at
      glycosidic bonds.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: Cellulose and hemicelluloses are substrates for these enzymes
      notes: Verified against the open Gurovic et al. figure text; the broad CAZyme
        node is retained for hemicellulose-active enzymes.
    predicate_id: METPO:2007808
  - subject: laccase
    predicate: oxidizes
    object: lignin
    description: Laccase oxidatively degrades lignin and phenolic substrates via electron
      transfer.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: Laccases and peroxidases degrade not only lignin
      notes: Verified against the open Gurovic et al. figure text; laccase is retained
        as a contextual fungal and bacterial ligninolytic enzyme.
    predicate_id: METPO:2007803
  - subject: manganese_peroxidase
    predicate: oxidizes
    object: lignin
    description: Manganese peroxidase performs H2O2-dependent oxidative degradation
      of lignin.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: manganese peroxidases (MnP), lignin peroxidases (LiP) catalyzing a
        variety of oxidative reactions
      notes: Verified against the open Gurovic et al. text; the edge is grounded to
        the canonical oxidative predicate for the fungal MnP ligninolysis claim.
    predicate_id: METPO:2007803
  - subject: glucose
    predicate: negatively regulates
    object: lignocellulolytic_gene_expression
    description: Simple sugars/glucose trigger carbon catabolite repression that represses
      lignocellulolytic gene expression.
    evidence:
    - reference: DOI:10.1093/jambio/lxac002
      snippet: glucose is a repressor of fungal cellulolytic enzymes
      notes: Verified against the open Gurovic et al. text; the edge is a broad carbon-catabolite-repression
        regulatory edge.
    predicate_id: RO:0002212
