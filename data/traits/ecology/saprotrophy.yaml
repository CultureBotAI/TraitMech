- synonym_text: saprophytic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmicb.2012.00348
evidence:
- reference: DOI:10.3389/fmicb.2012.00348
  notes: Schimel & Schaeffer, "Microbial control over carbon cycling in soil",
    support microbial decomposition of organic matter as a central ecosystem process.
- reference: DOI:10.1038/nrmicro.2017.87
  notes: Fierer supports decomposer/saprotrophic activity as a key function of soil
    microbial communities.
