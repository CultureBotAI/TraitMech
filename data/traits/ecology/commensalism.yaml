identifier: traitmech:000042
label: commensalism
definition: A symbiosis in which the microorganism benefits from the association (e.g.
  resources, shelter, transport) while the host's fitness remains essentially unaffected.
definition_source: DOI:10.1038/s41579-021-00550-7
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000040
synonyms:
- synonym_text: commensal
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41579-021-00550-7
evidence:
- reference: DOI:10.1038/s41579-021-00550-7
  notes: Drew et al. place commensalism on the parasite-mutualist continuum as a near-neutral
    host interaction.
- reference: DOI:10.1073/pnas.1218525110
  notes: McFall-Ngai et al. support commensal colonization as a major class of host-associated
    microbial lifestyles.
canonical_examples:
- taxon_id: NCBITaxon:1282
  taxon_label: Staphylococcus epidermidis
  note: Archetypal human skin commensal.
  reference: PMID:33180890
causal_graphs:
- graph_id: commensalism_neutral_host
  title: Commensalism benefits microbe without affecting host fitness
  description: Evidence-backed causal sketch linking host colonization to microbial
    benefit while host fitness is essentially neutral.
  nodes:
  - node_id: commensalism_trait
    label: commensalism
    node_type: TRAIT
    grounding: traitmech:000042
    description: Microbe benefits from association; host fitness essentially neutral.
  - node_id: host_colonization
    label: host colonization
    node_type: BIOLOGICAL_PROCESS
    description: Persistent establishment of microbes on or in a host.
  - node_id: neutral_host_fitness
    label: neutral host fitness effect
    node_type: QUALITY
    description: No detectable net fitness change for the host partner.
  - node_id: secretory_iga
    label: secretory IgA
    node_type: GENE_OR_PROTEIN
    description: Host mucosal antibody that can promote commensal colonization of
      the mucus layer.
  - node_id: mucus_layer
    label: host mucus / mucins
    node_type: ENVIRONMENTAL_FACTOR
    description: Host-derived mucin glycan layer providing niche and nutrients for
      mucin-foraging microbes.
  - node_id: glycan_binding_proteins
    label: bacterial glycan-binding proteins
    node_type: GENE_OR_PROTEIN
    description: Microbial adhesins mediating attachment to host mucin glycans.
  - node_id: mucin_attachment
    label: attachment to mucin
    node_type: BIOLOGICAL_PROCESS
    description: Microbial adhesion to the host mucin layer supporting persistent
      colonization.
  - node_id: eps_production
    label: extracellular glucan / EPS production
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis of extracellular polysaccharides that build the biofilm
      matrix.
  - node_id: biofilm_matrix
    label: EPS biofilm matrix
    node_type: CELLULAR_LOCALIZATION
    description: Extracellular polymeric matrix protecting cells from shear forces
      and antimicrobials.
  - node_id: persistence_protection
    label: protection from shear and antimicrobials
    node_type: QUALITY
    description: Resistance to physical removal and antimicrobials supporting host-niche
      persistence.
  - node_id: low_virulence
    label: low virulence / no detectable host cost
    node_type: QUALITY
    description: Microbe benefits from the host without causing a detectable fitness
      cost.
  edges:
  - subject: host_colonization
    predicate: confers
    object: commensalism_trait
    description: Persistent colonization without harm or benefit to the host realizes
      the commensal lifestyle.
    evidence:
    - reference: DOI:10.1073/pnas.1218525110
      notes: McFall-Ngai et al. support commensal colonization as a major class of
        host-associated microbial lifestyles.
    predicate_id: METPO:2007700
  - subject: commensalism_trait
    predicate: associated with
    object: neutral_host_fitness
    description: Commensal interactions sit on the near-neutral point of the parasite-mutualist
      continuum.
    evidence:
    - reference: DOI:10.1038/s41579-021-00550-7
      notes: Drew et al. place commensalism on the parasite-mutualist continuum as
        a near-neutral host interaction.
    predicate_id: biolink:associated_with
  - subject: secretory_iga
    predicate: promotes
    object: host_colonization
    description: Secretory IgA can help commensal bacteria colonize the mucus layer.
    evidence:
    - reference: DOI:10.1126/science.adi3338
      notes: IgA can act as a carrot as well as a stick, helping bacteria colonize
