  - subject: glycan_binding_proteins
    predicate: enables
    object: mucin_attachment
    description: Bacterial glycan-binding proteins mediate attachment to host mucin.
    evidence:
    - reference: DOI:10.1126/science.adi3338
      notes: Bacteria attach to mucin via glycan-binding proteins.
    predicate_id: RO:0002327
  - subject: mucin_attachment
    predicate: enables
    object: host_colonization
    description: Attachment to the mucin layer supports persistent host colonization.
    evidence:
    - reference: DOI:10.1126/science.adi3338
      notes: Attachment to mucin via glycan-binding proteins underlies persistent
        colonization of the mucus niche.
    predicate_id: RO:0002327
  - subject: eps_production
    predicate: has output
    object: biofilm_matrix
    description: Synthesis of extracellular glucans builds the EPS biofilm matrix.
    evidence:
    - reference: DOI:10.3389/fcimb.2024.1357631
      notes: Synthesis of extracellular glucans builds the EPS biofilm matrix.
    predicate_id: RO:0002234
  - subject: biofilm_matrix
    predicate: confers
    object: persistence_protection
    description: The EPS biofilm matrix protects cells from shear forces and antimicrobials.
    evidence:
    - reference: DOI:10.3389/fcimb.2024.1357631
      notes: Protects cells from shear forces and confers resistance to antimicrobials.
  - subject: persistence_protection
    predicate: promotes
    object: host_colonization
    description: Protection from removal and antimicrobials supports persistence in
      the host niche.
    evidence:
    - reference: DOI:10.3389/fcimb.2024.1357631
      notes: Biofilm-conferred resistance supports persistence in a host niche.
    predicate_id: RO:0002213
  - subject: low_virulence
    predicate: operationalizes
    object: commensalism_trait
    description: Benefit to the microbe with no detectable host cost operationalizes
      commensalism.
    evidence:
    - reference: DOI:10.1038/s41579-021-00550-7
      notes: Commensals benefit from the interaction with hosts but do not cause a
        detectable cost.
