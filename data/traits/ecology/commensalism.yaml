  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41579-021-00550-7
evidence:
- reference: DOI:10.1038/s41579-021-00550-7
  notes: Drew et al. place commensalism on the parasite-mutualist continuum as a
    near-neutral host interaction.
- reference: DOI:10.1073/pnas.1218525110
  notes: McFall-Ngai et al. support commensal colonization as a major class of
    host-associated microbial lifestyles.
