discussions:
- discussion_id: kgscan-3606bdcc991b
  prompt: Commensalism is defined in this record by a neutral effect on host fitness.
    Has neutrality ever been measured for these associations, or is it inferred from
    the absence of visible disease -- and does it hold when the host is stressed,
    starved, or co-infected?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Neutral_host_fitness is the node that makes this trait different from
    mutualism and parasitism, and it is the one node stated as a definition rather
    than an observation. If neutrality is only ever the null result of an underpowered
    comparison in an unstressed host, then commensalism is a measurement category
    rather than a biological one, and records assigned to it are provisional in a
    way the corpus does not currently mark.
  attaches_to:
  - causal_graphs#neutral_host_fitness
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Commensalism is defined in this record by a neutral effect on
    host fitness. Has neutrality ever been measured for these associations, or is
    it inferred from the absence of visible disease -- and does it hold when the host
    is stressed, starved, or co-infected?'', retrieved from . That sentence is about
    plant-derived xenomiRs crossing kingdom barriers, not about this trait: the scan
    matched the hedging vocabulary of a gap statement without checking that the gap
    was about the trait it was filed under. The prompt above was authored instead
    from this record''s own causal graph, and those PMIDs are not carried as its evidence
    because they support the scraped sentence rather than the question. Both are kept
    here so nothing the scan produced is lost.'
  proposed_experiments:
  - experiment_id: x-commensal-fitness-neutrality
    name: Gnotobiotic mono-association host fitness across stressors
    approach: gnotobiotic mono-association with quantitative fitness readouts
    model_systems:
    - germ-free animal model
    - mono-association with a designated commensal isolate
    - germ-free controls held under identical conditions
    perturbations:
    - protein or caloric restriction
    - thermal or osmotic stress
    - co-infection with a defined enteric pathogen
    readouts:
    - lifetime reproductive output
    - growth rate and body condition
    - survival under each stressor
    - the effect size the design could have detected
    decision_criterion: whether an adequately powered comparison detects a fitness
      difference under any stressor
    would_support: no difference under any condition at a stated detectable effect
      size -- neutrality is measured, not assumed
    would_refute: a fitness effect appears under stress -- neutrality was a condition-dependent
      artefact and the assignment should change
  posed_date: '2026-08-17'
