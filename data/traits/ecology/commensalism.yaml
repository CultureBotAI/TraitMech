identifier: traitmech:000042
label: commensalism
definition: A symbiosis in which the microorganism benefits from the association (e.g.
  resources, shelter, transport) while the host's fitness remains essentially unaffected.
definition_source: DOI:10.1038/s41579-021-00550-7
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
