identifier: METPO:1001101
label: biosafety level
definition: A quality that categorizes biological agents according to their hazard
  level and required containment measures.
definition_source: DOI:10.1146/annurev.micro.62.081307.162938
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: Safety information.risk assessment.biosafety level
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.62.081307.162938
  snippet: virulence factors
  notes: Virulence-factor review supports pathogen virulence characteristics (transmissibility,
    severity, treatability) as the biological inputs underlying biosafety-level classification.
- reference: DOI:10.1038/nrmicro1592
  snippet: secretion systems
  notes: Secretion-systems review supports effector-mediated host damage as a virulence
    axis informing hazard assessment.
causal_graphs:
- graph_id: biosafety_level_hazard_classification
  title: Biosafety-level hazard-classification axis
  description: DOI-backed graph framing biosafety level as a hazard-based classification
    driven by pathogen transmissibility, disease severity, and availability of countermeasures,
    with `is a` edges to the BSL-1 through BSL-5 child classifications.
  nodes:
  - node_id: biosafety_level_trait
    label: biosafety level
    node_type: TRAIT
    grounding: METPO:1001101
    description: Classification of a biological agent's hazard level and required
      containment.
  - node_id: pathogen_hazard_properties
    label: pathogen hazard properties
    node_type: BIOLOGICAL_PROCESS
    description: Pathogen transmissibility, disease severity, and availability of
      vaccines or therapeutics that together determine biosafety classification.
  - node_id: containment_requirements
    label: containment requirements
    node_type: EXPERIMENTAL_FACTOR
    description: Laboratory practices, equipment, and facility features mandated for
      safe handling of the agent.
  - node_id: bsl1
    label: biosafety level 1
    node_type: TRAIT
    grounding: METPO:1001102
    description: Agents posing minimal hazard; standard laboratory practices.
  - node_id: bsl2
    label: biosafety level 2
    node_type: TRAIT
    grounding: METPO:1001103
    description: Agents posing moderate risk; biosafety cabinets and PPE required.
  - node_id: bsl3
    label: biosafety level 3
    node_type: TRAIT
    grounding: METPO:1001104
    description: Agents that can cause serious or potentially lethal disease; controlled-access
      containment.
  - node_id: bsl4
    label: biosafety level 4
    node_type: TRAIT
    grounding: METPO:1001105
    description: Extreme-risk agents; maximum containment (positive-pressure suits,
      dedicated facilities).
  - node_id: bsl5
    label: biosafety level 5
    node_type: TRAIT
    grounding: METPO:1001106
    description: Proposed enhanced classification beyond BSL-4.
  - node_id: risk_assessment
    label: hazard identification and risk assessment
    node_type: BIOLOGICAL_PROCESS
    description: Cyclical biorisk process of gathering information, evaluating risks,
      and selecting control measures.
  - node_id: risk_group_classification
    label: risk group classification (RG1-RG4)
    node_type: QUALITY
    description: Classification of biological agents into risk groups RG1-RG4 based
      on hazard.
  - node_id: aerosol_transmission
    label: aerosol/inhalation transmission route
    node_type: BIOLOGICAL_PROCESS
    description: Capacity of an agent to be transmitted via inhalation or aerosol.
  - node_id: bsl3_containment
    label: BSL-3 containment requirement
    node_type: EXPERIMENTAL_FACTOR
    description: Controlled-access containment for agents causing serious or lethal
      disease via inhalation.
  - node_id: lack_of_countermeasures
    label: lack of effective treatment or vaccine
    node_type: QUALITY
    description: Absence of available vaccines or therapeutics for a dangerous, life-threatening
      agent.
  - node_id: bsl4_containment
    label: BSL-4 containment requirement
    node_type: EXPERIMENTAL_FACTOR
    description: Maximum containment for highly dangerous agents often lacking vaccines
      or treatments.
  - node_id: infectious_dose
    label: infectious dose
    node_type: QUALITY
    description: Dose of agent required to cause infection; a practical criterion
      in biorisk assessment.
  edges:
  - subject: pathogen_hazard_properties
    predicate: causes
    object: biosafety_level_trait
    description: Pathogen transmissibility, severity, and treatability jointly determine
      biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: virulence factors
      notes: Supports pathogen virulence properties as the biological inputs for hazard-level
        classification.
    predicate_id: biolink:causes
  - subject: biosafety_level_trait
    predicate: mandates
    object: containment_requirements
    description: Each biosafety level mandates specific containment practices and
      engineering controls.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: pathogenesis
      notes: Supports pathogen pathogenesis as the basis for graduated containment
        requirements.
  - subject: bsl1
    predicate: is a
    object: biosafety_level_trait
    description: BSL-1 is a biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: host
      notes: Supports the host-pathogen framing underlying hazard classification,
        including the minimal-hazard BSL-1 tier.
    predicate_id: rdfs:subClassOf
  - subject: bsl2
    predicate: is a
    object: biosafety_level_trait
    description: BSL-2 is a biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: infection
      notes: Supports community-acquired infection as the hazard profile underlying
        the BSL-2 tier.
    predicate_id: rdfs:subClassOf
  - subject: bsl3
    predicate: is a
    object: biosafety_level_trait
    description: BSL-3 is a biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: pathogen
      notes: Supports serious-pathogen severity (aerosol-transmissible disease) as
        the hazard profile underlying the BSL-3 tier.
    predicate_id: rdfs:subClassOf
  - subject: bsl4
    predicate: is a
    object: biosafety_level_trait
    description: BSL-4 is a biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: toxins
      notes: Supports extreme-toxicity and untreatable-pathogen profiles as the hazard
        basis for the BSL-4 tier.
    predicate_id: rdfs:subClassOf
  - subject: bsl5
    predicate: is a
    object: biosafety_level_trait
    description: BSL-5 is a proposed biosafety-level classification beyond BSL-4.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: host cells
      notes: Supports host-cell pathogen interactions, generalised to hypothetical
        post-BSL-4 hazards, as motivating the proposed BSL-5 tier.
    predicate_id: rdfs:subClassOf
  - subject: risk_assessment
    predicate: guides selection of
    object: containment_requirements
    description: Hazard identification and risk assessment guide selection of containment/control
      measures.
    evidence:
    - reference: DOI:10.1016/j.jobb.2021.09.002
      notes: WHO LBM4 cyclical process of evaluating risks and selecting and implementing
        control measures.
  - subject: risk_group_classification
    predicate: informs
    object: biosafety_level_trait
    description: Risk group classification (RG1-RG4) maps to / informs the biosafety
      containment level.
    evidence:
    - reference: DOI:10.3390/laboratories1030013
      notes: BSL categories are progressive containment categories linked to risk
        group/hazard classification.
  - subject: aerosol_transmission
    predicate: increases requirement for
    object: bsl3_containment
    description: Inhalation/aerosol transmissibility increases the requirement for
      BSL-3 containment.
    evidence:
    - reference: DOI:10.3390/laboratories1030013
      notes: BSL-3 is for agents that may cause serious or lethal diseases through
        inhalation.
  - subject: lack_of_countermeasures
    predicate: supports classification at
    object: bsl4_containment
    description: Absence of effective treatment or vaccine supports classification
      at BSL-4.
    evidence:
    - reference: DOI:10.3390/laboratories1030013
      notes: BSL-4 covers highly dangerous, life-threatening agents often lacking
        vaccines or treatments.
  - subject: aerosol_transmission
    predicate: is input to
    object: risk_assessment
    description: Route of inoculation / modes of transmission is a practical input
      to biorisk assessment.
    evidence:
    - reference: DOI:10.1089/apb.2022.0040
      notes: BRM focused on route of inoculation/modes of transmission as a practical
        criterion in biorisk assessment.
  - subject: infectious_dose
    predicate: is input to
    object: risk_assessment
    description: Infectious dose is a practical criterion used in biosafety risk assessment.
    evidence:
    - reference: DOI:10.1089/apb.2022.0040
      notes: BRM identified infectious dose among the practical criteria used in biosafety
        risk assessment.
