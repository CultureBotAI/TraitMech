  - node_id: bsl4
    label: biosafety level 4
    node_type: TRAIT
    grounding: METPO:1001105
    description: Extreme-risk agents; maximum containment (positive-pressure suits,
      dedicated facilities).
  - node_id: bsl5
    label: biosafety level 5
    node_type: TRAIT
    grounding: METPO:1001106
    description: Proposed enhanced classification beyond BSL-4.
