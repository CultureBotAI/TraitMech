identifier: METPO:1001101
label: biosafety level
definition: A quality that categorizes biological agents according to their hazard
  level and required containment measures.
definition_source: DOI:10.1146/annurev.micro.62.081307.162938
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000188
synonyms:
- synonym_text: Safety information.risk assessment.biosafety level
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.62.081307.162938
  snippet: virulence factors
  notes: Virulence-factor review supports pathogen virulence characteristics
    (transmissibility, severity, treatability) as the biological inputs
    underlying biosafety-level classification.
- reference: DOI:10.1038/nrmicro1592
  snippet: secretion systems
  notes: Secretion-systems review supports effector-mediated host damage as
    a virulence axis informing hazard assessment.
