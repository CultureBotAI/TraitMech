  title: Biosafety-level hazard-classification axis
  description: DOI-backed graph framing biosafety level as a hazard-based classification
    driven by pathogen transmissibility, disease severity, and availability of countermeasures,
    with `is a` edges to the BSL-1 through BSL-5 child classifications.
  nodes:
  - node_id: biosafety_level_trait
    label: biosafety level
    node_type: TRAIT
    grounding: METPO:1001101
    description: Classification of a biological agent's hazard level and required
      containment.
  - node_id: pathogen_hazard_properties
    label: pathogen hazard properties
    node_type: BIOLOGICAL_PROCESS
    description: Pathogen transmissibility, disease severity, and availability of
