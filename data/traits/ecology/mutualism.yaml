    associations across animals.
- reference: DOI:10.1126/science.1104816
  notes: Bäckhed et al., "Host-bacterial mutualism in the human intestine", supports
    reciprocal benefit (nutrient harvest for the host, habitat for the microbes) as
    the defining feature of mutualism.
