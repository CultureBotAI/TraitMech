discussions:
- discussion_id: kgscan-a6758e26f5a6
  prompt: Only the selection-like arm reaches genome reduction in this record -- confined
    habitat drives metabolic gene loss, which contributes to reduction. Transmission
    bottleneck and limited recombination sit as a disconnected pair. Does drift under
    bottlenecks cause reduction here, warranting an edge?
  kind: CONTROVERSY
  status: OPEN
  rationale: 'By attaching one arm and leaving the other dangling, the record takes
    a side on a contested question through omission rather than assertion -- which
    is the hardest kind of claim to notice or argue with. The two mechanisms predict
    opposite loss spectra: drift under a bottleneck removes genes roughly regardless
    of function, while host compensation removes exactly the genes whose products
    the host supplies. As drawn, the graph predicts only the second, so it cannot
    say what a newly sequenced symbiont will have lost -- which is most of what a
    reduction model is for.'
  attaches_to:
  - causal_graphs#reductive_genome_evolution
  - causal_graphs#transmission_bottleneck
  - causal_graphs#limited_recombination
  - causal_graphs#metabolic_gene_loss
  posed_by: claude
  notes: 'Scan provenance (#409). The kg-microbe-kgscan pass raised this discussion
    with the prompt ''Knowledge gap for endosymbiosis: Growth anomalies (GAs) are
    coral diseases characterised by tumour-like skeletal lesions reported globally,
    yet their causes remain poorly understood.'', retrieved from PMID:42130304, PMID:41612704,
    PMID:40831140, PMID:41764142. That sentence is about growth anomalies in corals,
    not about this trait: the scan matched the hedging vocabulary of a gap statement
    without checking that the gap was about the trait it was filed under. The prompt
    above was authored instead from this record''s own causal graph, and those PMIDs
    are not carried as its evidence because they support the scraped sentence rather
    than the question. Both are kept here so nothing the scan produced is lost.'
  proposed_experiments:
  - experiment_id: x-endosymbiont-drift-vs-selection
    name: Comparative loss spectra across symbionts of differing bottleneck severity
    approach: comparative genomics across independent symbiotic origins
    model_systems:
    - vertically transmitted symbionts with severe bottlenecks
    - horizontally acquired symbionts with large inocula
    - free-living relatives as the unreduced reference
    readouts:
    - genome size against estimated effective population size
    - dN/dS across retained genes
    - whether lost functions are complemented by host pathways
    - pseudogene load as a marker of ongoing reduction
    decision_criterion: whether genome size still tracks bottleneck severity once
      host complementation of the lost functions is controlled for
    would_support: reduction tracks bottleneck severity independently of complementation
      -- the drift arm is causal and the graph is missing an edge into reductive_genome_evolution
    would_refute: loss is enriched for host-complemented functions with no residual
      bottleneck effect -- the omission is correct and the dangling pair is context
      rather than cause
  posed_date: '2026-08-17'
