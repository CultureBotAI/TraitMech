identifier: traitmech:000045
label: endosymbiosis
definition: A symbiosis in which the microorganism lives inside the cells or tissues
  of its host. Obligate intracellular endosymbionts (e.g. of insects) frequently undergo
  extreme genome reduction.
definition_source: DOI:10.1038/nrmicro2670
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000040
synonyms:
- synonym_text: endosymbiont
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro2670
evidence:
- reference: DOI:10.1038/nrmicro2670
  notes: McCutcheon & Moran, "Extreme genome reduction in symbiotic bacteria", characterize
    intracellular endosymbionts and their diminished genomes.
- reference: DOI:10.1038/nrmicro.2017.171
  notes: Poole et al. describe rhizobia as plant-cell endosymbionts within root nodules,
    an example of the endosymbiotic lifestyle.
canonical_examples:
- taxon_id: NCBITaxon:9
  taxon_label: Buchnera aphidicola
  note: "Textbook obligate insect nutritional endosymbiont (aphid bacteriocytes; maternally transmitted)."
  reference: https://www.microbiologyresearch.org/content/journal/micro/10.1099/mic.0.001127
causal_graphs:
- graph_id: endosymbiosis_intracellular_genome_reduction
  title: Intracellular endosymbiosis drives extreme genome reduction
  description: Evidence-backed causal sketch linking intracellular host localization
    to long-term genome reduction in obligate endosymbionts.
  nodes:
  - node_id: endosymbiosis_trait
    label: endosymbiosis
    node_type: TRAIT
    grounding: traitmech:000045
    description: Symbiosis with intracellular or intra-tissue localization.
  - node_id: intracellular_localization
    label: intracellular host localization
    node_type: CELLULAR_LOCALIZATION
    description: Persistent residence inside host cells or tissues.
  - node_id: reductive_genome_evolution
    label: reductive genome evolution
    node_type: BIOLOGICAL_PROCESS
    description: Long-term loss of genomic content under relaxed selection and small
      effective population sizes.
    grounding: METPO:1007721
  - node_id: confined_intracellular_habitat
    label: confined intracellular habitat
    node_type: ENVIRONMENTAL_FACTOR
    description: Spatially restricted, host-cell-confined niche occupied by endosymbionts.
  - node_id: metabolic_gene_loss
    label: metabolic gene loss
    node_type: BIOLOGICAL_PROCESS
    description: Loss of metabolic genes under relaxed selection in confined intracellular
      life.
  - node_id: transmission_bottleneck
    label: transmission bottleneck
    node_type: BIOLOGICAL_PROCESS
    description: Few founding cells transmitted between host generations, reducing
      effective population size.
  - node_id: limited_recombination
    label: limited recombination
    node_type: BIOLOGICAL_PROCESS
    description: Reduced genetic recombination resulting from colonies originating
      from few ancestors.
  - node_id: host_symbiont_aa_complementarity
    label: host-symbiont amino-acid pathway complementarity
    node_type: BIOLOGICAL_PROCESS
    description: Complementarity in amino-acid metabolic pathways shared between host
      and endosymbiont.
  - node_id: nutritional_compensation
    label: nutritional compensation
    node_type: BIOLOGICAL_PROCESS
    description: Provision of biosynthetic capacity (amino acids/cofactors) compensating
      host nutritional needs.
  - node_id: intracellular_dependence
    label: dependence on the intracellular environment
    node_type: STATE
    description: Obligate reliance of the reduced-genome symbiont on the host intracellular
      environment.
  edges:
  - subject: intracellular_localization
