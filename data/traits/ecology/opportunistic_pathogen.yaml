    description: Breached or weakened host defenses enable a normally innocuous
      microbe to cause disease.
    evidence:
    - reference: DOI:10.1016/j.tim.2012.04.005
      notes: Brown et al. support context-dependent virulence in opportunistic
        pathogens.
    predicate_id: biolink:causes
  - subject: opportunistic_infection
    predicate: enables
    object: opportunistic_pathogen_trait
    description: Context-dependent infection realizes the opportunistic-pathogen
      lifestyle.
    evidence:
    - reference: DOI:10.1038/s41579-021-00550-7
      notes: Drew et al. support facultative shifts toward pathogenicity along the
