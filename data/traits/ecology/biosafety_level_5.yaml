identifier: METPO:1001106
label: biosafety level 5
definition: A biosafety level that is proposed as a classification beyond BSL-4 for
  hypothetical biological agents requiring enhanced containment.
definition_source: DOI:10.1146/annurev.micro.62.081307.162938
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1001101
synonyms:
- synonym_text: '5'
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.62.081307.162938
  snippet: virulence factors
  notes: Virulence-factor review supports the framing of pathogen hazard above existing
    BSL-4 thresholds (the rationale underlying the proposed BSL-5 classification).
- reference: DOI:10.4271/2002-01-2469
  snippet: Planetary Protection Level Alpha
  notes: Verified against the open Cohen 2002 SAE paper; PPL-alpha is retained as
    historical BSL-5 name-use evidence, not as the scope of the generic METPO class.
causal_graphs:
- graph_id: biosafety_level_5_proposed_enhanced_hazard
  title: BSL-5 proposed enhanced-hazard classification
  scope_status: NONMECHANISTIC
  scope_notes: This broad ecological, host-relationship, habitat, or hazard classification
    spans multiple taxa and mechanisms; contextual protein nodes do not receive token
    UniProt examples.
  description: DOI-backed graph linking hypothetical pathogen hazards exceeding BSL-4
    thresholds to the proposed BSL-5 enhanced-containment classification, with PPL-alpha
    retained only as historical BSL-5 name-use evidence.
  nodes:
  - node_id: bsl5_trait
    label: biosafety level 5
    node_type: TRAIT
    grounding: METPO:1001106
    description: Proposed enhanced-containment classification beyond BSL-4 for hypothetical
      extreme-hazard agents.
  - node_id: biosafety_level
    label: biosafety level
    node_type: TRAIT
    grounding: METPO:1001101
    description: Hazard-classification axis for biological agents.
  - node_id: enhanced_pathogen_hazard
    label: enhanced pathogen hazard
    node_type: BIOLOGICAL_PROCESS
    description: Hypothetical pathogen hazards judged to exceed the transmissibility,
      severity, or treatability thresholds covered by BSL-4.
  - node_id: planetary_protection_level_alpha
    label: Planetary Protection Level Alpha
    node_type: EXPERIMENTAL_FACTOR
    description: Draft planetary-protection standard historically associated with
      the BSL-5 label by Cohen.
  edges:
  - subject: enhanced_pathogen_hazard
    predicate: motivates
    object: bsl5_trait
    description: Hazards exceeding BSL-4 thresholds motivate the proposed BSL-5 enhanced-containment
      classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: virulence factors
      notes: Supports increasingly severe virulence-factor combinations as the rationale
        for hazard classes above BSL-4.
  - subject: bsl5_trait
    predicate: is a
    object: biosafety_level
    description: BSL-5 is a proposed member of the biosafety-level classification.
    evidence:
    - reference: DOI:10.1146/annurev.micro.62.081307.162938
      snippet: virulence factors
      notes: Supports BSL-5 as a proposed extension of the biosafety-level classification
        axis.
    predicate_id: rdfs:subClassOf
  - subject: planetary_protection_level_alpha
    predicate: is informally called
    object: bsl5_trait
    description: PPL-alpha has been informally called BSL-5, providing historical
      name-use evidence without narrowing the BSL-5 class to Mars sample handling.
    evidence:
    - reference: DOI:10.4271/2002-01-2469
      snippet: informally called BSL-5
      notes: Verified against the open Cohen 2002 SAE paper; the PPL-alpha source
        supports a historical naming association only.
