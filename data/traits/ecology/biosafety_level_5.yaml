identifier: METPO:1001106
label: biosafety level 5
definition: A biosafety level that is proposed as a classification beyond BSL-4 for
  hypothetical biological agents requiring enhanced containment.
definition_source: DOI:10.1146/annurev.micro.62.081307.162938
trait_category: ECOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1001101
synonyms:
- synonym_text: '5'
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.62.081307.162938
  snippet: virulence factors
  notes: Virulence-factor review supports the framing of pathogen hazard above existing
    BSL-4 thresholds (the rationale underlying the proposed BSL-5 classification).
- reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
  snippet: Planetary Protection Level Alpha
  notes: Verified against the open SAE 2002 PDF; Cohen reports that the NASA Office
    of Planetary Protection draft protocol defined PPL-alpha as the concrete standard
    once informally called BSL-5.
causal_graphs:
- graph_id: biosafety_level_5_ppl_alpha_containment
  title: BSL-5 as draft PPL-alpha containment
  scope_status: NONMECHANISTIC
  scope_notes: This record names a proposed, planetary-protection-specific containment
    standard rather than a microbial phenotype, so its graph is contextual and intentionally
    carries no organism or token UniProt examples.
  description: Open SAE 2002 graph grounding BSL-5 to draft Planetary Protection Level
    Alpha, a Mars returned sample handling standard that extends BSL-4-class containment
    to bidirectional Earth and sample protection.
  nodes:
  - node_id: bsl5_trait
    label: biosafety level 5
    node_type: TRAIT
    grounding: METPO:1001106
    description: Informal name formerly applied to draft PPL-alpha, a proposed containment
      level for Mars returned sample handling.
  - node_id: planetary_protection_level_alpha
    label: Planetary Protection Level Alpha
    node_type: EXPERIMENTAL_FACTOR
    description: Draft NASA planetary-protection standard requiring demonstrable bioisolation
      and containment for returned Mars samples.
  - node_id: bsl4_standard
    label: biosafety level 4 standard
    node_type: TRAIT
    grounding: METPO:1001105
    description: CDC maximum-containment biosafety level used as the comparison point
      for PPL-alpha.
  - node_id: mars_returned_sample_handling
    label: Mars returned sample handling
    node_type: EXPERIMENTAL_FACTOR
    description: Receiving, handling, analyzing, storing, and releasing samples returned
      from Mars.
  - node_id: two_way_contamination_control
    label: two-way contamination control
    node_type: EXPERIMENTAL_FACTOR
    description: Coordinated backward-contamination protection for Earth and forward-contamination
      protection for pristine samples.
  - node_id: earth_backward_contamination_prevention
    label: backward-contamination prevention for Earth
    node_type: EXPERIMENTAL_FACTOR
    description: Containment preventing potentially hazardous returned material from
      escaping into Earth's biosphere.
  - node_id: sample_forward_contamination_prevention
    label: forward-contamination prevention for samples
    node_type: EXPERIMENTAL_FACTOR
    description: Clean handling preventing terrestrial organisms or organic molecules
      from contaminating returned samples.
  - node_id: closed_system_sample_handling
    label: closed-system sample handling
    node_type: EXPERIMENTAL_FACTOR
    description: Sample storage and retrieval inside a closed system.
  - node_id: automation_remote_manipulation
    label: automation and remote manipulation
    node_type: EXPERIMENTAL_FACTOR
    description: Robotic or remotely manipulated sample handling that avoids leaky
      conventional glovebox interfaces.
  edges:
  - subject: planetary_protection_level_alpha
    predicate: was informally called
    object: bsl5_trait
    description: Draft PPL-alpha was the concrete planetary-protection standard once
      informally called BSL-5.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: informally called BSL-5
      notes: Verified against the open SAE 2002 PDF; Cohen links the BSL-5 label specifically
        to the draft PPL-alpha standard.
  - subject: planetary_protection_level_alpha
    predicate: exceeds
    object: bsl4_standard
    description: PPL-alpha is described as more stringent than BSL-4 because it adds
      forward sample-protection requirements to backward biosphere containment.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: more stringent
      notes: Verified against the open SAE 2002 PDF; PPL-alpha is contrasted with
        the CDC BSL-4 standard and framed as a stricter two-way protection regime.
  - subject: planetary_protection_level_alpha
    predicate: requires
    object: two_way_contamination_control
    description: PPL-alpha requires both returned-sample containment and protection
      of the samples from terrestrial contamination.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: bioisolation and containment
      notes: Verified against the open SAE 2002 PDF; the draft standard requires a
        high-reliability bioisolation and containment system for planetary samples.
  - subject: two_way_contamination_control
    predicate: includes
    object: sample_forward_contamination_prevention
    description: The draft standard includes forward-contamination control to keep
      Earth organisms out of returned Mars samples.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: terrestrial forward contamination
      notes: Verified against the open SAE 2002 PDF; Cohen's candidate MRSH scenario
        lists PPL-alpha protection of Mars returned samples from terrestrial forward
        contamination.
    predicate_id: biolink:has_part
  - subject: two_way_contamination_control
    predicate: includes
    object: earth_backward_contamination_prevention
    description: The draft standard includes backward-contamination control to keep
      returned Mars material out of Earth's biosphere.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: backward contamination
      notes: Verified against the open SAE 2002 PDF; Cohen's candidate MRSH scenario
        lists PPL-alpha protection of Earth from backward contamination by Mars and
        Mars samples.
    predicate_id: biolink:has_part
  - subject: planetary_protection_level_alpha
    predicate: applies to
    object: mars_returned_sample_handling
    description: The draft protocol extends PPL-alpha beyond a receiving facility
      to the whole Mars Sample Return mission.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: Mars Sample Return mission
      notes: Verified against the open SAE 2002 PDF; Cohen reports that the draft
        protocol applied to all portions of Mars Sample Return, not only one sample
        receiving facility.
  - subject: closed_system_sample_handling
    predicate: contributes to
    object: mars_returned_sample_handling
    description: Closed storage and retrieval are part of the required architecture
      for safe handling of returned Mars samples.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: closed system
      notes: Verified against the open SAE 2002 PDF; closed-system sample storage
        and retrieval is one MRSH architecture criterion listed in the abstract.
    predicate_id: RO:0002326
  - subject: automation_remote_manipulation
    predicate: contributes to
    object: closed_system_sample_handling
    description: Automation and remote manipulation support sample transfer without
      the leaky glove interfaces that conventional gloveboxes present.
    evidence:
    - reference: https://spacearchitect.org/pubs/SAE-2002-01-2469.pdf
      snippet: automation and remote manipulation
      notes: Verified against the open SAE 2002 PDF; Cohen names automation and remote
        manipulation as an alternative to conventional gloveboxes for sample handling
        and transfer.
    predicate_id: RO:0002326
