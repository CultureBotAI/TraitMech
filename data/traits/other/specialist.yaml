identifier: traitmech:000177
label: specialist
definition: A phenotype describing an organism with a narrow ecological niche, restricted
  to a limited range of environments or resources.
definition_source: DOI:10.1093/femsec/fiaa240
trait_category: OTHER
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
