definition_source: DOI:10.1038/srep03081
evidence:
- reference: DOI:10.1038/srep03081
  snippet: The enzyme-generated oxygen bubbles trapped by Triton X-100 were visualized
    as foam
  notes: Iwase et al. tie the catalase assay signal to oxygen bubbles from hydrogen-peroxide
    decomposition, supporting no visible bubbling as a negative test outcome.
- reference: DOI:10.1128/iai.72.8.4512-4520.2004
  snippet: E. faecium is catalase negative, and the major mechanism to scavenge hydrogen
    peroxide is NADH peroxidase
  notes: Moy et al. identify E. faecium as catalase-negative and contrast its NADH-peroxidase
    scavenging with catalase-bearing E. faecalis under heme-supplemented conditions.
