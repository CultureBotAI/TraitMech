definition: Test-outcome phenotype where the catalase test yields a negative result
  (no bubbling on H2O2). The underlying enzyme-organism relation should additionally
  be asserted via <organism> METPO:2000303 'does not show activity of' GO:0004096
  'catalase activity'.
