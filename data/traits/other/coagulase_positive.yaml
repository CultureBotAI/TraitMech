definition_source: DOI:10.1099/mic.0.000019
evidence:
- reference: DOI:10.1099/mic.0.000019
  snippet: coagulase-positive S. aureus bacteria promoted clotting of plasma which
    was not seen when a coagulase-deficient mutant strain was used
  notes: Loof et al. show that coagulase-positive S. aureus clots plasma in a way
    lost from a coagulase-deficient mutant, directly supporting the positive test-outcome
    phenotype.
- reference: DOI:10.1371/journal.ppat.1001036
  snippet: Clinical isolates of the human pathogen Staphylococcus aureus secrete coagulase
    (Coa), a polypeptide that binds to and activates prothrombin
  notes: Cheng et al. connect S. aureus Coa secretion to prothrombin activation, the
    clotting activity detected by the coagulase test.
- reference: DOI:10.1371/journal.ppat.1001036
  snippet: Coa and vWbp promote the non-proteolytic activation of prothrombin and
    cleavage of fibrinogen, reactions that are inhibited with specific antibody against
    each of these molecules.
  notes: Cheng et al. demonstrate that Staphylococcus aureus staphylocoagulase (Coa)
    and von Willebrand factor-binding protein (vWbp) promote non-proteolytic activation
    of prothrombin and cleavage of fibrinogen.
