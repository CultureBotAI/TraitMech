identifier: METPO:1007090
label: coagulase positive
definition: Test-outcome phenotype where the coagulase test yields a positive result
  (plasma clotting). The underlying enzyme-organism relation should additionally be
  asserted via <organism> METPO:2000302 'shows activity of' <coagulase enzyme term>
  once a sufficiently specific enzyme term is selected (no GO/EC term currently exists
  at the bacteriological coagulase test granularity).
