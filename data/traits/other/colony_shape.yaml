  snippet: Describe the form, elevation, and margin as indicated in Fig. 1. Also indicate
    whether the colonies are smooth (shiny glistening surface), rough (dull, bumpy,
    granular, or matte surface), or mucoid (slimy or gummy appearance).
  notes: Breakwell et al. describe colony form as one of the primary macroscopic morphology
    descriptors recorded for well-separated colonies on solid medium.
- reference: https://asm.org/asm/media/protocol-images/colony-morphology-protocol.pdf
  snippet: FIG. 1. Diagram illustrating the various forms, elevations, and margins
    of bacterial colonies (3).
  notes: The ASM protocol separates colony forms from elevations and margins, supporting
    this record as the colony-outline component of colony morphology.
