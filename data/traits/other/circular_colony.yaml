  snippet: Describe the form, elevation, and margin as indicated in Fig. 1. Also indicate
    whether the colonies are smooth (shiny glistening surface), rough (dull, bumpy,
    granular, or matte surface), or mucoid (slimy or gummy appearance).
  notes: Breakwell et al. describe colony form as an observed macroscopic feature
    separate from elevation and margin; circular colony specializes that form axis.
- reference: https://asm.org/asm/media/protocol-images/colony-morphology-protocol.pdf
  snippet: Colonies are smooth and are circular in form with an entire margin.
  notes: The ASM example records circular form separately from entire margin and convex
    elevation, supporting circular as a colony outline state rather than a margin
    or elevation descriptor.
