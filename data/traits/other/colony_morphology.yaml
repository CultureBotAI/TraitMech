evidence:
- reference: https://asm.org/asm/media/protocol-images/colony-morphology-protocol.pdf
  snippet: If well separated from other colonies, a colony will have a characteristic
    shape (both in elevation and margin), size, color, and consistency.
  notes: Breakwell et al. describe shape, elevation, margin, size, color, and consistency
    as characteristic macroscopic features of a well-separated colony on solid medium.
- reference: https://asm.org/asm/media/protocol-images/colony-morphology-protocol.pdf
  snippet: Describe the form, elevation, and margin as indicated in Fig. 1. Also indicate
    whether the colonies are smooth (shiny glistening surface), rough (dull, bumpy,
    granular, or matte surface), or mucoid (slimy or gummy appearance).
  notes: The peer-reviewed ASM protocol explicitly treats colony form, elevation,
    margin, and surface texture as morphology descriptors.
