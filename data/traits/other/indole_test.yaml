evidence:
- reference: https://asm.org/protocols/indole-test-protocol
  snippet: The indole test screens for the ability of an organism to degrade the amino
    acid tryptophan and produce indole.
  notes: The ASM protocol defines the indole test as an assay for organism-level tryptophan
    degradation to indole.
- reference: https://asm.org/protocols/indole-test-protocol
  snippet: The chief requirement for culturing an organism prior to performing the
    indole test is that the medium contains a sufficient quantity of tryptophan (5).
  notes: The protocol explains that the indole-test medium needs tryptophan so production
    of indole can report tryptophan degradation.
