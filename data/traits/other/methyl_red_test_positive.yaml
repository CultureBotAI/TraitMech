definition_source: https://asm.org/getmedia/40946f85-9357-4563-aa8a-994427efa825/Methyl-Red-and-Voges-Proskauer-Test-Protocols.pdf
evidence:
- reference: https://asm.org/getmedia/40946f85-9357-4563-aa8a-994427efa825/Methyl-Red-and-Voges-Proskauer-Test-Protocols.pdf
  snippet: When the culture medium turns red after addition of methyl red, because
    of a pH at or below 4.4 from the fermentation of glucose, the culture has a positive
    result for the MR test (Fig.1A).
  notes: The ASM protocol PDF defines a positive methyl-red-test readout as red culture
    medium after methyl red is added, reflecting glucose fermentation that acidifies
    the medium to pH 4.4 or lower.
- reference: DOI:10.1128/JCM.42.8.3665-3669.2004
  snippet: 'In the ASM Manual of Clinical Microbiology, only 6 of the 18 biochemical
    tests used in the present investigation are listed for Klebsiella species: indole,
    MR, VP, LDC, ODC, and malonate'
  notes: Hansen et al. evaluated methyl red as a conventional Klebsiella biochemical
    test listed in the ASM Manual of Clinical Microbiology.
canonical_examples:
- taxon_id: NCBITaxon:54291
  taxon_label: Klebsiella ornithinolytica
  note: Hansen et al. Table 3 reported 100.0% methyl-red-positive results for K. ornithinolytica
    across the CPHL, NRL, and SSI reference laboratories.
  reference: DOI:10.1128/JCM.42.8.3665-3669.2004
