evidence:
- reference: https://asm.org/protocols/oxidase-test-protocol
  snippet: The test can be used to distinguish Neisseria gonorrhoeae (oxidase positive)
    from Staphylococcus spp. and Streptococcus spp. (oxidase negative)
  notes: The American Society for Microbiology protocol gives oxidase-negative Staphylococcus
    and Streptococcus spp. as contrasts to an oxidase-positive Neisseria gonorrhoeae
    result.
- reference: DOI:10.5812/chbs-160199
  snippet: A positive result from the dry filter paper method is indicated by the
    appearance of a dark purple color within 5 to 10 seconds. A 'delayed positive'
    result is recognized when a color change occurs between 10 and 60 seconds, whereas
    a negative result is indicated by the paper remaining colorless or changing color
    after more than 60 seconds
  notes: Hafezi and Khamar review the oxidase-test polarity and interpret a colorless
    dry filter paper, or a color change only after the cutoff, as a negative result.
- reference: DOI:10.5812/chbs-160199
  snippet: Bacteria that are classified as oxidase-negative can be anaerobic, aerobic,
    or facultative. A negative oxidase result indicates merely the absence of cytochrome
    c oxidase, which is responsible for oxidizing the reactant, while these organisms
    may utilize alternative oxidases for electron transfer during respiration
  notes: The review constrains interpretation of the negative assay outcome to cytochrome
    c oxidase under the oxidase-test readout, rather than absence of every terminal
    oxidase.
