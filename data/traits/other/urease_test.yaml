identifier: METPO:1007082
label: urease test
definition: A biochemical test that detects urease enzyme activity by observing urea
  hydrolysis (typically via a pH-indicator color change). The test outcome (positive
  or negative) is captured by its child classes; this class itself does not assert
  urease activity.
