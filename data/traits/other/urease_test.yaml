evidence:
- reference: DOI:10.5812/chbs-160199
  snippet: Urea is classified as a diamide, and certain bacteria possessing the enzyme
    urease are capable of utilizing urea to generate ammonia, carbon dioxide, and
    water
  notes: Hafezi and Khamar describe the urease-test chemistry linking bacterial urease
    to urea conversion into alkaline products.
- reference: DOI:10.5812/chbs-160199
  snippet: Both types contain a phenol red reagent that changes color with pH variations
  notes: The review describes phenol red as the pH indicator for both liquid and solid
    urease-test media.
