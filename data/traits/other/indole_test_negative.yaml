definition_source: DOI:10.1128/AEM.02787-15
evidence:
- reference: DOI:10.1128/AEM.02787-15
  snippet: Indole, a bacterial product of tryptophan degradation
  notes: Darkoh et al. support indole as a microbial tryptophan-degradation product.
- reference: DOI:10.1128/JCM.00940-06
  snippet: However, K. variicola, R. planticola, and R. terrigena, in addition to
    K. pneumoniae, can show a negative-indole reaction
  notes: Alves et al. describe Klebsiella pneumoniae as an indole-negative Klebsiella
    species in a clinical-isolate biochemical typing context.
- reference: DOI:10.1128/JCM.00940-06
  snippet: A total of 102 (84%) of the 122 isolates were negative for indole production
  notes: Alves et al. reported negative indole-production phenotypes among Klebsiella
    clinical isolates tested biochemically.
