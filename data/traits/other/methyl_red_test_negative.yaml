evidence:
- reference: https://asm.org/getmedia/40946f85-9357-4563-aa8a-994427efa825/Methyl-Red-and-Voges-Proskauer-Test-Protocols.pdf
  snippet: A negative MR test is indicated by a yellow color in the culture medium
    (Fig. 1B), which occurs when less acid is produced (pH is higher) from the fermentation
    of glucose.
  notes: The ASM protocol PDF defines the negative methyl-red-test readout as a yellow
    culture after methyl red is added, reflecting less acidification during glucose
    fermentation.
- reference: DOI:10.1128/JCM.42.8.3665-3669.2004
  snippet: 'In the ASM Manual of Clinical Microbiology, only 6 of the 18 biochemical
    tests used in the present investigation are listed for Klebsiella species: indole,
    MR, VP, LDC, ODC, and malonate'
  notes: Hansen et al. evaluated methyl red as a conventional Klebsiella biochemical
    test; their Table 2 reports K. pneumoniae methyl-red result percentages across
    CPHL, NRL, and SSI.
- reference: DOI:10.1128/JCM.42.8.3665-3669.2004
  snippet: 'Variable results were of two types: (i) those in which all three laboratories
    found a mixture of positive and negative results among the representatives of
    a species for a specific test (e.g., K. pneumoniae and l-sorbose), suggesting
    a truly variable reaction, and (ii) those in which one center found most strains
    to be negative while another found most positive (e.g., K. rhinoscleromatis and
    MR) or vice versa, suggesting that the results were method dependent.'
  notes: The same interlaboratory evaluation found that MR could be method dependent
    for some Klebsiella species/test combinations, so the K. pneumoniae canonical
    example is recorded from Table 2 results rather than treated as a species-wide
    invariant.
canonical_examples:
- taxon_id: NCBITaxon:573
  taxon_label: Klebsiella pneumoniae
  note: 'Hansen et al. Table 2 reported mostly methyl-red-negative results for K.
    pneumoniae across three reference laboratories: 10.7%, 3.6%, and 10.7% MR-positive
    strains.'
  reference: DOI:10.1128/JCM.42.8.3665-3669.2004
