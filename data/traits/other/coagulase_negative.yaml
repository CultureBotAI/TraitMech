identifier: METPO:1007091
label: coagulase negative
definition: Test-outcome phenotype where the coagulase test yields a negative result.
  The underlying enzyme-organism relation should additionally be asserted via <organism>
  METPO:2000303 'does not show activity of' <coagulase enzyme term> once a sufficiently
  specific enzyme term is selected.
