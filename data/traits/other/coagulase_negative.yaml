evidence:
- reference: DOI:10.3390/microorganisms9040830
  snippet: Coagulase-negative staphylococci (CoNS) form a large group of Gram-positive
    cocci united by their mutual lack of the virulence factor coagulase
  notes: Michels et al. define coagulase-negative staphylococci by absence of the
    coagulase virulence factor, supporting the negative assay-outcome phenotype.
- reference: https://www.ncbi.nlm.nih.gov/books/NBK563240/
  snippet: Staphylococcus epidermidis is a coagulase-negative, gram-positive cocci
    bacteria that form clusters
  notes: Lee and Anjum identify S. epidermidis as coagulase-negative, providing a
    stable species-level example of a negative coagulase test outcome.
