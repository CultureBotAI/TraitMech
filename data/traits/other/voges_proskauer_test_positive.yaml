evidence:
- reference: https://asm.org/getmedia/40946f85-9357-4563-aa8a-994427efa825/Methyl-Red-and-Voges-Proskauer-Test-Protocols.pdf
  snippet: In the presence of KOH the intermediate acetoin is oxidized to diacetyl,
    a reaction which is catalyzed by a-naphthol (2). Diacetyl reacts with the guanidine
    group associated with molecules contributed by peptone in the medium, to form
    a pinkish-red-colored product (Fig. 2A).
  notes: The ASM protocol PDF explains that the Voges-Proskauer reaction detects acetoin
    through Barritt chemistry that forms a pinkish-red product.
- reference: DOI:10.1128/JCM.42.8.3665-3669.2004
  snippet: 'In the ASM Manual of Clinical Microbiology, only 6 of the 18 biochemical
    tests used in the present investigation are listed for Klebsiella species: indole,
    MR, VP, LDC, ODC, and malonate'
  notes: Hansen et al. evaluated Voges-Proskauer as a conventional Klebsiella biochemical
    test listed in the ASM Manual of Clinical Microbiology.
canonical_examples:
- taxon_id: NCBITaxon:571
  taxon_label: Klebsiella oxytoca
  note: Hansen et al. Table 2 reported 100.0% Voges-Proskauer-positive results for
    K. oxytoca across the CPHL, NRL, and SSI reference laboratories.
  reference: DOI:10.1128/JCM.42.8.3665-3669.2004
