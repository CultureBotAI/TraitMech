    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: red, pink, orange, and yellow pigmentation in bacteria
      notes: Supports carotenoids as color determinants for this pigment class.
    predicate_id: biolink:causes
  - subject: yellow_orange_red_color
    predicate: manifests as
    object: carotenoid_pigmentation_trait
    description: Yellow-orange-red visible color manifests carotenoid pigmentation.
    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: responsible for the red, pink, orange, and yellow pigmentation
      notes: Supports the trait-level mapping from carotenoid chemistry to pigmentation.
    predicate_id: METPO:2007400
  - subject: phytoene_synthase
    predicate: converts
    object: phytoene
    description: Phytoene synthase condenses prenyl diphosphate (GFDP) to form phytoene.
    evidence:
    - reference: DOI:10.3390/molecules29174235
      notes: Through the catalytic action of phytoene synthase, GFDP undergoes condensation
        to form phytoene.
  - subject: phytoene
    predicate: is substrate for
    object: phytoene_desaturase
    description: Phytoene is dehydrogenated by phytoene desaturase en route to lycopene.
    evidence:
    - reference: DOI:10.3390/molecules29174235
      notes: Phytoene is further dehydrogenated by dehydrogenase to generate phytofluene,
        which is subsequently converted into lycopene.
  - subject: phytoene_desaturase
    predicate: produces
    object: lycopene
    description: Phytoene desaturase converts phytoene (via phytofluene) to lycopene.
    evidence:
    - reference: DOI:10.3390/molecules29174235
      notes: Phytoene is further dehydrogenated... which is subsequently converted
