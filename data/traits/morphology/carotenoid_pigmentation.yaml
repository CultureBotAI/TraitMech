identifier: METPO:1003031
label: carotenoid pigmentation
definition: A pigmentation phenotype caused by microbial production and accumulation
  of carotenoid pigments.
definition_source: DOI:10.1080/1040841X.2025.2526423
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003021
synonyms:
- synonym_text: Pigment_carotenoid
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1080/1040841X.2025.2526423
  snippet: Carotenoids are isoprenoid pigments
  notes: Supports carotenoid pigmentation as a bacterial isoprenoid-pigment phenotype.
canonical_examples:
- taxon_id: NCBITaxon:1280
  taxon_label: Staphylococcus aureus
  note: Golden carotenoid pigmentation (staphyloxanthin); well-studied bacterial carotenoid
    and virulence factor.
  reference: PMID:16009720
