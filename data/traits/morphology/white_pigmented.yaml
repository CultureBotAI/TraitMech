- timestamp: '2026-08-06T01:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 2 causal edge(s) off microbe-domain METPO predicates (2 to
    has output), issue 301. The previous predicates are transitively rdfs:subPropertyOf
    METPO:2000001, whose rdfs:domain is METPO:1000525 (microbe), so a causal-graph
    subject entailed that the subject IS a microbe; CausalNodeTypeEnum has no organism
    member, so no such edge could ever satisfy the domain. Edge directions are unchanged
    - this pass only relabels and re-grounds. RO:0002234 (has output) is used where
    the subject is an activity, since biolink gives it the domain 'biological process
    or activity'; the METPO replacements are proposed in proposals/metpo_traitmech_v8
    and v9 and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-07T04:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Re-grounded the `encodes` edge(s) from biolink:encodes to METPO:2007813,
    issue 342. biolink:encodes is NOT a slot in the pinned biolink 4.4.0 model, so
    the CURIE resolved to nothing upstream while looking like an upstream term to
    anyone reading this record -- the disclaimer saying otherwise lived in mappings/predicate_grounding.tsv,
    which is not read at the point of use. RO:0002205 (has gene product) is the nearest
    real term but relates a GENE to a gene product, whereas these edges relate a gene
    cluster or operon to a protein complex or a biosynthetic process, which its range
    does not admit; that mismatch is why the coinage existed. METPO:2007813 is proposed
    in proposals/metpo_traitmech_v9 and is a placeholder id until METPO mints it,
    which puts it in the same state as the rest of that cohort rather than in a category
    of its own.
  llm_assisted: true
