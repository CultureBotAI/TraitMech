  taxon_label: Haloquadratum walsbyi
  note: "Universally cited square/rectangular flat-celled archaeon (2-5 um wide x 0.1-0.2 um thick); dominant in hypersaline salterns."
  reference: DOI:10.1371/journal.pone.0018653
