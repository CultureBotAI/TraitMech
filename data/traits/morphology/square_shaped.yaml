identifier: METPO:1000694
label: square shaped
definition: A cell shape in which an organism forms flat, square or rectangular cells.
definition_source: DOI:10.1099/ijs.0.65431-0
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: square
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1099/ijs.0.65431-0
  snippet: flat square or disc-shaped cells
  notes: Haloquadratum walsbyi description supports flat square cell morphology in
    halophilic archaea.
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: cell shape is genetically determined
  notes: Cell-shape review supports anisotropic envelope growth as the basis for non-round
    cell geometries.
canonical_examples:
