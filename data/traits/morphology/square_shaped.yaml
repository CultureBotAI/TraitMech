      notes: Supports planar growth as the cellular basis for flat square cells.
    predicate_id: RO:0002327
  - subject: slayer_constraints
    predicate: causes
    object: right_angle_growth
    description: The paracrystalline S-layer constrains envelope geometry toward right
      angles.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell shape is genetically determined
      notes: Supports envelope architectural constraints (e.g., S-layer) as shape
        determinants.
    predicate_id: biolink:causes
  - subject: right_angle_growth
    predicate: manifests as
    object: square_shaped_trait
    description: Right-angle planar geometry manifests the square-shaped trait.
    evidence:
    - reference: DOI:10.1099/ijs.0.65431-0
      snippet: square or disc-shaped cells
      notes: Supports the trait endpoint.
    predicate_id: METPO:2007400
  - subject: archaeal_slayer
    predicate: defines
    object: cell_shape
    description: The archaeal S-layer is a primary structural determinant of cell
      shape.
    evidence:
    - reference: DOI:10.1038/s41564-022-01215-8
      notes: S-layers are known to fulfil roles in defining the cell-shape, providing
        mechanical stability and functioning as molecular sieves.
    predicate_id: METPO:2007500
  - subject: archaeal_slayer
    predicate: provides
    object: mechanical_stability
    description: The archaeal S-layer provides mechanical stability to the cell envelope.
    evidence:
    - reference: DOI:10.1038/s41564-022-01215-8
      notes: S-layers are known to fulfil roles in defining the cell-shape, providing
        mechanical stability and functioning as molecular sieves.
  - subject: cytoskeletal_growth_axis_control
    predicate: gives rise to
    object: square_shaped_trait
    description: Precise cytoskeleton- and S-layer-guided control of local growth
      and division axis gives rise to flat geometric (square/triangular) archaeal
      shapes.
    evidence:
    - reference: DOI:10.1038/s41564-022-01215-8
      notes: These cell shapes arise as the result of precise cellular control of
        local growth and the axis of division under the guidance of cytoskeletal filaments
        and an overlying coat of glycosylated proteins, also termed the S-layer.
  - subject: slayer_proteins
    predicate: causes when lost
    object: cell_shape_size_defect
    description: Loss of S-layer proteins causes profound defects in cell shape and
      size, evidencing the S-layer causal role in archaeal morphology.
    evidence:
    - reference: DOI:10.1038/s41564-022-01215-8
      notes: S-layer proteins were recently found to be dispensable for S.islandicus
        viability, but cells lacking these proteins exhibited profound defects in
        cell shape and size.
