    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: 'Sandmann review: lycopene is the central carotenoid intermediate from
        which colored carotenoid pigments are formed via crt pathway reactions.'
  - subject: carotenoid_biosynthesis
    predicate: feeds from
    object: lycopene
    description: Carotenoid biosynthesis proceeds through lycopene toward colored
      carotenoid products.
    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: crtI/phytoene desaturase generates lycopene as a committed colored-carotenoid
        intermediate in the biosynthetic pathway.
  - subject: crt_enzymes
    predicate: part of
    object: photosynthesis_gene_cluster
    description: crt carotenoid genes are part of photosynthesis gene clusters in
      phototrophic bacteria.
    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: '"the genes of the carotenoid pathways are part of photosynthesis gene
        clusters" (Sandmann 2023).'
    predicate_id: biolink:part_of
  - subject: photosynthesis_gene_cluster
    predicate: contributes to
    object: visible_pink_color
    description: Carotenoid genes embedded in photosynthesis gene clusters contribute
      to visible pigmentation.
    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: '"The pigmentation of purple bacteria is caused by a combination of bacteriochlorophylls
        and carotenoids" with crt genes in PGCs.'
    predicate_id: RO:0002326
  - subject: oxygen
    predicate: upregulates
    object: crt_operon
    description: Oxygen availability upregulates the carotenoid biosynthetic operon,
      an environmental regulator of pigment output.
    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: '"oxygen up-regulates the crtI-crtB operon" (Sandmann 2023), making oxygen
        a causal environmental regulator of pigmentation.'
  - subject: crt_operon
    predicate: catalyzes
    object: carotenoid_biosynthesis
    description: The crtI-crtB operon encodes enzymes carrying out carotenoid biosynthetic
      reactions.
    evidence:
    - reference: DOI:10.3390/biology12101346
      notes: crtB (phytoene synthase) and crtI (phytoene desaturase) catalyze committed
        steps producing colored carotenoids.
    predicate_id: biolink:catalyzes
