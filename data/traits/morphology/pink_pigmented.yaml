- synonym_text: Pigment_pink
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1080/1040841X.2025.2526423
  snippet: red, pink, orange, and yellow pigmentation in bacteria
  notes: Supports pink bacterial pigmentation as a carotenoid-associated color phenotype.
canonical_examples:
