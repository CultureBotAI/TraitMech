identifier: METPO:1003027
label: pink pigmented
definition: A pigmentation phenotype in which microbial colonies or cells appear pink
  due to accumulation of pink or rose carotenoid pigments.
definition_source: DOI:10.1080/1040841X.2025.2526423
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003021
