identifier: METPO:1000884
label: cell length small
definition: A cell-length phenotype in which the longer cell dimension lies approximately
  between 1.3 and 2 micrometers.
definition_source: DOI:10.1016/j.cell.2014.11.022
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000881
synonyms:
- synonym_text: L_1.3_2
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/j.cell.2014.11.022
  snippet: cells grow by a fixed amount between divisions
  notes: Adder-model paper supports a defined inter-divisional length increment that
    produces a narrow length distribution at standard growth conditions.
canonical_examples:
- taxon_id: NCBITaxon:3028314
  taxon_label: Oceanimonas pelagia
  reference: DOI:10.1007/s10482-024-01948-y
  note: Oceanimonas pelagia NTOU-MSR1T cells measured approximately 1.8-2.0 micrometres
    long, within the approximately 1.3-2.0-micrometre bin.
causal_graphs:
- graph_id: cell_length_small_size_setpoint
  scope_status: NONMECHANISTIC
  scope_notes: This record is a numerical cell-length bin. Its graph provides contextual
    examples of division control but does not define a single causal mechanism for
    every cell in the bin.
  title: Small cell-length size setpoint
  description: DOI-backed graph linking adder-controlled size homeostasis to a small
    cell-length range (1.3–2 μm).
  nodes:
  - node_id: cell_length_small_trait
    label: cell length small
    node_type: TRAIT
    grounding: METPO:1000884
    description: Cell length approximately 1.3–2 μm.
  - node_id: cell_length_trait
    label: cell length
    node_type: TRAIT
    grounding: METPO:1000881
    description: Regulated longer cellular dimension.
  - node_id: adder_principle
    label: adder size control
    node_type: BIOLOGICAL_PROCESS
    description: Fixed inter-division length increment underlying size homeostasis.
  - node_id: standard_growth_conditions
    label: standard growth conditions
    node_type: ENVIRONMENTAL_FACTOR
    description: Routine laboratory growth conditions producing typical bacterial
      cell sizes.
  - node_id: ftsz_abundance
    label: FtsZ abundance
    node_type: QUALITY
    description: Relative cellular level of the tubulin-like division protein FtsZ.
  - node_id: division_timing
    label: cell division timing
    node_type: BIOLOGICAL_PROCESS
    description: Timing/onset of septal constriction and cell division.
  - node_id: ftsz_ring_formation
    label: FtsZ ring formation
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of the cytokinetic Z ring at the division site.
  - node_id: ftsn
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The contextual source supports the FtsN label, but an exact semantic
      family term was not verified in this review.
    label: FtsN
    node_type: GENE_OR_PROTEIN
    description: Divisome protein that allosterically activates septal PG synthesis.
  - node_id: ftswi_complex
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: FtsW and FtsI are distinct components grouped as a complex; one
      protein-family identifier cannot denote the pair.
    label: FtsWI septal PG synthase complex
    node_type: GENE_OR_PROTEIN
    description: FtsWI (within FtsQLBWI) septal peptidoglycan synthase complex.
  - node_id: septal_pg_synthesis
    label: septal peptidoglycan synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis of septal peptidoglycan during cytokinesis.
  - node_id: zring_condensation
    label: Z-ring condensation and stability
    node_type: BIOLOGICAL_PROCESS
    description: Condensation and stabilization of the FtsZ ring.
  - node_id: ftsz_protoring
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This denotes an assembled FtsZ proto-ring structure rather than
      one exact protein-family entity.
    label: FtsZ proto-ring (with FtsA/ZipA)
    node_type: GENE_OR_PROTEIN
    description: FtsZ proto-ring tethered by FtsA/ZipA initiating divisome assembly.
  - node_id: divisome_assembly
    label: divisome assembly
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of the division machinery and septal synthesis.
  - node_id: min_nucleoid_occlusion
    label: Min system and nucleoid occlusion
    node_type: BIOLOGICAL_PROCESS
    description: Spatial regulators positioning FtsZ at midcell.
  - node_id: ftsz_midcell_positioning
    label: FtsZ positioning at midcell
    node_type: BIOLOGICAL_PROCESS
    description: Correct placement of FtsZ at the cell midpoint for symmetric division.
  edges:
  - subject: standard_growth_conditions
    predicate: enables
    object: adder_principle
    description: Standard nutrient/temperature regimes maintain adder size control.
    evidence:
    - reference: DOI:10.1016/j.cell.2014.11.022
      snippet: cells grow by a fixed amount between divisions
      notes: Supports adder control under typical growth regimes.
    predicate_id: RO:0002327
  - subject: adder_principle
    predicate: confers
    object: cell_length_small_trait
    description: Adder homeostasis under standard conditions yields a narrow length
      distribution in the small range.
    evidence:
    - reference: DOI:10.1016/j.cell.2014.11.022
      snippet: cells grow by a fixed amount between divisions
      notes: Supports small length as a typical adder-controlled outcome.
    predicate_id: METPO:2007700
  - subject: cell_length_small_trait
    predicate: is a
    object: cell_length_trait
    description: Small cell length is a quantitative bin of the cell-length phenotype.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.07.022
      snippet: cell size is tightly controlled
      notes: Supports small length as a value within the regulated cell-length distribution.
    predicate_id: rdfs:subClassOf
  - subject: ftsz_abundance
    predicate: contributes to
    object: division_timing
    description: FtsZ abundance is a rate-limiting factor for E. coli cell division
      timing.
    evidence:
    - reference: DOI:10.1038/s41467-024-54242-w
      snippet: FtsZ numbers in the cell are one of the rate-limiting factors for cell
        divisions in E. coli
      notes: Verified against the public Nature Communications abstract; Männik et
        al. identify FtsZ number as a rate-limiting factor for E. coli cell division.
    predicate_id: RO:0002326
  - subject: ftsz_ring_formation
    predicate: modulates
    object: cell_length_trait
    description: Delayed FtsZ ring formation delays division until the cell reaches
      a larger size, increasing cell length.
    evidence:
    - reference: DOI:10.1038/s41467-023-41487-0
      snippet: delays the FtsZ ring formation, which in turn allows the cell to grow
        for a longer time
      notes: Verified against the open Nature Communications introduction; Vashistha
        et al. describe Min-imbalance delaying FtsZ ring formation and giving cells
        more time to grow before division.
    predicate_id: RO:0002211
  - subject: ftsn
    predicate: activates
    object: ftswi_complex
    description: FtsN allosterically activates the FtsWI septal PG synthase complex.
    evidence:
    - reference: DOI:10.1038/s41467-024-52217-5
      snippet: FtsN activates sPG synthesis by switching FtsA and the FtsQLBWI complex
        to the active state
      notes: Verified against the open Nature Communications full text; Gong et al.
        route FtsN-mediated septal peptidoglycan synthesis through the active FtsQLBWI
        complex that contains FtsW and FtsI.
    predicate_id: RO:0002213
  - subject: septal_pg_synthesis
    predicate: promotes
    object: zring_condensation
    description: Septal peptidoglycan synthesis feeds back to promote Z-ring condensation
      and stability.
    evidence:
    - reference: DOI:10.1038/s41467-024-52217-5
      snippet: sPG synthesis in turn promotes Z ring condensation and stability
      notes: Verified against the open Nature Communications full text; Gong et al.
        show a positive-feedback loop from septal peptidoglycan synthesis to the Z
        ring.
    predicate_id: RO:0002213
  - subject: ftsz_protoring
    predicate: enables
    object: divisome_assembly
    description: The FtsZ proto-ring with FtsA/ZipA localizes and organizes divisome
      assembly at midcell.
    evidence:
    - reference: DOI:10.1038/s41579-023-00942-x
      snippet: FtsZ, to localize and organize the cell division machinery, the divisome
      notes: Verified against the public PubMed abstract for the Nature Reviews Microbiology
        article; Cameron and Margolin review FtsZ as the tubulin homolog that organizes
        the divisome.
    predicate_id: RO:0002327
  - subject: min_nucleoid_occlusion
    predicate: regulates
    object: ftsz_midcell_positioning
    description: Min and nucleoid-occlusion systems regulate FtsZ placement at midcell
      for proper division-site selection.
    evidence:
    - reference: DOI:10.1038/s42003-024-07279-y
      snippet: Min or nucleoid occlusion systems for positioning FtsZ at mid cell
        division sites
      notes: Verified against the public Communications Biology abstract; Hayashi
        et al. require at least one of the Min or nucleoid-occlusion systems for midcell
        FtsZ positioning in E. coli L-forms.
    predicate_id: RO:0002211
