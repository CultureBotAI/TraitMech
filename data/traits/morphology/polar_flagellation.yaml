definition_source: DOI:10.1093/femsre/fuv034
evidence:
- reference: DOI:10.1093/femsre/fuv034
  snippet: Bacteria differ in number and location of their flagella that appear in
    regular patterns at the cell surface (flagellation pattern).
  notes: Schuhmacher et al. support treating the number and cellular position of flagella
    as a flagellation-pattern morphology class.
- reference: DOI:10.3390/biom10040533
  snippet: Some bacterial species, such as the marine bacterium Vibrio alginolyticus,
    have a single polar flagellum that allows it to swim in liquid environments.
  notes: Kojima et al. give Vibrio alginolyticus as a direct bacterial example whose
    flagellum is positioned at a cell pole.
- reference: DOI:10.3390/biom10040533
  snippet: Two regulators, FlhF and FlhG, function antagonistically to generate only
    one flagellum at the cell pole.
  notes: Kojima et al. connect FlhF/FlhG regulation to generation of a polar flagellum,
    supporting polar placement as a microbial flagellation phenotype.
canonical_examples:
- taxon_id: NCBITaxon:663
  taxon_label: Vibrio alginolyticus
  note: Kojima et al. describe V. alginolyticus as a marine bacterium with a single
    polar flagellum.
