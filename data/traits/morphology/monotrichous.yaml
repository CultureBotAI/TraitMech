evidence:
- reference: DOI:10.1093/femsre/fuv034
  notes: Schuhmacher et al. describe single-flagellum (monotrichous, polar) flagellation
    as one regular flagellation pattern.
- reference: DOI:10.3390/biom9070279
  notes: Flagellum review supports a single helical flagellar filament as a locomotory
    organelle.
