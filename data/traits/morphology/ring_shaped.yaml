identifier: METPO:1000680
label: ring shaped
definition: A cell shape in which an organism forms circular or toroidal structures.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: ring
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: ring-shaped
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/pato/releases/2025-05-14/pato.obo
- synonym_text: annular
  synonym_type: EXACT_SYNONYM
  source: http://purl.obolibrary.org/obo/pato/releases/2025-05-14/pato.obo
xrefs:
- PATO:0002539
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: cell curvature
  notes: Cell-shape review supports curvature-generating wall patterning as the basis
    for closed-ring morphology.
canonical_examples:
- taxon_id: NCBITaxon:1067
  taxon_label: Rhodocyclus purpureus
  note: Type species described from pure culture with individual half-ring-shaped
    and ring-shaped cells before division.
  reference: DOI:10.1099/00207713-28-2-283
causal_graphs:
- graph_id: ring_shaped_curved_growth_closure
  title: Ring-shape curved growth and pole closure
  description: DOI-backed graph linking strongly curved peptidoglycan growth and pole-to-pole
    closure to toroidal ring morphology.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a ring-shape classification. Its contextual protein
    modules come from several taxa and support curvature or wall organization, not
    the proposed pole-to-pole closure into a ring; no token protein example is assigned.
  nodes:
  - node_id: ring_shaped_trait
    label: ring shaped
    node_type: TRAIT
    grounding: METPO:1000680
    description: Closed circular or toroidal cell geometry.
  - node_id: curved_pg_growth
    label: strongly curved peptidoglycan growth
    node_type: BIOLOGICAL_PROCESS
    description: Asymmetric lateral wall synthesis producing high cell curvature.
  - node_id: pole_to_pole_closure
    label: pole-to-pole closure
    node_type: BIOLOGICAL_PROCESS
    description: Connection or near-contact of the two cell poles producing a ring.
  - node_id: toroidal_geometry
    label: toroidal geometry
    node_type: BIOLOGICAL_PROCESS
    description: Closed ring-like cell-body geometry.
  - node_id: mreb_filaments
    label: MreB filaments
    node_type: GENE_OR_PROTEIN
    description: Actin-like cytoskeletal filaments guiding cell-wall synthesis.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The node is a cross-taxon MreB-filament aggregate and no exact
      family term was verified for this contextual use.
  - node_id: cell_wall_growth_rate
    label: rate of cell wall growth
    node_type: BIOLOGICAL_PROCESS
    description: Rate of peptidoglycan cell-wall synthesis during growth.
  - node_id: pg_insertion_perpendicular
    label: peptidoglycan insertion perpendicular to long axis
    node_type: BIOLOGICAL_PROCESS
    description: Circumferential peptidoglycan insertion oriented perpendicular to
      the cell long axis.
  - node_id: bactofilin_polymers
    label: bactofilin polymers
    node_type: GENE_OR_PROTEIN
    description: Cytoskeletal bactofilin polymers that localize to sites of wall remodeling.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The node spans multiple bactofilin paralogues and taxa and is
      therefore retained as a reviewed aggregate label.
  - node_id: cell_wall_biosynthesis
    label: cell wall biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Spatially regulated synthesis of the peptidoglycan cell wall.
  - node_id: bactofilin_lmdc_module
    label: bactofilin-M23 peptidase module
    node_type: PATHWAY
    description: Conserved bactofilin and M23 peptidase functional module remodeling
      the wall locally.
  - node_id: wall_biosynthesis_mode_change
    label: local change in cell wall biosynthesis mode
    node_type: BIOLOGICAL_PROCESS
    description: Local shift in the mode of cell-wall synthesis producing shape changes.
  - node_id: crva_polymer
    label: CrvA polymer
    node_type: GENE_OR_PROTEIN
    description: Periplasmic CrvA polymer that skews peptidoglycan synthesis to generate
      curvature.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Retained label-only because an exact semantic CrvA family term
      was not verified in this review.
  - node_id: pg_synthesis_rate_skew
    label: skewed peptidoglycan synthesis rates
    node_type: BIOLOGICAL_PROCESS
    description: Asymmetric peptidoglycan synthesis rates across the cell body.
  - node_id: crescentin
    label: crescentin
    node_type: GENE_OR_PROTEIN
    description: Intermediate filament-like protein promoting cell curvature.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Retained label-only because an exact semantic crescentin family
      term was not verified in this review.
  - node_id: cell_curvature
    label: cell curvature
    node_type: QUALITY
    description: Degree of curvature of the cell body.
  edges:
  - subject: curved_pg_growth
    predicate: has output
    object: pole_to_pole_closure
    description: Strong axial curvature brings the poles into proximity.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell curvature
      notes: Supports curvature-generating wall growth as a producer of closed ring
        forms.
    predicate_id: RO:0002234
  - subject: pole_to_pole_closure
    predicate: causes
    object: toroidal_geometry
    description: Pole-to-pole closure yields a toroidal body.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell shape is genetically determined
      notes: Supports closed ring forms as genetically determined shape outcomes.
    predicate_id: biolink:causes
  - subject: toroidal_geometry
    predicate: manifests as
    object: ring_shaped_trait
    description: Toroidal geometry manifests the ring-shaped trait.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell curvature
      notes: Supports the trait endpoint via curvature-driven closure.
    predicate_id: METPO:2007400
  - subject: mreb_filaments
    predicate: associated with
    object: cell_wall_growth_rate
    description: MreB filament motion is associated with the rate of cell-wall growth.
    evidence:
    - reference: DOI:10.3390/microorganisms12071309
      snippet: motion of MreB filaments correlates with the rate of cell wall growth
      notes: Verified against the open Dersch et al. text; the edge remains associative
        and contextual rather than direct ring-shape evidence.
    predicate_id: biolink:associated_with
  - subject: mreb_filaments
    predicate: regulates
    object: pg_insertion_perpendicular
    description: MreB double filaments guide the orientation of peptidoglycan insertion
      perpendicular to the long axis.
    evidence:
    - reference: DOI:10.1038/s41467-024-49785-x
      snippet: guide peptidoglycan insertion perpendicular to the long axis of the
        cell
      notes: Verified against the open Middlemiss et al. text; the edge supports contextual
        MreB-guided peptidoglycan insertion.
    predicate_id: RO:0002211
  - subject: bactofilin_polymers
    predicate: regulates
    object: cell_wall_biosynthesis
    description: Bactofilin polymers regulate cell-wall biosynthesis.
    evidence:
    - reference: DOI:10.7554/eLife.86577.2
      snippet: central role in the spatial regulation of cell wall biosynthesis
      notes: Verified against the open Pohl et al. abstract; bactofilin spatial wall-biosynthesis
        regulation is retained as comparative Hyphomonas morphogenesis evidence.
    predicate_id: RO:0002211
  - subject: bactofilin_lmdc_module
    predicate: promotes
    object: wall_biosynthesis_mode_change
    description: Conserved bactofilin and M23 peptidase module promotes local changes
      in cell-wall biosynthesis mode.
    evidence:
    - reference: DOI:10.7554/eLife.86577.2
      snippet: promotes local changes in the mode of cell wall biosynthesis
      notes: Verified against the open Pohl et al. abstract; the conserved bactofilin/M23
        module is retained as comparative cell-wall morphogenesis evidence.
    predicate_id: RO:0002213
  - subject: crva_polymer
    predicate: regulates
    object: pg_synthesis_rate_skew
    description: CrvA polymer formation regulates skewed peptidoglycan synthesis rates
      to generate curvature.
    evidence:
    - reference: DOI:10.1038/s41467-024-45196-0
      snippet: CrvA in Vibrio cholerae, which skews peptidoglycan synthesis rates
      notes: Verified against the open Schiller et al. article text; CrvA is retained
        as a comparative bacterial curvature module.
    predicate_id: RO:0002211
  - subject: crescentin
    predicate: promotes
    object: cell_curvature
    description: Crescentin promotes cell curvature.
    evidence:
    - reference: DOI:10.1038/s41467-024-45196-0
      snippet: components that promote curvature
      notes: Verified against the open Schiller et al. article text; Schiller et al.
        list crescentin in the same bacterial curvature-component statement.
    predicate_id: RO:0002213
