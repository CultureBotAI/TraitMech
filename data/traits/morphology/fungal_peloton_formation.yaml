identifier: traitmech:000666
label: fungal peloton formation
definition: A morphological phenotype in which a fungus forms intracellular coiled
  hyphal masses, called pelotons, in association with a plant host.
definition_source: DOI:10.1111/nph.14279
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1111/nph.14279
  snippet: In the colonised protocorm cells, ORM fungi form coiled hyphae, known as
    pelotons
  notes: 'Fochi et al. (2017), author final manuscript, Discussion, Nitrogen transfer
    inside the mycorrhizal orchid protocorm, printed p. 15 / physical p. 17, line
    465: https://iris.unito.it/retrieve/e27ce429-fbc3-2581-e053-d805fe0acbaa/N_metabolism_ORM_rev10_4aperto.pdf
    Contiguous clause matched after removing standalone line numbers and joining PDF
    line wraps, and visually checked. The maintained resolver returned NOT_IN_ABSTRACT;
    this is a manual full-text check, not a resolver VERIFIED result. Main text through
    Conclusions and actual Figure 5 were inspected. Figure 5 shows intact and collapsed
    pelotons in Serapias vomeracea 30 days after sowing with Tulasnella calospora.
    The manuscript''s title wording and GEO(XXXX) placeholder differ from final metadata;
    no dataset accession is inferred. Other figure images and supplementary contents
    were not inspected. Transcript patterns and heterologous yeast assays are not
    causal tests of native peloton formation.'
- reference: DOI:10.1111/1365-2745.70188
  snippet: Ericoid hyphal coils (also called pelotons) are specific structures formed
    by ericoid fungi in root epidermal cells
  notes: Meyers et al. (2025), Table 1 continued, CCI row, Relevance column, p. 3681
    / physical p. 4. The complete morphology clause was exact-matched and visually
    checked in the public publisher PDF deposited at https://freidok.uni-freiburg.de/data/273892;
    its SHA256 matches the repository checksum. This directly read usage supports
    ericoid scope, not an orchid-only definition. Methods 2.4 scores Vaccinium myrtillus
    root intersects, distinguishing coils from other intracellular hyphae; CCI is
    not a fungal cell fraction or measured nutrient flux. No fungal species was identified
    for a canonical example. Actual supplementary Figure S3 was not inspected. The
    resolver returned UNRESOLVED; an exact Europe PMC DOI query returned no hit and
    Crossref confirmed the exact DOI/title. Manual PDF verification does not change
    that resolver verdict.
- reference: DOI:10.1111/nph.19338
  snippet: tightly coiled intracellular fungal hyphae (i.e. pelotons) are a constant
    feature of OrM
  notes: 'Perotto and Balestrini, Viewpoint, online 2023, institutional early-view
    PDF: https://iris.unito.it/retrieve/b44ea427-adb1-4f5b-a5b6-cc876e060f2f/New%20Phytologist%20-%202023%20-%20Perotto%20-%20At%20the%20core%20of%20the%20endomycorrhizal%20symbioses%20intracellular%20fungal%20structures%20in%20orchid.pdf
    Printed/physical p. 2, The peloton: a constant feature in orchid mycorrhiza. Main
    text and actual Figures 1-3 were read; the contiguous clause was visually checked.
    This is review terminology, not independent experimental replication. The same
    page describes Paris-type AM coils as resembling orchid pelotons and discusses
    a continuum with arbusculate coils; resemblance is not exact equivalence. Figure
    2 has inconsistent panel/scale labels, so no panel-specific dimensions are adopted.
    Its hypothesis of plant-driven development is not an established formation mechanism.
    The orchid discussion does not erase the separate ericoid usage in Meyers et al.'
canonical_examples:
- taxon_id: NCBITaxon:156515
  taxon_label: Tulasnella calospora
  reference: DOI:10.1111/nph.14279
  note: AL13/4D = MUT4182 in Serapias vomeracea protocorms, oat medium, 20 C in darkness;
    actual Figure 5 documents pelotons 30 days after sowing. Fochi Methods, printed
    p. 4 / physical p. 6, https://iris.unito.it/retrieve/e27ce429-fbc3-2581-e053-d805fe0acbaa/N_metabolism_ORM_rev10_4aperto.pdf
    reports isolation from Anacamptis laxiflora mycorrhizal roots in northern Italy
    and deposition as MUT4182 (citing Girlanda et al. 2011, DOI:10.3732/ajb.1000486;
    that original isolation paper was not read). NCBI EFetch confirms species 156515
    and child strain 1051891, Tulasnella calospora MUT 4182, with equivalent name
    Tulasnella calospora AL13/4D. The paper's engineered yeast complementation assay
    is a separate experiment, not an engineered fungal exemplar. This culture-qualified
    example is not independent taxonomic reidentification or evidence for every strain
    and condition.
discussions:
- discussion_id: fungal-peloton-scope-and-hierarchy
  prompt: Resolve a closer parent without collapsing intracellular architectures.
  kind: CURATION_TODO
  status: OPEN
  rationale: Use phenotype METPO:1000059. Spiral shaped METPO:1000684, branched shaped
    METPO:1000687 and filament shaped METPO:1000674 concern cell shape. Mycelial growth
    traitmech:000074 is explicitly bacterial. Fungal arbuscule formation traitmech:000664
    concerns branched intracellular structures; hyphal anastomosis traitmech:000605
    is fusion, pseudohyphal growth traitmech:000653 budding-cell chains, and haustorium
    formation traitmech:000663 a specialized host interface. None is an exact duplicate
    or settled closer parent. Fochi's orchid usage and Meyers' ericoid usage both
    inform the unqualified label. The review's Paris-type AM comparison does not make
    every intracellular coil a peloton or establish disjoint organisms. No exact synonyms,
    structure xrefs or SSSOM equivalences are asserted. Liverwort terminology in DOI:10.1098/rstb.2000.0617
    remains an abstract-only analogy lead; its full text and figures were not inspected.
  posed_by: codex
  posed_date: '2026-10-07'
- discussion_id: fungal-peloton-formation-versus-function
  prompt: Separate formation from nutrient transfer and proposed regulation.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'The phenotype does not require a measured nutrient flux, exclusive mutualism,
    a universal lifespan, or a specific plant-driven mechanism. Transcript associations
    and isolated transporter complementation do not establish the native formation
    pathway. Nutrient transfer before or during coil degeneration is a separate question
    from morphogenesis. A protein-resolved causal graph is deferred pending direct
    formation perturbations and authority-verified protein anchors; a mechanism is
    not claimed biologically absent. Keep the example''s MUT4182 separate from Tulasnella
    sp. SV6 (MUT4178) studied in DOI:10.1186/s43008-024-00165-6: that paper uses AL13/4D
    as a reference genome, not as its culture.'
  posed_by: codex
  posed_date: '2026-10-07'
