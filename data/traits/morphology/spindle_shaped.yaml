identifier: METPO:1000692
label: spindle shaped
definition: A cell shape that is widest at the middle and tapers symmetrically toward
  pointed poles.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: spindle
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: cell shape is genetically determined
  notes: Cell-shape review supports symmetric tapered shapes as a genetically determined
    outcome of polar wall patterning.
canonical_examples:
- taxon_id: NCBITaxon:1488
  taxon_label: Clostridium acetobutylicum
  note: spindle-shaped on sporulation
  reference: PMID:16346038
causal_graphs:
- graph_id: spindle_shaped_symmetric_taper
  title: Spindle-shape symmetric polar taper
  description: DOI-backed graph linking symmetric tapered polar wall growth and reduced
    end-cap radius to spindle morphology.
  scope_status: NONMECHANISTIC
  scope_notes: This is a geometric shape classification; the cited evidence does not
    establish a taxon-matched protein determinant for symmetric tapering.
  nodes:
  - node_id: spindle_shaped_trait
    label: spindle shaped
    node_type: TRAIT
    grounding: METPO:1000692
    description: Cell widest at the middle and tapering symmetrically to pointed poles.
  - node_id: symmetric_polar_pg
    label: symmetric polar peptidoglycan growth
    node_type: BIOLOGICAL_PROCESS
    description: Tapered PG growth at both poles producing pointed ends.
  - node_id: reduced_end_cap_radius
    label: reduced end-cap radius
    node_type: BIOLOGICAL_PROCESS
    description: Narrowed cell-body radius near the poles.
  - node_id: spindle_geometry
    label: spindle geometry
    node_type: BIOLOGICAL_PROCESS
    description: Bilaterally symmetric tapered body geometry.
  - node_id: localized_pg_insertion
    label: localized peptidoglycan insertion
    node_type: BIOLOGICAL_PROCESS
    description: Spatially restricted incorporation of new peptidoglycan at distinct
      rates in defined cell locations.
  - node_id: non_spherical_morphology
    label: non-spherical morphology
    node_type: QUALITY
    description: A differentiated, non-spherical cell shape produced by spatially
      patterned wall growth.
  edges:
  - subject: symmetric_polar_pg
    predicate: has output
    object: reduced_end_cap_radius
    description: Symmetric polar growth produces reduced end-cap radius at both poles.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: polar growth
      notes: Supports polar PG growth as the producer of tapered ends.
    predicate_id: RO:0002234
  - subject: reduced_end_cap_radius
    predicate: causes
    object: spindle_geometry
    description: Reduced end-cap radius at both poles yields spindle geometry.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell shape is genetically determined
      notes: Supports tapered geometry as a genetically determined shape outcome.
    predicate_id: biolink:causes
  - subject: spindle_geometry
    predicate: manifests as
    object: spindle_shaped_trait
    description: Spindle geometry manifests the spindle-shaped trait.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell shape is genetically determined
      notes: Supports the trait endpoint.
    predicate_id: METPO:2007400
  - subject: localized_pg_insertion
    predicate: required for
    object: non_spherical_morphology
    description: Spatially localized (non-dispersed) peptidoglycan insertion is required
      to generate any non-spherical, differentiated cell shape.
    evidence:
    - reference: DOI:10.3389/fmicb.2017.01264
      notes: To generate shapes other than a sphere, incorporation must occur at distinct
        rates in different locations and for defined periods of time. Broad mechanistic
        principle for non-spherical morphogenesis.
  - subject: localized_pg_insertion
    predicate: enables
    object: symmetric_polar_pg
    description: Generic localized PG insertion underlies the symmetric polar peptidoglycan
      growth that taper the poles.
    evidence:
    - reference: DOI:10.3389/fmicb.2017.01264
      notes: Localized, temporally defined PG incorporation is the general prerequisite
        for the symmetric polar growth that produces tapered spindle poles.
    predicate_id: RO:0002327
