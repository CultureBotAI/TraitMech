identifier: METPO:1000674
label: filament shaped
definition: A cell shape in which an organism grows as elongated filamentous cells
  or hypha-like structures.
definition_source: DOI:10.1016/j.mib.2010.10.002
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: S_filament
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: filament
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: filament-shaped
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1016/j.mib.2010.10.002
  snippet: polar growth of Streptomyces
  notes: Supports filamentous Streptomyces morphology as a polar-growth cell-shape
    system.
causal_graphs:
- graph_id: filament_shaped_streptomyces_polar_growth
  title: Filament-shape Streptomyces polar growth mechanism
  description: Evidence-backed causal sketch linking filamentous morphology to DivIVA/Scy
    polarisomes, apical peptidoglycan synthesis, and hyphal tip extension.
  nodes:
  - node_id: filament_shaped_trait
    label: filament shaped
    node_type: TRAIT
    grounding: METPO:1000674
    description: Elongated filamentous bacterial morphology.
  - node_id: divIVA
    label: DivIVA
    node_type: GENE_OR_PROTEIN
    description: Polarity determinant for Streptomyces apical growth.
    grounding: UniProtKB:Q1IYG2
  - node_id: scy
    label: Scy
    node_type: GENE_OR_PROTEIN
    description: Streptomyces cytoskeletal element associated with the polarisome.
    grounding: UniProtKB:A0A191V3Q4
  - node_id: apical_polarisome
    label: apical polarisome
    node_type: CELLULAR_LOCALIZATION
    description: Hyphal-tip organizing center for polar growth.
  - node_id: apical_peptidoglycan_synthesis
    label: apical peptidoglycan synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Cell-wall synthesis localized at the hyphal tip.
  - node_id: hyphal_tip_extension
    label: hyphal tip extension
    node_type: BIOLOGICAL_PROCESS
    description: Extension of filamentous hyphae by polar growth.
  - node_id: dna_damage_sos_response
    label: RecA/LexA SOS response
    node_type: BIOLOGICAL_PROCESS
    description: DNA-damage-triggered RecA/LexA SOS regulon inducing division-inhibitor
      expression.
  - node_id: sula
    label: SulA
    node_type: GENE_OR_PROTEIN
    description: SOS-induced cell-division inhibitor that blocks FtsZ polymerization.
    grounding: UniProtKB:H8YHZ0
  - node_id: ftsz_polymerization
    label: FtsZ polymerization
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of the FtsZ ring required for septation and cell division.
  - node_id: apical_growth
    label: polar hyphal growth
    node_type: BIOLOGICAL_PROCESS
    description: Tip-localized polar growth of filamentous hyphae mediated by DivIVA/polarisome.
  - node_id: hyphal_branch_emergence
    label: hyphal branch emergence
    node_type: BIOLOGICAL_PROCESS
    description: Emergence of new branches via splitting of polarisomes at hyphal
      tips.
  - node_id: cgla
    label: CglA
    node_type: GENE_OR_PROTEIN
    description: LCP-LytR_C domain glycopolymer ligase attaching glycopolymers to
      the cell wall.
    grounding: UniProtKB:A0A0C1K447
  - node_id: cell_wall_glycopolymer_attachment
    label: cell-wall glycopolymer attachment
    node_type: BIOLOGICAL_PROCESS
    description: Ligation of glycopolymers onto peptidoglycan maintaining hyphal cell
      shape.
  edges:
  - subject: divIVA
    predicate: localizes to
    object: apical_polarisome
    description: DivIVA localizes at hyphal tips as part of the polar growth machinery.
    evidence:
    - reference: DOI:10.1016/j.mib.2010.10.002
      snippet: polarity determinant DivIVA
      notes: Supports DivIVA as a polarity determinant in Streptomyces.
    predicate_id: biolink:located_in
  - subject: scy
    predicate: enables
    object: apical_polarisome
    description: Scy is a component of the tip-organizing center controlling polar
      growth.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1002423
      snippet: tip organizing center
      notes: Supports Scy/DivIVA assemblies in Streptomyces polarized growth.
    predicate_id: RO:0002327
  - subject: apical_polarisome
    predicate: recruits
    object: apical_peptidoglycan_synthesis
    description: The apical polarisome recruits cell-wall synthesis machinery to hyphal
      tips.
    evidence:
    - reference: DOI:10.1016/j.mib.2012.10.012
      snippet: polarisome-like complex involving the essential polarity protein DivIVA
      notes: Supports polarisome-directed apical growth and cell-wall assembly.
  - subject: apical_peptidoglycan_synthesis
    predicate: regulates
    object: hyphal_tip_extension
    description: Localized wall synthesis at the tip drives filament extension.
    evidence:
    - reference: DOI:10.1038/s41564-025-02080-x
      snippet: DivIVA drives growth at the hyphal poles
      notes: Supports DivIVA-recruited PG synthesis at hyphal poles.
    predicate_id: RO:0002211
  - subject: hyphal_tip_extension
    predicate: manifests as
    object: filament_shaped_trait
    description: Hyphal tip extension manifests filamentous morphology.
    evidence:
    - reference: DOI:10.1016/j.mib.2010.10.002
      snippet: Streptomyces hyphae
      notes: Supports filamentous hyphal morphology as the trait endpoint.
    predicate_id: METPO:2007400
  - subject: dna_damage_sos_response
    predicate: induces
    object: sula
    description: DNA damage activates the RecA/LexA SOS response, inducing the division
      inhibitor SulA.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      notes: DNA damage activates the RecA/LexA SOS response, leading to expression
        of sulA.
  - subject: sula
    predicate: inhibits
    object: ftsz_polymerization
    description: SulA blocks FtsZ polymerization, preventing Z-ring assembly and septation.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      notes: A cell division inhibitor, sulA, blocks FtsZ / SulA interferes with FtsZ
        polymerization.
    predicate_id: RO:0002212
  - subject: ftsz_polymerization
    predicate: regulates
    object: filament_shaped_trait
    description: Inhibited FtsZ polymerization blocks septation, causing non-septate
      filamentation.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      notes: FtsZ inhibition / blocked septation contributes to non-septate cellular
        filamentation.
    predicate_id: RO:0002211
  - subject: apical_polarisome
    predicate: enables
    object: apical_growth
    description: The DivIVA/polarisome assembly mediates polar growth at hyphal tips.
    evidence:
    - reference: DOI:10.1128/jb.00153-23
      notes: Hyphal growth occurs at the tips of the filamentous cells; this polar
        growth is mediated by DivIVA.
    predicate_id: RO:0002327
  - subject: apical_polarisome
    predicate: promotes
    object: hyphal_branch_emergence
    description: Splitting of polarisomes at tips produces daughter polarisomes that
      coordinate new branch emergence.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: DivIVA forms discrete foci at growing tips; splitting of polarisomes
        produces daughter polarisomes coordinating emergence of new branches.
    predicate_id: RO:0002213
  - subject: cgla
    predicate: enables
    object: cell_wall_glycopolymer_attachment
    description: CglA is the glycopolymer ligase mediating attachment of glycopolymers
      to the cell wall.
    evidence:
    - reference: DOI:10.1128/mbio.01492-24
      notes: Identified the LCP-LytR_C domain protein CglA as a key glycopolymer ligase.
    predicate_id: RO:0002327
  - subject: cell_wall_glycopolymer_attachment
    predicate: regulates
    object: filament_shaped_trait
    description: Reduced glycopolymer attachment results in enlarged vegetative hyphae
      and loss of hyphal cell shape.
    evidence:
    - reference: DOI:10.1128/mbio.01492-24
      notes: Reduced amount of glycopolymers in the cglA mutant results in enlarged
        vegetative hyphae.
    predicate_id: RO:0002211
