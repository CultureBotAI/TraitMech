identifier: METPO:1000886
label: cell length large
definition: A cell-length phenotype in which the longer cell dimension exceeds approximately
  3 micrometers.
definition_source: DOI:10.1126/science.aaa1313
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000881
synonyms:
- synonym_text: L_>3
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1126/science.aaa1313
  snippet: cell size scales with growth rate
  notes: Growth-rate-dependent size law supports large cell length under fast-growth
    or division-delayed regimes.
- reference: DOI:10.1038/nrmicro2671
  snippet: directs cell division
  notes: FtsZ-divisome review supports division-site timing as a control point governing
    whether cells reach larger lengths before constriction.
canonical_examples:
- taxon_id: NCBITaxon:324679
  taxon_label: Spirochaeta dissipatitropha
  reference: DOI:10.1099/ijs.0.65862-0
  note: Spirochaeta dissipatitropha ASpC2T cells measured 8-18 micrometres long, wholly
    above the approximately 3-micrometre threshold.
causal_graphs:
- graph_id: cell_length_large_division_delay
  scope_status: NONMECHANISTIC
  scope_notes: This record is a numerical cell-length bin. Its graph illustrates possible
    regulators of measured length but is not a single inheritable causal mechanism
    requiring a protein/taxon exemplar.
  title: Large cell-length via FtsZ division delay
  description: DOI-backed graph linking fast elongation, SOS/SulA-mediated FtsZ inhibition,
    FtsZ Z-ring control, and delayed constriction to large cell length (>3 μm).
  nodes:
  - node_id: cell_length_large_trait
    label: cell length large
    node_type: TRAIT
    grounding: METPO:1000886
    description: Cell length exceeding approximately 3 μm.
  - node_id: cell_length_trait
    label: cell length
    node_type: TRAIT
    grounding: METPO:1000881
    description: Regulated longer cellular dimension.
  - node_id: fast_elongation
    label: fast elongation rate
    node_type: BIOLOGICAL_PROCESS
    description: Rapid axial elongation between divisions.
  - node_id: division_timing_delay
    label: division-timing delay
    node_type: BIOLOGICAL_PROCESS
    description: Postponement of FtsZ-ring constriction extending elongation.
  - node_id: sos_response
    label: SOS response
    node_type: BIOLOGICAL_PROCESS
    description: DNA-damage/stress-activated regulatory program that induces division
      inhibitors.
    grounding: GO:0009432
  - node_id: sula_division_inhibition
    label: SulA-mediated division inhibition
    node_type: BIOLOGICAL_PROCESS
    description: Inhibition of cell division mediated by the SOS-induced inhibitor
      SulA.
  - node_id: sula_protein
    label: SulA
    node_type: GENE_OR_PROTEIN
    description: SOS-induced cell-division inhibitor protein that blocks FtsZ assembly.
    grounding: InterPro:IPR004596
  - node_id: ftsz_zring
    label: FtsZ Z-ring
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of the FtsZ ring at midcell that initiates cytokinesis.
  - node_id: ftsz_protein
    label: FtsZ
    node_type: GENE_OR_PROTEIN
    description: Bacterial tubulin homolog whose abundance is rate-limiting for division.
    grounding: InterPro:IPR000158
  - node_id: constriction_onset
    label: onset of constriction
    node_type: BIOLOGICAL_PROCESS
    description: Initiation of septal constriction during cytokinesis.
  edges:
  - subject: fast_elongation
    predicate: contributes to
    object: cell_length_large_trait
    description: Fast elongation between divisions yields longer cells.
    evidence:
    - reference: DOI:10.1126/science.aaa1313
      snippet: cell size scales with growth rate
      notes: Supports fast growth as a producer of larger cell sizes.
    predicate_id: RO:0002326
  - subject: division_timing_delay
    predicate: contributes to
    object: cell_length_large_trait
    description: Delaying division allows continued elongation past the typical size.
    evidence:
    - reference: DOI:10.1038/nrmicro2671
      snippet: directs cell division
      notes: Supports division timing as a control point for cell length.
    predicate_id: RO:0002326
  - subject: cell_length_large_trait
    predicate: is a
    object: cell_length_trait
    description: Large cell length is a quantitative bin of the cell-length phenotype.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.07.022
      snippet: cell size is tightly controlled
      notes: Supports large length as a value within the regulated cell-length distribution.
    predicate_id: rdfs:subClassOf
  - subject: sos_response
    predicate: positively regulates
    object: sula_division_inhibition
    description: The SOS response increases SulA-mediated division inhibition after
      DNA damage or replication stress.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      snippet: SOS response is activated
      notes: Verified against the open Wiley full text; DNA damage activates the RecA/LexA
        SOS response and enables expression of SOS regulon genes, including sulA.
    predicate_id: RO:0002213
  - subject: sula_protein
    predicate: negatively regulates
    object: ftsz_zring
    description: SulA inhibits FtsZ polymerization, blocking productive Z-ring assembly.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      snippet: cell division inhibitor, sulA, blocks FtsZ
      notes: Verified against the open Wiley full text; the source links SOS activation
        to SulA blocking FtsZ polymerization.
    predicate_id: RO:0002212
  - subject: ftsz_protein
    predicate: positively regulates
    object: constriction_onset
    description: FtsZ accumulation in the Z-ring is a rate-limiting driver for onset
      of constriction at faster growth rates.
    evidence:
    - reference: DOI:10.1038/s41467-024-54242-w
      snippet: rate limit the onset of constriction
      notes: Verified against the open Nature Communications full text; FtsZ numbers
        were rate-limiting for constriction onset in moderately fast E. coli growth.
    predicate_id: RO:0002213
  - subject: sula_protein
    predicate: contributes to
    object: sula_division_inhibition
    description: SOS-induced SulA is the inhibitory protein mediating this division-arrest
      branch.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      snippet: cell division inhibitor sulA
      notes: Verified against the open Wiley full text; the study frames SulA as the
        SOS-linked cell-division inhibitor.
    predicate_id: RO:0002326
  - subject: sula_division_inhibition
    predicate: contributes to
    object: division_timing_delay
    description: SulA-mediated inhibition of septation contributes to delayed division
      and continued elongation.
    evidence:
    - reference: DOI:10.1002/advs.202203260
      snippet: contributes to non-septate cellular filamentation
      notes: Verified against the open Wiley full text; SulA-mediated FtsZ inhibition
        is linked to blocked septation and filamentation.
    predicate_id: RO:0002326
  - subject: ftsz_zring
    predicate: positively regulates
    object: constriction_onset
    description: FtsZ bundles promote the FtsA/FtsN/core-divisome transition that
      starts constriction.
    evidence:
    - reference: DOI:10.1038/s41467-024-54242-w
      snippet: starts the onset of constriction
      notes: Verified against the open Nature Communications full text; the proposed
        model routes FtsZ bundles through FtsA antiparallel filaments, FtsN recruitment,
        and core-divisome activation.
    predicate_id: RO:0002213
