identifier: METPO:1000886
label: cell length large
definition: A cell-length phenotype in which the longer cell dimension exceeds approximately
  3 micrometers.
definition_source: DOI:10.1126/science.aaa1313
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000881
synonyms:
- synonym_text: L_>3
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1126/science.aaa1313
  snippet: cell size scales with growth rate
  notes: Growth-rate-dependent size law supports large cell length under fast-growth
    or division-delayed regimes.
- reference: DOI:10.1038/nrmicro2671
  snippet: directs cell division
  notes: FtsZ-divisome review supports division-site timing as a control point governing
    whether cells reach larger lengths before constriction.
causal_graphs:
- graph_id: cell_length_large_division_delay
  title: Large cell-length from fast growth or division delay
  description: DOI-backed graph linking fast elongation, delayed FtsZ-ring constriction,
    or filamentous growth programs to large cell length (>3 μm).
  nodes:
  - node_id: cell_length_large_trait
    label: cell length large
    node_type: TRAIT
    grounding: METPO:1000886
    description: Cell length exceeding approximately 3 μm.
  - node_id: cell_length_trait
    label: cell length
    node_type: TRAIT
    grounding: METPO:1000881
    description: Regulated longer cellular dimension.
  - node_id: fast_elongation
    label: fast elongation rate
    node_type: BIOLOGICAL_PROCESS
    description: Rapid axial elongation between divisions.
  - node_id: division_timing_delay
    label: division-timing delay
    node_type: BIOLOGICAL_PROCESS
    description: Postponement of FtsZ-ring constriction extending elongation.
  - node_id: sos_response
    label: SOS response
    node_type: BIOLOGICAL_PROCESS
    description: DNA-damage/stress-activated regulatory program that induces division
      inhibitors.
    grounding: GO:0009432
  - node_id: sula_division_inhibition
    label: SulA-mediated division inhibition
    node_type: BIOLOGICAL_PROCESS
    description: Inhibition of cell division mediated by the SOS-induced inhibitor
      SulA.
  - node_id: sula_protein
    label: SulA
    node_type: GENE_OR_PROTEIN
    description: SOS-induced cell-division inhibitor protein that blocks FtsZ assembly.
    grounding: UniProtKB:H8YHZ0
  - node_id: ftsz_zring
    label: FtsZ Z-ring
    node_type: BIOLOGICAL_PROCESS
    description: Assembly of the FtsZ ring at midcell that initiates cytokinesis.
  - node_id: ftsz_protein
    label: FtsZ
    node_type: GENE_OR_PROTEIN
    description: Bacterial tubulin homolog whose abundance is rate-limiting for division.
    grounding: UniProtKB:C0LUM8
  - node_id: constriction_onset
    label: onset of constriction
    node_type: BIOLOGICAL_PROCESS
    description: Initiation of septal constriction during cytokinesis.
  edges:
  - subject: fast_elongation
    predicate: contributes to
    object: cell_length_large_trait
    description: Fast elongation between divisions yields longer cells.
    evidence:
    - reference: DOI:10.1126/science.aaa1313
      snippet: cell size scales with growth rate
      notes: Supports fast growth as a producer of larger cell sizes.
    predicate_id: RO:0002326
  - subject: division_timing_delay
    predicate: contributes to
    object: cell_length_large_trait
    description: Delaying division allows continued elongation past the typical size.
    evidence:
    - reference: DOI:10.1038/nrmicro2671
      snippet: directs cell division
      notes: Supports division timing as a control point for cell length.
    predicate_id: RO:0002326
  - subject: cell_length_large_trait
    predicate: is a
    object: cell_length_trait
    description: Large cell length is a quantitative bin of the cell-length phenotype.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.07.022
      snippet: cell size is tightly controlled
      notes: Supports large length as a value within the regulated cell-length distribution.
    predicate_id: rdfs:subClassOf
  - subject: sos_response
    predicate: induces
    object: sula_division_inhibition
    description: DNA damage/stress activates the SOS program, inducing division inhibitors
      that halt septation and promote elongation.
    evidence:
    - reference: DOI:10.1101/2025.05.13.653778
      notes: SOS regulon upregulates sulA; SulA prevents Z-ring formation and halts
        division.
  - subject: sula_protein
    predicate: inhibits assembly of
    object: ftsz_zring
    description: SulA blocks FtsZ polymerization/assembly, delaying cytokinesis and
      allowing continued elongation.
    evidence:
    - reference: DOI:10.1101/2025.05.13.653778
      notes: 'Canonical edge for many bacteria: SulA inhibits FtsZ assembly by sequestering
        monomers, directly blocking polymerization.'
  - subject: ftsz_protein
    predicate: delays
    object: constriction_onset
    description: FtsZ copy number is rate-limiting for division; reduced FtsZ delays
      septation and can increase cell length before division.
    evidence:
    - reference: DOI:10.1038/s41467-024-54242-w
      notes: FtsZ numbers are rate-limiting for cell division; ~20% downregulation
        may delay division.
