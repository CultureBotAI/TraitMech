identifier: traitmech:000073
label: heterocyst
definition: A morphology trait in which a filamentous cyanobacterium differentiates
  specialized, thick-walled cells (heterocysts) that create a microoxic interior for
  oxygen-sensitive nitrogen fixation.
definition_source: DOI:10.1101/cshperspect.a000315
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: heterocyst-forming
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1101/cshperspect.a000315
evidence:
- reference: DOI:10.1101/cshperspect.a000315
  notes: Kumar, Mella-Herrera & Golden describe heterocysts as differentiated cells
    whose structure and metabolism accommodate oxygen-sensitive nitrogen fixation.
- reference: DOI:10.1093/femsre/fuw029
  notes: Herrero, Stavans & Flores describe heterocysts within the multicellular filament
    of heterocyst-forming cyanobacteria.
canonical_examples:
- taxon_id: NCBITaxon:103690
  taxon_label: Nostoc sp. PCC 7120
  note: Model heterocyst-forming cyanobacterium (also classified as Anabaena sp. PCC
    7120); heterocysts are the N2-fixing cells. Trichormus (Anabaena) variabilis ATCC
    29413 is an alternative model.
  reference: PMID:11759840
