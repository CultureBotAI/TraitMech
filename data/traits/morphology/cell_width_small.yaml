identifier: METPO:1000888
label: cell width small
definition: A cell-width phenotype in which the shorter cell dimension lies approximately
  between 0.5 and 0.65 micrometers.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000882
synonyms:
- synonym_text: W_0.5_0.65
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: MreB-directed peptidoglycan synthesis
  notes: Supports the MreB/Rod-complex set-point producing narrow rod widths in the
    0.5–0.65 μm range.
