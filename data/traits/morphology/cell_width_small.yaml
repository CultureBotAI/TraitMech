    description: Cell-wall hydrolase/autolysin activity that cleaves peptidoglycan.
  - node_id: magnesium_ion
    label: Mg2+
    node_type: CHEMICAL
    description: Magnesium ion, an environmental modifier of cell-wall hydrolase activity.
  edges:
  - subject: mreb_cytoskeleton
    predicate: enables
    object: rod_complex_pg
    description: MreB organizes lateral PG synthesis along the cylinder.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: MreB-directed peptidoglycan synthesis
      notes: Supports MreB as the lateral PG organizer.
    predicate_id: RO:0002327
  - subject: rod_complex_pg
    predicate: produces
    object: cell_width_small_trait
    description: Rod-complex PG synthesis maintains a narrow cylinder radius.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: rod-shape is maintained
      notes: Supports lateral PG assembly as the producer of the narrow rod radius.
    predicate_id: METPO:2000202
  - subject: cell_width_small_trait
    predicate: is a
    object: cell_width_trait
    description: Small cell width is a quantitative bin of the cell-width phenotype.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: MreB-directed peptidoglycan synthesis
      notes: Supports small width as a value within the regulated cell-width distribution.
    predicate_id: rdfs:subClassOf
  - subject: mrec_protein
    predicate: activates
    object: roda_pbp2_open
    description: MreC favors the open, active conformation of the RodA-PBP2 synthase.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: MreC favors the open, active PBP2 state; PBP2 suppressor alleles bypass
        defective MreC and increase polymerization activity (conserved Rod complex).
  - subject: roda_pbp2_open
    predicate: increases
    object: pg_polymerization_crosslinking
    description: The open RodA-PBP2 state couples activation of polymerization and
      crosslinking.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: Structural opening couples activation of polymerization and crosslinking;
        open-state mutants show stronger polymerization (conserved SEDS-bPBP systems).
  - subject: pg_polymerization_crosslinking
    predicate: contributes to
    object: rod_complex_pg
    description: PG polymerization and crosslinking constitute the Rod-complex synthetic
      output.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: Open-state activation links RodA-PBP2 conformation to peptidoglycan synthetic
        output of the Rod complex.
  - subject: mreb_cytoskeleton
    predicate: required for
    object: rod_diameter_control
    description: MreB is a key determinant of rod shape and steady-state diameter/width
      control.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      notes: MreB is a key determinant of rod shape and diameter; perturbing MreB
        changes steady-state diameter and width control (broad, foundational).
  - subject: rod_diameter_control
    predicate: produces
    object: cell_width_small_trait
    description: Stable diameter control maintains the narrow rod radius set-point.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      notes: Width/diameter control governs the steady-state rod radius producing
        the narrow width phenotype.
  - subject: magnesium_ion
    predicate: inhibits
    object: pg_hydrolase_activity
    description: Exogenous Mg2+ inhibits autolysins/cell-wall hydrolases.
    evidence:
    - reference: DOI:10.1038/s41598-021-04294-5
      notes: Exogenous Mg2+ inhibits autolysins/CW hydrolases and compensates increased
        DL-endopeptidase activity (clearest environmental modifier edge).
