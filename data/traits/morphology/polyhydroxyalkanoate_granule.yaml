evidence:
- reference: DOI:10.1128/mr.54.4.450-472.1990
  notes: Anderson & Dawes describe polyhydroxyalkanoates (chiefly PHB) as carbon/energy
    reserves stored as cytoplasmic granules.
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow include storage granules such as PHA bodies among bacterial
    intracellular organelles.
