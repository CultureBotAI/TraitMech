identifier: traitmech:000067
label: polyhydroxyalkanoate granule
definition: An intracellular storage inclusion composed of polyhydroxyalkanoate
  (e.g. polyhydroxybutyrate, PHB), a carbon and energy reserve accumulated as
  cytoplasmic granules.
definition_source: DOI:10.1128/mr.54.4.450-472.1990
