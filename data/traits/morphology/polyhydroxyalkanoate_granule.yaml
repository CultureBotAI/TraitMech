    predicate_id: RO:0002327
  - subject: nutrient_limitation_high_cn
    predicate: increases
    object: pha_accumulation
    description: High C/N ratio and N/S/P depletion stimulate PHA accumulation.
    evidence:
    - reference: DOI:10.3390/molecules29102293
      notes: PHA accumulation is stimulated by a high C/N ratio, depletion of N, S,
        and P, or a low rate of respiration.
    predicate_id: RO:0002213
  - subject: nutrient_limitation_high_cn
    predicate: induces
    object: pha_accumulation
    description: Nutrient limitation with excess carbon induces PHA accumulation.
    evidence:
    - reference: DOI:10.1016/j.jbc.2024.107523
      notes: Environmental triggers include nutrient limitation and excess carbon
        that induce PHA accumulation.
  - subject: pha_synthase_phac
    predicate: catalyzes
    object: polyhydroxyalkanoate
    description: PhaC polymerizes hydroxyacyl-CoA into PHA/PHB polymer.
    evidence:
    - reference: DOI:10.3390/polym15143027
      notes: PhbC polymerizing beta-hydroxybutyryl-CoA into PHB.
    predicate_id: biolink:catalyzes
  - subject: phasin_phap
    predicate: stabilizes
    object: polyhydroxyalkanoate
    description: Phasins coat and stabilize PHB chains at the granule surface.
    evidence:
    - reference: DOI:10.3390/polym15143027
      notes: Phasins are GAPs that coat and stabilize PHB chains.
  - subject: phasin_phap
    predicate: controls
    object: phb_granule_size_number
    description: Phasins control the size and number of PHB granules.
    evidence:
    - reference: DOI:10.3390/polym15143027
      notes: Phasins control the size of the PHB granules.
    predicate_id: RO:0002211
  - subject: phar_regulator
    predicate: represses transcription of
    object: phap_gene
    description: PhaR binds phaP promoters and represses transcription.
    evidence:
    - reference: DOI:10.1016/j.jbc.2024.107523
      notes: PhaR is a transcriptional repressor that binds phaP promoters and represses
        their transcription.
  - subject: pha_depolymerase_phaz
    predicate: mediates
    object: phb_mobilization
    description: PHB depolymerase cleaves PHB to 3-hydroxybutyrate, mediating mobilization.
    evidence:
    - reference: DOI:10.3390/polym15143027
      notes: PHB mobilization involves a PHB depolymerase (PhbZ/PhaZ) that cleaves
        PHB to beta-hydroxybutyrate.
  - subject: carbon_starvation
    predicate: triggers
    object: phb_degradation
    description: Starvation or exogenous carbon depletion triggers PHB degradation.
    evidence:
    - reference: DOI:10.3390/polym15143027
      notes: PHB is degraded during starvation/exogenous carbon depletion or stationary
        phase.
