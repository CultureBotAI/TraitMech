identifier: traitmech:000067
label: polyhydroxyalkanoate granule
definition: An intracellular storage inclusion composed of polyhydroxyalkanoate (e.g.
  polyhydroxybutyrate, PHB), a carbon and energy reserve accumulated as cytoplasmic
  granules.
definition_source: DOI:10.1128/mr.54.4.450-472.1990
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000066
synonyms:
- synonym_text: PHB granule
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mr.54.4.450-472.1990
- synonym_text: polyhydroxybutyrate inclusion
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mr.54.4.450-472.1990
evidence:
- reference: DOI:10.1128/mr.54.4.450-472.1990
  notes: Anderson & Dawes describe polyhydroxyalkanoates (chiefly PHB) as carbon/energy
    reserves stored as cytoplasmic granules.
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow include storage granules such as PHA bodies among bacterial
    intracellular organelles.
causal_graphs:
- graph_id: pha_granule_carbon_energy_storage
  title: PHA granules store carbon and energy as polyhydroxyalkanoate
  description: Evidence-backed causal sketch linking polyhydroxyalkanoate biosynthesis
    to intracellular storage granules serving as carbon and energy reserves.
  nodes:
  - node_id: pha_granule_trait
    label: polyhydroxyalkanoate granule
    node_type: TRAIT
    grounding: traitmech:000067
    description: Cytoplasmic granule composed of polyhydroxyalkanoate (e.g. PHB).
  - node_id: polyhydroxyalkanoate
    label: polyhydroxyalkanoate
    node_type: CHEMICAL
    description: Polyester carbon/energy storage polymer (chiefly PHB).
  - node_id: carbon_energy_storage
    label: carbon and energy storage
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of carbon/energy reserves under nutrient excess.
  - node_id: nutrient_limitation_high_cn
    label: nutrient limitation / high C:N ratio
    node_type: ENVIRONMENTAL_FACTOR
    description: High carbon-to-nitrogen ratio and depletion of N, S, or P with excess
      carbon.
  - node_id: pha_accumulation
    label: polyhydroxyalkanoate accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Intracellular accumulation of PHA/PHB polymer.
  - node_id: pha_synthase_phac
    label: PHA synthase (PhaC)
    node_type: GENE_OR_PROTEIN
    description: Polymerase that condenses (R)-3-hydroxyacyl-CoA into PHA/PHB polymer.
  - node_id: phasin_phap
    label: phasin (PhaP)
    node_type: GENE_OR_PROTEIN
    description: Granule-associated protein coating and stabilizing PHB chains at
      the granule surface.
  - node_id: phb_granule_size_number
    label: PHB granule size and number
    node_type: QUALITY
    description: Morphological quality of granule dimensions and count per cell.
  - node_id: phar_regulator
    label: PhaR regulator
    node_type: GENE_OR_PROTEIN
    description: Transcriptional repressor that binds phaP promoters.
  - node_id: phap_gene
    label: phaP gene
    node_type: GENE_OR_PROTEIN
    description: Gene encoding phasin.
  - node_id: pha_depolymerase_phaz
    label: PHA depolymerase (PhaZ)
    node_type: GENE_OR_PROTEIN
    description: Intracellular depolymerase cleaving PHB to 3-hydroxybutyrate.
  - node_id: phb_mobilization
    label: PHB mobilization
    node_type: BIOLOGICAL_PROCESS
    description: Degradation and utilization of stored PHB as carbon/energy reserve.
  - node_id: carbon_starvation
    label: carbon starvation
    node_type: ENVIRONMENTAL_FACTOR
    description: Starvation or exogenous carbon depletion.
  - node_id: phb_degradation
    label: PHB degradation
    node_type: BIOLOGICAL_PROCESS
    description: Breakdown of stored PHB polymer.
  edges:
  - subject: polyhydroxyalkanoate
    predicate: located in
