  source: DOI:10.1128/mr.54.4.450-472.1990
- synonym_text: polyhydroxybutyrate inclusion
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mr.54.4.450-472.1990
- synonym_text: PHA granule
  synonym_type: EXACT_SYNONYM
