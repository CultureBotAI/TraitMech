    description: PHA polymer accumulates inside cytoplasmic granules.
    evidence:
    - reference: DOI:10.1128/mr.54.4.450-472.1990
      notes: Anderson & Dawes describe PHAs (chiefly PHB) as carbon/energy reserves
        stored as cytoplasmic granules.
    predicate_id: biolink:located_in
  - subject: pha_granule_trait
    predicate: enables
    object: carbon_energy_storage
    description: PHA granules realize the carbon/energy storage function.
    evidence:
    - reference: DOI:10.1038/s41579-020-0413-0
