identifier: METPO:1000704
label: flagellated
definition: A motile in which an organism possesses flagella for locomotion.
definition_source: DOI:10.3390/biom9070279
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000702
synonyms:
- synonym_text: flagella
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.3390/biom9070279
  snippet: bacterial flagellum is a helical filamentous organelle responsible for
    motility
  notes: Supports flagella as locomotory structures.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: "peritrichous flagella"
  reference: PMID:28117390
- taxon_id: NCBITaxon:28901
  taxon_label: Salmonella enterica
  note: "flagellated enteric"
  reference: PMID:26267246
causal_graphs:
- graph_id: flagellated_flagellar_motor
  title: Flagellated locomotion mechanism
  description: Evidence-backed causal sketch linking the flagellated phenotype to
    flagellar filament, hook, basal body, stator, ion motive force, and chemotaxis.
  nodes:
  - node_id: flagellated_trait
    label: flagellated
    node_type: TRAIT
    grounding: METPO:1000704
    description: Possession of flagella for locomotion.
  - node_id: flagellar_filament
    label: flagellar filament
    node_type: CELLULAR_LOCALIZATION
    description: Helical filament that acts as a propeller or molecular screw.
    grounding: GO:0009420
  - node_id: flagellar_hook
    label: flagellar hook
    node_type: CELLULAR_LOCALIZATION
    description: Universal-joint-like connector between motor and filament.
    grounding: GO:0009424
  - node_id: flagellar_basal_body
    label: flagellar basal body
    node_type: GENE_OR_PROTEIN
    description: Rotary motor complex embedded in the cell envelope.
  - node_id: stator_complex
    label: flagellar stator complex
    node_type: GENE_OR_PROTEIN
    description: Force-generating motor units coupled to ion flow.
  - node_id: ion_motive_force
    label: ion motive force
    node_type: BIOLOGICAL_PROCESS
    description: Proton or sodium motive force powering motor rotation.
  - node_id: chemotaxis_signaling
    label: chemotaxis signaling
    node_type: BIOLOGICAL_PROCESS
    description: Regulation of flagellar rotation and movement direction.
    grounding: GO:0006935
  - node_id: ft3ss_export_system
    label: flagellar type III secretion system
    node_type: GENE_OR_PROTEIN
    description: fT3SS at the flagellar base that exports structural subunits to the
      assembly site.
  - node_id: flagellar_structural_subunits
    label: flagellar structural subunits
    node_type: GENE_OR_PROTEIN
    description: Axial protein subunits exported through the central channel for distal
      assembly.
  - node_id: flii_atpase_complex
    label: FliH-FliI-FliJ ATPase complex
    node_type: GENE_OR_PROTEIN
    description: Cytoplasmic ATPase ring complex providing ATP hydrolysis to drive
      flagellar protein export.
  - node_id: fld_filament_cap
    label: FliD filament cap
    node_type: GENE_OR_PROTEIN
    description: Pentameric cap at the filament tip that aids flagellin polymerization.
  - node_id: hook_filament_junction
    label: FlgK/FlgL hook-filament junction
    node_type: GENE_OR_PROTEIN
    description: Adapter proteins connecting hook to filament and required for filament
      polymerization.
  - node_id: filament_polymerization
    label: flagellar filament polymerization
    node_type: BIOLOGICAL_PROCESS
    description: Polymerization of flagellin subunits into the helical filament.
  - node_id: proton_channel
    label: transmembrane H+ channel
    node_type: MOLECULAR_FUNCTION
    description: Proton conduction pathway through the MotA-MotB stator that drives
      torque generation.
  - node_id: chey_p
    label: CheY-P
    node_type: GENE_OR_PROTEIN
    description: Phosphorylated chemotaxis response regulator that binds the C ring
      to control rotation.
  - node_id: rotational_switching
    label: flagellar rotational switching
    node_type: BIOLOGICAL_PROCESS
    description: Switching of flagellar motor rotation between CCW and CW states.
  edges:
  - subject: flagellar_filament
    predicate: confers
    object: flagellated_trait
    description: A flagellar filament is the locomotory appendage of flagellated cells.
    evidence:
    - reference: DOI:10.3390/biom9070279
      snippet: helical filamentous organelle responsible for motility
      notes: Supports the filament as the locomotory flagellar structure.
    predicate_id: METPO:2007700
  - subject: flagellar_hook
    predicate: connects
    object: flagellar_filament
    description: The hook couples the motor to the filament.
    evidence:
    - reference: DOI:10.3390/biom9070279
      snippet: hook as a universal joint
      notes: Supports the hook's coupling role.
  - subject: flagellar_basal_body
    predicate: rotates
    object: flagellar_filament
    description: The basal body motor rotates the filament for propulsion.
    evidence:
    - reference: DOI:10.1016/S1937-6448(08)01402-0
      snippet: reversible rotary motor
      notes: Supports basal body motor rotation of flagella.
  - subject: ion_motive_force
    predicate: enables
    object: stator_complex
    description: Ion flux through stator complexes powers torque generation.
    evidence:
    - reference: DOI:10.3389/fmicb.2021.659464
      snippet: relationship between the IMF and the functioning
      notes: Supports ion motive force coupling to flagellar motor function.
    predicate_id: RO:0002327
  - subject: chemotaxis_signaling
    predicate: regulates
    object: flagellated_trait
    description: Chemotaxis signaling changes flagellar motor behavior and movement
      direction.
    evidence:
    - reference: DOI:10.3390/biom9070279
      snippet: regulate the direction of flagella-driven motility
      notes: Supports chemotaxis regulation of flagellated motility.
    predicate_id: RO:0002211
  - subject: ft3ss_export_system
    predicate: exports
    object: flagellar_structural_subunits
    description: The fT3SS exports flagellar structural subunits to the distal assembly
      site.
    evidence:
    - reference: DOI:10.1128/ecosalplus.esp-0011-2023
      notes: '"a flagellar type III secretion system (fT3SS) at the base exports structural
        subunits from the cytoplasm through a narrow central channel to the distal
        tip where assembly occurs"'
    predicate_id: METPO:2007804
  - subject: flii_atpase_complex
    predicate: enables
    object: ft3ss_export_system
    description: The FliH-FliI-FliJ ATPase complex powers flagellar protein export
      by the fT3SS.
    evidence:
    - reference: DOI:10.1128/ecosalplus.esp-0011-2023
      notes: '"the ATPase ring complex (FliI, with FliH and FliJ) provides ATP hydrolysis
        for export"'
    predicate_id: RO:0002327
  - subject: fld_filament_cap
    predicate: enables
    object: filament_polymerization
    description: The FliD filament cap aids polymerization of flagellin into the filament.
    evidence:
    - reference: DOI:10.3390/biom14121488
      notes: '"flagellin subunits (~30,000) polymerize into a filament aided by a
        five-subunit FliD cap"'
    predicate_id: RO:0002327
  - subject: hook_filament_junction
    predicate: enables
    object: filament_polymerization
    description: FlgK/FlgL hook-filament junction proteins are required for filament
      polymerization.
    evidence:
    - reference: DOI:10.3390/biom14121488
      notes: '"absence of FlgK/FlgL/FliD prevents filament polymerization"'
    predicate_id: RO:0002327
  - subject: filament_polymerization
    predicate: results in formation of
    object: flagellar_filament
    description: Polymerization of flagellin subunits forms the flagellar filament.
    evidence:
    - reference: DOI:10.3390/biom14121488
      notes: '"flagellin subunits (~30,000) polymerize into a filament" forming the
        helical filament.'
  - subject: stator_complex
    predicate: has function
    object: proton_channel
    description: The MotA-MotB stator complex acts as a transmembrane H+ channel powering
      rotation.
    evidence:
    - reference: DOI:10.3390/biom14121488
      notes: '"stator units formed by MotA and MotB ... act as a transmembrane H+
        channel"'
    predicate_id: RO:0000085
  - subject: chey_p
    predicate: regulates
    object: rotational_switching
    description: CheY-P binding to the C ring causes flagellar rotational switching
      (CCW/CW).
    evidence:
    - reference: DOI:10.1038/s41564-024-01630-z
      notes: '"Directional switching is triggered by the chemotaxis regulator CheY-P
        binding to FliM, causing full reversal of rotation"'
    predicate_id: RO:0002211
  - subject: rotational_switching
    predicate: regulates
    object: flagellated_trait
    description: Switching of motor rotation direction modulates flagellated motility
      behavior.
    evidence:
    - reference: DOI:10.1128/ecosalplus.esp-0011-2023
      notes: '"the C ring switches its conformational state" changing the direction
        of flagella-driven motility.'
    predicate_id: RO:0002211
