evidence:
- reference: DOI:10.1146/annurev-cellbio-010521-010834
  snippet: bacterial rod shape formation
  notes: Supports bacillus shape as a rod-like bacterial morphogenesis phenotype.
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: The namesake bacillus (straight rod); model Gram-positive rod-shaped bacterium.
