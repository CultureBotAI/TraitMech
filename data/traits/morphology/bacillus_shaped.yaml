    evidence:
    - reference: DOI:10.1038/s41467-023-41082-3
      notes: Moenomycin inhibits a family of PG synthases known as Class-A penicillin-binding
        proteins.
    predicate_id: RO:0002212
  - subject: rodZ
    predicate: causally upstream of, negative effect
    object: spherical_morphology
    description: Loss of RodZ causes cells to become spherical, indicating RodZ maintains
