    evidence:
    - reference: DOI:10.1038/s41467-024-49785-x
      notes: Inserts long glycan strands acting as barrel-hoop-like reinforcing structures,
        thereby giving rise to a rod-shaped cell.
  - subject: moenomycin
    predicate: inhibits
    object: class_a_pbps
    description: Moenomycin inhibits class A penicillin-binding proteins, a family
