- timestamp: '2026-08-06T01:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 1 causal edge(s) off microbe-domain METPO predicates (1 to has output),
    issue 301. The previous predicates are transitively rdfs:subPropertyOf METPO:2000001,
    whose rdfs:domain is METPO:1000525 (microbe), so a causal-graph subject entailed that
    the subject IS a microbe; CausalNodeTypeEnum has no organism member, so no such edge could
    ever satisfy the domain. Edge directions are unchanged - this pass only relabels and re-grounds.
    RO:0002234 (has output) is used where the subject is an activity, since biolink gives
    it the domain 'biological process or activity'; the METPO replacements are proposed in
    proposals/metpo_traitmech_v8 and v9 and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-06T08:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: 'Re-grounded causal edge(s) off enables/RO:0002327 onto part of (biolink:part_of),
    issue 334. biolink declares enables range ''biological process or activity'', which only
    BIOLOGICAL_PROCESS, PATHWAY and MOLECULAR_FUNCTION satisfy, so an edge pointing at a GENE_OR_PROTEIN
    entailed a false type. The replacements are chosen per idiom rather than swept: a gene
    cluster ENCODES its product, a subunit is PART OF the complex it belongs to, and an energy
    source or acquired repertoire CONTRIBUTES TO the machine it powers or composes. All three
    declare no rdfs:domain or rdfs:range, so none can reintroduce the class of defect being
    removed.'
  llm_assisted: true
