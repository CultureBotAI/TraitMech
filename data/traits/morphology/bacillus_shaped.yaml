    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: PG protects bacteria against osmotic lysis and determines cell shape.
  - subject: rodA_pbp2_synthase
    predicate: required for
    object: bacterial_elongation
    description: RodA-PBP2 is the essential synthase responsible for bacterial elongation.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: RodA-PBP2 is an essential synthase responsible for bacterial elongation.
  - subject: circumferential_glycan_insertion
    predicate: gives rise to
    object: bacillus_shaped_trait
    description: Elongasome inserts long glycan strands as barrel-hoop reinforcement,
