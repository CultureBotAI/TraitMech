    evidence:
    - reference: DOI:10.1038/nrmicro1205
      snippet: FtsZ collaborates with penicillin binding proteins
      notes: Supports FtsZ-PBP collaboration in bacterial cell-shape generation.
  - subject: peptidoglycan_cell_wall
    predicate: determines
    object: bacillus_shaped_trait
    description: The peptidoglycan cell wall protects against osmotic lysis and determines
