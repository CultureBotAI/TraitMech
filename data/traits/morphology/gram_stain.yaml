identifier: METPO:1000697
label: gram stain
definition: A phenotype where microorganisms are grouped based on their ability to
  retain crystal violet dye in the Gram staining procedure.
definition_source: DOI:10.3109/10520299609117151
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: Morphology.cell morphology.gram stain
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: gram_stain
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.3109/10520299609117151
  snippet: retention of a crystal violet:iodine complex
  notes: Supports Gram staining as differential retention of crystal violet-iodine
    complex.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  reference: PMID:9278503
  note: Escherichia coli exemplifies the Gram-negative outcome of the differential
    stain and its thin-peptidoglycan, outer-membrane envelope branch.
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  reference: PMID:9384377
  note: Bacillus subtilis exemplifies the Gram-positive outcome and thick-peptidoglycan
    envelope branch of this broad stain class.
causal_graphs:
- graph_id: gram_stain_cell_envelope_retention
  title: Gram stain cell-envelope retention mechanism
  description: Evidence-backed causal sketch linking Gram stain phenotype to crystal
    violet-iodine complex formation, peptidoglycan architecture, outer membrane loss
    during decolorization, and counterstaining.
  scope_status: NONMECHANISTIC
  scope_notes: This record describes a differential staining assay and envelope-level
    classification, for which one inherited protein example would be misleading.
  nodes:
  - node_id: gram_stain_trait
    label: gram stain
    node_type: TRAIT
    grounding: METPO:1000697
    description: Differential staining phenotype based on retention of crystal violet
      dye.
  - node_id: crystal_violet
    label: crystal violet
    node_type: CHEMICAL
    description: Primary dye used in the Gram staining procedure.
    grounding: CHEBI:41688
  - node_id: iodine_mordant
    label: iodine mordant
    node_type: CHEMICAL
    description: Iodine solution that forms a dye-iodine complex with crystal violet.
  - node_id: crystal_violet_iodine_complex
    label: crystal violet-iodine complex
    node_type: CHEMICAL
    description: Dye complex retained or removed during Gram staining.
  - node_id: peptidoglycan_cell_wall
    label: peptidoglycan cell wall
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0009274
    description: Cell-wall polymer layer influencing stain retention.
  - node_id: outer_membrane
    label: outer membrane
    node_type: CELLULAR_LOCALIZATION
    description: Gram-negative cell-envelope membrane disrupted during decolorization.
    grounding: GO:0019867
  - node_id: alcohol_decolorization
    label: alcohol decolorization
    node_type: EXPERIMENTAL_FACTOR
    description: Decolorization step that differentiates Gram-positive and Gram-negative
      staining.
  - node_id: crystal_violet_iodine_retention
    label: crystal violet-iodine retention
    node_type: QUALITY
    description: Retention of the crystal violet-iodine complex after Gram decolorization.
  edges:
  - subject: crystal_violet
    predicate: contributes to
    object: crystal_violet_iodine_complex
    description: Crystal violet contributes the dye cation to the insoluble crystal
      violet-iodide precipitate formed during the Gram stain.
    evidence:
    - reference: DOI:10.1128/jb.156.2.837-845.1983
      snippet: interacts with aqueous KI-I2 during the Gram stain via a simple metathetical
        anion exchange
      notes: Verified against the open Davies et al. abstract; crystal violet reacts
        with the iodide mordant during Gram staining to form the insoluble dye-iodide
        precipitate.
    predicate_id: RO:0002326
  - subject: peptidoglycan_cell_wall
    predicate: contributes to
    object: crystal_violet_iodine_retention
    description: Peptidoglycan wall architecture determines whether the dye complex
      remains after decolorization.
    evidence:
    - reference: DOI:10.3109/10520299609117151
      snippet: responsible for retention of a crystal violet:iodine complex
      notes: Verified against the public Popescu and Doyle abstract; the Gram-positive
        cell wall is the structural determinant for retaining the dye-iodine complex.
    predicate_id: RO:0002326
  - subject: alcohol_decolorization
    predicate: contributes to
    object: gram_stain_trait
    description: Decolorization contributes to the differential Gram reaction by damaging
      Gram-negative cell surfaces and causing dye-complex loss.
    evidence:
    - reference: DOI:10.3109/10520299609117151
      snippet: staining procedures damage the cell surface resulting in loss of dye
        complexes
      notes: Verified against the public Popescu and Doyle abstract; decolorization
        is retained as an assay step contributing to the broad Gram stain phenotype
        rather than asserted as complete outer-membrane removal.
    predicate_id: RO:0002326
  - subject: outer_membrane
    predicate: regulates
    object: gram_stain_trait
    description: The Gram-negative outer membrane contributes to dye loss and counterstain
      appearance.
    evidence:
    - reference: DOI:10.1038/s41579-019-0201-x
      snippet: defining feature of the Gram-negative cell envelope
      notes: Supports the outer membrane as a defining Gram-negative envelope feature.
    predicate_id: RO:0002211
  - subject: peptidoglycan_cell_wall
    predicate: causes
    object: gram_stain_trait
    description: Peptidoglycan wall structure is the major structural determinant
      of differential Gram-stain retention.
    evidence:
    - reference: DOI:10.3109/10520299609117151
      snippet: Gram-stainability is a function of the cell wall
      notes: Verified against the public Popescu and Doyle abstract; the review ties
        the Gram reaction to the cell wall rather than chemistry of intracellular
        constituents.
    predicate_id: biolink:causes
  - subject: iodine_mordant
    predicate: contributes to
    object: crystal_violet_iodine_complex
    description: The iodide mordant supplies the bulky anion that reacts with crystal
      violet to form the dye-iodide precipitate.
    evidence:
    - reference: DOI:10.1128/jb.156.2.837-845.1983
      snippet: apparent 1:1 stoichiometry between anion (I-) and cation
      notes: Verified against the open Davies et al. abstract; the iodide anion and
        crystal-violet cation react stoichiometrically in the Gram stain.
    predicate_id: RO:0002326
  - subject: crystal_violet_iodine_complex
    predicate: contributes to
    object: crystal_violet_iodine_retention
    description: The insoluble crystal violet-iodine complex is the retained dye precipitate
      that initiates the Gram reaction.
    evidence:
    - reference: DOI:10.1128/jb.156.2.837-845.1983
      snippet: same precipitate which forms in the cellular substance of bacteria
      notes: Verified against the open Davies et al. abstract; the crystal violet-iodide
        precipitate forms inside both Gram-positive and Gram-negative bacteria before
        the differential decolorization step.
    predicate_id: RO:0002326
  - subject: crystal_violet_iodine_retention
    predicate: confers
    object: gram_stain_trait
    description: Differential retention of the dye-iodine complex is the proximal
      assay state for the Gram stain phenotype.
    evidence:
    - reference: DOI:10.3109/10520299609117151
      snippet: retention of a crystal violet:iodine complex
      notes: Verified against the public Popescu and Doyle abstract; the review frames
        Gram staining around retention of the crystal violet-iodine complex.
    predicate_id: METPO:2007700
