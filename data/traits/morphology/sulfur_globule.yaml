evidence:
- reference: DOI:10.1016/S0065-2911(08)00002-7
  notes: Frigaard & Dahl describe sulfur globules as sulfur-storage inclusions formed
    during oxidative sulfur metabolism in phototrophic sulfur bacteria.
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow include sulfur globules among bacterial intracellular
    storage inclusions/organelles.
