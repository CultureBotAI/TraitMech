identifier: traitmech:000069
label: sulfur globule
definition: An intracellular (or periplasmic) inclusion of elemental sulfur formed as
  an intermediate during the oxidation of reduced sulfur compounds, characteristic of
  many sulfur-oxidizing and phototrophic sulfur bacteria.
definition_source: DOI:10.1016/S0065-2911(08)00002-7
