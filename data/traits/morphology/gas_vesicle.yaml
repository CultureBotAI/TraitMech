  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro2834
evidence:
- reference: DOI:10.1038/nrmicro2834
  notes: Pfeifer describes gas vesicles as intracellular gas-filled proteinaceous
    flotation structures in bacteria and archaea.
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow include gas vesicles among bacterial intracellular organelles.
canonical_examples:
- taxon_id: NCBITaxon:1126
  taxon_label: Microcystis aeruginosa
  note: Gas-vacuolate bloom-forming cyanobacterium; Anabaena/Dolichospermum flos-aquae
    is the classic Walsby gas-vesicle research model.
  reference: PMID:15060038
- taxon_id: NCBITaxon:449447
  taxon_label: Microcystis aeruginosa NIES-843
  note: Strain-level GvpA exemplar.
  reference: PMID:15060038
