identifier: traitmech:000070
label: gas vesicle
definition: An intracellular gas-filled proteinaceous inclusion that provides buoyancy,
  allowing planktonic bacteria and archaea to position themselves in the water column.
definition_source: DOI:10.1038/nrmicro2834
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000066
synonyms:
- synonym_text: gas vacuole
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro2834
evidence:
- reference: DOI:10.1038/nrmicro2834
  notes: Pfeifer describes gas vesicles as intracellular gas-filled proteinaceous
    flotation structures in bacteria and archaea.
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow include gas vesicles among bacterial intracellular organelles.
causal_graphs:
- graph_id: gas_vesicle_buoyancy
  title: Gas vesicles provide buoyancy and water-column positioning
  description: Evidence-backed causal sketch linking proteinaceous gas-filled intracellular
    vesicles to buoyancy and vertical positioning in the water column.
  nodes:
  - node_id: gas_vesicle_trait
    label: gas vesicle
    node_type: TRAIT
    grounding: traitmech:000070
    description: Intracellular gas-filled proteinaceous flotation structure.
  - node_id: buoyancy
    label: cellular buoyancy
    node_type: QUALITY
    description: Reduced effective cell density permitting vertical positioning.
  - node_id: water_column_positioning
    label: water-column positioning
    node_type: BIOLOGICAL_PROCESS
    description: Vertical migration of planktonic microbes within the water column.
  - node_id: gvpa_protein
    label: GvpA
    node_type: GENE_OR_PROTEIN
    description: Small hydrophobic primary structural protein forming the gas vesicle
