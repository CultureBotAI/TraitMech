identifier: METPO:1000687
label: branched shaped
definition: A cell shape in which an organism forms lateral branches from filamentous
  or hyphal cells.
definition_source: DOI:10.1016/j.mib.2012.10.012
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
