      snippet: apical growth requires the localization of the machinery
      notes: Supports localized wall-building machinery as needed for apical branch
        outgrowth.
    predicate_id: RO:0002211
  - subject: lateral_branch_outgrowth
    predicate: manifests as
    object: branched_shaped_trait
    description: Lateral branch outgrowth manifests the branched-shape phenotype.
    evidence:
    - reference: DOI:10.1016/j.mib.2012.10.012
      snippet: initiation of new branches
      notes: Supports branched morphology as a Streptomyces growth phenotype.
    predicate_id: METPO:2007400
  - subject: polarisome_splitting
    predicate: causes
    object: lateral_branch_outgrowth
    description: Polarisome splitting at growing tips generates daughter polarisomes
      that coordinate new lateral branch emergence.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: Splitting of polarisomes at growing tips generates daughter polarisomes
        that coordinate emergence of new lateral branches upon reaching a critical
        size.
    predicate_id: biolink:causes
  - subject: divIVA_scy_filp_polarisome
    predicate: localizes
    object: pg_enzyme_localization
    description: The DivIVA/Scy/FilP polarisome localizes peptidoglycan synthases
      and hydrolases to the apex.
    evidence:
    - reference: DOI:10.1128/mbio.01492-24
      notes: The polarisome composed of DivIVA with Scy and FilP localizes cell-wall
        enzymes to one pole, linking polarity establishment to branching.
  - subject: afsk_divIVA_phosphorylation
    predicate: stimulates
    object: multiple_polarisomes_hyperbranching
    description: AfsK-mediated DivIVA phosphorylation disassembles the apical polarisome
      and stimulates multiple new polarisomes.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: Constitutive AfsK activity/high DivIVA phosphorylation disassembles the
        apical polarisome and stimulates multiple new polarisomes, producing a hyperbranching
        phenotype.
  - subject: sppa_divIVA_dephosphorylation
    predicate: opposes
    object: multiple_polarisomes_hyperbranching
    description: SppA dephosphorylation of DivIVA opposes AfsK-driven hyperbranching,
      defining a reversible branching-control circuit.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: AfsK phosphorylates DivIVA in response to bacitracin/vancomycin stress,
        while SppA dephosphorylates DivIVA, defining a reversible branching-control
        circuit.
  - subject: cell_wall_stress
    predicate: activates
    object: afsk_divIVA_phosphorylation
    description: Cell-wall stress activates AfsK-dependent DivIVA phosphorylation.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: AfsK phosphorylates DivIVA in response to cell-wall stress (e.g., bacitracin,
        vancomycin).
    predicate_id: RO:0002213
  - subject: stlp_membrane_microdomains
    predicate: contributes to
    object: proper_polar_growth_branch_spacing
    description: StlP membrane microdomain formation contributes to proper polar growth
      and normal branch spacing.
    evidence:
    - reference: DOI:10.1038/s41467-025-58093-x
      notes: Loss of StlP leads to branching of filaments; constitutive stlP expression
        notably reduces lateral branching and increases tip-to-branch distance.
    predicate_id: RO:0002326
