identifier: traitmech:000672
label: baeocyte formation
definition: A morphological phenotype in which a cyanobacterium forms small reproductive
  cells called baeocytes by multiple fission within a mother cell.
definition_source: DOI:10.1007/s10482-021-01672-x
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1007/s10482-021-01672-x
  snippet: Baeocytes formation through multiple fission of the mature cells, which
    are much larger than baeocytes.
  notes: 'Bonthond et al. (2021), Waterburya genus Description, directly read in publisher
    full text. Species Description and actual Figure 4 with its caption were inspected:
    panel c identifies formation inside a mother cell; panel b warns that adjacent
    growing cells are not products of binary fission. The images do not establish
    division timing or protein causality. Supplements were not inspected.'
- reference: PMID:18365724
  snippet: Electron microscopy of cyanobacteria Pleurocapsa sp. CALU 1126 revealed
    that multiple fission proceeds by successive binary fissions.
  notes: Pinevich et al. (2008), English scientific abstract directly retrieved at
    https://pubmed.ncbi.nlm.nih.gov/18365724/. Its following sentence identifies baeocytes
    as multiple-fission products and macrocytes as binary-fission products. This supports
    the reported division sequence in CALU 1126, not a universal simultaneous-cleavage
    requirement. Juvenile-cell differences and metabolic uncoupling are source-specific
    observations and interpretation, not the class definition. The Russian full paper,
    figures and strain provenance were not inspected; no CALU 1126 canonical example
    is assigned.
canonical_examples:
- taxon_id: NCBITaxon:2874699
  taxon_label: Waterburya agarophytonicola KI4
  reference: DOI:10.1007/s10482-021-01672-x
  note: KI4, a non-axenic culture from seaweed apical material collected at Falckensteiner
    Strand near Kiel, Germany. Collection Methods report 15-degree near-dark artificial-seawater
    incubation and host-free subculture; the species description reports low-light
    liquid BG11 at 20 PSU. These are distinct culture descriptions, not an asserted
    Figure 4 acquisition protocol. C-A-99685 is a lyophilized filter herbarium specimen,
    not a living-culture accession. https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=2874699
    confirms the strain-level current name with rank no rank, not a species-level
    ID or an independent phenotype assay.
discussions:
- discussion_id: baeocyte-formation-scope
  prompt: Review a closer parent and historical reproductive-cell terminology.
  kind: CURATION_TODO
  status: OPEN
  rationale: Use active phenotype METPO:1000059 below quality METPO:1000188. Binary
    fission METPO:1000033, reproductive process METPO:1000264 and reproductive structure
    METPO:1000265 are obsolete. Sporulation METPO:1000870 denotes dormant resistant
    endospores in the local record, not this reproductive-cell phenotype. Coenobium
    formation traitmech:000655 requires a clonal colony with an established cell complement;
    multiple fission alone is insufficient. Historical nanocyte and cyanobacterial
    endospore usages need source-specific review before synonym mapping. No exact
    synonyms, xrefs, SSSOM equivalents or organism-level disjointness are asserted.
  posed_by: codex
  posed_date: '2026-10-07'
- discussion_id: baeocyte-formation-mechanism
  prompt: Resolve developmental mechanisms without inferring them from sequence features.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Formation, release and subsequent growth are distinct stages. Do not
    impose an invariant cell count, diameter, release route, motility, dormancy, sheath
    state or lack of growth between divisions on the whole class. Gene predictions
    and static morphology do not establish a protein-resolved formation mechanism.
    A causal graph is deferred pending direct perturbation evidence and authority-verified
    protein examples; the mechanism is not claimed biologically absent.
  posed_by: codex
  posed_date: '2026-10-07'
