    label: beta-carotene
    node_type: CHEMICAL
    description: Canonical yellow/orange carotenoid pigment.
    grounding: CHEBI:17579
  - node_id: flexirubin_pigment
    label: flexirubin-type pigment
    node_type: CHEMICAL
    description: Aryl polyene yellow pigment class distinct from carotenoids.
  - node_id: ros_damage
    label: reactive oxygen species damage
    node_type: BIOLOGICAL_PROCESS
    description: Oxidative damage caused by reactive oxygen species.
  edges:
  - subject: crt_enzymes
    predicate: catalyzes
    object: carotenoid_biosynthesis
    description: Crt enzymes catalyze carotenoid biosynthetic reactions.
    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: crt genes ... reactions they catalyze
      notes: Supports Crt enzymes as catalysts in bacterial carotenoid pathways.
    predicate_id: biolink:catalyzes
  - subject: carotenoid_biosynthesis
    predicate: produces
    object: yellow_carotenoids
    description: Carotenoid biosynthesis produces yellow-pigment carotenoids in representative
      bacteria.
    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: yellow pigmentation in bacteria
      notes: Supports carotenoids as one source of yellow pigmentation.
    predicate_id: METPO:2000202
  - subject: yellow_carotenoids
    predicate: causes
    object: visible_yellow_color
    description: Yellow carotenoids cause visible yellow colony or cell color.
    evidence:
    - reference: DOI:10.1016/j.tim.2010.07.007
      snippet: Carotenoids are natural pigments
      notes: Supports carotenoids as visible pigments in bacteria.
    predicate_id: biolink:causes
  - subject: visible_yellow_color
    predicate: manifests as
    object: yellow_pigmented_trait
    description: Visible yellow color manifests the yellow-pigmented phenotype.
    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: yellow pigmentation in bacteria
      notes: Supports trait-level yellow pigmentation.
    predicate_id: METPO:2007400
  - subject: ipp_dmapp
    predicate: precursor of
    object: ggpp
    description: C5 precursors IPP/DMAPP are elongated to the C20 carotenoid precursor
      GGPP.
    evidence:
    - reference: DOI:10.1038/s41598-024-58700-9
      notes: Carotenoid synthesis begins from the C5 isoprenoid precursors IPP and
        DMAPP, which are converted via chain elongation to the C20 precursor GGPP.
  - subject: idsa_crte
    predicate: catalyzes
    object: ggpp
    description: IdsA/CrtE (GGPP synthase) catalyzes formation of GGPP from IPP and
      DMAPP.
    evidence:
    - reference: DOI:10.1038/s41598-024-58700-9
      notes: IdsA, the major geranylgeranyl diphosphate synthase converting IPP and
        DMAPP to GGPP; GGPPS annotated CrtE/IdsA.
    predicate_id: biolink:catalyzes
  - subject: ggpp
    predicate: precursor of
    object: lycopene
    description: Two GGPP molecules condense to form the C40 backbone lycopene.
    evidence:
    - reference: DOI:10.1038/s41598-024-58700-9
      notes: Two GGPP molecules condense to form the C40 backbone lycopene.
  - subject: crti
    predicate: enables
    object: lycopene_biosynthesis
    description: CrtI (phytoene desaturase) enables lycopene biosynthesis.
    evidence:
    - reference: DOI:10.3390/microorganisms12040803
      notes: Phytoene desaturase (CrtI) to produce lycopene.
    predicate_id: RO:0002327
  - subject: lycopene_biosynthesis
    predicate: produces
    object: lycopene
    description: Lycopene biosynthesis produces lycopene.
    evidence:
    - reference: DOI:10.3390/microorganisms12040803
      notes: Pathway proceeds through phytoene synthase (CrtB) and phytoene desaturase
        (CrtI) to produce lycopene.
    predicate_id: METPO:2000202
  - subject: crty
    predicate: catalyzes conversion to
    object: beta_carotene
    description: CrtY (lycopene beta-cyclase) cyclizes lycopene to beta-carotene.
    evidence:
    - reference: DOI:10.1038/s41598-024-58700-9
      notes: Lycopene is cyclized to beta-carotene by lycopene beta-cyclase (crtY).
  - subject: beta_carotene
    predicate: causes or contributes to
    object: yellow_pigmented_trait
    description: beta-carotene is a canonical yellow/orange carotenoid that contributes
      to the yellow phenotype.
    evidence:
    - reference: DOI:10.4014/jmb.2404.04018
      notes: beta-carotene serves as a colorant and is the classic yellow/orange carotenoid
        pigment.
  - subject: flexirubin_pigment
    predicate: contributes to
    object: yellow_pigmented_trait
    description: Flexirubin-type pigments produce yellow colony coloration, a carotenoid-independent
      yellow pigment route.
    evidence:
    - reference: DOI:10.1038/s41467-024-54112-5
      notes: Flexirubin-type pigment-producing bacterium is yellow (or orange) in
        color; flexirubin is a known yellow pigment.
    predicate_id: RO:0002326
  - subject: flexirubin_pigment
    predicate: protects against
    object: ros_damage
    description: Flexirubin protects against reactive oxygen species damage.
    evidence:
    - reference: DOI:10.1038/s41467-024-54112-5
      notes: Flexirubin is known as a yellow pigment that effectively protects against
        reactive oxygen species damage.
