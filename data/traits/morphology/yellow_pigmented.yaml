identifier: METPO:1003030
label: yellow pigmented
definition: A pigmentation phenotype in which microbial colonies or cells appear yellow
  due to production of yellow pigments such as carotenoids.
definition_source: DOI:10.1080/1040841X.2025.2526423
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003021
synonyms:
- synonym_text: Pigment_yellow
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1080/1040841X.2025.2526423
  snippet: red, pink, orange, and yellow pigmentation in bacteria
  notes: Supports yellow microbial pigmentation as a carotenoid-associated bacterial
    color phenotype.
causal_graphs:
- graph_id: yellow_pigmented_carotenoid_color
  title: Yellow pigmentation carotenoid mechanism
  description: Evidence-backed causal sketch linking yellow microbial pigmentation
    to crt-catalyzed carotenoid biosynthesis, yellow carotenoid accumulation, and
    visible yellow colony color.
  nodes:
  - node_id: yellow_pigmented_trait
    label: yellow pigmented
    node_type: TRAIT
