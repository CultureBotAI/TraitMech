    node_type: GENE_OR_PROTEIN
    description: Phytoene desaturase that produces lycopene in carotenoid biosynthesis.
  - node_id: lycopene_biosynthesis
    label: lycopene biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Pathway steps producing lycopene from phytoene.
    grounding: GO:1901177
  - node_id: crty
    label: CrtY (lycopene beta-cyclase)
    node_type: GENE_OR_PROTEIN
    description: Lycopene beta-cyclase converting lycopene to beta-carotene.
