  - node_id: ggpp
    label: geranylgeranyl diphosphate (GGPP)
    node_type: CHEMICAL
    description: C20 isoprenoid precursor of carotenoid backbones.
  - node_id: idsa_crte
    label: IdsA/CrtE (GGPP synthase)
    node_type: GENE_OR_PROTEIN
    description: Geranylgeranyl diphosphate synthase converting IPP and DMAPP to GGPP.
