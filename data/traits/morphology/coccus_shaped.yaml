identifier: METPO:1000668
label: coccus shaped
definition: A cell shape in which an organism has a spherical or nearly spherical
  morphology, with roughly equal dimensions in all directions.
definition_source: DOI:10.1038/nrmicro3088
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: coccus
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: coccus-shaped
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1038/nrmicro3088
  snippet: spherical cocci synthesize peptidoglycan only at the division septum
  notes: Supports coccus shape as a spherical morphology with septal wall growth rather
    than lateral elongation.
- reference: PMID:19747126
  snippet: Staphylococcus aureus is a facultative, Gram-positive coccus
  notes: 'Organism example: Staphylococcus aureus is described as coccus-shaped.'
causal_graphs:
- graph_id: coccus_shaped_septal_growth
  title: Coccus-shape septal growth mechanism
  description: Evidence-backed causal sketch linking spherical coccus morphology to
    septal peptidoglycan synthesis, FtsZ-directed division, and reduced reliance on
    lateral elongation systems.
  nodes:
  - node_id: coccus_shaped_trait
    label: coccus shaped
    node_type: TRAIT
    grounding: METPO:1000668
    description: Spherical or nearly spherical bacterial cell morphology.
  - node_id: septal_peptidoglycan_synthesis
    label: septal peptidoglycan synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Cell-wall synthesis localized to the division septum.
  - node_id: ftsZ_division_ring
    label: FtsZ division ring
    node_type: GENE_OR_PROTEIN
    description: Tubulin-like division scaffold that recruits septal synthesis machinery.
  - node_id: penicillin_binding_proteins
    label: penicillin-binding proteins
    node_type: GENE_OR_PROTEIN
    description: Cell-wall synthesis enzymes recruited to division sites.
  - node_id: lateral_elongation
    label: lateral cell-wall elongation
    node_type: BIOLOGICAL_PROCESS
    description: Sidewall growth mode common in rod-shaped bacteria.
  edges:
  - subject: ftsZ_division_ring
    predicate: recruits
    object: penicillin_binding_proteins
    description: FtsZ-associated division machinery recruits cell-wall enzymes for
      septal synthesis in cocci.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: one type of cell wall synthesis machinery
      notes: Review describes coccal growth as relying on division-septum wall synthesis
        machinery.
  - subject: penicillin_binding_proteins
    predicate: catalyzes
    object: septal_peptidoglycan_synthesis
    description: PBPs catalyze peptidoglycan assembly at the septum.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: catalysed by one type of cell wall synthesis machinery
      notes: Supports wall-synthesis enzymes as the proximal machinery for septal
        peptidoglycan synthesis in spherical cocci.
    predicate_id: biolink:catalyzes
  - subject: septal_peptidoglycan_synthesis
    predicate: regulates
    object: coccus_shaped_trait
    description: Septum-centered peptidoglycan synthesis supports spherical coccus
      morphology.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: synthesize peptidoglycan only at the division septum
      notes: Supports septal-only wall synthesis as a mechanism for spherical coccal
        growth.
    predicate_id: RO:0002211
  - subject: lateral_elongation
    predicate: reduced in
    object: coccus_shaped_trait
    description: Cocci lack the sustained lateral elongation mode that produces rod
      morphology.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: round, rod-shaped, curved and spiral cells
      notes: Review contrasts mechanisms for cocci with rod-shaped lateral growth;
        edge is retained as a broad mechanistic distinction rather than a universal
        gene-loss claim.
