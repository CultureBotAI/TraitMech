identifier: traitmech:000060
label: peritrichous
definition: A flagellar arrangement with flagella distributed over the entire cell
  surface rather than localized to the poles.
definition_source: DOI:10.1093/femsre/fuv034
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000056
evidence:
- reference: DOI:10.1093/femsre/fuv034
  notes: Schuhmacher et al. describe peritrichous (surface-distributed) flagellation
    as one of the conserved flagellation patterns.
- reference: DOI:10.3390/biom9070279
  notes: Flagellum review supports multiple surface flagellar filaments as locomotory
    organelles, as in peritrichously flagellated enterobacteria.
canonical_examples:
- taxon_id: NCBITaxon:28901
  taxon_label: Salmonella enterica
  note: Peritrichous flagellation (flagella over the whole cell surface); classic
    enteric motility/chemotaxis model.
  reference: PMID:33859630
causal_graphs:
- graph_id: peritrichous_surface_distributed_flagella
  title: Peritrichous flagellation — surface-distributed flagella
  description: Evidence-backed causal sketch linking surface-distributed bacterial
    flagella to the peritrichous arrangement.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: peritrichous_trait
    label: peritrichous
    node_type: TRAIT
    grounding: traitmech:000060
    description: Flagella distributed over the cell surface.
  - node_id: bacterial_flagellum
    label: bacterial-type flagellum
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0009288
    description: Helical proteinaceous locomotory organelle.
  - node_id: surface_placement
    label: surface-distributed placement
    node_type: QUALITY
    description: Flagella spaced over the cell surface rather than at the poles.
  - node_id: polar_placement
    label: polar flagellar arrangement
    node_type: QUALITY
    description: Flagella localized at one or both cell poles.
  - node_id: b_subtilis_flagellar_rod_assembly
    label: B. subtilis flagellar rod assembly
    node_type: BIOLOGICAL_PROCESS
    description: Polymerization of the B. subtilis flagellar rod through the peptidoglycan
      wall.
  - node_id: b_subtilis_basal_body_immobilization
    label: B. subtilis basal-body immobilization
    node_type: BIOLOGICAL_PROCESS
    description: Capture and immobilization of initially mobile nascent basal bodies
      during flagellar rod assembly in B. subtilis.
  - node_id: b_subtilis_peptidoglycan_pore_pattern
    label: B. subtilis peptidoglycan pore pattern
    node_type: QUALITY
    description: Grid-like distribution of permissive peptidoglycan pores interpreted
      during B. subtilis flagellar rod assembly.
  - node_id: flagellar_filament_number
    label: flagellar filament number
    node_type: QUALITY
    description: Number of flagellar filaments per cell, multiple in peritrichous
      cells.
  - node_id: swimming_velocity
    label: swimming velocity
    node_type: CAPACITY
    description: Cell swimming speed driven by flagellar rotation.
  edges:
  - subject: bacterial_flagellum
    predicate: defines
    object: peritrichous_trait
    description: Flagella distributed over the cell surface define the peritrichous
      arrangement.
    evidence:
    - reference: DOI:10.1093/femsre/fuv034
      notes: Schuhmacher et al. describe peritrichous flagellation as a conserved
        pattern.
    predicate_id: METPO:2007500
  - subject: peritrichous_trait
    predicate: associated with
    object: surface_placement
    description: The peritrichous pattern spaces multiple flagella across the cell
      surface.
    evidence:
    - reference: DOI:10.3390/biom9070279
      notes: Flagellum review supports multiple surface flagellar filaments as locomotory
        organelles.
    predicate_id: biolink:associated_with
  - subject: surface_placement
    predicate: associated with
    object: flagellar_filament_number
    description: Surface-distributed peritrichous flagellation is associated with
      multiple flagella per cell, although number varies by species and condition.
    evidence:
    - reference: DOI:10.1093/femsre/fuv034
      snippet: five to six flagellar filaments distributed over the cell body
      notes: Schuhmacher et al. describe E. coli and B. subtilis as representative
        peritrichous bacteria with multiple filaments, while warning that number varies.
    predicate_id: biolink:associated_with
  - subject: peritrichous_trait
    predicate: distinguished from
    object: polar_placement
    description: Peritrichous surface-distributed flagella are distinguished from
      polar flagellar arrangements.
    evidence:
    - reference: DOI:10.3390/fermentation10120606
      notes: Frolov et al. 2024 contrast Pseudomonas polar flagella located at one
        pole with peritrichous flagella located throughout the cell wall.
  - subject: b_subtilis_flagellar_rod_assembly
    predicate: causes
    object: b_subtilis_basal_body_immobilization
    description: In B. subtilis, flagellar rod assembly through peptidoglycan immobilizes
      initially mobile nascent basal bodies.
    evidence:
    - reference: DOI:10.1128/mbio.00530-25
      snippet: become immobilized when the flagellar rod transits the peptidoglycan
      notes: Dunn et al. directly observed elevated mobility early in basal-body assembly
        and in rod mutants, supporting rod-dependent immobilization in B. subtilis.
    predicate_id: biolink:causes
  - subject: b_subtilis_peptidoglycan_pore_pattern
    predicate: regulates
    object: b_subtilis_basal_body_immobilization
    description: The grid-like pattern of permissive peptidoglycan pores constrains
      where B. subtilis rod assembly can immobilize basal bodies.
    evidence:
    - reference: DOI:10.1128/mbio.00530-25
      snippet: interpreting a grid-like pattern of pores, pre-existent in the PG
      notes: Dunn et al. infer that rod polymerization interprets a pre-existing grid-like
        peptidoglycan pore pattern; this edge is therefore taxon-scoped and inferential.
    predicate_id: RO:0002211
  - subject: b_subtilis_basal_body_immobilization
    predicate: contributes to
    object: surface_placement
    description: Rod-dependent capture of basal bodies at distributed sites contributes
      to the peritrichous surface pattern in B. subtilis.
    evidence:
    - reference: DOI:10.1128/mbio.00530-25
      snippet: rod both immobilizes basal bodies and participates in pattern formation
      notes: Rod mutations increased random and polar basal-body placement, supporting
        a role for immobilization in the distributed B. subtilis pattern.
    predicate_id: RO:0002326
  - subject: flagellar_filament_number
    predicate: positively influences (saturating)
    object: swimming_velocity
    description: Swimming velocity rises with flagellar filament number up to a critical
      number then saturates.
    evidence:
    - reference: DOI:10.1038/s41467-025-56980-x
      notes: 'Lisevich et al. 2025: swimming velocity increases with flagellar-gene
        expression only up to ~5 flagella, above which it saturates; functional phenotype
        of multiple peritrichous flagella.'
