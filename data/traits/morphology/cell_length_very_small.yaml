  - node_id: carbon_limitation
    label: carbon limitation
    node_type: ENVIRONMENTAL_FACTOR
    description: Low carbon availability, an ecological driver associated with streamlining.
  - node_id: nitrogen_limitation
    label: nitrogen limitation
    node_type: ENVIRONMENTAL_FACTOR
    description: Low nitrogen availability, an ecological driver associated with streamlining.
  - node_id: reduced_transcriptional_regulation
    label: reduced transcriptional regulation
    node_type: BIOLOGICAL_PROCESS
    description: Reduction of transcriptional regulatory machinery in oligotrophic
      microorganisms.
  - node_id: nutrient_poor_environment
    label: nutrient-poor environment
    node_type: ENVIRONMENTAL_FACTOR
    description: Environment with low nutrient availability favoring low-regulation,
      streamlined strategies.
  edges:
  - subject: oligotrophic_environment
    predicate: regulates
    object: streamlining_selection
    description: Persistent oligotrophy selects for streamlined cells and genomes.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: small cells and genomes
      notes: Supports oligotrophic regimes as drivers of cell miniaturization.
    predicate_id: RO:0002211
  - subject: streamlining_selection
    predicate: confers
    object: cell_length_very_small_trait
    description: Streamlining selection produces very small cell length values.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: small cells
      notes: Supports very small length as an outcome of streamlining selection.
    predicate_id: METPO:2007700
  - subject: cell_length_very_small_trait
    predicate: is a
    object: cell_length_trait
    description: Very small cell length is a quantitative bin of the cell-length phenotype.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.07.022
      snippet: cell size is tightly controlled
      notes: Supports very small cell length as a value within the regulated cell-length
        distribution.
    predicate_id: rdfs:subClassOf
  - subject: oligotrophic_environment
    predicate: selects for
    object: genome_streamlining
    description: Oligotrophic environments select for genome streamlining.
    evidence:
    - reference: DOI:10.1128/mSphereDirect.00011-19
      notes: Genome streamlining is characterized by small cells (~1 um), small genomes
        (~1-2 Mbp), and is strongly associated with carbon and nitrogen limitation.
    predicate_id: METPO:2007401
  - subject: carbon_limitation
    predicate: associated with
    object: genome_streamlining
    description: Carbon limitation is associated with genome streamlining.
    evidence:
    - reference: DOI:10.1128/mSphereDirect.00011-19
      notes: Streamlining is strongly associated with carbon and nitrogen limitation.
    predicate_id: biolink:associated_with
  - subject: nitrogen_limitation
    predicate: associated with
    object: genome_streamlining
    description: Nitrogen limitation is associated with genome streamlining.
    evidence:
    - reference: DOI:10.1128/mSphereDirect.00011-19
      notes: Streamlining is strongly associated with carbon and nitrogen limitation.
    predicate_id: biolink:associated_with
  - subject: genome_streamlining
    predicate: contributes to
    object: cell_length_very_small_trait
    description: Genome streamlining contributes to very small cell size.
    evidence:
    - reference: DOI:10.1038/s41467-024-48591-9
      notes: Prominent oligotrophic taxa (SAR11, Prochlorococcus) have streamlined
        genomes (~1.5 Mb) and extremely small cell volumes (~0.1 um3).
    predicate_id: RO:0002326
  - subject: reduced_transcriptional_regulation
    predicate: enhances fitness in
    object: nutrient_poor_environment
    description: Reduced transcriptional regulation enhances fitness in nutrient-poor
      environments, a companion of streamlining.
    evidence:
    - reference: DOI:10.1128/MMBR.00124-22
      notes: A reduction of transcriptional regulation in aquatic oligotrophic microorganisms
        enhances fitness in nutrient-poor environments.
