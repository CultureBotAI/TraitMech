identifier: METPO:1000883
label: cell length very small
definition: A cell-length phenotype in which the longer cell dimension is at most
  approximately 1.3 micrometers.
definition_source: DOI:10.1038/ismej.2014.60
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000881
synonyms:
- synonym_text: L_<=1.3
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/ismej.2014.60
  snippet: small cells and genomes
  notes: Streamlining review links very small cell sizes to oligotrophic lifestyle
    and reduced cellular material requirements.
canonical_examples:
- taxon_id: NCBITaxon:2585141
  taxon_label: Flavicella sediminum
  reference: DOI:10.1099/ijsem.0.003839
  note: Flavicella sediminum ALS 84T cells measured 1.0-1.2 micrometres long in the
    primary species description, wholly inside the at-most-1.3-micrometre bin.
causal_graphs:
- graph_id: cell_length_very_small_streamlining
  scope_status: NONMECHANISTIC
  scope_notes: This record is a numerical cell-length bin. Its streamlined-cell graph
    is contextual background, not a universal protein-mediated mechanism for the measured
    size class.
  title: Very-small cell-length streamlining
  description: DOI-backed graph linking strong nutrient limitation and streamlining
    selection to very-small cell length (≤1.3 μm).
  nodes:
  - node_id: cell_length_very_small_trait
    label: cell length very small
    node_type: TRAIT
    grounding: METPO:1000883
    description: Cell length at most ~1.3 μm.
  - node_id: cell_length_trait
    label: cell length
    node_type: TRAIT
    grounding: METPO:1000881
    description: Longer cellular dimension under shared size regulation.
  - node_id: streamlining_selection
    label: streamlining selection
    node_type: BIOLOGICAL_PROCESS
    description: Selection for reduced cellular and genomic material under chronic
      nutrient limitation.
  - node_id: oligotrophic_environment
    label: oligotrophic environment
    node_type: ENVIRONMENTAL_FACTOR
    description: Persistent low-nutrient setting that favors miniaturized cells.
  - node_id: genome_streamlining
    label: genome streamlining
    node_type: BIOLOGICAL_PROCESS
    description: Adaptive reduction of genome size and cellular material, characterized
