      notes: Bactofilins and M23 peptidases form a conserved functional module that
        promotes local changes in the mode of cell wall biosynthesis.
  - subject: local_pg_remodeling
    predicate: regulates
    object: cell_shape_determination
    description: Local peptidoglycan remodeling drives cell shape determination.
    evidence:
    - reference: DOI:10.7554/eLife.86577.2
      notes: Thereby driving cell shape determination in morphologically complex bacteria.
  - subject: elongasome_restriction
    predicate: regulates
    object: zonal_pg_biosynthesis
    description: Restriction of elongasome movement confines peptidoglycan biosynthesis
