  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: polar growth
  notes: Cell-shape review supports multi-pole peptidoglycan growth as the basis for
    prosthecate or appendaged geometries.
- reference: DOI:10.1146/annurev.micro.061705.103240
  snippet: prosthecate bacteria
  notes: Prosthecate-bacteria review supports star-shaped morphology in Stella/Ancalomicrobium
    and related stalked lineages.
