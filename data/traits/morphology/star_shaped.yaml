    evidence:
    - reference: DOI:10.1016/j.tim.2017.09.012
      notes: In C. crescentus bactofilins localize the bifunctional PBP PbpC to the
        prosthecate pole; conserved prostheca mechanism.
  - subject: pbpc_prosthecate_pole
    predicate: promotes
    object: prostheca_outgrowth
    description: PbpC localization at the prosthecate pole promotes prostheca synthesis.
    evidence:
    - reference: DOI:10.1016/j.tim.2017.09.012
      notes: Deletion of PbpC reduces prostheca synthesis, implicating its polar localization
        in prostheca outgrowth.
  - subject: spmx
    predicate: regulates
    object: prostheca_outgrowth
    description: SpmX is co-opted as a morphogen to position prosthecae via zonal
