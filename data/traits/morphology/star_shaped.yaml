identifier: METPO:1000685
label: star shaped
definition: A cell shape in which an organism has multiple radiating projections from
  a central body.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
