    evidence:
    - reference: DOI:10.1038/s41579-020-0366-3
      notes: RodZ interacts with MreB, RodA, PBP2 and PBP1A/1B, providing a scaffold
        for the elongasome.
  - subject: mrec
    predicate: activates
    object: pbp2
    description: MreC induces a structural change in PBP2 promoting its TPase activity.
    evidence:
    - reference: DOI:10.1038/s41579-020-0366-3
      notes: MreC induces a structural change in PBP2, promoting PBP2 TPase and RodA
        GTase activity.
    predicate_id: RO:0002213
  - subject: roda
    predicate: required for
    object: lateral_pg_synthesis
    description: SEDS protein RodA with cognate bPBP mediates lateral PG incorporation.
    evidence:
    - reference: DOI:10.1016/j.mib.2021.01.011
      notes: SEDS proteins RodA/FtsW with cognate bPBPs mediate lateral versus septal
        PG incorporation.
  - subject: ftsw
    predicate: required for
    object: septal_pg_incorporation
    description: FtsW with cognate bPBP mediates septal PG incorporation.
    evidence:
    - reference: DOI:10.1016/j.mib.2021.01.011
      notes: FtsW with cognate bPBP mediates septal PG incorporation.
