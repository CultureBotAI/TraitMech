    label: MreB
    node_type: GENE_OR_PROTEIN
    description: Bacterial actin homolog that orients peptidoglycan synthesis to maintain
      cell shape.
  - node_id: lateral_pg_synthesis
    label: lateral peptidoglycan synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Sidewall PG incorporation that sustains elongated cell geometry.
  - node_id: rodz
    label: RodZ
    node_type: GENE_OR_PROTEIN
    description: MreB-associated shape protein modulating MreB localization and elongasome
      assembly.
    grounding: InterPro:IPR023690
  - node_id: mreb_localization
    label: MreB polymer localization/assembly
    node_type: BIOLOGICAL_PROCESS
    description: Geometric localization and assembly of the MreB actin cytoskeleton.
  - node_id: elongasome
    label: elongasome complex
    node_type: CELLULAR_LOCALIZATION
    description: Lateral wall-growth machinery containing MreB, RodA, PBP2, RodZ,
      MreC, MreD.
  - node_id: mrec
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: MreC
    node_type: GENE_OR_PROTEIN
    description: Elongasome component that activates PBP2 and RodA synthesis functions.
  - node_id: pbp2
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: PBP2
    node_type: GENE_OR_PROTEIN
    description: Class B PBP in the elongasome coupled to RodA for rod-like wall growth.
  - node_id: roda
    label: RodA
    node_type: GENE_OR_PROTEIN
    description: SEDS glycosyltransferase mediating lateral PG incorporation with
      PBP2.
    grounding: InterPro:IPR001182
  - node_id: ftsw
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: FtsW
    node_type: GENE_OR_PROTEIN
    description: SEDS divisome polymerase for septal PG incorporation.
  - node_id: septal_pg_incorporation
    label: septal peptidoglycan incorporation
    node_type: BIOLOGICAL_PROCESS
    description: Division-site PG synthesis relevant to end-shaping and growth partitioning.
  edges:
  - subject: graded_polar_pg
    predicate: has output
    object: end_cap_taper
    description: Graded PG growth produces reduced end-cap radius.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: polar growth
      notes: Supports polar PG growth as the mechanism producing tapered ends.
    predicate_id: RO:0002234
  - subject: end_cap_taper
    predicate: causes
    object: tapered_geometry
    description: End-cap taper at both poles yields the fusiform body geometry.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: cell shape is genetically determined
      notes: Supports tapered geometry as a genetically determined shape outcome.
    predicate_id: biolink:causes
  - subject: tapered_geometry
    predicate: manifests as
    object: fusiform_shaped_trait
    description: Tapered geometry at both poles manifests the fusiform-shaped trait.
    evidence:
    - reference: DOI:10.1111/1462-2920.13731
      snippet: Fusobacterium nucleatum
      notes: Supports fusiform morphology as the trait endpoint.
    predicate_id: METPO:2007400
  - subject: mreb
    predicate: guides
    object: lateral_pg_synthesis
    description: MreB filaments orient lateral PG synthesis to maintain rod-like cell
      shape.
    evidence:
    - reference: DOI:10.1038/s41579-020-0366-3
      notes: MreB orients peptidoglycan synthesis to generate or maintain a smooth
        cylindrical rod shape.
  - subject: rodz
    predicate: regulates
    object: mreb_localization
    description: RodZ modulates geometric localization and assembly of MreB.
    evidence:
    - reference: DOI:10.1186/s12964-025-02373-y
      notes: RodZ modulates geometric localization of MreB and is required for proper
        MreB cytoskeleton assembly.
    predicate_id: RO:0002211
  - subject: rodz
    predicate: scaffolds
    object: elongasome
    description: RodZ provides a scaffold for the elongasome via MreB, RodA, PBP2,
