identifier: METPO:1000690
label: fusiform shaped
definition: A cell shape that is wide in the middle and tapers at both ends.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: fusiform
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: cell shape is genetically determined
  notes: Cell-shape review supports tapered cell ends as a genetically determined
    geometry maintained by graded wall synthesis.
- reference: DOI:10.1111/1462-2920.13731
  snippet: Fusobacterium nucleatum
  notes: Fusobacterium-genome review supports fusiform morphology in the Fusobacterium
    genus.
canonical_examples:
- taxon_id: NCBITaxon:851
  taxon_label: Fusobacterium nucleatum
  note: Spindle/fusiform (tapered-end) rod; model oral anaerobe.
  reference: https://www.ncbi.nlm.nih.gov/books/NBK8438/
causal_graphs:
- graph_id: fusiform_shaped_tapered_polar_growth
  title: Fusiform-shape tapered polar growth
  description: DOI-backed graph linking graded polar peptidoglycan growth and reduced
    end-cap radius to fusiform tapered morphology.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: fusiform_shaped_trait
    label: fusiform shaped
    node_type: TRAIT
    grounding: METPO:1000690
    description: Cell wider at middle and tapering at both poles.
  - node_id: graded_polar_pg
    label: graded polar peptidoglycan growth
    node_type: BIOLOGICAL_PROCESS
    description: Polar PG growth with reduced incorporation toward the cell tips.
  - node_id: end_cap_taper
    label: end-cap taper
    node_type: BIOLOGICAL_PROCESS
    description: Reduction in radius near the cell poles producing pointed ends.
  - node_id: tapered_geometry
    label: tapered geometry
    node_type: BIOLOGICAL_PROCESS
    description: Cell-body geometry that narrows toward both poles.
  - node_id: mreb
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
