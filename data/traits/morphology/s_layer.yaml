identifier: traitmech:000064
label: S-layer
definition: A morphology trait in which the cell surface is coated by a crystalline,
  two-dimensional array of self-assembling proteinaceous (glyco)protein subunits (a
  surface layer), found in many bacteria and most archaea.
definition_source: DOI:10.1038/nrmicro3213
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
