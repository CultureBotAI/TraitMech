identifier: METPO:1003023
label: brown pigmented
definition: A pigmentation phenotype in which microbial colonies or cells appear brown
  due to accumulation of brown pigments such as pyomelanin or other melanins.
definition_source: DOI:10.1128/AEM.67.8.3463-3468.2001
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003021
synonyms:
- synonym_text: Pigment_brown
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1128/AEM.67.8.3463-3468.2001
  snippet: Brown pigments are produced when homogentisic acid accumulates
  notes: Supports brown microbial pigmentation as a homogentisic-acid/pyomelanin pathway
    phenotype.
canonical_examples:
- taxon_id: NCBITaxon:651
  taxon_label: Aeromonas media
  note: Species-level pyomelanin model paired to an HppD protein; disruption and heterologous-expression
    experiments in strain WS establish HppD-dependent pigment production.
  reference: DOI:10.1371/journal.pone.0120923
causal_graphs:
- graph_id: brown_pigmented_pyomelanin_pathway
  title: Brown pigmentation pyomelanin mechanism
  description: Evidence-backed causal sketch linking brown microbial pigmentation
    to tyrosine catabolism, homogentisic acid accumulation, oxidative polymerization
    into pyomelanin, and visible brown color.
  scope_status: MECHANISTIC
  scope_notes: The retained mechanism is the HppD-dependent homogentisate/pyomelanin
    branch demonstrated in Aeromonas media; HmgA is retained as the opposing degradative
    branch and is not represented by the HppD example.
  nodes:
  - node_id: brown_pigmented_trait
    label: brown pigmented
    node_type: TRAIT
    grounding: METPO:1003023
    description: Microbial pigmentation appearing brown.
  - node_id: tyrosine_catabolism
    label: tyrosine catabolism
    node_type: BIOLOGICAL_PROCESS
    description: Catabolic pathway generating homogentisic acid intermediates.
    grounding: GO:0006572
  - node_id: hppD
    label: 4-hydroxyphenylpyruvate dioxygenase
    node_type: GENE_OR_PROTEIN
    description: Enzyme that can form homogentisic acid from 4-hydroxyphenylpyruvate.
    grounding: GO:0003868
    protein_examples:
    - uniprot_id: UniProtKB:A0AAE7AGQ2
      protein_label: 4-hydroxyphenylpyruvate dioxygenase
      gene_symbol: hppD
      taxon_id: NCBITaxon:651
      taxon_label: Aeromonas media
      entry_status: UNREVIEWED
      proteome_id: UP000502657
      retrieved_on: '2026-08-25'
      entry_version: 8
      sequence_version: 1
      role: Aeromonas HppD converts 4-hydroxyphenylpyruvate to homogentisate in the
        pyomelanin-producing branch that generates brown pigmentation.
      evidence:
      - reference: DOI:10.1371/journal.pone.0120923
        snippet: disruption of any one of these genes impairs or blocks pigmentation
        notes: The A. media WS mutagenesis and HppD-expression experiments establish
          the protein-family role; UniProt supplies a current species-matched HppD
          entry from a reference proteome.
  - node_id: homogentisic_acid
    label: homogentisic acid
    node_type: CHEMICAL
    description: HGA precursor that oxidizes and polymerizes to pyomelanin.
    grounding: CHEBI:44747
  - node_id: pyomelanin
    label: pyomelanin
    node_type: CHEMICAL
    description: Brown-to-black phenolic polymer pigment.
  - node_id: visible_brown_color
    label: visible brown color
    node_type: MOLECULAR_FUNCTION
    description: Observed brown colony or medium color.
  - node_id: four_hydroxyphenylpyruvate
    label: 4-hydroxyphenylpyruvate
    node_type: CHEMICAL
    description: Tyrosine catabolism intermediate converted to homogentisic acid by
      HppD.
    grounding: CHEBI:36242
  - node_id: hmgA
    label: homogentisate 1,2-dioxygenase
    node_type: GENE_OR_PROTEIN
    description: Enzyme (HmgA) that degrades homogentisic acid to maleylacetoacetate,
      diverting flux away from pyomelanin.
    grounding: GO:0004411
  - node_id: maleylacetoacetate
    label: maleylacetoacetate
    node_type: CHEMICAL
    description: Product of homogentisic acid ring cleavage by HmgA in the tyrosine
      catabolism pathway.
  - node_id: benzoquinoneacetic_acid
    label: benzoquinoneacetic acid
    node_type: CHEMICAL
    description: Auto-oxidation product of homogentisic acid that self-polymerizes
      into pyomelanin.
    grounding: CHEBI:137246
  edges:
  - subject: tyrosine_catabolism
    predicate: has output
    object: homogentisic_acid
    description: Tyrosine catabolism can generate homogentisic acid.
    evidence:
    - reference: DOI:10.1128/AEM.67.8.3463-3468.2001
      snippet: homogentisic acid accumulates in the medium
      notes: Supports HGA accumulation as upstream of brown pigment formation.
    predicate_id: RO:0002234
  - subject: hppD
    predicate: catalyzes formation of
    object: homogentisic_acid
    description: HppD catalyzes formation of homogentisic acid in pyomelanin pathways.
    evidence:
    - reference: DOI:10.1371/journal.pone.0120923
      snippet: catalyzes the reaction from 4-hydroxyphenylpyruvate to HGA
      notes: Supports HppD-mediated HGA formation in bacterial pyomelanin production.
    predicate_id: biolink:catalyzes
  - subject: homogentisic_acid
    predicate: polymerizes to
    object: pyomelanin
    description: HGA oxidizes and polymerizes into pyomelanin.
    evidence:
    - reference: DOI:10.1128/AEM.67.8.3463-3468.2001
      snippet: spontaneously oxidize and polymerize
      notes: Supports HGA polymerization as the source of pyomelanin.
  - subject: pyomelanin
    predicate: causes
    object: visible_brown_color
    description: Pyomelanin causes visible brown pigmentation.
    evidence:
    - reference: DOI:10.1128/AEM.67.8.3463-3468.2001
      snippet: Brown pigments are produced
      notes: Supports brown color as the output of pyomelanin formation.
    predicate_id: biolink:causes
  - subject: visible_brown_color
    predicate: manifests as
    object: brown_pigmented_trait
    description: Visible brown color manifests the brown-pigmented phenotype.
    evidence:
    - reference: DOI:10.1016/j.biotechadv.2021.107773
      snippet: black/brown color to the cells
      notes: Supports brown microbial cell color as a melanin-related pigmentation
        phenotype.
    predicate_id: METPO:2007400
  - subject: tyrosine_catabolism
    predicate: has output
    object: four_hydroxyphenylpyruvate
    description: Tyrosine catabolism produces 4-hydroxyphenylpyruvate as an intermediate.
    evidence:
    - reference: DOI:10.1038/s41564-023-01517-5
      notes: Tyrosine aminotransferases convert L-tyrosine into 4-hydroxyphenylpyruvate;
        biochemically generalizable precursor step.
    predicate_id: RO:0002234
  - subject: four_hydroxyphenylpyruvate
    predicate: converted to
    object: homogentisic_acid
    description: HppD converts 4-hydroxyphenylpyruvate to homogentisic acid.
    evidence:
    - reference: DOI:10.1128/spectrum.00410-24
      notes: hppD codes for a protein responsible for conversion of 4-hydroxyphenylpyruvate
        to HGA.
  - subject: hmgA
    predicate: converts
    object: maleylacetoacetate
    description: HmgA converts homogentisic acid to maleylacetoacetate, the degradative
      branch.
    evidence:
    - reference: DOI:10.1128/spectrum.00410-24
      notes: Homogentisate 1,2-dioxygenase (hmgA) converts HGA to maleylacetoacetate;
        core negative branch away from pigment formation.
  - subject: homogentisic_acid
    predicate: auto-oxidizes to
    object: benzoquinoneacetic_acid
    description: Excreted homogentisic acid spontaneously auto-oxidizes to benzoquinoneacetic
      acid.
    evidence:
    - reference: DOI:10.1128/spectrum.00410-24
      notes: HGA is excreted and spontaneously auto-oxidizes to form benzoquinoneacetic
        acid.
  - subject: benzoquinoneacetic_acid
    predicate: polymerizes to
    object: pyomelanin
    description: Benzoquinoneacetic acid self-polymerizes to produce pyomelanin.
    evidence:
    - reference: DOI:10.1128/spectrum.00410-24
      notes: Auto-oxidation followed by self-polymerization to produce pyomelanin.
  - subject: homogentisic_acid
    predicate: converted to
    object: maleylacetoacetate
    description: HmgA converts homogentisic acid to maleylacetoacetate, diverting
      substrate away from pyomelanin formation.
    evidence:
    - reference: DOI:10.1128/spectrum.00410-24
      snippet: converts HGA to maleylacetoacetate
      notes: Verified against the open primary article; this joins the HmgA catabolic
        branch to its homogentisate substrate.
