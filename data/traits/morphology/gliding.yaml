    label: type IX secretion system
    node_type: GENE_OR_PROTEIN
    description: Secretion-associated machinery linked to Flavobacterium gliding.
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Electrochemical gradient powering some gliding motors.
    grounding: METPO:1007500
  - node_id: helical_track
    label: helical conveyor track
    node_type: CELLULAR_LOCALIZATION
    description: Filamentous/multirail track structure in the cell envelope along
