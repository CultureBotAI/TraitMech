        branch, not all bacterial gliding systems.
      evidence:
      - reference: DOI:10.1016/j.cub.2016.12.035
        snippet: Myxococcus glides without external motility appendages
        notes: The cited source supports the represented protein-to-trait branch;
          UniProt verifies this current strain-matched protein entry.
    label: gliding motility machinery
    node_type: GENE_OR_PROTEIN
    description: Molecular machinery that produces surface translocation without flagella.
  - node_id: surface_adhesins
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: surface adhesins
    node_type: GENE_OR_PROTEIN
    description: Cell-surface proteins moved or engaged during gliding.
  - node_id: type_ix_secretion_system
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
