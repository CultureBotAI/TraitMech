identifier: METPO:1000706
label: gliding
definition: A motile in which an organism moves smoothly along solid surfaces without
  flagella or pili.
definition_source: DOI:10.1146/annurev.micro.55.1.49
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.1146/annurev.micro.55.1.49
  snippet: move actively over surfaces
  notes: Supports gliding as active surface movement without flagella.
canonical_examples:
- taxon_id: NCBITaxon:34
  taxon_label: Myxococcus xanthus
  note: Primary model for bacterial gliding motility and multicellular development.
    Flavobacterium johnsoniae is a secondary model.
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC103748/
- taxon_id: NCBITaxon:246197
  taxon_label: Myxococcus xanthus DK1622
  note: Strain-level AglZ gliding exemplar.
  reference: DOI:10.1016/j.cub.2016.12.035
causal_graphs:
- graph_id: gliding_surface_motility
  title: Gliding surface motility mechanism
  description: Evidence-backed causal sketch linking gliding to solid surfaces, cell-envelope
    motors, surface adhesins, and type IX secretion/gliding systems.
  scope_status: MECHANISTIC
  scope_notes: The taxon-matched protein example anchors one experimentally supported
    causal branch; it is not presented as a universal mechanism for every taxon or
    every contextual branch in this graph.
  nodes:
  - node_id: gliding_trait
    label: gliding
    node_type: TRAIT
    grounding: METPO:1000706
    description: Smooth movement along solid surfaces without flagella or pili.
  - node_id: solid_surface
