    evidence:
    - reference: DOI:10.1038/s41579-021-00626-4
      snippet: type 9 secretion and gliding motility
      notes: Supports linkage between type IX secretion and gliding machinery.
    predicate_id: RO:0002326
  - subject: proton_motive_force
    predicate: powers
    object: gliding_motility_machinery
    description: Proton motive force can power gliding motility motors.
    evidence:
    - reference: DOI:10.1038/s41579-021-00626-4
      snippet: proton-driven motor that powers type 9 secretion and gliding motility
      notes: Supports proton-driven gliding machinery in reviewed systems.
    predicate_id: METPO:2007900
  - subject: helical_track
    predicate: guides
    object: surface_adhesins
    description: Adhesins are translocated along an envelope-associated filamentous
      track during gliding.
    evidence:
    - reference: DOI:10.1038/s42003-023-04472-3
      notes: Filamentous multirail structures in the cell envelope are associated
        with the gliding machinery and SprB adhesin translocation.
  - subject: surface_adhesins
    predicate: enables
    object: substratum_coupling
    description: Surface adhesins engage the substratum to generate traction.
    evidence:
    - reference: DOI:10.1126/sciadv.abq0619
      notes: Surface adhesin at bacterial focal adhesions immobilizes motility complexes
        against the substratum to generate traction.
    predicate_id: RO:0002327
  - subject: substratum_coupling
    predicate: causes
    object: cell_propulsion
    description: Traction at substratum-coupled adhesins drives forward movement of
      the cell body.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3001443
      notes: Proton-dependent motors power adhesin surface translocation that propels
        the cell during gliding.
    predicate_id: biolink:causes
  - subject: cell_propulsion
    predicate: realizes
    object: gliding_trait
    description: Propulsion of the cell body along a surface constitutes the gliding
      phenotype.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3001443
      notes: Adhesin surface translocation produces the smooth surface movement characteristic
        of gliding.
  - subject: gliding_gene_complement
    predicate: predicts
    object: gliding_trait
    description: Presence of the core gliding/secretion machinery gene set predicts
      gliding capacity from genomes.
    evidence:
    - reference: DOI:10.1021/acsomega.3c05155
      notes: T9GPred predicts gliding motility from an 11-protein mandatory component
        set across Bacteroidetes genomes.
