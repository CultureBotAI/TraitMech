  - node_id: cell_propulsion
    label: cell propulsion
    node_type: BIOLOGICAL_PROCESS
    description: Forward, often screw-like, translocation of the cell body resulting
      from gliding machinery activity.
  - node_id: gliding_gene_complement
    label: gliding machinery gene complement
    node_type: EXPERIMENTAL_FACTOR
    description: Presence of the core gliding/secretion machinery gene set in a genome,
      used to predict gliding capacity.
  edges:
  - subject: solid_surface
    predicate: enables context for
