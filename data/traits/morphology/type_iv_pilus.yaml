identifier: traitmech:000175
label: type IV pilus
definition: A morphology trait in which a cell produces extracellular type-IV-pilin
  filaments that dynamically extend from and retract toward the cell surface.
definition_source: DOI:10.1093/femsre/fuab053
trait_category: MORPHOLOGY
