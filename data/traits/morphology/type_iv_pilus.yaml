evidence:
- reference: DOI:10.1093/femsre/fuab053
  snippet: Bacteria and archaea rely on appendages called type IV pili (T4P)
  notes: Ellison et al. review type IV pili as prokaryotic appendages that participate
    in diverse surface-associated behaviors.
- reference: DOI:10.1093/femsre/fuab053
  snippet: T4P are broadly distributed fibers that dynamically extend and retract
  notes: The review supports the record definition's dynamic extension and retraction
    qualifier.
- reference: DOI:10.1042/BST20160221
  snippet: Type IV pili are hair-like bacterial surface appendages
  notes: Piepenbrink and Sundberg support type IV pili as bacterial cell-surface appendages
    built from pilin proteins.
