  - node_id: roda_pbp2_complex
    label: RodA-PBP2 complex
    node_type: GENE_OR_PROTEIN
    description: Elongasome SEDS-bPBP synthase pair (RodA with PBP2) driving lateral
      peptidoglycan synthesis.
  - node_id: pg_polymerization_crosslinking
    label: peptidoglycan polymerization and crosslinking
    node_type: BIOLOGICAL_PROCESS
    description: Glycan strand polymerization and peptide crosslinking during cell-wall
      elongation.
  - node_id: mrec_protein
    label: MreC
    node_type: GENE_OR_PROTEIN
    description: Membrane-associated Rod-complex protein that activates PBP2.
