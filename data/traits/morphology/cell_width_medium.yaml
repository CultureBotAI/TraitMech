identifier: METPO:1000889
label: cell width medium
definition: A cell-width phenotype in which the shorter cell dimension lies approximately
  between 0.65 and 0.9 micrometers.
definition_source: DOI:10.1146/annurev-cellbio-101011-155745
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000882
synonyms:
- synonym_text: W_0.65_0.9
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: MreB-directed peptidoglycan synthesis
  notes: Supports the MreB/Rod-complex set-point producing typical rod widths in the
    0.65–0.9 μm range.
causal_graphs:
- graph_id: cell_width_medium_typical_rod
  title: Medium cell-width typical rod
  description: DOI-backed graph linking MreB-directed lateral wall synthesis under
    standard growth conditions to typical rod radii (0.65–0.9 μm).
  nodes:
  - node_id: cell_width_medium_trait
    label: cell width medium
