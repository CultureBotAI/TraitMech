  - node_id: pbp2_protein
    label: PBP2
    node_type: GENE_OR_PROTEIN
    description: Bifunctional class B penicillin-binding protein (transpeptidase)
      of the elongasome.
    grounding: UniProtKB:A0A2D2D7X6
  - node_id: mred_protein
    label: MreD
    node_type: GENE_OR_PROTEIN
    description: Rod-complex membrane protein that modulates PBP2 activity in balance
      with MreC.
    grounding: UniProtKB:A0A0H2VI68
  - node_id: apbp_proteins
    label: class A penicillin-binding proteins (aPBPs)
    node_type: GENE_OR_PROTEIN
    description: Bifunctional glycosyltransferase/transpeptidase peptidoglycan synthases
      that influence cell diameter.
  edges:
  - subject: standard_growth_conditions
    predicate: enables
    object: rod_complex_pg
    description: Standard growth regimes support typical Rod-complex activity.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: MreB-directed peptidoglycan synthesis
      notes: Supports MreB-organized PG synthesis under standard conditions.
    predicate_id: RO:0002327
  - subject: rod_complex_pg
    predicate: produces
    object: cell_width_medium_trait
    description: Rod-complex PG synthesis sustains a typical rod radius.
    evidence:
    - reference: DOI:10.1038/nrmicro3088
      snippet: rod-shape is maintained
      notes: Supports lateral PG assembly as the producer of typical rod radius.
    predicate_id: METPO:2000202
  - subject: cell_width_medium_trait
    predicate: is a
    object: cell_width_trait
    description: Medium cell width is a quantitative bin of the cell-width phenotype.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: MreB-directed peptidoglycan synthesis
      notes: Supports medium width as a value within the regulated cell-width distribution.
    predicate_id: rdfs:subClassOf
  - subject: roda_pbp2_complex
    predicate: positively regulates
    object: pg_polymerization_crosslinking
    description: Structural opening of the RodA-PBP2 complex couples and activates
      PG polymerization and crosslinking during elongation.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: RodA-PBP2 undergoes dynamic exchange between closed and open states;
        structural opening couples activation of polymerization and crosslinking and
        is essential in vivo.
  - subject: pg_polymerization_crosslinking
    predicate: produces
    object: rod_complex_pg
    description: Elongasome polymerization/crosslinking constitutes the Rod-complex
      lateral peptidoglycan synthesis that sets rod radius.
    evidence:
    - reference: DOI:10.1038/s41467-023-39037-9
      notes: Activation of polymerization and crosslinking is the elongation activity
        underlying Rod-complex lateral wall synthesis.
    predicate_id: METPO:2000202
  - subject: mrec_protein
    predicate: activates
    object: pbp2_protein
    description: MreC interacts with PBP2 and stimulates its peptidoglycan polymerization
      and crosslinking activity.
    evidence:
    - reference: DOI:10.1002/mbo3.1385
      notes: MreC interacts with PBP2 and is thought to cause a structural change
        in PBP2 and stimulate peptidoglycan polymerization and crosslinking.
    predicate_id: RO:0002213
  - subject: mred_protein
    predicate: modulates activity of
    object: pbp2_protein
    description: MreD modulates PBP2 activity; the balance between MreC and MreD determines
      PBP2 activity.
    evidence:
    - reference: DOI:10.1002/mbo3.1385
      notes: The balance between MreC and MreD determines the activity of PBP2 (curated
        as modulatory).
  - subject: pbp2_protein
    predicate: enables
    object: rod_complex_pg
    description: Activated PBP2 transpeptidation supports Rod-complex lateral peptidoglycan
      synthesis.
    evidence:
    - reference: DOI:10.1002/mbo3.1385
      notes: PBP2 activity drives peptidoglycan polymerization and crosslinking of
        the Rod complex.
    predicate_id: RO:0002327
  - subject: apbp_proteins
    predicate: regulates
    object: cell_width_trait
    description: Class A PBPs regulate cell diameter; loss of aPBPs yields shorter,
      wider cells.
    evidence:
    - reference: DOI:10.1038/s41467-023-41082-3
      notes: aPBPs regulate cell diameter; strains lacking aPBPs were moderately but
        significantly shorter and wider.
    predicate_id: RO:0002211
