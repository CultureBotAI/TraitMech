identifier: traitmech:000071
label: magnetosome
definition: A membrane-bounded intracellular organelle containing a magnetic
  iron-mineral crystal (magnetite or greigite); chains of magnetosomes allow
  magnetotactic bacteria to align with and navigate along geomagnetic field lines.
definition_source: DOI:10.1038/nrmicro.2016.99
