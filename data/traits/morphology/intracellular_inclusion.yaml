identifier: traitmech:000066
label: intracellular inclusion
definition: A morphology trait describing a discrete intracellular body — a storage
  granule, gas-filled structure, or protein-bounded microcompartment/organelle —
  that compartmentalizes material or function within a prokaryotic cell.
definition_source: DOI:10.1038/s41579-020-0413-0
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: cytoplasmic inclusion
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41579-020-0413-0
evidence:
- reference: DOI:10.1038/s41579-020-0413-0
  notes: Greening & Lithgow, "Formation and function of bacterial organelles",
    establish that bacteria contain diverse inclusions/organelles (storage granules,
    gas vesicles, microcompartments, magnetosomes); parent of the inclusion
    sub-variants.
- reference: DOI:10.1038/nrmicro.2018.10
  notes: Kerfeld et al. review bacterial microcompartments as a major class of
    protein-bounded intracellular organelles.
