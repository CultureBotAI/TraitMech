- timestamp: '2026-08-06T01:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 1 causal edge(s) off microbe-domain METPO predicates (1 to
    has output), issue 301. The previous predicates are transitively rdfs:subPropertyOf
    METPO:2000001, whose rdfs:domain is METPO:1000525 (microbe), so a causal-graph
    subject entailed that the subject IS a microbe; CausalNodeTypeEnum has no organism
    member, so no such edge could ever satisfy the domain. Edge directions are unchanged
    - this pass only relabels and re-grounds. RO:0002234 (has output) is used where
    the subject is an activity, since biolink gives it the domain 'biological process
    or activity'; the METPO replacements are proposed in proposals/metpo_traitmech_v8
    and v9 and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-07T04:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Re-grounded the `encodes` edge(s) from biolink:encodes to METPO:2007813,
    issue 342. biolink:encodes is NOT a slot in the pinned biolink 4.4.0 model, so
    the CURIE resolved to nothing upstream while looking like an upstream term to
    anyone reading this record -- the disclaimer saying otherwise lived in mappings/predicate_grounding.tsv,
    which is not read at the point of use. RO:0002205 (has gene product) is the nearest
    real term but relates a GENE to a gene product, whereas these edges relate a gene
    cluster or operon to a protein complex or a biosynthetic process, which its range
    does not admit; that mismatch is why the coinage existed. METPO:2007813 is proposed
    in proposals/metpo_traitmech_v9 and is a placeholder id until METPO mints it,
    which puts it in the same state as the rest of that cohort rather than in a category
    of its own.
  llm_assisted: true
- timestamp: '2026-08-07T05:00:00Z'
  curator: claude
  action: RETYPE_CAUSAL_NODE
  changes: Retyped the object node from STATE/CAPACITY to TRAIT and re-grounded its
    in-edge from enables/RO:0002327 to METPO:2007700 (confers), issue 334. biolink
    declares enables range 'biological process or activity', which only BIOLOGICAL_PROCESS,
    PATHWAY and MOLECULAR_FUNCTION satisfy. The node's own description gives it away
    as a disposition rather than a state - phrasings like "Capacity of an organism
    to grow and survive under...", "Ability to grow when..." and "tolerance of..."
    describe what an organism CAN do, which is what a TRAIT is. So the defect was
    the node type, not the predicate, which is the third time in this issue's neighbourhood
    that has been true (compare issue 331's acetate kinase step and issue 330's negated
    node name). With the object correctly a TRAIT, confers applies unchanged.
  llm_assisted: true
- timestamp: '2026-08-07T18:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: 'Edge inclusion_trait -> cytoplasmic_compartmentalization in graph inclusion_compartmentalization:
    re-grounded it from enables/RO:0002327 to manifests as/METPO:2007400. Issue 334.
    biolink declares enables range ''biological process or activity'', which of CausalNodeTypeEnum
    only BIOLOGICAL_PROCESS, PATHWAY and MOLECULAR_FUNCTION satisfy, so this edge
    entailed a false type on its object. Unlike buoyancy, compartmentalization is
    not a disposition the inclusion confers -- it is how the inclusion PRESENTS: ''spatial
    segregation of material or activity within the cytoplasm''. That is what `manifests
    as` is for, and its gate is already open.'
  llm_assisted: true
