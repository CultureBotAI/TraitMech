identifier: METPO:1000703
label: non motile
definition: A motility in which an organism lacks the ability to move independently
  under its own power.
definition_source: DOI:10.3389/fmicb.2025.1514643
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000701
synonyms:
- synonym_text: 'no'
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: non-motile
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.3389/fmicb.2025.1514643
  snippet: They are Gram-negative, non-motile rods
  notes: 'Organism example: Klebsiella pneumoniae is described as non-motile.'
- reference: DOI:10.1146/annurev.micro.57.030502.090832
  snippet: flagellum
  notes: Bacterial flagellum review supports the absence or non-expression of the
    flagellar apparatus as the basis for non-motile phenotypes.
canonical_examples:
- taxon_id: NCBITaxon:573
  taxon_label: Klebsiella pneumoniae
  note: non-motile enteric
  reference: https://www.ncbi.nlm.nih.gov/books/NBK519004/
- taxon_id: NCBITaxon:1313
  taxon_label: Streptococcus pneumoniae
  note: non-motile coccus
  reference: PMID:34779760
causal_graphs:
- graph_id: non_motile_absent_motility_apparatus
  title: Non-motile absent motility apparatus
  description: DOI-backed graph linking absence or non-expression of the flagellar
    or pilus-based motility apparatus to the non-motile phenotype.
  nodes:
  - node_id: non_motile_trait
    label: non motile
    node_type: TRAIT
    grounding: METPO:1000703
    description: Lack of self-powered cellular movement.
  - node_id: absent_flagellum
    label: absent or non-expressed flagellum
    node_type: ORGANELLE
    description: Genomic absence or silenced expression of the flagellar apparatus.
    grounding: GO:0009288
  - node_id: absent_motility_pili
    label: absent motility pili
    node_type: ORGANELLE
    description: Lack of type IV or other motility-associated pili.
  - node_id: no_propulsion
    label: no propulsion
    node_type: BIOLOGICAL_PROCESS
    description: Inability to generate self-motive force.
  - node_id: flagellum_biogenesis_disruption
    label: disrupted flagellum biogenesis
    node_type: BIOLOGICAL_PROCESS
    description: Loss-of-function mutations affecting assembly of a functional flagellum.
  - node_id: c_di_gmp_high
    label: high intracellular cyclic di-GMP
    node_type: CHEMICAL
    description: Elevated second-messenger c-di-GMP that signals a sessile lifestyle.
  - node_id: flagellar_gene_repression
    label: repression of flagellar gene expression
    node_type: BIOLOGICAL_PROCESS
    description: Downregulation of flagellar structural and regulatory genes.
  - node_id: flhdc_master_operon
    label: flhDC flagellar master operon
    node_type: GENE_OR_PROTEIN
    description: Master regulatory operon controlling the flagellar transcriptional
      hierarchy.
  - node_id: wspr_dgc
    label: WspR diguanylate cyclase
    node_type: GENE_OR_PROTEIN
    description: Diguanylate cyclase that synthesizes c-di-GMP when activated.
  - node_id: reduced_motility_state
    label: reduced or absent motility
    node_type: STATE
    description: Diminished flagellar motility that can manifest as a non-motile phenotype.
  edges:
  - subject: absent_flagellum
    predicate: prevents
    object: no_propulsion
    description: Without a flagellum cells cannot generate flagellar propulsion.
    evidence:
    - reference: DOI:10.1146/annurev.micro.57.030502.090832
      snippet: flagellum
      notes: Supports the flagellum as the major bacterial motility organelle.
    predicate_id: RO:0002212
  - subject: absent_motility_pili
    predicate: prevents
    object: no_propulsion
    description: Without motility pili cells cannot generate twitching or related
      pilus-driven movement.
    evidence:
    - reference: DOI:10.1038/nrmicro2218
      snippet: type IV pili
      notes: Type-IV-pili review supports type IV pili as the cellular basis for twitching
        motility (and their absence as the basis for non-twitching/non-motile phenotype).
    predicate_id: RO:0002212
  - subject: no_propulsion
    predicate: manifests as
    object: non_motile_trait
    description: Lack of propulsion manifests the non-motile trait.
    evidence:
    - reference: DOI:10.3389/fmicb.2025.1514643
      snippet: They are Gram-negative, non-motile rods
      notes: Supports the trait endpoint in a representative organism.
    predicate_id: METPO:2007400
  - subject: flagellum_biogenesis_disruption
    predicate: prevents
    object: no_propulsion
    description: Disrupted flagellum biogenesis yields a non-functional flagellum
      and loss of propulsion.
    evidence:
    - reference: DOI:10.1186/s12866-024-03387-1
      notes: flagellum biogenesis was affected in mutants and lack of functional flagellum
        confirmed in motility assays.
    predicate_id: RO:0002212
  - subject: wspr_dgc
    predicate: increases amount of
    object: c_di_gmp_high
    description: WspR diguanylate cyclase produces c-di-GMP when phosphorylated, raising
      intracellular levels.
    evidence:
    - reference: DOI:10.1128/aem.01548-23
      notes: WspR produces c-di-GMP when phosphorylated; high c-di-GMP represses motility.
  - subject: c_di_gmp_high
    predicate: causes
    object: flagellar_gene_repression
    description: High c-di-GMP causes FleQ to cease activating flagellar genes, repressing
      flagellar gene expression.
    evidence:
    - reference: DOI:10.1128/jb.00365-23
      notes: At high c-di-GMP, FleQ ceases to activate flagellar genes.
    predicate_id: biolink:causes
  - subject: flhdc_master_operon
    predicate: positively regulates
    object: flagellar_gene_repression
    description: Repression of the flhDC master operon decreases flagellar gene expression;
      included as the master-regulator control point.
    evidence:
    - reference: DOI:10.3390/foods13223709
      notes: OmpR binds the flhDC operon promoter and represses transcription, decreasing
        flagellar gene expression and motility.
    predicate_id: RO:0002213
  - subject: flagellar_gene_repression
    predicate: causes
    object: reduced_motility_state
    description: Repression of flagellar genes leads to reduced or absent motility.
    evidence:
    - reference: DOI:10.1128/jb.00365-23
      notes: Loss of flagellar gene activation lowers motility, which can manifest
        as a non-motile state.
    predicate_id: biolink:causes
  - subject: reduced_motility_state
    predicate: manifests as
    object: non_motile_trait
    description: Sufficiently reduced/absent motility manifests the non-motile trait.
    evidence:
    - reference: DOI:10.1128/aem.01548-23
      notes: Elevated c-di-GMP regulatory output yields a non-motile mutant phenotype.
    predicate_id: METPO:2007400
