identifier: METPO:1000686
label: vibrio shaped
definition: A cell shape in which an organism has a curved rod or comma morphology,
  characterized by a short curved cylindrical form with a single arc.
definition_source: DOI:10.1016/j.cell.2016.12.019
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: vibrio
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: vibrio-shaped
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1016/j.cell.2016.12.019
  snippet: V. cholerae has a characteristic curved rod morphology
  notes: Supports vibrio/comma morphology and a source-backed curvature mechanism
    in Vibrio cholerae.
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: "Comma-shaped (curved-rod) vibrio; cholera agent and the canonical Vibrio."
  reference: PMID:28086090
causal_graphs:
- graph_id: vibrio_shaped_crvA_curvature
  title: Vibrio-shape CrvA curvature mechanism
  description: Evidence-backed causal sketch linking vibrioid curved-rod morphology
    to periplasmic CrvA polymers and asymmetric peptidoglycan insertion.
  nodes:
  - node_id: vibrio_shaped_trait
    label: vibrio shaped
    node_type: TRAIT
    grounding: METPO:1000686
    description: Short curved-rod or comma-shaped bacterial morphology.
  - node_id: crvA
    label: CrvA
    node_type: GENE_OR_PROTEIN
    description: Periplasmic polymer-forming curvature determinant in Vibrio.
  - node_id: periplasmic_filament
    label: periplasmic filament
    node_type: CELLULAR_LOCALIZATION
    description: CrvA polymer structure at the inner curved face of the cell.
  - node_id: asymmetric_peptidoglycan_insertion
    label: asymmetric peptidoglycan insertion
    node_type: BIOLOGICAL_PROCESS
    description: Unequal cell-wall insertion across inner and outer faces.
  - node_id: cell_body_curvature
    label: cell-body curvature
    node_type: BIOLOGICAL_PROCESS
    description: Curving of an otherwise rod-like cell body.
  - node_id: crvB
    label: CrvB
    node_type: GENE_OR_PROTEIN
    description: Periplasmic curvature determinant that co-assembles with CrvA into
      the inner-curve filament.
  - node_id: vadR_srna
    label: VadR sRNA
    node_type: GENE_OR_PROTEIN
    description: Small RNA that post-transcriptionally represses crvA mRNA to limit
      curvature.
  - node_id: crvA_mrna
    label: crvA mRNA
    node_type: GENE_OR_PROTEIN
    description: Messenger RNA encoding the CrvA curvature determinant.
  - node_id: vxrAB_tcs
    label: VxrAB two-component system
    node_type: GENE_OR_PROTEIN
    description: Two-component signaling system that activates vadR transcription.
  - node_id: cyclic_di_gmp
    label: cyclic di-GMP
    node_type: CHEMICAL
    description: Second messenger that, when elevated, decreases cell curvature to
      generate straight rods.
    grounding: CHEBI:49537
  edges:
  - subject: crvA
    predicate: self-assembles into
    object: periplasmic_filament
    description: CrvA forms periplasmic filaments at the inner face of cell curvature.
    evidence:
    - reference: DOI:10.1016/j.cell.2016.12.019
      snippet: CrvA self-assembles into filaments at the inner face
      notes: Supports CrvA as a periplasmic polymer at the inner curvature.
  - subject: periplasmic_filament
    predicate: patterns
    object: asymmetric_peptidoglycan_insertion
    description: CrvA filaments pattern differential peptidoglycan insertion.
    evidence:
    - reference: DOI:10.1016/j.cell.2016.12.019
      snippet: asymmetrically patterns peptidoglycan insertion
      notes: Supports CrvA-dependent spatial patterning of wall insertion.
  - subject: asymmetric_peptidoglycan_insertion
    predicate: causes
    object: cell_body_curvature
    description: Unequal peptidoglycan insertion creates more material on the outer
      face than the inner face, curving the cell.
    evidence:
    - reference: DOI:10.1016/j.cell.2016.12.019
      snippet: causing more material insertions into the outer face
      notes: Supports asymmetric wall insertion as the proximal cause of curvature.
    predicate_id: biolink:causes
  - subject: cell_body_curvature
    predicate: confers
    object: vibrio_shaped_trait
    description: Curved rod morphology produces the vibrioid/comma-shaped trait.
    evidence:
    - reference: DOI:10.1016/j.cell.2016.12.019
      snippet: characteristic curved rod morphology
      notes: Supports the observed Vibrio morphology as a curved-rod shape.
    predicate_id: METPO:2007700
  - subject: crvB
    predicate: increases
    object: cell_body_curvature
    description: CrvB expression increases CrvA assembly and cell curvature in a dose-dependent
      manner.
    evidence:
    - reference: DOI:10.1101/2020.02.20.954503
      notes: crvB expression increased CrvA-GFP assembly as well as cell curvature
        in a dose-dependent manner.
    predicate_id: RO:0002213
  - subject: crvB
    predicate: colocalizes with
    object: periplasmic_filament
    description: CrvB colocalizes with CrvA in the same periplasmic inner-curve filament
      structure.
    evidence:
    - reference: DOI:10.1101/2020.02.20.954503
      notes: Both proteins localized to the same structure; CrvB-GFP filaments colocalized
        with periplasmic DsbA-mCherry.
  - subject: vadR_srna
    predicate: represses
    object: crvA_mrna
    description: VadR sRNA is a post-transcriptional inhibitor of crvA mRNA.
    evidence:
    - reference: DOI:10.1038/s41467-020-19890-8
      notes: The VadR small RNA acts as a post-transcriptional inhibitor of the crvA
        mRNA.
  - subject: crvA_mrna
    predicate: translated into
    object: crvA
    description: crvA mRNA is translated into the CrvA curvature determinant protein.
    evidence:
    - reference: DOI:10.1038/s41467-020-19890-8
      notes: crvA mRNA encodes the periplasmic CrvA protein that determines cell curvature.
  - subject: vadR_srna
    predicate: decreases
    object: cell_body_curvature
    description: Mutation of vadR increases cell curvature whereas overexpression
      has the inverse effect, indicating VadR limits curvature.
    evidence:
    - reference: DOI:10.1038/s41467-020-19890-8
      notes: Mutation of vadR increases cell curvature, whereas overexpression has
        the inverse effect.
    predicate_id: RO:0002212
  - subject: vxrAB_tcs
    predicate: activates transcription of
    object: vadR_srna
    description: The VxrAB two-component system activates vadR transcription.
    evidence:
    - reference: DOI:10.1038/s41467-020-19890-8
      notes: vadR transcription is activated by the VxrAB two-component system.
  - subject: cyclic_di_gmp
    predicate: decreases
    object: cell_body_curvature
    description: High c-di-GMP concentrations decrease cell curvature to generate
      straight rods.
    evidence:
    - reference: DOI:10.1073/pnas.2010199117
      notes: High c-di-GMP concentrations decrease cell curvature to generate straight
        rods.
    predicate_id: RO:0002212
