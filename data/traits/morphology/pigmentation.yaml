- timestamp: '2026-08-06T02:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES_PART2
  changes: Re-grounded 1 causal edge(s) off microbe-domain METPO predicates onto their
    causal-graph counterparts (1 to produces), issue 301 part 2. The previous predicates
    are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain is METPO:1000525
