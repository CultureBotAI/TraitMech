- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): carotenoid_biosynthesis is typed PATHWAY, phenazine_biosynthesis
    is typed PATHWAY. PATHWAY is a named, conventionally enumerable multi-step route;
    BIOLOGICAL_PROCESS is everything else. A named biosynthetic route. Most descriptions
    call it one outright, including BIOLOGICAL_PROCESS-typed ones (''Enzymatic pathway
    producing carotenoid pigments''); red_pigmented.yaml instead ENUMERATES the steps
    -- ''Phytoene synthase condenses two GGPP to phytoene, then desaturation/isomerization
    yields lycopene'' -- which is the rule''s own test for PATHWAY met explicitly
    rather than by naming. Applied AGAINST the majority, which was 5 BIOLOGICAL_PROCESS
    to 1 before this tranche. A named biosynthetic route; both typings say ''Biosynthetic
    pathway producing phenazine pigments''. The rule breaks the 1-1 tie.'
  llm_assisted: true
