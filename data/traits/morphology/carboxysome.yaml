identifier: traitmech:000072
label: carboxysome
definition: A bacterial microcompartment — a polyhedral protein-shelled organelle
  that encapsulates RuBisCO and carbonic anhydrase to concentrate CO2 for carbon
  fixation in cyanobacteria and many chemoautotrophs.
definition_source: DOI:10.1038/nrmicro.2018.10
trait_category: MORPHOLOGY
term_kind: CLASS
