evidence:
- reference: DOI:10.1038/nrmicro.2018.10
  notes: Kerfeld et al. review bacterial microcompartments; the carboxysome is the
    archetypal protein-shelled CO2-fixing microcompartment.
- reference: DOI:10.1038/nrmicro1913
  notes: Yeates et al. describe protein-based organelles in bacteria (carboxysomes
    and related microcompartments), including the carboxysome shell and its
    encapsulated enzymes.
