identifier: METPO:1000881
label: cell length
definition: A phenotype that inheres in a cell by virtue of its longer dimension when
  viewed on a plane.
definition_source: DOI:10.1016/j.cub.2014.07.022
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1016/j.cub.2014.07.022
  snippet: cell size is tightly controlled
  notes: Review establishes cell size as an actively regulated phenotype, supporting
    length as a controlled cellular dimension.
- reference: DOI:10.1016/j.cell.2014.11.022
  snippet: cells grow by a fixed amount between divisions
  notes: Adder-model paper supports an inter-divisional length increment underlying
    cell-length distributions.
causal_graphs:
- graph_id: cell_length_division_growth_control
  scope_status: NONMECHANISTIC
  scope_notes: Cell length is a quantitative measurement descriptor rather than one
    conserved protein-mediated mechanism. The graph is retained only as contextual
    background on factors that can influence the measured dimension.
  title: Cell-length control by growth and division timing
  description: DOI-backed graph linking growth rate, division-site placement, and
    the adder size-control principle to the observed cell-length phenotype.
  nodes:
  - node_id: cell_length_trait
    label: cell length
    node_type: TRAIT
    grounding: METPO:1000881
    description: Longer dimension of the rod-like or elongated cell body.
  - node_id: growth_rate
    label: elongation rate
    node_type: BIOLOGICAL_PROCESS
    description: Rate at which the cell elongates between divisions.
  - node_id: adder_principle
    label: adder size control
    node_type: BIOLOGICAL_PROCESS
    description: Mechanism by which cells add a fixed length increment between consecutive
      divisions.
  - node_id: ftsz_ring
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This contextual node denotes an assembled FtsZ structure rather
      than one exact protein-family entity.
    label: FtsZ ring (divisome)
    node_type: GENE_OR_PROTEIN
    description: Tubulin-like FtsZ-based contractile ring that organizes division.
  - node_id: division_site_placement
    label: division-site placement
    node_type: BIOLOGICAL_PROCESS
    description: Spatial selection of the midcell division site.
  - node_id: cytokinesis
    label: cytokinesis
    node_type: BIOLOGICAL_PROCESS
    description: Cell division that resets cell length each generation.
    grounding: GO:0000910
  - node_id: elongasome
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The elongasome is a variable multisubunit assembly; no verified
      single complex term exactly represents this contextual node.
    label: Rod complex (elongasome)
    node_type: GENE_OR_PROTEIN
    description: MreB/RodA/PBP2-based multiprotein complex driving cell elongation.
  - node_id: sidewall_pg_synthesis
    label: sidewall peptidoglycan synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Lateral/sidewall PG insertion that lengthens the cell prior to division.
  - node_id: ftsa_zipa
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: FtsA and ZipA are distinct protein families grouped for contextual
      explanation, so one family grounding would be incorrect.
    label: FtsA and ZipA (proto-ring tethers)
    node_type: GENE_OR_PROTEIN
    description: Membrane tethers that attach FtsZ to the membrane forming the proto-ring.
  - node_id: ftswi_septal_synthase
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: FtsW and FtsI are distinct components grouped as a septal synthase
      module; one protein-family term cannot denote both.
    label: FtsWI septal PG synthase
    node_type: GENE_OR_PROTEIN
    description: FtsW/FtsI complex that drives septal peptidoglycan synthesis.
  - node_id: septum_synthesis
    label: septum synthesis
    node_type: BIOLOGICAL_PROCESS
    description: Septal PG synthesis driving division constriction.
  - node_id: min_nucleoid_occlusion
    label: Min system and nucleoid occlusion
    node_type: BIOLOGICAL_PROCESS
    description: Spatial regulators acting as localized negative regulators of FtsZ
      polymerization.
  edges:
  - subject: growth_rate
    predicate: contributes to
    object: cell_length_trait
    description: Elongation rate sets how rapidly a cell extends along its long axis
      between divisions.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.07.022
      snippet: cell size is tightly controlled
      notes: Supports growth/elongation rate as a determinant of cell size.
    predicate_id: RO:0002326
  - subject: adder_principle
    predicate: regulates
    object: cell_length_trait
    description: Adder size control sets the inter-division length increment that
      determines average cell length.
    evidence:
    - reference: DOI:10.1016/j.cell.2014.11.022
      snippet: cells grow by a fixed amount between divisions
      notes: Supports the adder principle as the size-control rule producing the length
        distribution.
    predicate_id: RO:0002211
  - subject: ftsz_ring
    predicate: assembles at
    object: division_site_placement
    description: FtsZ assembles at the future division site to initiate cytokinesis.
    evidence:
    - reference: DOI:10.1038/nrmicro2671
      snippet: FtsZ ring at the future division site
      notes: Supports FtsZ-ring assembly as the proximate divisome event.
  - subject: division_site_placement
    predicate: causes
    object: cytokinesis
    description: Division-site placement directs constriction and cytokinesis.
    evidence:
    - reference: DOI:10.1038/nrmicro2671
      snippet: directs cell division
      notes: Supports division-site placement as the trigger for cytokinesis.
    predicate_id: biolink:causes
  - subject: cytokinesis
    predicate: resets
    object: cell_length_trait
    description: Cytokinesis halves the mother cell, resetting daughter cell length.
    evidence:
    - reference: DOI:10.1016/j.cell.2014.11.022
      snippet: cells grow by a fixed amount between divisions
      notes: Supports division as the event that resets length each generation.
  - subject: elongasome
    predicate: mediates
    object: sidewall_pg_synthesis
    description: The Rod complex/elongasome drives sidewall peptidoglycan synthesis.
    evidence:
    - reference: DOI:10.3389/fcimb.2023.1205488
      notes: elongasome drives sidewall peptidoglycan synthesis necessary for rod
        shape and lengthening of the cell prior to division.
  - subject: sidewall_pg_synthesis
    predicate: contributes to
    object: cell_length_trait
    description: Sidewall PG synthesis lengthens the cell prior to division.
    evidence:
    - reference: DOI:10.3389/fcimb.2023.1205488
      notes: sidewall peptidoglycan synthesis necessary for the lengthening of the
        cell prior to division.
    predicate_id: RO:0002326
  - subject: elongasome
    predicate: mediates
    object: growth_rate
    description: The Rod complex/elongasome mediates cell elongation.
    evidence:
    - reference: DOI:10.1038/s42003-024-07279-y
      notes: elongation is mediated by the Rod complex (the elongasome).
  - subject: ftsa_zipa
    predicate: attaches
    object: ftsz_ring
    description: FtsA and ZipA tether FtsZ to the membrane forming the proto-ring.
    evidence:
    - reference: DOI:10.1038/s41579-023-00942-x
      notes: FtsZ membrane attachment depends on tethers FtsA and ZipA (the proto-ring).
  - subject: ftswi_septal_synthase
    predicate: drives
    object: septum_synthesis
    description: FtsWI septal PG synthases drive septum synthesis.
    evidence:
    - reference: DOI:10.1038/s41579-023-00942-x
      notes: essential septal peptidoglycan synthases FtsW and FtsI (FtsWI) that drive
        septum synthesis.
  - subject: septum_synthesis
    predicate: contributes to
    object: cytokinesis
    description: Septum synthesis drives division constriction completing cytokinesis.
    evidence:
    - reference: DOI:10.1038/s41579-023-00942-x
      notes: inactivation of essential divisome proteins blocks division, altering
        cell length; septum synthesis drives division constriction.
    predicate_id: RO:0002326
  - subject: min_nucleoid_occlusion
    predicate: regulates
    object: division_site_placement
    description: Min system and nucleoid occlusion determine division site placement
      via localized negative regulation of FtsZ polymerization.
    evidence:
    - reference: DOI:10.1038/s41579-023-00942-x
      notes: the Min system and nucleoid occlusion act as localized negative regulators
        of FtsZ polymerization and thus determine division site placement.
    predicate_id: RO:0002211
