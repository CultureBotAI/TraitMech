identifier: METPO:1000700
label: gram variable
definition: A gram stain in which bacteria from the same culture show both gram-positive
  and gram-negative staining characteristics, often due to age of culture or cell
  wall degradation.
definition_source: DOI:10.1128/CMR.00043-07
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000697
synonyms:
- synonym_text: variable
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1128/CMR.00043-07
  snippet: cell wall structure
  notes: Bacterial cell-wall review supports peptidoglycan thinning and autolysis-mediated
    loss of crystal-violet retention as the basis for gram-variable staining.
causal_graphs:
- graph_id: gram_variable_wall_thinning
  title: Gram-variable peptidoglycan thinning
  description: DOI-backed graph linking culture-age-dependent peptidoglycan thinning
    and autolysis to inconsistent gram-staining within a single bacterial population.
  nodes:
  - node_id: gram_variable_trait
    label: gram variable
    node_type: TRAIT
    grounding: METPO:1000700
    description: Mixed gram-positive and gram-negative staining within a single culture.
  - node_id: culture_aging
    label: culture aging
    node_type: ENVIRONMENTAL_FACTOR
    description: Stationary-phase or post-exponential growth conditions promoting
      cell-wall remodeling.
  - node_id: peptidoglycan_thinning
    label: peptidoglycan thinning
    node_type: BIOLOGICAL_PROCESS
    description: Cell-wall degradation or thinning due to autolysis or stress.
  - node_id: crystal_violet_retention_loss
    label: crystal-violet retention loss
    node_type: BIOLOGICAL_PROCESS
    description: Loss of the thick PG layer required to retain the gram-stain dye.
  - node_id: mixed_staining
    label: mixed-population gram staining
    node_type: BIOLOGICAL_PROCESS
    description: Co-existence of gram-positive and gram-negative-staining cells in
      the same culture.
  - node_id: thin_peptidoglycan_layer
    label: thin peptidoglycan layer
    node_type: CELLULAR_LOCALIZATION
    description: A reduced-thickness peptidoglycan sacculus, as in some monoderm bacteria.
  - node_id: cv_iodide_complex_retention
    label: CV-iodide complex retention
    node_type: BIOLOGICAL_PROCESS
    description: Trapping of the crystal-violet-iodide complex within the peptidoglycan
      layer during gram staining.
  - node_id: gram_negative_staining
    label: gram-negative staining
    node_type: BIOLOGICAL_PROCESS
    description: Loss of crystal violet and counterstain uptake giving a gram-negative
      appearance.
  - node_id: cell_wall_deficient_forms
    label: cell wall-deficient forms
    node_type: STATE
    description: Stress-induced bacterial cells with reduced or absent cell wall (e.g.,
      L-forms, CWD coccoid forms).
  edges:
  - subject: culture_aging
    predicate: regulates
    object: peptidoglycan_thinning
    description: Aging cultures undergo cell-wall thinning via autolysis.
    evidence:
    - reference: DOI:10.1128/CMR.00043-07
      snippet: autolysis
      notes: Supports autolysis-driven peptidoglycan thinning in aging cultures.
    predicate_id: RO:0002211
  - subject: peptidoglycan_thinning
    predicate: causes
    object: crystal_violet_retention_loss
    description: Thinned peptidoglycan no longer retains the gram-stain dye.
    evidence:
    - reference: DOI:10.1128/CMR.00043-07
      snippet: crystal violet
      notes: Supports peptidoglycan thickness as the determinant of crystal-violet
        retention in the gram-stain protocol.
    predicate_id: biolink:causes
  - subject: crystal_violet_retention_loss
    predicate: produces
    object: mixed_staining
    description: Subpopulations with reduced dye retention appear gram-negative alongside
      intact gram-positive cells.
    evidence:
    - reference: DOI:10.1128/CMR.00043-07
      snippet: decolorization
      notes: Supports differential decolorization producing mixed staining within
        a single culture.
    predicate_id: METPO:2000202
  - subject: mixed_staining
    predicate: manifests as
    object: gram_variable_trait
    description: Mixed staining manifests the gram-variable trait.
    evidence:
    - reference: DOI:10.1128/CMR.00043-07
      snippet: Gram-variable
      notes: Supports the Gram-variable phenotype as the trait endpoint of heterogeneous
        staining.
    predicate_id: METPO:2007400
  - subject: thin_peptidoglycan_layer
    predicate: results in
    object: gram_negative_staining
    description: A thin peptidoglycan layer can yield a gram-negative staining result
      even in monoderm bacteria.
    evidence:
    - reference: DOI:10.1128/spectrum.00732-24
      notes: certain bacteria can stain Gram-negative despite having a monoderm cell
        wall structure
  - subject: thin_peptidoglycan_layer
    predicate: reduces
    object: cv_iodide_complex_retention
    description: A thin peptidoglycan layer reduces retention of the crystal-violet-iodide
      complex, the core staining-chemistry determinant.
    evidence:
    - reference: DOI:10.1128/spectrum.00732-24
      notes: to retain the CV-iodide complex, resulting in the loss of the CV
  - subject: cv_iodide_complex_retention
    predicate: regulates
    object: crystal_violet_retention_loss
    description: Reduced CV-iodide complex retention drives loss of crystal-violet
      retention.
    evidence:
    - reference: DOI:10.1128/spectrum.00732-24
      notes: Reduced CV-iodide complex retention underlies the loss of crystal violet
        during decolorization.
  - subject: cell_wall_deficient_forms
    predicate: produces
    object: mixed_staining
    description: Stress-induced cell wall-deficient forms can produce mixed gram reactions
      within a single culture.
    evidence:
    - reference: DOI:10.1101/2023.11.16.566987
      notes: mechanisms that can produce cell-wall alterations or loss that would
        lead to mixed Gram reactions in a single culture
