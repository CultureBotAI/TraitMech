    evidence:
    - reference: DOI:10.1128/msystems.01017-21
      notes: Rod complex-mediated organized circumferential insertion of PG strands
        reduces cell diameter; may generalize to rod-shaped bacteria.
    predicate_id: RO:0002212
  - subject: apbp_proteins
    predicate: increases
    object: cell_width_trait
    description: aPBP-mediated isotropic PG insertion enlarges the cell cylinder,
      increasing width.
    evidence:
    - reference: DOI:10.1128/msystems.01017-21
      notes: aPBP-mediated isotropic insertion enlarges the cell cylinder; defines
        opposite regulation of width.
    predicate_id: RO:0002213
