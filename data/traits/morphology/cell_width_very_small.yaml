    predicate_id: RO:0002211
  - subject: streamlining_selection
    predicate: produces
    object: cell_width_very_small_trait
    description: Streamlining selection produces very narrow rods.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: small cells
      notes: Supports very narrow width as an outcome of streamlining selection.
    predicate_id: METPO:2000202
  - subject: cell_width_very_small_trait
    predicate: is a
    object: cell_width_trait
    description: Very small cell width is a quantitative bin of the cell-width phenotype.
    evidence:
    - reference: DOI:10.1146/annurev-cellbio-101011-155745
      snippet: MreB-directed peptidoglycan synthesis
      notes: Supports very narrow width as a value within the regulated cell-width
        distribution.
    predicate_id: rdfs:subClassOf
  - subject: high_surface_to_volume_ratio
    predicate: increases
    object: nutrient_uptake_efficiency
    description: High surface-to-volume ratio of narrow cells improves nutrient uptake
