    evidence:
    - reference: DOI:10.31951/2658-3518-2024-a-4-795
      notes: Thanks to their high surface-to-volume ratio, small-cell bacteria absorb
        nutrients most efficiently.
    predicate_id: RO:0002213
  - subject: small_cell_bacteria
    predicate: adapted to
