    evidence:
    - reference: DOI:10.31951/2658-3518-2024-a-4-795
      notes: Especially important in oligotrophic water bodies with low organic matter
        concentrations.
  - subject: reduced_genome_size
    predicate: associated with
    object: streamlining_selection
    description: Reduced genome size is associated with streamlining in oligotrophic
