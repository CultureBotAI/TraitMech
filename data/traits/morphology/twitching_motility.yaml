  source: DOI:10.1146/annurev.micro.56.012302.160938
evidence:
- reference: DOI:10.1146/annurev.micro.56.012302.160938
  notes: Mattick, "Type IV pili and twitching motility", describes twitching as
    type-IV-pilus-driven surface translocation operating like a grappling hook.
- reference: DOI:10.1146/annurev.micro.57.030502.091014
  notes: Harshey, "Bacterial motility on a surface", places twitching among the
    distinct surface-translocation strategies of bacteria.
