identifier: traitmech:000681
label: fungal adhesive-column trap formation
definition: A morphological phenotype in which a fungus forms columns of serially
  arranged hyphal cells with adhesive surfaces that serve as nematode traps.
definition_source: DOI:10.1016/j.isci.2020.101057
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000718
evidence:
- reference: DOI:10.1016/j.isci.2020.101057
  snippet: Fungi with the AC device form a string of cells with adhesive surfaces
  notes: Ji et al. (2020), Introduction, third paragraph; AC means adhesive column.
    Primary full-text XML at https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7186526/fullTextXML
    and actual Figure 1 inspected. Figure 1C shows a column attributed to source-named
    Dactylellina cionopagum; Figure 1G shows nematode capture by multiple columns.
    This morphology differs from the network, knob and constricting-ring comparators.
    Gene-family expansion and expression correlations do not establish a causal protein
    requirement for column formation. The cited adhesion-gene disruption experiment
    concerns Arthrobotrys oligospora, not this column-forming organism. Supplemental
    Methods were not retrieved completely; no strain identity or universal culture
    condition is inferred from this paper.
- reference: DOI:10.1111/lam.12557
  snippet: Dactylellina cionopaga YMF1·01472, producing adhesive columns
  notes: 'Su et al. (2016), scientific Abstract, final sentence, directly retrieved
    from NCBI XML for PMID:26928264 at https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=26928264&retmode=xml.
    Abstract-only access: full Methods and figures were not retrieved. The abstract
    reports ammonia-associated trap induction in several fungi and names this culture
    as column-producing. The initial 11-bacterium assay and its detailed volatile-compound
    analysis concern A. oligospora, not eleven independent column-forming isolates.
    No universal ammonia requirement, dosage, effect size or molecular induction pathway
    is asserted. Strain provenance remains unresolved; this is qualified phenotype
    evidence, not a natural canonical exemplar.'
discussions:
- discussion_id: adhesive-column-scope-and-parent
  prompt: Resolve a closer fungal trap-morphology parent.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Phenotype METPO:1000059 is a broad parent. Existing mycelial growth traitmech:000074
    explicitly concerns bacteria; hyphal anastomosis traitmech:000605 denotes fusion.
    Distinguish multicellular adhesive columns from unicellular knobs, interconnected
    net loops, nonconstricting rings and mechanically constricting rings. A generic
    hyphal branch, branched-shaped cell or nematophagous genus is not sufficient.
    Adhesive branch is not asserted as an exact synonym without resolving its usage
    boundaries. No exact synonyms, xrefs, SSSOM equivalences or organism-level disjointness
    are asserted. Neighboring scope exclusions are not unresolved exact groundings;
    their closer-parent questions remain open.
  posed_by: codex
  posed_date: '2026-10-08'
  resolved_date: '2026-10-13'
  resolution_note: Added fungal nematode-trap formation traitmech:000718 as the direct
    broader phenotype. The existing child definition entails specialized hyphal trap
    differentiation. This resolves only the parent gap; the historical scope contrasts,
    unasserted mappings, examples and separate mechanism questions remain applicable.
    Formation does not guarantee immediate capture. The column cell-count question
    is separately OPEN. Preserve the historical phenotype axiom and add METPO:1063400
    SubClassOf METPO:1067100 on upstream adoption.
- discussion_id: adhesive-column-strains-and-mechanism
  prompt: Resolve natural strain provenance and column-specific mechanisms.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Live NCBI https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=taxonomy&id=47266
    resolves Dactylellina cionopaga at species rank, with Monacrosporium cionopagum
    and Dactylella cionopaga synonyms. It does not identify YMF1.01472 as a strain
    accession or establish its origin. The 2020 paper's cionopagum spelling and experimental
    strain must be reconciled before a canonical example is added; do not conflate
    strains across these papers. Formation, adhesion, capture, penetration and digestion
    are separate endpoints; formation alone does not guarantee capture in every condition.
    Protein-resolved causal graphs require column-specific perturbation/complementation
    evidence and taxon-paired accessions. Sequence features and expression correlations
    are not validated phenotype predictors. No mechanism is transferred from nets,
    knobs or rings; mechanism is deferred, not claimed absent.
  posed_by: codex
  posed_date: '2026-10-08'
- discussion_id: adhesive-column-cell-count-scope
  prompt: Reconcile serial-cell column scope with the supplement's broader cell-count
    description.
  kind: CURATION_TODO
  status: OPEN
  rationale: The current definition retains serially arranged cells, supported by
    Ji's Introduction. The newly inspected 2020 Transparent Methods, Fungal strains,
    PDF page 12, describes columns containing one or more cells. Preserve this source-level
    difference pending review of single-cell columns versus knobs; do not silently
    broaden the child or make cell number the sole discriminator. Both usages fit
    fungal nematode-trap formation, so this question does not reopen the resolved
    parent gap. The supplement names YMF1.00569 from Deqin soil, not the 2016 paper's
    YMF1.01472. That provenance does not establish identity between the strains or
    a canonical example. The earlier evidence notes record limited supplement access
    at initial curation; this follow-up adds the inspected page without claiming a
    complete supplement audit.
  evidence:
  - reference: DOI:10.1016/j.isci.2020.101057
    evidence_source: full_text
    notes: Transparent Methods, Fungal strains, PDF page 12; text and rendered page
      inspected at https://ars.els-cdn.com/content/image/1-s2.0-S258900422030242X-mmc1.pdf.
      Source-scope assessment, not an additional experiment.
  posed_by: codex
  posed_date: '2026-10-13'
