identifier: traitmech:000527
label: ferrosome
definition: A morphology trait in which a bacterial cell forms membrane-bound ferrosome
  organelles that store intracellular iron as non-crystalline iron phosphate biomineral.
definition_source: DOI:10.1038/s41586-022-04741-x
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000066
evidence:
- reference: DOI:10.1038/s41586-022-04741-x
  snippet: Overall, this work establishes ferrosomes as a new class of iron storage
    organelles
  notes: Grant et al. establish ferrosomes as an iron-storage organelle class.
- reference: DOI:10.1038/s41586-022-04741-x
  snippet: we identify three ferrosome-associated (Fez) proteins that are responsible
    for forming ferrosomes
  notes: Grant et al. support Fez protein-dependent ferrosome formation in Desulfovibrio
    magneticus.
- reference: DOI:10.1038/s41586-022-04741-x
  snippet: fez operons are sufficient for ferrosome formation in foreign hosts
  notes: Grant et al. support fez operon sufficiency for ferrosome formation in heterologous
    bacterial hosts.
- reference: DOI:10.1038/s41586-023-06719-9
  snippet: Here we report that C. difficile undergoes an intracellular iron biomineralization
    process and stores iron in membrane-bound ferrosome organelles containing non-crystalline
    iron phosphate biominerals.
  notes: Pi et al. support membrane-bound ferrosome organelles storing non-crystalline
    iron phosphate in Clostridioides difficile.
- reference: DOI:10.1038/s41586-023-06719-9
  snippet: We found that a membrane protein (FezA) and a P1B6-ATPase transporter (FezB),
    repressed by both iron and the ferric uptake regulator Fur, are required for ferrosome
    formation
  notes: Pi et al. support FezA- and FezB-dependent ferrosome formation in C. difficile.
canonical_examples:
- taxon_id: NCBITaxon:1496
  taxon_label: Clostridioides difficile
  note: Pi et al. showed that C. difficile forms membrane-bound ferrosome organelles
