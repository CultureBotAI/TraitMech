identifier: METPO:1003026
label: orange pigmented
definition: A pigmentation phenotype in which microbial colonies or cells appear orange
  due to production and accumulation of orange pigments such as carotenoids.
definition_source: DOI:10.1080/1040841X.2025.2526423
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003021
