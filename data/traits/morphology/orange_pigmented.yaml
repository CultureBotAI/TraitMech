  - subject: visible_orange_color
    predicate: manifests as
    object: orange_pigmented_trait
    description: Visible orange color manifests the orange-pigmented phenotype.
    evidence:
    - reference: DOI:10.1080/1040841X.2025.2526423
      snippet: orange ... pigmentation in bacteria
      notes: Supports the trait-level color assignment.
    predicate_id: METPO:2007400
  - subject: crt_y_lycopene_cyclase
    predicate: converts
    object: lycopene
    description: CrtY lycopene beta-cyclase acts on lycopene as substrate.
    evidence:
    - reference: DOI:10.3390/microorganisms11030614
      notes: lycopene is converted to beta-carotene by ring-forming lycopene cyclases;
        in bacteria the enzyme is crtY. Broad microbial applicability.
  - subject: lycopene
    predicate: is converted to
    object: beta_carotene
    description: Lycopene cyclization yields orange beta-carotene.
    evidence:
    - reference: DOI:10.3390/microorganisms11030614
      notes: lycopene is converted to beta-carotene by ring-forming lycopene cyclases
        (crtY). Broad microbial applicability.
  - subject: crt_z_hydroxylase
    predicate: converts
    object: beta_carotene
    description: CrtZ beta-carotene hydroxylase acts on beta-carotene.
    evidence:
    - reference: DOI:10.3390/microorganisms11030614
      notes: conversion of beta-carotene to zeaxanthin by crtZ. Strong general edge
        supporting orange/yellow branches.
  - subject: beta_carotene
    predicate: is converted to
    object: zeaxanthin
    description: Hydroxylation of beta-carotene yields zeaxanthin.
    evidence:
    - reference: DOI:10.3390/microorganisms11030614
      notes: crtZ encodes a beta-carotene hydroxylase converting beta-carotene to
        zeaxanthin. Strong general edge.
  - subject: crt_w_ketolase
    predicate: contributes to
    object: ketocarotenoid_biosynthesis
    description: CrtW ketolase drives ketocarotenoid (e.g., canthaxanthin/astaxanthin)
      formation.
    evidence:
    - reference: DOI:10.3390/microorganisms11030614
      notes: ketolation by ketolases such as crtW yields ketocarotenoids (canthaxanthin/astaxanthin).
        Strong for the ketocarotenoid branch; orange-to-red hue.
    predicate_id: RO:0002326
  - subject: carotenoid_accumulation
    predicate: protects against
    object: oxidative_stress
    description: Accumulated carotenoids act as antioxidants neutralizing reactive
      oxygen species.
    evidence:
    - reference: DOI:10.7759/cureus.59892
      notes: acts as an antioxidant protecting against hydrogen peroxide and hydroxyl
        radicals. Strong, broad functional edge across taxa.
  - subject: orange_pigmented_trait
    predicate: has material basis in
    object: carotenoid_accumulation
    description: The orange-pigmented phenotype is materially based on carotenoid
      accumulation.
    evidence:
    - reference: DOI:10.7759/cureus.59892
      notes: orange carotenoid; golden yellow-orange pigment. High-level edge suitable
        for TraitMech root graph across diverse taxa.
