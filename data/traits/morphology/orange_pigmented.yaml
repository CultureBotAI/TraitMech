- synonym_text: Pigment_orange
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1080/1040841X.2025.2526423
  snippet: orange ... pigmentation in bacteria
  notes: Supports orange microbial pigmentation as a bacterial carotenoid-associated
    color phenotype.
