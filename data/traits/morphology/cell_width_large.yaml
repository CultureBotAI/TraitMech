  - node_id: roda_pbp2_activation
    label: RodA-PBP2 allosteric activation
    node_type: BIOLOGICAL_PROCESS
    description: Structural opening coupling peptidoglycan polymerization and crosslinking.
  - node_id: pg_polymerization_crosslinking
    label: peptidoglycan polymerization and crosslinking
    node_type: BIOLOGICAL_PROCESS
    description: Glycan-chain polymerization and transpeptidase crosslinking during
