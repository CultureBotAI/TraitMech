evidence:
- reference: DOI:10.1128/AEM.64.10.3576-3583.1998
  snippet: In transmission electron micrographs, isolate OC 1/4 exhibited monopolar
    polytrichous flagellation, with up to three flagella per cell (Fig. 4).
  notes: Huber et al. directly observed multiple flagella at one pole of Thermocrinis
    ruber OC 1/4.
- reference: DOI:10.1128/AEM.68.12.6310-6320.2002
  snippet: The cells have bipolar polytrichous flagella and exhibit a unique swimming
    pattern, rotating and translating along their short axis.
  notes: Thar and Kuhl describe a second bacterial polytrichous arrangement, with
    flagella present at both cell poles.
