    and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-06T08:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: 'Re-grounded causal edge(s) off enables/RO:0002327 onto contributes to
    (RO:0002326), issue 334. biolink declares enables range ''biological process or
    activity'', which only BIOLOGICAL_PROCESS, PATHWAY and MOLECULAR_FUNCTION satisfy,
    so an edge pointing at a GENE_OR_PROTEIN entailed a false type. The replacements
    are chosen per idiom rather than swept: a gene cluster ENCODES its product, a
    subunit is PART OF the complex it belongs to, and an energy source or acquired
    repertoire CONTRIBUTES TO the machine it powers or composes. All three declare
    no rdfs:domain or rdfs:range, so none can reintroduce the class of defect being
    removed.'
  llm_assisted: true
- timestamp: '2026-08-06T09:00:00Z'
  curator: claude
  action: REGROUND_CAUSAL_EDGE
  changes: Reverted the motive-force edge from contributes to back to enables/RO:0002327,
    issue 334 review. biolink defines contributes to as holding where one entity contributes
    to the occurrence or GENERATION of the other. A motive force does not generate
    the motor or machinery - it powers rotation, which is what the edge description
    says. That is the same energy-powers-a-machine idiom this work deferred for molecular_oxygen
    and cytoplasmic_na, so deferring it here too is the consistent call. The edge
    stays baselined under issue 334 until it is modelled as an input to the machine
    or pointed at the rotation process, either of which is range-correct.
  llm_assisted: true
