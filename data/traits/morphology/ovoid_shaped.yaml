identifier: METPO:1000677
label: ovoid shaped
definition: A cell shape in which an organism has an oval morphology, rounded at both
  ends with one end often slightly broader than the other.
definition_source: DOI:10.1016/j.cub.2021.04.041
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
