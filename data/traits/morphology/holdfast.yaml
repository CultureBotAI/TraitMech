identifier: traitmech:000184
label: holdfast
definition: A morphology trait in which a bacterial cell produces a localized polar
  adhesive matrix called a holdfast that mediates permanent attachment to surfaces.
definition_source: DOI:10.1128/jb.00276-19
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: holdfast adhesin
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/jb.00276-19
evidence:
- reference: DOI:10.1128/jb.00276-19
  snippet: Caulobacter crescentus synthesizes a polysaccharide-based adhesin known
    as the holdfast at one of its cell poles, which enables tight attachment to exogenous
    surfaces.
  notes: Hershey et al. support holdfast as a Caulobacter polar polysaccharide-based
    adhesin mediating tight surface attachment.
- reference: DOI:10.1128/jb.00276-19
  snippet: Glucose, 3-O-methylglucose, mannose, N-acetylglucosamine, and xylose were
    detected in our extracts.
  notes: The compositional analysis supports the holdfast matrix as a bacterial polysaccharide-rich
    adhesive.
- reference: DOI:10.1128/jb.00273-22
  snippet: Species of the Caulobacterales produce a specialized polar adhesin, holdfast,
    which is required for permanent attachment to surfaces.
  notes: Chepkwony et al. support holdfast as a specialized polar Caulobacterales
    adhesin required for permanent attachment.
- reference: DOI:10.1128/jb.181.4.1118-1125.1999
  snippet: Attachment to surfaces by the prosthecate bacterium Caulobacter crescentus
    is mediated by an adhesive organelle, the holdfast, found at the tip of the stalk.
    Indirect evidence suggested that the holdfast first appears at the swarmer pole
    of the predivisional cell. We used fluorescently labeled lectin and transmission
    electron microscopy to detect the holdfast in different cell types. While the
    holdfast was readily detectable in stalked cells and at the stalked poles of predivisional
    cells, we were unable to detect the holdfast in swarmer cells or at the flagellated
    poles of predivisional cells. This suggests that exposure of the holdfast to the
    outside of the cell occurs during the differentiation of swarmer to stalked cells.
    To investigate the timing of holdfast synthesis and exposure to the outside of
    the cell, we have examined the regulation of a holdfast attachment gene, hfaA.
    The hfaA gene is part of a cluster of four genes (hfaABDC), identified in strain
    CB2A and involved in attachment of the holdfast to the polar region of the cell.
    We have identified the hfaA gene in the synchronizable C. crescentus strain CB15.
  notes: Janakiraman and Brun identified and characterized the Caulobacter vibrioides
    (C. crescentus) strain CB15 holdfast attachment gene hfaA (UniProtKB:P27342) required
    for anchoring the polar holdfast adhesin to the stalk tip.
