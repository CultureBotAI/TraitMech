      snippet: complex interaction between the cell cylinder and the internal periplasmic
        flagella
      notes: Supports a physical interaction between flagella and cell cylinder.
    predicate_id: biolink:interacts_with
  - subject: periplasmic_flagella
    predicate: confers
    object: flat_wave_morphology
    description: Periplasmic flagella provide a skeletal function that confers flat-wave
      morphology.
    evidence:
    - reference: DOI:10.1073/pnas.200221797
      snippet: have a skeletal function
      notes: Supports periplasmic flagella as morphology-shaping structures.
  - subject: flat_wave_morphology
    predicate: produces
    object: spirochete_shaped_trait
    description: Flat-wave or helical deformation produces spirochete morphology.
    evidence:
