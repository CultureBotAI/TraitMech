  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1073/pnas.200221797
  snippet: periplasmic flagella ... confer in part its flat-wave morphology
  notes: Supports spirochete morphology as a cell-cylinder and periplasmic-flagella
    interaction.
causal_graphs:
