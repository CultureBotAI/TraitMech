identifier: METPO:1000695
label: tailed shaped
definition: A cell shape in which an organism has an elongated polar appendage or
  stalk extending from the cell body.
definition_source: DOI:10.1146/annurev.micro.061705.103240
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000666
synonyms:
- synonym_text: tailed
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.061705.103240
  snippet: prosthecate bacteria
  notes: Prosthecate-bacteria review supports tailed/stalked cell morphology in Caulobacter
    and related lineages.
- reference: DOI:10.1146/annurev-cellbio-101011-155745
  snippet: polar growth
  notes: Cell-shape review supports unipolar peptidoglycan growth as the basis for
    stalk-like polar appendages.
causal_graphs:
- graph_id: tailed_shaped_polar_stalk_growth
  title: Tailed-shape polar stalk extension
  description: DOI-backed graph linking unipolar peptidoglycan growth and stalk outgrowth
    to tailed cell morphology.
  nodes:
  - node_id: tailed_shaped_trait
    label: tailed shaped
    node_type: TRAIT
    grounding: METPO:1000695
    description: Cell body bearing an elongated polar appendage or stalk.
  - node_id: unipolar_pg_growth
    label: unipolar peptidoglycan growth
    node_type: BIOLOGICAL_PROCESS
    description: Polar wall synthesis localized at a single cell pole.
  - node_id: stalk_outgrowth
    label: stalk outgrowth
    node_type: BIOLOGICAL_PROCESS
    description: Extension of a narrow cytoplasmic stalk from one pole.
  - node_id: polar_appendage
    label: polar appendage
    node_type: BIOLOGICAL_PROCESS
    description: Resulting elongated polar structure.
  - node_id: bactofilin_polymers
    label: bactofilin polymers
    node_type: GENE_OR_PROTEIN
    description: Cytoskeletal scaffold polymers that organize polar stalk synthesis.
  - node_id: stalk_base
    label: stalk base
    node_type: CELLULAR_LOCALIZATION
    description: The cell-pole site where stalk synthesis is initiated and confined.
  - node_id: pg_biosynthesis_at_stalk_base
    label: peptidoglycan biosynthesis at stalk base
    node_type: BIOLOGICAL_PROCESS
    description: Cell wall synthesis spatially restricted to the stalk base.
  - node_id: cell_wall_synthase
    label: cell wall synthase
    node_type: GENE_OR_PROTEIN
    description: Peptidoglycan synthase recruited to extend the stalk.
  - node_id: mreb
    label: MreB
    node_type: GENE_OR_PROTEIN
    description: Bacterial actin homolog directing cell-wall synthesis for stalk formation.
  - node_id: roda
    label: RodA
    node_type: GENE_OR_PROTEIN
    description: SEDS peptidoglycan polymerase required for stalk elongation.
    grounding: UniProtKB:A0A0H2X1V4
  - node_id: phosphate_starvation
    label: phosphate starvation
    node_type: ENVIRONMENTAL_FACTOR
    description: Phosphate-limited growth condition that induces stalk elongation.
  edges:
  - subject: unipolar_pg_growth
    predicate: regulates
    object: stalk_outgrowth
    description: Unipolar PG growth at the same cell pole drives stalk extension.
    evidence:
    - reference: DOI:10.1146/annurev.micro.061705.103240
      snippet: prosthecate bacteria
      notes: Supports polar wall growth as the mechanism extending the stalk.
    predicate_id: RO:0002211
  - subject: stalk_outgrowth
    predicate: produces
    object: polar_appendage
    description: Stalk outgrowth produces an elongated polar appendage.
    evidence:
    - reference: DOI:10.1146/annurev.micro.061705.103240
      snippet: prosthecate bacteria
      notes: Supports stalk extension as a prosthecate-cell feature.
    predicate_id: METPO:2000202
  - subject: polar_appendage
    predicate: manifests as
    object: tailed_shaped_trait
    description: A polar appendage manifests the tailed-shaped trait.
    evidence:
    - reference: DOI:10.1146/annurev.micro.061705.103240
      snippet: prosthecate bacteria
      notes: Supports the trait endpoint.
    predicate_id: METPO:2007400
  - subject: bactofilin_polymers
    predicate: localizes to
    object: stalk_base
    description: Bactofilin polymers localize to the stalk base to direct proper stalk
      formation.
    evidence:
    - reference: DOI:10.7554/eLife.86577
      notes: In C. crescentus and A. biprosthecum bactofilin polymers localize to
        the stalk base to direct proper stalk formation.
    predicate_id: biolink:located_in
  - subject: bactofilin_polymers
    predicate: regulates
    object: pg_biosynthesis_at_stalk_base
    description: Bactofilins limit peptidoglycan biosynthesis to the stalk base, confining
      wall growth spatially.
    evidence:
    - reference: DOI:10.7554/eLife.86577
      notes: Required to efficiently initiate stalk formation and limit peptidoglycan
        biosynthesis to the stalk base.
    predicate_id: RO:0002211
  - subject: bactofilin_polymers
    predicate: recruits
    object: cell_wall_synthase
    description: Bactofilins recruit a cell wall synthase that contributes to stalk
      elongation.
    evidence:
    - reference: DOI:10.7554/eLife.86577
      notes: In C. crescentus, they recruit a cell wall synthase that contributes
        to stalk elongation.
  - subject: cell_wall_synthase
    predicate: positively regulates
    object: stalk_outgrowth
    description: The recruited cell wall synthase contributes to stalk elongation.
    evidence:
    - reference: DOI:10.7554/eLife.86577
      notes: Recruited cell wall synthase contributes to stalk elongation.
    predicate_id: RO:0002213
  - subject: mreb
    predicate: required for
    object: stalk_outgrowth
    description: MreB is necessary for stalk formation; depletion causes a stalk elongation
      defect.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: MreB and RodA are necessary for stalk formation, as depletion of either
        protein results in a stalk elongation defect.
  - subject: roda
    predicate: required for
    object: stalk_outgrowth
    description: RodA (SEDS PG polymerase) is necessary for stalk formation; depletion
      causes a stalk elongation defect.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: MreB and RodA are necessary for stalk formation, as depletion of either
        protein results in a stalk elongation defect.
  - subject: phosphate_starvation
    predicate: induces
    object: stalk_outgrowth
    description: Phosphate starvation induces elongated stalks.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: Cells starved of phosphate grow elongated stalks.
