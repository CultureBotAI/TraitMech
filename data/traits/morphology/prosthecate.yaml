identifier: traitmech:000065
label: prosthecate
definition: A morphology trait in which the cell bears one or more prosthecae — tubular
  extensions of the cell envelope (stalks) — that increase nutrient-uptake surface
  area or mediate attachment, as in Caulobacter.
definition_source: DOI:10.1111/j.1365-2958.2007.05633.x
trait_category: MORPHOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: stalked
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1111/j.1365-2958.2007.05633.x
- synonym_text: prostheca
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/MMBR.00040-09
evidence:
- reference: DOI:10.1111/j.1365-2958.2007.05633.x
  notes: Wagner & Brun describe the Caulobacter stalk (prostheca) as a cell-envelope
    extension and a specialized form of cell elongation aiding nutrient uptake.
- reference: DOI:10.1128/MMBR.00040-09
  notes: Curtis & Brun's review of Caulobacter development supports the stalk as a
    regulated developmental appendage.
canonical_examples:
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  note: Model stalked (prosthecate) bacterium and asymmetric-division paradigm; classic
    strain CB15, long called Caulobacter crescentus.
  reference: PMID:16980487
causal_graphs:
- graph_id: prosthecate_stalk_nutrient_uptake
  title: Prostheca / stalk extends nutrient-uptake surface
  description: Evidence-backed causal sketch linking developmental stalk extension
    to increased uptake surface area and substrate attachment.
  nodes:
  - node_id: prosthecate_trait
    label: prosthecate
    node_type: TRAIT
    grounding: traitmech:000065
    description: Possession of one or more cell-envelope-extension stalks (prosthecae).
  - node_id: stalk_extension
    label: stalk extension
    node_type: BIOLOGICAL_PROCESS
    description: Polar extension of cell envelope producing the prostheca.
  - node_id: uptake_surface_area
    label: nutrient-uptake surface area
    node_type: QUALITY
    description: Effective transport surface available for nutrient uptake.
  - node_id: mreb
    label: MreB
    node_type: GENE_OR_PROTEIN
    description: Bacterial actin homolog cytoskeletal protein.
  - node_id: roda
    label: RodA
    node_type: GENE_OR_PROTEIN
    description: SEDS family cell-wall synthesis protein.
    grounding: UniProtKB:A0A0H2X1V4
  - node_id: bactofilins
    label: bactofilins
    node_type: GENE_OR_PROTEIN
    description: Cytoskeletal proteins that localize to zones of active cell wall
      growth.
  - node_id: cell_wall_growth_zone
    label: zone of active cell wall growth
    node_type: CELLULAR_LOCALIZATION
    description: Subcellular site of active peptidoglycan synthesis.
  - node_id: stalk_crossbands
    label: stalk crossbands
    node_type: CELLULAR_LOCALIZATION
    description: Periodic protein bands traversing the stalk lumen.
  - node_id: stpabcd_complex
    label: StpABCD complex
    node_type: GENE_OR_PROTEIN
    description: Four-protein complex (StpA, StpB, StpC, StpD) forming stalk crossbands.
  - node_id: stalk_diffusion
    label: diffusion along stalk
    node_type: BIOLOGICAL_PROCESS
    description: Molecular diffusion along the length of the stalk lumen.
  edges:
  - subject: stalk_extension
    predicate: confers
    object: prosthecate_trait
    description: Regulated stalk-extension elongation realizes the prosthecate phenotype.
    evidence:
    - reference: DOI:10.1128/MMBR.00040-09
      notes: Curtis & Brun review the Caulobacter stalk as a regulated developmental
        appendage.
    predicate_id: METPO:2007700
  - subject: prosthecate_trait
    predicate: contributes to
    object: uptake_surface_area
    description: Stalks expand nutrient-uptake surface area, aiding oligotrophic growth.
    evidence:
    - reference: DOI:10.1111/j.1365-2958.2007.05633.x
      notes: Wagner & Brun describe the Caulobacter stalk as a cell-envelope extension
        increasing nutrient-uptake surface area.
    predicate_id: RO:0002326
  - subject: mreb
    predicate: is required for
    object: stalk_extension
    description: MreB is necessary for stalk formation; depletion causes a stalk elongation
      defect.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: 'Barrows & Goley: MreB and RodA are necessary for stalk formation, as
        depletion of either protein results in a stalk elongation defect.'
  - subject: roda
    predicate: is required for
    object: stalk_extension
    description: RodA is necessary for stalk formation; depletion causes a stalk elongation
      defect.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: 'Barrows & Goley: depletion of either protein (MreB or RodA) results
        in a stalk elongation defect.'
  - subject: bactofilins
    predicate: localizes to
    object: cell_wall_growth_zone
    description: Many bactofilins localize to zones of active cell wall growth, supporting
      stalk biogenesis.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1010788
      notes: 'Richter et al.: many bactofilins localize to zones of active cell wall
        growth.'
    predicate_id: biolink:located_in
  - subject: stpabcd_complex
    predicate: composes
    object: stalk_crossbands
    description: The four-protein StpABCD complex composes the stalk crossbands.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: 'Barrows & Goley: crossbands are composed of a complex of four proteins,
        StpABCD.'
  - subject: stalk_crossbands
    predicate: limits
    object: stalk_diffusion
    description: Crossbands limit diffusion along the length of the stalk, compartmentalizing
      it.
    evidence:
    - reference: DOI:10.1128/jb.00384-22
      notes: 'Barrows & Goley: crossbands that limit diffusion along the length of
        the stalk.'
    predicate_id: RO:0002212
  - subject: prosthecate_trait
    predicate: facilitates
    object: uptake_surface_area
    description: Prosthecae/stalks facilitate nutrient uptake.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1010788
      notes: 'Richter et al.: prosthecae/stalks facilitate nutrient uptake.'
