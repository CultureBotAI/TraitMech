identifier: traitmech:000065
label: prosthecate
definition: A morphology trait in which the cell bears one or more prosthecae —
  tubular extensions of the cell envelope (stalks) — that increase nutrient-uptake
  surface area or mediate attachment, as in Caulobacter.
definition_source: DOI:10.1111/j.1365-2958.2007.05633.x
trait_category: MORPHOLOGY
term_kind: CLASS
