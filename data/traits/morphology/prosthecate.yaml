  notes: Wagner & Brun describe the Caulobacter stalk (prostheca) as a cell-envelope
    extension and a specialized form of cell elongation aiding nutrient uptake.
- reference: DOI:10.1128/MMBR.00040-09
  notes: Curtis & Brun's review of Caulobacter development supports the stalk as a
    regulated developmental appendage.
