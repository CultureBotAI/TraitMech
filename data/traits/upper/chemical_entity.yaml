  snippet: ChEBI is a freely available dictionary of molecular entities
  notes: ChEBI's 'chemical entity' (CHEBI:24431) is the canonical upper-root for the
    chemical objects participating in METPO chemical-use predicates and is the recommended
    grounding for METPO:1000526.
- reference: DOI:10.3233/AO-220262
  snippet: BFO is a genuine top-level ontology
  notes: Supports METPO:1000186 (material entity) as the BFO-aligned parent of chemical
    entity.
