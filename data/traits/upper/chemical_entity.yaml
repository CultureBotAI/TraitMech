identifier: METPO:1000526
label: chemical entity
definition: A material entity that is a physical entity of interest in chemistry,
  including molecular entities, parts thereof, and chemical substances. Used as the
  range class for the majority of METPO chemical-use OBJECT_PROPERTYs (uses_as_carbon_source,
  uses_as_electron_donor, ferments, oxidizes, etc.) so that organism-to-chemical assertions
  resolve to a curated chemical class.
definition_source: DOI:10.1093/nar/gkv1031
trait_category: UPPER
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
