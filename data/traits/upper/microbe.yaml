identifier: METPO:1000525
label: microbe
definition: A material entity that is too small to be viewed by the unaided eye,
  typically requiring microscopy for observation. Used as the domain class for
  METPO organism-to-X object properties so that organism-level assertions can
  be expressed as `<microbe-instance> <METPO predicate> <object-class>`.
definition_source: PMID:21413255
trait_category: UPPER
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
