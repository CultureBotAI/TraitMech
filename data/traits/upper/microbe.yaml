evidence:
- reference: PMID:21413255
  snippet: microorganisms
  notes: Medical Microbiology chapter supports 'microbe' (microorganism) as
    the standard high-level class for the bacteria, archaea, and microbial
    eukaryotes covered by this knowledge base.
- reference: DOI:10.3233/AO-220262
  snippet: BFO is a genuine top-level ontology
  notes: Supports METPO:1000186 (material entity) as the BFO-aligned parent.
curation_history:
