- CHEBI:23357
evidence:
- reference: DOI:10.1093/nar/gku1003
  snippet: ENZYME nomenclature
  notes: ENZYME / EC nomenclature provides the canonical external vocabulary
    for the catalytic activities that satisfy this class; GO:0003824
    (catalytic activity) is the matching upper class in the Gene Ontology.
- reference: DOI:10.1093/nar/gkv1031
  snippet: ChEBI is a freely available dictionary of molecular entities
  notes: CHEBI:23357 ('catalyst') is the ChEBI role concept that an enzyme
    bears when participating in a reaction; included as a secondary xref.
