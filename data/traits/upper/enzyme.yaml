identifier: METPO:1000527
label: enzyme
definition: A biological macromolecule (typically a protein) that catalyses a
  specific biochemical reaction. Used as the range class for METPO
  enzyme-activity OBJECT_PROPERTYs (shows_activity_of, enzyme_activity_analyzed)
  so that organism-to-activity assertions resolve to a curated activity class.
  In practice the object can be either an enzyme protein class or a catalytic
  activity (GO:0003824 and descendants); both are subsumed semantically by
  this class for the purposes of METPO composition.
definition_source: DOI:10.1093/nar/gku1003
trait_category: UPPER
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
