identifier: METPO:1000449
label: temperature range low
definition: A temperature range phenotype in which the growth-supporting ambient temperature
  range spans approximately 10–22 °C, characteristic of psychrophilic or psychrotolerant
  physiology.
definition_source: DOI:10.1038/sj.embor.7400662
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Psychrophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Psychrotolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_10_to_22
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/sj.embor.7400662
  snippet: decreased membrane fluidity
  notes: Psychrophile review supports cool-temperature membrane and enzyme adaptation
    as the basis of growth in the 10–22 °C range.
causal_graphs:
- graph_id: temperature_range_low_psychrotolerant
  title: Temperature-range-low psychrotolerant range
  description: DOI-backed graph linking psychrotolerant adaptation to a temperature
    growth range of approximately 10–22 °C.
  nodes:
  - node_id: temperature_range_low_trait
    label: temperature range low
    node_type: TRAIT
    grounding: METPO:1000449
    description: Temperature growth-supporting range approximately 10–22 °C.
  - node_id: temperature_range
    label: temperature range
    node_type: TRAIT
    grounding: METPO:1000306
    description: Span of ambient temperatures supporting growth.
  - node_id: psychrotolerant_adaptation
    label: psychrotolerant adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Mild cold-adaptation of membrane and enzyme function sustaining growth
      at cool temperatures.
  - node_id: low_temperature
    label: low temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: Cool ambient temperature in the approximately 10-22 C range.
    grounding: PATO:0001306
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical fluidity state of the cytoplasmic membrane lipid bilayer.
    grounding: METPO:1007505
  - node_id: fatty_acid_desaturase_activity
    label: fatty acid desaturase activity
    node_type: MOLECULAR_FUNCTION
    description: Enzymatic introduction of double bonds into fatty acyl chains (fatty
      acid desaturases, EC 1.14.19.-).
  - node_id: unsaturated_fatty_acid_proportion
    label: unsaturated fatty acid proportion
    node_type: QUALITY
    description: Relative abundance of unsaturated fatty acids in membrane lipids.
  - node_id: cold_shock_proteins
    label: cold-shock proteins
    node_type: GENE_OR_PROTEIN
    description: CspA/CspC family cold-shock proteins acting as RNA chaperones.
  - node_id: rna_chaperone_activity
    label: RNA chaperone activity
    node_type: MOLECULAR_FUNCTION
    description: Resolution of inhibitory RNA secondary structures supporting translation
      at low temperature.
  - node_id: compatible_solutes
    label: compatible solutes
    node_type: CHEMICAL
    description: Glycine betaine, trehalose and glycerol accumulated as cryoprotectants.
    grounding: CHEBI:25728
  - node_id: cryoprotection
    label: cryoprotection
    node_type: BIOLOGICAL_PROCESS
    description: Stabilization of proteins and membranes and protection against cold/freezing
      damage.
  - node_id: molecular_chaperones
    label: GroEL/DnaK molecular chaperones
    node_type: GENE_OR_PROTEIN
    description: GroEL and DnaK chaperones assisting protein folding under temperature
      stress.
  - node_id: protein_misfolding
    label: protein misfolding
    node_type: BIOLOGICAL_PROCESS
    description: Cold-denaturation and misfolding of proteins at low temperature.
  edges:
  - subject: psychrotolerant_adaptation
    predicate: confers
    object: temperature_range_low_trait
    description: Psychrotolerant adaptation enables growth across 10–22 °C.
    evidence:
    - reference: DOI:10.1038/sj.embor.7400662
      snippet: Cold-shock proteins have also been described
      notes: Supports cold-shock and acclimation responses as the cool-range mechanism.
    predicate_id: METPO:2007700
  - subject: temperature_range_low_trait
    predicate: is a
    object: temperature_range
    description: Temperature range low is a quantitative bin of the temperature-range
      phenotype.
    evidence:
    - reference: DOI:10.1038/sj.embor.7400662
      snippet: growing well at temperatures around the freezing point of water
      notes: Supports the 10–22 °C range as a value within the temperature-range distribution.
    predicate_id: rdfs:subClassOf
  - subject: low_temperature
    predicate: decreases
    object: membrane_fluidity
    description: Low temperature reduces membrane fluidity, triggering compensatory
      lipid remodeling.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Cold reduces membrane fluidity; changes in membrane physical state mediate
        cold sensing.
    predicate_id: RO:0002212
  - subject: fatty_acid_desaturase_activity
    predicate: increases
    object: membrane_fluidity
    description: Fatty acid desaturase activity raises unsaturation to restore membrane
      fluidity at low temperature.
    evidence:
    - reference: DOI:10.37256/amtt.5220244537
      notes: Genes for desaturation are upregulated; desaturases enhance membrane
        fluidity via unsaturated/PUFA synthesis.
    predicate_id: RO:0002213
  - subject: low_temperature
    predicate: increases
    object: unsaturated_fatty_acid_proportion
    description: Growth at low temperature increases the proportion of unsaturated
      fatty acids in membrane lipids.
    evidence:
    - reference: DOI:10.1128/aem.01928-22
      notes: Proportion of unsaturated fatty acids was higher in strains cultured
        at low temperatures while long-chain SFAs decreased.
    predicate_id: RO:0002213
  - subject: cold_shock_proteins
    predicate: enables
    object: rna_chaperone_activity
    description: Cold-shock proteins act as RNA chaperones supporting translation
      at low temperature.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1197797
      notes: Cold shock proteins (Csps) can function as RNA chaperones, supporting
        translation in the cold.
    predicate_id: RO:0002327
  - subject: compatible_solutes
    predicate: provides
    object: cryoprotection
    description: Compatible solutes provide cryoprotection by stabilizing membranes
      and proteins and lowering freezing point.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1197797
      notes: Compatible osmolytes prevent cell shrinkage, lower freezing point, scavenge
        radicals, and stabilize membranes/proteins.
  - subject: molecular_chaperones
    predicate: prevents
    object: protein_misfolding
    description: GroEL/DnaK chaperones prevent cold-denaturation and protein misfolding
      at low temperature.
    evidence:
    - reference: DOI:10.37256/amtt.5220244537
      notes: Chaperones are upregulated at low temperatures to prevent cold-denaturation
        and misfolding.
    predicate_id: RO:0002212
