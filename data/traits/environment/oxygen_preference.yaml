  action: RETYPE_CAUSAL_NODE
  changes: Retyped node oxygen_tolerance from CAPACITY to TRAIT and grounded it METPO:1000609.
    Issue 352. 'Capacity of a cell to survive exposure to molecular oxygen' is aerotolerance.
    Distinct from all five phenotype nodes in the graph (METPO:1000601/2/3/4/612).
    NOTE this is the organism-scoped sense; carboxydotrophic.yaml's same-named node
    reads 'Ability of an ENZYME to function in the presence of O2' and is correctly
    NOT a trait (#353). Every TRAIT node in the corpus is grounded, so requiring a
