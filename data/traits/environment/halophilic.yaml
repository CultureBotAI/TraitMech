    gene_symbols:
    - ectA
    - ectB
    - ectC
    operon: ectABC
  - node_id: ectoine
    label: ectoine
    node_type: CHEMICAL
    description: Compatible solute synthesized de novo from L-aspartic acid.
    grounding: CHEBI:27592
  - node_id: l_aspartic_acid
    label: L-aspartic acid
    node_type: CHEMICAL
    description: Precursor metabolite for de novo ectoine biosynthesis.
  edges:
  - subject: high_salt_environment
    predicate: selects for
    object: halophilic_trait
    description: Halophilic microorganisms are adapted to growth in high-salt environments.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: Hypersaline environments ... inhabited by halophilic
      notes: Review supports hypersaline habitats as the environmental context for
        halophily.
    predicate_id: METPO:2007401
  - subject: sodium_chloride
    predicate: causes
    object: osmotic_stress
    description: Elevated NaCl creates osmotic pressure that requires cellular adaptation.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: ways they cope with the high salt concentrations
      notes: Review frames halophily around coping with high environmental salt.
    predicate_id: biolink:causes
  - subject: compatible_solutes
    predicate: mitigates
    object: osmotic_stress
    description: Compatible solutes are one major osmoadaptation mechanism in halophilic
