    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: synthesize organic osmotic solutes
      notes: Supports organic compatible-solute accumulation as an osmotic adaptation
        mechanism.
    predicate_id: METPO:2007407
  - subject: salt_in_strategy
    predicate: mitigates
    object: osmotic_stress
    description: Salt-in ion accumulation is an alternative osmoadaptation strategy.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: KCl accumulating Halobacterium salinarum
      notes: Supports intracellular KCl accumulation as a high-salt adaptation.
    predicate_id: METPO:2007407
  - subject: compatible_solutes
    predicate: contributes to
    object: halophilic_trait
    description: Compatible-solute accumulation supports growth under high salinity.
    evidence:
    - reference: DOI:10.1371/journal.pone.0168818
      snippet: allows microorganisms to cope with high salinities
      notes: Halomonas elongata study supports compatible solutes as a mechanism enabling
        halophilic growth.
    predicate_id: RO:0002326
  - subject: na_h_antiporter
    predicate: expels
    object: sodium_ion
    description: Sodium is excluded from the cytoplasm with the help of an Na+/H+
      antiporter.
    evidence:
    - reference: DOI:10.3390/microorganisms12081738
      notes: sodium is excluded from the cytoplasm with the help of an Na+/H+ antiporter
  - subject: k_uniport
    predicate: imports
    object: potassium_ion
    description: Potassium enters the cell through a uniport system during salt-in
      osmoadaptation.
    evidence:
    - reference: DOI:10.3390/microorganisms12081738
      notes: Potassium enters the cell through a uniport system
    predicate_id: METPO:2007805
  - subject: salt_in_strategy
    predicate: associated with
    object: acidified_proteome
    description: Organisms employing the salt-in strategy exhibit an acidified proteome.
    evidence:
    - reference: DOI:10.3390/microorganisms12081738
      notes: microorganisms employing this strategy exhibit an acidified proteome
    predicate_id: biolink:associated_with
  - subject: sodium_chloride
    predicate: induces
    object: oxidative_stress
    description: NaCl shock induces oxidative stress in addition to osmotic stress.
    evidence:
    - reference: DOI:10.1186/s12934-024-02358-5
      notes: NaCl shock induced two major stresses, namely osmotic stress and oxidative
        stress
  - subject: ectABC_operon
    predicate: biosynthesizes
    object: ectoine
    description: The conserved ectABC operon performs de novo biosynthesis of ectoine.
    evidence:
    - reference: DOI:10.1128/aem.00479-23
      notes: Biosynthesis of ectoine is de novo from L-aspartic acid, performed by
        the conserved operon ectABC
  - subject: l_aspartic_acid
    predicate: is precursor of
    object: ectoine
    description: Ectoine is biosynthesized de novo from L-aspartic acid.
    evidence:
    - reference: DOI:10.1128/aem.00479-23
      notes: Biosynthesis of ectoine is de novo from L-aspartic acid
  - subject: ectoine
    predicate: is a
    object: compatible_solutes
    description: Ectoine is a major organic compatible solute used in osmoadaptation.
    evidence:
    - reference: DOI:10.1128/aem.00479-23
      notes: Ectoine is a canonical compatible solute synthesized via the ectABC operon.
    predicate_id: rdfs:subClassOf
