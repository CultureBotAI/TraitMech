identifier: METPO:1000620
label: halophilic
definition: A halophily preference in which an organism requires high concentrations
  of salt for growth and survival.
definition_source: PMID:19329623
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000629
evidence:
- reference: PMID:19329623
  snippet: Salinicoccus albus sp. nov., a halophilic bacterium from a salt mine
  notes: 'Organism example: Salinicoccus albus is described as halophilic.'
canonical_examples:
- taxon_id: NCBITaxon:2242
  taxon_label: Halobacterium salinarum
  note: extreme halophile
  reference: PMID:31797576
- taxon_id: NCBITaxon:2746
  taxon_label: Halomonas elongata
  note: moderate halophile
  reference: PMID:20849449
causal_graphs:
- graph_id: halophilic_osmoadaptation
  title: Halophilic osmoadaptation mechanism
  description: Evidence-backed causal sketch linking halophilic growth to high-salt
    environments and osmotic adaptation strategies.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: halophilic_trait
    label: halophilic
    node_type: TRAIT
    grounding: METPO:1000620
    description: Requires high salt concentrations for growth and survival.
  - node_id: high_salt_environment
    label: high-salt environment
    node_type: ENVIRONMENTAL_FACTOR
    description: Hypersaline or elevated NaCl condition.
    grounding: ENVO:01001040
  - node_id: sodium_chloride
    label: sodium chloride
    node_type: CHEMICAL
    grounding: CHEBI:26710
    description: NaCl as the dominant salt exposure in many halophilic habitats.
  - node_id: osmotic_stress
    label: osmotic stress
    node_type: BIOLOGICAL_PROCESS
    description: Cellular water and turgor stress caused by external salinity.
    grounding: GO:0006970
  - node_id: compatible_solutes
    label: compatible solutes
    node_type: CHEMICAL
    description: Organic osmolytes such as ectoine and glycine betaine.
    grounding: CHEBI:25728
  - node_id: salt_in_strategy
    label: salt-in strategy
    node_type: BIOLOGICAL_PROCESS
    description: Intracellular inorganic ion accumulation for osmotic balance.
    grounding: METPO:1007720
  - node_id: na_h_antiporter
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: Na+/H+ antiporter
    node_type: GENE_OR_PROTEIN
    description: Membrane antiporter that exports sodium from the cytoplasm in exchange
      for protons.
  - node_id: sodium_ion
    label: sodium ion
    node_type: CHEMICAL
    description: Na+ cation that must be excluded from the cytoplasm.
    grounding: CHEBI:29101
  - node_id: k_uniport
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: K+ uniport system
    node_type: GENE_OR_PROTEIN
    description: Uniport transport system that imports potassium into the cell.
  - node_id: potassium_ion
    label: potassium ion
    node_type: CHEMICAL
    description: K+ cation accumulated intracellularly during salt-in osmoadaptation.
    grounding: CHEBI:29103
  - node_id: acidified_proteome
    label: acidified proteome
    node_type: STATE
    description: Proteome enriched in acidic residues, characteristic of salt-in adapted
      organisms.
  - node_id: oxidative_stress
    label: oxidative stress
    node_type: BIOLOGICAL_PROCESS
    description: Reactive-oxygen-mediated cellular stress induced by NaCl shock.
  - node_id: ectABC_operon
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: EctABC ectoine-biosynthesis enzyme module
    node_type: GENE_OR_PROTEIN
    description: Evolutionarily conserved operon encoding the ectoine biosynthesis
