identifier: METPO:1000621
label: haloalkaliphilic
definition: A halophily preference in which an organism requires both high salt concentrations
  and alkaline pH for optimal growth.
definition_source: PMID:17203963
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
