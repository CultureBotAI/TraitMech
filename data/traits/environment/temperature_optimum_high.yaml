identifier: METPO:1000447
label: temperature optimum high
definition: A temperature optimum phenotype with the best-growth ambient temperature
  above approximately 40 °C, characteristic of thermophilic physiology.
definition_source: DOI:10.1016/s0300-9629(97)00003-0
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000304
synonyms:
- synonym_text: Thermophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TO_>40
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/s0300-9629(97)00003-0
  snippet: adapted to environments of high temperature
  notes: Thermophile-adaptation review supports the >40 °C optimum as the thermophile
    category.
- reference: DOI:10.1128/MMBR.65.1.1-43.2001
  snippet: resistant to irreversible inactivation at high temperatures
  notes: Thermostable-protein review supports thermostable proteins as the mechanism
    enabling thermophile optima.
canonical_examples:
- taxon_id: NCBITaxon:43080
  taxon_label: Saccharolobus islandicus
  reference: DOI:10.3389/fmicb.2023.1219779
  note: Thermoacidophilic archaeon whose optimal growth temperature is reported as
    76 degrees C, the one explicitly stated optimum in this trait's research artifact;
    the multi-omics study contrasts that optimum against 66 degrees C cold stress.
