identifier: METPO:1000531
label: pH phenotype with numerical limits
definition: A phenotype characterized by specific pH values or ranges that define
  growth or activity limits.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: external pH
  notes: pH-homeostasis review supports external pH as the quantitative axis underlying
    acidophile, neutrophile, and alkaliphile classification.
- reference: DOI:10.1016/j.tim.2007.02.005
  snippet: proton motive force
  notes: pH-homeostasis review supports the proton motive force across the cell envelope
    as the physical link between external pH and microbial growth physiology.
causal_graphs:
- graph_id: ph_phenotype_numerical_axis
  title: pH phenotype numerical-limits axis
  description: DOI-backed graph linking the external pH (H+ activity) axis to the
    three numerical-limit measurement types (optimum, range, delta) that together
    classify acidophile, neutrophile, and alkaliphile physiology.
  nodes:
  - node_id: ph_phenotype_trait
    label: pH phenotype with numerical limits
    node_type: TRAIT
    grounding: METPO:1000531
    description: Phenotype defined by a numerical external-pH descriptor.
  - node_id: external_ph_axis
    label: external pH axis
    node_type: ENVIRONMENTAL_FACTOR
    description: External proton activity (pH) as a continuous environmental variable.
  - node_id: ph_optimum
    label: pH optimum
    node_type: TRAIT
    grounding: METPO:1000331
    description: External pH supporting the most efficient growth.
  - node_id: ph_range
    label: pH range
    node_type: TRAIT
    grounding: METPO:1000332
    description: Span of external pH values supporting growth.
  - node_id: ph_delta
    label: pH delta
    node_type: TRAIT
    grounding: METPO:1000232
    description: Breadth (max − min) of the growth-supporting external pH range.
  - node_id: proton_motive_force
    label: proton motive force across cell envelope
    node_type: BIOLOGICAL_PROCESS
    description: Electrochemical proton gradient across the cell envelope linking
      external pH to bioenergetics.
  - node_id: f0f1_atpase
    label: F0F1-ATPase / ATP synthase
    node_type: GENE_OR_PROTEIN
    description: Membrane ATP synthase coupling proton motive force to ATP synthesis.
  - node_id: atp_synthesis_from_pmf
    label: ATP synthesis from proton motive force
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis of ATP driven by the transmembrane proton gradient.
  - node_id: na_h_antiporter
    label: Na+/H+ antiporter activity
    node_type: MOLECULAR_FUNCTION
    description: Cation/proton antiport activity regulating internal pH and PMF.
  - node_id: k_h_antiporter
    label: K+/H+ antiporter activity
    node_type: MOLECULAR_FUNCTION
    description: Potassium/proton antiport activity regulating internal pH and PMF.
  - node_id: internal_ph_pmf
    label: internal pH / proton motive force
    node_type: STATE
    description: Regulated cytoplasmic pH and proton motive force homeostatic set-point.
  - node_id: aa_decarboxylase_antiporter
    label: amino-acid decarboxylase + antiporter systems
    node_type: PATHWAY
    description: Decarboxylation-antiport cycles that consume cytoplasmic protons.
  - node_id: intracellular_proton
    label: intracellular H+
    node_type: CHEMICAL
    description: Cytoplasmic protons whose concentration sets internal pH.
  - node_id: phosphate_buffering
    label: cytoplasmic buffering by phosphate pools
    node_type: BIOLOGICAL_PROCESS
    description: Buffering of cytoplasmic protons by intracellular phosphate pools.
  - node_id: internal_ph
    label: internal pH
    node_type: STATE
    description: Cytoplasmic pH maintained by homeostatic mechanisms.
  edges:
  - subject: external_ph_axis
    predicate: defines
    object: ph_phenotype_trait
    description: External pH is the quantitative axis defining pH phenotypes.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: external pH
      notes: Supports external pH as the standard descriptor axis for microbial pH
        phenotypes.
    predicate_id: METPO:2007500
  - subject: ph_optimum
    predicate: is a
    object: ph_phenotype_trait
    description: pH optimum is a numerical-limit pH phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: cytoplasmic pH
      notes: Supports pH optimum as the external-pH set-point at which cytoplasmic
        pH homeostasis sustains maximal growth.
    predicate_id: rdfs:subClassOf
  - subject: ph_range
    predicate: is a
    object: ph_phenotype_trait
    description: pH range is a numerical-limit pH phenotype.
    evidence:
    - reference: DOI:10.1016/j.tim.2007.02.005
      snippet: proton motive force
      notes: Supports pH range as the span of external pH over which the proton motive
        force remains compatible with growth.
    predicate_id: rdfs:subClassOf
  - subject: ph_delta
    predicate: is a
    object: ph_phenotype_trait
    description: pH delta is a numerical-limit pH phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: pH homeostasis
      notes: Supports pH delta (range breadth) as a derived numerical descriptor reflecting
        pH-homeostasis flexibility.
    predicate_id: rdfs:subClassOf
  - subject: external_ph_axis
    predicate: determines
    object: proton_motive_force
    description: External pH determines the proton motive force across the cell envelope.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Neutralophilic bacteria maintain a relatively constant proton motive
        force across external pH ~5-8.
  - subject: f0f1_atpase
    predicate: enables
    object: atp_synthesis_from_pmf
    description: F0F1-ATPase couples the proton motive force to ATP synthesis.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: F0F1-ATP synthase typically uses 3-5 protons per ATP, linking PMF to
        ATP synthesis and pH homeostasis.
  - subject: na_h_antiporter
    predicate: regulates
    object: internal_ph_pmf
    description: Na+/H+ antiporter activity regulates internal pH and PMF.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Main regulators of internal pH/PMF include Na+/H+ and K+/H+ antiporters
        (general bacteria).
  - subject: k_h_antiporter
    predicate: regulates
    object: internal_ph_pmf
    description: K+/H+ antiporter activity regulates internal pH and PMF.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Main regulators of internal pH/PMF include Na+/H+ and K+/H+ antiporters
        (general bacteria).
  - subject: aa_decarboxylase_antiporter
    predicate: consumes
    object: intracellular_proton
    description: Amino-acid decarboxylase plus antiporter systems consume intracellular
      protons, raising internal pH.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Decarboxylation reaction consumes a proton, raising internal pH; the
        equivalent of 1 proton is pumped per molecule decarboxylated. Broad across
        amino-acid decarboxylase systems.
  - subject: phosphate_buffering
    predicate: stabilizes
    object: internal_ph
    description: Cytoplasmic phosphate pools buffer protons and stabilize internal
      pH.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Cytoplasmic buffering is important; L. lactis has ~100 mM organic/inorganic
        phosphates (general bacteria).
