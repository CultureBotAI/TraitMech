identifier: METPO:1000531
label: pH phenotype with numerical limits
definition: A phenotype characterized by specific pH values or ranges that define
  growth or activity limits.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: external pH
  notes: pH-homeostasis review supports external pH as the quantitative axis
    underlying acidophile, neutrophile, and alkaliphile classification.
- reference: DOI:10.1016/j.tim.2007.02.005
  snippet: proton motive force
  notes: pH-homeostasis review supports the proton motive force across the
    cell envelope as the physical link between external pH and microbial
    growth physiology.
