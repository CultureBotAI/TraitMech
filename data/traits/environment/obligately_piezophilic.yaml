identifier: traitmech:000002
label: obligately piezophilic
definition: A pressure growth preference in which an organism requires elevated hydrostatic
  pressure for growth and is unable to grow at atmospheric pressure (0.1 MPa).
definition_source: DOI:10.1038/srep27289
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000001
synonyms:
- synonym_text: obligate piezophile
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/srep27289
evidence:
- reference: DOI:10.1038/srep27289
  snippet: High hydrostatic pressure adaptive strategies in an obligate piezophile
    Pyrococcus yayanosii
  notes: 'Organism example: Pyrococcus yayanosii is an obligate piezophile that requires
    high hydrostatic pressure for growth.'
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: 'Organism example: Colwellia marinimaniae MTCD1 grows only at high pressure
    (80-140 MPa) and does not grow near atmospheric pressure.'
canonical_examples:
- taxon_id: NCBITaxon:1513592
  taxon_label: Colwellia marinimaniae
  note: Most piezophilic organism described; optimum ~120 MPa (Mariana Trench). Photobacterium
    profundum SS9 is the classic genetic model.
  reference: https://pubmed.ncbi.nlm.nih.gov/27902293/
causal_graphs:
- graph_id: obligate_piezophily_high_pressure_requirement
  title: 'Obligate piezophily: growth requires elevated hydrostatic pressure'
  description: Evidence-backed causal sketch linking obligate HHP adaptation to inability
    to grow at atmospheric pressure.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: obligate_piezophilic_trait
    label: obligately piezophilic
    node_type: TRAIT
    grounding: traitmech:000002
    description: Growth restricted to elevated hydrostatic pressures.
  - node_id: obligate_hhp
    label: obligate high hydrostatic pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Hydrostatic pressure level required for growth (no growth at 0.1
      MPa).
  - node_id: pressure_dependent_machinery
    label: pressure-dependent cellular machinery
    node_type: BIOLOGICAL_PROCESS
    description: Membrane, ribosome, and replication systems adapted only to HHP.
  - node_id: ambient_pressure_growth_failure
    label: inability to grow at ambient pressure (0.1 MPa)
    node_type: QUALITY
    description: Obligate piezophiles cannot grow at atmospheric pressure (0.1 MPa).
  - node_id: membrane_unsaturated_branched_lipids
    label: unsaturated/branched-chain membrane lipids
    node_type: CHEMICAL
    description: Membrane fatty acids with increased unsaturation/branching that maintain
      fluidity under HHP.
  - node_id: membrane_fluidity_maintenance
    label: maintenance of membrane fluidity under HHP
    node_type: BIOLOGICAL_PROCESS
    description: Homeoviscous adaptation preserving membrane fluidity at elevated
      hydrostatic pressure.
  edges:
  - subject: obligate_hhp
    predicate: causes
    object: obligate_piezophilic_trait
    description: HHP adaptation that no longer functions at 0.1 MPa makes high pressure
      obligatory for growth.
    evidence:
    - reference: DOI:10.1099/ijsem.0.001671
      snippet: grew at extremely high hydrostatic pressures, with a growth range of
        80-140 MPa
      notes: Verified against public Kusube et al. abstract text; Colwellia marinimaniae
        MTCD1 is retained as a hyperpiezophilic obligate-HHP exemplar.
    predicate_id: biolink:causes
  - subject: pressure_dependent_machinery
    predicate: confers
    object: obligate_piezophilic_trait
    description: Cellular machinery requiring HHP for function realizes the obligate-piezophile
      phenotype.
    evidence:
    - reference: DOI:10.1038/srep27289
      snippet: hydrostatic pressure-responsive genes involved in translation, chemotaxis,
        energy metabolism
      notes: Verified against the open Michoud and Jebbar abstract; the edge is kept
        as a broad cellular-machinery dependency in an obligate piezophile.
    predicate_id: METPO:2007700
  - subject: ambient_pressure_growth_failure
    predicate: manifests as
    object: obligate_piezophilic_trait
    description: Inability to grow at 0.1 MPa is the diagnostic pressure-growth failure
      state represented by obligate piezophily.
    evidence:
    - reference: DOI:10.1038/s41396-021-00930-0
      snippet: obligate piezophiles (or hyperpiezophiles) unable to grow at ambient
        pressure
      notes: Verified against public Scoma et al. text; the edge is reversed from
        ungrounded trait-to-quality wording to a grounded manifestation relation.
    predicate_id: METPO:2007400
  - subject: obligate_hhp
    predicate: increases
    object: membrane_unsaturated_branched_lipids
    description: Elevated hydrostatic pressure increases the requirement for and abundance
      of unsaturated/branched-chain membrane lipids.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      snippet: specific membrane lipids, such as those containing unsaturated and
        branched-chain fatty acids, rises with increasing HHP
      notes: Verified against the open Tamby et al. abstract; the edge is retained
        as a broad pressure-associated lipid adaptation, not a universal claim for
        all piezophiles.
    predicate_id: RO:0002213
  - subject: membrane_unsaturated_branched_lipids
    predicate: enables
    object: membrane_fluidity_maintenance
    description: Unsaturated/branched-chain lipids maintain membrane fluidity under
      HHP (homeoviscous adaptation).
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      snippet: can be adapted by modifying the degree of lipid packing
      notes: Verified against the open Tamby et al. introduction; membrane unsaturation
        and branching are retained as contextual ways to remodel lipid packing under
        HHP.
    predicate_id: RO:0002327
  - subject: membrane_fluidity_maintenance
    predicate: contributes to
    object: pressure_dependent_machinery
    description: Maintained membrane fluidity supports the pressure-dependent cellular
      machinery underlying obligate piezophily.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      snippet: HHP impacts protein folding, metabolic rate, and membrane stability,
        leading to cell disruption
      notes: Verified against the open Tamby et al. introduction; the edge is retained
        as a high-level bridge from homeoviscous adaptation to HHP-dependent machinery.
    predicate_id: RO:0002326
