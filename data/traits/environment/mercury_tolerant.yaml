identifier: traitmech:000016
label: mercury tolerant
definition: A metal tolerance in which an organism grows in the presence of toxic
  inorganic or organic mercury compounds, typically via the mer operon, whose mercuric
  reductase (MerA) reduces reactive Hg(II) to volatile Hg(0).
definition_source: DOI:10.1016/S0168-6445(03)00046-9
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000012
synonyms:
- synonym_text: mercury resistant
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/S0168-6445(03)00046-9
evidence:
- reference: DOI:10.1016/S0168-6445(03)00046-9
  snippet: Bacterial resistance to inorganic and organic mercury compounds (HgR) is
    one of the most widely observed phenotypes in eubacteria
  notes: Review supports mercury resistance as a widespread bacterial phenotype mediated
    by MerA, "that reduces reactive ionic Hg(II) to volatile, relatively inert, monoatomic
    Hg(0) vapor".
- reference: PMID:12829273
  snippet: CBA efflux pumps driven by proteins of the resistance-nodulation-cell division
    superfamily, P-type ATPases, cation diffusion facilitator and chromate proteins
  notes: Heavy-metal resistance review situates mercury detoxification within the
    broader prokaryotic metal-resistance machinery.
canonical_examples:
- taxon_id: NCBITaxon:119219
  taxon_label: Cupriavidus metallidurans
  note: "mer-operon mercury resistance"
  reference: PMID:21423734
- taxon_id: NCBITaxon:303
  taxon_label: Pseudomonas putida
  note: "mercury-resistant"
  reference: PMID:21751007
causal_graphs:
- graph_id: mercury_tolerance_mer_reduction
  title: Mercury tolerance via mer-operon MerA reductase
  description: Evidence-backed causal sketch linking mer-operon mercuric reductase
    to volatilization of Hg(II) into Hg(0).
  nodes:
  - node_id: mercury_tolerant_trait
    label: mercury tolerant
    node_type: TRAIT
    grounding: traitmech:000016
    description: Capacity to grow in the presence of toxic mercury compounds.
  - node_id: mercury_ii_ion
    label: mercury(2+) ion
    node_type: CHEMICAL
    grounding: CHEBI:25195
    description: Reactive ionic mercury accumulating intracellularly.
  - node_id: mer_operon
    label: mer operon (MerA reductase)
    node_type: GENE_OR_PROTEIN
    description: Mercuric reductase reducing Hg(II) to volatile Hg(0).
  - node_id: mercury_reduction
    label: mercury(II) reduction
    node_type: BIOLOGICAL_PROCESS
    description: Enzymatic reduction of Hg(II) to volatile elemental Hg(0).
  - node_id: mercury_zero
    label: mercury(0)
    node_type: CHEMICAL
    description: Volatile, relatively inert elemental mercury Hg(0).
    grounding: CHEBI:16170
  - node_id: merb_lyase
    label: MerB (organomercurial lyase)
    node_type: GENE_OR_PROTEIN
    description: Organomercury lyase cleaving C-Hg bonds of organomercurials to release
      Hg(II).
  - node_id: organomercurial
    label: organomercurial compound
    node_type: CHEMICAL
    description: Organic mercury compounds such as methylmercury.
  - node_id: merr_sensor
    label: MerR (Hg-responsive regulator)
    node_type: GENE_OR_PROTEIN
    description: Mercury-responsive transcription factor controlling mer operon induction.
  - node_id: mer_transcription
    label: mer operon transcription
    node_type: BIOLOGICAL_PROCESS
    description: Transcriptional activation of mer detoxification genes from the Pmer
