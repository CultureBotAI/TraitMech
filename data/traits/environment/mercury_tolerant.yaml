    evidence:
    - reference: DOI:10.21203/rs.3.rs-3854515/v1
      notes: MerB is an organomercury lyase that cleaves methylmercury to Hg2+ and
        methane.
  - subject: merb_lyase
    predicate: produces
    object: mercury_ii_ion
    description: Organomercurial cleavage yields Hg(II), the substrate for MerA reduction.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-3854515/v1
      notes: C-Hg bond cleavage produces Hg(II) for subsequent MerA reduction.
    predicate_id: METPO:2007800
  - subject: merr_sensor
    predicate: senses
    object: mercury_ii_ion
    description: MerR senses Hg(II), acting as a mercury-responsive transcriptional
      regulator.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-3854515/v1
      notes: MerR functions as a repressor/activator responsive to Hg2+.
  - subject: merr_sensor
    predicate: activates
    object: mer_transcription
    description: Hg(II)-bound MerR activates transcription of the mer detoxification
