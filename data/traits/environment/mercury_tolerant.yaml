  edges:
  - subject: mercury_ii_ion
    predicate: challenges
    object: mercury_tolerant_trait
    description: Reactive Hg(II) is the toxic challenge the trait counters.
    evidence:
    - reference: PMID:12829273
      notes: Mercury detoxification sits within the broader prokaryotic metal-resistance
        machinery.
    predicate_id: METPO:2007406
  - subject: mer_operon
    predicate: enables
    object: mercury_reduction
    description: MerA reduces Hg(II) to volatile, inert Hg(0) vapour.
    evidence:
    - reference: DOI:10.1016/S0168-6445(03)00046-9
      notes: MerA reduces reactive ionic Hg(II) to volatile, relatively inert, monoatomic
        Hg(0) vapor.
    predicate_id: RO:0002327
  - subject: mercury_reduction
    predicate: mitigates
    object: mercury_ii_ion
    description: Reduction to Hg(0) depletes the reactive Hg(II) pool.
    evidence:
    - reference: DOI:10.1016/S0168-6445(03)00046-9
      notes: Mercury reduction is the basis of mer-mediated resistance.
    predicate_id: METPO:2007407
  - subject: mer_operon
    predicate: produces
    object: mercury_zero
    description: MerA reduction of Hg(II) yields volatile elemental Hg(0).
    evidence:
    - reference: DOI:10.1186/s12866-024-03391-5
      notes: MerA reduces Hg2+ to volatile Hg0, relieving intracellular Hg(II) toxicity.
    predicate_id: METPO:2007800
  - subject: merb_lyase
    predicate: cleaves
    object: organomercurial
    description: MerB lyase cleaves C-Hg bonds of organomercurials to release Hg(II)
