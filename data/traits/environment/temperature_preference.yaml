identifier: METPO:1000613
label: temperature preference
definition: A phenotype that describes characteristic growth with respect to environmental
  temperature.
definition_source: DOI:10.1038/sj.jim.2900572
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: Physiology and metabolism.culture temp.temperature
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: range_tmp
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/sj.jim.2900572
  snippet: growth rate vs temperature
  notes: Supports temperature-dependent microbial growth-rate phenotypes.
causal_graphs:
- graph_id: temperature_preference_growth_physiology
  title: Environmental temperature control of growth preference
  scope_status: NONMECHANISTIC
  scope_notes: This record is an upper preference, broad tolerance, or central-range
    classification spanning multiple unrelated adaptations; contextual protein nodes
    are retained without assigning a misleading token UniProt example.
  description: Evidence-backed causal sketch linking environmental temperature to
    membrane fluidity, protein stability, and growth-rate phenotypes.
  nodes:
  - node_id: temperature_preference_trait
    label: temperature preference
    node_type: TRAIT
    grounding: METPO:1000613
    description: Growth phenotype characterized by preferred environmental temperature.
  - node_id: environmental_temperature
    label: environmental temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: Growth temperature experienced by the organism.
  - node_id: low_temperature
    label: low temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: Cold growth condition that reduces molecular motion and membrane
      fluidity.
    grounding: PATO:0001306
  - node_id: high_temperature
    label: high temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: Hot growth condition that challenges protein and membrane stability.
    grounding: PATO:0001305
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical state of the membrane affecting transport and cell function.
    grounding: METPO:1007505
  - node_id: protein_stability
    label: protein stability
    node_type: MOLECULAR_FUNCTION
    description: Capacity of proteins to retain folded, functional conformations.
  - node_id: growth_rate
    label: microbial growth rate
    node_type: BIOLOGICAL_PROCESS
    description: Rate of population growth under a given temperature regime.
  - node_id: temperature_downshift
    label: temperature downshift
    node_type: ENVIRONMENTAL_FACTOR
    description: A decrease in environmental growth temperature (cold shift).
  - node_id: fatty_acid_desaturase
    label: fatty acid desaturase
    node_type: GENE_OR_PROTEIN
    description: Desaturase enzyme (e.g., Des) that introduces double bonds into membrane
      fatty acids.
    grounding: InterPro:IPR012171
  - node_id: unsaturated_membrane_fatty_acids
    label: unsaturated membrane fatty acids
    node_type: CHEMICAL
    description: Membrane fatty acids bearing double bonds; raise membrane fluidity
      (homeoviscous adaptation).
  - node_id: rna_thermometer
    label: RNA thermometer
    node_type: RNA
    description: Temperature-responsive RNA structure (ROSE/FourU) in 5-UTRs that
      gates translation by melting with temperature.
  - node_id: heat_shock_gene_translation
    label: heat-shock gene translation
    node_type: BIOLOGICAL_PROCESS
    description: Translation of heat-shock response genes permitted upon RNA thermometer
      melting at elevated temperature.
  - node_id: cold_shock_rna_chaperone_activity
    label: cold-shock RNA chaperone activity
    node_type: MOLECULAR_FUNCTION
    description: CspA-type RNA chaperone activity that maintains single-stranded RNA
      to support translation at low temperature.
  edges:
  - subject: environmental_temperature
    predicate: regulates
    object: growth_rate
    description: Microbial growth rate varies with growth temperature.
    evidence:
    - reference: DOI:10.1038/sj.jim.2900572
      snippet: growth rate vs temperature
      notes: Study analyzes temperature dependence of microbial growth rates across
        psychrotrophs, mesophiles, and thermophiles.
    predicate_id: RO:0002211
  - subject: low_temperature
    predicate: decreases
    object: membrane_fluidity
    description: Cold temperature reduces membrane fluidity and transport efficiency.
    evidence:
    - reference: DOI:10.1038/sj.embor.7400662
      snippet: decreased membrane fluidity
      notes: Review identifies membrane fluidity loss as a core cold challenge.
    predicate_id: RO:0002212
  - subject: high_temperature
    predicate: challenges
    object: protein_stability
    description: Elevated temperature challenges protein folding and functional stability.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: resistant to irreversible inactivation at high temperatures
      notes: Review supports thermostable enzymes as a high-temperature adaptation.
    predicate_id: METPO:2007406
  - subject: high_temperature
    predicate: increases
    object: membrane_fluidity
    description: High temperature increases membrane permeability and fluidity, creating
      a limit on growth.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: proton permeability ... increase with the temperature
      notes: Review links increased membrane permeability to upper temperature growth
        limits.
    predicate_id: RO:0002213
  - subject: membrane_fluidity
    predicate: regulates
    object: temperature_preference_trait
    description: Temperature preference reflects the range in which membrane function
      remains compatible with growth.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: optimizes the performance of cellular physiological processes
      notes: Review supports membrane fluidity adaptation as a temperature-sensing
        and response mechanism.
    predicate_id: RO:0002211
  - subject: protein_stability
    predicate: regulates
    object: temperature_preference_trait
    description: Growth at preferred temperatures requires proteins to remain active
      and stable.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: molecular mechanisms involved in protein thermostabilization
      notes: Supports protein stability as a determinant of high-temperature growth.
    predicate_id: RO:0002211
  - subject: fatty_acid_desaturase
    predicate: increases
    object: unsaturated_membrane_fatty_acids
    description: Desaturase expression increases double bonds in membrane fatty acids
      (homeoviscous adaptation).
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Activation of des (desaturase) transcription increases double bonds in
        membrane fatty acids; generic UFA-biosynthesis module.
    predicate_id: RO:0002213
  - subject: unsaturated_membrane_fatty_acids
    predicate: increases
    object: membrane_fluidity
    description: Increased unsaturated membrane fatty acids restore/raise membrane
      fluidity.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Increasing double bonds in membrane fatty acids restores membrane fluidity;
        core homeoviscous-adaptation edge broadly curatable across microbes.
    predicate_id: RO:0002213
  - subject: high_temperature
    predicate: melts
    object: rna_thermometer
    description: Elevated temperature melts RNA thermometer hairpins, relieving translational
      repression.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: RNA thermometers (ROSE/FourU) control translation by occluding Shine-Dalgarno/start
        codons and melt with temperature; bacterial heat-sensing mechanism.
  - subject: rna_thermometer
    predicate: permits translation of
    object: heat_shock_gene_translation
    description: RNA thermometer melting permits translation of heat-shock genes.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: Post-transcriptional RNA thermometers in 5-UTRs mediate rapid temperature-dependent
        control of translation; strong generic edge.
  - subject: low_temperature
    predicate: induces
    object: cold_shock_rna_chaperone_activity
    description: Cold shock induces CspA-mediated RNA chaperone activity that maintains
      translatable RNA.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: Cold shock induces cold-shock proteins (CspA) that help maintain single-stranded
        RNA for translation at low temperature.
  - subject: temperature_downshift
    predicate: induces
    object: fatty_acid_desaturase
    description: Cold downshift induces fatty-acid desaturase activity to maintain
      membrane fluidity.
    evidence:
    - reference: DOI:10.1038/sj.jim.2900572
      notes: Connecting edge wiring the enrichment node into the graph.
