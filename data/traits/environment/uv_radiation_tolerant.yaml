identifier: traitmech:000009
label: UV radiation tolerant
definition: An environmental tolerance in which an organism survives high doses of
  ultraviolet radiation, typically via photoreactivation and nucleotide-excision
  repair of cyclobutane pyrimidine dimers and 6-4 photoproducts.
definition_source: DOI:10.3390/genes14091803
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000007
synonyms:
- synonym_text: UV resistant
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3390/genes14091803
evidence:
- reference: DOI:10.3390/genes14091803
  snippet: Deinococcus radiodurans R1 demonstrates a significantly higher radiation
    resistance with D10 values exceeding 12 kGy for gamma radiation and 700 J/m2 for
    UV-C radiation
  notes: 'Organism example: Deinococcus radiodurans tolerates UV-C radiation D10
    doses of 700 J/m2.'
- reference: DOI:10.1101/cshperspect.a012765
  snippet: The bacterium Deinococcus radiodurans is a champion of extreme radiation
    resistance
  notes: Review support — Deinococcus radiodurans is the reference organism for
    extreme UV and ionizing radiation resistance.
