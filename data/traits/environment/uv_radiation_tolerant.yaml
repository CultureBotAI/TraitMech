identifier: traitmech:000009
label: UV radiation tolerant
definition: An environmental tolerance in which an organism survives high doses of
  ultraviolet radiation, typically via photoreactivation and nucleotide-excision
  repair of cyclobutane pyrimidine dimers and 6-4 photoproducts.
definition_source: DOI:10.3390/genes14091803
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: PROPOSED
