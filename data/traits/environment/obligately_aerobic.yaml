  edges:
  - subject: obligate_aerobic_trait
    predicate: depends on
    object: molecular_oxygen
    description: Obligate aerobic growth depends on oxygen availability.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.112444
      snippet: obligate aerobe ... exposed to hypoxia, stops growing
      notes: Mycobacterium tuberculosis example supports oxygen requirement in an
        obligately aerobic bacterium.
    predicate_id: RO:0002502
  - subject: terminal_oxidases
    predicate: reduces
    object: molecular_oxygen
    description: Terminal oxidases use oxygen as the respiratory electron acceptor.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.112444
      snippet: transfer electrons from the ETC to O2
      notes: Supports oxygen reduction by terminal oxidases in an obligate aerobe.
    predicate_id: METPO:2007802
  - subject: electron_transport_chain
    predicate: includes
    object: terminal_oxidases
    description: Oxygen-dependent respiratory chains terminate in oxygen reductases.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2011.06.016
      snippet: respiratory quinol:O2 oxidoreductase
      notes: Review supports terminal oxygen reductases as respiratory chain enzymes.
    predicate_id: biolink:has_part
  - subject: terminal_oxidases
    predicate: contributes to
    object: proton_motive_force
    description: Oxygen reductases contribute to proton motive force generation.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2011.06.016
      snippet: production of a proton motive force
      notes: Supports bioenergetic coupling by cytochrome bd oxygen reductases.
    predicate_id: RO:0002326
  - subject: molecular_oxygen
    predicate: enables
    object: aerobic_respiration
    description: Molecular oxygen enables aerobic respiration.
    evidence:
    - reference: DOI:10.1111/cmi.13338
      notes: Aerobic respiration is identified as the main cause of bacterial oxygen
        consumption.
    predicate_id: RO:0002327
  - subject: anoxia
    predicate: interrupts flux through
    object: electron_transport_chain
    description: Anoxia interrupts electron flux through the electron transport chain.
    evidence:
    - reference: DOI:10.1128/JB.00797-19
      notes: Interrupted flux through the electron transport chain (ETC) due to the
        absence of oxygen.
  - subject: electron_transport_chain
    predicate: maintains
    object: proton_motive_force
    description: Electron transport chain flux maintains the proton motive force;
      anoxic interruption impairs it.
    evidence:
    - reference: DOI:10.1128/JB.00797-19
      notes: Obligate aerobes must maintain redox balance and the proton motive force
        (PMF) despite interrupted flux through the electron transport chain.
  - subject: superoxide_dismutase
    predicate: mitigates
    object: superoxide
    description: Superoxide dismutase mitigates superoxide stress in aerobes.
    evidence:
    - reference: DOI:10.1016/j.tim.2020.10.001
      notes: Aerobes deploy scavenging enzymes (SOD, catalase, other peroxidases).
    predicate_id: METPO:2007407
  - subject: catalase
    predicate: mitigates
    object: hydrogen_peroxide
    description: Catalase/catalase-peroxidase mitigates hydrogen peroxide stress in
      aerobes.
    evidence:
    - reference: DOI:10.1016/j.tim.2020.10.001
      notes: Aerobes deploy scavenging enzymes (SOD, catalase, other peroxidases).
    predicate_id: METPO:2007407
  - subject: superoxide
    predicate: inactivates
    object: fe_s_cluster_enzymes
    description: Superoxide and H2O2 oxidize and inactivate exposed Fe-S cluster enzymes.
    evidence:
    - reference: DOI:10.1016/j.tim.2020.10.001
      notes: Rate constants for cluster oxidation given (~1e6 M-1 s-1 for superoxide
        and ~1e4 M-1 s-1 for H2O2), explaining ROS-defense need in aerobes.
