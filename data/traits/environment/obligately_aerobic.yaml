  source: metpo.owl
- synonym_text: obligate aerobic
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: https://www.ncbi.nlm.nih.gov/books/NBK482349/
  snippet: require oxygen as a terminal electron acceptor
  notes: Supports the requirement for oxygen in obligately aerobic organisms.
- reference: PMID:27203084
  snippet: M. tuberculosis is an obligate aerobe
  notes: 'Organism example: Mycobacterium tuberculosis is described as obligately
    aerobic.'
