identifier: METPO:1000607
label: obligately anaerobic
definition: An oxygen preference in which molecular oxygen (O₂) inhibits or prevents
  growth.
definition_source: https://www.ncbi.nlm.nih.gov/books/NBK482349/
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
