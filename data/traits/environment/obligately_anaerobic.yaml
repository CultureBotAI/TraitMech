  snippet: Oxygen is toxic to anaerobes
  notes: Supports oxygen inhibition/toxicity for obligately anaerobic organisms.
- reference: PMID:22778399
  snippet: obligate anaerobe Bacteroides fragilis
  notes: 'Organism example: Bacteroides fragilis is described as an obligate anaerobe.'
