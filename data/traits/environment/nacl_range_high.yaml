identifier: METPO:1000472
label: NaCl range high
definition: A NaCl range phenotype in which the growth-supporting NaCl range extends
  above approximately 8% (w/v), characteristic of extreme-halophile organisms.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000334
synonyms:
- synonym_text: Extreme halophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: NaR_>8
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: extreme halophile
  notes: Osmoadaptation review supports growth ranges extending above 8% NaCl as the
    extreme-halophile category.
- reference: DOI:10.1186/1746-1448-4-2
  snippet: KCl accumulating Halobacterium salinarum
  notes: Saline-Systems review supports salt-in physiology underlying extended high-salt
    growth.
