evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: highly halotolerant representatives
  notes: Supports halotolerant microorganisms as high-salt tolerant without strict
    salt requirement.
- reference: PMID:27621824
  snippet: Halomonas massiliensis sp. nov., a new halotolerant bacterium
  notes: 'Organism example: Halomonas massiliensis is described as halotolerant.'
canonical_examples:
- taxon_id: NCBITaxon:1570
  taxon_label: Halobacillus halophilus
  note: Model halotolerant/moderately halophilic bacterium (chloride-dependent osmoadaptation).
    Staphylococcus aureus is the classic salt-tolerant clinical exemplar.
  reference: PMID:18442383
