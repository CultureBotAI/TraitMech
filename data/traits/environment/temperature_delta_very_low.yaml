identifier: METPO:1000483
label: temperature delta very low
definition: A temperature delta phenotype with a growth-supporting temperature breadth
  of approximately 1–5 °C, characteristic of stenothermal physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000303
synonyms:
- synonym_text: Td_1_5
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports very narrow thermal-tolerance breadths
    as the stenothermal phenotype with limited membrane-remodeling flexibility.
causal_graphs:
- graph_id: temperature_delta_very_low_stenothermal
  title: Very-low temperature-delta contextual cold-stress branches
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed contextual graph connecting cold-induced membrane rigidification,
    unsaturated-fatty-acid membrane remodeling, CspA/CsdA RNA support, and very limited
    thermal-adaptation flexibility to the 1–5 °C temperature-delta bin.
  nodes:
  - node_id: temperature_delta_very_low_trait
    label: temperature delta very low
    node_type: TRAIT
    grounding: METPO:1000483
    description: Temperature growth-supporting breadth approximately 1–5 °C.
  - node_id: temperature_delta
    label: temperature delta
    node_type: TRAIT
    grounding: METPO:1000303
    description: Breadth of the growth-supporting ambient-temperature range.
  - node_id: very_limited_thermal_adaptation
    label: very limited thermal-adaptation flexibility
    node_type: BIOLOGICAL_PROCESS
    description: Narrow capacity to remodel membrane lipid composition and enzyme
      repertoire across temperature shifts.
  - node_id: unsaturated_fatty_acid_content
    label: unsaturated fatty acid content
    node_type: QUALITY
    description: Relative proportion of unsaturated fatty acids in membrane phospholipids.
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical fluidity of the cell membrane, central to homeoviscous adaptation.
    grounding: METPO:1007505
  - node_id: cold_shock
    label: cold shock
    node_type: ENVIRONMENTAL_FACTOR
    description: Abrupt decrease in ambient temperature.
  - node_id: cspa_protein
    label: CspA cold-shock protein
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: RNA chaperone induced upon cold shock that promotes single-stranded
      RNA states.
  - node_id: csda_helicase
    label: CsdA DEAD-box RNA helicase
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: DEAD-box RNA helicase that assists ribosomes and RNA remodeling at
      low temperature.
  - node_id: large_ribosomal_subunit_biogenesis
    label: 50S ribosomal subunit biogenesis
    node_type: BIOLOGICAL_PROCESS
    description: Biogenesis of the bacterial large ribosomal subunit at low temperature.
  - node_id: membrane_phase_transition_temperature
    label: membrane phase-transition temperature
    node_type: QUALITY
    description: Temperature at which membrane lipids shift between liquid-crystalline
      and ordered gel phases.
  - node_id: low_temperature_membrane_transport
    label: membrane transport at low temperature
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of membrane permeability, diffusion, and membrane-protein
      function under low-temperature stress.
  - node_id: cold_rna_metabolism
    label: RNA metabolism at low temperature
    node_type: BIOLOGICAL_PROCESS
    description: RNA chaperone and helicase activity that preserves translation and
      ribosomal-subunit biogenesis during cold stress.
  edges:
  - subject: very_limited_thermal_adaptation
    predicate: confers
    object: temperature_delta_very_low_trait
    description: Very limited thermal-adaptation flexibility yields a 1–5 °C temperature-delta
      breadth.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports very limited remodeling flexibility as the basis of stenothermal
        breadth.
    predicate_id: METPO:2007700
  - subject: temperature_delta_very_low_trait
    predicate: is a
    object: temperature_delta
    description: Temperature delta very low is a quantitative bin of the temperature-delta
      phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports the 1–5 °C breadth as a value within the temperature-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: unsaturated_fatty_acid_content
    predicate: positively regulates
    object: membrane_fluidity
    description: A higher unsaturated-fatty-acid proportion fluidizes bacterial cytoplasmic
      membranes and counteracts cold rigidification.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: incorporation of proportionally more unsaturated fatty acids
      notes: Verified against the public Annual Review of Microbiology abstract; de
        Mendoza reviews increased unsaturated fatty acid incorporation as part of
        homeoviscous adaptation to decreasing growth temperature.
    - reference: DOI:10.1111/mmi.15323
      snippet: increases with temperature or an increase in the proportion of unsaturated
        fatty acids and vice versa
      notes: Verified against the open Molecular Microbiology full text; Singh and
        Harinarayanan use E. coli unsaturated-fatty-acid perturbations as a route
        to membrane-fluidity loss.
    predicate_id: RO:0002213
  - subject: cold_shock
    predicate: positively regulates
    object: cspa_protein
    description: Cold shock strongly increases CspA cold-shock protein synthesis.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: more than 10% of the total cellular protein synthesis
      notes: Verified against the open Molecular Microbiology full text; CspA is the
        major E. coli cold-shock protein and its synthesis rises sharply after temperature
        downshift.
    predicate_id: RO:0002213
  - subject: csda_helicase
    predicate: contributes to
    object: large_ribosomal_subunit_biogenesis
    description: CsdA DEAD-box RNA helicase contributes to 50S ribosomal-subunit biogenesis
      at low temperature.
    evidence:
    - reference: DOI:10.1093/nar/gkh603
      snippet: CsdA is involved in the biogenesis of the large rather than the small
        ribosomal subunit
      notes: Verified against the open Nucleic Acids Research abstract; Charollais
        et al. place the E. coli CsdA helicase in 50S ribosomal-subunit biogenesis
        at low temperatures.
    predicate_id: RO:0002326
  - subject: cold_shock
    predicate: negatively regulates
    object: membrane_fluidity
    description: Cold exposure drives membrane lipids toward ordered gel states and
      thereby decreases functional membrane fluidity.
    evidence:
    - reference: DOI:10.1007/s00792-017-0939-x
      snippet: liquid crystalline phase into the rigid gel phase
      notes: Verified against the public Springer page; Siliakus et al. review low-temperature
        shifts from liquid-crystalline to rigid gel membrane phases.
    predicate_id: RO:0002212
  - subject: unsaturated_fatty_acid_content
    predicate: negatively regulates
    object: membrane_phase_transition_temperature
    description: A higher cis-unsaturated-fatty-acid fraction lowers membrane phase-transition
      temperature and helps keep membranes fluid in the cold.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: incorporation of proportionally more unsaturated fatty acids
      notes: Verified against the public Annual Review of Microbiology abstract; de
        Mendoza reviews increased unsaturated fatty acid incorporation as growth temperature
        decreases.
    - reference: DOI:10.1007/s00792-017-0939-x
      snippet: liquid crystalline phase into the rigid gel phase
      notes: Verified against the public Springer page; membrane lipids below their
        transition temperature shift away from the liquid-crystalline state.
    predicate_id: RO:0002212
  - subject: membrane_fluidity
    predicate: contributes to
    object: low_temperature_membrane_transport
    description: Liquid-crystalline membrane fluidity supports permeability, diffusion,
      and membrane-protein function at low temperature.
    evidence:
    - reference: DOI:10.1007/s00792-017-0939-x
      snippet: many membrane proteins only function in the liquid crystalline phase
      notes: Verified against the public Springer page; Siliakus et al. link low-temperature
        membrane phase to membrane-protein function.
    predicate_id: RO:0002326
  - subject: low_temperature_membrane_transport
    predicate: contributes to
    object: very_limited_thermal_adaptation
    description: Cold preservation of membrane transport is one contextual branch
      of the thermal-acclimation flexibility represented in this nonmechanistic temperature-breadth
      graph.
    evidence:
    - reference: DOI:10.1007/s00792-017-0939-x
      snippet: many membrane proteins only function in the liquid crystalline phase
      notes: Verified against the public Springer page; this supports the membrane-function
        branch without asserting a direct universal cause of the 1-5 degree C temperature-delta
        bin.
    predicate_id: RO:0002326
  - subject: cspa_protein
    predicate: contributes to
    object: cold_rna_metabolism
    description: CspA RNA chaperone activity supports translation by reducing low-temperature
      RNA secondary structure.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: facilitates translation by destabilizing mRNA secondary structures
        formed at low temperature
      notes: Verified against the open Molecular Microbiology full text; the source
        assigns CspA RNA-chaperone activity a role in low-temperature translation.
    predicate_id: RO:0002326
  - subject: csda_helicase
    predicate: contributes to
    object: cold_rna_metabolism
    description: CsdA DEAD-box helicase activity supports RNA handling and large ribosomal-subunit
      maturation in the cold.
    evidence:
    - reference: DOI:10.1093/nar/gkh603
      snippet: CsdA is involved in the biogenesis of the large rather than the small
        ribosomal subunit
      notes: Verified against the open Nucleic Acids Research abstract; CsdA supports
        an RNA helicase-dependent low-temperature ribosome-biogenesis branch.
    predicate_id: RO:0002326
  - subject: large_ribosomal_subunit_biogenesis
    predicate: contributes to
    object: cold_rna_metabolism
    description: 50S ribosomal-subunit biogenesis is part of the RNA-processing and
      translation-support module required during cold stress.
    evidence:
    - reference: DOI:10.1093/nar/gkh603
      snippet: deficit in free 50S subunits at low temperatures
      notes: Verified against the open Nucleic Acids Research abstract; CsdA defects
        in the cold appear as impaired 50S subunit accumulation.
    predicate_id: RO:0002326
  - subject: cold_rna_metabolism
    predicate: contributes to
    object: very_limited_thermal_adaptation
    description: Cold-supportive RNA chaperone and ribosome-biogenesis functions are
      a second contextual branch of the thermal-acclimation flexibility represented
      in this nonmechanistic temperature-breadth graph.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: facilitates translation by destabilizing mRNA secondary structures
        formed at low temperature
      notes: Verified against the open Molecular Microbiology full text; this supports
        the RNA-function branch without asserting CspA as a universal determinant
        of the 1-5 degree C temperature-delta bin.
    predicate_id: RO:0002326
