      notes: Supports the 3–8% breadth as a value within the NaCl-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: cyclic_di_amp
    predicate: inhibits
    object: potassium_uptake_systems
    description: c-di-AMP binding to transporters/riboswitches inhibits K+ import.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1007574
      snippet: A high level of c-di-AMP has been found to repress K+ and carnitine
        uptake
      notes: Verified against the open Pham et al. introduction; c-di-AMP is retained
        as a broad regulator of bacterial K+ import rather than a direct determinant
        of this NaCl-breadth bin.
    predicate_id: RO:0002212
  - subject: cyclic_di_amp
    predicate: modulates
    object: cell_volume_regulation
    description: c-di-AMP signaling acts as a master regulator of cell volume.
    evidence:
    - reference: DOI:10.1128/mmbr.00181-23
      snippet: cyclic di-AMP is a master regulator of cell volume
      notes: Verified against public Foster et al. text; the edge is kept at the level
        of broad second-messenger control over cell-volume regulation.
    predicate_id: RO:0002211
  - subject: osmolality
    predicate: increases
    object: kdpfabc_expression
    description: Ionic-strength changes can increase kdpFABC expression via KdpD during
      osmotic upshift.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.2002.02894.x
      snippet: increase the expression of kdpFABC under conditions of osmotic upshift
      notes: Verified against the open Poolman et al. review; the edge is moved from
        a protein-complex object to a kdpFABC-expression process.
    predicate_id: RO:0002213
  - subject: compatible_solute_accumulation_transport
    predicate: causes
    object: osmoprotection
    description: Accumulation/transport of compatible solutes confers osmoprotection.
    evidence:
    - reference: DOI:10.3389/fmicb.2018.00108
      snippet: accumulated by microorganisms under high salinity growth conditions
        as stress protectants
      notes: Verified against the open Leon et al. text; compatible solute accumulation
        and uptake are retained as a broad osmoprotective process.
    predicate_id: biolink:causes
  - subject: eps_matrix
    predicate: interacts with
    object: sodium_ion
    description: The EPS matrix physically interacts with Na+ cations.
    evidence:
    - reference: DOI:10.1093/femsre/fuaf020
      snippet: the EPS matrix binds cations such as Na+ ions
      notes: Verified against the open Goszcz et al. review; exopolysaccharide matrices
        are typed with the existing CHEMICAL convention from the biofilm graph.
    predicate_id: biolink:interacts_with
  - subject: eps_matrix
    predicate: promotes
    object: water_retention
    description: EPS matrix promotes water retention and reduces pericellular Na+
      toxicity.
    evidence:
    - reference: DOI:10.1093/femsre/fuaf020
      snippet: It also retains water, which helps in reducing the osmotic gradient
      notes: Verified against the open Goszcz et al. review; this EPS edge is kept
        as a contextual pericellular salt-stress mitigation mechanism.
    predicate_id: RO:0002213
