identifier: METPO:1000481
label: NaCl delta mid2
definition: A NaCl delta phenotype with a growth-supporting NaCl breadth of approximately
  3–8% (w/v), characteristic of organisms with broad salinity tolerance.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000335
synonyms:
- synonym_text: Nad_3_8
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports broad osmoadaptive breadths as the halotolerant
    / moderately euryhaline phenotype.
canonical_examples:
- taxon_id: NCBITaxon:718002
  taxon_label: Peribacillus endoradicis
  reference: DOI:10.1099/ijs.0.028936-0
  note: The type strain, published as Bacillus endoradicis CCBAU 05776T and now NCBI-labelled
    Peribacillus endoradicis, grew from 0 to 7% NaCl, a 7-point breadth inside the
    3-8% delta bin.
causal_graphs:
