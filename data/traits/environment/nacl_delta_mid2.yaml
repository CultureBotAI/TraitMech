  - node_id: water_retention
    label: water retention / reduced pericellular Na+ toxicity
    node_type: BIOLOGICAL_PROCESS
    description: Retention of water and lowering of effective pericellular Na+.
  edges:
  - subject: robust_osmoadaptive_flexibility
    predicate: confers
    object: nacl_delta_mid2_trait
    description: Robust osmoadaptive flexibility yields a 3–8% NaCl-delta breadth.
