    description: External solute concentration / osmotic pressure.
  - node_id: kdpfabc_expression
    label: kdpFABC expression
    node_type: BIOLOGICAL_PROCESS
    description: Expression of the kdpFABC high-affinity K+ uptake operon via KdpD
