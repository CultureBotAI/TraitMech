identifier: METPO:1000444
label: temperature optimum mid2
definition: A temperature optimum phenotype with the best-growth ambient temperature
  between approximately 27 and 30 °C, characteristic of mesophilic physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000304
synonyms:
- synonym_text: Mesophilie
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TO_27_to_30
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: mesophilic
  synonym_type: EXACT_SYNONYM
  source: https://w3id.org/metpo/releases/2026-06-12/metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports a 27–30 °C optimum as a typical mesophile
    setpoint maintained by homoviscous membrane composition.
causal_graphs:
- graph_id: temperature_optimum_mid2_mesophile
  title: Temperature-optimum-mid2 mesophile setpoint
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed graph linking baseline mesophile adaptation to a temperature
    optimum between 27 and 30 °C.
  nodes:
  - node_id: temperature_optimum_mid2_trait
    label: temperature optimum mid2
    node_type: TRAIT
    grounding: METPO:1000444
    description: Temperature optimum approximately 27–30 °C.
  - node_id: temperature_optimum
    label: temperature optimum
    node_type: TRAIT
