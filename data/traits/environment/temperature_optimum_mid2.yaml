    description: Ambient temperature supporting maximal growth.
  - node_id: mesophilic_environment
    label: mesophilic environment
    node_type: ENVIRONMENTAL_FACTOR
    description: Habitat ambient temperature in the 27–30 °C range.
  - node_id: baseline_mesophile_adaptation
    label: baseline mesophile adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Standard mesophile membrane and enzyme repertoire matching a moderate
      ambient-temperature setpoint.
  - node_id: temperature_decrease
    label: temperature decrease
    node_type: ENVIRONMENTAL_FACTOR
    description: A drop in ambient temperature below the growth setpoint.
  - node_id: membrane_rigidity
    label: membrane rigidification
    node_type: QUALITY
    description: Increased bilayer order/thickness and liquid-crystalline to gel transition
      of the cytoplasmic membrane.
  - node_id: unsaturated_fatty_acids
    label: unsaturated fatty acids
    node_type: CHEMICAL
    description: Membrane fatty acyl chains bearing one or more double bonds (CHEBI:27208).
    grounding: CHEBI:27208
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical fluidity/disorder state of the cytoplasmic membrane.
    grounding: METPO:1007505
  - node_id: mesophile_category
    label: mesophile category
    node_type: STATE
    description: Organisms growing between approximately 20 and 45 degrees C ambient
      temperature.
  edges:
  - subject: mesophilic_environment
    predicate: engages
    object: baseline_mesophile_adaptation
    description: Mesophilic environments engage baseline mesophile adaptation.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports mesophile homoviscous adaptation at moderate ambient temperature.
  - subject: baseline_mesophile_adaptation
    predicate: confers
    object: temperature_optimum_mid2_trait
    description: Baseline mesophile adaptation yields a 27–30 °C optimum.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports the 27–30 °C optimum as the baseline-mesophile outcome.
    predicate_id: METPO:2007700
  - subject: temperature_optimum_mid2_trait
    predicate: is a
    object: temperature_optimum
    description: Temperature optimum mid2 is a quantitative bin of the temperature-optimum
      phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports the 27–30 °C optimum as a value within the temperature-optimum
        distribution.
    predicate_id: rdfs:subClassOf
  - subject: temperature_decrease
    predicate: causes
    object: membrane_rigidity
    description: A temperature drop rigidifies and thickens the cytoplasmic membrane.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      notes: Temperature drops cause membrane rigidification and thickening and can
        induce a liquid-crystalline to gel phase change; general bacterial mechanism.
    predicate_id: biolink:causes
  - subject: unsaturated_fatty_acids
    predicate: increases
    object: membrane_fluidity
    description: Higher unsaturated fatty acid content fluidizes and thins the bilayer.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Increasing the saturated/unsaturated ratio toward UFAs increases fluidity;
        UFAs are central membrane fluidizers.
    predicate_id: RO:0002213
  - subject: baseline_mesophile_adaptation
    predicate: increases
    object: unsaturated_fatty_acids
    description: Homeoviscous mesophile adaptation raises unsaturated fatty acid content
      to offset cooling.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Homeoviscous adaptation adjusts the saturated/unsaturated fatty-acid
        ratio to maintain membrane fluidity at the growth temperature.
    predicate_id: RO:0002213
  - subject: membrane_fluidity
    predicate: enables
    object: baseline_mesophile_adaptation
    description: Maintained membrane fluidity supports the baseline mesophile physiological
      state.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      notes: Cells sense and correct membrane fluidity via desaturation to keep the
        bilayer functional at the ambient temperature.
    predicate_id: RO:0002327
  - subject: temperature_optimum_mid2_trait
    predicate: subclass of
    object: mesophile_category
    description: The 27-30 C optimum falls within the mesophile growth range.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Mesophiles grow between about 20 C and 45 C; 27-30 C lies inside this
        range, making mid2 a mesophile subset.
