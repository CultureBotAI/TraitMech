  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: PMID:17978227
  snippet: Pseudomonas guineae sp. nov., a novel psychrotolerant bacterium
  notes: 'Organism example: Pseudomonas guineae is described as psychrotolerant.'
- reference: DOI:10.1038/sj.embor.7400662
  snippet: decreased membrane fluidity
  notes: Psychrophile review supports cold-end membrane stress as the
    challenge that psychrotolerant facultative adaptation overcomes without
    full psychrophile dedication.
