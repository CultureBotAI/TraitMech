identifier: METPO:1000616
label: thermophilic
definition: A temperature preference in which growth is favored at elevated temperatures,
  typically ≥45 °C.
definition_source: DOI:10.1016/s0300-9629(97)00003-0
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000613
evidence:
- reference: DOI:10.1016/s0300-9629(97)00003-0
  snippet: adapted to environments of high temperature
  notes: Supports thermophilic growth as adaptation to elevated temperature.
- reference: PMID:24058645
  snippet: Geobacillus stearothermophilus is a gram-positive, thermophilic bacterium
  notes: 'Organism example: Geobacillus stearothermophilus is described as thermophilic.'
canonical_examples:
- taxon_id: NCBITaxon:274
  taxon_label: Thermus thermophilus
  note: "Model thermophile (~65-72 C); Taq relative and structural-biology workhorse."
  reference: DOI:10.1007/s00792-009-0226-6
causal_graphs:
- graph_id: thermophilic_heat_adaptation
  title: Thermophilic heat-adaptation mechanism
  description: Evidence-backed causal sketch linking thermophily to elevated temperature,
    membrane lipid adaptation, thermostable proteins, and energy transduction constraints.
  nodes:
