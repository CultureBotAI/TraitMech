    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: changing the lipid composition
      notes: Supports lipid composition as an adaptation to membrane permeability.
    predicate_id: RO:0002212
  - subject: thermostable_proteins
    predicate: enables
    object: thermophilic_trait
    description: Thermostable proteins retain function during elevated-temperature
      growth.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: resistant to irreversible inactivation at high temperatures
      notes: Supports thermostability as a high-temperature enzyme feature.
    predicate_id: RO:0002327
  - subject: energy_transducing_enzymes
    predicate: enables
    object: thermophilic_trait
    description: Adapted energy-transducing enzymes support growth at elevated temperature.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: energy transducing enzymes
      notes: Review cites higher turnover rates and coupling-ion changes in high-temperature
        adaptation.
    predicate_id: RO:0002327
  - subject: reverse_gyrase
    predicate: introduces
    object: positive_dna_supercoiling
    description: Reverse gyrase introduces positive supercoils into thermophile DNA.
    evidence:
    - reference: DOI:10.1264/jsme2.me23087
      notes: 'Takemata 2024: "reverse gyrase introduces positive supercoils" (broadly
        accepted in thermophile genomics).'
  - subject: positive_dna_supercoiling
    predicate: limits
    object: dna_melting
    description: Positive DNA supercoiling limits thermal DNA melting, protecting
      genome integrity.
    evidence:
    - reference: DOI:10.1264/jsme2.me23087
      notes: 'Takemata 2024: "maintain the genome integrity of thermophiles by limiting
        DNA melting"; mechanism generalized across thermophiles.'
    predicate_id: RO:0002212
  - subject: reverse_gyrase
    predicate: mediates
    object: genome_integrity
    description: Reverse gyrase mediates DNA repair and genome-integrity maintenance
      in thermophiles.
    evidence:
    - reference: DOI:10.1264/jsme2.me23087
      notes: 'Takemata 2024: "maintain the genome integrity of thermophiles by ...
        mediating DNA repair".'
  - subject: group_ii_chaperonin
    predicate: refolds
    object: denatured_proteins
    description: The group II chaperonin (thermosome) refolds denatured proteins in
      an ATP-dependent manner.
    evidence:
    - reference: DOI:10.1128/mbio.03593-22
      notes: 'Baes 2023: "thermosome, which refolds proteins in an ATP-dependent manner".'
  - subject: cyclopentane_ring_number
    predicate: increases
    object: membrane_rigidity
    description: Increased cyclopentane ring number in tetraether lipids increases
      membrane condensation and rigidity.
    evidence:
    - reference: DOI:10.3389/frbis.2023.1338019
      notes: 'Chong 2024: "cyclopentane ring cyclization ... increase membrane condensation,
        packing tightness, rigidity".'
    predicate_id: RO:0002213
