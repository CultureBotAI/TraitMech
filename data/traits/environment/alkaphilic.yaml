identifier: METPO:1003002
label: alkaphilic
definition: A pH growth preference in which an organism grows optimally at pH values
  above 9.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003000
