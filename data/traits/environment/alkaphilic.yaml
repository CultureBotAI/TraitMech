    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: Na+/H+ antiporter-dependent pH homeostasis; Mrp plays an indispensible
        role at high pH.
    predicate_id: RO:0002327
  - subject: atp_synthase_c_subunit_motifs
    predicate: increases
    object: atp_synthase_proton_binding
    description: Alkaline-adaptive c-subunit motifs increase tight proton binding
      in the ATP synthase ion site at high pH.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: Two c-subunit motifs that alter rotor shape and promote tight proton
        binding in the ion site.
    predicate_id: RO:0002213
  - subject: atp_synthase_proton_binding
    predicate: enables
    object: cytoplasmic_ph_homeostasis
    description: Efficient ATP synthase proton binding contributes to bioenergetics
      and pH homeostasis under alkaline conditions.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: ATP synthase adaptation supports proton-coupled bioenergetics at high
        external pH.
    predicate_id: RO:0002327
  - subject: acidic_cell_envelope_polymers
    predicate: enables
    object: surface_proton_retention
    description: Acidic cell-wall and S-layer polymers attract and retain protons
