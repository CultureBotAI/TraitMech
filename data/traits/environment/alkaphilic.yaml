    evidence:
    - reference: DOI:10.3389/fmicb.2022.842785
      notes: Acidic secondary cell walls and S-layer proteins attract H+.
    predicate_id: RO:0002327
  - subject: surface_proton_retention
    predicate: contributes to
    object: cytoplasmic_ph_homeostasis
    description: Surface proton retention buffers the membrane and supports cytoplasmic
      pH homeostasis at high external pH.
    evidence:
    - reference: DOI:10.3389/fmicb.2022.842785
      notes: Surface proton retention helps maintain a proton-rich microenvironment
        near the membrane.
    predicate_id: RO:0002326
