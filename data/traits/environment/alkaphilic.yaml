      notes: Supports Na+/H+ antiport as a key alkaliphile sodium-cycle component.
  - subject: sodium_proton_antiporter
    predicate: imports
    object: proton
    description: Electrogenic Na+/H+ antiport contributes to cytoplasmic acidification
