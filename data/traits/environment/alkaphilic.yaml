causal_graphs:
- graph_id: alkaliphilic_na_cycle_homeostasis
  title: Alkaliphilic sodium-cycle pH homeostasis mechanism
  description: Evidence-backed causal sketch linking alkaliphily to high external
    pH, Na+/H+ antiport, and cytoplasmic acidification relative to the medium.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: alkaphilic_trait
    label: alkaphilic
    node_type: TRAIT
    grounding: METPO:1003002
    description: Optimal growth occurs at alkaline pH.
  - node_id: alkaline_external_ph
    label: alkaline external pH
    node_type: ENVIRONMENTAL_FACTOR
    description: External pH above neutral, often pH 9 or higher.
    grounding: PATO:0001430
  - node_id: sodium_ion
    label: sodium ion
    node_type: CHEMICAL
    grounding: CHEBI:29101
    description: Sodium ion participating in alkaliphile Na+ cycles.
  - node_id: proton
    label: proton
    node_type: CHEMICAL
