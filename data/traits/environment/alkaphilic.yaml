      notes: Review supports proton capture/retention mechanisms in alkaline pH homeostasis.
    predicate_id: METPO:2007805
  - subject: cytoplasmic_ph_homeostasis
    predicate: confers
    object: alkaphilic_trait
    description: Alkaliphilic growth requires maintaining cytoplasmic pH during high-pH
