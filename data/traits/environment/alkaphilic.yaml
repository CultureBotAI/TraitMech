  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: alkaliphilic
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: alkalophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: alkalophilic
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
