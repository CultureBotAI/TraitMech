    label: Mrp Na+/H+ antiporter complex
    node_type: GENE_OR_PROTEIN
    description: Multisubunit cation/proton antiporter complex with an indispensable
      role in alkaliphile high-pH homeostasis.
  - node_id: atp_synthase_c_subunit_motifs
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: ATP synthase c-subunit alkaline-adaptive motifs
    node_type: GENE_OR_PROTEIN
    description: c-subunit motifs that alter rotor shape and promote tight proton
