    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: pH sensing and homeostasis
      notes: Supports homeostasis as the enabling process for alkaline growth.
    predicate_id: METPO:2007700
  - subject: mrp_antiporter_complex
    predicate: enables
    object: cytoplasmic_ph_homeostasis
    description: Mrp Na+/H+ antiporter complex enables pH homeostasis and is indispensable
