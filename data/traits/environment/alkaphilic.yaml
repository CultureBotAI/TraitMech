  - node_id: acidic_cell_envelope_polymers
    label: acidic secondary cell-wall and S-layer polymers
    node_type: CELLULAR_LOCALIZATION
    description: Acidic secondary cell walls and S-layer proteins on the cell surface
      of alkaliphiles.
  - node_id: surface_proton_retention
    label: proton retention at cell surface
    node_type: BIOLOGICAL_PROCESS
    description: Attraction and retention of protons at the cell surface, buffering
      the cytoplasmic membrane against high external pH.
