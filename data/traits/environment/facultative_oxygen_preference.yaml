identifier: METPO:1000612
label: facultative oxygen preference
definition: An oxygen preference that describes a microorganism that can grow with
  or without molecular oxygen.
definition_source: DOI:10.1111/cmi.13338
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
