  snippet: cope with changing oxygen levels
  notes: Supports facultative oxygen preference as growth across oxygen regimes.
- reference: DOI:10.1089/ars.2011.4051
  snippet: adaptation of respiratory metabolism to changing environments
  notes: Supports oxygen-responsive metabolic switching.
causal_graphs:
- graph_id: facultative_oxygen_preference_switching
  title: Facultative oxygen preference metabolic switching mechanism
  description: Evidence-backed causal sketch linking facultative oxygen preference
