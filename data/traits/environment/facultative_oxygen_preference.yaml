  edges:
  - subject: facultative_oxygen_trait
    predicate: responds to
    object: molecular_oxygen
    description: Facultative oxygen preference depends on coping with oxygen changes.
    evidence:
    - reference: DOI:10.1111/cmi.13338
      snippet: cope with changing oxygen levels
      notes: Supports oxygen flexibility as the trait-level mechanism.
  - subject: molecular_oxygen
    predicate: enables
    object: aerobic_respiration
    description: Oxygen availability permits aerobic respiratory growth.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.112444
      snippet: transfer electrons from the ETC to O2
      notes: Supports oxygen use by terminal oxidases during respiration.
    predicate_id: RO:0002327
  - subject: facultative_oxygen_trait
    predicate: has alternative process
    object: anaerobic_respiration_or_fermentation
    description: Growth without oxygen can use alternative electron acceptors or fermentation.
    evidence:
    - reference: DOI:10.1089/ars.2011.4051
      snippet: utilizing other substrates as final electron acceptors
      notes: Supports oxygen-independent respiratory alternatives under oxygen shortage.
  - subject: oxygen_sensing_regulation
    predicate: controls adaptation to
    object: molecular_oxygen
    description: Oxygen-sensing regulators mediate metabolic adaptation across oxygen
      regimes.
    evidence:
    - reference: DOI:10.1089/ars.2011.4051
      snippet: Fnr-type transcriptional regulators that directly sense O2
      notes: Supports regulatory oxygen sensing as a causal graph entity.
  - subject: oxygen_sensing_regulation
    predicate: represses
    object: aerobic_energy_pathways
    description: Oxygen-responsive regulators (FNR/ArcA) repress aerobic energy-generating
      pathways under anaerobiosis.
    evidence:
    - reference: DOI:10.1128/aem.01491-23
      notes: FNR and ArcA "repress aerobic energy-generating pathways" under anaerobiosis.
  - subject: oxygen_sensing_regulation
    predicate: induces
    object: anaerobic_metabolism_genes
    description: Oxygen-responsive regulators induce anaerobic metabolism genes enabling
      growth without O2.
    evidence:
    - reference: DOI:10.1128/aem.01491-23
      notes: FNR and ArcA "induce genes for anaerobic metabolism"; general regulatory
        edge for facultative bacteria.
  - subject: nitrate_electron_acceptor
    predicate: promotes
    object: anaerobic_respiration_or_fermentation
    description: Nitrate substitutes for O2 as terminal electron acceptor, supporting
      non-fermentative anaerobic respiration.
    evidence:
    - reference: DOI:10.1128/msphere.00774-23
      notes: '"addition of nitrate as a TEA promotes anaerobic respiration"; broadly
        relevant across facultative species with nitrate reductases.'
  - subject: molecular_oxygen
    predicate: enables
    object: terminal_oxidase_cytochrome_bd
    description: Trace/available oxygen lets cells use cytochrome bd as terminal oxidase;
      active terminal enzyme depends on which final electron acceptor (oxygen vs fumarate)
      is available.
    evidence:
    - reference: DOI:10.1128/jb.00389-22
      notes: '"which of these terminal enzymes is active in electron transfer depends
        on the availability of the final electron acceptor: fumarate or oxygen"; supports
        electron-acceptor-dependent branch switching.'
