identifier: METPO:1000720
label: facultative psychrophilic
definition: A temperature preference characterized by the ability to grow at low temperatures
  (typically below 20 degrees C) while maintaining optimal growth at moderate temperatures.
definition_source: DOI:10.1111/j.1574-6941.2009.00727.x
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
