identifier: METPO:1000532
label: salinity phenotype with numerical limits
definition: A phenotype characterized by specific salt concentration values or ranges
  that define growth or activity limits.
definition_source: DOI:10.1093/database/baw155
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports quantitative salinity descriptors (optimum,
    range, delta) as the standard numerical phenotype framing for halophily classification.
- reference: DOI:10.1093/femsre/fuy009
  snippet: Hypersaline environments
  notes: Osmoadaptation review supports salinity as the physical axis underlying halophily
    classifications.
causal_graphs:
- graph_id: salinity_phenotype_numerical_axis
  title: Salinity phenotype numerical-limits axis
  description: DOI-backed graph linking the ambient NaCl concentration axis to the
    three numerical-limit measurement types (optimum, range, delta) that together
    classify halophily.
  nodes:
  - node_id: salinity_phenotype_trait
    label: salinity phenotype with numerical limits
    node_type: TRAIT
    grounding: METPO:1000532
    description: Phenotype defined by a numerical NaCl concentration descriptor.
  - node_id: nacl_concentration_axis
    label: NaCl concentration axis
    node_type: ENVIRONMENTAL_FACTOR
    description: Ambient NaCl concentration as a continuous environmental variable.
  - node_id: nacl_optimum
    label: NaCl optimum
    node_type: TRAIT
    grounding: METPO:1000333
    description: NaCl concentration supporting the most efficient growth.
  - node_id: nacl_range
    label: NaCl range
    node_type: TRAIT
    grounding: METPO:1000334
    description: Span of NaCl concentrations supporting growth.
  - node_id: nacl_delta
    label: NaCl delta
    node_type: TRAIT
    grounding: METPO:1000335
    description: Breadth (max − min) of the growth-supporting NaCl range.
  - node_id: intracellular_osmotic_balance
    label: intracellular osmotic balance across salinity
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of cytoplasmic osmotic equilibrium under varying ambient
      salinity.
  - node_id: salt_out_compatible_solute_strategy
    label: compatible-solute (salt-out) strategy
    node_type: PATHWAY
    description: Osmoadaptation by accumulating small organic compatible solutes.
  - node_id: salt_in_strategy
    label: salt-in strategy
    node_type: PATHWAY
    description: Osmoadaptation by accumulating high intracellular salt, mainly potassium.
  - node_id: glycine_betaine
    label: glycine betaine
    node_type: CHEMICAL
    description: Compatible solute accumulating with rising salinity.
    grounding: CHEBI:17750
  - node_id: l_proline
    label: L-proline
    node_type: CHEMICAL
    description: Compatible solute / osmoprotectant amino acid.
  - node_id: proline_biosynthesis_pathway
    label: proB/proA/proC proline biosynthesis pathway
    node_type: PATHWAY
    description: Sequential biosynthesis of L-proline by gamma-glutamyl kinase, GSA
      dehydrogenase, and P5C reductase.
  - node_id: chaotropic_ions
    label: chaotropic ions (Mg/Ca/Li/Fe salts)
    node_type: CHEMICAL
    description: Chaotropic cations whose presence reduces microbial habitability
      of brines.
  - node_id: water_activity
    label: water activity
    node_type: ENVIRONMENTAL_FACTOR
    description: Available water (aw); a key abiotic constraint co-determining salinity
      limits.
  edges:
  - subject: nacl_concentration_axis
    predicate: defines
    object: salinity_phenotype_trait
    description: Ambient NaCl concentration is the quantitative axis defining salinity
      phenotypes.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports NaCl concentration as the quantitative axis underlying salinity-phenotype
        descriptors.
    predicate_id: METPO:2007500
  - subject: nacl_optimum
    predicate: is a
    object: salinity_phenotype_trait
    description: NaCl optimum is a numerical-limit salinity phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports NaCl optimum as a recognized salinity descriptor.
    predicate_id: rdfs:subClassOf
  - subject: nacl_range
    predicate: is a
    object: salinity_phenotype_trait
    description: NaCl range is a numerical-limit salinity phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports NaCl range as a recognized salinity descriptor.
    predicate_id: rdfs:subClassOf
  - subject: nacl_delta
    predicate: is a
    object: salinity_phenotype_trait
    description: NaCl delta is a numerical-limit salinity phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports growth-range breadth as a derived numerical salinity descriptor
        of the same axis.
    predicate_id: rdfs:subClassOf
  - subject: salt_out_compatible_solute_strategy
    predicate: maintains
    object: intracellular_osmotic_balance
    description: Accumulation of compatible solutes maintains intracellular osmotic
      balance across salinity.
    evidence:
    - reference: DOI:10.3389/frmbi.2023.1329925
      notes: Salt-out strategy relies on accumulation of small organic compatible
        solutes.
  - subject: salt_in_strategy
    predicate: maintains
    object: intracellular_osmotic_balance
    description: Salt-in strategy maintains osmotic balance via high intracellular
      salt (mainly potassium).
    evidence:
    - reference: DOI:10.3389/frmbi.2023.1329925
      notes: Salt-in strategy involves high intracellular concentration of salts,
        mainly potassium.
  - subject: glycine_betaine
    predicate: contributes to
    object: intracellular_osmotic_balance
    description: Glycine betaine accumulates with rising salinity, contributing to
      intracellular osmotic balance.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      notes: Intracellular content of compatible solutes including glycine betaine
        increases with rising salinity.
    predicate_id: RO:0002326
  - subject: l_proline
    predicate: increases
    object: salinity_phenotype_trait
    description: L-proline accumulation increases high-salinity stress tolerance.
    evidence:
    - reference: DOI:10.1128/aem.01195-24
      notes: Overproduction of L-proline improves high-salinity stress tolerance;
        broadly plausible mechanism.
    predicate_id: RO:0002213
  - subject: proline_biosynthesis_pathway
    predicate: has output
    object: l_proline
    description: proB/proA/proC pathway produces L-proline via three sequential enzymes.
    evidence:
    - reference: DOI:10.1128/aem.01195-24
      notes: Pro is biosynthesized by sequential actions of three enzymes encoded
        by proB, proA, and proC; general across many bacteria.
    predicate_id: RO:0002234
  - subject: chaotropic_ions
    predicate: decreases
    object: salinity_phenotype_trait
    description: Chaotropic ions reduce habitability at a given salinity, modifying
      observed salinity limits.
    evidence:
    - reference: DOI:10.1038/s41559-024-02505-6
      notes: Highly chaotropic brines are deleterious and seem devoid of microbial
        life; salt composition modifies salinity limits.
    predicate_id: RO:0002212
  - subject: water_activity
    predicate: constrains
    object: salinity_phenotype_trait
    description: Water activity is a general abiotic constraint on salinity growth
      limits.
    evidence:
    - reference: DOI:10.1038/s41559-024-02505-6
      notes: Systems of lower water activity constrain growth; relevant beyond NaCl-only
        limits.
