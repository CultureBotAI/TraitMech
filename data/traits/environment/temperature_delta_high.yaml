identifier: METPO:1000487
label: temperature delta high
definition: A temperature delta phenotype with a growth-supporting temperature breadth
  above approximately 30 °C, characteristic of extreme-eurythermal physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000303
synonyms:
- synonym_text: Td_>30
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports very broad homoviscous remodeling capacity
    as the basis of extreme-eurythermal physiology.
- reference: DOI:10.1128/MMBR.65.1.1-43.2001
  snippet: resistant to irreversible inactivation at high temperatures
  notes: Thermostable-protein review supports robust thermostability as the basis
    of extending tolerance beyond standard mesophile ranges.
canonical_examples:
- taxon_id: NCBITaxon:1385984
  taxon_label: Exiguobacterium chiriqhucha
  reference: DOI:10.3389/fmicb.2018.03189
  note: Eurythermal firmicute whose strain RW2 was grown across 4-50 degrees C on
    M-medium, a 46 degrees C breadth and the broadest reported for the genus; membrane
    phospholipid composition was measured at 4, 18, 30 and 50 degrees C, confirming
    growth at both endpoints rather than mere survival.
causal_graphs:
- graph_id: temperature_delta_high_eurythermal
  title: Temperature-delta-high eurythermal context
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting maximal thermal-adaptation
    flexibility, cold-side homoviscous membrane remodeling, high-temperature membrane-viscosity
    shifts, and thermostable-enzyme context to the above-30-degrees-C temperature-delta
    bin.
  nodes:
  - node_id: temperature_delta_high_trait
    label: temperature delta high
    node_type: TRAIT
    grounding: METPO:1000487
    description: Temperature growth-supporting breadth above ~30 °C.
  - node_id: temperature_delta
    label: temperature delta
    node_type: TRAIT
    grounding: METPO:1000303
    description: Breadth of the growth-supporting ambient-temperature range.
  - node_id: maximal_thermal_adaptation
    label: maximal thermal-adaptation flexibility
    node_type: BIOLOGICAL_PROCESS
    description: Combined membrane remodeling and protein-thermostability capacity
      supporting growth across an extreme temperature span.
  - node_id: decreased_growth_temperature
    label: decreased growth temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: A decrease in ambient growth temperature.
  - node_id: unsaturated_fatty_acid_biosynthesis
    label: unsaturated fatty acid biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Biosynthesis of unsaturated fatty acids for membrane remodeling.
    grounding: GO:0006636
  - node_id: homoviscous_adaptation
    label: homoviscous adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Temperature-driven remodeling of membrane lipid composition to maintain
      bilayer order.
  - node_id: membrane_fluidity_homeostasis
    label: membrane fluidity homeostasis
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of membrane fluidity and permeability across thermal
      shifts.
  - node_id: decreased_membrane_fluidity
    label: decreased membrane fluidity
    node_type: STATE
    description: Reduced membrane fluidity sensed as a signal upon cooling.
  - node_id: lipid_desaturase_activity
    label: lipid desaturase activity
    node_type: MOLECULAR_FUNCTION
    description: Desaturase activity introducing cis double bonds into fatty acids.
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical fluidity of the membrane lipid bilayer.
    grounding: METPO:1007505
  - node_id: cis_trans_isomerase_activity
    label: cis-trans isomerase activity
    node_type: MOLECULAR_FUNCTION
    description: Isomerization of existing unsaturated fatty acids to trans configuration.
    grounding: GO:0016859
  - node_id: membrane_viscosity_high_temperature
    label: membrane viscosity at higher temperature
    node_type: QUALITY
    description: Increased membrane viscosity to counter excess fluidity during warming.
  - node_id: increased_fatty_acid_diversity
    label: increased short-/branched-/unsaturated fatty acids
    node_type: CHEMICAL
    description: Shifts toward short-chain, branched-chain and unsaturated fatty acids
      in the membrane.
  - node_id: thermostable_enzyme
    label: hyperthermophilic enzyme thermostability
    node_type: QUALITY
    description: Intrinsic thermostability of enzymes from hyperthermophiles.
  - node_id: irreversible_protein_inactivation
    label: irreversible inactivation at high temperatures
    node_type: BIOLOGICAL_PROCESS
    description: Irreversible loss of protein activity at high temperatures.
  edges:
  - subject: maximal_thermal_adaptation
    predicate: confers
    object: temperature_delta_high_trait
    description: Maximal thermal-adaptation flexibility yields an extreme temperature-delta
      breadth.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: resistant to irreversible inactivation at high temperatures
      notes: Supports maximal thermal-adaptation as the basis of extreme eurythermal
        breadth.
    predicate_id: METPO:2007700
  - subject: temperature_delta_high_trait
    predicate: is a
    object: temperature_delta
    description: Temperature delta high is a quantitative bin of the temperature-delta
      phenotype.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports the >30 °C breadth as a value within the temperature-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: decreased_growth_temperature
    predicate: increases
    object: unsaturated_fatty_acid_biosynthesis
    description: Lower growth temperature increases incorporation of unsaturated fatty
      acids (homoviscous adaptation).
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: incorporation of proportionally more unsaturated fatty acids
      notes: Verified against the de Mendoza Annual Review abstract; bacterial membranes
        remodel by incorporating proportionally more unsaturated fatty acids as growth
        temperature decreases.
    predicate_id: RO:0002213
  - subject: homoviscous_adaptation
    predicate: contributes to
    object: membrane_fluidity_homeostasis
    description: Homoviscous adaptation contributes to membrane fluidity/permeability
      homeostasis across thermal shifts.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: remodel the fluidity of their membrane bilayer
      notes: Verified against the de Mendoza Annual Review abstract; homoviscous adaptation
        is the named membrane-fluidity remodeling process used after growth temperature
        decreases.
    predicate_id: RO:0002326
  - subject: decreased_membrane_fluidity
    predicate: positively regulates
    object: unsaturated_fatty_acid_biosynthesis
    description: Reduced membrane fluidity is sensed and positively regulates unsaturated
      fatty acid biosynthesis.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: upregulate the biosynthesis of unsaturated fatty acids
      notes: Verified against the de Mendoza Annual Review abstract; bacteria sense
        decreased membrane fluidity and initiate responses that upregulate unsaturated
        fatty acid biosynthesis.
    predicate_id: RO:0002213
  - subject: lipid_desaturase_activity
    predicate: increases
    object: membrane_fluidity
    description: Lipid desaturases introduce cis double bonds that loosen packing
      and increase fluidity.
    evidence:
    - reference: DOI:10.3390/cells12101353
      snippet: cis-double bonds, result in looser packing and increased fluidity
      notes: Verified against the Wu et al. Cells review; lipid desaturase-generated
        cis double bonds loosen acyl-chain packing and increase membrane-bilayer fluidity.
    predicate_id: RO:0002213
  - subject: cis_trans_isomerase_activity
    predicate: increases
    object: membrane_viscosity_high_temperature
    description: Cis-trans isomerization of existing UFAs yields trans-UFAs resembling
      SFAs, raising membrane viscosity during warming.
    evidence:
    - reference: DOI:10.3390/cells12101353
      snippet: properties that resemble SFAs
      notes: Verified against the Wu et al. Cells review; converting cis-UFAs to trans-UFAs
        makes them more SFA-like and closer packing at higher temperature.
    predicate_id: RO:0002213
  - subject: increased_fatty_acid_diversity
    predicate: increases
    object: membrane_fluidity
    description: Shifts in acyl chain length/branching and unsaturation jointly increase
      membrane fluidity at lower temperatures.
    evidence:
    - reference: DOI:10.3390/cells12101353
      snippet: increase the proportion of UFAs and short-chain fatty acids
      notes: Verified against the Wu et al. Cells review; cold-adapted membranes can
        increase unsaturated and short-chain fatty acid proportions and modify branched-chain
        fatty-acid content.
    predicate_id: RO:0002213
  - subject: thermostable_enzyme
    predicate: prevents
    object: irreversible_protein_inactivation
    description: Intrinsic enzyme thermostability prevents irreversible inactivation,
      extending upper growth limits.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: resistant to irreversible inactivation at high temperatures
      notes: Verified against the open Vieille and Zeikus review; hyperthermophilic
        enzymes are described as thermostable and resistant to irreversible inactivation
        at high temperatures.
    predicate_id: RO:0002212
  - subject: unsaturated_fatty_acid_biosynthesis
    predicate: contributes to
    object: homoviscous_adaptation
    description: Unsaturated-fatty-acid biosynthesis contributes to cold-side homoviscous
      membrane remodeling.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: termed homoviscous adaptation
      notes: Verified against the de Mendoza Annual Review abstract; this connector
        keeps unsaturated-fatty-acid biosynthesis as one component of homoviscous
        adaptation rather than the whole response.
    predicate_id: RO:0002326
  - subject: membrane_fluidity
    predicate: associated with
    object: membrane_fluidity_homeostasis
    description: Membrane fluidity is associated with the homoviscous homeostasis
      branch of broad thermal adaptation.
    evidence:
    - reference: DOI:10.3390/cells12101353
      snippet: cis-double bonds, result in looser packing and increased fluidity
      notes: Verified against the Wu et al. Cells review; this connector keeps desaturase-linked
        fluidity as a physical membrane state associated with homeostasis.
    predicate_id: biolink:associated_with
  - subject: membrane_viscosity_high_temperature
    predicate: associated with
    object: membrane_fluidity_homeostasis
    description: High-temperature membrane viscosity is associated with the warming-side
      boundary of membrane-fluidity homeostasis.
    evidence:
    - reference: DOI:10.3390/cells12101353
      snippet: properties that resemble SFAs
      notes: Verified against the Wu et al. Cells review; this connector keeps cis-trans
        isomerization as warming-side membrane context.
    predicate_id: biolink:associated_with
  - subject: membrane_fluidity_homeostasis
    predicate: associated with
    object: maximal_thermal_adaptation
    description: Membrane-fluidity homeostasis is associated with the broad thermal-adaptation
      context used to represent an extreme temperature-growth breadth.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: remodel the fluidity of their membrane bilayer
      notes: Verified against the de Mendoza Annual Review abstract; this connector
        scopes homoviscous adaptation as membrane context for the eurythermal bin.
    predicate_id: biolink:associated_with
  - subject: thermostable_enzyme
    predicate: associated with
    object: maximal_thermal_adaptation
    description: Thermostable-enzyme protection is associated with the high-temperature
      side of broad thermal adaptation.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: hyperthermophilic enzymes, are typically thermostable
      notes: Verified against the open Vieille and Zeikus review; this connector keeps
        thermostable enzymes as high-temperature context rather than direct proof
        of an above-30-degrees-C growth breadth.
    predicate_id: biolink:associated_with
