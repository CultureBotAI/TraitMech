identifier: METPO:1000534
label: delta phenotype with numerical limits
definition: A phenotype characterized by the difference between maximum and minimum
  values of a growth parameter.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports the breadth of a growth-supporting environmental
    range as a derived quantitative descriptor of microbial physiology.
- reference: DOI:10.1016/s0300-9629(97)00003-0
  snippet: adapted to environments of high temperature
  notes: Thermophile-adaptation review supports thermal-tolerance breadth as a comparable
    derived quantitative descriptor.
canonical_examples:
- taxon_id: NCBITaxon:334543
  taxon_label: Psychrobacter arcticus
  reference: DOI:10.1128/JB.01377-08
  note: Psychrobacter arcticus 273-4 grew from -10 to 28 degrees C in the reported
    experiments (38 degrees C nominal breadth); the example demonstrates an endpoint-derived
    delta while retaining the source's endpoint caveat.
causal_graphs:
- graph_id: delta_phenotype_breadth_descriptor
  title: Delta phenotype breadth descriptor across environmental axes
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed graph framing the delta phenotype as a generic derived breadth
    descriptor over any numerical environmental axis, with `is a` edges to the axis-specific
    delta phenotypes for NaCl, pH, and temperature.
  nodes:
  - node_id: delta_phenotype_trait
    label: delta phenotype with numerical limits
    node_type: TRAIT
    grounding: METPO:1000534
    description: Phenotype defined by the max − min span of a growth-supporting environmental
      variable.
  - node_id: numerical_environmental_axis
    label: numerical environmental axis
    node_type: ENVIRONMENTAL_FACTOR
    description: Any continuous environmental variable (NaCl, pH, temperature, etc.)
      on which microbial growth can be measured quantitatively.
  - node_id: nacl_delta
    label: NaCl delta
    node_type: TRAIT
    grounding: METPO:1000335
    description: Breadth of the growth-supporting NaCl range.
  - node_id: ph_delta
    label: pH delta
    node_type: TRAIT
    grounding: METPO:1000232
    description: Breadth of the growth-supporting external pH range.
  - node_id: temperature_delta
    label: temperature delta
    node_type: TRAIT
    grounding: METPO:1000303
    description: Breadth of the growth-supporting ambient-temperature range.
  - node_id: membrane_fluidity
    label: membrane fluidity/stability
    node_type: QUALITY
    description: Physical state of the lipid bilayer (fluidity, packing, integrity)
      that must be maintained for growth.
  - node_id: homeoviscous_adaptation
    label: homeoviscous adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Regulation of membrane lipid composition to keep fluidity within
      a functional window under stress.
  - node_id: compatible_solutes
    label: compatible solutes / osmolytes
    node_type: CHEMICAL
    description: Small organic molecules that stabilize proteins and membranes and
      restore osmotic balance.
  - node_id: fatty_acid_ratio
    label: saturated:unsaturated fatty-acid ratio
    node_type: QUALITY
    description: Relative abundance of saturated versus unsaturated fatty acids that
      tunes membrane stability across temperatures.
  - node_id: core_metabolism
    label: core central metabolism
    node_type: BIOLOGICAL_PROCESS
    description: Central metabolic network whose key metabolite levels are buffered
      across a wide temperature range.
  edges:
  - subject: numerical_environmental_axis
    predicate: defines
    object: delta_phenotype_trait
    description: A numerical environmental axis defines the values whose max and min
      are subtracted to yield the delta phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports a numerical environmental axis as the axis on which a growth-supporting
        range (and hence its breadth) is measured.
    predicate_id: METPO:2007500
  - subject: nacl_delta
    predicate: is a
    object: delta_phenotype_trait
    description: NaCl delta is an axis-specific delta phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports NaCl delta as a delta phenotype defined over the salinity axis.
    predicate_id: rdfs:subClassOf
  - subject: ph_delta
    predicate: is a
    object: delta_phenotype_trait
    description: pH delta is an axis-specific delta phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: pH homeostasis
      notes: Supports pH delta as a delta phenotype defined over the external-pH axis.
    predicate_id: rdfs:subClassOf
  - subject: temperature_delta
    predicate: is a
    object: delta_phenotype_trait
    description: Temperature delta is an axis-specific delta phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports temperature delta as a delta phenotype defined over the ambient-temperature
        axis.
    predicate_id: rdfs:subClassOf
  - subject: homeoviscous_adaptation
    predicate: maintains
    object: membrane_fluidity
    description: Homeoviscous adaptation regulates lipid composition to maintain membrane
      fluidity/structure under temperature, salinity, and pH stress.
    evidence:
    - reference: DOI:10.1039/d4cc03114h
      notes: Key strategies include homeoviscous adaptation (HVA), involving the regulation
        of lipid composition; linked to tolerance of temperature, salinity, and pH
        extremes.
  - subject: membrane_fluidity
    predicate: confers
    object: delta_phenotype_trait
    description: Maintaining membrane fluidity/integrity across conditions widens
      the growth-supporting range whose span defines the delta phenotype.
    evidence:
    - reference: DOI:10.1039/d4cc03114h
      notes: HVA framed as a universal paradigm of membrane adaptation spanning diverse
        extremophiles and stressors, supporting breadth of growth-supporting conditions.
    predicate_id: METPO:2007700
  - subject: compatible_solutes
    predicate: stabilizes
    object: membrane_fluidity
    description: Compatible solutes stabilize proteins and membranes and restore osmotic
      balance, broadening tolerance across temperature and osmotic conditions.
    evidence:
    - reference: DOI:10.37256/amtt.5220244537
      notes: Compatible solutes depress the freezing point, stabilize proteins and
        membranes, restore osmotic balance; broad cold + osmotic support, not species-specific.
  - subject: fatty_acid_ratio
    predicate: modulates
    object: membrane_fluidity
    description: Alteration of the saturated:unsaturated fatty-acid ratio modulates
      membrane stability across temperatures.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: Membrane stability is modulated by alteration of the ratio of saturated
        and unsaturated fatty acids; maintenance across temperature shifts.
    predicate_id: RO:0002211
  - subject: core_metabolism
    predicate: maintained across
    object: temperature_delta
    description: Regulatory-metabolic cross talk buffers core central metabolism across
      a wide temperature range, supporting a broad temperature delta.
    evidence:
    - reference: DOI:10.1128/msystems.01124-22
      notes: Different growth temperatures induce broad transcriptional changes, yet
        most key central metabolites show overlapping trends via intense regulatory-metabolic
        cross talk; maintenance across 0 and 15C.
