    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: The pfa operon encodes an omega-3 polyunsaturated fatty acid synthase.
    predicate_id: METPO:2007800
  - subject: high_hydrostatic_pressure
    predicate: increases
    object: omega3_pufa
    description: HHP increases polyunsaturated fatty acids C20:5 (EPA) and C22:6 (DHA)
