    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: Compatible solutes (piezolytes) detected include glutamate, betaine,
        and beta-hydroxybutyrate; TMAO acts as a pressure-tolerance molecule.
  - subject: piezolytes
    predicate: enables
    object: pressure_tolerance
    description: Piezolytes stabilize cellular components, conferring tolerance to
