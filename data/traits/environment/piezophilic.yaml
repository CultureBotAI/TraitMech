identifier: traitmech:000001
label: piezophilic
definition: An environmental growth preference in which an organism grows optimally
  at hydrostatic pressures substantially above atmospheric pressure (0.1 MPa), characteristic
  of deep-sea and deep-subsurface microorganisms.
definition_source: DOI:10.3389/fmolb.2022.1058381
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: barophilic
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmolb.2022.1058381
- synonym_text: piezophile
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3389/fmolb.2022.1058381
evidence:
- reference: DOI:10.3389/fmolb.2022.1058381
  snippet: Microorganisms adapted to HHP are usually known as piezophiles, referring
    to their preference for high pressure
  notes: Membrane-lipid adaptation review supports the definition of piezophiles as
    high-hydrostatic-pressure-adapted organisms, with adaptation involving unsaturated
    and branched-chain fatty acids.
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: 'Organism example: Colwellia marinimaniae strain MTCD1, the most piezophilic
    organism described, grows optimally at 120 MPa.'
canonical_examples:
- taxon_id: NCBITaxon:1513592
  taxon_label: Colwellia marinimaniae
  note: most piezophilic organism described
  reference: PMID:27902293
- taxon_id: NCBITaxon:74109
  taxon_label: Photobacterium profundum
  note: deep-sea piezophile model
  reference: PMID:15746425
causal_graphs:
- graph_id: piezophilic_hhp_membrane_adaptation
  title: Piezophilic high-pressure preference via membrane lipid adaptation
  description: Evidence-backed causal sketch linking high hydrostatic pressure to
    unsaturated / branched-chain fatty-acid membrane adaptation enabling optimal high-pressure
    growth.
  nodes:
  - node_id: piezophilic_trait
    label: piezophilic
    node_type: TRAIT
    grounding: traitmech:000001
    description: Optimal growth at hydrostatic pressures well above atmospheric.
  - node_id: high_hydrostatic_pressure
    label: high hydrostatic pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Deep-sea / deep-subsurface hydrostatic pressure (tens to >100 MPa).
  - node_id: unsaturated_branched_fa
    label: unsaturated / branched-chain fatty acids
    node_type: CHEMICAL
    description: Membrane lipid species maintaining fluidity under high pressure.
  - node_id: membrane_adaptation
    label: membrane lipid adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Lipid composition adjustment maintaining membrane fluidity under
      HHP.
  - node_id: pfa_operon
    label: pfa operon
    node_type: GENE_OR_PROTEIN
    description: Gene cluster encoding an omega-3 polyunsaturated fatty acid synthase.
  - node_id: omega3_pufa
    label: omega-3 polyunsaturated fatty acids
    node_type: CHEMICAL
    description: Omega-3 PUFAs (e.g. EPA C20:5, DHA C22:6) supporting membrane fluidity
      under HHP.
  - node_id: piezolytes
    label: piezolytes (compatible solutes)
    node_type: CHEMICAL
    description: Compatible solutes such as glutamate, betaine, beta-hydroxybutyrate
      and TMAO that confer pressure tolerance.
  - node_id: pressure_tolerance
    label: pressure tolerance
    node_type: BIOLOGICAL_PROCESS
    description: Cellular stabilization against high hydrostatic pressure.
  edges:
  - subject: high_hydrostatic_pressure
    predicate: selects for
    object: piezophilic_trait
    description: HHP habitats favor optimal-at-pressure growth phenotype.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: HHP-adapted organisms are termed piezophiles for their preference for
        high pressure.
    predicate_id: METPO:2007401
  - subject: unsaturated_branched_fa
    predicate: enables
    object: membrane_adaptation
    description: Unsaturated and branched-chain fatty acids maintain membrane fluidity
      under HHP.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: Piezophile adaptation involves unsaturated and branched-chain fatty acids.
    predicate_id: RO:0002327
  - subject: membrane_adaptation
    predicate: confers
    object: piezophilic_trait
    description: Membrane lipid adaptation enables high-pressure-optimal growth.
    evidence:
    - reference: DOI:10.1099/ijsem.0.001671
      notes: Colwellia marinimaniae MTCD1 grows optimally at 120 MPa, supported by
        HHP-adapted membranes.
    predicate_id: METPO:2007700
  - subject: high_hydrostatic_pressure
    predicate: increases
    object: unsaturated_branched_fa
    description: HHP increases abundance of membrane unsaturated and branched-chain
      fatty acids.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: The abundance of membrane lipids containing unsaturated and branched-chain
        fatty acids rises with increasing HHP.
    predicate_id: RO:0002213
  - subject: pfa_operon
    predicate: produces
    object: omega3_pufa
    description: The pfa operon encodes an omega-3 polyunsaturated fatty acid synthase
