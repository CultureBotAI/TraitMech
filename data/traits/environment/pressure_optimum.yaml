  llm_assisted: true
- timestamp: '2026-08-06T00:00:00Z'
  curator: claude
  action: MIGRATE_ENABLES_TRAIT_EDGES
  changes: Migrated 1 causal edge(s) off enables/RO:0002327 with a TRAIT object (1
    to confers), issue 302. RO:0002327 has range 'biological process or activity',
    which a trait (a disposition) cannot satisfy, so the previous form entailed trait
    is-a BiologicalProcessOrActivity. The replacements are proposed in proposals/metpo_traitmech_v8
    and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-07T05:00:00Z'
  curator: claude
  action: RETYPE_CAUSAL_NODE
  changes: Retyped the object node from STATE/CAPACITY to TRAIT and re-grounded its
    in-edge from enables/RO:0002327 to METPO:2007700 (confers), issue 334. biolink
    declares enables range 'biological process or activity', which only BIOLOGICAL_PROCESS,
    PATHWAY and MOLECULAR_FUNCTION satisfy. The node's own description gives it away
    as a disposition rather than a state - phrasings like "Capacity of an organism
    to grow and survive under...", "Ability to grow when..." and "tolerance of..."
    describe what an organism CAN do, which is what a TRAIT is. So the defect was
    the node type, not the predicate, which is the third time in this issue's neighbourhood
    that has been true (compare issue 331's acetate kinase step and issue 330's negated
    node name). With the object correctly a TRAIT, confers applies unchanged.
  llm_assisted: true
- timestamp: '2026-08-07T06:00:00Z'
  curator: claude
  action: GROUND_CAUSAL_NODES
  changes: 'Grounded the retyped TRAIT node, issue 334 review. docs/CURATION_PLAYBOOK.md
    requires every TRAIT row to carry a grounding, and 462 of 482 TRAIT nodes in the
    corpus do, so leaving a newly retyped one ungrounded was the exception rather
    than the norm. It also mattered more than hygiene: an ungrounded TRAIT node still
    counts as a reachability anchor for audit-graphs, so it made UNREACHABLE_FROM_TRAIT
    fall on this graph without any edge changing -- the island is unchanged and FRAGMENTED_GRAPH
    still reports it. Grounding it makes the duplication legible instead of leaving
    two unrelated-looking anchors. hhp_tolerance IS piezotolerant, already in the
    corpus as traitmech:000003.'
  llm_assisted: true
- timestamp: '2026-08-21T08:00:00Z'
  curator: codex
  action: NORMALISE_NODE_TYPE
  changes: 'Tranche 5 of issue 356 settles the process/quality families and merges
    ids that meant the same sense: maximal_growth_rate is QUALITY. A maximal growth
    rate is a measured upper bound or peak specific rate. Its edges associate, enable,
    or manifest that value; none describe the process of cell growth itself. An edge
    cannot enable a QUALITY under RO:0002327''s biological-process range, so edges
    that causally support the rate use promotes (RO:0002213) instead.'
  llm_assisted: true
