identifier: traitmech:000004
label: pressure optimum
definition: A pressure phenotype with numerical limits giving the hydrostatic pressure
  at which an organism grows fastest.
definition_source: DOI:10.1099/ijsem.0.001671
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: Colwellia marinimaniae MTCD1 illustrates a measurable pressure optimum (120
    MPa), the quantitative value this phenotype records.
- reference: DOI:10.3389/fmolb.2022.1058381
  snippet: Microorganisms adapted to HHP are usually known as piezophiles, referring
    to their preference for high pressure
  notes: Pressure-adaptation review supports an organism-specific optimal growth pressure
    as the defining quantity for piezophile classification.
causal_graphs:
- graph_id: pressure_optimum_balanced_adaptation
  title: Pressure-optimum balanced adaptation
  description: Evidence-backed sketch linking the hydrostatic-pressure axis to the
    organism-specific pressure at which growth rate is maximal.
  nodes:
  - node_id: pressure_optimum_trait
    label: pressure optimum
    node_type: TRAIT
    grounding: traitmech:000004
    description: Hydrostatic pressure at which growth rate is maximal.
  - node_id: hydrostatic_pressure
    label: hydrostatic pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Ambient hydrostatic pressure imposed on the cell.
    grounding: PATO:0001025
  - node_id: maximal_growth_rate
    label: maximal growth rate
    node_type: BIOLOGICAL_PROCESS
    description: Peak specific growth rate achieved at the optimum pressure.
  - node_id: membrane_unsaturated_fatty_acids
    label: membrane unsaturated fatty acids
    node_type: CHEMICAL
    description: Unsaturated/polyunsaturated fatty acids whose abundance in membrane
      lipids rises with increasing hydrostatic pressure.
  - node_id: intracellular_cation_concentration
    label: intracellular cation concentration
    node_type: STATE
    description: Intracellular concentration of cations (Mg2+, K+, Na+) raised by
      cation import under high hydrostatic pressure.
  - node_id: intracellular_osmotic_pressure
    label: intracellular osmotic pressure
    node_type: STATE
    description: Osmotic pressure inside the cell, raised by cation/compatible-solute
      accumulation.
  - node_id: hhp_tolerance
    label: high hydrostatic pressure tolerance
    node_type: CAPACITY
    description: Capacity of an organism to grow and survive under high hydrostatic
      pressure.
  - node_id: compatible_solute_accumulation
    label: compatible solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of piezolytes/osmolytes (glutamate, betaine, beta-hydroxybutyrate,
      proline, TMAO).
  - node_id: protein_stabilization_preferential_hydration
    label: protein stabilization by preferential hydration
    node_type: BIOLOGICAL_PROCESS
    description: Stabilization of proteins by compatible solutes via preferential
      hydration.
  edges:
  - subject: hydrostatic_pressure
    predicate: defines
    object: pressure_optimum_trait
    description: The hydrostatic-pressure axis defines the value at which growth is
      fastest.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: Pressure-adaptation review supports an organism-specific optimal growth
        pressure as the defining piezophile quantity.
    predicate_id: METPO:2007500
  - subject: pressure_optimum_trait
    predicate: associated with
    object: maximal_growth_rate
    description: The optimum pressure marks the peak of the pressure-versus-growth
      curve.
    evidence:
    - reference: DOI:10.1099/ijsem.0.001671
      notes: Colwellia marinimaniae MTCD1 illustrates a measurable pressure optimum
        (120 MPa).
    predicate_id: biolink:associated_with
  - subject: membrane_unsaturated_fatty_acids
    predicate: confers
    object: pressure_optimum_trait
    description: Increased membrane unsaturated/PUFA content enables growth at elevated
      hydrostatic pressure, shaping the pressure optimum.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: 'Review: abundance of membrane lipids with unsaturated and branched-chain
        fatty acids rises with increasing HHP.'
    predicate_id: METPO:2007700
  - subject: intracellular_cation_concentration
    predicate: increases
    object: intracellular_osmotic_pressure
    description: Increased cation import raises intracellular osmotic pressure.
    evidence:
    - reference: DOI:10.1128/mbio.00958-23
      notes: Authors propose increased cation import to raise intracellular osmotic
        pressure under HHP.
    predicate_id: RO:0002213
  - subject: intracellular_osmotic_pressure
    predicate: enables
    object: hhp_tolerance
    description: Elevated intracellular osmotic pressure enables high hydrostatic
      pressure tolerance.
    evidence:
    - reference: DOI:10.1128/mbio.00958-23
      notes: 'Proposed HHP-tolerance model: importing cations to raise intracellular
        osmotic pressure.'
    predicate_id: RO:0002327
  - subject: compatible_solute_accumulation
    predicate: promotes
    object: protein_stabilization_preferential_hydration
    description: Compatible solutes (piezolytes) stabilize proteins by preferential
      hydration.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: Compatible solutes displace water bound to proteins via preferential
        hydration; glutamate/betaine/beta-hydroxybutyrate detected at 20-30 MPa.
    predicate_id: RO:0002213
  - subject: compatible_solute_accumulation
    predicate: enables
    object: hhp_tolerance
    description: Compatible-solute (piezolyte) accumulation enables pressure tolerance.
    evidence:
    - reference: DOI:10.1007/s00253-023-12906-5
      notes: Osmolyte-based protection (proline, glutamate, betaine, beta-hydroxybutyrate,
        TMAO) supports pressure tolerance across taxa.
    predicate_id: RO:0002327
