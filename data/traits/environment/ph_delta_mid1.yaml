  - node_id: intracellular_proton
    label: intracellular proton (H+)
    node_type: CHEMICAL
    description: Cytoplasmic hydron whose concentration sets internal pH.
  - node_id: ybas_glutaminase
    label: YbaS glutaminase
    node_type: GENE_OR_PROTEIN
