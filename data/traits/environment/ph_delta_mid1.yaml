    evidence:
    - reference: DOI:10.3390/microorganisms12091774
      notes: The glutaminase YbaS converts glutamine to glutamate and releases ammonia,
        which neutralizes intracellular protons.
    predicate_id: METPO:2007800
  - subject: membrane_saturated_fatty_acids
    predicate: decreases
    object: proton_diffusion_across_membrane
    description: A higher proportion of saturated membrane fatty acids limits passive
      proton diffusion across the membrane.
    evidence:
    - reference: DOI:10.1128/aem.00569-24
      notes: Conversion of unsaturated to saturated fatty acids limits proton diffusion;
        broadly plausible membrane-permeability mechanism.
    predicate_id: RO:0002212
  - subject: oxidative_phosphorylation
    predicate: maintains
    object: proton_motive_force
    description: Upregulated oxidative phosphorylation/ETC increases proton export
      and maintains the proton motive force, helping resist cytoplasmic pH decreases.
    evidence:
    - reference: DOI:10.3390/microorganisms12081565
      notes: Upregulation of oxidative phosphorylation genes increases proton export
        rate and maintains a proton motive force that helps cells resist cytoplasmic
        pH decreases under mild acid (pH 6.0) growth.
  - subject: proton_motive_force
    predicate: contributes to
    object: cytoplasmic_ph_homeostasis
    description: A maintained proton motive force supports cytoplasmic pH homeostasis
      under acid stress.
    evidence:
    - reference: DOI:10.3390/microorganisms12081565
      notes: PMF generated/maintained by oxidative phosphorylation helps cells resist
        cytoplasmic pH decreases.
    predicate_id: RO:0002326
  - subject: cytoplasmic_ph_homeostasis
    predicate: contributes to
    object: moderate_ph_homeostasis
    description: Cytoplasmic pH homeostasis modules collectively underlie moderate
      pH-homeostasis flexibility.
    evidence:
    - reference: DOI:10.3390/microorganisms12091774
      notes: Proton-consumption and proton-export modules maintaining cytoplasmic
        pH underpin homeostatic flexibility across a few pH units.
    predicate_id: RO:0002326
