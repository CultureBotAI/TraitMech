identifier: METPO:1000475
label: pH delta mid1
definition: A pH delta phenotype with a growth-supporting pH breadth of approximately
  2–3 pH units, characteristic of organisms with moderate pH-tolerance breadth.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000232
synonyms:
- synonym_text: pHd_2_3
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports moderate pH-homeostasis flexibility as common
    among non-extreme microorganisms.
canonical_examples:
- taxon_id: NCBITaxon:735518
  taxon_label: Lederbergia graminis
  reference: DOI:10.1099/ijs.0.023820-0
  note: The type strain, published as Bacillus graminis YC6957T, grew from pH 6.0
    to 8.5, a 2.5-unit breadth wholly inside the approximately 2-3 bin.
causal_graphs:
- graph_id: ph_delta_mid1_moderate_breadth
  title: pH-delta-mid1 moderate-breadth pH homeostasis
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed graph linking moderate pH-homeostasis flexibility to a pH
    growth breadth of approximately 2–3 pH units.
  nodes:
  - node_id: ph_delta_mid1_trait
    label: pH delta mid1
