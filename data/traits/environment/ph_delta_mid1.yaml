      snippet: external pH
      notes: Supports the 2–3 unit breadth as a value within the pH-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: f0f1_atpase
    predicate: contributes to
    object: cytoplasmic_ph_homeostasis
    description: Under acid stress F0F1-ATPase hydrolyzes ATP to consume/export intracellular
      H+, maintaining cytoplasmic pH.
    evidence:
    - reference: DOI:10.3390/microorganisms12091774
      notes: F0F1-ATPase under acid stress hydrolyzes ATP to consume intracellular
        H+ to maintain homeostasis; broad pH-homeostasis mechanism.
    predicate_id: RO:0002326
  - subject: gln_glu_decarboxylation_pathway
    predicate: consumes
    object: intracellular_proton
    description: Coupled glutamine conversion and glutamate decarboxylation consume
      two intracellular H+, enhancing acid resistance.
    evidence:
    - reference: DOI:10.3390/microorganisms12091774
      notes: Glutamine conversion and glutamate decarboxylation can act together to
        consume two H+; pathway-level proton-consumption module.
    predicate_id: biolink:consumes
  - subject: ybas_glutaminase
    predicate: produces
    object: ammonia
    description: YbaS glutaminase converts glutamine to glutamate and releases ammonia,
