  - node_id: proton_diffusion_across_membrane
    label: proton diffusion across membrane
    node_type: BIOLOGICAL_PROCESS
    description: Passive leakage of protons across the cytoplasmic membrane.
  - node_id: oxidative_phosphorylation
    label: oxidative phosphorylation / electron transport chain
    node_type: PATHWAY
    description: ETC activity (nuo, cyo, ndh, sdh) generating and maintaining the
      proton motive force.
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Transmembrane electrochemical proton gradient supporting acid-side
