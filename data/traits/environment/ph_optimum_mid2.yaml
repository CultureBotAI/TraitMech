- timestamp: '2026-08-15T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Normalised causal-node type(s) so one node_id means one thing corpus-wide
    (issue 356): cytoplasmic_buffering_capacity: BIOLOGICAL_PROCESS -> CAPACITY; proton_motive_force:
    BIOLOGICAL_PROCESS -> STATE. A reservoir, not a process: the playbook''s CAPACITY
    table names this node explicitly as the reservoir sense (''Capacity of cytoplasmic
    buffers to absorb pH fluctuations''). The lone BIOLOGICAL_PROCESS occurrence (ph_optimum_mid2.yaml)
    describes ''Buffering of the cytoplasm (e.g. phosphate pools) absorbing pH fluctuations''
    -- the same pool the other three call a capacity. The schema''s OWN example of
    STATE: ''a bioenergetic or molecular state of the cell (e.g. proton motive force
    ...) ... the state is the gradient / steady-value, not its establishment''. All
    35 occurrences describe the gradient -- every description across all four types
    reads ''electrochemical proton gradient'', including the 13 typed BIOLOGICAL_PROCESS
    (''Transmembrane electrochemical gradient generated by respiration''), which name
    the gradient and its provenance rather than the generating process. Nothing here
    means the establishment, so this is a retype and not a rename; records that DO
    mean the process already use a separate id (proton_motive_force_generation in
    ph_delta.yaml). Also settles the one edge #356 was filed for: phototrophic.yaml''s
    CAPACITY typing was blocking `powers` (METPO:2007900), which is gated to BIOLOGICAL_PROCESS|STATE.'
  llm_assisted: true
