identifier: METPO:1000485
label: temperature delta mid1
definition: A temperature delta phenotype with a growth-supporting temperature breadth
  of approximately 10–20 °C, characteristic of organisms with moderate thermal-tolerance
  breadth.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
