  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports moderate homoviscous remodeling capacity
    as common among generalist mesophiles.
