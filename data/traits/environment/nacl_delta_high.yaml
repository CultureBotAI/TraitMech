identifier: METPO:1000482
label: NaCl delta high
definition: A NaCl delta phenotype with a growth-supporting NaCl breadth above approximately
  8% (w/v), characteristic of extreme-euryhaline organisms.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000335
synonyms:
- synonym_text: Nad_>8
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports very wide salinity-tolerance breadths as the
    extreme-euryhaline phenotype.
- reference: DOI:10.1186/1746-1448-4-2
  snippet: cope with the high salt concentrations
  notes: Saline-Systems review supports combined osmolyte / salt-in flexibility as
    the basis of very wide salinity tolerance.
canonical_examples:
- taxon_id: NCBITaxon:75750
  taxon_label: Aspergillus sydowii
  reference: DOI:10.3389/fmicb.2022.840408
  note: 'The artifact''s strongest illustrative phenotype for extreme euryhalinity:
    grows from no added NaCl up to saturated (5.13 M) NaCl, noting growth at saturation
    is weak. The cited multi-omics study establishes growth at 1 M and at saturated
    NaCl; even that conservatively evidenced interval spans roughly 24 percentage
    points w/v, far above the ~8% (w/v) bin threshold.'
- taxon_id: NCBITaxon:245174
  taxon_label: Wallemia ichthyophaga
  reference: DOI:10.1128/aem.02702-13
  note: Measured NaCl growth range of 10% to saturated (~32% w/v) with a 15-20% optimum,
    a ~22% (w/v) breadth, from the osmoadaptation study that also quantified salinity-dependent
    glycerol accumulation. The artifact flags the high lower bound as obligate halophily,
    which its own boundary rules permit alongside this trait when the measured interval
    is wide enough.
