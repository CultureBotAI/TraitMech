    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Branched (iso/anteiso) FAs derive from branched-chain amino acid precursors
        (valine, leucine, isoleucine).
  - subject: branched_chain_fatty_acids
    predicate: increases
    object: membrane_fluidity
    description: Branched-chain (anteiso) fatty acids fluidize the membrane during
      cold adaptation.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: Membrane fluidization via chain branching is a predominant longer-term
        cold adaptation mechanism.
    predicate_id: RO:0002213
