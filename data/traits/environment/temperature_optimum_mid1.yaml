      notes: Supports the 22–27 °C optimum as a value within the temperature-optimum
        distribution.
    predicate_id: rdfs:subClassOf
  - subject: mesophile_adaptation
    predicate: increases abundance of
    object: unsaturated_fatty_acids
    description: Mesophile membrane adaptation increases unsaturated fatty acid content.
