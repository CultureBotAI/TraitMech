  source: metpo.owl
- synonym_text: TO_22_to_27
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports moderate-temperature optima matched by
    homoviscous lipid composition as the mesophile setpoint.
