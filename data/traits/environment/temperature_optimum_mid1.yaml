identifier: METPO:1000443
label: temperature optimum mid1
definition: A temperature optimum phenotype with the best-growth ambient temperature
  between approximately 22 and 27 °C, characteristic of mesophilic physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
