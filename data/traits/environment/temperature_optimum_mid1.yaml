    predicate: remodels toward increased
    object: low_melting_lipids
    description: Homeoviscous adaptation increases low-melting membrane lipids.
    evidence:
    - reference: DOI:10.1039/d4cc03114h
      notes: 'Adaptive changes include increasing low-melting lipids: MUFAs, PUFAs,
        branched and short-chain fatty acids.'
  - subject: branched_chain_amino_acids
    predicate: serve as precursors for
    object: branched_chain_fatty_acids
    description: BCAAs are biosynthetic precursors of iso/anteiso branched membrane
