- timestamp: '2026-08-15T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Normalised causal-node type(s) so one node_id means one thing corpus-wide
    (issue 356): membrane_fluidity: BIOLOGICAL_PROCESS -> QUALITY; membrane_fluidity:
    description aligned with its 24 peers. The schema''s OWN example of QUALITY: ''a
    quality or measurable attribute of a cellular component (e.g. membrane fluidity
    ...)''. 24 of 25 occurrences are already QUALITY and describe ''the physical state
    of the lipid bilayer''. The lone BIOLOGICAL_PROCESS one (temperature_delta_mid2.yaml)
    is the interesting case: its DESCRIPTION said ''Maintenance of optimal membrane
    fluidity'', which is a process and would argue for a rename rather than a retype
    -- but its EDGES read the other way, ''unsaturated_fatty_acids -increases-> membrane_fluidity
    -enables-> broad_thermal_adaptation'', which is the homeoviscous-adaptation cascade
    acting on the PROPERTY, and matches how the other 24 are wired. Three signals
    (schema, 24 peers, its own edges) against one (its description), so the description
    is what was wrong; it is corrected here rather than the node being renamed.'
  llm_assisted: true
