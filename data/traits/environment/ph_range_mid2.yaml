identifier: METPO:1000462
label: pH range mid2
definition: A pH range phenotype in which the growth-supporting external pH range
  spans approximately 7–8, characteristic of neutrophile or mild-alkaliphile physiology.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
