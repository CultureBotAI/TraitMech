  - subject: external_ph_7_8
    predicate: permits maintenance of
    object: cytoplasmic_ph_homeostasis
    description: External pH 7-8 permits cells to keep internal pH near 7.0-7.5.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Internal pH kept within 7.0-7.5 and PMF relatively constant across external
        pH 5-8.
  - subject: cytoplasmic_buffering
    predicate: stabilizes
    object: cytoplasmic_ph_homeostasis
    description: Cytoplasmic buffering stabilizes internal pH given very low free
      proton count.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: A ~1 fL cytoplasm at pH 7.2 contains only ~10 free protons, so buffering
        is critical.
  - subject: na_h_antiport_activity
    predicate: acidifies
    object: cytoplasm
    description: Na+/H+ antiporter activity acidifies the cytoplasm when internal
      pH rises.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Na+/H+ and K+/H+ antiporters acidify the cytoplasm by exchanging exported
        cations for H+.
  - subject: proton_motive_force
    predicate: remains relatively constant across
    object: external_ph_5_8
    description: Neutralophiles keep PMF relatively constant across external pH ~5-8.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Neutralophilic bacteria adjust ΔpH vs Δψ so PMF stays relatively constant
        across external pH ~5-8.
  - subject: dpsi_dph_rebalancing
    predicate: maintains
    object: proton_motive_force
    description: Rebalancing of ΔpH and Δψ with external pH maintains PMF.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: The relative contribution of ΔpH and Δψ shifts with external pH to preserve
        PMF.
  - subject: f0f1_atpase
    predicate: couples
    object: atp_synthesis
    description: F0F1-ATPase couples the proton motive force to ATP synthesis.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: PMF drives ATP synthesis; F0F1 uses ~3-5 H+ per ATP.
  - subject: proton_ion_antiporters
    predicate: maintain
    object: membrane_potential
    description: Proton:ion antiporters have a direct role in maintaining membrane
      potential.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-030822-032215
      notes: Antiporters have a direct role in maintaining membrane potential in E.
        coli.
