  source: metpo.owl
- synonym_text: Alkaliphile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Facultative acidophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Neutrophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: pHR_7_to_8
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports modest alkaline-tolerance physiology as the
    basis of growth across pH 7–8.
causal_graphs:
