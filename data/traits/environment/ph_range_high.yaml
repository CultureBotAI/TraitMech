identifier: METPO:1000464
label: pH range high
definition: A pH range phenotype in which the growth-supporting external pH range
  spans approximately 10–14, characteristic of extreme-alkaliphile physiology.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000332
synonyms:
- synonym_text: Alkali Tolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Alkaliphile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Extreme Alkaliphile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: 10_to_14
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: alkaliphiles
  notes: pH-homeostasis review supports extreme-alkaliphile physiology growing at
    external pH above 10.
- reference: DOI:10.1016/j.tim.2007.02.005
  snippet: proton motive force
  notes: pH-homeostasis review supports robust Na+/H+ antiporter activity as the extreme-alkaliphile
    mechanism sustaining the proton motive force above pH 10.
