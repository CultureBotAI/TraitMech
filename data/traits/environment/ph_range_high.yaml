  - node_id: external_ph_high
    label: external pH > 10.3
    node_type: ENVIRONMENTAL_FACTOR
    description: Strongly alkaline external pH above ~10.3.
  - node_id: carbonate_speciation
    label: carbonate (CO3 2-) speciation
