identifier: METPO:1000452
label: temperature range mid3
definition: A temperature range phenotype in which the growth-supporting ambient temperature
  range spans approximately 30–34 °C, characteristic of mesophilic physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Mesophilie
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_30_to_34
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports the 30–34 °C range as the upper-mesophile
    growth range.
causal_graphs:
- graph_id: temperature_range_mid3_upper_mesophile
  title: Temperature-range-mid3 upper-mesophile range
  description: DOI-backed graph linking upper-mesophile adaptation to a temperature
    growth range of approximately 30–34 °C.
  nodes:
  - node_id: temperature_range_mid3_trait
    label: temperature range mid3
    node_type: TRAIT
    grounding: METPO:1000452
    description: Temperature growth-supporting range approximately 30–34 °C.
  - node_id: temperature_range
    label: temperature range
    node_type: TRAIT
    grounding: METPO:1000306
    description: Span of ambient temperatures supporting growth.
  - node_id: upper_mesophile_adaptation
    label: upper-mesophile adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Mesophile membrane and enzyme tuning for ambient temperatures near
      common animal host body temperatures.
  - node_id: membrane_order
    label: membrane order / fluidity state
    node_type: QUALITY
    description: Physical order/fluidity state of the membrane bilayer; the proximate
      signal for thermosensing.
  - node_id: desk_kinase_state
    label: DesK kinase-dominant state
    node_type: STATE
    description: Membrane thickness sensor DesK in its autophosphorylating kinase-dominant
      conformation.
  - node_id: desk
    label: DesK
    node_type: GENE_OR_PROTEIN
    description: Membrane-bound histidine kinase that senses membrane order/thickness.
  - node_id: desr
    label: DesR
    node_type: GENE_OR_PROTEIN
    description: Response regulator activated by DesK to control des transcription.
  - node_id: phospho_desr
    label: phosphorylated DesR
    node_type: STATE
    description: Phosphorylated DesR that tetramerizes and binds the des promoter.
  - node_id: des_gene
    label: des (acyl-lipid desaturase)
    node_type: GENE_OR_PROTEIN
    description: Fatty-acid desaturase that introduces double bonds to fluidize the
      membrane.
  - node_id: membrane_fatty_acyl_chains
    label: membrane fatty acyl chains
    node_type: CHEMICAL
    description: Fatty acyl chains of membrane phospholipids whose unsaturation modulates
      fluidity.
  - node_id: membrane_rigidification
    label: membrane rigidification and increased thickness
    node_type: BIOLOGICAL_PROCESS
    description: Cooling-induced membrane rigidification and bilayer thickening, the
      general homeoviscous sensing signal.
  - node_id: temperature_decrease
    label: temperature decrease
    node_type: ENVIRONMENTAL_FACTOR
    description: Drop in ambient temperature within/near the mesophilic range.
  - node_id: homeoviscous_adaptation
    label: homeoviscous adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Adjustment of membrane lipid composition to maintain constant fluidity
      across temperatures.
  - node_id: liquid_crystalline_membrane
    label: liquid-crystalline membrane state
    node_type: STATE
    description: Functional liquid-crystalline phase of the membrane required for
      growth.
  edges:
  - subject: upper_mesophile_adaptation
    predicate: confers
    object: temperature_range_mid3_trait
    description: Upper-mesophile adaptation enables growth across 30–34 °C.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports upper-mesophile homeoviscous adaptation as the range mechanism.
    predicate_id: METPO:2007700
  - subject: temperature_range_mid3_trait
    predicate: is a
    object: temperature_range
    description: Temperature range mid3 is a quantitative bin of the temperature-range
      phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports the 30–34 °C range as a value within the temperature-range distribution.
    predicate_id: rdfs:subClassOf
  - subject: membrane_order
    predicate: drives
    object: desk_kinase_state
    description: Increased membrane order (reduced fluidity) drives DesK to a kinase-dominant
      state; membrane physical state is the proximate signal.
    evidence:
    - reference: DOI:10.1128/mmbr.00069-23
      notes: increased membrane order (reduced fluidity) drives DesK to a kinase-dominant
        state
  - subject: desk
    predicate: phosphorylates
    object: desr
    description: Core two-component signaling step linking membrane physical state
      to transcriptional response.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      notes: DesK autophosphorylates (His188) and phosphorylates DesR
  - subject: phospho_desr
    predicate: activates transcription of
    object: des_gene
    description: DesR-P tetramerizes, binds the des promoter and induces lipid desaturation
      to restore membrane fluidity.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      notes: P-DesR tetramerizes, binds Pdes, and activates des expression
  - subject: des_gene
    predicate: introduces double bonds into
    object: membrane_fatty_acyl_chains
    description: Des-mediated unsaturation fluidizes the membrane and reduces bilayer
      thickness.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      notes: Des introduces double bonds into fatty acyl chains, fluidizing the membrane
        and reducing thickness
  - subject: temperature_decrease
    predicate: causes
    object: membrane_rigidification
    description: General physical trigger underlying homeoviscous adaptation across
      microbes.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: membrane rigidification and increased thickness are proposed as sensing
        signals that trigger adaptive responses
    predicate_id: biolink:causes
  - subject: homeoviscous_adaptation
    predicate: maintains
    object: liquid_crystalline_membrane
    description: 'Broad mechanism relevant to upper-mesophile growth: cells preserve
      membrane function across temperature fluctuations.'
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      notes: maintain the liquid-crystalline phase at low temperature
