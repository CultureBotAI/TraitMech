identifier: METPO:1000452
label: temperature range mid3
definition: A temperature range phenotype in which the growth-supporting ambient temperature
  range spans approximately 30–34 °C, characteristic of mesophilic physiology.
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Mesophilie
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_30_to_34
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: mesophilic
  synonym_type: EXACT_SYNONYM
  source: https://w3id.org/metpo/releases/2026-06-12/metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports the 30–34 °C range as the upper-mesophile
    growth range.
canonical_examples:
- taxon_id: NCBITaxon:1793963
  taxon_label: Bacillus nakamurai
  reference: DOI:10.1099/ijsem.0.001135
  note: Bacillus nakamurai NRRL B-41091T grew from 17 to 50 degrees C in its primary
    species description, a directly reported 33-degree breadth within the approximately
    30-34-degree range-width bin.
causal_graphs:
- graph_id: temperature_range_mid3_upper_mesophile
  title: Temperature-range-mid3 upper-mesophile context
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting upper-mesophile growth-range
    context, the DesK/DesR membrane-order sensor, des expression, cooling-induced
    membrane rigidification, and homeoviscous liquid-crystalline membrane maintenance.
  nodes:
  - node_id: temperature_range_mid3_trait
    label: temperature range mid3
    node_type: TRAIT
    grounding: METPO:1000452
    description: Temperature growth-supporting range approximately 30–34 °C.
  - node_id: temperature_range
    label: temperature range
    node_type: TRAIT
    grounding: METPO:1000306
    description: Span of ambient temperatures supporting growth.
  - node_id: upper_mesophile_adaptation
    label: upper-mesophile adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Mesophile membrane and enzyme tuning for ambient temperatures near
      common animal host body temperatures.
  - node_id: membrane_order
    label: membrane order / fluidity state
    node_type: QUALITY
    description: Physical order/fluidity state of the membrane bilayer; the proximate
      signal for thermosensing.
  - node_id: desk_kinase_state
    label: DesK kinase-dominant state
    node_type: STATE
    description: Membrane thickness sensor DesK in its autophosphorylating kinase-dominant
      conformation.
  - node_id: desk
    label: DesK
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: Membrane-bound histidine kinase that senses membrane order/thickness.
  - node_id: desr
    label: DesR
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: Response regulator activated by DesK to control des transcription.
  - node_id: phospho_desr
    label: phosphorylated DesR
    node_type: STATE
    description: Phosphorylated DesR that tetramerizes and binds the des promoter.
  - node_id: des_gene
    label: des (acyl-lipid desaturase)
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: Fatty-acid desaturase that introduces double bonds to fluidize the
      membrane.
  - node_id: membrane_fatty_acyl_chains
    label: membrane fatty acyl chains
    node_type: CHEMICAL
    description: Fatty acyl chains of membrane phospholipids whose unsaturation modulates
      fluidity.
  - node_id: membrane_rigidity
    label: membrane rigidification and increased thickness
    node_type: QUALITY
    description: Cooling-induced membrane rigidification and bilayer thickening, the
      general homeoviscous sensing signal.
  - node_id: temperature_decrease
    label: temperature decrease
    node_type: ENVIRONMENTAL_FACTOR
    description: Drop in ambient temperature within/near the mesophilic range.
  - node_id: homeoviscous_adaptation
    label: homeoviscous adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Adjustment of membrane lipid composition to maintain constant fluidity
      across temperatures.
  - node_id: liquid_crystalline_membrane
    label: liquid-crystalline membrane state
    node_type: STATE
    description: Functional liquid-crystalline phase of the membrane required for
      growth.
  edges:
  - subject: upper_mesophile_adaptation
    predicate: confers
    object: temperature_range_mid3_trait
    description: Upper-mesophile adaptation enables growth across 30–34 °C.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports upper-mesophile homeoviscous adaptation as the range mechanism.
    predicate_id: METPO:2007700
  - subject: temperature_range_mid3_trait
    predicate: is a
    object: temperature_range
    description: Temperature range mid3 is a quantitative bin of the temperature-range
      phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports the 30–34 °C range as a value within the temperature-range distribution.
    predicate_id: rdfs:subClassOf
  - subject: membrane_order
    predicate: positively regulates
    object: desk_kinase_state
    description: Increased membrane order (reduced fluidity) promotes the DesK kinase-dominant
      state; membrane physical state is the proximate signal.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: kinase-dominant state of DesK
      notes: Verified against the open Sidarta et al. introduction; the current Des
        model links temperature-decrease-driven membrane rigidification/thickening
        to the active kinase-dominant state.
    predicate_id: RO:0002213
  - subject: desk
    predicate: positively regulates
    object: desr
    description: DesK controls DesR phosphorylation in the core two-component signaling
      step linking membrane physical state to transcriptional response.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: phosphorylating or dephosphorylating DesR
      notes: Verified against the open Sidarta et al. introduction; DesK is described
        as a membrane-associated histidine kinase that phosphorylates or dephosphorylates
        DesR in a temperature-dependent manner.
    predicate_id: RO:0002213
  - subject: phospho_desr
    predicate: positively regulates
    object: des_gene
    description: DesR-P tetramerizes, binds the des promoter, and positively regulates
      des expression for lipid desaturation.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: activating expression of the des gene
      notes: Verified against the open Sidarta et al. introduction; phosphorylated
        DesR tetramers bind Pdes and activate des transcription.
    predicate_id: RO:0002213
  - subject: des_gene
    predicate: regulates
    object: membrane_fatty_acyl_chains
    description: Des-mediated unsaturation regulates membrane fatty acyl chains, fluidizing
      the membrane and reducing bilayer thickness.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: desaturates the fatty acyl chains
      notes: Verified against the open Sidarta et al. introduction; Des desaturates
        membrane-lipid fatty acyl chains as the effector of the DesK/DesR temperature-sensing
        system.
    predicate_id: RO:0002211
  - subject: temperature_decrease
    predicate: causes
    object: membrane_rigidity
    description: A temperature decrease causes membrane rigidification and increased
      thickness, a physical trigger for homeoviscous adaptation.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: rigidification and concomitant thickening
      notes: Verified against the open Sidarta et al. introduction; temperature decrease
        is described as causing cell-membrane rigidification and thickening.
    predicate_id: biolink:causes
  - subject: homeoviscous_adaptation
    predicate: contributes to
    object: liquid_crystalline_membrane
    description: Homeoviscous adaptation contributes to a functional liquid-crystalline
      membrane state at low temperature.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: maintain the liquid crystalline phase
      notes: Verified against the open Ramón et al. review; organisms in cold environments
        are described as adapting their membrane composition to maintain a liquid-crystalline
        state.
    predicate_id: RO:0002326
  - subject: membrane_rigidity
    predicate: associated with
    object: membrane_order
    description: Cooling-induced membrane rigidification is associated with the ordered
      membrane state sensed by DesK.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: rigidification and concomitant thickening
      notes: Verified against the open Sidarta et al. introduction; this connector
        joins the cooling membrane signal to the DesK kinase-state branch.
    predicate_id: biolink:associated_with
  - subject: desk_kinase_state
    predicate: associated with
    object: desk
    description: The DesK kinase-dominant state is associated with the DesK/DesR temperature-sensing
      step.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: phosphorylating or dephosphorylating DesR
      notes: Verified against the open Sidarta et al. introduction; this connector
        keeps DesK kinase activity as two-component signaling context.
    predicate_id: biolink:associated_with
  - subject: desr
    predicate: associated with
    object: phospho_desr
    description: DesR regulation is associated with phosphorylated DesR promoter activation
      in the DesK/DesR branch.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: activating expression of the des gene
      notes: Verified against the open Sidarta et al. introduction; this connector
        joins DesR to its phosphorylated transcription-activation context.
    predicate_id: biolink:associated_with
  - subject: membrane_fatty_acyl_chains
    predicate: associated with
    object: homeoviscous_adaptation
    description: Des-mediated fatty-acyl-chain unsaturation is associated with homeoviscous
      membrane adaptation.
    evidence:
    - reference: DOI:10.1128/spectrum.03925-23
      snippet: desaturates the fatty acyl chains
      notes: Verified against the open Sidarta et al. introduction; this connector
        keeps des expression as membrane-fatty-acyl remodeling context.
    predicate_id: biolink:associated_with
  - subject: liquid_crystalline_membrane
    predicate: associated with
    object: upper_mesophile_adaptation
    description: Maintenance of a liquid-crystalline membrane state is associated
      with upper-mesophile range adaptation.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: maintain the liquid crystalline phase
      notes: Verified against the open Ramón et al. review; this connector keeps homeoviscous
        membrane-state maintenance as range-bin context.
    predicate_id: biolink:associated_with
