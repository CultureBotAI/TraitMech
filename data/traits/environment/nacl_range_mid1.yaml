identifier: METPO:1000470
label: NaCl range mid1
definition: A NaCl range phenotype in which the growth-supporting NaCl range spans
  approximately 1–3% (w/v), characteristic of slight-halophilic or halotolerant organisms.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
