- timestamp: '2026-08-08T05:00:00Z'
  curator: claude
  action: MERGE_CAUSAL_NODE
  changes: 'Merged node salt_tolerance into slightly_halophilic_trait and repointed
    its edges. Issue 352. A SEVENTH restatement, caught in the third review round
    (#360). I had grounded it METPO:1000622 (halotolerant), reasoning that the record
    is METPO:1000625 (slightly halophilic) so the term is ''distinct''. It is distinct
    in the worst way: 1000622 and 1000625 are DIRECT SIBLINGS under 1000629 (halophily
    preference), and 1000622 means ''tolerates high salt but DOES NOT REQUIRE it for
    growth'' while 1000625 means the organism ''REQUIRES low to moderate salt for
    optimal growth''. So the node asserted of this record the negation of what the
    record''s own term says. Distinct is not the test; compatible is. NO CONNECTIVITY
    CLAIM HERE: the node was already in the trait''s component via osmoprotectant_transport
    -> compatible_solutes -> osmotic_stress, so merging leaves the graph at 2 components
    and is a correctness fix, not a structural one. METPO has no generic salt-tolerance
    disposition to reground to: halotolerant and acidotolerant are the only candidate
    labels and each already anchors its own record. Recorded as issue #364, which
    proposes a tolerance axis distinct from the preference axis; nothing under proposals/
    yet.'
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Applied the PATHWAY-vs-BIOLOGICAL_PROCESS rule so one node_id means one
    thing (issue 356): ectoine_biosynthesis: BIOLOGICAL_PROCESS -> PATHWAY. PATHWAY
    is a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is
    everything else. A named route with its steps enumerated in the corpus''s own
    description: ''Five-step biosynthesis of ectoine from L-aspartate (lysC/asd/ectB/ectA/ectC)''.
    Against the majority, which was 4 BIOLOGICAL_PROCESS to 2.'
  llm_assisted: true
