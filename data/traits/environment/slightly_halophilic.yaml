identifier: METPO:1000625
label: slightly halophilic
definition: A halophily preference in which an organism requires low to moderate salt
  concentrations (0.3 to 0.8 M NaCl) for optimal growth.
definition_source: PMID:12501437
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000629
evidence:
- reference: PMID:12501437
  snippet: A slightly halophilic, extremely halotolerant, alkaliphilic
  notes: 'Organism example: Paraliobacillus ryukyuensis strain O15-7T is described
    as slightly halophilic.'
causal_graphs:
- graph_id: slight_halophile_low_salt_osmoadaptation
  title: Slight halophile low-salt osmoadaptation mechanism
  description: Evidence-backed causal sketch linking slight halophily to low or moderate
    NaCl and compatible-solute osmoprotection.
  nodes:
  - node_id: slightly_halophilic_trait
    label: slightly halophilic
    node_type: TRAIT
    grounding: METPO:1000625
    description: Optimal growth requires low to moderate salt concentrations.
  - node_id: low_moderate_nacl
    label: low to moderate NaCl
    node_type: ENVIRONMENTAL_FACTOR
    description: Salinity range below that of moderate and extreme halophiles.
  - node_id: osmotic_stress
    label: osmotic stress
    node_type: BIOLOGICAL_PROCESS
    description: Osmotic challenge caused by environmental salt.
    grounding: GO:0006970
  - node_id: compatible_solutes
    label: compatible solutes
    node_type: CHEMICAL
    description: Organic osmoprotectants accumulated or synthesized in response to
      salt.
    grounding: CHEBI:25728
  - node_id: osmoprotectant_transport
    label: osmoprotectant transport
    node_type: MOLECULAR_FUNCTION
    description: Uptake of compatible solutes such as glycine betaine.
  - node_id: ectoine_biosynthesis
    label: ectoine biosynthesis
    node_type: PATHWAY
    description: Biosynthesis of the compatible solute ectoine via the ectABC/ectBACD
      pathway.
    grounding: GO:0019491
  - node_id: ect_gene_cluster
    label: ectABC/ectBACD gene cluster
    node_type: GENE_OR_PROTEIN
    description: Ectoine biosynthesis operon encoding the ectoine pathway enzymes.
  - node_id: ectoine
    label: ectoine
    node_type: CHEMICAL
    description: A major compatible solute (osmolyte) accumulated under salt stress.
    grounding: CHEBI:27592
  - node_id: ion_homeostasis
    label: ion homeostasis during salt stress
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of Na+/K+ balance under salt stress.
  - node_id: na_k_transcription
    label: Na+/K+ transcriptional induction
    node_type: BIOLOGICAL_PROCESS
    description: Coordinated induction of sodium/potassium transport transcription
      under salt stress.
  edges:
  - subject: low_moderate_nacl
    predicate: confers
    object: slightly_halophilic_trait
    description: Slight halophily is a salt-growth preference at lower salinity than
      moderate or extreme halophily.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: minimum salt concentration required for growth
      notes: Review supports halophily as a continuum of salt growth requirements.
    predicate_id: METPO:2007700
  - subject: low_moderate_nacl
    predicate: causes
    object: osmotic_stress
    description: Even lower salinity preferences involve osmotic adjustment to environmental
      salt.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: salt relationships
      notes: Review describes growth in relation to minimum, optimum, and upper salt
        limits.
    predicate_id: biolink:causes
  - subject: compatible_solutes
    predicate: mitigates
    object: osmotic_stress
    description: Compatible solutes provide osmotic balance without disrupting metabolism.
    evidence:
    - reference: DOI:10.1371/journal.pone.0168818
      snippet: do not disturb the cell's metabolism
      notes: Supports compatible solutes as non-disruptive osmoprotectants.
    predicate_id: METPO:2007407
  - subject: osmoprotectant_transport
    predicate: accumulates
    object: compatible_solutes
    description: Uptake systems can accumulate compatible solutes for salt adaptation.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: organic osmotic solutes
      notes: Review supports accumulation of organic osmotic solutes in bacterial
        osmoadaptation.
    predicate_id: METPO:2007810
  - subject: ect_gene_cluster
    predicate: enables
    object: ectoine_biosynthesis
    description: The ect gene cluster encodes the enzymes that carry out ectoine biosynthesis.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: ectoine biosynthesis genes are denoted by ectABC; ectBACD up-regulated
        as an osmoadaptation system.
    predicate_id: RO:0002327
  - subject: ectoine_biosynthesis
    predicate: has output
    object: ectoine
    description: Ectoine biosynthesis produces the compatible solute ectoine.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: Wild-type accumulates ectoine as its major osmolyte via the ectABC pathway.
    predicate_id: RO:0002234
  - subject: ectoine
    predicate: increases
    object: slightly_halophilic_trait
    description: Accumulation of ectoine as a compatible solute increases salt tolerance.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: Wild-type accumulates ectoine as its major osmolyte while the ectABC-deleted
        strain is salt-sensitive.
    predicate_id: RO:0002213
  - subject: osmoprotectant_transport
    predicate: increases
    object: slightly_halophilic_trait
    description: Uptake of compatible solutes is a general salt-out osmoadaptation
      strategy that raises salt tolerance.
    evidence:
    - reference: DOI:10.1093/femsre/fuy026
      notes: Salt-out strategists exclude salt and/or synthesize or uptake compatible
        solutes (e.g. glycine betaine); dominant strategy in many halophilic bacteria.
    predicate_id: RO:0002213
  - subject: na_k_transcription
    predicate: supports
    object: ion_homeostasis
    description: Coordinated induction of Na+/K+ transcription supports ion homeostasis
      during salt stress.
    evidence:
    - reference: DOI:10.1038/s42003-022-04319-3
      notes: Coordinated induction of Na+/K+ transcription and ectoine, proline, and
        betaine biosynthesis under salt stress.
