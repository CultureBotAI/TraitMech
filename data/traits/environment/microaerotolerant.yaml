identifier: METPO:1000610
label: microaerotolerant
definition: An oxygen preference that tolerates low levels of molecular oxygen (O₂)
  without requiring it.
definition_source: DOI:10.1016/j.biortech.2011.02.011
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000601
evidence:
- reference: DOI:10.1016/j.biortech.2011.02.011
  snippet: microaerotolerant or aerotolerant anaerobes can survive
  notes: Supports microaerotolerance as survival under limited oxygen exposure.
- reference: PMID:30113300
  snippet: The novel strain stains Gram-negative and Congo-red-negative and is characterized
    mesophilic, neutrophilic, chemoheterotrophic and microaerotolerant
  notes: 'Organism example: Simulacricoccus ruber strain MCy10636 is described as
    microaerotolerant.'
causal_graphs:
