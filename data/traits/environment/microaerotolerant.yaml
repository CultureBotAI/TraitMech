      notes: Supports low-oxygen survival as the defining trait context.
  - subject: microaerotolerant_trait
    predicate: does not require
    object: limited_oxygen_exposure
    description: Microaerotolerance differs from microaerophily because oxygen is
      tolerated rather than required.
