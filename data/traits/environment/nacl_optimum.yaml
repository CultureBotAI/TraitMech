identifier: METPO:1000333
label: NaCl optimum
definition: A salinity phenotype with numerical limits that supports the most efficient
  growth and reproduction of an organism.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000532
- METPO:1000536
created_by: Luke Wang
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: optimal NaCl
  notes: Osmoadaptation review supports the NaCl concentration at which growth rate
    is maximal as a standard halophily descriptor.
- reference: DOI:10.1186/1746-1448-4-2
  snippet: ways they cope with the high salt concentrations
  notes: Saline-Systems review supports osmotic balance at the optimal NaCl as the
    mechanistic basis of the NaCl-optimum phenotype.
canonical_examples:
- taxon_id: NCBITaxon:200904
  taxon_label: Paraliobacillus ryukyuensis
  reference: DOI:10.2323/jgam.48.269
  note: 'Strain O15-7T had a maximum-specific-growth-rate optimum spanning 0.75-3.0%
    (w/v) NaCl. Because that interval touches the low/mid1 boundary, #591 keeps the
    complete claim on the parent rather than duplicating it onto a bin.'
causal_graphs:
- graph_id: nacl_optimum_balanced_osmoadaptation
  title: NaCl optimum with salt-in, salt-out, and transporter support
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting ambient NaCl, osmotic balance,
    salt-in K+ accumulation, acidic-proteome support, compatible-solute accumulation
    and uptake, cation transport, and maximal growth rate for the NaCl-optimum phenotype.
  nodes:
  - node_id: nacl_optimum_trait
    label: NaCl optimum
    node_type: TRAIT
    grounding: METPO:1000333
    description: NaCl concentration at which growth rate is maximal.
  - node_id: ambient_nacl
    label: ambient NaCl concentration
    node_type: ENVIRONMENTAL_FACTOR
    description: Ambient NaCl level imposed on the cell.
  - node_id: osmotic_balance
    label: osmotic balance
    node_type: BIOLOGICAL_PROCESS
    description: Steady-state matching of intracellular osmotic activity to the external
      salt concentration.
  - node_id: compatible_solutes
    label: compatible solutes
    node_type: CHEMICAL
    description: Organic osmolytes (ectoine, glycine betaine) maintaining cytoplasmic
      osmotic activity.
    grounding: CHEBI:25728
  - node_id: na_h_antiporters
    label: Na+/H+ antiporters
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: Membrane antiporters extruding Na+ in exchange for H+ to maintain
      ion homeostasis.
  - node_id: maximal_growth_rate
    label: maximal growth rate
    node_type: QUALITY
    description: Peak specific growth rate achieved at the optimal NaCl.
  - node_id: osmotic_stress
    label: osmotic stress
    node_type: BIOLOGICAL_PROCESS
    description: Cellular stress imposed by an external salt concentration that perturbs
      water activity.
    grounding: GO:0006970
  - node_id: salt_in_strategy
    label: salt-in strategy
    node_type: BIOLOGICAL_PROCESS
    description: Osmoadaptive strategy of accumulating molar inorganic ions (notably
      KCl) in the cytoplasm.
    grounding: METPO:1007720
  - node_id: intracellular_k_accumulation
    label: intracellular K+ accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of molar concentrations of potassium ions to balance
      external salt.
  - node_id: acidic_proteome
    label: acidic proteome
    node_type: QUALITY
    description: Highly acidic proteome adapted to function at high intracellular
      salt concentrations.
  - node_id: protein_stability_high_salt
    label: protein stability at high salt
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of protein folding and enzymatic function under near-saturating
      intracellular salt.
  - node_id: compatible_solute_accumulation
    label: compatible-solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of organic compatible solutes that do not interfere
      with enzymatic activity.
  - node_id: compatible_solute_uptake
    label: compatible solute uptake
    node_type: BIOLOGICAL_PROCESS
    description: Import of compatible solutes from the medium, energetically favored
      over de novo synthesis.
  - node_id: lower_energetic_cost
    label: lower energetic cost than de novo synthesis
    node_type: QUALITY
    description: Reduced metabolic energy expenditure relative to synthesizing compatible
      solutes de novo.
  - node_id: na_k_h_transport_activity
    label: Na+/K+/H+ transporter activity
    node_type: MOLECULAR_FUNCTION
    description: Cation/proton transporter activity preserving intracellular K+ concentration
      and broader ion homeostasis under varying salinities.
  - node_id: cellular_ion_homeostasis
    label: cellular ion homeostasis
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of cytoplasmic potassium concentration and broader cellular
      ion balance during salinity change.
  edges:
  - subject: ambient_nacl
    predicate: causes
    object: osmotic_balance
    description: External NaCl level engages the osmoadaptive balance machinery.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: cope with the high salt concentrations
      notes: Supports osmotic balance as the response to ambient NaCl.
    predicate_id: biolink:causes
  - subject: compatible_solutes
    predicate: regulates
    object: osmotic_balance
    description: Compatible-solute accumulation maintains osmotic balance at the optimal
      NaCl.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: synthesize organic osmotic solutes
      notes: Supports compatible solutes as the osmoadaptive osmolyte.
    predicate_id: RO:0002211
  - subject: na_h_antiporters
    predicate: enables
    object: osmotic_balance
    description: Na+/H+ antiporters support ion homeostasis underlying osmotic balance.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: Na+/H+ antiporters
      notes: Supports antiporter-driven Na+ extrusion as an osmoadaptive mechanism.
    predicate_id: RO:0002327
  - subject: osmotic_balance
    predicate: promotes
    object: maximal_growth_rate
    description: Maintained osmotic balance promotes peak growth at the optimal NaCl
      concentration.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: optimum
      notes: Supports peak growth at the optimal NaCl as the operational definition
        of NaCl optimum.
    predicate_id: RO:0002213
  - subject: maximal_growth_rate
    predicate: manifests as
    object: nacl_optimum_trait
    description: The NaCl concentration at which peak growth is achieved manifests
      the NaCl-optimum phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports the trait endpoint.
    predicate_id: METPO:2007400
  - subject: ambient_nacl
    predicate: causes
    object: osmotic_stress
    description: External NaCl creates the osmotic imbalance that requires osmoadaptive
      compensation.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: cytoplasm has to be at least isoosmotic
      notes: Verified against the open Oren review; halophilic cells must osmotically
        balance the cytoplasm against high-salt medium.
    predicate_id: biolink:causes
  - subject: salt_in_strategy
    predicate: increases
    object: intracellular_k_accumulation
    description: The salt-in strategy accumulates molar potassium and chloride concentrations
      in the cytoplasm.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: accumulation of molar concentrations of potassium and chloride
      notes: Verified against the open Oren review; high-salt-in organisms balance
        external salt primarily with intracellular KCl.
    predicate_id: RO:0002213
  - subject: acidic_proteome
    predicate: enables
    object: protein_stability_high_salt
    description: An acidic proteome enables protein folding and enzymatic function
      under near-saturating intracellular salt.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: extensive adaptation of the intracellular enzymatic machinery
      notes: Verified against the open Oren review; high-salt-in strategists require
        intracellular enzymatic machinery adapted to molar salt.
    predicate_id: RO:0002327
  - subject: compatible_solute_accumulation
    predicate: regulates
    object: osmotic_balance
    description: Organic compatible-solute accumulation regulates osmotic balance
      while limiting inorganic salt in the cytoplasm.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: exclude salt from their cytoplasm as much as possible
      notes: Verified against the open Oren review; the salt-out strategy excludes
        salt from the cytoplasm and accumulates organic solutes that minimally perturb
        enzymatic activity.
    predicate_id: RO:0002211
  - subject: compatible_solute_uptake
    predicate: associated with
    object: lower_energetic_cost
    description: Compatible-solute uptake is associated with lower energetic cost
      than de novo compatible-solute synthesis.
    evidence:
    - reference: DOI:10.3389/fmicb.2022.846677
      snippet: uptake of compatible solute from the medium is preferred
      notes: Verified against the open Halomonas elongata review; external compatible-solute
        uptake is energetically preferred over de novo synthesis.
    predicate_id: biolink:associated_with
  - subject: na_k_h_transport_activity
    predicate: regulates
    object: cellular_ion_homeostasis
    description: Na+/K+/H+ transporter activity contributes to cellular ion homeostasis
      under varying salinities.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      snippet: transport systems that regulate intracellular Na+/K+/H+ concentration
      notes: Verified against the Xing et al. long-term salinity-stress study; the
        edge was broadened from Na+ homeostasis to match the reported Na+/K+/H+ transporter
        and intracellular K+ response.
    predicate_id: RO:0002211
  - subject: intracellular_k_accumulation
    predicate: contributes to
    object: osmotic_balance
    description: Intracellular KCl accumulation is a salt-in osmoadaptation route
      that contributes to balancing external salt.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: accumulation of molar concentrations of potassium and chloride
      notes: Verified against the open Oren review; the connector links KCl accumulation
        to osmotic balance without making the salt-in strategy universal for every
        NaCl optimum.
    predicate_id: RO:0002326
  - subject: salt_in_strategy
    predicate: associated with
    object: acidic_proteome
    description: Salt-in osmoadaptation is associated with proteome-scale acidic adaptation
      for molar intracellular KCl.
    evidence:
    - reference: DOI:10.1186/1746-1448-4-2
      snippet: extensive adaptation of the intracellular enzymatic machinery
      notes: Verified against the open Oren review; the connector keeps acidic-proteome
        stability scoped to salt-in strategists.
    predicate_id: biolink:associated_with
  - subject: compatible_solute_uptake
    predicate: associated with
    object: compatible_solute_accumulation
    description: External compatible-solute uptake is associated with the salt-out
      branch that accumulates organic osmolytes for osmoadaptation.
    evidence:
    - reference: DOI:10.3389/fmicb.2022.846677
      snippet: uptake of compatible solute from the medium is preferred
      notes: Verified against the open Halomonas elongata review; the connector treats
        uptake as an accumulation branch with a lower energetic cost than de novo
        synthesis.
    predicate_id: biolink:associated_with
  - subject: cellular_ion_homeostasis
    predicate: associated with
    object: osmotic_balance
    description: Na+/K+/H+ transporter control of cellular ion homeostasis is associated
      with osmotic balancing during salinity change.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      snippet: transport systems that regulate intracellular Na+/K+/H+ concentration
      notes: Verified against the Xing et al. long-term salinity-stress study; the
        connector places the species-specific transporter response inside the osmotic-balance
        context.
    predicate_id: biolink:associated_with
