- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): salt_in_strategy is typed BIOLOGICAL_PROCESS. PATHWAY
    is a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is
    everything else. A STRATEGY, not a route. The family is described as osmoadaptation
    by accumulating intracellular inorganic ions -- haloalkaliphilic.yaml puts it
    as ''Osmoadaptation by intracellular accumulation of inorganic ions (e.g. K+)'',
    and the wording varies by record. There is no step list to enumerate, which is
    exactly the distinction this rule draws. Was 7 BIOLOGICAL_PROCESS to 1 before
    this tranche.'
  llm_assisted: true
- timestamp: '2026-08-20T08:00:00Z'
  curator: claude
  action: BACKFILL_CANONICAL_EXAMPLES
  changes: 'Added one exemplar taxon, the only organism in this trait''s deep-research
    artifact for which that artifact cites a measured NaCl growth optimum. Taxon id
    resolved and label-checked against the local NCBITaxon build. Three sets of organisms
    named in the same artifact were deliberately NOT included, each because the artifact
    itself says the evidence stops short of a NaCl optimum: Halomonas elongata (the
    engineered proline strains shift an IC50, and the artifact warns "an IC50 or improved
    tolerance is not automatically equivalent to a rigorously re-estimated NaCl optimum");
    Natranaerobius thermophilus (its reported 3.3-3.9 M optimum is total Na+ at pH
    9.5, and the artifact warns "Do not merge NaCl, Na+, total salts, conductivity,
    osmolarity, and water activity"); and the Dead Sea spring MAG taxa Prosthecochloris,
    Flexistipes, Izemoplasma, Halomonas and Halanaerobiales (the artifact notes "MAG
    content predicts potential; it does not establish expression, flux, or the growth
    optimum of each organism").'
  llm_assisted: true
- timestamp: '2026-08-21T08:00:00Z'
  curator: codex
  action: NORMALISE_NODE_TYPE
  changes: 'Tranche 5 of issue 356 settles the process/quality families and merges
    ids that meant the same sense: maximal_growth_rate is QUALITY. A maximal growth
    rate is a measured upper bound or peak specific rate. Its edges associate, enable,
    or manifest that value; none describe the process of cell growth itself. An edge
    cannot enable a QUALITY under RO:0002327''s biological-process range, so edges
    that causally support the rate use promotes (RO:0002213) instead.'
