identifier: METPO:1000441
label: temperature optimum very low
definition: A temperature optimum phenotype with the best-growth ambient temperature
  at or below approximately 10 °C, characteristic of psychrophilic physiology.
definition_source: DOI:10.1038/sj.embor.7400662
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000304
synonyms:
- synonym_text: Psychrophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TO_<=10
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/sj.embor.7400662
  snippet: growing well at temperatures around the freezing point of water
  notes: Psychrophile review supports growth at very low temperatures as the psychrophilic
    optimum.
canonical_examples:
- taxon_id: NCBITaxon:132926
  taxon_label: Clostridium psychrophilum
  reference: DOI:10.1016/j.bbalip.2013.02.004
  note: Clostridium psychrophilum was cultured near its reported optimal growth temperature
    of 5 degrees C and also at -5 degrees C for the cited membrane-lipid study; the
    optimum is wholly inside the at-most-10-degree bin.
causal_graphs:
