    evidence:
    - reference: DOI:10.1128/AEM.01928-22
      snippet: proportion of unsaturated fatty acids was higher
      notes: Verified against the open Yang et al. abstract; Bacillus simplex H-b
        cultured at low temperature carried a higher unsaturated-fatty-acid proportion.
    - reference: DOI:10.17159/sajs.2018/20170254
      snippet: maintain optimum membrane fluidity
      notes: Verified against the open Hamdan review; fatty-acyl-chain modifications
        are described as preserving membrane fluidity in freezing environments.
    predicate_id: RO:0002326
  - subject: membrane_fluidity
    predicate: contributes to
    object: psychrophile_machinery
    description: Maintained membrane fluidity contributes to cold-adapted cellular
      machinery.
    evidence:
    - reference: DOI:10.1128/AEM.01928-22
      snippet: contribute to the survival of the strain under cold conditions
      notes: Verified against the open Yang et al. abstract; the cold adaptation model
        includes membrane transport adjustment among mechanisms supporting Bacillus
        simplex H-b survival under cold conditions.
    predicate_id: RO:0002326
  - subject: cold_shock_proteins
    predicate: contributes to
    object: translation_low_temperature
    description: Cold shock proteins / RNA chaperones contribute to transcription
      and translation in the cold.
    evidence:
    - reference: DOI:10.17159/sajs.2018/20170254
      snippet: regulation of cellular protein synthesis
      notes: Verified against the open Hamdan review; cold-shock proteins are linked
        to cellular protein-synthesis regulation, including transcription and translation
        initiation.
    predicate_id: RO:0002326
  - subject: glycine_betaine
    predicate: contributes to
    object: protein_membrane_stabilization
    description: Glycine betaine contributes to protein and membrane stabilization
      during cold stress.
    evidence:
    - reference: DOI:10.17159/sajs.2018/20170254
      snippet: growth-enhancing effect of glycine betaine
      notes: Verified against the open Hamdan review; the glycine betaine paragraph
        cites low-temperature growth enhancement and discusses compatible solutes
        as cold cryoprotectants.
    predicate_id: RO:0002326
  - subject: trehalose
    predicate: contributes to
    object: cryoprotection
    description: Trehalose contributes to cryoprotection.
    evidence:
    - reference: DOI:10.17159/sajs.2018/20170254
      snippet: preventing protein denaturation and aggregation
      notes: Verified against the open Hamdan review; trehalose is reported as preventing
        protein denaturation and aggregation in psychrophilic bacteria.
    predicate_id: RO:0002326
  - subject: antifreeze_proteins
    predicate: causes
    object: thermal_hysteresis
    description: Antifreeze proteins lower the freezing point via thermal hysteresis.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: lower the water freezing point
      notes: Verified against the open Ramón et al. abstract and review text; anti-freeze
        proteins are described as lowering the water freezing point via thermal hysteresis
        or ice-recrystallization inhibition.
    predicate_id: biolink:causes
  - subject: enzyme_structural_flexibility
    predicate: increases
    object: catalytic_activity_low_temperature
    description: Increased enzyme structural flexibility increases catalytic activity
