  title: Temperature-optimum-very-low psychrophile context
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting cold-adapted membranes,
    cold-shock RNA chaperones, compatible-solute cryoprotection, antifreeze-protein
    ice binding, and flexible enzyme branches to the at-or-below-10-degrees-C optimum
    bin.
  nodes:
