- synonym_text: acidophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: growing at pH 1.0-3.0
  notes: Supports acidophilic growth at strongly acidic external pH.
causal_graphs:
- graph_id: acidophilic_ph_homeostasis
  title: Acidophilic pH homeostasis mechanism
  description: Evidence-backed causal sketch linking acidophily to acidic environments,
    proton exclusion, and cytoplasmic pH homeostasis.
  nodes:
  - node_id: acidophilic_trait
    label: acidophilic
    node_type: TRAIT
    grounding: METPO:1003003
    description: Optimal growth occurs at acidic pH.
  - node_id: acidic_external_ph
    label: acidic external pH
    node_type: ENVIRONMENTAL_FACTOR
    description: External pH below neutral, often below pH 5 for acidophiles.
  - node_id: proton
    label: proton
    node_type: CHEMICAL
    grounding: CHEBI:15378
    description: Hydrogen ion whose gradient threatens cytoplasmic pH.
  - node_id: cytoplasmic_ph_homeostasis
    label: cytoplasmic pH homeostasis
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of a less acidic cytoplasm during growth at low pH.
    grounding: GO:0030641
  - node_id: low_proton_permeability_membrane
    label: low proton permeability membrane
    node_type: CELLULAR_LOCALIZATION
    description: Membrane properties that reduce inward proton leak.
  - node_id: reversed_membrane_potential
    label: reversed membrane potential
    node_type: BIOLOGICAL_PROCESS
    description: Positive-inside membrane potential reducing proton influx.
  edges:
  - subject: acidic_external_ph
    predicate: selects for
    object: acidophilic_trait
    description: Acidic environments select for organisms whose optimal growth is
      below neutral pH.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: growing at pH 1.0-3.0
      notes: Review supports growth of extreme acidophiles at strongly acidic pH.
    predicate_id: METPO:2007401
  - subject: acidic_external_ph
    predicate: increases gradient of
    object: proton
    description: Acidic external pH imposes a proton gradient across the membrane.
    evidence:
    - reference: DOI:10.1016/j.tim.2007.02.005
      snippet: major contributor to the proton motive force
      notes: Review links low-pH growth to the transmembrane proton gradient.
  - subject: low_proton_permeability_membrane
    predicate: limits influx of
    object: proton
    description: Low proton permeability helps acidophiles avoid cytoplasmic acidification.
    evidence:
    - reference: DOI:10.1016/j.tim.2007.02.005
      snippet: highly impermeable cell membranes
      notes: Supports membrane impermeability as an acidophile mechanism.
  - subject: reversed_membrane_potential
    predicate: mitigates influx of
    object: proton
    description: A reversed membrane potential can reduce inward proton movement.
    evidence:
    - reference: DOI:10.1016/j.tim.2007.02.005
      snippet: reversed membrane potential
      notes: Supports reversed membrane potential as a shared acidophile feature.
  - subject: cytoplasmic_ph_homeostasis
    predicate: enables
    object: acidophilic_trait
    description: Acidophilic growth requires maintaining cytoplasmic pH compatible
      with biomolecular function.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: maintain a cytoplasmic pH of approximately 6.0
      notes: Supports cytoplasmic pH homeostasis during growth at low external pH.
    predicate_id: RO:0002327
