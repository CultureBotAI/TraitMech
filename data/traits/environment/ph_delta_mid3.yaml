  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports wide pH-homeostasis flexibility as the basis
    of euryphilic pH-tolerance.
causal_graphs:
