  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports wide pH-homeostasis flexibility as the basis
    of euryphilic pH-tolerance.
canonical_examples:
- taxon_id: NCBITaxon:2306023
  taxon_label: Gemmobacter lutimaris
  reference: DOI:10.1099/ijsem.0.003375
  note: Gemmobacter lutimaris YJ-T1-11T grew from pH 5.0 to 9.0; the directly reported
    four-unit breadth lies in the approximately 4-5 bin.
