  - node_id: membrane_lipid_remodeling
    label: membrane lipid composition shifts
    node_type: BIOLOGICAL_PROCESS
    description: Adjustments of membrane lipid composition altering envelope properties.
  - node_id: proton_permeability
    label: membrane proton permeability
    node_type: QUALITY
    description: Permeability of the cell membrane to protons.
  edges:
  - subject: wide_ph_homeostasis
    predicate: confers
    object: ph_delta_mid3_trait
    description: Wide pH-homeostasis flexibility yields a 4–5 pH-unit pH-delta breadth.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: pH homeostasis
      notes: Supports wide pH-homeostasis flexibility as the basis of a wide breadth.
    predicate_id: METPO:2007700
  - subject: ph_delta_mid3_trait
    predicate: is a
    object: ph_delta
    description: pH delta mid3 is a quantitative bin of the pH-delta phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: external pH
      notes: Supports the 4–5 unit breadth as a value within the pH-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: external_alkaline_ph
    predicate: increases reliance on
    object: na_h_antiport
    description: High external pH increases reliance on electrogenic Na+/H+ antiport
      for cytoplasmic pH homeostasis.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: Multiple Na+/H+ and K+/H+ antiporters are critical for alkaline homeostasis,
        driven by membrane potential.
  - subject: pmf_regulation
    predicate: supports
    object: cytoplasmic_ph_maintenance
    description: Regulation of Delta-psi and Delta-pH supports maintenance of cytoplasmic
      pH across external pH changes.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: PMF (Delta-pH and Delta-psi) is central to pH homeostasis; neutralophiles
        keep cytoplasmic pH near 7.5 across external pH ~5.5-9.0.
  - subject: proton_pumping_respiratory_complexes
    predicate: contribute to
    object: proton_motive_force
    description: Proton-pumping respiratory complexes contribute to the PMF used for
      pH homeostasis.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: Cells use primary proton pumps including respiratory-chain pumps to create
        PMF for transport and pH regulation.
  - subject: f0f1_atpase
    predicate: contributes to
    object: cytoplasmic_ph_maintenance
    description: F0F1-ATPase can extrude protons and contributes to pH homeostasis
      under acid stress.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: F1Fo-ATPase hydrolytic activity can drive H+ extrusion; key regulator
        in low-pH contexts.
    predicate_id: RO:0002326
  - subject: phosphate_buffering
    predicate: stabilizes
    object: intracellular_ph_stability
    description: Cytoplasmic phosphate buffering capacity stabilizes intracellular
      pH.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: At pH ~7.2 only ~10 free protons present; cytoplasmic phosphate buffering
        (~100 mM) makes buffering essential.
  - subject: aa_decarboxylation
    predicate: contributes to
    object: proton_motive_force
    description: Amino-acid decarboxylation pathways consume protons and contribute
      to PMF and intracellular pH control.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Decarboxylation releases ~20 kJ/mol that can be stored as PMF; decarboxylation
        pathways are key pH regulators.
    predicate_id: RO:0002326
  - subject: membrane_lipid_remodeling
    predicate: decreases
    object: proton_permeability
    description: Membrane lipid composition shifts reduce proton permeability.
    evidence:
    - reference: DOI:10.3389/fmicb.2022.1034164
      notes: Membrane composition adjustments limit proton permeability and alter
        phospholipid headgroups under high pH.
    predicate_id: RO:0002212
