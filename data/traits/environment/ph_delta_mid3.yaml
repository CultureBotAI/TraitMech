identifier: METPO:1000477
label: pH delta mid3
definition: A pH delta phenotype with a growth-supporting pH breadth of approximately
  4–5 pH units, characteristic of organisms with wide pH-tolerance breadth.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
