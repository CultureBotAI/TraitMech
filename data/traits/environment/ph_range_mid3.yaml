- synonym_text: Alkaliphile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Extreme Alkaliphile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Facultative acidophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: pHR_8_to_10
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
