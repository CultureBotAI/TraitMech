identifier: METPO:1000536
label: optimum phenotype with numerical limits
definition: A phenotype characterized by the value at which an organism exhibits maximum
  growth rate or activity.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: optimal NaCl
  notes: Osmoadaptation review supports the environmental value at which growth is
    maximal as a standard quantitative descriptor.
- reference: DOI:10.1038/nrmicro2549
  snippet: cytoplasmic pH
  notes: pH-homeostasis review supports the external pH at which cytoplasmic homeostasis
    sustains peak growth as an analogous optimum on the pH axis.
causal_graphs:
- graph_id: optimum_phenotype_descriptor
  title: Optimum phenotype descriptor across environmental axes
  description: DOI-backed graph framing the optimum phenotype as a generic peak-growth
    setpoint over any numerical environmental axis, with `is a` edges to the axis-specific
    optimum phenotypes for NaCl, pH, and temperature.
  nodes:
  - node_id: optimum_phenotype_trait
    label: optimum phenotype with numerical limits
    node_type: TRAIT
    grounding: METPO:1000536
    description: Phenotype defined by the value of an environmental variable at which
      growth rate is maximal.
  - node_id: numerical_environmental_axis
    label: numerical environmental axis
    node_type: ENVIRONMENTAL_FACTOR
    description: Any continuous environmental variable (NaCl, pH, temperature, etc.)
      on which microbial growth can be measured quantitatively.
  - node_id: nacl_optimum
    label: NaCl optimum
    node_type: TRAIT
    grounding: METPO:1000333
    description: NaCl concentration supporting maximal growth.
  - node_id: ph_optimum
    label: pH optimum
    node_type: TRAIT
    grounding: METPO:1000331
    description: External pH supporting maximal growth.
  - node_id: temperature_optimum
    label: temperature optimum
    node_type: TRAIT
    grounding: METPO:1000304
    description: Ambient temperature supporting maximal growth.
  - node_id: na_h_antiporters
    label: Na+/H+ antiporters
    node_type: GENE_OR_PROTEIN
    description: Cation/proton antiporters that exchange cytoplasmic Na+ (or K+) for
      protons.
  - node_id: intracellular_ph_homeostasis
    label: intracellular pH homeostasis
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of cytoplasmic pH within a narrow range (~7.0-7.5) despite
      external pH.
  - node_id: f1f0_atp_synthase
    label: F1F0-ATP synthase
    node_type: GENE_OR_PROTEIN
    description: Membrane ATP synthase coupling proton flux to ATP synthesis/hydrolysis.
  - node_id: opua_transporter
    label: OpuA compatible-solute transporter
    node_type: GENE_OR_PROTEIN
    description: ABC importer accumulating compatible solutes such as glycine betaine
      to high levels.
  - node_id: intracellular_glycine_betaine
    label: intracellular glycine betaine
    node_type: CHEMICAL
    description: Compatible solute accumulated in the cytoplasm to counter osmotic
      stress.
  - node_id: hyperosmotic_stress
    label: hyperosmotic stress
    node_type: ENVIRONMENTAL_FACTOR
    description: External hypertonicity causing cell shrinkage and plasmolysis.
  - node_id: compatible_solute_accumulation
    label: compatible-solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Active import/synthesis of compatible solutes to restore turgor under
      osmotic stress.
  - node_id: amino_acid_decarboxylation
    label: amino-acid decarboxylation
    node_type: BIOLOGICAL_PROCESS
    description: Decarboxylase activity that consumes cytoplasmic protons, raising
      internal pH under acid stress.
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Electrochemical proton gradient across the membrane used for energy
      coupling.
  edges:
  - subject: numerical_environmental_axis
    predicate: defines
    object: optimum_phenotype_trait
    description: A numerical environmental axis defines the values whose peak-growth
      setting yields the optimum phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports a numerical environmental axis as the axis on which an optimum
        is identified.
    predicate_id: METPO:2007500
  - subject: nacl_optimum
    predicate: is a
    object: optimum_phenotype_trait
    description: NaCl optimum is an axis-specific optimum phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports NaCl optimum as an optimum phenotype defined over the salinity
        axis.
    predicate_id: rdfs:subClassOf
  - subject: ph_optimum
    predicate: is a
    object: optimum_phenotype_trait
    description: pH optimum is an axis-specific optimum phenotype.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: cytoplasmic pH
      notes: Supports pH optimum as an optimum phenotype defined over the external-pH
        axis.
    predicate_id: rdfs:subClassOf
  - subject: temperature_optimum
    predicate: is a
    object: optimum_phenotype_trait
    description: Temperature optimum is an axis-specific optimum phenotype.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Membrane-adaptation review supports temperature optima as a homoviscous-adaptation-tuned
        setpoint on the temperature axis.
    predicate_id: rdfs:subClassOf
  - subject: na_h_antiporters
    predicate: contributes to
    object: intracellular_ph_homeostasis
    description: Na+/H+ (and K+/H+) antiporters are key regulators of bacterial pH
      homeostasis.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Key regulators of bacterial pH homeostasis are Na+/H+ and K+/H+ antiporters;
        stabilizes internal pH at the external-pH optimum.
    predicate_id: RO:0002326
  - subject: f1f0_atp_synthase
    predicate: contributes to
    object: intracellular_ph_homeostasis
    description: F1F0-ATP synthase activity contributes to pH homeostasis via proton
      translocation.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      notes: F1F0-ATP synthase activity contributes to pH homeostasis; general bacterial
        bioenergetic mechanism.
    predicate_id: RO:0002326
  - subject: opua_transporter
    predicate: increases
    object: intracellular_glycine_betaine
    description: OpuA accumulates the compatible solute glycine betaine to (sub)molar
      levels.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: OpuA can accumulate the compatible solute glycine betaine to (sub)molar
        levels; mechanism for osmolarity optimum.
    predicate_id: RO:0002213
  - subject: hyperosmotic_stress
    predicate: activates
    object: compatible_solute_accumulation
    description: Hypertonicity drives active import of compatible solutes to restore
      turgor.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Hypertonicity causes shrinkage/plasmolysis; active importers accumulate
        compatible solutes in response.
    predicate_id: RO:0002213
  - subject: amino_acid_decarboxylation
    predicate: contributes to
    object: intracellular_ph_homeostasis
    description: Amino-acid decarboxylase activity rises when internal pH drops, raising
      cytoplasmic pH under acid stress.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Amino-acid decarboxylases have low pH optima and activity increases when
        internal pH drops, contributing to pH homeostasis.
    predicate_id: RO:0002326
  - subject: amino_acid_decarboxylation
    predicate: generates
    object: proton_motive_force
    description: Decarboxylation coupled to antiporter exchange generates a proton
      motive force.
    evidence:
    - reference: DOI:10.1093/femsre/fuad033
      notes: Decarboxylation plus antiporter exchange generates PMF, ~1 proton per
        molecule decarboxylated.
    predicate_id: biolink:produces
