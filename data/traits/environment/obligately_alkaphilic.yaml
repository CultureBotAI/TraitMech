  edges:
  - subject: alkaline_external_ph
    predicate: is required for
    object: obligately_alkaphilic_trait
    description: Obligate alkaliphiles grow only under alkaline pH conditions.
    evidence:
    - reference: DOI:10.3389/fbioe.2015.00075
      snippet: grow only at pH values of ~pH 9 and above
      notes: Review explicitly defines obligate alkaliphiles by alkaline pH restriction.
  - subject: alkaline_external_ph
    predicate: challenges
    object: cytoplasmic_ph_homeostasis
    description: High external pH requires cells to maintain cytoplasmic pH below
      the medium.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: below an external pH range of 9.5-11.0
      notes: Supports cytoplasmic pH control under extreme alkaline external pH.
    predicate_id: METPO:2007406
  - subject: sodium_proton_antiporter
    predicate: exports
    object: sodium_ion
    description: Na+/H+ antiport couples sodium efflux to proton accumulation.
    evidence:
