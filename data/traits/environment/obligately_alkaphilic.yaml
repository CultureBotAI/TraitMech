      notes: Supports sodium efflux as part of the alkaliphile Na+ cycle.
  - subject: sodium_proton_antiporter
    predicate: accumulates
    object: proton
    description: Na+/H+ antiport achieves net proton accumulation for alkaline pH
      homeostasis.
    evidence:
    - reference: DOI:10.1016/S0005-2728(00)00285-1
      snippet: achieve net H+ accumulation
      notes: Supports proton accumulation by antiporters in alkaliphiles.
  - subject: proton_coupled_atp_synthase
    predicate: constrains
    object: obligately_alkaphilic_trait
    description: Proton-coupled ATP synthesis at very high pH creates a bioenergetic
      constraint requiring alkaliphile-specific adaptations.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2010.02.028
      snippet: robust H+-coupled ATP synthesis at external pH values > 10
      notes: Supports the proton-coupled ATP synthesis challenge in alkaliphiles.
  - subject: cytoplasmic_ph_homeostasis
    predicate: enables
    object: obligately_alkaphilic_trait
    description: Growth at obligately alkaline pH depends on maintaining intracellular
      pH compatible with cell function.
    evidence:
    - reference: DOI:10.1016/S0005-2728(00)00285-1
      snippet: pH homeostasis ... appears to set the upper pH limit for growth
      notes: Supports pH homeostasis as growth-limiting for alkaliphilic Bacillus.
    predicate_id: RO:0002327
