  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: obligate alkaphilic
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: obligately alkaliphilic
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
