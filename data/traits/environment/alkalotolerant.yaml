identifier: METPO:1003009
label: alkalotolerant
definition: A pH growth preference in which an organism can tolerate alkaline pH but
  grows optimally at neutral pH.
definition_source: DOI:10.1016/j.bbamem.2005.09.010
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1003000
