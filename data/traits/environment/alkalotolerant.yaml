- synonym_text: alkalitolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/j.bbamem.2005.09.010
  snippet: alkali-tolerant and extremely alkaliphilic bacteria
  notes: Supports alkaline pH tolerance as a microbial pH-homeostasis phenotype.
