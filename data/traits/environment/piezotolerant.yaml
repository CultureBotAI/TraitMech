identifier: traitmech:000003
label: piezotolerant
definition: A pressure growth preference in which an organism can grow under elevated
  hydrostatic pressure but grows at similar or faster rates at atmospheric pressure
  (0.1 MPa).
definition_source: DOI:10.3389/fmolb.2022.1058381
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: barotolerant
  synonym_type: RELATED_SYNONYM
  source: DOI:10.3389/fmolb.2022.1058381
evidence:
- reference: DOI:10.3389/fmolb.2022.1058381
  snippet: Microorganisms adapted to HHP are usually known as piezophiles, referring
    to their preference for high pressure
  notes: Pressure-adaptation review distinguishes piezotolerant organisms, which withstand
    high hydrostatic pressure but grow at similar or faster rates at atmospheric pressure,
    from obligate piezophiles.
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: Provides the contrasting obligate-piezophile reference point against which
    piezotolerant (atmospheric-capable) growth is defined.
canonical_examples:
- taxon_id: NCBITaxon:74109
  taxon_label: Photobacterium profundum
  note: piezotolerant/piezophilic deep-sea bacterium
  reference: PMID:15746425
- taxon_id: NCBITaxon:70863
  taxon_label: Shewanella oneidensis
  note: pressure-tolerant
  reference: DOI:10.3389/fmicb.2014.00612
causal_graphs:
- graph_id: piezotolerance_pressure_range
  title: 'Piezotolerance: growth across atmospheric and elevated pressures'
  description: Evidence-backed causal sketch linking adaptation to elevated hydrostatic
    pressure to growth that is sustained at atmospheric pressure.
  scope_status: NONMECHANISTIC
  scope_notes: This record is a broad environmental or morphological classification
    spanning multiple mechanisms, a measurement-like bin, or an absence/arrangement
    descriptor; contextual protein nodes do not receive token UniProt examples.
  nodes:
  - node_id: piezotolerant_trait
    label: piezotolerant
    node_type: TRAIT
    grounding: traitmech:000003
    description: Growth across atmospheric and elevated hydrostatic pressures.
  - node_id: hydrostatic_pressure
    label: hydrostatic pressure
    node_type: ENVIRONMENTAL_FACTOR
    description: Ambient hydrostatic pressure imposed on the cell.
    grounding: PATO:0001025
  - node_id: membrane_adaptation
    label: membrane lipid adaptation
    node_type: BIOLOGICAL_PROCESS
    description: Adjustment of membrane lipid composition under varying pressure.
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Fluidity of the cell membrane lipid bilayer.
    grounding: METPO:1007505
  - node_id: unsaturated_fatty_acids
    label: unsaturated membrane fatty acids
    node_type: CHEMICAL
    description: Unsaturated fatty acids incorporated into membrane lipids.
  - node_id: branched_unsaturated_fatty_acids
    label: branched-chain and unsaturated membrane fatty acids
    node_type: CHEMICAL
    description: Branched-chain and unsaturated fatty acids enriched in membrane lipids
      under pressure.
  - node_id: heat_shock_genes
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: heat-shock response proteins (RpoH, RpoE, DnaK, GroEL)
    node_type: GENE_OR_PROTEIN
    description: Key heat-shock regulators and chaperones upregulated after pressure
      shock.
    gene_symbols:
    - rpoH
    - rpoE
    - dnaK
    - groEL
  - node_id: piezolyte_accumulation
    label: piezolyte accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of compatible solutes (piezolytes) in response to high
      pressure.
  - node_id: protein_protection
    label: protein protection under pressure
    node_type: BIOLOGICAL_PROCESS
    description: Stabilization/protection of proteins under elevated hydrostatic pressure.
  edges:
  - subject: hydrostatic_pressure
    predicate: regulates
    object: membrane_adaptation
    description: Hydrostatic pressure modulates membrane fluidity, prompting adaptive
      lipid composition.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: HHP adaptation involves unsaturated and branched-chain fatty acids.
    predicate_id: RO:0002211
  - subject: membrane_adaptation
    predicate: confers
    object: piezotolerant_trait
    description: Membrane adaptation supports growth across the pressure range atmospheric
      ↔ high.
    evidence:
    - reference: DOI:10.1099/ijsem.0.001671
      notes: Contrast with obligate piezophiles (growth limited to 80-140 MPa) defines
        piezotolerant as the atmospheric-capable phenotype.
    predicate_id: METPO:2007700
  - subject: hydrostatic_pressure
    predicate: decreases
    object: membrane_fluidity
    description: High hydrostatic pressure compacts fatty acids, reducing membrane
      fluidity.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: high hydrostatic pressure reduces membrane fluidity by compacting fatty
        acids
    predicate_id: RO:0002212
  - subject: membrane_fluidity
    predicate: causes increase in
    object: unsaturated_fatty_acids
    description: Reduced membrane fluidity is countered by increasing unsaturated
      fatty acid proportions.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: organisms counter HHP by increasing the proportions of unsaturated fatty
        acids
  - subject: hydrostatic_pressure
    predicate: increases abundance of
    object: branched_unsaturated_fatty_acids
    description: Membrane lipids with unsaturated and branched-chain fatty acids increase
      with rising pressure.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: abundance of membrane lipids containing unsaturated and branched-chain
        fatty acids increases with increasing HHP
  - subject: hydrostatic_pressure
    predicate: induces transcription of
    object: heat_shock_genes
    description: Pressure shock transcriptionally upregulates key heat-shock genes.
    evidence:
    - reference: DOI:10.3389/fmicb.2024.1470617
      notes: key heat shock genes rpoH, rpoE, dnaK, and groEL are transcriptionally
        upregulated following pressure shock
  - subject: hydrostatic_pressure
    predicate: induces accumulation of
    object: piezolyte_accumulation
    description: High pressure induces accumulation of piezolytes (compatible solutes).
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: piezolytes are molecules that accumulate in cells in response to high
        pressure (e.g., glutamate, betaine, beta-hydroxybutyrate)
  - subject: piezolyte_accumulation
    predicate: protects
    object: protein_protection
    description: Accumulated piezolytes protect proteins via preferential hydration
      under pressure.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: compatible solutes act via preferential hydration to protect proteins
