identifier: METPO:1000615
label: mesophilic
definition: A temperature preference in which growth is favored at intermediate temperatures,
  typically ~20–45 °C.
definition_source: DOI:10.1016/j.bpj.2013.06.029
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000613
evidence:
- reference: DOI:10.1016/j.bpj.2013.06.029
  snippet: Escherichia coli, a mesophilic bacterium
  notes: 'Organism example: Escherichia coli is described as mesophilic.'
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports homoviscous membrane composition matched
    to ambient temperature as the basis of mesophile physiology.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Canonical mesophile and universal model organism (optimum ~37 C).
  reference: DOI:10.1021/acsomega.2c04786
causal_graphs:
- graph_id: mesophilic_homoviscous_adaptation
  title: Mesophilic growth with membrane and temperature-boundary support
  scope_status: NONMECHANISTIC
  scope_notes: This record is an upper preference, broad tolerance, or central-range
    classification spanning multiple unrelated adaptations; contextual protein nodes
    are retained without assigning a misleading token UniProt example.
  description: DOI-backed nonmechanistic graph connecting mesophily to moderate temperature,
    balanced growth, homoviscous membrane fluidity, and cold- and heat-shock boundary-support
    branches.
  nodes:
  - node_id: mesophilic_trait
    label: mesophilic
    node_type: TRAIT
    grounding: METPO:1000615
    description: Growth is favored at intermediate temperatures (~20–45 °C).
  - node_id: moderate_temperature
    label: moderate ambient temperature
    node_type: ENVIRONMENTAL_FACTOR
    description: Ambient temperature in the ~20–45 °C mesophilic range.
  - node_id: membrane_fluidity
    label: membrane fluidity
    node_type: QUALITY
    description: Physical state of the cytoplasmic membrane supporting transport and
      bioenergetics.
    grounding: METPO:1007505
  - node_id: homoviscous_lipid_composition
    label: homoviscous lipid composition
    node_type: CELLULAR_LOCALIZATION
    description: Lipid composition tuned to maintain target membrane fluidity at mesophilic
      temperatures.
  - node_id: mesophile_enzyme_repertoire
    label: mesophile enzyme repertoire
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a broad environmental classification; no single exact family term denotes this
      aggregate use.
    description: Enzymes with peak activity in the mesophile temperature range.
  - node_id: balanced_growth
    label: balanced mesophilic growth
    node_type: BIOLOGICAL_PROCESS
    description: Sustained growth rate at intermediate temperatures.
  - node_id: temperature_decrease
    label: temperature decrease
    node_type: ENVIRONMENTAL_FACTOR
    description: A downshift in ambient temperature within the mesophilic regime.
  - node_id: unsaturated_fatty_acids
    label: unsaturated fatty acids
    node_type: CHEMICAL
    description: Membrane acyl chains with cis double bonds that increase membrane
      fluidity.
    grounding: CHEBI:27208
  - node_id: cold_shock
    label: cold shock
    node_type: ENVIRONMENTAL_FACTOR
    description: Abrupt temperature downshift triggering the cold-shock response.
  - node_id: cspa
    label: CspA cold-shock protein
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a broad environmental classification; no single exact family term denotes this
      aggregate use.
    description: Major cold-shock RNA chaperone preventing inhibitory RNA secondary
      structure.
  - node_id: translation
    label: translation
    node_type: BIOLOGICAL_PROCESS
    description: Protein synthesis from mRNA, maintained during cold shock.
    grounding: GO:0006412
  - node_id: heat_shock
    label: heat shock
    node_type: ENVIRONMENTAL_FACTOR
    description: Temperature upshift triggering the heat-shock response.
  - node_id: rpoh_sigma32
    label: sigma-32 (RpoH)
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a broad environmental classification; no single exact family term denotes this
      aggregate use.
    description: Alternative sigma factor controlling the bacterial heat-shock regulon.
  - node_id: heat_shock_proteins
    label: heat-shock response proteins
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a broad environmental classification; no single exact family term denotes this
      aggregate use.
    description: Chaperones and proteases induced to mitigate heat stress.
  - node_id: dnak
    label: DnaK chaperone
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label in
      a broad environmental classification; no single exact family term denotes this
      aggregate use.
    description: Hsp70 chaperone that sequesters sigma-32, negatively regulating its
      activity.
  edges:
  - subject: moderate_temperature
    predicate: selects for
    object: mesophilic_trait
    description: Moderate ambient temperatures select for mesophilic physiology.
    evidence:
    - reference: DOI:10.1016/j.bpj.2013.06.029
      snippet: Escherichia coli, a mesophilic bacterium
      notes: Supports a representative mesophile thriving at moderate temperatures.
    predicate_id: METPO:2007401
  - subject: homoviscous_lipid_composition
    predicate: regulates
    object: membrane_fluidity
    description: Homoviscous lipid composition maintains target membrane fluidity
      at mesophilic temperatures.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: more unsaturated fatty acids
      notes: Supports homoviscous adaptation as the mechanism setting membrane fluidity.
    predicate_id: RO:0002211
  - subject: mesophile_enzyme_repertoire
    predicate: enables
    object: balanced_growth
    description: Mesophile enzyme repertoire enables balanced growth at intermediate
      temperatures.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: energy transducing enzymes
      notes: Supports temperature-tuned enzyme repertoires as the basis of adapted
        growth.
    predicate_id: RO:0002327
  - subject: balanced_growth
    predicate: manifests as
    object: mesophilic_trait
    description: Balanced growth at moderate temperatures manifests the mesophilic
      trait.
    evidence:
    - reference: DOI:10.1016/j.bpj.2013.06.029
      snippet: Escherichia coli, a mesophilic bacterium
      notes: Supports the trait endpoint in a representative organism.
    predicate_id: METPO:2007400
  - subject: temperature_decrease
    predicate: increases
    object: unsaturated_fatty_acids
    description: Temperature downshift increases membrane unsaturated fatty acid content
      through homeoviscous adaptation.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: production of double bonds in lipids
      notes: Verified against the Ramón et al. cold-adaptation review; low-temperature
        adaptation includes membrane-composition remodeling through lipid double-bond
        production.
    predicate_id: RO:0002213
  - subject: cold_shock
    predicate: positively regulates
    object: cspa
    description: Cold shock strongly increases CspA cold-shock protein synthesis.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: more than 10% of the total cellular protein synthesis
      notes: Verified against the open Molecular Microbiology full text; CspA is the
        major E. coli cold-shock protein and its synthesis rises sharply after temperature
        downshift.
    predicate_id: RO:0002213
  - subject: cspa
    predicate: promotes
    object: translation
    description: CspA RNA chaperone activity destabilizes inhibitory mRNA secondary
      structures, promoting translation during cold shock.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: facilitates translation by destabilizing mRNA secondary structures
      notes: Verified against the open Molecular Microbiology full text; CspA acts
        as an RNA chaperone that counters low-temperature mRNA secondary structure.
    predicate_id: RO:0002213
  - subject: heat_shock
    predicate: positively regulates
    object: rpoh_sigma32
    description: Heat shock transiently increases cellular sigma-32 (RpoH), the heat-shock
      sigma factor.
    evidence:
    - reference: DOI:10.1128/jb.183.18.5302-5310.2001
      snippet: a transient increase in the ς^{32} level
      notes: Verified against the open Journal of Bacteriology full text; E. coli
        heat-shock induction is regulated by increased RpoH translation and transient
        sigma-32 stabilization.
    predicate_id: RO:0002213
  - subject: rpoh_sigma32
    predicate: positively regulates
    object: heat_shock_proteins
    description: Sigma-32 (RpoH) positively regulates heat-shock response protein
      expression.
    evidence:
    - reference: DOI:10.1128/jb.183.18.5302-5310.2001
      snippet: enhancing transcription of the heat shock genes
      notes: Verified against the open Journal of Bacteriology full text; RpoH-dependent
        sigma-32 activity drives heat-shock-gene transcription.
    predicate_id: RO:0002213
  - subject: dnak
    predicate: negatively regulates
    object: rpoh_sigma32
    description: DnaK chaperone activity negatively regulates sigma-32 (RpoH) activity.
    evidence:
    - reference: DOI:10.1128/jb.183.18.5302-5310.2001
      snippet: negative regulation of ς^{32} activity
      notes: Verified against the open Journal of Bacteriology full text; the DnaK
        chaperone system participates in negative control of sigma-32 activity.
    predicate_id: RO:0002212
  - subject: unsaturated_fatty_acids
    predicate: associated with
    object: homoviscous_lipid_composition
    description: Unsaturated fatty-acid changes are associated with the homeoviscous
      lipid composition branch in this mesophilic temperature-response graph.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: incorporation of proportionally more unsaturated fatty acids
      notes: Verified against the public Annual Review of Microbiology abstract; unsaturated
        fatty-acid incorporation is part of homeoviscous membrane remodeling as growth
        temperature decreases.
    predicate_id: biolink:associated_with
  - subject: membrane_fluidity
    predicate: associated with
    object: balanced_growth
    description: Mesophilic balanced growth is associated with maintenance of target
      cytoplasmic-membrane fluidity.
    evidence:
    - reference: DOI:10.1146/annurev-micro-091313-103612
      snippet: remodel the fluidity of their membrane bilayer
      notes: Verified against the public Annual Review of Microbiology abstract; the
        connector links membrane-fluidity remodeling to growth-temperature acclimation
        without making a single lipid ratio define mesophily.
    predicate_id: biolink:associated_with
  - subject: translation
    predicate: associated with
    object: balanced_growth
    description: Cold-shock maintenance of translation is a lower-temperature boundary-support
      branch for balanced mesophilic growth.
    evidence:
    - reference: DOI:10.1046/j.1365-2958.1999.01284.x
      snippet: facilitates translation by destabilizing mRNA secondary structures
        formed at low temperature
      notes: Verified against the open Molecular Microbiology full text; the connector
        keeps CspA-mediated translation support as a boundary branch, not as a definition
        of mesophily.
    predicate_id: biolink:associated_with
  - subject: heat_shock_proteins
    predicate: associated with
    object: balanced_growth
    description: RpoH-regulated heat-shock response proteins form an upper-temperature
      boundary-support branch for balanced mesophilic growth.
    evidence:
    - reference: DOI:10.1128/jb.183.18.5302-5310.2001
      snippet: enhancing transcription of the heat shock genes
      notes: Verified against the open Journal of Bacteriology full text; the connector
        keeps RpoH-regulated heat-shock proteins as a boundary branch, not as a definition
        of mesophily.
    predicate_id: biolink:associated_with
