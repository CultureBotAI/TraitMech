identifier: METPO:1000469
label: NaCl range low
definition: A NaCl range phenotype in which the upper bound of growth-supporting NaCl
  concentration is at or below approximately 1% (w/v), characteristic of non-halophilic
  or halotolerant organisms.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000334
synonyms:
- synonym_text: Halotolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Non-halophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: NaR_<=1
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports growth limited to ≤ ~1% NaCl as the non-halophilic
    / halotolerant range.
canonical_examples:
- taxon_id: NCBITaxon:575322
  taxon_label: Sphingomonas oligoaromativorans
  reference: DOI:10.1099/ijs.0.052894-0
  note: Type strain SY-6T grew from 0 to 0.5% (w/v) NaCl, with a 0.01% optimum; the
    complete reported range lies below the approximately 1% upper bound.
causal_graphs:
- graph_id: nacl_range_low_non_halophile
  title: NaCl-range-low non-halophile range
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed graph linking limited high-salt tolerance to a growth-supporting
    NaCl range capped at ~1% (w/v).
  nodes:
  - node_id: nacl_range_low_trait
    label: NaCl range low
    node_type: TRAIT
    grounding: METPO:1000469
    description: NaCl growth-supporting range with upper bound ≤ ~1% w/v.
  - node_id: nacl_range
    label: NaCl range
    node_type: TRAIT
    grounding: METPO:1000334
    description: Span of NaCl concentrations supporting growth.
  - node_id: limited_high_salt_tolerance
    label: limited high-salt tolerance
    node_type: BIOLOGICAL_PROCESS
    description: Reduced capacity to maintain osmotic balance above ~1% NaCl.
  - node_id: nacl_concentration
    label: NaCl concentration
    node_type: ENVIRONMENTAL_FACTOR
    description: External sodium chloride concentration in the environment.
  - node_id: hyperosmotic_stress
    label: hyperosmotic stress
    node_type: ENVIRONMENTAL_FACTOR
    description: External hypertonicity causing cell shrinkage and plasmolysis.
  - node_id: compatible_solute_accumulation
    label: compatible solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis or import of neutral osmolytes to balance cytoplasmic osmolarity.
  - node_id: hypoosmotic_shock
    label: hypoosmotic shock
    node_type: ENVIRONMENTAL_FACTOR
    description: Rapid drop in external osmolarity causing turgor increase.
  - node_id: mechanosensitive_channels
    label: mechanosensitive channels MscL/MscS
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: Tension-gated channels (MscL/MscS) that vent solutes to prevent lysis.
  - node_id: c_di_amp
    label: cyclic di-AMP
    node_type: CHEMICAL
    description: Second messenger that regulates potassium and osmolyte transport.
    grounding: CHEBI:71578
  - node_id: opu_solute_importers
    label: OpuA/OpuC compatible-solute importers
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: ABC-type transporters that import compatible solutes like glycine
      betaine.
  - node_id: choline_uptake
    label: choline uptake
    node_type: BIOLOGICAL_PROCESS
    description: Import of external choline used as a glycine betaine precursor.
  - node_id: glycine_betaine_synthesis
    label: glycine betaine biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis of the compatible solute glycine betaine.
    grounding: GO:0031456
  edges:
  - subject: limited_high_salt_tolerance
    predicate: confers
    object: nacl_range_low_trait
    description: Limited tolerance to elevated NaCl caps growth at low salt.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports limited high-salt tolerance as the basis of a low NaCl range.
    predicate_id: METPO:2007700
  - subject: nacl_range_low_trait
    predicate: is a
    object: nacl_range
    description: NaCl range low is a quantitative bin of the NaCl-range phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports low NaCl range as a value within the NaCl-range distribution.
    predicate_id: rdfs:subClassOf
  - subject: nacl_concentration
    predicate: causes
    object: hyperosmotic_stress
    description: Increased external NaCl concentration causes hyperosmotic stress.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      snippet: hyperosmotic stress by addition of either non-ionic osmolyte sucrose
        or ionic solute NaCl
      notes: Verified against the open Bhowmick et al. review; the edge is retained
        as a broad NaCl-to-hyperosmotic-stress step, not as a direct determinant of
        the <=1% range bin.
    predicate_id: biolink:causes
  - subject: hyperosmotic_stress
    predicate: increases
    object: compatible_solute_accumulation
    description: Hyperosmotic stress increases compatible-solute accumulation as a
      later osmoadaptive response.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      snippet: external osmotic upshifts by increasing the cellular concentration
        of cations (e.g. K+) and compatible solutes
      notes: Verified against the open Bhowmick et al. review; this keeps compatible-solute
        accumulation as a broad osmotic-upshift response.
    predicate_id: RO:0002213
  - subject: mechanosensitive_channels
    predicate: mitigates
    object: hypoosmotic_shock
    description: Mechanosensitive channels mitigate turgor stress during sudden hypoosmotic
      shocks at the low-salinity end of the range.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      snippet: emergency reaction essential for preventing turgor increase
      notes: Verified against the open Bhowmick et al. review; the edge is reversed
        from ungrounded shock-opens-channel wording to a grounded mitigation predicate.
    predicate_id: METPO:2007407
  - subject: c_di_amp
    predicate: inhibits
    object: opu_solute_importers
    description: c-di-AMP binds and inhibits OpuA/OpuC compatible-solute importers.
    evidence:
    - reference: DOI:10.1128/mmbr.00181-23
      snippet: Cyclic di-AMP binds to the CBS domains of compatible solute importers
      notes: Verified against public Foster et al. text; OpuA/OpuC are retained as
        representative CBS-domain osmolyte importers.
    predicate_id: RO:0002212
  - subject: choline_uptake
    predicate: enables
    object: glycine_betaine_synthesis
    description: Choline uptake enables synthesis of glycine betaine, a key compatible
      solute.
    evidence:
    - reference: DOI:10.1126/sciadv.ado6229
      snippet: uptake of external choline for synthesizing the osmoprotective glycine
        betaine
      notes: Verified against public Yang et al. abstract text; choline uptake is
        retained as the substrate-supply step for glycine-betaine biosynthesis.
    predicate_id: RO:0002327
