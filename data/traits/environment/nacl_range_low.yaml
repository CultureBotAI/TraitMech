identifier: METPO:1000469
label: NaCl range low
definition: A NaCl range phenotype in which the upper bound of growth-supporting NaCl
  concentration is at or below approximately 1% (w/v), characteristic of non-halophilic
  or halotolerant organisms.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000334
synonyms:
- synonym_text: Halotolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Non-halophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: NaR_<=1
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: salinity range
  notes: Osmoadaptation review supports growth limited to ≤ ~1% NaCl as the non-halophilic
    / halotolerant range.
