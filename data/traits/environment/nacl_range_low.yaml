  - subject: hypoosmotic_shock
    predicate: opens
    object: mechanosensitive_channels
    description: Hypoosmotic shock opens mechanosensitive channels MscL/MscS to prevent
      rupture.
    evidence:
    - reference: DOI:10.1093/femsml/uqad020
      notes: Hypoosmotic shock triggers transient opening of mechanosensitive channels
