  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): oxidative_phosphorylation is typed PATHWAY. PATHWAY is
    a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is everything
    else. A named route through enumerable complexes, named in the corpus''s own description
    (nuo, cyo, ndh, sdh). The rule breaks the 2-2 tie.'
  llm_assisted: true
