  action: MERGE_CAUSAL_NODE
  changes: 'Merged node low_ph_tolerance into ph_delta_trait and repointed its edges.
    Issue 352. An EIGHTH restatement (#360). I had grounded it METPO:1003008 (acidotolerant)
    and claimed ''no collision'' with the record''s METPO:1000232 (pH delta). No collision,
    but the wrong SCOPE: 1003008 is defined as tolerating acid ''WHILE MAINTAINING
    OPTIMAL GROWTH NEAR NEUTRAL pH'', which excludes the acidophiles this generic
    pH-delta record covers. A grounding narrower than the node it labels is a false
    claim about every organism in the excluded part. Also a pure sink. Merging repoints
    amino_acid_decarboxylase_acid_resistance onto ph_delta_trait, which reads correctly:
    an acid-resistance system widens the growth-supporting pH range, and a pH delta
    IS that range.'
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
