    label: anaerobic metabolism protein systems
    node_type: GENE_OR_PROTEIN
    description: Protein systems for anaerobic metabolic functions activated under
      anoxia.
  - node_id: aerobic_metabolism_genes
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: aerobic metabolism protein systems
    node_type: GENE_OR_PROTEIN
    description: Protein systems for aerobic respiratory functions repressed under
      anoxia.
  - node_id: cytochrome_bd_oxidase
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed protein family, complex, or aggregate; no single semantic
      family identifier exactly captures this node's represented scope.
    label: cytochrome bd oxidase
    node_type: GENE_OR_PROTEIN
    description: High-affinity terminal oxidase that reduces oxygen at low O2 concentrations.
  edges:
  - subject: molecular_oxygen
    predicate: enables
    object: aerobic_respiration
    description: Facultatively aerobic organisms can use oxygen-dependent respiration
      when oxygen is available.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.112444
      snippet: terminal oxidases transfer electrons from the ETC to O2
      notes: Supports aerobic respiration through oxygen-reducing terminal oxidases.
    predicate_id: RO:0002327
  - subject: facultative_aerobic_trait
    predicate: has alternative process
    object: anaerobic_metabolism
    description: Facultative aerobic growth retains a growth mode when oxygen is absent.
    evidence:
    - reference: DOI:10.1089/ars.2011.4051
      snippet: utilizing other substrates as final electron acceptors
      notes: Review describes respiratory adaptation to oxygen shortage using alternative
        electron acceptors.
  - subject: molecular_oxygen
    predicate: regulates
    object: fnr_type_regulation
    description: Oxygen-responsive regulators tune metabolism across oxic and anoxic
      conditions.
    evidence:
    - reference: DOI:10.1089/ars.2011.4051
      snippet: Fnr-type transcriptional regulators that directly sense O2
      notes: Supports oxygen sensing by FNR-type regulators.
    predicate_id: RO:0002211
  - subject: fnr_type_regulation
    predicate: regulates switch between
    object: aerobic_respiration
    description: Oxygen-sensing regulation helps switch respiratory metabolism as
      oxygen availability changes.
    evidence:
    - reference: DOI:10.1089/ars.2011.4051
      snippet: adaptation of respiratory metabolism to changing environments
      notes: Supports regulatory switching between oxygen regimes.
  - subject: terminal_acceptor_availability
    predicate: determines
    object: terminal_branch_choice
    description: Which terminal respiratory enzyme is active depends on the available
      final electron acceptor.
    evidence:
    - reference: DOI:10.1128/jb.00389-22
      notes: 'which terminal enzyme is active depends on the availability of the final
        electron acceptor: fumarate or oxygen.'
  - subject: arcab_system
    predicate: represses
    object: aerobic_respiration
    description: ArcAB two-component regulatory system represses aerobic respiration
      under reducing conditions.
    evidence:
    - reference: DOI:10.1128/mbio.01448-23
      notes: ArcAB, a two-component regulatory system that represses aerobic respiration;
        conserved switch in Enterobacterales.
  - subject: molecular_oxygen
    predicate: inactivates
    object: fnr_type_regulation
    description: Oxygen directly inactivates FNR by oxidizing its iron-sulfur cluster,
      a core oxygen-sensing mechanism.
    evidence:
    - reference: DOI:10.1093/nar/gkad750
      notes: oxygen directly inactivates Fnr by oxidizing that iron-sulfur cluster;
        widely generalizable oxygen-sensing edge.
  - subject: fnr_type_regulation
    predicate: activates
    object: anaerobic_metabolism_genes
    description: When active under anoxia, FNR activates anaerobic metabolism genes.
    evidence:
    - reference: DOI:10.1093/nar/gkad750
      notes: when active, Fnr activates anaerobic metabolism genes and represses aerobic
        genes.
    predicate_id: RO:0002213
  - subject: fnr_type_regulation
    predicate: represses
    object: aerobic_metabolism_genes
    description: Active FNR represses aerobic metabolism genes under anoxic conditions.
    evidence:
    - reference: DOI:10.1093/nar/gkad750
      notes: Fnr activates anaerobic metabolism genes and represses aerobic genes.
  - subject: cytochrome_bd_oxidase
    predicate: has high affinity for
    object: molecular_oxygen
    description: Cytochrome bd is a high-affinity terminal oxidase enabling oxygen
      respiration at low O2.
    evidence:
    - reference: DOI:10.1128/aem.00378-23
      notes: cytochrome bd supports high O2 consumption and high-affinity oxygen reduction
        at the cell surface.
