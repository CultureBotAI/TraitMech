identifier: METPO:1000608
label: facultatively aerobic
definition: An oxygen preference in which growth can occur without oxygen but is capable
  of aerobic growth.
definition_source: PMID:21413255
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000601
synonyms:
- synonym_text: facultative
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: facultative aerobe
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: PMID:21413255
  snippet: preferentially utilize oxygen as a terminal electron acceptor
  notes: Supports facultative aerobic growth when oxygen is available.
- reference: PMID:16142505
  snippet: A facultative aerobic, moderately thermophilic, spore forming bacterium
  notes: 'Organism example: Anoxybacillus kamchatkensis strain JW/VK-KG4 is described
    as facultatively aerobic.'
canonical_examples:
- taxon_id: NCBITaxon:265546
  taxon_label: Anoxybacillus ayderensis
  reference: DOI:10.1007/s00792-005-0479-7
  note: Type strain JW/VK-KG4 (DSM 14988; ATCC BAA-549) was grown both aerobically
    and anaerobically, with measured doubling times of 34 and 40 minutes, respectively.
    The source published it as Anoxybacillus kamchatkensis; NCBI now treats that name
    as a synonym of Anoxybacillus ayderensis at this taxon id.
causal_graphs:
