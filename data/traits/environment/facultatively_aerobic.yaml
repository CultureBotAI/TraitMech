    description: Oxygen-dependent respiratory energy metabolism.
  - node_id: anaerobic_metabolism
    label: anaerobic metabolism
    node_type: BIOLOGICAL_PROCESS
    description: Growth-supporting metabolism when oxygen is unavailable.
