evidence:
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: Colwellia marinimaniae MTCD1 illustrates a bounded growth-supporting
    pressure span (80-140 MPa), the quantity this phenotype records.
- reference: DOI:10.3389/fmolb.2022.1058381
  snippet: Microorganisms adapted to HHP are usually known as piezophiles, referring
    to their preference for high pressure
  notes: Pressure-adaptation review supports the bounded span of growth-permissive
    hydrostatic pressure as a defining quantitative descriptor.
