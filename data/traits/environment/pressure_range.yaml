  - node_id: protein_stabilization
    label: protein stabilization via preferential hydration
    node_type: BIOLOGICAL_PROCESS
    description: Stabilization of native protein structure by preferential exclusion
      of cosolutes.
  - node_id: compatible_solute_accumulation
    label: compatible solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Accumulation of compatible solutes (betaine, glutamate, beta-hydroxybutyrate)
      acting as piezolytes.
  edges:
  - subject: hydrostatic_pressure
    predicate: defines
    object: pressure_range_trait
    description: The hydrostatic-pressure axis defines the min/max bounds bracketed
      by the pressure range.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: Pressure-adaptation review frames the bounded span of growth-permissive
        pressure as a defining quantitative descriptor.
    predicate_id: METPO:2007500
  - subject: pressure_range_trait
    predicate: associated with
    object: bounded_growth_span
    description: The pressure range records the bounded interval of permissive hydrostatic
      pressures.
    evidence:
    - reference: DOI:10.1099/ijsem.0.001671
      notes: Colwellia marinimaniae MTCD1 illustrates a bounded growth-supporting
        pressure span (80-140 MPa).
    predicate_id: biolink:associated_with
  - subject: pufa_biosynthesis
    predicate: increases
    object: membrane_fluidity_hhp
    description: PUFA biosynthesis increases membrane fluidity to counter pressure-induced
      membrane ordering.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: PUFAs (C20:5, C22:6) associated with adaptation to high hydrostatic pressure;
        broad mechanism across taxa.
  - subject: unsaturated_membrane_lipids
    predicate: positively regulates
    object: pressure_range_trait
    description: Unsaturated membrane lipids support growth across high hydrostatic
      pressures.
    evidence:
    - reference: DOI:10.3389/fmolb.2022.1058381
      notes: Mutants with reduced C18:1 could not withstand high pressure; unsaturation
        counters pressure ordering.
  - subject: membrane_fluidity_hhp
    predicate: expands
    object: pressure_range_trait
    description: Maintaining membrane fluidity under pressure expands the growth-supporting
      pressure range.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: Pressure compacts membranes; organisms restore membrane disorder/function
        via unsaturation to sustain growth.
  - subject: tmao
    predicate: stabilizes
    object: protein_stabilization
    description: TMAO stabilizes proteins via preferential hydration (preferential
      exclusion from hydration layer).
    evidence:
    - reference: DOI:10.1021/acs.chemrev.3c00432
      notes: TMAO preferentially excluded from protein hydration layer causing preferential
        hydration; biophysical mechanism, not microbe-specific.
  - subject: compatible_solute_accumulation
    predicate: stabilizes
    object: protein_stabilization
    description: Compatible solutes stabilize proteins via preferential hydration.
    evidence:
    - reference: DOI:10.3390/microorganisms11071629
      notes: Compatible solutes (glutamate, betaine, beta-hydroxybutyrate) act by
        preferential hydration, displacing protein-bound water.
