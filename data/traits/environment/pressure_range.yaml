identifier: traitmech:000005
label: pressure range
definition: A pressure phenotype with numerical limits that bounds the minimum and
  maximum hydrostatic pressures supporting growth of an organism.
definition_source: DOI:10.1099/ijsem.0.001671
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1099/ijsem.0.001671
  snippet: growth range of 80-140 MPa (optimum, 120 MPa) at 6 degrees C
  notes: Colwellia marinimaniae MTCD1 illustrates a bounded growth-supporting pressure
    span (80-140 MPa), the quantity this phenotype records.
- reference: DOI:10.3389/fmolb.2022.1058381
  snippet: Microorganisms adapted to HHP are usually known as piezophiles, referring
    to their preference for high pressure
  notes: Pressure-adaptation review supports the bounded span of growth-permissive
    hydrostatic pressure as a defining quantitative descriptor.
causal_graphs:
- graph_id: pressure_range_growth_bounded_span
  title: 'Pressure range: bounded hydrostatic-pressure span supporting growth'
  description: Evidence-backed sketch linking the hydrostatic-pressure axis to the
    minimum/maximum bounds within which growth is sustained.
  nodes:
  - node_id: pressure_range_trait
    label: pressure range
    node_type: TRAIT
    grounding: traitmech:000005
