  - node_id: unsaturated_membrane_lipids
    label: unsaturated membrane lipids
    node_type: CHEMICAL
    description: Unsaturated fatty acids in membrane phospholipids that counter pressure-induced
      ordering.
  - node_id: tmao
    label: trimethylamine N-oxide (TMAO)
    node_type: CHEMICAL
    description: Compatible solute / piezolyte excluded from the protein hydration
