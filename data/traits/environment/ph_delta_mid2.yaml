    evidence:
    - reference: DOI:10.3390/antibiotics12091474
      snippet: Cytoplasmic pH is buffered by small molecules
      notes: Verified against the open Rebelo et al. review; small molecules contribute
        passive cytoplasmic buffering in pH homeostasis.
    predicate_id: RO:0002326
  - subject: pmf_component_balance
    predicate: associated with
    object: broad_ph_homeostasis
    description: Proton-motive-force component balancing is associated with broad
