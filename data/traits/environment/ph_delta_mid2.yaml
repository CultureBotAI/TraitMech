    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: Primary proton pumps generate the PMF
      notes: Verified against the open PMC manuscript of the Krulwich et al. review;
        respiratory-chain proton pumps establish the PMF used by bacterial pH-homeostasis
        systems.
    predicate_id: biolink:associated_with
  - subject: proton_translocation_homeostasis
    predicate: associated with
    object: broad_ph_homeostasis
    description: ATPase-mediated proton translocation is associated with acid-stress
      pH-homeostasis flexibility.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: ATP-dependent H+ extrusion under acidic conditions
      notes: Verified against the open PMC manuscript of the Krulwich et al. review;
        F1Fo-ATPase proton efflux is one acid-side branch of pH homeostasis.
    predicate_id: biolink:associated_with
  - subject: alkaline_ph_homeostasis
    predicate: associated with
    object: broad_ph_homeostasis
    description: Na+/H+ antiporter-dependent alkaline pH homeostasis is one branch
      of broader pH-homeostasis flexibility.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: proton entry driven by the transmembrane potential
      notes: Verified against the open PMC manuscript of the Krulwich et al. review;
        electrogenic antiport is retained as an alkaline-side branch, not a universal
        breadth determinant.
    predicate_id: biolink:associated_with
  - subject: glutamate_decarboxylase_system
    predicate: associated with
    object: broad_ph_homeostasis
    description: The Gad proton-consuming acid-resistance system is associated with
      acid-side support for broad pH homeostasis.
    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: consumes a proton during decarboxylation
      notes: Verified against the open PMC manuscript of the Krulwich et al. review;
        the Gad branch supports acid-side cytoplasmic proton consumption rather than
        directly defining a 3-4 pH-unit growth breadth.
    predicate_id: biolink:associated_with
  - subject: cytoplasmic_ph_buffering
    predicate: associated with
    object: broad_ph_homeostasis
    description: Passive cytoplasmic buffering is associated with broad pH-homeostasis
      flexibility.
    evidence:
    - reference: DOI:10.3390/antibiotics12091474
      snippet: Cytoplasmic pH is buffered by small molecules
      notes: Verified against the open Rebelo et al. review; small molecule buffering
        is retained as passive pH-homeostasis support.
    predicate_id: biolink:associated_with
