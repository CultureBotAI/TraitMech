identifier: METPO:1000476
label: pH delta mid2
definition: A pH delta phenotype with a growth-supporting pH breadth of approximately
  3–4 pH units, characteristic of organisms with broad pH-tolerance breadth.
definition_source: DOI:10.1038/nrmicro2549
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000232
synonyms:
- synonym_text: pHd_3_4
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports broad pH-homeostasis flexibility as the basis
    of generalist pH-tolerance physiology.
canonical_examples:
- taxon_id: NCBITaxon:3447298
  taxon_label: Microbaculum mangrovi
  reference: DOI:10.1099/ijsem.0.006972
  note: Microbaculum mangrovi FT89T grew from pH 5.5 to 9.0, a 3.5-unit breadth wholly
    inside the approximately 3-4 bin.
causal_graphs:
- graph_id: ph_delta_mid2_broad_breadth
  title: pH-delta-mid2 contextual pH-homeostasis breadth
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting broad pH-homeostasis flexibility,
    PMF component balancing, respiratory proton pumping, ATPase-mediated proton translocation,
    alkaline antiport, acid-side decarboxylation, and passive cytoplasmic buffering
    to the 3-4 pH-unit breadth bin.
  nodes:
