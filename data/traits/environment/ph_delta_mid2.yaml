    evidence:
    - reference: DOI:10.1038/nrmicro2549
      snippet: relative magnitudes of the two PMF components
      notes: Verified against the open PMC manuscript of the Krulwich et al. review;
        the connector keeps PMF balancing as one contextual arm of broad pH homeostasis.
    predicate_id: biolink:associated_with
  - subject: pmf_generation
    predicate: associated with
    object: broad_ph_homeostasis
    description: Respiratory proton pumping is associated with the PMF generation
