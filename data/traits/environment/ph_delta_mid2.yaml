  source: metpo.owl
evidence:
- reference: DOI:10.1038/nrmicro2549
  snippet: pH homeostasis
  notes: pH-homeostasis review supports broad pH-homeostasis flexibility as the basis
    of generalist pH-tolerance physiology.
