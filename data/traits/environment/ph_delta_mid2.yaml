    predicate: consumes
    object: intracellular_proton
    description: The glutamate decarboxylase system consumes intracellular protons
      during decarboxylation.
    evidence:
    - reference: DOI:10.3390/antibiotics12091474
      notes: Glutamate decarboxylase (GadB with its antiporter) is a proton-consuming
        acid-tolerance mechanism (GDAR), broadly curated in Gram-negatives.
  - subject: cytoplasmic_buffers
    predicate: buffers
    object: cytoplasmic_ph_buffering
    description: Small molecules (polyamines, amino acids, phosphate) passively buffer
