- timestamp: '2026-08-08T05:00:00Z'
  curator: claude
  action: MERGE_CAUSAL_NODE
  changes: 'Merged node salt_tolerance_breadth into nacl_delta and repointed its edges.
    Issue 352. A FIFTH restatement, caught in review (#360). ''Capacity to grow across
    a range of ambient NaCl concentrations'' against nacl_delta''s ''Breadth of the
    growth-supporting NaCl range'' -- the same claim, and nacl_delta is in the same
    graph already TRAIT and already grounded METPO:1000335. I had retyped it and grounded
    it METPO:1000622 (halotolerant), which is a DEGREE of tolerance, not a breadth:
    1000622 is a halophily preference (sub 1000629) while 1000335 is a delta (sub
    1000532/1000534), so the node''s existing `is a -> nacl_delta` edge asserted halotolerant
    sub NaCl delta, a subsumption METPO does not have. The absolute-vs-breadth distinction
    this migration insists on for pH, missed for salt.'
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): ectoine_biosynthesis is typed PATHWAY. PATHWAY is a named,
    conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is everything else.
    A named route, enumerated two ways and both of them enumerations. environment/euryhaline.yaml
    counts five steps from L-aspartate (lysC/asd/ectB/ectA/ectC); environment/nacl_delta_mid1.yaml
    counts the three ectABC enzymes proper. Naming the file matters because the two
    differ and a bare quote would put euryhaline''s wording into nacl_delta_mid1''s
    record (#400 review). Either way the steps can be listed, which is the test. Applied
    AGAINST the majority, which was 4 BIOLOGICAL_PROCESS to 2 before this tranche.'
  llm_assisted: true
