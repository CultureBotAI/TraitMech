  - node_id: trkh_k_uptake
    label: TrkH potassium uptake system
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: TrkH-type K+ uptake transporter supporting intracellular potassium
      homeostasis under salt stress.
  - node_id: nhac_antiporter
    label: NhaC-family Na+/H+ antiporter
    node_type: GENE_OR_PROTEIN
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Reviewed as a contextual protein or protein-complex label within
      a quantitative measurement graph; no exact semantic family term was established
      for this aggregate use.
    description: NhaC-family Na+/H+ antiporters mediating ion homeostasis under salt
      stress.
  - node_id: intracellular_proline
    label: intracellular proline accumulation
    node_type: CHEMICAL
    description: Accumulation of proline as a compatible solute supporting growth
      at higher NaCl.
  edges:
  - subject: limited_osmoadaptive_flexibility
    predicate: confers
    object: nacl_delta_low_trait
    description: Limited osmoadaptive flexibility yields a narrow NaCl-delta breadth.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports limited osmoadaptive flexibility as the basis of stenohaline
        breadth.
    predicate_id: METPO:2007700
  - subject: nacl_delta_low_trait
    predicate: is a
    object: nacl_delta
    description: NaCl delta low is a quantitative bin of the NaCl-delta phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: salinity range
      notes: Supports a narrow breadth as a value within the NaCl-delta distribution.
    predicate_id: rdfs:subClassOf
  - subject: ectoine_biosynthesis
    predicate: supports
    object: nacl_delta
    description: Ectoine biosynthesis capacity broadens NaCl tolerance; its loss narrows
      the growth range.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: Wild-type H. elongata synthesizes ectoine as a major osmolyte, whereas
        ectoine-deficient strains become salt sensitive; supports general role of
        ectoine pathway in broadening NaCl tolerance.
  - subject: compatible_solute_transporters
    predicate: supports
    object: limited_osmoadaptive_flexibility
    description: Salinity-induced Opu/ProU compatible-solute transporters underlie
      osmoadaptive flexibility; limited capacity contributes to narrow breadth.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      notes: Proteomics showed salinity-linked increases in compatible-solute transporters
        (opuAC, proX/proV/proW) supporting osmoadaptation.
  - subject: trkh_k_uptake
    predicate: supports
    object: nacl_delta
    description: TrkH K+ uptake supports intracellular K+ homeostasis enabling salt
      tolerance; its absence may contribute to narrow breadth.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      notes: TrkH listed among salinity-responsive proteins; simultaneous accumulation
        of compatible solutes and K+ supports salt adaptation.
  - subject: nhac_antiporter
    predicate: supports
    object: nacl_delta
    description: NhaC Na+/H+ antiporters support ion homeostasis under salt stress;
      a candidate breadth-expanding mechanism whose absence may contribute to NaCl
      delta low.
    evidence:
    - reference: DOI:10.1128/aem.00145-24
      notes: Proteomics show strong salinity-linked increases for NhaC-family antiporters
        (~3.27 and 3.22-fold).
  - subject: intracellular_proline
    predicate: supports
    object: nacl_delta
    description: Increased intracellular proline as a compatible solute supports growth
      at higher NaCl, broadening tolerance.
    evidence:
    - reference: DOI:10.1128/aem.01195-24
      notes: Engineered proline biosynthesis with blocked catabolism increased intracellular
        proline and restored growth at 8% NaCl; supports osmolyte role of proline
        in salt-tolerance breadth.
