identifier: METPO:1000453
label: temperature range mid4
definition: A temperature range phenotype in which the growth-supporting ambient temperature
  range spans approximately 34–40 °C, characteristic of warm-mesophilic physiology
  (including many mammalian host-associated bacteria).
definition_source: DOI:10.1146/annurev-micro-091313-103612
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Mesophilie
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_34_to_40
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: mesophilic
  synonym_type: EXACT_SYNONYM
  source: https://w3id.org/metpo/releases/2026-06-12/metpo.owl
evidence:
- reference: DOI:10.1146/annurev-micro-091313-103612
  snippet: more unsaturated fatty acids
  notes: Membrane-adaptation review supports the 34–40 °C range as the warm-mesophile
    (mammalian-host) growth range.
canonical_examples:
- taxon_id: NCBITaxon:3028314
  taxon_label: Oceanimonas pelagia
  reference: DOI:10.1007/s10482-024-01948-y
  note: Oceanimonas pelagia NTOU-MSR1T grew from 10 to 45 degrees C, a directly reported
    35-degree breadth within the approximately 34-40-degree bin.
