  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): salt_in_strategy is typed BIOLOGICAL_PROCESS. PATHWAY
    is a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is
    everything else. A STRATEGY, not a route. The family is described as osmoadaptation
    by accumulating intracellular inorganic ions -- haloalkaliphilic.yaml puts it
    as ''Osmoadaptation by intracellular accumulation of inorganic ions (e.g. K+)'',
    and the wording varies by record. There is no step list to enumerate, which is
    exactly the distinction this rule draws. Was 7 BIOLOGICAL_PROCESS to 1 before
    this tranche.'
  llm_assisted: true
