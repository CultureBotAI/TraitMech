identifier: METPO:1000611
label: strictly anaerobic
definition: An obligately anaerobic oxygen preference in which a microorganism does
  not grow in the presence of oxygen gas (O₂).
definition_source: https://www.ncbi.nlm.nih.gov/books/NBK482349/
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
