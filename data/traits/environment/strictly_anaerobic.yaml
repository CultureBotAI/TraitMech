  source: metpo.owl
- synonym_text: strict obligate anaerobe
  synonym_type: RELATED_SYNONYM
  source: https://www.ncbi.nlm.nih.gov/books/NBK482349/
evidence:
- reference: https://www.ncbi.nlm.nih.gov/books/NBK482349/
  snippet: will not survive if there is more than half a percent oxygen
  notes: Supports strict anaerobiosis as a highly oxygen-sensitive subtype.
- reference: PMID:39189748
  snippet: Clostridioides difficile is a strict anaerobic, sporulating Firmicutes
  notes: 'Organism example: Clostridioides difficile is described as strictly anaerobic.'
