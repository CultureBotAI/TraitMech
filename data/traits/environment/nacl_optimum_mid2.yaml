identifier: METPO:1000467
label: NaCl optimum mid2
definition: A NaCl optimum phenotype with the best-growth NaCl concentration approximately
  between 3 and 8% (w/v), corresponding to moderate-halophile or halotolerant physiology.
definition_source: DOI:10.1093/femsre/fuy009
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000333
synonyms:
- synonym_text: Halotolerant
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: Moderate halophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: NaO_3_to_8
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1093/femsre/fuy009
  snippet: moderate halophile
  notes: Osmoadaptation review supports the 3–8% NaCl optimum range as the moderate-halophile
    category.
causal_graphs:
- graph_id: nacl_optimum_mid2_moderate_halophile
  title: NaCl-optimum-mid2 moderate-halophile setpoint
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed graph linking pronounced compatible-solute accumulation
    at elevated NaCl to a 3–8% (w/v) NaCl-optimum (moderate halophile).
  nodes:
  - node_id: nacl_optimum_mid2_trait
    label: NaCl optimum mid2
    node_type: TRAIT
    grounding: METPO:1000467
    description: NaCl optimum approximately 3–8% w/v.
  - node_id: nacl_optimum
    label: NaCl optimum
    node_type: TRAIT
    grounding: METPO:1000333
    description: NaCl concentration supporting maximal growth.
  - node_id: elevated_nacl
    label: elevated NaCl
    node_type: ENVIRONMENTAL_FACTOR
    description: External NaCl ~3–8% w/v, typical of saline lakes and salt marshes.
  - node_id: pronounced_compatible_solutes
    label: pronounced compatible-solute accumulation
    node_type: BIOLOGICAL_PROCESS
    description: Substantial accumulation of organic osmolytes (ectoine, glycine betaine)
      under moderately hypersaline conditions.
  - node_id: ectoine_biosynthesis_module
    label: ectoine biosynthesis module (ectABC)
    node_type: PATHWAY
    description: Canonical ectABC (ectA/ectB/ectC) pathway producing the compatible
      solute ectoine.
  - node_id: ectoine
    label: ectoine
    node_type: CHEMICAL
    description: Major organic compatible solute (CHEBI:22563) accumulated during
      osmoadaptation.
    grounding: CHEBI:27592
  - node_id: compatible_solute_strategy
    label: compatible-solute strategy
    node_type: BIOLOGICAL_PROCESS
    description: Osmoadaptation strategy buffering osmotic stress via accumulation
      of small organic osmolytes.
  - node_id: glycine_betaine
    label: glycine betaine
    node_type: CHEMICAL
    description: Organic compatible solute (CHEBI:17750) used in compatible-solute
      osmoadaptation.
    grounding: CHEBI:17750
  - node_id: l_proline
    label: L-proline
    node_type: CHEMICAL
    description: Organic compatible solute (CHEBI:26271) used in compatible-solute
      osmoadaptation.
  edges:
  - subject: elevated_nacl
    predicate: regulates
    object: pronounced_compatible_solutes
    description: Elevated NaCl drives substantial compatible-solute accumulation.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: synthesize organic osmotic solutes
      notes: Supports compatible-solute accumulation as the osmoadaptive response
        at elevated NaCl.
    predicate_id: RO:0002211
  - subject: pronounced_compatible_solutes
    predicate: confers
    object: nacl_optimum_mid2_trait
    description: Pronounced compatible-solute accumulation yields a 3–8% NaCl-optimum
      setpoint.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: moderate halophile
      notes: Supports the 3–8% optimum as the moderate-halophile outcome.
    predicate_id: METPO:2007700
  - subject: nacl_optimum_mid2_trait
    predicate: is a
    object: nacl_optimum
    description: NaCl optimum mid2 is a quantitative bin of the NaCl-optimum phenotype.
    evidence:
    - reference: DOI:10.1093/femsre/fuy009
      snippet: optimal NaCl
      notes: Supports the 3–8% optimum as a value within the NaCl-optimum distribution.
    predicate_id: rdfs:subClassOf
  - subject: elevated_nacl
    predicate: induces
    object: ectoine_biosynthesis_module
    description: Elevated salinity (>3% NaCl) triggers the canonical ectoine biosynthesis
      pathway.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: Exposure to salt concentrations higher than 3% NaCl triggers biosynthesis
        and intracellular accumulation of ectoine as a major compatible solute (Zou
        et al. 2024).
  - subject: elevated_nacl
    predicate: upregulates
    object: ectoine_biosynthesis_module
    description: Salt stress at ~6% w/v NaCl (within the 3-8% window) upregulates
      the ectoine biosynthesis module.
    evidence:
    - reference: DOI:10.1186/s12934-024-02515-w
      notes: Transcriptomics showed the ectoine biosynthesis module is upregulated
        under salt stress, with 60 g/L NaCl (~6% w/v, inside 3-8% window) optimal
        for growth (Chen et al. 2024).
  - subject: ectoine_biosynthesis_module
    predicate: has output
    object: ectoine
    description: The ectABC pathway synthesizes the compatible solute ectoine.
    evidence:
    - reference: DOI:10.1128/aem.01905-23
      notes: Biosynthesis and intracellular accumulation of ectoine as a major compatible
        solute via the ectoine pathway (Zou et al. 2024).
    predicate_id: RO:0002234
  - subject: pronounced_compatible_solutes
    predicate: is a
    object: compatible_solute_strategy
    description: Pronounced organic-osmolyte accumulation is an instance of the compatible-solute
      osmoadaptation strategy.
    evidence:
    - reference: DOI:10.3390/biotech14020049
      notes: The compatible-solute strategy accumulates small organic osmolytes including
        glycine, betaine, and ectoine (Neagu & Stancu 2025).
    predicate_id: rdfs:subClassOf
  - subject: compatible_solute_strategy
    predicate: uses
    object: ectoine
    description: Compatible-solute osmoadaptation employs ectoine as an organic osmolyte.
    evidence:
    - reference: DOI:10.1186/s12934-025-02757-2
      notes: Many species naturally produce the osmolyte ectoine (plus hydroxyectoine,
        betaine, glycine, proline) (Coimbra et al. 2025).
  - subject: compatible_solute_strategy
    predicate: uses
    object: glycine_betaine
    description: Compatible-solute osmoadaptation employs glycine betaine as an organic
      osmolyte.
    evidence:
    - reference: DOI:10.3390/biotech14020049
      notes: Identified compatible solutes include glycine, betaine, and ectoine (Neagu
        & Stancu 2025).
  - subject: compatible_solute_strategy
    predicate: uses
    object: l_proline
    description: Compatible-solute osmoadaptation employs L-proline as an organic
      osmolyte.
    evidence:
    - reference: DOI:10.1186/s12934-025-02757-2
      notes: Many species naturally produce the osmolyte ectoine plus hydroxyectoine,
        betaine, glycine, proline (Coimbra et al. 2025).
