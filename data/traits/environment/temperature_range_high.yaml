identifier: METPO:1000454
label: temperature range high
definition: A temperature range phenotype in which the growth-supporting ambient temperature
  range extends above approximately 40 °C, characteristic of thermophilic physiology.
definition_source: DOI:10.1016/s0300-9629(97)00003-0
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Thermophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_>40
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/s0300-9629(97)00003-0
  snippet: adapted to environments of high temperature
  notes: Thermophile-adaptation review supports growth ranges extending above 40 °C
    as the thermophile category.
- reference: DOI:10.1128/MMBR.65.1.1-43.2001
  snippet: resistant to irreversible inactivation at high temperatures
  notes: Thermostable-protein review supports thermostability as the mechanism extending
    growth into thermophilic temperatures.
causal_graphs:
- graph_id: temperature_range_high_thermophile
  title: Temperature-range-high thermophile range
  description: DOI-backed graph linking thermophile thermostability to a temperature
    growth range extending above 40 °C.
  nodes:
  - node_id: temperature_range_high_trait
    label: temperature range high
    node_type: TRAIT
    grounding: METPO:1000454
    description: Temperature growth-supporting range extending above ~40 °C.
  - node_id: temperature_range
    label: temperature range
    node_type: TRAIT
    grounding: METPO:1000306
    description: Span of ambient temperatures supporting growth.
  - node_id: thermophile_thermostability
    label: thermophile thermostability
    node_type: BIOLOGICAL_PROCESS
    description: Heat-stable membrane lipids and proteins that retain function at
      elevated temperatures.
  - node_id: reverse_gyrase
    label: reverse gyrase (TopR/rgy)
    node_type: GENE_OR_PROTEIN
    description: Topoisomerase that introduces positive supercoils into DNA in thermophiles.
    grounding: GO:0160097
  - node_id: positive_dna_supercoiling
    label: positive DNA supercoiling
    node_type: QUALITY
    description: Positively supercoiled DNA topology generated by reverse gyrase.
  - node_id: dna_melting
    label: DNA melting
    node_type: BIOLOGICAL_PROCESS
    description: Thermal denaturation/strand separation of DNA at elevated temperature.
  - node_id: dnak_dnaj
    label: DnaK-DnaJ chaperone
    node_type: GENE_OR_PROTEIN
    description: Hsp70 chaperone system assisting ATP-dependent protein folding.
  - node_id: protein_folding
    label: protein folding
    node_type: BIOLOGICAL_PROCESS
    description: Folding of nascent and unfolded polypeptides into native conformation.
    grounding: GO:0006457
  - node_id: groel_groes_htpg
    label: GroEL-GroES / HtpG chaperone
    node_type: GENE_OR_PROTEIN
    description: Chaperonin and Hsp90 systems assisting protein folding under heat
      stress.
  - node_id: proteostasis_high_temp
    label: proteostasis at high temperature
    node_type: BIOLOGICAL_PROCESS
    description: Maintenance of protein homeostasis (folding/refolding/degradation)
      at elevated temperature.
  edges:
  - subject: thermophile_thermostability
    predicate: confers
    object: temperature_range_high_trait
    description: Thermophile thermostability enables growth at > 40 °C.
    evidence:
    - reference: DOI:10.1128/MMBR.65.1.1-43.2001
      snippet: resistant to irreversible inactivation at high temperatures
      notes: Supports thermostability as the range mechanism for thermophile physiology.
    predicate_id: METPO:2007700
  - subject: temperature_range_high_trait
    predicate: is a
    object: temperature_range
    description: Temperature range high is a quantitative bin of the temperature-range
      phenotype.
    evidence:
    - reference: DOI:10.1016/s0300-9629(97)00003-0
      snippet: adapted to environments of high temperature
      notes: Supports the >40 °C range as a value within the temperature-range distribution.
    predicate_id: rdfs:subClassOf
  - subject: reverse_gyrase
    predicate: introduces
    object: positive_dna_supercoiling
    description: Reverse gyrase introduces positive supercoils into DNA.
    evidence:
    - reference: DOI:10.1264/jsme2.me23087
      notes: reverse gyrase, a unique topoisomerase that introduces positive supercoils
        into DNA; broadly applicable to thermophiles.
  - subject: positive_dna_supercoiling
    predicate: limits
    object: dna_melting
    description: Positive DNA supercoiling limits thermal melting of DNA.
    evidence:
    - reference: DOI:10.1264/jsme2.me23087
      notes: maintain the genome integrity of thermophiles by limiting DNA melting;
        general for reverse-gyrase-bearing thermophiles.
    predicate_id: RO:0002212
  - subject: reverse_gyrase
    predicate: confers
    object: temperature_range_high_trait
    description: Reverse gyrase activity supports growth at high temperature via genome
      stabilization.
    evidence:
    - reference: DOI:10.1128/mbio.02174-23
      notes: Reverse gyrase reported as essential for growth at very high temperature,
        maintaining DNA stability.
    predicate_id: METPO:2007700
  - subject: dnak_dnaj
    predicate: assists
    object: protein_folding
    description: DnaK-DnaJ assists ATP-dependent folding of nascent and unfolded proteins.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: DnaK-DnaJ assist ATP-dependent folding of nascent and unfolded peptides;
        bacterial high-temperature response.
  - subject: groel_groes_htpg
    predicate: assists
    object: protein_folding
    description: GroEL-GroES and HtpG assist protein folding under heat stress.
    evidence:
    - reference: DOI:10.1007/s12275-023-00031-x
      notes: GroEL-GroES, HtpG assist protein folding under heat stress; broadly relevant
        heat response.
  - subject: protein_folding
    predicate: maintains
    object: proteostasis_high_temp
    description: Chaperone-assisted folding maintains proteostasis at high temperature.
    evidence:
    - reference: DOI:10.1128/mbio.02174-23
      notes: refolding/degradation systems counter protein denaturation, aggregation
        and loss of function during heat shock.
  - subject: proteostasis_high_temp
    predicate: confers
    object: temperature_range_high_trait
    description: Proteostasis at high temperature supports growth above 40 C.
    evidence:
    - reference: DOI:10.1128/mbio.02174-23
      notes: proteostasis machinery supports thermophile survival/growth at high temperature.
    predicate_id: METPO:2007700
