canonical_examples:
- taxon_id: NCBITaxon:2261
  taxon_label: Pyrococcus furiosus
  reference: DOI:10.1007/s00792-017-0929-z
  note: Hyperthermophilic archaeon growing above 90 degrees C; the strongest taxon-specific
    evidence in this trait's research artifact, where a reverse gyrase deletion abolishes
    growth at 95-100 degrees C while lower temperatures stay permissive.
- taxon_id: NCBITaxon:2285
  taxon_label: Sulfolobus acidocaldarius
  reference: DOI:10.1128/mbio.03593-22
  note: Thermoacidophilic crenarchaeon used as the model for the heat-shock response
    at the upper end of the growth range.
- taxon_id: NCBITaxon:43080
  taxon_label: Saccharolobus islandicus
  reference: DOI:10.1128/mbio.02174-23
  note: Hyperthermophile whose thermal-stress regulatory network is characterised
    by transcriptomics and proteomics.
