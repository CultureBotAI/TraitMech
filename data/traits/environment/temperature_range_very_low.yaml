identifier: METPO:1000448
label: temperature range very low
definition: A temperature range phenotype in which growth extends to ambient temperatures
  at or below approximately 10 °C, characteristic of psychrophilic growth ranges.
definition_source: DOI:10.1038/sj.embor.7400662
trait_category: ENVIRONMENT
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000306
synonyms:
- synonym_text: Psychrophile
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: TR_<=10
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1038/sj.embor.7400662
  snippet: growing well at temperatures around the freezing point of water
  notes: Psychrophile review supports growth at very low temperatures as the psychrophilic
    range.
canonical_examples:
- taxon_id: NCBITaxon:357794
  taxon_label: Psychromonas ingrahamii
  reference: DOI:10.1099/ijs.0.64068-0
  note: Psychromonas ingrahamii strain 37T grew from -12 to 10 degrees C in its primary
    species description, directly establishing growth at and below this bin's 10-degree
    threshold.
causal_graphs:
- graph_id: temperature_range_very_low_psychrophile
  title: Temperature-range-very-low psychrophile context
  scope_status: NONMECHANISTIC
  scope_notes: This record is a quantitative measurement, interval, or bin in the
    environmental phenotype hierarchy; a token protein example would misrepresent
    the measured value as one inherited molecular mechanism.
  description: DOI-backed nonmechanistic graph connecting membrane desaturation, two-component
    cold signaling, CspA-family RNA chaperones, cold proteostasis, compatible-solute
    stabilization, and ice-binding protein branches to the at-or-below-10-degrees-C
    growth-range bin.
  nodes:
  - node_id: temperature_range_very_low_trait
    label: temperature range very low
