    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: production of double bonds in lipids
      notes: Verified against the open Ramón et al. PubMed abstract; the multifactorial
        cold-adaptation model lists membrane composition adaptation by producing lipid
        double bonds.
    predicate_id: RO:0002213
  - subject: low_temperature
    predicate: activates
    object: two_component_cold_signaling
    description: Cold-induced membrane state changes activate two-component cold signaling.
    evidence:
    - reference: DOI:10.1007/s42770-023-01057-4
      snippet: activation of a two-component system
      notes: Verified against the open Ramón et al. PubMed abstract; cold sensing
        is described as occurring mainly through liquid-crystalline membrane-state
        changes that activate a two-component signal-transduction system.
    predicate_id: RO:0002213
  - subject: cold_shock_proteins
    predicate: regulates
    object: cold_stabilized_rna_secondary_structure
    description: CspA-family RNA chaperones regulate cold-stabilized RNA structures
      to sustain translation.
    evidence:
    - reference: DOI:10.4161/rna.7.6.13482
      snippet: through their RNA chaperoning function
      notes: Verified against the open Phadtare and Severinov PubMed abstract; CspA-family
        cold-shock proteins are described as RNA-modulating proteins affecting low-temperature
        transcription and possibly translation through RNA chaperoning.
    predicate_id: RO:0002211
  - subject: molecular_chaperones
    predicate: contributes to
    object: proteostasis_cold
    description: Chaperone/protease systems contribute to proteostasis by countering
      cold-slowed folding and misfolding risk.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1197797
      snippet: heat shock proteins associated to folding
      notes: Verified against the open Ramasamy et al. PMC text; the Antarctic psychrophile
        review discusses heat-shock proteins associated with protein folding in 4
        °C versus 18 °C Pseudoalteromonas haloplanktis TAC125.
    predicate_id: RO:0002326
  - subject: compatible_solutes
    predicate: contributes to
    object: protein_membrane_stabilization
    description: Osmolytes contribute to protein and membrane stabilization while
      lowering freezing damage.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1197797
      snippet: stabilizing membranes and proteins at chilling temperatures
      notes: Verified against the open Ramasamy et al. PMC text; Antarctic compatible
        osmolytes are described as restoring osmotic balance, scavenging free radicals,
        counteracting protein aggregation, improving protein folding, and stabilizing
        membranes and proteins.
    predicate_id: RO:0002326
  - subject: ice_binding_proteins
    predicate: inhibits
    object: ice_crystal_growth
    description: AFPs/IBPs bind ice and inhibit ice-crystal growth and recrystallization.
    evidence:
    - reference: DOI:10.3389/fmicb.2023.1197797
      snippet: inhibits the growth of ice crystals
      notes: Verified against the open Ramasamy et al. PMC text; ice binding proteins
        are described as antifreeze proteins that bind ice, inhibit ice-crystal growth,
        lower freezing temperature, create a thermal hysteresis gap, and display ice-recrystallization
        inhibition activity.
    predicate_id: RO:0002212
