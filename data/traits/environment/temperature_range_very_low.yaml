    label: membrane fluidity
    node_type: QUALITY
    description: Physical fluidity of the membrane bilayer required for function in
      the cold.
    grounding: METPO:1007505
  - node_id: two_component_cold_signaling
    label: two-component cold signaling
    node_type: BIOLOGICAL_PROCESS
    description: Two-component regulatory systems triggered by cold-induced membrane
      state changes.
  - node_id: cold_shock_proteins
