identifier: traitmech:000623
label: cytogamy
definition: A sexual-reproduction phenotype in which a paired cell self-fertilizes
  by fusion of its own gametic nuclei without exchanging gametic nuclei with its partner.
definition_source: DOI:10.1017/S0016672300010740
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000625
evidence:
- reference: DOI:10.1017/S0016672300010740
  snippet: Cytogamy is a process of internal self-fertilization in animals which appear
    to conjugate, but which in fact do not exchange nuclei
  notes: Nobili and Luporini (1967), PMID:4964874, p.39 parenthetical before the Wichterman
    citation, checked in the typeset PDF. This directly read definition supports paired-cell
    internal self-fertilization without nuclear exchange. The surrounding Results
    and Table 2 offer cytogamy as an explanation for three mating-type outlier clones;
    they do not directly demonstrate cytogamy in those clones. The paper's primary
    experiments concern autogamy in Euplotes minuta. Do not count this terminology
    passage as independent experimental replication or turn its proposed explanation
    into a canonical taxon example. The cited 1940 original was not read beyond bibliographic
    metadata.
- reference: DOI:10.1111/j.1550-7408.1958.tb02567.x
  snippet: In fact, the conjugation process seems to be one of double autogamy (cytogamy),
    rather than of reciprocal gametic interchange.
  notes: Diller (1958), scientific abstract directly read on the Wiley publisher page.
    The qualifier seems is retained. Paired Paramecium polycaryum cultures collected
    at Annamalainagar, South India, showed nuclear behavior resembling autogamy in
    singles. Breakdown of the paroral cones permitting micronuclear passage was not
    observed; this is not a genetic exclusion of exchange. The abstract also describes
    fertilization and postzygotic nuclear reorganization. Double autogamy is source-attributed
    terminology, not equivalence with our unpaired-cell autogamy class. Full text,
    actual figures and tables were not inspected; the tentative observation is not
    an unqualified canonical example.
- reference: DOI:10.1093/genetics/91.4.657
  snippet: cytogamy generates exconjugant clones that derive their entire genetic
    information from a single meiotic product of their cytoplasmic parent.
  notes: 'Orias and Hamilton (1979), PMID:17248904, PMC1216858, scientific abstract
    clause after By analogy to Paramecium, directly checked in Europe PMC core metadata
    and NCBI PMC EFetch front-matter XML. The abstract reports hyperosmotic-shock-induced
    cytogamy in tested Tetrahymena thermophila strains and high fertility in most
    progeny. Its whole-genome-homozygote interpretation is source-specific, not a
    universal definition requirement or a genome-sequencing result established here.
    Other rare transmission abnormalities were not characterized in that abstract.
    The full text, Methods, actual figures and tables remain unread: PMC EFetch withholds
    body XML, and attempted public PDF retrieval did not yield a readable PDF. Strain
    provenance is unresolved; no natural canonical example or protein-level causal
    mechanism is inferred from this abstract.'
discussions:
- discussion_id: cytogamy-scope-and-hierarchy
  prompt: Distinguish paired-cell self-fertilization from unpaired autogamy.
  kind: CURATION_TODO
  status: OPEN
  rationale: Pairing with internal gametic-nuclear fusion and no gametic-nuclear exchange
    distinguishes this class from ordinary conjugation with exchange and from operationally
    unpaired autogamy traitmech:000622. Diller (1958) calls the tentative observation
    double autogamy; preserve that broader source usage without silently making cytogamy
    a child or exact synonym of the unpaired class. This is not all selfing or a literal
    mating locus. No universal hyperosmotic trigger, whole-genome homozygosity, nuclear
    count or inability to outcross is imposed. Do not infer species-level disjointness
    between reproductive modes. The parent gap is resolved by automixis traitmech:000625,
    whose single-meiotic-cell nuclear origin includes this operational scope. The
    broader terminology and mapping questions keep this discussion OPEN. Verify external
    equivalences and synonym scope before adding mappings.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: cytogamy-mechanism-and-provenance
  prompt: Resolve original cytology, strain provenance and molecular mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: The 1967 definitional passage is not a direct cytogamy experiment, the
    1958 observation is tentative, and the 1979 evidence here is limited to its scientific
    abstract. Retrieve the original primary study DOI:10.1002/jmor.1050660303 (Wichterman,
    1940) and the remaining experimental material before stronger cytological or natural-strain
    claims. That 1940 DOI is a metadata-verified research lead, not counted trait
    evidence. No canonical example is assigned from unresolved provenance or tentative
    marker explanations. Induced transmission outcomes do not identify a molecular
    causal pathway; graphs and protein accessions remain deferred. Retain actual snippet-resolver
    outcomes separately from direct source checks.
  posed_by: codex
  posed_date: '2026-10-05'
