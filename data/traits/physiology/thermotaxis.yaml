  scope_status: MECHANISTIC
  scope_notes: The E. coli Tar-mediated arm, not a universal microbial mechanism or
    a complete Tar/Tsr accumulation model. Engineered receptor experiments establish
    the Tar transitions. Interplay with Tsr and chemical adaptation changes the intact-cell
    response.
