discussions:
- discussion_id: thermotaxis-context-and-mapping-boundaries
  prompt: Resolve assay-dependent response inversion without imposing a universal
    temperature threshold.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DOI:10.1073/pnas.0709903105 reports thermal-response inversion under
    its tethered-cell conditions. DOI:10.7554/eLife.26607 instead finds continued
    warm-seeking in buffer under flow; its Discussion suggests residual chemical stimulation
    as one explanation of earlier results, not a proven correction. Retain medium,
    adaptation, strain and assay context. Growth optima, passive thermophoresis and
    temperature-dependent speed alone do not establish thermotaxis. GO:0043052 is
    a biological process (QuickGO checked 2026-10-03), so it grounds the process node
    rather than an equivalent xref on the disposition. The Tar arm does not describe
    every thermotactic microbe.
  posed_by: codex
  posed_date: '2026-10-03'
