identifier: traitmech:000580
label: thermotaxis
definition: A motile phenotype in which an organism biases its active movement in
  response to a temperature gradient.
definition_source: DOI:10.7554/eLife.26607
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.7554/eLife.26607
  snippet: detect and follow environmental temperature gradients
  notes: Paulick et al., Introduction; version 2, Version of Record dated 2017-08-31,
    https://cdn.elifesciences.org/articles/26607/elife-26607-v2.pdf. Figures 1-3 and
    their figure supplements distinguish behavioral gradients from FRET reporters
    and chemical adaptation. Temperature preference for movement is not a growth-temperature
    class.
- reference: DOI:10.1073/pnas.0709903105
  snippet: responds to changes in temperature by modifying its motor behavior
  notes: 'Paster and Ryu, Abstract and Results: thermal pulses changed tethered-cell
    motor bias. Their inversion temperatures are assay-specific, not universal trait
    thresholds. This assay measures motor output rather than spatial accumulation.'
canonical_examples:
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  reference: DOI:10.7554/eLife.26607
  note: 'AW405, a K-12 derivative carrying a GFP marker, showed thermal migration
    in microfluidic gradients (Figures 1C and 2D-E; Methods: Strains and plasmids).
    It is not the engineered VS223 FRET reporter or the MG1655 growth assay.'
causal_graphs:
