identifier: traitmech:000174
label: naphthol-AS-BI-phosphohydrolase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  phosphohydrolases that hydrolyze naphthol-AS-BI-phosphate substrates.
definition_source: DOI:10.14202/vetworld.2024.143-149
trait_category: PHYSIOLOGY
