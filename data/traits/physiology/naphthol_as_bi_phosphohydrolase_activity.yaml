identifier: traitmech:000174
label: naphthol-AS-BI-phosphohydrolase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  phosphohydrolases that hydrolyze naphthol-AS-BI-phosphate substrates.
definition_source: DOI:10.14202/vetworld.2024.143-149
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: naphthol-AS-BI-phosphohydrolase
  synonym_type: RELATED_SYNONYM
  source: DOI:10.14202/vetworld.2024.143-149
evidence:
- reference: DOI:10.14202/vetworld.2024.143-149
  snippet: Naphthol-AS-BI-phosphohydrolase 5.4 Naphthol-AS-BI-phosphate
  notes: Ludfiani et al. list Naphthol-AS-BI-phosphate as the API ZYM naphthol-AS-BI-phosphohydrolase
    substrate, grounding the organism-level phenotype as hydrolysis of the naphthol-AS-BI
    phosphate chromogenic substrate.
- reference: DOI:10.1128/JCM.43.8.3713-3717.2005
  snippet: Alkaline phosphatase, esterase (C4), esterase lipase (C8), leucine arylamidase,
    acid phosphatase, and naphthol-AS-BI-phosphohydrolase were clearly positive
  notes: Otsuka et al. detected clear naphthol-AS-BI-phosphohydrolase API ZYM reactions
    in the five Corynebacterium resistens isolates they characterized.
