      role: SprT is the Streptomyces griseus extracellular trypsin (EC 3.4.21.4) that
        catalyzes endopeptidase cleavage after basic L-arginine or L-lysine residues.
      evidence:
      - reference: DOI:10.1016/0006-291x(91)91248-b
        snippet: Streptomyces griseus trypsin (E.C. 3.4.21.4) is one of the major
          extracellular proteinase, which is secreted by S. griseus. The gene encoding
          S. griseus trypsin was isolated from a S. griseus genomic library by using
          a synthetic oligonucleotide probe. Fragments containing the gene for S.
