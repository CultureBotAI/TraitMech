causal_graphs:
- graph_id: trypsin_hydrolysis_sketch
  title: Trypsin endopeptidase cleavage at L-arginyl and L-lysyl peptide bonds
  description: Evidence-backed physiological mechanism sketch linking trypsin serine-endopeptidase
    catalytic activity and peptide cleavage product release to the trypsin activity
    phenotype.
  scope_status: MECHANISTIC
  scope_notes: Mechanistic graph backed by EC 3.4.21.4, DOI:10.1371/journal.pone.0322500,
    and DOI:10.1016/0006-291x(91)91248-b; exemplified on trypsin_sprt with Streptomyces
    griseus (NCBITaxon:1911) trypsin SprT (UniProtKB:P00775).
  nodes:
  - node_id: trypsin_activity_trait
    label: trypsin activity
    node_type: TRAIT
    grounding: traitmech:000158
    description: Physiological enzyme-activity phenotype in which a cell produces
      active trypsin-like serine endopeptidases that preferentially cleave peptide
      and arylamide bonds at L-arginine and L-lysine residues.
  - node_id: trypsin_catalytic_activity
    label: serine-type endopeptidase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0004252
    description: Serine-type endopeptidase catalytic activity with preferential cleavage
      at the carboxyl group of L-arginine or L-lysine residues (EC 3.4.21.4).
  - node_id: trypsin_peptide_product
    label: peptide
    node_type: CHEMICAL
    grounding: CHEBI:16670
    description: Peptide cleavage product generated by trypsin endopeptidase hydrolysis
