identifier: traitmech:000158
label: trypsin activity
definition: A physiological enzyme-activity phenotype in which a cell exhibits trypsin-like
  serine endopeptidase activity, preferentially cleaving peptide bonds on the carboxyl
  side of arginine or lysine residues.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/4.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: trypsin
  synonym_type: RELATED_SYNONYM
  source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/4.html
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/4.html
  snippet: '<b>Reaction:</b> Preferential cleavage: Arg<img src="../../../EZgif/FISS.GIF"
    align=top>, Lys<img src="../../../EZgif/FISS.GIF" align=top>'
  notes: The NC-IUBMB EC 3.4.21.4 entry accepts the name trypsin and its reaction
    line places the scissile-bond FISS.GIF image immediately after Arg and Lys.
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/4.html
  snippet: Isolated as multiple cationic and anionic trypsins [5] from the pancreas
    of many vertebrates and from lower species including crayfish, insects (cocoonase)
    and microorganisms
  notes: The NC-IUBMB EC 3.4.21.4 comments note that trypsins have also been isolated
    from microorganisms.
- reference: DOI:10.1371/journal.pone.0322500
  snippet: Enzyme activities of acid- and alkaline-phosphatases, esterase, esterase
    lipase, leucine arylamidase, trypsin, naphthol-AS-BI phosphohydrolase, and alpha-glucosidase
    are present when assayed with API ZYM system.
  notes: Park et al. treated trypsin as a positive API ZYM enzyme-activity phenotype
    in the Flexibacterium corallicola type species description.
canonical_examples:
- taxon_id: NCBITaxon:3037259
  taxon_label: Flexibacterium corallicola
  note: Park et al. reported Flexibacterium corallicola as positive for trypsin activity
    in the API ZYM enzyme activity panel.
  reference: DOI:10.1371/journal.pone.0322500
discussions:
- discussion_id: trypsin-activity-xref-gap
  prompt: Resolve an exact external ontology class for trypsin activity before adding
    a TraitRecord xref.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0004295 trypsin activity is obsolete, and its replacement GO:0004252
    denotes broader serine-type endopeptidase molecular function rather than the organism-level
    trypsin-like serine endopeptidase phenotype. GO:0004252 is appropriate as a causal-node
    grounding for generic serine endopeptidase activity, not as an equivalent TraitRecord
    xref.
  posed_by: codex
  posed_date: '2026-09-12'
- discussion_id: trypsin-activity-causal-graph-source-gap
  prompt: Add primary microbial literature evidence for microbial trypsin-like serine
    protease catalysis and physiological substrate cleavage before constructing causal_graphs.
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  attaches_to:
  - causal_graphs#trypsin_hydrolysis_sketch
  rationale: The current record pairs IUBMB EC 3.4.21.4 cleavage/vertebrate-pancreas
    snippets with an API ZYM diagnostic survey list (DOI:10.1371/journal.pone.0322500),
    lacking a second microbial mechanistic quote.
  posed_by: claude
  posed_date: '2026-10-23'
  evidence:
  - reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/4.html
    supports: PARTIAL
    snippet: '<b>Reaction:</b> Preferential cleavage: Arg<img src="../../../EZgif/FISS.GIF"
      align=top>, Lys<img src="../../../EZgif/FISS.GIF" align=top>'
    explanation: Existing record-level evidence supports the trait definition and
      diagnostic or organismal occurrence, but lacks multiple distinct pathway/enzyme
      quotes and strain-matched UniProtKB protein accessions needed for a connected
      causal graph.
  resolved_date: '2026-10-31'
  resolution_note: Added connected NONMECHANISTIC causal_graphs entry (trypsin_hydrolysis_sketch)
    anchored on existing verbatim record evidence snippets, and tracked the remaining
    strain-matched UniProtKB protein-example requirement in trypsin-activity-protein-example-gap.
- discussion_id: trypsin-activity-protein-example-gap
  prompt: Add strain-matched UniProtKB protein_examples for Streptomyces griseus trypsin
    SprT (UniProtKB:P00775) so trypsin_hydrolysis_sketch can be promoted from NONMECHANISTIC
    to MECHANISTIC.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#trypsin_hydrolysis_sketch
  rationale: The record's primary literature (EC 3.4.21.4, DOI:10.1371/journal.pone.0322500)
    establishes trypsin preferential endopeptidase cleavage at L-arginyl and L-lysyl
    peptide bonds and positive trypsin activity in Flexibacterium corallicola (NCBITaxon:3037259),
    but a strain-matched canonical example and verified UniProtKB accession on a GENE_OR_PROTEIN
    node must be curated before marking the graph MECHANISTIC.
  posed_by: claude
  posed_date: '2026-10-31'
  evidence:
  - reference: DOI:10.1371/journal.pone.0322500
    supports: PARTIAL
    snippet: Enzyme activities of acid- and alkaline-phosphatases, esterase, esterase
      lipase, leucine arylamidase, trypsin, naphthol-AS-BI phosphohydrolase, and alpha-glucosidase
      are present when assayed with API ZYM system.
    explanation: Existing record-level evidence supports the connected NONMECHANISTIC
      pathway/function graph but does not provide strain-matched UniProtKB protein
      accessions for protein_examples.
