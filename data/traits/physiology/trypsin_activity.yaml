    description: Peptidase S1A chymotrypsin/trypsin family extracellular serine endopeptidase
      (SprT; EC 3.4.21.4) that cleaves peptide and synthetic chromogenic ester or
      amide bonds on the carboxyl side of L-arginine or L-lysine residues.
    protein_examples:
