    predicate_id: METPO:2007402
  - subject: chemoautolithotrophic_trait
    predicate: distinct from
    object: chemoorganoheterotrophy
    description: Chemolithoautotrophy (inorganic energy, CO2 carbon) is metabolically
      distinct from chemo-organoheterotrophy (organic energy and carbon).
    evidence:
    - reference: DOI:10.3390/molecules29102293
      notes: Chemolithoautotrophy oxidizes inorganic compounds versus chemo-organoheterotrophs
        using glucose (Fukala & Kucera 2024).
