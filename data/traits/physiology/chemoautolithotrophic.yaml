identifier: METPO:1000634
label: chemoautolithotrophic
definition: A trophic type in which an organism uses chemical oxidation of inorganic
  compounds as the energy source and carbon dioxide as the primary carbon source for
  biosynthesis.
definition_source: DOI:10.1016/B978-0-12-378630-2.00219-X
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemoautolithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: oxidize inorganic atoms or molecules
  notes: Review supports inorganic compound oxidation as lithotrophic energy metabolism.
- reference: DOI:10.1128/AEM.02473-10
  snippet: autotrophic CO2 fixation
  notes: Minireview supports microbial carbon dioxide fixation pathways.
- reference: DOI:10.1146/annurev.micro.55.1.485
  snippet: Chemolitho-autotrophic ammonia-oxidizing bacteria
  notes: Review supports ammonia oxidation as a chemolithoautotrophic example.
canonical_examples:
