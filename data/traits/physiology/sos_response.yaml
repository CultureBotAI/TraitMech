  - node_id: lexa_autoproteolysis
    label: LexA autoproteolysis
    node_type: BIOLOGICAL_PROCESS
    description: RecA-stimulated autocleavage of the LexA SOS repressor.
  - node_id: sos_regulon_expression
    label: SOS regulon expression
    node_type: BIOLOGICAL_PROCESS
    description: Induced expression of LexA-repressed genes in the SOS regulon.
  - node_id: dna_repair_damage_tolerance
    label: DNA repair and damage tolerance
    node_type: BIOLOGICAL_PROCESS
    description: DNA-integrity, translesion-synthesis, mutagenesis, and division-delay
