discussions:
- discussion_id: sos-response-xref-gap
  prompt: Resolve exact ontology xrefs for organism-level microbial SOS response before
    adding TraitRecord xrefs.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0009432 SOS response exactly grounds biological-process nodes in causal
    graphs but is shifted from this organism-level response trait. RecA, LexA, SulA,
    translesion-polymerase, prophage-induction, DNA-repair, and DNA-damage terms describe
    narrower machinery, downstream processes, or related triggers rather than the
    whole microbial SOS-response phenotype.
  posed_by: codex
  posed_date: '2026-09-15'
