identifier: traitmech:000692
label: diatom seta production
definition: A biomineralization phenotype in which a diatom forms siliceous whisker-like
  cell-wall extensions called setae.
definition_source: DOI:10.1038/s41467-021-24944-6
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000690
evidence:
- reference: DOI:10.1038/s41467-021-24944-6
  snippet: A striking example for such long elements are whisker-like extensions,
    called setae, which characterize the genus Chaetoceros
  notes: Mayzel et al. 2021, PMID:34330922, PMC8324917, Introduction. Scientific Abstract,
    Introduction, Results, Discussion, Methods, main figure captions and Table 1 read
    in official Europe PMC full-text XML on 2026-10-10; actual Figures 2, 3 and 5
    inspected. Other actual figures, supplements and movies remain unread. EXT_ID:34330922
    AND SRC:MED confirmed the scientific abstract, ID, source, title and DOI. The
    quote identifies the structures; Results report seta formation in Chaetoceros
    tenuissimus under the source name. Figure 2 PDMPO labeling at growing tips supports
    new silica deposition, not only inherited appendage possession. Figure 3 resolves
    membrane, silica and an external organic layer; this supports a proposed extracellular
    route, not universal absence of a silica deposition vesicle. Figure 5 scores silicon
    limitation per cell, but germanium/PDMPO inhibition per valve; these denominators
    are not interchangeable. New valves still form under the germanium treatment,
    with altered texture, so valves are not claimed unaffected. No universal concentration
    threshold, growth rate or molecular necessity is inferred.
- reference: DOI:10.1016/j.jsb.2025.108205
  snippet: Here, we study a relatively large species, Chaetoceros rostratus, that
    forms long and intricate setae.
  notes: Safadi et al. 2025, PMID:40294667, online 2025-04-26, June issue. Complete
    scientific Abstract directly read in source-qualified Europe PMC CORE on 2026-10-10
    using EXT_ID:40294667 AND SRC:MED; one exact MED result with matching ID, title
    and DOI. The abstract reports in-cell cryo-electron tomography during seta formation
    in Chaetoceros rostratus under the source name and describes an organic sheath
    covering newly formed silica outside the plasma membrane. Structural macromolecules
    might regulate architecture; their necessity is not demonstrated by this abstract.
    Full Methods, actual figures and supplements were not inspected. This is a distinct
    primary study with overlapping authors, not independent-laboratory replication.
    No current taxon or strain provenance is assigned from the abstract alone.
discussions:
- discussion_id: diatom-seta-production-scope-and-mappings
  prompt: Keep seta formation distinct from possession and other silica endpoints.
  kind: CURATION_TODO
  status: OPEN
  rationale: 'Biomineralization traitmech:000690 is the broader phenotype: formation
    of these siliceous extensions entails mineral formation. A material seta, inherited
    appendage, silica uptake or adsorption is not this production phenotype. Valve/girdle
    formation (traitmech:000691), siliceous scales and auxospore coverings alone do
    not establish seta production, nor do setae alone establish those other endpoints.
    The existing frustule scope note already distinguishes setae; it is not an unresolved
    exact grounding. No organism-level disjointness, universal seta number, length,
    geometry, cell-cycle coupling, buoyancy or fitness effect is asserted. The extracellular
    route is not definitional. Exact synonyms and external phenotype mappings remain
    unasserted pending authority review; generic bristles, spines, silica processes
    and material structures are not automatically equivalent to this diatom phenotype.'
  posed_by: codex
  posed_date: '2026-10-10'
- discussion_id: diatom-seta-production-exemplars-and-mechanisms
  prompt: Resolve study-strain provenance and formation-specific causal evidence.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: No canonical examples are assigned before checking collection provenance
    and current taxonomy. The two studies support seta formation, but structural localization
    alone does not establish a conserved protein mechanism. Microtubule pushing, a
    guiding organic scaffold and a diffusion-based silicon route remain hypotheses
    in Mayzel et al.; unobserved vesicle transport is not proof of its absence. Separate
    mineral deposition, shape control and organic-sheath assembly when evaluating
    functional perturbations. Protein edges require direct causal evidence and taxon-paired
    accessions; sequence features alone are insufficient. Mechanism is deferred, not
    claimed absent.
  posed_by: codex
  posed_date: '2026-10-10'
