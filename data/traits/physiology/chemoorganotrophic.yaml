    node_type: ENVIRONMENTAL_FACTOR
    description: Inorganic alternative electron acceptors enabling anaerobic respiration.
  - node_id: acceptor_absence
    label: absence of external electron acceptor
    node_type: ENVIRONMENTAL_FACTOR
    description: Condition in which no external terminal electron acceptor is available.
  - node_id: fermentation
    label: fermentation
    node_type: BIOLOGICAL_PROCESS
    description: Energy metabolism with electrons relocated onto an organic catabolic
      product.
    grounding: GO:0006113
  - node_id: substrate_level_phosphorylation
    label: substrate-level phosphorylation
    node_type: BIOLOGICAL_PROCESS
    description: ATP generation by direct phosphate transfer from a phosphorylated
      intermediate.
  edges:
  - subject: chemoorganotrophic_trait
