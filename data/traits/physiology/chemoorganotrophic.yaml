  title: Chemoorganotrophic organic chemical oxidation
  description: DOI-backed graph for chemical oxidation of organic compounds, electron
    transfer to respiratory chains, proton motive force, ATP synthesis, and organic
    carbon assimilation.
  scope_status: MECHANISTIC
  scope_notes: This graph includes respiratory and fermentative alternatives. The
    E. coli K-12 AtpD example anchors only F-type ATP synthesis in the respiratory
    branch and is one beta component, not the complete rotary complex.
