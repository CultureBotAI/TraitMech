    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier formed by ATP synthase.
  - node_id: biomass
    label: biomass
    node_type: CHEMICAL
    description: Cell material built from organic carbon.
    grounding: METPO:1007501
  - node_id: reduced_cofactor
    label: reduced redox cofactor (NADH)
    node_type: CHEMICAL
    description: Reduced electron-carrying cofactor (e.g. NADH) formed during organic
      substrate oxidation.
  - node_id: quinone_pool
    label: quinone pool
    node_type: CHEMICAL
    description: Membrane ubiquinone/menaquinone pool that shuttles electrons within
      the respiratory chain.
  - node_id: aerobic_respiration
    label: aerobic respiration
    node_type: BIOLOGICAL_PROCESS
    description: Respiratory metabolism using oxygen as terminal electron acceptor.
