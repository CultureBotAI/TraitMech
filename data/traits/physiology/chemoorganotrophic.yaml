identifier: METPO:1000663
label: chemoorganotrophic
definition: A trophic type in which an organism obtains energy through chemical oxidation
  of organic compounds that also serve as the carbon source for biosynthesis.
definition_source: DOI:10.1016/B978-012373944-5.00083-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemoorganotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1016/B978-012373944-5.00083-3
  snippet: chemical energy
  notes: Encyclopedia chapter classifies chemotrophy by chemical rather than light
    energy sources.
- reference: DOI:10.1016/j.bbabio.2008.09.008
  snippet: membrane-bound electron transport chain
  notes: Review supports respiratory-chain energy conservation from redox reactions.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: "organic compounds as energy and carbon"
  reference: DOI:10.5772/intechopen.105508
- taxon_id: NCBITaxon:303
  taxon_label: Pseudomonas putida
  note: "versatile chemoorganotroph"
  reference: PMID:12534463
