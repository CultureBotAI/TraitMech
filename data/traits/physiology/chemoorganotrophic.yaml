      snippet: oxidation of a reduced ... organic compound
      notes: Supports dissimilatory oxidation of reduced organic compounds.
  - subject: substrate_oxidation
    predicate: feeds electrons into
    object: respiratory_chain
    description: Organic substrate oxidation supplies electrons to respiration.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: electron transfer process
      notes: Supports electron flow through respiratory chains.
    predicate_id: METPO:2007402
  - subject: respiratory_chain
    predicate: transfers electrons to
    object: terminal_electron_acceptor
    description: Respiration moves electrons to terminal electron acceptors.
    evidence:
    - reference: DOI:10.1128/mmbr.61.4.533-616.1997
      snippet: terminal electron acceptor
      notes: Supports terminal electron acceptors in respiratory metabolism.
    predicate_id: METPO:2007403
  - subject: respiratory_chain
    predicate: generates
    object: proton_motive_force
    description: Respiratory chains generate an electrochemical ion gradient.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: generation of an electrochemical ion gradient
      notes: Supports proton motive force generation from electron transport.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: drives production of
    object: atp
    description: Proton motive force drives ATP synthesis.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: drives ATP synthesis
      notes: Supports ATP production from respiratory energy conservation.
    predicate_id: biolink:produces
  - subject: organic_compound
    predicate: assimilated into
    object: biomass
    description: Organic compounds also supply carbon for biosynthesis.
    evidence:
    - reference: DOI:10.1016/B978-012373944-5.00083-3
      snippet: carbon source
      notes: Supports organic compounds as carbon sources for biosynthesis.
  - subject: substrate_oxidation
    predicate: produces reduced cofactor
    object: reduced_cofactor
    description: Organic substrate oxidation reduces redox cofactors such as NAD to
      NADH.
    evidence:
    - reference: DOI:10.1093/femsre/fuae016
      notes: Redox cofactors (NAD and ferredoxin) accept electrons and become reduced
        during organic oxidation.
  - subject: reduced_cofactor
    predicate: feeds electrons into
    object: quinone_pool
    description: Reduced cofactors donate electrons to the membrane quinone pool via
      dehydrogenases.
    evidence:
    - reference: DOI:10.1186/s13213-024-01761-y
      notes: Some dehydrogenases inject electrons into the quinone pool of the respiratory
        chain.
    predicate_id: METPO:2007402
  - subject: quinone_pool
    predicate: transfers electrons to
    object: terminal_electron_acceptor
    description: The quinone pool passes electrons to terminal oxidases reducing the
      terminal acceptor.
    evidence:
    - reference: DOI:10.1186/s13213-024-01761-y
      notes: Quinol oxidases pass electrons from ubiquinols/menaquinones to oxygen.
    predicate_id: METPO:2007403
  - subject: oxygen
    predicate: enables
    object: aerobic_respiration
    description: Presence of oxygen enables aerobic respiratory chemoorganotrophy.
    evidence:
    - reference: DOI:10.2166/9781789062304_0009
      notes: Electron acceptors range from O2 in aerobic respiration.
    predicate_id: RO:0002327
  - subject: nitrate_nitrite
    predicate: enables
    object: anaerobic_respiration
    description: Inorganic acceptors such as nitrate/nitrite enable anaerobic respiratory
      chemoorganotrophy.
    evidence:
    - reference: DOI:10.2166/9781789062304_0009
      notes: Organisms catabolize an organic e-donor by respiration with an inorganic
        e-acceptor such as nitrite or nitrate.
    predicate_id: RO:0002327
  - subject: acceptor_absence
    predicate: leads to
    object: fermentation
    description: Absence of an external terminal electron acceptor leads to fermentation.
    evidence:
    - reference: DOI:10.2166/9781789062304_0009
      notes: In fermentation, no terminal e-acceptor is available; electrons are relocated
        onto an organic catabolic product.
  - subject: fermentation
    predicate: generates ATP via
    object: substrate_level_phosphorylation
    description: Fermentation generates ATP primarily by substrate-level phosphorylation.
    evidence:
    - reference: DOI:10.1093/femsre/fuae016
      notes: In fermentation, ATP is generated primarily by substrate-level phosphorylation.
  - subject: substrate_level_phosphorylation
    predicate: has output
    object: atp
    description: Substrate-level phosphorylation directly produces ATP.
    evidence:
    - reference: DOI:10.1093/femsre/fuae016
      notes: Fermentative ATP is produced by substrate-level phosphorylation.
    predicate_id: RO:0002234
