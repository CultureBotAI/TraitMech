    grounding: GO:0022904
  - node_id: terminal_electron_acceptor
    label: terminal electron acceptor
    node_type: CHEMICAL
    description: Oxidized compound accepting electrons at the end of respiration.
    grounding: METPO:1007504
  - node_id: proton_motive_force
    label: proton motive force
