      notes: Supports ATP production from respiratory energy conservation.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: drives
    object: atp_synthase
    description: Proton motive force drives the F-type ATP synthase rotary mechanism.
    evidence:
    - reference: DOI:10.7554/eLife.21598
      snippet: proton motive force drives rotation and conformational changes in the
