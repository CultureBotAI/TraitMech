identifier: METPO:1000646
label: hydrogenotrophic
definition: A trophic type in which an organism uses molecular hydrogen as an electron
  donor for energy generation and carbon dioxide as the primary carbon source.
definition_source: DOI:10.21775/cimb.006.159
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
created_by: Luke Wang
evidence:
- reference: DOI:10.21775/cimb.006.159
  snippet: reversible oxidation of hydrogen gas
  notes: Review supports hydrogenase-catalyzed H2 oxidation and microbial energy metabolism.
- reference: DOI:10.1128/AEM.02473-10
  snippet: assimilation of CO2
  notes: Review supports CO2 assimilation into cellular carbon in autotrophic metabolism.
canonical_examples:
- taxon_id: NCBITaxon:106590
  taxon_label: Cupriavidus necator
  note: "aerobic H2 oxidiser (Knallgas)"
  reference: PMID:34723797
- taxon_id: NCBITaxon:2190
  taxon_label: Methanocaldococcus jannaschii
  note: "hydrogenotrophic methanogen"
  reference: PMID:31333590
