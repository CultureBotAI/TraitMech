identifier: METPO:1000635
label: chemoautotrophic
definition: A trophic type in which an organism obtains energy from oxidation of inorganic
  compounds and carbon from carbon dioxide.
definition_source: DOI:10.1146/annurev.micro.52.1.191
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemoautotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.52.1.191
  snippet: Carbon Dioxide Fixation in Chemoautotrophs
  notes: Review supports CO2 fixation as central to chemoautotrophic bacteria.
- reference: DOI:10.1128/AEM.02473-10
  snippet: Calvin-Benson reductive pentose phosphate cycle
  notes: Review supports Calvin-Benson and other microbial autotrophic CO2-fixation
    pathways.
