identifier: METPO:1000635
label: chemoautotrophic
definition: A trophic type in which an organism obtains energy from oxidation of inorganic
  compounds and carbon from carbon dioxide.
definition_source: DOI:10.1146/annurev.micro.52.1.191
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemoautotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.52.1.191
  snippet: Carbon Dioxide Fixation in Chemoautotrophs
  notes: Review supports CO2 fixation as central to chemoautotrophic bacteria.
- reference: DOI:10.1128/AEM.02473-10
  snippet: Calvin-Benson reductive pentose phosphate cycle
  notes: Review supports Calvin-Benson and other microbial autotrophic CO2-fixation
    pathways.
canonical_examples:
- taxon_id: NCBITaxon:228410
  taxon_label: Nitrosomonas europaea ATCC 19718
  note: ammonia-oxidizing obligate chemolithoautotroph
  reference: DOI:10.1128/AEM.00294-16
- taxon_id: NCBITaxon:292415
  taxon_label: Thiobacillus denitrificans ATCC 25259
  note: sulfur-oxidising chemoautotroph
  reference: DOI:10.1128/JB.188.4.1473-1488.2006
causal_graphs:
- graph_id: chemoautotrophic_chemical_energy_co2_fixation
  title: Chemoautotrophic chemical-energy CO2 fixation
  description: DOI-backed graph linking chemical electron donors, energy conservation,
    RuBisCO/Calvin-Benson carbon fixation, and biomass production.
  scope_status: MECHANISTIC
  scope_notes: This graph represents a modular chemoautotrophic mechanism; electron
    donors and carbon-concentrating systems vary across lineages. The N. europaea
    ATCC 19718 example specifically anchors the RuBisCO carbon-fixation branch.
  nodes:
  - node_id: chemoautotrophic_trait
    label: chemoautotrophic
    node_type: TRAIT
    grounding: METPO:1000635
    description: Trophic type using chemical energy and CO2 as carbon source.
  - node_id: reduced_inorganic_compound
    label: reduced inorganic compound
    node_type: CHEMICAL
    description: Chemical energy substrate oxidized by chemoautotrophs.
  - node_id: respiratory_energy_conservation
    label: respiratory energy conservation
    node_type: BIOLOGICAL_PROCESS
    description: Energy conservation from redox reactions.
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier used in carbon fixation.
  - node_id: nadph
    label: NADPH
    node_type: CHEMICAL
    description: Reducing equivalent used in reductive biosynthesis.
    grounding: CHEBI:16474
  - node_id: carbon_dioxide
    label: carbon dioxide
    node_type: CHEMICAL
    grounding: CHEBI:16526
    description: Inorganic carbon source.
  - node_id: calvin_benson_cycle
    label: Calvin-Benson cycle
    node_type: PATHWAY
    description: Common microbial CO2-fixation pathway.
    grounding: GO:0019253
  - node_id: rubisco
    label: RuBisCO
    node_type: GENE_OR_PROTEIN
    description: Carboxylating enzyme of the Calvin-Benson cycle.
    grounding: InterPro:IPR033966
    protein_examples:
    - uniprot_id: UniProtKB:Q82TG6
      protein_label: Ribulose bisphosphate carboxylase large chain
      gene_symbol: cbbL
      taxon_id: NCBITaxon:228410
      taxon_label: Nitrosomonas europaea ATCC 19718
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 120
      sequence_version: 1
      role: Large subunit of the type I RuBisCO that fixes CO2 through the CBB cycle
        in ammonia-oxidizing N. europaea ATCC 19718.
      evidence:
      - reference: DOI:10.1128/AEM.00294-16
        snippet: expression of the entire cbb gene cluster increased, with 7.4- and
          10.8-fold increases in numbers of genes encoding the small and large subunits
          of RuBisCO, cbbS (NE1920) and rbcL (NE1921)
        notes: The primary ATCC 19718 chemostat study identifies NE1921/rbcL and its
          carbon-fixation response; UniProtKB Q82TG6 is the reviewed NE1921 large-chain
          entry for that strain.
  - node_id: cellular_biomass
    label: cellular biomass
    node_type: BIOLOGICAL_PROCESS
    description: Cellular material produced from fixed carbon.
  - node_id: carboxysome
    label: carboxysome
    node_type: ORGANELLE
    description: Bacterial microcompartment that encapsulates RuBisCO and carbonic
      anhydrase to concentrate CO2.
    grounding: GO:0031470
  - node_id: carbonic_anhydrase
    label: carbonic anhydrase
    node_type: GENE_OR_PROTEIN
    description: Enzyme converting bicarbonate to CO2 inside the carboxysome to feed
      RuBisCO.
    grounding: InterPro:IPR001765
  - node_id: bicarbonate
    label: bicarbonate
    node_type: CHEMICAL
    description: Dissolved inorganic carbon species imported and converted to CO2
      for fixation.
    grounding: CHEBI:17544
  - node_id: dic_transporter
    label: dissolved inorganic carbon transporter
    node_type: GENE_OR_PROTEIN
    description: CO2/HCO3- transporters that supply inorganic carbon to the carbon-concentrating
      mechanism.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This functional node includes unrelated CO2 and bicarbonate transporter
      families; the graph does not identify one transporter class or membrane complex.
  - node_id: carbon_concentrating_mechanism
    label: carbon-concentrating mechanism
    node_type: BIOLOGICAL_PROCESS
    description: System of DIC transporters and carboxysomes that elevates CO2 around
      RuBisCO.
  - node_id: inorganic_carbon_assimilation
    label: inorganic carbon assimilation
    node_type: BIOLOGICAL_PROCESS
    description: Incorporation of inorganic carbon into cellular metabolites.
  - node_id: hp_hb_cycle
    label: 3-hydroxypropionate/4-hydroxybutyrate cycle
    node_type: PATHWAY
    description: Energy-efficient aerobic autotrophic CO2-fixation pathway.
