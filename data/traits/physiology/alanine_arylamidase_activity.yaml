identifier: traitmech:000161
label: alanine arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell exhibits alanine
  arylamidase/alanyl aminopeptidase activity, releasing N-terminal residues from peptide,
  amide, or arylamide substrates with preference for alanine.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/11/2.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: alanyl aminopeptidase
  synonym_type: RELATED_SYNONYM
  source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/11/2.html
- synonym_text: alanine aminopeptidase
  synonym_type: RELATED_SYNONYM
  source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/11/2.html
- synonym_text: L-alanine aminopeptidase
  synonym_type: RELATED_SYNONYM
  source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/11/2.html
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/11/2.html
  snippet: <b>Reaction:</b> Release of an N-terminal amino acid, Xaa<img src="../../../EZgif/FISS.GIF"
    align=top>Yaa- from a peptide, amide or arylamide. Xaa is preferably Ala, but
    may be most amino acids including Pro (slow action).
  notes: The NC-IUBMB EC 3.4.11.2 entry accepts membrane alanyl aminopeptidase and
    places the scissile-bond FISS.GIF image between Xaa and Yaa in a reaction line
    that includes arylamide substrates and preferential N-terminal alanine.
- reference: DOI:10.1099/ijsem.0.006017
  snippet: 'enzymatic activities are present for: α-galactosidase, N-acetyl-β-glucosaminidase,
    arginine arylamidase, proline arylamidase, leucyl glycine arylamidase, phenylalanine
    arylamidase, leucine arylamidase, tyrosine arylamidase, alanine arylamidase, glycine
    arylamidase, histidine arylamidase, glutamyl glutamic acid arylamidase, serine
    arylamidase, valine arylamidase, cysteine arylamidase, esterase, esterase lipase,
    alpha-chymotrypsin'
  notes: Srinivasan et al. listed alanine arylamidase among enzymatic activities present
    in the Amygdalobacter indicium species description, supporting the API arylamidase
    row as a bacterial enzyme-activity phenotype.
- reference: DOI:10.1074/jbc.m605203200
  snippet: Aminopeptidase N from Escherichia coli is a broad specificity zinc exopeptidase
    belonging to aminopeptidase clan MA, family M1. The structures of the ligand-free
    form and the enzyme-bestatin complex were determined at 1.5- and 1.6-A resolution,
    respectively.
  notes: Ito et al. determined the high-resolution crystal structure of Escherichia
    coli K-12 M1 zinc exopeptidase aminopeptidase N PepN (UniProtKB:P04825).
canonical_examples:
- taxon_id: NCBITaxon:3029272
  taxon_label: Amygdalobacter indicium
  note: Srinivasan et al. reported Amygdalobacter indicium as positive for alanine
    arylamidase activity in an enzyme activity panel.
  reference: DOI:10.1099/ijsem.0.006017
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Ito et al. determined the crystal structure of Escherichia coli K-12 broad-specificity
    M1 zinc exopeptidase aminopeptidase N (PepN) that hydrolyzes N-terminal L-alanyl
    and related aminoacyl bonds.
  reference: DOI:10.1074/jbc.m605203200
