evidence:
- reference: DOI:10.3389/fmicb.2019.00969
  snippet: unexpected and widespread presence of DNase secretion in bacteria in general
    and in MGP more specifically
  notes: Al-Wahaibi et al. assayed marine bacterial isolates for extracellular DNase
    secretion.
- reference: DOI:10.22207/JPAM.14.1.44
  snippet: screened for their capacity to produce DNA hydrolyzing activity on DNase
    test agar plate
  notes: Asha and Krishnaveni screened halophilic marine-sediment Bacillus-group isolates
    for DNA hydrolysis on DNase test agar.
