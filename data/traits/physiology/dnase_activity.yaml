identifier: traitmech:000138
label: DNase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  DNase enzymes that hydrolyze DNA.
definition_source: DOI:10.3389/fmicb.2019.00969
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
