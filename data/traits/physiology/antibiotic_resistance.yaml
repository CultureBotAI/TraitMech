identifier: traitmech:000088
label: antibiotic resistance
definition: A physiological capacity to grow in the presence of antibiotic concentrations
  that inhibit susceptible cells, mediated by efflux, target modification, drug inactivation,
  or reduced permeability.
definition_source: DOI:10.1038/nrmicro3380
