identifier: METPO:1000665
label: photolithoautotrophic
definition: A trophic type in which an organism obtains energy from light and carbon
  from carbon dioxide using inorganic electron donors.
definition_source: DOI:10.3389/fmicb.2011.00165
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: photolithoautotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.3389/fmicb.2011.00165
  snippet: oxidize sulfide
  notes: Review supports sulfide oxidation coupled to phototrophic central carbon
    and energy metabolism.
- reference: DOI:10.3390/antiox10060829
  snippet: reduced sulfur compounds as an electron donor
  notes: Review supports reduced sulfur electron donors in photolithotrophic sulfur
    bacteria.
- reference: DOI:10.1128/AEM.02473-10
  snippet: autotrophic CO2 fixation
  notes: Review supports CO2 fixation as the autotrophic carbon-assimilation process.
canonical_examples:
- taxon_id: NCBITaxon:32046
  taxon_label: Synechococcus elongatus
  note: water-splitting photolithoautotroph
  reference: PMID:21226929
- taxon_id: NCBITaxon:1097
  taxon_label: Chlorobaculum tepidum
  note: sulfide-using photolithoautotroph
  reference: PMID:12093901
