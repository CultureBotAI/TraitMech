      snippet: NAD(P)H and reduced ferredoxin
      notes: Supports generation of reducing equivalents.
    predicate_id: RO:0002234
  - subject: carbon_dioxide
    predicate: fixed by
    object: autotrophic_co2_fixation
    description: CO2 is fixed during autotrophic carbon assimilation.
    evidence:
    - reference: DOI:10.1128/AEM.02473-10
      snippet: autotrophic CO2 fixation
      notes: Supports CO2 fixation as the autotrophic carbon-assimilation process.
    predicate_id: METPO:2007404
  - subject: reducing_power
    predicate: enables
    object: autotrophic_co2_fixation
    description: Reductants generated by light-driven electron transport support CO2
      fixation.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: reducing equivalent flow during photoautotrophic
      notes: Supports reducing-equivalent flow in photoautotrophic growth.
    predicate_id: RO:0002327
  - subject: autotrophic_co2_fixation
    predicate: has output
    object: biomass
    description: Autotrophic CO2 fixation produces cellular carbon.
    evidence:
    - reference: DOI:10.1128/AEM.02473-10
      snippet: cellular carbon
      notes: Supports assimilation of CO2 into cellular carbon.
    predicate_id: RO:0002234
  - subject: photosynthetic_electron_transport
    predicate: generates
    object: nadph
    description: Photosynthetic electron transport generates NADPH as terminal reductant.
    evidence:
    - reference: DOI:10.1038/s44222-023-00093-x
      notes: Ferredoxin and FNR yield NADPH as the terminal reductant of phototrophic
        electron transport.
    predicate_id: biolink:produces
  - subject: carbonic_anhydrase
    predicate: interconverts
    object: bicarbonate
    description: Carbonic anhydrase interconverts CO2 and bicarbonate, accelerating
      DIC equilibration.
    evidence:
    - reference: DOI:10.1128/aem.01557-23
      notes: CA catalyzes CO2 <-> H2CO3 <-> HCO3- interconversion, accelerating DIC
        equilibration (general CCM mechanism).
  - subject: dic_transporter
    predicate: imports
    object: bicarbonate
    description: Inorganic carbon transporters import dissolved inorganic carbon species.
    evidence:
    - reference: DOI:10.1128/aem.01557-23
      notes: HCO3- uptake systems bridge environmental DIC supply to fixation demand.
    predicate_id: METPO:2007805
  - subject: rubisco
    predicate: catalyzes
    object: autotrophic_co2_fixation
    description: RuBisCO catalyzes the carboxylation step of autotrophic CO2 fixation.
    evidence:
    - reference: DOI:10.1128/aem.01557-23
      notes: RuBisCO is the key CO2-specific carboxylase for autotrophic CO2 fixation
        (broadly accepted).
    predicate_id: biolink:catalyzes
  - subject: reducing_power
    predicate: has part
    object: nadph
    description: NADPH is a concrete reductant constituting the reducing power for
      biosynthesis.
    evidence:
    - reference: DOI:10.1038/s44222-023-00093-x
      notes: NADPH is the terminal reductant tabulated as reducing equivalent for
        phototrophic biosynthesis.
