- timestamp: '2026-08-06T01:00:00Z'
  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 3 causal edge(s) off microbe-domain METPO predicates (1 to
    has energy source, 2 to has output), issue 301. The previous predicates are transitively
    rdfs:subPropertyOf METPO:2000001, whose rdfs:domain is METPO:1000525 (microbe),
    so a causal-graph subject entailed that the subject IS a microbe; CausalNodeTypeEnum
    has no organism member, so no such edge could ever satisfy the domain. Edge directions
    are unchanged - this pass only relabels and re-grounds. RO:0002234 (has output)
    is used where the subject is an activity, since biolink gives it the domain 'biological
    process or activity'; the METPO replacements are proposed in proposals/metpo_traitmech_v8
    and v9 and are placeholder ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-06T02:00:00Z'
