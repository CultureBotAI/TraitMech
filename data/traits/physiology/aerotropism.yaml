identifier: traitmech:000601
label: aerotropism
definition: A phenotype in which polarized growth is directionally biased in response
  to a spatial oxygen concentration gradient.
definition_source: DOI:10.1007/BF02464003
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000597
evidence:
- reference: DOI:10.1007/BF02464003
  notes: 'Aoki et al. (1998), publisher page at https://www.sciencedirect.com/science/article/abs/pii/S1340354098709003.
    Crossref and the Elsevier API confirmed bibliographic metadata only; direct publisher
    retrieval returned 403. Interpretation is search-index-limited: indexed publisher
    text reports Candida albicans hyphal reorientation in thin-layer corn-meal agar
    and growth toward an oxygen-rich capillary meniscus, interpreted as positive aerotropism.
    The source wording, full text and figures were not directly verified, so no snippet
    is asserted (#1678). This citation supports the oxygen-directed growth interpretation
    provisionally, not a resolved oxygen receptor. Reorientation is distinct from
    growth rate; oxygen-dependent growth and other local gradients remain confounds.'
- reference: DOI:10.1016/S0007-1536(88)80071-8
  notes: 'Carlile and Tew (1988), publisher page at https://www.sciencedirect.com/science/article/abs/pii/S0007153688800718.
    Crossref and the Elsevier API confirmed bibliographic metadata only; direct publisher
    retrieval returned 403. Interpretation is search-index-limited: indexed publisher
    text reports negative aerotropism in Phytophthora citricola germ tubes and no
    response to casein hydrolysate. The existence and wording of an original abstract
    were not directly verified, so no snippet is asserted (#1678). Full text, figures,
    strain identity and gradient controls remain unverified. This citation supports
    retaining avoidance within the proposed class, not a universal oxygen-attraction
    rule or an absence of responses to all other chemical gradients.'
- reference: DOI:10.1016/S0168-6496(03)00161-2
  snippet: Conidia also germinated close to air-filled Teflon tubes and exhibited
    germ-tube tropism, but not as distinctly as on living reed roots.
  notes: 'Abstract, exact-matched at Europe PMC (PMID:19719598). Publisher HTML methods,
    results and discussion were read at https://academic.oup.com/femsec/article/45/3/293/549782.
    Section 3.2 reports Microdochium bolleyi germ-tube orientation toward air-filled
    Teflon root dummies (60% +/- 12%) and stronger orientation toward living roots.
    This is qualified supporting evidence: oxygen-dependent germination and root-derived
    chemicals complicate attribution, and the tube result alone does not establish
    significance against random orientation. Figure 3 measures germination, not orientation.
    Figures were not visually verified. No strain accession or molecular mechanism
    is asserted.'
discussions:
- discussion_id: aerotropism-direction-and-stimulus-boundaries
  prompt: Keep oxygen-directed growth distinct from oxygen demand, taxis and flow.
  kind: CURATION_TODO
  status: OPEN
  rationale: The class includes positive or negative directional growth, without requiring
    both in one organism. Aerotaxis denotes locomotion, not growth orientation. Oxygen
    tolerance, oxygen requirement, biomass, germination and extension rate alone are
    insufficient. This record uses the oxygen-gradient sense of aerotropism in its
    primary sources; air-flow-directed growth belongs to rheotropism, not this class
    solely because air supplies oxygen. Resolve external phenotype mappings and variant-label
    scopes before adding xrefs or synonyms. The local parent is chemotropism (traitmech:000597);
    its v474 METPO:1055100 proposal is not released. The v478 proposal therefore uses
    the existing METPO:1000059 phenotype parent; reconcile the narrower hierarchy
    when chemotropism is accepted.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: aerotropism-controls-and-native-mechanism
  prompt: Resolve gradient controls, strain provenance and native causal mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: Inspect the older full texts and orientation readouts, and discriminate
    tip reorientation from preferential growth or survival in oxygen-rich regions.
    Resolve natural strain provenance and NCBI identity before canonical examples.
    The current evidence does not establish a universal oxygen sensor or a taxon-independent
    protein mechanism. Do not transfer pheromone chemotropism or aerotaxis mechanisms
    without direct evidence. Defer causal graphs until native causal evidence and
    taxon-paired protein accessions support them; NONMECHANISTIC is not a grounding
    bypass.
  posed_by: codex
  posed_date: '2026-10-04'
