identifier: traitmech:000730
label: stalk contraction
definition: A physiological phenotype in which a microbial cell actively reduces the
  end-to-end extension of its stalk.
definition_source: DOI:10.2142/biophysics.8.1
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000729
evidence:
- reference: DOI:10.2142/biophysics.8.1
  snippet: The stalk is straight at the initial stage. Then, it bends and coils into
    a helix near the zooid.
  notes: Kamiguri et al. 2012, PMID:27857602, PMCID:PMC5070450, printed page 3, Results
    and Discussion first paragraph, left column. Direct contiguous PDF match with
    whitespace-only line-wrap normalization and actual typeset passage inspected;
    native NOT_IN_ABSTRACT retained. Junko Kamiguri is the first author; the running
    header says Hashimoto et al. Living source-named Vorticella sp. from activated
    sludge attached to glass rods was stimulated by hitting the dish; eight cells
    were observed at 6000 frames/s. Figures 3 and 5 show coiling and decreased end-to-end
    extension. The same paragraph says contour length does not change. All nine main-paper
    pages were inspected; raw videos were not reanalyzed. Model fits are not molecular
    proof. The primary PDF came from J-STAGE; an acquisition-helper failure left no
    original request timestamp or header receipt. Those missing fields are not reconstructed.
    Current taxonomic and culture identities remain unresolved.
- reference: DOI:10.1016/j.bpj.2012.07.038
  snippet: The stalk contraction was stalled more as the fluid viscosity and/or flow
    rate increased.
  notes: Ryu et al. 2012, PMID:23009835, PMCID:PMC3433611, printed page 862, Figure
    2A caption, sentence beginning The stalk contraction. Direct contiguous PDF match
    and actual typeset passage inspected; native NOT_IN_ABSTRACT retained. The primary
    PDF was retrieved from the Vanderbilt Lang Lab mirror. Source-named Vorticella
    convallaria contracted in microfluidic channels under varied flow and viscosity.
    Four to five contractions per cell per condition are not independent cells. Figure
    3 uses six cells; Figure 4C uses fifteen in a separate analysis. Isometric force
    is extrapolated through a hydrodynamic model, not directly measured zero-shortening
    force. All eight main-paper pages and actual Figures 1-5 were inspected; the supplement
    was not. Projection and geometry assumptions remain relevant. Some extracted micrometre
    symbols appear as mm; no such numeric extraction is quoted. Culture/taxonomy correspondence
    is unresolved. No universal rate, force, calcium threshold, ATP independence or
    protein mechanism follows.
discussions:
- discussion_id: stalk-contraction-scope-and-parent
  prompt: Review the stalk-extension endpoint and its projection-contraction parent.
  kind: CURATION_TODO
  status: OPEN
  rationale: The measured endpoint is reduced end-to-end stalk extension, not necessarily
    reduced contour length. Coiling is observed, not a universal geometric requirement.
    Require active cellular contraction; static stalk morphology, reduced developmental
    growth, passive bending, detachment and isometric force alone do not establish
    it. Stalk-induced body displacement is not cell-body contraction traitmech:000728,
    and the endpoint differs from rapid axopodial contraction traitmech:000682. The
    direct parent is cell body or cytoplasmic projection contraction traitmech:000729,
    by definition-based inference. Amos's publisher abstract places the spasmoneme
    within cytoplasm and a sheath. The stalk is composite; its whole sheath is not
    asserted to be cytoplasm. Neither locomotion nor a universal ATP-driven motor
    is required by this parent choice. No exact synonym or organism-level disjointness
    is asserted.
  evidence:
  - reference: DOI:10.1038/229127a0
    reference_title: Reversible Mechanochemical Cycle in the Contraction of Vorticella
    supports: NO_EVIDENCE
    evidence_source: abstract
    snippet: The coiling is produced by the contraction of an intracytoplasmic thread,
      the spasmoneme, within a cylindrical sheath.
    explanation: Anatomical background for interpreting the parent, not an additional
      inspected experimental result or counted trait support. The curated hierarchy
      is an inference, not an ontology assertion made by this paper.
    notes: 'Amos 1971, publisher Abstract second sentence, #Abs1-content. Direct issuing-publisher
      HTML match; DOI/title/author metadata checked. Native UNRESOLVED retained, not
      relabeled VERIFIED or unindexed. Full article and historical experiments were
      not inspected. No comprehensive notice clearance is claimed.'
  posed_by: codex
  posed_date: '2026-10-15'
- discussion_id: stalk-contraction-metpo-assessment
  prompt: Review the proposed stalk-contraction class without reviving obsolete morphology.
  kind: CURATION_TODO
  status: OPEN
  rationale: Pinned and inspected current METPO release/editor/template owners contain
    no active exact contraction class in the bounded assessment. METPO:1000288 obsolete
    stalk is deprecated, under ObsoleteClass, with OMO:0001000 as its recorded reason
    and no replacement or consider annotation observed. It is a historical morphology
    label, not an active exact contraction phenotype; neither revive it nor put it
    in xrefs. The reason code alone does not invalidate the biology. v606 reserves
    METPO:1068300 in block 1068300-1068399 and repeats the unchanged v605 parent declaration
    METPO:1068200 so the standalone proposal emits the actual parent hierarchy. Historical
    v605 and the ontology pin remain unchanged. No external equivalence or SSSOM mapping
    is accepted; upstream adoption and human sign-off remain open.
  posed_by: codex
  posed_date: '2026-10-15'
- discussion_id: stalk-contraction-provenance-and-mechanism
  prompt: Resolve source isolates and endpoint-specific mechanisms before adding taxa
    or proteins.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Keep study organism names as qualified observations until culture provenance
    and current taxonomic identities are independently verified. Two distinct experimental
    papers support the endpoint; Part II of the Kamiguri study is not counted as independent
    replication. Preserve stimulus, load, viscosity, cell state, geometry, sampling
    and temporal resolution when comparing assays. Do not generalize calcium-wave
    models, spasmoneme chemistry, force estimates or energy claims to all microbial
    stalks. Protein sequence features alone cannot establish this phenotype. A protein-resolved
    causal graph needs authority-checked taxon-paired accessions and edge-specific
    experimental support. Mechanism is deferred, not asserted absent. MED/Crossref
    notice-field and limited publisher checks are not comprehensive correction/retraction
    clearance; failed retrievals and uninspected supplements remain explicit source-access
    limits.
  posed_by: codex
  posed_date: '2026-10-15'
