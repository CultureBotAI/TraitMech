identifier: traitmech:000704
label: diauxic growth
definition: A physiological phenotype in which a microbial population exhibits two
  successive growth phases associated with a switch from preferential use of one nutrient
  source to use of another as the first becomes limiting.
definition_source: DOI:10.1371/journal.pone.0061686
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
