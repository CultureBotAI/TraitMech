identifier: METPO:1000649
label: lithotrophic
definition: A trophic type in which an organism uses inorganic compounds as electron
  donors for energy generation.
definition_source: DOI:10.1016/B978-0-12-378630-2.00219-X
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: TT_lithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: lithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: oxidize inorganic atoms or molecules
  notes: Encyclopedia review supports inorganic compounds as growth-supporting reductants
    and energy sources.
- reference: DOI:10.1016/j.bbabio.2008.09.008
  snippet: generation of an electrochemical ion gradient
  notes: Review supports respiratory energy conservation through ion gradients and
    ATP synthesis.
canonical_examples:
- taxon_id: NCBITaxon:920
  taxon_label: Acidithiobacillus ferrooxidans
  note: iron/sulfur lithotroph
  reference: PMID:19077236
- taxon_id: NCBITaxon:915
  taxon_label: Nitrosomonas europaea
  note: ammonia lithotroph
  reference: DOI:10.1128/jb.185.9.2759-2773.2003
- taxon_id: NCBITaxon:228410
  taxon_label: Nitrosomonas europaea ATCC 19718
  note: Strain-level ammonia lithotroph paired to the AmoA alpha component of ammonia
    monooxygenase.
  reference: DOI:10.1128/jb.175.8.2436-2444.1993
causal_graphs:
- graph_id: lithotrophic_inorganic_donor_energy
  title: Lithotrophic inorganic-donor energy mechanism
  description: DOI-backed graph linking inorganic electron donors to respiratory electron
    transport, proton motive force, and ATP synthesis.
  scope_status: MECHANISTIC
  scope_notes: This cross-donor graph combines hydrogen, sulfur, ammonia, and nitrite
    oxidation. The N. europaea AmoA example anchors only the ammonia branch; Q04507
    is an alpha-subunit component of a multisubunit ammonia monooxygenase and not
    the complete enzyme or any other donor-oxidation system.
  nodes:
  - node_id: lithotrophic_trait
    label: lithotrophic
    node_type: TRAIT
    grounding: METPO:1000649
    description: Trophic type using inorganic electron donors for energy generation.
  - node_id: inorganic_electron_donor
    label: inorganic electron donor
    node_type: CHEMICAL
    description: Reduced inorganic compound used as a source of electrons.
    grounding: METPO:1007502
  - node_id: hydrogen
    label: molecular hydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
    description: Example inorganic electron donor.
  - node_id: reduced_sulfur_compound
    label: reduced sulfur compound
    node_type: CHEMICAL
    description: Example inorganic electron donor class.
  - node_id: membrane_electron_transport_chain
    label: membrane electron transport chain
    node_type: PATHWAY
    description: Redox chain coupling electron flow to ion translocation.
    grounding: GO:0022900
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Electrochemical ion gradient used for energy conservation.
    grounding: METPO:1007500
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier produced from respiratory energy conservation.
  - node_id: thiosulfate
    label: thiosulfate
    node_type: CHEMICAL
    description: Reduced inorganic sulfur compound used as a lithotrophic electron
      donor.
    grounding: CHEBI:16094
  - node_id: sox_multienzyme_system
    label: Sox multienzyme system
    node_type: GENE_OR_PROTEIN
    description: Periplasmic thiosulfate-oxidizing multienzyme complex (soxXA/soxYZ/soxB/soxCD).
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Sox denotes a variable pathway assembled from multiple distinct
      protein families and complexes; no one protein-family term represents the complete
      generic system used by this graph.
  - node_id: sulfite
    label: sulfite
    node_type: CHEMICAL
    description: Inorganic sulfur intermediate oxidized to sulfate during sulfur lithotrophy.
  - node_id: soeabc_sulfite_dehydrogenase
    label: SoeABC sulfite dehydrogenase
    node_type: GENE_OR_PROTEIN
    description: Membrane-bound sulfite dehydrogenase oxidizing sulfite to sulfate.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: SoeABC is a multisubunit membrane complex; the graph and cited
      review do not isolate one subunit family as the generic node.
  - node_id: ammonia
    label: ammonia
    node_type: CHEMICAL
    description: Inorganic nitrogen electron donor for ammonia-oxidizing lithotrophs.
    grounding: CHEBI:16134
  - node_id: ammonia_monooxygenase
    label: ammonia monooxygenase (AMO)
    node_type: GENE_OR_PROTEIN
    description: Enzyme catalyzing the first step of ammonia oxidation (EC 1.14.99.39).
    grounding: GO:0018597
    protein_examples:
    - uniprot_id: UniProtKB:Q04507
      protein_label: Ammonia monooxygenase alpha subunit
      gene_symbol: amoA1
      taxon_id: NCBITaxon:228410
      taxon_label: Nitrosomonas europaea ATCC 19718
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 126
      sequence_version: 2
      role: AmoA alpha-subunit component of the N. europaea ammonia monooxygenase;
        the accession maps two duplicated amoA gene copies and is not the whole enzyme
        complex.
      evidence:
      - reference: DOI:10.1128/jb.175.8.2436-2444.1993
        snippet: Sequence of the gene coding for ammonia monooxygenase in Nitrosomonas
          europaea
        notes: The primary strain-level study characterizes N. europaea AmoA and ammonia
          oxidation; UniProtKB Q04507 is the reviewed alpha-subunit entry.
  - node_id: hydroxylamine
    label: hydroxylamine
    node_type: CHEMICAL
    description: Intermediate of ammonia oxidation.
    grounding: CHEBI:15429
  - node_id: hydroxylamine_oxidoreductase
    label: hydroxylamine oxidoreductase (HAO)
    node_type: GENE_OR_PROTEIN
    description: Enzyme oxidizing hydroxylamine during ammonia oxidation (EC 1.7.2.6).
    grounding: GO:0033740
  - node_id: nitrite
    label: nitrite
    node_type: CHEMICAL
    description: Inorganic nitrogen electron donor for nitrite-oxidizing lithotrophs.
    grounding: CHEBI:16301
  - node_id: nitrite_oxidoreductase
    label: nitrite oxidoreductase (NXR)
    node_type: GENE_OR_PROTEIN
    description: Enzyme oxidizing nitrite to nitrate (EC 1.7.5.1).
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: NXR is a multisubunit molybdoenzyme whose architecture and component
      families vary across nitrite oxidizers; this generic node does not identify
      a single exact subunit or whole-complex term.
  - node_id: molecular_oxygen
    label: molecular oxygen
    node_type: CHEMICAL
    description: Terminal electron acceptor for aerobic lithotrophic oxidation.
    grounding: CHEBI:15379
  - node_id: sulfur_oxidation_process
    label: sulfur oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Oxidation of reduced sulfur compounds for energy conservation.
    grounding: GO:0019417
  edges:
  - subject: lithotrophic_trait
    predicate: has electron donor
    object: inorganic_electron_donor
    description: Inorganic compounds serve as the electron donors lithotrophic organisms
      use.
    evidence:
    - reference: DOI:10.1016/B978-0-12-378630-2.00219-X
      snippet: inorganic atoms or molecules as a growth-supporting reductant
      notes: Supports inorganic electron donors as the defining lithotrophic substrate
        class.
    predicate_id: METPO:2007701
  - subject: hydrogen
    predicate: example of
    object: inorganic_electron_donor
    description: Molecular hydrogen is a representative inorganic electron donor.
    evidence:
    - reference: DOI:10.21775/cimb.006.159
      snippet: oxidation of hydrogen gas
      notes: Supports hydrogen gas as a microbial inorganic electron donor.
    predicate_id: rdfs:subClassOf
  - subject: reduced_sulfur_compound
    predicate: example of
    object: inorganic_electron_donor
    description: Reduced sulfur compounds are representative lithotrophic electron
      donors.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2009.00187.x
      snippet: lithotrophic sulfur oxidation
      notes: Supports sulfur oxidation as a lithotrophic process.
    predicate_id: rdfs:subClassOf
  - subject: inorganic_electron_donor
    predicate: donates electrons to
    object: membrane_electron_transport_chain
    description: Electrons from inorganic donors enter respiratory electron transport.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: membrane-bound electron transport chain
      notes: Supports membrane-bound redox chains as energy-conserving electron-transfer
        systems.
    predicate_id: METPO:2007403
  - subject: membrane_electron_transport_chain
    predicate: generates
    object: proton_motive_force
    description: Respiratory redox reactions are conserved as an electrochemical ion
      gradient.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: generation of an electrochemical ion gradient
      notes: Supports proton motive force generation by respiratory electron transport.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: drives synthesis of
    object: atp
    description: Proton motive force drives ATP synthesis.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: gradient ... drives ATP synthesis
      notes: Supports ATP production from the respiratory ion gradient.
    predicate_id: biolink:produces
  - subject: thiosulfate
    predicate: oxidized by
    object: sox_multienzyme_system
    description: Thiosulfate is oxidized by the periplasmic Sox multienzyme system.
    evidence:
    - reference: DOI:10.3390/microorganisms11061436
      notes: 'Review: "The Sox multienzyme system... performs periplasmic thiosulfate
        oxidation."'
  - subject: sulfite
    predicate: oxidized by
    object: soeabc_sulfite_dehydrogenase
    description: Sulfite is oxidized to sulfate by membrane-bound SoeABC sulfite dehydrogenase.
    evidence:
    - reference: DOI:10.3390/microorganisms11061436
      notes: 'Review: "Sulfite produced is oxidized to sulfate by membrane-bound SoeABC."'
  - subject: ammonia
    predicate: oxidized by
    object: ammonia_monooxygenase
    description: Ammonia is oxidized by ammonia monooxygenase (AMO) in ammonia-oxidizing
      lithotrophs.
    evidence:
    - reference: DOI:10.1186/s40168-025-02290-9
      notes: Key NH4+ oxidation enzymes including ammonia monooxygenase (AMO); canonical
        enzyme role.
  - subject: hydroxylamine
    predicate: oxidized by
    object: hydroxylamine_oxidoreductase
    description: Hydroxylamine is oxidized by hydroxylamine oxidoreductase (HAO).
    evidence:
    - reference: DOI:10.1186/s40168-025-02290-9
      notes: Key NH4+ oxidation enzymes including hydroxylamine oxidoreductase (HAO).
  - subject: nitrite
    predicate: oxidized by
    object: nitrite_oxidoreductase
    description: Nitrite is oxidized to nitrate by nitrite oxidoreductase (NXR).
    evidence:
    - reference: DOI:10.1128/mbio.00749-25
      notes: Nitrite further oxidized to nitrate by a nitrite oxidoreductase gene
        (nxr).
  - subject: molecular_oxygen
    predicate: serves as terminal acceptor for
    object: sulfur_oxidation_process
    description: Molecular oxygen serves as a terminal electron acceptor for aerobic
      sulfur oxidation.
    evidence:
    - reference: DOI:10.1038/s41579-024-01104-3
      notes: Sulfur oxidation susceptible to oxidation by electron acceptors; aerobic
        sulfur oxidation contexts.
  - subject: sox_multienzyme_system
    predicate: participates in
    object: sulfur_oxidation_process
    description: The Sox multienzyme system is a prominent pathway for oxidation of
      reduced sulfur compounds.
    evidence:
    - reference: DOI:10.3390/microorganisms11061436
      snippet: The Sox multienzyme complex, first described using the model organism
        Paracoccus panthotrophus, is widespread in photo- and chemotrophic sulfur-oxidizing
        bacteria and appears to be the most prominent sulfur oxidation system
      notes: The review identifies the multicomponent Sox system as a sulfur-oxidation
        pathway rather than a single enzyme.
    predicate_id: biolink:participates_in
  - subject: soeabc_sulfite_dehydrogenase
    predicate: participates in
    object: sulfur_oxidation_process
    description: Membrane-bound SoeABC participates in sulfur oxidation by oxidizing
      sulfite to sulfate.
    evidence:
    - reference: DOI:10.3390/microorganisms11061436
      snippet: sulfite, which is subsequently oxidized by the activity of the membrane-bound
        protein SoeABC (sulfite dehydrogenase) to sulfate
      notes: The review explicitly places SoeABC in the sulfite-to-sulfate step of
        sulfur oxidation.
    predicate_id: biolink:participates_in
  - subject: sox_multienzyme_system
    predicate: feeds electrons into
    object: membrane_electron_transport_chain
    description: Complete Sox-mediated thiosulfate oxidation supplies electrons to
      energy-conserving electron transport.
    evidence:
    - reference: DOI:10.3390/microorganisms11061436
      snippet: The yield of the respective reaction is 8 electrons/1 mol of thiosulfate
        for the electron transport systems
      notes: The review quantifies the electrons supplied by complete Sox thiosulfate
        oxidation to electron-transport systems.
    predicate_id: METPO:2007402
  - subject: ammonia_monooxygenase
    predicate: produces
    object: hydroxylamine
    description: In bacterial ammonia oxidation, ammonia monooxygenase converts ammonia
      to hydroxylamine.
    evidence:
    - reference: DOI:10.1128/jb.185.9.2759-2773.2003
      snippet: NH3 + O2 + 2H+ + 2e− → NH2OH + H2O
      notes: The primary N. europaea genome paper gives the AMO-catalyzed first reaction
        of ammonia oxidation explicitly.
    predicate_id: METPO:2007800
  - subject: hydroxylamine_oxidoreductase
    predicate: produces
    object: nitrite
    description: In the bacterial branch represented here, hydroxylamine oxidoreductase
      oxidizes hydroxylamine to nitrite.
    evidence:
    - reference: DOI:10.1128/jb.185.9.2759-2773.2003
      snippet: NH2OH + H2O → NO2− + 5H+ + 4e−
      notes: The primary N. europaea paper gives the HAO-associated second reaction;
        the graph scope does not project this bacterial route onto ammonia-oxidizing
        archaea.
    predicate_id: METPO:2007800
  - subject: hydroxylamine_oxidoreductase
    predicate: feeds electrons into
    object: membrane_electron_transport_chain
    description: Electrons released during hydroxylamine oxidation enter the respiratory
      electron-transport chain through cytochromes and ubiquinone.
    evidence:
    - reference: DOI:10.1128/jb.185.9.2759-2773.2003
      snippet: Electrons from hydroxylamine oxidation flow through cytochrome c554
        and cytochrome cm552 into the electron transport chain at the level of ubiquinone
      notes: The primary N. europaea study directly connects the HAO branch to membrane
        electron transport.
    predicate_id: METPO:2007402
