discussions:
- discussion_id: automixis-scope-and-hierarchy
  prompt: Preserve source-specific meanings of self-fertilization terms.
  kind: CURATION_TODO
  status: OPEN
  rationale: Mogie's broad reproductive class is not exclusively nuclear fusion or
    exclusively sexual reproduction. The operational autogamy traitmech:000622, cytogamy
    traitmech:000623 and paedogamy traitmech:000624 fit as narrower same-cell-origin
    routes; postmeiotic mitosis is allowed. Kaczmarska et al. DOI:10.1080/0269249X.2013.791344
    section 5.2 directly names autogamy and paedogamy as automixis in diatoms. This
    does not make all botanical autogamy equivalent. Cytogamy's existing 1979 evidence
    supports same-parent meiotic origin despite cell pairing; cytoplasmic exchange
    is not nuclear outcrossing. Same-clone mating after different meioses is insufficient.
    Fungal homothallism, heterothallism and intratetrad mating are not exact synonyms
    of this broad class. External equivalences and narrower non-fusion microbial exemplars
    remain unresolved.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: automixis-mechanism-and-coverage
  prompt: Resolve route-specific mechanisms without universal genetic claims.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: A reproductive phenotype, not a literal mating locus or sequence feature.
    No single protein pathway is established for all fusion and non-fusion routes,
    so no causal graph or protein accessions are asserted. Do not infer universal
    homozygosity, central fusion, absence of outcrossing, or disjoint taxa from event-level
    distinctions. Retain actual snippet-resolver outcomes separately from direct source
    checks.
  posed_by: codex
  posed_date: '2026-10-05'
