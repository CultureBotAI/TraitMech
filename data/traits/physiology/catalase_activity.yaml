identifier: traitmech:000075
label: catalase activity
definition: A physiological enzyme-activity phenotype in which a cell produces catalase,
  which decomposes hydrogen peroxide into water and oxygen; it is the basis of the
  diagnostic catalase test.
definition_source: DOI:10.1007/s00018-003-3206-5
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: catalase-positive
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1007/s00018-003-3206-5
evidence:
- reference: DOI:10.1007/s00018-003-3206-5
  notes: Chelikani, Fita & Loewen review the diversity of catalases, enzymes that
    dismutate hydrogen peroxide to water and oxygen.
- reference: DOI:10.1038/nrmicro3032
  notes: Imlay's oxidative-stress review supports catalase as a key hydrogen-peroxide
    scavenging defense.
canonical_examples:
- taxon_id: NCBITaxon:1280
  taxon_label: Staphylococcus aureus
  note: catalase-positive
  reference: PMID:17114262
- taxon_id: NCBITaxon:287
  taxon_label: Pseudomonas aeruginosa
  note: catalase-positive
  reference: PMID:15972537
- taxon_id: NCBITaxon:93061
  taxon_label: Staphylococcus aureus NCTC 8325
  note: Strain-level exemplar for PerR control of catalase and other peroxide-defense
    genes.
  reference: DOI:10.1128/iai.69.6.3744-3754.2001
causal_graphs:
- graph_id: catalase_activity_h2o2_detoxification
  title: Catalase hydrogen-peroxide detoxification
  description: Evidence-backed causal sketch linking catalase to dismutation of hydrogen
    peroxide into water and molecular oxygen.
  scope_status: MECHANISTIC
  scope_notes: Represents a monofunctional heme-catalase reaction and two alternative
    bacterial peroxide-sensing regulators. The PerR example supports the S. aureus
    regulatory branch and is not generalized to OxyR-using taxa.
  nodes:
  - node_id: catalase_activity_trait
    label: catalase activity
    node_type: TRAIT
    grounding: traitmech:000075
    description: Capacity to decompose hydrogen peroxide via catalase.
  - node_id: catalase
    label: monofunctional heme catalase
    node_type: GENE_OR_PROTEIN
    description: Monofunctional heme enzyme that dismutates hydrogen peroxide.
    grounding: InterPro:IPR018028
  - node_id: catalase_function
    label: catalase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0004096
    description: Catalysis of 2 H2O2 = O2 + 2 H2O.
  - node_id: hydrogen_peroxide
    label: hydrogen peroxide
    node_type: CHEMICAL
    grounding: CHEBI:16240
    description: Reactive oxygen species detoxified by catalase.
  - node_id: molecular_oxygen
    label: molecular oxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
    description: Product of hydrogen peroxide dismutation.
  - node_id: water
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
    description: Product of hydrogen peroxide dismutation.
  - node_id: oxyr_regulator
    label: OxyR
    node_type: GENE_OR_PROTEIN
    description: Peroxide-sensing transcriptional regulator activated by hydrogen
      peroxide.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: OxyR belongs to the broad LysR regulator family, but the checked
      InterPro entries describe shared domains rather than an exact OxyR protein family.
  - node_id: perr_regulator
    label: PerR
    node_type: GENE_OR_PROTEIN
    description: Fe-dependent peroxide-sensing transcriptional repressor inactivated
      by hydrogen peroxide.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: PerR belongs to the broader Fur family; IPR002481 is not specific
      enough to distinguish PerR from other Fur-family regulators, so the exact label
      is retained with an organism-paired protein example.
    protein_examples:
    - uniprot_id: UniProtKB:Q2G282
      protein_label: Peroxide-responsive repressor PerR
      gene_symbol: perR
      taxon_id: NCBITaxon:93061
      taxon_label: Staphylococcus aureus NCTC 8325
      entry_status: REVIEWED
      proteome_id: UP000008816
      retrieved_on: '2026-08-23'
      entry_version: 109
      sequence_version: 1
      role: Manganese-dependent peroxide-responsive repressor controlling katA and
        the wider oxidative-stress defense regulon in S. aureus.
      evidence:
      - reference: DOI:10.1128/iai.69.6.3744-3754.2001
        snippet: PerR controls oxidative stress resistance and iron storage proteins
        notes: The primary S. aureus study characterizes PerR regulation and links
          it to catalase/peroxide defense; UniProtKB Q2G282 verifies the reviewed
          NCTC 8325 protein instance.
  - node_id: peroxide_defense_systems
    label: peroxide defense systems
    node_type: BIOLOGICAL_PROCESS
    description: Antioxidant defense systems (e.g. catalases, peroxidases) that detoxify
      hydrogen peroxide.
  - node_id: heme_biosynthesis
    label: heme biosynthesis
    node_type: BIOLOGICAL_PROCESS
    description: Synthesis of the heme cofactor required for catalase maturation and
      activity.
    grounding: GO:0006783
  edges:
  - subject: catalase
    predicate: enables
    object: catalase_function
    description: Catalase carries out the catalase molecular function.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: Catalases are ubiquitous enzymes that prevent cell oxidative damage
        by degrading hydrogen peroxide
      notes: The primary mechanistic study identifies catalases as the enzymes carrying
        out hydrogen-peroxide degradation.
    predicate_id: RO:0002327
  - subject: catalase_function
    predicate: consumes
    object: hydrogen_peroxide
    description: The catalase reaction consumes hydrogen peroxide.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: degrading hydrogen peroxide to water and oxygen
      notes: Hydrogen peroxide is the substrate consumed in the catalatic reaction.
    predicate_id: biolink:consumes
  - subject: catalase_function
    predicate: has output
    object: molecular_oxygen
    description: The catalase reaction produces molecular oxygen.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: hydrogen peroxide to water and oxygen (2H2O2 → 2 H2O + O2)
      notes: The primary study gives molecular oxygen as a product of the balanced
        catalase reaction.
    predicate_id: RO:0002234
  - subject: catalase_function
    predicate: has output
    object: water
    description: The catalase reaction produces water.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: Catalases are ubiquitous enzymes that prevent cell oxidative damage
        by degrading hydrogen peroxide to water and oxygen
      notes: The primary study gives water as a product of the catalase reaction.
    predicate_id: RO:0002234
  - subject: catalase
    predicate: confers
    object: catalase_activity_trait
    description: Production of catalase confers the catalase-activity phenotype.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: Catalases are ubiquitous enzymes that prevent cell oxidative damage
        by degrading hydrogen peroxide to water and oxygen
      notes: The catalase protein's demonstrated reaction is the mechanistic basis
        of the catalase-activity trait.
    predicate_id: METPO:2007700
  - subject: catalase_activity_trait
    predicate: decomposes
    object: hydrogen_peroxide
    description: Catalase activity rapidly decomposes hydrogen peroxide into water
      and molecular oxygen.
    evidence:
    - reference: DOI:10.1021/ja9018572
      snippet: degrading hydrogen peroxide to water and oxygen (2H2O2 → 2 H2O + O2)
        with high efficiency
      notes: The primary mechanistic study directly supports efficient peroxide decomposition
        by catalase activity.
  - subject: hydrogen_peroxide
    predicate: activates
    object: oxyr_regulator
    description: Hydrogen peroxide activates the OxyR peroxide-sensing regulator.
    evidence:
    - reference: DOI:10.1073/pnas.96.11.6161
      snippet: In wild-type cells, OxyR is activated by hydrogen peroxide.
      notes: A primary E. coli study directly demonstrated peroxide-dependent OxyR
        activation; this regulatory branch is organism-specific rather than universal.
    predicate_id: RO:0002213
  - subject: hydrogen_peroxide
    predicate: favors scavenging by
    object: catalase_activity_trait
    description: High hydrogen peroxide concentrations favor scavenging by catalases,
      which turn over much faster than alkyl hydroperoxide reductase.
    evidence:
    - reference: DOI:10.1038/nrmicro3032
      snippet: Under these conditions, catalases, which do not require stoichiometric
        reductants, can turn over much more quickly than Ahp.
      notes: Organisms rely on catalases when H2O2 levels are high; catalases turn
        over much more quickly than Ahp. Likely general across aerobes/facultative
        anaerobes.
  - subject: oxyr_regulator
    predicate: regulates
    object: peroxide_defense_systems
    description: OxyR regulates peroxide defense systems; most bacteria sense H2O2
      via OxyR or PerR.
    evidence:
    - reference: DOI:10.3389/fimmu.2021.667343
      snippet: these regulators induce enzymes that reduce cytoplasmic H2O2 concentrations,
        decrease the intracellular iron pools, and repair the H2O2-mediated damage.
      notes: Most bacteria sense H2O2 via OxyR or PerR transcription factors that
        control peroxide defense systems.
    predicate_id: RO:0002211
  - subject: perr_regulator
    predicate: regulates
    object: peroxide_defense_systems
    description: PerR regulates peroxide defense systems; most bacteria sense H2O2
      via OxyR or PerR.
    evidence:
    - reference: DOI:10.3389/fimmu.2021.667343
      snippet: these regulators induce enzymes that reduce cytoplasmic H2O2 concentrations,
        decrease the intracellular iron pools, and repair the H2O2-mediated damage.
      notes: Most bacteria sense H2O2 via OxyR or PerR transcription factors that
        control peroxide defense systems.
    predicate_id: RO:0002211
  - subject: heme_biosynthesis
    predicate: supports activation of
    object: catalase
    description: Heme biosynthesis is required for catalase activation; impaired heme
      synthesis delays peroxide degradation.
    evidence:
    - reference: DOI:10.1111/mmi.12967
      snippet: the KatG-dependent peroxidase activity was elevated only 2.6-fold,
        suggesting that much of the enzyme lacked heme.
      notes: Ferrochelatase (hemH) function is required for timely induction of catalase
        (KatG) activity in E. coli; this edge is a taxon-specific supporting module.
