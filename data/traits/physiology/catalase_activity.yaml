identifier: traitmech:000075
label: catalase activity
definition: A physiological enzyme-activity phenotype in which a cell produces catalase,
  which decomposes hydrogen peroxide into water and oxygen; it is the basis of the
  diagnostic catalase test.
definition_source: DOI:10.1007/s00018-003-3206-5
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: catalase-positive
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1007/s00018-003-3206-5
evidence:
- reference: DOI:10.1007/s00018-003-3206-5
  notes: Chelikani, Fita & Loewen review the diversity of catalases, enzymes that
    dismutate hydrogen peroxide to water and oxygen.
- reference: DOI:10.1038/nrmicro3032
  notes: Imlay's oxidative-stress review supports catalase as a key hydrogen-peroxide
    scavenging defense.
