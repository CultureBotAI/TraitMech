identifier: METPO:1007089
label: coagulase activity
definition: A physiological enzyme-activity phenotype in which a cell produces coagulase
  factors that activate prothrombin and convert fibrinogen to fibrin, clotting blood
  plasma.
definition_source: DOI:10.1159/000333447
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: coagulase test
  synonym_type: EXACT_SYNONYM
  source: metpo.owl
- synonym_text: coagulase-positive
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1159/000333447
created_by: Marcin Joachimiak
evidence:
- reference: DOI:10.1159/000333447
  snippet: Clinical isolates of Staphylococcus aureus secrete coagulases, polypeptides
    that bind to and activate prothrombin
  notes: McAdow, Missiakas and Schneewind review how staphylococcal coagulases activate
    prothrombin, convert fibrinogen to fibrin, and clot plasma or blood.
- reference: DOI:10.1371/journal.ppat.1001036
  snippet: Coa and vWbp promote the non-proteolytic activation of prothrombin and
    cleavage of fibrinogen
  notes: Cheng et al. experimentally show that the two S. aureus coagulases, Coa and
    von Willebrand factor binding protein, mediate prothrombin and fibrinogen reactions
    relevant to staphylococcal clot formation.
canonical_examples:
- taxon_id: NCBITaxon:1280
  taxon_label: Staphylococcus aureus
  note: Canonical coagulase-positive bacterium that secretes Coa and vWbp.
  reference: DOI:10.1371/journal.ppat.1001036
