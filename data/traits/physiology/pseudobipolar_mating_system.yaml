identifier: traitmech:000617
label: pseudobipolar mating system
definition: A fungal mating-system phenotype in which pheromone/receptor and homeodomain
  compatibility loci are physically linked on the same chromosome but can recombine
  during meiosis, generating new mating-type combinations.
definition_source: DOI:10.1371/journal.pgen.1001052
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1371/journal.pgen.1001052
  snippet: occasional disruptions of the genetic cohesion of the bipolar MAT locus
    originate new mating types.
  notes: Coelho et al. (2010), PMID:20700437, PMC2916851. Exact clause in scientific
    abstract abstract1, checked against raw Europe PMC metadata and full-text XML,
    not the author summary. Results/Discussion and Methods were read, with actual
    Figures 3-5, Figure S5 and both pages of Table S1 inspected. Sporidiobolus salmonicolor
    CBS 6832 x ML 2241 yielded the recombinant T7.1, incompatible with either parent
    but compatible with CBS 490 in Figure 4. The scored endpoint is clamp-bearing
    mycelium and teliospores after four days on corn meal agar at 25 C; normal germination
    after compatible T7 crosses is reported in prose as results not shown. Eight teliospores
    came from one parental cross; colonies from a teliospore are mostly mitotic clones,
    and T8 was apparently diploid. The authors require larger samples for statistically
    significant linkage and precise recombination frequencies. Figure 5 partly assumes
    S. roseus synteny, not a complete S. salmonicolor chromosome assembly. Table S1
    and Figures 3/4 label CBS 6832 A2-15, whereas the germination and micromanipulation
    Methods say A2-6; strain identity is kept without silently reconciling that discrepancy.
    Table S1 gives CBS 6832 a clinical origin but only names ML 2241's isolator, so
    full parental provenance and active taxonomy remain unresolved. Other actual figures
    and supplements remain uninspected. This is native crossing evidence, not solely
    MAT sequence annotation or a precise population rate.
- reference: DOI:10.1371/journal.pbio.3003417
  snippet: In the pseudobipolar configuration, the P/R and HD loci remained on the
    same chromosome but genetically unlinked
  notes: Coelho et al. (2025), PMID:41042803, PMC12510652. Exact scientific-abstract
    clause checked against raw Europe PMC metadata, full-text XML and publisher HTML.
    Supports the broader same-chromosome, recombination-permitting usage, not an independent
    functional replication in Kwoniella europaea. Abstract, Introduction, first two
    Results subsections, the relevant Discussion paragraph in sec017 and actual Figure
    1 were read. Figure 1B classifies its breeding system as likely heterothallic;
    Figure 1E shows separated loci in PYCC6329. Despite the abstract's declarative
    wording, sec017 says crosses have not yielded sexual reproduction and treats persistent
    recombination as conditional. Physical distance alone does not exclude long-range
    recombination suppression. Its inferred configuration therefore does not establish
    observed mating or fertility. The C. decagattii and K. mangrovensis sexual results
    cannot be transferred to K. europaea. Other Results, Methods, figures and supplements
    remain uninspected.
discussions:
- discussion_id: pseudobipolar-mating-scope-and-hierarchy
  prompt: Keep physical linkage, genetic linkage and observed compatibility distinct.
  kind: CURATION_TODO
  status: OPEN
  rationale: The 2010 pseudo-bipolar usage emphasizes normally bipolar behavior with
    occasional recombination; the 2025 usage also covers widely separated, potentially
    genetically unlinked loci on one chromosome. The definition retains their shared
    recombination-permitting organization without requiring a fixed rate, partial
    linkage strength, or exactly two species-wide mating types. A genomic prediction
    must remain distinct from an observed mating phenotype. This is not a literal
    MAT locus or an individual gene record. It is not identical to traitmech:000616
    bipolar mating, which requires a single segregating factor, or traitmech:000615
    tetrapolar mating, which requires independent segregation without specifying chromosome
    colocation. The 2025 paper explicitly allows functional resemblance to tetrapolarity,
    so do not assert disjointness. Its heterothallic framing also does not prove universal
    separate-partner dependence under traitmech:000610. Use released phenotype METPO:1000059
    in record and proposal pending narrower hierarchy and lexical review; PHYSIOLOGY
    is a filesystem category.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: pseudobipolar-mating-evidence-and-mechanism
  prompt: Resolve strain provenance and native dependencies before adding examples
    or graphs.
  kind: CURATION_TODO
  status: OPEN
  rationale: Resolve the CBS 6832 allele-designation discrepancy and ML 2241's original
    isolation context before canonical examples, and verify current taxon authority.
    Laboratory recombinant T7.1 is not an independently sampled natural isolate. Distinguish
    crossovers from gene conversion and retain the eight-teliospore sampling limitation.
    Finish unread source sections, actual figures and supplements before more detailed
    claims. Never transfer the confirmed sexual cycle of one species to another species
    with a predicted MAT configuration. Resolve native protein accessions and experimentally
    tested dependencies before causal edges; no NONMECHANISTIC graph bypasses grounding.
    Manual source checks remain distinct from actual resolver verdicts.
  posed_by: codex
  posed_date: '2026-10-05'
