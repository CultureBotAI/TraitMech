identifier: traitmech:000173
label: glutamyl glutamic acid arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  glutamyl glutamic acid arylamidase enzymes that hydrolyze glutamyl-glutamic-acid
  arylamide substrates.
definition_source: DOI:10.1099/ijsem.0.006017
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: glutamyl glutamic acid arylamidase
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1099/ijsem.0.006017
evidence:
- reference: DOI:10.1099/ijsem.0.006017
  snippet: 'enzymatic activities are present for: α-galactosidase, N-acetyl-β-glucosaminidase,
    arginine arylamidase, proline arylamidase, leucyl glycine arylamidase, phenylalanine
    arylamidase, leucine arylamidase, tyrosine arylamidase, alanine arylamidase, glycine
    arylamidase, histidine arylamidase, glutamyl glutamic acid arylamidase, serine
    arylamidase, valine arylamidase, cysteine arylamidase, esterase, esterase lipase,
    alpha-chymotrypsin'
  notes: Srinivasan et al. listed glutamyl glutamic acid arylamidase among enzymatic
    activities present in the Amygdalobacter indicium species description, supporting
    the API arylamidase row as a directly assayed bacterial enzyme-activity phenotype.
- reference: DOI:10.1099/ijs.0.63642-0
  snippet: arginine arylamidase, leucyl glycine arylamidase, phenylalanine arylamidase,
    leucine arylamidase, tyrosine arylamidase, alanine arylamidase, glycine arylamidase,
    histidine arylamidase, glutamyl glutamic acid arylamidase and serine arylamidase
    are positive
  notes: Nichols et al. listed glutamyl glutamic acid arylamidase as positive in Olleya
    marilimosa strain CAM030T.
