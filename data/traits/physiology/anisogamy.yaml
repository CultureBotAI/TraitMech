identifier: traitmech:000620
label: anisogamy
definition: A sexual-reproduction phenotype in which the fusing gametes belong to
  two types that differ in size, with smaller male and larger female gametes.
definition_source: DOI:10.1038/s42003-018-0019-5
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1038/s42003-018-0019-5
  snippet: Male and female gametes differing in size—anisogamy—emerged independently
    from isogamous ancestors in various eukaryotic lineages
  notes: 'Hamaji et al. (2018), PMID:30271904, PMC6123790. Exact opening scientific-abstract
    clause checked in raw XML, not the separate editorial summary. Size dimorphism
    defines the phenotype; evolutionary origin is not part of this definition. Main
    text, Methods and captions were read and actual Figure 3 inspected: Eudorina gametes
    provide independent phenotype observations. Comparative MT architecture and RT-PCR
    expression do not demonstrate a gamete-size causal pathway. Results associate
    genomes with NIES-4100/4018, whereas Methods name NIES-3985/3984 for sequencing
    and the former sibling strains for other experiments. This unresolved discrepancy
    prevents strain-to-assembly inference here. Other actual figures and supplements
    remain unread.'
- reference: DOI:10.1186/1471-2148-14-37
  snippet: Obligately anisogamous conjugation between male and female motile gametes
    occurred outside the female colony (external fertilization during anisogamy).
  notes: Nozaki et al. (2014), PMID:24589311, PMC4015742. Exact scientific-abstract
    Results sentence verified in raw XML. Main text and captions, actual Figure 3,
    and Additional file 2 Information S1/Table S1 were inspected. Sexual reproduction
    was observed in C. charkowiensis, not C. angeleri. Male length was 5-10 micrometers;
    female diameter 13-17 micrometers. These different measurements do not establish
    a volume ratio. Other actual figures, Additional file 1 and the remainder of Additional
    file 2 remain uninspected. Proposed evolutionary intermediacy is not demonstrated
    ancestry.
- reference: DOI:10.1186/s12915-024-01878-1
  snippet: Oogamy constitutes a specialized form of anisogamy wherein small male gametes
    are motile and large female gametes are not
  notes: Lindsey et al. (2024), PMID:38600528, PMC11007952. Exact Background Sec1
    clause before the parenthetical, checked in raw XML and publisher HTML. This supports
    broad terminology including oogamy, not a new gamete-fusion experiment. The scientific
    abstract and this scope paragraph were inspected; remaining analyses, actual figures
    and supplements were not audited. The quoted motility formulation is not imposed
    on all microbial anisogamy.
- reference: DOI:10.1371/journal.pone.0181413
  snippet: physiological and behavioural anisogamy of more or less equal size gametes,
    each with sex-specific behaviour and morphology
  notes: Kaczmarska et al. (2017), Discussion > Sexual reproduction and life history.
    This exact contiguous clause was checked in publisher HTML and manuscript XML.
    It documents alternative diatom terminology, not evidence that equal-sized gametes
    satisfy this record's size-dimorphism definition. That Discussion passage and
    the opening live-cell Results paragraphs were inspected; the latter describe sex-dependent
    motility. Remaining Results, actual figures, tables and supplements were not audited.
    No diatom canonical example or size measurement is inferred.
canonical_examples:
- taxon_id: NCBITaxon:51706
  taxon_label: Colemanosphaera charkowiensis
  reference: DOI:10.1186/1471-2148-14-37
  note: Source-observed reference example, not a claim about every strain. Figure
    3 shows mixed 2013-0615-IC-3/4/7 cultures and male 2010-0713-E5; mating generally
    occurred after two days in nitrogen-deficient medium. Table S1 traces IC-3/4/7
    to a natural water sample near Lake Isanuma. Collection provenance was checked
    at https://mcc.nbrp.jp/strainList.do?strainNumber=NIES-3388 (IC-7), https://mcc.nbrp.jp/strainList.do?strainNumber=NIES-3386
    (IC-3) and https://mcc.nbrp.jp/strainList.do?strainNumber=NIES-3387 (IC-4). IC-3/4
    collection and isolation dates conflict; no date is silently corrected. IC-7's
    2018 axenic status is not projected onto 2014. Taxon label verified at https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=51706
    on 2026-10-05. Collection fields support provenance, not independent experimental
    replication.
discussions:
- discussion_id: anisogamy-scope-and-hierarchy
  prompt: Preserve broad size-dimorphism scope and distinguish motility conventions.
  kind: CURATION_TODO
  status: OPEN
  rationale: 'Use anisogamy in the broad size-dimorphism sense, including oogamy,
    as explicitly stated by Lindsey et al. (2024). Nozaki et al. (2014) instead distinguish
    anisogamy with flagellated female gametes from oogamy in their four-type classification.
    This is a terminology difference, not evidence that the phenotypes are disjoint.
    Motility of both gametes and external fertilization describe the canonical example,
    not universal requirements. The definition compares gamete types, not incidental
    size variation within a type, vegetative-versus-gamete size, or mating compatibility.
    Isogamy traitmech:000619, unisexual reproduction traitmech:000613 and fungal mating
    systems traitmech:000615 through traitmech:000618 describe distinct scopes. No
    numerical threshold or organism-level disjointness is asserted. Use phenotype
    METPO:1000059 pending a narrower reproductive-phenotype hierarchy; PHYSIOLOGY
    is a filesystem category. Oogamy traitmech:000621 now supplies the size-dimorphic
    child with large nonmotile female gametes. Its evidence explicitly preserves nonmotile
    male exceptions rather than imposing a universal motility convention. Verify lexical/external
    mappings and a narrower reproductive parent before adding them. Kaczmarska et
    al. (2017), DOI:10.1371/journal.pone.0181413, also use physiological/behavioural
    anisogamy for approximately equal-sized gametes in diatoms. That usage is not
    equivalent to the size-based sense selected here: behavioural or physiological
    differences alone do not establish gamete-type size dimorphism. Do not map that
    usage as an exact synonym or infer organism-level disjointness; its relationship
    needs separate scope review.'
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: anisogamy-mechanism-and-provenance
  prompt: Resolve size-control mechanisms and strain discrepancies before extension.
  kind: CURATION_TODO
  status: OPEN
  rationale: The observed gamete phenotype is not a literal MID locus, a sequence
    profile, an expanded mating-type region, or an expression signature. Comparative
    genomic associations and the proposed evolutionary role of MID do not justify
    causal edges for size dimorphism. Resolve native protein accessions and perturbation
    evidence before a causal graph; no NONMECHANISTIC graph bypasses this gap. Keep
    the 2018 Results/Methods strain mismatch unresolved until primary metadata reconciles
    it. Collection date conflicts do not invalidate the directly observed 2014 phenotype,
    but constrain strain-history claims. A collection's blank mutation field is not
    proof of an unmutated genome. Read remaining source material before quantitative
    or evolutionary extensions; preserve actual abstract-resolver verdicts separately
    from manual full-text checks.
  posed_by: codex
  posed_date: '2026-10-05'
