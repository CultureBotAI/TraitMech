identifier: METPO:1000636
label: chemoheterotrophic
definition: A trophic type in which an organism obtains both energy and carbon from
  organic compounds.
definition_source: DOI:10.1016/B978-012373944-5.00083-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
