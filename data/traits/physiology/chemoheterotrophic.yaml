  curator: claude
  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 5 causal edge(s) off microbe-domain METPO predicates (1 to
    has energy source, 1 to has carbon source, 3 to has output), issue 301. The previous
    predicates are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain
    is METPO:1000525 (microbe), so a causal-graph subject entailed that the subject
    IS a microbe; CausalNodeTypeEnum has no organism member, so no such edge could
    ever satisfy the domain. Edge directions are unchanged - this pass only relabels
    and re-grounds. RO:0002234 (has output) is used where the subject is an activity,
    since biolink gives it the domain 'biological process or activity'; the METPO
    replacements are proposed in proposals/metpo_traitmech_v8 and v9 and are placeholder
    ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): fermentation is typed BIOLOGICAL_PROCESS. PATHWAY is
    a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is everything
    else. A CLASS of routes rather than one route -- fermentation names a mode of
    energy conservation with many distinct implementations, so its steps cannot be
    enumerated without picking one. Already 3 BIOLOGICAL_PROCESS to 2. NOTE its groundings
    disagree with each other (GO:0006113 x3, METPO:1002005, and METPO:1000845 which
    is ACETOGENESIS, a different concept) -- filed as #391 and deliberately NOT touched
    here, because retyping a node while carrying a wrong CURIE along unchanged would
    make it look reviewed.'
  llm_assisted: true
