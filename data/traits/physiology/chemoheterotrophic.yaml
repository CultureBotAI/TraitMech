  snippet: Chemoheterotroph (chemoorganoheterotroph)
  notes: Encyclopedia chapter maps chemoheterotrophy to chemical energy and reduced
    organic carbon.
- reference: DOI:10.1021/acsomega.3c02205
  snippet: chemoheterotrophic
  notes: Review table supports chemoheterotrophic use of organic molecules as energy
