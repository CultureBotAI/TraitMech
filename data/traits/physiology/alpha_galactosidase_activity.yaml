identifier: traitmech:000149
label: alpha-galactosidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  alpha-galactosidase enzymes that hydrolyze alpha-1,6-linked galactose residues in
  oligosaccharides and polymeric galactomannans.
definition_source: DOI:10.3109/07388551.2013.794124
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.3109/07388551.2013.794124
  snippet: The enzyme α-galactosidase (α-D-galactoside galactohydrolase; EC 3.2.1.22)
    catalyzes the hydrolysis of α-1,6-linked galactose residues in oligosaccharides
    and polymeric galactomannan.
  notes: Katrolia et al. define alpha-galactosidase as EC 3.2.1.22, an enzyme that
    hydrolyzes alpha-1,6-linked galactose residues, grounding the enzyme activity
    named by the organism-level phenotype.
- reference: DOI:10.1128/jcm.22.3.333-335.1985
  snippet: Selenomonas sputigena was positive for α-galactosidase, β-galactosidase,
    and α-glucosidase (API ZYM strip) and for α-glucosidase, β-glucosidase, and α-galactosidase
    (API An-Ident strip).
  notes: Tanner et al. detected alpha-galactosidase in Selenomonas sputigena with
    the API ZYM enzyme activity panel and the API An-Ident strip.
- reference: DOI:10.1093/nar/15.5.2213
  snippet: Melibiose uptake and hydrolysis in E.coli is performed by the MelB and
    MelA proteins, respectively. We report the cloning and sequencing of the melA
    gene. The nucleotide sequence data showed that melA codes for a 450 amino acid
    long protein with a molecular weight of 50.6 kd.
  notes: Liljeström and Liljeström cloned and sequenced the Escherichia coli K-12
    melA gene encoding the 450-residue alpha-galactosidase MelA (UniProtKB:P06720).
canonical_examples:
- taxon_id: NCBITaxon:69823
  taxon_label: Selenomonas sputigena
  note: Tanner et al. reported Selenomonas sputigena as positive for alpha-galactosidase
    in API ZYM and API An-Ident enzyme activity panels.
  reference: DOI:10.1128/jcm.22.3.333-335.1985
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Liljeström and Liljeström cloned and sequenced the Escherichia coli K-12 melA
    gene encoding alpha-galactosidase (MelA) for melibiose hydrolysis.
  reference: DOI:10.1093/nar/15.5.2213
