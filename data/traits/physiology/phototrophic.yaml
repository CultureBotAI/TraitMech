- timestamp: '2026-08-15T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Normalised causal-node type(s) so one node_id means one thing corpus-wide
    (issue 356): proton_motive_force: CAPACITY -> STATE. The schema''s OWN example
    of STATE: ''a bioenergetic or molecular state of the cell (e.g. proton motive
    force ...) ... the state is the gradient / steady-value, not its establishment''.
    All 35 occurrences describe the gradient -- every description across all four
    types reads ''electrochemical proton gradient'', including the 13 typed BIOLOGICAL_PROCESS
    (''Transmembrane electrochemical gradient generated by respiration''), which name
    the gradient and its provenance rather than the generating process. Nothing here
    means the establishment, so this is a retype and not a rename; records that DO
    mean the process already use a separate id (proton_motive_force_generation in
    ph_delta.yaml). Also settles the one edge #356 was filed for: phototrophic.yaml''s
    CAPACITY typing was blocking `powers` (METPO:2007900), which is gated to BIOLOGICAL_PROCESS|STATE.'
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): photosynthetic_electron_transport is typed PATHWAY. PATHWAY
    is a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is
    everything else. A named route in every record that carries it, though NOT THE
    SAME ROUTE, which is why no single step list belongs in this rationale. metabolism/phototrophy.yaml
    enumerates the oxygenic form (''Electron flow from water through PSII, cytochrome
    b6f and PSI''); photoheterotrophic.yaml and photoorganoheterotrophic.yaml cover
    ANOXYGENIC phototrophy -- one reaction centre, cyclic flow, no water oxidation
    -- and say the neutral thing on purpose. Quoting the oxygenic steps at them would
    assert biology they specifically do not claim (#400 review). Both forms are named
    routes whose steps a curator could list, which is the test. Was 5 PATHWAY to 1
    before this tranche.'
  llm_assisted: true
