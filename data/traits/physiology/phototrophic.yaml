identifier: METPO:1000660
label: phototrophic
definition: A trophic type characterized by the use of light as the primary energy
  source for metabolic processes, regardless of carbon source.
definition_source: DOI:10.3389/fmicb.2011.00165
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: TT_phototroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: aerobic_anoxygenic_phototrophy
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: phototroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.3389/fmicb.2011.00165
  snippet: use light as the energy source
  notes: Review supports light-driven ATP and reductant generation by phototrophic
    bacteria.
- reference: DOI:10.1093/femsre/fuv032
  snippet: bacteriochlorophyll-containing reaction centers
  notes: Review supports bacteriochlorophyll reaction centers in aerobic anoxygenic
    phototrophs.
canonical_examples:
