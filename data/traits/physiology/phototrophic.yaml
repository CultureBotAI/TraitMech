identifier: METPO:1000660
label: phototrophic
definition: A trophic type characterized by the use of light as the primary energy
  source for metabolic processes, regardless of carbon source.
definition_source: DOI:10.3389/fmicb.2011.00165
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: TT_phototroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: aerobic_anoxygenic_phototrophy
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: phototroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.3389/fmicb.2011.00165
  snippet: use light as the energy source
  notes: Review supports light-driven ATP and reductant generation by phototrophic
    bacteria.
- reference: DOI:10.1093/femsre/fuv032
  snippet: bacteriochlorophyll-containing reaction centers
  notes: Review supports bacteriochlorophyll reaction centers in aerobic anoxygenic
    phototrophs.
canonical_examples:
- taxon_id: NCBITaxon:1111708
  taxon_label: Synechocystis sp. PCC 6803
  note: oxygenic phototroph
  reference: DOI:10.3390/md11082894
- taxon_id: NCBITaxon:1085
  taxon_label: Rhodospirillum rubrum
  note: anoxygenic phototroph
  reference: DOI:10.4056/sigs.1804360
causal_graphs:
- graph_id: phototrophic_light_energy_capture
  title: Phototrophic light-energy capture mechanism
  description: DOI-backed graph for bacterial light capture, photosynthetic electron
    transport, ATP generation, and reductant formation.
  scope_status: MECHANISTIC
  scope_notes: This cross-mechanism graph includes chlorophyll/bacteriochlorophyll
    reaction centers and retinal ion pumps as alternatives. The R. rubrum PufL example
    anchors a Type II reaction center and does not represent oxygenic or rhodopsin-based
    phototrophy.
  nodes:
  - node_id: phototrophic_trait
    label: phototrophic
    node_type: TRAIT
    grounding: METPO:1000660
    description: Trophic type using light as an energy source.
  - node_id: light
    label: light
    node_type: ENVIRONMENTAL_FACTOR
    description: Electromagnetic energy harvested by phototrophic cells.
    grounding: PATO:0001717
  - node_id: photosynthetic_reaction_center
    label: photosynthetic reaction center
    node_type: GENE_OR_PROTEIN
    description: Pigment-protein complex that initiates photochemical charge separation.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This generic node spans oxygenic photosystems and anoxygenic
      Type I and Type II multisubunit reaction centers; no one component-family term
      represents all of them.
    protein_examples:
    - uniprot_id: UniProtKB:P10717
      protein_label: Reaction center protein L chain
      gene_symbol: pufL
      taxon_id: NCBITaxon:1085
      taxon_label: Rhodospirillum rubrum
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 119
      sequence_version: 2
      role: L-chain component of the R. rubrum Type II photochemical reaction center;
        this accession is not presented as the complete reaction-center complex.
      evidence:
      - reference: DOI:10.1128/jb.182.5.1200-1207.2000
        snippet: The proteins of the photochemical components are encoded by the puf
          operon (LHalpha, LHbeta, RC-L, and RC-M) and by puhA (RC-H)
        notes: The primary R. rubrum assembly study identifies RC-L as a puf-encoded
          reaction-center component and reports phototrophic incompetence of puf mutants;
          UniProtKB P10717 is the reviewed species-level PufL entry.
  - node_id: bacteriochlorophyll
    label: bacteriochlorophyll
    node_type: CHEMICAL
    description: Light-harvesting pigment in many anoxygenic phototrophic bacteria.
    grounding: CHEBI:38201
  - node_id: photosynthetic_electron_transport
    label: photosynthetic electron transport
    node_type: PATHWAY
    description: Light-induced electron-transfer route producing ATP and reductants.
    grounding: GO:0009767
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier generated by phototrophic electron transport.
  - node_id: reducing_power
    label: reducing power
    node_type: CAPACITY
    description: NAD(P)H or reduced ferredoxin generated by photosynthetic electron
      transport.
    grounding: METPO:1007503
  - node_id: carotenoid
    label: carotenoid
    node_type: CHEMICAL
    description: Auxiliary light-harvesting pigment in phototrophic bacteria.
    grounding: CHEBI:23044
  - node_id: blue_green_light
    label: blue-green light
    node_type: ENVIRONMENTAL_FACTOR
    description: Blue-green region of the spectrum absorbed by carotenoid antennas.
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Transmembrane electrochemical proton gradient generated by photosynthetic
      electron transport.
    grounding: METPO:1007500
  - node_id: atp_synthase
    label: ATP synthase complex
    node_type: GENE_OR_PROTEIN
    description: Membrane enzyme complex that synthesizes ATP driven by proton motive
      force.
    grounding: GO:0045259
  - node_id: rhodopsin
    label: rhodopsin
    node_type: GENE_OR_PROTEIN
    description: Retinal-based light-driven ion-pumping membrane protein used in retinalophototrophy.
    grounding: InterPro:IPR001425
  - node_id: ion_transport
    label: ion transport across membrane
    node_type: BIOLOGICAL_PROCESS
    description: Light-driven transmembrane ion pumping that establishes a gradient
      for energy conservation.
  edges:
  - subject: phototrophic_trait
    predicate: has energy source
    object: light
    description: Phototrophic growth uses light as the energy input.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: use light as the energy source
      notes: Supports light as the defining energy source for phototrophic bacteria.
    predicate_id: METPO:2007807
  - subject: bacteriochlorophyll
    predicate: part of
    object: photosynthetic_reaction_center
    description: Bacteriochlorophyll-containing complexes harvest light in many bacterial
