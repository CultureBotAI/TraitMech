    evidence:
    - reference: DOI:10.1093/femsre/fuv032
      snippet: bacteriochlorophyll-containing reaction centers
      notes: Supports pigment-reaction-center coupling in aerobic anoxygenic phototrophs.
    predicate_id: biolink:part_of
  - subject: light
    predicate: captured by
    object: photosynthetic_reaction_center
    description: Reaction centers convert absorbed light into charge separation.
    evidence:
    - reference: DOI:10.1093/femsre/fuv032
      snippet: harvest light energy
      notes: Supports light harvesting by reaction centers.
  - subject: photosynthetic_reaction_center
    predicate: initiates
    object: photosynthetic_electron_transport
    description: Photochemical reaction centers initiate electron transport.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: light-induced electron transport
      notes: Supports reaction-center-driven photosynthetic electron transport.
  - subject: photosynthetic_electron_transport
    predicate: has output
    object: atp
    description: Photosynthetic electron transport produces ATP.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: produce phosphate bond energy (ATP)
      notes: Supports ATP as a product of phototrophic electron transport.
    predicate_id: RO:0002234
  - subject: photosynthetic_electron_transport
    predicate: has output
    object: reducing_power
    description: Photosynthetic electron transport generates reducing equivalents.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: reductants [e.g., NAD(P)H and reduced ferredoxin]
      notes: Supports reductant production by photosynthetic electron transport.
    predicate_id: RO:0002234
  - subject: carotenoid
    predicate: transfers excitation energy to
    object: bacteriochlorophyll
    description: Excitation energy captured by carotenoids is transferred to BChl
      a.
    evidence:
    - reference: DOI:10.1093/femsre/fuv032
      notes: The excitation energy captured by the carotenoids is transferred within
        picoseconds to the BChl a molecules.
  - subject: carotenoid
    predicate: extends light absorption into
    object: blue_green_light
    description: Carotenoids serve as auxiliary pigments extending absorption to the
      blue-green spectrum.
    evidence:
    - reference: DOI:10.1093/femsre/fuv032
      notes: Carotenoids serve as auxiliary pigments which extend absorption to the
        blue-green part of the spectrum.
  - subject: photosynthetic_electron_transport
    predicate: forms
    object: proton_motive_force
    description: Photosynthetic electron transport generates a proton motive force.
    evidence:
    - reference: DOI:10.1128/aem.00863-24
      notes: Along with electron transport, proton motive force (PMF) is formed.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: powers
    object: atp_synthase
    description: Proton motive force drives ATP synthase complexes.
    evidence:
    - reference: DOI:10.1128/aem.00863-24
      notes: and powers ATP synthase complexes.
  - subject: atp_synthase
    predicate: produces
    object: atp
    description: ATP synthase complexes generate ATP from the proton motive force.
    evidence:
    - reference: DOI:10.1128/aem.00863-24
      notes: PMF powers ATP synthase complexes that synthesize ATP, the cellular energy
        carrier.
    predicate_id: METPO:2007800
  - subject: rhodopsin
    predicate: pumps
    object: ion_transport
    description: Rhodopsins use light to pump ions across the membrane (retinalophototrophy).
    evidence:
    - reference: DOI:10.1038/s43705-023-00334-5
      notes: retinalophototrophy, which uses rhodopsins to pump ions through the membrane.
