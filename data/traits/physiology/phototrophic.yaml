  - node_id: ion_transport
    label: ion transport across membrane
    node_type: BIOLOGICAL_PROCESS
    description: Light-driven transmembrane ion pumping that establishes a gradient
      for energy conservation.
  edges:
  - subject: phototrophic_trait
    predicate: has energy source
    object: light
    description: Phototrophic growth uses light as the energy input.
    evidence:
    - reference: DOI:10.3389/fmicb.2011.00165
      snippet: use light as the energy source
      notes: Supports light as the defining energy source for phototrophic bacteria.
    predicate_id: METPO:2007807
  - subject: bacteriochlorophyll
    predicate: part of
    object: photosynthetic_reaction_center
