    description: Pigment-protein complex that initiates photochemical charge separation.
  - node_id: bacteriochlorophyll
    label: bacteriochlorophyll
    node_type: CHEMICAL
    description: Light-harvesting pigment in many anoxygenic phototrophic bacteria.
    grounding: CHEBI:38201
  - node_id: photosynthetic_electron_transport
    label: photosynthetic electron transport
    node_type: PATHWAY
