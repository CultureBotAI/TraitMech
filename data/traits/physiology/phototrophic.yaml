  reference: PMID:23945601
- taxon_id: NCBITaxon:1085
  taxon_label: Rhodospirillum rubrum
  note: anoxygenic phototroph
  reference: PMID:21886856
causal_graphs:
- graph_id: phototrophic_light_energy_capture
  title: Phototrophic light-energy capture mechanism
  description: DOI-backed graph for bacterial light capture, photosynthetic electron
    transport, ATP generation, and reductant formation.
  nodes:
  - node_id: phototrophic_trait
    label: phototrophic
    node_type: TRAIT
    grounding: METPO:1000660
    description: Trophic type using light as an energy source.
  - node_id: light
    label: light
    node_type: ENVIRONMENTAL_FACTOR
    description: Electromagnetic energy harvested by phototrophic cells.
    grounding: PATO:0001717
  - node_id: photosynthetic_reaction_center
    label: photosynthetic reaction center
