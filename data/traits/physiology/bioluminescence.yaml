identifier: traitmech:000085
label: bioluminescence
definition: A physiological capability to emit visible light through a
  luciferase-catalyzed reaction, frequently regulated by quorum sensing in marine
  bacteria such as Aliivibrio and Photobacterium.
definition_source: DOI:10.1016/j.csbj.2018.11.003
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
