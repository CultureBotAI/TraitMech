identifier: traitmech:000085
label: bioluminescence
definition: A physiological capability to emit visible light through a luciferase-catalyzed
  reaction, frequently regulated by quorum sensing in marine bacteria such as Aliivibrio
  and Photobacterium.
definition_source: DOI:10.1016/j.csbj.2018.11.003
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: luminescent
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.csbj.2018.11.003
evidence:
- reference: DOI:10.1016/j.csbj.2018.11.003
  notes: Brodl, Winkler & Macheroux review the molecular mechanisms of bacterial bioluminescence
    and the luciferase reaction.
- reference: DOI:10.1146/annurev.cellbio.21.012704.131001
  notes: Waters & Bassler support quorum-sensing regulation of light production in
    luminous bacteria.
canonical_examples:
- taxon_id: NCBITaxon:668
  taxon_label: Aliivibrio fischeri
  note: Model bioluminescent bacterium (lux operon); Euprymna squid light-organ symbiont
    and quorum-sensing paradigm.
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC3759917/
causal_graphs:
- graph_id: bioluminescence_luciferase
  title: Luciferase-catalyzed light emission
  description: Evidence-backed causal sketch linking luciferase to oxygen-dependent
    light emission, often under quorum-sensing control.
  nodes:
  - node_id: bioluminescence_trait
    label: bioluminescence
    node_type: TRAIT
    grounding: traitmech:000085
    description: Capacity to emit visible light enzymatically.
  - node_id: luciferase
    label: luciferase
    node_type: GENE_OR_PROTEIN
    description: Enzyme catalyzing the light-emitting reaction.
  - node_id: bioluminescence_process
    label: bioluminescence
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0008218
    description: Enzymatic emission of visible light.
  - node_id: molecular_oxygen
    label: molecular oxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
    description: Co-substrate of the luciferase reaction.
  - node_id: long_chain_aldehyde
    label: long-chain aldehyde
    node_type: CHEMICAL
    description: Aliphatic aldehyde substrate (C8-C16) of the luciferase reaction.
  - node_id: fmnh2
    label: reduced flavin mononucleotide (FMNH2)
    node_type: CHEMICAL
    description: Reduced flavin substrate consumed by luciferase.
  - node_id: fmn
    label: flavin mononucleotide (FMN)
    node_type: CHEMICAL
    description: Oxidized flavin recycled in the luciferase cycle.
  - node_id: lux_g
    label: LuxG flavin reductase
    node_type: GENE_OR_PROTEIN
    description: NAD(P)H-dependent flavin reductase generating FMNH2.
  - node_id: luxcde_complex
    label: LuxCDE fatty acid reductase complex
    node_type: GENE_OR_PROTEIN
    description: LuxC/LuxD/LuxE complex supplying long-chain aldehyde substrate.
  - node_id: lux_i
    label: LuxI autoinducer synthase
    node_type: GENE_OR_PROTEIN
    description: Synthase producing the 3-oxo-C6-HSL acyl-homoserine lactone autoinducer.
  - node_id: lux_r
    label: LuxR transcription factor
    node_type: GENE_OR_PROTEIN
    description: Autoinducer-responsive activator of the lux locus.
  - node_id: autoinducer_hsl
    label: 3-oxo-C6-HSL autoinducer
    node_type: CHEMICAL
    description: LuxI-produced acyl-homoserine lactone quorum-sensing signal.
  - node_id: lux_locus_expression
    label: lux locus expression
    node_type: BIOLOGICAL_PROCESS
    description: Transcription of the lux operon producing light-production machinery.
  edges:
  - subject: luciferase
    predicate: enables
    object: bioluminescence_process
    description: Luciferase carries out the light-emitting reaction.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: Brodl et al. review the bacterial luciferase mechanism.
    predicate_id: RO:0002327
  - subject: bioluminescence_process
    predicate: consumes
    object: molecular_oxygen
    description: Light emission consumes molecular oxygen.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: Supports O2 as a luciferase co-substrate.
    predicate_id: biolink:consumes
  - subject: bioluminescence_process
    predicate: confers
    object: bioluminescence_trait
    description: The luciferase reaction realizes the bioluminescence trait.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.21.012704.131001
      notes: Waters & Bassler support quorum-sensing control of luminescence.
    predicate_id: METPO:2007700
  - subject: luciferase
    predicate: catalyzes
    object: long_chain_aldehyde
    description: Luciferase catalyzes the monooxygenation of long-chain aliphatic
      aldehydes.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: The heterodimeric enzyme luciferase (LuxAB) catalyzes the monooxygenation
        of aliphatic aldehydes to the corresponding acids.
    predicate_id: biolink:catalyzes
  - subject: fmnh2
    predicate: is substrate for
    object: bioluminescence_process
    description: FMNH2 is a required substrate consumed in the light-emitting luciferase
      reaction.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: Long chain aldehydes, reduced flavin mononucleotide (FMNH2) and molecular
        oxygen (O2) are converted by the enzyme luciferase (LuxAB).
  - subject: long_chain_aldehyde
    predicate: is substrate for
    object: bioluminescence_process
    description: Long-chain aldehyde is a required substrate of the light-emitting
      reaction.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: Long chain aldehydes, reduced flavin mononucleotide (FMNH2) and molecular
        oxygen (O2) are converted by the enzyme luciferase (LuxAB).
  - subject: lux_g
    predicate: converts
    object: fmn
    description: LuxG flavin reductase reduces free FMN to FMNH2 supplying the luciferase
      reaction.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: LuxG converts free flavin (FMN) to reduced flavin (FMNH2); LuxG is a
        NAD(P)H-dependent flavin reductase.
  - subject: lux_g
    predicate: produces
    object: fmnh2
    description: LuxG generates the reduced flavin substrate FMNH2.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: LuxG converts free flavin (FMN) to reduced flavin (FMNH2).
    predicate_id: METPO:2000202
  - subject: luxcde_complex
    predicate: supplies
    object: long_chain_aldehyde
    description: The LuxCDE fatty acid reductase complex supplies the long-chain aldehyde
      substrate.
    evidence:
    - reference: DOI:10.1016/j.csbj.2018.11.003
      notes: To supply the long-chain aldehyde substrates to the luciferase, the proteins
        LuxC, LuxD, and LuxE constitute a fatty acid reductase complex.
  - subject: lux_i
    predicate: synthesizes
    object: autoinducer_hsl
    description: LuxI autoinducer synthase produces the 3-oxo-C6-HSL signal.
    evidence:
    - reference: DOI:10.1128/jb.00035-24
      notes: Identifying LuxI as the autoinducer synthase; the LuxI-produced 3-oxo-C6
        HSL.
  - subject: autoinducer_hsl
    predicate: binds
    object: lux_r
    description: The 3-oxo-C6-HSL autoinducer binds the LuxR transcription factor.
    evidence:
    - reference: DOI:10.1128/jb.00035-24
      notes: The LuxI-produced 3-oxo-C6 was shown to bind the N-terminal domain of
        the transcription factor LuxR.
  - subject: lux_r
    predicate: activates expression of
    object: lux_locus_expression
    description: Autoinducer-bound LuxR activates expression of the lux locus.
    evidence:
    - reference: DOI:10.1128/jb.00035-24
      notes: Bind the N-terminal domain of the transcription factor LuxR to activate
        the expression of the lux locus.
  - subject: lux_locus_expression
    predicate: produces
    object: luciferase
    description: Expression of the lux locus produces the luciferase light-production
      machinery.
    evidence:
    - reference: DOI:10.1128/jb.00035-24
      notes: Activation of the lux locus drives expression of the light-production
        machinery including luciferase.
    predicate_id: METPO:2000202
