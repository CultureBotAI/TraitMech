  notes: Brodl, Winkler & Macheroux review the molecular mechanisms of bacterial
    bioluminescence and the luciferase reaction.
- reference: DOI:10.1146/annurev.cellbio.21.012704.131001
  notes: Waters & Bassler support quorum-sensing regulation of light production in
    luminous bacteria.
