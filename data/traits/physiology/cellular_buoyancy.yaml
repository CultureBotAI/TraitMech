identifier: traitmech:000528
label: cellular buoyancy
definition: A physiology trait in which intracellular gas vesicles reduce a microbial
  cell's effective density enough to provide buoyancy and vertical positioning in
  the water column.
definition_source: DOI:10.1186/s13036-024-00426-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: buoyancy
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1186/s13036-024-00426-3
evidence:
- reference: DOI:10.1186/s13036-024-00426-3
  snippet: can provide buoyancy for them to move up and down the water to obtain nutrients
  notes: Feng et al. review gas-vesicle physical properties that provide buoyancy
    for photosynthetic bacteria and halophilic archaea.
- reference: DOI:10.1186/s13036-024-00426-3
  snippet: give them the buoyancy to move upward so that they can get enough light
    for photosynthesis
  notes: Feng et al. describe gas vesicles giving photosynthetic bacteria buoyancy
    to move upward toward sufficient light.
- reference: DOI:10.3390/life12091455
  snippet: Approximately 3–10% of the cell volume must be occupied by gas vesicles
    to provide buoyancy
  notes: Pfeifer reviews gas-vesicle proteins and summarizes the fraction of cell
    volume that must contain gas vesicles to confer buoyancy.
canonical_examples:
- taxon_id: NCBITaxon:1126
  taxon_label: Microcystis aeruginosa
  note: Mlouka et al. mapped the M. aeruginosa gas-vesicle gene cluster and DNA rearrangements
    that lead to loss of cellular buoyancy.
  reference: DOI:10.1128/JB.186.8.2355-2365.2004
