identifier: traitmech:000152
label: alpha-fucosidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  alpha-fucosidase enzymes that hydrolyze alpha-L-fucosides to L-fucose and an alcohol.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/51.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/51.html
  snippet: 'Reaction: an α-L-fucoside + H2O = L-fucose + an alcohol'
  notes: The NC-IUBMB EC 3.2.1.51 entry defines alpha-L-fucosidase by its accepted
    name and hydrolytic reaction, grounding the enzyme activity named by the organism-level
    phenotype.
- reference: DOI:10.1128/jcm.22.3.333-335.1985
  snippet: Positive reactions for alpha-glucosidase, beta-glucosidase, alpha-fucosidase,
    and alpha-glucuronidase suggest that "B. forsythus" may be saccharolytic.
  notes: Tanner et al. detected alpha-fucosidase in the then-proposed oral species
    Bacteroides forsythus with the API ZYM enzyme activity panel.
- reference: DOI:10.1016/j.bmc.2013.05.056
  snippet: The X-ray crystal structures of Bacteroides thetaiotaomicron GH29 α-l-fucosidase
    (BtFuc2970) in a new crystal form (at a resolution of 1.59Å) and liganded with
    a 5-membered iminocyclitol inhibitor (1.73Å) are reported herein.
  notes: Wright et al. report crystal structures of Bacteroides thetaiotaomicron VPI-5482
    GH29 alpha-L-fucosidase BtFuc2970 (encoded by BT_2970, UniProtKB:Q8A3I4).
canonical_examples:
- taxon_id: NCBITaxon:28112
  taxon_label: Tannerella forsythia
  note: Tanner et al. reported alpha-fucosidase-positive reactions for "Bacteroides
    forsythus", the basonym of Tannerella forsythia, in API ZYM profiles.
  reference: DOI:10.1128/jcm.22.3.333-335.1985
- taxon_id: NCBITaxon:226186
  taxon_label: Bacteroides thetaiotaomicron VPI-5482
  note: Wright et al. determined crystal structures of Bacteroides thetaiotaomicron
    VPI-5482 GH29 alpha-L-fucosidase BtFuc2970 (BT_2970).
  reference: DOI:10.1016/j.bmc.2013.05.056
