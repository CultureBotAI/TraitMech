identifier: traitmech:000146
label: beta-glucosidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  beta-glucosidase enzymes that hydrolyze beta-D-glucosidic bonds in beta-D-glucosides.
definition_source: DOI:10.1007/s13205-015-0328-z
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1007/s13205-015-0328-z
  snippet: β-Glucosidases (β-d-glucopyrranoside glucohydrolase) [E.C.3.2.1.21] are
    the enzymes which hydrolyze the glycosidic bond of a carbohydrate moiety to release
    nonreducing terminal glycosyl residues, glycoside and oligosaccharides
  notes: The review defines beta-glucosidases as EC 3.2.1.21 glycoside hydrolases,
    grounding the enzyme activity named by the organism-level phenotype.
- reference: DOI:10.2323/jgam.60.59
  snippet: In API ZYM, activities are positive for alkaline phosphatase, esterase
    (C4), leucine arylamidase, valine arylamidase, cystine arylamidase, acid phosphatase,
    naphthol-AS-BI-phosphohydrolase, α-glucosidase, β-glucosidase
  notes: The Flavobacterium panaciterrae species description reports beta-glucosidase
    among positive API ZYM activities for the DCY69T type strain.
- reference: DOI:10.3390/microorganisms12040776
  snippet: Although both strains showed positive results for α-glucosidase activity,
    β-glucosidase activity was only observed in L. mucosae NK41.
  notes: Ma et al. detected beta-glucosidase activity in Limosilactobacillus mucosae
    NK41 with the API ZYM enzyme activity panel.
canonical_examples:
- taxon_id: NCBITaxon:1222002
  taxon_label: Flavobacterium panaciterrae
  note: An et al. reported Flavobacterium panaciterrae DCY69T as positive for beta-glucosidase
    in the API ZYM enzyme activity panel.
  reference: DOI:10.2323/jgam.60.59
