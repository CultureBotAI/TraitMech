evidence:
- reference: DOI:10.3390/antiox10060829
  snippet: anoxygenic photosynthesis
  notes: Review supports light-driven oxidation of reduced sulfur compounds by photolithotrophic
    sulfur bacteria.
- reference: DOI:10.3389/fmicb.2017.00323
  snippet: light as an energy source and reduced iron
  notes: Review supports Fe(II) as an inorganic electron donor for photoferrotrophy.
