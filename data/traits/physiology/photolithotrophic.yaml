identifier: METPO:1000658
label: photolithotrophic
definition: A trophic type in which an organism uses light as the energy source and
  inorganic compounds as electron donors, typically with carbon dioxide as the primary
  carbon source.
definition_source: DOI:10.3390/antiox10060829
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: photolithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.3390/antiox10060829
  snippet: anoxygenic photosynthesis
  notes: Review supports light-driven oxidation of reduced sulfur compounds by photolithotrophic
    sulfur bacteria.
- reference: DOI:10.3389/fmicb.2017.00323
  snippet: light as an energy source and reduced iron
  notes: Review supports Fe(II) as an inorganic electron donor for photoferrotrophy.
canonical_examples:
- taxon_id: NCBITaxon:1111708
  taxon_label: Synechocystis sp. PCC 6803
  note: oxygenic photolithotroph
  reference: DOI:10.1093/dnares/3.3.109
- taxon_id: NCBITaxon:194439
  taxon_label: Chlorobaculum tepidum TLS
  note: anoxygenic photolithotroph
  reference: DOI:10.1073/pnas.132181499
causal_graphs:
- graph_id: photolithotrophic_inorganic_electron_donors
  title: Photolithotrophic inorganic electron donor photosynthesis
  description: DOI-backed graph linking light capture, inorganic electron donors such
    as sulfide and Fe(II), anoxygenic photosynthetic electron transport, and CO2 assimilation.
  scope_status: MECHANISTIC
  scope_notes: The retained graph specifically represents anoxygenic sulfur- and iron-oxidizing
    branches; the oxygenic Synechocystis example documents the broader trait but is
    not asserted to use this reaction center. The C. tepidum example anchors the Type
    I P840 branch.
  nodes:
  - node_id: photolithotrophic_trait
    label: photolithotrophic
    node_type: TRAIT
    grounding: METPO:1000658
    description: Trophic type using light energy and inorganic electron donors.
  - node_id: light
    label: light
    node_type: ENVIRONMENTAL_FACTOR
    description: Energy source for photolithotrophic metabolism.
    grounding: PATO:0001717
  - node_id: inorganic_electron_donor
    label: inorganic electron donor
    node_type: CHEMICAL
    description: Reduced inorganic substrate supplying electrons.
    grounding: METPO:1007502
  - node_id: hydrogen_sulfide
    label: hydrogen sulfide
    node_type: CHEMICAL
    grounding: CHEBI:16136
    description: Reduced sulfur electron donor for sulfur phototrophs.
  - node_id: ferrous_iron
    label: ferrous iron
    node_type: CHEMICAL
    description: Fe(II), an inorganic electron donor in photoferrotrophy.
    grounding: CHEBI:29033
  - node_id: anoxygenic_photosynthesis
    label: anoxygenic photosynthesis
    node_type: PATHWAY
    description: Photosynthetic electron transport that does not evolve oxygen.
  - node_id: carbon_dioxide
    label: carbon dioxide
    node_type: CHEMICAL
    grounding: CHEBI:16526
    description: Inorganic carbon source often fixed by photolithotrophs.
  - node_id: biomass
    label: biomass
    node_type: CHEMICAL
    description: Cell material formed from fixed carbon.
    grounding: METPO:1007501
  - node_id: photosynthetic_reaction_center
    label: photosynthetic reaction center
    node_type: GENE_OR_PROTEIN
    description: Pigment-protein complex that captures light quanta and drives charge
      separation in anoxygenic photosynthesis.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Anoxygenic Type I and Type II reaction centers are distinct multisubunit
      complexes; the generic node cannot be represented by one component-family term.
    protein_examples:
    - uniprot_id: UniProtKB:Q8KEP5
      protein_label: P840 reaction center 17 kDa protein
      gene_symbol: pscD
      taxon_id: NCBITaxon:194439
      taxon_label: Chlorobaculum tepidum TLS
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 84
      sequence_version: 1
      role: Peripheral PscD component of the C. tepidum P840 Type I reaction center;
        this accession is not presented as the complete 12-subunit FMO-RC apparatus.
      evidence:
      - reference: DOI:10.1073/pnas.2216734120
        snippet: two peripheral subunits (PscB and PscD) and six FMO proteins (FMO-1
          to 6) are arranged as two FMO trimers
        notes: The primary cryo-EM study resolves PscD in the C. tepidum TLS whole
          reaction-center apparatus; UniProtKB Q8KEP5 is the reviewed strain-level
          PscD entry.
  - node_id: hydrogen_sulfide_oxidation
    label: hydrogen sulfide oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Oxidation of H2S during phototrophic sulfur metabolism.
  - node_id: elemental_sulfur
    label: elemental sulfur
    node_type: CHEMICAL
    description: Product of phototrophic hydrogen sulfide oxidation.
    grounding: CHEBI:26833
  - node_id: co2_fixation
    label: photosynthetic CO2 fixation
    node_type: BIOLOGICAL_PROCESS
    description: Assimilation of inorganic carbon into biomass during anoxygenic photosynthetic
      growth.
  - node_id: ferrous_iron_oxidation
    label: Fe(II) oxidation
    node_type: BIOLOGICAL_PROCESS
    description: Oxidation of reduced iron coupled to anoxygenic photosynthesis.
  - node_id: photoferrotrophy
    label: photoferrotrophy
    node_type: TRAIT
    description: Photolithotrophic subtype oxidizing Fe(II) via anoxygenic photosynthesis.
