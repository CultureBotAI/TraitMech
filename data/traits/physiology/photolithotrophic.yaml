identifier: METPO:1000658
label: photolithotrophic
definition: A trophic type in which an organism uses light as the energy source and
  inorganic compounds as electron donors, typically with carbon dioxide as the primary
  carbon source.
definition_source: DOI:10.3390/antiox10060829
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: photolithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.3390/antiox10060829
  snippet: anoxygenic photosynthesis
  notes: Review supports light-driven oxidation of reduced sulfur compounds by photolithotrophic
    sulfur bacteria.
- reference: DOI:10.3389/fmicb.2017.00323
  snippet: light as an energy source and reduced iron
  notes: Review supports Fe(II) as an inorganic electron donor for photoferrotrophy.
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: "oxygenic photolithotroph"
  reference: PMID:8905231
- taxon_id: NCBITaxon:1097
  taxon_label: Chlorobaculum tepidum
  note: "anoxygenic photolithotroph"
  reference: PMID:12093901
