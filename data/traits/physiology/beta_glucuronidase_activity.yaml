identifier: traitmech:000151
label: beta-glucuronidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  beta-glucuronidase enzymes that hydrolyze beta-D-glucuronosides to D-glucuronate
  and an alcohol.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/31.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/31.html
  snippet: 'Reaction: a β-D-glucuronoside + H2O = D-glucuronate + an alcohol'
  notes: The NC-IUBMB EC 3.2.1.31 entry defines beta-glucuronidase by its accepted
    name and hydrolytic reaction, grounding the enzyme activity named by the organism-level
    phenotype.
- reference: DOI:10.1128/aem.50.6.1383-1387.1985
  snippet: The beta-glucuronidase produced by E. coli cleaves the MUG substrate to
    yield a fluorescent end product.
  notes: Moberg used beta-glucuronidase cleavage of MUG to detect Escherichia coli
    in food samples.
- reference: DOI:10.1073/pnas.83.22.8447
  snippet: We have developed a gene-fusion system based on the Escherichia coli beta-glucuronidase
    gene (uidA). The uidA gene has been cloned from E. coli K-12 and its entire nucleotide
    sequence has been determined. beta-Glucuronidase has been purified to homogeneity
    and characterized.
  notes: Jefferson et al. cloned and sequenced the Escherichia coli K-12 uidA gene
    encoding beta-glucuronidase and purified the enzyme to homogeneity.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Moberg reported beta-glucuronidase-mediated cleavage of MUG by Escherichia
    coli in a fluorogenic detection assay.
  reference: DOI:10.1128/aem.50.6.1383-1387.1985
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Jefferson et al. cloned and sequenced the Escherichia coli K-12 uidA gene
    encoding beta-glucuronidase and purified the enzyme to homogeneity.
  reference: DOI:10.1073/pnas.83.22.8447
