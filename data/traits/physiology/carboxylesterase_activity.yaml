identifier: traitmech:000156
label: carboxylesterase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  carboxylesterase enzymes that hydrolyze carboxylic esters to alcohols and carboxylates.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/1/1/1.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: carboxylic-ester hydrolase activity
  synonym_type: EXACT_SYNONYM
  source: https://iubmb.qmul.ac.uk/enzyme/EC3/1/1/1.html
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/1/1/1.html
  snippet: 'Reaction: A carboxylic ester + H_{2}O = an alcohol + a carboxylate'
  notes: The NC-IUBMB EC 3.1.1.1 entry defines carboxylesterase by its accepted reaction,
    grounding the ester-hydrolase activity named by the organism-level carboxylesterase
    phenotype.
- reference: DOI:10.1128/JCM.43.8.3713-3717.2005
  snippet: Alkaline phosphatase, esterase (C4), esterase lipase (C8), leucine arylamidase,
    acid phosphatase, and naphthol-AS-BI-phosphohydrolase were clearly positive
  notes: Otsuka et al. detected clear esterase (C4) and esterase lipase (C8) API ZYM
    reactions in the five Corynebacterium resistens isolates they characterized, supporting
    this as a directly assayed bacterial carboxylesterase activity phenotype.
- reference: DOI:10.1016/0378-1119(94)90630-0
  snippet: A Bacillus subtilis PNB carboxy-esterase (PNBCE) catalyzes hydrolysis of
    several beta-lactam antibiotic PNB esters to the corresponding free acid and PNB
    alcohol. This communication (i) describes cloning the pnbA gene, which encodes
    PNBCE, (ii) provides the nucleotide sequence of the pnbA open reading frame (ORF)
    and (iii) describes a method for efficiently expressing the ORF in Escherichia
    coli.
  notes: Zock et al. cloned and sequenced the Bacillus subtilis 168 pnbA gene encoding
    para-nitrobenzyl carboxylesterase (UniProtKB:P37967).
canonical_examples:
- taxon_id: NCBITaxon:258224
  taxon_label: Corynebacterium resistens
  note: Otsuka et al. detected clear esterase (C4) and esterase lipase (C8) API ZYM
    reactions in Corynebacterium resistens isolates.
  reference: DOI:10.1128/JCM.43.8.3713-3717.2005
- taxon_id: NCBITaxon:224308
  taxon_label: Bacillus subtilis 168
  note: Zock et al. cloned and sequenced the Bacillus subtilis 168 pnbA gene encoding
    para-nitrobenzyl carboxylesterase (PnbA) that hydrolyzes carboxylic esters.
  reference: DOI:10.1016/0378-1119(94)90630-0
