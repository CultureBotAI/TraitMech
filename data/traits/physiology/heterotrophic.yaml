- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): fermentation is typed BIOLOGICAL_PROCESS. PATHWAY is
    a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is everything
    else. A CLASS of routes rather than one route -- fermentation names a mode of
    energy conservation with many distinct implementations, so its steps cannot be
    enumerated without picking one. Was 3 BIOLOGICAL_PROCESS to 2 before this tranche.
    NOTE its groundings disagree with each other (GO:0006113 x3, METPO:1002005, and
    METPO:1000845 which is ACETOGENESIS, a different concept) -- filed as #391 and
    deliberately NOT touched here, because retyping a node while carrying a wrong
    CURIE along unchanged would make it look reviewed.'
  llm_assisted: true
