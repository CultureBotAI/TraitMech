identifier: traitmech:000206
label: cold shock response
definition: A stress response in which a rapid temperature downshift induces nucleic-acid-binding
  cold-shock proteins and RNA-remodeling functions that preserve gene expression at
  low temperature.
definition_source: DOI:10.3184/003685003783238707
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000078
synonyms:
- synonym_text: cold-shock response
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3184/003685003783238707
evidence:
- reference: DOI:10.3184/003685003783238707
  snippet: bacteria express a well-defined set of proteins after a rapid decrease
    in temperature, which is termed cold shock
  notes: Weber and Marahiel define bacterial cold shock as the temperature-downshift
    response that induces a specific protein set.
- reference: DOI:10.3184/003685003783238707
  snippet: the cold shock response is organized as a complex stimulon in which post-transcriptional
    events play an important role
  notes: The bacterial cold-shock response is reviewed as a stimulon dominated by
    post-transcriptional control rather than a single cold-specific sigma-factor branch.
- reference: DOI:10.3184/003685003783238707
  snippet: nucleic acid-binding cold shock proteins which play a fundamental role
    not only during cold shock adaptation but also under optimal growth conditions
  notes: The review places nucleic-acid-binding cold-shock proteins among the core
    functional components of bacterial cold-shock adaptation.
- reference: DOI:10.1046/j.1365-2958.1999.01541.x
  snippet: proposed function as an RNA chaperone to prevent the formation of secondary
    structures in RNA molecules, thus facilitating translation at low temperature
  notes: Phadtare and Inouye support RNA chaperoning by CspA-family proteins as a
    mechanism for preserving translation after cold shock.
canonical_examples:
