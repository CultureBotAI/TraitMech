identifier: traitmech:000076
label: oxidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces a terminal
  respiratory oxidase (notably cytochrome c oxidase); it is the basis of the diagnostic
  oxidase test.
definition_source: DOI:10.3390/microorganisms10050926
trait_category: PHYSIOLOGY
