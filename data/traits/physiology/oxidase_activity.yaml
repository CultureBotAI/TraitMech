  notes: Hederstedt reviews bacterial cytochrome c oxidase, the terminal respiratory
    oxidase detected by the oxidase test.
- reference: DOI:10.1089/ars.2020.8039
  notes: Borisov et al. review cytochrome bd-family terminal oxidases of prokaryotic
    respiratory chains.
