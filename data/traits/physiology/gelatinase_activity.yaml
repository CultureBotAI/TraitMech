identifier: traitmech:000136
label: gelatinase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  gelatinase protease.
definition_source: DOI:10.1128/JB.01311-07
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: gelatinase-positive
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/IAI.73.3.1606-1612.2005
- synonym_text: gelatinase production
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/IAI.73.3.1606-1612.2005
evidence:
- reference: DOI:10.1128/JB.01311-07
  snippet: One of the well-studied virulence factors of Enterococcus faecalis is a
    secreted bacterial protease, termed gelatinase
  notes: Del Papa et al. identify Enterococcus faecalis gelatinase as a secreted bacterial
    protease and experimentally test maturation steps needed for full protease activity.
- reference: DOI:10.1128/IAI.73.3.1606-1612.2005
  snippet: all gelatinase-positive isolates but little to no translocation for gelatinase
    nonproducers
  notes: Zeng, Teng and Murray score Enterococcus faecalis isolates by gelatinase
    production and distinguish gelatinase-positive from gelatinase-negative phenotypes.
