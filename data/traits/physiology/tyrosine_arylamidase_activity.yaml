identifier: traitmech:000169
label: tyrosine arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  tyrosine arylamidase enzymes that hydrolyze tyrosine arylamide substrates.
definition_source: DOI:10.1099/ijsem.0.006017
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: tyrosine arylamidase
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1099/ijsem.0.006017
evidence:
- reference: DOI:10.1099/ijsem.0.006017
  snippet: 'enzymatic activities are present for: α-galactosidase, N-acetyl-β-glucosaminidase,
    arginine arylamidase, proline arylamidase, leucyl glycine arylamidase, phenylalanine
    arylamidase, leucine arylamidase, tyrosine arylamidase, alanine arylamidase, glycine
    arylamidase, histidine arylamidase, glutamyl glutamic acid arylamidase, serine
    arylamidase, valine arylamidase, cysteine arylamidase, esterase, esterase lipase,
    alpha-chymotrypsin'
  notes: Srinivasan et al. listed tyrosine arylamidase among enzymatic activities
    present in the Amygdalobacter indicium species description, supporting the API
    arylamidase row as a directly assayed bacterial enzyme-activity phenotype.
- reference: DOI:10.1128/JCM.40.9.3427-3431.2002
  snippet: When the API rapid ID32A system was used, all eight strains displayed activity
    for alanine arylamidase, arginine arylamidase, α-glucosidase, glycine arylamidase,
    histidine arylamidase, leucine arylamidase, leucylglycine arylamidase, proline
    arylamidase, phenylalanine arylamidase, serine arylamidase, and tyrosine arylamidase
  notes: Hall et al. reported tyrosine arylamidase activity in all eight Actinomyces
    cardiffensis clinical isolates tested with the API rapid ID32A system.
canonical_examples:
- taxon_id: NCBITaxon:3029272
  taxon_label: Amygdalobacter indicium
  note: Srinivasan et al. reported Amygdalobacter indicium as positive for tyrosine
    arylamidase activity in an enzyme activity panel.
  reference: DOI:10.1099/ijsem.0.006017
