- synonym_text: lecithinase reaction
  synonym_type: RELATED_SYNONYM
  source: DOI:10.2147/IDR.S365254
evidence:
- reference: DOI:10.2147/IDR.S365254
  snippet: all tested isolates were positive for lecithinase reaction and showed opaque
    zone around colonies on egg yolk agar
  notes: Algammal et al. used an egg-yolk agar lecithinase reaction to phenotype Bacillus
    cereus isolates.
- reference: DOI:10.1128/jb.81.6.939-945.1961
  snippet: egg yolk were used for the demonstration of lecithinase activity
  notes: Esselmann and Liu surveyed lecithinase production by Gram-negative bacteria
    on egg-yolk agar.
