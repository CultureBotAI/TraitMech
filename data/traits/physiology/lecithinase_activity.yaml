identifier: traitmech:000140
label: lecithinase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  lecithinases that hydrolyze lecithin or phosphatidylcholine.
definition_source: DOI:10.2147/IDR.S365254
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
