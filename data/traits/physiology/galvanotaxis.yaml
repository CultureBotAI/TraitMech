identifier: traitmech:000581
label: galvanotaxis
definition: A motile phenotype in which an organism biases its active movement in
  response to an electric field.
definition_source: DOI:10.1101/sqb.1988.053.01.006
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.1101/sqb.1988.053.01.006
  snippet: movement of a motile organism or cell in direct response to an electric
    current
  notes: Adler and Shi, publisher's freely accessible Excerpt, https://symposium.cshlp.org/content/53/23.short.
    The full paywalled paper was not accessed. The disposition requires active motility;
    passive electrophoretic displacement alone is insufficient.
- reference: DOI:10.1128/jb.178.4.1113-1119.1996
  snippet: motile Escherichia coli K-12 placed in an electric field swims toward the
    anode
  notes: Shi, Stocker and Adler, primary abstract (PMID:8576046), verified through
    Europe PMC. Rough K-12 and smooth Salmonella differ in direction; surface composition
    and capsules qualify the response. Only the abstract was accessed, not the full
    paper.
canonical_examples:
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  reference: DOI:10.1128/jb.178.4.1113-1119.1996
  note: The primary abstract reports anode-directed swimming of motile rough K-12
    cells. This is not a claim about every E. coli strain or an invariant direction
    across surface compositions.
- taxon_id: NCBITaxon:588858
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium str. 14028S
  reference: DOI:10.1038/s41564-024-01778-8
  note: 'Figure 5 and Supplementary Table 1: Green ST is IR715, a nalidixic-acid-resistant
    14028S derivative, carrying pGFT/RalFc. These fluorescent cells migrated toward
    the cathode at 2 V/cm in vitro. Do not substitute the SW473 flagellar mutant or
    the separate cheB mutant for this behavioral example.'
