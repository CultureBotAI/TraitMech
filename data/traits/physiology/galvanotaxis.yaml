discussions:
- discussion_id: galvanotaxis-orientation-and-mapping-boundaries
  prompt: Resolve electrical orientation mechanisms without equating active motility
    with passive drift.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: DOI:10.1128/jb.178.4.1113-1119.1996 proposes differential electrophoretic
    mobility of the body and flagellar filaments as an orientation model. DOI:10.1038/s41564-024-01778-8
    observes flagellar redistribution and a largely non-motile double mutant; it does
    not establish a universal receptor circuit or separate the individual flagellin
    contributions. A cheB mutant retains the electrical response. The source's weakly
    biased B. subtilis assay is not a robust canonical example. Physical orientation
    can guide powered locomotion, but fixed-cell drift alone is not this phenotype.
    QuickGO searches for galvanotaxis and electrotaxis found no exact term on 2026-10-03;
    MeSH Taxis Response is broader and excluded from xrefs. GO:0071973 grounds only
    the flagellar process.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: galvanotaxis-source-data-coordinate-convention
  prompt: Reconcile directedness signs before importing numerical source-data values.
  kind: CURATION_TODO
  status: OPEN
  rationale: 'Sun et al., Figure 5d and Results report negative directedness for E.
    coli and positive for Salmonella. The source workbook''s Fig. 5d,e sheet labels
    Red to anode and Green to cathode but contains opposite-signed cosine values.
    Direction labels agree with Figure 5c and the 1996 primary abstract; the coordinate
    conventions need reconciliation. No numerical directedness values are imported
    and no correction is inferred. Source: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41564-024-01778-8/MediaObjects/41564_2024_1778_MOESM10_ESM.xlsx'
  posed_by: codex
  posed_date: '2026-10-03'
