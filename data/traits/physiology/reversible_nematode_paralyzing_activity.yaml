identifier: traitmech:000722
label: reversible nematode-paralyzing activity
definition: A physiological capability of a microorganism to induce a loss of active
  nematode movement that reverses after exposure to the microorganism or its products
  ends.
definition_source: https://journals.flvc.org/nematropica/article/view/64427
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: https://journals.flvc.org/nematropica/article/view/64427
  snippet: Bioassays revealed that filtrates of P. lilacinus and Paecilomyces marquandii
    caused reversible paralysis of male and juvenile R. similis.
  notes: Kilama et al. 2007, English Abstract, printed page 215/PDF page 1. Direct
    publisher HTML/PDF and typeset match; native verifier skips URL references, not
    VERIFIED. Needle-probed immobilization at 2 h was followed by rinsing and reassessment
    labelled 21 h; Discussion says 21 h after rinsing. Bioassay 2 lacks recovery testing;
    bioassay 3 has a high-paralysis pH control and bioassay 5 is null against controls.
    Actual Figure 1 measures initial paralysis; Results/Table 2 address recovery.
    Repeated counts are not individual trajectories. No universal host/stage response
    or dose threshold is inferred.
- reference: https://horizon.documentation.ird.fr/exl-doc/pleins_textes/pleins_textes_5/pt5/nemato/27861.pdf
  snippet: Secondly, the majority of larvae are able to recover the mobility in fresh
    water following all treatment times up to 48 h.
  notes: 'Cayrol, Djian and Pijarowski 1989, Results, Study of the reversibility of
    the toxic effect, printed page 335/PDF page 5; actual Figure 3 inspected. This
    recovery result concerns M. arenaria larvae exposed to Brazilian P. lilacinus
    culture filtrate: 10-day motionless, aerated, illuminated malt culture, 15 g/L,
    undiluted filtrate, varied exposure, then 24 h in water. Needle probing and water/pH-matched
    medium controls are described. Summary says less than 48 h, Results through 48
    h; no universal threshold is adopted. Typeset all is quoted; PDF text extraction
    misreads it as dl. Native URL verification is skipped. This is recovery support,
    not a standalone producer-identity excerpt or proof of a neural mechanism.'
discussions:
- discussion_id: reversible-nematode-paralysis-scope-and-hierarchy
  prompt: Refine the hierarchy without losing the microbial actor and recovery requirement.
  kind: CURATION_TODO
  status: OPEN
  rationale: This is the microorganism's capability, not its own nonmotility or the
    nematode's susceptibility. Recovery after removal is required; immobility, reduced
    speed, reduced egg hatch, population suppression, trapping or attraction alone
    is insufficient. The same producer or product may kill under other conditions;
    no organism-level disjointness follows. Phenotype METPO:1000059 is the conservative
    parent. Lethal activity, fungal nematophagy, trap formation and attraction are
    related, not necessary parents. No exact active or deprecated METPO counterpart
    was identified in the documented pinned/current screen; v598 proposes the class.
    Nematostatic terminology, chemical roles and sequence annotations are not exact
    synonyms or xrefs. Infection, feeding and a particular molecular mechanism are
    not required.
  posed_by: codex
  posed_date: '2026-10-14'
- discussion_id: reversible-nematode-paralysis-source-and-mechanism-limits
  prompt: Resolve source discrepancies and strain provenance before adding taxa or
    mechanisms.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Kilama assigns 22R5-2 to both species in Methods, versus lilacinus 22R5-1/marquandii
    22R5-2 in Results/Figure 1 and marquandii 22R5-1 in Discussion. It also varies
    11N4-8/11N8-4 and 23N5-2/23N-5. Upper dose is 375 in Methods/Results but 325 in
    Table 2; lower dose is 125 in Methods/Table 2 but 150 in Results, in microliters/mL.
    These discrepancies are not silently corrected. Cayrol's proposed neurotropic
    action is unresolved, not a demonstrated target. No common active chemical, protein,
    causal graph, canonical taxon, field efficacy or environmental safety is asserted.
    Taxonomic authority and strain provenance remain unchecked for exemplar purposes.
    Source hashes, bounded notice checks, URL-verifier skips and inspection limits
    are retained in the verification sidecar. No full raw-data or statistical reanalysis
    was performed.
  posed_by: codex
  posed_date: '2026-10-14'
