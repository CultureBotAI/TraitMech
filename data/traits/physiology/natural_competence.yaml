identifier: traitmech:000087
label: natural competence
definition: A physiological state in which a cell takes up free extracellular DNA from
  the environment and integrates it into its genome (natural genetic transformation).
definition_source: DOI:10.1038/nrmicro3199
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
