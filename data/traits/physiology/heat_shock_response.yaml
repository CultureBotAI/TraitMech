discussions:
- discussion_id: heat-shock-response-xref-gap
  prompt: Resolve exact ontology xrefs for organism-level microbial heat shock response
    before adding TraitRecord xrefs.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0009408 response to heat can ground biological-process nodes but is
    broader than this organism-level stress response trait. Candidate heat-shock-protein,
    chaperone, and ATP-dependent-protease terms describe narrower molecular machinery
    rather than the whole response phenotype.
