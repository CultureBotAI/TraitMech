evidence:
- reference: DOI:10.3389/fmicb.2018.01148
  snippet: two enzymes secreted by a B. cereus RC6 strain that permits the degradation
    of casein
  notes: Ouertani et al. identify secreted Bacillus cereus RC6 proteases that degrade
    casein in a dairy-product context.
- reference: DOI:10.2174/1874285801408010025
  snippet: screened for enzyme production (caseinase, gelatinase, amylase, carboxymethyl
    cellulase, and esterase)
  notes: Alves et al. use caseinase as a reusable extracellular hydrolytic-enzyme
    phenotype while screening environmental microbial isolates.
