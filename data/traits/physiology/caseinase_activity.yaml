identifier: traitmech:000137
label: caseinase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  caseinase proteases that hydrolyze casein.
definition_source: DOI:10.3389/fmicb.2018.01148
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
