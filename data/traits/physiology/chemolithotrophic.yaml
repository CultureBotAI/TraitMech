identifier: METPO:1000639
label: chemolithotrophic
definition: A trophic type characterized by the use of inorganic chemical compounds
  as electron donors and carbon dioxide as the primary carbon source for energy generation
  and biosynthesis.
definition_source: DOI:10.1016/B978-0-12-378630-2.00219-X
