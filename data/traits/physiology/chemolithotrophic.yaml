identifier: METPO:1000639
label: chemolithotrophic
definition: A trophic type characterized by the use of inorganic chemical compounds
  as electron donors and carbon dioxide as the primary carbon source for energy generation
  and biosynthesis.
definition_source: DOI:10.1016/B978-0-12-378630-2.00219-X
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemolithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: chemolithotrophic bacteria and archaea
  notes: Review supports inorganic compound oxidation as chemolithotrophic growth.
- reference: DOI:10.1146/annurev.micro.55.1.485
  snippet: Chemolitho-autotrophic ammonia-oxidizing bacteria
  notes: Review supports ammonia oxidation as an example chemolithoautotrophic process.
- reference: PMID:12700255
  snippet: Nitrosomonas europaea
  notes: 'Organism example: Nitrosomonas europaea is the model chemolithotrophic ammonia-oxidizing
    bacterium, conserving energy from NH3 → NO2- oxidation (Chain et al. 2003, J Bacteriol,
    complete genome).'
