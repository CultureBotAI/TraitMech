  edges:
  - subject: chemolithotrophic_trait
    predicate: uses electron donor
    object: inorganic_chemical_donor
    description: Chemolithotrophy uses inorganic chemicals as electron donors.
    evidence:
    - reference: DOI:10.1016/B978-0-12-378630-2.00219-X
      snippet: oxidize inorganic atoms or molecules
      notes: Supports inorganic chemical oxidation as chemolithotrophy.
    predicate_id: METPO:2000009
  - subject: ammonia_monooxygenase
    predicate: oxidizes
    object: ammonia
    description: Ammonia monooxygenase initiates ammonia oxidation.
    evidence:
    - reference: DOI:10.1146/annurev.micro.55.1.485
      snippet: ammonia-oxidizing bacteria
      notes: Supports ammonia oxidation as a chemolithoautotrophic process.
    predicate_id: METPO:2000016
  - subject: ammonia
    predicate: oxidized to
    object: hydroxylamine
    description: Ammonia oxidation proceeds through hydroxylamine.
    evidence:
    - reference: DOI:10.1007/s00775-020-01820-0
      snippet: convert ammonia to hydroxylamine
      notes: Supports AMO-catalyzed ammonia-to-hydroxylamine conversion.
    predicate_id: METPO:2007405
  - subject: hydroxylamine
    predicate: oxidized to
    object: nitrite
    description: Hydroxylamine oxidation yields nitrite in ammonia oxidizers.
    evidence:
    - reference: DOI:10.3389/fmicb.2012.00210
      snippet: oxidation of hydroxylamine to nitrite
      notes: Supports hydroxylamine oxidation as the next nitrification step.
    predicate_id: METPO:2007405
  - subject: sox_enzyme_system
    predicate: oxidizes
    object: thiosulfate
    description: Sox proteins mediate oxidation of reduced sulfur compounds such as
      thiosulfate.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2009.00187.x
      snippet: oxidation of thiosulfate
      notes: Supports the Sox multienzyme system in lithotrophic sulfur oxidation.
    predicate_id: METPO:2000016
  - subject: inorganic_chemical_donor
    predicate: feeds electrons into
    object: respiratory_chain
    description: Oxidation of inorganic donors feeds electrons into respiratory chains.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: membrane-bound electron transport chain
      notes: Supports respiratory chains as energy-conserving redox systems.
    predicate_id: METPO:2007402
  - subject: respiratory_chain
    predicate: produces
    object: atp
    description: Respiratory energy conservation produces ATP.
    evidence:
    - reference: DOI:10.1016/j.bbabio.2008.09.008
      snippet: drives ATP synthesis
      notes: Supports ATP synthesis from the respiratory ion gradient.
    predicate_id: METPO:2000202
  - subject: calvin_benson_bassham_cycle
    predicate: mediates fixation of
    object: carbon_dioxide
    description: Chemolithoautotrophs fix CO2 via the Calvin-Benson-Bassham cycle.
    evidence:
    - reference: DOI:10.3390/microorganisms12030590
      notes: fixes atmospheric CO2 via the Calvin-Benson-Bassham (CBB) cycle
  - subject: acidification
    predicate: decreases
    object: nitrification_rate
    description: Environmental acidification reduces nitrification rates.
    evidence:
    - reference: DOI:10.1038/s41467-023-37104-9
      notes: a 5.8-18.1% drop and ~11.1-34.1% decline when pCO2 was doubled
    predicate_id: RO:0002212
  - subject: acidification
    predicate: stimulates generation of
    object: nitrous_oxide
    description: Acidification stimulates N2O byproduct generation during nitrification.
    evidence:
    - reference: DOI:10.1038/s41467-023-37104-9
      notes: Acidification also stimulate[s] generation of byproduct nitrous oxide
        (N2O)
