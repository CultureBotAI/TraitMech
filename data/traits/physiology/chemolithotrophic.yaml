identifier: METPO:1000639
label: chemolithotrophic
definition: A trophic type characterized by the use of inorganic chemical compounds
  as electron donors and carbon dioxide as the primary carbon source for energy generation
  and biosynthesis.
definition_source: DOI:10.1016/B978-0-12-378630-2.00219-X
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemolithotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: chemolithotrophic bacteria and archaea
  notes: Review supports inorganic compound oxidation as chemolithotrophic growth.
- reference: DOI:10.1146/annurev.micro.55.1.485
  snippet: Chemolitho-autotrophic ammonia-oxidizing bacteria
  notes: Review supports ammonia oxidation as an example chemolithoautotrophic process.
- reference: PMID:12700255
  snippet: Nitrosomonas europaea
  notes: 'Organism example: Nitrosomonas europaea is the model chemolithotrophic ammonia-oxidizing
    bacterium, conserving energy from NH3 → NO2- oxidation (Chain et al. 2003, J Bacteriol,
    complete genome).'
canonical_examples:
- taxon_id: NCBITaxon:915
  taxon_label: Nitrosomonas europaea
  note: ammonia-oxidising chemolithotroph
  reference: DOI:10.1128/jb.185.9.2759-2773.2003
- taxon_id: NCBITaxon:36861
  taxon_label: Thiobacillus denitrificans
  note: sulfur-oxidising chemolithotroph
  reference: DOI:10.1128/JB.188.4.1473-1488.2006
- taxon_id: NCBITaxon:228410
  taxon_label: Nitrosomonas europaea ATCC 19718
  note: Strain-level ammonia-oxidizing chemolithotroph paired to the AmoA alpha component
    of ammonia monooxygenase.
  reference: DOI:10.1128/jb.175.8.2436-2444.1993
causal_graphs:
- graph_id: chemolithotrophic_inorganic_oxidation
  title: Chemolithotrophic inorganic chemical oxidation
  description: DOI-backed graph for inorganic chemical electron donors, representative
    ammonia and sulfur oxidation, and respiratory energy conservation.
  scope_status: MECHANISTIC
  scope_notes: This graph combines ammonia- and sulfur-oxidation branches with carbon
    fixation. The N. europaea AmoA example anchors only ammonia oxidation; Q04507
    is the alpha component of a multisubunit ammonia monooxygenase and does not represent
    the complete enzyme or the Sox branch.
  nodes:
  - node_id: chemolithotrophic_trait
    label: chemolithotrophic
    node_type: TRAIT
    grounding: METPO:1000639
    description: Trophic type using inorganic chemicals for energy generation.
  - node_id: inorganic_chemical_donor
    label: inorganic chemical electron donor
    node_type: CHEMICAL
    description: Reduced inorganic chemical substrate.
  - node_id: ammonia
    label: ammonia
    node_type: CHEMICAL
    grounding: CHEBI:16134
    description: Representative reduced nitrogen electron donor.
  - node_id: ammonia_monooxygenase
    label: ammonia monooxygenase
    node_type: GENE_OR_PROTEIN
    description: Enzyme initiating aerobic ammonia oxidation.
    grounding: GO:0018597
    protein_examples:
    - uniprot_id: UniProtKB:Q04507
      protein_label: Ammonia monooxygenase alpha subunit
      gene_symbol: amoA1
      taxon_id: NCBITaxon:228410
      taxon_label: Nitrosomonas europaea ATCC 19718
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 126
      sequence_version: 2
      role: AmoA alpha-subunit component of the N. europaea ammonia monooxygenase;
        the accession maps two duplicated amoA gene copies and is not the whole enzyme
        complex.
      evidence:
      - reference: DOI:10.1128/jb.175.8.2436-2444.1993
        snippet: Sequence of the gene coding for ammonia monooxygenase in Nitrosomonas
          europaea
        notes: The primary study sequences and characterizes N. europaea AmoA and
          its ammonia-to-hydroxylamine activity; UniProtKB Q04507 is the reviewed
          strain-level alpha-subunit entry.
  - node_id: hydroxylamine
    label: hydroxylamine
    node_type: CHEMICAL
    description: Intermediate formed from ammonia oxidation.
    grounding: CHEBI:15429
  - node_id: nitrite
    label: nitrite
    node_type: CHEMICAL
    grounding: CHEBI:16301
    description: Oxidized nitrogen product of ammonia oxidation.
  - node_id: sox_enzyme_system
    label: Sox enzyme system
    node_type: GENE_OR_PROTEIN
    description: Sulfur-oxidizing multienzyme system.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Sox denotes a variable multienzyme pathway assembled from several
      distinct component families; no one protein-family term represents the complete
      generic system in this cross-branch graph.
  - node_id: thiosulfate
    label: thiosulfate
    node_type: CHEMICAL
