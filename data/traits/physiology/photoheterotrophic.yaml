identifier: METPO:1000657
label: photoheterotrophic
definition: A trophic type in which an organism uses light as the energy source and
  organic compounds as the primary carbon source for biosynthesis.
definition_source: DOI:10.1016/B978-012373944-5.00083-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
