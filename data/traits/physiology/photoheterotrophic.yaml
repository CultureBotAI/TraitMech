causal_graphs:
- graph_id: photoheterotrophic_light_organic_carbon
  title: Photoheterotrophic light-supported organic carbon assimilation
  description: DOI-backed graph linking light capture, bacteriochlorophyll reaction
    centers, photosynthetic electron transport, ATP generation, and organic carbon
    assimilation.
  scope_status: MECHANISTIC
  scope_notes: The graph presents bacteriochlorophyll reaction-center and proteorhodopsin
    branches as alternative photoheterotrophic mechanisms. The R. rubrum example anchors
    the Type II reaction-center branch and does not represent rhodopsin-based phototrophy.
  nodes:
  - node_id: photoheterotrophic_trait
    label: photoheterotrophic
    node_type: TRAIT
    grounding: METPO:1000657
    description: Trophic type using light energy and organic carbon for biosynthesis.
  - node_id: light
    label: light
    node_type: ENVIRONMENTAL_FACTOR
    description: Energy input harvested by photoheterotrophs.
    grounding: PATO:0001717
  - node_id: bacteriochlorophyll
    label: bacteriochlorophyll
    node_type: CHEMICAL
    description: Light-harvesting pigment in many anoxygenic photoheterotrophs.
    grounding: CHEBI:38201
  - node_id: photosynthetic_reaction_center
    label: photosynthetic reaction center
    node_type: GENE_OR_PROTEIN
    description: Pigment-protein complex initiating photochemical charge separation.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This node denotes a multisubunit photosynthetic complex across
      distinct Type I and Type II families; no single protein-family term represents
      the generic complex.
    protein_examples:
    - uniprot_id: UniProtKB:P10717
      protein_label: Reaction center protein L chain
      gene_symbol: pufL
      taxon_id: NCBITaxon:1085
      taxon_label: Rhodospirillum rubrum
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 119
      sequence_version: 2
      role: L-chain component of the R. rubrum Type II photochemical reaction center;
        this accession is not presented as the complete reaction-center complex.
      evidence:
      - reference: DOI:10.1128/jb.182.5.1200-1207.2000
        snippet: The proteins of the photochemical components are encoded by the puf
          operon (LHalpha, LHbeta, RC-L, and RC-M) and by puhA (RC-H)
        notes: The primary R. rubrum assembly study identifies RC-L as a puf-encoded
          reaction-center component and reports phototrophic incompetence of puf mutants;
          UniProtKB P10717 is the reviewed species-level PufL entry.
  - node_id: photosynthetic_electron_transport
