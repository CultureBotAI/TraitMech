  snippet: light and reduced organic compounds
  notes: Encyclopedia chapter defines photoheterotrophy by light energy and reduced
    organic carbon.
- reference: DOI:10.1128/AEM.01747-12
  snippet: accumulated 25% to 110% more biomass
  notes: Experimental AAP study supports light-enhanced assimilation of supplied organic
    carbon.
