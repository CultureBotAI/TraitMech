  action: MIGRATE_MICROBE_DOMAIN_EDGES
  changes: Re-grounded 4 causal edge(s) off microbe-domain METPO predicates (1 to
    has energy source, 2 to has output, 1 to has carbon source), issue 301. The previous
    predicates are transitively rdfs:subPropertyOf METPO:2000001, whose rdfs:domain
    is METPO:1000525 (microbe), so a causal-graph subject entailed that the subject
    IS a microbe; CausalNodeTypeEnum has no organism member, so no such edge could
    ever satisfy the domain. Edge directions are unchanged - this pass only relabels
    and re-grounds. RO:0002234 (has output) is used where the subject is an activity,
    since biolink gives it the domain 'biological process or activity'; the METPO
    replacements are proposed in proposals/metpo_traitmech_v8 and v9 and are placeholder
    ids until METPO mints them.
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): photosynthetic_electron_transport is typed PATHWAY. PATHWAY
    is a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is
    everything else. A named route in every record that carries it, though NOT THE
    SAME ROUTE, which is why no single step list belongs in this rationale. metabolism/phototrophy.yaml
    enumerates the oxygenic form (''Electron flow from water through PSII, cytochrome
    b6f and PSI''); photoheterotrophic.yaml and photoorganoheterotrophic.yaml cover
    ANOXYGENIC phototrophy -- one reaction centre, cyclic flow, no water oxidation
    -- and say the neutral thing on purpose. Quoting the oxygenic steps at them would
    assert biology they specifically do not claim (#400 review). Both forms are named
    routes whose steps a curator could list, which is the test. Was 5 PATHWAY to 1
    before this tranche.'
  llm_assisted: true
