identifier: METPO:1000657
label: photoheterotrophic
definition: A trophic type in which an organism uses light as the energy source and
  organic compounds as the primary carbon source for biosynthesis.
definition_source: DOI:10.1016/B978-012373944-5.00083-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: photoheterotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: photoheterotrophy
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Luke Wang
evidence:
- reference: DOI:10.1016/B978-012373944-5.00083-3
  snippet: light and reduced organic compounds
  notes: Encyclopedia chapter defines photoheterotrophy by light energy and reduced
    organic carbon.
- reference: DOI:10.1128/AEM.01747-12
  snippet: accumulated 25% to 110% more biomass
  notes: Experimental AAP study supports light-enhanced assimilation of supplied organic
    carbon.
