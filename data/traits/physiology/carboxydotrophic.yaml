identifier: METPO:1000633
label: carboxydotrophic
definition: A trophic type in which an organism derives energy from the oxidation
  of carbon monoxide.
definition_source: DOI:10.1038/nrmicro1595
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
evidence:
- reference: DOI:10.1038/nrmicro1595
  snippet: Carbon monoxide (CO) supports the growth and metabolism
  notes: Review supports aerobic CO oxidation as an energy-supporting metabolism.
- reference: DOI:10.1111/j.1574-6968.1986.tb01858.x
  snippet: presence of the enzyme CO dehydrogenase
  notes: Review supports CODH and CO-insensitive respiratory-chain features in aerobic
    carboxydotrophs.
canonical_examples:
- taxon_id: NCBITaxon:129958
  taxon_label: Carboxydothermus hydrogenoformans
  note: Thermophilic hydrogenogenic CO oxidiser (CO + H2O -> CO2 + H2). Afipia/Oligotropha
    carboxidovorans is the aerobic CO-oxidiser model.
  reference: PMID:16311624
