      notes: Supports terminal oxidase adaptation for CO metabolism.
    predicate_id: RO:0002502
  - subject: respiratory_chain
    predicate: generates
    object: proton_motive_force
    description: Respiratory CO oxidation conserves energy as proton motive force.
    evidence:
    - reference: DOI:10.1111/j.1574-6968.1986.tb01858.x
      snippet: pmf-driven reversed electron transfer
      notes: Supports pmf involvement in aerobic carboxydotrophic energy metabolism.
    predicate_id: biolink:produces
  - subject: proton_motive_force
    predicate: drives formation of
    object: reduced_pyridine_nucleotides
    description: Reverse electron transfer can form reduced pyridine nucleotides.
    evidence:
    - reference: DOI:10.1111/j.1574-6968.1986.tb01858.x
      snippet: formation of reduced pyridine nucleotides
      notes: Supports pmf-driven reverse electron transfer output.
    predicate_id: biolink:produces
  - subject: nife_codh
    predicate: has quality
    object: oxygen_sensitivity
    description: Ni,Fe-CODHs are oxygen sensitive, restricting them to anaerobic carboxydotrophs.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: Ni,Fe-CODHs are noted as oxygen sensitive and associated with anaerobic
        carboxydotrophs.
  - subject: molybdenum_hydroxylase
    predicate: has quality
    object: oxygen_tolerance
    description: Cu,Mo-CODHs are O2-tolerant, enabling aerobic CO metabolism.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: Cu,Mo-CODHs are O2-tolerant (aerobic CO metabolism).
  - subject: cox_operon
    predicate: encodes
    object: molybdenum_hydroxylase
    description: cox operons encode the coxS/coxM/coxL aerobic Mo-CODH subunits.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: Mo-CODH is encoded in cox operons that include coxS, coxM, and coxL.
    predicate_id: METPO:2007813
  - subject: coo_operon
    predicate: encodes
    object: nife_codh
    description: coo operons encode Ni,Fe-CODH plus accessory proteins for energy
      conservation.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: coo operons specifically encode CODH plus accessory proteins for energy
        conservation.
    predicate_id: METPO:2007813
  - subject: cooa_regulator
    predicate: activates transcription of
    object: coo_operon
    description: CO binding to CooA Fe(II)-heme allosterically activates coo operon
      transcription.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: CO binding to Fe(II)-heme allosterically activates promoter binding and
        RNAP recruitment of coo operons.
  - subject: rcom_regulator
    predicate: regulates
    object: cox_operon
    description: RcoM is a high-affinity CO sensor regulating aerobic coxMSL genes.
    evidence:
    - reference: DOI:10.1128/jb.00332-22
      notes: RcoM regulates aerobic CO oxidation and was originally identified upstream
        of coxMSL genes.
    predicate_id: RO:0002211
  - subject: proton_motive_force
    predicate: powers
    object: atp_synthase
    description: The ion motive force generated by CO oxidation drives ATP synthase.
    evidence:
    - reference: DOI:10.1186/s40643-023-00705-9
      notes: Generates an ion motive force that drives ATP synthesis.
  - subject: molybdenum_hydroxylase
    predicate: coupled to reduction of
    object: dioxygen
    description: Mo-CODH-mediated CO oxidation is coupled to O2 reduction aerobically.
    evidence:
    - reference: DOI:10.1101/2023.01.17.524042
      notes: Mo-CODH-mediated CO oxidation supports O2 reduction aerobically.
