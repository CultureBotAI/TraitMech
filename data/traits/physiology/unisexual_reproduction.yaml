identifier: traitmech:000613
label: unisexual reproduction
definition: A fungal phenotype enabling sexual or parasexual reproduction with genetic
  contribution from only one mating type.
definition_source: DOI:10.1371/journal.pgen.1003688
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1371/journal.pgen.1003688
  snippet: Sexual reproduction involves cells of either opposite (bisexual) or one
    (unisexual) mating type.
  notes: 'Feretzaki and Heitman (2013), PMID:23966871, PMC3744442. Exact sentence
    of the directly retrieved scientific abstract (abstract1), not the separate Author
    Summary. Introduction s1 also includes Candida unisexual reproduction and helper-cell
    stimulation. Results s2g/s2h and Methods s4a/s4f were read in XML: reduced sporulation
    in Spo11/Ubc5 mutants is distinct from hyphal growth, and Ubc5''s precise role
    remains unresolved. Do not universalize one diploidization route or timing. Actual
    figures, complete tables, supplements and other experimental sections remain uninspected;
    no protein-level dependency is asserted here. Species names follow the paper.'
- reference: DOI:10.1038/nature03448
  snippet: Furthermore, fusion and meiosis can occur between non-isogenic alpha strains,
    enabling genetic exchange.
  notes: 'Lin, Hull and Heitman (2005), PMID:15846346. Exact sentence from the scientific
    abstract directly retrieved through Europe PMC core metadata. The API uses the
    word alpha. Cryptococcus same-type partners need not be genetically identical:
    this supports outcrossing within a mating type, not obligatory clonal selfing.
    Diploidization and meiosis distinguish the reported fruiting from purely mitotic
    growth. Full text, methods, figures, supplements and natural strain provenance
    remain uninspected; no canonical example is inferred.'
- reference: DOI:10.1038/nature08252
  snippet: could be induced to undergo chromosome loss to produce diploid cells, thereby
    completing a parasexual mating cycle
  notes: 'Alby et al. (2009), PMID:19675652, PMC2866515. Exact main-text clause retrieved
    via NCBI PMC efetch after Europe PMC full-text failure, not an abstract quote.
    All main-text paragraphs and Methods Summary were read; Figures 3/4 and Supplementary
    Figure 7 were visually inspected. Marked opaque Candida a-a partners form tetraploids.
    Supplement pp. 6-7/15 reports sorbose-induced ploidy reduction, including near-diploid
    and intermediate progeny, not uniform restoration of euploidy. Bar1-deletion assays
    and helper-stimulated wild-type mating are distinct: opposite-type pheromone helpers
    need not contribute genomes. Other figures and supplement sections remain uninspected.
    Engineered or marked strains are not promoted to natural canonical examples.'
- reference: DOI:10.1371/journal.pbio.1001653
  snippet: generates abundant hyphae, homozygous diploid intermediates, and haploid
    meiotic spores when grown on mating-inducing media all by itself.
  notes: Ni et al. (2013), PMID:24058295, PMC3769227. Exact Results s2a clause, not
    an abstract quote; its subject is XL280alpha. Scientific abstract, author summary,
    Results s2a and Methods s4b were read directly in XML. Solo culture on V8 or filament
    agar followed by spore isolation supports selfing in this laboratory F1 derivative
    of B3501alpha and JEC20a. Natural ancestral isolates do not make XL280 a natural
    exemplar. The paper does not resolve cell fusion versus endoreplication into one
    obligatory route. Actual figures, supplements including Table S4, and other experimental
    sections remain uninspected. Aneuploidy and adaptive benefit are not defining
    requirements of the whole trait.
discussions:
- discussion_id: unisexual-reproduction-scope-and-hierarchy
  prompt: Keep mating-type contribution distinct from selfing, helper cells and MAT
    inventory.
  kind: CURATION_TODO
  status: OPEN
  rationale: 'One mating type does not mean one strain: non-isogenic same-type partners
    can exchange genetic material. Solo selfing overlaps homothallism (traitmech:000609),
    but the whole class is not restricted to single-isolate self-fertility. It is
    not a subclass of parasexuality (traitmech:000607), because meiotic cycles are
    also included. Pheromone-producing opposite-type helper cells are not necessarily
    genetic contributors, so do not require their physical absence. Use released phenotype
    METPO:1000059 in both record and proposal; PHYSIOLOGY is only a filesystem category.
    MAT sequence content, population mating-type bias or hyphae alone do not establish
    reproductive completion. Do not require universal meiosis, spores, cell fusion,
    clonality or absence of outcrossing. Resolve context-dependent same-sex mating
    terminology and external phenotype/process mappings before adding synonyms or
    xrefs.'
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: unisexual-reproduction-mechanism-and-examples
  prompt: Resolve native examples and taxon-specific reproductive mechanisms before
    graphing.
  kind: CURATION_TODO
  status: OPEN
  rationale: Complete unread primary experiments and supplements before expanding
    mechanistic claims. Keep solo meiosis, non-isogenic same-type fusion and parasexual
    chromosome loss separate. Hyphal growth, cell fusion, ploidy change and viable
    progeny are different readouts, not interchangeable proof of a completed cycle.
    XL280 is a laboratory-cross derivative; Candida deletion and marked strains also
    do not establish natural canonical provenance. Verify natural strains and current
    taxonomic authority before adding examples, and native protein accessions before
    causal edges. No graph or unverified taxon/protein CURIE is asserted. Manual full-text
    matching is not an abstract-resolver VERIFIED verdict.
  posed_by: codex
  posed_date: '2026-10-04'
