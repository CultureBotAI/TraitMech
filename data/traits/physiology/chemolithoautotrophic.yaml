identifier: METPO:1000637
label: chemolithoautotrophic
definition: A trophic type in which an organism obtains energy from oxidation of inorganic
  compounds (lithotrophy) and carbon from carbon dioxide.
definition_source: DOI:10.1146/annurev.micro.52.1.191
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemolithoautotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1146/annurev.micro.52.1.191
  snippet: physiology ... of chemoautotrophic bacteria
  notes: Review supports chemoautotrophic bacterial CO2 fixation.
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: growth-supporting reductant and energy source
  notes: Review supports inorganic reductants as energy sources for chemolithotrophic
    growth.
