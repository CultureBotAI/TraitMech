  prompt: Resolve an exact external ontology class for alpha-chymotrypsin activity
    before adding a TraitRecord xref.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0004263 chymotrypsin activity is obsolete, and its replacement GO:0004252
    denotes broader serine-type endopeptidase molecular function rather than the organism-level
    chymotrypsin-like serine endopeptidase phenotype. GO:0004252 is appropriate as
    a causal-node grounding for generic serine-type endopeptidase activity, not as
    an equivalent TraitRecord xref.
  posed_by: codex
  posed_date: '2026-09-12'
