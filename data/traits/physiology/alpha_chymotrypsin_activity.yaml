identifier: traitmech:000159
label: alpha-chymotrypsin activity
definition: A physiological enzyme-activity phenotype in which a cell exhibits chymotrypsin-like
  serine endopeptidase activity, preferentially cleaving peptide bonds on the carboxyl
  side of tyrosine, tryptophan, phenylalanine, or leucine residues.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/1.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: alpha-chymotrypsin
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1099/ijsem.0.006017
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/21/1.html
  snippet: '<b>Reaction:</b> Preferential cleavage: Tyr<img src="../../../EZgif/FISS.GIF"
    align=top>, Trp<img src="../../../EZgif/FISS.GIF" align=top>, Phe<img src="../../../EZgif/FISS.GIF"
    align=top>, Leu<img src="../../../EZgif/FISS.GIF" align=top>'
  notes: The NC-IUBMB EC 3.4.21.1 entry accepts the name chymotrypsin and its reaction
    line places the scissile-bond FISS.GIF image immediately after Tyr, Trp, Phe,
    and Leu.
- reference: DOI:10.1099/ijsem.0.006017
  snippet: 'enzymatic activities are present for: α-galactosidase, N-acetyl-β-glucosaminidase,
    arginine arylamidase, proline arylamidase, leucyl glycine arylamidase, phenylalanine
    arylamidase, leucine arylamidase, tyrosine arylamidase, alanine arylamidase, glycine
    arylamidase, histidine arylamidase, glutamyl glutamic acid arylamidase, serine
    arylamidase, valine arylamidase, cysteine arylamidase, esterase, esterase lipase,
    alpha-chymotrypsin'
  notes: Srinivasan et al. listed alpha-chymotrypsin among enzymatic activities present
    in the Amygdalobacter indicium species description, consistent with the positive
    API ZYM table row for both assayed A. indicium strains.
- reference: DOI:10.1128/jb.169.8.3778-3784.1987
  snippet: Protease A and protease B are extracellular proteins which are secreted
    by Streptomyces griseus. The genes encoding protease A (sprA) and protease B (sprB)
    were isolated from an S. griseus genomic library by using a synthetic oligonucleotide
    probe. Fragments containing sprA and sprB were characterized by hybridization
    and demonstration of proteolytic activity in Streptomyces lividans.
  notes: Henderson et al. cloned and characterized the Streptomyces griseus sprA gene
    encoding extracellular chymotrypsin-like serine protease A / streptogrisin-A (UniProtKB:P00776).
canonical_examples:
- taxon_id: NCBITaxon:3029272
  taxon_label: Amygdalobacter indicium
  note: Srinivasan et al. reported Amygdalobacter indicium as positive for alpha-chymotrypsin
    activity in the API ZYM enzyme activity panel.
  reference: DOI:10.1099/ijsem.0.006017
- taxon_id: NCBITaxon:1911
  taxon_label: Streptomyces griseus
  note: Henderson et al. cloned and characterized the Streptomyces griseus sprA gene
    encoding extracellular chymotrypsin-like serine protease A (streptogrisin-A; SprA).
  reference: DOI:10.1128/jb.169.8.3778-3784.1987
