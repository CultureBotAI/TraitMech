identifier: METPO:1000638
label: chemolithoheterotrophic
definition: A trophic type characterized by the use of inorganic chemical compounds
  as electron donors for energy generation while utilizing organic compounds as the
  primary carbon source.
definition_source: DOI:10.1038/s41598-021-81412-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemolithoheterotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.1038/s41598-021-81412-3
  snippet: chemolithoheterotrophy
  notes: Experimental study supports chemolithoheterotrophy as Fe(II) oxidation for
    energy with glucose as carbon source.
- reference: DOI:10.1128/mBio.01112-19
  snippet: oxidize sulfur to fuel the uptake of organic compounds
  notes: Study supports sulfur oxidation coupled to organic compound uptake in a chemolithoheterotrophic
    symbiont context.
canonical_examples:
- taxon_id: NCBITaxon:317655
  taxon_label: Sphingopyxis alaskensis RB2256
  note: Strain-level facultative chemolithoheterotrophic example that oxidizes H2
    during aerobic growth on organic carbon, paired to its group 2a hydrogenase large
    subunit.
  reference: DOI:10.1038/s41564-023-01322-0
causal_graphs:
- graph_id: chemolithoheterotrophic_inorganic_energy_organic_carbon
  title: Chemolithoheterotrophic inorganic chemical energy and organic carbon use
  description: DOI-backed graph linking inorganic chemical electron donors, Fe(II)
    and reduced sulfur examples, respiratory energy conservation, organic carbon uptake,
    and biomass.
  scope_status: MECHANISTIC
  scope_notes: This modular graph covers Fe(II), reduced-sulfur, and H2 donor branches
    coupled to organic-carbon assimilation. The S. alaskensis example anchors only
    the H2 branch; Q1J422 is the catalytic large-subunit component of its group 2a
    hydrogenase, not the complete multisubunit enzyme or the sulfur/iron branches.
  nodes:
  - node_id: chemolithoheterotrophic_trait
    label: chemolithoheterotrophic
    node_type: TRAIT
    grounding: METPO:1000638
    description: Trophic type using inorganic chemical electron donors and organic
      carbon.
  - node_id: inorganic_chemical_donor
    label: inorganic chemical donor
    node_type: CHEMICAL
    description: Reduced inorganic chemical supplying electrons and energy.
  - node_id: ferrous_iron
    label: ferrous iron
    node_type: CHEMICAL
    description: Fe(II), an inorganic chemical energy source.
    grounding: CHEBI:29033
  - node_id: reduced_sulfur_compound
    label: reduced sulfur compound
    node_type: CHEMICAL
    description: Inorganic sulfur electron donor such as sulfide or thiosulfate.
  - node_id: molecular_hydrogen
    label: molecular hydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
    description: Reduced inorganic gas oxidized as a supplementary energy source during
      lithoheterotrophic growth.
  - node_id: organic_compound
    label: organic compound
    node_type: CHEMICAL
    description: Organic carbon source used for biosynthesis.
    grounding: CHEBI:50860
  - node_id: respiratory_chain
    label: respiratory chain
    node_type: PATHWAY
    description: Electron-transfer pathway conserving energy from donor oxidation.
    grounding: GO:0022904
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Electrochemical ion gradient generated by respiratory electron transport.
    grounding: METPO:1007500
  - node_id: atp
    label: ATP
    node_type: CHEMICAL
    grounding: CHEBI:30616
    description: Energy carrier produced from proton motive force.
  - node_id: nutrient_uptake
    label: organic nutrient uptake
    node_type: BIOLOGICAL_PROCESS
    description: Uptake of external organic compounds.
  - node_id: biomass
    label: biomass
    node_type: CHEMICAL
    description: Cell material formed from organic carbon.
    grounding: METPO:1007501
  - node_id: sox_pathway
    label: Sox sulfur-oxidation pathway
    node_type: PATHWAY
    description: soxCDYZAXB gene cluster mediating complete oxidation of thiosulfate
      to sulfate.
  - node_id: thiosulfate
    label: thiosulfate
    node_type: CHEMICAL
    description: Reduced inorganic sulfur electron donor oxidized to sulfate.
    grounding: CHEBI:16094
  - node_id: sulfate
    label: sulfate
    node_type: CHEMICAL
    description: Fully oxidized sulfur end product of sulfur-compound oxidation.
    grounding: CHEBI:16189
  - node_id: branched_thiosulfate_oxidation
    label: branched thiosulfate oxidation pathway
    node_type: PATHWAY
    description: Truncated Sox plus reverse Dsr/Apr/Sat oxidizing thiosulfate via
      an elemental sulfur intermediate.
  - node_id: elemental_sulfur
    label: elemental sulfur
    node_type: CHEMICAL
    description: S0 intermediate of branched sulfur-compound oxidation.
    grounding: CHEBI:26833
  - node_id: organic_carbon_importer
    label: organic carbon import system
    node_type: GENE_OR_PROTEIN
    description: Amino acid and carboxylic acid import systems mediating organic carbon
      uptake.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This aggregate node spans unrelated amino-acid, carboxylate,
      TRAP, ABC, and other uptake systems; the cited comparative study does not identify
      one transporter family that represents the whole label.
  - node_id: group_2a_nife_hydrogenase
    label: group 2a [NiFe]-hydrogenase
    node_type: GENE_OR_PROTEIN
    description: Plasmid-borne multisubunit uptake hydrogenase used for aerobic H2
      oxidation by S. alaskensis RB2256.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Available InterPro terms cover broad NiFe hydrogenase large-subunit
      families rather than this complete group 2a multisubunit enzyme; the exact catalytic
      component is retained as the taxon-paired protein example.
    protein_examples:
    - uniprot_id: UniProtKB:Q1J422
      protein_label: Group 2a [NiFe]-hydrogenase large subunit HucL
      gene_symbol: Sala_3198
      taxon_id: NCBITaxon:317655
      taxon_label: Sphingopyxis alaskensis RB2256
      entry_status: UNREVIEWED
      proteome_id: UP000006578
      retrieved_on: '2026-08-24'
      entry_version: 98
      sequence_version: 1
      role: Catalytic large-subunit component of the plasmid-borne group 2a [NiFe]-hydrogenase;
        this accession is not presented as the complete hydrogenase complex.
      evidence:
      - reference: DOI:10.1038/s41564-023-01322-0
        snippet: group 2a [NiFe]-hydrogenase large subunit gene (hucL; locus Sala_3198)
        notes: The primary study measured Sala_3198 expression during aerobic growth
          and H2 oxidation. UniProtKB Q1J422 maps that exact locus to the S. alaskensis
          RB2256 reference proteome.
