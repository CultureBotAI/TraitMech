evidence:
- reference: DOI:10.1038/s41598-021-81412-3
  snippet: chemolithoheterotrophy
  notes: Experimental study supports chemolithoheterotrophy as Fe(II) oxidation for
    energy with glucose as carbon source.
- reference: DOI:10.1128/mBio.01112-19
  snippet: oxidize sulfur to fuel the uptake of organic compounds
  notes: Study supports sulfur oxidation coupled to organic compound uptake in a chemolithoheterotrophic
    symbiont context.
