identifier: METPO:1000638
label: chemolithoheterotrophic
definition: A trophic type characterized by the use of inorganic chemical compounds
  as electron donors for energy generation while utilizing organic compounds as the
  primary carbon source.
definition_source: DOI:10.1038/s41598-021-81412-3
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: chemolithoheterotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Anthea Guo
evidence:
- reference: DOI:10.1038/s41598-021-81412-3
  snippet: chemolithoheterotrophy
  notes: Experimental study supports chemolithoheterotrophy as Fe(II) oxidation for
    energy with glucose as carbon source.
- reference: DOI:10.1128/mBio.01112-19
  snippet: oxidize sulfur to fuel the uptake of organic compounds
  notes: Study supports sulfur oxidation coupled to organic compound uptake in a chemolithoheterotrophic
    symbiont context.
