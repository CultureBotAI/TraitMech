    evidence:
    - reference: DOI:10.1038/s41396-021-01163-x
      notes: Gene clusters of the conserved soxCDYZAXB gene order facilitate the complete
        oxidation of thiosulfate to sulfate, without free intermediates.
    predicate_id: RO:0002234
  - subject: thiosulfate
    predicate: oxidized by
