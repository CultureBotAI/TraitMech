identifier: traitmech:000194
label: aerobic anoxygenic phototrophy
definition: A photoheterotrophy in which aerobic heterotrophic bacteria use bacteriochlorophyll-containing
  reaction centers to harvest light as auxiliary energy while requiring organic carbon
  substrates for growth.
definition_source: DOI:10.1128/AEM.01747-12
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000657
- traitmech:000035
- METPO:1000602
