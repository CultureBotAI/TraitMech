- synonym_text: aerobic anoxygenic phototroph
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/AEM.01747-12
- synonym_text: aerobic anoxygenic phototrophic bacteria
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1186/s40168-024-01786-0
- synonym_text: AAP bacteria
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1186/s40168-024-01786-0
- synonym_text: aerobic_anoxygenic_phototrophy
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1128/AEM.01747-12
  snippet: Aerobic anoxygenic phototrophs contain photosynthetic reaction centers
    composed of bacteriochlorophyll
  notes: Hauruseu and Koblizek define AAPs by bacteriochlorophyll-containing photosynthetic
    reaction centers.
- reference: DOI:10.1128/AEM.01747-12
  snippet: These organisms are photoheterotrophs, as they require organic carbon substrates
    for their growth whereas light-derived energy has only an auxiliary function
  notes: The Erythrobacter sp. NAP1 chemostat study supports organic carbon as required
    for AAP growth and light as an auxiliary energy input.
- reference: DOI:10.1186/s40168-024-01786-0
  snippet: Aerobic anoxygenic phototrophic (AAP) bacteria are heterotrophic bacteria
    that supply their metabolism with light energy harvested by bacteriochlorophyll-a-containing
    reaction centers
  notes: Villena-Alemany et al. corroborate the AAP scope as heterotrophic bacteria
    with light-harvesting bacteriochlorophyll-a reaction centers.
- reference: DOI:10.1186/s40793-024-00573-6
  snippet: Aerobic anoxygenic phototrophs (AAPs) are a polyphyletic group of bacteria
    capable of photoheterotrophy
  notes: Stojan et al. place AAPs as a polyphyletic bacterial photoheterotrophic functional
    group rather than a taxonomic lineage.
canonical_examples:
