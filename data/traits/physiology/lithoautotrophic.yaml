identifier: METPO:1000647
label: lithoautotrophic
definition: A trophic type in which an organism obtains energy from inorganic electron
  donors and carbon from carbon dioxide.
definition_source: DOI:10.1128/AEM.02473-10
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: lithoautotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/B978-0-12-378630-2.00219-X
  snippet: inorganic atoms or molecules
  notes: Review supports inorganic compounds as reductants for lithotrophic growth.
- reference: DOI:10.1128/AEM.02473-10
  snippet: autotrophic CO2 fixation
  notes: Review supports CO2 fixation as the autotrophic carbon-assimilation process.
