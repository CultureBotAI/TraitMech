identifier: traitmech:000624
label: paedogamy
definition: A sexual-reproduction phenotype in which two gametes produced by division
  within a single gametangium fuse with each other.
definition_source: DOI:10.1080/0269249X.2013.791344
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- traitmech:000625
synonyms:
- synonym_text: pedogamy
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3390/d14121133
evidence:
- reference: DOI:10.1080/0269249X.2013.791344
  snippet: fusion of two gametes within a single gametangium
  notes: Kaczmarska et al. (2013), p.271, section 5.2.1, contiguous definition phrase
    in the directly read author-posted full text at https://www.researchgate.net/publication/259079699_Proposals_for_a_terminology_for_diatom_sexual_reproduction_auxospores_and_resting_stages.
    Cytokinesis distinguishes gametes from the undivided-cell nuclear fusion of section
    5.2.2. Section 5.2 treats both as automixis, not equivalent names. This is terminology
    synthesis, not independent experimental replication of its cited Neidium study.
    Actual diagrams were not visually inspected. Do not make meiosis-I cytokinesis
    or immediate gametic-nuclear fusion universal requirements.
- reference: DOI:10.3390/d14121133
  snippet: Afterwards, the protoplasts (gametes) fused to form a zygote (auxospore)
  notes: 'Bagmet et al. (2022), Results 3.3, p.9, clause before the Figure 3J,K citation,
    checked in publisher XML and typeset PDF. Abstract, Methods 2.1-2.5, Results 3.3,
    Discussion 4.1 and Table S1 were read; actual Figure 3 and pp.8-9 were inspected.
    Four clones were active: VCA-7, VCA-48, VCA-49 and VCA-51; VCA-50 and VCA-52 showed
    no mating. The authors call this pedogamy. Preserve their apparently-qualified
    interpretation of earlier Figure 3G,H; do not infer tracked nuclear fusion from
    chloroplast images. Seasonal observations and unsuccessful salt stimulation are
    study-specific. Plastid rbcL comparisons do not establish absence of genomic recombination.'
- reference: DOI:10.1007/s12223-008-0018-x
  snippet: The gametic nuclei fused after auxospore expansion had begun.
  notes: Poulickova (2008), PMID:18500631, scientific abstract directly retrieved
    from Europe PMC and PubMed. Unpaired Neidium cf. ampliatum cells differentiated
    into gametangia and underwent pedogamy. The quoted timing cautions against conflating
    gamete fusion with immediate nuclear fusion. Full text, actual figures and strain
    provenance remain unread. Preserve cf.; no exact species mapping or canonical
    Neidium example is asserted.
