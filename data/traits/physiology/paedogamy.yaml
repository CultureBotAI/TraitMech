discussions:
- discussion_id: paedogamy-scope-and-hierarchy
  prompt: Separate gamete-cell fusion from autogamy and broader selfing.
  kind: CURATION_TODO
  status: OPEN
  rationale: Use the single-gametangium gamete-fusion sense established in the cited
    diatom literature. Autogamy traitmech:000622 denotes gametic-nuclear fusion in
    an unpaired undivided cell, without fusion of separate gametes; cytogamy traitmech:000623
    concerns paired cells without nuclear exchange. Automixis is broader in Kaczmarska
    et al. section 5.2 and is not an exact synonym. Bagmet et al. calls automixis
    homothallic, whereas our existing homothallism traitmech:000609 is fungal-scoped;
    this usage does not make that record a parent. The parent gap is resolved by automixis
    traitmech:000625, whose single-meiotic-cell nuclear origin includes this operational
    scope. The broader terminology and mapping questions keep this discussion OPEN.
    Do not infer species-level disjointness or universal homozygosity, recombination
    rate, seasonal trigger or inability to outcross. Broader non-diatom usage and
    external equivalences need primary source review before expanding this operational
    scope.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: paedogamy-mechanism-and-coverage
  prompt: Resolve nuclear cytology and molecular mechanisms beyond morphology.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: This is a reproductive phenotype, not a literal locus or a plastid-marker
    sequence feature. The directly inspected microscopy supports a gamete-fusion interpretation
    but does not identify a protein-resolved causal pathway. No causal graph or accession-level
    protein claim is inferred from chloroplast shape, sequence similarity or terminology.
    Full Neidium methods and provenance, and stronger nuclear observations in the
    Nitzschia system, remain coverage gaps. Retain actual snippet-resolver outcomes
    separately from direct PDF, XML and abstract checks.
  posed_by: codex
  posed_date: '2026-10-05'
