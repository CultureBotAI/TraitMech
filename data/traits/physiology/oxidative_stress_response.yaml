identifier: traitmech:000079
label: oxidative stress response
definition: A stress response that defends the cell against reactive oxygen species
  (e.g. superoxide and hydrogen peroxide) through detoxifying enzymes, regulators,
  and damage-repair systems.
definition_source: DOI:10.1038/nrmicro3032
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000078
evidence:
- reference: DOI:10.1038/nrmicro3032
  notes: Imlay reviews the molecular mechanisms and physiological consequences of
    oxidative stress and the cellular defenses against reactive oxygen species.
- reference: DOI:10.1007/s00018-003-3206-5
  notes: Chelikani, Fita & Loewen support catalases as core enzymes of the oxidative-stress
    defense.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Paradigm of the bacterial oxidative-stress response (OxyR and SoxRS regulons).
  reference: PMID:22381957
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Strain-level peroxide-response model paired to the reviewed OxyR regulator.
  reference: DOI:10.1073/pnas.86.10.3484
causal_graphs:
- graph_id: oxidative_stress_response_ros_defense
  title: Defense against reactive oxygen species
  description: Evidence-backed causal sketch linking reactive oxygen species to an
    induced oxidative-stress defense.
  scope_status: MECHANISTIC
  scope_notes: This graph represents an E. coli-like peroxide/general-stress regulatory
    branch, not every bacterial, archaeal, or fungal oxidative-stress system. The
    OxyR example anchors H2O2-responsive transcription; RpoS and thioredoxin effects
    are broader supporting modules.
  nodes:
  - node_id: oxidative_stress_response_trait
    label: oxidative stress response
    node_type: TRAIT
    grounding: traitmech:000079
    description: Capacity to defend against reactive oxygen species.
  - node_id: hydrogen_peroxide
    label: hydrogen peroxide
    node_type: CHEMICAL
    grounding: CHEBI:16240
    description: Representative reactive oxygen species.
  - node_id: oxidative_stress_process
    label: response to oxidative stress
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006979
    description: Defense response to reactive oxygen species.
  - node_id: oxyr_regulator
    label: OxyR transcriptional regulator
    node_type: GENE_OR_PROTEIN
    description: Widely conserved bacterial transcription factor that activates oxidative-stress
      defense genes.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Current InterPro terms on OxyR describe shared LysR domains rather
      than the peroxide-sensing OxyR family as a whole, so a domain grounding would
      be too broad.
    protein_examples:
    - uniprot_id: UniProtKB:P0ACQ4
      protein_label: DNA-binding transcriptional dual regulator OxyR
      gene_symbol: oxyR
      taxon_id: NCBITaxon:83333
      taxon_label: Escherichia coli K-12
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 143
      sequence_version: 1
      role: E. coli K-12 peroxide-sensing OxyR regulator that activates the hydrogen-peroxide-inducible
        defense regulon represented by this branch.
      evidence:
      - reference: DOI:10.1073/pnas.86.10.3484
        snippet: positive regulator of hydrogen peroxide-inducible genes in Escherichia
          coli
        notes: The primary study identifies and functionally tests E. coli OxyR; UniProtKB
          P0ACQ4 is the reviewed K-12 regulator entry.
  - node_id: rpos_sigma_factor
    label: RpoS (sigma-S) general stress sigma factor
    node_type: GENE_OR_PROTEIN
    description: Global stress sigma factor controlling a stress regulon that includes
      oxidative-stress defenses.
    grounding: InterPro:IPR012761
  - node_id: thioredoxin_system
    label: thioredoxin system
    node_type: PATHWAY
    description: Thiol-disulfide redox repair system supporting survival under oxidative/oxidant
      stress.
  edges:
  - subject: hydrogen_peroxide
    predicate: causes
    object: oxidative_stress_process
    description: Reactive oxygen species trigger the oxidative-stress response.
    evidence:
    - reference: DOI:10.1038/nrmicro3032
      notes: Imlay reviews ROS damage and induced defenses.
    predicate_id: biolink:causes
  - subject: oxidative_stress_process
    predicate: confers
    object: oxidative_stress_response_trait
    description: The induced defense realizes the oxidative-stress-response trait.
    evidence:
    - reference: DOI:10.1007/s00018-003-3206-5
      notes: Chelikani et al. support catalases as core oxidative-stress enzymes.
    predicate_id: METPO:2007700
  - subject: oxyr_regulator
    predicate: positively regulates
    object: oxidative_stress_process
    description: OxyR activates transcription of genes that defend the cell against
      oxidative stress.
    evidence:
    - reference: DOI:10.1099/mic.0.001481
      notes: OxyR is widely conserved in bacteria and activates transcription of a
        set of genes that influence cellular defence against oxidative stress.
    predicate_id: RO:0002213
  - subject: rpos_sigma_factor
    predicate: positively regulates
    object: oxidative_stress_process
    description: The general stress sigma factor RpoS controls oxidative-stress defense
      outputs; its loss increases sensitivity to oxidative stress.
    evidence:
    - reference: DOI:10.1128/mmbr.00151-22
      notes: Cells devoid of RpoS are sensitive to oxidative stress; the RpoS regulon
        includes oxidative-stress genes (dps, catalases, sodA, osmC).
    predicate_id: RO:0002213
  - subject: thioredoxin_system
    predicate: contributes to
    object: oxidative_stress_process
    description: Thioredoxin thiol-repair systems support survival under oxidative/oxidant
      stress, including in anaerobes and spores.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1012001
      notes: Multiple thioredoxin systems are involved in the response to oxidative
        stresses, broadening thiol-repair scope beyond classic aerobes.
    predicate_id: RO:0002326
