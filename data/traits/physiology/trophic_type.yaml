identifier: METPO:1000631
label: trophic type
definition: A phenotype that is describing how an organism obtains carbon, energy,
  and electron donors for growth and metabolism.
definition_source: DOI:10.1146/annurev.micro.61.080706.093130
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
