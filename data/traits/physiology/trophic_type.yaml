    description: Organic-carbon-utilizing trophic phenotype.
  - node_id: phototrophic_phenotype
    label: phototrophic
    node_type: TRAIT
    grounding: METPO:1000660
    description: Light-driven energy-acquisition trophic phenotype.
  - node_id: chemotrophic_phenotype
    label: chemotrophic
    node_type: TRAIT
    grounding: METPO:1000641
    description: Chemical-energy-driven trophic phenotype.
