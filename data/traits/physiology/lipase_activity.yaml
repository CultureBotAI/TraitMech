identifier: traitmech:000139
label: lipase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  lipases that hydrolyze triglycerides at lipid-water interfaces.
definition_source: DOI:10.22207/JPAM.16.4.27
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: lipase production
  synonym_type: RELATED_SYNONYM
  source: DOI:10.22207/JPAM.16.4.27
- synonym_text: lipolytic activity
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.mex.2018.01.004
evidence:
- reference: DOI:10.22207/JPAM.16.4.27
  snippet: Lipase-producing bacteria were isolated using tributyrin agar as a selective
    medium
  notes: Savalia and Dungrechiya used tributyrin agar to isolate lipase-producing
    bacteria from waste samples.
- reference: DOI:10.1016/j.mex.2018.01.004
  snippet: to identify lipase producers. The addition of calcium and magnesium ions
    can provide an easier screening procedure for selection of lipolytic bacterial
    strains
  notes: Carrazco-Palafox et al. optimized modified tributyrin agar as a microbial
    lipolytic-activity screen.
canonical_examples:
- taxon_id: NCBITaxon:1408
  taxon_label: Bacillus pumilus
  note: Bacillus pumilus S113 was isolated as the strongest lipase producer in a tributyrin-agar
    screen.
  reference: DOI:10.22207/JPAM.16.4.27
