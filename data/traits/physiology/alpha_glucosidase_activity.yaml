identifier: traitmech:000145
label: alpha-glucosidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  alpha-glucosidase enzymes that hydrolyze alpha-glucosidic bonds in alpha-D-glucosides.
definition_source: DOI:10.1371/journal.pone.0322500
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1371/journal.pone.0322500
  snippet: Enzyme activities of acid- and alkaline-phosphatases, esterase, esterase
    lipase, leucine arylamidase, trypsin, naphthol-AS-BI phosphohydrolase, and alpha-glucosidase
    are present when assayed with API ZYM system.
  notes: Park et al. treated alpha-glucosidase as a positive API ZYM enzyme-activity
    phenotype in the Flexibacterium corallicola type species description.
- reference: DOI:10.3390/microorganisms13092005
  snippet: alkaline phosphatase, esterase (C4), lipoid esterase (C8), lipase (C14),
    leucine arylamines, valine arylamines, cystine arylaminase, pancreatic coagulase,
    acid phosphatase, naphthol-AS-BI-phosphohydrolase, alpha-glucosidase, and N-acetyl-glucosaminidase
    were positive
  notes: Zhang and Liu detected alpha-glucosidase in Microbulbifer weihaiensis SDUM041083T
    with the API ZYM enzyme activity panel.
canonical_examples:
- taxon_id: NCBITaxon:3037259
  taxon_label: Flexibacterium corallicola
  note: Park et al. reported Flexibacterium corallicola as positive for alpha-glucosidase
    in the API ZYM enzyme activity panel.
  reference: DOI:10.1371/journal.pone.0322500
