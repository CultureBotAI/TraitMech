identifier: METPO:1000654
label: oligotrophic
definition: A nutrient adaptation characterized by the ability to thrive in environments
  with very low nutrient concentrations, typically possessing efficient nutrient uptake
  and utilization systems.
definition_source: DOI:10.1073/pnas.0903507106
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000731
synonyms:
- synonym_text: TT_oligotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: oligotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
created_by: Jed Dongjin Kim-Ozaeta
evidence:
- reference: DOI:10.1073/pnas.0903507106
  snippet: high (copiotrophic) or low (oligotrophic) nutrient concentrations
  notes: Comparative genomics paper defines oligotrophy by low-nutrient adaptation.
- reference: DOI:10.1038/ismej.2014.60
  snippet: nutrients limit growth
  notes: Streamlining review links nutrient limitation to small-cell/genome adaptation.
- reference: PMID:16109880
  snippet: Pelagibacter ubique
  notes: 'Organism example: Pelagibacter ubique HTCC1062 (SAR11 clade) is the archetypal
    oligotrophic marine bacterium with a streamlined genome adapted to nutrient-poor
    open-ocean conditions (Giovannoni et al. 2005, Science).'
canonical_examples:
- taxon_id: NCBITaxon:335992
  taxon_label: Candidatus Pelagibacter ubique HTCC1062
  note: "Cosmopolitan genome-streamlined marine heterotroph (SAR11); ~25% of ocean microbial cells; textbook oligotroph."
  reference: PMID:16109880
causal_graphs:
- graph_id: oligotrophic_low_nutrient_efficiency
  title: Oligotrophic low-nutrient efficiency strategy
  description: DOI-backed graph linking nutrient limitation, streamlined genomes,
    efficient nutrient use, and persistence in low-resource environments.
  nodes:
  - node_id: oligotrophic_trait
    label: oligotrophic
    node_type: TRAIT
    grounding: METPO:1000654
    description: Nutrient adaptation to low-resource environments.
  - node_id: low_nutrient_environment
    label: low nutrient concentration
    node_type: ENVIRONMENTAL_FACTOR
    description: Resource-poor condition favoring oligotrophic growth.
  - node_id: nutrient_limitation
    label: nutrient limitation
    node_type: ENVIRONMENTAL_FACTOR
    description: Limiting resource availability that constrains growth.
  - node_id: streamlined_genome
    label: streamlined genome
    node_type: BIOLOGICAL_PROCESS
    description: Reduced genome architecture associated with efficient resource use.
  - node_id: small_cell_architecture
    label: small cell architecture
    node_type: BIOLOGICAL_PROCESS
    description: Cellular architecture minimizing nutrient demand.
  - node_id: efficient_nutrient_use
    label: efficient nutrient use
    node_type: BIOLOGICAL_PROCESS
    description: Growth strategy minimizing resource requirements.
  - node_id: slow_growth
    label: slow growth
    node_type: BIOLOGICAL_PROCESS
    description: Low maximum growth response in chronic nutrient limitation.
  - node_id: high_affinity_sbp
    label: high-affinity solute-binding proteins
    node_type: GENE_OR_PROTEIN
    description: Solute-binding proteins with picomolar-nanomolar affinity feeding
      ABC/TRAP/TTT transporters.
  - node_id: substrate_uptake_low_conc
    label: substrate uptake at low concentration
    node_type: BIOLOGICAL_PROCESS
    description: Uptake of dissolved substrates at picomolar-nanomolar environmental
      concentrations.
  - node_id: reduced_metabolic_redundancy
    label: reduced metabolic redundancy
    node_type: BIOLOGICAL_PROCESS
    description: Loss of non-essential genes and metabolic redundancy under streamlining.
  - node_id: small_cell_volume
    label: small cell volume
    node_type: QUALITY
    description: Very small cell volume (~0.1 um3) characteristic of oligotrophic
      cells.
  edges:
  - subject: low_nutrient_environment
    predicate: selects for
    object: oligotrophic_trait
    description: Oligotrophs grow optimally at low nutrient concentrations.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: low (oligotrophic) nutrient concentrations
      notes: Supports low nutrient concentration as the defining environmental context.
    predicate_id: METPO:2007401
  - subject: nutrient_limitation
    predicate: favors
    object: streamlined_genome
    description: Nutrient limitation favors streamlined genomic and cellular architecture.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: selection for efficient use of nutrients
      notes: Supports streamlining as an adaptation under nutrient limitation.
  - subject: streamlined_genome
    predicate: contributes to
    object: efficient_nutrient_use
    description: Streamlined genomes reduce resource requirements for cell replication.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: minimizes resources required for replication
      notes: Supports genome streamlining as a resource-efficiency mechanism.
    predicate_id: RO:0002326
  - subject: small_cell_architecture
    predicate: contributes to
    object: efficient_nutrient_use
    description: Small cells reduce resource demand in oligotrophic habitats.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: small cells and genomes
      notes: Supports small-cell architecture as part of streamlining theory.
    predicate_id: RO:0002326
  - subject: oligotrophic_trait
    predicate: associated with
    object: slow_growth
    description: Oligotrophs are often slow-growing under apparently favorable conditions.
    evidence:
    - reference: DOI:10.1002/bies.1091
      snippet: grow slowly under apparent optimal conditions
      notes: Supports slow growth as a characteristic of oligotrophic strategy.
    predicate_id: biolink:associated_with
  - subject: efficient_nutrient_use
    predicate: confers
    object: oligotrophic_trait
    description: Efficient nutrient use enables persistence and growth in nutrient-poor
      environments.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: molecular mechanisms of adaptation
      notes: Supports genomic mechanisms underlying oligotrophic adaptation.
    predicate_id: METPO:2007700
  - subject: low_nutrient_environment
    predicate: selects for
    object: streamlined_genome
    description: Low nutrient availability is a strong selective force driving genome
      streamlining and low GC content.
    evidence:
    - reference: DOI:10.1038/s41467-023-36988-x
      notes: Nutrient limitation is considered a strong selective force causing genome
        streamlining in the warm oligotrophic epipelagic ocean (Ngugi et al. 2023).
    predicate_id: METPO:2007401
  - subject: low_nutrient_environment
    predicate: favors
    object: high_affinity_sbp
    description: Oligotrophic conditions favor reliance on extremely high-affinity
      solute-binding proteins.
    evidence:
    - reference: DOI:10.1038/s41586-024-07924-w
      notes: Marine bacteria rely heavily on solute-binding proteins with extremely
        high (picomolar-low nanomolar) binding affinity (Clifton et al. 2024).
  - subject: high_affinity_sbp
    predicate: increases
    object: substrate_uptake_low_conc
    description: High-affinity SBPs increase substrate uptake at picomolar-nanomolar
      concentrations matching ambient levels.
    evidence:
    - reference: DOI:10.1038/s41586-024-07924-w
      notes: SBP affinities match observed environmental substrate concentrations
        (picomolar-low nanomolar), enabling uptake at ambient levels (Clifton et al.
        2024).
    predicate_id: RO:0002213
  - subject: streamlined_genome
    predicate: reduces
    object: reduced_metabolic_redundancy
    description: Genome streamlining removes non-essential genes and metabolic redundancy.
    evidence:
    - reference: DOI:10.1038/s41586-024-07924-w
      notes: Oligotrophic adaptation includes extreme genome streamlining with removal
        of non-essential genes (Clifton et al. 2024).
    predicate_id: METPO:2007802
  - subject: oligotrophic_trait
    predicate: associated with
    object: small_cell_volume
    description: Oligotrophs have very small cell volumes (~0.1 um3) as a recurrent
      hallmark.
    evidence:
    - reference: DOI:10.1038/s41467-024-48591-9
      notes: Oligotrophs have very small cell volumes (~0.1 um3) (Zhu & Dai 2024).
    predicate_id: biolink:associated_with
