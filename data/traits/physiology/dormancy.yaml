      notes: Lennon & Jones review entry/exit from dormancy (seed banks).
    predicate_id: biolink:causes
  - subject: dormancy_process
    predicate: enables
    object: dormancy_trait
    description: The dormancy process realizes the dormancy trait.
    evidence:
    - reference: DOI:10.1038/nrmicro1557
      notes: Lewis links dormancy to long-term survival.
    predicate_id: RO:0002327
