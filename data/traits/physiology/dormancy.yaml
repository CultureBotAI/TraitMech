identifier: traitmech:000080
label: dormancy
definition: A reversible physiological state of greatly reduced metabolic activity
  that allows a cell to survive unfavorable conditions and later resuscitate,
  generating a microbial seed bank.
definition_source: DOI:10.1038/nrmicro2504
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
- synonym_text: dormant state
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro2504
evidence:
- reference: DOI:10.1038/nrmicro2504
  notes: Lennon & Jones review microbial seed banks and the mechanisms by which
    microorganisms enter and exit dormancy; parent of VBNC and persister sub-variants.
- reference: DOI:10.1038/nrmicro1557
  notes: Lewis links dormancy to persister-cell survival and infectious disease.
causal_graphs:
- graph_id: dormancy_seed_bank
  title: Reversible dormancy and resuscitation
  description: Evidence-backed causal sketch linking unfavorable conditions to a
    reversible dormant state forming a microbial seed bank.
  nodes:
  - node_id: dormancy_trait
    label: dormancy
    node_type: TRAIT
    grounding: traitmech:000080
    description: Capacity to enter a reversible low-activity state.
  - node_id: unfavorable_conditions
    label: unfavorable conditions
    node_type: ENVIRONMENTAL_FACTOR
    description: Stress or resource limitation triggering dormancy.
  - node_id: dormancy_process
    label: dormancy process
