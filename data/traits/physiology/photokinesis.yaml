identifier: traitmech:000587
label: photokinesis
definition: A motile phenotype in which the speed of active locomotion changes in
  response to illumination intensity, without requiring orientation toward or away
  from the light source.
definition_source: DOI:10.1128/AEM.67.12.5410-5419.2001
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.1128/AEM.67.12.5410-5419.2001
  snippet: swimming velocities are correlated to the illumination intensity.
  notes: Introduction's photokinesis definition; publisher full text at https://journals.asm.org/doi/10.1128/AEM.67.12.5410-5419.2001
    and Figure 2A-B with caption inspected. In Marichromatium gracile CE2205, the
    anoxic 1 mM total-sulfide preparation shows lower speed at low irradiance; oxic
    controls (>100 micromolar oxygen, no free sulfide) show no significant irradiance
    dependence. Reported irradiance is visible-region scalar irradiance (400-700 nm),
    with a fixed visible:near-infrared photon ratio of 1:8.3. Measurements use two-dimensional
    cell tracks after 60 s at each irradiance. Exponential-phase cells with sulfur
    globules were sampled above bottom aggregates. The collection-supplied strain
    is not assigned an independently verified natural lineage here. The separate gradient-migration
    results are attributed to phobic responses, not used to infer directional photokinesis.
- reference: DOI:10.1016/S0176-1617(00)80045-0
  snippet: Photosynthetically active continuous red light reversibly enhances the
    swimming velocity and increases or decreases the precision of gravitaxis, depending
    on its initial level.
  notes: Abstract, PMID:12090268, exact-matched at Europe PMC. This primary study
    of Chlamydomonas reinhardtii supports light-dependent speed modulation alongside
    a distinct orientation response. Its blue-light responses have different kinetics;
    proposed chlamy-rhodopsin participation is explicitly inferential. Subscription
    full text was not inspected; no strain lineage, protein accession or full-text-only
    result is inferred.
discussions:
- discussion_id: photokinesis-speed-and-direction-boundaries
  prompt: Preserve the speed-response scope when mapping light responses.
  kind: CURATION_TODO
  status: OPEN
  rationale: This definition follows the speed usage in the cited experiments. It
    does not require increasing speed, a photosynthetic energy mechanism, or an isolated
    response without concurrent taxis. Phototaxis concerns orientation; photophobic
    responses concern avoidance or reversals. They may coexist with photokinesis,
    but no equivalence, disjointness or parent-child relation is asserted. The obsolete
    METPO:1000241 phototaxis class is not an exact match or a replacement target.
    Reconcile broader kinesis terminology before adding turning-frequency synonyms
    or external xrefs.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: photokinesis-strain-and-mechanism-grounding
  prompt: Verify natural exemplars and protein-resolved causal branches.
  kind: CURATION_TODO
  status: OPEN
  rationale: Qualified experimental observations are retained without canonical taxa
    pending independent CE2205 lineage verification or a fully inspected algal strain
    source. Collection provenance alone does not establish unperturbed natural ancestry.
    Mechanism discussion in the sources does not establish one universal receptor,
    and the algal abstract only suggests rhodopsin participation. A mechanistic graph
    is deferred pending source-backed causal edges and eligible taxon-paired protein
    examples. Do not borrow the generic motile graph or use NONMECHANISTIC to bypass
    this gap.
  posed_by: codex
  posed_date: '2026-10-04'
