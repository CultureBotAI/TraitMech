identifier: traitmech:000083
label: spore germination
definition: The physiological process by which a dormant spore exits dormancy and
  resumes vegetative growth in response to germinant signals, including release of
  dipicolinic acid and rehydration of the spore core.
definition_source: DOI:10.1016/j.mib.2003.10.001
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000059
synonyms:
