  source: DOI:10.1016/j.mib.2003.10.001
evidence:
- reference: DOI:10.1016/j.mib.2003.10.001
  notes: Setlow reviews spore germination, in which nutrient germinants trigger
    dipicolinic-acid release and core rehydration to resume growth.
- reference: DOI:10.1038/nrmicro2504
  notes: Lennon & Jones frame germination as resuscitation from the dormant
    seed-bank state.
