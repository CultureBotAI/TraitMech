- timestamp: '2026-08-15T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Normalised causal-node type(s) so one node_id means one thing corpus-wide
    (issue 356): proton_motive_force: BIOLOGICAL_PROCESS -> STATE. The schema''s OWN
    example of STATE: ''a bioenergetic or molecular state of the cell (e.g. proton
    motive force ...) ... the state is the gradient / steady-value, not its establishment''.
    All 35 occurrences describe the gradient -- every description across all four
    types reads ''electrochemical proton gradient'', including the 13 typed BIOLOGICAL_PROCESS
    (''Transmembrane electrochemical gradient generated by respiration''), which name
    the gradient and its provenance rather than the generating process. Nothing here
    means the establishment, so this is a retype and not a rename; records that DO
    mean the process already use a separate id (proton_motive_force_generation in
    ph_delta.yaml). Also settles the one edge #356 was filed for: phototrophic.yaml''s
    CAPACITY typing was blocking `powers` (METPO:2007900), which is gated to BIOLOGICAL_PROCESS|STATE.'
  llm_assisted: true
- timestamp: '2026-08-16T02:00:00Z'
  curator: claude
  action: NORMALISE_NODE_TYPE
  changes: 'Under the PATHWAY-vs-BIOLOGICAL_PROCESS rule, one node_id means one thing
    corpus-wide (issue 356): oxidative_phosphorylation is typed PATHWAY. PATHWAY is
    a named, conventionally enumerable multi-step route; BIOLOGICAL_PROCESS is everything
    else. A named route through enumerable complexes -- environment/ph_delta_mid1.yaml
    lists them (nuo, cyo, ndh, sdh). The rule breaks what was a 2-2 tie before this
    tranche.'
  llm_assisted: true
