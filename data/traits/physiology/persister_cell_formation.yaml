identifier: traitmech:000082
label: persister cell formation
definition: Formation of dormant phenotypic variants (persister cells) that are transiently
  tolerant to antibiotics and other lethal stresses without carrying genetic resistance,
  arising stochastically in a population.
definition_source: DOI:10.1146/annurev.micro.112408.134306
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- traitmech:000080
synonyms:
- synonym_text: persistence
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev.micro.112408.134306
evidence:
- reference: DOI:10.1146/annurev.micro.112408.134306
  notes: Lewis reviews persister cells as dormant variants highly tolerant to antibiotics.
- reference: DOI:10.1038/nrmicro1557
  notes: Lewis links persister-cell dormancy to the recalcitrance of chronic infections.
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Paradigm for antibiotic-tolerant persister-cell formation (dormant subpopulation;
    hipA/toxin-antitoxin studies).
  reference: PMID:6348026
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Strain-level model in which the hipA7 allele increases persister frequency;
    paired to the reviewed HipA protein entry.
  reference: DOI:10.1128/jb.155.2.768-775.1983
causal_graphs:
- graph_id: persister_dormancy_tolerance
  title: Persister dormancy and antibiotic tolerance
  description: Evidence-backed causal sketch linking dormancy to stochastic persister
    formation and transient antibiotic tolerance.
  scope_status: MECHANISTIC
  scope_notes: The HipA branch is an E. coli K-12 example, not a universal persister
    mechanism. The original high-persistence result is hipA7-allele-specific, and
    later growth-arrest evidence uses HipA overexpression; neither establishes that
    wild-type HipA is required for persistence in every organism or condition.
  nodes:
  - node_id: persister_trait
    label: persister cell formation
    node_type: TRAIT
    grounding: traitmech:000082
    description: Stochastic formation of dormant, drug-tolerant variants.
  - node_id: dormancy_process
    label: dormancy process
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0022611
    description: Reversible quiescence underlying persistence.
  - node_id: hipa_toxin
    label: HipA toxin and high-persistence HipA variants
    node_type: GENE_OR_PROTEIN
    grounding: InterPro:IPR052028
    description: HipA serine/threonine kinase toxin; specific variants or elevated
      activity can arrest growth and increase antibiotic persistence in E. coli.
    protein_examples:
    - uniprot_id: UniProtKB:P23874
      protein_label: Serine/threonine-protein kinase toxin HipA
      gene_symbol: hipA
      taxon_id: NCBITaxon:83333
      taxon_label: Escherichia coli K-12
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 176
      sequence_version: 2
      role: Reviewed K-12 HipA sequence instance underlying the experimentally studied
        hipA7 variant and HipA-overexpression systems; the accession itself denotes
        the wild-type protein, not the hipA7 allele.
      evidence:
      - reference: DOI:10.1128/jb.155.2.768-775.1983
        snippet: hipA, a newly recognized gene of Escherichia coli K-12 that affects
          frequency of persistence
        notes: The primary K-12 study isolates the high-persistence hipA7 allele;
          UniProtKB P23874 is the reviewed HipA entry for the same taxon, but does
          not encode the allele distinction.
  - node_id: antibiotic_tolerance
    label: antibiotic tolerance
    node_type: BIOLOGICAL_PROCESS
    description: Transient survival of lethal antibiotic exposure.
  - node_id: biphasic_killing_curve
    label: biphasic killing curve
    node_type: EXPERIMENTAL_FACTOR
    description: 'Hallmark biphasic time-kill readout: rapid death of bulk population
      then slow killing of persister subpopulation.'
  - node_id: mic_susceptible
    label: minimum inhibitory concentration of susceptible cells
    node_type: QUALITY
    description: MIC value characteristic of antibiotic-susceptible cells; unchanged
      in persisters.
  - node_id: antibiotic_resistance
    label: antibiotic resistance
    node_type: BIOLOGICAL_PROCESS
    description: Genetically encoded ability to grow at elevated antibiotic concentrations;
      distinct from tolerance/persistence.
  - node_id: elevated_mic
    label: elevated minimum inhibitory concentration
    node_type: QUALITY
    description: Increased MIC characteristic of resistant bacteria, distinguishing
      resistance from persistence.
  - node_id: whole_population_phenotype
    label: whole-population phenotype
    node_type: QUALITY
    description: Property applying to the entire population rather than a small subpopulation.
  - node_id: oxidative_phosphorylation
    label: oxidative phosphorylation
    node_type: PATHWAY
    description: Residual respiratory ATP synthesis maintaining proton motive force
      in persisters.
    grounding: GO:0006119
  - node_id: proton_motive_force
    label: proton motive force
    node_type: STATE
    description: Transmembrane electrochemical gradient maintained by persisters during
      starvation.
    grounding: METPO:1007500
  edges:
  - subject: hipa_toxin
    predicate: promotes
    object: dormancy_process
    description: High-persistence HipA variants and experimentally elevated HipA kinase
      activity promote growth arrest in the E. coli K-12 persister branch.
    evidence:
    - reference: DOI:10.1128/jb.01237-06
      snippet: Kinase activity of overexpressed HipA is required for growth arrest
        and multidrug tolerance
      notes: This experiment supports a causal HipA-to-growth-arrest link under overexpression;
        it does not establish a universal wild-type requirement.
    - reference: DOI:10.1128/jb.155.2.768-775.1983
      snippet: hipA, a newly recognized gene of Escherichia coli K-12 that affects
        frequency of persistence
      notes: The original K-12 evidence is specifically for the high-persistence hipA7
        allele and limits this edge to that strain-specific branch.
    predicate_id: RO:0002213
  - subject: dormancy_process
    predicate: confers
    object: persister_trait
    description: Dormancy underlies stochastic persister formation.
    evidence:
    - reference: DOI:10.1146/annurev.micro.112408.134306
      notes: Lewis reviews persisters as dormant tolerant variants.
    predicate_id: METPO:2007700
  - subject: persister_trait
    predicate: enables
    object: antibiotic_tolerance
    description: Persister cells transiently tolerate antibiotics.
    evidence:
    - reference: DOI:10.1038/nrmicro1557
      notes: Lewis links persisters to recalcitrant infection.
    predicate_id: RO:0002327
  - subject: persister_trait
    predicate: characterized by
    object: biphasic_killing_curve
    description: Persistence produces a biphasic time-kill curve diagnostic of a tolerant
      subpopulation.
    evidence:
    - reference: DOI:10.1128/ecosalplus.esp-0025-2022
      notes: A hallmark of persistence is the biphasic killing curve.
  - subject: persister_trait
    predicate: has characteristic
    object: mic_susceptible
    description: Persisters retain the same MIC as susceptible cells, distinguishing
      persistence from resistance.
    evidence:
    - reference: DOI:10.1186/s12866-024-03628-3
      notes: Persisters had the same minimum inhibitory concentration (MIC) as the
        susceptible cells.
  - subject: antibiotic_resistance
    predicate: has characteristic
    object: elevated_mic
    description: Resistant bacteria have a significantly higher MIC, contrasting with
      the unchanged MIC of persisters.
    evidence:
    - reference: DOI:10.1186/s12866-024-03628-3
      notes: The MIC of resistant bacteria was significantly higher; scope edge excluding
        resistance from persistence.
  - subject: antibiotic_tolerance
    predicate: has characteristic
    object: whole_population_phenotype
    description: Tolerance applies to the whole population, whereas persisters are
      a small subpopulation.
    evidence:
    - reference: DOI:10.1186/s12866-024-03628-3
      notes: Persisters are a smaller subpopulation, whereas tolerance is for the
        microbiota as a whole.
  - subject: persister_trait
    predicate: enables
    object: oxidative_phosphorylation
    description: Persisters actively undergo a residual level of oxidative phosphorylation
      even during nutrient starvation.
    evidence:
    - reference: DOI:10.1111/1751-7915.70042
      notes: Persisters still actively generated PMF by undergoing a certain level
        of oxidative phosphorylation, even after complete nutrient starvation for
        24 h.
    predicate_id: RO:0002327
  - subject: oxidative_phosphorylation
    predicate: results in
    object: proton_motive_force
    description: Residual oxidative phosphorylation generates proton motive force
      that sustains persister survival.
    evidence:
    - reference: DOI:10.1111/1751-7915.70042
      notes: Persisters generated PMF via oxidative phosphorylation; ETC components
        maintain PMF underlying tolerance.
  - subject: antibiotic_resistance
    predicate: is distinct from
    object: persister_trait
    description: Genetic antibiotic resistance is explicitly distinct from the phenotypic
      persistence trait.
    evidence:
    - reference: DOI:10.1038/s41579-019-0196-3
      snippet: Resistance, tolerance and persistence are distinct responses to antibiotic
        treatment
      notes: Verified against the open consensus statement; this contrast edge does
        not treat resistance as a persistence mechanism.
