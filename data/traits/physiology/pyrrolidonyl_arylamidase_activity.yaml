identifier: traitmech:000155
label: pyrrolidonyl arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  pyrrolidonyl arylamidase enzymes that release N-terminal pyroglutamyl groups from
  peptide substrates.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/4/19/3.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/4/19/3.html
  snippet: 'Reaction: Release of an N-terminal pyroglutamyl group from a polypeptide,
    the second amino acid generally not being Pro'
  notes: The NC-IUBMB EC 3.4.19.3 entry defines pyroglutamyl-peptidase I by its accepted
    reaction, grounding the peptidase activity named by the organism-level pyrrolidonyl
    arylamidase phenotype.
- reference: DOI:10.1128/JCM.37.11.3443-3447.1999
  snippet: The strains displayed acid phosphatase, alkaline phosphatase, ester lipase
    C8 (weak reaction), esterase C4 (weak reaction), leucine arylamidase, phosphoamidase,
    and pyrrolidonyl arylamidase activity.
  notes: Collins et al. characterized six Corynebacterium auriscanis isolates that
    displayed pyrrolidonyl arylamidase activity, supporting this as a directly assayed
    bacterial enzyme-activity phenotype.
canonical_examples:
- taxon_id: NCBITaxon:99807
  taxon_label: Corynebacterium auriscanis
  note: Collins et al. detected pyrrolidonyl arylamidase activity in Corynebacterium
    auriscanis isolates from dogs.
