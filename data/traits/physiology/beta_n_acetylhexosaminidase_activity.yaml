identifier: traitmech:000157
label: beta-N-acetylhexosaminidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  beta-N-acetylhexosaminidase enzymes that hydrolyze terminal, non-reducing N-acetyl-D-hexosamine
  residues in N-acetyl-beta-D-hexosaminides.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/52.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
