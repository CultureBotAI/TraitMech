  source: metpo.owl
- synonym_text: chemotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.1016/B978-012373944-5.00083-3
  snippet: chemical energy
  notes: Encyclopedia chapter classifies chemotrophy by chemical energy sources.
- reference: DOI:10.1016/j.bbabio.2008.09.008
  snippet: free energy of a redox reaction
  notes: Review supports chemical redox reactions as energy sources for respiratory
    energy conservation.
