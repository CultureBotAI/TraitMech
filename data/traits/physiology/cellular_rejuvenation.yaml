identifier: traitmech:000710
label: functional cellular rejuvenation
definition: A physiological phenotype in which age-associated loss of cellular performance
  or replicative potential is reversed in a microbial cell or reset in its descendants.
definition_source: DOI:10.1242/jcs.86.1.263
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1242/jcs.86.1.263
  snippet: This is the first description of the restoration of a senescent defect
    by microinjection of young cytoplasmic components into Paramecium.
  notes: Haga and Karino 1986, PMID:3654779; scientific abstract, directly read in
    the MED record. Young-cell cytoplasm restored sexual activity in senescent cells
    (about 700 fissions); recovery persisted for up to 20 fissions. Division rate
    and fertility after self-conjugation did not improve. This supports endpoint-specific
    recovery in treated old cells, not whole-cell or permanent rejuvenation. Full
    methods and figures were unavailable.
- reference: DOI:10.1038/s41467-018-06154-9
  snippet: As this convergence was now downwards, doubling times decreased with each
    generation.
  notes: 'Proenca et al. 2018, PMID:30213942, PMC6137065; Results, Stable equilibria
    are connected by aging and rejuvenation (Sec6), directly checked in primary XML.
    Actual Figure 4d was visually inspected: new-daughter lineages from the old-cell
    equilibrium converge toward faster growth over successive generations. These doubling
    times are derived from elongation rates, not direct interdivision intervals. Recovery
    is in descendants, not the same old mother. The tested MG1655 conditions do not
    establish all-environment recovery or a universal damage mechanism.'
- reference: DOI:10.1126/science.1204349
  snippet: Gametes (spores) generated by aged cells show the same replicative potential
    as gametes generated by young cells.
  notes: Unal et al. 2011, PMID:21700873, PMC3923466; scientific abstract, directly
    checked in MED and an MIT-hosted author manuscript. Main text and Figures 1 and
    4 support gamete replicative-potential reset. Transient NDT80-dependent vegetative
    lifespan extension is a separate result and does not establish reversal of every
    aged-cell defect. Supplements and strain tables were not assessed. The retrieved
    PDF identifies the article but differs in size and checksum from MIT bitstream
    metadata; original deposited-byte identity remains unresolved.
- reference: DOI:10.3390/microorganisms11010082
  snippet: The cloned immaturin gene induces sexual rejuvenation in both mature and
    senescent cells by microinjection.
  notes: 'Haga 2023, PMID:36677375, PMC9865852; scientific abstract, directly checked
    in primary XML and PMC text. Results 3.1 uses rejuvenation for suppression of
    mating in mature cells: that maturation-state reset alone is outside this functional
    trait. Results 3.2 reports recovery of old-cell mating activity after transformation.
    Figure 6C measures total cell counts over four days, not direct division times,
    and lacks a young-cell growth comparator. Engineered treatment is not a natural
    canonical taxon example; inferred chemistry is not a proven mechanism.'
- reference: DOI:10.1016/j.isci.2022.103765
  snippet: Some cells rejuvenated immediately, even after extended starvation, but
    others only restarted growth after a delay or not at all.
  notes: 'Cesar et al. 2022, PMID:35243217, PMC8858994; scientific abstract, directly
    checked against MED and primary XML. Boundary evidence: culture duration during
    stationary phase is not individual replicative age. Immediate regrowth can reflect
    preserved function, not recovery from a demonstrated deficit. Regrowth classes
    use area-derived growth rates; nongrowth during the observation window is not
    proof of irreversible death. Results 2.1 and 2.3, Discussion, limitations and
    classification methods were read; figures and raw data were not independently
    assessed.'
discussions:
- discussion_id: cellular-rejuvenation-operational-scope
  prompt: Assess the functional qualifier and distinguish same-cell recovery from
    descendant reset.
  kind: CURATION_TODO
  status: OPEN
  rationale: Require an age-linked deficit and a measured recovery or replicative-potential
    reset, retaining the endpoint, age axis, comparison group, treated unit, conditions
    and persistence. Recovery of one function need not restore all functions, be permanent
    or extend lifespan. Descendant recovery must not be reported as repair of the
    old mother. Marker changes, lifespan extension alone, prevention without prior
    loss and sexual immaturity alone are insufficient. Bare cellular rejuvenation
    has broader source usages and is not an exact synonym. Autogamy, gametogenesis
    and dormancy exit are not themselves this phenotype; neither is replicative aging
    with functional decline. Culture age is not interchangeable with lineage age.
    METPO:1000059 phenotype is a conservative parent, with no reparenting of existing
    records or asserted external equivalence.
  posed_by: codex
  posed_date: '2026-10-12'
- discussion_id: cellular-rejuvenation-mechanism-and-example-limits
  prompt: Resolve strain provenance and endpoint-specific mechanisms before adding
    examples or causal edges.
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: This is a reusable physiological outcome, not a gene, protein, sequence
    feature or intervention. No canonical example or protein-resolved graph is asserted
    pending strain provenance and mechanistic review. Bacterial model-derived damage
    and fluorescent aggregates are not direct proof of a universal rejuvenation chemistry.
    Studies need not share a mechanism. The 2011 PDF/metadata byte mismatch is retained,
    not explained away by its added cover. MED/Crossref notice fields and accessible
    primary pages were checked on 2026-10-12; incomplete publisher access prevents
    an exhaustive notice-absence claim. Ignored/hidden local and pending-source searches
    plus pinned and current released METPO found no exact term in the inspected scope.
    No ontology upgrade or discovery-exhaustion claim follows.
  posed_by: codex
  posed_date: '2026-10-12'
