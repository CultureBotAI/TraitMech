identifier: traitmech:000144
label: valine arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  valine arylamidase enzymes that hydrolyze valine arylamide substrates.
definition_source: DOI:10.3389/fmicb.2022.1034816
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.3389/fmicb.2022.1034816
  snippet: Positive alkaline phosphatase, cystine arylamidase, esterase(C4), esterase
    lipase(C8), leucine arylamidase, naphthol-AS-B1-phosphohydrolase, valine arylamidase
  notes: Jiang et al. treated valine arylamidase as an assayed enzyme-activity phenotype
    in the Geminicoccus harenae type species description.
- reference: DOI:10.1099/ijsem.0.002327
  snippet: enzyme detection with an API zym kit was positive for alkaline phosphatase,
    esterase, leucine arylamidase, valine arylamidase, acid phosphatase
  notes: Jung et al. detected valine arylamidase in Lactobacillus allii strain WiKim39
    with the API ZYM enzyme activity panel.
canonical_examples:
- taxon_id: NCBITaxon:2498453
  taxon_label: Geminicoccus harenae
  note: Jiang et al. reported Geminicoccus harenae as positive for valine arylamidase
    in the API ZYM enzyme activity panel.
  reference: DOI:10.3389/fmicb.2022.1034816
