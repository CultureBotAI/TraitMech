identifier: traitmech:000150
label: alpha-mannosidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  alpha-mannosidase enzymes that hydrolyze terminal, non-reducing alpha-D-mannose
  residues in alpha-D-mannosides.
definition_source: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/24.html
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: https://iubmb.qmul.ac.uk/enzyme/EC3/2/1/24.html
  snippet: 'Reaction: Hydrolysis of terminal, non-reducing α-D-mannose residues in
    α-D-mannosides'
  notes: The NC-IUBMB EC 3.2.1.24 entry defines alpha-mannosidase by its accepted
    name and hydrolytic reaction, grounding the enzyme activity named by the organism-level
    phenotype.
- reference: DOI:10.1128/jcm.32.3.854-855.1994
  snippet: Practically all A. haemolyticum strains (138 of 139) and the Listeria monocytogenes
    type strain were alpha-mannosidase positive
  notes: Carlson and Kontiainen detected alpha-mannosidase in nearly all tested Arcanobacterium
    haemolyticum strains with a 4-h alpha-mannosidase assay.
canonical_examples:
- taxon_id: NCBITaxon:28264
  taxon_label: Arcanobacterium haemolyticum
  note: Carlson and Kontiainen reported 138 of 139 Arcanobacterium haemolyticum strains
    as alpha-mannosidase positive in a 4-h test.
  reference: DOI:10.1128/jcm.32.3.854-855.1994
