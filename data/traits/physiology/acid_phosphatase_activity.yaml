identifier: traitmech:000142
label: acid phosphatase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  acid phosphatase enzymes that dephosphorylate phosphate-containing compounds under
  acidic conditions.
definition_source: DOI:10.1128/JB.182.23.6850-6853.2000
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1128/JB.182.23.6850-6853.2000
  snippet: the presence of acid phosphatase activity in the culture filtrate of M.
    tuberculosis was confirmed and a 28-kDa protein possessing this activity was purified
    and characterized
  notes: Saleh and Belisle confirmed Mycobacterium tuberculosis acid phosphatase activity
    and purified the SapM protein carrying that activity.
- reference: DOI:10.1155/2021/8888641
  snippet: According to the API ZYM assays, all three isolates were positive for alkaline
    phosphatase, leucine aryl amidase, acid phosphatase, and naphthol_AS_BI_phosphohydrolase.
  notes: Mekonnen et al. treated acid phosphatase as an assayed bacterial exoenzyme
    phenotype in rapid urease-producing soil isolates.
canonical_examples:
- taxon_id: NCBITaxon:1773
  taxon_label: Mycobacterium tuberculosis
  note: Mycobacterium tuberculosis secretes SapM, a culture-filtrate enzyme purified
    through its acid phosphatase activity.
  reference: DOI:10.1128/JB.182.23.6850-6853.2000
