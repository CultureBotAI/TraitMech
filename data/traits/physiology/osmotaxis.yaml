identifier: traitmech:000592
label: osmotaxis
definition: A motile phenotype in which active locomotion produces net migration in
  response to a spatial gradient in external osmotic conditions.
definition_source: DOI:10.1016/s0014-4894(03)00031-6
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.1016/s0014-4894(03)00031-6
  snippet: We find that promastigotes move towards concentrations of all substances
    tested and that this taxis requires the presence of an osmotic gradient.
  notes: Abstract, exact-matched at Europe PMC (PMID:12706748); full text not inspected.
    The study concerns Leishmania mexicana promastigotes and supports migration requiring
    an osmotic gradient under the tested conditions. The authors reinterpret those
    responses as osmotaxis; this is not evidence that all chemical-gradient responses
    in Leishmania are osmotic, or that every substance or life stage elicits this
    behavior. No universal preferred osmolarity or natural-strain example is inferred
    from the abstract.
- reference: DOI:10.1016/j.exppara.2005.10.005
  snippet: These were able to respond to chemotaxic as well as to osmotaxic stimuli.
  notes: Abstract, exact-matched at Europe PMC (PMID:16313904); full text not inspected.
    The antecedent is Leishmania promastigotes; the article identifies Leishmania
    amazonensis. The authors report distinguishing chemical from osmotic responses,
    supporting osmotaxis without collapsing all chemotaxis into it. Their receptor
    model and possible vector-development role are not established as universal mechanisms
    or required trait consequences.
- reference: DOI:10.1073/pnas.1620945114
  snippet: We discuss how the speed changes we observe can lead to steady-state bacterial
    accumulation.
  notes: Abstract, exact-matched at Europe PMC (PMID:28874571); full text and supplement
    not systematically inspected. Escherichia coli motor and population-swimming measurements
    concern stepwise osmotic changes. The snippet states a proposed link from measured
    speed changes to accumulation, not a direct spatial-gradient migration result
    from those measurements. Osmokinesis and motor bias may contribute to osmotaxis
    but are not exact synonyms or sufficient evidence of net migration on their own;
    no molecular causal edge is inferred.
discussions:
- discussion_id: osmotaxis-spatial-and-chemical-boundaries
  prompt: Separate osmotic migration from tolerance, kinesis and chemical specificity.
  kind: CURATION_TODO
  status: OPEN
  rationale: Osmotic stress survival, growth salinity preference, water balance, and
    speed or tumbling changes after a uniform shock do not alone establish net migration
    through a spatial gradient. Exclude passive transport, osmotic water movement
    and differential growth as sole evidence. Osmokinesis is not an exact synonym,
    even when it contributes to spatial redistribution. Solute-specific chemotaxis
    can coexist with osmotaxis, as the Barros study reports; the Leslie result does
    not negate it universally. The local chemotaxis record imposes flagellar motor
    switching, so motile is used as the verified broader parent. External equivalents
    remain unasserted pending authority and organismal-scope checks.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: osmotaxis-mechanism-and-canonical-strains
  prompt: Verify strain and life-stage provenance before adding examples or mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: The studies support a microbial osmotic-gradient response without identifying
    one universal receptor or movement apparatus. Inspect full studies and relevant
    supplements, distinguish spatial observations from temporal-shock measurements
    and model interpretations, and resolve taxon-paired protein accessions before
    adding molecular causal graphs. Verify unperturbed natural strain provenance and
    NCBI identity before adding canonical examples; promastigote observations must
    retain their life-stage restriction. A NONMECHANISTIC graph must not bypass those
    requirements.
  posed_by: codex
  posed_date: '2026-10-04'
