evidence:
- reference: DOI:10.1073/pnas.0903507106
  snippet: high (copiotrophic) or low (oligotrophic) nutrient concentrations
  notes: Comparative genomics paper defines copiotrophic growth strategy by high-nutrient
    adaptation.
- reference: DOI:10.1002/bies.1091
  snippet: common in environments with greater nutritional opportunities
  notes: Essay contrasts copiotrophs with oligotrophs in nutrient-rich environments.
