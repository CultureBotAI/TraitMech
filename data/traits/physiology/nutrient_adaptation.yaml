identifier: METPO:1000731
label: nutrient adaptation
definition: A trophic type that involves an organism's physiological and metabolic
  adaptations to specific nutrient availability.
definition_source: DOI:10.1073/pnas.0903507106
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
created_by: Luke Wang
evidence:
- reference: DOI:10.1073/pnas.0903507106
  snippet: high (copiotrophic) or low (oligotrophic) nutrient concentrations
  notes: Comparative genomics paper frames nutrient adaptation as a copiotroph/oligotroph
    life-history axis.
- reference: DOI:10.1038/ismej.2014.60
  snippet: selection for efficient use of nutrients
  notes: Streamlining review links chronic nutrient regimes to genomic and cellular
    adaptation.
canonical_examples:
- taxon_id: NCBITaxon:335992
  taxon_label: Candidatus Pelagibacter ubique HTCC1062
  reference: DOI:10.1038/s41586-024-07924-w
  note: Genome-wide experimental profiling found picomolar-to-low-nanomolar substrate-binding
    affinities and linked their systematic increase to adaptation to low substrate
    concentrations in the oligotrophic ocean.
causal_graphs:
- graph_id: nutrient_adaptation_life_history_axis
  title: Nutrient adaptation life-history axis
  description: DOI-backed graph linking ambient nutrient availability to sensing,
    resource-allocation strategy, and the copiotroph/oligotroph life-history phenotypes
    that fall under nutrient adaptation.
  scope_status: NONMECHANISTIC
  scope_notes: This is a comparative life-history classification and association graph,
    not a concrete molecular mechanism. Its gene nodes are heterogeneous functional-category
    or relative-abundance signatures rather than individual causal protein families,
    so canonical-taxon and UniProt-example requirements do not apply.
  nodes:
  - node_id: nutrient_adaptation_trait
    label: nutrient adaptation
    node_type: TRAIT
    grounding: METPO:1000731
    description: Physiological and metabolic adaptation to specific nutrient availability
      regimes.
  - node_id: ambient_nutrient_concentration
    label: ambient nutrient concentration
    node_type: ENVIRONMENTAL_FACTOR
    description: Concentration of carbon, nitrogen, and phosphorus available in the
      habitat.
  - node_id: nutrient_sensing
    label: nutrient sensing
    node_type: BIOLOGICAL_PROCESS
    description: Cellular detection of nutrient status that adjusts gene expression
      and growth.
    grounding: GO:0009594
  - node_id: resource_allocation
    label: resource allocation strategy
    node_type: BIOLOGICAL_PROCESS
    description: Allocation of cellular resources between rapid growth machinery and
      high-affinity uptake or stress tolerance.
  - node_id: copiotrophic_phenotype
    label: copiotrophic
    node_type: TRAIT
    grounding: METPO:1000642
    description: Adaptation favoring fast growth in nutrient-rich conditions.
  - node_id: oligotrophic_phenotype
    label: oligotrophic
    node_type: TRAIT
    grounding: METPO:1000654
    description: Adaptation favoring efficient growth in nutrient-poor conditions.
  - node_id: nutrient_limitation
    label: chronic nutrient limitation
    node_type: ENVIRONMENTAL_FACTOR
    description: Persistently low nutrient availability imposing selection for efficient
      resource use.
  - node_id: genome_streamlining
    label: genome streamlining
    node_type: BIOLOGICAL_PROCESS
    description: Selection-driven reduction of cell and genome size and regulatory
      complexity under nutrient limitation.
  - node_id: rrn_copy_number
    label: rrn operon copy number
    node_type: QUALITY
    description: Number of ribosomal RNA operons in a genome, a proxy for growth potential.
  - node_id: maximum_growth_potential
    label: maximum growth potential
    node_type: CAPACITY
    description: Maximum potential growth rate of an organism or community.
  edges:
  - subject: ambient_nutrient_concentration
    predicate: causes
    object: nutrient_sensing
    description: Ambient nutrient levels are detected by cellular sensing systems.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: high (copiotrophic) or low (oligotrophic) nutrient concentrations
      notes: Supports nutrient concentration as the environmental driver of the adaptation
        axis.
    predicate_id: biolink:causes
  - subject: nutrient_sensing
    predicate: controls
    object: resource_allocation
    description: Sensing of nutrient status shifts allocation between growth and maintenance
      functions.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: selection for efficient use of nutrients
      notes: Supports nutrient regime as a driver of resource-allocation strategy.
    predicate_id: RO:0002211
  - subject: resource_allocation
    predicate: manifests as
    object: copiotrophic_phenotype
    description: Allocation favoring rapid growth machinery yields a copiotrophic
      phenotype under nutrient-rich conditions.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: high (copiotrophic) nutrient concentrations
      notes: Supports copiotrophy as one expression of nutrient adaptation.
    predicate_id: METPO:2007400
  - subject: resource_allocation
    predicate: manifests as
    object: oligotrophic_phenotype
    description: Allocation favoring high-affinity uptake and streamlining yields
      an oligotrophic phenotype under nutrient-poor conditions.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      snippet: small cells and genomes
      notes: Supports oligotrophy as a streamlining-driven expression of nutrient
        adaptation.
    predicate_id: METPO:2007400
  - subject: copiotrophic_phenotype
    predicate: is a
    object: nutrient_adaptation_trait
    description: Copiotrophy is a child phenotype of nutrient adaptation.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: copiotrophic
      notes: Supports copiotrophy as a recognized nutrient-adaptation phenotype.
    predicate_id: rdfs:subClassOf
  - subject: oligotrophic_phenotype
    predicate: is a
    object: nutrient_adaptation_trait
    description: Oligotrophy is a child phenotype of nutrient adaptation.
    evidence:
    - reference: DOI:10.1073/pnas.0903507106
      snippet: oligotrophic
      notes: Supports oligotrophy as a recognized nutrient-adaptation phenotype.
    predicate_id: rdfs:subClassOf
  - subject: nutrient_limitation
    predicate: selects for
    object: genome_streamlining
    description: Chronic nutrient limitation selects for streamlined small cells and
      genomes.
    evidence:
    - reference: DOI:10.1038/ismej.2014.60
      notes: Streamlining theory attributes small cells and genomes to selection for
        efficient use of nutrients where nutrients limit; broad across oligotrophic
        microbes.
    predicate_id: METPO:2007401
  - subject: rrn_copy_number
    predicate: positively correlates with
    object: maximum_growth_potential
    description: Higher rrn operon copy number associates with higher maximum growth
      potential.
    evidence:
    - reference: DOI:10.1038/s41564-023-01465-0
      notes: Secondary life-history dimension correlated with ribosomal gene copy
        number; positive correlation between potential growth and rrn copy number.
