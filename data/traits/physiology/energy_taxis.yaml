identifier: traitmech:000590
label: energy taxis
definition: A motile phenotype in which directional locomotion is regulated by sensing
  changes in the electron transport system associated with cellular energy generation.
definition_source: DOI:10.1128/jb.186.19.6595-6604.2004
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000702
evidence:
- reference: DOI:10.1128/jb.182.21.6042-6048.2000
  snippet: behavioral responses to most stimuli in A. brasilense are triggered by
    changes in the electron transport system.
  notes: Abstract exact-matched at Europe PMC (PMID:11029423). Publisher Methods,
    Results and Discussion also inspected. Sp7 (ATCC 29145), wild type for chemotaxis,
    is distinguished from the cytN mutant FAJ851. Spatial and temporal assays, metabolic
    inhibition and electron-donor bypass support the sensing interpretation beyond
    growth correlation. Nitrate and DMSO taxis are reported under anaerobic conditions.
    The study does not decide whether redox state or ion motive force is the sensed
    signal; capillary aerotaxis can confound apparent substrate chemotaxis. No universal
    substrate range is inferred.
- reference: DOI:10.1128/jb.186.19.6595-6604.2004
  snippet: Motility responses triggered by changes in the electron transport system
    are collectively known as energy taxis.
  notes: Abstract exact-matched at Europe PMC (PMID:15375141); full text not fully
    inspected. The tlp1 mutant is deficient in responses to oxidizable substrates,
    terminal electron acceptors and redox conditions. The proposed sensory domain's
    function remains unknown in this source. Root-colonization impairment supports
    an ecological hypothesis, not universal host specificity or an identified direct
    ligand. No complete protein-resolved pathway is inferred from the abstract.
canonical_examples:
- taxon_id: NCBITaxon:192
  taxon_label: Azospirillum brasilense
  reference: DOI:10.1128/jb.182.21.6042-6048.2000
  note: Sp7 (ATCC 29145), the study's wild type for chemotaxis, not the cytN mutant
    FAJ851. Observed substrate, electron-acceptor and repellent responses support
    energy taxis under the reported conditions. Environmental provenance is independently
    documented at https://www.atcc.org/products/29145. NCBI resolved 192 on 2026-10-04
    at species rank; it is not an exact strain accession or a claim about all strains.
discussions:
- discussion_id: energy-taxis-stimulus-and-mapping-boundaries
  prompt: Keep energy sensing distinct from stimulus-defined taxis classes.
  kind: CURATION_TODO
  status: OPEN
  rationale: 'This entry follows the electron-transport-based usage in the cited primary
    studies. Energy generation powering motility alone is insufficient: changes must
    inform locomotor control. Aerotaxis, phototaxis and chemotaxis can involve other
    sensing mechanisms and are not automatically children or exact synonyms. Metabolism-dependent
    chemotaxis can instead sense intracellular intermediates, so that broader phrase
    is not an exact synonym. The existing flagellar-specific chemotaxis record is
    not used as a universal parent. Resolve external mappings at their authorities
    and compare process versus organismal-disposition scope before adding xrefs.'
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: energy-taxis-signal-and-protein-grounding
  prompt: Verify the sensed signal and taxon-paired molecular branches.
  kind: CURATION_TODO
  status: OPEN
  rationale: Electron-transport perturbations support energy-dependent locomotor control
    without identifying one universal receptor or deciding redox-state versus ion-motive-force
    sensing. Inspect full mutant, complementation and domain-function evidence and
    resolve taxon-paired protein accessions before adding causal edges. Do not substitute
    a protein/domain sequence feature for this organismal phenotype or use a NONMECHANISTIC
    graph to bypass molecular grounding.
  posed_by: codex
  posed_date: '2026-10-04'
