identifier: traitmech:000143
label: leucine arylamidase activity
definition: A physiological enzyme-activity phenotype in which a cell produces active
  leucine arylamidase enzymes that hydrolyze leucine arylamide substrates.
definition_source: DOI:10.1099/ijsem.0.002327
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
evidence:
- reference: DOI:10.1099/ijsem.0.002327
  snippet: enzyme detection with an API zym kit was positive for alkaline phosphatase,
    esterase, leucine arylamidase, valine arylamidase, acid phosphatase
  notes: Jung et al. detected leucine arylamidase in Lactobacillus allii strain WiKim39
    with the API ZYM enzyme activity panel.
- reference: DOI:10.1155/2021/8888641
  snippet: According to the API ZYM assays, all three isolates were positive for alkaline
    phosphatase, leucine aryl amidase, acid phosphatase, and naphthol_AS_BI_phosphohydrolase.
  notes: Mekonnen et al. treated leucine arylamidase as an assayed bacterial exoenzyme
    phenotype in rapid urease-producing soil isolates.
canonical_examples:
- taxon_id: NCBITaxon:1847728
  taxon_label: Companilactobacillus allii
  note: The Lactobacillus allii WiKim39 type strain described by Jung et al. is now
    classified as Companilactobacillus allii and was positive for leucine arylamidase
    in the API ZYM panel.
  reference: DOI:10.1099/ijsem.0.002327
