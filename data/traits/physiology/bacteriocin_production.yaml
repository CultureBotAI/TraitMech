identifier: traitmech:000183
label: bacteriocin production
definition: A physiological trait in which bacteria produce bacteriocins, ribosomally
  synthesized antimicrobial peptides or proteins that kill or inhibit other bacteria.
definition_source: DOI:10.3389/fmicb.2016.00461
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
xrefs:
- GO:0030152
evidence:
- reference: DOI:10.3389/fmicb.2016.00461
  snippet: Bacteriocins are ribosomally synthesized antimicrobial peptides produced
    by bacteria, which have the ability to kill or inhibit other bacteria.
  notes: Rea et al. review bacteriocins as bacterially produced ribosomal antimicrobial
    peptides.
- reference: DOI:10.1146/annurev.micro.56.012302.161024
  snippet: 'the most abundant and diverse family of microbial defense systems: the
    bacteriocins.'
  notes: Riley and Wertz support bacteriocins as a widespread, diverse microbial defense-system
    family.
- reference: DOI:10.1038/srep27973
  snippet: Traditionally, nisin was produced industrially by using Lactococcus lactis
    in the neutral fermentation process.
  notes: Zhang et al. support Lactococcus lactis as an industrial nisin-producing
    bacterium.
canonical_examples:
- taxon_id: NCBITaxon:1358
  taxon_label: Lactococcus lactis
  note: Lactococcus lactis is used as a canonical nisin-producing bacterium in neutral
    fermentation.
  reference: DOI:10.1038/srep27973
