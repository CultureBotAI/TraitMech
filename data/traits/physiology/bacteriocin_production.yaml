identifier: traitmech:000183
label: bacteriocin production
definition: A physiological trait in which bacteria produce bacteriocins, ribosomally
  synthesized antimicrobial peptides or proteins that kill or inhibit other bacteria.
definition_source: DOI:10.3389/fmicb.2016.00461
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- METPO:1000059
xrefs:
