identifier: METPO:1000651
label: methylotrophic
definition: A trophic type in which an organism obtains energy and carbon from reduced
  one-carbon compounds.
definition_source: DOI:10.3389/fbioe.2021.787791
trait_category: PHYSIOLOGY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
- METPO:1000631
synonyms:
- synonym_text: TT_methylotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: methylotroph
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
- synonym_text: methylotrophy
  synonym_type: RELATED_SYNONYM
  source: metpo.owl
evidence:
- reference: DOI:10.3389/fbioe.2021.787791
  snippet: methanol utilization in methylotrophy
  notes: Review supports methanol oxidation and formaldehyde assimilation as central
    methylotrophy mechanisms.
canonical_examples:
- taxon_id: NCBITaxon:408
  taxon_label: Methylorubrum extorquens
  note: Model facultative methylotroph (formerly Methylobacterium extorquens; strain
    AM1).
  reference: PMID:12730156
- taxon_id: NCBITaxon:272630
  taxon_label: Methylorubrum extorquens AM1
  note: Strain-level facultative methylotroph paired to reviewed MxaF, the large catalytic
    component of its MxaFI methanol dehydrogenase.
  reference: DOI:10.1016/0378-1119(90)90457-3
causal_graphs:
- graph_id: methylotrophic_methanol_assimilation
  title: Methanol-based methylotrophy mechanism
  description: DOI-backed graph for methanol oxidation to formaldehyde and assimilation
    through native methylotrophy pathways.
  scope_status: MECHANISTIC
  scope_notes: This graph combines alternative RuMP and serine assimilation branches
    and several methanol/formaldehyde oxidation enzyme classes. The AM1 MxaF accession
    anchors only the calcium-dependent MxaFI branch and is one subunit, not the complete
    heterotetramer.
  nodes:
  - node_id: methylotrophic_trait
    label: methylotrophic
    node_type: TRAIT
    grounding: METPO:1000651
    description: Trophic type using reduced one-carbon compounds for carbon and energy.
  - node_id: methanol
    label: methanol
    node_type: CHEMICAL
    grounding: CHEBI:17790
    description: Reduced C1 substrate used by many methylotrophs.
  - node_id: methanol_dehydrogenase
    label: methanol dehydrogenase
    node_type: GENE_OR_PROTEIN
    description: Primary enzyme oxidizing methanol in methylotrophy.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: This umbrella spans unrelated PQQ-dependent and NAD-dependent
      enzyme families; the graph preserves their alternatives instead of assigning
      one family term.
  - node_id: pqq_dependent_mdh
    label: PQQ-dependent methanol dehydrogenase
    node_type: GENE_OR_PROTEIN
    description: Periplasmic methanol dehydrogenase class in Gram-negative methylotrophs.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The node combines MxaFI and XoxF lineages with different subunit
      and metal requirements, so a single protein-family term would overstate identity.
  - node_id: periplasmic_space
    label: periplasmic space
    node_type: CELLULAR_LOCALIZATION
    description: Cellular compartment where PQQ-dependent MDH oxidizes methanol in
      Gram-negative methylotrophs.
    grounding: GO:0042597
  - node_id: formaldehyde
    label: formaldehyde
    node_type: CHEMICAL
    grounding: CHEBI:16842
    description: Central intermediate produced by methanol oxidation.
  - node_id: rump_cycle
    label: ribulose monophosphate cycle
    node_type: PATHWAY
    description: Prokaryotic formaldehyde assimilation pathway.
  - node_id: serine_pathway
    label: serine pathway
    node_type: PATHWAY
    description: Prokaryotic formaldehyde assimilation pathway.
  - node_id: biomass_precursor
    label: biomass precursor
    node_type: BIOLOGICAL_PROCESS
    description: Assimilated cellular carbon derived from formaldehyde.
  - node_id: hexulose_phosphate_synthase
    label: 3-hexulose-6-phosphate synthase (Hps)
    node_type: GENE_OR_PROTEIN
    description: Hallmark RuMP-cycle enzyme that condenses formaldehyde for assimilation.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The cited comparative source supports the Hps activity but does
      not distinguish a single exact family term across all represented methylotrophs.
  - node_id: serine_glyoxylate_aminotransferase
    label: serine-glyoxylate aminotransferase (SgaA/SGT)
    node_type: GENE_OR_PROTEIN
    description: Conserved serine-cycle enzyme found across methylotroph genomes.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: SgaA/SGT is used here as a comparative functional label across
      isozymes; the graph source does not justify one exact family grounding.
  - node_id: hydroxypyruvate_reductase
    label: hydroxypyruvate reductase (HprA/HPR)
    node_type: GENE_OR_PROTEIN
    description: Ubiquitous serine-cycle enzyme reducing hydroxypyruvate.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: HprA/HPR is an activity-level umbrella across homologous reductases;
      no exact family term was verified for every organism represented by the graph.
  - node_id: formaldehyde_dehydrogenase
    label: formaldehyde dehydrogenase (Fld/FDH)
    node_type: GENE_OR_PROTEIN
    description: Enzyme oxidizing formaldehyde to formate during dissimilation.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: The label spans cofactor-distinct formaldehyde oxidation systems;
      the cited graph does not select one protein family.
  - node_id: formate
    label: formate
    node_type: CHEMICAL
    description: C1 intermediate produced by formaldehyde oxidation.
  - node_id: formate_dehydrogenase
    label: formate dehydrogenase (Fdh)
    node_type: GENE_OR_PROTEIN
    description: Enzyme oxidizing formate to CO2 in the dissimilatory branch.
    grounding: GO:0009326
  - node_id: carbon_dioxide
    label: carbon dioxide
    node_type: CHEMICAL
    description: Terminal product of C1 dissimilatory oxidation.
    grounding: CHEBI:16526
  - node_id: mxa_methanol_dehydrogenase
    label: MxaFI methanol dehydrogenase
    node_type: GENE_OR_PROTEIN
    description: Calcium-dependent methanol dehydrogenase of the PQQ alcohol dehydrogenase
      family.
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: MxaFI is a multisubunit enzyme assembled from distinct MxaF and
      MxaI families; no verified complex CURIE was available for the complete node.
    protein_examples:
    - uniprot_id: UniProtKB:P16027
      protein_label: Methanol dehydrogenase [cytochrome c] subunit 1
      gene_symbol: mxaF
      taxon_id: NCBITaxon:272630
      taxon_label: Methylorubrum extorquens AM1
      entry_status: REVIEWED
      retrieved_on: '2026-08-24'
      entry_version: 179
      sequence_version: 1
      role: Large catalytic MxaF component of the AM1 MxaFI methanol dehydrogenase;
        this accession is not presented as the complete enzyme.
      evidence:
      - reference: DOI:10.1016/0378-1119(90)90457-3
        snippet: AM1 moxF and moxJ genes are involved in methanol oxidation
        notes: The primary sequence study identifies the AM1 moxF/mxaF gene in methanol
          oxidation; UniProt verifies reviewed P16027 and the strain taxon.
  - node_id: pqq
    label: pyrroloquinoline quinone (PQQ)
    node_type: CHEMICAL
    description: Redox cofactor required by methanol dehydrogenases.
  - node_id: calcium_ion
    label: calcium ion (Ca2+)
    node_type: CHEMICAL
    description: Active-site metal cofactor of MxaFI-type methanol dehydrogenase.
  edges:
  - subject: methylotrophic_trait
    predicate: uses substrate
    object: methanol
    description: Methanol is a representative reduced C1 substrate for methylotrophy.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: methanol utilization in methylotrophy
      notes: Supports methanol as a methylotrophic substrate; other C1 substrates
        are not modeled here.
  - subject: methanol_dehydrogenase
    predicate: oxidizes
    object: methanol
    description: Methanol dehydrogenase catalyzes the first methanol oxidation step.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: Mdh is a primary enzyme
      notes: Supports methanol dehydrogenase as the primary methanol-utilization enzyme.
    predicate_id: METPO:2007803
  - subject: methanol
    predicate: oxidized to
    object: formaldehyde
    description: Methanol oxidation produces formaldehyde for assimilation or further
      oxidation.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: converts methanol to formaldehyde
      notes: Supports methanol-to-formaldehyde conversion.
    predicate_id: METPO:2007405
  - subject: pqq_dependent_mdh
    predicate: located in
    object: periplasmic_space
    description: PQQ-dependent MDH oxidizes methanol in the periplasm of Gram-negative
      methylotrophs.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: oxidation of methanol occurs in the periplasmic space
      notes: Supports periplasmic localization of PQQ-dependent methanol oxidation.
    predicate_id: biolink:located_in
  - subject: pqq_dependent_mdh
    predicate: produces
    object: formaldehyde
    description: PQQ-dependent methanol dehydrogenase produces formaldehyde from methanol.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: converts methanol to formaldehyde
      notes: Source supports formaldehyde as the product of methanol oxidation by
        methanol dehydrogenases.
    predicate_id: METPO:2007800
  - subject: formaldehyde
    predicate: assimilated by
    object: rump_cycle
    description: Formaldehyde can enter the RuMP cycle for growth on methanol.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: ribulose monophosphate (RuMP) cycle
      notes: Supports RuMP as a native formaldehyde assimilation pathway.
  - subject: formaldehyde
    predicate: assimilated by
    object: serine_pathway
    description: Formaldehyde can enter the serine pathway for growth on methanol.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: serine pathway
      notes: Supports the serine pathway as a native formaldehyde assimilation route.
  - subject: rump_cycle
    predicate: has output
    object: biomass_precursor
    description: RuMP assimilation incorporates C1 carbon into cellular material.
    evidence:
    - reference: DOI:10.3389/fbioe.2021.787791
      snippet: growth support of microorganisms in methanol
      notes: Supports assimilation pathways as growth-supporting routes.
    predicate_id: RO:0002234
  - subject: hexulose_phosphate_synthase
    predicate: catalyzes
    object: rump_cycle
    description: Hps drives formaldehyde assimilation in the RuMP cycle.
    evidence:
    - reference: DOI:10.1038/s41467-023-43610-7
      notes: The RuMP pathway relies on 3-hexulose 6-phosphate synthase (Hps) and
        phosphohexose isomerase (Phi) to assimilate formaldehyde.
    predicate_id: biolink:catalyzes
  - subject: serine_glyoxylate_aminotransferase
    predicate: catalyzes
    object: serine_pathway
    description: SgaA/SGT is a conserved serine-cycle enzyme.
    evidence:
    - reference: DOI:10.1128/msystems.00248-24
      notes: Serine-glyoxylate transaminase (SGT) occurs in all 75 organisms; strong
        serine-cycle marker.
    predicate_id: biolink:catalyzes
  - subject: hydroxypyruvate_reductase
    predicate: catalyzes
    object: serine_pathway
    description: HprA/HPR is a ubiquitous serine-cycle enzyme.
    evidence:
    - reference: DOI:10.1128/msystems.00248-24
      notes: Hydroxypyruvate reductase (HPR) is ubiquitous (all 75 genomes); strong
        serine-cycle marker.
    predicate_id: biolink:catalyzes
  - subject: formaldehyde_dehydrogenase
    predicate: oxidizes to
    object: formate
    description: Formaldehyde dehydrogenase oxidizes formaldehyde to formate.
    evidence:
    - reference: DOI:10.1128/msystems.00248-24
      notes: FDH converts formaldehyde to formate in the dissimilatory oxidation branch.
  - subject: formate_dehydrogenase
    predicate: oxidizes to
    object: carbon_dioxide
    description: Formate dehydrogenase oxidizes formate to CO2 completing C1 dissimilation.
    evidence:
    - reference: DOI:10.1007/s00284-022-03141-8
      notes: Oxidation of formaldehyde via H4F/RuMP routes to formate and then to
        CO2; strong downstream dissimilation edge.
  - subject: mxa_methanol_dehydrogenase
    predicate: requires cofactor
    object: pqq
    description: MxaFI methanol dehydrogenase requires the PQQ redox cofactor.
    evidence:
    - reference: DOI:10.1128/msphere.00685-24
      notes: Mxa-type MDHs belong to the PQQ-dependent alcohol dehydrogenase family.
  - subject: mxa_methanol_dehydrogenase
    predicate: requires cofactor
    object: calcium_ion
    description: MxaFI methanol dehydrogenase requires a calcium ion in its active
      site.
    evidence:
    - reference: DOI:10.1016/b978-0-443-13307-7.00014-1
      notes: MxaF contains a calcium ion in its active site.
  - subject: mxa_methanol_dehydrogenase
    predicate: example of
    object: pqq_dependent_mdh
    description: The calcium-dependent Mxa enzyme is a PQQ-dependent alcohol dehydrogenase
      used for methanol oxidation.
    evidence:
    - reference: DOI:10.1128/msphere.00685-24
      snippet: Xox- and Mxa-type MDHs belong to the diverse group of pyrroloquinoline
        quinone (PQQ)-dependent alcohol dehydrogenases
      notes: Verified against the open mSphere primary article.
    predicate_id: rdfs:subClassOf
  - subject: formaldehyde
    predicate: oxidized by
    object: formaldehyde_dehydrogenase
    description: Formaldehyde dehydrogenase oxidizes formaldehyde to formate in the
      dissimilatory branch.
    evidence:
    - reference: DOI:10.3109/10409238.2012.697865
      snippet: formaldehyde is then oxidized to formate
      notes: Verified against the public full text.
  - subject: formate
    predicate: oxidized by
    object: formate_dehydrogenase
    description: Formate dehydrogenase continues C1 dissimilation by oxidizing formate
      to carbon dioxide.
    evidence:
    - reference: DOI:10.3109/10409238.2012.697865
      snippet: formate and carbon dioxide by formaldehyde and formate dehydrogenases,
        respectively
      notes: Verified against the public full text.
