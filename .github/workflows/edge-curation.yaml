# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: Edge curation native adapter

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CultureBotAI/culturebotai-claw
          ref: 1b5391d083ba85ac94e5279c3cba25ac4fde243c
          path: claw-contract
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install native runtime
        run: uv sync --frozen --extra dev
      - name: Verify shared contract pin and import origin
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/claw-contract/src
        run: uv run --frozen python scripts/adhoc/check_edge_contract_pin_20261107.py --claw-root claw-contract
      - name: Require native assertion conformance tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/claw-contract/src
          TRAIT_REQUIRE_EDGE_CONTRACT: "1"
        run: uv run --frozen pytest tests/test_edge_curation.py tests/test_edge_evidence.py -q
