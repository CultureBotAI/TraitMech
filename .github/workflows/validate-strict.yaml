name: validate-strict

on:
  pull_request:
    paths:
      - "src/traitmech/schema/**"
      - "data/traits/**"
      - "scripts/seed_from_metpo.py"
      - "scripts/validate_strict.py"
      - ".github/workflows/validate-strict.yaml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/traitmech/schema/**"
      - "data/traits/**"
      - "scripts/seed_from_metpo.py"
      - "scripts/validate_strict.py"
      - ".github/workflows/validate-strict.yaml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  validate-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run strict validation
        run: uv run python scripts/validate_strict.py

      - name: Upload failure TSV
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instance-validation-failures
          path: reports/instance_validation_failures.tsv
          if-no-files-found: ignore
