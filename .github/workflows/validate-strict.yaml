# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: validate-strict

on:
  pull_request:
    paths:
      - "src/traitmech/schema/**"
      - "data/traits/**"
      - "scripts/seed_from_metpo.py"
      - "scripts/validate_strict.py"
      - ".github/workflows/validate-strict.yaml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/traitmech/schema/**"
      - "data/traits/**"
      - "scripts/seed_from_metpo.py"
      - "scripts/validate_strict.py"
      - ".github/workflows/validate-strict.yaml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  validate-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run strict validation
        run: uv run python scripts/validate_strict.py

      - name: Upload failure TSV
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instance-validation-failures
          path: reports/instance_validation_failures.tsv
          if-no-files-found: ignore
