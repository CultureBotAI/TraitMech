# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: pytest

on:
  # Required checks report on every PR and on the combined queue commit.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      # As above: workflow-shape tests read the whole workflows directory.
      - ".github/workflows/**"
      # test_run_trait_graph_audit.py::test_the_tracked_corpus_is_clean reads
      # research/traits/ directly, so an artifact-only PR has to run it (#250).
      - "research/**"
      # As above: the corpus round-trip test reads data/traits/ (#554).
      - "data/traits/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short
