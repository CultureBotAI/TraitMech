name: pytest

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pytest.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pytest.yaml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
