# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: pytest

on:
  # Required checks report on every PR and on the combined queue commit.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      # As above: workflow-shape tests read the whole workflows directory.
      - ".github/workflows/**"
      # test_run_trait_graph_audit.py::test_the_tracked_corpus_is_clean reads
      # research/traits/ directly, so an artifact-only PR has to run it (#250).
      - "research/**"
      # As above: the corpus round-trip test reads data/traits/ (#554).
      - "data/traits/**"
      # Structured review validation consumes retained bundles and their schema.
      - "reviews/structured/**"
      - "schema/record_review.yaml"
      # The contract reads the profile's skill/rubric inputs and review guides.
      - "conf/record_review.yaml"
      - ".claude/skills/**"
      - "docs/**"
      - "DO_NOT_WORK.md"
      - "templates/**"
      # Native review recovery tests also verify the maintained recipe.
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

env:
  RECORD_REVIEW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && 'HEAD' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Recover retained review source commits
        run: uv run python scripts/fetch_record_review_bases.py --apply

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short

      - name: Structured record review contract
        run: uv run pytest tests/test_record_review_contract.py -q
