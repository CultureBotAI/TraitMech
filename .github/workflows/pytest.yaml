# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: pytest

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pytest.yaml"
      # test_run_trait_graph_audit.py::test_the_tracked_corpus_is_clean reads
      # research/traits/ directly, so an artifact-only PR has to run it (#250).
      - "research/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/traitmech/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pytest.yaml"
      # test_run_trait_graph_audit.py::test_the_tracked_corpus_is_clean reads
      # research/traits/ directly, so an artifact-only PR has to run it (#250).
      - "research/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
