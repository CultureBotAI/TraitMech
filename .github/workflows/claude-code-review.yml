# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: Claude Code Review

# Adopted from monarch-initiative/dismech. TraitMech is the pilot, matching
# pr-shepherd.
#
# This is the first workflow to use the culturebot-reviewer App, and the reason
# that App exists: it holds `contents: read` and `pull_requests: write`, so it can
# submit a review but physically cannot change what it is reviewing. Review by the
# same identity that wrote the change is not review.
#
# NOT MANAGED BY cron-profiles.yaml, and that is a real gap worth stating rather
# than hiding: the kill switch only rewrites `schedule:` blocks, and this is
# event-triggered.
#
# TO STOP IT, EDIT THE `on:` BLOCK BELOW — do NOT disable the workflow in the
# Actions tab. That advice used to be here and was true when written; #348/#354
# made it wrong. scripts/audit_required_workflows.py derives its required set
# from the FILES, so the Actions toggle leaves the `pull_request:` trigger in
# place and the audit reports every open PR as "expected, did not run" (#372).
# See docs/AGENT_IDENTITY.md.

on:
  # AUTOMATIC REVIEW IS OFF (2026-08-13Z). The `pull_request:` trigger is
  # removed; `/review` and manual dispatch still work.
  #
  # WHY: CLAUDE_CODE_OAUTH_TOKEN is out of quota, and the failure mode is not
  # "no review" — it is a RED CHECK ON EVERY PR that says nothing about the PR.
  # The "Verify the review agent actually ran" step below is deliberately
  # fail-loud (a review bot that fails open is worse), so an exhausted account
  # turns every PR red until the reset. Reds that mean nothing are the thing
  # #293 removed for Dependabot, for the same reason: they train people to
  # ignore reds.
  #
  # WHY REMOVE THE TRIGGER RATHER THAN `gh workflow disable`: the required set
  # in scripts/audit_required_workflows.py is DERIVED, not declared — "every
  # workflow in .github/workflows with a `pull_request:` trigger", read from the
  # files. Disabling via the Actions API leaves the trigger in the file, so the
  # audit would keep expecting a run that can never happen and report every open
  # PR as "expected, did not run". The file is the switch here; the API toggle
  # is not.
  #
  # TO RE-ENABLE: restore the two lines below. Nothing else needs changing —
  # the job's `if:`, its concurrency key and `track_progress` all still carry
  # their `pull_request` branches, deliberately left intact so that turning this
  # back on does not require re-deriving the fork/Dependabot/self-cancellation
  # reasoning documented on them (#212, #215, #293).
  #
  #   pull_request:
  #     types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  claude-review:
    # Three gates, each closing a different hole:
    #
    #  * fork PRs are excluded here for `pull_request` as a cheap early exit.
    #    The REAL guard is the "Refuse fork PRs" step below, which covers all
    #    three triggers — this expression does not gate issue_comment or
    #    workflow_dispatch (#212). Fork PRs cannot be reviewed by this workflow
    #    at all; do not route them through the manual dispatch.
    #  * `/review` comments only count from OWNER / MEMBER / COLLABORATOR.
    #    Without that, anyone who can comment could spend our tokens at will, and
    #    a comment body is attacker-controlled text this agent then reads.
    #  * comment triggers must be on a PR, not a plain issue.
    #  * Dependabot-triggered runs are skipped, because they CANNOT work (#293).
    #    GitHub gives `pull_request` runs from `dependabot[bot]` a read-only
    #    token and no access to Actions secrets, so
    #    `actions/create-github-app-token` dies on
    #    `Input required and not supplied: app-id`. Note that is step 7, not the
    #    first: the run does a full `gh pr checkout`, `uv tool install` and
    #    `uv sync` before it fails. The result was a permanent red check on
    #    every dependency PR that said nothing about the bump — a red that
    #    trains people to ignore reds.
    #
    #    A job skipped by an `if:` is NOT absent from the check list. GitHub
    #    leaves checks Pending only when the WORKFLOW is filtered out by
    #    path/branch/message; a skipped JOB reports a conclusion of `skipped`
    #    (grey), which branch protection accepts as satisfying a required check.
    #    So verify this by looking for grey-instead-of-red, not for the check
    #    disappearing.
    #
    #    That branch-protection behaviour is an ACCEPTED TRADEOFF, not a safety
    #    property — say it plainly, because "Verify the check ran, not that it
    #    was green" (#182/#184/#215) is the doctrine this bends. If
    #    claude-review is ever made required, this makes a required review check
    #    auto-satisfy on the one PR class that received no review. That is
    #    tolerable because of what still runs — but say that precisely: most
    #    workflows carry `paths:` filters naming only their own file, so gate
    #    coverage on a Dependabot PR depends on WHICH action was bumped. Across
    #    #277-#281 it ranged from two functional gates (#277) to seven (#281).
    #    The floor is `pr-sanity` and `vendored-sync` — the only two FUNCTIONAL
    #    GATES without a `paths:` filter (this workflow is unfiltered too) — and
    #    `pr-sanity` is the one enforcing SHA pinning, so the gate that
    #    validates this class of change is the one immune to the filters.
    #    (`main` has no branch protection today —
    #    `gh api repos/:owner/:repo/branches/main/protection` returns 404 — so
    #    this is latent, not live.)
    #
    #    Dependency PRs do not become unreviewable: comment `/review`, or use
    #    the `workflow_dispatch` input above. Neither is Dependabot-triggered,
    #    so both get secrets. Gate on `github.actor` rather than the PR author
    #    precisely because actor is what determines whether secrets exist — a
    #    human pushing to a Dependabot branch makes the run privileged again and
    #    it should review, whereas `pull_request.user.login` stays
    #    `dependabot[bot]` forever. Re-running a failed Dependabot run does NOT
    #    help: GitHub keeps the restrictions "even if the workflow is re-run by
    #    a different actor".
    #
    #    Two known ways exist to get secrets onto a Dependabot run. Do not
    #    enumerate them as a closed set — reject each on its own merits:
    #
    #    `pull_request_target` — NOT inert, and not to be used here. GitHub's
    #    read-only/no-secrets restriction on it applies when the PR's BASE REF
    #    was created by Dependabot (a Dependabot PR stacked on a Dependabot
    #    branch). An ordinary Dependabot PR onto `main` under
    #    `pull_request_target` DOES get a writable token and Actions secrets —
    #    a named privilege-escalation pattern, not a dead end. Verify that
    #    against GitHub's "Dependabot on GitHub Actions" page rather than this
    #    comment; the refusal below deliberately does not depend on it. This
    #    job runs `gh pr checkout` and then `uv sync` and the branch's `just`
    #    recipes while holding CLAUDE_CODE_OAUTH_TOKEN and the App key, so
    #    `pull_request_target` would execute PR-controlled code with secrets
    #    attached — the hazard the "Refuse fork PRs" step below exists for
    #    (#212), through a different door.
    #
    #    Dependabot secrets — a separate store the `secrets` context resolves
    #    against on these runs, which is why `app-id` arrived empty rather than
    #    denied. Populating it would make the job run. Don't: on `pull_request`
    #    the workflow that executes comes from the PR, and this repo's
    #    dependabot.yml enables only the `github-actions` ecosystem, so a
    #    Dependabot PR's entire content is a change to which action SHAs this
    #    job runs. Handing it the reviewer App key means an unreviewed,
    #    freshly-bumped action executes holding it.
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '/review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}

    # CANCELLATION IS FOR PUSHES AND NOTHING ELSE (#215).
    #
    # The bug: `track_progress` makes claude-code-action post a progress comment
    # as it works. That comment fires `issue_comment: created`, which resolved to
    # the SAME group key — the `||` chain falls through to
    # `github.event.issue.number` for the same PR — and `cancel-in-progress` then
    # killed the run that had just posted it. Every review, every PR. The comment
    # run cancelled the real one and then skipped itself on the `if:` above,
    # having done nothing at all.
    #
    # Collapsing rapid pushes to one PR is the only thing this group is now for,
    # so only `pull_request` runs share a key. Everything else — every comment,
    # every dispatch — gets `github.run_id`, which is unique per run, so it can
    # neither cancel nor be cancelled.
    #
    # That is a narrowing, not a restoration. The original key spanned all three
    # triggers, which also let a `/review` supersede a review already in flight;
    # that is deliberately given up here. Two reviews running at once is a far
    # cheaper failure than the one this replaced — no review running at all.
    #
    # That is deliberately structural rather than conditional. Keying merely by
    # `github.event_name` fixes the push path but leaves `/review` runs sharing
    # one key with every other comment on the PR, including ones this agent posts
    # itself (`gh pr comment` is allowlisted below). Whether that bites depends on
    # whether a job skipped by `if:` acquires a job-level group — and GitHub's
    # workflow-syntax reference documents `jobs.<job_id>.concurrency` without ever
    # saying. Not a thing to build on: this is the third concurrency bug in this
    # fleet after #199 and #196's review. The invariant here holds under any
    # evaluation order.
    #
    # The block sits on the job rather than the workflow because that is where it
    # belongs, not because anything depends on it. With unique keys off the push
    # path, placement is now style.
    #
    # None of this was visible before #210 merged. `issue_comment` workflows
    # always run from the DEFAULT BRANCH's copy of the file, and `main` had no
    # claude-code-review.yml while the feature branch was in review — so the
    # cancelling trigger did not exist until the moment it landed.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}-${{ github.event_name == 'pull_request' && 'push' || github.run_id }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse fork PRs
        # THE FORK GUARD FOR ALL THREE TRIGGERS. The job's `if:` only gates
        # `pull_request`; issue_comment and workflow_dispatch had none, and once
        # the next step began checking out PR head content and running `uv sync`
        # and the repo's `just` recipes, that meant executing fork-controlled code
        # in a job holding CLAUDE_CODE_OAUTH_TOKEN and a reviewer App token (#212).
        #
        # This runs BEFORE any fork content reaches the disk. Fork PRs simply
        # cannot be reviewed here — reviewing untrusted code in a privileged job
        # is not something to make convenient.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != "false" ]; then
            echo "::error title=Fork PR::PR #$PR_NUMBER comes from a fork. This workflow executes repository code (uv sync, just recipes) with privileged tokens, so it will not run against fork content."
            exit 1
          fi
          echo "PR #$PR_NUMBER is same-repo; proceeding."

      - name: Check out the PR head
        # actions/checkout gives the DEFAULT BRANCH on issue_comment and
        # workflow_dispatch — only the pull_request event yields a PR ref. Without
        # this the agent would read `main` through Read/Grep/Glob while reviewing
        # the PR's diff through `gh pr diff`, and confidently report additions as
        # missing (#211).
        #
        # Run on every trigger, so the agent always reviews the HEAD commit — what
        # the author actually wrote — rather than the synthetic merge commit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ env.PR_NUMBER }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install just and sync the project
        # `just` and `uv` do not ship on ubuntu-latest. Without them the two most
        # valuable allowlisted tools — `just validate-history` and
        # `just audit-graphs` — fail with command-not-found, and the agent either
        # skips its best checks or reports the infrastructure error as a finding
        # about the PR (#211).
        run: |
          set -euo pipefail
          uv tool install rust-just
          uv sync

      - name: Generate culturebot-reviewer token
        id: reviewer-token
        # Reviews are posted as the reviewer App, NOT as github-actions. That is
        # what makes the writer/reviewer split mean something: an approval from
        # this identity cannot have come from whatever wrote the branch.
        #
        # No continue-on-error. Falling back to github.token would silently
        # restore the self-approval hole the split exists to close, and it would
        # look identical in the logs.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Resolve model from the fleet agent-config
        id: model
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/CultureBotAI/culturebotai-claw/main/.github/agent-config.yaml
          curl -fsSL "$url" -o /tmp/agent-config.yaml
          # `uv run --no-project --with pyyaml`, not bare python3: nothing here
          # installs PyYAML, and the ubuntu-latest image happening to ship it in
          # its system interpreter is an image detail, not a contract (#205).
          # --no-project keeps uv from syncing this repo's whole dependency set
          # just to parse one small YAML file.
          model=$(uv run --no-project --with pyyaml python -c "
          import yaml, sys
          cfg = yaml.safe_load(open('/tmp/agent-config.yaml'))
          wf = cfg.get('workflows', {}).get('claude-code-review', {})
          m = wf.get('model') or cfg.get('default_model')
          if not m:
              sys.exit('agent-config names no model and has no default_model')
          print(m)
          ")
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Using model: $model"

      - name: Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.reviewer-token.outputs.token }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          # Agent-authored PRs are exactly what this exists to review.
          allowed_bots: "claude,github-actions,culturebot-agent"
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(git log:*),Bash(git diff:*),Bash(just validate-history:*),Bash(just audit-graphs:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. Read README.md and anything relevant under
            docs/ for the repository's conventions. (This repo has no CLAUDE.md;
            do not go looking for one.)

            ## What matters here

            TraitMech is a microbial trait knowledge base. Weight the review
            accordingly:

            - **Ontology grounding.** CURIEs must resolve and the label must match
              the term. A plausible-looking wrong CURIE is the most damaging thing
              that gets past review — `PATO:0000383` is "female", not "decreased
              temperature", and that mistake shipped once already.
            - **Evidence integrity.** Every snippet must be a verbatim quote from
              the cited source. A paraphrase that reads well is worse than an
              obvious error, because nothing downstream will catch it.
            - **Causal-graph structure.** Edges must reference declared nodes.
              Watch for nodes that are connected to something but unreachable from
              the trait node — the audit ratchets on that (`just audit-graphs`).
            - **Curation history.** A change to `data/traits/**` should come with a
              record under `history/`. Its absence is advisory, not blocking, so
              mention it without treating it as a defect.
            - **Schema conformance**, and the conventions in README.md / docs/.

            ## Severity, and be honest about it

            - 🔴 CRITICAL — wrong data, an unresolvable or mismatched CURIE, a
              fabricated citation, a snippet that is not a real quote, or anything
              that would fail validation.
            - 🟡 IMPORTANT — a real defect that is not corrupting: a too-general
              ontology term, a missing required field, a broken cross-reference.
            - 🔵 SUGGESTION — genuinely optional.

            Do not pad. A short review naming two real problems is worth more than
            a long one listing ten stylistic preferences, and it is likelier to be
            acted on. If the change is good, say so briefly and approve it.

            Do not restate what the diff does — the author knows. Say what is
            wrong with it, or that nothing is.

            ## Verdict

            If there is any 🔴 or 🟡:
                gh pr review ${{ env.PR_NUMBER }} --request-changes --body "<summary>"

            Otherwise:
                gh pr review ${{ env.PR_NUMBER }} --approve --body "<summary>"

            You are the reviewer identity and hold no write access to the code, so
            you cannot fix anything yourself. Do not offer to. Say precisely what
            needs changing and let the author change it.

      # claude-code-action exits 0 even when the agent run itself errored, which
      # produces a green check with no review posted — a phantom pass. DisMech was
      # bitten by this twice: a weekly usage limit on CLAUDE_CODE_OAUTH_TOKEN,
      # which silently no-ops EVERY agent workflow account-wide, and a --model
      # pinned to a name that no longer existed.
      #
      # This fleet has repeatedly shipped checks that silently did not run
      # (TraitMech#182, #184, and a nightly job pointed at a nonexistent path
      # masked by `|| true`). A review bot that fails open would be the same bug
      # with a bigger blast radius, so inspect the execution log and fail loudly.
      - name: Verify the review agent actually ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          file="${EXECUTION_FILE:-}"
          if [[ -z "$file" || ! -f "$file" ]]; then
            file="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [[ ! -f "$file" ]]; then
            echo "::error title=Claude review failed::No execution log found; the review agent did not run."
            exit 1
          fi
          python3 - "$file" <<'PY'
          import json, os, sys

          def summary(md):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write(md + "\n")

          raw = open(sys.argv[1], encoding="utf-8").read().strip()
          try:
              events = json.loads(raw)
              if not isinstance(events, list):
                  events = [events]
          except json.JSONDecodeError:
              events = [json.loads(line) for line in raw.splitlines() if line.strip()]

          results = [e for e in events if isinstance(e, dict) and e.get("type") == "result"]
          if not results:
              print("::error title=Claude review failed::No result event in the execution "
                    "log; the agent did not complete.")
              summary("### Claude review failed\nNo result event — the agent did not complete.")
              sys.exit(1)

          r = results[-1]
          stats = (f"num_turns={r.get('num_turns')} cost=${r.get('total_cost_usd')} "
                   f"subtype={r.get('subtype')}")

          if not r.get("is_error"):
              print(f"Claude review completed cleanly: {stats}")
              sys.exit(0)

          # The log entries carry subtype / is_error / errors — there is no
          # `error` key, so keying solely on r["error"] left the usage-limit
          # branch firing only by luck of the substring match (#212). Look at
          # every field that actually exists.
          reason = str(r.get("error") or r.get("subtype") or "").strip()
          detail = str(r.get("result") or "").strip()
          errors = " ".join(str(e) for e in (r.get("errors") or []))
          haystack = f"{reason} {detail} {errors}".lower()

          if "rate_limit" in haystack or "usage limit" in haystack or "weekly limit" in haystack:
              msg = ("Claude USAGE LIMIT reached — NO review ran. This is an account-quota "
                     "issue on CLAUDE_CODE_OAUTH_TOKEN, NOT a problem with this PR. It also "
                     "silently affects every other agent workflow in the org. Fix: wait for "
                     "the reset, rotate the token to an account with headroom, or set "
                     "ANTHROPIC_API_KEY for pay-per-use. Re-run this check afterward.")
              print(f"::error title=Claude review skipped: usage limit::{msg}")
              summary("### Claude review skipped — usage limit reached\n\n" + msg)
              sys.exit(1)

          msg = (f"Review agent errored (is_error=true); NO review was posted. "
                 f"error={reason!r} detail={detail!r} {stats}. Common causes: an "
                 "invalid or retired --model, a bad CLAUDE_CODE_OAUTH_TOKEN, or an "
                 "aborted run.")
          print(f"::error title=Claude review errored::{msg}")
          summary("### Claude review errored\n\n" + msg)
          sys.exit(1)
          PY
