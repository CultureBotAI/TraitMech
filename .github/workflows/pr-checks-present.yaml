# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: pr-checks-present

# Catches two failures a green checks tab cannot distinguish from health:
# a PR that receives NO CI at all (#345), and a PR where some workflows ran
# while others that should have ran did not (#348).
#
# PR #344 produced zero `pull_request` workflow runs. Not failures, not skips —
# nothing. `gh pr checks` printed "no checks reported", `mergeStateStatus` stayed
# `CLEAN`, and the PR looked mergeable. Two of the workflows that failed to fire
# (pr-sanity, vendored-sync) carry no `paths:` filter at all, deliberately per
# #184/#200, so the usual filter explanations do not apply. The mechanism is
# still unidentified — which is exactly why this detects the SILENCE rather than
# guarding against one particular cause.
#
# audit-required-workflows is the second, stronger step. The first can only see
# TOTAL silence, because pr-sanity.yaml and vendored-sync.yaml carry no `paths:`
# filter and so record a run on every PR — so qc, pytest and validate-strict
# could all be mute and it would still pass. (claude-code-review.yml used to be
# the example here; it stopped running on `pull_request` on 2026-08-13Z while its
# token has no quota. Total-silence detection is unaffected — it needs SOME
# unfiltered PR-triggered workflow, and those two remain.) The second checks each PR-triggered
# workflow by name, with `paths:` filters evaluated against the PR's own changed
# files so a legitimately filtered-out workflow is not reported.
#
# TRIGGERED ON PUSH TO MAIN, NOT ON pull_request. That is the whole point: a
# workflow that runs on `pull_request` cannot detect a PR where `pull_request`
# events are not arriving. Pushes to main demonstrably do fire — every merge in
# this repo produces runs — so this reports on the open PRs from a vantage point
# that works.
#
# NO `schedule:` trigger. culturebotai-claw's cron-profiles.yaml is the fleet
# kill switch and pr-shepherd.yml explains why shipping a cron here would make it
# a lie. Run by hand between merges if a PR is sitting a long time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Unique per run, per WORKFLOW_CONVENTIONS.md: this only ever runs on main or by
  # dispatch, so nothing here supersedes anything. A shared key would not cancel
  # (we must not — see below) but WOULD queue, making a manual dispatch wait
  # behind an in-flight push run for no benefit (#346 review).
  group: pr-checks-present-${{ github.run_id }}
  # Never cancel: on main, cancelling would leave the report unmade for that
  # commit, which is the state this workflow exists to make visible.
  cancel-in-progress: false

jobs:
  pr-checks-present:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Report open PRs with no pull-request-triggered checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: just audit-pr-checks

      # `if: always()` so a TOTAL silence does not hide the PARTIAL-silence
      # report. Without it, the step above failing would skip this one, and the
      # two answer different questions -- an outage that mutes one PR entirely
      # would leave every other PR's per-workflow coverage unreported (#348).
      - name: Report open PRs missing a workflow that should have run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: just audit-required-workflows
