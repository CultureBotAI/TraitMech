name: qc

on:
  pull_request:
    paths:
      - "data/traits/**"
      - "src/traitmech/schema/**"
      - "src/traitmech/**.py"
      - "scripts/**.py"
      - "justfile"
      - "pyproject.toml"
      - ".github/workflows/qc.yaml"
      # `audit-derived-reports` (#214) compares the tracked reports against a
      # fresh generation, so every input to that generation has to trigger it.
      # A filter narrower than what the job verifies is how #184 and #200
      # happened.
      #   reports/**  — the artefact itself, edited directly
      #   mappings/** — the OTHER input. The residual is a function of the
      #                 corpus AND the grounding tables, so adding a row to
      #                 mappings/predicate_grounding.tsv shrinks the residual.
      #                 That is the single most common way these reports go
      #                 stale, because it is exactly the section 9 workflow.
      - "reports/**"
      - "mappings/**"
      # pages/ joined the gate in #230. Both its inputs have to trigger too:
      # the pages themselves, and the templates — a one-line template edit
      # changes all 489 rendered files, so leaving it out would be the widest
      # possible version of the filter-narrower-than-the-job bug (#184, #200).
      - "pages/**"
      - "src/traitmech/templates/**"
      # The renderer's other two tracked inputs. Both change what it emits, so
      # both must trigger the job that compares its output: the embedding
      # tables feed the match/UMAP/graph sections, and metpo.owl supplies the
      # version string in every page footer.
      - "data/embeddings/**"
      - "data/raw/metpo.owl"
      # research/ joined the gate in #242, via audit-research-artifacts: it
      # checks every manifest `ok` row's artifact is present and that no
      # artifact carries a malformed CURIE. Without this line the job cannot
      # fire on a PR that adds only research artifacts — which is the shape of
      # every sweep batch, and the shape the gate exists for. Same
      # filter-narrower-than-the-job bug as #184 and #200 (#250).
      - "research/**"
      # conf/ holds both ratchet baselines — causal_graph_audit_baseline.tsv and
      # evidence_snippet_baseline.tsv — plus id_label_targets.yaml. Without this
      # line, WEAKENING a baseline does not re-run qc, which is the one edit
      # that most needs it. Found by audit-qc-paths on its first run: the fourth
      # instance of this bug after #184, #200 and #250 (#252).
      - "conf/**"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run qc (validate-strict + audit-schema + audit-writers)
        run: just qc
