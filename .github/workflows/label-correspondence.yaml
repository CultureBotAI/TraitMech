# Conventions for this directory: docs/WORKFLOW_CONVENTIONS.md
name: label-correspondence

# Phase 2 (enforcing): `just validate-products` is a BLOCKING gate — any
# id↔label MISMATCH / ID_NOT_FOUND / UNKNOWN_PREFIX / ADAPTER_ERROR /
# MISSING_COLUMN in the ontology grounding tables fails the build. The 15
# pre-existing wrong CURIEs found at Phase-1 adoption have been corrected
# (verified vs OAK) and the trait-YAML groundings re-migrated; the one
# curator-accepted residual (PATO:0001717 "light intensity") stays green via the
# `exceptions:` allow-list in conf/id_label_targets.yaml. The drift report is
# still generated and uploaded as a triage artifact even when the gate passes.
#
# The vendored-sync job used to live here and inherited the `paths:` filter
# below, which is scoped to this workflow's expensive OAK-backed check. That
# filter listed only 1 of the 6 files the drift checker compares, so the guard
# almost never fired (#184). It now has its own workflow — .github/workflows/
# vendored-sync.yaml — with no paths filter, because at ~7s there is nothing to
# save by filtering it. The filter below is correct for THIS job, which takes
# ~2min and needs uv + a cached OAK ontology download.

on:
  pull_request:
    paths: &trigger_paths
      - "mappings/**"
      - "scripts/validate_id_label_correspondence.py"
      - "conf/id_label_targets.yaml"
      - ".github/workflows/label-correspondence.yaml"
      # This job resolves `sqlite:obo:` through OAK, so which oaklib it
      # installs decides which host it downloads from — the whole subject of
      # #562. Without these, the blocking gate could not be triggered by the
      # PR that changed exactly that, and #565 had to be dispatched by hand
      # to verify it (#566).
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths: *trigger_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync

      # Cache OAK sqlite ontologies (CHEBI/GO/ENVO/PATO/RO) across runs.
      - name: Cache OAK ontologies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-v1

      # Always generate + upload the drift report first, so the triage artifact
      # exists even when the enforce step below fails the build.
      - name: Generate id↔label drift report
        run: just report-label-drift

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-drift-report-${{ github.run_id }}
          path: reports/label_drift.tsv
          if-no-files-found: warn

      # Phase 2 blocking gate: fail on any id↔label error-class verdict.
      # Curator-accepted residuals pass as OK_EXCEPTION.
      - name: Enforce id↔label correspondence
        run: just validate-products
