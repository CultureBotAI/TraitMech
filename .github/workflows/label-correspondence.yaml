name: label-correspondence

# Phase 2 (enforcing): `just validate-products` is a BLOCKING gate — any
# id↔label MISMATCH / ID_NOT_FOUND / UNKNOWN_PREFIX / ADAPTER_ERROR /
# MISSING_COLUMN in the ontology grounding tables fails the build. The 15
# pre-existing wrong CURIEs found at Phase-1 adoption have been corrected
# (verified vs OAK) and the trait-YAML groundings re-migrated; the one
# curator-accepted residual (PATO:0001717 "light intensity") stays green via the
# `exceptions:` allow-list in conf/id_label_targets.yaml. The drift report is
# still generated and uploaded as a triage artifact even when the gate passes.
#
# The validator-pin job below is also blocking: it is fast and dependency-free,
# and guards the cross-repo byte-identical vendoring of the validator + tests.

on:
  pull_request:
    paths: &trigger_paths
      - "mappings/**"
      - "scripts/validate_id_label_correspondence.py"
      - "conf/id_label_targets.yaml"
      - ".github/workflows/label-correspondence.yaml"
  push:
    branches: [main]
    paths: *trigger_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cross-repo durability guard: the validator is vendored byte-identical across
  # the Mech repos, so fail fast if this copy drifts from its pinned sha256.
  # Fast and dependency-free (no uv / OAK), so it blocks even though the drift
  # report below is non-blocking.
  validator-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify validator pin
        run: sha256sum -c scripts/.validate_id_label_correspondence.sha256

  label-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync

      # Cache OAK sqlite ontologies (CHEBI/GO/ENVO/PATO/RO) across runs.
      - name: Cache OAK ontologies
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-v1

      # Always generate + upload the drift report first, so the triage artifact
      # exists even when the enforce step below fails the build.
      - name: Generate id↔label drift report
        run: just report-label-drift

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-drift-report-${{ github.run_id }}
          path: reports/label_drift.tsv
          if-no-files-found: warn

      # Phase 2 blocking gate: fail on any id↔label error-class verdict.
      # Curator-accepted residuals pass as OK_EXCEPTION.
      - name: Enforce id↔label correspondence
        run: just validate-products
