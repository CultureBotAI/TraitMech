<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — TraitMech</title>
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ root }}index.html">TraitMech</a>
    <nav>
      <a href="{{ root }}index.html">Home</a>
      <a href="https://github.com/CultureBotAI/TraitMech">GitHub</a>
      <a href="https://w3id.org/metpo">METPO</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    Built {{ generated_at }} from
    <a href="https://w3id.org/metpo">METPO {{ metpo_version }}</a>
    · {{ total_traits }} TraitRecords
    · embedding coverage {{ embedding_coverage_pct }}%
    (kg-microbe deepwalk 200-D, 2024-09-25)
  </div>
</footer>
</body>
</html>
