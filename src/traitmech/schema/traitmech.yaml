id: https://w3id.org/traitmech
name: traitmech
title: TraitMech - Microbial Trait Schema
description: |
  LinkML schema for modeling microbial ecophysiological traits and phenotypes.
  Each TraitRecord is a single trait (e.g. "pH optimum", "flagellar arrangement",
  "growth temperature minimum") with provenance back to its METPO class and
  optional cross-references to PATO / GO / NCIT / ENVO / CHEBI.

  Records are seeded from METPO (https://w3id.org/metpo) and curated incrementally,
  mirroring the dismech / CultureMech / MIM workflow: one YAML per trait, optional
  evidence-bearing audit trail, validation via `just validate-all`.

license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  traitmech: https://w3id.org/traitmech/
  biolink: https://w3id.org/biolink/vocab/
  METPO: https://w3id.org/metpo/
  # Cross-reference ontologies commonly used by METPO
  PATO: http://purl.obolibrary.org/obo/PATO_
  GO: http://purl.obolibrary.org/obo/GO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  UO: http://purl.obolibrary.org/obo/UO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  IAO: http://purl.obolibrary.org/obo/IAO_
  RO: http://purl.obolibrary.org/obo/RO_
  MICRO: http://purl.obolibrary.org/obo/MICRO_
  KEGG: https://www.kegg.jp/entry/
  MetaCyc: https://biocyc.org/META/NEW-IMAGE?object=
  UniProtKB: https://www.uniprot.org/uniprotkb/
  # Protein families/domains — the taxon-agnostic grounding for causal-graph
  # GENE_OR_PROTEIN nodes that name a family rather than one organism's protein.
  InterPro: https://www.ebi.ac.uk/interpro/entry/InterPro/
  NCBIfam: https://www.ncbi.nlm.nih.gov/genome/annotation_prok/evidence/
  ComplexPortal: https://www.ebi.ac.uk/complexportal/complex/
  NCBIGene: https://www.ncbi.nlm.nih.gov/gene/
  # Taxonomy
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  # Provenance
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  DOI: https://doi.org/
  dcterms: http://purl.org/dc/terms/
  # Schema-org
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: traitmech
default_range: string

imports:
  - linkml:types
  # Shared, byte-identical Mech module: Discussion (knowledge gaps) + Dataset.
  # Vendored + sha-pinned across the Mech repos — see culturebotai-claw#7.
  - mech_shared

# ================================================================
# ROOT CLASS — one YAML file per TraitRecord
# ================================================================

classes:

  TraitRecord:
    class_uri: traitmech:TraitRecord
    description: >-
      A single microbial trait (phenotype, capability, or quality) with
      provenance back to its METPO source class. One YAML per record.
    attributes:
      identifier:
        description: >-
          Stable CURIE for this trait. Seeded records use the METPO CURIE
          directly (e.g. METPO:1000331). Curator-minted records may use
          the `traitmech:` prefix.
        identifier: true
        required: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      label:
        description: Human-readable trait label (rdfs:label of the source class).
        required: true
        range: string

      definition:
        description: >-
          Textual definition. For seeded records this is the IAO:0000115
          annotation from METPO; curator can extend.
        range: string

      definition_source:
        description: >-
          IAO:0000119 — citation for the definition (e.g. PMID:12345678,
          DOI:10.1234/abc, or "TODO:add_citation" when missing upstream).
        range: string

      synonyms:
        description: >-
          Alternate labels (oboInOwl:hasExactSynonym, hasNarrowSynonym,
          hasBroadSynonym, hasRelatedSynonym).
        multivalued: true
        inlined_as_list: true
        range: TraitSynonym

      parent_traits:
        description: >-
          rdfs:subClassOf parents — CURIEs of broader METPO/upper-ontology
          classes. Multivalued because METPO uses multi-parent classification.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      xrefs:
        description: >-
          oboInOwl:hasDbXref — equivalents in other ontologies (PATO, GO,
          NCIT, ENVO, CHEBI, UO, RO, MICRO, OBI). Use only for *true*
          equivalences; record broader/narrower relations as
          `parent_traits:` or notes instead.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      canonical_examples:
        description: >-
          Canonical exemplar organisms for this trait — the textbook /
          reference taxa a curator would point to as "this trait, archetypally".
          Each example carries an NCBITaxon CURIE, the organism name, an
          optional role note, and an optional citation. Distinct from the
          causal graphs (which model *how* the trait works, taxon-agnostically):
          these answer *who* canonically exhibits it. Curation-sourced — there is
          no trait→taxon edge table upstream — so each example should be
          backed by a reference where practical.
        multivalued: true
        inlined_as_list: true
        range: CanonicalExample

      replaces:
        description: >-
          dcterms:replaces — CURIEs of records that this trait
          supersedes. Used to track genuine record lineage, such as a
          curator splitting one trait into two or replacing a renumbered
          upstream class. It is not used to precompose a relation and its
          object: substrate use remains an organism-level METPO predicate
          composed with a CHEBI class at the assertion site. The replaced
          record remains resolvable with mapping_status: DEPRECATED; this
          field carries the structured forward link from the new record to
          the old. The reverse direction (deprecated → replacement) is the
          OBO/IAO `IAO:0100001` (term replaced by); we use dcterms:replaces
          because the field lives on the *new* record and points to the *old*.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
        slot_uri: dcterms:replaces

      trait_category:
        description: >-
          Coarse-grained bucket for filesystem organisation and reporting.
          Inferred from the METPO upper-class lineage when seeding; curator
          can override.
        range: TraitCategoryEnum
        recommended: true

      term_kind:
        description: >-
          Whether this entry is an OWL Class (most METPO traits) or a
          DatatypeProperty / ObjectProperty (the value-bearing companions
          like METPO:has_pH_optimum).
        range: TermKindEnum

      domain:
        description: >-
          For DatatypeProperty / ObjectProperty entries — the typed subject
          (typically biolink:OrganismTaxon).
        range: string

      range_:
        description: >-
          For DatatypeProperty / ObjectProperty entries — the value range
          (e.g. xsd:decimal, xsd:string, or a TraitRecord identifier).
        range: string
        slot_uri: traitmech:property_range

      priority:
        description: >-
          Relative editorial priority (CRITICAL/HIGH/MEDIUM/LOW) for the
          curation backlog — surfaced from METPO's internal proposals.
        range: PriorityEnum

      subset:
        description: oboInOwl:inSubset tag (e.g. metpo_proposal_2026_04).
        range: string

      observation_count:
        description: >-
          Number of underlying source observations (from METPO's proposal
          TSVs); useful for ranking high-yield curation targets.
        range: integer

      created_by:
        description: IAO:0000117 — original term author from METPO.
        range: string

      contributors:
        description: Additional curators who have edited this record locally.
        multivalued: true
        range: string

      evidence:
        description: >-
          Optional citation list — populated when a curator backs the
          trait with literature support beyond METPO's own provenance.
          Intentionally *not* `required: true` (compare CausalEdge.evidence):
          a TraitRecord inherits provenance from the underlying METPO term,
          so requiring trait-level citations would force every SEEDED row
          to carry duplicate boilerplate. Causal claims are different —
          they are curator-asserted and must carry their own support.
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

      mapping_status:
        description: >-
          Lifecycle flag. SEEDED rows came directly from metpo.owl;
          REVIEWED rows have curator sign-off; DEPRECATED rows are
          retained for traceability but flagged as superseded.
        range: MappingStatusEnum

      curation_history:
        description: Append-only audit trail.
        multivalued: true
        inlined_as_list: true
        range: CurationEvent

      causal_graphs:
        description: >-
          Optional causal mechanism graphs for this trait. Nodes represent
          traits, pathways, environmental or experimental factors,
          genes/proteins, chemicals, cellular locations, molecular functions,
          and biological processes. Edges must carry evidence.
        multivalued: true
        inlined_as_list: true
        range: CausalGraph
      discussions:
        description: >-
          Open questions, knowledge gaps, controversies, and curation todos
          attached to this trait (shared Discussion supertype; anchor
          `attaches_to` into e.g. `causal_graphs#<edge>`).
        multivalued: true
        inlined_as_list: true
        range: Discussion
      datasets:
        description: Public datasets (omics/sequence/phenotype) relevant to this trait.
        multivalued: true
        inlined_as_list: true
        range: Dataset

  TraitSynonym:
    description: A synonym entry with its scope.
    attributes:
      synonym_text:
        required: true
        range: string
      synonym_type:
        range: SynonymTypeEnum
      source:
        description: Where the synonym came from (e.g. "metpo.owl", "PMID:...").
        range: string

  EvidenceItem:
    description: A literature or database citation supporting a TraitRecord.
    attributes:
      reference:
        description: PMID:..., DOI:..., or an opaque URL.
        required: true
        range: string
      snippet:
        description: Verbatim quote from the source supporting the trait claim.
        range: string
      notes:
        range: string

  CanonicalExample:
    description: >-
      A canonical exemplar organism for a trait — a reference taxon that
      archetypally exhibits the trait. Curation-sourced; back with a citation
      where practical (compare EvidenceItem).
    attributes:
      taxon_id:
        description: NCBITaxon CURIE for the exemplar organism (e.g. NCBITaxon:1423).
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        description: Scientific name of the exemplar organism (e.g. Bacillus subtilis).
        required: true
        range: string
      note:
        description: >-
          Why this organism is canonical for the trait (e.g. "model rod-shaped
          Gram-positive", "type strain for acidophily studies").
        range: string
      reference:
        description: >-
          IAO:0000119-style citation supporting the exemplar claim
          (PMID:..., DOI:..., or an opaque URL). Optional but recommended.
        range: string

  CausalGraph:
    description: A directed causal mechanism graph associated with a trait.
    attributes:
      graph_id:
        description: Stable local graph identifier within the TraitRecord.
        identifier: true
        required: true
        range: string
      title:
        description: Human-readable graph title.
        range: string
      description:
        description: Short scope note for the graph.
        range: string
      scope_status:
        description: >-
          Curator disposition for whether this graph represents a biological
          mechanism. NONMECHANISTIC is reserved for an explicitly reviewed
          measurement, classification, or upper-ontology context and must be
          explained in scope_notes. Omission is treated as REVIEW_NEEDED and is
          a blocking coverage-audit gap; the slot remains schema-optional only
          for protected legacy records.
        range: CausalGraphScopeEnum
      scope_notes:
        description: Evidence-based rationale for the graph scope disposition.
        range: string
      nodes:
        description: Nodes participating in the causal graph.
        required: true
        multivalued: true
        inlined_as_list: true
        range: CausalNode
      edges:
        description: Evidence-backed directed causal or mechanistic edges.
        required: true
        multivalued: true
        inlined_as_list: true
        range: CausalEdge

  CausalNode:
    description: >-
      A node in a trait causal graph. GENE_OR_PROTEIN is a legacy enum label;
      within TraitMech it is restricted to proteins and protein complexes.
      Genes, operons, and gene clusters are metadata, not primary graph nodes.
    attributes:
      node_id:
        description: Stable local node identifier used by graph edges.
        identifier: true
        required: true
        range: string
      label:
        description: Human-readable node label.
        required: true
        range: string
      node_type:
        description: Broad semantic category used for rendering and curation.
        required: true
        range: CausalNodeTypeEnum
      grounding:
        description: >-
          Preferred ontology or database CURIE for the node when available.
          A taxon-agnostic gene/protein node should use a semantic family,
          function, or complex CURIE such as GO, InterPro, NCBIfam, or
          ComplexPortal. UniProtKB accessions are organism-specific instances
          and belong in protein_examples, not here.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      grounding_status:
        description: >-
          Explicit review disposition for a GENE_OR_PROTEIN node that has no
          exact semantic grounding. REVIEWED_LABEL_ONLY requires a reason in
          grounding_notes. Grounded nodes do not need this field.
        range: ProteinGroundingStatusEnum
      grounding_notes:
        description: >-
          Curator rationale for retaining a GENE_OR_PROTEIN node label without
          an exact semantic grounding.
        range: string
      xrefs:
        description: Additional ontology/database CURIEs for this node.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      description:
        description: Optional node-specific scope note.
        range: string
      gene_symbols:
        description: >-
          Gene symbols encoding this protein or the explicit components of this
          protein complex. Gene symbols are metadata and do not denote primary
          causal nodes.
        multivalued: true
        range: string
      operon:
        description: >-
          Operon or gene-cluster name encoding this protein or protein-complex
          module. Operons are metadata and do not denote primary causal nodes.
        range: string
      protein_examples:
        description: >-
          Organism-specific UniProt protein instances illustrating this
          taxon-agnostic GENE_OR_PROTEIN node. Each example names the source
          taxon in which its mechanistic role was established and carries
          mechanistic evidence. That source need not be a canonical example of
          the trait; the UniProt record verifies identity and taxonomy but does
          not by itself prove the causal role.
        multivalued: true
        inlined_as_list: true
        range: ProteinExample

  ProteinExample:
    description: >-
      A source-backed UniProt protein example paired with the organism in which
      its mechanistic role was established. Reviewed Swiss-Prot entries are
      preferred. One component accession must not be presented as an entire
      multisubunit complex.
    attributes:
      uniprot_id:
        description: Current UniProtKB primary accession.
        required: true
        range: string
        pattern: "^UniProtKB:(?:[OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9](?:[A-Z][A-Z0-9]{2}[0-9]){1,2})$"
      protein_label:
        description: Current UniProt protein name or concise source-backed name.
        required: true
        range: string
      gene_symbol:
        description: Gene symbol used by UniProt or the mechanistic source.
        range: string
      taxon_id:
        description: >-
          UniProt organism taxon for this protein instance. This source taxon
          need not also be a canonical example of the owning trait.
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        description: Scientific name corresponding to taxon_id.
        required: true
        range: string
      entry_status:
        description: UniProtKB reviewed or unreviewed entry status.
        required: true
        range: UniProtEntryStatusEnum
      proteome_id:
        description: >-
          UniProt proteome accession. Required by policy when an unreviewed
          reference-proteome entry is used as the only available exact example.
        range: string
        pattern: "^UP[0-9]{9}$"
      retrieved_on:
        description: Date on which the UniProt metadata was verified.
        required: true
        range: date
      entry_version:
        description: UniProt entry version at retrieval time.
        range: integer
      sequence_version:
        description: UniProt sequence version at retrieval time.
        range: integer
      role:
        description: >-
          Source-backed role in this mechanism, including an explicit
          component role when the causal node denotes a multisubunit complex.
        required: true
        range: string
      evidence:
        description: >-
          Primary-source evidence for this protein's mechanistic role in this
          taxon. Every item must include reference, snippet, and notes.
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  CausalEdge:
    description: An evidence-backed directed relationship in a trait causal graph.
    attributes:
      subject:
        description: Local node_id of the upstream/source node.
        required: true
        range: string
      predicate:
        description: Human-readable predicate label or relation CURIE.
        required: true
        range: string
      predicate_id:
        description: Optional ontology CURIE grounding the predicate.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      object:
        description: Local node_id of the downstream/target node.
        required: true
        range: string
      description:
        description: Short explanation of the causal claim.
        range: string
      evidence:
        description: >-
          Edge-level literature, database, or curated source support.
          `required: true` (in contrast to TraitRecord.evidence, which is
          optional): every causal claim must carry at least one citation
          because, unlike trait classification, mechanism assertions are
          not backed by METPO's own provenance.
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  CurationEvent:
    description: A timestamped curator action on a TraitRecord.
    attributes:
      timestamp:
        range: datetime
        required: true
        pattern: "^20[0-9]{2}-"
      curator:
        range: string
      action:
        range: string
      changes:
        range: string
      llm_assisted:
        range: boolean

# ================================================================
# ENUMS
# ================================================================

enums:

  TraitCategoryEnum:
    description: Coarse-grained trait bucket — used for filesystem layout.
    permissible_values:
      MORPHOLOGY:
        description: Cell shape, motility apparatus, Gram type, etc.
      PHYSIOLOGY:
        description: Metabolic mode, oxygen tolerance, fermentation capability.
      ENVIRONMENT:
        description: pH / temperature / salinity / pressure tolerances and optima.
      METABOLISM:
        description: Substrate utilisation, electron donor/acceptor, fermentation.
      GENOMICS:
        description: GC content, genome size, ploidy.
      ECOLOGY:
        description: Habitat, host association, symbiosis class.
      DETECTION:
        description: Differential / selective media growth, biochemical assays.
      QUANTITATIVE_PROPERTY:
        description: Datatype property carrying a numeric value (e.g. has_pH_optimum).
      OBSERVATION:
        description: >-
          Observation-class entries (METPO:1001000 subtree) — not traits per se,
          but data-collection units (e.g. "growth pH observation", "NaCl range
          observation") that link a trait to a measurement event.
      UPPER:
        description: Upper-level classifier (e.g. "quality", "biological process").
      OTHER:

  TermKindEnum:
    permissible_values:
      CLASS:
      DATATYPE_PROPERTY:
      OBJECT_PROPERTY:
      ANNOTATION_PROPERTY:

  SynonymTypeEnum:
    permissible_values:
      EXACT_SYNONYM:
      NARROW_SYNONYM:
      BROAD_SYNONYM:
      RELATED_SYNONYM:

  PriorityEnum:
    permissible_values:
      CRITICAL:
      HIGH:
      MEDIUM:
      LOW:

  MappingStatusEnum:
    permissible_values:
      SEEDED:
        description: Imported verbatim from metpo.owl; not yet curator-reviewed.
      PROPOSED:
        description: >-
          Candidate trait proposed from literature research to fill a coverage
          gap; not yet curator-reviewed. Must carry at least two distinct
          literature citations (across definition_source and evidence) — this
          is enforced by scripts/audit_proposals.py in the `qc` target.
      REVIEWED:
        description: Curator has signed off on label / definition / parents.
      DEPRECATED:
        description: Superseded by another TraitRecord.

  CausalGraphScopeEnum:
    description: Curator disposition for a graph's mechanistic scope.
    permissible_values:
      MECHANISTIC:
        description: The graph represents a source-backed biological mechanism.
      NONMECHANISTIC:
        description: >-
          The record is a measurement, classification, hazard, or upper-level
          context for which a protein-mediated causal mechanism is inapplicable.
      REVIEW_NEEDED:
        description: The graph still requires an explicit scope decision.

  ProteinGroundingStatusEnum:
    description: Review disposition for a protein node without an exact CURIE.
    permissible_values:
      REVIEWED_LABEL_ONLY:
        description: >-
          The graph evidence supports the protein label, but no exact family,
          function, or complex term can be asserted without overclaiming.

  UniProtEntryStatusEnum:
    description: Curation status of a UniProtKB protein entry.
    permissible_values:
      REVIEWED:
        description: Manually reviewed UniProtKB/Swiss-Prot entry.
      UNREVIEWED:
        description: Automatically annotated UniProtKB/TrEMBL entry.

  CausalNodeTypeEnum:
    description: Broad categories for nodes in trait causal graphs.
    permissible_values:
      TRAIT:
        description: A TraitMech or METPO trait.
      PATHWAY:
        description: A pathway or pathway-like mechanism.
      ENVIRONMENTAL_FACTOR:
        description: An environmental exposure or condition.
      EXPERIMENTAL_FACTOR:
        description: An assay, perturbation, or experimental condition.
      GENE_OR_PROTEIN:
        description: >-
          Legacy enum name restricted in TraitMech to a protein, protein family,
          or protein complex. Genes and operons belong in node metadata.
      RNA:
        description: A functional RNA molecule or RNA-containing causal entity.
      GENETIC_ELEMENT:
        description: A non-protein mobile or chromosomal genetic element such as a plasmid or prophage.
      CHEMICAL:
        description: A chemical entity.
      ORGANELLE:
        description: A cellular organelle or microbial subcellular structure.
      CELLULAR_LOCALIZATION:
        description: A cellular component or localization.
      MOLECULAR_FUNCTION:
        description: A molecular activity or function.
      BIOLOGICAL_PROCESS:
        description: A biological process.
      STATE:
        description: >-
          A bioenergetic or molecular state of the cell (e.g. proton
          motive force, redox state of the quinone pool) that
          mediates a trait mechanism. Distinct from a process: the
          state is the gradient / steady-value, not its establishment.
      QUALITY:
        description: >-
          A quality or measurable attribute of a cellular component
          (e.g. membrane fluidity, GC content, motility speed) —
          a PATO-style axis attached to a microbial entity that
          modulates the trait mechanism.
      CAPACITY:
        description: >-
          A metabolic or functional capacity — an electron-donating
          pool, ATP charge, or other reservoir-of-X notion that is
          neither a single chemical species nor a process. Examples
          include reducing power (NADH/NADPH pool) and energy charge.
